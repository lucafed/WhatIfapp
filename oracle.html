<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Oracolo</title>
  <meta name="theme-color" content="#0A0F14"/>

  <style>
    :root{
      --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0F1820; --line:#1B2A34; --shadow:rgba(0,0,0,.35);
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --card:#111713;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A; --shadow:rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px}
    .wrap{width:min(100%,900px)}

    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;justify-content:space-between;align-items:center;
      padding:8px 10px;
      background:rgba(10,15,20,.95);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(6px);
    }
    .row{display:flex;gap:8px;align-items:center}
    .btn{
      background:var(--chip);
      border:1px solid var(--line);
      color:var(--fg);
      border-radius:12px;
      padding:8px 12px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);
      border:none;
    }
    .badge{
      background:var(--chip);
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
    }

    h1{margin:12px 0 6px;color:var(--accent)}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 10px 26px var(--shadow);
    }
    .label{font-weight:900;color:var(--accent2);margin-bottom:6px}
    .small{font-size:13px;color:var(--muted)}

    textarea{
      width:100%;
      min-height:90px;
      resize:vertical;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--chip);
      color:var(--fg);
      padding:12px;
      font-size:15px;
    }

    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .chip{
      background:var(--chip);
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      font-weight:800;
      cursor:pointer;
      font-size:13px;
    }
    .chip.sel{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);
    }

    .resultTitle{font-size:18px;font-weight:900;margin-bottom:6px}
    ul{padding-left:18px}
    li{margin:6px 0}

  </style>
</head>

<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="row">
      <button class="btn" onclick="history.back()">←</button>
      <button class="btn" onclick="location.href='index.html'">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭</span>
      <span class="badge" id="creditBadge">Crediti: —</span>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1>🔮 Oracolo</h1>

      <!-- INPUT -->
      <div class="card">
        <div class="label">Cosa vuoi ottenere?</div>
        <div class="small">
          Non chiedere “che succede”.  
          Dimmi **cosa vuoi ottenere** e l’Oracolo ti dice **come iniziare**.
        </div>

        <textarea id="goalInput" placeholder="Es: voglio cambiare lavoro / voglio più soldi / voglio uscire da una relazione tossica"></textarea>

        <div class="chips" id="suggestions"></div>
      </div>

      <!-- CTA -->
      <div class="card">
        <button class="btn primary" id="revealBtn">🔮 Rivela l’Oracolo (1 credito)</button>
      </div>

      <!-- RESULT -->
      <div class="card" id="resultCard" style="display:none">
        <div class="label">Risposta dell’Oracolo</div>

        <div class="resultTitle" id="rTitle"></div>
        <p id="rDo"></p>

        <div class="label">Primo passo (15 minuti)</div>
        <p id="rFirst"></p>

        <div class="label">Regole</div>
        <ul id="rRules"></ul>

        <p class="small" id="rSafety"></p>
      </div>
    </div>
  </main>

<script type="module">
import { auth } from "./firebase.init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { bootCredits, getBalance, consumeCredit } from "./store/credits.js";

const goalInput = document.getElementById("goalInput");
const suggestionsWrap = document.getElementById("suggestions");
const revealBtn = document.getElementById("revealBtn");
const resultCard = document.getElementById("resultCard");

let selected = [];

const baseSuggestions = [
  "💰 Fare soldi",
  "🏗 Costruire qualcosa",
  "🧠 Cambiare mentalità",
  "🔥 Scelta radicale",
  "🕊 Vita più semplice",
  "⚔️ Conflitto",
];

baseSuggestions.forEach(s=>{
  const b=document.createElement("button");
  b.className="chip";
  b.textContent=s;
  b.onclick=()=>{
    b.classList.toggle("sel");
    selected = [...document.querySelectorAll(".chip.sel")].map(x=>x.textContent);
  };
  suggestionsWrap.appendChild(b);
});

async function syncCredits(){
  if(!auth.currentUser)return;
  await bootCredits();
  const b=await getBalance();
  document.getElementById("creditBadge").textContent="Crediti: "+b;
}

onAuthStateChanged(auth,syncCredits);

revealBtn.onclick = async ()=>{
  if(!auth.currentUser){
    alert("Devi essere loggato");
    return;
  }
  const ok = await consumeCredit();
  if(!ok){
    alert("Crediti finiti");
    return;
  }
  await syncCredits();

  revealBtn.textContent="⏳";

  const res = await fetch("/api/suggest",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      mode:"oracle_answer",
      lang:"it",
      voice:"whatif",
      goal:goalInput.value,
      hints:selected
    })
  });

  const data = await res.json();

  document.getElementById("rTitle").textContent = data.title;
  document.getElementById("rDo").textContent = data.do;
  document.getElementById("rFirst").textContent = data.first_step;
  document.getElementById("rSafety").textContent = data.safety;

  const ul=document.getElementById("rRules");
  ul.innerHTML="";
  (data.rules||[]).forEach(r=>{
    const li=document.createElement("li");
    li.textContent=r;
    ul.appendChild(li);
  });

  resultCard.style.display="block";
  revealBtn.textContent="🔮 Rivela l’Oracolo";
};
</script>
</body>
</html>
