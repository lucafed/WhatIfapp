<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>What?f — Oracolo</title>
    <meta name="theme-color" content="#0A0F14"/>

    <style>
      :root{
        --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
        --fg:#F4F7FB; --muted:#A7B3C2;
        --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
        --chip:#0F1820; --line:#1B2A34; --shadow:rgba(0,0,0,.35);
      }
      html[data-theme="wtf"]{
        --bg:#0B0B0C; --bg2:#101414; --card:#111713;
        --fg:#EEF5F0; --muted:#A6B6AD;
        --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
        --chip:#0F1714; --line:#21322A; --shadow:rgba(0,0,0,.45);
      }
      *{box-sizing:border-box}
      html,body{
        height:100%;margin:0;
        background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
        color:var(--fg);
        font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 14px 30px}
      .wrap{width:min(100%,980px)}
      .topbar{
        position:sticky;top:0;z-index:10;
        display:flex;align-items:center;justify-content:space-between;gap:10px;
        padding:8px 10px;
        background:rgba(10,15,20,.96);
        backdrop-filter:blur(6px);
        border-bottom:1px solid var(--line);
      }
      .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
      .btn{
        appearance:none;border:1px solid var(--line);
        background:var(--chip);color:var(--fg);
        border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;
      }
      .btn.primary{
        background:linear-gradient(180deg,var(--accent),var(--accent2));
        color:var(--ink);border:none;box-shadow:0 10px 26px var(--shadow);
      }
      .btn[disabled]{opacity:.4;cursor:not-allowed}
      .badge{
        background:var(--chip);border:1px solid var(--line);
        border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap;
      }
      select{
        appearance:none;background:var(--chip);border:1px solid var(--line);
        color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:800;cursor:pointer;
      }
      h1{margin:8px 0 6px;font-size:clamp(24px,5vw,34px);color:var(--accent)}
      .card{
        background:var(--card);
        border:1px solid var(--line);
        border-radius:16px;
        padding:16px;
        margin:10px 0;
        backdrop-filter:blur(12px);
        box-shadow:0 10px 26px var(--shadow);
      }
      .center{max-width:760px;margin:0 auto}
      .label{color:var(--accent2);font-weight:900;margin:0 0 8px}
      .small{font-size:12px;color:var(--muted)}
      .chips{display:flex;flex-wrap:wrap;gap:8px}
      .chip{
        background:var(--chip);border:1px solid var(--line);
        color:#eaf3ee;border-radius:999px;padding:10px 12px;
        font-size:13px;font-weight:800;cursor:pointer;
        max-width:100%;
        white-space:normal;
        word-break:break-word;
        line-height:1.2;
        display:inline-flex;align-items:center;gap:8px;
      }
      .chip.sel{
        background:linear-gradient(180deg,var(--accent),var(--accent2));
        color:var(--ink);
      }

      .stepHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
      .stepTitle{font-weight:900;font-size:18px;margin:0}
      .stepSub{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.4}

      .progress{height:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;overflow:hidden}
      .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%}

      .resultTitle{font-weight:950;font-size:18px;margin:0 0 8px}
      .resultDo{font-size:15px;line-height:1.55;margin:0 0 10px}
      .resultBlock{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px}
      ul{margin:8px 0 0;padding-left:18px}
      li{margin:6px 0;color:var(--fg)}
      .hr{height:1px;background:var(--line);margin:12px 0}

      /* piccolo feedback non invasivo */
      .pulse{
        animation:pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse{
        0%{opacity:.65}
        50%{opacity:1}
        100%{opacity:.65}
      }
    </style>
  </head>

  <body>
    <div class="topbar">
      <div class="row">
        <button class="btn" id="backBtn" type="button">←</button>
        <button class="btn" id="homeBtn" type="button">🏠</button>
      </div>
      <div class="row">
        <span class="badge" id="styleBadge">🎭 —</span>
        <span class="badge" id="freeBadge">Crediti: —</span>
        <select id="langSelect" aria-label="Language">
          <option value="it">IT</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="de">DE</option>
        </select>
      </div>
    </div>

    <main>
      <div class="wrap">
        <h1>🔮 Oracolo</h1>

        <!-- STATUS -->
        <div class="card center">
          <div class="label" id="subLabel">Scegli con click. L'Oracolo risponde sul serio.</div>

          <div class="small" id="hintText">
            Zero scrittura. 4 scelte → 1 direzione chiara.
          </div>

          <div style="margin-top:12px">
            <div class="progress"><div class="bar" id="bar"></div></div>
            <div class="small" id="progressText" style="margin-top:8px">0/4</div>
          </div>
        </div>

        <!-- STEPS (dinamici) -->
        <div id="stepsWrap" class="center"></div>

        <!-- CTA -->
        <div class="card center">
          <div class="row" style="justify-content:space-between;align-items:center">
            <div class="small" id="ctaHelp">Completa le 4 scelte per sbloccare il responso.</div>
            <button class="btn primary" id="revealBtn" type="button" disabled>🔮 Rivela l’Oracolo</button>
          </div>
        </div>

        <!-- RESULT -->
        <div class="card center" id="resultCard" style="display:none">
          <div class="label" id="resultLabel">Risposta</div>

          <div class="resultTitle" id="rTitle">—</div>
          <p class="resultDo" id="rDo">—</p>

          <div class="resultBlock">
            <div class="small" style="font-weight:900;margin-bottom:6px" id="firstStepLabel">Primo passo (15 minuti)</div>
            <div id="rFirst">—</div>

            <div class="hr"></div>

            <div class="small" style="font-weight:900;margin-bottom:6px" id="rulesLabel">Regole</div>
            <ul id="rRules"></ul>

            <div class="hr"></div>

            <div class="small" id="rSafety">—</div>
          </div>

          <div class="row" style="justify-content:flex-end;margin-top:12px">
            <button class="btn" id="playAgainBtn" type="button">🔁 Rifai</button>
          </div>
        </div>

      </div>
    </main>

    <script type="module">
      // ===== Firebase base =====
      import { auth } from "./firebase.init.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

      // ===== Credits Firestore =====
      import { bootCredits, getBalance, consumeCredit } from "./store/credits.js";

      const LS = localStorage;
      const $ = id => document.getElementById(id);

      const SUP_LANG = ["it","en","es","fr","de"];
      const normLang = (l) => {
        const s = String(l||"it").toLowerCase().slice(0,2);
        return SUP_LANG.includes(s) ? s : "it";
      };

      const isAdmin = (() => { try{ return !!LS.getItem("admin_token"); }catch{ return false; } })();

      // prefs stile
      let prefs = {};
      try{ prefs = JSON.parse(LS.getItem("whatif_prefs")||"{}")||{}; }catch{ prefs = {}; }
      const voice = (prefs.stile === "wtf") ? "wtf" : "whatif";
      document.documentElement.setAttribute("data-theme", voice === "wtf" ? "wtf" : "whatif");

      // lang
      let lang = normLang(LS.getItem("lang") || "it");
      $("langSelect").value = lang;
      document.documentElement.lang = lang;

      // UI badges
      function renderBadges(){
        $("styleBadge").textContent = "🎭 " + (voice === "wtf" ? "What the F" : "What if");
      }
      renderBadges();

      // nav
      $("homeBtn").onclick = () => location.href = "index.html";
      $("backBtn").onclick = () => {
        if (history.length > 1) history.back();
        else location.href = "index.html";
      };

      // language change
      $("langSelect").onchange = async () => {
        lang = normLang($("langSelect").value);
        LS.setItem("lang", lang);
        document.documentElement.lang = lang;
        await loadOracleMeta(true); // rigenera cards in base alla lingua
      };

      // credits
      let currentBalance = 0;

      function renderCredits(){
        if (isAdmin){
          $("freeBadge").textContent = "Crediti: ∞ (admin)";
          return;
        }
        $("freeBadge").textContent = "Crediti: " + currentBalance;
      }

      async function syncCredits(){
        if (isAdmin){
          renderCredits(); return;
        }
        if (!auth.currentUser){
          currentBalance = 0;
          renderCredits();
          return;
        }
        try{
          await bootCredits();
          currentBalance = await getBalance();
        }catch{
          currentBalance = 0;
        }
        renderCredits();
      }

      async function guardCredits(){
        if (isAdmin) return true;
        if (!auth.currentUser){
          alert("Per usare l’Oracolo devi essere loggato.");
          location.href = "index.html";
          return false;
        }
        if (currentBalance <= 0){
          alert("Hai finito i crediti. Vai allo store per ricaricare.");
          location.href = "store/credit-store.html?lang=" + encodeURIComponent(lang);
          return false;
        }
        return true;
      }

      onAuthStateChanged(auth, async () => {
        await syncCredits();
      });

      window.addEventListener("focus", syncCredits);

      // oracle state
      let meta = null;
      let picks = {}; // { key: {id,label,emoji} }
      let steps = [];

      function progress(){
        const total = steps.length || 4;
        const done = Object.keys(picks).length;
        const pct = total ? Math.round((done/total)*100) : 0;
        $("bar").style.width = pct + "%";
        $("progressText").textContent = `${done}/${total}`;
        $("revealBtn").disabled = !(done === total);
      }

      function clearUI(){
        $("stepsWrap").innerHTML = "";
        $("resultCard").style.display = "none";
        picks = {};
        progress();
      }

      function escapeHtml(s){
        return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      // ===== ADATTIVO: rigenera step successivi =====
      let adaptReqId = 0;
      async function adaptNextSteps(startIndex){
        if (startIndex >= 4) return;

        const myId = ++adaptReqId;

        // UX: feedback
        const cta = $("ctaHelp");
        cta.classList.add("pulse");
        cta.textContent = (lang === "en") ? "Adapting next steps…" : "Sto adattando i prossimi step…";

        try{
          const res = await fetch("/api/suggest", {
            method: "POST",
            headers: { "Content-Type":"application/json" },
            body: JSON.stringify({
              mode: "oracle_next",
              lang,
              voice,
              picks,
              startIndex
            })
          });

          const data = await res.json().catch(() => null);
          if (!res.ok || !data || !Array.isArray(data.steps) || !data.steps.length) return;

          // se nel frattempo è partita un'altra richiesta, ignoro questa
          if (myId !== adaptReqId) return;

          // sostituisco SOLO gli step successivi (startIndex..3)
          for (let i = 0; i < data.steps.length; i++){
            const target = startIndex + i;
            if (target <= 3) steps[target] = data.steps[i];
          }

          // drop pick degli step rigenerati (per evitare incoerenze)
          for (let i = startIndex; i <= 3; i++){
            const k = steps[i]?.key;
            if (k && picks[k]) delete picks[k];
          }

          renderSteps();
          progress();
        }catch(e){
          console.warn("oracle_next error:", e);
        }finally{
          const cta2 = $("ctaHelp");
          cta2.classList.remove("pulse");
          cta2.textContent = (lang === "en")
            ? "Complete the 4 picks to unlock the answer."
            : "Completa le 4 scelte per sbloccare il responso.";
        }
      }

      function renderSteps(){
        const wrap = $("stepsWrap");
        wrap.innerHTML = "";

        steps.forEach((st, idx) => {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.key = st.key;

          const head = document.createElement("div");
          head.className = "stepHead";

          const left = document.createElement("div");
          left.innerHTML = `
            <div class="label">Step ${idx+1}</div>
            <div class="stepTitle">${escapeHtml(st.title || "—")}</div>
            <div class="stepSub">${escapeHtml(st.subtitle || "")}</div>
          `;

          head.appendChild(left);
          card.appendChild(head);

          const chips = document.createElement("div");
          chips.className = "chips";

          (st.options || []).forEach(opt => {
            const b = document.createElement("button");
            b.className = "chip";

            const chosen = picks[st.key] && picks[st.key].id === opt.id;
            if (chosen) b.classList.add("sel");

            b.innerHTML = `<span>${escapeHtml(opt.emoji || "•")}</span><span>${escapeHtml(opt.label || opt.id || "—")}</span>`;

            // ✅ CLICK ADATTIVO: rigenera step successivi con AI
            b.onclick = async () => {
              picks[st.key] = { id: opt.id, label: opt.label, emoji: opt.emoji };

              // rerender + progress
              renderSteps();
              progress();

              // rigenera step da quello successivo
              const startIndex = idx + 1;
              await adaptNextSteps(startIndex);
            };

            chips.appendChild(b);
          });

          card.appendChild(chips);
          wrap.appendChild(card);
        });

        progress();
      }

      async function loadOracleMeta(force=false){
        clearUI();

        const res = await fetch("/api/suggest", {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({
            mode: "oracle_meta",
            lang,
            voice
          })
        });

        const data = await res.json().catch(() => null);
        if (!res.ok || !data || !Array.isArray(data.steps)){
          alert("Errore nel caricare l’Oracolo. Riprova.");
          console.error("oracle_meta failed:", res.status, data);
          return;
        }

        meta = data;
        steps = data.steps.slice(0, 4); // sicurezza
        picks = {}; // reset picks
        renderSteps();

        // CTA label dinamica se arriva
        const cta = data?.ui?.cta;
        if (cta && typeof cta === "string"){
          $("revealBtn").textContent = cta.includes("🔮") ? cta : ("🔮 " + cta);
        } else {
          $("revealBtn").textContent = "🔮 Rivela l’Oracolo";
        }
      }

      async function revealOracle(){
        const ok = await guardCredits();
        if (!ok) return;

        // consuma 1 credito SOLO ORA
        if (!isAdmin){
          const ok2 = await consumeCredit();
          if (!ok2){
            await syncCredits();
            alert("Hai finito i crediti.");
            return;
          }
          await syncCredits();
        }

        $("revealBtn").disabled = true;
        const originalBtn = $("revealBtn").textContent;
        $("revealBtn").textContent = "⏳...";

        try{
          const picksPayload = {};
          for (const k of Object.keys(picks)){
            picksPayload[k] = picks[k]; // id+label+emoji
          }

          const res = await fetch("/api/suggest", {
            method: "POST",
            headers: { "Content-Type":"application/json" },
            body: JSON.stringify({
              mode: "oracle_answer",
              lang,
              voice,
              picks: picksPayload
            })
          });

          const data = await res.json().catch(() => null);
          if (!res.ok || !data || !data.do){
            alert("Errore nel generare la risposta. Riprova.");
            console.error("oracle_answer failed:", res.status, data);
            return;
          }

          // render result
          $("rTitle").textContent = data.title || "🔮";
          $("rDo").textContent = data.do || "";
          $("rFirst").textContent = data.first_step || "";
          $("rSafety").textContent = data.safety || "";

          const rules = Array.isArray(data.rules) ? data.rules : [];
          const ul = $("rRules");
          ul.innerHTML = "";
          rules.slice(0, 6).forEach(r => {
            const li = document.createElement("li");
            li.textContent = String(r||"").trim();
            ul.appendChild(li);
          });

          $("resultCard").style.display = "block";
          window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

        } finally {
          $("revealBtn").disabled = false;
          $("revealBtn").textContent = originalBtn || (meta?.ui?.cta ? meta.ui.cta : "🔮 Rivela l’Oracolo");
          progress(); // riabilita/disabilita in base a scelte
        }
      }

      $("revealBtn").onclick = revealOracle;

      $("playAgainBtn").onclick = async () => {
        await loadOracleMeta(true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      // load initial
      await loadOracleMeta(false);
      await syncCredits();
    </script>
  </body>
</html>
