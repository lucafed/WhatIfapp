<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Oracolo</title>
  <meta name="theme-color" content="#0A0F14"/>

  <style>
    :root{
      --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0F1820; --line:#1B2A34;
      --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --card:#111713;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 14px 26px}
    .wrap{width:min(100%,980px)}
    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 10px;
      background:rgba(10,15,20,.96);
      backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{
      appearance:none;border:1px solid var(--line);
      background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35);
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .badge{
      background:var(--chip);border:1px solid var(--line);
      border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:10px 0;
      box-shadow:0 12px 28px var(--shadow);
    }
    h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .label{color:var(--accent2);font-weight:900;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .pick{
      border:1px solid var(--line);
      background:var(--chip);
      border-radius:14px;
      padding:14px;
      font-weight:900;
      cursor:pointer;
      text-align:left;
    }
    .pick:active{ transform:translateY(1px) }
    .small{font-size:12px;color:var(--muted)}
    .out{white-space:pre-line;line-height:1.45}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="creditsBadge">Crediti: —</span>
      <button class="btn" id="toggleStyleBtn" type="button">Cambia voce</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1>🔮 Oracolo</h1>
      <div class="small">4 click. Zero scrittura. <strong>Costo: 1 credito</strong> per consulto.</div>

      <div class="card" id="stepCard">
        <div class="label" id="stepTitle">1) Cosa vuoi cambiare?</div>
        <div class="grid" id="optionsGrid"></div>
        <div class="small" id="hintLine" style="margin-top:10px">Consiglio: clicca a istinto.</div>
      </div>

      <div class="card" id="resultCard" style="display:none">
        <div class="label" id="resultTitle">Risultato</div>
        <div class="out" id="resultText"></div>
        <div class="row" style="margin-top:12px;justify-content:flex-end">
          <button class="btn" id="copyBtn" type="button">Copia</button>
          <button class="btn" id="replayBtn" type="button">🔁 Rigira</button>
          <button class="btn primary" id="goWhatIfBtn" type="button">✨ Vai a What?f</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    // ===== Firebase base =====
    import { auth } from "./firebase.init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    // ===== Credits Firestore =====
    import { bootCredits, getBalance, consumeCredit } from "./store/credits.js";

    const LS = localStorage;
    const $ = id => document.getElementById(id);
    const IS_ADMIN = !!LS.getItem("admin_token");

    // ---- Theme/voice (riuso stile whatif/wtf)
    let voice = "whatif";
    try {
      const prefs = JSON.parse(LS.getItem("whatif_prefs") || "{}") || {};
      voice = (prefs.stile === "wtf") ? "wtf" : "whatif";
    } catch {}
    document.documentElement.setAttribute("data-theme", voice);
    $("styleBadge").textContent = "🎭 " + (voice === "wtf" ? "What the F" : "What if");

    $("toggleStyleBtn").onclick = () => {
      voice = (voice === "wtf") ? "whatif" : "wtf";
      document.documentElement.setAttribute("data-theme", voice);
      $("styleBadge").textContent = "🎭 " + (voice === "wtf" ? "What the F" : "What if");
      try{
        const prefs = JSON.parse(LS.getItem("whatif_prefs") || "{}") || {};
        prefs.stile = voice;
        LS.setItem("whatif_prefs", JSON.stringify(prefs));
      }catch{}
    };

    // ---- NAV
    $("homeBtn").onclick = () => location.href = "index.html";
    $("backBtn").onclick = () => (history.length > 1 ? history.back() : location.href = "index.html");

    // ---- Credits (1 consulto = 1 credito)
    let currentBalance = 0;

    function renderCredits(){
      const badge = $("creditsBadge");
      if (!badge) return;
      if (IS_ADMIN){
        badge.textContent = "Crediti: ∞ (admin)";
        return;
      }
      badge.textContent = `Crediti: ${currentBalance}`;
    }

    async function syncCredits(){
      if (IS_ADMIN){
        renderCredits();
        return;
      }
      if (!auth.currentUser){
        currentBalance = 0;
        renderCredits();
        return;
      }
      try{
        await bootCredits();
        currentBalance = await getBalance();
      }catch(e){
        console.error("syncCredits error:", e);
        currentBalance = 0;
      }
      renderCredits();
    }

    async function guardCredits(){
      if (IS_ADMIN) return true;

      if (!auth.currentUser){
        alert("Per usare l’Oracolo devi essere loggato.");
        location.href = "index.html";
        return false;
      }
      if (currentBalance <= 0){
        alert("Hai finito i crediti. Ricarica per continuare.");
        const lang = (LS.getItem("lang") || "it");
        location.href = `store/credit-store.html?lang=${encodeURIComponent(lang)}`;
        return false;
      }
      return true;
    }

    onAuthStateChanged(auth, async () => {
      await syncCredits();
    });
    window.addEventListener("focus", syncCredits);
    window.addEventListener("pageshow", syncCredits);

    // ---- Oracle steps
    const STEPS = [
      { key:"topic",  title:"1) Cosa vuoi cambiare?", options:[
        ["money","💰 Soldi"],["work","💼 Lavoro"],["life","🏠 Vita"],
        ["relationships","❤️ Relazioni"],["mind","🧠 Testa"],["world","🌍 Mondo"]
      ]},
      { key:"effect", title:"2) Che tipo di svolta?", options:[
        ["fast","⚡ Rapida"],["solid","🧱 Solida"],["risky","🎲 Rischiosa"],["radical","🔥 Radicale"]
      ]},
      { key:"channel", title:"3) Attraverso cosa?", options:[
        ["app","📱 App/tech"],["online","🌐 Online"],["people","👥 Persone"],
        ["environment","🏗️ Ambiente"],["cut","✂️ Taglio"],["conflict","⚔️ Conflitto"]
      ]},
      { key:"tone", title:"4) Tono", options:[
        ["prudent","😐 Prudente"],["direct","😏 Diretto"],
        ["no_mercy","😈 Senza scrupoli (legale)"],["f_you","🔥 Fanculo tutto (non violento)"]
      ]}
    ];

    let idx = 0;
    const state = { topic:null, effect:null, channel:null, tone:null };

    function renderStep(){
      const step = STEPS[idx];
      $("stepTitle").textContent = step.title;
      const grid = $("optionsGrid");
      grid.innerHTML = "";
      step.options.forEach(([v,label]) => {
        const b = document.createElement("button");
        b.className = "pick";
        b.textContent = label;
        b.onclick = async () => {
          state[step.key] = v;
          idx++;
          if (idx < STEPS.length) renderStep();
          else await finish();
        };
        grid.appendChild(b);
      });
    }

    async function finish(){
      // UI loading
      $("optionsGrid").innerHTML = `<div class="small">Sto consultando…</div>`;

      // 1) guard
      const ok = await guardCredits();
      if (!ok) {
        // ripristina ultimo step per non lasciare “loading”
        idx = STEPS.length - 1;
        renderStep();
        return;
      }

      // 2) consume 1 credit
      if (!IS_ADMIN){
        try{
          const ok2 = await consumeCredit();
          if (!ok2){
            await syncCredits();
            alert("Crediti insufficienti.");
            idx = STEPS.length - 1;
            renderStep();
            return;
          }
          currentBalance = await getBalance().catch(() => currentBalance);
          renderCredits();
        }catch(err){
          console.error("consumeCredit error:", err);
          alert("Errore nell'utilizzo dei crediti. Riprova.");
          idx = STEPS.length - 1;
          renderStep();
          return;
        }
      }

      // 3) call API
      try{
        const lang = (LS.getItem("lang") || "it");
        const res = await fetch("/api/oracle", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ ...state, voice, lang })
        });
        if(!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const out = data.styled || data.base;

        $("stepCard").style.display = "none";
        $("resultCard").style.display = "";
        $("resultTitle").textContent = out.title || "🔮 Oracolo";

        const text = [
          `Cosa fare: ${out.do || ""}`,
          `Primo passo: ${out.first_step || ""}`,
          ...(Array.isArray(out.rules) && out.rules.length ? ["", "Regole:", ...out.rules.map(r=>`- ${r}`)] : []),
          ...(out.safety ? ["", out.safety] : [])
        ].join("\n");

        $("resultText").textContent = text;

        $("copyBtn").onclick = async () => {
          await navigator.clipboard.writeText(`${$("resultTitle").textContent}\n\n${text}`);
          $("copyBtn").textContent = "Copiato ✅";
          setTimeout(()=> $("copyBtn").textContent="Copia", 1200);
        };

      }catch(e){
        console.error("oracle api error:", e);
        alert("Errore nel consultare l'Oracolo. Riprova.");
        // Nota: in MVP il credito è già consumato (come da regola 1 consulto = 1 credito).
        idx = 0;
        Object.keys(state).forEach(k => state[k] = null);
        $("resultCard").style.display = "none";
        $("stepCard").style.display = "";
        renderStep();
      }
    }

    $("replayBtn").onclick = () => {
      idx = 0;
      Object.keys(state).forEach(k => state[k] = null);
      $("resultCard").style.display = "none";
      $("stepCard").style.display = "";
      renderStep();
    };

    $("goWhatIfBtn").onclick = () => location.href = "fourth.html";

    // init
    renderCredits();
    renderStep();
  </script>
</body>
</html>
