<!doctype html>
<meta charset="utf-8">
<title>Login Google — What?f</title>
<button id="login" style="padding:10px 14px">Entra con Google</button>
<pre id="out" style="margin-top:12px;padding:8px;border:1px solid #333;min-height:24px"></pre>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  const cfg = {
    apiKey: "AIzaSyASrGnHOnf_O-N0NuZDvqOGGfG8IoSWblc",
    authDomain: "whatif-oracolo.firebaseapp.com",
    projectId: "whatif-oracolo",
    storageBucket: "whatif-oracolo.firebasestorage.app",
    messagingSenderId: "602976466053",
    appId: "1:602976466053:web:668d4a462286513d8b25ec"
  };
  const app = initializeApp(cfg);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  const out = document.getElementById('out');
  const show = (m)=>{ out.textContent = String(m||''); };

  // Risultato dopo il redirect
  getRedirectResult(auth)
    .then(res=>{
      if(res?.user){
        show("✅ Login OK: " + (res.user.email || res.user.uid));
      }else{
        show("Pronto. Clicca Entra con Google.");
      }
    })
    .catch(e=> show("❌ Post-redirect: " + (e.code || e.message)));

  document.getElementById('login').onclick = ()=>{
    show("Vado al login…");
    signInWithRedirect(auth, provider).catch(e=>{
      show("❌ Click: " + (e.code || e.message));
    });
  };
</script>
