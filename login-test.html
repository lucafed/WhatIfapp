<!doctype html>
<meta charset="utf-8">
<title>Firebase Google Login — TEST</title>
<button id="btn" style="padding:10px 14px">Entra con Google</button>
<pre id="out" style="margin-top:12px;padding:8px;border:1px solid #333;min-height:24px"></pre>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  const log = (m)=>{ document.getElementById('out').textContent = String(m||''); };

  // 🔧 CONFIG del tuo progetto
  const firebaseConfig = {
    apiKey: "AIzaSyASrGnHOnf_O-N0NuZDvqOGGfG8IoSWblc",
    authDomain: "whatif-oracolo.firebaseapp.com",
    projectId: "whatif-oracolo",
    storageBucket: "whatif-oracolo.firebasestorage.app",
    messagingSenderId: "602976466053",
    appId: "1:602976466053:web:668d4a462286513d8b25ec"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Dopo il redirect, Firebase ritorna qui:
  getRedirectResult(auth)
    .then(res=>{
      if(res?.user){
        log("✅ Login OK: " + (res.user.email || res.user.uid));
      }else{
        log("Pronto. Clicca il bottone.");
      }
    })
    .catch(e=> log("❌ Post-redirect: " + (e.code || e.message)));

  document.getElementById('btn').onclick = async ()=>{
    log("Apro login…");
    try{
      // Desktop spesso preferisce il popup, mobile il redirect:
      const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
      if(isMobile){
        await signInWithRedirect(auth, provider);
      }else{
        // Prova popup; se bloccato, cade su redirect
        try{
          const r = await signInWithPopup(auth, provider);
          log("✅ Login OK: " + (r.user?.email || r.user?.uid));
        }catch(err){
          if(String(err.code).includes("operation-not-supported")){
            await signInWithRedirect(auth, provider);
          }else{
            log("❌ Popup: " + (err.code || err.message));
          }
        }
      }
    }catch(e){
      log("❌ Click: " + (e.code || e.message));
    }
  };
</script>
