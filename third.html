<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What?f – Domande</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="page third">
  <div class="container">
    <h1>Passato o Futuro?<br><span class="highlight">Scopri il tuo What?f</span></h1>

    <!-- Solo dati base + domanda -->
    <form id="questionForm">
      <label for="name">Il tuo nome (facoltativo)</label>
      <input id="name" type="text" placeholder="Scrivi qui..."/>

      <label for="gender">Genere (obbligatorio)</label>
      <select id="gender" required>
        <option value="">Seleziona…</option>
        <option>Donna</option>
        <option>Uomo</option>
        <option>Non specificato</option>
      </select>

      <label for="location">Dove ti trovi? (facoltativo)</label>
      <input id="location" type="text" placeholder="Es. Roma, Milano…"/>

      <label for="time">Vuoi esplorare (facoltativo)</label>
      <select id="time">
        <option value="">—</option>
        <option value="passato">Il passato</option>
        <option value="futuro">Il futuro</option>
      </select>

      <label for="mainQuestion">La tua domanda What?f… (obbligatorio)</label>
      <textarea id="mainQuestion" placeholder="Esempio: e se avessi accettato quel trasferimento?" required></textarea>

      <button type="submit" class="door-btn">Apri la porta</button>
    </form>
  </div>

  <!-- client -->
  <script src="ask.js?v=4"></script>
</body>
</html>
