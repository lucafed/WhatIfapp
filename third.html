<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Micro quiz</title>

<!-- PWA -->
<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
/* ===== THEME SYSTEM (palette ufficiali) ===== */
:root{
  --bg:#0C0F14; --bg2:#0E1724;
  --fg:#F6F7FA; --muted:#AEB8C4;
  --card:rgba(14,19,28,0.55); --card-border:rgba(255,255,255,.08);
  --chip:#121A26;
  --accent:#1C57A0;     /* Blu Verona */
  --accent2:#FFEC01;    /* Giallo Verona */
  --ink:#0A0E12;
}
html[data-theme="whatif"]{
  --bg:#0B1018; --bg2:#0E1724;
  --fg:#F4F7FB; --muted:#A7B3C2;
  --card:rgba(14,20,28,0.55); --card-border:rgba(255,255,255,.10);
  --chip:#121A26;
  --accent:#1C57A0;
  --accent2:#FFEC01;
  --ink:#11110A;
}
html[data-theme="wtf"]{
  --bg:#0B0B0C; --bg2:#101414;
  --fg:#EEF5F0; --muted:#A6B6AD;
  --card:rgba(16,22,20,0.55); --card-border:rgba(255,255,255,.08);
  --chip:#0F1714;
  --accent:#3A6B56;        /* Verde speranza */
  --accent2:#5A8C75;       /* Verde più chiaro per gradient/hover */
  --ink:#06110B;
}

*{box-sizing:border-box}
html,body{
  height:100%;margin:0;
  color:var(--fg);
  background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}

main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:clamp(24px,5vw,34px);margin:0 0 16px;color:var(--accent)}
.card{
  width:min(90vw,700px);
  background:var(--card);border:1px solid var(--card-border);
  backdrop-filter:blur(12px);
  border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(0,0,0,.35);
}
label{display:block;margin:6px 0 4px;font-weight:700}
input,select,textarea{
  width:100%;background:var(--chip);color:var(--fg);
  border:1px solid var(--card-border);border-radius:12px;
  padding:10px;font-size:15px;
}
textarea{min-height:60px;resize:vertical}
.btn{
  appearance:none;border:none;
  background:var(--chip);color:var(--fg);
  border:1px solid var(--card-border);
  border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;
  transition:transform .08s ease,background .16s ease;
}
.btn:active{transform:translateY(1px)}
.btn.primary{
  border:none;
  background:linear-gradient(180deg,var(--accent),var(--accent2));
  color:var(--ink);font-weight:800;
  box-shadow:0 0 18px rgba(0,0,0,.25);
}
.actions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:14px}
.muted{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>

<main>
  <h1 id="title">Rispondi a 3 micro-domande</h1>
  <div class="card">
    <form id="quizForm">
      <div>
        <label id="lab_indicatore">Cosa misura il tuo progresso?</label>
        <input id="indicatore" type="text" placeholder="Esempio: ore di studio, clienti, km corsa..." />
      </div>
      <div>
        <label id="lab_vincolo">Un vincolo o limite realistico (entro 2 settimane)</label>
        <input id="vincolo_2w" type="text" placeholder="Esempio: budget, tempo, energia..." />
      </div>
      <div>
        <label id="lab_punto">Un punto di riferimento fisico</label>
        <input id="punto_riferimento" type="text" placeholder="Esempio: bar, biblioteca, fermata bus..." />
      </div>
      <div class="actions">
        <button type="button" class="btn" id="backBtn">← Indietro</button>
        <button type="submit" class="btn primary" id="nextBtn">Avanti →</button>
      </div>
      <p class="muted" id="hint">Le tue risposte restano solo sul tuo dispositivo.</p>
    </form>
  </div>
</main>

<script>
/* ===== Apply theme from prefs ===== */
(function(){
  try{
    const prefs=JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
    const theme=prefs.stile==='wtf'?'wtf':'whatif';
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){document.documentElement.setAttribute('data-theme','whatif');}
})();
</script>

<script>
/* ===== i18n ===== */
const DICT={
  it:{
    title:"Rispondi a 3 micro-domande",
    indicatore:"Cosa misura il tuo progresso?",
    vincolo:"Un vincolo o limite realistico (entro 2 settimane)",
    punto:"Un punto di riferimento fisico",
    hint:"Le tue risposte restano solo sul tuo dispositivo.",
    back:"Indietro", next:"Avanti →"
  },
  en:{
    title:"Answer 3 micro-questions",
    indicatore:"What measures your progress?",
    vincolo:"A realistic constraint (within 2 weeks)",
    punto:"A physical reference point",
    hint:"Your answers remain only on your device.",
    back:"Back", next:"Next →"
  }
};
const L=(localStorage.getItem('lang')||'it').toLowerCase();
const T=DICT[L]||DICT.it;
document.documentElement.lang=L;
document.getElementById('title').textContent=T.title;
document.getElementById('lab_indicatore').textContent=T.indicatore;
document.getElementById('lab_vincolo').textContent=T.vincolo;
document.getElementById('lab_punto').textContent=T.punto;
document.getElementById('hint').textContent=T.hint;
document.getElementById('backBtn').textContent="← "+T.back;
document.getElementById('nextBtn').textContent=T.next;

/* ===== Logica ===== */
const F=document.getElementById('quizForm');
F.addEventListener('submit',e=>{
  e.preventDefault();
  const micro={
    indicatore:document.getElementById('indicatore').value.trim(),
    vincolo_2w:document.getElementById('vincolo_2w').value.trim(),
    punto_riferimento:document.getElementById('punto_riferimento').value.trim()
  };
  localStorage.setItem('whatif_micro',JSON.stringify(micro));
  // log per knowledge score
  const log=JSON.parse(localStorage.getItem('whatif_micro_log')||'[]');
  const today=new Date().toISOString().split('T')[0];
  if(!log.includes(today)){ log.push(today); localStorage.setItem('whatif_micro_log',JSON.stringify(log)); }
  localStorage.setItem('whatif_last_update',today);
  location.href='fourth.html';
});
document.getElementById('backBtn').addEventListener('click',()=> history.back());

// Prefill se già compilato
(function prefill(){
  const m=JSON.parse(localStorage.getItem('whatif_micro')||'{}');
  if(m.indicatore)document.getElementById('indicatore').value=m.indicatore;
  if(m.vincolo_2w)document.getElementById('vincolo_2w').value=m.vincolo_2w;
  if(m.punto_riferimento)document.getElementById('punto_riferimento').value=m.punto_riferimento;
})();
</script>

<!-- SW -->
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
</script>
</body>
</html>
