<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f — Domande</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body class="page form-page" data-prev="second.html" data-next="fourth.html">
  <header class="form-head">
    <h1>Passato o Futuro, scopri il tuo <span class="wf">What?f</span>!</h1>
  </header>

  <main class="form-body">
    <form id="wfForm" class="card">
      <fieldset>
        <legend>Tempo</legend>
        <label class="chip"><input type="radio" name="tempo" value="passato" checked> Passato</label>
        <label class="chip"><input type="radio" name="tempo" value="futuro"> Futuro</label>
      </fieldset>

      <fieldset>
        <legend>Scenario</legend>
        <label class="chip"><input type="radio" name="scenario" value="sliding" checked> Sliding Doors (realistico)</label>
        <label class="chip"><input type="radio" name="scenario" value="whataf"> What the F?! (ironico)</label>
      </fieldset>

      <div class="grid">
        <label>Età <input type="number" name="eta" placeholder="es. 29" min="10" max="100"></label>
        <label>Genere
          <select name="genere">
            <option value="">Preferisco non dirlo</option>
            <option>Donna</option><option>Uomo</option><option>Altro</option>
          </select>
        </label>
      </div>

      <div class="grid">
        <label>Luogo <input type="text" name="luogo" placeholder="città / area"></label>
        <label>Lavoro/studi <input type="text" name="lavoro" placeholder="ruolo o ambito"></label>
      </div>

      <label>Interessi (virgole)
        <input type="text" name="interessi" placeholder="musica, corsa, fotografia">
      </label>

      <label>La tua domanda (facoltativa)
        <textarea name="prompt" rows="3" placeholder="What?f… se oggi mollassi tutto per inseguire un sogno?"></textarea>
      </label>

      <div class="actions">
        <button type="button" class="btn" id="backBtn">← Indietro</button>
        <button type="submit" class="btn cta">Apri la porta 🚪</button>
      </div>
    </form>

    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot active"></span></div>
  </main>

  <script>
    // swipe (sincronizzato con prev/next)
    (function(){let sx=null,sy=null,p=document.body.dataset.prev,n=document.body.dataset.next,t=60;
      function st(e){const a=e.touches?e.touches[0]:e;sx=a.clientX;sy=a.clientY}
      function mv(e){if(sx===null)return;const a=e.touches?e.touches[0]:e,dx=a.clientX-sx,dy=a.clientY-sy;
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>t){if(dx>0&&p)location.href=p;sx=sy=null}}
      function en(){sx=sy=null}
      addEventListener("touchstart",st,{passive:true});addEventListener("touchmove",mv,{passive:true});addEventListener("touchend",en);
      addEventListener("mousedown",st);addEventListener("mousemove",mv);addEventListener("mouseup",en);
    })();

    // back
    document.getElementById("backBtn").onclick = ()=> history.back();

    // submit -> fourth.html con querystring
    document.getElementById("wfForm").addEventListener("submit", e=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      const obj=Object.fromEntries(fd.entries());
      const qs=new URLSearchParams(obj).toString();
      location.href = "fourth.html?"+qs;
    });
  </script>
</body>
</html>
