<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — La tua domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{--bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#00E0FF;--accent2:#00B5CC}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:980px;margin:0 auto;min-height:100%;padding:18px 16px 28px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.back{appearance:none;border:0;border-radius:14px;background:#0f1820;color:#d3e6ea;padding:10px 14px;font-weight:700;cursor:pointer}
.pill{margin-left:auto;color:var(--muted);font-size:14px}
h1{margin:6px 0 12px;font-size:clamp(30px,6vw,44px)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
label{display:block;margin:0 0 8px;color:var(--muted);font-weight:700}
textarea{width:100%;min-height:150px;background:#0b1218;color:#cfe6eb;border:1px solid #20303a;border-radius:14px;padding:16px;font-size:16px}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.actions{display:flex;justify-content:center;margin-top:14px}
.btn{appearance:none;border:0;border-radius:24px;padding:12px 18px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#002329;min-width:210px}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <button class="back" onclick="history.back()">← Indietro</button>
    <span id="pill" class="pill"></span>
  </div>

  <h1>La tua domanda</h1>

  <div class="card">
    <label for="q">Scrivi la tua domanda What?f…</label>
    <textarea id="q" placeholder="Esempio: Se avessi accettato quel lavoro a Milano?"></textarea>
    <div class="hint">Suggerimento: sii specifico. Es. “Se restassi a L’Aquila i prossimi 2 anni, cosa cambierebbe nella mia carriera?”</div>
    <div class="actions"><button id="go" class="btn">Scopri</button></div>
  </div>
</main>

<script>
const prefs=JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
document.getElementById('pill').textContent =
  (prefs.periodo==='past'?'Passato':prefs.periodo==='future'?'Futuro':'—')+' • '+
  (prefs.stile==='whatif'?'What if (plausibile)':prefs.stile==='wtf'?'What the F (ironico)':'—');

document.getElementById('go').addEventListener('click',()=>{
  const q=document.getElementById('q').value.trim();
  if(!q){ alert('Scrivi una domanda.'); return; }
  const profile=JSON.parse(localStorage.getItem('whatif_profile')||'{}');
  localStorage.setItem('whatif_last', JSON.stringify({question:q,prefs,profile}));
  location.href='fifth.html'; // vai diretto alla risposta AI (come da versione buona)
});
</script>
</body>
</html>
