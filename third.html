<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Step 3</title>
  <meta name="theme-color" content="#0A0F14" />
  <link rel="preload" as="image" href="/third-hero.png" />

  <style>
    :root{
      --bg:#0A0F14; --fg:#ffffff; --muted:#93A3AD;
      --accent:#00E0FF; --accent-dark:#00B5CC;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{
      min-height:100svh; padding:18px 18px 26px;
      display:flex; flex-direction:column; align-items:center; justify-content:space-between;
      gap:14px; text-align:center;
    }

    /* blocco immagine */
    .hero-wrap{
      width:100%; display:flex; justify-content:center; align-items:center;
      margin-top:6px;
    }
    .hero{
      width:min(94vw, 640px); height:auto; display:block;
      border-radius:14px;
      box-shadow:0 18px 44px rgba(0,0,0,.55);
    }
    .fallback{color:var(--muted); font-size:14px; margin-top:6px;}

    /* testi */
    h1{
      margin:10px 0 4px;
      font-weight:800;
      font-size:clamp(28px,6.5vw,40px);   /* PIÙ GRANDE */
      line-height:1.15;
      letter-spacing:.2px;
    }
    .kicker{
      color:var(--accent);
      font-weight:700; letter-spacing:.6px;
      font-size:clamp(12px,2.8vw,15px);
      margin-top:-2px;
    }
    p.sub{
      max-width:800px; margin:10px auto 0;
      color:var(--muted);
      font-size:clamp(15px,3.6vw,20px);   /* SOTTOTITOLO PIÙ GRANDE */
      line-height:1.45;
    }

    /* bottone */
    .cta{
      width:min(720px, 92vw); height:auto;
      display:inline-block; text-decoration:none; text-transform:uppercase;
      background:var(--accent-dark); color:#00252C; font-weight:800; letter-spacing:.5px;
      font-size:clamp(16px,4.2vw,22px);
      padding:16px 22px; border-radius:38px;
      box-shadow:0 0 14px rgba(0,181,204,.55), 0 0 28px rgba(0,181,204,.28);
      transition:.18s ease;
    }
    .cta:active{ transform:translateY(1px) }

    footer{color:var(--muted); font-size:12px; margin-top:10px}
    footer a{color:var(--accent); text-decoration:none}

    /* piccoli ingressi */
    .fade{opacity:0; transform:translateY(10px); animation:in .8s ease forwards}
    .d1{animation-delay:.10s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}
    @keyframes in{to{opacity:1; transform:none}}

    /* effetto leaving tra pagine */
    .leaving main{opacity:0; transform:translateY(8px); transition:.35s ease}
  </style>
</head>
<body>
  <main id="page">
    <div class="hero-wrap fade d1">
      <img id="hero" class="hero" alt="Due porte illuminate – What?f" />
    </div>
    <div class="fallback" id="fb" hidden>Caricamento immagine…</div>

    <div class="fade d2">
      <div class="kicker">CHOOSE YOUR WAY</div>
      <h1>Ora tocca a te</h1>
      <p class="sub">Scegli, esplora, scopri come potrebbe andare.</p>
    </div>

    <a href="fourth.html" id="cta" class="cta fade d3">LET’S START</a>

    <footer>© 2025 What?f · <a href="#">Privacy</a> · <a href="#">Termini</a></footer>
  </main>

  <script>
    // Carica immagine con fallback a /public/
    (async function(){
      const hero=document.getElementById('hero');
      const fb=document.getElementById('fb');
      const candidates=['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for(const url of candidates){
        try{const r=await fetch(url,{cache:'no-store'});
          if(r.ok){hero.src=url+'?v='+Date.now(); fb.hidden=true; return;}
        }catch(e){}
      }
      fb.textContent='Immagine non trovata.'; fb.hidden=false;
    })();

    // Disattiva vecchi SW (evita cache vecchie)
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations?.().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
      caches?.keys?.().then(keys=>keys.forEach(k=>caches.delete(k)));
    }

    // Navigazione con animazione
    (function(){
      const go=(href)=>{
        document.body.classList.add('leaving');
        setTimeout(()=>location.href=href, 360);
      };
      document.getElementById('cta').addEventListener('click',e=>{
        e.preventDefault(); go('fourth.html');
      });

      // SWIPE: sinistra ⇒ avanti, destra ⇒ indietro
      let startX=0,startY=0,moved=false;
      const TH=30, VMAX=60;  // soglia orizzontale, massimo drift verticale
      window.addEventListener('touchstart',e=>{
        const t=e.touches[0]; startX=t.clientX; startY=t.clientY; moved=false;
      },{passive:true});
      window.addEventListener('touchmove',()=>{moved=true},{passive:true});
      window.addEventListener('touchend',e=>{
        if(!moved) return;
        const t=e.changedTouches[0]; const dx=t.clientX-startX; const dy=t.clientY-startY;
        if(Math.abs(dy)>VMAX) return;
        if(dx<-TH) go('fourth.html');          // swipe a sinistra → avanti
        else if(dx>TH) go('second.html');      // swipe a destra → indietro
      });

      // Supporto tastiera
      window.addEventListener('keydown',e=>{
        if(e.key==='ArrowLeft') go('second.html');
        if(e.key==='ArrowRight') go('fourth.html');
      });
    })();
  </script>
</body>
</html>
