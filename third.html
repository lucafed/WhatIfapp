<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What?f – Domande</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="page third">
  <div class="container">
    <h1>Passato o Futuro?<br><span class="highlight">Scopri il tuo What?f</span></h1>

    <!-- Scelta scenario -->
    <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="badge">Scenario</span>
      <label style="display:inline-flex;gap:8px;align-items:center">
        <input type="radio" name="mode" value="sliding" checked/> 🚪 Sliding Doors (realistico)
      </label>
      <label style="display:inline-flex;gap:8px;align-items:center">
        <input type="radio" name="mode" value="wtf"/> 🌈 What the F?! (ironico)
      </label>
    </div>

    <!-- Porta grande -->
    <div class="door-wrap"><div id="door" class="door" aria-hidden="true"></div></div>

    <!-- Dati base + domanda -->
    <form id="questionForm" class="card">
      <label for="name">Il tuo nome (facoltativo)</label>
      <input id="name" placeholder="Es. Sara"/>

      <label for="gender">Genere (obbligatorio)</label>
      <select id="gender" required>
        <option value="">Seleziona…</option>
        <option>uomo</option><option>donna</option><option>altro</option>
      </select>

      <label for="location">Dove ti trovi? (facoltativo)</label>
      <input id="location" placeholder="Es. Roma/Milano"/>

      <label for="explore">Vuoi esplorare (obbligatorio)</label>
      <select id="explore" required>
        <option value="">Seleziona…</option>
        <option value="passato">il passato</option>
        <option value="futuro">il futuro</option>
      </select>

      <label for="mainQuestion">La tua domanda What?f (obbligatorio)</label>
      <textarea id="mainQuestion" required placeholder="Es. E se avessi accettato quel lavoro a Londra?"></textarea>

      <button type="submit" class="door-btn">
        <img src="assets/logo-whatif-28.png" alt="What?f"/> Apri la porta
      </button>
    </form>
  </div>

  <script>
  const door = document.getElementById('door');
  const form = document.getElementById('questionForm');

  form.addEventListener('submit', (e)=>{
    e.preventDefault();

    const mode = document.querySelector('input[name="mode"]:checked').value;
    const payload = {
      mode,                                 // 'sliding' | 'wtf'
      name: document.getElementById('name').value.trim(),
      gender: document.getElementById('gender').value,
      location: document.getElementById('location').value.trim(),
      explore: document.getElementById('explore').value,
      question: document.getElementById('mainQuestion').value.trim(),
      time: new Date().toISOString()
    };
    if(!payload.gender || !payload.explore || !payload.question){ return; }

    sessionStorage.setItem('whatf_input_v2', JSON.stringify(payload));
    door.classList.add('open');
    setTimeout(()=> location.href = 'fourth.html', 750);
  });
  </script>
</body>
</html>
