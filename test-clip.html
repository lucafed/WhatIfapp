<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Test generate-clip</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#05080c;color:#f5f5f5;padding:16px}
    button{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;margin-bottom:12px}
    #log{font-size:14px;white-space:pre-wrap;margin-top:10px}
    video{width:100%;max-width:400px;margin-top:12px;border-radius:12px}
  </style>
</head>
<body>
  <h1>Test /api/generate-clip</h1>

  <p>Premi il bottone per inviare una richiesta di prova a <code>/api/generate-clip</code>.</p>

  <button id="goBtn">🎬 Test video</button>

  <div id="log"></div>
  <video id="vid" controls></video>

  <script type="module">
    const logEl = document.getElementById('log');
    const vid = document.getElementById('vid');
    const btn = document.getElementById('goBtn');

    function log(msg){
      console.log(msg);
      logEl.textContent += msg + "\n";
    }

    btn.onclick = async () => {
      logEl.textContent = "";
      vid.removeAttribute('src');
      log("Invio POST a /api/generate-clip...");

      try{
        const res = await fetch('/api/generate-clip', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            domanda: "E se cambiassi città in 6 mesi?",
            answer: "Questa è solo una risposta di test generata a mano, giusto per creare il video.",
            style: "whatif"
          })
        });

        log("Status: " + res.status);

        const ct = res.headers.get('Content-Type') || '';
        log("Content-Type: " + ct);

        if(!res.ok){
          const txt = await res.text();
          log("Body errore:\n" + txt);
          return;
        }

        const blob = await res.blob();
        log("Blob size: " + blob.size + " bytes");

        const url = URL.createObjectURL(blob);
        vid.src = url;
        log("Video pronto: controlla il player qui sotto.");

      } catch(err){
        log("JS error: " + (err && err.message ? err.message : String(err)));
      }
    };
  </script>
</body>
</html>
