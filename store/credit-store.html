<!DOCTYPE html>
<html lang="it" data-theme="whatif">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>What?f — Crediti</title>
    <meta name="theme-color" content="#0A0F14" />
    <style>
      :root{
        --bg:#05080D;
        --card:#101720;
        --fg:#F4F7FB;
        --muted:#9CA7B7;
        --line:#1E2936;
        --chip:#121C27;
        --accent1:#1E78FF;
        --accent2:#FFE600;
        --danger:#ff4b5c;
      }
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{
        height:100%;
        background:radial-gradient(900px 700px at 25% 20%, #0E1724 0%, #05080D 60%);
        color:var(--fg);
        font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      body{
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px 12px;
      }
      .panel{
        width:min(100%,420px);
        background:var(--card);
        border-radius:22px;
        border:1px solid var(--line);
        box-shadow:0 22px 60px rgba(0,0,0,.55);
        padding:20px 18px 18px;
      }
      .panel h1{
        font-size:22px;
        margin-bottom:4px;
      }
      .panel p{
        font-size:14px;
        color:var(--muted);
        margin-bottom:12px;
      }
      .row{
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        margin-top:12px;
      }
      .btn{
        appearance:none;
        border-radius:14px;
        padding:10px 14px;
        border:1px solid var(--line);
        background:var(--chip);
        color:var(--fg);
        font-weight:700;
        font-size:14px;
        cursor:pointer;
        flex:1;
        text-align:center;
      }
      .btn.primary{
        background:linear-gradient(180deg,var(--accent1),var(--accent2));
        color:#05070A;
        border:none;
        box-shadow:0 12px 30px rgba(0,0,0,.55);
      }
      .btn.secondary{
        flex:1;
      }
      .btn[disabled]{
        opacity:.45;
        cursor:not-allowed;
        box-shadow:none;
      }
      .note-small{
        font-size:11px;
        color:var(--muted);
        margin-top:12px;
        line-height:1.4;
      }
      .pill{
        display:inline-flex;
        align-items:center;
        gap:6px;
        font-size:11px;
        padding:4px 8px;
        border-radius:999px;
        background:rgba(15,24,36,.9);
        border:1px solid var(--line);
        margin-bottom:8px;
      }
      .pill span{
        opacity:.9;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="pill">
        <span>🔋</span><span id="subtitle">Crediti esauriti</span>
      </div>
      <h1 id="title">Crediti</h1>
      <p id="description">
        Hai terminato i crediti. Scegli un pacchetto per continuare a usare What?f.
      </p>

      <div class="row">
        <button class="btn primary" id="buy5">Compra 5 crediti</button>
      </div>
      <div class="row">
        <button class="btn secondary" id="buy15">Compra 15 crediti</button>
        <button class="btn secondary" id="buy30">Compra 30 crediti</button>
      </div>

      <div class="row" style="margin-top:16px;">
        <button class="btn" id="closeBtn">Chiudi</button>
      </div>

      <div class="note-small" id="smallNote">
        Il pagamento è gestito in modo sicuro da Stripe. Dopo il pagamento i crediti
        vengono aggiunti automaticamente al tuo profilo collegato a Google.
      </div>
    </div>

    <script type="module">
      const $ = id => document.getElementById(id);

      // ========== i18n basic ==========
      const I18N = {
        it:{
          subtitle:"Crediti esauriti",
          title:"Crediti",
          desc:"Hai terminato i crediti. Scegli un pacchetto per continuare a usare What?f.",
          buy5:"Compra 5 crediti",
          buy15:"Compra 15 crediti",
          buy30:"Compra 30 crediti",
          close:"Chiudi",
          note:"Il pagamento è gestito in modo sicuro da Stripe. Dopo il pagamento i crediti vengono aggiunti automaticamente al tuo profilo collegato a Google.",
          error:"Errore nel creare il pagamento. Riprova tra poco."
        },
        en:{
          subtitle:"Out of credits",
          title:"Credits",
          desc:"You’ve run out of credits. Pick a pack to keep using What?f.",
          buy5:"Buy 5 credits",
          buy15:"Buy 15 credits",
          buy30:"Buy 30 credits",
          close:"Close",
          note:"Payments are securely handled by Stripe. After checkout, credits are added automatically to your Google-linked profile.",
          error:"Error creating the payment. Please try again."
        },
        es:{
          subtitle:"Créditos agotados",
          title:"Créditos",
          desc:"Has agotado tus créditos. Elige un paquete para seguir usando What?f.",
          buy5:"Comprar 5 créditos",
          buy15:"Comprar 15 créditos",
          buy30:"Comprar 30 créditos",
          close:"Cerrar",
          note:"El pago se gestiona de forma segura con Stripe. Tras el pago, los créditos se añaden automáticamente a tu perfil vinculado a Google.",
          error:"Error al crear el pago. Inténtalo de nuevo."
        },
        fr:{
          subtitle:"Crédits épuisés",
          title:"Crédits",
          desc:"Tu n’as plus de crédits. Choisis un pack pour continuer à utiliser What?f.",
          buy5:"Acheter 5 crédits",
          buy15:"Acheter 15 crédits",
          buy30:"Acheter 30 crédits",
          close:"Fermer",
          note:"Le paiement est géré en toute sécurité par Stripe. Après le paiement, les crédits sont ajoutés automatiquement à ton profil lié à Google.",
          error:"Erreur lors de la création du paiement. Réessaie."
        },
        de:{
          subtitle:"Guthaben aufgebraucht",
          title:"Credits",
          desc:"Du hast keine Credits mehr. Wähle ein Paket, um What?f weiter zu nutzen.",
          buy5:"5 Credits kaufen",
          buy15:"15 Credits kaufen",
          buy30:"30 Credits kaufen",
          close:"Schließen",
          note:"Die Zahlung wird sicher von Stripe abgewickelt. Nach der Zahlung werden die Credits automatisch deinem mit Google verknüpften Profil gutgeschrieben.",
          error:"Fehler beim Erstellen der Zahlung. Bitte versuch es erneut."
        }
      };

      function getLang(){
        const params = new URLSearchParams(location.search);
        const fromUrl = (params.get("lang") || "").toLowerCase();
        const fromLS = (localStorage.getItem("lang") || "").toLowerCase();
        const cand = fromUrl || fromLS || "it";
        return ["it","en","es","fr","de"].includes(cand) ? cand : "it";
      }

      const lang = getLang();
      const T = I18N[lang] || I18N.it;

      $('subtitle').textContent = T.subtitle;
      $('title').textContent = T.title;
      $('description').textContent = T.desc;
      $('buy5').textContent = T.buy5;
      $('buy15').textContent = T.buy15;
      $('buy30').textContent = T.buy30;
      $('closeBtn').textContent = T.close;
      $('smallNote').textContent = T.note;

      // ========== Stripe checkout ==========
      async function startCheckout(pack){
        const btns = ['buy5','buy15','buy30'].map($);
        try{
          btns.forEach(b => b.disabled = true);
          const res = await fetch('/api/create-checkout-session',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ pack: String(pack) })
          });
          const data = await res.json().catch(()=>({}));
          if(!res.ok || !data.url){
            throw new Error('no url');
          }
          window.location.href = data.url;
        }catch(err){
          console.error('checkout error', err);
          alert(T.error);
          btns.forEach(b => b.disabled = false);
        }
      }

      $('buy5').onclick  = () => startCheckout("5");
      $('buy15').onclick = () => startCheckout("15");
      $('buy30').onclick = () => startCheckout("30");

      // ========== Chiudi ==========
      $('closeBtn').onclick = () => {
        if (document.referrer) {
          history.back();
        } else {
          window.location.href = '/fourth.html';
        }
      };
    </script>
  </body>
</html>
