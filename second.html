<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f – Parlami di te</title><meta name="theme-color" content="#0A0F14"/>
<style>
  :root{--bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#00E0FF;--accent2:#00B5CC}
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:940px;margin:0 auto;padding:16px 14px 28px;position:relative;}
  .topbar{width:100%;display:flex;align-items:center;justify-content:center;padding:8px 0 4px}
  .mini-logo{width:72px;height:auto;border-radius:10px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));opacity:.95}
  @media (min-width:768px){ .mini-logo{ width:84px } }
  .back{appearance:none;border:0;background:#0f1820;color:#d8ebef;border-radius:12px;padding:8px 12px;cursor:pointer;margin-top:6px}
  h1{margin:10px 0 14px;font-size:clamp(26px,6vw,40px)}
  .section{background:var(--card);border-radius:16px;padding:14px;margin:12px 0}
  .section h2{margin:0 0 10px;font-size:clamp(18px,4.5vw,22px)}
  .group{display:flex;flex-wrap:wrap;gap:10px}
  .chip{appearance:none;border:1px solid #1d2b34;background:#0f1820;color:#d8ebef;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:600}
  .chip.selected{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#00262f;border-color:transparent;box-shadow:0 0 12px rgba(0,224,255,.30)}
  .cta-wrap{display:flex;justify-content:center;margin-top:10px}
  .cta{display:inline-block;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#00262f;font-weight:900;border:none;border-radius:24px;padding:12px 18px;min-width:210px;box-shadow:0 0 14px rgba(0,181,204,.45),0 0 30px rgba(0,181,204,.25);cursor:pointer}
  .cta[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
  .muted{color:var(--muted);font-size:13px}
  .err{color:#ff7e7e;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<main>
  <div class="topbar"><img id="miniLogo" class="mini-logo" alt="What?f" loading="eager" decoding="async"></div>
  <button class="back" onclick="location.href='index.html'">← Indietro</button>

  <h1><span class="muted">Parlami di</span> <strong>TE</strong></h1>

  <section class="section">
    <h2>Chi sei?</h2>
    <div class="group" id="g-who" data-key="who" data-required>
      <button class="chip" data-val="studente">Studente</button>
      <button class="chip" data-val="lavoratore">Lavoratore</button>
      <button class="chip" data-val="creativo">Creativo</button>
    </div>
  </section>

  <section class="section">
    <h2>Sesso</h2>
    <div class="group" id="g-sex" data-key="sex" data-required>
      <button class="chip" data-val="femmina">Femmina</button>
      <button class="chip" data-val="maschio">Maschio</button>
      <button class="chip" data-val="altro">Altro</button>
      <button class="chip" data-val="nd">Preferisco non dirlo</button>
    </div>
  </section>

  <section class="section">
    <h2>Età</h2>
    <div class="group" id="g-age" data-key="age" data-required>
      <button class="chip" data-val="<18">&lt;18</button>
      <button class="chip" data-val="18-25">18–25</button>
      <button class="chip" data-val="26-35">26–35</button>
      <button class="chip" data-val=">35">&gt;35</button>
    </div>
  </section>

  <section class="section">
    <h2>In quale fase ti trovi?</h2>
    <div class="group" id="g-phase" data-key="phase" data-required>
      <button class="chip" data-val="studio">Studio</button>
      <button class="chip" data-val="carriera">Carriera</button>
      <button class="chip" data-val="relazioni">Relazioni</button>
    </div>
  </section>

  <p id="msg" class="err">Seleziona almeno un’opzione in ogni sezione per continuare.</p>
  <div class="cta-wrap"><button id="go" class="cta" disabled>Continua</button></div>
  <p class="muted" style="text-align:center;margin-top:12px">I dati servono solo a personalizzare la risposta dell’AI.</p>
</main>

<script>
  (async function(){ const el=document.getElementById('miniLogo'); for (const u of ['/home-hero.png','/public/home-hero.png','/assets/home-hero.png']){ try{const r=await fetch(u,{cache:'no-store'}); if(r.ok){ el.src=u+'?v='+Date.now(); return; }}catch(_){}} el.alt='Immagine non trovata';})();
  const state=JSON.parse(localStorage.getItem('whatif_profile')||'{}');
  const groups=Array.from(document.querySelectorAll('.group[data-required]'));
  const go=document.getElementById('go'),msg=document.getElementById('msg');
  function markSelected(g,val){g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('selected',c.dataset.val===val));}
  function restore(){groups.forEach(g=>{const key=g.dataset.key,val=state[key]; if(val) markSelected(g,val);}); checkReady();}
  function checkReady(){const ok=groups.every(g=>!!state[g.dataset.key]); go.disabled=!ok; msg.style.display=ok?'none':'block';}
  groups.forEach(g=>{ g.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const key=g.dataset.key,val=b.dataset.val; state[key]=val; localStorage.setItem('whatif_profile',JSON.stringify(state)); markSelected(g,val); checkReady(); }); });
  go.addEventListener('click',()=>{ if(go.disabled){msg.style.display='block';return;} location.href='fourth.html';});
  restore();
</script>
</body>
</html>
