<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Parlami di te</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{--bg:#0A0F14;--fg:#E6F2F5;--muted:#A0B2BA;--card:#121820;--accent:#00E0FF;--accent2:#00B5CC}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:980px;margin:0 auto;padding:18px 14px 26px}
    h1{margin:4px 0 10px;font-size:clamp(24px,5.5vw,34px)}
    p.lead{margin:0 0 12px;color:#d7e8ec;font-size:clamp(14px,4vw,18px);line-height:1.5}
    form{background:var(--card);border:1px solid #1b2730;border-radius:16px;padding:16px;display:grid;gap:12px}
    label{font-weight:700}
    select,input,textarea{width:100%;border:1px solid #223240;background:#0c141b;color:var(--fg);border-radius:12px;padding:10px 12px;font-size:16px}
    .row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
    @media (max-width:640px){.row{grid-template-columns:1fr}}
    .muted{color:var(--muted);font-size:13px}
    .actions{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
    .btn{appearance:none;border:none;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}
    .btn-secondary{background:#162029;color:#cfe3ea;border:1px solid #21313b}
    .btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#002329}
    .error{color:#ffb3b3;font-size:13px;display:none}
    .topbar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:6px 0;background:linear-gradient(180deg,rgba(10,15,20,.9),rgba(10,15,20,0))}
    .lang-btn{border:1px solid #1f2c36;background:#0f1820;color:var(--fg);border-radius:12px;padding:6px 10px;font-weight:700;cursor:pointer}
    /* modal lingua */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:20}
    .modal.open{display:flex}
    .sheet{width:min(92vw,560px);background:#0f1820;border:1px solid #20303a;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
    .optrow{display:flex;gap:12px;justify-content:center}
    .opt{flex:1;border:1px solid #1f2c36;background:#0c141b;color:var(--fg);padding:12px 16px;border-radius:14px;font-weight:900;cursor:pointer}
    .opt.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#002329;border:none}
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <button id="openLang" class="lang-btn" aria-label="Language">🌐</button>
    </div>

    <h1 data-key="title">Parlami di te</h1>
    <p class="lead" data-key="intro">
      Raccontami brevemente chi sei, cosa stai vivendo o perché usi What?f:
      aiuterà l’AI a comprenderti meglio e rispondere in modo più personale.
    </p>

    <form id="aboutForm" novalidate>
      <div class="row">
        <div>
          <label for="sex" data-key="sex">Sesso</label>
          <select id="sex" required>
            <option value="" data-key="choose">Seleziona…</option>
            <option value="male" data-key="male">Uomo</option>
            <option value="female" data-key="female">Donna</option>
            <option value="other" data-key="other">Altro</option>
            <option value="skip" data-key="skip">Preferisco non dirlo</option>
          </select>
        </div>
        <div>
          <label for="age" data-key="age">Età</label>
          <select id="age" required>
            <option value="" data-key="choose">Seleziona…</option>
            <option value="u18">-18</option>
            <option value="18-24">18–24</option>
            <option value="25-34">25–34</option>
            <option value="35-44">35–44</option>
            <option value="45-54">45–54</option>
            <option value="55-64">55–64</option>
            <option value="65p">65+</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="phase" data-key="phase">In quale fase ti trovi?</label>
          <select id="phase" required>
            <option value="" data-key="choose">Seleziona…</option>
            <option value="study" data-key="ph_study">Studio</option>
            <option value="work" data-key="ph_work">Lavoro</option>
            <option value="change" data-key="ph_change">Transizione/Scelta</option>
            <option value="family" data-key="ph_family">Famiglia</option>
            <option value="other" data-key="other">Altro</option>
          </select>
        </div>
        <div>
          <label for="where" data-key="where">Da dove vieni?</label>
          <input id="where" type="text" placeholder="Città / Paese" />
        </div>
      </div>

      <div>
        <label for="more" data-key="more_label">Vuoi raccontarci qualcosa di più su di te? <span class="muted" data-key="more_hint">(opzionale – aiuta l’AI a darti risposte più accurate)</span></label>
        <textarea id="more" rows="4" placeholder="Esempio: lavoro nel digitale, sto pensando di cambiare città…"></textarea>
      </div>

      <span id="err" class="error" data-key="err">Seleziona almeno un’opzione per continuare.</span>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="back" data-key="back">Indietro</button>
        <button type="submit" class="btn btn-primary" id="next" data-key="next">Continua</button>
      </div>
    </form>

    <footer style="margin-top:12px;color:var(--muted);font-size:12px">
      © 2025 What?f
    </footer>
  </main>

  <!-- Selettore lingua -->
  <div id="langModal" class="modal" role="dialog" aria-modal="true">
    <div class="sheet">
      <h3 data-key="modal_title">Scegli la lingua</h3>
      <p data-key="modal_hint">Potrai cambiarla in ogni momento.</p>
      <div class="optrow">
        <button class="opt" id="itBtn">Italiano</button>
        <button class="opt primary" id="enBtn">English</button>
      </div>
    </div>
  </div>

  <script>
    // I18N (stesso modello della home)
    const I18N = {
      it:{
        title:"Parlami di te",
        intro:"Raccontami brevemente chi sei, cosa stai vivendo o perché usi What?f: aiuterà l’AI a comprenderti meglio e rispondere in modo più personale.",
        sex:"Sesso", age:"Età", phase:"In quale fase ti trovi?", where:"Da dove vieni?",
        choose:"Seleziona…", male:"Uomo", female:"Donna", other:"Altro", skip:"Preferisco non dirlo",
        ph_study:"Studio", ph_work:"Lavoro", ph_change:"Transizione/Scelta", ph_family:"Famiglia",
        more_label:"Vuoi raccontarci qualcosa di più su di te?",
        more_hint:"(opzionale – aiuta l’AI a darti risposte più accurate)",
        back:"Indietro", next:"Continua", err:"Seleziona almeno un’opzione per continuare.",
        modal_title:"Scegli la lingua", modal_hint:"Potrai cambiarla in ogni momento."
      },
      en:{
        title:"Tell me about you",
        intro:"Briefly share who you are, what you’re going through or why you use What?f. It helps the AI understand you and reply more personally.",
        sex:"Gender", age:"Age", phase:"Which phase are you in?", where:"Where are you from?",
        choose:"Select…", male:"Male", female:"Female", other:"Other", skip:"Prefer not to say",
        ph_study:"Study", ph_work:"Work", ph_change:"Transition/Choice", ph_family:"Family",
        more_label:"Want to tell us more about you?",
        more_hint:"(optional – helps the AI give more accurate answers)",
        back:"Back", next:"Continue", err:"Please fill the required fields.",
        modal_title:"Choose language", modal_hint:"You can change it anytime."
      }
    };
    const LS=localStorage;
    let lang = LS.getItem('lang') || ((navigator.language||'it').toLowerCase().startsWith('en')?'en':'it');
    function apply(){
      const D=I18N[lang];
      document.documentElement.lang=lang;
      document.querySelectorAll('[data-key]').forEach(el=>{
        const k=el.getAttribute('data-key'); if(D[k]) el.innerHTML=D[k];
      });
      document.getElementById('where').placeholder = (lang==='en'?'City / Country':'Città / Paese');
      document.getElementById('more').placeholder  = (lang==='en'?'Example: I work in tech…':'Esempio: lavoro nel digitale…');
    }
    function setLang(l){ lang=l; LS.setItem('lang',l); apply(); }
    // modal lingua
    const modal=document.getElementById('langModal');
    document.getElementById('openLang').addEventListener('click',()=>modal.classList.add('open'));
    document.getElementById('itBtn').addEventListener('click',()=>{setLang('it');modal.classList.remove('open')});
    document.getElementById('enBtn').addEventListener('click',()=>{setLang('en');modal.classList.remove('open')});
    if(!LS.getItem('lang')) modal.classList.add('open');
    apply();

    // back
    document.getElementById('back').addEventListener('click',()=>history.back());

    // submit con convalida
    document.getElementById('aboutForm').addEventListener('submit',(e)=>{
      e.preventDefault();
      const sex = document.getElementById('sex').value.trim();
      const age = document.getElementById('age').value.trim();
      const phase= document.getElementById('phase').value.trim();
      const where= document.getElementById('where').value.trim();
      const more = document.getElementById('more').value.trim();
      if(!sex || !age || !phase){
        const err=document.getElementById('err'); err.style.display='block'; return;
      }
      const profile={sex,age,phase,where,more};
      LS.setItem('whatif_user', JSON.stringify(profile));
      location.href='third.html';
    });
  </script>
</body>
</html>
