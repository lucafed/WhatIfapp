<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Step 2</title>
<meta name="theme-color" content="#0A0F14">
<link rel="preload" as="image" href="/second-hero.png" />
<style>
  :root{--bg:#0A0F14;--fg:#fff;--muted:#A0B2BA;--accent:#00E0FF;--accent-dark:#00B5CC}
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;gap:8px;padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
  .top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px}
  .hero-img{max-width:min(92vw,560px);max-height:48svh;width:auto;height:auto;filter:drop-shadow(0 10px 28px rgba(0,0,0,.45));margin-top:6px}
  h2{margin:6px 0 0;font-size:clamp(24px,5.3vw,38px);line-height:1.1}
  h2 span{color:var(--accent)}
  p{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,3.6vw,16px)}
  .bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
  .btn{display:inline-block;background:linear-gradient(180deg,#00e0ff,#00b5cc);color:#001c22;font-weight:800;padding:14px 22px;border-radius:28px;min-width:min(88vw,520px);letter-spacing:.3px;
       box-shadow:0 6px 20px rgba(0,224,255,.25),0 0 0 1px rgba(0,224,255,.35) inset}
  a{text-decoration:none;color:var(--accent)}
</style>
</head>
<body>
  <main>
    <div class="top">
      <img id="hero2" class="hero-img" alt="Seconda schermata" loading="eager" decoding="async" />
      <h2>Scopri il tuo <span>What?f</span></h2>
      <p>Le scelte ci definiscono. Cosa sarebbe successo se…?</p>
    </div>
    <div class="bottom">
      <a class="btn" href="third.html" id="go3">INIZIA</a>
    </div>
  </main>
  <script>
    (async function(){
      const el=document.getElementById('hero2');
      for(const u of ['/second-hero.png','/public/second-hero.png','/assets/second-hero.png']){
        try{const r=await fetch(u,{cache:'no-store'});if(r.ok){el.src=u+'?v='+Date.now();return;}}catch(e){}
      }
    })();
    document.getElementById('go3').addEventListener('click',e=>{e.preventDefault();location.href='third.html';});
  </script>
</body>
</html>
