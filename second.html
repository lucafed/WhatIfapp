<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Choose your way</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page"
      style="--bg-url: url('assets/whataf_logo.png');">

  <!-- SOLO titolo corto, senza testo descrittivo sotto -->
  <header class="overlay">
    <h1 class="headline">Choose your way</h1>
  </header>

  <footer class="footer-cta">
    <a class="btn-primary" href="third.html" aria-label="Entra nella simulazione">
      Start
    </a>
    <div class="swipe-hint" aria-hidden="true">⇠ swipe</div>
  </footer>

  <script>
    // Swipe sinistra -> vai a third.html
    (function () {
      let startX = null, startY = null;
      const minDx = 50;
      document.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        startX = t.clientX; startY = t.clientY;
      }, {passive: true});
      document.addEventListener('touchend', (e) => {
        if (startX === null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = Math.abs(t.clientY - startY);
        if (dx < -minDx && dy < 60) window.location.href = 'third.html';
        startX = startY = null;
      }, {passive: true});

      // Click ovunque porta avanti
      document.addEventListener('click', (e) => {
        const isButton = e.target.closest('.btn-primary');
        if (!isButton) window.location.href = 'third.html';
      });
    })();
  </script>
</body>
</html>
