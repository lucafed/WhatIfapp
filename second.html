<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Choose your way</title>
  <meta name="theme-color" content="#0A0F14" />

  <!-- Precarica l’immagine principale -->
  <link rel="preload" as="image" href="/second-hero.png" />

  <style>
    :root { --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA;
            --accent:#00E0FF; --accent-dark:#00B5CC; }
    *{ box-sizing:border-box }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif }
    main{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:20px; gap:14px; transition: opacity .45s ease, transform .45s ease; }
    .fade-in{ opacity:0; transform:translateY(15px); animation:fadeIn 1.2s ease forwards }
    .delay1{ animation-delay:.2s } .delay2{ animation-delay:.5s } .delay3{ animation-delay:.9s }
    @keyframes fadeIn{ to{ opacity:1; transform:translateY(0) } }
    .leaving main{ opacity:0; transform:translateY(10px); pointer-events:none }

    .hero-img{ width:min(92vw,560px); height:auto; display:block; margin:0 auto 8px;
      filter:drop-shadow(0 10px 28px rgba(0,0,0,.45)) }
    .hero-fallback{ color:var(--muted); font-size:14px; display:none; margin-top:-6px }

    h1{ margin:.25rem 0 0; font-size:clamp(28px,5.5vw,44px); line-height:1.1 }
    h1 span{ color:var(--accent); text-shadow:0 0 8px rgba(0,224,255,.7),0 0 16px rgba(0,224,255,.4) }

    p.lead{ color:var(--muted); margin:.25rem 0 0; font-size:clamp(16px,3.5vw,18px) }

    .btn{ display:inline-block; text-decoration:none; background:var(--accent-dark);
      color:#001f26; font-weight:700; padding:14px 22px; border-radius:28px;
      box-shadow:0 0 12px rgba(0,181,204,.6), 0 0 24px rgba(0,181,204,.3);
      transition:.2s }
    .btn:hover{ filter:brightness(1.15) }
    .btn:active{ transform:translateY(1px) }

    .link-back{ position:fixed; top:12px; left:14px; color:var(--muted); text-decoration:none; font-weight:600 }
    footer{ position:fixed; bottom:10px; left:0; right:0; text-align:center; color:var(--muted); font-size:12px }
    footer a{ color:var(--accent); text-decoration:none }
  </style>
</head>
<body>
  <a class="link-back" href="index.html" aria-label="Torna indietro">← Home</a>

  <main>
    <img id="hero" class="hero-img fade-in delay1" alt="Seconda schermata What?f" loading="eager" decoding="async" />
    <div id="heroFallback" class="hero-fallback">Caricamento immagine…</div>

    <h1 class="fade-in delay2">Scopri il tuo <span>What?f</span></h1>
    <p class="lead fade-in delay2">Le scelte ci definiscono. Cosa sarebbe successo se…?</p>

    <a href="third.html" id="cta" class="btn fade-in delay3">INIZIA</a>
  </main>

  <footer>© 2025 What?f · <a href="#">Privacy</a> · <a href="#">Termini</a></footer>

  <!-- Kill vecchi SW + pulizia cache -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations?.().then(rs => rs.forEach(r=>r.unregister())).catch(()=>{});
      caches?.keys?.().then(keys => keys.forEach(k => caches.delete(k)));
    }
  </script>

  <!-- Loader immagine con cache-buster -->
  <script>
    (async () => {
      const hero = document.getElementById('hero');
      const fb   = document.getElementById('heroFallback');
      const tries = ['/second-hero.png','/public/second-hero.png','/assets/second-hero.png'];
      for (const u of tries) {
        try {
          const r = await fetch(u, { cache:'no-store' });
          if (r.ok) { hero.src = u + '?v=' + Date.now(); fb.style.display='none'; return; }
        } catch {}
      }
      fb.textContent = 'Immagine non trovata.'; fb.style.display='block';
    })();
  </script>

  <!-- Transizione dolce prima di navigare -->
  <script>
    const CTA = document.getElementById('cta');
    CTA.addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.add('leaving');
      setTimeout(()=>{ window.location.href = CTA.getAttribute('href'); }, 470);
    });
  </script>
</body>
</html>
