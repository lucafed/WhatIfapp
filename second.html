<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>What?f — What the F?!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fullscreen" aria-label="Seconda schermata">
    <div class="bg-cover bg-contain" style="background-image:url('assets/whataf_logo.png');"></div>
    <div class="bg-tint"></div>

    <div class="content" style="padding-bottom:76px">
      <div class="glass" style="display:inline-block">
        <div class="badge">Modalità <span class="brand">&nbsp;What the F?!</span></div>
        <h1 class="title-xl" style="margin-top:10px;">Choose your way</h1>
      </div>

      <div class="cta-row" style="margin-top:16px">
        <a class="btn btn-primary" href="third.html">Inizia</a>
        <a class="btn btn-ghost" href="index.html">Indietro</a>
      </div>
    </div>

    <div class="swipe-indicator">scorri <span class="chev">⌄</span></div>
  </div>

  <script>
  (function(){
    let sx=0, sy=0, ex=0, ey=0, active=false, min=48;
    const start=e=>{const t=(e.changedTouches?e.changedTouches[0]:e); sx=t.clientX; sy=t.clientY; active=true;};
    const end=e=>{
      if(!active) return; active=false;
      const t=(e.changedTouches?e.changedTouches[0]:e); ex=t.clientX; ey=t.clientY;
      const dx=ex-sx, dy=ey-sy; if(Math.abs(dx)<Math.abs(dy) || Math.abs(dx)<min) return;
      if(dx<0) location.href='third.html';
      if(dx>0) location.href='index.html';
    };
    addEventListener('pointerdown',start,{passive:true});
    addEventListener('pointerup',end,{passive:true});
    addEventListener('touchstart',start,{passive:true});
    addEventListener('touchend',end,{passive:true});
  })();
  </script>
</body>
</html>
