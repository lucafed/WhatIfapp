<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Step 2</title>
  <meta name="theme-color" content="#0A0F14">
  <style>
    :root{--bg:#0A0F14;--fg:#fff;--muted:#A0B2BA;--accent:#00E0FF;--accent-dark:#00B5CC}
    [data-theme="light"]{--bg:#f7f7f7;--fg:#111;--muted:#444;--accent:#00B5CC;--accent-dark:#008fa3}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:48px 20px 20px;gap:14px}
    .theme-toggle{position:fixed;top:16px;right:16px;background:rgba(0,0,0,.6);border:1px solid var(--accent);color:#fff;padding:10px;border-radius:50%;cursor:pointer;font-size:18px;z-index:9999}
    [data-theme="light"] .theme-toggle{background:rgba(255,255,255,.85);color:#111}
    .hero-img{width:min(82vw,400px);margin-top:8px;display:block;filter:drop-shadow(0 10px 20px rgba(0,0,0,.45))}
    h2{margin-top:14px;font-size:clamp(22px,5vw,36px)}
    p.subtitle{font-size:16px;color:var(--muted);margin-top:6px}
    .btn{display:inline-block;text-decoration:none;background:var(--accent-dark);color:#001f26;font-weight:700;padding:14px 26px;border-radius:28px;margin-top:20px;box-shadow:0 0 12px rgba(0,181,204,.6),0 0 24px rgba(0,181,204,.3)}
    footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
    footer a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Cambia tema">☀️</button>

  <main>
    <img src="/second-hero.png" alt="Seconda immagine" class="hero-img" />
    <h2>IL VIAGGIO INIZIA QUI</h2>
    <p class="subtitle">Scegli come vuoi esplorare il tuo futuro</p>
    <a href="third.html" class="btn">AVANTI</a>
  </main>

  <footer>© 2025 What?f · <a href="privacy.html">Privacy</a> · <a href="terms.html">Termini</a></footer>

  <script>
    // Tema persistente
    const btn=document.getElementById('themeToggle');const root=document.documentElement;
    function apply(t){ if(t==='light'){root.setAttribute('data-theme','light');btn.textContent='🌙'} else {root.removeAttribute('data-theme');btn.textContent='☀️'} }
    apply(localStorage.getItem('theme'));
    btn.addEventListener('click',()=>{const cur=root.getAttribute('data-theme')==='light'?'light':'dark';const next=cur==='light'?'dark':'light';localStorage.setItem('theme',next);apply(next);});
  </script>
</body>
</html>
