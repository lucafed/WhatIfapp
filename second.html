<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Parlami di te</title>
  <meta name="theme-color" content="#0A0F14" />
  <link rel="preload" as="image" href="/home-hero.png" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5;
      --muted:#A0B2BA; --accent:#00E0FF; --accent-dark:#00B5CC;
      --yellow:#f7b23b; --teal:#00d0e6;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%; margin:0; color:var(--fg);
      background:
        radial-gradient(rgba(10,15,20,0.88), rgba(10,15,20,0.95)),
        url('/home-hero.png') no-repeat center / cover fixed;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    main{
      display:flex; flex-direction:column; align-items:center;
      padding:18px; gap:18px; text-align:center;
      min-height:100%;
    }
    h1{
      font-size:clamp(26px,6vw,38px);
      margin:8px 0 6px;
      color:var(--accent);
    }
    p.lead{
      width:min(100%,900px);
      font-size:clamp(14px,4vw,18px);
      color:var(--fg);
      line-height:1.5;
    }
    .form-card{
      background:rgba(18,24,32,0.85);
      border-radius:18px;
      padding:16px;
      width:min(100%,900px);
      box-shadow:0 4px 16px rgba(0,0,0,.4);
    }
    textarea{
      width:100%;
      min-height:120px;
      background:#0d141b;
      border:1px solid #1c2a33;
      color:var(--fg);
      border-radius:10px;
      padding:10px;
      font-size:15px;
      resize:none;
    }
    .cta{
      margin-top:18px;
      background:linear-gradient(180deg,var(--accent),var(--accent-dark));
      color:#002329;
      font-weight:900;
      border:none;
      border-radius:24px;
      padding:12px 24px;
      box-shadow:0 0 14px rgba(0,181,204,.45);
      cursor:pointer;
      transition:transform .08s ease;
    }
    .cta:active{transform:translateY(1px)}
    .nav-back{
      position:absolute; left:14px; top:14px;
      background:rgba(20,28,34,0.85);
      border-radius:999px; padding:8px 14px;
      font-size:14px; color:var(--muted);
      border:1px solid #1e2e37; text-decoration:none;
    }
    .nav-back:hover{color:var(--accent)}
  </style>
</head>
<body>
  <main>
    <a href="index.html" class="nav-back">← Indietro</a>

    <h1>Parlami di te</h1>
    <p class="lead">
      Raccontami brevemente chi sei, cosa stai vivendo o cosa ti spinge a usare What?f.
      Questo aiuterà l’intelligenza artificiale a comprenderti meglio e risponderti in modo più personale.
    </p>

    <div class="form-card">
      <textarea id="userInfo" placeholder="Esempio: Mi chiamo Luca, ho 30 anni, e sto valutando se trasferirmi all’estero per lavoro..."></textarea>
      <button class="cta" id="next">Continua</button>
    </div>
  </main>

  <script>
    const next = document.getElementById('next');
    next.addEventListener('click', ()=>{
      const text = document.getElementById('userInfo').value.trim();
      if(!text){
        alert("Per continuare scrivi qualcosa su di te 😊");
        return;
      }
      localStorage.setItem('whatif_user', text);
      location.href = 'third.html';
    });
  </script>
</body>
</html>
