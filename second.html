<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f – About you</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<style>
:root{--bg:#0B1018;--bg2:#0E1724;--card:#141C22;--fg:#F4F7FB;--muted:#A7B3C2;--accent:#1C57A0;--accent2:#FFEC01;--ink:#11110A;--chip:#0f1820;--line:#1b2a34}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{appearance:none;border:1px solid var(--line);background:#0c141b;color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.blurb{color:#d7e8ec;margin:0 0 14px;font-size:clamp(14px,4vw,18px);line-height:1.45}
.banner{display:none;background:#0b151d;border:1px dashed var(--line);color:#dff6fb;border-radius:14px;padding:12px;margin-bottom:8px}
.box{background:#0c141b;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
label{font-weight:700;margin-bottom:6px;display:block}
input,select,textarea{width:100%;background:#0f1820;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.row{display:grid;gap:12px}
@media(min-width:640px){.row.two{grid-template-columns:1fr 1fr}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="history.back()">←</button>
    <button class="btn" onclick="location.href='index.html'">🏠</button>
  </div>
  <button class="btn" id="resetBtn">♻️ Reset profilo</button>
</div>

<main>
  <div class="wrap">
    <div id="dailyBanner" class="banner"></div>
    <h1>Parlami di te</h1>
    <p class="blurb">Poche cose che ci aiutano a capirti. Le micro-domande compaiono solo la prima volta che apri oggi.</p>

    <form id="form" class="box" onsubmit="return false;">
      <div class="row two">
        <div>
          <label>Sesso (opzionale)</label>
          <select id="sex">
            <option value="">—</option>
            <option value="m">Uomo</option>
            <option value="f">Donna</option>
            <option value="nb">Altro/Non specifico</option>
          </select>
        </div>
        <div>
          <label>Età (opzionale)</label>
          <input id="age" type="text" inputmode="numeric" placeholder="es. 34"/>
        </div>
      </div>
      <div>
        <label>Contesto (facoltativo)</label>
        <textarea id="ctx" rows="3" placeholder="Lavoro, figli, città, obiettivi..."></textarea>
      </div>
      <div class="actions">
        <button class="btn" id="skip">Salta</button>
        <button class="btn" id="save">Salva</button>
        <button class="btn" id="next" style="background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;font-weight:900">Continua</button>
      </div>
    </form>

    <div id="micro" class="box" style="display:none">
      <h3 style="margin:0 0 8px">Micro-domande di oggi</h3>
      <div class="row two">
        <div>
          <label>Oggi come ti senti?</label>
          <select id="mood"></select>
        </div>
        <div>
          <label>Come decidi di solito?</label>
          <select id="decide"></select>
        </div>
      </div>
      <div class="row two">
        <div>
          <label>Cosa ti ancora qui ultimamente?</label>
          <select id="anchor"></select>
        </div>
        <div>
          <label>Stile psicologico (Jung)</label>
          <select id="jung"></select>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="microSave">Salva micro-profilo di oggi</button>
      </div>
    </div>

  </div>
</main>

<script>
const LS=localStorage;
(function theme(){const p=JSON.parse(LS.getItem('whatif_prefs')||'{}');document.documentElement.setAttribute('data-theme',p.stile==='wtf'?'wtf':'whatif')})();

function today(){return new Date().toISOString().slice(0,10)}
const onceKey = `micro_once:${today()}`;
const dailyBanner = document.getElementById('dailyBanner');
const microBox = document.getElementById('micro');
function rng(n){return Math.floor(Math.random()*n)}
const moodIT   = ["Calmo","Carico","Appannato ma ok","Irrequieto","Leggero","Solido","Un po’ caotico"];
const decideIT = ["Pancia","Pro/Contro","Chiedo a un amico","Decide la scadenza","Moneta","Caffè + passeggiata"];
const anchorIT = ["Persone che amo","Soldi & bollette","Routine che funziona","Promessa a me","Paura di cambiare","Curiosità"];
const jungIT   = ["Estroverso/Pensiero","Estroverso/Sentimento","Introverso/Pensiero","Introverso/Sentimento","Intuizione","Sensazione"];

function fillSel(id, pool){const s=document.getElementById(id);s.innerHTML=""; pool.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}

function showMicroIfNeeded(){
  if(!LS.getItem(onceKey)){
    dailyBanner.style.display='block';
    dailyBanner.innerHTML='Oggi hai le <strong>micro-domande</strong> attive. Una volta salvate, spariscono fino a domani.';
    microBox.style.display='block';
    fillSel('mood', moodIT);
    fillSel('decide', decideIT);
    fillSel('anchor', anchorIT);
    fillSel('jung', jungIT);
  }
}
showMicroIfNeeded();

document.getElementById('microSave').onclick=()=>{
  const profile = JSON.parse(LS.getItem('whatif_profile')||'{}');
  profile.micro = {
    date: today(),
    mood: document.getElementById('mood').value,
    decide: document.getElementById('decide').value,
    anchor: document.getElementById('anchor').value,
    jung: document.getElementById('jung').value,
  };
  LS.setItem('whatif_profile', JSON.stringify(profile));
  LS.setItem(onceKey, '1');
  dailyBanner.textContent='Micro-profilo salvato per oggi.';
  microBox.style.display='none';
};

const ctxEl = document.getElementById('ctx');
const sexEl = document.getElementById('sex');
const ageEl = document.getElementById('age');

const saved = JSON.parse(LS.getItem('whatif_profile')||'{}');
if(saved.sex) sexEl.value=saved.sex;
if(saved.age) ageEl.value=saved.age;
if(saved.ctx) ctxEl.value=saved.ctx;

document.getElementById('save').onclick=()=>{
  const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
  p.sex = sexEl.value;
  p.age = ageEl.value;
  p.ctx = ctxEl.value;
  LS.setItem('whatif_profile', JSON.stringify(p));
  alert('Profilo salvato.');
};
document.getElementById('skip').onclick=()=>{ location.href='fourth.html'; };
document.getElementById('next').onclick=()=>{ 
  const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
  p.sex = sexEl.value; p.age = ageEl.value; p.ctx = ctxEl.value;
  LS.setItem('whatif_profile', JSON.stringify(p));
  location.href='fourth.html';
};
document.getElementById('resetBtn').onclick=()=>{ LS.removeItem('whatif_profile'); LS.removeItem(onceKey); alert('Profilo azzerato.'); location.reload(); };
</script>
</body>
</html>
