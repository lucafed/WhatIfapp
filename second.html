<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – About you</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{--bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#00E0FF;--accent2:#00B5CC;--ink:#001f26}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
      padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
    .back-btn,.home-btn,.lang-btn{appearance:none;border:1px solid #1f2c36;background:#0f1820;color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
    .lang-btn{border-radius:999px}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px)}
    .blurb{color:#d7e8ec;margin:0 0 14px;font-size:clamp(14px,4vw,18px);line-height:1.45}
    .banner{display:none;background:#0b151d;border:1px dashed #1c2b36;color:#dff6fb;border-radius:14px;padding:12px;margin-bottom:8px}
    .banner strong{color:#00e0ff}

    /* ===== Indicatore conoscenza ===== */
    .know{background:#0c141b;border:1px solid #1b2831;border-radius:16px;padding:14px;margin-top:6px}
    .know-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .meter{position:relative;height:12px;background:#0f1820;border:1px solid #1b2a34;border-radius:999px;overflow:hidden}
    .meter-fill{height:100%;width:0;background:linear-gradient(180deg,var(--accent),var(--accent2))}
    .know-score{font-weight:800;color:var(--accent)}
    .miss{margin-top:8px;color:#cfe6e9;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .chip{background:#0f1820;border:1px solid #1b2a34;color:#cfe3e7;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}

    /* Form & micro */
    form{background:#0c141b;border:1px solid #1b2831;border-radius:16px;padding:14px;display:grid;gap:12px;margin-top:10px}
    label{font-weight:700;margin-bottom:6px;display:block}
    .row{display:grid;gap:12px}
    @media (min-width:640px){ .row.two{grid-template-columns:1fr 1fr} .row.three{grid-template-columns:1fr 1fr 1fr} }
    select,input[type="text"],textarea{width:100%;background:#0f1820;color:var(--fg);border:1px solid #1f2c36;border-radius:12px;padding:12px;font-size:16px}
    textarea{min-height:110px;resize:vertical}
    .muted{color:var(--muted);font-size:13px}
    .actions{display:flex;gap:10px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
    .btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}
    .btn.ghost{background:#152029;color:#cfe6eb;border:1px solid #253342}
    .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#002329}
    .btn[disabled]{background:#2a3b45;color:#7f98a2;cursor:not-allowed}
    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;padding:10px 12px;display:none}
    .error.show{display:block}
    .micro{display:none;background:#0c141b;border:1px solid #1b2831;border-radius:16px;padding:14px;margin-top:6px}
    .micro-q{margin:10px 0}
    .micro-q label{display:block;margin:0 0 6px}
    .micro-q input{width:100%;background:#0f1820;color:var(--fg);border:1px solid #1f2c36;border-radius:10px;padding:10px}
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;gap:8px;align-items:center">
      <button id="backTop" class="back-btn">←</button>
      <button id="homeTop" class="home-btn">🏠</button>
    </div>
    <button id="langToggle" class="lang-btn">🇮🇹 IT</button>
  </div>

  <main>
    <div class="wrap">
      <div id="dailyBanner" class="banner"></div>

      <h1 id="title">Parlami di te</h1>
      <p class="blurb" id="blurb">
        Raccontami brevemente chi sei, cosa stai vivendo o cosa ti spinge a usare What?f.
        Questo aiuterà l’AI a comprenderti meglio e risponderti in modo più personale.
      </p>

      <!-- ===== Indicatore di personalizzazione ===== -->
      <div class="know" id="knowBox">
        <div class="know-head">
          <div><span id="knowLabel" class="know-score">Personalizzazione</span> <span id="knowValue">0/100</span></div>
          <div class="meter" style="width:min(60vw,360px)"><div id="knowFill" class="meter-fill"></div></div>
        </div>
        <div class="miss" id="missRow">
          <span id="missLabel">Mancano:</span>
          <!-- chip suggerimenti qui -->
        </div>
      </div>

      <div id="errorBox" class="error"></div>

      <form id="aboutForm" novalidate>
        <div class="row two">
          <div>
            <label for="name" id="name_lbl">Nome</label>
            <input id="name" type="text" placeholder="Es. Luca" />
          </div>
          <div>
            <label for="city" id="city_lbl">Città</label>
            <input id="city" type="text" placeholder="Es. L’Aquila / Verona" />
          </div>
        </div>

        <div class="row three">
          <div>
            <label for="gender" id="gender_lbl">Sesso</label>
            <select id="gender" required>
              <option value="" id="sel_choose">Seleziona…</option>
              <option value="uomo" id="gender_m">Uomo</option>
              <option value="donna" id="gender_f">Donna</option>
              <option value="altro" id="gender_o">Altro</option>
              <option value="non_specificato" id="gender_n">Preferisco non dirlo</option>
            </select>
          </div>
          <div>
            <label for="age" id="age_lbl">Età</label>
            <select id="age" required>
              <option value="" id="sel_choose2">Seleziona…</option>
              <option value="under18" id="age_u18">-18</option>
              <option value="18_24">18–24</option>
              <option value="25_34">25–34</option>
              <option value="35_44">35–44</option>
              <option value="45_54">45–54</option>
              <option value="55_64">55–64</option>
              <option value="65_plus">65+</option>
            </select>
          </div>
          <div>
            <label for="phase" id="phase_lbl">Fase attuale</label>
            <select id="phase" required>
              <option value="" id="sel_choose3">Seleziona…</option>
              <option value="studio" id="phase_study">Studio</option>
              <option value="lavoro" id="phase_work">Lavoro</option>
              <option value="cambio" id="phase_change">Cambio/Transizione</option>
              <option value="altro" id="phase_other">Altro</option>
            </select>
          </div>
        </div>

        <div class="row two">
          <div>
            <label for="who" id="who_lbl">Chi sei?</label>
            <input id="who" type="text" placeholder="Professione / Ruolo" />
          </div>
          <div>
            <label for="goal" id="goal_lbl">Obiettivo</label>
            <input id="goal" type="text" placeholder="Es. più equilibrio lavoro-vita" />
          </div>
        </div>

        <div>
          <label for="more" id="more_lbl">
            Vuoi raccontarci qualcosa di più su di te?
            <span class="muted" id="more_hint">(opzionale – aiuta l’AI a darti risposte più accurate)</span>
          </label>
          <textarea id="more" placeholder="Esempio: lavoro nel digitale, sto pensando di cambiare città, ho due figli…"></textarea>
        </div>

        <!-- Micro-domande giornaliere -->
        <div id="microBox" class="micro">
          <h3 style="margin:6px 0" id="micro_title">3 micro-domande di oggi</h3>
          <div class="micro-q">
            <label for="mq1" id="mq1_lbl">Qual è il vincolo più concreto nelle prossime 2 settimane?</label>
            <input id="mq1" type="text" />
          </div>
          <div class="micro-q">
            <label for="mq2" id="mq2_lbl">Che segnale ti dice che sei sulla strada giusta?</label>
            <input id="mq2" type="text" />
          </div>
          <div class="micro-q">
            <label for="mq3" id="mq3_lbl">Una persona/luogo che conta nel tuo scenario?</label>
            <input id="mq3" type="text" />
          </div>
          <div class="actions" style="justify-content:flex-end">
            <button type="button" class="btn ghost" id="microSkip">Salta</button>
            <button type="button" class="btn primary" id="microSave">Salva micro-dati</button>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn ghost" id="backBtn">Indietro</button>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn ghost" id="skipBtn">Salta → domanda</button>
            <button type="submit" class="btn primary" id="nextBtn">Continua</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    /* ================= I18N ================= */
    const I18N = {
      it:{
        title:"Parlami di te",
        blurb:"Raccontami brevemente chi sei, cosa stai vivendo o cosa ti spinge a usare What?f. Questo aiuterà l’AI a comprenderti meglio e risponderti in modo più personale.",
        back:"Indietro", home:"Home",
        name_lbl:"Nome", city_lbl:"Città",
        gender_lbl:"Sesso", choose:"Seleziona…", gender_m:"Uomo", gender_f:"Donna", gender_o:"Altro", gender_n:"Preferisco non dirlo",
        age_lbl:"Età", age_u18:"-18",
        phase_lbl:"Fase attuale", phase_study:"Studio", phase_work:"Lavoro", phase_change:"Cambio/Transizione", phase_other:"Altro",
        who_lbl:"Chi sei?", goal_lbl:"Obiettivo",
        more_lbl:"Vuoi raccontarci qualcosa di più su di te?", more_hint:"(opzionale – aiuta l’AI a darti risposte più accurate)",
        banner:"<strong>Giorno dopo giorno</strong>, tre micro-domande arricchiscono il tuo profilo finché dirai: <strong>“Potrei essere io.”</strong>",
        micro_title:"3 micro-domande di oggi",
        mq1:"Qual è il vincolo più concreto nelle prossime 2 settimane?",
        mq2:"Che segnale ti dice che sei sulla strada giusta?",
        mq3:"Una persona/luogo che conta nel tuo scenario?",
        micro_save:"Salva micro-dati", micro_skip:"Salta",
        backBtn:"Indietro", next:"Continua", skip:"Salta → domanda",
        err_required:"Per continuare seleziona Sesso, Età e Fase.",
        // Indicatore
        know:"Personalizzazione", missing:"Mancano:", miss_identity:"Identità/ruolo", miss_routine:"Routine/indicatori",
        miss_constraints:"Vincoli", miss_goals:"Obiettivi", miss_places:"Luoghi", miss_relations:"Relazioni", miss_risk:"Rischio",
        bar_hint:"Più dettagli → più scenari plausibili. Le chip ti portano al punto giusto."
      },
      en:{
        title:"Tell me about you",
        blurb:"Briefly share who you are, what you’re going through, or why you’re using What?f. This helps the AI understand you better and reply more personally.",
        back:"Back", home:"Home",
        name_lbl:"Name", city_lbl:"City",
        gender_lbl:"Gender", choose:"Choose…", gender_m:"Male", gender_f:"Female", gender_o:"Other", gender_n:"Prefer not to say",
        age_lbl:"Age", age_u18:"-18",
        phase_lbl:"Current phase", phase_study:"Studying", phase_work:"Working", phase_change:"Changing/Transition", phase_other:"Other",
        who_lbl:"Who are you?", goal_lbl:"Goal",
        more_lbl:"Want to tell us more about you?", more_hint:"(optional – helps the AI give more accurate answers)",
        banner:"<strong>Day by day</strong>, three micro-questions enrich your profile until you’ll say: <strong>“That could be me.”</strong>",
        micro_title:"Today’s 3 micro-questions",
        mq1:"What’s the most concrete constraint in the next 2 weeks?",
        mq2:"Which signal tells you you’re on the right track?",
        mq3:"One person/place that matters in your scenario?",
        micro_save:"Save micro-data", micro_skip:"Skip",
        backBtn:"Back", next:"Continue", skip:"Skip → question",
        err_required:"To continue please select Gender, Age and Phase.",
        // Indicator
        know:"Personalization", missing:"Missing:", miss_identity:"Identity/role", miss_routine:"Routine/indicators",
        miss_constraints:"Constraints", miss_goals:"Goals", miss_places:"Places", miss_relations:"Relationships", miss_risk:"Risk",
        bar_hint:"More detail → more plausible scenarios. Chips take you to the right field."
      }
    };

    const LS = localStorage;
    function getLang(){ return (LS.getItem('lang') || (navigator.language||'it').slice(0,2)).toLowerCase(); }
    function setLang(l){ LS.setItem('lang', l); applyI18N(); renderKnowledge(); }
    const $ = s => document.querySelector(s);

    function applyI18N(){
      const d = I18N[getLang()] || I18N.it;
      document.documentElement.lang = getLang();

      $('#title').textContent = d.title;
      $('#blurb').textContent = d.blurb;
      $('#backTop').textContent = '← ' + d.back;
      $('#homeTop').textContent = '🏠 ' + d.home;

      $('#name_lbl').textContent = d.name_lbl;
      $('#city_lbl').textContent = d.city_lbl;

      $('#gender_lbl').textContent = d.gender_lbl;
      $('#sel_choose').textContent = d.choose;
      $('#gender_m').textContent = d.gender_m;
      $('#gender_f').textContent = d.gender_f;
      $('#gender_o').textContent = d.gender_o;
      $('#gender_n').textContent = d.gender_n;

      $('#age_lbl').textContent = d.age_lbl;
      $('#sel_choose2').textContent = d.choose;
      $('#age_u18').textContent = d.age_u18;

      $('#phase_lbl').textContent = d.phase_lbl;
      $('#sel_choose3').textContent = d.choose;
      $('#phase_study').textContent = d.phase_study;
      $('#phase_work').textContent = d.phase_work;
      $('#phase_change').textContent = d.phase_change;
      $('#phase_other').textContent = d.phase_other;

      $('#who_lbl').textContent = d.who_lbl;
      $('#goal_lbl').textContent = d.goal_lbl;

      $('#more_lbl').firstChild.textContent = d.more_lbl + ' ';
      $('#more_hint').textContent = d.more_hint;

      $('#dailyBanner').innerHTML = d.banner;

      $('#micro_title').textContent = d.micro_title;
      $('#mq1_lbl').textContent = d.mq1;
      $('#mq2_lbl').textContent = d.mq2;
      $('#mq3_lbl').textContent = d.mq3;
      $('#microSave').textContent = d.micro_save;
      $('#microSkip').textContent = d.micro_skip;

      $('#backBtn').textContent = d.backBtn;
      $('#nextBtn').textContent = d.next;
      $('#skipBtn').textContent = d.skip;

      // Indicatore labels
      $('#knowLabel').textContent = d.know;
      $('#missLabel').textContent = d.missing;
      $('#knowBox').title = d.bar_hint;

      // Toggle label
      $('#langToggle').textContent = getLang()==='en' ? '🇬🇧 EN' : '🇮🇹 IT';

      // error message bind
      $('#aboutForm').dataset.err = d.err_required;
    }

    // init lang
    if (!LS.getItem('lang')) LS.setItem('lang', getLang());
    applyI18N();

    // topbar buttons
    $('#backTop').addEventListener('click', ()=> history.back());
    $('#homeTop').addEventListener('click', ()=> location.href='index.html');
    $('#langToggle').addEventListener('click', ()=>{
      const cur = getLang();
      setLang(cur==='en'?'it':'en');
    });

    // show daily banner + micro once per day
    function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    const KEY_DAY = 'whatif_daily_seen';
    const today   = todayStr();
    const seenDay = LS.getItem(KEY_DAY);
    const showDaily = (seenDay !== today);
    if (showDaily){
      $('#dailyBanner').style.display = 'block';
      $('#microBox').style.display = 'block';
    }

    // ====== INDICATORE: calcolo punteggio ======
    function readJSON(k,def={}){ try{ return JSON.parse(LS.getItem(k)||JSON.stringify(def)); }catch{ return def; } }
    function daysBetween(iso1, iso2){
      if(!iso1||!iso2) return 999;
      const a=new Date(iso1), b=new Date(iso2);
      return Math.round((b-a)/(1000*60*60*24));
    }
    function last(arr){ return Array.isArray(arr) && arr.length ? arr[arr.length-1] : null; }

    function computeKnowledge(){
      const L = I18N[getLang()] || I18N.it;

      const profile = readJSON('whatif_profile',{});
      const micro   = readJSON('whatif_micro',{});
      const clar    = readJSON('whatif_clarify',{date:null,used:0});
      const microLog= readJSON('whatif_micro_log',[]); // array di date
      const lastUpd = LS.getItem('whatif_last_update'); // ISO day

      // ---- Copertura (max 55)
      let cover = 0;
      const miss = [];

      // Identità/ruolo
      const hasIdentity = !!(profile.name || profile.role);
      cover += hasIdentity ? 8 : 0; if(!hasIdentity) miss.push('identity');

      // Routine/indicatori (usiamo micro.indicatore come segnale)
      const hasRoutine = !!(micro.indicatore);
      cover += hasRoutine ? 8 : 0; if(!hasRoutine) miss.push('routine');

      // Vincoli
      const hasConstraints = !!(micro.vincolo_2w);
      cover += hasConstraints ? 8 : 0; if(!hasConstraints) miss.push('constraints');

      // Obiettivi
      const hasGoals = !!(profile.goal);
      cover += hasGoals ? 8 : 0; if(!hasGoals) miss.push('goals');

      // Luoghi
      const hasPlaces = !!(profile.city || micro.punto_riferimento);
      cover += hasPlaces ? 8 : 0; if(!hasPlaces) miss.push('places');

      // Relazioni (se micro.punto_riferimento sembra persona—per ora consideriamo presente se c’è)
      const hasRelations = !!(micro.persona_chiave); // campo che potremo popolare dai chiarimenti
      cover += hasRelations ? 8 : 0; if(!hasRelations) miss.push('relations');

      // Rischio (tolleranza)
      const hasRisk = !!(micro.rischio || micro.tolleranza_rischio);
      cover += hasRisk ? 7 : 0; if(!hasRisk) miss.push('risk');

      // ---- Qualità (max 25)
      // Dettagli “usabili” (numeri, tempi, luoghi tipici) su profilo+micro
      const vals = Object.values(profile).concat(Object.values(micro)).filter(v=>typeof v==='string');
      let usable = 0;
      const numRe = /\b\d+([.,]\d+)?\b/;
      const timeRe= /\b(\d{1,2}[:.]\d{2}|mattina|pomeriggio|sera|am|pm)\b/i;
      const locRe = /\b(centro|stazione|ufficio|palestra|bar|parco|centro storico)\b/i;
      vals.forEach(v=>{
        if (usable>=10) return;
        if (numRe.test(v) || timeRe.test(v) || locRe.test(v)) usable++;
      });
      let quality = Math.min(10, usable); // 0–10
      if (clar && clar.date === today && (clar.used||0)>0) quality += 5; // chiarimenti oggi
      quality = Math.min(25, quality); // (coerenza la mettiamo in step 2)

      // ---- Freschezza (max 20)
      // Streak = giorni consecutivi in micro_log
      let streak=0;
      if (Array.isArray(microLog) && microLog.length){
        // calcolo streak semplice: partendo da oggi, conta indietro
        let d = new Date(today);
        for(;;){
          const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          if (microLog.includes(iso)){ streak++; d.setDate(d.getDate()-1); } else break;
        }
      }
      const streakPts = Math.min(10, streak); // 0–10

      // Recency: ultimo aggiornamento (profilo o micro)
      const lastDay = lastUpd || last(microLog);
      let recencyPts = 0;
      if (lastDay){
        const gap = daysBetween(lastDay, today);
        // 0–2g:10, 3–5g:8, 6–8g:6, 9–11g:4, 12–14g:2, >14:0
        if (gap<=2) recencyPts=10;
        else if (gap<=5) recencyPts=8;
        else if (gap<=8) recencyPts=6;
        else if (gap<=11) recencyPts=4;
        else if (gap<=14) recencyPts=2;
        else recencyPts=0;
      }
      const fresh = Math.min(20, streakPts + recencyPts);

      // Totale
      let total = Math.max(0, Math.min(100, Math.round(cover + quality + fresh)));
      return { total, miss };
    }

    function renderKnowledge(){
      const d = I18N[getLang()] || I18N.it;
      const k = computeKnowledge();
      // numero + barra
      document.getElementById('knowValue').textContent = `${k.total}/100`;
      document.getElementById('knowFill').style.width = `${k.total}%`;
      // suggerimenti mancanti
      const map = {
        identity: d.miss_identity, routine: d.miss_routine, constraints: d.miss_constraints,
        goals: d.miss_goals, places: d.miss_places, relations: d.miss_relations, risk: d.miss_risk
      };
      const missRow = document.getElementById('missRow');
      // reset chips (mantieni label "Mancano:")
      [...missRow.querySelectorAll('.chip')].forEach(n=>n.remove());
      k.miss.forEach(key=>{
        const b = document.createElement('button');
        b.type='button'; b.className='chip'; b.textContent = map[key]||key;
        b.addEventListener('click', ()=> jumpToKey(key));
        missRow.appendChild(b);
      });
    }

    function jumpToKey(key){
      // porta l’utente al punto giusto (campi o micro)
      if (key==='identity'){ document.getElementById('name').focus(); scrollIntoView('#name'); return; }
      if (key==='goals'){ document.getElementById('goal').focus(); scrollIntoView('#goal'); return; }
      if (key==='places'){ document.getElementById('city').focus(); scrollIntoView('#city'); return; }
      if (key==='constraints' || key==='routine' || key==='relations' || key==='risk'){
        // apri microBox (se non visibile, mostrala)
        document.getElementById('microBox').style.display = 'block';
        scrollIntoView('#microBox');
        // focus suggerito
        if (key==='constraints') document.getElementById('mq1').focus();
        if (key==='routine') document.getElementById('mq2').focus();
        if (key==='relations') document.getElementById('mq3').focus();
      }
    }
    function scrollIntoView(sel){
      const el=document.querySelector(sel); if(!el) return;
      el.scrollIntoView({behavior:'smooth', block:'center'});
    }

    // micro actions
    document.getElementById('microSkip').addEventListener('click', ()=>{
      document.getElementById('microBox').style.display='none';
      LS.setItem(KEY_DAY, today); // considerato mostrato
    });
    document.getElementById('microSave').addEventListener('click', ()=>{
      const patch = {};
      const v1 = document.getElementById('mq1').value.trim(); if (v1) patch['vincolo_2w'] = v1;
      const v2 = document.getElementById('mq2').value.trim(); if (v2) patch['indicatore'] = v2;
      const v3 = document.getElementById('mq3').value.trim(); if (v3) patch['punto_riferimento'] = v3;

      const micro = readJSON('whatif_micro');
      Object.assign(micro, patch);
      LS.setItem('whatif_micro', JSON.stringify(micro));

      // aggiorna loggiorni + last_update
      const log = readJSON('whatif_micro_log',[]);
      if (!log.includes(today)) log.push(today);
      LS.setItem('whatif_micro_log', JSON.stringify(log));
      LS.setItem('whatif_last_update', today);

      document.getElementById('microBox').style.display='none';
      LS.setItem(KEY_DAY, today);

      renderKnowledge();
    });

    // back / skip
    document.getElementById('backBtn').addEventListener('click', ()=> history.back());
    document.getElementById('skipBtn').addEventListener('click', ()=> location.href='fourth.html');

    // form save
    const form = document.getElementById('aboutForm');
    const errBox = document.getElementById('errorBox');

    // preload existing profile
    (function preload(){
      try{
        const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
        if (!p) return;
        if (p.name) document.getElementById('name').value = p.name;
        if (p.city) document.getElementById('city').value = p.city;
        if (p.gender) document.getElementById('gender').value = p.gender;
        if (p.age) document.getElementById('age').value = p.age;
        if (p.phase) document.getElementById('phase').value = p.phase;
        if (p.role) document.getElementById('who').value = p.role;
        if (p.goal) document.getElementById('goal').value = p.goal;
        if (p.more) document.getElementById('more').value = p.more;
      }catch(e){}
      renderKnowledge();
    })();

    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const gender = document.getElementById('gender').value.trim();
      const age    = document.getElementById('age').value.trim();
      const phase  = document.getElementById('phase').value.trim();
      if(!gender || !age || !phase){
        errBox.textContent = form.dataset.err;
        errBox.classList.add('show'); return;
      }
      errBox.classList.remove('show');

      const profile = {
        name: document.getElementById('name').value.trim(),
        city: document.getElementById('city').value.trim(),
        gender, age, phase,
        role: document.getElementById('who').value.trim(),
        goal: document.getElementById('goal').value.trim(),
        more: document.getElementById('more').value.trim()
      };
      LS.setItem('whatif_profile', JSON.stringify(profile));
      LS.setItem('whatif_last_update', today);

      renderKnowledge();
      location.href = 'fourth.html';
    });

    // se la lingua cambia in un’altra scheda, aggiorna
    window.addEventListener('storage', (e)=>{ if(e.key==='lang'){ applyI18N(); renderKnowledge(); }});
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ applyI18N(); renderKnowledge(); }});
  </script>
</body>
</html>
