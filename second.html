<!doctype html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Profilo</title>

  <meta name="theme-color" content="#0B0B0C" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root{
      --bg:#0C0F14; --bg2:#0E1724; --fg:#E6F2F5; --muted:#A0B2BA;
      --card:#121820; --line:#1b2a34; --chip:#0f1820;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#0A0E12;
    }
    html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --fg:#F4F7FB; --muted:#A7B3C2; --card:#141C22; --line:#1b2a34; --chip:#121a26; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; }
    html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --fg:#EEF5F0; --muted:#A6B6AD; --card:#111713; --line:#21322A; --chip:#0F1714; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; }

    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }

    .topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
    .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
    .lang{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 14px 26px}
    .wrap{width:min(100%,880px)}
    h1{margin:10px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .blurb{color:#d7e8ec;margin:0 0 14px;font-size:clamp(14px,4vw,18px);line-height:1.45}

    .card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:16px;padding:16px;margin-top:8px}
    .row{display:grid;gap:12px}
    @media (min-width:640px){ .two{grid-template-columns:1fr 1fr} .three{grid-template-columns:1fr 1fr 1fr} }

    label{font-weight:800;margin-bottom:6px;display:block}
    input,select,textarea{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font-size:16px}
    textarea{min-height:96px;resize:vertical}
    .muted{color:var(--muted);font-size:13px}
    .actions{display:flex;gap:10px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
    .btn.primary{border:none;background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.35)}
    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;padding:10px 12px;display:none;margin-top:10px}
    .error.show{display:block}

    /* invalid highlight */
    .invalid{outline:2px solid #ff7a7a; outline-offset:2px}
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" id="backTop">←</button>
      <button class="btn" id="homeTop">🏠</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="langSelect" class="lang" aria-label="Language">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
      <button class="btn" id="resetBtn">♻️</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="title">Parlami di te</h1>
      <p class="blurb" id="blurb">Compila tutti i campi. Li usiamo per personalizzare le risposte della AI.</p>

      <div class="card">
        <form id="profileForm" novalidate>
          <div class="row two">
            <div>
              <label for="name" id="name_lbl">Nome e cognome</label>
              <input id="name" type="text" autocomplete="name" placeholder="Es. Mario Rossi" required />
            </div>
            <div>
              <label for="city" id="city_lbl">Città</label>
              <input id="city" type="text" autocomplete="address-level2" placeholder="Es. Roma" required />
            </div>
          </div>

          <div class="row three">
            <div>
              <label for="gender" id="gender_lbl">Sesso</label>
              <select id="gender" required>
                <option value="" id="choose_g">Seleziona…</option>
                <option value="uomo"  id="gender_m">Uomo</option>
                <option value="donna" id="gender_f">Donna</option>
                <option value="altro" id="gender_o">Altro</option>
                <option value="non_specificato" id="gender_n">Preferisco non dirlo</option>
              </select>
            </div>
            <div>
              <label for="age" id="age_lbl">Età</label>
              <select id="age" required>
                <option value="" id="choose_a">Seleziona…</option>
                <option value="under18">-18</option>
                <option value="18_24">18–24</option>
                <option value="25_34">25–34</option>
                <option value="35_44">35–44</option>
                <option value="45_54">45–54</option>
                <option value="55_64">55–64</option>
                <option value="65_plus">65+</option>
              </select>
            </div>
            <div>
              <label for="role" id="role_lbl">Professione / Ruolo</label>
              <input id="role" type="text" placeholder="Es. Ingegnere di produzione" required />
            </div>
          </div>

          <div class="row">
            <div>
              <label for="goal" id="goal_lbl">Obiettivo principale</label>
              <input id="goal" type="text" placeholder="Es. cambiare lavoro entro 6 mesi" required />
            </div>
          </div>

          <div class="row">
            <div>
              <label for="more" id="more_lbl">Informazioni utili per risposte migliori <span id="more_hint" class="muted"></span></label>
              <textarea id="more" placeholder="Contesto, vincoli, preferenze… (min. 10 caratteri)" required minlength="10"></textarea>
            </div>
          </div>

          <div id="errorBox" class="error"></div>

          <div class="actions">
            <button type="button" class="btn" id="backBtn">← <span id="back_txt">Indietro</span></button>
            <button type="submit" class="btn primary" id="nextBtn"><span id="next_txt">Continua</span> →</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    // ==== Theme from prefs
    (function(){
      try{
        const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
      }catch{ document.documentElement.setAttribute('data-theme','whatif'); }
    })();

    const LS = localStorage;
    const $  = s=>document.querySelector(s);

    // ==== I18N
    const I18N = {
      it:{ title:"Parlami di te",
           blurb:"Compila tutti i campi. Li usiamo per personalizzare le risposte della AI.",
           name:"Nome e cognome", city:"Città",
           gender:"Sesso", choose:"Seleziona…", m:"Uomo", f:"Donna", o:"Altro", n:"Preferisco non dirlo",
           age:"Età", role:"Professione / Ruolo",
           goal:"Obiettivo principale",
           more:"Informazioni utili per risposte migliori", more_hint:"",
           back:"Indietro", next:"Continua",
           err_missing:"Compila tutti i campi richiesti.",
           err_more:"Aggiungi almeno 10 caratteri nelle informazioni utili." },
      en:{ title:"Tell me about you",
           blurb:"Fill in all fields. We use them to tailor the AI answers.",
           name:"Full name", city:"City",
           gender:"Sex", choose:"Choose…", m:"Male", f:"Female", o:"Other", n:"Prefer not to say",
           age:"Age", role:"Profession / Role",
           goal:"Main goal",
           more:"Useful details for better answers", more_hint:"",
           back:"Back", next:"Continue",
           err_missing:"Please complete all required fields.",
           err_more:"Please write at least 10 characters in the details." },
      es:{ title:"Háblame de ti",
           blurb:"Completa todos los campos. Los usamos para personalizar las respuestas de la IA.",
           name:"Nombre y apellido", city:"Ciudad",
           gender:"Sexo", choose:"Elige…", m:"Hombre", f:"Mujer", o:"Otro", n:"Prefiero no decirlo",
           age:"Edad", role:"Profesión / Rol",
           goal:"Objetivo principal",
           more:"Detalles útiles para mejores respuestas", more_hint:"",
           back:"Atrás", next:"Continuar",
           err_missing:"Completa todos los campos obligatorios.",
           err_more:"Escribe al menos 10 caracteres en los detalles." },
      fr:{ title:"Parle-moi de toi",
           blurb:"Renseigne tous les champs. Ils servent à personnaliser les réponses de l’IA.",
           name:"Nom et prénom", city:"Ville",
           gender:"Sexe", choose:"Choisir…", m:"Homme", f:"Femme", o:"Autre", n:"Préfère ne pas dire",
           age:"Âge", role:"Profession / Rôle",
           goal:"Objectif principal",
           more:"Détails utiles pour de meilleures réponses", more_hint:"",
           back:"Retour", next:"Continuer",
           err_missing:"Complète tous les champs requis.",
           err_more:"Ajoute au moins 10 caractères dans les détails." },
      de:{ title:"Erzähl mir von dir",
           blurb:"Bitte alle Felder ausfüllen. Wir nutzen sie für personalisierte KI-Antworten.",
           name:"Vor- und Nachname", city:"Stadt",
           gender:"Geschlecht", choose:"Wählen…", m:"Mann", f:"Frau", o:"Andere", n:"Möchte ich nicht sagen",
           age:"Alter", role:"Beruf / Rolle",
           goal:"Hauptziel",
           more:"Nützliche Angaben für bessere Antworten", more_hint:"",
           back:"Zurück", next:"Weiter",
           err_missing:"Bitte alle Pflichtfelder ausfüllen.",
           err_more:"Bitte mindestens 10 Zeichen bei den Angaben schreiben." }
    };

    function getLang(){ return (LS.getItem('lang') || (navigator.language||'it').slice(0,2)).toLowerCase(); }
    function setLang(l){ LS.setItem('lang', l); applyI18N(); }
    function applyI18N(){
      const L = I18N[getLang()] || I18N.it;
      document.documentElement.lang = getLang();

      $('#title').textContent = L.title;
      $('#blurb').textContent = L.blurb;

      $('#name_lbl').textContent = L.name;
      $('#city_lbl').textContent = L.city;
      $('#gender_lbl').textContent = L.gender;
      $('#choose_g').textContent = L.choose;
      $('#gender_m').textContent = L.m;
      $('#gender_f').textContent = L.f;
      $('#gender_o').textContent = L.o;
      $('#gender_n').textContent = L.n;

      $('#age_lbl').textContent = L.age;
      $('#choose_a').textContent = L.choose;

      $('#role_lbl').textContent = L.role;
      $('#goal_lbl').textContent = L.goal;

      $('#more_lbl').childNodes[0].nodeValue = L.more + ' ';
      $('#more_hint').textContent = L.more_hint;

      $('#backBtn').innerHTML = '← ' + L.back;
      $('#nextBtn').innerHTML = L.next + ' →';

      const err = $('#errorBox');
      err.dataset.errMissing = L.err_missing;
      err.dataset.errMore = L.err_more;
    }

    // init language select + apply
    (function(){
      const sel = $('#langSelect');
      const cur = getLang();
      sel.value = ['it','en','es','fr','de'].includes(cur) ? cur : 'it';
      sel.addEventListener('change', ()=> setLang(sel.value));
      if(!LS.getItem('lang')) LS.setItem('lang', sel.value);
      applyI18N();
    })();

    // topbar
    $('#backTop').addEventListener('click', ()=> history.back());
    $('#homeTop').addEventListener('click', ()=> location.href='index.html');
    $('#resetBtn').addEventListener('click', ()=>{
      if(!confirm('Reset profilo?')) return;
      ['whatif_profile','whatif_onboarding_done','whatif_last_update','whatif_profile_date'].forEach(k=>LS.removeItem(k));
      alert('Profilo azzerato.');
      location.reload();
    });

    // mapping gender -> sex normalizzato
    function mapGenderToSex(g){
      const v = String(g||'').toLowerCase();
      if(v==='uomo' || v==='male' || v==='mann') return 'm';
      if(v==='donna' || v==='female' || v==='frau') return 'f';
      if(v==='altro' || v==='other' ) return 'nb';
      return '';
    }

    // helper evidenzia invalidi
    function markInvalid(el){ el.classList.add('invalid'); setTimeout(()=>el.classList.remove('invalid'), 1800); }

    // submit
    $('#profileForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const err = $('#errorBox');
      err.classList.remove('show'); err.textContent='';

      const name  = $('#name');
      const city  = $('#city');
      const gender= $('#gender');
      const age   = $('#age');
      const role  = $('#role');
      const goal  = $('#goal');
      const more  = $('#more');

      const req = [name, city, gender, age, role, goal, more];
      let ok = true;
      req.forEach(el=>{
        const v = (el.tagName==='SELECT') ? el.value.trim() : el.value.trim();
        if(!v){ ok=false; markInvalid(el); }
      });
      if (more.value.trim().length < 10){ ok=false; markInvalid(more); }

      if(!ok){
        err.textContent = err.dataset.errMissing || 'Compila tutti i campi richiesti.';
        if(more.value.trim().length < 10){
          err.textContent = (err.dataset.errMore || 'Aggiungi almeno 10 caratteri nelle informazioni utili.');
        }
        err.classList.add('show'); return;
      }

      const profile = {
        name: name.value.trim(),
        city: city.value.trim(),
        gender: gender.value.trim(),
        sex: mapGenderToSex(gender.value.trim()), // 'm' | 'f' | 'nb' | ''
        age: age.value.trim(),
        role: role.value.trim(),
        goal: goal.value.trim(),
        more: more.value.trim()
      };
      LS.setItem('whatif_profile', JSON.stringify(profile));

      const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      LS.setItem('whatif_last_update', iso);
      if(!LS.getItem('whatif_profile_date')) LS.setItem('whatif_profile_date', iso);
      LS.setItem('whatif_onboarding_done','1');

      // vai alla pagina delle domande
      location.href = 'fourth.html';
    });

    // back (in fondo)
    $('#backBtn').addEventListener('click', ()=> history.back());
  </script>

  <!-- SW (facoltativo) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", ()=> {
        navigator.serviceWorker.register("/sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
