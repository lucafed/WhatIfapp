<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – About you</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0B0B0C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root{
      --bg:#0C0F14; --bg2:#0E1724;
      --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#001f26;
      --chip:#0f1820; --line:#1b2a34;
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724;
      --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0f1820; --line:#1b2a34;
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414;
      --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }

    .topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
    .back-btn,.home-btn,.reset-btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
    .lang-select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .blurb{color:#d7e8ec;margin:0 0 14px;font-size:clamp(14px,4vw,18px);line-height:1.45}

    .banner{display:none;background:#0b151d;border:1px dashed var(--line);color:#dff6fb;border-radius:14px;padding:12px;margin-bottom:8px}
    .first-session{display:none;background:#0e1a23;border:1px solid var(--line);color:#daf0f6;border-radius:14px;padding:12px;margin-bottom:8px}

    form{background:#0c141b;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;margin-top:10px}
    label{font-weight:700;margin-bottom:6px;display:block}
    .row{display:grid;gap:12px}
    @media (min-width:640px){ .row.two{grid-template-columns:1fr 1fr} .row.three{grid-template-columns:1fr 1fr 1fr} }
    select,input[type="text"],textarea{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
    textarea{min-height:110px;resize:vertical}
    .muted{color:var(--muted);font-size:13px}

    .divider{height:1px;background:var(--line);opacity:.7;margin:6px 0 2px}

    .actions{display:flex;gap:10px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
    .btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:#cfe6eb}
    .btn.ghost{background:#152029}
    .btn.primary{border:none;background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink)}
    .btn[disabled]{background:#2a3b45;color:#7f98a2;cursor:not-allowed}

    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;padding:10px 12px;display:none}
    .error.show{display:block}

    .micro{display:none;background:#0c141b;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
    .micro-q{margin:10px 0}
    .micro-q label{display:block;margin:0 0 6px}
    .micro-q input, .micro-q select{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;gap:8px;align-items:center">
      <button id="backTop" class="back-btn">←</button>
      <button id="homeTop" class="home-btn">🏠</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
      <button id="resetBtn" class="reset-btn">♻️ Reset profilo</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <div id="dailyBanner" class="banner"></div>
      <div id="firstSessionBanner" class="first-session"></div>

      <h1 id="title">Parlami di te</h1>
      <p class="blurb" id="blurb"></p>

      <div id="errorBox" class="error"></div>

      <!-- ================== FORM PRINCIPALE ================== -->
      <form id="aboutForm" novalidate>
        <!-- Identità & contesto -->
        <div class="row two">
          <div>
            <label for="name" id="name_lbl">Nome</label>
            <input id="name" type="text" placeholder="Es. Luca" />
          </div>
          <div>
            <label for="city" id="city_lbl">Città</label>
            <input id="city" type="text" placeholder="Es. L’Aquila / Verona" />
          </div>
        </div>

        <div class="row three">
          <div>
            <label for="gender" id="gender_lbl">Sesso</label>
            <select id="gender" required>
              <option value="" id="sel_choose">Seleziona…</option>
              <option value="uomo" id="gender_m">Uomo</option>
              <option value="donna" id="gender_f">Donna</option>
              <option value="altro" id="gender_o">Altro</option>
              <option value="non_specificato" id="gender_n">Preferisco non dirlo</option>
            </select>
          </div>
          <div>
            <label for="age" id="age_lbl">Età</label>
            <select id="age" required>
              <option value="" id="sel_choose2">Seleziona…</option>
              <option value="under18" id="age_u18">-18</option>
              <option value="18_24">18–24</option>
              <option value="25_34">25–34</option>
              <option value="35_44">35–44</option>
              <option value="45_54">45–54</option>
              <option value="55_64">55–64</option>
              <option value="65_plus">65+</option>
            </select>
          </div>
          <div>
            <label for="phase" id="phase_lbl">Fase attuale</label>
            <select id="phase" required>
              <option value="" id="sel_choose3">Seleziona…</option>
              <option value="studio" id="phase_study">Studio</option>
              <option value="lavoro" id="phase_work">Lavoro</option>
              <option value="cambio" id="phase_change">Cambio/Transizione</option>
              <option value="altro" id="phase_other">Altro</option>
            </select>
          </div>
        </div>

        <div class="row two">
          <div>
            <label for="who" id="who_lbl">Chi sei?</label>
            <input id="who" type="text" placeholder="Professione / Ruolo" />
          </div>
          <div>
            <label for="goal" id="goal_lbl">Obiettivo</label>
            <input id="goal" type="text" placeholder="Es. più equilibrio lavoro-vita" />
          </div>
        </div>

        <!-- Preferenze utili alla generazione -->
        <div class="divider"></div>
        <div class="row two">
          <div>
            <label for="time_window" id="tw_lbl">Finestra decisionale reale</label>
            <select id="time_window">
              <option value="">Seleziona…</option>
              <option value="this_month">Questo mese</option>
              <option value="3_6_months">3–6 mesi</option>
              <option value="12_months">~12 mesi</option>
            </select>
          </div>
          <div>
            <label for="success_indicator" id="si_lbl">Indicatore di successo</label>
            <input id="success_indicator" type="text" placeholder="Es. +€500/mese, 6h/sett. libere, primo cliente…" />
          </div>
        </div>

        <div class="row two">
          <div>
            <label for="risk_tolerance" id="rt_lbl">Tolleranza al rischio</label>
            <select id="risk_tolerance">
              <option value="">Seleziona…</option>
              <option value="low">Bassa</option>
              <option value="medium">Media</option>
              <option value="high">Alta</option>
            </select>
          </div>
          <div>
            <label for="landmark" id="lm_lbl">Luogo/persona di riferimento</label>
            <input id="landmark" type="text" placeholder="Es. Stazione, Piazza, quartiere, collega chiave…" />
          </div>
        </div>

        <!-- Domanda “relax” (solo pre-onboarding) -->
        <div id="unwindBox" class="micro" style="display:none">
          <div class="micro-q">
            <label for="unwindSel" id="unwind_lbl">Quando vuoi rilassarti dopo una giornata intensa, cosa preferisci fare?</label>
            <select id="unwindSel">
              <option value="" id="uw_opt_choose">Seleziona…</option>
              <option value="workout" id="uw_opt_workout">Allenarmi</option>
              <option value="friends" id="uw_opt_friends">Uscire con amici</option>
              <option value="series" id="uw_opt_series">Guardare una serie</option>
              <option value="drink" id="uw_opt_drink">Godermi un drink</option>
            </select>
          </div>
        </div>

        <div>
          <label for="more" id="more_lbl">
            Vuoi raccontarci qualcosa di più su di te?
            <span class="muted" id="more_hint">(opzionale – aiuta l’AI a darti risposte più accurate)</span>
          </label>
          <textarea id="more" placeholder=""></textarea>
        </div>

        <!-- ===== Micro-domande giornaliere (dal giorno dopo) ===== -->
        <div id="microBox" class="micro">
          <h3 style="margin:6px 0" id="micro_title">3 micro-domande di oggi</h3>
          <div class="micro-q">
            <label for="mq1" id="mq1_lbl">Qual è il vincolo più concreto nelle prossime 2 settimane?</label>
            <input id="mq1" type="text" />
          </div>
          <div class="micro-q">
            <label for="mq2" id="mq2_lbl">Che segnale ti dice che sei sulla strada giusta?</label>
            <input id="mq2" type="text" />
          </div>
          <div class="micro-q">
            <label for="mq3" id="mq3_lbl">Una persona/luogo che conta nel tuo scenario?</label>
            <input id="mq3" type="text" />
          </div>
          <div class="actions" style="justify-content:flex-end">
            <button type="button" class="btn ghost" id="microSkip">Salta</button>
            <button type="button" class="btn primary" id="microSave">Salva micro-dati</button>
          </div>
        </div>

        <!-- Azioni -->
        <div class="actions">
          <button type="button" class="btn ghost" id="backBtn">Indietro</button>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn ghost" id="skipBtn">Salta → domanda</button>
            <button type="submit" class="btn primary" id="nextBtn">Continua</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    /* ===== Tema dal prefs ===== */
    (function(){
      try{
        const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        const theme = prefs.stile === 'wtf' ? 'wtf' : 'whatif';
        document.documentElement.setAttribute('data-theme', theme);
      }catch{ document.documentElement.setAttribute('data-theme','whatif'); }
    })();
  </script>

    const LS = localStorage;
    const $ = s => document.querySelector(s);
    function getLang(){ return (LS.getItem('lang') || (navigator.language||'it').slice(0,2)).toLowerCase(); }
    function setLang(l){ LS.setItem('lang', l); applyI18N(); }

    function applyI18N(){
      const d = I18N[getLang()] || I18N.it;
      document.documentElement.lang = getLang();

      $('#title').textContent = d.title;
      $('#blurb').innerHTML = d.blurb;

      // topbar
      $('#backTop').textContent = '← ' + d.back;
      $('#homeTop').textContent = '🏠 ' + d.home;

      // labels
      $('#name_lbl').textContent = d.name_lbl;
      $('#city_lbl').textContent = d.city_lbl;

      $('#gender_lbl').textContent = d.gender_lbl;
      $('#sel_choose').textContent = d.choose;
      $('#gender_m').textContent = d.gender_m;
      $('#gender_f').textContent = d.gender_f;
      $('#gender_o').textContent = d.gender_o;
      $('#gender_n').textContent = d.gender_n;

      $('#age_lbl').textContent = d.age_lbl;
      $('#sel_choose2').textContent = d.choose;
      $('#age_u18').textContent = d.age_u18;

      $('#phase_lbl').textContent = d.phase_lbl;
      $('#sel_choose3').textContent = d.choose;
      $('#phase_study').textContent = d.phase_study;
      $('#phase_work').textContent = d.phase_work;
      $('#phase_change').textContent = d.phase_change;
      $('#phase_other').textContent = d.phase_other;

      $('#who_lbl').textContent = d.who_lbl;
      $('#goal_lbl').textContent = d.goal_lbl;

      // predittivo
      $('#tw_lbl').textContent = d.tw_lbl;
      $('#si_lbl').textContent = d.si_lbl;
      $('#rt_lbl').textContent = d.rt_lbl;
      $('#lm_lbl').textContent = d.lm_lbl;

      // blocco “more”
      $('#more_lbl').firstChild.textContent = d.more_lbl + ' ';
      $('#more_hint').textContent = d.more_hint;
      document.getElementById('more').placeholder = d.more_ph;

      // banner + micro
      $('#dailyBanner').innerHTML = d.banner;

      $('#micro_title').textContent = d.micro_title;
      $('#mq1_lbl').textContent = d.mq1;
      $('#mq2_lbl').textContent = d.mq2;
      $('#mq3_lbl').textContent = d.mq3;
      $('#microSave').textContent = d.micro_save;
      $('#microSkip').textContent = d.micro_skip;

      $('#backBtn').textContent = d.backBtn;
      $('#nextBtn').textContent = d.next;
      $('#skipBtn').textContent = d.skip;

      // error
      $('#aboutForm').dataset.err = d.err_required;
    }

    // init lingua + tema
    if (!LS.getItem('lang')) LS.setItem('lang', getLang());
    document.getElementById('langSelect').value = getLang();
    document.getElementById('langSelect').addEventListener('change', e=> setLang(e.target.value));
    applyI18N();

    (function(){
      try{
        const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
        const theme = prefs.stile === 'wtf' ? 'wtf' : 'whatif';
        document.documentElement.setAttribute('data-theme', theme);
      }catch{}
    })();

    // ===== Onboarding skip se già presente profilo base
    const KEY_ONBOARD = 'whatif_onboarding_done';
    function baseProfilePresent(){
      try{ const p = JSON.parse(LS.getItem('whatif_profile')||'{}'); return !!(p && (p.gender || p.sex) && p.age && p.phase); }catch{return false}
    }
    if (LS.getItem(KEY_ONBOARD)==='1' && baseProfilePresent()){
      location.replace('fourth.html');
    }

    // topbar
    document.getElementById('backTop').addEventListener('click', ()=> history.back());
    document.getElementById('homeTop').addEventListener('click', ()=> location.href='index.html');

    // Reset profilo
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(!confirm('Reset profilo e dati giornalieri?')) return;
      const keys = [
        'whatif_profile','whatif_micro','whatif_micro_log','whatif_last_update',
        'whatif_onboarding_done','whatif_daily_seen','whatif_clarify',
        'whatif_first_session_seen','whatif_profile_date'
      ];
      keys.forEach(k=>localStorage.removeItem(k));
      location.href='second.html';
    });

    // Helpers
    function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    const KEY_DAY = 'whatif_daily_seen';
    const today   = todayStr();

    function readJSON(k,def={}){ try{ return JSON.parse(LS.getItem(k)||JSON.stringify(def)); }catch{ return def; } }
    function daysBetween(iso1, iso2){
      if(!iso1||!iso2) return 999;
      const a=new Date(iso1), b=new Date(iso2);
      return Math.round((b-a)/(1000*60*60*24));
    }

    // Banner/micro: SOLO dal giorno dopo
    (function setupDailyBlocks(){
      const profDate = LS.getItem('whatif_profile_date');
      const onboard = LS.getItem(KEY_ONBOARD)==='1';
      const showDaily = (() => {
        if (!onboard || !profDate) return false;
        const gap = daysBetween(profDate, today);
        return gap >= 1;
      })();

      if (showDaily){
        document.getElementById('dailyBanner').style.display = 'block';
        document.getElementById('microBox').style.display = 'block';
        if (LS.getItem(KEY_DAY) === today){
          document.getElementById('dailyBanner').style.display = 'none';
        }
      } else {
        document.getElementById('dailyBanner').style.display = 'none';
        document.getElementById('microBox').style.display = 'none';
      }

      // relax solo pre-onboarding
      if (LS.getItem(KEY_ONBOARD)!=='1'){
        const uwBox = document.getElementById('unwindBox');
        if (uwBox) uwBox.style.display = 'block';
      }
    })();

    // micro actions
    document.getElementById('microSkip').addEventListener('click', ()=>{
      document.getElementById('dailyBanner').style.display='none';
      document.getElementById('microBox').style.display='none';
      LS.setItem(KEY_DAY, today);
    });

    document.getElementById('microSave').addEventListener('click', ()=>{
      const patch = {};
      const v1 = document.getElementById('mq1').value.trim(); if (v1) patch['vincolo_2w'] = v1;
      const v2 = document.getElementById('mq2').value.trim(); if (v2) patch['indicatore'] = v2;
      const v3 = document.getElementById('mq3').value.trim(); if (v3) patch['punto_riferimento'] = v3;

      const micro = readJSON('whatif_micro');
      Object.assign(micro, patch);
      LS.setItem('whatif_micro', JSON.stringify(micro));

      const log = readJSON('whatif_micro_log',[]);
      if (!log.includes(today)) log.push(today);
      LS.setItem('whatif_micro_log', JSON.stringify(log));
      LS.setItem('whatif_last_update', today);

      document.getElementById('dailyBanner').style.display='none';
      document.getElementById('microBox').style.display='none';
      LS.setItem(KEY_DAY, today);
    });

    // back / skip
    document.getElementById('backBtn').addEventListener('click', ()=> history.back());
    document.getElementById('skipBtn').addEventListener('click', ()=>{
      const base = JSON.parse(LS.getItem('whatif_profile')||'{}');
      if (!(base.gender || base.sex) || !base.age || !base.phase) {
        alert(getLang()==='en'
          ? 'Fill basic profile once before skipping.'
          : (getLang()==='es' ? 'Completa el perfil básico una vez antes de saltar.'
          : (getLang()==='fr' ? 'Renseigne le profil de base au moins une fois.'
          : (getLang()==='de' ? 'Bitte fülle einmal das Basisprofil aus.'
          : 'Compila una volta il profilo base prima di saltare.'))));
        return;
      }
      const firstDone = LS.getItem('whatif_quiz5_done') === '1';
      location.href = firstDone ? 'fourth.html' : 'third.html';
    });

    // Preload form
    (function preload(){
      try{
        const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
        if (!p) return;
        let gval = p.gender || "";
        if (!gval && p.sex){
          if (p.sex === 'm') gval = 'uomo';
          else if (p.sex === 'f') gval = 'donna';
          else if (p.sex === 'nb') gval = 'altro';
          else gval = 'non_specificato';
        }
        if (p.name) $('#name').value = p.name;
        if (p.city) $('#city').value = p.city;
        if (gval)   $('#gender').value = gval;
        if (p.age)  $('#age').value = p.age;
        if (p.phase)$('#phase').value = p.phase;
        if (p.role) $('#who').value = p.role;
        if (p.goal) $('#goal').value = p.goal;
        if (p.more) $('#more').value = p.more;
        if (p.time_window)       $('#time_window').value = p.time_window;
        if (p.success_indicator) $('#success_indicator').value = p.success_indicator;
        if (p.risk_tolerance)    $('#risk_tolerance').value = p.risk_tolerance;
        if (p.landmark)          $('#landmark').value = p.landmark;
        if (p.unwind)            $('#unwindSel').value = p.unwind;
      }catch(e){}
    })();

    // submit
    const form = document.getElementById('aboutForm');
    const errBox = document.getElementById('errorBox');

    function mapGenderToSex(g){
      switch(String(g||'').toLowerCase()){
        case 'uomo': return 'm';
        case 'donna': return 'f';
        case 'altro': return 'nb';
        default: return '';
      }
    }
    function todayIso(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const gender = $('#gender').value.trim();
      const age    = $('#age').value.trim();
      const phase  = $('#phase').value.trim();
      if(!gender || !age || !phase){
        errBox.textContent = form.dataset.err;
        errBox.classList.add('show'); return;
      }
      errBox.classList.remove('show');

      const sex = mapGenderToSex(gender);

      const profile = {
        name: $('#name').value.trim(),
        city: $('#city').value.trim(),
        gender, sex, age, phase,
        role: $('#who').value.trim(),
        goal: $('#goal').value.trim(),
        unwind: $('#unwindSel').value.trim(),
        drinks_pref: ($('#unwindSel').value === 'drink') ? 'yes' : 'no',
        time_window: $('#time_window').value.trim(),
        success_indicator: $('#success_indicator').value.trim(),
        risk_tolerance: $('#risk_tolerance').value.trim(),
        landmark: $('#landmark').value.trim(),
        more: $('#more').value.trim()
      };

      LS.setItem('whatif_profile', JSON.stringify(profile));

      const t = todayIso();
      LS.setItem('whatif_last_update', t);
      if (!LS.getItem('whatif_profile_date')) LS.setItem('whatif_profile_date', t);
      LS.setItem('whatif_onboarding_done','1');

      const firstDone = LS.getItem('whatif_quiz5_done') === '1';
      location.href = firstDone ? 'fourth.html' : 'third.html';
    });

    // sync lingua
    window.addEventListener('storage', (e)=>{ if(e.key==='lang'){ applyI18N(); }});
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ applyI18N(); }});
  </script>

  <!-- SW -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
