<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Parlami di te</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{--bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#00E0FF;--accent-dark:#00B5CC;--ink:#001F26}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
      padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
    .btn{appearance:none;border:1px solid #1f2c36;background:#0f1820;color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
    .btn.primary{border:none;background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:var(--ink)}
    .btn.ghost{background:transparent}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px)}
    .blurb{color:#d7e8ec;margin:0 0 14px;font-size:clamp(14px,4vw,18px);line-height:1.45}
    form{background:#0c141b;border:1px solid #1b2831;border-radius:16px;padding:14px;display:grid;gap:12px}
    label{font-weight:700;margin-bottom:6px;display:block}
    .row{display:grid;gap:12px}
    @media (min-width:640px){ .row.two{grid-template-columns:1fr 1fr} .row.three{grid-template-columns:1fr 1fr 1fr} }
    select,input[type="text"],textarea{width:100%;background:#0f1820;color:var(--fg);border:1px solid #1f2c36;border-radius:12px;padding:12px;font-size:16px}
    textarea{min-height:110px;resize:vertical}
    .muted{color:var(--muted);font-size:13px}
    .actions{display:flex;gap:10px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;padding:10px 12px;display:none}
    .error.show{display:block}
    .ok{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#0e1820;border:1px solid #1e2a34;color:#cfe6eb;padding:8px 12px;border-radius:10px;display:none}
    .ok.show{display:block}
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;gap:8px;align-items:center">
      <button id="backTop" class="btn">← <span data-key="back">Indietro</span></button>
      <button class="btn" onclick="location.href='index.html'">🏠 <span data-key="home">Home</span></button>
    </div>
    <div style="display:flex;gap:8px">
      <button id="skipTop" class="btn ghost">⏭️ <span data-key="skip">Salta</span></button>
      <button id="clearTop" class="btn ghost">🧹 <span data-key="clear">Pulisci</span></button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 data-key="title">Parlami di te</h1>
      <p class="blurb" data-key="blurb">
        Raccontami brevemente chi sei, cosa stai vivendo o cosa ti spinge a usare What?f.
        I dati vengono salvati sul dispositivo e precompilati la prossima volta.
      </p>

      <div id="errorBox" class="error"></div>

      <form id="aboutForm" novalidate>
        <div class="row three">
          <div>
            <label for="gender" data-key="gender_lbl">Sesso</label>
            <select id="gender" required>
              <option value="" data-key="sel_choose">Seleziona…</option>
              <option value="uomo" data-key="gender_m">Uomo</option>
              <option value="donna" data-key="gender_f">Donna</option>
              <option value="altro" data-key="gender_o">Altro</option>
              <option value="non_specificato" data-key="gender_n">Preferisco non dirlo</option>
            </select>
          </div>
          <div>
            <label for="age" data-key="age_lbl">Età</label>
            <select id="age" required>
              <option value="" data-key="sel_choose">Seleziona…</option>
              <option value="under18" data-key="age_u18">-18</option>
              <option value="18_24">18–24</option>
              <option value="25_34">25–34</option>
              <option value="35_44">35–44</option>
              <option value="45_54">45–54</option>
              <option value="55_64">55–64</option>
              <option value="65_plus">65+</option>
            </select>
          </div>
          <div>
            <label for="phase" data-key="phase_lbl">Fase attuale</label>
            <select id="phase" required>
              <option value="" data-key="sel_choose">Seleziona…</option>
              <option value="studio" data-key="phase_study">Studio</option>
              <option value="lavoro" data-key="phase_work">Lavoro</option>
              <option value="cambio" data-key="phase_change">Cambio/Transizione</option>
              <option value="altro" data-key="phase_other">Altro</option>
            </select>
          </div>
        </div>

        <div class="row two">
          <div>
            <label for="where" data-key="where_lbl">Da dove vieni?</label>
            <input id="where" type="text" placeholder="Città / Paese" data-ph="where_ph" />
          </div>
          <div>
            <label for="who" data-key="who_lbl">Chi sei?</label>
            <input id="who" type="text" placeholder="Professione / Ruolo" data-ph="who_ph" />
          </div>
        </div>

        <div>
          <label for="more" data-key="more_lbl">
            Vuoi raccontarci qualcosa di più su di te?
            <span class="muted" data-key="more_hint">(opzionale – aiuta l’AI a darti risposte più accurate)</span>
          </label>
          <textarea id="more" data-ph="more_ph" placeholder="Esempio: lavoro nel digitale, sto pensando di cambiare città, ho due figli…"></textarea>
        </div>

        <div class="actions">
          <div style="display:flex;gap:8px">
            <button type="button" class="btn" id="backBtn" data-key="back">Indietro</button>
            <button type="button" class="btn ghost" id="skipBtn" data-key="skip">Salta</button>
          </div>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn ghost" id="clearBtn" data-key="clear">Pulisci</button>
            <button type="submit" class="btn primary" id="nextBtn" data-key="next">Continua</button>
          </div>
        </div>
        <p class="muted" style="margin:6px 0 0">🔒 I tuoi dati restano sul dispositivo (local-only). Puoi esportarli o cancellarli in qualsiasi momento.</p>
      </form>
    </div>
  </main>

  <div id="toast" class="ok">✓ Salvato</div>

  <script>
    // I18N
    const I18N = {
      it:{title:"Parlami di te", blurb:"Raccontami brevemente chi sei, cosa stai vivendo o cosa ti spinge a usare What?f. I dati vengono salvati sul dispositivo e precompilati la prossima volta.",
          gender_lbl:"Sesso", sel_choose:"Seleziona…", gender_m:"Uomo", gender_f:"Donna", gender_o:"Altro", gender_n:"Preferisco non dirlo",
          age_lbl:"Età", age_u18:"-18",
          phase_lbl:"Fase attuale", phase_study:"Studio", phase_work:"Lavoro", phase_change:"Cambio/Transizione", phase_other:"Altro",
          where_lbl:"Da dove vieni?", where_ph:"Città / Paese",
          who_lbl:"Chi sei?", who_ph:"Professione / Ruolo",
          more_lbl:"Vuoi raccontarci qualcosa di più su di te?", more_hint:"(opzionale – aiuta l’AI a darti risposte più accurate)", more_ph:"Esempio: lavoro nel digitale, sto pensando di cambiare città, ho due figli…",
          back:"Indietro", next:"Continua", home:"Home", skip:"Salta", clear:"Pulisci",
          err_required:"Per continuare seleziona Sesso, Età e Fase."},
      en:{title:"Tell me about you", blurb:"Briefly share who you are, what you’re going through or why you’re using What?f. Your data is saved locally and prefilled next time.",
          gender_lbl:"Gender", sel_choose:"Choose…", gender_m:"Male", gender_f:"Female", gender_o:"Other", gender_n:"Prefer not to say",
          age_lbl:"Age", age_u18:"-18",
          phase_lbl:"Current phase", phase_study:"Studying", phase_work:"Working", phase_change:"Changing/Transition", phase_other:"Other",
          where_lbl:"Where are you from?", where_ph:"City / Country",
          who_lbl:"Who are you?", who_ph:"Profession / Role",
          more_lbl:"Want to tell us more about you?", more_hint:"(optional – helps the AI give more accurate answers)", more_ph:"Example: I work in tech, I’m thinking about moving city, I have two kids…",
          back:"Back", next:"Continue", home:"Home", skip:"Skip", clear:"Clear",
          err_required:"To continue please select Gender, Age and Phase."}
    };
    const LS = localStorage;
    function getLang(){ return LS.getItem('lang') || 'it'; }
    function tSet(){
      const d = I18N[getLang()] || I18N.it;
      document.documentElement.lang = getLang();
      document.querySelectorAll('[data-key]').forEach(el=>{
        const k=el.getAttribute('data-key'); if(d[k]) el.textContent=d[k];
      });
      document.querySelectorAll('[data-ph]').forEach(el=>{
        const k=el.getAttribute('data-ph'); if(d[k]) el.setAttribute('placeholder', d[k]);
      });
    }
    tSet();

    // helpers
    const $ = s => document.querySelector(s);
    const toast = (msg)=>{
      const t = document.getElementById('toast'); t.textContent = msg || (getLang()==='en'?'Saved':'✓ Salvato');
      t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1200);
    };

    const form   = document.getElementById('aboutForm');
    const errBox = document.getElementById('errorBox');
    const fields = {
      gender: $('#gender'), age: $('#age'), phase: $('#phase'),
      where: $('#where'), who: $('#who'), more: $('#more')
    };

    // Prefill da localStorage
    (function prefill(){
      try{
        const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
        if (p.gender) fields.gender.value = p.gender;
        if (p.age)    fields.age.value    = p.age;
        if (p.phase)  fields.phase.value  = p.phase;
        if (p.where)  fields.where.value  = p.where;
        if (p.who)    fields.who.value    = p.who;
        if (p.more)   fields.more.value   = p.more;
      }catch(e){}
    })();

    // Autosave ad ogni modifica
    function saveProfile(showToast=false){
      const profile = {
        gender: fields.gender.value.trim(),
        age:    fields.age.value.trim(),
        phase:  fields.phase.value.trim(),
        where:  fields.where.value.trim(),
        who:    fields.who.value.trim(),
        more:   fields.more.value.trim()
      };
      LS.setItem('whatif_profile', JSON.stringify(profile));
      if (showToast) toast();
    }
    Object.values(fields).forEach(el=>{
      el.addEventListener('change', ()=>saveProfile(true));
      if (el.tagName==='INPUT' || el.tagName==='TEXTAREA'){
        el.addEventListener('blur', ()=>saveProfile());
      }
    });

    // Skip: se già presenti base (gender+age+phase), vai avanti
    function canSkip(){
      const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
      return !!(p.gender && p.age && p.phase);
    }
    const onSkip = ()=>{
      if (canSkip()) location.href='fourth.html';
      else {
        const d = I18N[getLang()];
        alert(getLang()==='en'
          ? 'Please fill Gender, Age and Phase at least once, then you can skip next times.'
          : 'Compila almeno Sesso, Età e Fase una volta: poi potrai saltare.');
      }
    };

    document.getElementById('skipBtn').addEventListener('click', onSkip);
    document.getElementById('skipTop').addEventListener('click', onSkip);

    // Clear: pulisce i campi e il profilo salvato
    function clearAll(){
      Object.values(fields).forEach(el=>el.value='');
      LS.removeItem('whatif_profile');
      toast(getLang()==='en'?'Cleared':'Pulito');
    }
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('clearTop').addEventListener('click', clearAll);

    // Navigazione
    document.getElementById('backTop').addEventListener('click', ()=> history.back());
    document.getElementById('backBtn').addEventListener('click', ()=> history.back());

    // Submit
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const d = I18N[getLang()];
      const gender = fields.gender.value.trim();
      const age    = fields.age.value.trim();
      const phase  = fields.phase.value.trim();
      if(!gender || !age || !phase){
        errBox.textContent = d.err_required;
        errBox.classList.add('show'); return;
      }
      errBox.classList.remove('show');
      saveProfile();          // salva comunque lo stato aggiornato
      location.href = 'fourth.html';
    });

    // sync lingua quando cambia in un’altra scheda
    window.addEventListener('storage', (e)=>{ if(e.key==='lang'){ tSet(); }});
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tSet(); });
  </script>
</body>
</html>
