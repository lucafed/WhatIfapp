<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Parlami di te</title>
  <meta name="theme-color" content="#0A0F14" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root{--bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#00E0FF;--accent-dark:#00B5CC}
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:920px;margin:0 auto;padding:14px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .back{background:#0f1820;border:1px solid #22313a;color:#cfe6eb;border-radius:12px;padding:8px 12px;cursor:pointer}
    .thumb{width:86px;height:86px;border-radius:14px;overflow:hidden;background:#0c141b;display:flex;align-items:center;justify-content:center}
    .thumb img{max-width:100%;height:auto;display:block}
    h1{margin:6px 0 12px;font-size:clamp(28px,6vw,42px);letter-spacing:.5px}
    .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
    .row{display:flex;flex-wrap:wrap;gap:10px}
    .chip{background:#17212a;color:#cfe6eb;border:none;border-radius:16px;padding:12px 16px;font-weight:700;cursor:pointer}
    .chip.selected{background:linear-gradient(180deg,#00bcd4,#00E0FF);color:#002329}
    .cta{display:block;margin:10px auto 0;background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329;
      font-weight:900;border:none;border-radius:24px;padding:12px 18px;min-width:210px;box-shadow:0 0 14px rgba(0,181,204,.5)}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <button id="backBtn" class="back">← Indietro</button>
      <div class="thumb"><img id="hero" alt="Porte" loading="eager" decoding="async" /></div>
    </div>

    <h1><span style="color:var(--accent)">Parlami</span> di te</h1>

    <div class="card">
      <h3>Chi sei?</h3>
      <div class="row" id="who">
        <button class="chip" data-k="who" data-v="studente">Studente</button>
        <button class="chip" data-k="who" data-v="lavoratore">Lavoratore</button>
        <button class="chip" data-k="who" data-v="creativo">Creativo</button>
      </div>
    </div>

    <div class="card">
      <h3>Sesso</h3>
      <div class="row" id="sex">
        <button class="chip" data-k="sex" data-v="femmina">Femmina</button>
        <button class="chip" data-k="sex" data-v="maschio">Maschio</button>
        <button class="chip" data-k="sex" data-v="altro">Altro</button>
        <button class="chip" data-k="sex" data-v="nd">Preferisco non dirlo</button>
      </div>
    </div>

    <div class="card">
      <h3>Età</h3>
      <div class="row" id="age">
        <button class="chip" data-k="age" data-v="<18">&lt;18</button>
        <button class="chip" data-k="age" data-v="18-25">18–25</button>
        <button class="chip" data-k="age" data-v="26-35">26–35</button>
        <button class="chip" data-k="age" data-v=">35">&gt;35</button>
      </div>
    </div>

    <div class="card">
      <h3>In quale fase ti trovi?</h3>
      <div class="row" id="phase">
        <button class="chip" data-k="phase" data-v="studio">Studio</button>
        <button class="chip" data-k="phase" data-v="carriera">Carriera</button>
        <button class="chip" data-k="phase" data-v="relazioni">Relazioni</button>
      </div>
    </div>

    <button id="next" class="cta">Continua</button>
  </main>

  <script>
    // immagine piccola
    (async function(){
      const el=document.getElementById('hero');
      const tries=['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for(const u of tries){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ el.src=u+'?v='+Date.now(); return; } }catch{} }
      el.alt='Immagine non trovata';
    })();

    // chips -> salva in localStorage
    function wire(id){
      const g=document.getElementById(id);
      g.addEventListener('click',e=>{
        const b=e.target.closest('.chip'); if(!b) return;
        g.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        const st=JSON.parse(localStorage.getItem('profile')||'{}');
        st[b.dataset.k]=b.dataset.v;
        localStorage.setItem('profile',JSON.stringify(st));
      });
    }
    ['who','sex','age','phase'].forEach(wire);

    // back esplicito
    document.getElementById('backBtn').addEventListener('click',()=>{ location.href='/index.html'; });

    document.getElementById('next').addEventListener('click',()=>{ location.href='/fourth.html'; });

    // anti-bfcache
    window.addEventListener('pageshow',e=>{ if(e.persisted) location.reload(); });
  </script>
</body>
</html>
