<!doctype html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Profilo</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0B0B0C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root{
      --bg:#0C0F14; --bg2:#0E1724;
      --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#001f26;
      --chip:#0f1820; --line:#1b2a34;
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724;
      --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0f1820; --line:#1b2a34;
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414;
      --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }

    /* Topbar */
    .topbar{
      position:sticky;top:0;z-index:2;
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;padding:8px 10px;
      background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0));
      flex-wrap:wrap;
    }
    .left, .right {display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{
      appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer
    }
    .lang{
      appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);
      padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer
    }

    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 14px 26px}
    .wrap{width:min(100%,820px)}
    h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .blurb{color:#d7e8ec;margin:0 0 14px;font-size:clamp(14px,4vw,18px);line-height:1.45}

    .card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0}
    .row{display:grid;gap:12px}
    @media (min-width:640px){ .row.two{grid-template-columns:1fr 1fr} .row.three{grid-template-columns:1fr 1fr 1fr} }
    label{font-weight:800;margin-bottom:6px;display:block}
    input,select,textarea{
      width:100%;background:var(--chip);color:var(--fg);
      border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px
    }
    textarea{min-height:110px;resize:vertical}
    input::placeholder, textarea::placeholder{color:#98aab5}

    .actions{display:flex;gap:10px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
    .primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none}
    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;padding:10px 12px;display:none;margin-top:8px}

    footer{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="left">
      <button id="backTop" class="btn" type="button" aria-label="Back">←</button>
      <button id="homeTop" class="btn" type="button" aria-label="Home">🏠</button>
    </div>
    <div class="right">
      <select id="langSelect" class="lang" aria-label="Language">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
      <button id="resetBtn" class="btn" type="button" title="Reset">♻️</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="title">Parlami di te</h1>
      <p class="blurb" id="blurb">Compila questi campi: serviranno all’AI per darti risposte davvero su misura.</p>

      <div class="card">
        <form id="aboutForm" novalidate>
          <!-- Base obbligatoria -->
          <div class="row two">
            <div>
              <label for="name" id="name_lbl">Nome</label>
              <input id="name" type="text" placeholder="Es. Marco" required />
            </div>
            <div>
              <label for="city" id="city_lbl">Città</label>
              <input id="city" type="text" placeholder="Es. Roma" required />
            </div>
          </div>

          <div class="row three">
            <div>
              <label for="gender" id="gender_lbl">Sesso</label>
              <select id="gender" required>
                <option value="" id="sel_choose">Seleziona…</option>
                <option value="uomo" id="gender_m">Uomo</option>
                <option value="donna" id="gender_f">Donna</option>
                <option value="altro" id="gender_o">Altro</option>
                <option value="non_specificato" id="gender_n">Preferisco non dirlo</option>
              </select>
            </div>
            <div>
              <label for="age" id="age_lbl">Età</label>
              <select id="age" required>
                <option value="" id="sel_choose2">Seleziona…</option>
                <option value="under18" id="age_u18">-18</option>
                <option value="18_24">18–24</option>
                <option value="25_34">25–34</option>
                <option value="35_44">35–44</option>
                <option value="45_54">45–54</option>
                <option value="55_64">55–64</option>
                <option value="65_plus">65+</option>
              </select>
            </div>
            <div>
              <label for="phase" id="phase_lbl">Fase</label>
              <select id="phase" required>
                <option value="" id="sel_choose3">Seleziona…</option>
                <option value="studio" id="phase_study">Studio</option>
                <option value="lavoro" id="phase_work">Lavoro</option>
                <option value="cambio" id="phase_change">Cambio/Transizione</option>
                <option value="altro" id="phase_other">Altro</option>
              </select>
            </div>
          </div>

          <div class="row two">
            <div>
              <label for="who" id="who_lbl">Ruolo/Professione</label>
              <input id="who" type="text" placeholder="Es. ingegnere, infermiera, studente…" required />
            </div>
            <div>
              <label for="goal" id="goal_lbl">Obiettivo</label>
              <input id="goal" type="text" placeholder="Es. miglior equilibrio lavoro-vita" required />
            </div>
          </div>

          <!-- Opzionale: Parla di te -->
          <div class="row">
            <div>
              <label for="about" id="about_lbl">Parla di te <span id="about_opt">(opzionale)</span></label>
              <textarea id="about" placeholder="Es. che lavoro fai nello specifico, interessi, vincoli, routine, famiglia, orari…"></textarea>
            </div>
          </div>

          <div id="errorBox" class="error"></div>

          <div class="actions">
            <button type="button" id="backBtn" class="btn">← Indietro</button>
            <button type="submit" id="nextBtn" class="btn primary">Continua →</button>
          </div>
        </form>
      </div>

      <footer>© What?f</footer>
    </div>
  </main>

  <script>
    /* ===== Theme from prefs ===== */
    (function(){
      try{
        const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
      }catch{ document.documentElement.setAttribute('data-theme','whatif'); }
    })();
  </script>

  <script>
    /* ================= I18N ================= */
    const I18N = {
      it:{ title:"Parlami di te",
           blurb:"Compila questi campi: serviranno all’AI per darti risposte davvero su misura.",
           back:"Indietro", home:"Home", reset:"Reset",
           name_lbl:"Nome", city_lbl:"Città",
           name_ph:"Es. Marco", city_ph:"Es. Roma",
           gender_lbl:"Sesso", choose:"Seleziona…", gender_m:"Uomo", gender_f:"Donna", gender_o:"Altro", gender_n:"Preferisco non dirlo",
           age_lbl:"Età", age_u18:"-18",
           phase_lbl:"Fase", phase_study:"Studio", phase_work:"Lavoro", phase_change:"Cambio/Transizione", phase_other:"Altro",
           who_lbl:"Ruolo/Professione", goal_lbl:"Obiettivo",
           who_ph:"Es. ingegnere, infermiera, studente…",
           goal_ph:"Es. miglior equilibrio lavoro-vita",
           about_lbl:"Parla di te", about_opt:"(opzionale)",
           about_ph:"Es. che lavoro fai nello specifico, interessi, vincoli, routine, famiglia, orari…",
           err_required:"Compila tutti i campi obbligatori (Nome, Città, Sesso, Età, Fase, Ruolo, Obiettivo).",
           next:"Continua →"
      },
      en:{ title:"Tell me about you",
           blurb:"Fill these fields so the AI can tailor answers to you.",
           back:"Back", home:"Home", reset:"Reset",
           name_lbl:"Name", city_lbl:"City",
           name_ph:"e.g. Mark", city_ph:"e.g. Rome",
           gender_lbl:"Gender", choose:"Choose…", gender_m:"Male", gender_f:"Female", gender_o:"Other", gender_n:"Prefer not to say",
           age_lbl:"Age", age_u18:"-18",
           phase_lbl:"Phase", phase_study:"Studying", phase_work:"Working", phase_change:"Changing/Transition", phase_other:"Other",
           who_lbl:"Role/Profession", goal_lbl:"Goal",
           who_ph:"e.g. engineer, nurse, student…",
           goal_ph:"e.g. better work-life balance",
           about_lbl:"Tell us more about you", about_opt:"(optional)",
           about_ph:"e.g. specifics of your work, interests, constraints, routines, family, hours…",
           err_required:"Please fill all required fields (Name, City, Gender, Age, Phase, Role, Goal).",
           next:"Continue →"
      },
      es:{ title:"Háblame de ti",
           blurb:"Completa estos campos para que la IA adapte las respuestas a ti.",
           back:"Atrás", home:"Inicio", reset:"Reset",
           name_lbl:"Nombre", city_lbl:"Ciudad",
           name_ph:"p. ej., Marco", city_ph:"p. ej., Roma",
           gender_lbl:"Sexo", choose:"Seleccionar…", gender_m:"Hombre", gender_f:"Mujer", gender_o:"Otro", gender_n:"Prefiero no decirlo",
           age_lbl:"Edad", age_u18:"-18",
           phase_lbl:"Fase", phase_study:"Estudios", phase_work:"Trabajo", phase_change:"Cambio/Transición", phase_other:"Otro",
           who_lbl:"Rol/Profesión", goal_lbl:"Objetivo",
           who_ph:"p. ej., ingeniero, enfermera, estudiante…",
           goal_ph:"p. ej., mejor equilibrio vida-trabajo",
           about_lbl:"Cuéntanos más de ti", about_opt:"(opcional)",
           about_ph:"p. ej., trabajo específico, intereses, restricciones, rutinas, familia, horarios…",
           err_required:"Completa todos los campos obligatorios (Nombre, Ciudad, Sexo, Edad, Fase, Rol, Objetivo).",
           next:"Continuar →"
      },
      fr:{ title:"Parle-moi de toi",
           blurb:"Renseigne ces champs pour que l’IA adapte vraiment ses réponses.",
           back:"Retour", home:"Accueil", reset:"Reset",
           name_lbl:"Prénom", city_lbl:"Ville",
           name_ph:"ex. Marc", city_ph:"ex. Rome",
           gender_lbl:"Sexe", choose:"Choisir…", gender_m:"Homme", gender_f:"Femme", gender_o:"Autre", gender_n:"Préférer ne pas dire",
           age_lbl:"Âge", age_u18:"-18",
           phase_lbl:"Phase", phase_study:"Études", phase_work:"Travail", phase_change:"Changement/Transition", phase_other:"Autre",
           who_lbl:"Rôle/Profession", goal_lbl:"Objectif",
           who_ph:"ex. ingénieur, infirmière, étudiant…",
           goal_ph:"ex. meilleur équilibre vie-travail",
           about_lbl:"Parle de toi", about_opt:"(optionnel)",
           about_ph:"ex. ton travail précis, centres d’intérêt, contraintes, routines, famille, horaires…",
           err_required:"Renseigne tous les champs obligatoires (Prénom, Ville, Sexe, Âge, Phase, Rôle, Objectif).",
           next:"Continuer →"
      },
      de:{ title:"Erzähl mir von dir",
           blurb:"Fülle diese Felder aus, damit die KI Antworten auf dich zuschneidet.",
           back:"Zurück", home:"Start", reset:"Reset",
           name_lbl:"Name", city_lbl:"Stadt",
           name_ph:"z. B. Marco", city_ph:"z. B. Rom",
           gender_lbl:"Geschlecht", choose:"Auswählen…", gender_m:"Mann", gender_f:"Frau", gender_o:"Anderes", gender_n:"Möchte ich nicht sagen",
           age_lbl:"Alter", age_u18:"-18",
           phase_lbl:"Phase", phase_study:"Studium", phase_work:"Arbeit", phase_change:"Wechsel/Übergang", phase_other:"Sonstiges",
           who_lbl:"Rolle/Beruf", goal_lbl:"Ziel",
           who_ph:"z. B. Ingenieur, Krankenschwester, Student…",
           goal_ph:"z. B. bessere Work-Life-Balance",
           about_lbl:"Erzähl mehr über dich", about_opt:"(optional)",
           about_ph:"z. B. genaue Tätigkeit, Interessen, Einschränkungen, Routinen, Familie, Zeiten…",
           err_required:"Bitte alle Pflichtfelder ausfüllen (Name, Stadt, Geschlecht, Alter, Phase, Rolle, Ziel).",
           next:"Weiter →"
      }
    };

    const LS = localStorage;
    const $ = s=>document.querySelector(s);

    function getLang(){
      return (LS.getItem('lang') || (navigator.language||'it').slice(0,2)).toLowerCase();
    }
    function setLang(l){
      LS.setItem('lang', l);
      applyI18N();
    }
    function applyI18N(){
      const L = getLang(); const d = I18N[L] || I18N.it;
      document.documentElement.lang = L;

      $('#title').textContent = d.title;
      $('#blurb').textContent = d.blurb;

      $('#name_lbl').textContent = d.name_lbl;
      $('#city_lbl').textContent = d.city_lbl;
      $('#name').placeholder = d.name_ph;
      $('#city').placeholder = d.city_ph;

      $('#gender_lbl').textContent = d.gender_lbl;
      $('#sel_choose').textContent = d.choose;
      $('#gender_m').textContent = d.gender_m;
      $('#gender_f').textContent = d.gender_f;
      $('#gender_o').textContent = d.gender_o;
      $('#gender_n').textContent = d.gender_n;

      $('#age_lbl').textContent = d.age_lbl;
      $('#sel_choose2').textContent = d.choose;
      $('#age_u18').textContent = d.age_u18;

      $('#phase_lbl').textContent = d.phase_lbl;
      $('#sel_choose3').textContent = d.choose;
      $('#phase_study').textContent = d.phase_study;
      $('#phase_work').textContent = d.phase_work;
      $('#phase_change').textContent = d.phase_change;
      $('#phase_other').textContent = d.phase_other;

      $('#who_lbl').textContent = d.who_lbl;
      $('#goal_lbl').textContent = d.goal_lbl;
      $('#who').placeholder = d.who_ph;
      $('#goal').placeholder = d.goal_ph;

      // Scheda opzionale
      $('#about_lbl').firstChild.textContent = d.about_lbl + ' ';
      $('#about_opt').textContent = d.about_opt;
      $('#about').placeholder = d.about_ph;

      // CTA
      $('#nextBtn').textContent = d.next;
      // **FIX**: bottone Indietro in basso tradotto
      $('#backBtn').textContent = '← ' + d.back;

      // set selettore lingua
      const sel = document.getElementById('langSelect');
      if (sel) sel.value = L;
    }

    // init lang once
    if (!LS.getItem('lang')) LS.setItem('lang', getLang());
    applyI18N();

    // language switch
    document.getElementById('langSelect').addEventListener('change', (e)=> setLang(e.target.value));

    // topbar nav
    document.getElementById('backTop').addEventListener('click', ()=> history.back());
    document.getElementById('homeTop').addEventListener('click', ()=> location.href='index.html');
    document.getElementById('backBtn').addEventListener('click', ()=> history.back());

    // reset profilo
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(!confirm('Reset profilo?')) return;
      ['whatif_profile','whatif_onboarding_done','whatif_profile_date','whatif_last_update'].forEach(k=>{
        try{ localStorage.removeItem(k); sessionStorage.removeItem(k);}catch{}
      });
      location.reload();
    });

    /* ===== Storage robusto ===== */
    function safeStore(key, value) {
      try {
        localStorage.setItem(key, value);
        if (localStorage.getItem(key) !== value) throw new Error('Round-trip mismatch');
        return 'local';
      } catch (e) {
        try {
          sessionStorage.setItem(key, value);
          console.warn('[What?f] localStorage non disponibile, uso sessionStorage:', e?.message||e);
          return 'session';
        } catch (e2) {
          alert('Impossibile salvare i dati sul dispositivo. Disattiva la navigazione privata o sblocca lo storage.');
          throw e2;
        }
      }
    }

    /* ===== Guard: se già profilato → vai alla 4ª ===== */
    (function guardOneTime(){
      try{
        const raw = localStorage.getItem('whatif_profile') || sessionStorage.getItem('whatif_profile');
        const prof = raw ? JSON.parse(raw) : null;
        const done = localStorage.getItem('whatif_onboarding_done')==='1' || sessionStorage.getItem('whatif_onboarding_done')==='1';
        const ok = prof && prof.sex && prof.age && prof.phase && prof.name && prof.city && prof.role && prof.goal;
        if (done && ok) location.replace('fourth.html');
      }catch(e){ console.warn('[What?f] guardOneTime:', e); }
    })();

    /* ===== Utilità grammaticali per l’AI ===== */
    function buildGrammar(sex){
      const s = (sex||'').toLowerCase();
      if (s==='f' || s==='donna') {
        return { pronome:'lei', articolo:'la', aggettivo_suff:'a', participio_suff:'a' };
      }
      if (s==='m' || s==='uomo') {
        return { pronome:'lui', articolo:'il', aggettivo_suff:'o', participio_suff:'o' };
      }
      return { pronome:'loro', articolo:'lo/la', aggettivo_suff:'*', participio_suff:'*' };
    }
    function mapGenderToSex(g){
      const x = String(g||'').toLowerCase();
      if (x==='uomo' || x==='male') return 'm';
      if (x==='donna' || x==='female') return 'f';
      if (x==='altro' || x==='other') return 'nb';
      if (x==='non_specificato' || x==='prefer not to say') return 'nb';
      return '';
    }
    function todayISO(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    /* ===== Submit ===== */
    const form = document.getElementById('aboutForm');
    const errBox = document.getElementById('errorBox');

    form.addEventListener('submit',(e)=>{
      e.preventDefault();
      const d = I18N[getLang()] || I18N.it;

      const name  = document.getElementById('name').value.trim();
      const city  = document.getElementById('city').value.trim();
      const gender= document.getElementById('gender').value.trim();
      const age   = document.getElementById('age').value.trim();
      const phase = document.getElementById('phase').value.trim();
      const role  = document.getElementById('who').value.trim();
      const goal  = document.getElementById('goal').value.trim();
      const about = document.getElementById('about').value.trim(); // opzionale

      if(!name || !city || !gender || !age || !phase || !role || !goal){
        errBox.textContent = form.dataset.err || d.err_required;
        errBox.style.display = 'block';
        return;
      }
      errBox.style.display = 'none';

      const sex = mapGenderToSex(gender);
      const profile = {
        name, city, gender, sex, age, phase, role, goal,
        about: about || '',
        gram: buildGrammar(sex)
      };

      safeStore('whatif_profile', JSON.stringify(profile));
      safeStore('whatif_onboarding_done', '1');
      const t = todayISO();
      safeStore('whatif_last_update', t);
      if (!localStorage.getItem('whatif_profile_date') && !sessionStorage.getItem('whatif_profile_date')){
        safeStore('whatif_profile_date', t);
      }

      // passa subito alla 4ª
      location.href = 'fourth.html';
    });
  </script>

  <!-- SW -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
