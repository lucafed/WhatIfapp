<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Home</title>

  <!-- PWA base -->
  <meta name="theme-color" content="#0B0B0C" />
  <meta name="application-name" content="What?f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Favicon / Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

  <!-- Preload hero (PNG + eventuale WebP) -->
  <link rel="preload" as="image" href="/home-hero.png" />
  <link rel="preload" as="image" href="/home-hero.webp" imagesrcset="/home-hero.webp" imagesizes="100vw" />

  <style>
    /* ===== THEME SYSTEM (palette ufficiali) ===== */
    :root{
      --bg:#0C0F14; --bg2:#0E1724;
      --fg:#ffffff; --muted:#A0B2BA;
      --card:rgba(14,19,28,.55); --card-border:rgba(255,255,255,.10);
      --chip:#141C22;
      --accent:#1C57A0;     /* Blu Verona */
      --accent2:#FFEC01;    /* Giallo Verona */
      --ink:#0A0E12;
      --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.12);
      --chip:#121A26;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.10);
      --chip:#0F1714;
      --accent:#3A6B56;     /* Verde speranza */
      --accent2:#5A8C75;    /* Verde chiaro */
      --ink:#06110B;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }

    main{
      min-height:100%;
      display:flex; flex-direction:column; align-items:center; text-align:center;
      padding:20px; gap:14px;
      padding-bottom:120px;
    }

    /* Lingua (fab) */
    .lang-fab{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; z-index:50}
    .lang-btn{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:var(--fg);
      padding:10px 12px; border-radius:999px; cursor:pointer
    }
    .lang-menu{
      position:absolute; top:46px; right:0; background:var(--card); border:1px solid var(--card-border);
      border-radius:12px; padding:8px; display:none; min-width:170px;
      box-shadow:0 12px 28px var(--shadow); backdrop-filter:blur(10px)
    }
    .lang-menu button{
      display:block; width:100%; text-align:left; background:transparent; border:none;
      color:#E6F2F5; padding:10px; border-radius:10px; cursor:pointer
    }
    .lang-menu button.active{background:rgba(255,255,255,.06)}

    /* Hero */
    .hero-img{
      width:min(92vw,560px); height:auto; display:block; margin:0 auto 6px;
      filter:drop-shadow(0 10px 28px var(--shadow));
      border-radius:16px;
    }

    /* Titoli & lead */
    h1{margin:.25rem 0 0; font-size:clamp(28px,5.5vw,44px); line-height:1.1; cursor:default}
    h1 span{color:var(--accent)}
    .lead{
      max-width:720px; font-size:clamp(15px,4vw,18px); color:var(--muted);
      line-height:1.55; margin:4px auto 16px;
    }

    /* Scelte */
    .group{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:6px}
    .chip{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:#e8f2ec;
      padding:12px 16px; border-radius:16px; font-weight:700; cursor:pointer;
      transition:transform .08s ease, background .16s ease, box-shadow .16s ease, color .16s ease;
      backdrop-filter:blur(6px);
    }
    .chip:active{transform:translateY(1px)}
    .chip.selected{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
    }

    /* CTA */
    .cta{
      display:inline-block;
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); font-weight:800; border:none; border-radius:24px;
      padding:14px 20px;
      box-shadow:0 0 14px rgba(0,0,0,.35),0 0 28px rgba(0,0,0,.15);
      cursor:pointer; transition:.2s
    }
    .cta[disabled]{opacity:.45; cursor:not-allowed}

    /* Footer */
    footer{
      position:fixed; left:0; right:0; bottom:10px; text-align:center;
      color:var(--muted); font-size:12px; padding:0 14px;
    }
    footer a{
      color:var(--accent); text-decoration:none; font-weight:600;
    }
    footer .sep{opacity:.6; margin:0 6px}
    .foot-links{
      display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
      margin-top:6px;
    }
    .info-btn{
      background:var(--chip); border:1px solid var(--card-border); color:#E6F2F5;
      border-radius:999px; padding:6px 10px; font-weight:700; text-decoration:none;
    }
  </style>
</head>
<body>
  <!-- Selettore lingua -->
  <div class="lang-fab" id="langFab">
    <button class="lang-btn" id="langToggle" aria-haspopup="true" aria-expanded="false" aria-label="Cambia lingua">🌐 <span id="langCode">IT</span></button>
    <div class="lang-menu" id="langMenu" role="menu" aria-label="language">
      <button data-lang="it">Italiano</button>
      <button data-lang="en">English</button>
    </div>
  </div>

  <main>
    <!-- ✅ src di default; width/height per evitare CLS (modifica le dimensioni secondo il tuo file reale) -->
    <img id="hero" class="hero-img" src="/home-hero.png" alt="Porta luminosa What?f" loading="eager" decoding="async" width="1120" height="700" />

    <h1 id="appTitle"><span data-i18n="title">Scopri il tuo What?f</span></h1>

    <p class="lead" id="leadText"></p>

    <!-- Scelte -->
    <div class="group" id="periodGroup">
      <button class="chip" data-key="periodo" data-val="past"   data-i18n="past">Passato</button>
      <button class="chip" data-key="periodo" data-val="future" data-i18n="future">Futuro</button>
    </div>
    <div class="group" id="styleGroup">
      <button class="chip" data-key="stile" data-val="whatif" data-i18n="whatif">What if</button>
      <button class="chip" data-key="stile" data-val="wtf"    data-i18n="wtf">What the F</button>
    </div>

    <button id="go" class="cta" disabled data-i18n="next">Avanti</button>
  </main>

  <footer>
    © 2025 What?f
    <div class="foot-links">
      <a href="privacy.html" data-i18n="privacy">Privacy</a>
      <span class="sep">·</span>
      <a href="terms.html" data-i18n="terms">Termini</a>
      <span class="sep">·</span>
      <a class="info-btn" href="about.html" id="aboutLink"><span data-i18n="info">Info</span></a>
    </div>
  </footer>

  <!-- Hero robust loader (fallback se /home-hero.png non esiste) -->
  <script>
    (function loadHero(){
      const hero = document.getElementById('hero');
      const DIRS  = ["", "/public", "/assets", "/img", "/images"];
      const NAMES = ["home-hero.webp","home-hero.png","home_hero.webp","home_hero.png"];
      const cacheBust = () => `?v=${Math.floor(Date.now()/60000)}`;

      function trySrc(url){
        return new Promise(resolve=>{
          const img = new Image();
          img.decoding = "async";
          img.loading  = "eager";
          img.onload   = ()=> resolve(url + cacheBust());
          img.onerror  = ()=> resolve(null);
          img.src = url + cacheBust();
        });
      }

      (async ()=>{
        for (const dir of DIRS){
          for (const name of NAMES){
            const url = `${dir}/${name}`.replace(/\/{2,}/g,"/");
            const ok  = await trySrc(url);
            if (ok){ hero.src = ok; hero.alt = "Porta luminosa What?f"; return; }
          }
        }
        // se nessuna immagine è trovata, lascia quella di default o nascondi
        if(!hero.getAttribute('src')) hero.style.display = "none";
      })();
    })();
  </script>

  <!-- i18n + theme + selections + SWITCH LINGUA FUNZIONANTE -->
  <script>
    (function initTheme(){
      try{
        const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        const theme = prefs.stile==='wtf' ? 'wtf' : 'whatif';
        document.documentElement.setAttribute('data-theme', theme);
      }catch(e){
        document.documentElement.setAttribute('data-theme','whatif');
      }
    })();

    const DICT = {
      it:{
        title:"Scopri il tuo What?f",
        lead:"Immagina la scelta che non hai fatto… e quella che potresti fare. Scegli se guardare al passato o al futuro. <strong>What if</strong> esplora scenari realistici e riflessivi, basati su scelte plausibili. <strong>What the F</strong> ti fa vivere visioni ironiche, creative e imprevedibili.",
        past:"Passato", future:"Futuro", whatif:"What if", wtf:"What the F",
        next:"Avanti", privacy:"Privacy", terms:"Termini", info:"Info"
      },
      en:{
        title:"Discover your What?f",
        lead:"Imagine the choice you didn’t make… and the one you could make. Choose whether to look to the past or the future. <strong>What if</strong> explores realistic, reflective scenarios based on plausible choices. <strong>What the F</strong> lets you experience ironic, creative and unpredictable visions.",
        past:"Past", future:"Future", whatif:"What if", wtf:"What the F",
        next:"Next", privacy:"Privacy", terms:"Terms", info:"Info"
      }
    };

    const LS = localStorage;
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    // ---- lingua
    function detectBrowserLang(){
      const n = (navigator.language || 'it').toLowerCase();
      return n.startsWith('en') ? 'en' : 'it';
    }
    function getLang(){
      return (LS.getItem('lang') || detectBrowserLang());
    }
    function setLang(l){
      LS.setItem('lang', l);
      applyLang();
    }
    function applyLang(){
      const L = getLang();
      const d = DICT[L] || DICT.it;
      document.documentElement.lang = L;
      $('#langCode').textContent = L.toUpperCase();
      // aria-label dinamico per accessibilità
      $('#langToggle').setAttribute('aria-label', L === 'en' ? 'Change language' : 'Cambia lingua');
      // testi
      $$('[data-i18n]').forEach(el=>{
        const k = el.getAttribute('data-i18n');
        if (k === 'lead'){ $('#leadText').innerHTML = d.lead; }
        else if (d[k]) el.textContent = d[k];
      });
      // attivi nel menu
      document.querySelectorAll('#langMenu button').forEach(b=>{
        b.classList.toggle('active', b.dataset.lang === L);
      });
    }

    if(!LS.getItem('lang')) LS.setItem('lang', detectBrowserLang());
    applyLang();

    // ---- wiring menu lingua
    (function wireLangMenu(){
      const btn  = $('#langToggle');
      const menu = $('#langMenu');
      btn.addEventListener('click', ()=>{
        const open = menu.style.display === 'block';
        menu.style.display = open ? 'none' : 'block';
        btn.setAttribute('aria-expanded', String(!open));
      });
      menu.addEventListener('click', (e)=>{
        const b = e.target.closest('button[data-lang]'); if(!b) return;
        setLang(b.dataset.lang);
        menu.style.display='none';
      });
      document.addEventListener('click', (e)=>{
        if(!menu.contains(e.target) && e.target!==btn) menu.style.display='none';
      });
    })();

    // ---- selections / tema
    const state = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
    const go    = document.getElementById('go');

    function syncUI(){
      if(state.periodo){
        document.querySelectorAll(`#periodGroup .chip`).forEach(c=>c.classList.remove('selected'));
        document.querySelector(`#periodGroup .chip[data-val="${state.periodo}"]`)?.classList.add('selected');
      }
      if(state.stile){
        document.querySelectorAll(`#styleGroup .chip`).forEach(c=>c.classList.remove('selected'));
        document.querySelector(`#styleGroup .chip[data-val="${state.stile}"]`)?.classList.add('selected');
        document.documentElement.setAttribute('data-theme', state.stile==='wtf'?'wtf':'whatif');
      }
      go.disabled = !(state.periodo && state.stile);
    }

    function wireGroup(g){
      g.addEventListener('click', (e)=>{
        const b = e.target.closest('.chip'); if(!b) return;
        g.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        state[b.dataset.key] = b.dataset.val;
        localStorage.setItem('whatif_prefs', JSON.stringify(state));
        if (b.dataset.key === 'stile'){
          document.documentElement.setAttribute('data-theme', b.dataset.val==='wtf'?'wtf':'whatif');
        }
        go.disabled = !(state.periodo && state.stile);
      });
    }

    wireGroup(document.getElementById('periodGroup'));
    wireGroup(document.getElementById('styleGroup'));
    syncUI();

    go.addEventListener('click', ()=>{
      if(go.disabled) return;
      location.href = 'second.html';
    });
  </script>

  <!-- Admin segreto: 3 tap sul titolo + 5 tap su "Passato" -->
  <script>
    (function(){
      const title = document.getElementById('appTitle') || document.querySelector('h1');
      const pastBtn = document.querySelector('button[data-val="past"]');

      if(!title || !pastBtn) return;

      let tapTitle = 0;
      let tapPast = 0;
      let stage = 0; // 0 = non iniziato, 1 = attesa 5 tap su "Passato"
      let timer = null;

      function resetAll(){
        tapTitle = 0; tapPast = 0; stage = 0;
        if(timer) clearTimeout(timer);
        timer = null;
        pastBtn.classList.remove("unlocking");
      }

      function flashScreen(){
        const flash = document.createElement("div");
        flash.style.position="fixed";
        flash.style.inset="0";
        flash.style.background="rgba(255,255,255,0.05)";
        flash.style.backdropFilter="blur(2px)";
        flash.style.transition="opacity .6s ease";
        flash.style.opacity="1";
        flash.style.zIndex="9999";
        document.body.appendChild(flash);
        setTimeout(()=>flash.style.opacity="0",150);
        setTimeout(()=>flash.remove(),800);
      }

      function success(){
        resetAll();
        const pin = prompt("PIN amministratore:");
        if(!pin) return;
        try{ sessionStorage.setItem("pending_admin_pin", pin); }catch{}
        location.href = "admin.html";
      }

      title.addEventListener('click', ()=>{
        tapTitle++;
        if(timer) clearTimeout(timer);
        timer = setTimeout(resetAll, 2000);

        if(tapTitle >= 3){
          stage = 1;
          tapTitle = 0;
          flashScreen();
          // feedback sul bottone "Passato"
          pastBtn.classList.add("unlocking");
          pastBtn.style.boxShadow = "0 0 0 2px rgba(255,255,255,.15) inset, 0 0 22px rgba(255,255,255,.12)";
          setTimeout(()=>{ if(stage!==1) pastBtn.classList.remove("unlocking"); }, 2500);
        }
      });

      pastBtn.addEventListener('click', ()=>{
        if(stage !== 1) return;
        tapPast++;
        if(timer) clearTimeout(timer);
        timer = setTimeout(resetAll, 2500);
        if(tapPast >= 5){ success(); }
      });
    })();
  </script>

  <!-- SW -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(()=>{});
      });
    }
  </script>
</body>
</html>
