<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0A0F14;
      color: #FFFFFF;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .hero-img {
      width: min(90%, 900px);
      height: auto;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 1.8rem;
      margin: 10px 0;
    }
    h1 span {
      color: #00E0FF;
    }
    .btn {
      background-color: #00B5CC;
      color: white;
      border: none;
      padding: 14px 28px;
      margin-top: 20px;
      border-radius: 30px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,224,255,0.5);
      transition: all 0.3s ease;
    }
    .btn:hover {
      background-color: #00E0FF;
      box-shadow: 0 0 25px rgba(0,224,255,0.8);
    }
    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #A0B2BA;
    }
    footer a {
      color: #00E0FF;
      text-decoration: none;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Immagine corretta -->
    <img src="/home-hero.png" alt="Porta luminosa What?f" class="hero-img">

    <!-- Titolo -->
    <h1>BENVENUTO SU <span>What?f</span></h1>

    <!-- Pulsante -->
    <button class="btn">CHOOSE YOUR WAY</button>
  </div>

  <footer>
    © 2025 What?f · <a href="#">Privacy</a> · <a href="#">Termini</a>
  </footer>

  <script>
    // Swipe
    let startX = 0;
    document.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    });
    document.addEventListener("touchend", e => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) {
        window.location.href = "/seconda.html";
      }
    });
  </script>
</body>
</html>
