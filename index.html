<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f – Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0A0F14;
      color: #FFFFFF;
      text-align: center;
    }

    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 15px;
    }

    .hero-section h1 {
      font-size: 1.8rem;
      margin: 10px 0;
    }

    .hero-section h1 span {
      color: #00E0FF;
    }

    .hero-section img {
      width: 100%;
      max-width: 400px;
      height: auto;
      margin: 5px 0;
      border-radius: 10px;
    }

    .hero-section p {
      font-size: 1rem;
      line-height: 1.4;
      margin: 10px 0;
      max-width: 500px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .btn-yellow, .btn-green {
      padding: 12px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-yellow {
      background-color: #FFD93D;
      color: #000;
    }

    .btn-green {
      background-color: #1AFFD5;
      color: #000;
    }

    .btn-yellow:hover, .btn-green:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="hero-section">
    <h1>Scopri il tuo <span>What?f</span></h1>
    <img src="third-hero.png" alt="Porte">
    <p>
      Immagina la scelta che non hai fatto… e quella che potresti fare domani.  
      What?f ti mostra “cosa sarebbe potuto accadere” e “cosa potrebbe accadere” se scegli una porta invece dell’altra.
    </p>

    <div class="buttons">
      <button class="btn-yellow">What?f</button>
      <button class="btn-green">What the F</button>
    </div>
  </div>

</body>
</html>
