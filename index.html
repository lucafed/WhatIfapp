<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">
  <link rel="preload" as="image" href="/home-hero.png" />

  <style>
    :root {
      --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC; --ink:#001f26;
    }
    [data-theme="light"] {
      --bg:#fdfdfd; --fg:#111; --muted:#444;
      --accent:#00B5CC; --accent-dark:#008da0; --ink:#fff;
    }

    *{ box-sizing:border-box; margin:0; padding:0 }
    body{ height:100%; margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:flex; flex-direction:column; align-items:center; }

    main{
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start;
      text-align:center; padding:30px 20px; gap:16px;
      width:100%; max-width:600px;
    }

    .theme-toggle{
      position:fixed; top:70px; right:20px;
      cursor:pointer; user-select:none;
      padding:8px 14px; border-radius:22px;
      background:var(--accent); color:var(--ink);
      font-size:14px; font-weight:600;
      box-shadow:0 0 10px rgba(0,0,0,.4);
      z-index:100;
    }

    .hero-img{ width:min(92vw,420px); height:auto; display:block;
      margin:0 auto 12px; filter:drop-shadow(0 10px 28px rgba(0,0,0,.45)) }

    h1{ margin:.5rem 0 0; font-size:clamp(28px,5.5vw,40px); line-height:1.2 }
    h1 span{
      color:var(--accent);
      text-shadow: 0 0 8px rgba(0,224,255,.7), 0 0 16px rgba(0,224,255,.4);
      animation: glow 2.5s infinite;
    }
    @keyframes glow {
      0% { text-shadow: 0 0 6px rgba(0,224,255,.6), 0 0 12px rgba(0,224,255,.3) }
      50%{ text-shadow: 0 0 14px rgba(0,224,255,1), 0 0 28px rgba(0,224,255,.6) }
      100%{ text-shadow: 0 0 6px rgba(0,224,255,.6), 0 0 12px rgba(0,224,255,.3) }
    }

    p.subtitle{
      font-size:18px; color:var(--muted); max-width:80%;
      margin:10px auto 0; line-height:1.4;
    }

    .btn{
      display:inline-block; text-decoration:none; background:var(--accent-dark);
      color:var(--ink); font-weight:700; padding:14px 22px; border-radius:28px;
      margin-top:14px;
      box-shadow:0 0 12px rgba(0,181,204,.6), 0 0 24px rgba(0,181,204,.3);
      animation: pulse 2s infinite; transition:.2s
    }
    .btn:hover{ filter:brightness(1.15) }
    .btn:active{ transform:translateY(1px) }
    @keyframes pulse {
      0% { box-shadow:0 0 10px rgba(0,181,204,.5), 0 0 20px rgba(0,181,204,.2) }
      50%{ box-shadow:0 0 18px rgba(0,224,255,.9), 0 0 36px rgba(0,224,255,.4) }
      100%{ box-shadow:0 0 10px rgba(0,181,204,.5), 0 0 20px rgba(0,181,204,.2) }
    }

    footer{ padding:14px; text-align:center; font-size:12px; color:var(--muted); }
    footer a{ color:var(--accent); text-decoration:none }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">☀️/🌙</div>

  <main>
    <img id="hero" class="hero-img" alt="Scopri il tuo What?f" loading="eager" decoding="async" />
    <p class="subtitle">Le porte che non hai aperto e quelle che aprirai.</p>
    <h1>BENVENUTO SU <span>What?f</span></h1>
    <a href="second.html" class="btn">CHOOSE YOUR WAY</a>
    <p style="font-size:13px; color:var(--muted)">Swipe ↑ o → per continuare</p>
  </main>

  <footer>
    Continuando accetti la nostra <a href="privacy.html">Privacy Policy</a> e i <a href="terms.html">Termini d’uso</a>.<br>
    © 2025 What?f
  </footer>

  <script>
    // Immagine robusta
    (async function loadHero(){
      const hero=document.getElementById('hero');
      const tries=['/home-hero.png','/public/home-hero.png','/assets/home-hero.png'];
      for(const u of tries){
        try{ const r=await fetch(u,{cache:'no-store'}); 
          if(r.ok){ hero.src=u+'?v='+Date.now(); return; }
        }catch(e){}
      }
    })();

    // Tema persistente
    const body=document.body;
    const toggle=document.getElementById('themeToggle');
    function setTheme(t){ body.setAttribute('data-theme',t); localStorage.setItem('theme',t); }
    const saved=localStorage.getItem('theme')||'dark';
    setTheme(saved);
    toggle.addEventListener('click',()=>{ setTheme(body.getAttribute('data-theme')==='dark'?'light':'dark'); });

    // Swipe navigation
    let startX=0,startY=0;
    document.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    });
    document.addEventListener("touchend",e=>{
      let dx=e.changedTouches[0].clientX-startX;
      let dy=e.changedTouches[0].clientY-startY;
      if(Math.abs(dx)>50 || Math.abs(dy)>50){
        if(dx<-50 || dy<-50) window.location.href="second.html";
      }
    });
  </script>
</body>
</html>
