<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Home</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0B0B0C"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>

  <!-- Perf -->
  <link rel="preconnect" href="https://what-ifapp.vercel.app" crossorigin>
  <link rel="preload" as="image" href="/home-hero.png" imagesrcset="/home-hero.png 1x, /home-hero.png 2x"/>

  <style>
    :root{
      --bg:#0B0B0C; --bg2:#101414; --fg:#EEF5F0; --muted:#A6B6AD;
      --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.10);
      --chip:#0F1714;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724; --fg:#F4F7FB; --muted:#A7B3C2;
      --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.12);
      --chip:#121A26; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%; margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }
    main{min-height:100%; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding:20px 16px 120px}
    .hero-img{
      width:min(92vw,560px);
      height:auto;
      display:block;
      margin:0 auto 6px;
      filter:drop-shadow(0 10px 28px var(--shadow));
      border-radius:16px;
      background: radial-gradient(60% 40% at 50% 50%, #00b5cc33, transparent 70%); /* fallback se non carica */
    }
    h1{margin:.25rem 0 0; font-size:clamp(28px,5.5vw,44px); line-height:1.1}
    h1 span{color:var(--accent)}
    .lead{max-width:720px; font-size:clamp(15px,4vw,18px); color:var(--muted); line-height:1.55; margin:4px auto 16px}
    .group{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:6px}
    .chip{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:#e8f2ec;
      padding:12px 16px; border-radius:16px; font-weight:700; cursor:pointer;
      transition:transform .08s ease, background .16s ease, box-shadow .16s ease, color .16s ease;
      backdrop-filter:blur(6px);
    }
    .chip:active{transform:translateY(1px)}
    .chip.selected{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
    }
    .cta{
      display:inline-block; background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); font-weight:800; border:none; border-radius:24px; padding:14px 20px; min-width:220px;
      box-shadow:0 0 14px rgba(0,0,0,.35),0 0 28px rgba(0,0,0,.15); cursor:pointer; transition:.2s
    }
    .cta[disabled]{opacity:.45; cursor:not-allowed}
    footer{position:fixed; left:0; right:0; bottom:10px; text-align:center; color:var(--muted); font-size:12px}
    footer a{color:var(--accent); text-decoration:none; font-weight:600}
    footer .sep{opacity:.6; margin:0 6px}
    .foot-links{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:6px}

    /* Lingua (fab) */
    .lang-fab{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; z-index:50}
    .lang-btn{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:var(--fg);
      padding:10px 12px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    }
    .lang-dd{position:absolute; top:46px; right:0; background:var(--card); border:1px solid var(--card-border);
      border-radius:12px; padding:8px; display:none; min-width:170px; box-shadow:0 12px 28px var(--shadow); backdrop-filter:blur(10px)}
    .lang-dd button{display:block; width:100%; text-align:left; background:transparent; border:none; color:#E6F2F5; padding:10px; border-radius:10px; cursor:pointer}
    .lang-dd button.active{background:rgba(255,255,255,.06)}
  </style>
</head>
<body>
  <!-- Switch lingua -->
  <div class="lang-fab">
    <button id="langToggle" class="lang-btn" aria-haspopup="true" aria-expanded="false">🌐 <span id="langCode">IT</span></button>
    <div id="langMenu" class="lang-dd" role="menu" aria-label="language">
      <button data-lang="it">Italiano</button>
      <button data-lang="en">English</button>
    </div>
  </div>

  <main>
    <!-- HERO: statico, veloce -->
    <img
      class="hero-img"
      src="/home-hero.png"
      srcset="/home-hero.png 1x, /home-hero.png 2x"
      alt="Porta luminosa What?f"
      width="1120" height="640"
      loading="eager" decoding="async"
      onerror="this.style.display='none';"
    />

    <h1 id="appTitle"><span data-i18n="title">Scopri il tuo What?f</span></h1>
    <p class="lead" id="leadText"></p>

    <div class="group" id="periodGroup">
      <button class="chip" data-key="periodo" data-val="past"   data-i18n="past">Passato</button>
      <button class="chip" data-key="periodo" data-val="future" data-i18n="future">Futuro</button>
    </div>
    <div class="group" id="styleGroup">
      <button class="chip" data-key="stile" data-val="whatif" data-i18n="whatif">What if</button>
      <button class="chip" data-key="stile" data-val="wtf"    data-i18n="wtf">What the F</button>
    </div>

    <button id="go" class="cta" disabled data-i18n="next">Avanti</button>
  </main>

  <footer>
    © 2025 What?f
    <div class="foot-links">
      <a href="privacy.html" data-i18n="privacy">Privacy</a>
      <span class="sep">·</span>
      <a href="terms.html" data-i18n="terms">Termini</a>
      <span class="sep">·</span>
      <a class="cta-min" href="about.html" id="aboutLink" style="background:var(--chip);border:1px solid var(--card-border);border-radius:999px;padding:6px 10px;color:#E6F2F5;text-decoration:none;font-weight:700"><span data-i18n="info">Info</span></a>
    </div>
  </footer>

  <script defer>
  (function(){
    const LS = localStorage;
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    // ---- I18N
    const DICT = {
      it:{
        title:"Scopri il tuo What?f",
        lead:"Immagina la scelta che non hai fatto… e quella che potresti fare. Scegli se guardare al passato o al futuro. <strong>What if</strong> esplora scenari realistici e riflessivi, basati su scelte plausibili. <strong>What the F</strong> ti fa vivere visioni ironiche, creative e imprevedibili.",
        past:"Passato", future:"Futuro", whatif:"What if", wtf:"What the F",
        next:"Avanti", privacy:"Privacy", terms:"Termini", info:"Info"
      },
      en:{
        title:"Discover your What?f",
        lead:"Imagine the choice you didn’t make… and the one you might still choose. Decide whether to look to the past or the future. <strong>What if</strong> explores realistic, reflective scenarios based on plausible choices. <strong>What the F</strong> lets you experience ironic, creative and unpredictable visions.",
        past:"Past", future:"Future", whatif:"What if", wtf:"What the F",
        next:"Next", privacy:"Privacy", terms:"Terms", info:"Info"
      }
    };

    // ---- Lingua (persistente)
    function getLang(){ return (LS.getItem('lang') || navigator.language || 'it').toLowerCase().startsWith('en') ? 'en' : (LS.getItem('lang') || 'it'); }
    function setLang(l){ LS.setItem('lang', l); applyLang(); }
    function applyLang(){
      const L = getLang(); const d = DICT[L] || DICT.it;
      document.documentElement.lang = L;
      $('#langCode').textContent = L.toUpperCase();
      $$('[data-i18n]').forEach(el=>{
        const k = el.getAttribute('data-i18n');
        if(k === 'lead'){ $('#leadText').innerHTML = d.lead; }
        else if (d[k]) el.textContent = d[k];
      });
    }

    // ---- Tema da prefs
    try{
      const prefs0 = JSON.parse(LS.getItem('whatif_prefs')||'{}');
      document.documentElement.setAttribute('data-theme', prefs0.stile==='wtf'?'wtf':'whatif');
    }catch{ document.documentElement.setAttribute('data-theme','whatif'); }

    // ---- Stato e UI selections
    const state = JSON.parse(LS.getItem('whatif_prefs')||'{}');
    const go = $('#go');

    function syncUI(){
      if(state.periodo){
        $$('#periodGroup .chip').forEach(c=>c.classList.toggle('selected', c.dataset.val===state.periodo));
      }
      if(state.stile){
        $$('#styleGroup .chip').forEach(c=>c.classList.toggle('selected', c.dataset.val===state.stile));
        document.documentElement.setAttribute('data-theme', state.stile==='wtf'?'wtf':'whatif');
      }
      go.disabled = !(state.periodo && state.stile);
    }
    function wireGroup(g){
      g.addEventListener('click', (e)=>{
        const b = e.target.closest('.chip'); if(!b) return;
        state[b.dataset.key] = b.dataset.val;
        LS.setItem('whatif_prefs', JSON.stringify(state));
        if (b.dataset.key === 'stile'){
          document.documentElement.setAttribute('data-theme', b.dataset.val==='wtf'?'wtf':'whatif');
        }
        syncUI();
      });
    }

    // ---- Language dropdown
    const langBtn  = $('#langToggle');
    const langMenu = $('#langMenu');
    langBtn.addEventListener('click', ()=>{
      const open = langMenu.style.display === 'block';
      langMenu.style.display = open ? 'none' : 'block';
      langBtn.setAttribute('aria-expanded', String(!open));
    });
    langMenu.addEventListener('click', (e)=>{
      const b = e.target.closest('button[data-lang]'); if(!b) return;
      setLang(b.dataset.lang);
      langMenu.style.display='none';
      // aggiorna active
      langMenu.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x.dataset.lang===getLang()));
    });
    document.addEventListener('click', (e)=>{
      if(!langMenu.contains(e.target) && e.target!==langBtn) langMenu.style.display='none';
    });

    // ---- Applica lingua e stato
    applyLang();
    wireGroup($('#periodGroup')); wireGroup($('#styleGroup')); syncUI();

    // ---- CTA
    go.addEventListener('click', ()=>{ if(go.disabled) return; location.href='second.html'; });

    // ---- Prevenzione CLS: se PWA/old SW, forza refresh dell’hero in cache
    try{
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistration().then(reg=>{
          if(reg) reg.update().catch(()=>{});
        });
      }
    }catch{}
  })();
  </script>

  <noscript style="display:block;text-align:center;color:#a0b2ba;padding:8px">
    Attiva JavaScript per usare What?f.
  </noscript>

  <!-- SW -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
