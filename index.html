<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">

  <!-- Preload immagine -->
  <link rel="preload" as="image" href="/home-hero.png" />

  <style>
    :root {
      --bg: #0A0F14;
      --fg: #ffffff;
      --muted: #A0B2BA;
      --accent: #00E0FF;
      --accent-dark: #00B5CC;
    }
    [data-theme="light"] {
      --bg: #f7f7f7;
      --fg: #111;
      --muted: #444;
      --accent: #00B5CC;
      --accent-dark: #008fa3;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 40px 20px 20px;
      gap: 20px;
    }

    .hero-img {
      width: min(90vw, 520px);
      height: auto;
      margin-top: 10px;
      display: block;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,.45));
    }

    h1 {
      margin-top: 40px; /* sposta più in basso */
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.2;
    }
    h1 span {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0,224,255,.7), 0 0 16px rgba(0,224,255,.4);
      animation: glow 2.5s infinite;
    }
    @keyframes glow {
      0% { text-shadow: 0 0 6px rgba(0,224,255,.6), 0 0 12px rgba(0,224,255,.3); }
      50% { text-shadow: 0 0 14px rgba(0,224,255,1), 0 0 28px rgba(0,224,255,.6); }
      100% { text-shadow: 0 0 6px rgba(0,224,255,.6), 0 0 12px rgba(0,224,255,.3); }
    }

    p.subtitle {
      margin-top: 12px;
      font-size: 16px;
      color: var(--muted);
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: var(--accent-dark);
      color: #001f26;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 28px;
      margin-top: 28px;
      box-shadow: 0 0 12px rgba(0,181,204,.6), 0 0 24px rgba(0,181,204,.3);
      animation: pulse 2s infinite;
      transition: .2s;
    }
    .btn:hover { filter: brightness(1.15); }
    @keyframes pulse {
      0% { box-shadow:0 0 10px rgba(0,181,204,.5), 0 0 20px rgba(0,181,204,.2); }
      50%{ box-shadow:0 0 18px rgba(0,224,255,.9), 0 0 36px rgba(0,224,255,.4); }
      100%{ box-shadow:0 0 10px rgba(0,181,204,.5), 0 0 20px rgba(0,181,204,.2); }
    }

    footer {
      position: fixed;
      bottom: 10px; left: 0; right: 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    footer a { color: var(--accent); text-decoration:none; }

    .theme-toggle {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--accent-dark);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle">☀️ / 🌙</button>

  <main>
    <img src="/home-hero.png" alt="Porta luminosa What?f" class="hero-img" />

    <h1>BENVENUTO SU <span>What?f</span></h1>
    <p class="subtitle">Le porte che non hai aperto e quelle che aprirai</p>

    <a href="second.html" class="btn">CHOOSE YOUR WAY</a>
  </main>

  <footer>© 2025 What?f · <a href="privacy.html">Privacy</a> · <a href="terms.html">Termini</a></footer>

  <script>
    // Tema persistente
    const toggleBtn = document.getElementById('themeToggle');
    const root = document.documentElement;

    if(localStorage.getItem('theme') === 'light'){
      root.setAttribute('data-theme','light');
    }

    toggleBtn.addEventListener('click', ()=>{
      if(root.getAttribute('data-theme')==='light'){
        root.removeAttribute('data-theme');
        localStorage.setItem('theme','dark');
      } else {
        root.setAttribute('data-theme','light');
        localStorage.setItem('theme','light');
      }
    });
  </script>
</body>
</html>
