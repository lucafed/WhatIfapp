<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">

  <!-- Preload dell'immagine (stesso nome/posizioni di prima) -->
  <link rel="preload" as="image" href="/third-hero.png" />

  <style>
    :root{
      --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC;
      --yellow:#FFC146; --teal:#00D5E6;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{
      min-height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      gap:12px; /* più compatto */
      padding:16px 14px 20px;
      max-width:900px; margin:0 auto;
    }

    /* Immagine più compatta: entra con testo e bottoni nello stesso viewport */
    .hero-wrap{
      width:100%;
      display:flex; justify-content:center;
    }
    .hero-img{
      width:min(92vw,680px);
      height:auto;
      max-height:clamp(280px, 42vh, 420px);   /* <= il trucco per non farla “mangiare” lo schermo */
      object-fit:cover; border-radius:22px;
      display:block;
      filter:drop-shadow(0 10px 28px rgba(0,0,0,.45));
      margin-top:6px;
    }
    .hero-fallback{color:var(--muted); font-size:14px; margin-top:-2px}

    h1{
      margin:2px 0 0;    /* vicino all’immagine */
      font-size:clamp(22px,4.8vw,34px);
      line-height:1.15; text-align:center;
    }
    h1 .brand{
      color:var(--accent);
      text-shadow:0 0 8px rgba(0,224,255,.6),0 0 16px rgba(0,224,255,.35);
    }

    .kicker{
      margin-top:2px;            /* subito sotto il titolo */
      font-weight:800; letter-spacing:.5px;
      font-size:clamp(16px,3.8vw,22px);
      color:var(--accent-dark); text-align:center;
    }

    .lead{
      margin:6px 0 0;            /* vicino al kicker */
      text-align:center; color:var(--muted);
      font-size:clamp(14px,3.5vw,18px);
      line-height:1.45;
      max-width:800px;
    }

    .cta-row{
      margin-top:10px;           /* i bottoni sono sempre visibili subito */
      display:flex; gap:12px; width:100%;
      justify-content:center; flex-wrap:wrap;
    }
    .btn{
      appearance:none; border:0; border-radius:28px;
      padding:14px 22px; font-weight:800; font-size:16px;
      cursor:pointer; transition:transform .15s ease, filter .15s ease;
      color:#001f26;
      min-width:min(46%, 260px);
      box-shadow:0 0 14px rgba(0,0,0,.25);
    }
    .btn:active{transform:translateY(1px)}
    .btn-yellow{ background:var(--yellow) }
    .btn-teal  { background:var(--teal)   }

    footer{
      margin-top:10px; text-align:center; color:var(--muted);
      font-size:12px;
    }

    /* Piccola animazione in ingresso per dare “vita”, ma breve */
    .fade-in { opacity:0; transform:translateY(10px); animation:fin .55s ease forwards }
    .d1{animation-delay:.05s} .d2{animation-delay:.12s} .d3{animation-delay:.18s}
    @keyframes fin { to{opacity:1; transform:none} }

    /* Evita che la tastiera mobile spinga tutto: spazio min ma non fisso */
    @supports (height: 100svh){
      main{min-height:100svh}
    }
  </style>
</head>
<body>
  <main>
    <!-- Immagine -->
    <div class="hero-wrap fade-in d1">
      <img id="hero" class="hero-img" alt="Due porte: gialla (What?f) e turchese (What the F)" loading="eager" decoding="async" />
    </div>
    <div id="heroFallback" class="hero-fallback"></div>

    <!-- Titolo + kicker subito visibili -->
    <h1 class="fade-in d2">Scopri il tuo <span class="brand">What?f</span></h1>
    <div class="kicker fade-in d2">CHOOSE YOUR WAY</div>

    <!-- Testo compatto -->
    <p class="lead fade-in d3">
      Immagina la scelta che non hai fatto… e quella che potresti fare domani.
      What?f ti mostra “cosa sarebbe potuto accadere” e “cosa potrebbe accadere”
      se scegli una porta invece dell’altra.
    </p>

    <!-- Bottoni sempre a vista -->
    <div class="cta-row fade-in d3">
      <a class="btn btn-yellow" href="fourth.html?mode=whatif" aria-label="Vai alla modalità What if">What?f</a>
      <a class="btn btn-teal"   href="fourth.html?mode=wtf"    aria-label="Vai alla modalità What the F">What the F</a>
    </div>

    <footer>© 2025 What?f</footer>
  </main>

  <!-- Loader robusto immagine: stesso metodo di sempre -->
  <script>
    (async function loadHero(){
      const hero = document.getElementById('hero');
      const fb = document.getElementById('heroFallback');
      const tries = ['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for (const u of tries) {
        try {
          const r = await fetch(u, {cache:'no-store'});
          if (r.ok) { hero.src = u + '?v=' + Date.now(); fb.textContent = ''; return; }
        } catch(e){}
      }
      fb.textContent = 'Immagine non trovata.';
    })();
  </script>
</body>
</html>
