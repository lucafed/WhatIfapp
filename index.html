<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Benvenuto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page"
      style="--bg-url: url('assets/whatif_logo.png');">

  <!-- Overlay testo in alto, centrato -->
  <header class="overlay">
    <h1 class="headline">Benvenuto su <span class="brand">What?f</span></h1>
    <p class="subtitle">
      Le scelte ci definiscono.<br />
      What?f ti mostra “come sarebbe andata” o “come potrebbe andare”.
    </p>
  </header>

  <!-- CTA in basso -->
  <footer class="footer-cta">
    <a class="btn-primary" href="second.html" aria-label="Vai alla pagina successiva">
      Choose your way →
    </a>
    <div class="swipe-hint" aria-hidden="true">⇠ swipe</div>
  </footer>

  <script>
    // Swipe sinistra -> vai a second.html
    (function () {
      let startX = null, startY = null;
      const minDx = 50; // soglia
      document.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        startX = t.clientX; startY = t.clientY;
      }, {passive: true});
      document.addEventListener('touchend', (e) => {
        if (startX === null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = Math.abs(t.clientY - startY);
        if (dx < -minDx && dy < 60) window.location.href = 'second.html';
        startX = startY = null;
      }, {passive: true});

      // Click ovunque porta avanti
      document.addEventListener('click', (e) => {
        const isButton = e.target.closest('.btn-primary');
        if (!isButton) window.location.href = 'second.html';
      });
    })();
  </script>
</body>
</html>
