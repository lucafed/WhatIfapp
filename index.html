<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f – Home</title>

  <style>
    :root {
      --bg: #0b1418;
      --text: #e6f7ff;
      --accent: #00a8bc;
      --accent-2: #00c7db;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
                   Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    }
    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px 56px;
      box-sizing:border-box;
    }
    .card{
      width:min(920px, 95vw);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.06);
      border-radius:28px;
      padding:24px 20px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
      text-align:center;
    }
    .hero{
      display:block;
      width:min(760px, 88vw);
      max-width:100%;
      margin:0 auto 16px;
      border-radius:16px;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    .brand{
      font-size: clamp(26px, 5.3vw, 42px);
      margin:4px 0 18px;
      letter-spacing:.4px;
      font-weight:800;
    }

    .btn{
      display:inline-block;
      text-decoration:none;
      background:var(--accent);
      color:#fff;
      font-weight:800;
      letter-spacing:.6px;
      padding:16px 26px;
      border-radius:28px;
      box-shadow:0 0 12px rgba(0,168,188,.45), 0 0 24px rgba(0,168,188,.22);
      transition:.2s transform ease, .2s background ease, .2s box-shadow ease;
    }
    .btn:focus-visible{ outline: 3px solid rgba(0,168,188,.55); outline-offset:3px; }
    .btn:hover{ background:var(--accent-2); transform: translateY(-1px); }
    .btn:active{ transform: translateY(0); }

    footer{
      position:fixed; left:0; right:0; bottom:8px;
      text-align:center; font-size:13px; opacity:.75;
    }
    footer a{ color:#8fefff; text-decoration:none; }
    footer a:hover{ text-decoration:underline; }
  </style>
</head>
<body>

  <main class="wrap" id="swipe-area">
    <section class="card">
      <!-- Immagine hero dalla cartella /public -->
      <img
        id="hero"
        class="hero"
        src="/home-hero.png"
        alt="Porta luminosa What?f"
        width="1200" height="900"
        />

      <h1 class="brand">BENVENUTO SU <span style="color:#3fe3ff;text-shadow:0 0 24px rgba(63,227,255,.35)">What?f</span></h1>

      <!-- Pulsante -->
      <a id="cta" class="btn" href="/second.html">CHOOSE YOUR WAY</a>
    </section>
  </main>

  <footer>
    © 2025 What?f · <a href="/privacy.html">Privacy</a> · <a href="/termini.html">Termini</a>
  </footer>

  <script>
    const goNext = () => { window.location.href = '/second.html'; };

    // Click sul bottone
    document.getElementById('cta').addEventListener('click', (e) => {
      // link già funziona normalmente
    });

    // Swipe semplice
    (function enableSwipe(){
      const area = document.getElementById('swipe-area');
      let startX = 0, startY = 0, endX = 0, endY = 0;
      const THRESH_X = 60;  
      const LIMIT_Y  = 80;  

      area.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        startX = endX = t.clientX;
        startY = endY = t.clientY;
      }, {passive:true});

      area.addEventListener('touchmove', (e) => {
        const t = e.changedTouches[0];
        endX = t.clientX; endY = t.clientY;
      }, {passive:true});

      area.addEventListener('touchend', () => {
        const dx = endX - startX;
        const dy = Math.abs(endY - startY);
        if (dx < -THRESH_X && dy < LIMIT_Y) goNext();
      }, {passive:true});
    })();

    // Tastiera
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
    });
  </script>
</body>
</html>
