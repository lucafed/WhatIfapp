<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Home</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0B0B0C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/public/icon-192.png" />
  <link rel="apple-touch-icon" href="/public/icon-512.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root{
      --bg:#0C0F14; --bg2:#0E1724; --fg:#ffffff; --muted:#A0B2BA;
      --card:rgba(14,19,28,.55); --card-border:rgba(255,255,255,.10);
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#0A0E12;
    }
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;text-align:center;
    }
    main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;gap:16px;}
    h1{font-size:clamp(26px,6vw,44px);margin:0;}
    .lead{max-width:680px;color:var(--muted);font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 auto 12px;}
    .group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
    .chip{border:1px solid var(--card-border);background:#141c22;color:#fff;padding:12px 16px;border-radius:16px;cursor:pointer;transition:.2s;}
    .chip.selected{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);}
    .cta{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800;border:none;border-radius:24px;padding:14px 22px;cursor:pointer;font-size:16px;}
    .cta[disabled]{opacity:.4;cursor:not-allowed;}
    footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);}
    #authError{color:#ffb3b3;font-size:13px;margin-top:6px;min-height:18px;}
  </style>
</head>

<body>
  <main>
    <h1>Scopri il tuo <span style="color:var(--accent)">What?f</span></h1>
    <p class="lead">
      Immagina la scelta che non hai fatto… e quella che potresti fare.<br>
      <strong>What if</strong> riflessivo, <strong>What the F</strong> ironico.
    </p>

    <div class="group" id="periodGroup">
      <button class="chip" data-key="periodo" data-val="past">Passato</button>
      <button class="chip" data-key="periodo" data-val="future">Futuro</button>
    </div>

    <div class="group" id="styleGroup">
      <button class="chip" data-key="stile" data-val="whatif">What if</button>
      <button class="chip" data-key="stile" data-val="wtf">What the F</button>
    </div>

    <button id="primaryCta" class="cta">Entra con Google</button>
    <button id="logoutBtn" class="chip" style="display:none">Esci</button>
    <p id="authError"></p>
  </main>

  <footer>© 2025 What?f — Tutti i diritti riservati</footer>

  <!-- 🔐 Login Google + crediti giornalieri -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider,
      onAuthStateChanged, signInWithRedirect, getRedirectResult, signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, runTransaction, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASrGnHOnf_O-N0NuZDvqOGGfG8IoSWblc",
      authDomain: "whatif-oracolo.firebaseapp.com",
      projectId: "whatif-oracolo",
      storageBucket: "whatif-oracolo.firebasestorage.app",
      messagingSenderId: "602976466053",
      appId: "1:602976466053:web:668d4a462286513d8b25ec"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const primaryCta = document.getElementById("primaryCta");
    const logoutBtn  = document.getElementById("logoutBtn");
    const errBox     = document.getElementById("authError");

    const showErr = (msg)=>{ errBox.textContent = msg || ""; };

    // Salva scelta locale
    const state = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
    function wireGroup(g){
      g.addEventListener('click', e=>{
        const b=e.target.closest('.chip'); if(!b) return;
        g.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected'); state[b.dataset.key]=b.dataset.val;
        localStorage.setItem('whatif_prefs', JSON.stringify(state));
        updatePrimaryCta();
      });
    }
    wireGroup(document.getElementById('periodGroup'));
    wireGroup(document.getElementById('styleGroup'));

    const selectionsReady = ()=> state.periodo && state.stile;

    async function ensureDailyWallet(uid){
      const ref = doc(db, "wallets", uid);
      const snap = await getDoc(ref);
      const today = new Date().toISOString().slice(0,10);
      if(!snap.exists()){
        await setDoc(ref,{
          available:3, surprise:1, lastDaily:today,
          adCount:0, adDay:today,
          createdAt:serverTimestamp(), updatedAt:serverTimestamp()
        });
      }else{
        const data = snap.data();
        if(data.lastDaily !== today){
          await runTransaction(db, async tx=>{
            tx.update(ref,{
              available:3, surprise:1, lastDaily:today,
              adCount:0, adDay:today, updatedAt:serverTimestamp()
            });
          });
        }
      }
    }

    function updatePrimaryCta(){
      const user = auth.currentUser;
      if(user){
        primaryCta.textContent = selectionsReady() ? "Avanti" : "Scegli prima sopra";
        primaryCta.disabled = !selectionsReady();
        logoutBtn.style.display = "inline-block";
      }else{
        primaryCta.textContent = "Entra con Google";
        primaryCta.disabled = false;
        logoutBtn.style.display = "none";
      }
    }

    primaryCta.onclick = async ()=>{
      showErr("");
      const user = auth.currentUser;
      if(!user){
        try{ await signInWithRedirect(auth, provider); }
        catch(e){ showErr("Errore login: "+(e.code||e.message)); }
      } else if(selectionsReady()){
        location.href = "second.html";
      } else {
        showErr("Seleziona prima Passato/Futuro e What if/WTF");
      }
    };

    logoutBtn.onclick = ()=> signOut(auth);

    // 🔁 dopo redirect Google
    getRedirectResult(auth)
      .then(async res=>{
        if(res?.user){ await ensureDailyWallet(res.user.uid).catch(()=>{}); }
      })
      .catch(e=> showErr("Post-login: "+(e.code||e.message)));

    onAuthStateChanged(auth, async (user)=>{
      if(user){ await ensureDailyWallet(user.uid).catch(()=>{}); }
      updatePrimaryCta();
    });

    updatePrimaryCta();
  </script>
</body>
</html>
