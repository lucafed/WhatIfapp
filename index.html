<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14" />
  <link rel="preload" as="image" href="/home-hero.png" />
  <style>
    :root{--bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#00E0FF;--accent-dark:#00B5CC;--chip:#17212a;--chip-text:#002329;--yellow:#f7b23b;--teal:#00d0e6}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 14px 26px;text-align:center}

    .topbar{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;justify-content:flex-end;padding:6px 10px;background:linear-gradient(180deg,rgba(10,15,20,.85),rgba(10,15,20,0))}
    .lang-btn{appearance:none;border:1px solid #1f2c36;background:#0f1820;color:var(--fg);border-radius:12px;padding:6px 10px;font-weight:700;cursor:pointer}
    .lang-btn:active{transform:translateY(1px)}

    .hero{width:min(100%,980px);background:#0c141b;border-radius:22px;padding:12px 12px 16px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
    .hero img{width:100%;height:auto;border-radius:16px;display:block;filter:drop-shadow(0 10px 28px rgba(0,0,0,.42))}

    h1{margin:4px 0 0;width:min(100%,980px);font-size:clamp(26px,6vw,40px)}
    h1 span[data-key="brand"]{color:var(--accent)}
    .lead{width:min(100%,980px);color:#d7e8ec;margin-top:-2px;font-size:clamp(14px,4vw,18px);line-height:1.45}

    .group{width:min(100%,980px);display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .chip{appearance:none;border:none;background:var(--chip);color:#cfe6eb;padding:12px 16px;border-radius:16px;font-weight:800;cursor:pointer;transition:transform .06s ease,box-shadow .18s ease,background .18s ease}
    .chip:active{transform:translateY(1px)}
    .chip.selected{background:linear-gradient(180deg,#00bcd4,#00E0FF);color:var(--chip-text);box-shadow:0 0 12px rgba(0,224,255,.35)}
    .chip.yellow.selected{background:linear-gradient(180deg,#ffcd66,#f7b23b);color:#3a2a00}
    .chip.teal.selected{background:linear-gradient(180deg,#18e1ff,#00c0d8);color:#002329}

    .badge{margin-top:-2px;width:min(100%,980px);display:flex;justify-content:center}
    .badge span{background:#0f1820;border:1px solid #1d2b34;color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}

    .cta{margin-top:4px;display:inline-block;background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329;font-weight:900;border:none;border-radius:24px;padding:12px 18px;min-width:210px;box-shadow:0 0 14px rgba(0,181,204,.5),0 0 30px rgba(0,181,204,.25);cursor:pointer;transition:filter .16s ease,transform .08s ease}
    .cta:active{transform:translateY(1px)}
    .cta[disabled]{background:#29404a;color:#7fa1aa;cursor:not-allowed;box-shadow:none}
    .cta-wrap{width:min(100%,980px);display:flex;justify-content:center}

    footer{width:min(100%,980px);color:var(--muted);font-size:12px;margin-top:2px}
    footer a{color:var(--accent);text-decoration:none}

    /* Modal lingua */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:20}
    .modal.open{display:flex}
    .sheet{width:min(92vw,560px);background:#0f1820;border:1px solid #20303a;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
    .sheet h3{margin:0 0 8px;font-size:clamp(20px,5vw,26px)}
    .sheet p{margin:0 0 18px;color:var(--muted)}
    .optrow{display:flex;gap:12px;justify-content:center}
    .opt{flex:1;appearance:none;border:1px solid #1f2c36;background:#0c141b;color:var(--fg);padding:12px 16px;border-radius:14px;font-weight:900;cursor:pointer}
    .opt.primary{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329;border:none}
  </style>
</head>
<body>
  <div class="topbar">
    <button id="openLang" class="lang-btn" aria-label="Language">🌐</button>
  </div>

  <main>
    <div class="hero">
      <img id="hero" alt="Due porte illuminate: scegli la tua via" loading="eager" decoding="async" />
    </div>

    <h1><span data-key="title_1"></span> <span data-key="brand">What?f</span></h1>

    <p class="lead" data-key="lead_text"></p>

    <div class="group" id="periodGroup" aria-label="Periodo">
      <button type="button" class="chip" data-key="periodo" data-val="past"  data-i18n="past"></button>
      <button type="button" class="chip" data-key="periodo" data-val="future" data-i18n="future"></button>
    </div>

    <div class="group" id="styleGroup" aria-label="Stile">
      <button type="button" class="chip yellow" data-key="stile" data-val="whatif" data-i18n="whatif"></button>
      <button type="button" class="chip teal"   data-key="stile" data-val="wtf"    data-i18n="wtf"></button>
    </div>

    <div class="badge" id="badge" style="display:none">
      <span id="badgeText"></span>
    </div>

    <div class="cta-wrap">
      <button id="go" class="cta" disabled data-key="cta"></button>
    </div>

    <footer>
      <span data-key="legal_1"></span> <a href="privacy.html">Privacy Policy</a> <span data-key="legal_2"></span>
      <a href="terms.html" data-key="terms">Termini d’uso</a>. © 2025 What?f
    </footer>
  </main>

  <!-- Modal lingua -->
  <div id="langModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="langTitle">
    <div class="sheet">
      <h3 id="langTitle" data-key="modal_title">Scegli la lingua</h3>
      <p data-key="modal_hint">Potrai cambiarla in ogni momento.</p>
      <div class="optrow">
        <button class="opt" id="itBtn">Italiano</button>
        <button class="opt primary" id="enBtn">English</button>
      </div>
    </div>
  </div>

  <script>
    // Dizionario IT/EN
    const I18N = {
      it: {
        title_1: "Scopri il tuo",
        lead_text: "Immagina la scelta che non hai fatto… e quella che potresti fare domani. What?f ti mostra “cosa sarebbe potuto accadere” e “cosa potrebbe accadere” se scegli una porta invece dell’altra.",
        past: "Passato", future: "Futuro", whatif: "What if", wtf: "What the F",
        badge_prefix: "Selezionato:",
        cta: "AVANTI",
        legal_1: "Continuando accetti la nostra", legal_2: "e i",
        terms: "Termini d’uso",
        modal_title: "Scegli la lingua",
        modal_hint: "Potrai cambiarla in ogni momento."
      },
      en: {
        title_1: "Discover your",
        lead_text: "Imagine the choice you didn’t make… and the one you could make tomorrow. What?f shows you “what might have happened” and “what could happen” if you choose one door over the other.",
        past: "Past", future: "Future", whatif: "What if", wtf: "What the F",
        badge_prefix: "Selected:",
        cta: "CONTINUE",
        legal_1: "By continuing you accept our", legal_2: "and the",
        terms: "Terms of Use",
        modal_title: "Choose language",
        modal_hint: "You can change it anytime."
      }
    };

    const LS = window.localStorage;
    const lang = LS.getItem('lang') || (navigator.language||'it').toLowerCase().startsWith('en') ? 'en' : 'it';
    let curLang = LS.getItem('lang') || lang;

    function tSet() {
      const dict = I18N[curLang];
      // elementi con data-key
      document.querySelectorAll('[data-key]').forEach(el=>{
        const k = el.getAttribute('data-key');
        if(dict[k]) el.textContent = dict[k];
      });
      // chip testuali con data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        el.textContent = dict[ el.getAttribute('data-i18n') ];
      });
      // badge refresh
      updateBadge();
    }

    // Carica immagine da /public
    (async function(){
      const hero=document.getElementById('hero');
      const urls=['/home-hero.png','/public/home-hero.png'];
      for(const u of urls){
        try{const r=await fetch(u,{cache:'no-store'});if(r.ok){hero.src=u+'?v='+Date.now();return;}}catch(e){}
      }
      hero.alt='Immagine non trovata';
    })();

    // Stato scelte
    const state = JSON.parse(LS.getItem('whatif_prefs')||'{}');
    const groups=[document.getElementById('periodGroup'),document.getElementById('styleGroup')];
    const badge=document.getElementById('badge');
    const badgeText=document.getElementById('badgeText');
    const go=document.getElementById('go');

    function badgeLabel(){
      const dict = I18N[curLang];
      const a = state.periodo==='past'?dict.past : state.periodo==='future'?dict.future : null;
      const b = state.stile==='whatif'?dict.whatif : state.stile==='wtf'?dict.wtf : null;
      return (a||b) ? `${dict.badge_prefix} ${[a,b].filter(Boolean).join(' • ')}` : '';
    }
    function updateBadge(){
      const txt = badgeLabel();
      if(txt){badge.style.display='flex';badgeText.textContent=txt;}
      else{badge.style.display='none';}
    }
    function checkReady(){ go.disabled = !(state.periodo && state.stile); }

    function wire(g){
      g.addEventListener('click',e=>{
        const b=e.target.closest('.chip'); if(!b) return;
        g.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        state[b.dataset.key]=b.dataset.val;
        LS.setItem('whatif_prefs',JSON.stringify(state));
        updateBadge(); checkReady();
      });
    }
    groups.forEach(wire);

    // ripristina scelte salvate
    if(state.periodo) document.querySelector(`#periodGroup .chip[data-val="${state.periodo}"]`)?.classList.add('selected');
    if(state.stile)   document.querySelector(`#styleGroup  .chip[data-val="${state.stile}"]`)?.classList.add('selected');

    // Navigazione
    go.addEventListener('click',()=>{ if(!go.disabled) location.href='second.html'; });

    // Modal lingua
    const modal = document.getElementById('langModal');
    const openLang = document.getElementById('openLang');
    document.getElementById('itBtn').addEventListener('click',()=>setLang('it'));
    document.getElementById('enBtn').addEventListener('click',()=>setLang('en'));
    openLang.addEventListener('click',()=>modal.classList.add('open'));

    function setLang(l){
      curLang=l; LS.setItem('lang',l);
      document.documentElement.lang = l;
      tSet();
      modal.classList.remove('open');
    }

    // Mostra modal al primo accesso
    if(!LS.getItem('lang')) modal.classList.add('open');
    // Applica traduzioni iniziali
    tSet();
  </script>
</body>
</html>
