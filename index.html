<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14" />
  <link rel="preload" as="image" href="/third-hero.png" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A3B6BF;
      --accent:#00E0FF; --accent-dark:#00B5CC; --ok:#13d8a6; --warn:#ffaa00;
      --btn-disabled:#29404a;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;
      gap:18px;padding:18px 16px 22px}

    .hero{width:min(100%,840px);background:linear-gradient(180deg,#0B1219,#0c141b);
      border-radius:28px;padding:14px 14px 18px;box-shadow:0 10px 32px rgba(0,0,0,.35)}
    .hero img{width:100%;height:auto;display:block;border-radius:22px;filter:drop-shadow(0 14px 36px rgba(0,0,0,.45))}
    .h1{width:min(100%,860px);margin:0 auto;color:var(--accent);
      text-align:center;font-weight:800;font-size:clamp(22px,4.8vw,30px);letter-spacing:.5px}

    .sub{width:min(100%,860px);margin-top:4px;text-align:center;color:var(--muted);
      font-size:clamp(14px,3.8vw,18px);line-height:1.45}

    .group{width:min(100%,860px);background:var(--card);border-radius:18px;
      padding:14px 12px 12px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
    .group h3{margin:4px 8px 10px;font-size:18px;letter-spacing:.3px;color:#d7e8ec}
    .choices{display:flex;gap:10px;flex-wrap:wrap;padding:6px 8px}
    .chip{appearance:none;border:none;background:#17212a;color:#cfe6eb;
      padding:12px 16px;border-radius:16px;font-weight:700;cursor:pointer;
      transition:transform .08s ease, box-shadow .18s ease, background .18s ease}
    .chip:active{transform:translateY(1px)}
    .chip.selected{background:linear-gradient(180deg,#00b9d1,#00E0FF);
      color:#002329; box-shadow:0 0 12px rgba(0,224,255,.35)}

    .cta-wrap{width:min(100%,860px);display:flex;justify-content:center}
    .cta{display:inline-block;min-width:220px;text-align:center;
      background:linear-gradient(180deg,var(--accent),var(--accent-dark));
      color:#002329;font-weight:900;border:none;border-radius:28px;padding:14px 22px;
      box-shadow:0 0 14px rgba(0,181,204,.5),0 0 32px rgba(0,181,204,.25);
      cursor:pointer;transition:filter .16s ease, transform .08s ease}
    .cta:active{transform:translateY(1px)}
    .cta[disabled]{background:var(--btn-disabled);color:#7fa1aa;cursor:not-allowed;
      box-shadow:none}

    .disclaimer{width:min(100%,860px);text-align:center;color:var(--muted);
      font-size:13px}
    .disclaimer a{color:var(--accent);text-decoration:none}

    /* swipe hint (invisibile, serve solo per area touch ampia) */
    .swipeArea{position:fixed;inset:0;z-index:1}

    /* piccoli ritocchi di spaziature iniziali */
    .top-pad{padding-top:8px}
  </style>
</head>
<body>
  <div class="swipeArea" aria-hidden="true"></div>

  <main class="top-pad">
    <h1 class="h1">Scopri il tuo <span style="color:var(--accent)">What?f</span></h1>

    <section class="hero">
      <img id="hero" src="" alt="Due porte illuminate: scegli la tua via" loading="eager" decoding="async">
    </section>

    <section class="group">
      <h3>Scegli il periodo</h3>
      <div class="choices" id="choices-periodo">
        <button class="chip" data-value="past">Passato</button>
        <button class="chip" data-value="future">Futuro</button>
      </div>
    </section>

    <section class="group">
      <h3>Scegli lo stile</h3>
      <div class="choices" id="choices-stile">
        <button class="chip" data-value="whatif">What if (plausibile)</button>
        <button class="chip" data-value="wtf">What the F (ironico)</button>
      </div>
    </section>

    <p class="sub">
      Immagina la scelta che non hai fatto… o quella che potresti fare domani.<br>
      What?f ti mostra “cosa sarebbe potuto accadere” e “cosa potrebbe accadere”.
    </p>

    <div class="cta-wrap">
      <button id="nextBtn" class="cta" disabled>AVANTI</button>
    </div>

    <p class="disclaimer">Continuando accetti la nostra
      <a href="privacy.html">Privacy Policy</a> e i
      <a href="terms.html">Termini d’uso</a>.
    </p>

    <p class="disclaimer">© 2025 What?f</p>
  </main>

  <!-- kill vecchi SW + pulizia cache (come da tuo setup) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations?.().then(r => r.forEach(x=>x.unregister())).catch(()=>{});
      if (window.caches?.keys) { caches.keys().then(keys => keys.forEach(k => caches.delete(k))); }
    }
  </script>

  <!-- immagine robusta + logica selezioni + swipe/avanti -->
  <script>
    // --- immagine con fallback e cache-buster ---
    (async function loadHero(){
      const hero = document.getElementById('hero');
      const tries = ['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for (const u of tries) {
        try {
          const r = await fetch(u, {cache:'no-store'});
          if (r.ok) { hero.src = u + '?v=' + Date.now(); return; }
        } catch(e){}
      }
    })();

    // --- selezioni obbligatorie ---
    const state = { periodo:null, stile:null };
    const btnNext = document.getElementById('nextBtn');

    function updateNext() {
      const ok = !!(state.periodo && state.stile);
      btnNext.disabled = !ok;
      return ok;
    }

    function wireGroup(containerId, key) {
      const el = document.getElementById(containerId);
      el.addEventListener('click', (ev)=>{
        const b = ev.target.closest('.chip');
        if (!b) return;
        // togli selezione agli altri
        el.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        // seleziona questo
        b.classList.add('selected');
        state[key] = b.dataset.value;
        updateNext();
      });
    }

    wireGroup('choices-periodo', 'periodo');
    wireGroup('choices-stile', 'stile');

    function persistAndGo() {
      if (!updateNext()) {
        btnNext.blur();
        btnNext.animate([{transform:'translateY(0)'},{transform:'translateY(2px)'},{transform:'translateY(0)'}],{duration:180});
        return;
      }
      localStorage.setItem('whatif_prefs', JSON.stringify(state));
      window.location.href = 'fourth.html';
    }

    btnNext.addEventListener('click', persistAndGo);

    // --- swipe destra/sinistra per avanzare solo se selezionato ---
    (function enableSwipe(){
      const area = document.querySelector('.swipeArea');
      let sx=0, sy=0, dx=0, dy=0, start=false;
      const TH=45; // soglia
      area.addEventListener('touchstart', e=>{
        const t=e.touches[0]; sx=t.clientX; sy=t.clientY; start=true;
      }, {passive:true});
      area.addEventListener('touchmove', e=>{
        if(!start) return;
        const t=e.touches[0]; dx=t.clientX-sx; dy=t.clientY-sy;
      }, {passive:true});
      area.addEventListener('touchend', ()=>{
        if(!start) return; start=false;
        if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>TH) {
          // destra→sinistra o sinistra→destra: trattiamoli uguale = avanti
          persistAndGo();
        }
        sx=sy=dx=dy=0;
      });
    })();

    // ripristino selezioni se l’utente torna indietro
    (function restore(){
      try{
        const saved = JSON.parse(localStorage.getItem('whatif_prefs')||'null');
        if(saved){
          state.periodo = saved.periodo||null;
          state.stile   = saved.stile||null;
          if(state.periodo){
            const c = document.querySelector(`#choices-periodo .chip[data-value="${state.periodo}"]`);
            c?.classList.add('selected');
          }
          if(state.stile){
            const c = document.querySelector(`#choices-stile .chip[data-value="${state.stile}"]`);
            c?.classList.add('selected');
          }
          updateNext();
        }
      }catch(_){}
    })();
  </script>
</body>
</html>
