<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Home</title>

<!-- Tema della barra / PWA -->
<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />

<!-- Preload immagine hero per first paint veloce -->
<link rel="preload" as="image" href="/home-hero.png" imagesrcset="/home-hero.png 1x, /home-hero.png 2x" />

<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414; --fg:#EEF5F0; --muted:#A6B6AD;
    --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.10);
    --chip:#0F1714; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
    --shadow:rgba(0,0,0,.45);
  }
  html[data-theme="whatif"]{
    --bg:#0B1018; --bg2:#0E1724; --fg:#F4F7FB; --muted:#A7B3C2;
    --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.12);
    --chip:#121A26; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
  }
  *{box-sizing:border-box}
  html,body{
    height:100%; margin:0; background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
    color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;
  }
  main{min-height:100%; display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px; gap:14px; padding-bottom:120px}
  .hero-img{width:min(92vw,560px); height:auto; display:block; margin:0 auto 6px; border-radius:16px; filter:drop-shadow(0 10px 28px var(--shadow))}
  h1{margin:.25rem 0 0; font-size:clamp(28px,5.5vw,44px); line-height:1.1}
  h1 span{color:var(--accent)}
  .lead{max-width:720px; font-size:clamp(15px,4vw,18px); color:var(--muted); line-height:1.55; margin:4px auto 16px}
  .group{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:6px}
  .chip{
    appearance:none; border:1px solid var(--card-border); background:var(--chip); color:#e8f2ec;
    padding:12px 16px; border-radius:16px; font-weight:700; cursor:pointer; transition:transform .08s, filter .16s;
    backdrop-filter:blur(6px);
  }
  .chip:active{transform:translateY(1px)}
  .chip.selected{background:linear-gradient(180deg,var(--accent),var(--accent2)); color:var(--ink); box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
  .cta{
    display:inline-block; background:linear-gradient(180deg,var(--accent),var(--accent2));
    color:var(--ink); font-weight:800; border:none; border-radius:24px; padding:14px 20px; min-width:220px;
    box-shadow:0 0 14px rgba(0,0,0,.35),0 0 28px rgba(0,0,0,.15); cursor:pointer; transition:.2s;
  }
  .cta[disabled]{opacity:.45; cursor:not-allowed}
  /* Language pill */
  .lang-fab{position:fixed; top:14px; right:14px; z-index:50}
  .lang-btn{
    appearance:none; border:1px solid var(--card-border); background:var(--chip); color:var(--fg);
    padding:10px 12px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-weight:700;
  }
  .flag{width:18px; height:18px; border-radius:999px; background:radial-gradient(white,white) center/100% 100%, linear-gradient(90deg,#009246 33%,#fff 33% 66%,#ce2b37 0);}
  .flag.en{background:linear-gradient(180deg,#1E3A8A 50%,#fff 0), radial-gradient(circle at 30% 35%,#fff 8%,transparent 0), radial-gradient(circle at 38% 50%,#fff 8%,transparent 0);}
  footer{position:fixed; left:0; right:0; bottom:10px; text-align:center; color:var(--muted); font-size:12px; padding:0 14px}
  footer a{color:var(--accent); text-decoration:none; font-weight:600}
  footer .sep{opacity:.6; margin:0 6px}
  .info-btn{background:var(--chip); border:1px solid var(--card-border); color:#E6F2F5; border-radius:999px; padding:6px 10px; font-weight:700; text-decoration:none}
</style>

<script>
  // Applica tema prima del paint (niente flash)
  (function(){
    try{
      const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
      document.documentElement.setAttribute('data-theme', prefs?.stile==='wtf' ? 'wtf' : 'whatif');
      if(!localStorage.getItem('lang')) localStorage.setItem('lang','it');
      document.documentElement.lang = (localStorage.getItem('lang')||'it');
    }catch(e){ document.documentElement.setAttribute('data-theme','whatif'); }
  })();
</script>
</head>
<body>

  <!-- Language quick toggle -->
  <div class="lang-fab">
    <button id="langToggle" class="lang-btn" aria-label="Change language">
      <span id="flag" class="flag" aria-hidden="true"></span>
      <span id="langLabel">EN</span>
    </button>
  </div>

  <main>
    <!-- IMMAGINE: percorso semplice e veloce -->
    <img id="hero" class="hero-img"
         src="/home-hero.png"
         alt="Porta luminosa What?f"
         width="1120" height="720"
         loading="eager" decoding="async" fetchpriority="high"
         onerror="this.remove()" />

    <h1 id="appTitle"><span data-i18n="title">Scopri il tuo What?f</span></h1>
    <p class="lead" id="leadText"></p>

    <!-- Scelte -->
    <div class="group" id="periodGroup">
      <button class="chip" data-key="periodo" data-val="past"   data-i18n="past">Passato</button>
      <button class="chip" data-key="periodo" data-val="future" data-i18n="future">Futuro</button>
    </div>
    <div class="group" id="styleGroup">
      <button class="chip" data-key="stile" data-val="whatif" data-i18n="whatif">What if</button>
      <button class="chip" data-key="stile" data-val="wtf"    data-i18n="wtf">What the F</button>
    </div>

    <button id="go" class="cta" disabled data-i18n="next">Avanti</button>
  </main>

  <footer>
    © 2025 What?f
    <div class="foot-links">
      <a href="privacy.html" data-i18n="privacy">Privacy</a>
      <span class="sep">·</span>
      <a href="terms.html" data-i18n="terms">Termini</a>
      <span class="sep">·</span>
      <a class="info-btn" href="about.html" id="aboutLink"><span data-i18n="info">Info</span></a>
    </div>
  </footer>

<script>
(function(){
  const LS = localStorage;
  const $  = (s)=>document.querySelector(s);

  // Dizionario
  const DICT = {
    it:{
      title:"Scopri il tuo What?f",
      lead:"Immagina la scelta che non hai fatto… e quella che potresti fare. Scegli se guardare al passato o al futuro. <strong>What if</strong> esplora scenari realistici e riflessivi, basati su scelte plausibili. <strong>What the F</strong> ti fa vivere visioni ironiche, creative e imprevedibili.",
      past:"Passato", future:"Futuro", whatif:"What if", wtf:"What the F",
      next:"Avanti", privacy:"Privacy", terms:"Termini", info:"Info"
    },
    en:{
      title:"Discover your What?f",
      lead:"Imagine the choice you didn’t make… and the one you still could. Choose whether to look to the past or the future. <strong>What if</strong> explores realistic, reflective scenarios based on plausible choices. <strong>What the F</strong> lets you experience ironic, creative and unpredictable visions.",
      past:"Past", future:"Future", whatif:"What if", wtf:"What the F",
      next:"Next", privacy:"Privacy", terms:"Terms", info:"Info"
    }
  };

  // i18n apply
  function applyLang(){
    const L = (LS.getItem('lang')||'it').toLowerCase();
    const d = DICT[L] || DICT.it;
    document.documentElement.lang = L;
    // testi
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k = el.getAttribute('data-i18n');
      if(k === 'lead'){ $('#leadText').innerHTML = d.lead; }
      else if(d[k]) el.textContent = d[k];
    });
    // bottone lingua
    $('#langLabel').textContent = (L==='it'?'EN':'IT');
    const flag = $('#flag'); flag.className = 'flag' + (L==='en'?' en':'');
  }

  // Toggle lingua (istantaneo + persistente)
  $('#langToggle').addEventListener('click', ()=>{
    const cur = (LS.getItem('lang')||'it').toLowerCase();
    LS.setItem('lang', cur==='it' ? 'en' : 'it');
    applyLang();
  });

  // Stato selezioni
  const state = JSON.parse(LS.getItem('whatif_prefs')||'{}');

  function syncUI(){
    if(state.periodo){
      document.querySelectorAll('#periodGroup .chip').forEach(c=>c.classList.toggle('selected', c.dataset.val===state.periodo));
    }
    if(state.stile){
      document.querySelectorAll('#styleGroup .chip').forEach(c=>c.classList.toggle('selected', c.dataset.val===state.stile));
      document.documentElement.setAttribute('data-theme', state.stile==='wtf'?'wtf':'whatif');
    }
    $('#go').disabled = !(state.periodo && state.stile);
  }

  function wireGroup(groupId){
    const g = document.getElementById(groupId);
    g.addEventListener('click', (e)=>{
      const b = e.target.closest('.chip'); if(!b) return;
      state[b.dataset.key] = b.dataset.val;
      LS.setItem('whatif_prefs', JSON.stringify(state));
      syncUI();
    });
  }

  wireGroup('periodGroup');
  wireGroup('styleGroup');

  // Prima applicazione
  applyLang();
  syncUI();

  // CTA
  $('#go').addEventListener('click', ()=>{
    if($('#go').disabled) return;
    location.href = 'second.html';
  });

  // SW con auto-update (salta versioni vecchie)
  if('serviceWorker' in navigator){
    window.addEventListener('load', async ()=>{
      try{
        const reg = await navigator.serviceWorker.register('/sw.js');
        if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        reg.addEventListener('updatefound', ()=>{
          const nw = reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange', ()=>{
            if(nw.state==='installed' && navigator.serviceWorker.controller){
              nw.postMessage('SKIP_WAITING');
            }
          });
        });
      }catch{}
    });
  }
})();
</script>
</body>
</html>
