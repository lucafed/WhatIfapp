<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>

  <!-- aiuta a evitare cache aggressive sui meta -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    :root { --bg:#0b1418; --text:#e9f8ff; --accent:#00bcd4; --accent2:#23d8ea; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:24px;padding:16px;}
    /* IMMAGINE BEN VISIBILE */
    .hero{
      display:block;
      width:min(920px, 92vw);
      max-width:100%;
      height:auto;
      border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      user-select:none; -webkit-user-drag:none;
    }
    h1{margin:0;font-size:clamp(22px,4.5vw,36px);font-weight:900;letter-spacing:.4px}
    .brand{color:#6ff3ff;text-shadow:0 0 22px rgba(111,243,255,.35)}
    .btn{
      display:inline-block;text-decoration:none;color:#fff;background:var(--accent);
      padding:16px 26px;border-radius:28px;font-weight:800;letter-spacing:.6px;
      box-shadow:0 0 14px rgba(0,188,212,.45),0 0 28px rgba(0,188,212,.2);
      transition:.2s transform ease,.2s background ease;
    }
    .btn:hover{background:var(--accent2);transform:translateY(-1px)}
    footer{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:13px;opacity:.75}
    footer a{color:#8fefff;text-decoration:none} footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="wrap" id="swipe-area">
    <!-- Forza refresh cache con ?v=4 -->
    <img src="/home-hero.png?v=4" alt="Porta luminosa What?f" class="hero" width="1600" height="1200">

    <h1>BENVENUTO SU <span class="brand">What?f</span></h1>

    <a class="btn" id="cta" href="/second.html">CHOOSE YOUR WAY</a>
  </main>

  <footer>
    © 2025 What?f · <a href="/privacy.html">Privacy</a> · <a href="/termini.html">Termini</a>
  </footer>

  <script>
    const goNext = () => location.href = '/second.html';

    // Swipe a destra per andare avanti
    (function(){
      const area = document.getElementById('swipe-area');
      let sx=0, sy=0, ex=0, ey=0;
      const THRESH_X = 60, LIMIT_Y = 80;
      area.addEventListener('touchstart', e => {
        const t = e.changedTouches[0]; sx=ex=t.clientX; sy=ey=t.clientY;
      }, {passive:true});
      area.addEventListener('touchmove', e => {
        const t = e.changedTouches[0]; ex=t.clientX; ey=t.clientY;
      }, {passive:true});
      area.addEventListener('touchend', () => {
        const dx = ex - sx, dy = Math.abs(ey - sy);
        if (dx < -THRESH_X && dy < LIMIT_Y) goNext();
      }, {passive:true});
      window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') goNext(); });
    })();
  </script>
</body>
</html>
