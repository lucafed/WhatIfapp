<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">
  <link rel="preload" as="image" href="/home-hero.png">

  <style>
    :root {
      --bg:#0A0F14; --fg:#E6EEF2; --muted:#A0B2BA;
      --accent:#00E0FF; --accent2:#00B5CC; --ink:#02242C;
    }
    :root[data-theme="light"]{
      --bg:#F4FAFC; --fg:#132229; --muted:#516771;
      --accent:#00B5CC; --accent2:#0097AD; --ink:#00181F;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

    .page{
      min-height:100vh;display:flex;flex-direction:column;
      justify-content:space-between;align-items:center;
      padding:20px;text-align:center;
    }

    .header{width:100%;display:flex;justify-content:flex-end}
    .theme-toggle{
      cursor:pointer;padding:6px 12px;border-radius:20px;
      background:rgba(255,255,255,.08);font-size:14px;color:var(--muted);
    }

    .hero{width:min(92vw,600px)}
    .hero img{width:100%;height:auto;display:block}

    h1{margin-top:24px;font-size:clamp(28px,6vw,46px)}
    h1 span{color:var(--accent);text-shadow:0 0 8px rgba(0,224,255,.6)}

    .btn{margin-top:24px;display:inline-block;text-decoration:none;
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);font-weight:700;padding:14px 22px;border-radius:28px;
      min-width:220px;box-shadow:0 0 16px rgba(0,181,204,.4)}
    .btn:active{transform:translateY(1px)}

    .swipe-tip{margin-top:16px;font-size:13px;color:var(--muted)}

    .disclaimer{font-size:13px;color:var(--muted);margin:16px 0}
    .disclaimer a{color:var(--accent);text-decoration:none}

    footer{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div id="themeBtn" class="theme-toggle">Tema: <b id="themeLabel">Chiaro</b></div>
    </div>

    <div class="center">
      <div class="hero">
        <img id="hero" alt="Scopri il tuo What?f" loading="eager" decoding="async">
      </div>
      <h1>BENVENUTO SU <span>What?f</span></h1>
      <a id="cta" class="btn" href="./second.html">CHOOSE YOUR WAY</a>
      <div class="swipe-tip">Swipe ↑ o → per continuare</div>
    </div>

    <div class="disclaimer">
      Continuando accetti la nostra <a href="./privacy.html">Privacy Policy</a> e i <a href="./terms.html">Termini d’uso</a>.
    </div>

    <footer>© 2025 What?f</footer>
  </div>

  <!-- Caricamento immagine robusto -->
  <script>
    (async function loadHero(){
      const img=document.getElementById('hero');
      const tries=['/home-hero.png','/public/home-hero.png','/assets/home-hero.png'];
      for(const u of tries){
        try{
          const r=await fetch(u,{cache:'no-store'});
          if(r.ok){img.src=u+'?v='+Date.now();return;}
        }catch(e){}
      }
    })();
  </script>

  <!-- Toggle tema -->
  <script>
    (function(){
      const KEY='whatif-theme';
      const saved=localStorage.getItem(KEY);
      if(saved){document.documentElement.setAttribute('data-theme',saved);}
      function setLabel(){
        const isLight=document.documentElement.getAttribute('data-theme')==='light';
        document.getElementById('themeLabel').textContent=isLight?'Scuro':'Chiaro';
      }
      function toggle(){
        const cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
        const next=(cur==='light')?'dark':'light';
        document.documentElement.setAttribute('data-theme',next);
        localStorage.setItem(KEY,next);setLabel();
      }
      document.getElementById('themeBtn').addEventListener('click',toggle);
      setLabel();
    })();
  </script>

  <!-- Swipe con soglia -->
  <script>
    (function(){
      const NEXT='./second.html';
      let sx=0,sy=0,t0=0;const TH=80,MAXT=900;
      addEventListener('touchstart',e=>{
        const p=e.touches[0];sx=p.clientX;sy=p.clientY;t0=Date.now();
      },{passive:true});
      addEventListener('touchend',e=>{
        const p=e.changedTouches[0];
        const dx=p.clientX-sx,dy=p.clientY-sy,dt=Date.now()-t0;
        if(dt>MAXT)return;
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>TH){if(dx<0)location.href=NEXT;}
        else if(Math.abs(dy)>TH){if(dy<0)location.href=NEXT;}
      },{passive:true});
      document.getElementById('cta').addEventListener('click',e=>{e.preventDefault();location.href=NEXT;});
    })();
  </script>
</body>
</html>
