<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">

  <link rel="preload" as="image" href="/third-hero.png" />

  <style>
    :root { --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA; --accent:#00E0FF; --accent-dark:#00B5CC; }
    *{ box-sizing:border-box; }
    html,body{
      height:100%; margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    main{
      min-height:100%; display:flex; flex-direction:column; align-items:center;
      justify-content:flex-start; padding:12px 16px 56px; gap:12px;
      text-align:center;
    }

    /* Contenitore immagine */
    .hero-container{
      position:relative; width:min(94vw,640px); margin:0 auto; margin-top:10px;
    }
    .hero-img{
      width:100%; height:auto; display:block;
      border-radius:20px; filter:drop-shadow(0 10px 28px rgba(0,0,0,.45));
    }

    /* Bottone dentro immagine, più piccolo */
    .overlay-btn{
      position:absolute; left:50%; transform:translateX(-50%);
      bottom:10%; 
      background:var(--accent-dark); color:#001f26; font-weight:700;
      padding:8px 14px; border-radius:20px; text-decoration:none;
      box-shadow:0 0 8px rgba(0,181,204,.6), 0 0 16px rgba(0,181,204,.3);
      font-size:14px; white-space:nowrap;
    }
    .overlay-btn:active{ transform:translate(-50%,1px) }

    /* Titolo sotto l’immagine */
    h1{
      margin:10px 0 0; font-size:clamp(26px,5vw,34px); line-height:1.2;
    }
    h1 span{
      color:var(--accent);
      text-shadow:0 0 6px rgba(0,224,255,.7), 0 0 12px rgba(0,224,255,.4);
    }

    /* Footer */
    footer{
      position:fixed; left:0; right:0; bottom:8px;
      text-align:center; color:var(--muted); font-size:12px;
      padding:0 10px;
    }
    footer a{ color:var(--accent); text-decoration:none; margin:0 6px }
  </style>
</head>
<body>
  <main>
    <div class="hero-container">
      <img id="hero" class="hero-img" alt="Porte What?f" loading="eager" decoding="async" />
      <a href="fourth.html" class="overlay-btn">CHOOSE YOUR WAY</a>
    </div>

    <h1>Scopri il tuo <span>What?f</span></h1>
  </main>

  <footer>
    © 2025 What?f · <a href="privacy.html">Privacy</a> · <a href="terms.html">Termini</a>
  </footer>

  <!-- Loader immagine -->
  <script>
    (async function loadHero(){
      const hero = document.getElementById('hero');
      const tries = ['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for (const u of tries) {
        try {
          const r = await fetch(u, { cache:'no-store' });
          if (r.ok) { hero.src = u + '?v=' + Date.now(); return; }
        } catch(e){}
      }
      hero.alt = "Immagine non trovata";
    })();
  </script>
</body>
</html>
