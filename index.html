<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">

  <style>
    :root {
      --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC;
    }
    *{ box-sizing:border-box; margin:0; padding:0 }
    html,body{ height:100%; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif }
    main{ min-height:100%; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; gap:16px; padding:20px }

    .hero-img{ width:min(92vw,520px); height:auto; display:block; margin:0 auto;
      filter:drop-shadow(0 8px 20px rgba(0,0,0,.45)) }

    h1{ font-size:clamp(26px,5vw,40px); color:var(--accent); margin-bottom:10px;
        text-shadow:0 0 12px rgba(0,224,255,.5); }

    p.desc{ font-size:clamp(15px,4vw,18px); max-width:600px; line-height:1.4; color:var(--muted); }

    .btn{ display:inline-block; margin-top:14px; text-decoration:none;
      background:var(--accent-dark); color:#001f26; font-weight:700;
      padding:14px 22px; border-radius:28px; font-size:16px;
      box-shadow:0 0 12px rgba(0,181,204,.6), 0 0 24px rgba(0,181,204,.3);
      transition:.2s }
    .btn:hover{ filter:brightness(1.15) }
    .btn:active{ transform:translateY(1px) }
  </style>
</head>
<body>
  <main>
    <h1>Scopri il tuo What?f</h1>

    <img id="hero" class="hero-img" src="third-hero.png" alt="Porte luminose What?f" loading="eager" decoding="async" />

    <p class="desc">
      Immagina di tornare indietro o guardare avanti.  
      Cosa sarebbe successo se avessi fatto un’altra scelta?  
      Cosa potrebbe accadere se aprirai una porta diversa?
    </p>

    <a href="fourth.html" class="btn">CHOOSE YOUR WAY</a>
  </main>

  <!-- Swipe destra/sinistra -->
  <script>
    (function(){
      let startX=0;
      document.addEventListener('touchstart', e=>{
        startX=e.touches[0].clientX;
      });
      document.addEventListener('touchend', e=>{
        let dx=e.changedTouches[0].clientX-startX;
        if(dx<-50){ window.location.href="fourth.html"; } // swipe sinistra → avanti
      });
    })();
  </script>
</body>
</html>
