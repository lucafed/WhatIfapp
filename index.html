<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f – Home</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0A0F14">
  <style>
    body {
      background-color: #0A0F14;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .hero-img {
      width: min(90vw, 420px);
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,.45));
    }
    .description {
      max-width: 600px;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 24px;
      color: #A0B2BA;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      background: #00B5CC;
      color: #001f26;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 28px;
      box-shadow: 0 0 12px rgba(0,181,204,.6), 0 0 24px rgba(0,181,204,.3);
      transition: 0.2s;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="container">
    <img src="home-hero.png" alt="Porte What?f" class="hero-img">

    <h1>Scopri il tuo <span style="color:#00E0FF;">What?f</span></h1>

    <p class="description">
      Entra in un viaggio tra passato e futuro: fai la tua domanda e scopri cosa sarebbe successo se avessi fatto un’altra scelta. 
      Oppure immagina cosa potrebbe accadere scegliendo una porta diversa. 
      Lascia che l’AI ti sorprenda con nuove prospettive!
    </p>

    <a href="fourth.html" class="btn">CHOOSE YOUR WAY</a>
  </div>
</body>
</html>
