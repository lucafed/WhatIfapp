<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">

  <link rel="preload" as="image" href="/third-hero.png" />

  <style>
    :root { --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA;
            --accent:#00E0FF; --accent-dark:#00B5CC; }
    [data-theme="light"] { --bg:#fdfdfd; --fg:#111; --muted:#555; }

    *{ box-sizing:border-box }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif }
    main{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:20px; gap:18px; transition: opacity .45s ease, transform .45s ease; }

    .hero-img{ width:min(95vw,600px); height:auto; display:block; margin:0 auto;
      filter:drop-shadow(0 10px 28px rgba(0,0,0,.45)) }
    .hero-fallback{ color:var(--muted); font-size:14px; display:none; margin-top:-6px }

    h1{ margin:.5rem 0 0; font-size:clamp(30px,6vw,46px); line-height:1.2 }
    h1 span{ color:var(--accent); }

    p.desc{ max-width:650px; font-size:clamp(15px,3.5vw,19px); line-height:1.5; color:var(--muted) }

    .btn{ display:inline-block; text-decoration:none; background:var(--accent-dark);
      color:#001f26; font-weight:700; padding:14px 28px; border-radius:28px;
      box-shadow:0 0 12px rgba(0,181,204,.6), 0 0 24px rgba(0,181,204,.3);
      animation: pulse 2s infinite; transition:.2s }
    .btn:hover{ filter:brightness(1.15) }
    .btn:active{ transform:translateY(1px) }
    @keyframes pulse {
      0% { box-shadow:0 0 10px rgba(0,181,204,.5), 0 0 20px rgba(0,181,204,.2) }
      50%{ box-shadow:0 0 18px rgba(0,224,255,.9), 0 0 36px rgba(0,224,255,.4) }
      100%{ box-shadow:0 0 10px rgba(0,181,204,.5), 0 0 20px rgba(0,181,204,.2) }
    }

    #themeToggle{ position:fixed; top:12px; right:12px; background:var(--accent-dark);
      color:#001f26; border:none; border-radius:50%; width:42px; height:42px;
      cursor:pointer; font-size:18px; box-shadow:0 0 6px rgba(0,0,0,.4) }
  </style>
</head>
<body>
  <button id="themeToggle">☀️</button>
  <main>
    <img id="hero" class="hero-img" alt="Le porte di What?f" loading="eager" decoding="async" />
    <div id="heroFallback" class="hero-fallback">Caricamento immagine…</div>

    <h1>Scopri il tuo <span>What?f</span></h1>
    <p class="desc">
      Entra in un viaggio tra passato e futuro: fai la tua domanda e scopri cosa sarebbe successo se avessi fatto un’altra scelta.<br>
      Scopri cosa potrebbe accadere se sceglierai quella porta. Lascia che l’AI ti sorprenda con nuove prospettive!
    </p>

    <a href="fourth.html" id="cta" class="btn">CHOOSE YOUR WAY</a>
  </main>

  <script>
    // tema persistente
    const btn = document.getElementById("themeToggle");
    const root = document.documentElement;
    const saved = localStorage.getItem("theme");
    if(saved) root.setAttribute("data-theme", saved);

    function updateIcon(){
      btn.textContent = root.getAttribute("data-theme")==="light" ? "🌙" : "☀️";
    }
    updateIcon();

    btn.addEventListener("click", ()=>{
      const newTheme = root.getAttribute("data-theme")==="light" ? "dark" : "light";
      root.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
      updateIcon();
    });

    // immagine con fallback
    (async function loadHero(){
      const hero = document.getElementById('hero');
      const fb = document.getElementById('heroFallback');
      const tries = ['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for (const u of tries) {
        try {
          const r = await fetch(u, { cache:'no-store' });
          if (r.ok) { hero.src = u + '?v=' + Date.now(); fb.style.display = 'none'; return; }
        } catch(e) {}
      }
      fb.textContent = 'Immagine non trovata.'; fb.style.display = 'block';
    })();
  </script>
</body>
</html>
