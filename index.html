<!doctype html>

<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Home</title>  <!-- PWA -->  <meta name="theme-color" content="#0B0F14" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />  <!-- Performance: pre-carica hero -->  <link rel="preload" as="image" href="/home-hero.png" />  <!-- Tema molto-early (evita flash) -->  <script>
    (function(){
      try{
        var prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        var theme = prefs.stile==='wtf' ? 'wtf' : 'whatif';
        document.documentElement.setAttribute('data-theme', theme);
        var L = (localStorage.getItem('lang')||'it').toLowerCase();
        document.documentElement.lang = (L==='en'?'en':'it');
      }catch(e){ document.documentElement.setAttribute('data-theme','whatif'); }
    })();
  </script>  <style>
    /* ===== THEME SYSTEM (palette ufficiali) ===== */
    :root{
      --bg:#0C0F14; --bg2:#0E1724;
      --fg:#ffffff; --muted:#A0B2BA;
      --card:rgba(14,19,28,.55); --card-border:rgba(255,255,255,.10);
      --chip:#141C22;
      --accent:#1C57A0;     /* Blu Verona */
      --accent2:#FFEC01;    /* Giallo Verona */
      --ink:#0A0E12;
      --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.12);
      --chip:#121A26;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.10);
      --chip:#0F1714;
      --accent:#3A6B56;     /* Verde speranza */
      --accent2:#5A8C75;    /* Verde chiaro */
      --ink:#06110B;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }

    main{
      min-height:100%;
      display:flex; flex-direction:column; align-items:center; text-align:center;
      padding:20px; gap:14px;
      padding-bottom:120px;
    }

    /* Lingua (fab) */
    .lang-fab{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; z-index:50}
    .lang-btn{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:var(--fg);
      padding:10px 12px; border-radius:999px; cursor:pointer
    }
    .lang-menu{
      position:absolute; top:46px; right:0; background:var(--card); border:1px solid var(--card-border);
      border-radius:12px; padding:8px; display:none; min-width:170px;
      box-shadow:0 12px 28px var(--shadow); backdrop-filter:blur(10px)
    }
    .lang-menu button{
      display:block; width:100%; text-align:left; background:transparent; border:none;
      color:#E6F2F5; padding:10px; border-radius:10px; cursor:pointer
    }
    .lang-menu button.active{background:rgba(255,255,255,.06)}

    /* Hero */
    .hero-img{
      width:min(92vw,560px); height:auto; display:block; margin:0 auto 6px;
      filter:drop-shadow(0 10px 28px var(--shadow));
      border-radius:16px;
    }

    /* Titoli & lead */
    h1{margin:.25rem 0 0; font-size:clamp(28px,5.5vw,44px); line-height:1.1; cursor:default}
    h1 span{color:var(--accent)}
    .lead{
      max-width:720px; font-size:clamp(15px,4vw,18px); color:var(--muted);
      line-height:1.55; margin:4px auto 16px;
    }

    /* Scelte */
    .group{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:6px}
    .chip{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:#e8f2ec;
      padding:12px 16px; border-radius:16px; font-weight:700; cursor:pointer;
      transition:transform .08s ease, background .16s ease, box-shadow .16s ease, color .16s ease;
      backdrop-filter:blur(6px);
    }
    .chip:active{transform:translateY(1px)}
    .chip.selected{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
    }

    /* CTA */
    .cta{
      display:inline-block;
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); font-weight:800; border:none; border-radius:24px;
      padding:14px 20px; min-width:220px;
      box-shadow:0 0 14px rgba(0,0,0,.35),0 0 28px rgba(0,0,0,.15);
      cursor:pointer; transition:.2s
    }
    .cta[disabled]{opacity:.45; cursor:not-allowed}

    /* Footer */
    footer{
      position:fixed; left:0; right:0; bottom:10px; text-align:center;
      color:var(--muted); font-size:12px; padding:0 14px;
    }
    footer a{
      color:var(--accent); text-decoration:none; font-weight:600;
    }
    footer .sep{opacity:.6; margin:0 6px}
    .foot-links{
      display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
      margin-top:6px;
    }
    .info-btn{
      background:var(--chip); border:1px solid var(--card-border); color:#E6F2F5;
      border-radius:999px; padding:6px 10px; font-weight:700; text-decoration:none;
    }
  </style></head>
<body>
  <!-- Selettore lingua -->
  <div class="lang-fab" id="langFab">
    <button class="lang-btn" id="langToggle" aria-haspopup="true" aria-expanded="false" aria-label="Change language">🌐</button>
    <div class="lang-menu" id="langMenu" role="menu" aria-label="language">
      <button data-lang="it">Italiano</button>
      <button data-lang="en">English</button>
    </div>
  </div>  <main>
    <!-- Hero rapido: width/height, eager, decoding async, fetchpriority -->
    <img
      id="hero"
      class="hero-img"
      alt="Porta luminosa What?f"
      src="/home-hero.png"
      width="1120"
      height="720"
      loading="eager"
      decoding="async"
      fetchpriority="high"
    /><h1 id="appTitle"><span data-i18n="title">Scopri il tuo What?f</span></h1>

<p class="lead" id="leadText"></p>

<!-- Scelte -->
<div class="group" id="periodGroup">
  <button class="chip" data-key="periodo" data-val="past"   data-i18n="past">Passato</button>
  <button class="chip" data-key="periodo" data-val="future" data-i18n="future">Futuro</button>
</div>
<div class="group" id="styleGroup">
  <button class="chip" data-key="stile" data-val="whatif" data-i18n="whatif">What if</button>
  <button class="chip" data-key="stile" data-val="wtf"    data-i18n="wtf">What the F</button>
</div>

<button id="go" class="cta" disabled data-i18n="next">Avanti</button>

  </main>  <footer>
    © 2025 What?f
    <div class="foot-links">
      <a href="privacy.html" data-i18n="privacy">Privacy</a>
      <span class="sep">·</span>
      <a href="terms.html" data-i18n="terms">Termini</a>
      <span class="sep">·</span>
      <a class="info-btn" href="about.html" id="aboutLink"><span data-i18n="info">Info</span></a>
    </div>
  </footer>  <!-- i18n + theme + selections (v2 veloce & completa) -->  <script>
  (function(){
    "use strict";

    /* ====== STATE & HELPERS ====== */
    const LS = localStorage;
    const $  = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    // lingua persistita (default it)
    let LANG = (LS.getItem("lang") || "it").toLowerCase();

    // preferenze app (stile/periodo)
    const state = safeRead("whatif_prefs", { periodo: null, stile: null });

    function safeRead(k, def){ try{ return JSON.parse(LS.getItem(k) || JSON.stringify(def)); }catch{ return def; } }
    function safeWrite(k,v){ LS.setItem(k, JSON.stringify(v)); }

    // dizionario i18n (testi completi della home)
    const DICT = {
      it:{
        title:"Scopri il tuo What?f",
        lead:"Immagina la scelta che non hai fatto… e quella che potresti fare. Scegli se guardare al passato o al futuro. <strong>What if</strong> esplora scenari realistici e riflessivi, basati su scelte plausibili. <strong>What the F</strong> ti fa vivere visioni ironiche, creative e imprevedibili.",
        past:"Passato", future:"Futuro",
        whatif:"What if", wtf:"What the F",
        next:"Avanti", privacy:"Privacy", terms:"Termini", info:"Info",
        langToggleCycle:"EN"
      },
      en:{
        title:"Discover your What?f",
        lead:"Imagine the choice you didn’t make… and the one you could make. Choose whether to look to the past or the future. <strong>What if</strong> explores realistic, reflective scenarios based on plausible choices. <strong>What the F</strong> lets you experience ironic, creative and unpredictable visions.",
        past:"Past", future:"Future",
        whatif:"What if", wtf:"What the F",
        next:"Next", privacy:"Privacy", terms:"Terms", info:"Info",
        langToggleCycle:"IT"
      }
    };

    /* ====== LINGUA: APPLY + UI ====== */
    function applyLang(lang){
      const d = DICT[lang] || DICT.it;
      LANG = lang;
      LS.setItem("lang", lang);
      document.documentElement.lang = lang;

      // titolo / lead
      const titleEl = $("#appTitle [data-i18n='title']");
      if (titleEl) titleEl.textContent = d.title;
      const leadEl  = $("#leadText");
      if (leadEl)  leadEl.innerHTML = d.lead;

      // chip periodi
      const pastBtn = document.querySelector('#periodGroup .chip[data-val="past"]');
      const futBtn  = document.querySelector('#periodGroup .chip[data-val="future"]');
      if (pastBtn) pastBtn.textContent = d.past;
      if (futBtn)  futBtn.textContent  = d.future;

      // chip stili
      const wiBtn = document.querySelector('#styleGroup .chip[data-val="whatif"]');
      const wtfBtn= document.querySelector('#styleGroup .chip[data-val="wtf"]');
      if (wiBtn)  wiBtn.textContent  = d.whatif;
      if (wtfBtn) wtfBtn.textContent = d.wtf;

      // CTA
      const go = $("#go"); if (go) go.textContent = d.next;

      // Footer
      $("a[data-i18n='privacy']").textContent = d.privacy;
      $("a[data-i18n='terms']").textContent   = d.terms;
      $("span[data-i18n='info']").textContent = d.info;

      // Language UI (mostra lingua alternativa sul bottone 🌐)
      const langToggle = $("#langToggle");
      if (langToggle) langToggle.textContent = "🌐 " + (d.langToggleCycle || (lang==="it"?"EN":"IT"));

      // menu: evidenzia lingua attiva
      $$("#langMenu button").forEach(b=>{
        b.classList.toggle("active", (b.dataset.lang||"").toLowerCase() === lang);
      });
    }

    /* ====== LANGUAGE EVENTS (menu + toggle rapido) ====== */
    const langFab    = $("#langFab");
    const langToggle = $("#langToggle");
    const langMenu   = $("#langMenu");

    // Mostra/chiudi menù lingua
    if (langToggle){
      langToggle.addEventListener("pointerdown", (e)=>{
        e.preventDefault();
        const open = langMenu && langMenu.style.display === "block";
        if (langMenu) langMenu.style.display = open ? "none" : "block";
      }, {passive:false});
    }
    // Chiudi menu clic fuori
    document.addEventListener("click",(e)=>{
      if (!langMenu) return;
      if (langFab && !langFab.contains(e.target)) langMenu.style.display = "none";
    });
    // Selezione lingua dal menù
    if (langMenu){
      langMenu.addEventListener("click",(e)=>{
        const b = e.target.closest("button[data-lang]");
        if (!b) return;
        const newLang = (b.dataset.lang||"it").toLowerCase();
        applyLang(newLang);
        langMenu.style.display = "none";
      });
    }

    /* ====== TEMA: già applicato nel <head>, ma aggiorna se cambia stile ====== */
    function syncUIFromState(){
      // periodo
      if (state.periodo){
        $$("#periodGroup .chip").forEach(c=>c.classList.remove("selected"));
        const sel = document.querySelector(`#periodGroup .chip[data-val="${state.periodo}"]`);
        if (sel) sel.classList.add("selected");
      }
      // stile
      if (state.stile){
        $$("#styleGroup .chip").forEach(c=>c.classList.remove("selected"));
        const sel = document.querySelector(`#styleGroup .chip[data-val="${state.stile}"]`);
        if (sel) sel.classList.add("selected");
        document.documentElement.setAttribute("data-theme", state.stile === "wtf" ? "wtf" : "whatif");
      }
      // abilita CTA
      const go = $("#go");
      if (go) go.disabled = !(state.periodo && state.stile);
    }

    function wireGroup(groupId){
      const g = $(groupId); if (!g) return;
      g.addEventListener("pointerdown",(e)=>{
        const b = e.target.closest(".chip"); if (!b) return;
        e.preventDefault();
        g.querySelectorAll(".chip").forEach(c=>c.classList.remove("selected"));
        b.classList.add("selected");
        state[b.dataset.key] = b.dataset.val;
        safeWrite("whatif_prefs", state);
        if (b.dataset.key === "stile"){
          document.documentElement.setAttribute("data-theme", b.dataset.val === "wtf" ? "wtf" : "whatif");
        }
        const go = $("#go");
        if (go) go.disabled = !(state.periodo && state.stile);
      }, { passive:false });
    }

    /* ====== AVVIO RAPIDO ====== */
    applyLang(LANG);
    wireGroup("#periodGroup");
    wireGroup("#styleGroup");
    syncUIFromState();

    const go = $("#go");
    if (go){
      go.addEventListener("click", ()=>{
        if (go.disabled) return;
        location.href = "second.html";
      });
    }
  })();
  </script>  <!-- Admin segreto: 3 tap sul titolo + 5 tap su "Passato" -->  <script>
    (function(){
      const title = document.getElementById('appTitle') || document.querySelector('h1');
      const pastBtn = document.querySelector('button[data-val="past"]');

      if(!title || !pastBtn) return;

      let tapTitle = 0;
      let tapPast = 0;
      let stage = 0; // 0 = non iniziato, 1 = attesa 5 tap su "Passato"
      let timer = null;

      function resetAll(){
        tapTitle = 0; tapPast = 0; stage = 0;
        if(timer) clearTimeout(timer);
        timer = null;
        pastBtn.classList.remove("unlocking");
      }

      function flashScreen(){
        const flash = document.createElement("div");
        flash.style.position="fixed";
        flash.style.inset="0";
        flash.style.background="rgba(255,255,255,0.05)";
        flash.style.backdropFilter="blur(2px)";
        flash.style.transition="opacity .6s ease";
        flash.style.opacity="1";
        flash.style.zIndex="9999";
        document.body.appendChild(flash);
        setTimeout(()=>flash.style.opacity="0",150);
        setTimeout(()=>flash.remove(),800);
      }

      function success(){
        resetAll();
        const pin = prompt("PIN amministratore:");
        if(!pin) return;
        try{ sessionStorage.setItem("pending_admin_pin", pin); }catch{}
        location.href = "admin.html";
      }

      title.addEventListener('click', ()=>{
        tapTitle++;
        if(timer) clearTimeout(timer);
        timer = setTimeout(resetAll, 2000);

        if(tapTitle >= 3){
          stage = 1;
          tapTitle = 0;
          flashScreen();
          // feedback sul bottone "Passato"
          pastBtn.classList.add("unlocking");
          pastBtn.style.boxShadow = "0 0 0 2px rgba(255,255,255,.15) inset, 0 0 22px rgba(255,255,255,.12)";
          setTimeout(()=>{ if(stage!==1) pastBtn.classList.remove("unlocking"); }, 2500);
        }
      });

      pastBtn.addEventListener('click', ()=>{
        if(stage !== 1) return;
        tapPast++;
        if(timer) clearTimeout(timer);
        timer = setTimeout(resetAll, 2500);
        if(tapPast >= 5){ success(); }
      });
    })();
  </script>  <!-- SW (silenzioso) -->  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(()=>{});
      });
    }
  </script></body>
</html>
