<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f – Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:#0A0F14;
      color:#fff;
      text-align:center;
    }
    .hero {
      max-width:100%;
      height:auto;
      margin:20px auto;
      display:block;
    }
    h1 {font-size:2rem;margin:20px 0 10px;}
    .subtitle {font-size:1.1rem; margin-bottom:20px;}
    .choice {display:flex;justify-content:center;gap:20px;margin-top:20px;}
    .btn {
      padding:15px 25px;
      border-radius:30px;
      font-weight:bold;
      text-decoration:none;
      font-size:1rem;
      display:inline-block;
      transition:transform 0.2s;
    }
    .btn:hover {transform:scale(1.05);}
    .btn-cyan   {background:linear-gradient(180deg,#00E0FF,#00B5CC); color:#062025;}
    .btn-orange {background:linear-gradient(180deg,#FFB347,#FF8C00); color:#2b1800;}
  </style>
</head>
<body>
  <img src="third-hero.png" alt="Porte Whatif" class="hero">
  <h1>Scopri il tuo <span style="color:#00E0FF">What?f</span></h1>
  <p class="subtitle">Immagina la scelta che non hai fatto… e quella che potresti fare domani.<br>
    What?f ti mostra “cosa sarebbe potuto accadere” e “cosa potrebbe accadere” se scegli una porta invece dell’altra.</p>

  <div class="choice">
    <a href="fourth.html?mode=whatif" class="btn btn-cyan">WHAT?F</a>
    <a href="fourth.html?mode=wtf" class="btn btn-orange">WHAT THE F</a>
  </div>

  <script>
    // Swipe avanti/indietro
    let startX=0, startY=0;
    document.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    });
    document.addEventListener("touchend",e=>{
      let dx=e.changedTouches[0].clientX-startX;
      let dy=e.changedTouches[0].clientY-startY;
      if(Math.abs(dx)>60 && Math.abs(dy)<70){
        if(dx<0){ location.href="fourth.html?mode=whatif"; }
      }
    });
  </script>
</body>
</html>
