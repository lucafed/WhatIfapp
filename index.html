<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0A0F14;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .slider {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .slide {
      flex: 0 0 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .slide img {
      max-width: 250px;
      margin-bottom: 20px;
    }

    h1 {
      color: #00E0FF;
    }

    p {
      color: #A0B2BA;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #00E0FF;
      color: #000;
      font-weight: bold;
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
    }

    .controls {
      position: absolute;
      bottom: 80px;
      display: flex;
      justify-content: center;
      width: 100%;
      gap: 15px;
      font-size: 18px;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 12px;
      color: #A0B2BA;
    }

    footer a {
      color: #00E0FF;
      text-decoration: none;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="slider" id="slider">
    <!-- Slide 1 -->
    <div class="slide">
      <img src="home-hero.png" alt="Porta luminosa What?f">
      <h1>BENVENUTO SU<br><span style="color:#00E0FF;">What?f</span></h1>
      <p>Le porte che non hai aperto e quelle che aprirai.</p>
      <button class="btn" onclick="nextSlide()">CHOOSE YOUR WAY</button>
    </div>

    <!-- Slide 2 -->
    <div class="slide">
      <img src="second-hero.png" alt="Seconda schermata">
      <h1>Scopri il tuo <span style="color:#00E0FF;">What?f</span></h1>
      <p>Le scelte ci definiscono. Cosa sarebbe successo se…?</p>
      <button class="btn" onclick="nextSlide()">INIZIA</button>
    </div>

    <!-- Slide 3 -->
    <div class="slide">
      <img src="third-hero.png" alt="Terza schermata">
      <h1>Scegli come vivere <span style="color:#00E0FF;">What?f</span></h1>
      <p>Modalità normale o ironica? Tocca per decidere.</p>
      <button class="btn">ENTRA</button>
    </div>
  </div>

  <!-- Controlli swipe -->
  <div class="controls">
    <span onclick="prevSlide()">⬅️ SWIPE ➡️</span>
  </div>

  <footer>
    © 2025 What?f · <a href="#">Privacy</a> · <a href="#">Termini</a>
  </footer>

  <script>
    let currentSlide = 0;
    const slider = document.getElementById('slider');
    const totalSlides = document.querySelectorAll('.slide').length;

    function showSlide(index) {
      if (index >= totalSlides) currentSlide = 0;
      else if (index < 0) currentSlide = totalSlides - 1;
      else currentSlide = index;

      slider.style.transform = `translateX(-${currentSlide * 100}%)`;
    }

    function nextSlide() {
      showSlide(currentSlide + 1);
    }

    function prevSlide() {
      showSlide(currentSlide - 1);
    }

    // Swipe touch per mobile
    let startX = 0;
    slider.addEventListener("touchstart", e => startX = e.touches[0].clientX);
    slider.addEventListener("touchend", e => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) nextSlide();
      else if (endX - startX > 50) prevSlide();
    });
  </script>
</body>
</html>
