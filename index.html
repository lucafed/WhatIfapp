<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Home</title>

  <meta name="theme-color" content="#0B0B0C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/public/icon-192.png" />
  <link rel="apple-touch-icon" href="/public/icon-512.png" />

  <style>
    body {
      background: #0C0F14;
      color: #fff;
      font-family: system-ui, sans-serif;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }
    .cta { background: linear-gradient(180deg,#1C57A0,#FFEC01); border:none; border-radius:24px;
      padding:14px 22px; font-weight:700; cursor:pointer; margin-top:14px;
    }
    .chip { border:1px solid rgba(255,255,255,.2); border-radius:16px; padding:10px 16px; margin:4px; background:#141c22; color:#fff; cursor:pointer; }
    #authError { color:#ffb3b3; font-size:14px; margin-top:12px; min-height:20px; }
  </style>
</head>
<body>

  <h1>Scopri il tuo What?f</h1>
  <p>Immagina la scelta che non hai fatto… e quella che potresti fare.</p>

  <div>
    <button class="chip" data-key="periodo" data-val="past">Passato</button>
    <button class="chip" data-key="periodo" data-val="future">Futuro</button>
  </div>
  <div>
    <button class="chip" data-key="stile" data-val="whatif">What if</button>
    <button class="chip" data-key="stile" data-val="wtf">What the F</button>
  </div>

  <button id="primaryCta" class="cta">Entra con Google</button>
  <button id="logoutBtn" class="chip" style="display:none">Esci</button>
  <p id="authError"></p>

  <!-- 🔍 Overlay per vedere errori su mobile -->
  <script>
    (function(){
      const box=document.createElement('pre');
      box.id='mobileDebug';
      box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;max-height:40vh;overflow:auto;background:rgba(0,0,0,.75);color:#0f0;padding:8px;border-radius:8px;font:12px monospace;z-index:9999;';
      document.body.appendChild(box);
      window.mlog=(...a)=>{ box.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' ')+'\n'; };
      mlog('DEBUG overlay attivo 📲');
    })();
  </script>

  <!-- 🔐 Firebase Auth + Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, onAuthStateChanged,
      signInWithRedirect, getRedirectResult, signOut,
      browserLocalPersistence, setPersistence
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, runTransaction, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASrGnHOnf_O-N0NuZDvqOGGfG8IoSWblc",
      authDomain: "whatif-oracolo.firebaseapp.com",
      projectId: "whatif-oracolo",
      storageBucket: "whatif-oracolo.appspot.com",
      messagingSenderId: "602976466053",
      appId: "1:602976466053:web:668d4a462286513d8b25ec"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    await setPersistence(auth, browserLocalPersistence);

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const primaryCta = document.getElementById("primaryCta");
    const logoutBtn = document.getElementById("logoutBtn");
    const errBox = document.getElementById("authError");

    const showErr = (m)=>{ errBox.textContent=m||""; mlog("❌",m); };

    const selectionsReady = ()=>{
      try{
        const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        return !!(prefs.periodo && prefs.stile);
      }catch{return false;}
    };

    function updatePrimaryCta(){
      const user=auth.currentUser;
      if(user){
        primaryCta.textContent = selectionsReady() ? "Avanti" : "Scegli prima sopra";
        logoutBtn.style.display="inline-block";
      }else{
        primaryCta.textContent="Entra con Google";
        logoutBtn.style.display="none";
      }
    }

    async function ensureDailyWallet(uid){
      const ref = doc(db, "wallets", uid);
      const snap = await getDoc(ref);
      const today = new Date(Date.now() - (new Date().getTimezoneOffset()*60000))
        .toISOString().slice(0,10);
      if(!snap.exists()){
        mlog("💾 Creo nuovo wallet per",uid);
        await setDoc(ref,{
          available:3, surprise:1, lastDaily:today,
          adCount:0, adDay:today,
          createdAt:serverTimestamp(), updatedAt:serverTimestamp()
        },{merge:true});
      }else{
        const data = snap.data();
        if((data.lastDaily||"")!==today){
          mlog("🔁 Reset giornaliero wallet",uid);
          await runTransaction(db, async tx=>{
            tx.update(ref,{available:3,surprise:1,lastDaily:today,adCount:0,adDay:today,updatedAt:serverTimestamp()});
          });
        }else{
          mlog("✅ Wallet già aggiornato oggi");
        }
      }
    }

    primaryCta.onclick = async ()=>{
      showErr("");
      const user = auth.currentUser;
      if(!user){
        try{
          mlog("➡️ Redirect Google...");
          await signInWithRedirect(auth, provider);
        }catch(e){
          showErr("Errore login: "+(e.code||e.message));
        }
        return;
      }
      if(selectionsReady()){
        location.href="second.html";
      }else{
        showErr("Seleziona prima Passato/Futuro e What if/WTF");
      }
    };

    logoutBtn.onclick = async ()=>{ await signOut(auth); updatePrimaryCta(); };

    let didPostRedirectWallet=false;
    getRedirectResult(auth)
      .then(async res=>{
        if(res?.user){
          mlog("🔐 Redirect OK",res.user.uid);
          await ensureDailyWallet(res.user.uid);
          didPostRedirectWallet=true;
        }else{
          mlog("No redirect result");
        }
      })
      .catch(e=>showErr("Post-login: "+(e.code||e.message)));

    onAuthStateChanged(auth, async (user)=>{
      mlog("👤 Stato login:",!!user,user?.uid);
      if(user && !didPostRedirectWallet){ await ensureDailyWallet(user.uid).catch(e=>showErr("Wallet: "+e.code)); }
      updatePrimaryCta();
    });

    updatePrimaryCta();
  </script>
</body>
</html>
