<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">

  <!-- (Facoltativo) Se usi un CSS esterno, lascialo collegato -->
  <!-- <link rel="stylesheet" href="style.css" /> -->

  <style>
    /* Stili minimi per rendere la pagina autonoma */
    :root { --bg:#0A0F14; --fg:#ffffff; --muted:#A0B2BA; --accent:#00E0FF; }
    *{ box-sizing: border-box }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    main{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px }
    .hero-img{ width:min(92vw,560px); height:auto; display:block; margin:0 auto 16px; filter:drop-shadow(0 10px 28px rgba(0,0,0,.45)) }
    h1{ margin:.25rem 0 0; font-size:clamp(28px,5.5vw,44px); line-height:1.1 }
    .subtitle{ margin:.25rem 0 1rem; color:var(--muted); font-size:clamp(14px,3.2vw,18px) }
    .swipe{ margin:.5rem 0 1rem; color:var(--muted); font-weight:600 }
    .btn{ display:inline-block; text-decoration:none; background:var(--accent); color:#001f26;
      font-weight:800; padding:14px 22px; border-radius:28px; box-shadow:0 10px 28px rgba(0,224,255,.25) }
    .btn:active{ transform:translateY(1px) }
    footer{ position:fixed; bottom:10px; left:0; right:0; text-align:center; color:var(--muted); font-size:12px }
    footer a{ color:var(--accent); text-decoration:none }
  </style>
</head>
<body>
  <main>
    <!-- L'immagine viene da /public/home-hero.png -->
    <img src="/home-hero.png" alt="Porta luminosa What?f" class="hero-img" loading="eager" decoding="async" />

    <h1>BENVENUTO SU <span style="color:var(--accent)">What?f</span></h1>
    <p class="subtitle">Le porte che non hai aperto e quelle che aprirai.</p>

    <div class="swipe" aria-hidden="true">⬅️ SWIPE per continuare ➡️</div>

    <a href="second.html" class="btn">CHOOSE YOUR WAY</a>
  </main>

  <footer>© 2025 What?f · <a href="#">Privacy</a> · <a href="#">Termini</a></footer>

  <!-- Disattiva vecchi Service Worker (es. Flutter) e pulisce cache -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations?.().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
      if (window.caches?.keys) { caches.keys().then(keys => keys.forEach(k => caches.delete(k))); }
    }
  </script>

  <!-- Swipe sinistra = vai a second.html | Freccia destra (desktop) = avanti -->
  <script>
    (function(){
      const next = () => location.href = 'second.html';
      let x0=0, y0=0, t0=0;
      addEventListener('touchstart', e => {
        const t = e.changedTouches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now();
      }, {passive:true});
      addEventListener('touchend', e => {
        const t = e.changedTouches[0], dx=t.clientX-x0, dy=Math.abs(t.clientY-y0), dt=Date.now()-t0;
        if (dx < -60 && dy < 50 && dt < 700) next(); // swipe a sinistra
      });
      addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); });
    })();
  </script>
</body>
</html>
