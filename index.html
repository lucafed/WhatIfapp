<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What?f – Scopri il tuo destino alternativo</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/home-hero.png" />
    <style>
      body {
        background-color: #0A0F14;
        color: #FFFFFF;
        font-family: "Poppins", sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
      }

      h1 span {
        color: #00E0FF;
      }

      img.hero {
        width: 100%;
        max-width: 420px;
        height: auto;
        border-radius: 20px;
        margin-top: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      }

      p {
        color: #A0B2BA;
        font-size: 1.05rem;
        max-width: 600px;
        margin: 16px auto 30px;
        line-height: 1.5;
      }

      .button-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }

      button {
        background-color: #00B5CC;
        color: white;
        border: none;
        border-radius: 14px;
        padding: 12px 28px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      button:hover {
        background-color: #00E0FF;
      }

      footer {
        font-size: 0.8rem;
        color: #A0B2BA;
        margin-top: 60px;
        padding-bottom: 20px;
      }

      footer a {
        color: #00E0FF;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <main>
      <img src="/home-hero.png" alt="Choose your way" class="hero" />
      <h1>Scopri il tuo <span>What?f</span></h1>

      <p>
        Immagina la scelta che non hai fatto… e quella che potresti fare domani.
        <br />
        What?f ti mostra <strong>“cosa sarebbe potuto accadere”</strong> e
        <strong>“cosa potrebbe accadere”</strong> se scegli una porta invece dell’altra.
      </p>

      <div class="button-container">
        <button onclick="selectOption('passato')">Passato</button>
        <button onclick="selectOption('futuro')">Futuro</button>
        <button onclick="selectOption('whatif')">What if</button>
        <button onclick="selectOption('whatthef')">What the F</button>
      </div>

      <p id="selected"></p>

      <button id="continue" onclick="goNext()" disabled>AVANTI</button>

      <footer>
        Continuando accetti la nostra
        <a href="#">Privacy Policy</a> e i
        <a href="#">Termini d’uso</a>.
        <br />© 2025 What?f
      </footer>
    </main>

    <script>
      let choices = { time: null, mode: null };

      function selectOption(option) {
        if (option === "passato" || option === "futuro") {
          choices.time = option;
        } else {
          choices.mode = option;
        }

        const selectedText = [];
        if (choices.time) selectedText.push(capitalize(choices.time));
        if (choices.mode)
          selectedText.push(choices.mode === "whatif" ? "What if" : "What the F");

        document.getElementById("selected").innerText =
          "Selezionato: " + selectedText.join(" • ");

        document.getElementById("continue").disabled = !(
          choices.time && choices.mode
        );
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function goNext() {
        if (choices.time && choices.mode) {
          window.location.href = "/second.html";
        }
      }
    </script>
  </body>
</html>
