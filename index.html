<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f - Home</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #0A0F14;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .hero {
      width: 100%;
      height: 100%;
      background: url('/home-hero.png') no-repeat center center;
      background-size: contain;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .button-container {
      position: absolute;
      bottom: 50px;
      display: flex;
      justify-content: center;
      width: 100%;
      z-index: 2;
    }

    .cta-button {
      background-color: #00E0FF;
      color: #000;
      padding: 15px 40px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .cta-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="hero"></div>
  <div class="button-container">
    <button class="cta-button" onclick="location.href='second.html'">
      CHOOSE YOUR WAY
    </button>
  </div>
</body>
</html>
