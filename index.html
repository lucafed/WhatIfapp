<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>

  <!-- Se hai già style.css lascialo così -->
  <link rel="stylesheet" href="style.css" />

  <!-- Solo micro-fix per l’immagine: non tocca il resto dello stile -->
  <style>
    .hero-img{
      max-width: 680px; width: min(88vw, 680px); height: auto;
      display:block; margin: 0 auto 1rem auto; filter: drop-shadow(0 8px 24px rgba(0,0,0,.35));
    }
    .swipe-row{ display:flex; align-items:center; gap:.5rem; justify-content:center; margin:.75rem 0 1.25rem }
    .swipe-dot{ width:8px; height:8px; border-radius:999px; background:#4fd1d9; opacity:.4 }
    .swipe-dot.active{ opacity:1 }
    .hidden{ display:none !important }
  </style>
</head>
<body>

  <main class="container">
    <!-- HERO IMAGE -->
    <!-- Percorso assoluto: il file è in /public/home-hero.png e sarà servito come /home-hero.png -->
    <img
      src="/home-hero.png"
      alt="Porta luminosa What?f"
      class="hero-img"
      loading="eager"
      decoding="async"
      onerror="this.classList.add('hidden')" />

    <!-- Titoli -->
    <h1 class="title">BENVENUTO SU<br><span class="brand">What?f</span></h1>
    <p class="subtitle">Le porte che non hai aperto e quelle che aprirai.</p>

    <!-- Swipe indicatori -->
    <div class="swipe-row" aria-hidden="true">
      <span class="swipe-dot active"></span>
      <span class="swipe-dot"></span>
      <span class="swipe-dot"></span>
      <span aria-label="Swipe" style="margin-left:.25rem">SWIPE ➡️</span>
    </div>

    <!-- CTA -->
    <p style="text-align:center;margin:0">
      <a href="second.html" class="btn btn-primary" style="text-decoration:none">CHOOSE YOUR WAY</a>
    </p>
  </main>

  <footer class="footer">
    <small>© 2025 What?f · <a href="privacy.html">Privacy</a> · <a href="terms.html">Termini</a></small>
  </footer>

  <noscript>Per un'esperienza completa attiva JavaScript.</noscript>

  <script>
    // --- Swipe: vai a second.html se l’utente scorre verso destra ---
    (function () {
      const goNext = () => { window.location.href = 'second.html'; };

      // Touch (mobile)
      let startX = null, startY = null, t0 = 0;
      const onTouchStart = (e) => {
        const t = e.changedTouches[0];
        startX = t.clientX; startY = t.clientY; t0 = Date.now();
      };
      const onTouchEnd = (e) => {
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = Math.abs(t.clientY - startY);
        const dt = Date.now() - t0;
        // swipe orizzontale deciso, non troppo lento, poco verticale
        if (dx > 60 && dy < 50 && dt < 700) goNext();
      };
      document.addEventListener('touchstart', onTouchStart, {passive:true});
      document.addEventListener('touchend', onTouchEnd, {passive:true});

      // Tastiera freccia destra
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') goNext();
      });
    })();
  </script>
</body>
</html>
