<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f – Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #0A0F14;
      color: white;
      text-align: center;
      overflow-x: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .hero img {
      max-width: 90%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8em;
      margin: 10px 0;
    }
    h1 span {
      color: #00E0FF;
      text-shadow: 0 0 8px #00E0FF;
    }
    .btn {
      display: inline-block;
      background-color: #00B5CC;
      color: white;
      padding: 14px 30px;
      margin-top: 20px;
      border-radius: 30px;
      font-size: 1.1em;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 0 15px rgba(0,224,255,0.6);
    }
    .btn:hover {
      background-color: #00E0FF;
      transform: scale(1.05);
    }
    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      font-size: 0.9em;
      color: #A0B2BA;
    }
    footer a {
      color: #00E0FF;
      text-decoration: none;
      margin: 0 8px;
    }
    /* Swipe indicator */
    .swipe {
      position: absolute;
      bottom: 70px;
      font-size: 0.9em;
      color: #A0B2BA;
      animation: swipe 1.5s infinite;
    }
    @keyframes swipe {
      0% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <!-- ✅ solo questa immagine, percorso corretto -->
      <img src="/home-hero.png" alt="Porta luminosa What?f">
    </div>
    <h1>BENVENUTO SU <span>What?f</span></h1>
    <a href="second.html" class="btn">CHOOSE YOUR WAY</a>
    <div class="swipe">⬆️ Swipe up</div>
  </div>

  <footer>
    © 2025 What?f · <a href="#">Privacy</a> · <a href="#">Termini</a>
  </footer>
</body>
</html>
