<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f — Benvenuto</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="home">
  <section class="hero hero--whatif">
    <div class="hero-overlay">
      <p class="eyebrow">Benvenuto su</p>
      <h1 class="brand">What?f</h1>

      <h2 class="headline">Le scelte ci definiscono</h2>
      <p class="sub">What?f ti mostra <em>come sarebbe andata</em> o <em>come potrebbe andare</em>.</p>

      <a href="./second.html" class="btn primary" data-next>Choose your way</a>
      <p class="hint">Swipe →</p>
    </div>
  </section>

  <!-- Swipe universale -->
  <script>
  (function enableSwipe(){
    let x0=0,t0=0; const TH=50, TS=500;
    function getNextHref(){
      const exp=document.querySelector('[data-next]');
      if(exp&&exp.getAttribute('href')) return exp.getAttribute('href');
      const guess=document.querySelector('.btn.primary, a[href*="second"], a[href*="third"], a[href*="fourth"]');
      return guess && guess.getAttribute('href');
    }
    addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX;t0=Date.now()},{passive:true});
    addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-x0, dt=Date.now()-t0;
      if(dt<TS && Math.abs(dx)>TH){
        if(dx>0) history.back();
        else{
          const href=getNextHref();
          if(href) location.href=href;
        }
      }
    },{passive:true});
  })();
  </script>
</body>
</html>
