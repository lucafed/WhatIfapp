<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">
  <link rel="preload" as="image" href="/home-hero.png" />
  <style>
    :root{--bg:#0A0F14;--fg:#E6EEF2;--muted:#A0B2BA;--accent:#00E0FF;--accent2:#00B5CC}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      gap:16px;padding:20px 18px 96px}
    .hero{width:min(92vw,720px);border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.5)}
    .hero img{display:block;width:100%;height:auto}
    .hero-fb{font-size:14px;color:var(--muted);text-align:center;display:none}
    h1{margin:6px 0 0;text-align:center;font-size:clamp(26px,5.4vw,44px)}
    h1 .glow{color:var(--accent);text-shadow:0 0 8px rgba(0,224,255,.7),0 0 16px rgba(0,224,255,.4)}
    .btn{display:inline-block;text-decoration:none;font-weight:800;letter-spacing:.3px;
      background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);color:#02242C;border:0;border-radius:22px;
      padding:12px 20px;min-width:230px;box-shadow:0 10px 28px rgba(0,181,204,.45)}
    .btn:active{transform:translateY(1px)}
    .hint{font-size:12px;color:var(--muted);opacity:.9}
    .disclaimer{font-size:12px;color:var(--muted);text-align:center}
    .disclaimer a{color:var(--accent);text-decoration:none}
    footer{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <img id="hero" alt="Scopri il tuo What?f" loading="eager" decoding="async" />
    </div>
    <div id="heroFallback" class="hero-fb">Caricamento immagine…</div>

    <h1>BENVENUTO SU <span class="glow">What?f</span></h1>

    <a id="cta" class="btn" href="./second.html">CHOOSE YOUR WAY</a>
    <div class="hint">Swipe ↑ o → per continuare</div>

    <p class="disclaimer">
      Continuando accetti la nostra <a href="./privacy.html">Privacy Policy</a>
      e i <a href="./terms.html">Termini d’uso</a>.
    </p>
  </main>
  <footer>© 2025 What?f</footer>

  <!-- Pulisce eventuali vecchi SW/cache -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations?.().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
      if (window.caches?.keys) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
    }
  </script>

  <!-- Caricamento robusto immagine (metodo “che funzionava”) -->
  <script>
    (async function loadHero(){
      const img = document.getElementById('hero');
      const fb  = document.getElementById('heroFallback');
      const tries = [
        '/home-hero.png',          // public/
        '/public/home-hero.png',   // fallback
        '/assets/home-hero.png',   // eventuale vecchio percorso
        'home-hero.png'            // root (se mai)
      ];
      for (const u of tries) {
        try {
          const r = await fetch(u, { cache:'no-store' });
          if (r.ok) {
            img.src = u + '?v=' + Date.now();   // cache-busting
            fb.style.display = 'none';
            return;
          }
        } catch(e){}
      }
      fb.textContent = 'Immagine non trovata.';
      fb.style.display = 'block';
    })();
  </script>

  <!-- Swipe avanti dalla home -->
  <script>
    (function(){
      const NEXT='second.html';
      let sx=0, sy=0, t=0; const TH=50;
      addEventListener('touchstart',e=>{const p=e.touches[0]; sx=p.clientX; sy=p.clientY; t=Date.now();},{passive:true});
      addEventListener('touchend',e=>{
        const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy, dt=Date.now()-t;
        if(dt<800 && (dx<-TH || -dy>TH)) location.href=NEXT;
      },{passive:true});
      document.getElementById('cta').addEventListener('click',e=>{e.preventDefault();location.href=NEXT;});
    })();
  </script>
</body>
</html>
