<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>What?f – Home</title>
  <meta name="theme-color" content="#0A0F14">
  <link rel="preload" as="image" href="/home-hero.png"/>

  <style>
    :root{
      --bg:#0A0F14; --fg:#E6EEF2; --muted:#A0B2BA;
      --accent:#00E0FF; --accent2:#00B5CC; --ink:#02242C;
      --card: rgba(255,255,255,.06);
    }
    :root[data-theme="light"]{
      --bg:#F4FAFC; --fg:#132229; --muted:#516771;
      --accent:#00B5CC; --accent2:#0097AD; --ink:#00181F;
      --card: rgba(0,0,0,.06);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

    .page{
      min-height:100vh; display:flex; flex-direction:column;
      justify-content:space-between; align-items:center;
      padding:18px 20px; text-align:center;
    }

    /* Toggle tema ben visibile */
    .theme-toggle{
      position:fixed; top:14px; right:14px; z-index:100;
      cursor:pointer; user-select:none;
      padding:8px 14px; border-radius:24px;
      background:var(--accent); color:var(--ink);
      font-size:14px; font-weight:600;
      box-shadow:0 0 12px rgba(0,0,0,.4);
    }

    .center{
      width:100%; max-width:720px; margin: 6px auto 0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }

    .hero{
      width:min(94vw,680px); margin:0 auto; border-radius:22px;
      overflow:hidden; background:var(--card);
      box-shadow: 0 18px 40px rgba(0,0,0,.35)
    }
    .hero img{width:100%; height:auto; display:block}

    .subtitle{
      margin-top:14px;
      font-size:clamp(16px,4vw,20px);
      color:var(--fg);
      text-align:center;
      max-width:85%;
    }

    h1{
      margin: 22px 0 0;
      font-size:clamp(28px,6.2vw,46px);
      line-height:1.12;
    }
    h1 span{ color:var(--accent); text-shadow:0 0 8px rgba(0,224,255,.6) }

    .btn{
      margin-top: 18px;
      display:inline-block; text-decoration:none;
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); font-weight:800; letter-spacing:.5px;
      padding:14px 22px; border-radius:28px; min-width:240px;
      box-shadow:0 0 16px rgba(0,181,204,.4)
    }
    .btn:active{transform:translateY(1px)}

    .swipe-tip{margin-top:14px; font-size:13px; color:var(--muted)}

    .disclaimer{font-size:13px; color:var(--muted); margin:16px 0}
    .disclaimer a{color:var(--accent); text-decoration:none}

    footer{font-size:12px; color:var(--muted); margin-top:2px}
  </style>
</head>
<body>
  <!-- Toggle tema -->
  <div id="themeBtn" class="theme-toggle">🌙 Tema</div>

  <div class="page">
    <div class="center">
      <!-- immagine -->
      <div class="hero">
        <img id="hero" alt="Scopri il tuo What?f" loading="eager" decoding="async">
      </div>

      <!-- sottotitolo centrato meglio -->
      <div class="subtitle">Le porte che non hai aperto e quelle che aprirai.</div>

      <!-- titolo -->
      <h1>BENVENUTO SU <span>What?f</span></h1>

      <!-- bottone -->
      <a id="cta" class="btn" href="./second.html">CHOOSE YOUR WAY</a>

      <!-- suggerimento swipe -->
      <div class="swipe-tip">Swipe ↑ o → per continuare</div>
    </div>

    <div class="disclaimer">
      Continuando accetti la nostra <a href="./privacy.html">Privacy Policy</a> e i <a href="./terms.html">Termini d’uso</a>.
    </div>

    <footer>© 2025 What?f</footer>
  </div>

  <!-- loader immagine -->
  <script>
    (async function loadHero(){
      const img = document.getElementById('hero');
      const tries = ['/home-hero.png','/public/home-hero.png','/assets/home-hero.png'];
      for(const u of tries){
        try{
          const r = await fetch(u,{cache:'no-store'});
          if(r.ok){ img.src = u + '?v=' + Date.now(); return; }
        }catch(e){}
      }
    })();
  </script>

  <!-- toggle tema -->
  <script>
    (function(){
      const KEY='whatif-theme';
      const root=document.documentElement;
      const btn=document.getElementById('themeBtn');

      function apply(t){
        root.setAttribute('data-theme', t);
        localStorage.setItem(KEY, t);
        btn.textContent = t==='light' ? '🌙 Tema' : '☀️ Tema';
      }

      const saved = localStorage.getItem(KEY) || 'dark';
      apply(saved);

      btn.addEventListener('click', ()=>{
        const cur=root.getAttribute('data-theme')==='light'?'light':'dark';
        apply(cur==='light'?'dark':'light');
      });
    })();
  </script>

  <!-- swipe -->
  <script>
    (function(){
      const NEXT='./second.html';
      let sx=0, sy=0, t0=0;
      const TH=90; const MAXT=900;

      addEventListener('touchstart',e=>{
        const p=e.touches[0]; sx=p.clientX; sy=p.clientY; t0=Date.now();
      },{passive:true});

      addEventListener('touchend',e=>{
        const p=e.changedTouches[0];
        const dx=p.clientX - sx;
        const dy=p.clientY - sy;
        const dt=Date.now() - t0;
        if(dt>MAXT) return;

        if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>TH){
          if(dx<0) location.href=NEXT;
        } else if(Math.abs(dy)>TH){
          if(dy<0) location.href=NEXT;
        }
      },{passive:true});

      document.getElementById('cta').addEventListener('click', (e)=>{
        e.preventDefault(); location.href=NEXT;
      });
    })();
  </script>
</body>
</html>
