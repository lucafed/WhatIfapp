<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rewarded Video</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui;
              display:flex;align-items:center;justify-content:center}
    video{max-width:100%;max-height:100%}
    .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;text-align:center;
         background:rgba(0,0,0,.5);font-weight:600}
    .btn{display:none;margin-left:10px;background:#FFEC01;color:#111;border:0;border-radius:10px;
         padding:8px 12px;font-weight:900}
  </style>
</head>
<body>
  <video id="v" playsinline controls>
    <!-- Sorgente demo; in futuro sostituire con il provider ads -->
    <source src="https://cdn.coverr.co/videos/coverr-little-waves-4207/1080p.mp4" type="video/mp4"/>
  </video>
  <div class="bar">Guarda fino alla fine per ottenere <b>+1 credito</b>.
    <button id="claim" class="btn">Riscatta credito</button>
  </div>
  <script>
    const v = document.getElementById('v');
    const claim = document.getElementById('claim');
    v.addEventListener('ended', ()=>{ claim.style.display='inline-block'; });
    claim.onclick = ()=> parent.postMessage({ type:'rewarded_complete', amount:1 }, '*');
  </script>
</body>
</html>
