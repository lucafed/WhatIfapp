<!-- FILE: ads/banner.html -->
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{margin:0;padding:0;background:transparent}
    #ad-slot{width:320px;height:50px;margin:0 auto}
  </style>

  <!-- GPT (Google Publisher Tag) -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  <script>window.googletag = window.googletag || {cmd: []};</script>
</head>
<body>
  <div id="ad-slot"></div>

  <script>
    window.googletag = window.googletag || {cmd: []};
    window.googletag.cmd.push(function () {
      // Unità di TEST ufficiale Google (mostra creatività demo; NON monetizza)
      const AD_UNIT_TEST = "/6355419/Travel/Europe";

      googletag.defineSlot(AD_UNIT_TEST, [320, 50], "ad-slot")
        .addService(googletag.pubads());

      googletag.pubads().enableSingleRequest();
      googletag.enableServices();
      googletag.display("ad-slot");
    });
  </script>
</body>
</html>
