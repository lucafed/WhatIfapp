<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.small{font-size:12px;color:var(--muted)}
/* collapsible */
.details{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);overflow:hidden}
.details > summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700}
.details > summary::-webkit-details-marker{display:none}
.details .body{padding:12px 14px;border-top:1px solid var(--line)}
/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
/* action row right aligned without overflow */
.right-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.suggestion{display:block;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#eaf3ee;border-radius:12px;padding:12px 14px;cursor:pointer}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge" title="">—</span>
      <span class="badge" id="proBadge">PRO</span>
      <span class="badge" id="periodBadge">🕰️ —</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style switch -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row" id="styleChips">
        <button class="btn" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="btn" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
      <span class="badge" id="styleBadge">🎭 —</span>
    </div>
  </div>

  <!-- Question -->
  <div class="card center">
    <div class="label" id="qLabel">La tua domanda</div>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <!-- Quick hints (collapsible) -->
    <details class="details" id="hintsBox" style="margin-top:10px">
      <summary id="hintsTitle">Spunti rapidi</summary>
      <div class="body" id="hintsBody">
        <button class="suggestion"></button>
        <button class="suggestion"></button>
        <button class="suggestion"></button>
        <button class="suggestion"></button>
      </div>
    </details>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Pulisci</button>
    </div>
    <div class="small" id="tipNote" style="margin-top:8px">Tip: puoi cambiare stile sopra; colori e tono si adattano.</div>
  </div>

  <!-- Micro (once per day) -->
  <div class="card center">
    <details class="details" id="microWrap">
      <summary id="microTitle">Micro-domande di oggi • 0/3</summary>
      <div class="body" id="microBody">
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <div class="input" contenteditable id="mood" data-ph="Umore (1–5)"></div>
          <div class="input" contenteditable id="anchor" data-ph="Una cosa che ti ancora"></div>
          <div class="input" contenteditable id="focus" data-ph="Una cosa su cui ti concentri"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="saveMicroBtn">💾 Salva micro-profilo</button>
        </div>
        <div class="small" id="microMsg" style="margin-top:6px"></div>
      </div>
    </details>
  </div>

  <!-- Saved for tomorrow -->
  <div class="card center">
    <details class="details" id="savedWrap">
      <summary id="savedTitle">Domande salvate per domani</summary>
      <div class="body">
        <div class="right-actions"><button class="btn ghost" id="clearSavedBtn">Svuota salvate</button></div>
        <div id="nextList" class="list"></div>
      </div>
    </details>
  </div>

  <!-- History -->
  <div class="card center">
    <details class="details" id="histWrap">
      <summary id="histTitle">Storie recenti</summary>
      <div class="body">
        <div class="right-actions"><button class="btn ghost" id="clearHistBtn">Svuota storie</button></div>
        <div id="storyList" class="list"></div>
      </div>
    </details>
  </div>

</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    yourq:"La tua domanda",
    gen:"✨ Genera risposta", clear:"Pulisci",
    tip:"Tip: puoi cambiare stile sopra; colori e tono si adattano.",
    styleWhat:"What if (realistico)", styleWtf:"What the F (divertente)",
    savedT:"Domande salvate per domani", histT:"Storie recenti",
    clearSaved:"Svuota salvate", clearHist:"Svuota storie",
    free:(l,t)=>`Free oggi: ${l}/${t}`, proOn:"PRO attivo",
    periodPast:"Passato", periodFuture:"Futuro",
    microT:(n)=>`Micro-domande di oggi • ${n}/3`,
    microSaved:"Micro-profilo salvato per oggi.", microOnce:"Già salvato oggi.",
    hints:"Spunti rapidi",
    // realistic quick prompts (WHAT IF)
    q_whatif:[
      "E se chiedessi un aumento?",
      "E se cambiassi città per qualche mese?",
      "E se mi iscrivessi davvero in palestra?",
      "E se aprissi partita IVA / cambiassi lavoro?"
    ],
    // crazy quick prompts (WTF)
    q_wtf:[
      "E se comprassi una moto?",
      "E se traslocassi domani senza avvisare nessuno?",
      "E se facessi il Dry January… a febbraio?",
      "E se aprissi un bar solo per amici?"
    ],
    emptyNext:"— Nessuna domanda salvata.",
    emptyStories:"— Nessuna storia recente."
  },
  en:{
    title:"Set your question",
    yourq:"Your question",
    gen:"✨ Generate answer", clear:"Clear",
    tip:"Tip: switch style above; tone & colors adapt.",
    styleWhat:"What if (realistic)", styleWtf:"What the F (fun)",
    savedT:"Saved for tomorrow", histT:"Recent stories",
    clearSaved:"Clear saved", clearHist:"Clear stories",
    free:(l,t)=>`Free today: ${l}/${t}`, proOn:"PRO active",
    periodPast:"Past", periodFuture:"Future",
    microT:(n)=>`Today’s micro-questions • ${n}/3`,
    microSaved:"Micro-profile saved for today.", microOnce:"Already saved today.",
    hints:"Quick prompts",
    q_whatif:[
      "What if I asked for a raise?",
      "What if I moved cities for a while?",
      "What if I actually joined a gym?",
      "What if I went freelance / changed jobs?"
    ],
    q_wtf:[
      "What if I bought a motorbike?",
      "What if I moved tomorrow without telling anyone?",
      "What if I did Dry January… in February?",
      "What if I opened a bar only for friends?"
    ],
    emptyNext:"— No saved questions.",
    emptyStories:"— No recent stories."
  }
};
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]; document.documentElement.lang=lang;

/* ===== Prefs / Theme / Style ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== Credits with OWNER PIN reset ===== */
const OWNER_PIN = "0427"; // solo proprietario
const DAILY_FREE = prefs.pro ? 10 : 3;
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ensureCredits(){
  let c=readJSON('whatif_credits',{date:todayStr(),used:0});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  writeJSON('whatif_credits',c);
}
ensureCredits();
function leftCredits(){ const c=readJSON('whatif_credits',{date:todayStr(),used:0}); return Math.max(0,(prefs.pro?10:3)-(c.used||0)); }
function renderTop(){
  document.getElementById('titleH1').textContent=T.title;
  document.getElementById('qLabel').textContent=T.yourq;
  document.getElementById('goBtn').textContent=T.gen;
  document.getElementById('clearBtn').textContent=T.clear;
  document.getElementById('tipNote').textContent=T.tip;
  document.getElementById('chipWhatIf').textContent=T.styleWhat;
  document.getElementById('chipWTF').textContent=T.styleWtf;
  document.getElementById('styleBadge').textContent = "🎭 " + (prefs.stile==='wtf'? T.styleWtf : T.styleWhat);
  document.getElementById('freeBadge').textContent = T.free(leftCredits(), (prefs.pro?10:3));
  document.getElementById('proBadge').textContent = prefs.pro ? T.proOn : "PRO";
  document.getElementById('periodBadge').textContent = "🕰️ " + (prefs.periodo==='past'? T.periodPast : T.periodFuture);
  document.getElementById('langBtn').textContent=lang.toUpperCase();
  document.getElementById('hintsTitle').textContent=T.hints;
}
renderTop();

/* ===== Language / Nav ===== */
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';

/* ===== PRO toggle & credits reset (PIN) ===== */
document.getElementById('proBadge').onclick=()=>{
  prefs.pro=!prefs.pro; writeJSON('whatif_prefs',prefs); ensureCredits(); renderTop();
};
document.getElementById('freeBadge').onclick=()=>{
  const pin = prompt(lang==='en'?'Owner PIN to reset credits:':'PIN proprietario per azzerare crediti:');
  if(pin===OWNER_PIN){ const c=readJSON('whatif_credits'); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderTop(); }
};

/* ===== Period switch ===== */
document.getElementById('periodBadge').onclick=()=>{ prefs.periodo=(prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); renderTop(); };

/* ===== Style switch ===== */
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('button[data-style]'); if(!b) return;
  prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  renderTop(); renderHints();
});

/* ===== Hints (style+lang aware, collapsible) ===== */
function renderHints(){
  const arr = (prefs.stile==='wtf') ? T.q_wtf : T.q_whatif;
  const buttons = [...document.querySelectorAll('#hintsBody .suggestion')];
  buttons.forEach((btn,i)=>{ btn.textContent = arr[i] || ''; btn.style.display = arr[i] ? 'block':'none'; btn.onclick=()=>{ document.getElementById('qInput').value=arr[i]; window.scrollTo({top:0,behavior:'smooth'}); }; });
}
renderHints();

/* ===== Micro once per day ===== */
function microSavedToday(){ return readJSON('micro_saved',{date:"",ok:false}).date===todayStr(); }
function renderMicro(){
  const n = microSavedToday()? 3 : 0;
  document.getElementById('microTitle').textContent=T.microT(n);
  const body=document.getElementById('microBody');
  if(microSavedToday()){ body.querySelectorAll('[contenteditable]').forEach(el=>{ el.setAttribute('contenteditable','false'); el.style.opacity=.7; }); document.getElementById('microMsg').textContent=T.microOnce; document.getElementById('saveMicroBtn').style.display='none'; }
}
renderMicro();
document.getElementById('saveMicroBtn').onclick=()=>{
  if(microSavedToday()){ document.getElementById('microMsg').textContent=T.microOnce; return; }
  const micro={
    mood:(document.getElementById('mood').innerText||"").trim(),
    anchor:(document.getElementById('anchor').innerText||"").trim(),
    focus:(document.getElementById('focus').innerText||"").trim(),
    ts:Date.now()
  };
  writeJSON('micro_profile',micro);
  writeJSON('micro_saved',{date:todayStr(),ok:true});
  document.getElementById('microMsg').textContent=T.microSaved;
  renderMicro();
};

/* ===== Saved & History ===== */
function fmt(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=document.getElementById('nextList'); box.innerHTML='';
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q}</div><div class="meta">${fmt(item.ts)}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ document.getElementById('qInput').value=item.q; window.scrollTo({top:0,behavior:'smooth'}); };
    row.appendChild(left); row.appendChild(play); box.appendChild(row);
  });
}
function renderHist(){
  const box=document.getElementById('storyList'); box.innerHTML='';
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda}</div><div class="meta">${fmt(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story',{domanda:item.domanda,answer:item.risposta||"",stile:item.stile}); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play); box.appendChild(row);
  });
}
renderNext(); renderHist();
document.getElementById('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
document.getElementById('clearHistBtn').onclick =()=>{ LS.removeItem('cronologia'); renderHist(); };

/* ===== Generate ===== */
document.getElementById('goBtn').onclick=()=>{
  const domanda=(document.getElementById('qInput').value||"").trim(); if(!domanda){ document.getElementById('qInput').focus(); return; }
  const c=readJSON('whatif_credits'); if((c.used||0)>=(prefs.pro?10:3)){ alert(lang==='en'?'You’ve used today’s credits.':'Hai finito i crediti di oggi.'); return; }
  c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderTop();

  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  writeJSON('whatif_request',{ domanda, stile:prefs.stile, lang, micro, extra:"" });
  location.href='fifth.html';
};
document.getElementById('clearBtn').onclick=()=>{ document.getElementById('qInput').value=""; document.getElementById('qInput').focus(); };

/* placeholders */
document.getElementById('qInput').placeholder=(lang==='en'?"What if I moved back to L’Aquila?":"E se tornassi a vivere all’Aquila?");
</script>
</body>
</html>
