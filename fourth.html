<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – La tua domanda</title>
<meta name="theme-color" content="#05080C" />
<style>
  :root{
    --bg1:#05080C; --bg2:#0E1821; --text:#EAF3F7; --muted:#A0B2BA;
    --card:rgba(16,26,34,.56); --line:rgba(85,140,168,.25);
    --acc:#00E0FF; --acc2:#00B5CC; --ink:#001F26; --chip:#0E1A23;
  }
  body[data-theme="wtf"]{ --acc:#FF63E3; --acc2:#8A5BFF; --ink:#170021; --line:rgba(178,120,255,.28); --chip:#16122A; }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--text);background:var(--bg1);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(1200px 800px at 12% -8%, var(--acc)10%, transparent 60%),
      radial-gradient(1100px 780px at 88% 108%, var(--acc2)12%, transparent 62%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    filter:saturate(120%) brightness(105%);
  }
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(180deg,rgba(5,8,12,.9),rgba(5,8,12,0))}
  .btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none}
  main{max-width:760px;margin:auto;padding:18px}
  h1{font-size:clamp(22px,5vw,32px);margin-bottom:8px;color:var(--acc)}
  .card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px}
  label{display:block;margin:10px 0 6px}
  input[type="text"]{width:100%;background:#0E161D;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:12px;font-size:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);color:#cfe3e7;border-radius:999px;padding:8px 12px;font-size:13px}
</style>
</head>
<body>
<header>
  <button class="btn" id="homeBtn">🏠 Home</button>
  <div></div>
</header>

<main>
  <h1>Scrivi la tua domanda</h1>
  <div class="card">
    <label for="domandaInput">La tua domanda</label>
    <input type="text" id="domandaInput" placeholder="E se…? / What if…?" />

    <div class="row" style="margin-top:12px">
      <span class="chip" id="badgePeriodo">🕰️ —</span>
      <span class="chip" id="badgeStile">🎭 —</span>
    </div>

    <button class="btn primary" style="width:100%;margin-top:14px" id="nextBtn">Avanti →</button>
  </div>
</main>

<script>
const LS=localStorage;
function readJSON(k,def={}){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;}}
/* Tema porte */
(function(){ try{ const p=readJSON('whatif_prefs',{}); document.body.setAttribute('data-theme', p.stile==='wtf'?'wtf':'whatif'); }catch(_){}})();

const prefs=readJSON('whatif_prefs',{periodo:'future',stile:'whatif'});
document.getElementById('badgePeriodo').textContent='🕰️ '+(prefs.periodo==='past'?'Passato':'Futuro');
document.getElementById('badgeStile').textContent='🎭 '+(prefs.stile==='wtf'?'What the F':'What if');

document.getElementById('nextBtn').addEventListener('click', ()=>{
  const domanda=(document.getElementById('domandaInput').value||'').trim();
  if(!domanda){ alert('Inserisci una domanda prima di continuare.'); return; }
  LS.setItem('domanda', domanda);
  location.href='fifth.html';
});
document.getElementById('homeBtn').addEventListener('click', ()=> location.href='index.html');
</script>
</body>
</html>
