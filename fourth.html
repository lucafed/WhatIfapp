<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{ --bg:#0C0F14; --bg2:#0E1724; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
  --accent:#1C57A0; --accent2:#FFEC01; --ink:#001f26; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }

*{box-sizing:border-box}
html,body{
  height:100%;margin:0;
  background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}

/* Topbar */
.topbar{position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding:8px 10px; background:rgba(10,15,20,.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
  border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

/* Layout */
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

/* Cards & chips */
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);
  border-radius:16px;padding:16px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Input */
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}

/* Collapsible */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}

/* Slot fx */
#qInput.slotting{filter:contrast(1.2) saturate(1.1); animation:slotFlash .12s linear infinite}
@keyframes slotFlash{0%{box-shadow:0 0 0 rgba(255,236,1,.0)}50%{box-shadow:0 0 18px rgba(255,236,1,.2)}100%{box-shadow:0 0 0 rgba(255,236,1,.0)}}
</style>
</head>

<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge">—</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option>
      </select>
      <button class="btn" id="resetBtn" type="button" title="Reset">♻️</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- STILE + PERIODO -->
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
          <div class="chips" id="styleChips">
            <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
            <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
          </div>
          <div class="chips" id="periodoChips">
            <button class="chip" data-periodo="future" id="chipFuture">Futuro</button>
            <button class="chip" data-periodo="past"   id="chipPast">Passato</button>
          </div>
        </div>
      </div>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>
        <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>

        <div class="small" id="qHelp" style="margin-top:8px">
          Scrivi obiettivo + contesto in 1 riga. Aggiungi vincoli o orizzonte (es. 30 giorni).
        </div>

        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button" title="Slot assurdo">🎲 Sorprendimi</button>
          </div>
          <div class="row">
            <button class="btn" id="saveBtn" type="button">⭐ Salva</button>
            <button class="btn" id="clearBtn" type="button">Svuota</button>
          </div>
        </div>
      </div>

      <!-- SPUNTI (realistici) -->
      <div class="card center collapsed" id="hintsCard">
        <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
          <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
        </div>
        <div class="body" id="hintsBody" style="margin-top:8px">
          <div class="chips" id="hintsChips"></div>
          <div class="small" id="hintsNote" style="margin-top:8px"></div>
        </div>
      </div>

      <!-- SALVATI -->
      <div class="card center collapsed" id="savedCard">
        <div class="row toggle" id="savedHeader" style="justify-content:space-between">
          <div class="label" id="nextLabel">▶ Domande salvate</div>
          <button class="btn" id="clearSavedBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
      </div>

      <!-- CRONOLOGIA -->
      <div class="card center collapsed" id="histCard">
        <div class="row toggle" id="histHeader" style="justify-content:space-between">
          <div class="label" id="storiesLabel">▶ Cronologia</div>
          <button class="btn" id="clearHistoryBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body"><div id="storyList" class="list"></div></div>
      </div>
    </div>
  </main>

<script>
/* ===== STORAGE/UTIL ===== */
const LS=localStorage, $=id=>document.getElementById(id);
const readJSON=(k,def)=>{try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}};
const writeJSON=(k,v)=>LS.setItem(k,JSON.stringify(v));
const todayISO=()=>new Date().toISOString().slice(0,10);

/* ===== LANG ===== */
const SUPPORTED_LANGS=["it","en","es","fr","de"];
let lang=(LS.getItem('lang')||'it').toLowerCase();
if(!SUPPORTED_LANGS.includes(lang)) lang='it';
document.documentElement.lang=lang; $('langSelect').value=lang;
$('langSelect').onchange=()=>{ const v=$('langSelect').value; LS.setItem('lang',v); location.reload(); };

const I18N={
  it:{title:"Imposta la tua domanda", yourq:"E se…", ph:"E se…",
      help:"Scrivi obiettivo + contesto in 1 riga. Aggiungi vincoli o orizzonte (es. 30 giorni).",
      gen:"✨ Genera risposta", clear:"Svuota",
      surprise:"Sorprendimi (assurdo)", spins:"Tiri rimasti oggi", noSpins:"Tiri esauriti per oggi.",
      saved:"▶ Domande salvate", stories:"▶ Cronologia",
      styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Passato",
      hintsTitle:"▶ Spunti rapidi “E se…”",
      hintsNote:"Spunti = idee realistiche e generali (variano ogni giorno). “Sorprendimi” = solo idee assurde, sempre diverse.",
      credits:"Crediti", emptyNext:"— Nessuna domanda salvata.", emptyHist:"— Nessuna storia.", use:"Usa",
      save:"Salva", clearSaved:"🗑️ Svuota", clearHist:"🗑️ Svuota"},
  en:{title:"Set your question", yourq:"What if…", ph:"What if…",
      help:"Write goal + context in one line. Add constraints or horizon (e.g. 30 days).",
      gen:"✨ Generate answer", clear:"Clear",
      surprise:"Surprise me (absurd)", spins:"Spins left today", noSpins:"No spins left for today.",
      saved:"▶ Saved questions", stories:"▶ History",
      styleWF:"What if", styleWTF:"What the F", fut:"Future", past:"Past",
      hintsTitle:"▶ Quick “What if…”",
      hintsNote:"Hints = realistic & general (change daily). “Surprise me” = absurd only, always different.",
      credits:"Credits", emptyNext:"— No saved questions.", emptyHist:"— No history.", use:"Use",
      save:"Save", clearSaved:"🗑️ Clear", clearHist:"🗑️ Clear"},
  es:{title:"Configura tu pregunta", yourq:"¿Y si…?", ph:"¿Y si…?",
      help:"Escribe objetivo + contexto en una línea. Añade límites u horizonte (p. ej., 30 días).",
      gen:"✨ Generar respuesta", clear:"Limpiar",
      surprise:"Sorpréndeme (absurdo)", spins:"Tiradas restantes hoy", noSpins:"Sin tiradas por hoy.",
      saved:"▶ Preguntas guardadas", stories:"▶ Historial",
      styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Pasado",
      hintsTitle:"▶ Ideas rápidas «¿Y si…?»",
      hintsNote:"Ideas = realistas y generales (cambian a diario). «Sorpréndeme» = solo absurdas.",
      credits:"Créditos", emptyNext:"— No hay preguntas guardadas.", emptyHist:"— Sin historial.", use:"Usar",
      save:"Guardar", clearSaved:"🗑️ Vaciar", clearHist:"🗑️ Vaciar"},
  fr:{title:"Définis ta question", yourq:"Et si…", ph:"Et si…",
      help:"Écris objectif + contexte en une ligne. Ajoute contraintes ou horizon (ex. 30 jours).",
      gen:"✨ Générer la réponse", clear:"Effacer",
      surprise:"Surprends-moi (absurde)", spins:"Tirs restants aujourd’hui", noSpins:"Plus de tirs pour aujourd’hui.",
      saved:"▶ Questions enregistrées", stories:"▶ Historique",
      styleWF:"What if", styleWTF:"What the F", fut:"Futur", past:"Passé",
      hintsTitle:"▶ Idées rapides « Et si… »",
      hintsNote:"Idées = réalistes et générales (change chaque jour). « Surprends-moi » = absurde uniquement.",
      credits:"Crédits", emptyNext:"— Aucune question enregistrée.", emptyHist:"— Aucun historique.", use:"Utiliser",
      save:"Enregistrer", clearSaved:"🗑️ Vider", clearHist:"🗑️ Vider"},
  de:{title:"Stelle deine Frage ein", yourq:"Was wäre, wenn…", ph:"Was wäre, wenn…",
      help:"Ziel + Kontext in einer Zeile. Optional Frist (z. B. 30 Tage).",
      gen:"✨ Antwort erzeugen", clear:"Leeren",
      surprise:"Überrasche mich (absurd)", spins:"Spins heute", noSpins:"Keine Spins mehr.",
      saved:"▶ Gespeicherte Fragen", stories:"▶ Verlauf",
      styleWF:"What if", styleWTF:"What the F", fut:"Zukunft", past:"Vergangenheit",
      hintsTitle:"▶ Schnelle „Was wäre, wenn…“-Ideen",
      hintsNote:"Hinweise = realistisch & allgemein (täglich neu). „Überrasche mich“ = nur absurd.",
      credits:"Credits", emptyNext:"— Keine gespeicherten Fragen.", emptyHist:"— Kein Verlauf.", use:"Verwenden",
      save:"Speichern", clearSaved:"🗑️ Leeren", clearHist:"🗑️ Leeren"}
};
(function apply(){
  const T=I18N[lang]||I18N.it;
  $('titleH1').textContent=T.title;
  $('qLabel').textContent=T.yourq;
  $('qInput').placeholder=T.ph;
  $('qHelp').textContent=T.help;
  $('goBtn').textContent=T.gen;
  $('clearBtn').textContent=T.clear;
  $('surpriseBtn').textContent='🎲 '+T.surprise;
  $('nextLabel').textContent=T.saved;
  $('storiesLabel').textContent=T.stories;
  $('hintsTitle').textContent=T.hintsTitle;
  $('hintsNote').textContent=T.hintsNote;
  $('chipWhatIf').textContent=T.styleWF; $('chipWTF').textContent=T.styleWTF;
  $('chipFuture').textContent=T.fut; $('chipPast').textContent=T.past;
  $('saveBtn').textContent='⭐ '+T.save;
  $('clearSavedBtn').textContent=T.clearSaved;
  $('clearHistoryBtn').textContent=T.clearHist;
})();

/* ===== PREFS / THEME / CREDITS ===== */
let prefs=readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin()?Infinity:(prefs.pro?10:3); }
function ensureCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); if(c.date!==todayISO()){c.date=todayISO();c.used=0} writeJSON('whatif_credits',c); }
function leftCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); const cap=capForUser(); return cap===Infinity?'∞':Math.max(0,cap-(c.used||0)); }
function renderCredits(){ const T=I18N[lang]||I18N.it; const cap=capForUser(), left=leftCredits(); $('freeBadge').textContent=(cap===Infinity)?`${T.credits}: ∞`:`${T.credits}: ${left}/${cap}`; }
ensureCredits(); renderCredits();

function renderBadges(){
  const T=I18N[lang]||I18N.it;
  $('styleBadge').textContent='🎭 '+(prefs.stile==='wtf'?T.styleWTF:T.styleWF);
  $('periodoBadge').textContent='🕰️ '+(prefs.periodo==='past'?T.past:T.fut);
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.querySelectorAll('#periodoChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.periodo===prefs.periodo));
}
renderBadges();
$('styleChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  renderBadges();
});
$('periodoChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.periodo=b.dataset.periodo; writeJSON('whatif_prefs',prefs);
  renderBadges();
});

/* ===== NAV ===== */
$('homeBtn').onclick=()=>location.href='index.html';
$('backBtn').onclick=()=>{ if(history.length>1) history.back(); else location.href='index.html'; };
$('resetBtn').onclick=()=>{ try{localStorage.clear();}catch{} location.reload(); };

/* ===== STATO “ASSURDA” ===== */
let isAbsurd=false;
LS.setItem('absurd_prompt','0');
LS.setItem('surprise_mode','0');

/* ===== SPUNTI (realistici, puliti, varianti al passato) ===== */
const BASE_HINTS={
  it:["E se cambiassi lavoro?","E se cambiassi città?","E se tornassi a studiare?","E se vivessi 30 giorni senza social?","E se chiedessi un aumento?","E se viaggiassi da solo?","E se imparassi bene l’inglese?","E se aprissi un micro e-commerce?","E se corressi 3 volte a settimana?","E se cucinassi a casa per 30 giorni?"],
  en:["What if I changed jobs?","What if I moved city?","What if I went back to study?","What if I spent 30 days off social media?","What if I asked for a raise?","What if I travelled solo?","What if I mastered English?","What if I opened a tiny e-commerce?","What if I ran 3× a week?","What if I cooked at home for 30 days?"],
  es:["¿Y si cambiara de trabajo?","¿Y si me mudara de ciudad?","¿Y si volviera a estudiar?","¿Y si viviera 30 días sin redes?","¿Y si pidiera un aumento?","¿Y si viajara solo/a?","¿Y si dominara bien el inglés?","¿Y si abriera un micro e-commerce?","¿Y si corriera 3 veces por semana?","¿Y si cocinara en casa 30 días?"],
  fr:["Et si je changeais de travail ?","Et si je déménageais ?","Et si je reprenais des études ?","Et si je passais 30 jours sans réseaux ?","Et si je demandais une augmentation ?","Et si je partais voyager seul(e) ?","Et si je maîtrisais l’anglais ?","Et si j’ouvrais un micro e-commerce ?","Et si je courais 3× par semaine ?","Et si je cuisinais à la maison 30 jours ?"],
  de:["Was, wenn ich den Job wechsle?","Was, wenn ich in eine andere Stadt ziehe?","Was, wenn ich wieder studiere?","Was, wenn ich 30 Tage ohne Social Media lebe?","Was, wenn ich eine Gehaltserhöhung verlange?","Was, wenn ich allein reise?","Was, wenn ich Englisch richtig beherrsche?","Was, wenn ich einen Micro-Shop starte?","Was, wenn ich 3× pro Woche laufe?","Was, wenn ich 30 Tage zuhause koche?"]
};
function pastChip(text){
  if(lang==='it') return "E se l’avessi già fatto: "+text.replace(/^E se\s*/i,"").replace(/\?$/,"?");
  if(lang==='en') return "What if I had already: "+text.replace(/^What if\s*/i,"").replace(/\?$/,"?");
  if(lang==='es') return "¿Y si ya lo hubiera hecho: "+text.replace(/^¿Y si\s*/i,"").replace(/\?$/,"?");
  if(lang==='fr') return "Et si je l’avais déjà fait : "+text.replace(/^Et si\s*/i,"").replace(/\?$/," ?");
  if(lang==='de') return "Was, wenn ich es schon getan hätte: "+text.replace(/^Was, wenn\s*/i,"").replace(/\?$/,"?");
  return text;
}
const GEN_REAL_IT={
  lavoro:["sistemassi LinkedIn oggi?","provassi 30 giorni di lavoro remoto?","lanciassi un side-project serale?","mandassi 5 candidature mirate?"],
  studio:["studiassi inglese 20 min al giorno?","scrivessi 1 pagina di tesi al giorno?","chiudessi un corso gratuito di IA?"],
  soldi:["seguissi un budget per 30 giorni?","tagliassi 3 spese inutili da oggi?","mettessi da parte 5€/giorno?"],
  sport:["corressi 3× a settimana?","facessi stretching 10 min/die?","camminassi 8 000 passi/die?"],
  relazioni:["chiamassi un amico a settimana?","mettessi confini chiari al lavoro?","organizzassi una cena a casa?"],
  tech:["automatizzassi una noia con l’AI?","creassi un micro-sito in una sera?"],
  business:["testassi un’idea con una landing?","facessi 5 interviste clienti in 7 giorni?"]
};
function inferUserPrefs(){
  const map={lavoro:["lavor","job","linkedin","cv","colloquio","remoto"],
             studio:["studio","universit","esame","tesi","inglese","course"],
             soldi:["budget","soldi","money","rispar","invest","etf","cripto"],
             sport:["corri","sport","palestra","nuoto","yoga","passi"],
             relazioni:["amico","partner","social","confini"],
             tech:["ai","app","sito","script","automat"],
             business:["e-commerce","shopify","cliente","startup"]};
  const score=Object.fromEntries(Object.keys(map).map(k=>[k,0]));
  const text=(readJSON('cronologia',[]).map(x=>x.domanda||'').join(' ')+' '+readJSON('next_prompts',[]).map(x=>x.q||'').join(' ')).toLowerCase();
  for(const [k,keys] of Object.entries(map)) keys.forEach(w=>{ if(text.includes(w)) score[k]+=1; });
  return Object.entries(score).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v>0).map(([k])=>k);
}
function seededRng(seed){ let s=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0)||123456; return ()=>((s=Math.imul(48271,s)%0x7fffffff)/0x7fffffff); }
function sampleDistinct(arr,n,rnd){ const out=[],used=new Set(); while(out.length<n && used.size<arr.length){ const i=Math.floor(rnd()*arr.length); if(used.has(i)) continue; used.add(i); out.push(arr[i]); } return out; }
const hintsWrap=$('hintsChips');
function renderHints(){
  const base=(BASE_HINTS[lang]||BASE_HINTS.it).slice();
  const rnd=seededRng(todayISO()+lang);
  const dailyBase=sampleDistinct(base,8,rnd);
  const pasts=sampleDistinct(base,4,rnd).map(pastChip);
  let extra=[];
  if(lang==='it'){
    inferUserPrefs().slice(0,2).forEach(cat=>{
      const bank=GEN_REAL_IT[cat]||[]; extra=extra.concat(sampleDistinct(bank,2,rnd).map(x=>"E se "+x));
    });
  }
  const final=[...new Set([...dailyBase,...pasts,...extra])].slice(0,14);
  hintsWrap.innerHTML='';
  final.forEach(h=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=h;
    b.onclick=()=>{ $('qInput').value=h; isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0'); window.scrollTo({top:0,behavior:'smooth'}); };
    hintsWrap.appendChild(b);
  });
  const T=I18N[lang]||I18N.it; $('hintsNote').textContent=T.hintsNote;
}
renderHints();

/* ===== “SORPRENDIMI” — generatore assurdo + passato + sbronza colossale ===== */
const ABS_GEN={
  it:{
    open:["Capo cosmico,","Ehi fenomeno,","Tesoro ribelle,","Campione,"],
    tease:["sei serio?","lo rifaresti davvero?","prendi fiato.","ti voglio così."],
    acts:["convocassi un consiglio coi piccioni urbanisti","insegnassi mindfulness ai semafori","fondassi il Sindacato delle Tapparelle","lanciassi una banca che presta minuti","organizzassi un TEDx sul tostapane","facessi product-market fit coi calzini spaiati","creassi un algoritmo che premia i pisolini","assumessi un motivatore che parla solo in eco"],
    objs:["la moka","il citofono","la stampante","la tapparella","il frigorifero","Alexa","il POS","il ventilatore"],
    reacts:["ti manda un CV","apre un ticket con l’universo","ti lascia in seen","passa in modalità aereo","ti dà del lei"],
    twists:[
      "intanto parte una **sbronza colossale** di spritz quantistici",
      "tu firmi col correttore per non lasciare prove",
      "il vicino applaude convinto sia arte contemporanea",
      "la tua agenda si autodichiara in sciopero a tempo indeterminato"
    ]
  },
  en:{
    open:["Chaos pilot,","Buddy,","Legend,","Captain,"],
    tease:["you serious?","say it again.","ok breathe.","noted."],
    acts:["hosted a board meeting with pigeons","taught mindfulness to traffic lights","founded the Union of Blinds","launched a bank that lends minutes","ran a TEDx about toasters","built product-market fit with odd socks"],
    objs:["the kettle","the doorbell","the printer","the blinds","the fridge","Alexa","the POS","the fan"],
    reacts:["submits a résumé","files a ticket with the universe","leaves you on read","switches to airplane mode"],
    twists:["meanwhile a **colossal bender** of cosmic spritz takes off","the neighbor claps and calls it performance art","your calendar declares a wildcat strike"]
  }
};
function absurdLine(r, past=false){
  const L=(ABS_GEN[lang]||ABS_GEN.it);
  const o=L.open[Math.floor(r()*L.open.length)];
  const t=L.tease[Math.floor(r()*L.tease.length)];
  const a=L.acts[Math.floor(r()*L.acts.length)];
  const ob=L.objs[Math.floor(r()*L.objs.length)];
  const re=L.reacts[Math.floor(r()*L.reacts.length)];
  const tw=L.twists[Math.floor(r()*L.twists.length)];
  if(lang==='it'){
    const core = past ? `E se ieri avessi ${a}?` : `E se ${a}?`;
    return `${o} ${t} ${core} ${ob} ${re}, ${tw}?`;
  } else {
    const core = past ? `What if you had ${a}?` : `What if you ${a}?`;
    return `${o} ${t} ${core} ${ob} ${re}, ${tw}?`;
  }
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0; return String(h); }
function getRecentHashes(){ return new Set(readJSON('surprise_recent_hashes',[])); }
function rememberHashes(list){ const arr=readJSON('surprise_recent_hashes',[]); list.forEach(h=>arr.unshift(h)); writeJSON('surprise_recent_hashes',arr.slice(0,140)); }
function hintsSetNow(){ return new Set([...document.querySelectorAll('#hintsChips .chip')].map(b=>b.textContent.trim())); }

function makeAbsurdList(n=16){
  const avoidText=hintsSetNow();
  const r=()=>Math.random();
  const recent=getRecentHashes(); const out=[], toMem=[];
  while(out.length<n){
    const line=absurdLine(Math.random, Math.random()<0.35);
    const h=hash(line);
    if(recent.has(h)) continue;
    if(avoidText.has(line)) continue;
    recent.add(h); out.push(line); toMem.push(h);
  }
  rememberHashes(toMem);
  return out;
}

/* Collassabili chiusi di default */
['hints','saved','hist'].forEach(k=>{
  const card=$(k+'Card'); card.classList.add('collapsed');
  $(k+'Header')?.addEventListener('click',()=> card.classList.toggle('collapsed'));
});

/* ===== SAVED / HISTORY ===== */
function fmtDate(ts){ return new Date(ts).toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function addSaved(q){ if(!q) return; const arr=readJSON('next_prompts',[]); arr.unshift({q,ts:Date.now()}); writeJSON('next_prompts',arr.slice(0,50)); renderNext(); }
function addHistory(domanda, stile){ if(!domanda) return; const arr=readJSON('cronologia',[]); arr.push({domanda, stile, ts:Date.now(), risposta:''}); writeJSON('cronologia', arr.slice(-100)); renderStories(); }
function renderNext(){
  const T=I18N[lang]||I18N.it;
  const box=$('nextList'); box.innerHTML=''; const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmtDate(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.use;
    useBtn.onclick=()=>{ $('qInput').value=item.q||''; isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0'); window.scrollTo({top:0,behavior:'smooth'}); };
    right.appendChild(useBtn); row.appendChild(left); row.appendChild(right); box.appendChild(row);
  });
}
function renderStories(){
  const T=I18N[lang]||I18N.it;
  const box=$('storyList'); box.innerHTML=''; const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyHist; box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story',{domanda:item.domanda,answer:item.risposta||item.answer||'',stile:item.stile||'whatif'}); location.href='fifth.html'; };
    row.appendChild(left); row.appendChild(play); box.appendChild(row);
  });
}
renderNext(); renderStories();
$('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
$('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };
$('saveBtn').onclick=()=>{ const q=($('qInput').value||'').trim(); if(!q) return; addSaved(q); };

/* ===== GENERA / CREDITS ===== */
function consumeOneCredit(){
  if(userIsAdmin()) return true;
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  const cap=capForUser();
  if((c.used||0)>=cap){ alert((I18N[lang]||I18N.it).credits+': '+(lang==='en'?'limit reached':'limite raggiunto')); return false; }
  c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCredits(); return true;
}

/* 🔗 submit verso fifth */
function trySubmit(){
  const domanda=($('qInput').value||'').trim();
  if(!domanda) { $('qInput').focus(); return; }
  if(!consumeOneCredit()) return;

  const req={domanda, stile:prefs.stile, lang, extra:'', fantasy_mode:false, periodo:prefs.periodo,
             absurd:isAbsurd, surprise:isAbsurd, source: isAbsurd ? 'surprise' : 'manual',
             micro:{ surprise:isAbsurd, source:isAbsurd?'surprise':'manual' }};

  writeJSON('whatif_request',req);
  LS.setItem('domanda',domanda);
  LS.setItem('absurd_prompt', isAbsurd ? '1' : '0');
  LS.setItem('surprise_mode', isAbsurd ? '1' : '0');

  addHistory(domanda, prefs.stile);
  location.href = isAbsurd ? 'fifth.html?src=surprise' : 'fifth.html';
}
$('goBtn').onclick=trySubmit;

$('qInput').addEventListener('input', ()=>{
  isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0');
});
$('clearBtn').onclick=()=>{
  $('qInput').value=''; isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0'); $('qInput').focus();
};
$('qInput').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

/* ======== 🎲 SORPRENDIMI ======== */
function spinCap(){ return userIsAdmin()?Infinity:(prefs.pro?5:2); }
function ensureSpins(){ const s=readJSON('surprise_spins',{date:todayISO(),used:0}); if(s.date!==todayISO()){ s.date=todayISO(); s.used=0; } writeJSON('surprise_spins',s); return s; }
function spinsLeft(){ const s=ensureSpins(); const cap=spinCap(); return cap===Infinity?Infinity:Math.max(0,cap-(s.used||0)); }
function renderSpinButton(){
  const T=I18N[lang]||I18N.it; const cap=spinCap(); const left=spinsLeft();
  const suffix = (cap===Infinity)?' (∞)':` (${left}/${cap})`;
  $('surpriseBtn').textContent='🎲 '+T.surprise + suffix;
  $('surpriseBtn').title = `${T.spins}: ${cap===Infinity?'∞':left+'/'+cap}`;
}
function consumeOneSpin(){
  if(userIsAdmin()) return true;
  const s=ensureSpins(); const cap=spinCap();
  if(cap!==Infinity && (s.used||0)>=cap){ alert((I18N[lang]||I18N.it).noSpins); return false; }
  s.used=(s.used||0)+1; writeJSON('surprise_spins',s); renderSpinButton(); return true;
}
renderSpinButton();

function slotSurprise(){
  if(!consumeOneSpin()) return;
  const rollingList = makeAbsurdList(22);
  const el=$('qInput'); el.classList.add('slotting');
  let i=0;
  const iv=setInterval(()=>{
    el.value = rollingList[i % rollingList.length];
    const s = Math.random()<.5 ? 'whatif' : 'wtf';
    const p = Math.random()<.5 ? 'future' : 'past';
    prefs.stile=s; prefs.periodo=p; writeJSON('whatif_prefs',prefs);
    document.documentElement.setAttribute('data-theme', s==='wtf'?'wtf':'whatif'); renderBadges(); i++;
  },90);

  setTimeout(()=>{ 
    clearInterval(iv); el.classList.remove('slotting');
    const finalList = makeAbsurdList(14);
    const finalPrompt = finalList[Math.floor(Math.random()*finalList.length)];
    $('qInput').value = finalPrompt;
    isAbsurd=true; LS.setItem('absurd_prompt','1'); LS.setItem('surprise_mode','1');
  }, 1200 + Math.random()*600);
}
$('surpriseBtn').onclick=slotSurprise;
</script>
