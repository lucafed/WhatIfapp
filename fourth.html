<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn.sm{padding:8px 10px;border-radius:10px;font-size:13px}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea,select{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
details.collapsible{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
details.collapsible>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.collapsible>summary::-webkit-details-marker{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
hr.sep{border:none;height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){ .grid-2{grid-template-columns:1fr} }

/* placeholder per event. contenteditable (se mai servisse) */
.input[contenteditable]:empty:before{content:attr(data-ph);color:var(--muted)}
/* header right controls non “escono” */
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.header-right>*{flex:0 0 auto}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="header-right">
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn sm" id="proBtn">PRO</button>
      <button class="btn sm" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style & period -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row">
        <span class="badge" id="periodoBadge">🕰️ —</span>
        <span class="badge" id="styleBadge">🎭 —</span>
      </div>
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <!-- Question -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <div class="row" style="gap:8px">
        <button class="btn ghost" id="clearBtn">Pulisci</button>
      </div>
    </div>

    <!-- “E se…” suggerimenti compatti e collassabili -->
    <details class="collapsible" id="nudgesWrap" style="margin-top:12px" open>
      <summary id="nudgesTitle">E se… (spunti rapidi)</summary>
      <div id="nudgesList" class="chips" style="padding:8px 10px"></div>
    </details>
  </div>

  <!-- Micro-domande (semplici, 1/die) -->
  <div class="card center">
    <details class="collapsible" id="microWrap">
      <summary>
        <span id="microTitle">Micro-domande di oggi • 0/3</span>
        <span class="small" id="microHint">(1 volta al giorno)</span>
      </summary>
      <div style="padding:12px 14px">
        <div class="grid-2">
          <div>
            <div class="small" id="moodLbl">Umore (1–5)</div>
            <select id="mood" class="input">
              <option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
          <div>
            <div class="small" id="energyLbl">Energia (1–5)</div>
            <select id="energy" class="input">
              <option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
          <div>
            <div class="small" id="cityLbl">Dove sei oggi?</div>
            <input id="city" class="input" placeholder="es. L’Aquila / Verona"/>
          </div>
          <div>
            <div class="small" id="focusLbl">Un focus di oggi</div>
            <input id="focus" class="input" placeholder="es. lavoro / famiglia / salute"/>
          </div>
        </div>
        <div class="row" style="margin-top:10px;justify-content:flex-end">
          <button class="btn primary" id="saveMicroBtn">💾 Salva</button>
        </div>
        <div class="small" id="microSavedMsg" style="margin-top:6px"></div>
      </div>
    </details>
  </div>

  <!-- Salvati per domani -->
  <div class="card center">
    <details class="collapsible" id="savedCard" open>
      <summary>
        <span id="nextLabel">Domande salvate per domani</span>
        <div class="header-right"><button class="btn sm ghost" id="clearSavedBtn">Svuota salvate</button></div>
      </summary>
      <div id="nextList" class="list" style="padding:12px 14px"></div>
    </details>
  </div>

  <!-- Storie recenti -->
  <div class="card center">
    <details class="collapsible" id="histCard">
      <summary>
        <span id="storiesLabel">Storie recenti</span>
        <div class="header-right"><button class="btn sm ghost" id="clearHistoryBtn">Svuota storie</button></div>
      </summary>
      <div id="storyList" class="list" style="padding:12px 14px"></div>
    </details>
  </div>

</main>

<script>
/* ===== Helpers ===== */
const LS=localStorage;
const $=id=>document.getElementById(id);
const lang=(LS.getItem('lang')||'it').toLowerCase();
const I18N={
  it:{
    title:"Imposta la tua domanda",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    yourq:"La tua domanda", gen:"✨ Genera risposta", clear:"Pulisci",
    styleBadgeWhat:"What if", styleBadgeWtf:"What the F",
    periodPast:"Passato", periodFuture:"Futuro",
    nudges:"E se… (spunti rapidi)",
    microT:(n)=>`Micro-domande di oggi • ${n}/3`,
    microHint:"(1 volta al giorno)",
    mood:"Umore (1–5)", energy:"Energia (1–5)", city:"Dove sei oggi?", focus:"Un focus di oggi",
    save:"💾 Salva", savedOK:"Micro-profilo salvato per oggi.", savedOnce:"Già salvato oggi.",
    saved:"Domande salvate per domani", clearSaved:"Svuota salvate", emptyNext:"— Nessuna domanda salvata.",
    stories:"Storie recenti", clearHist:"Svuota storie", emptyStories:"— Nessuna storia recente.",
    free:(l,d)=>`Free oggi: ${l}/${d}`, pro:"PRO", proOn:"PRO attivo", outOfCredits:"Hai finito i crediti di oggi.",
    goHome:"🏠", back:"←"
  },
  en:{
    title:"Set your question",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    yourq:"Your question", gen:"✨ Generate answer", clear:"Clear",
    styleBadgeWhat:"What if", styleBadgeWtf:"What the F",
    periodPast:"Past", periodFuture:"Future",
    nudges:"What if… (quick prompts)",
    microT:(n)=>`Today’s micro-questions • ${n}/3`,
    microHint:"(once per day)",
    mood:"Mood (1–5)", energy:"Energy (1–5)", city:"Where are you today?", focus:"One focus for today",
    save:"💾 Save", savedOK:"Micro-profile saved for today.", savedOnce:"Already saved today.",
    saved:"Saved for tomorrow", clearSaved:"Clear saved", emptyNext:"— No saved questions.",
    stories:"Recent stories", clearHist:"Clear stories", emptyStories:"— No recent stories.",
    free:(l,d)=>`Free today: ${l}/${d}`, pro:"PRO", proOn:"PRO active", outOfCredits:"You’ve used today’s credits.",
    goHome:"🏠", back:"←"
  }
}[lang];
document.documentElement.lang=lang;

/* ===== Prefs / Theme ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== Credits (3 free / 10 pro) ===== */
const DAILY_FREE = prefs.pro ? 10 : 3;
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:!!prefs.pro});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; c.pro=!!prefs.pro; }
  writeJSON('whatif_credits',c);
}
function leftCredits(){ const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:!!prefs.pro}); return Math.max(0,(prefs.pro?10:3)-(c.used||0)); }
function renderCredits(){ $('freeBadge').textContent=I18N.free(leftCredits(), prefs.pro?10:3); }
ensureCredits(); renderCredits();

/* Admin reset (solo con PIN, Alt+click sul badge) */
$('freeBadge').addEventListener('click',(e)=>{
  if(!e.altKey) return;
  const pin = prompt(lang==='en'?'Admin PIN to reset:':'PIN admin per reset:');
  if(pin==='AQUIVERA-ADMIN'){
    const c=readJSON('whatif_credits'); c.used=0; c.date=todayStr(); writeJSON('whatif_credits',c);
    LS.removeItem('micro_saved'); LS.removeItem('micro_profile');
    renderCredits(); renderMicro(true);
    alert(lang==='en'?'Reset done.':'Reset eseguito.');
  }
});

/* ===== UI text ===== */
$('titleH1').textContent=I18N.title;
$('qLabel').textContent=I18N.yourq;
$('goBtn').textContent=I18N.gen;
$('clearBtn').textContent=I18N.clear;
$('langBtn').textContent=lang.toUpperCase();
$('proBtn').textContent=prefs.pro?I18N.proOn:I18N.pro;

/* ===== Badges / chips ===== */
function renderBadges(){
  $('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past'? I18N.periodPast : I18N.periodFuture);
  $('styleBadge').textContent   = "🎭 " + (prefs.stile==='wtf'? I18N.styleBadgeWtf : I18N.styleBadgeWhat);
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
}
renderBadges();

$('periodoBadge').onclick=()=>{ prefs.periodo=(prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); renderBadges(); };
$('styleChips').addEventListener('click',(e)=>{ const b=e.target.closest('.chip'); if(!b) return; prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs); document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif'); renderBadges(); });

/* ===== Lang / Pro / Nav ===== */
$('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };
$('proBtn').onclick =()=>{ prefs.pro=!prefs.pro; writeJSON('whatif_prefs',prefs); ensureCredits(); renderCredits(); $('proBtn').textContent=prefs.pro?I18N.proOn:I18N.pro; };
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';

/* ===== “E se…” quick nudges (4, realisti & comuni) ===== */
function nudgesFor(style){
  if(lang==='en'){
    return style==='wtf'
      ? ["What if you took a reckless tiny step?", "What if you asked the funniest friend to join?", "What if you tried the bold option first?", "What if you celebrated before deciding?"]
      : ["What if you started with a 1-week test?", "What if you told one trusted person?", "What if you picked a clear budget?", "What if you chose one place to begin?"];
  } else {
    return style==='wtf'
      ? ["E se facessi un passo folle ma minuscolo?", "E se coinvolgessi l’amico più divertente?", "E se provassi prima l’opzione più audace?", "E se festeggiassi prima di decidere?"]
      : ["E se partissi con una prova di 1 settimana?", "E se lo dicessi a una persona di fiducia?", "E se fissassi un budget preciso?", "E se scegliessi un posto da cui iniziare?"];
  }
}
function renderNudges(){
  $('nudgesTitle').textContent = (lang==='en'?"What if… (quick prompts)":"E se… (spunti rapidi)");
  const box=$('nudgesList'); box.innerHTML="";
  nudgesFor(prefs.stile).forEach(txt=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
    b.onclick=()=>{ const i=$('qInput'); i.value = i.value ? (i.value+"\n"+txt) : txt; i.focus(); };
    box.appendChild(b);
  });
}
renderNudges();

/* ===== Micro — 1/day, auto-collassa dopo salvataggio ===== */
function microSavedToday(){ const s=readJSON('micro_saved',{date:"",ok:false}); return s.date===todayStr() && s.ok; }
function renderMicro(forceOpen=false){
  $('moodLbl').textContent=I18N.mood; $('energyLbl').textContent=I18N.energy; $('cityLbl').textContent=I18N.city; $('focusLbl').textContent=I18N.focus;
  $('saveMicroBtn').textContent=I18N.save; $('microHint').textContent=I18N.microHint;
  const saved = microSavedToday();
  const count = saved ? 3 : 0;
  $('microTitle').textContent = I18N.microT(count);
  ['mood','energy','city','focus'].forEach(id=> $(id).disabled=saved);
  $('saveMicroBtn').style.display = saved ? 'none':'inline-block';
  $('microSavedMsg').textContent = saved ? I18N.savedOK : '';
  if(!saved && forceOpen) $('microWrap').open = true;
  if(saved) $('microWrap').open = false;
}
renderMicro(!microSavedToday());

$('saveMicroBtn').onclick=()=>{
  if(microSavedToday()){ $('microSavedMsg').textContent=I18N.savedOnce; return; }
  const data={ mood:$('mood').value, energy:$('energy').value, city:($('city').value||"").trim(), focus:($('focus').value||"").trim(), ts:Date.now() };
  writeJSON('micro_profile',data);
  writeJSON('micro_saved',{date:todayStr(),ok:true});
  renderMicro();
};

/* ===== Saved & History ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=$('nextList'); box.innerHTML="";
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=I18N.emptyNext; box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700;max-width:540px">${item.q}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?(lang==='en'?'What the F':'What the F'):(lang==='en'?'What if':'What if'))}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn sm'; useBtn.textContent=(lang==='en'?'Use':'Usa');
    useBtn.onclick=()=>{ $('qInput').value=item.q; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ LS.setItem('domanda', item.q); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderStories(){
  const box=$('storyList'); box.innerHTML="";
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=I18N.emptyStories; box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700;max-width:540px">${item.domanda}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?(lang==='en'?'What the F':'What the F'):(lang==='en'?'What if':'What if'))}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story', { domanda:item.domanda, answer:item.risposta||"", stile:item.stile, ts:item.ts }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
renderNext(); renderStories();

$('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
$('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };

/* ===== Generate ===== */
$('goBtn').onclick=()=>{
  const domanda=($('qInput').value||"").trim();
  if(!domanda){ $('qInput').focus(); return; }
  const c=readJSON('whatif_credits'); const used=(c.used||0); const cap=prefs.pro?10:3;
  if(used>=cap){ alert(I18N.outOfCredits); return; }
  c.used=used+1; writeJSON('whatif_credits',c); renderCredits();

  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  writeJSON('whatif_request',{ domanda, stile:prefs.stile, lang, extra:"", micro, fantasy_mode:false });
  location.href='fifth.html';
};

$('clearBtn').onclick=()=>{ $('qInput').value=""; $('qInput').focus(); };

/* placeholders by lang */
$('qInput').placeholder = (lang==='en' ? "What if I moved back to L’Aquila?" : "E se tornassi a vivere all’Aquila?");
</script>
</body>
</html>
