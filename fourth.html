<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Domanda</title>
  <meta name="theme-color" content="#0B0B0C" />
  <style>
    :root{
      --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
      --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
      --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12); --chip:#121A26;
    }
    html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{max-width:980px;margin:auto;padding:18px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
    .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none}
    .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee}
    .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
    h1{font-size:clamp(22px,5vw,30px);margin:6px 0 12px;color:var(--acc2);text-align:center}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
    .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
    .center{max-width:760px;margin:0 auto}
    .label{color:var(--acc);font-weight:800;margin:8px 0}
    textarea{width:100%;min-height:120px;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:18px;text-align:center}
    .hint{font-size:13px;color:#cfe7ff;margin-top:10px;text-align:center}
    .footer-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  </style>
</head>
<body>
  <main>
    <!-- topbar -->
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="btn" id="backBtn">←</button>
        <button class="btn" id="homeBtn">🏠</button>
      </div>
      <div class="row">
        <span class="badge" id="badgePeriod">🕰️ —</span>
        <span class="badge" id="badgeStyle">🎭 —</span>
        <button class="btn" id="langBtn">IT</button>
      </div>
    </div>

    <h1 id="titleH1">Imposta la tua domanda</h1>

    <!-- Scelte in alto -->
    <div class="card center">
      <div class="label">Periodo</div>
      <div class="chips" id="chipsPeriod">
        <button class="chip" data-val="past">Passato</button>
        <button class="chip" data-val="future">Futuro</button>
      </div>

      <div class="label" style="margin-top:12px">Stile</div>
      <div class="chips" id="chipsStyle">
        <button class="chip" data-val="whatif">What if</button>
        <button class="chip" data-val="wtf">What the F</button>
      </div>

      <!-- Sottotono visibile solo se What if -->
      <div id="toneWrap" style="display:none">
        <div class="label" style="margin-top:12px">Sottotono (What if)</div>
        <div class="chips" id="chipsTone">
          <button class="chip" data-val="analitica">Analitica</button>
          <button class="chip" data-val="poetica">Poetica</button>
        </div>
      </div>
    </div>

    <!-- Domanda al centro -->
    <div class="card center">
      <div class="label">La tua domanda</div>
      <textarea id="qInput" placeholder="E se tornassi a vivere all’Aquila?" autocomplete="off" spellcheck="false"></textarea>
      <div class="hint">Suggerimento: scegli stile/periodo sopra. Il tono si adatta automaticamente.</div>
      <div class="footer-actions">
        <button class="btn primary" id="genBtn">✨ Genera</button>
        <button class="btn" id="clearBtn">Svuota</button>
      </div>
    </div>
  </main>

  <script>
    const LS = localStorage;
    const $ = s=>document.querySelector(s);
    const $$ = s=>document.querySelectorAll(s);

    // lingua
    const lang = (LS.getItem('lang')||'it').toLowerCase();
    document.documentElement.lang = lang;

    // prefs
    let prefs = {};
    try { prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}'); } catch { prefs = {}; }
    if (!prefs.stile) prefs.stile = 'whatif';
    if (!prefs.periodo) prefs.periodo = 'future';
    if (!prefs.whatif_tone) prefs.whatif_tone = 'analitica';

    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

    // UI wiring
    function selectChip(container, value){
      container.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel', c.dataset.val===value));
    }

    function render(){
      selectChip($('#chipsPeriod'), prefs.periodo);
      selectChip($('#chipsStyle'), prefs.stile);
      document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
      $('#badgePeriod').textContent = '🕰️ ' + (prefs.periodo==='past' ? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
      $('#badgeStyle').textContent  = '🎭 ' + (prefs.stile==='wtf' ? 'What the F' : 'What if');

      // sottotono What if
      $('#toneWrap').style.display = (prefs.stile==='whatif') ? 'block' : 'none';
      if (prefs.stile==='whatif'){
        selectChip($('#chipsTone'), prefs.whatif_tone);
      }
    }
    render();

    // period
    $('#chipsPeriod').addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if(!b) return;
      prefs.periodo = b.dataset.val;
      LS.setItem('whatif_prefs', JSON.stringify(prefs));
      render();
    });

    // style
    $('#chipsStyle').addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if(!b) return;
      prefs.stile = b.dataset.val;
      LS.setItem('whatif_prefs', JSON.stringify(prefs));
      render();
    });

    // tone
    $('#chipsTone')?.addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if(!b) return;
      prefs.whatif_tone = b.dataset.val;
      LS.setItem('whatif_prefs', JSON.stringify(prefs));
      render();
    });

    // nav
    $('#backBtn').onclick = ()=>history.back();
    $('#homeBtn').onclick = ()=>location.href='index.html';
    $('#langBtn').textContent = lang.toUpperCase();
    $('#langBtn').onclick = ()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

    // input
    const qEl = $('#qInput');
    $('#clearBtn').onclick = ()=>{ qEl.value=''; qEl.focus(); };
    qEl.addEventListener('keydown', e=>{
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('#genBtn').click(); }
    });

    // genera
    $('#genBtn').onclick = ()=>{
      const domanda = (qEl.value||'').trim();
      if (!domanda){ qEl.focus(); return; }

      // Prepara request per fifth
      const extraTone = (prefs.stile==='whatif') ? `[WHATIF_TONE=${prefs.whatif_tone}]` : "";
      LS.setItem('domanda', domanda);
      const req = {
        domanda,
        stile: prefs.stile,
        periodo: prefs.periodo,
        lang,
        extra: extraTone,
        micro: JSON.parse(LS.getItem('micro_profile')||'{}')
      };
      LS.setItem('whatif_request', JSON.stringify(req));
      location.href = 'fifth.html';
    };
  </script>
</body>
</html>
