<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — La tua domanda</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{
      --bg:#0A0F14; --fg:#E6F2F5; --muted:#A0B2BA;
      --card:#121820; --accent:#00E0FF; --accent2:#00B5CC;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px}

    /* top */
    .top{display:flex;align-items:center;gap:12px}
    .back{appearance:none;border:none;background:#0f1820;color:var(--fg);
      padding:10px 14px;border-radius:14px;cursor:pointer}
    .crumb{color:var(--muted);font-size:14px}

    h1{margin:0;font-size:clamp(26px,6vw,40px);}

    /* card */
    .card{background:var(--card);border:1px solid #1b2730;border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
    .label{margin-bottom:8px;color:var(--muted);font-weight:700}
    textarea{width:100%;min-height:160px;background:#0f1820;color:var(--fg);
      border:1px solid #1d2b34;border-radius:14px;padding:14px;font-size:16px;resize:vertical}
    .hint{color:var(--muted);font-size:14px;margin-top:10px}
    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;
      padding:10px 12px;margin-top:10px;display:none}

    .cta{margin-top:16px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
    .btn{appearance:none;border:none;border-radius:16px;padding:14px 18px;min-width:210px;cursor:pointer;font-weight:900}
    .primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#002329}
    .ghost{background:#132029;color:#cfe3ea;border:1px solid #1d2b34}

    /* language selector (FAB) */
    .lang-fab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:50}
    .lang-btn{appearance:none;border:1px solid #1d2b34;background:#0f1820;color:#E6F2F5;
      padding:10px 12px;border-radius:999px;cursor:pointer}
    .lang-menu{position:absolute;top:46px;right:0;background:#101922;border:1px solid #1d2b34;
      border-radius:12px;padding:8px;display:none;min-width:160px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
    .lang-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;
      color:#E6F2F5;padding:10px;border-radius:10px;cursor:pointer}
    .lang-menu button.active{background:#14222b}

    /* loader overlay */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:40}
    .overlay.show{display:flex}
    .spinner{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:#00E0FF;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!-- Selettore lingua -->
  <div class="lang-fab" id="langFab">
    <button class="lang-btn" id="langToggle" aria-haspopup="true" aria-expanded="false">🌐</button>
    <div class="lang-menu" id="langMenu" role="menu" aria-label="language">
      <button data-lang="it">Italiano</button>
      <button data-lang="en">English</button>
    </div>
  </div>

  <main>
    <div class="top">
      <button class="back" id="backBtn" data-i18n="back">Indietro</button>
      <span class="crumb" id="crumb"></span>
    </div>

    <h1 data-i18n="title">La tua domanda</h1>

    <div class="card">
      <div class="label" data-i18n="label">Scrivi la tua domanda What?f…</div>
      <textarea id="question" placeholder=""></textarea>
      <div class="hint" id="hint"></div>
      <div id="err" class="error"></div>

      <div class="cta">
        <button class="btn ghost" id="backBtn2" data-i18n="back">Indietro</button>
        <button class="btn primary" id="go" data-i18n="discover">Scopri</button>
      </div>
    </div>
  </main>

  <!-- Loader -->
  <div class="overlay" id="loader"><div class="spinner"></div></div>

  <script>
    /* ---------------- i18n ---------------- */
    const dict = {
      it: {
        back:"Indietro",
        title:"La tua domanda",
        label:"Scrivi la tua domanda What?f…",
        discover:"Scopri",
        placeholder:"Esempio: Se avessi accettato quel lavoro a Milano?",
        hint:'Suggerimento: sii specifico. Es. “Se restassi a L’Aquila i prossimi 2 anni, cosa cambierebbe nella mia carriera?”',
        crumb:(s)=>[ s.periodo==="past"?"Passato": s.periodo==="future"?"Futuro":"",
                     s.stile==="whatif"?"What if (plausibile)": s.stile==="wtf"?"What the F (ironico)":""
                   ].filter(Boolean).join(" • "),
        err_empty:"Scrivi prima la tua domanda."
      },
      en: {
        back:"Back",
        title:"Your question",
        label:"Write your What?f question…",
        discover:"Discover",
        placeholder:"Example: What if I had accepted that job in Milan?",
        hint:'Tip: be specific. E.g. “If I stayed in L’Aquila for the next 2 years, how would my career change?”',
        crumb:(s)=>[ s.periodo==="past"?"Past": s.periodo==="future"?"Future":"",
                     s.stile==="whatif"?"What if (plausible)": s.stile==="wtf"?"What the F (ironic)":""
                   ].filter(Boolean).join(" • "),
        err_empty:"Please write your question first."
      }
    };
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    function getLang(){ return localStorage.getItem("lang") || "it"; }
    function tApply(lang){
      const pack = dict[lang] || dict.it;
      $$("[data-i18n]").forEach(el=>{
        const k = el.getAttribute("data-i18n");
        if(pack[k]) el.textContent = pack[k];
      });
      document.documentElement.lang = lang;
      $("#question").placeholder = pack.placeholder;
      $("#hint").textContent = pack.hint;
      const prefs = JSON.parse(localStorage.getItem("whatif_prefs")||"{}");
      $("#crumb").textContent = pack.crumb(prefs);
      markMenu(lang);
    }
    function setLang(l){ localStorage.setItem("lang", l); tApply(l); }

    /* ------------- language widget ------------- */
    const fab  = $("#langFab");
    const btn  = $("#langToggle");
    const menu = $("#langMenu");
    function markMenu(lang){
      menu.querySelectorAll("button").forEach(b=>{
        b.classList.toggle("active", b.dataset.lang===lang);
      });
    }
    btn.addEventListener("click", ()=>{
      const open = menu.style.display==="block";
      menu.style.display = open ? "none" : "block";
      btn.setAttribute("aria-expanded", String(!open));
    });
    menu.addEventListener("click", (e)=>{
      const b = e.target.closest("button[data-lang]"); if(!b) return;
      setLang(b.dataset.lang);
      menu.style.display="none";
      btn.setAttribute("aria-expanded","false");
    });
    document.addEventListener("click",(e)=>{
      if(!fab.contains(e.target)){ menu.style.display='none'; btn.setAttribute('aria-expanded','false'); }
    });
    window.addEventListener("storage",(e)=>{ if(e.key==="lang") tApply(getLang()); });
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tApply(getLang()); });

    // init i18n
    tApply(getLang());

    /* ------------- nav ------------- */
    $("#backBtn").addEventListener("click", ()=> history.back());
    $("#backBtn2").addEventListener("click", ()=> history.back());

    /* ------------- AI call ------------- */
    const loader = $("#loader");
    const errBox = $("#err");
    function showLoader(v){ loader.classList.toggle('show', !!v); }
    function showError(msg){ errBox.textContent = msg; errBox.style.display='block'; }

    function buildMock(lang, ctx){
      const realistic = ctx.prefs?.stile !== 'wtf';
      const dir = ctx.prefs?.periodo==='past' ? (lang==='en'?'past':'passato') : (lang==='en'?'future':'futuro');
      const base_it = realistic
        ? `Scenario ${dir}: la tua scelta potrebbe portare a un cambio concreto. `
        : `WHAT THE F?! ${dir.toUpperCase()} edition: svolta inaspettata con colpi di scena… `;
      const base_en = realistic
        ? `Scenario ${dir}: your choice could lead to a concrete change. `
        : `WHAT THE F?! ${dir.toUpperCase()} edition: unexpected twist with unusual turns… `;
      const pct = 60 + Math.floor(Math.random()*31);
      return { text: (lang==='en'?base_en:base_it) + (lang==='en'?'Estimated probability: ':'Probabilità stimata: ') + pct + '%', probPct: pct };
    }

    async function askAI(payload){
      // tenta l’endpoint vercel /api/ask
      try{
        const res = await fetch('/api/ask', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        if(res.ok){
          const data = await res.json();
          if(data && data.answer && data.answer.text){
            return data.answer; // {text, probPct}
          }
        }
      }catch(_){}
      // fallback mock
      return buildMock(getLang(), payload);
    }

    $("#go").addEventListener("click", async ()=>{
      errBox.style.display='none';
      const q = ($("#question").value||"").trim();
      if(!q){ showError(dict[getLang()].err_empty); $("#question").focus(); return; }

      // raccogli contesto
      const lang  = getLang();
      const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');     // {periodo, stile}
      const prof  = JSON.parse(localStorage.getItem('whatif_profile')||'{}');   // se presente
      const payload = { lang, prefs, profile: prof, question: q };

      // salva subito la domanda
      localStorage.setItem('whatif_question', q);

      // chiama AI (o mock) + mostra loader
      showLoader(true);
      const answer = await askAI(payload);
      showLoader(false);

      // salva risposta per fifth.html
      localStorage.setItem('whatif_answer', JSON.stringify(answer));
      // vai ai risultati
      location.href = 'fifth.html';
    });
  </script>
</body>
</html>
