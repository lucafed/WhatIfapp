<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — La tua domanda</title>
  <meta name="theme-color" content="#0B0B0C" />
  <style>
    :root{
      --bg:#0C0F14; --fg:#EAF2F6; --muted:#A0B2BA;
      --card:rgba(20,26,34,.55); --line:rgba(255,255,255,.12);
      --chip:#121A26; --acc:#1C57A0; --acc2:#FFEC01; --ink:#0A0E12;
    }
    html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
    *{box-sizing:border-box}
    body{
      margin:0; background:radial-gradient(900px 700px at 25% 20%, #0E1724 0%, var(--bg) 60%);
      color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px}
    .wrap{width:min(92vw,860px)}
    h1{margin:2px 0 8px;font-size:clamp(24px,5.5vw,36px)}

    .top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .chip{
      appearance:none;border:1px solid var(--line);background:var(--chip);color:#e8f2ec;
      padding:10px 14px;border-radius:14px;font-weight:800;cursor:pointer;
      transition:transform .08s ease, background .16s ease, box-shadow .16s ease;
    }
    .chip:active{transform:translateY(1px)}
    .chip.selected{
      background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);
      box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
    }

    .qbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
    label{font-weight:900;display:block;margin:0 0 8px}
    textarea{
      width:100%; min-height:120px; background:#0E1620; color:var(--fg);
      border:1px solid var(--line); border-radius:12px; padding:12px; font-size:16px;
    }
    .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
    .btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}
    .btn.ghost{background:#17222c;color:#dceaf0;border:1px solid var(--line)}
    .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink)}
    .hint{color:var(--muted);font-size:13px;margin-top:6px}
    #out{white-space:pre-wrap;line-height:1.45}
  </style>
</head>
<body>
  <script>
    (function(){
      try{
        const p=JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        document.documentElement.setAttribute('data-theme', p.stile==='wtf'?'wtf':'whatif');
      }catch{document.documentElement.setAttribute('data-theme','whatif');}
    })();
  </script>

  <main>
    <div class="wrap">
      <div class="top">
        <div class="tabs" id="tabs">
          <button class="chip" data-key="stile" data-val="whatif">What if</button>
          <button class="chip" data-key="stile" data-val="wtf">What the F</button>
          <button class="chip" data-key="periodo" data-val="past">Passato</button>
          <button class="chip" data-key="periodo" data-val="future">Futuro</button>
          <button class="chip" data-key="lang" data-val="it">IT</button>
          <button class="chip" data-key="lang" data-val="en">EN</button>
        </div>
      </div>

      <div class="qbox">
        <label for="q">La tua domanda</label>
        <textarea id="q" placeholder="E se…"></textarea>
        <div class="row">
          <button id="clear" class="btn ghost">Svuota</button>
          <button id="go" class="btn primary">✨ Genera risposta</button>
        </div>
        <div class="hint">Scrivi una sola frase. La voce e il periodo li scegli sopra.</div>
      </div>

      <div id="outWrap" class="qbox" style="display:none">
        <div id="out"></div>
      </div>
    </div>
  </main>

  <script>
    const LS = localStorage;
    const $ = s => document.querySelector(s);

    // stato con persistenza
    const st = JSON.parse(LS.getItem('whatif_prefs')||'{}');
    if(!st.stile)   st.stile   = 'whatif';
    if(!st.lang)    st.lang    = 'it';
    if(!st.periodo) st.periodo = 'future';
    LS.setItem('whatif_prefs', JSON.stringify(st));

    function syncChips(){
      document.querySelectorAll('.chip').forEach(b=>{
        const k=b.dataset.key, v=b.dataset.val;
        b.classList.toggle('selected', st[k]===v);
      });
      document.documentElement.setAttribute('data-theme', st.stile==='wtf'?'wtf':'whatif');
    }
    syncChips();

    // selezione esclusiva per ogni key
    $('#tabs').addEventListener('click', (e)=>{
      const b=e.target.closest('.chip'); if(!b) return;
      const k=b.dataset.key, v=b.dataset.val;
      document.querySelectorAll(`.chip[data-key="${k}"]`).forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      st[k]=v; LS.setItem('whatif_prefs', JSON.stringify(st));
      if(k==='stile'){ document.documentElement.setAttribute('data-theme', v==='wtf'?'wtf':'whatif'); }
    });

    $('#clear').addEventListener('click', ()=>{
      $('#q').value=''; $('#outWrap').style.display='none'; $('#out').textContent='';
    });

    async function ask(){
      const domanda = ($('#q').value||'').trim();
      if(!domanda) return;
      $('#outWrap').style.display='block';
      $('#out').textContent='…';
      const payload = { domanda, stile: st.stile, lang: st.lang, periodo: st.periodo, extra: '' };
      const r = await fetch('/api/ask', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-pro': (LS.getItem('pro')==='1'?'1':'0')},
        body: JSON.stringify(payload)
      }).then(r=>r.json()).catch(()=>({error:'net'}));
      $('#out').textContent = r?.answer || 'Errore: riprova.';
    }
    $('#go').addEventListener('click', ask);
  </script>
</body>
</html>
