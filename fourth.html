<style>

html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }

*{box-sizing:border-box}  
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}  
@media (prefers-reduced-motion:no-preference){  
  body{animation:bgShift 18s ease-in-out infinite alternate}  
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}  
}  /* Topbar */
.topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;border:1px dashed var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

/* Cards & chips */
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Input */
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}

/* Collapsible */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}

/* Footer */
footer{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}
</style>

  /* ===== GRAMMAR HELPERS ===== */  
  function polishQuestion(q, Lcode){  
    let t=String(q||"").replace(/[?？]+$/,'').trim();  
    if(!t) return '';  
    t = t.charAt(0).toUpperCase()+t.slice(1);  
    t = normalizeSpaces(t);  
  
    if(Lcode==="es"){  
      if(!t.startsWith('¿')) t = '¿'+t;  
      if(!t.endsWith('?')) t = t + '?';  
      return t;  
    }  
    if(Lcode==="fr"){  
      if(!t.endsWith('?')) t = t + ' ?';  
      t = t.replace(/\s*\?$/,' \u202F?'); // espace fine insécable  
      return t;  
    }  
    if(!/\?$/.test(t)) t = t + '?';  
    return t;  
  }  
  
  function seemsValidQuestion(q){  
    const t=String(q||"").trim();  
    const words=(t.match(WORD_RE)||[]);  
    const hasVerb=/\b(essere|fare|avere|andare|potrei|potresti|posso|cambiare|aprire|imparare|provare|vivere|studiare|correre|lavorare|organizzare|iniziare|testare|valutare|delegare|spegnere|ridurre|chiedere|investire|risparmiare|partire|tornare|esplorare|cambiar|aprender|estudiar|trabajar|learn|try|study|work|change|start|plan|test|reduce|ask|invest|save|run)\b/i.test(t);  
    return words.length>=4 && hasVerb;  
  }  
  
  /* ===== BOOST ===== */  
  function sanitizeBoost(raw){  
    let t = (raw||'').toString().normalize('NFKC')  
      .replace(UNICODE_OK?/[^\\p{L}\\p{N}\\s,'’.:-]/gu:/[^A-Za-z0-9\\s,'’.:-]/g,' ')  
      .replace(/[\u200B-\u200D\uFEFF]/g,' ')  
      .replace(/\s+/g,' ').trim().toLowerCase();  
  
    const stop = new Set(['mi','mia','mio','mie','miei','tuo','tua','tuoi','tue','suo','sua','suoi','sue','nostro','nostra','vostro','vostra','loro','io','tu','noi','voi','il','lo','la','i','gli','le','un','una','uno','di','a','da','in','con','su','per','tra','fra','che','del','della','dei','delle','degli','al','alla','allo','alle','my','your','his','her','its','our','their','the','a','an','and','or','to','of','for','with','on','in','at','by','mis','tus','sus','el','la','los','las','y','o','de','del','para','con','en','al','a','mon','ma','mes','ton','ta','tes','son','sa','ses','le','les','des','de','du','et','ou','pour','avec','dans','en','au','aux','mein','meine','dein','deine','sein','seine','ihr','ihre','der','die','das','ein','eine','und','oder','für','mit','in','auf','am','im','etc','ok']);  
    const toks = t.split(/[\s,;:.-]+/).filter(w => w && !stop.has(w) && !/^\d+$/.test(w) && (UNICODE_OK?/^[\p{L}\p{N}’']+$/u.test(w):/^[A-Za-z0-9'’]+$/.test(w)));  
    return toks;  
  }  
  function topicsFromTokens(tokens){  
    const out=[];  
    for(let n of [3,2,1]){  
      for(let i=0;i<=tokens.length-n;i++){  
        const phrase=tokens.slice(i,i+n).join(' ');  
        if(phrase.length<3) continue;  
        out.push(phrase);  
      }  
      if(out.length>=12) break;  
    }  
    return Array.from(new Set(out)).slice(0,12);  
  }  
  function extractTopics(txt){ return topicsFromTokens(sanitizeBoost(txt)); }  
  function getBoost(){ try{ return (LS.getItem('whatif_boost')||'').trim(); }catch{ return '' } }  
  function saveBoost(txt){  
    LS.setItem('whatif_boost', String(txt||''));  
    LS.setItem('whatif_boost_saved_date', todayISO());  
    const L=I18N[lang]||I18N.en;  
    const msg=$('boostSavedMsg'); if(msg){ msg.textContent=L.boostSaved; setTimeout(()=> msg.textContent='',1600); }  
  }  
  function initBoostVisibility(){

  /* ===== RUNTIME SUGGESTION POOLS ===== */  
  let SUGG = { personalized: [], generic: [], absurd: [] };  
  
  function makeTopicSentence(Lcode, periodo, tp){  
    const isIT = (Lcode==='it');  
    const isVerbIT = /[aà]re$|ere$|ire$/i.test(tp);  
    if(isIT){  
      return (periodo==='past')  
        ? (isVerbIT?`E se avessi iniziato a ${tp} l’estate scorsa`:`E se avessi fatto un esperimento su ${tp} l’estate scorsa`)  
        : (isVerbIT?`E se iniziassi a ${tp} per 7 giorni`:`E se esplorassi ${tp} con un esperimento di 7 giorni`);  
    }  
    if(Lcode==='es'){ return (periodo==='past')?`¿Y si hubieras probado ${tp} con un experimento de 7 días el verano pasado`:`¿Y si pruebas ${tp} con un experimento de 7 días`; }  
    if(Lcode==='fr'){ return (periodo==='past')?`Et si tu avais testé ${tp} avec une expérience de 7 jours l’été dernier`:`Et si tu testais ${tp} avec une expérience de 7 jours`; }  
    if(Lcode==='de'){ return (periodo==='past')?`Was, wenn du letzten Sommer ${tp} in einem 7-Tage-Experiment ausprobiert hättest`:`Was, wenn du ${tp} in einem 7-Tage-Experiment testest`; }  
    return (periodo==='past')?`What if you had run a 7-day experiment on ${tp} last summer`:`What if you tried a 7-day experiment on ${tp}`;  
  }  
  
  function buildPersonalizedPool(Lcode, periodo){  
    const profile = readJSON('whatif_profile', {}); // opzionale: {role, city, goal}  
    const boost   = getBoost();  
    const out = [];  
    const add = s => { if(s) out.push(polishQuestion(String(s), Lcode)); };  
  
    if (profile.role){  
      add( periodo==='past'  
        ? (Lcode==='it'?`E se avessi cambiato ruolo da ${profile.role} un anno fa`:  
           Lcode==='es'?`¿Y si hubieras dejado ${profile.role} hace un año`:  
           Lcode==='fr'?`Et si tu avais quitté ${profile.role} il y a un an`:  
           Lcode==='de'?`Was, wenn du vor einem Jahr von ${profile.role} gewechselt hättest`:  
           `What if you had moved on from ${profile.role} a year ago`)  
        : (Lcode==='it'?`E se portassi la tua carriera da ${profile.role} al livello successivo`:  
           Lcode==='es'?`¿Y si llevas tu carrera de ${profile.role} al siguiente nivel`:  
           Lcode==='fr'?`Et si tu faisais passer ta carrière de ${profile.role} au niveau supérieur`:  
           Lcode==='de'?`Was, wenn du deine ${profile.role}-Karriere auf ein neues Level hebst`:  
           `What if you took your ${profile.role} career to the next level`)  
      );  
    }  
    if (profile.city){  
      add( periodo==='past'  
        ? (Lcode==='it'?`E se fossi rimasto a ${profile.city} ma avessi cambiato ritmo prima`:  
           Lcode==='es'?`¿Y si te hubieras quedado en ${profile.city} y cambiado el ritmo antes`:  
           Lcode==='fr'?`Et si tu étais resté à ${profile.city} et avais changé de rythme plus tôt`:  
           Lcode==='de'?`Was, wenn du in ${profile.city} geblieben wärst und früher das Tempo geändert hättest`:  
           `What if you had stayed in ${profile.city} and changed pace earlier`)  
        : (Lcode==='it'?`E se restassi a ${profile.city} ma cambiassi routine per 30 giorni`:  
           Lcode==='es'?`¿Y si te quedas en ${profile.city} pero cambias la rutina 30 días`:  
           Lcode==='fr'?`Et si tu restais à ${profile.city} en changeant ta routine 30 jours`:  
           Lcode==='de'?`Was, wenn du in ${profile.city} bleibst, aber 30 Tage die Routine änderst`:  
           `What if you stayed in ${profile.city} but changed your routine for 30 days`)  
      );  
    }  
    if (profile.goal){  
      add( periodo==='past'  
        ? (Lcode==='it'?`E se avessi reso “${profile.goal}” misurabile l’anno scorso`:  
           Lcode==='es'?`¿Y si hubieras hecho “${profile.goal}” medible el año pasado`:  
           Lcode==='fr'?`Et si tu avais rendu “${profile.goal}” mesurable l’an dernier`:  
           Lcode==='de'?`Was, wenn du „${profile.goal}“ letztes Jahr messbar gemacht hättest`:  
           `What if you had made “${profile.goal}” measurable last year`)  
        : (Lcode==='it'?`E se impostassi passi settimanali verso “${profile.goal}”`:  
           Lcode==='es'?`¿Y si pones pasos semanales hacia “${profile.goal}”`:  
           Lcode==='fr'?`Et si tu posais des étapes hebdo vers “${profile.goal}”`:  
           Lcode==='de'?`Was, wenn du wöchentliche Schritte für „${profile.goal}“ festlegst`:  
           `What if you set weekly steps toward “${profile.goal}”`)  
      );  
    }  
  
    extractTopics(boost).forEach(tp=> add( makeTopicSentence(Lcode, periodo, tp) ));  
    // Dedup + massimo 48  
    return Array.from(new Set(out)).slice(0,48);  
  }  
  
  function buildGenericPoolByLang(Lcode, periodo){  
    const P = SURPRISE_POOLS[Lcode] || SURPRISE_POOLS.it;  
    const pool = (periodo==='past' ? (P.past||P.future) : (P.future||[])).slice();  
    return pool.map(s=>polishQuestion(s,Lcode));  
  }  
  function buildAbsurdPool(Lcode, periodo){  
    const P = SURPRISE_POOLS[Lcode] || SURPRISE_POOLS.it;  
    const pool = (periodo==='past'?(P.absurdPast||P.absurdFuture):(P.absurdFuture||[])).slice();  
    return pool.map(s=>polishQuestion(s,Lcode));  
  }  
  
  function rebuildSuggestionPools() {  
    const Lcode=(LS.getItem('lang')||'it').toLowerCase();  
    const periodo=(prefs.periodo==='past')?'past':'future';  
    const pers = buildPersonalizedPool(Lcode, periodo);  
    const gen  = buildGenericPoolByLang(Lcode, periodo);  
    const abs  = buildAbsurdPool(Lcode, periodo);  
    SUGG.personalized = pers;  
    SUGG.generic = gen;  
    SUGG.absurd = abs;  
  }  
  
  /* ===== HINTS (collassabili, aggiornati al boost) ===== */  
  function renderHints(forceOpen=false){  
    const wrap=$('hintsChips'); if(!wrap) return;  
    wrap.innerHTML='';  
    rebuildSuggestionPools();  
  
    function take(arr, n){ return (arr||[]).slice(0, n); }  
    const picks = [  
      ...take(SUGG.personalized, 4),  
      ...take(SUGG.generic, 3),  
      ...take(SUGG.absurd, 1),  
    ].filter(Boolean);  
  
    const all = [...SUGG.personalized, ...SUGG.generic, ...SUGG.absurd];  
    while(picks.length<8 && all.length) picks.push(all.shift());  
  
    picks.slice(0,8).forEach(txt=>{  
      const b=document.createElement('button');  
      b.className='chip';  
      b.type='button';  
      b.textContent=txt;  
      b.onclick=()=>{ $('qInput').value=txt; window.scrollTo({top:0,behavior:'smooth'}); };  
      wrap.appendChild(b);  
    });  
  
    const L = I18N[lang]||I18N.en;  
    $('hintsNote').textContent = L.hintsNote;  
  
    const hc=$('hintsCard');  
    if(forceOpen){ hc.classList.remove('collapsed'); }  
  }

  /* ===== SURPRISE (no modale, riempie campo) ===== */  
  function generateOneIntoField() {  
    const Lcode=(LS.getItem('lang')||'it').toLowerCase();  
    if (!SUGG.personalized.length && !SUGG.generic.length && !SUGG.absurd.length) {  
      rebuildSuggestionPools();  
    }  
    const MIX_WEIGHTS = { personalized:60, generic:30, absurd:10 };  
    function weightedPick(weights){  
      const r=Math.random()*100; let acc=0;  
      for(const [k,v] of Object.entries(weights)){ acc+=v; if(r<acc) return k; }  
      return 'generic';  
    }  
    function sample(arr){ return arr[Math.floor(Math.random()*arr.length)]; }  
  
    let bucket = weightedPick(MIX_WEIGHTS);  
    if(!SUGG[bucket]?.length){  
      bucket = ['personalized','generic','absurd'].find(k=>SUGG[k]?.length) || 'generic';  
    }  
  
    let text = SUGG[bucket]?.length ? sample(SUGG[bucket]) : null;  
  
    if(!text){  
      text = polishQuestion(  
        (Lcode==='it'?'E se cambiassi lavoro quest’anno?':  
         Lcode==='es'?'¿Y si cambias de trabajo este año?':  
         Lcode==='fr'?'Et si tu changeais de travail cette année ?':  
         Lcode==='de'?'Was, wenn du dieses Jahr den Job wechselst?':  
         'What if you changed jobs this year?'), Lcode);  
    }  
  
    const qInput = $('qInput');  
    qInput.value = text;  
    if(bucket==='absurd'){ prefs.stile='wtf'; writeJSON('whatif_prefs',prefs); renderBadges(); }  
  
    qInput.animate(  
      [{outline:'2px solid transparent'},{outline:'2px solid var(--accent2)'},{outline:'2px solid transparent'}],  
      {duration:900}  
    );  
    window.scrollTo({top:0,behavior:'smooth'});  
  }  
  $('surpriseBtn').onclick = generateOneIntoField;  
  
  /* ===== SUBMIT ===== */  
  function trySubmit(){  
    const domanda=( $('qInput').value || '' ).trim();  
    if(!domanda){ $('qInput').focus(); return; }  
    const c=readJSON('whatif_credits',{date:todayISO(),used:0});  
    if(!userIsAdmin()){  
      const cap=capForUser();  
      if((c.used||0)>=cap){  
        alert(lang==='it'?'Hai finito i crediti di oggi.':lang==='es'?'Has usado los créditos de hoy.':lang==='fr'?'Crédits du jour épuisés.':lang==='de'?'Tagescredits verbraucht.':'You’ve used today’s credits.');  
        return;  
      }  
      c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();  
    }  
    const domandaClean = polishQuestion(domanda, lang);  
    $('qInput').value = domandaClean;  
    LS.setItem('domanda',domandaClean);  
    const req={ domanda:domandaClean, stile:prefs.stile, lang, extra:'', micro:{}, fantasy_mode:false, periodo:prefs.periodo, boost:getBoost() };  
    writeJSON('whatif_request',req);  
    // Qui puoi agganciare la tua AI (già collegata) a partire da 'whatif_request'  
  }  
  $('goBtn').onclick=trySubmit;  
  $('clearBtn').onclick=()=>{ $('qInput').value=''; $('qInput').focus(); };  
  $('qInput').addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); trySubmit(); } });  
  
  /* ===== INIT ===== */  
  try{  
    try{ const p = JSON.parse(LS.getItem('whatif_prefs')||'{}'); document.documentElement.setAttribute('data-theme', p.stile==='wtf'?'wtf':'whatif'); }catch{}  
    applyTexts();  
    rebuildSuggestionPools();  
    renderHints(false);  
    renderNext(); renderStories();  
    $('boostInput').value=getBoost();  
  }catch(e){ console.error('Init error:', e); }  
  
})();  
</script>  </body>  
</html>
