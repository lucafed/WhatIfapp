<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Domanda</title>
  <meta name="theme-color" content="#0B0B0C"/>
  <style>
    :root{
      --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
      --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
      --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
      --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
    }
    html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100%;
    }

    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

    .btn{
      appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
      padding:10px 14px;border-radius:12px;cursor:pointer
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;
      box-shadow:0 6px 18px var(--shadow)
    }
    .btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}

    .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}

    .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}

    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:10px 12px;
      font-size:14px;cursor:pointer;white-space:nowrap
    }
    .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

    /* Centro domanda */
    .center-ask{
      display:grid;place-items:center;min-height:38vh;
      text-align:center;padding:6px 0;
    }
    .ask-box{
      width:min(760px, 90vw);
      display:grid;gap:10px;
    }
    .label{color:var(--acc);font-weight:800;margin:0 0 4px}
    textarea{
      width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);
      border-radius:12px;padding:14px;font-size:18px;min-height:110px;resize:vertical
    }
    h1{
      font-size:clamp(22px,4.5vw,30px);
      margin:6px 0 0;
      color:var(--acc2);
      text-align:center
    }
    .hint{font-size:13px;color:#cfe7ff;text-align:center;margin-top:6px}
    .muted{font-size:12px;color:var(--muted);text-align:center}

    /* griglia scelte in alto */
    .choices{
      display:grid;gap:10px;
      grid-template-columns:1fr;
    }
    @media(min-width:740px){
      .choices{grid-template-columns:1fr 1fr 1fr}
    }

    .cluster{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px}
    .cluster .title{font-weight:800;color:#E7F2EE;margin-bottom:8px}

    /* CTA bottom */
    .cta-row{display:flex;gap:10px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Topbar -->
    <div class="topbar">
      <div class="row">
        <button class="btn" id="backBtn">←</button>
        <button class="btn" id="homeBtn">🏠</button>
      </div>
      <div class="row">
        <span class="badge" id="periodoBadge">🕰️ —</span>
        <span class="badge" id="styleBadge">🎭 —</span>
        <span class="badge" id="variantBadge">🧩 —</span>
        <span class="badge" id="creditsBadge">—</span>
        <button class="btn" id="langBtn">IT</button>
      </div>
    </div>

    <!-- Scelte in alto -->
    <div class="choices">
      <div class="cluster" id="periodoBox">
        <div class="title" id="periodoTitle">Periodo</div>
        <div class="chips" id="periodChips">
          <button class="chip" data-val="past" id="chipPast">Passato</button>
          <button class="chip" data-val="future" id="chipFuture">Futuro</button>
        </div>
      </div>

      <div class="cluster" id="stileBox">
        <div class="title" id="stileTitle">Stile</div>
        <div class="chips" id="styleChips">
          <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
          <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
        </div>
      </div>

      <div class="cluster" id="variantBox">
        <div class="title" id="variantTitle">Variante (What if)</div>
        <div class="chips" id="variantChips">
          <button class="chip" data-variant="analitico" id="chipAnalitico">Analitico</button>
          <button class="chip" data-variant="poetico"   id="chipPoetico">Poetico</button>
        </div>
      </div>
    </div>

    <!-- Domanda al centro -->
    <div class="center-ask">
      <div class="ask-box">
        <h1 id="pageH1">Imposta la tua domanda</h1>
        <label for="qInput" class="label" id="qLabel">La tua domanda</label>
        <textarea id="qInput" placeholder="E se tornassi a vivere all’Aquila?" spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>
        <div class="muted" id="tipNote">Tip: puoi cambiare periodo, stile e variante sopra; i colori seguono il tono.</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-row">
      <button class="btn ghost" id="clearBtn">Svuota</button>
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
    </div>

    <div class="hint" id="styleHint"></div>
  </div>

  <script>
    // ===== I18N =====
    const I18N = {
      it:{
        periodo:"Periodo", passato:"Passato", futuro:"Futuro",
        stile:"Stile", whatif:"What if", wtf:"What the F",
        variante:"Variante (What if)", analitico:"Analitico", poetico:"Poetico",
        title:"Imposta la tua domanda", q:"La tua domanda", tip:"Tip: puoi cambiare periodo, stile e variante sopra; i colori seguono il tono.",
        hintWhatif:"What if: tono caldo/realistico (analitico o poetico), un paragrafo e chiusura riflessiva.",
        hintWTF:"What the F: sarcasmo da bar, alcol e oggetti che reagiscono, UNA imprecazione narrata, chiusura calda.",
        credits:(l,d)=>`Crediti: ${l}/${d}`
      },
      en:{
        periodo:"Period", passato:"Past", futuro:"Future",
        stile:"Style", whatif:"What if", wtf:"What the F",
        variante:"Variant (What if)", analitico:"Analytical", poetico:"Poetic",
        title:"Set your question", q:"Your question", tip:"Tip: tweak period, style and variant above; colors follow tone.",
        hintWhatif:"What if: warm/realistic (analytical or poetic), one paragraph and reflective close.",
        hintWTF:"What the F: bar sarcasm, booze & reacting objects, ONE narrated expletive, warm close.",
        credits:(l,d)=>`Credits: ${l}/${d}`
      }
    };

    // ===== Helpers =====
    const LS = localStorage;
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const detectLang = ()=> (LS.getItem('lang') || (navigator.language||'it')).toLowerCase().startsWith('en') ? 'en' : 'it';
    const lang = detectLang(); document.documentElement.lang = lang;
    const T = I18N[lang];

    function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
    function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
    function today(){ return new Date().toISOString().slice(0,10); }

    let prefs = readJSON('whatif_prefs', { stile:'whatif', periodo:'future', variant:'analitico', pro:false });

    // Theme
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf' ? 'wtf' : 'whatif');

    // UI text
    $('#pageH1').textContent = T.title;
    $('#qLabel').textContent = T.q;
    $('#qInput').placeholder = lang==='en' ? "What if I moved back to L’Aquila?" : "E se tornassi a vivere all’Aquila?";
    $('#tipNote').textContent = T.tip;
    $('#periodoTitle').textContent = T.periodo;
    $('#stileTitle').textContent   = T.stile;
    $('#variantTitle').textContent = T.variante;
    $('#chipPast').textContent     = T.passato;
    $('#chipFuture').textContent   = T.futuro;
    $('#chipWhatIf').textContent   = T.whatif;
    $('#chipWTF').textContent      = T.wtf;
    $('#chipAnalitico').textContent= T.analitico;
    $('#chipPoetico').textContent  = T.poetico;
    $('#langBtn').textContent      = (LS.getItem('lang')||lang).toUpperCase();

    // Credits (solo display locale)
    function cap(){ return readJSON('admin_token',null) ? Infinity : (prefs.pro ? 10 : 3); }
    function ensureCredits(){
      const c=readJSON('whatif_credits',{date:today(),used:0});
      if(c.date!==today()){ c.date=today(); c.used=0; }
      writeJSON('whatif_credits',c);
    }
    function left(){ const c=readJSON('whatif_credits',{date:today(),used:0}); const k=cap(); return k===Infinity?'∞':Math.max(0,k-(c.used||0)); }
    function renderCredits(){ $('#creditsBadge').textContent = (cap()===Infinity? (lang==='en'?'Credits: ∞':'Crediti: ∞') : T.credits(left(),cap())); }
    ensureCredits(); renderCredits();

    // Badges + selezioni
    function syncBadges(){
      $('#periodoBadge').textContent = '🕰️ ' + (prefs.periodo==='past' ? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
      $('#styleBadge').textContent   = '🎭 ' + (prefs.stile==='wtf' ? 'What the F' : 'What if');
      $('#variantBadge').textContent = '🧩 ' + (prefs.variant==='poetico' ? (lang==='en'?'Poetic':'Poetico') : (lang==='en'?'Analytical':'Analitico'));
    }
    function syncChips(){
      // periodo
      $$('#periodChips .chip').forEach(b=> b.classList.toggle('sel', b.dataset.val===prefs.periodo));
      // stile
      $$('#styleChips .chip').forEach(b=> b.classList.toggle('sel', b.dataset.style===prefs.stile));
      // variant visible only for whatif
      $('#variantBox').style.opacity = (prefs.stile==='whatif')? '1':'0.45';
      $('#variantBox').style.pointerEvents = (prefs.stile==='whatif')? 'auto':'none';
      $$('#variantChips .chip').forEach(b=> b.classList.toggle('sel', b.dataset.variant===prefs.variant));
      // theme
      document.documentElement.setAttribute('data-theme', prefs.stile==='wtf' ? 'wtf' : 'whatif');
      // hint stile
      $('#styleHint').innerHTML = (prefs.stile==='wtf') ? T.hintWTF : T.hintWhatif;
    }
    syncBadges(); syncChips();

    // Nav
    $('#backBtn').onclick = ()=> history.back();
    $('#homeBtn').onclick = ()=> location.href='index.html';
    $('#langBtn').onclick = ()=>{
      const cur = (LS.getItem('lang')||lang).toLowerCase().startsWith('en') ? 'it' : 'en';
      LS.setItem('lang', cur);
      location.reload();
    };

    // Interazioni scelte
    $('#periodChips').addEventListener('click',(e)=>{
      const b=e.target.closest('.chip'); if(!b) return;
      prefs.periodo = b.dataset.val;
      writeJSON('whatif_prefs', prefs); syncBadges(); syncChips();
    });
    $('#styleChips').addEventListener('click',(e)=>{
      const b=e.target.closest('.chip'); if(!b) return;
      prefs.stile = b.dataset.style;
      if(prefs.stile!=='whatif') prefs.variant = 'analitico';
      writeJSON('whatif_prefs', prefs); syncBadges(); syncChips();
    });
    $('#variantChips').addEventListener('click',(e)=>{
      if(prefs.stile!=='whatif') return;
      const b=e.target.closest('.chip'); if(!b) return;
      prefs.variant = b.dataset.variant;
      writeJSON('whatif_prefs', prefs); syncBadges(); syncChips();
    });

    // Domanda
    const qEl = $('#qInput');
    $('#clearBtn').onclick = ()=>{ qEl.value=""; qEl.focus(); };
    function outOfCredits(){
      const c=readJSON('whatif_credits',{date:today(),used:0});
      return (cap()!==Infinity && (c.used||0) >= cap());
    }
    function consumeCredit(){
      if(cap()===Infinity) return;
      const c=readJSON('whatif_credits',{date:today(),used:0});
      c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCredits();
    }

    function submit(){
      const domanda = (qEl.value||"").trim();
      if(!domanda){ qEl.focus(); return; }
      if(outOfCredits()){ alert(lang==='en'?'You’ve used today’s credits.':'Hai finito i crediti di oggi.'); return; }

      const micro = readJSON('micro_profile', {});
      consumeCredit();
      writeJSON('whatif_prefs', prefs);
      LS.setItem('domanda', domanda);
      writeJSON('whatif_request', {
        domanda, stile:prefs.stile, lang:(LS.getItem('lang')||lang),
        extra:"", micro, periodo:prefs.periodo,
        variant: prefs.stile==='whatif' ? prefs.variant : undefined
      });
      location.href = 'fifth.html';
    }

    $('#goBtn').onclick = submit;
    qEl.addEventListener('keydown',(e)=>{
      if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); submit(); }
    });
  </script>
</body>
</html>
