<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{ --bg:#0C0F14; --bg2:#0E1724; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA; --accent:#1C57A0; --accent2:#FFEC01; --ink:#001f26; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}

/* Topbar */
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

/* Cards & chips */
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Input */
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}

/* Collapsible */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge">—</span>
      <span class="badge" id="proBadge">FREE</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- STILE + PERIODO -->
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
          <div class="chips" id="styleChips">
            <button class="chip" data-style="whatif" id="chipWhatIf" type="button">What if</button>
            <button class="chip" data-style="wtf" id="chipWTF" type="button">What the F</button>
          </div>
          <div class="chips" id="periodoChips">
            <button class="chip" data-periodo="future" id="chipFuture" type="button">Futuro</button>
            <button class="chip" data-periodo="past" id="chipPast" type="button">Passato</button>
          </div>
        </div>
      </div>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>
        <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row" style="gap:10px">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button">🎲 Sorprendimi</button>
            <button class="btn" id="saveBtn" type="button">⭐ Salva</button>
          </div>
          <button class="btn" id="clearBtn" type="button">Svuota</button>
        </div>
        <div class="small" id="tipNote" style="margin-top:8px"></div>
        <div class="small" id="flashMsg" style="margin-top:6px"></div>
      </div>

      <!-- SPUNTI -->
      <div class="card center" id="hintsCard">
        <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
          <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
        </div>
        <div class="body" id="hintsBody" style="margin-top:8px">
          <div class="chips" id="hintsChips"></div>
          <div class="small" id="hintsNote" style="margin-top:8px"></div>
        </div>
      </div>

      <!-- SALVATI -->
      <div class="card center" id="savedCard">
        <div class="row toggle" id="savedHeader" style="justify-content:space-between">
          <div class="label" id="nextLabel">▶ Domande salvate</div>
          <button class="btn" id="clearSavedBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
      </div>

      <!-- CRONOLOGIA -->
      <div class="card center" id="histCard">
        <div class="row toggle" id="histHeader" style="justify-content:space-between">
          <div class="label" id="storiesLabel">▶ Cronologia</div>
          <button class="btn" id="clearHistoryBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body"><div id="storyList" class="list"></div></div>
      </div>

      <footer id="footerNote">© What?f — FREE · crediti giornalieri attivi</footer>
    </div>
  </main>

<script>
(function(){
  /* ===== Util ===== */
  const LS=localStorage;
  const SUPPORTED_LANGS=["it","en","es","fr","de"];
  const $=id=>document.getElementById(id);
  function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
  function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
  function today(){return new Date().toISOString().slice(0,10);}
  function nowTs(){return Date.now();}
  function capArray(arr, max){ if(arr.length>max) arr.splice(0, arr.length-max); return arr; } // mantieni ultimi max (FIFO)

  /* ===== Stato ===== */
  let lang=(LS.getItem('lang')||'it').toLowerCase(); if(!SUPPORTED_LANGS.includes(lang)) lang="it";
  document.documentElement.lang=lang;

  /* ===== Guard: profilo necessario ===== */

  /* ===== Grammatica per l'AI ===== */
  function buildGrammar(sex){
    const s=(sex||'').toLowerCase();

    if(s==='m' || s==='uomo')  return { pronome:'lui', articolo:'il', aggettivo_suff:'o', participio_suff:'o' };
    return { pronome:'loro', articolo:'lo/la', aggettivo_suff:'*', participio_suff:'*' };
  }
  const gram = profile?.gram || buildGrammar(profile?.sex);

  /* ===== I18N ===== */
  const I18N={

    fr:{future:["Et si je changeais de travail ?","Et si je m’installais à l’étranger ?","Et si je lançais une petite activité ?","Et si je maîtrisais l’anglais ?","Et si je faisais un master ?","Et si je coupais les réseaux 30 jours ?","Et si je courais 3 fois par semaine ?","Et si j’essayais la semaine de 4 jours ?"],

  };

  function pickHintPool(){
    if(lang==='it') return HINT_IT;
    if(lang==='es') return HINT_ES;
    if(lang==='fr') return HINT_FR;
    if(lang==='de') return HINT_DE;
    return HINT_EN;
  }

  /* ===== DOM refs ===== */
  const backBtn=$('backBtn'), homeBtn=$('homeBtn'), langSelect=$('langSelect');
  const styleChips=$('styleChips'), periodoChips=$('periodoChips');
  const goBtn=$('goBtn'), clearBtn=$('clearBtn'), qInput=$('qInput'), surpriseBtn=$('surpriseBtn'), saveBtn=$('saveBtn');
  const flashMsg=$('flashMsg');

  /* ===== Testi ===== */
  function applyTexts(){
    document.title = (lang==='it' ? 'What?f — Domanda' :
                     (lang==='es' ? 'What?f — Pregunta' :
                     (lang==='fr' ? 'What?f — Question' :
                     (lang==='de' ? 'What?f — Frage' : 'What?f — Question'))));
    $('titleH1').textContent=T('title');
    $('qLabel').textContent=T('yourq');
    goBtn.textContent=T('gen');
    clearBtn.textContent=T('clear');
    surpriseBtn.textContent='🎲 '+T('surprise');
    saveBtn.textContent=T('save');
    $('hintsTitle').textContent=T('hintsTitle'); $('hintsNote').textContent=T('hintsNote');
    $('nextLabel').textContent=T('saved'); $('storiesLabel').textContent=T('stories');
    $('clearSavedBtn').textContent=T('clearSaved'); $('clearHistoryBtn').textContent=T('clearHist');
    $('footerNote').textContent=T('footer');
    $('chipWhatIf').textContent=T('styleWF'); $('chipWTF').textContent=T('styleWTF');
    $('chipFuture').textContent=T('fut'); $('chipPast').textContent=T('past');
    document.documentElement.lang=lang;
    qInput.placeholder = (lang==='it' ? 'E se…'
                        : lang==='es' ? '¿Y si…?'
                        : lang==='fr' ? 'Et si…'
                        : lang==='de' ? 'Was wäre, wenn…'
                        : 'What if…');
    renderBadges();
    renderCreditsBadge();
    renderHints();
    renderTipNote();
    renderSaved();
    renderHistory();
  }

  /* ===== Navigazione ===== */
  homeBtn.onclick=()=>{ location.href='index.html'; };
  backBtn.onclick=()=>{ if(history.length>1) history.back(); else location.href='index.html'; };

  /* ===== Lingua ===== */
  langSelect.value=lang;
  langSelect.onchange=()=>{ lang=langSelect.value; LS.setItem('lang',lang); applyTexts(); };

  /* ===== Crediti ===== */
  function userIsAdmin(){ return !!LS.getItem('admin_token'); }
  function capForUser(){ return userIsAdmin()?Infinity:(prefs.pro?10:3); }
  function ensureCredits(){
    const c=readJSON('whatif_credits',{date:today(),used:0});
    if(c.date!==today()){ c.date=today(); c.used=0; }
    writeJSON('whatif_credits',c);
  }
  function leftCredits(){ const c=readJSON('whatif_credits',{date:today(),used:0}); const cap=capForUser(); return cap===Infinity?'∞':Math.max(0,cap-(c.used||0)); }
  function renderCreditsBadge(){
    const cap=capForUser(), left=leftCredits();
    $('freeBadge').textContent = (cap===Infinity) ? `${T('credits')}: ∞` : `${T('credits')}: ${left}/${cap}`;
    $('proBadge').textContent = prefs.pro ? T('pro') : T('free');
  }
  ensureCredits(); renderCreditsBadge();

  /* ===== Tema / Badges ===== */
  function renderBadges(){
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
    $('styleBadge').textContent = '🎭 ' + (prefs.stile==='wtf'?T('styleWTF'):T('styleWF'));
    $('periodoBadge').textContent = '🕰️ ' + (prefs.periodo==='past'?T('past'):T('fut'));
    document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
    document.querySelectorAll('#periodoChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.periodo===prefs.periodo));
  }
  styleChips.addEventListener('click',(e)=>{
    const b=e.target.closest('.chip'); if(!b) return;
    prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs); renderBadges();
  });
  periodoChips.addEventListener('click',(e)=>{
    const b=e.target.closest('.chip'); if(!b) return;
    prefs.periodo=b.dataset.periodo; writeJSON('whatif_prefs',prefs); renderBadges();
  });

  /* ===== Tip personalizzazione ===== */
  function renderTipNote(){
    if(!profile) return;
    const g = gram?.pronome ? `· pronome: ${gram.pronome}, art.: ${gram.articolo}` : '';
    const who = profile.role ? ` · ruolo: ${profile.role}` : '';
    const city = profile.city ? ` · città: ${profile.city}` : '';
    $('tipNote').textContent = `Personalizzazione attiva — ${profile.name || ''} (${profile.gender || ''})${who}${city} ${g}`.trim();
  }

  /* ===== Sorprendimi ===== */
  function surprise(){
    const L=(LS.getItem('lang')||'it').toLowerCase();
    const periodo=(readJSON('whatif_prefs',{}).periodo==='past')?'past':'future';
    const pools=SURPRISE_POOLS[L] || SURPRISE_POOLS.it;
    const pool=pools[periodo] || pools.future;
    qInput.value = pool[Math.floor(Math.random()*pool.length)];
    qInput.focus();
  }
  $('surpriseBtn').onclick=surprise;

  /* ===== Salvataggi: Domande salvate ===== */
  function saveCurrent(){
    const q=(qInput.value||'').trim(); if(!q) return;
    const arr=readJSON('next_prompts',[]);
    arr.push({q, ts: nowTs()});
    capArray(arr, 50); // tieni ultime 50
    writeJSON('next_prompts',arr);
    flash(T('savedFlash'));
    renderSaved();
  }
  $('saveBtn').onclick=saveCurrent;

  function renderSaved(){
    const box=$('nextList'); box.innerHTML='';
    const arr=readJSON('next_prompts',[]);
    if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T('emptyNext'); box.appendChild(p); return; }
    arr.slice(-12).reverse().forEach(item=>{
      const row=document.createElement('div'); row.className='story';
      const left=document.createElement('div');
      const when=new Date(item.ts).toLocaleString(document.documentElement.lang||'it-IT',{hour12:false});
      left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${when}</div>`;
      const right=document.createElement('div'); right.className='row';
      const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.type='button'; useBtn.textContent=T('use');
      useBtn.onclick=()=>{ qInput.value=item.q||''; window.scrollTo({top:0,behavior:'smooth'}); };
      const play=document.createElement('button'); play.className='play'; play.type='button'; play.textContent='▶';
      play.onclick=()=>{ submitAndGo(item.q||''); };
      right.appendChild(useBtn); right.appendChild(play); row.appendChild(left); row.appendChild(right); box.appendChild(row);
    });
  }
  $('clearSavedBtn').onclick=()=>{ writeJSON('next_prompts',[]); renderSaved(); };

  /* ===== Cronologia ===== */
  function addHistory(domanda){
    const arr=readJSON('cronologia',[]);
    arr.push({ ts: nowTs(), domanda, stile:prefs.stile, lang, periodo:prefs.periodo });
    capArray(arr, 200);
    writeJSON('cronologia',arr);
  }
  function renderHistory(){
    const box=$('storyList'); box.innerHTML='';
    const arr=readJSON('cronologia',[]);
    if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T('emptyStories'); box.appendChild(p); return; }
    arr.slice(-12).reverse().forEach(item=>{
      const row=document.createElement('div'); row.className='story';
      const left=document.createElement('div');
      const when=new Date(item.ts).toLocaleString(document.documentElement.lang||'it-IT',{hour12:false});
      left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${when} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
      const play=document.createElement('button'); play.className='play'; play.type='button'; play.textContent='▶';
      play.onclick=()=>{ writeJSON('whatif_request',{ domanda:item.domanda, stile:item.stile, lang:item.lang, extra:'', micro:readJSON('micro_profile',{}), fantasy_mode:false, periodo:item.periodo, profile, gram }); location.href='fifth.html'; };
      row.appendChild(left); row.appendChild(play); box.appendChild(row);
    });
  }
  $('clearHistoryBtn').onclick=()=>{ writeJSON('cronologia',[]); renderHistory(); };

  /* ===== Invio alla 5ª + logging ===== */
  function submitAndGo(text){
    const domanda=(text || qInput.value || '').trim(); if(!domanda){ qInput.focus(); return; }
    // crediti
    const c=readJSON('whatif_credits',{date:today(),used:0});
    if(!userIsAdmin()){
      const cap=capForUser();
      if((c.used||0)>=cap){ alert(T('outOfCredits')); return; }
      c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();
    }
    // log cronologia
    addHistory(domanda);
    // prepara request
    const req={
      domanda,
      stile:prefs.stile,
      lang,
      extra: profile?.about || '',
      micro: readJSON('micro_profile',{}),
      fantasy_mode:false,
      periodo:prefs.periodo,
      profile,
      gram
    };
    writeJSON('whatif_request',req);
    location.href='fifth.html';
  }
  $('goBtn').onclick=()=>submitAndGo();
  $('clearBtn').onclick=()=>{ qInput.value=''; qInput.focus(); };
  $('qInput').addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); submitAndGo(); } });

  /* ===== Hints ===== */
  function renderHints(){
    const wrap=$('hintsChips'); wrap.innerHTML='';
    const pool = pickHintPool().slice();
    let s=[...today()].reduce((a,c)=>a+c.charCodeAt(0),0);
    function rnd(){ s=(s*9301+49297)%233280; return s/233280; }
    const out=[]; const used=new Set();
    while(out.length<8 && used.size<pool.length){
      const i=Math.floor(rnd()*pool.length);
      if(used.has(i)) continue; used.add(i); out.push(pool[i]);
    }
    out.forEach(txt=>{
      const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=txt;
      b.onclick=()=>{ qInput.value=txt; window.scrollTo({top:0,behavior:'smooth'}); };
      wrap.appendChild(b);
    });
  }

  /* ===== Flash msg ===== */
  function flash(text){ flashMsg.textContent=text; setTimeout(()=>{ flashMsg.textContent=''; }, 1200); }

  /* ===== Init ===== */
  try{ applyTexts(); }catch(e){ console.error('Init error:', e); }
})();
</script>
</body>
</html>
