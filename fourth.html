<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{ --bg:#0C0F14; --bg2:#0E1724; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA; --accent:#1C57A0; --accent2:#FFEC01; --ink:#001f26; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}

/* Topbar */
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

/* Cards & chips */
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Input */
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}

/* Collapsible */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}

/* Micro-domande */
.first-session{display:none;background:#0e1a23;border:1px solid var(--line);color:#daf0f6;border-radius:14px;padding:12px;margin-bottom:8px}
.qblock{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:rgba(255,255,255,.04)}
.qtitle{display:flex;align-items:center;gap:8px;font-weight:800;color:#DDF6FF;margin-bottom:8px}
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Footer */
footer{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge">—</span>
      <span class="badge" id="proBadge">FREE</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- STILE + PERIODO -->
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
          <div class="chips" id="styleChips">
            <button class="chip" data-style="whatif" id="chipWhatIf" type="button">What if</button>
            <button class="chip" data-style="wtf" id="chipWTF" type="button">What the F</button>
          </div>
          <div class="chips" id="periodoChips">
            <button class="chip" data-periodo="future" id="chipFuture" type="button">Futuro</button>
            <button class="chip" data-periodo="past" id="chipPast" type="button">Passato</button>
          </div>
        </div>
      </div>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>
        <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row" style="gap:10px">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button">🎲 Sorprendimi</button>
          </div>
          <div class="row" style="gap:10px">
            <button class="btn" id="saveBtn" type="button">⭐ Salva domanda</button>
            <button class="btn" id="clearBtn" type="button">Svuota</button>
          </div>
        </div>
        <div class="small" id="tipNote" style="margin-top:8px"></div>
      </div>

      <!-- MICRO-DOMANDE -->
      <div class="first-session" id="firstSessionBanner"></div>
      <div class="card center collapsed" id="microCard">
        <div class="row toggle" id="microHead" style="justify-content:space-between">
          <div class="label" id="microTitle">▶ Micro-domande di oggi</div>
          <div class="small" id="microHint">(una volta al giorno)</div>
        </div>
        <div class="body" id="microBody" style="margin-top:10px">
          <div id="qMood" class="qblock">
            <div class="qtitle"><span id="moodIcon">🙂</span><span id="moodTitle">Oggi come ti senti?</span></div>
            <div class="optset" id="moodOpts"></div>
          </div>
          <div id="qAnchor" class="qblock">
            <div class="qtitle"><span id="anchorIcon">🧭</span><span id="anchorTitle">Cosa ti tiene qui ultimamente?</span></div>
            <div class="optset" id="anchorOpts"></div>
          </div>
          <div id="qDecide" class="qblock">
            <div class="qtitle"><span id="decideIcon">⚙️</span><span id="decideTitle">Come decidi di solito?</span></div>
            <div class="optset" id="decideOpts"></div>
          </div>
          <div class="row" style="margin-top:6px">
            <button class="btn primary" id="saveMicroBtn" type="button">💾 Salva micro-profilo</button>
          </div>
          <div class="small" id="microSavedMsg" style="margin-top:6px"></div>
        </div>
      </div>

      <!-- SPUNTI -->
      <div class="card center collapsed" id="hintsCard">
        <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
          <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
        </div>
        <div class="body" id="hintsBody" style="margin-top:8px">
          <div class="chips" id="hintsChips"></div>
          <div class="small" id="hintsNote" style="margin-top:8px"></div>
        </div>
      </div>

      <!-- SALVATI -->
      <div class="card center collapsed" id="savedCard">
        <div class="row toggle" id="savedHeader" style="justify-content:space-between">
          <div class="label" id="nextLabel">▶ Domande salvate</div>
          <button class="btn" id="clearSavedBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
      </div>

      <!-- CRONOLOGIA -->
      <div class="card center collapsed" id="histCard">
        <div class="row toggle" id="histHeader" style="justify-content:space-between">
          <div class="label" id="storiesLabel">▶ Cronologia</div>
          <button class="btn" id="clearHistoryBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body"><div id="storyList" class="list"></div></div>
      </div>

      <footer id="footerNote">© What?f — FREE · crediti giornalieri attivi</footer>
    </div>
  </main>

  /* ===== Crediti ===== */
  function userIsAdmin(){ return !!LS.getItem('admin_token'); }
  function capForUser(){ return userIsAdmin()?Infinity:(prefs.pro?10:3); }
  function ensureCredits(){
    const c=readJSON('whatif_credits',{date:today(),used:0});
    if(c.date!==today()){ c.date=today(); c.used=0; }
    writeJSON('whatif_credits',c);
  }
  function leftCredits(){ const c=readJSON('whatif_credits',{date:today(),used:0}); const cap=capForUser(); return cap===Infinity?'∞':Math.max(0,cap-(c.used||0)); }
  function renderCreditsBadge(){
    const cap=capForUser(), left=leftCredits();
    $('freeBadge').textContent = (cap===Infinity) ? `${T('credits')}: ∞` : `${T('credits')}: ${left}/${cap}`;
    $('proBadge').textContent = prefs.pro ? T('pro') : T('free');

  /* ===== Submit to fifth ===== */
  function trySubmit(){
    try{
      const domanda=(qInput.value||'').trim(); if(!domanda){ qInput.focus(); return; }
      const c=readJSON('whatif_credits',{date:today(),used:0});
      if(!userIsAdmin()){
        const cap=capForUser();
        if((c.used||0)>=cap){ alert(T('outOfCredits')); return; }
        c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();
      }
      const micro=readJSON('micro_profile',{});
      LS.setItem('domanda',domanda);
      const req={ domanda, stile:prefs.stile, lang, extra:'', micro, fantasy_mode:false, periodo:prefs.periodo };
      writeJSON('whatif_request',req);
      // aggiorna cronologia
      const hist=readJSON('cronologia',[]);
      hist.push({ts:Date.now(),domanda,stile:prefs.stile});
      writeJSON('cronologia',hist.slice(-200));
      location.href='fifth.html';
    }catch(e){
      console.error('Submit error:', e);
      alert('Error: cannot proceed. Check console.');
    }
  }
  goBtn.onclick=trySubmit;

  saveBtn.onclick=()=>{

  // Daily rotation memory for Surprise “seen”
  function seenKey(){ return `prompt_seen_${lang}_${prefs.periodo}`; }
  function getSeen(){ return readJSON(seenKey(),[]); }
  function pushSeen(txt){
    const s=new Set(getSeen()); s.add(txt);
    // reset next day
    const kday=`${seenKey()}_day`;
    const day=LS.getItem(kday); if(day!==today()){ LS.setItem(kday,today()); writeJSON(seenKey(),[]); return; }
    writeJSON(seenKey(),[...s].slice(-200));
  }

  function pickWithWeights(){
    const r=Math.random();
    let pool=[];
    if(r<0.60) pool = personalizedPool();
    else if(r<0.90) pool = (NEUTRAL_POOLS[lang]||NEUTRAL_POOLS.it)[prefs.periodo==='past'?'past':'future'];
    else pool = absurdPool();

    // filter already seen today
    const seen=new Set(getSeen());
    const fresh = pool.filter(p=>!seen.has(p));
    const pick = (fresh.length?randomFrom(fresh):randomFrom(pool));
    pushSeen(pick);
    return pick;
  }

  function renderOptions(containerId, options, key){

      const b=document.createElement('button');
      b.className='opt'; b.type='button'; b.textContent=text;
      if(saved[key]===text) b.classList.add('sel');
      b.onclick=()=>{
        wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        const cur=readJSON('micro_profile',{}); cur[key]=text; writeJSON('micro_profile',cur);
      };
      wrap.appendChild(b);

  function renderMicroTexts(){
    $('moodTitle').textContent=(lang==='it'?'Oggi come ti senti?':lang==='es'?'¿Cómo te sientes hoy?':lang==='fr'?'Comment te sens-tu aujourd’hui ?':lang==='de'?'Wie fühlst du dich heute?':'How do you feel today?');
    $('anchorTitle').textContent=(lang==='it'?'Cosa ti tiene qui ultimamente?':lang==='es'?'¿Qué te mantiene aquí últimamente?':lang==='fr'?'Qu’est-ce qui te retient ici en ce moment ?':lang==='de'?'Was hält dich derzeit hier?':"What’s keeping you here lately?");
    $('decideTitle').textContent=(lang==='it'?'Come decidi di solito?':lang==='es'?'¿Cómo sueles decidir?':lang==='fr'?'Comment décides-tu d’habitude ?':lang==='de'?'Wie triffst du üblicherweise Entscheidungen?':"How do you usually decide?");
    // pools (rotate daily with seed)
    let s=[...today()].reduce((a,c)=>a+c.charCodeAt(0),0);
    function rnd(){ s=(s*9301+49297)%233280; return s/233280; }
    function pickN(pool,n){ const out=[], used=new Set(); while(out.length<n && used.size<pool.length){ const i=Math.floor(rnd()*pool.length); if(used.has(i)) continue; used.add(i); out.push(pool[i]); } return out; }

    const moodPool=(lang==='en'?["Calm, airplane mode","Energised","A bit foggy","Restless astronaut","Light & chatty","Solid & quiet","Playful chaos"]
                             :lang==='es'?["Tranquilo","Con energía","Nublado pero bien","Astronauta inquieto","Ligero y hablador","Sólido y callado","Caos divertido"]
                             :lang==='fr'?["Calme mode avion","Chargé d’énergie","Brumeux mais ok","Astronaute agité","Léger et bavard","Solide et discret","Un peu chaotique"]
                             :lang==='de'?["Ruhig wie Flugmodus","Voller Energie","Neblig aber ok","Unruhiger Astronaut","Leicht & gesprächig","Stabil & ruhig","Etwas chaotisch"]
                             :["Calmo","Carico","Appannato ma ok","Astronauta irrequieto","Leggero e chiacchierone","Solido e in silenzio","Un po’ caotico"]);

                              :lang==='es'?["Tu gente","Dinero y facturas","Rutina que funciona","Promesa contigo","Miedo a cambiar","Curiosidad","Salud primero","Construir a largo plazo"]
                              :lang==='fr'?["Les tiens","Argent & factures","Routine qui marche","Promesse à toi-même","Peur du changement","Curiosité","La santé d’abord","Construire le long terme"]
                              :lang==='de'?["Menschen die du liebst","Geld & Rechnungen","Routine die funktioniert","Versprechen an dich","Angst vor Veränderung","Neugier","Gesundheit zuerst","Langfristig aufbauen"]
                              :["Le persone che ami","Soldi & bollette","Routine che funziona","Promessa a te stesso/a","Paura di cambiare","Curiosità","Salute prima","Costruire lungo termine"]);
    const decidePool=(lang==='en'?["Gut first","Pros/cons list","Ask a friend","Deadline decides","Flip a coin","Coffee + walk","Sleep on it"]
                              :lang==='es'?["Instinto","Pros/Contras","Pedir consejo","Decide la fecha límite","Cara o cruz","Café + paseo","Dormirlo"]
                              :lang==='fr'?["À l’instinct","Liste pour/contre","Demander un avis","La deadline tranche","Pile ou face","Café + marche","Laisser une nuit"]
                              :lang==='de'?["Bauchgefühl","Pro/Contra-Liste","Freund fragen","Deadline entscheidet","Münzwurf","Kaffee + Spaziergang","Drüber schlafen"]
                              :["Pancia","Lista pro/contro","Chiedi a un amico","Decide la scadenza","Tira la moneta","Caffè + passeggiata","Ci dormi su"]);

    renderOptions('moodOpts', pickN(moodPool,7), 'mood');

  /* ===== Hints ===== */
  function renderHints(){
    const wrap=$('hintsChips'); wrap.innerHTML='';
    const pool = pickHintPool().slice();
    let s=[...today()].reduce((a,c)=>a+c.charCodeAt(0),0);
    function rnd(){ s=(s*9301+49297)%233280; return s/233280; }
    const out=[]; const used=new Set();
    while(out.length<8 && used.size<pool.length){
      const i=Math.floor(rnd()*pool.length);
      if(used.has(i)) continue; used.add(i); out.push(pool[i]);
    }
    out.forEach(txt=>{
      const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=txt;
      b.onclick=()=>{ qInput.value=txt; window.scrollTo({top:0,behavior:'smooth'}); };
      wrap.appendChild(b);
    });
  }

  $('histHeader').onclick=()=>{ $('histCard').classList.toggle('collapsed'); };
  $('clearSavedBtn').onclick=()=>{ if(confirm('Svuotare le domande salvate?')){ writeJSON('next_prompts',[]); renderNext(); } };
  $('clearHistoryBtn').onclick=()=>{ if(confirm('Svuotare la cronologia?')){ writeJSON('cronologia',[]); renderStories(); } };

  /* ===== Init ===== */
  try{
    applyTexts();
  }catch(e){ console.error('Init error:', e); }
})();
</script>
</body>
