<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f — Risultato</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body class="page result-page" data-prev="third.html">
  <main class="result-wrap">
    <header>
      <h1>Scenario · <span id="badge"></span></h1>
    </header>

    <article id="result" class="card prose">
      <p>Sto preparando il tuo scenario…</p>
    </article>

    <div class="actions">
      <button class="btn" id="likeBtn">❤️ Mi piace <span id="likes">0</span></button>
      <button class="btn cta" id="shareBtn">Condividi</button>
      <a class="btn" href="index.html">Torna all’inizio</a>
    </div>

    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot active"></span></div>
  </main>

  <script>
    // leggi parametri
    const q = new URLSearchParams(location.search);
    const tempo = q.get("tempo") || "passato";
    const scenario = q.get("scenario") || "sliding";
    const eta = q.get("eta")||"";
    const genere = q.get("genere")||"";
    const luogo = q.get("luogo")||"";
    const lavoro = q.get("lavoro")||"";
    const interessi = (q.get("interessi")||"").split(",").map(s=>s.trim()).filter(Boolean);
    const prompt = q.get("prompt")||"";

    // badge
    const badge = document.getElementById("badge");
    badge.textContent = scenario==="sliding" ? "Sliding Doors" : "What the F?!";

    // mock generazione testo (10+ righe)
    const lines=[];
    lines.push(`Partendo da ${luogo || "dove sei"} e considerando ${eta?("la tua età di "+eta):"il tuo profilo"}, costruiamo uno scenario in chiave ${scenario==="sliding"?"realistica":"ironica"}.`);
    if(lavoro) lines.push(`Nel lavoro/studio (“${lavoro}”), le scelte pesano: piccole deviazioni generano traiettorie nuove.`);
    if(interessi.length) lines.push(`I tuoi interessi (${interessi.join(", ")}) colorano le opzioni sul tavolo.`);
    if(prompt) lines.push(`Domanda guida: “${prompt}”.`);
    lines.push(tempo==="passato"
      ? "Guardiamo indietro: se avessi scelto diversamente, oggi avresti relazioni e routine mutate nei dettagli — ma riconoscibili."
      : "Proiettiamoci avanti: la mappa che segue è probabilistica, non deterministica; serve per orientarti, non per vincolarti.");
    lines.push("Scenario:");
    for(let i=0;i<6;i++){
      lines.push(`• Step ${i+1}: un evento plausibile (contatto, opportunità, micro-successo) sblocca il passo successivo.`);
    }
    lines.push(scenario==="sliding"
      ? "Probabilità complessiva: 62% (stima qualitativa, coerente con il tuo profilo)."
      : "Possibilità fuori scala: 137% 😉 (prendila con ironia, ma resta coerente con chi sei).");
    lines.push("Conclusione: scegli la prossima azione piccola che puoi fare entro 24 ore. È così che le porte si aprono.");

    document.getElementById("result").innerHTML = `<p>${lines.join("</p><p>")}</p>`;

    // Like (locale)
    const likeKey="wf_likes_total";
    const likesEl=document.getElementById("likes");
    likesEl.textContent = Number(localStorage.getItem(likeKey)||0);
    document.getElementById("likeBtn").onclick = ()=>{
      const n=Number(localStorage.getItem(likeKey)||0)+1;
      localStorage.setItem(likeKey,n);
      likesEl.textContent=n;
    };

    // Share
    document.getElementById("shareBtn").onclick = async ()=>{
      const title="Il mio What?f";
      const text=`${badge.textContent} · ${tempo} · ${luogo || "ovunque"}`;
      const url=location.href;
      if(navigator.share){
        try{ await navigator.share({title,text,url}); }catch(e){}
      }else{
        prompt("Copia questo link:", url);
      }
    };

    // swipe indietro
    (function(){let sx=null,sy=null,p=document.body.dataset.prev,t=60;
      function st(e){const a=e.touches?e.touches[0]:e;sx=a.clientX;sy=a.clientY}
      function mv(e){if(sx===null)return;const a=e.touches?e.touches[0]:e,dx=a.clientX-sx,dy=a.clientY-sy;
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>t){ if(dx>0&&p)location.href=p; sx=sy=null;}}
      function en(){sx=sy=null}
      addEventListener("touchstart",st,{passive:true});addEventListener("touchmove",mv,{passive:true});addEventListener("touchend",en);
      addEventListener("mousedown",st);addEventListener("mousemove",mv);addEventListener("mouseup",en);
    })();
  </script>
</body>
</html>
