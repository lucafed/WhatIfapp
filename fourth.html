<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — La tua domanda</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC; --chip:#17212a;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px}

    /* top bar */
    .top{display:flex;align-items:center;gap:12px}
    .back{appearance:none;border:none;background:#0f1820;color:var(--fg);
      padding:10px 14px;border-radius:14px;cursor:pointer}
    .crumb{color:var(--muted);font-size:14px}

    h1{margin:0;font-size:clamp(26px,6vw,40px);}

    .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
    .ta{width:100%;min-height:180px;background:#0f1820;border:1px solid #1d2b34;
      color:var(--fg);padding:16px;border-radius:14px;resize:vertical;font-size:16px}
    .hint{color:var(--muted);font-size:14px;margin-top:10px}
    .cta{display:inline-block;margin-top:16px;background:linear-gradient(180deg,var(--accent),var(--accent-dark));
      color:#002329;font-weight:900;border:none;border-radius:24px;padding:14px 22px;min-width:220px;
      box-shadow:0 0 14px rgba(0,181,204,.5),0 0 30px rgba(0,181,204,.25);
      cursor:pointer}
    .cta:disabled{background:#29404a;color:#7fa1aa;box-shadow:none;cursor:not-allowed}

    /* language fab */
    .lang-fab{position:fixed;top:14px;right:14px;z-index:20}
    .lang-btn{appearance:none;border:none;background:#0f1820;color:var(--fg);
      padding:10px 12px;border-radius:999px;cursor:pointer;border:1px solid #1d2b34}
    .lang-menu{position:absolute;top:46px;right:0;background:#101922;border:1px solid #1d2b34;border-radius:12px;
      padding:8px;display:none;min-width:160px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
    .lang-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--fg);
      padding:10px;border-radius:10px;cursor:pointer}
    .lang-menu button.active{background:#14222b}
  </style>
</head>
<body>
  <!-- Language selector -->
  <div class="lang-fab" id="langFab">
    <button class="lang-btn" id="langToggle" aria-haspopup="true" aria-expanded="false">🌐</button>
    <div class="lang-menu" id="langMenu" role="menu" aria-label="language">
      <button data-lang="it">Italiano</button>
      <button data-lang="en">English</button>
    </div>
  </div>

  <main>
    <div class="top">
      <button class="back" id="backBtn" data-i18n="back">Indietro</button>
      <span class="crumb" id="crumb"></span>
    </div>

    <h1 data-i18n="title">La tua domanda</h1>

    <div class="card">
      <label class="label" for="q" data-i18n="label">Scrivi la tua domanda What?f…</label>
      <textarea id="q" class="ta" placeholder="Esempio: Se avessi accettato quel lavoro a Milano?"></textarea>
      <div class="hint" data-i18n="hint">
        Suggerimento: sii specifico. Es. “Se restassi a L’Aquila i prossimi 2 anni, cosa cambierebbe nella mia carriera?”
      </div>
      <button id="go" class="cta" data-i18n="discover">Scopri</button>
    </div>
  </main>

  <script>
    /* ---------- i18n tiny runtime ---------- */
    const dict = {
      it: {
        back:"Indietro",
        title:"La tua domanda",
        label:"Scrivi la tua domanda What?f…",
        hint:'Suggerimento: sii specifico. Es. “Se restassi a L’Aquila i prossimi 2 anni, cosa cambierebbe nella mia carriera?”',
        discover:"Scopri"
      },
      en: {
        back:"Back",
        title:"Your question",
        label:"Write your What?f question…",
        hint:'Tip: be specific. E.g. “If I stayed in L’Aquila for the next 2 years, how would my career change?”',
        discover:"Discover"
      }
    };
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    function tApply(lang){
      const pack = dict[lang] || dict.it;
      $$("[data-i18n]").forEach(el=>{
        const k = el.getAttribute("data-i18n");
        if(pack[k]) el.textContent = pack[k];
      });
      document.documentElement.lang = lang;
    }
    function getLang(){ return localStorage.getItem("lang") || "it"; }
    function setLang(l){ localStorage.setItem("lang", l); tApply(l); markMenu(l); }

    /* ---------- language UI ---------- */
    const fab = $("#langFab");
    const btn = $("#langToggle");
    const menu = $("#langMenu");
    function markMenu(lang){
      menu.querySelectorAll("button").forEach(b=>{
        b.classList.toggle("active", b.dataset.lang===lang);
      });
    }
    btn.addEventListener("click", ()=>{
      const open = menu.style.display==="block";
      menu.style.display = open ? "none" : "block";
      btn.setAttribute("aria-expanded", String(!open));
    });
    menu.addEventListener("click", (e)=>{
      const b = e.target.closest("button[data-lang]"); if(!b) return;
      setLang(b.dataset.lang);
      menu.style.display="none";
      btn.setAttribute("aria-expanded","false");
    });
    document.addEventListener("click",(e)=>{
      if(!fab.contains(e.target)) { menu.style.display="none"; btn.setAttribute("aria-expanded","false"); }
    });

    // init language
    tApply(getLang()); markMenu(getLang());

    /* ---------- crumb (riassunto scelte della home) ---------- */
    (function(){
      const s = JSON.parse(localStorage.getItem("whatif_prefs")||"{}");
      const period = getLang()==="en"
        ? (s.periodo==="past"?"Past": s.periodo==="future"?"Future": "")
        : (s.periodo==="past"?"Passato": s.periodo==="future"?"Futuro": "");
      const style = getLang()==="en"
        ? (s.stile==="whatif"?"What if (plausible)": s.stile==="wtf"?"What the F (ironic)": "")
        : (s.stile==="whatif"?"What if (plausibile)": s.stile==="wtf"?"What the F (ironico)": "");
      $("#crumb").textContent = [period, style].filter(Boolean).join(" • ");
    })();

    /* ---------- navigazione ---------- */
    $("#backBtn").addEventListener("click", ()=> history.back());

    // Abilita/validazione e salva domanda -> vai ai risultati
    const go = $("#go"), q = $("#q");
    go.addEventListener("click", ()=>{
      const v = (q.value||"").trim();
      if(!v){
        q.focus();
        q.placeholder = getLang()==="en"
          ? "Please write your question here…"
          : "Scrivi qui la tua domanda…";
        return;
      }
      localStorage.setItem("whatif_question", v);
      location.href = "fifth.html";
    });

    // Se c'è una bozza salvata, ricaricala
    const draft = localStorage.getItem("whatif_question_draft");
    if(draft) q.value = draft;
    q.addEventListener("input", ()=> localStorage.setItem("whatif_question_draft", q.value));
  </script>
</body>
</html>
