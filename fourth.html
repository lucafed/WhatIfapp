<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — La tua domanda</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px}

    /* top bar */
    .top{display:flex;align-items:center;justify-content:space-between}
    .back{display:inline-flex;gap:10px;align-items:center;background:#0f1820;border:1px solid #1e2a34;
      color:var(--fg); padding:10px 14px;border-radius:14px;text-decoration:none}
    .crumb{color:var(--muted);font-size:14px;margin:8px 0 0}

    /* language switch */
    .lang{display:inline-flex;gap:8px;background:#0f1820;border:1px solid #1e2a34;
      padding:6px;border-radius:999px}
    .lang button{background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:999px;
      font-weight:700;cursor:pointer}
    .lang button.active{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329}

    h1{font-size:clamp(28px,7vw,40px);margin:8px 0}

    .card{background:var(--card);border-radius:18px;padding:16px;border:1px solid #1c2832}
    textarea{width:100%;min-height:150px;background:#0f1820;border:1px solid #21323c;color:var(--fg);
      border-radius:14px;padding:16px;font-size:16px;resize:vertical;outline:none}
    .hint{color:var(--muted);font-size:14px;margin:10px 2px 0}

    .cta{margin-top:16px;display:inline-block;background:linear-gradient(180deg,var(--accent),var(--accent-dark));
      color:#002329;font-weight:900;border:none;border-radius:24px;padding:14px 22px;min-width:220px;
      box-shadow:0 0 14px rgba(0,181,204,.5),0 0 30px rgba(0,181,204,.25);cursor:pointer}
    .cta:disabled{background:#29404a;color:#7fa1aa;box-shadow:none;cursor:not-allowed}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <a href="second.html" class="back" aria-label="Indietro">
        ← <span data-i18n="back">Indietro</span>
      </a>

      <!-- Language selector -->
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="it">Italiano</button>
        <button type="button" class="lang-btn" data-lang="en">English</button>
      </div>
    </div>

    <!-- breadcrumb periodo • stile -->
    <div class="crumb" id="crumb"></div>

    <h1 data-i18n="ask_title">La tua domanda</h1>

    <form id="askForm" class="card" autocomplete="off">
      <label for="q" style="display:block;margin:0 0 8px" data-i18n="ask_label">
        Scrivi la tua domanda What?f…
      </label>
      <textarea id="q" name="q" placeholder="" required></textarea>

      <div class="hint" data-i18n="ask_hint">
        Suggerimento: sii specifico. Es.: “Se restassi a L’Aquila i prossimi 2 anni, cosa cambierebbe nella mia carriera?”
      </div>

      <button id="go" class="cta" type="submit" data-i18n="discover">Scopri</button>
    </form>
  </main>

  <!-- i18n dictionary -->
  <script src="/i18n.js"></script>
  <script>
    // --- helpers ---
    const $ = s => document.querySelector(s);
    const langKey = 'lang';
    const prefsKey = 'whatif_prefs';   // { periodo:'past|future', stile:'whatif|wtf' }
    const QKEY = 'whatif_question';

    // Apply i18n to elements with [data-i18n]
    function applyI18n(){
      const lang = localStorage.getItem(langKey) || 'it';
      document.documentElement.lang = lang;
      const dict = (window.I18N && window.I18N[lang]) || {};
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k = el.getAttribute('data-i18n');
        if(dict[k]) el.textContent = dict[k];
      });
      // placeholder for textarea
      const ph = dict['ask_placeholder'] ||
        'Esempio: Se avessi accettato quel lavoro a Milano?';
      $('#q').placeholder = ph;
      // activate language pill UI
      document.querySelectorAll('.lang-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      // breadcrumb translation
      renderCrumb();
    }

    function t(key){
      const lang = localStorage.getItem(langKey) || 'it';
      const dict = (window.I18N && window.I18N[lang]) || {};
      return dict[key] || key;
    }

    // Render breadcrumb: "Futuro • What if (plausibile)" ecc.
    function renderCrumb(){
      const prefs = JSON.parse(localStorage.getItem(prefsKey) || '{}');
      const p = prefs.periodo === 'past' ? t('past') :
                prefs.periodo === 'future' ? t('future') : '';
      const s = prefs.stile === 'whatif' ? t('whatif_with_hint') :
                prefs.stile === 'wtf'    ? t('wtf_with_hint') : '';
      $('#crumb').textContent = [p, s].filter(Boolean).join(' • ');
    }

    // Lang switching
    document.querySelectorAll('.lang-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const chosen = btn.dataset.lang;
        localStorage.setItem(langKey, chosen);
        applyI18n();
      });
    });

    // Submit: save question and go to result page
    $('#askForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const q = $('#q').value.trim();
      if(!q) return;
      localStorage.setItem(QKEY, q);
      // opzionale: azzera risposta precedente
      localStorage.removeItem('whatif_answer');
      location.href = 'fifth.html';
    });

    // init
    (function init(){
      if(!localStorage.getItem(langKey)) localStorage.setItem(langKey,'it');
      applyI18n();
    })();
  </script>
</body>
</html>
