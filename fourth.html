<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none;white-space:nowrap}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

/* Banner micro giornaliero */
#dailyMicroBanner{
  position:sticky; top:0; z-index:10;
  backdrop-filter:blur(10px);
  background:linear-gradient(180deg, rgba(12,20,28,.96), rgba(12,20,28,.85));
  border-bottom:1px solid var(--line);
  display:none;
}
#dailyMicroInner{max-width:980px;margin:0 auto;padding:10px 12px}
#microGrid{display:grid;gap:8px;margin-top:8px}
@media(min-width:720px){ #microGrid{grid-template-columns:1fr 1fr 1fr 1fr} }
.select{width:100%;background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:10px;padding:10px}

/* Misc */
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.small{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:#cfe7ff;margin-top:10px}
.hidden{display:none !important}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <!-- BANNER MICRO GIORNALIERO -->
  <div id="dailyMicroBanner">
    <div id="dailyMicroInner">
      <div class="row" style="justify-content:space-between;align-items:center">
        <strong style="color:var(--acc2)" id="microHdr">Micro-domande di oggi</strong>
        <div class="row">
          <button class="btn" id="microLaterBtn" title="Chiudi senza salvare">Più tardi</button>
          <button class="btn primary" id="microSaveBtn">Salva</button>
        </div>
      </div>
      <div id="microGrid">
        <select id="microMood"   class="select"></select>
        <select id="microDecide" class="select"></select>
        <select id="microAnchor" class="select"></select>
        <select id="microJung"   class="select"></select>
      </div>
      <div id="microMsg" class="small" style="margin-top:6px"></div>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style + Tono Whatif -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (demenziale)</button>
      </div>
      <div class="row">
        <span class="badge" id="proBadge">—</span>
      </div>
    </div>

    <!-- TONE CHIPS (solo se stile whatif) -->
    <div class="row" id="toneRow" style="margin-top:8px;display:none">
      <div class="chips" id="toneChips">
        <button class="chip" data-tone="real"   id="chipToneReal">Tono: Reale</button>
        <button class="chip" data-tone="poetic" id="chipTonePoetic">Tono: Poetico</button>
      </div>
    </div>

    <div id="styleHint" class="hint"></div>
  </div>

  <!-- Question -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
    <div class="small" id="tipNote" style="margin-top:8px">Tip: puoi cambiare stile, periodo e tono.</div>
  </div>

  <!-- Spunti rapidi -->
  <div class="card center collapsed" id="hintsCard">
    <div class="row" id="hintsHeader" style="justify-content:space-between;cursor:pointer">
      <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
    </div>
    <div class="body" id="hintsBody" style="margin-top:8px">
      <div class="chips" id="hintsChips"></div>
      <div class="small" id="hintsNote" style="margin-top:8px"></div>
    </div>
  </div>

</main>

<script>
// ===== I18N =====
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    periodPast:"Passato", periodFuture:"Futuro",
    whatif:"What if (realistico)", wtf:"What the F (demenziale)",
    toneReal:"Tono: Reale", tonePoetic:"Tono: Poetico",
    hintWhatif:"Stile <b>What if</b>: realistico o poetico, immagini quotidiane, chiusura riflessiva breve.",
    hintWTF:"Stile <b>What the F</b>: sarcasmo alto, oggetti che reagiscono, un’esplosione comica al centro.",
    yourq:"La tua domanda", gen:"✨ Genera risposta", clear:"Svuota",
    tip:"Tip: puoi cambiare stile, periodo e tono.",
    // Banner micro
    microHdr:"Micro-domande di oggi", microLater:"Più tardi", microSave:"Salva", microSaved:"Micro-profilo salvato per oggi.",
    qMood:"Oggi come ti senti?", qAnchor:"Cosa ti tiene qui ultimamente?", qDecide:"Come decidi di solito?", qJung:"Stile psicologico (Jung)",
    outOfCredits:"Hai finito i crediti di oggi."
  },
  en:{
    title:"Set your question",
    periodPast:"Past", periodFuture:"Future",
    whatif:"What if (realistic)", wtf:"What the F (goofy)",
    toneReal:"Tone: Real", tonePoetic:"Tone: Poetic",
    hintWhatif:"<b>What if</b>: realistic or poetic, everyday images, short reflective ending.",
    hintWTF:"<b>What the F</b>: dense sarcasm, reacting objects, one comedic blast in the middle.",
    yourq:"Your question", gen:"✨ Generate answer", clear:"Clear",
    tip:"Tip: you can change style, period and tone.",
    microHdr:"Today’s micro-questions", microLater:"Later", microSave:"Save", microSaved:"Micro-profile saved for today.",
    qMood:"How do you feel today?", qAnchor:"What’s keeping you here lately?", qDecide:"How do you usually decide?", qJung:"Psychological style (Jung)",
    outOfCredits:"You’ve used today’s credits."
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

// ===== Helpers & state =====
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayStr(){return new Date().toISOString().slice(0,10);}

let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false, whatif_tone:'real'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

// ===== UI text =====
document.getElementById('titleH1').textContent=T.title;
document.getElementById('chipWhatIf').textContent=T.whatif;
document.getElementById('chipWTF').textContent=T.wtf;
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('qLabel').textContent = T.yourq;
document.getElementById('goBtn').textContent  = T.gen;
document.getElementById('clearBtn').textContent = T.clear;
document.getElementById('tipNote').textContent  = T.tip;

// badges
function renderBadges(){
  document.getElementById('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past'? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
  document.getElementById('styleBadge').textContent   = "🎭 " + (prefs.stile==='wtf'? 'What the F' : 'What if');
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.getElementById('styleHint').innerHTML = (prefs.stile==='wtf') ? T.hintWTF : T.hintWhatif;
  const toneRow = document.getElementById('toneRow');
  toneRow.style.display = (prefs.stile==='whatif') ? 'flex' : 'none';
  if (prefs.stile==='whatif'){
    document.getElementById('chipToneReal').textContent   = T.toneReal;
    document.getElementById('chipTonePoetic').textContent = T.tonePoetic;
    document.querySelectorAll('#toneChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.tone===prefs.whatif_tone));
  }
}
renderBadges();

// credits UI (locale)
function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin() ? Infinity : (prefs.pro ? 10 : 3); }
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  writeJSON('whatif_credits',c);
}
function leftCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  const cap=capForUser();
  return cap===Infinity ? "∞" : Math.max(0, cap-(c.used||0));
}
function renderCreditsBadge(){
  const fb = document.getElementById('freeBadge');
  const cap = capForUser();
  const left = leftCredits();
  fb.textContent = (cap===Infinity)
    ? (lang==='en' ? 'Credits: ∞' : 'Crediti: ∞')
    : (lang==='en' ? `Credits: ${left}/${cap}` : `Crediti: ${left}/${cap}`);
}
ensureCredits(); renderCreditsBadge();
document.getElementById('proBadge').textContent = prefs.pro? (lang==='en'?'PRO active':'PRO attivo') : (lang==='en'?'PRO not active':'PRO non attivo');

// nav
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
document.getElementById('periodoBadge').onclick=()=>{ prefs.periodo = (prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); renderBadges(); };

// style switch
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  renderBadges();
});

// tone switch (whatif only)
document.getElementById('toneChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.whatif_tone = b.dataset.tone;
  writeJSON('whatif_prefs',prefs);
  renderBadges();
});

// question
const qEl = document.getElementById('qInput');
qEl.placeholder = (lang==='en' ? "What if I moved back to L’Aquila?" : "E se tornassi a vivere all’Aquila?");
qEl.autofocus = true;

function trySubmit(){
  const domanda=(qEl.value||"").trim();
  if(!domanda){ qEl.focus(); return; }
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  if(!userIsAdmin()){
    const cap=capForUser();
    if((c.used||0)>=cap){ alert(T.outOfCredits); return; }
    c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();
  }
  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  writeJSON('whatif_request',{
    domanda,
    stile:prefs.stile,
    lang,
    extra:"",
    micro,
    fantasy_mode:false,
    periodo:prefs.periodo,
    whatif_tone:prefs.whatif_tone || 'real'
  });
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

// ===== Banner Micro (una volta al giorno; poi scompare) =====
(function(){
  const banner   = document.getElementById('dailyMicroBanner');
  const msgEl    = document.getElementById('microMsg');
  const moodSel  = document.getElementById('microMood');
  const decideSel= document.getElementById('microDecide');
  const anchorSel= document.getElementById('microAnchor');
  const jungSel  = document.getElementById('microJung');
  const laterBtn = document.getElementById('microLaterBtn');
  const saveBtn  = document.getElementById('microSaveBtn');
  document.getElementById('microHdr').textContent=T.microHdr;
  laterBtn.textContent = T.microLater; saveBtn.textContent = T.microSave;

  const today = todayStr();
  const onceKey = `micro_once:${today}`;
  if (LS.getItem(onceKey)) return;

  const pool = (lang==='en') ? {
    mood:[ "Calm","Charged","Foggy but fine","Restless","Light","Solid","A bit chaotic" ],
    decide:[ "Gut","Pros/Cons","Ask a friend","Deadline decides","Flip a coin","Coffee + walk" ],
    anchor:[ "People I love","Money & bills","Routine that works","Promise to myself","Fear of change","Curiosity" ],
    jung:[ "Extravert/Thinking","Extravert/Feeling","Introvert/Thinking","Introvert/Feeling","Intuition","Sensation" ]
  } : {
    mood:[ "Calmo","Carico","Appannato ma ok","Irrequieto","Leggero","Solido","Un po’ caotico" ],
    decide:[ "Pancia","Pro/Contro","Chiedo a un amico","Decide la scadenza","Tiro la moneta","Caffè + passeggiata" ],
    anchor:[ "Persone che amo","Soldi & bollette","Routine che funziona","Promessa a me","Paura di cambiare","Curiosità" ],
    jung:[ "Estroverso/Pensiero","Estroverso/Sentimento","Introverso/Pensiero","Introverso/Sentimento","Intuizione","Sensazione" ]
  };
  function fillSelect(el, arr){ el.innerHTML=''; arr.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); }); }
  fillSelect(moodSel,   pool.mood);
  fillSelect(decideSel, pool.decide);
  fillSelect(anchorSel, pool.anchor);
  fillSelect(jungSel,   pool.jung);

  const old = readJSON('micro_profile', {});
  if(old.mood)   moodSel.value = old.mood;
  if(old.decide) decideSel.value = old.decide;
  if(old.anchor) anchorSel.value = old.anchor;
  if(old.jung)   jungSel.value = old.jung;

  banner.style.display = 'block';
  laterBtn.onclick = ()=>{ banner.style.display='none'; };
  saveBtn.onclick = ()=>{
    const prof = { date: today, mood:moodSel.value, decide:decideSel.value, anchor:anchorSel.value, jung:jungSel.value };
    writeJSON('micro_profile', prof);
    try{ LS.setItem(onceKey,'1'); }catch{}
    msgEl.textContent = T.microSaved;
    setTimeout(()=>{ banner.style.display='none'; }, 600);
  };
})();

// Hints (giornalieri)
const HINT_IT=[ "E se cambiassi lavoro?","E se cambiassi città?","E se provassi a mettermi in proprio?","E se tornassi a studiare?","E se mollassi tutto e partissi per il Giappone?","E se aprissi un chiringuito in Islanda?","E se parlassi con il me di 10 anni fa?","E se imparassi una lingua strana?","E se vivessi 30 giorni senza social?","E se organizzassi un viaggio da solo?","E se chiedessi un aumento?","E se facessi volontariato?","E se provassi a scrivere un libro?" ];
const HINT_EN=[ "What if I changed jobs?","What if I moved city?","What if I started my own thing?","What if I went back to study?","What if I dropped everything and moved to Japan?","What if I opened a beach bar in Iceland?","What if I lived 30 days without social media?","What if I traveled alone?","What if I asked for a raise?","What if I volunteered?","What if I wrote a book?" ];
function rng(seed){ let s=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0); return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function daily(pool, n=4){ const r=rng(todayStr()); const seen=new Set(), out=[]; while(out.length<n && seen.size<pool.length){ const i=Math.floor(r()*pool.length); if(seen.has(i)) continue; seen.add(i); out.push(pool[i]); } return out; }
document.getElementById('hintsTitle').textContent=(lang==='en'?'▶ Quick “What if…”':'▶ Spunti rapidi “E se…”');
document.getElementById('hintsNote').textContent=(lang==='en'?'Click a hint to fill the question.':'Clicca uno spunto per riempire la domanda.');
const hintsWrap=document.getElementById('hintsChips');
(daily(lang==='en'?HINT_EN:HINT_IT,4)).forEach(h=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=h;
  b.onclick=()=>{ document.getElementById('qInput').value=h; window.scrollTo({top:0,behavior:'smooth'}); };
  hintsWrap.appendChild(b);
});
document.getElementById('hintsCard').classList.add('collapsed');
document.getElementById('hintsHeader').onclick=()=>{ document.getElementById('hintsCard').classList.toggle('collapsed'); };

// lang / period handlers
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
</script>
</main>
</body>
</html>
