<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f – Parlami di te</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#0A0F14;color:#fff;text-align:center;}
    h1{font-size:2rem;margin:20px 0;}
    .form-section{margin:15px 0;}
    .btn{padding:12px 20px;border-radius:30px;font-weight:bold;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(180deg,#00E0FF,#00B5CC);color:#062025;}
    input,textarea{width:80%;padding:10px;margin:8px auto;border-radius:10px;border:none;}
  </style>
</head>
<body>
  <h1>PARLAMI DI TE</h1>
  <form id="infoForm">
    <div class="form-section">
      <label>Chi sei?</label><br>
      <button type="button">Studente</button>
      <button type="button">Lavoratore</button>
      <button type="button">Creativo</button>
    </div>
    <div class="form-section">
      <label>Età</label><br>
      <button type="button">&lt;18</button>
      <button type="button">18–25</button>
      <button type="button">26–40</button>
      <button type="button">&gt;40</button>
    </div>
    <div class="form-section">
      <label>In quale fase ti trovi?</label><br>
      <button type="button">Studio</button>
      <button type="button">Carriera</button>
      <button type="button">Relazioni</button>
    </div>
    <div class="form-section">
      <label>Cosa ti interessa esplorare?</label><br>
      <button type="button">Passato</button>
      <button type="button">Futuro</button>
      <button type="button">What the f</button>
    </div>
    <div class="form-section">
      <label>Da dove vieni?</label><br>
      <input type="text" placeholder="La tua città...">
    </div>
    <div class="form-section">
      <label>Vuoi raccontarci qualcosa di più?</label><br>
      <textarea placeholder="(Opzionale – aiuta l’AI a darti risposte più accurate)"></textarea>
    </div>
    <button type="submit" id="continua" class="btn btn-primary">CONTINUA</button>
  </form>

  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode") || "whatif";

    document.getElementById("infoForm").addEventListener("submit", e=>{
      e.preventDefault();
      localStorage.setItem("whatif_style",mode);
      location.href="fifth.html?mode="+mode;
    });

    // Swipe
    let startX=0, startY=0;
    document.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    });
    document.addEventListener("touchend",e=>{
      let dx=e.changedTouches[0].clientX-startX;
      let dy=e.changedTouches[0].clientY-startY;
      if(Math.abs(dx)>60 && Math.abs(dy)<70){
        if(dx>0){ location.href="index.html"; }
        else{ location.href="fifth.html?mode="+mode; }
      }
    });
  </script>
</body>
</html>
