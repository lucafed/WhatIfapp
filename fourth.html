<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{--bg:#0B0B0C;--bg2:#101414;--fg:#FFF;--muted:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01;--wtf1:#3A6B56;--wtf2:#5A8C75;--card:rgba(20,28,34,.92);--line:rgba(255,255,255,.12);--chip:#121A26;--ink:#0A0E12;--shadow:rgba(0,0,0,.35)}
html[data-theme="wtf"]{--acc:var(--wtf1);--acc2:var(--wtf2)}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:900px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.center{max-width:760px;margin:0 auto}
h1{font-size:clamp(24px,5vw,36px);margin:10px 0 6px;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:16px;padding:22px 18px;font-size:20px;min-height:120px;text-align:center}
.selects{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" onclick="history.back()">←</button>
      <button class="btn" onclick="location.href='index.html'">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="styleBadge">🎭 —</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1>Scrivi la tua domanda</h1>

  <div class="card center">
    <div class="selects" style="margin-bottom:10px">
      <button class="btn" id="pastBtn">Passato</button>
      <button class="btn" id="futureBtn">Futuro</button>
      <button class="btn" id="styleWhatIf">What if</button>
      <button class="btn" id="styleWTF">What the F</button>
      <select id="whatifMode" class="btn" title="Tono What if">
        <option value="real">Reale (analisi concreta)</option>
        <option value="analytic">Analitico</option>
        <option value="poetic">Narrativo</option>
      </select>
    </div>
    <div class="label">La tua domanda</div>
    <textarea id="qInput" placeholder="E se…"></textarea>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera</button>
      <button class="btn" id="clearBtn">Svuota</button>
    </div>
    <div class="small" style="margin-top:8px">Puoi cambiare stile e periodo sopra; il tono si adatta.</div>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
document.getElementById('langBtn').onclick=()=>{ const l=(LS.getItem('lang')||'it').toLowerCase(); LS.setItem('lang', l==='it'?'en':'it'); location.reload(); };

function renderBadges(){
  document.getElementById('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past'?'Passato':'Futuro');
  document.getElementById('styleBadge').textContent   = "🎭 " + (prefs.stile==='wtf'?'What the F':'What if');
}
renderBadges();
document.getElementById('pastBtn').onclick=()=>{ prefs.periodo='past'; LS.setItem('whatif_prefs',JSON.stringify(prefs)); renderBadges(); }
document.getElementById('futureBtn').onclick=()=>{ prefs.periodo='future'; LS.setItem('whatif_prefs',JSON.stringify(prefs)); renderBadges(); }
document.getElementById('styleWhatIf').onclick=()=>{ prefs.stile='whatif'; LS.setItem('whatif_prefs',JSON.stringify(prefs)); document.documentElement.setAttribute('data-theme','whatif'); renderBadges(); }
document.getElementById('styleWTF').onclick=()=>{ prefs.stile='wtf'; LS.setItem('whatif_prefs',JSON.stringify(prefs)); document.documentElement.setAttribute('data-theme','wtf'); renderBadges(); }

const qEl = document.getElementById('qInput');
qEl.autofocus=true;

function trySubmit(){
  const domanda=(qEl.value||"").trim();
  if(!domanda){ qEl.focus(); return; }
  const profile = JSON.parse(LS.getItem('whatif_profile')||'{}');
  const lang=(LS.getItem('lang')||'it').toLowerCase();
  const req = {
    domanda,
    stile: prefs.stile||'whatif',
    lang,
    extra: profile.ctx||'',
    periodo: prefs.periodo||'future',
    sex: profile.sex||'',
    micro: (profile.micro && profile.micro.date===new Date().toISOString().slice(0,10)) ? profile.micro : {},
    whatif_mode: document.getElementById('whatifMode').value
  };
  LS.setItem('domanda',domanda);
  LS.setItem('whatif_request',JSON.stringify(req));
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); }
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); trySubmit(); }});
</script>
</body>
</html>
