<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}

.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}

footer{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge">FREE</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option>
      </select>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- STILE + PERIODO -->
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
          <div class="chips" id="styleChips">
            <button class="chip" data-style="whatif" id="chipWhatIf" type="button">What if</button>
            <button class="chip" data-style="wtf" id="chipWTF" type="button">What the F</button>
          </div>
          <div class="chips" id="periodoChips">
            <button class="chip" data-periodo="future" id="chipFuture" type="button">Futuro</button>
            <button class="chip" data-periodo="past" id="chipPast" type="button">Passato</button>
          </div>
        </div>
      </div>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>
        <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row" style="gap:10px">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button">🎲 Sorprendimi</button>
          </div>
          <button class="btn" id="clearBtn" type="button">Svuota</button>
        </div>
        <div class="small" id="tipNote" style="margin-top:8px">Le idee casuali seguono un mix 60/30/10: 60% personalizzate 🧩, 30% generiche 🌐, 10% assurde 🤪.</div>
      </div>

      <!-- BOOST (rimane) -->
      <div class="card center" id="boostCard">
        <div class="row toggle" id="boostHeader" style="justify-content:space-between">
          <div class="label" id="boostTitle">▶ Boost personalizzazione</div>
          <div class="small" id="boostHint">(opzionale)</div>
        </div>
        <div class="body" id="boostBody" style="margin-top:8px">
          <textarea id="boostInput" class="input" rows="3" placeholder="Scrivi obiettivi o contesto utile (es. 'inglese B2', 'L'Aquila', 'partita IVA', '4 giorni')…"></textarea>
          <div class="row" style="margin-top:10px;justify-content:flex-end;gap:8px">
            <button class="btn" id="boostClearBtn" type="button">Svuota</button>
            <button class="btn primary" id="boostSaveBtn" type="button">💾 Salva Boost</button>
          </div>
          <div class="small" id="boostSavedMsg" style="margin-top:6px"></div>
        </div>
      </div>

      <!-- SPUNTI (collassabili) -->
      <div class="card center collapsed" id="hintsCard">
        <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
          <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
        </div>
        <div class="body" id="hintsBody" style="margin-top:8px">
          <div class="chips" id="hintsChips"></div>
          <div class="small" id="hintsNote" style="margin-top:8px"></div>
        </div>
      </div>

      <footer id="footerNote">© What?f — FREE</footer>
    </div>
  </main>

<script>
(function(){
  /* ===== Storage ===== */
  const mem={}, LS={ getItem:k=>{try{return localStorage.getItem(k)}catch{ return (k in mem)?mem[k]:null}}, setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=String(v)}}, removeItem:k=>{try{localStorage.removeItem(k)}catch{delete mem[k]}} };

  /* ===== Helpers ===== */
  const SUPPORTED=["it","en","es","fr","de"];
  const $=id=>document.getElementById(id);
  const rj=(k,def)=>{ try{ return JSON.parse(LS.getItem(k)||JSON.stringify(def)); }catch{return def;} };
  const wj=(k,v)=>{ try{ LS.setItem(k, JSON.stringify(v)); }catch{} };
  const today=()=> new Date().toISOString().slice(0,10);

  let lang=(LS.getItem('lang')||'it').toLowerCase(); if(!SUPPORTED.includes(lang)) lang="it";
  document.documentElement.lang=lang;
  let prefs=rj('whatif_prefs',{stile:'whatif',periodo:'future'});

  /* ===== I18N ===== */
  const I18N={
    it:{title:"Imposta la tua domanda", yourq:"E se…", gen:"✨ Genera risposta", clear:"Svuota", surprise:"Sorprendimi",
        styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Passato",
        hintsTitle:"▶ Spunti rapidi “E se…”", hintsNote:"Clicca uno spunto per riempire la domanda.",
        footer:"© What?f — FREE",
        boostTitle:"▶ Boost personalizzazione", boostHint:"(opzionale)", boostSave:"💾 Salva Boost", boostClear:"Svuota",
        boostPH:"Scrivi obiettivi o contesto utile…", boostSaved:"Boost salvato.",
        mixExpl:"Le idee casuali seguono un mix 60/30/10: 60% personalizzate 🧩, 30% generiche 🌐, 10% assurde 🤪."
    },
    en:{title:"Set your question", yourq:"What if…", gen:"✨ Generate answer", clear:"Clear", surprise:"Surprise me",
        styleWF:"What if", styleWTF:"What the F", fut:"Future", past:"Past",
        hintsTitle:"▶ Quick “What if…”", hintsNote:"Click a hint to fill the question.",
        footer:"© What?f — FREE",
        boostTitle:"▶ Personalization boost", boostHint:"(optional)", boostSave:"💾 Save Boost", boostClear:"Clear",
        boostPH:"Write any useful context…", boostSaved:"Boost saved.",
        mixExpl:"Random ideas use a 60/30/10 mix: 60% personalized 🧩, 30% generic 🌐, 10% absurd 🤪."
    },
    es:{title:"Configura tu pregunta", yourq:"¿Y si…?", gen:"✨ Generar respuesta", clear:"Limpiar", surprise:"Sorpréndeme",
        styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Pasado",
        hintsTitle:"▶ Ideas rápidas «¿Y si…?»", hintsNote:"Pulsa una idea para rellenar la pregunta.",
        footer:"© What?f — FREE",
        boostTitle:"▶ Impulso de personalización", boostHint:"(opcional)", boostSave:"💾 Guardar Boost", boostClear:"Limpiar",
        boostPH:"Escribe contexto útil…", boostSaved:"Boost guardado.",
        mixExpl:"Las ideas aleatorias siguen un mix 60/30/10: 60% personalizadas 🧩, 30% genéricas 🌐, 10% absurdas 🤪."
    },
    fr:{title:"Définis ta question", yourq:"Et si…", gen:"✨ Générer la réponse", clear:"Effacer", surprise:"Surprends-moi",
        styleWF:"What if", styleWTF:"What the F", fut:"Futur", past:"Passé",
        hintsTitle:"▶ Idées rapides « Et si… »", hintsNote:"Clique une idée pour remplir la question.",
        footer:"© What?f — FREE",
        boostTitle:"▶ Boost de personnalisation", boostHint:"(optionnel)", boostSave:"💾 Enregistrer le Boost", boostClear:"Effacer",
        boostPH:"Écris du contexte utile…", boostSaved:"Boost enregistré.",
        mixExpl:"Mix 60/30/10 : 60 % personnalisées 🧩, 30 % génériques 🌐, 10 % absurdes 🤪."
    },
    de:{title:"Stelle deine Frage ein", yourq:"Was wäre, wenn…", gen:"✨ Antwort erzeugen", clear:"Leeren", surprise:"Überrasche mich",
        styleWF:"What if", styleWTF:"What the F", fut:"Zukunft", past:"Vergangenheit",
        hintsTitle:"▶ Schnelle „Was wäre, wenn…“-Ideen", hintsNote:"Klicke eine Idee, um die Frage zu füllen.",
        footer:"© What?f — FREE",
        boostTitle:"▶ Personalisierungs-Boost", boostHint:"(optional)", boostSave:"💾 Boost speichern", boostClear:"Leeren",
        boostPH:"Schreibe nützlichen Kontext…", boostSaved:"Boost gespeichert.",
        mixExpl:"Zufällige Ideen: 60/30/10 — personalisiert/generisch/absurd."
    }
  };

  const HINTS={
    it:["E se cambiassi lavoro?","E se cambiassi città?","E se aprissi partita IVA?","E se tornassi a studiare?","E se lavorassi 4 giorni?","E se chiedessi un aumento?","E se riducessi i social 30 giorni?","E se imparassi bene l’inglese?"],
    en:["What if you changed jobs?","What if you moved city?","What if you went freelance?","What if you went back to study?","What if you tried a 4-day week?","What if you asked for a raise?","What if you cut social for 30 days?","What if you mastered English?"],
    es:["¿Y si cambiaras de trabajo?","¿Y si te mudaras de ciudad?","¿Y si te hicieras autónomo?","¿Y si volvieras a estudiar?","¿Y si probaras 4 días?","¿Y si pidieras un aumento?","¿Y si dejaras redes 30 días?","¿Y si dominaras inglés?"],
    fr:["Et si tu changeais de travail ?","Et si tu déménageais ?","Et si tu passais freelance ?","Et si tu reprenais des études ?","Et si tu testais 4 jours ?","Et si tu demandais une augmentation ?","Et si tu coupais les réseaux 30 jours ?","Et si tu maîtrisais l’anglais ?"],
    de:["Was, wenn du den Job wechselst?","Was, wenn du umziehst?","Was, wenn du freiberuflich arbeitest?","Was, wenn du wieder studierst?","Was, wenn du 4 Tage testest?","Was, wenn du mehr Gehalt verlangst?","Was, wenn du 30 Tage ohne Social bist?","Was, wenn du Englisch meisterst?"]
  };
  const ABSURD={
    it:["E se il frigorifero mi proponesse il menù della vita?","E se aprissi una scuola per gatti anti-riunioni?","E se diventassi l’allenatore non ufficiale del condominio?"],
    en:["What if your fridge pitched you a life menu?","What if you opened a school for meeting-hating cats?"],
    es:["¿Y si mañana tu nevera te diera el menú de tu vida?"],
    fr:["Et si demain ton frigo te proposait le menu de ta vie ?"],
    de:["Was, wenn dir morgen dein Kühlschrank den Lebens-Speiseplan vorschlägt?"]
  };

  /* ===== DOM ===== */
  const backBtn=$('backBtn'), homeBtn=$('homeBtn'), langSelect=$('langSelect');
  const styleChips=$('styleChips'), periodoChips=$('periodoChips');
  const goBtn=$('goBtn'), clearBtn=$('clearBtn'), qInput=$('qInput'), surpriseBtn=$('surpriseBtn');

  /* ===== Text/UI ===== */
  function applyTexts(){
    const L=I18N[lang]||I18N.en;
    $('titleH1').textContent=L.title; $('qLabel').textContent=L.yourq;
    goBtn.textContent=L.gen; clearBtn.textContent=L.clear; surpriseBtn.textContent='🎲 '+L.surprise;
    $('chipWhatIf').textContent=L.styleWF; $('chipWTF').textContent=L.styleWTF; $('chipFuture').textContent=L.fut; $('chipPast').textContent=L.past;
    $('hintsTitle').textContent=L.hintsTitle; $('hintsNote').textContent=L.hintsNote; $('footerNote').textContent=L.footer;
    $('boostTitle').textContent=L.boostTitle; $('boostHint').textContent=L.boostHint; $('boostSaveBtn').textContent=L.boostSave; $('boostClearBtn').textContent=L.boostClear; $('boostInput').placeholder=L.boostPH;
    $('tipNote').textContent=L.mixExpl;
    renderBadges(); renderHints();
  }
  backBtn.onclick=()=>{ try{ if(history.length>1) history.back(); }catch{} };
  homeBtn.onclick=()=>{ try{ location.href='index.html'; }catch{} };
  langSelect.value=lang;
  langSelect.onchange=()=>{ lang=langSelect.value; LS.setItem('lang',lang); applyTexts(); };

  function renderBadges(){
    const L=I18N[lang]||I18N.en;
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
    $('styleBadge').textContent='🎭 '+(prefs.stile==='wtf'?L.styleWTF:L.styleWF);
    $('periodoBadge').textContent='🕰️ '+(prefs.periodo==='past'?L.past:L.fut);
    document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
    document.querySelectorAll('#periodoChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.periodo===prefs.periodo));
  }
  styleChips.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; prefs.stile=b.dataset.style; wj('whatif_prefs',prefs); renderBadges(); });
  periodoChips.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; prefs.periodo=b.dataset.periodo; wj('whatif_prefs',prefs); renderBadges(); });

  /* ===== Punteggiatura & pulizia ===== */
  const UNI_OK = (()=>{ try{ new RegExp("\\p{L}","u"); return true;}catch{return false;} })();
  const WORD_RE = UNI_OK? /[\p{L}\p{N}’']+/gu : /[A-Za-z0-9'’]+/g;
  const normalizeSpaces = t => t.replace(/\s+/g,' ').replace(/\s+([?!.,;:%])/g,'$1').trim();
  function polishQuestion(q, Lcode){
    let t=String(q||"").replace(/[?？]+$/,'').trim(); if(!t) return '';
    t=t.replace(/\bl'? aquila\b/gi,"L'Aquila").replace(/\ball'?aquila\b/gi,"all'Aquila");
    t = t.charAt(0).toUpperCase()+t.slice(1);
    t = normalizeSpaces(t);
    if(Lcode==="es"){ if(!t.startsWith('¿')) t='¿'+t; if(!t.endsWith('?')) t+='?'; return t; }
    if(Lcode==="fr"){ if(!t.endsWith('?')) t+=' ?'; t=t.replace(/\s*\?$/,'\u202F?'); return t; }
    if(!/\?$/.test(t)) t+='?'; return t;
  }
  function seemsValidQuestion(q){
    const t=String(q||"").trim();
    const words=(t.match(WORD_RE)||[]);
    const hasVerb=/\b(essere|fare|avere|andare|potrei|potresti|posso|cambiare|aprire|imparare|provare|vivere|studiare|correre|lavorare|organizzare|iniziare|testare|valutare|delegare|spegnere|ridurre|chiedere|investire|risparmiare|trasferirti|trasferirmi|move|change|start|learn|try|study|work|plan|test|reduce|ask|invest|save)\b/i.test(t);
    return words.length>=4 && hasVerb;
  }

  /* ===== Boost: parsing sicuro ===== */
  const BAD_IT=/\b(sono|ero|sarò|sono nato|nata|nato|ho \d{1,3} anni)\b/i;
  const BAD_GLOBAL=/(@|https?:\/\/|\b\d{5,}\b|\b\d{1,2}\/\d{1,2}\/\d{2,4}\b)/i;
  function cleanTopicPhrase(s){
    if(!s) return '';
    let t=String(s).normalize('NFKC');
    if(BAD_IT.test(t) || BAD_GLOBAL.test(t)) return '';
    t=t.replace(/\bl'? aquila\b/gi,"L'Aquila").replace(/\ball'?aquila\b/gi,"all'Aquila");
    const toks=(t.match(WORD_RE)||[]).map(x=>x.toLowerCase());
    if(toks.length===0 || toks.length>3) return '';
    if(/^(sono|ero|sar[oò])$/.test(toks[0])) return '';
    return toks.join(' ');
  }
  function extractTopicsStrict(txt){
    const raw = String(txt||'').split(/[;,/]| e | and | y | et | und/gi);
    const out=[]; raw.forEach(c=>{ const v=cleanTopicPhrase(c); if(v && !out.includes(v)) out.push(v); });
    return out.slice(0,8);
  }

  /* ===== Template frasi ===== */
  const FUT={
    it:[ q=>`E se iniziassi a ${q} per 7 giorni`, q=>`E se esplorassi ${q} con un esperimento breve`, q=>`E se organizzassi passi settimanali su ${q}` ],
    en:[ q=>`What if you tried ${q} for 7 days`, q=>`What if you ran a quick experiment on ${q}` ],
    es:[ q=>`¿Y si pruebas ${q} durante 7 días`, q=>`¿Y si haces un experimento rápido sobre ${q}` ],
    fr:[ q=>`Et si tu testais ${q} pendant 7 jours`, q=>`Et si tu faisais une mini-expérience sur ${q}` ],
    de:[ q=>`Was, wenn du ${q} 7 Tage testest`, q=>`Was, wenn du ein kurzes Experiment zu ${q} machst` ]
  };
  const PAST={
    it:[ q=>`E se avessi iniziato ${q} l’estate scorsa`, q=>`E se avessi fatto un test di 7 giorni su ${q}` ],
    en:[ q=>`What if you had started ${q} last summer`, q=>`What if you had run a 7-day test on ${q}` ],
    es:[ q=>`¿Y si hubieras empezado ${q} el verano pasado`, q=>`¿Y si hubieras hecho una prueba de 7 días sobre ${q}` ],
    fr:[ q=>`Et si tu avais commencé ${q} l’été dernier`, q=>`Et si tu avais fait un test de 7 jours sur ${q}` ],
    de:[ q=>`Was, wenn du letzten Sommer mit ${q} begonnen hättest`, q=>`Was, wenn du einen 7-Tage-Test zu ${q} gemacht hättest` ]
  };
  function baseSentence(topic){
    const tbl = (prefs.periodo==='past')? PAST : FUT;
    const fns=(tbl[lang]||tbl.it);
    return polishQuestion(fns[Math.floor(Math.random()*fns.length)](topic),lang);
  }
  const ABSURD_POOL=ABSURD;

  /* ===== Pool builder ===== */
  function buildPersonalizedPool(){
    const profile = rj('whatif_profile', {});
    const micro   = rj('micro_profile', {}); // anche se la UI non c’è più, manteniamo compatibilità
    const boost   = (LS.getItem('whatif_boost')||'').trim();
    const out=[];
    if(profile.role) out.push(baseSentence(`la tua carriera da ${profile.role}`));
    if(profile.city){ const city=String(profile.city).replace(/\bl'? aquila\b/gi,"L'Aquila"); out.push(baseSentence(`vivere a ${city}`)); }
    if(profile.goal) out.push(baseSentence(`“${profile.goal}”`));
    if(micro.mood) out.push(baseSentence(`organizzare la settimana intorno a “${micro.mood}”`));
    extractTopicsStrict(boost).forEach(tp=> out.push(baseSentence(tp)));
    return Array.from(new Set(out)).slice(0,24);
  }
  function buildGenericPool(){ return (HINTS[lang]||HINTS.en).map(s=>polishQuestion(s,lang)); }
  function absurdSentence(){ const pool=ABSURD_POOL[lang]||ABSURD_POOL.it; return polishQuestion(pool[Math.floor(Math.random()*pool.length)],lang); }

  /* ===== Surprise ===== */
  function surpriseIntoField(){
    const r=Math.random()*100; let text='';
    if(r<10){ text=absurdSentence(); prefs.stile='wtf'; wj('whatif_prefs',prefs); renderBadges(); }
    else if(r<70){ const p=buildPersonalizedPool(); text=p.length?p[Math.floor(Math.random()*p.length)]:''; }
    else{ const g=buildGenericPool(); text=g[Math.floor(Math.random()*g.length)]; }
    if(!seemsValidQuestion(text)){
      const fb=(lang==='it'?'E se cambiassi lavoro quest’anno?':lang==='es'?'¿Y si cambiaras de trabajo este año?':lang==='fr'?'Et si tu changeais de travail cette année ?':lang==='de'?'Was, wenn du dieses Jahr den Job wechselst?':'What if you changed jobs this year?');
      text=polishQuestion(fb,lang);
    }
    $('qInput').value=text;
    $('qInput').animate([{outline:'2px solid transparent'},{outline:'2px solid var(--accent2)'},{outline:'2px solid transparent'}],{duration:900});
    window.scrollTo({top:0,behavior:'smooth'});
  }

  /* ===== Boost handlers ===== */
  $('boostHeader').onclick=()=>$('boostCard').classList.toggle('collapsed');
  $('boostSaveBtn').onclick=()=>{ LS.setItem('whatif_boost', String(($('boostInput')||{}).value||'')); LS.setItem('whatif_boost_saved_date', today()); $('boostSavedMsg').textContent=(I18N[lang]||I18N.en).boostSaved; setTimeout(()=> $('boostSavedMsg').textContent='', 1400); };
  $('boostClearBtn').onclick=()=>{ const i=$('boostInput'); if(i) i.value=''; LS.setItem('whatif_boost',''); };

  /* ===== Hints ===== */
  function renderHints(){
    const wrap=$('hintsChips'); wrap.innerHTML='';
    (HINTS[lang]||HINTS.en).forEach(txt=>{
      const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=polishQuestion(txt,lang);
      b.onclick=()=>{ $('qInput').value=polishQuestion(txt,lang); window.scrollTo({top:0,behavior:'smooth'}); };
      wrap.appendChild(b);
    });
  }
  $('hintsHeader').onclick=()=> $('hintsCard').classList.toggle('collapsed');

  /* ===== Submit ===== */
  function trySubmit(){
    const domanda=(qInput.value||'').trim(); if(!domanda){ qInput.focus(); return; }
    const domandaClean=polishQuestion(domanda,lang); qInput.value=domandaClean;
    LS.setItem('domanda',domandaClean);
    const req={ domanda:domandaClean, stile:prefs.stile, lang, extra:'', micro:rj('micro_profile',{}), fantasy_mode:false, periodo:prefs.periodo, boost:(LS.getItem('whatif_boost')||'') };
    wj('whatif_request',req);
    try{ location.href='fifth.html'; }catch{}
  }
  goBtn.onclick=trySubmit; clearBtn.onclick=()=>{ qInput.value=''; qInput.focus(); };
  surpriseBtn.onclick=surpriseIntoField;

  /* ===== Init ===== */
  try{
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
    applyTexts(); renderHints();
    $('boostInput').value=(LS.getItem('whatif_boost')||'');
  }catch(e){ console.error('Init error:',e); }
})();
</script>
