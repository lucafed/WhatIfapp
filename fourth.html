<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{
  /* PALETTE: L'Aquila (verde/nero) + Verona (giallo/verde) */
  --bg:#0A0F14;              /* quasi-nero */
  --fg:#FFFFFF;              /* testo */
  --muted:#A0B2BA;

  /* primari */
  --green-aq:#0FA958;        /* L’Aquila verde */
  --green-aq-dark:#0C7A43;   /* L’Aquila verde scuro */
  --verona-yellow:#FFD300;   /* Verona giallo */
  --verona-green:#7EC700;    /* Verona verde */

  /* usi UI */
  --acc:var(--green-aq);         /* accento principale */
  --acc2:var(--verona-green);    /* variante/gradient */
  --hl:var(--verona-yellow);     /* highlight */

  --surface:#141C22;
  --card:rgba(20,28,34,.92);
  --line:rgba(255,255,255,.12);
  --chip:#121A26;
  --ink:#0A0E12;
  --shadow:rgba(0,0,0,.35);
}

/* tema alterno quando stile = wtf → più green/nero “duro” */
html[data-theme="wtf"]{
  --acc:var(--green-aq-dark);
  --acc2:var(--green-aq);
  --hl:var(--verona-yellow);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 25% 20%, #0F1318 0%, var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none;white-space:nowrap}

.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,32px);margin:10px 0 6px;color:var(--hl);text-align:center;letter-spacing:.2px}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

/* blocchi collassabili */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none !important}

/* Overlay micro */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.overlay.show{display:flex}
.overlay::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(2px)}
.modal{position:relative;width:min(860px,94vw);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 36px var(--shadow);padding:18px;z-index:1}
.modal h3{margin:0 0 8px;color:var(--hl);text-align:center}
.qblock{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:rgba(255,255,255,.04)}
.qtitle{display:flex;align-items:center;gap:8px;font-weight:800;color:#E7F2EE;margin-bottom:8px}
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
</style>
</head>
<body>
<main>
  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <!-- LANGUAGE: dropdown semplice -->
      <select id="langSel" class="btn" style="background:var(--chip);border-radius:12px">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="pt">PT</option>
      </select>
      <span class="badge" id="freeBadge">—</span>
    </div>
  </div>

  <h1>E se… facessimo parlare la tua domanda?</h1>

  <!-- STILI + PERIODO, tutti insieme -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
      </div>
      <div class="chips" id="periodChips">
        <button class="chip" data-period="future" id="chipFuture">Futuro</button>
        <button class="chip" data-period="past" id="chipPast">Passato</button>
      </div>
      <div class="row"><span class="badge" id="proBadge">—</span></div>
    </div>

    <!-- sub-mode (solo What if) -->
    <div id="whatifSubMode" class="chips" style="margin-top:8px">
      <button class="chip" data-mode="analitico" id="chipAnalitico">Analitico</button>
      <button class="chip" data-mode="reale" id="chipReale">Reale/Poetico</button>
    </div>
  </div>

  <!-- DOMANDA: solo “E se…” -->
  <div class="card center">
    <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
  </div>

  <!-- Spunti -->
  <div class="card center collapsed" id="hintsCard">
    <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
      <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
    </div>
    <div class="body" id="hintsBody" style="margin-top:8px">
      <div class="chips" id="hintsChips"></div>
    </div>
  </div>

  <!-- Salvati -->
  <div class="card center collapsed" id="savedCard">
    <div class="row toggle" id="savedHeader" style="justify-content:space-between">
      <div class="label" id="nextLabel">▶ Domande salvate</div>
      <button class="btn ghost" id="clearSavedBtn">🗑️ Svuota</button>
    </div>
    <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
  </div>

  <!-- Cronologia -->
  <div class="card center collapsed" id="histCard">
    <div class="row toggle" id="histHeader" style="justify-content:space-between">
      <div class="label" id="storiesLabel">▶ Cronologia</div>
      <button class="btn ghost" id="clearHistoryBtn">🗑️ Svuota</button>
    </div>
    <div class="body"><div id="storyList" class="list"></div></div>
  </div>
</main>

<!-- Overlay micro -->
<div class="overlay" id="microOverlay" aria-modal="true" role="dialog">
  <div class="modal">
    <h3>Micro-domande di oggi</h3>
    <div class="qblock"><div class="qtitle"><span>🙂</span><span>Oggi come ti senti?</span></div><div class="optset" id="moodOpts"></div></div>
    <div class="qblock"><div class="qtitle"><span>🧭</span><span>Cosa ti tiene qui ultimamente?</span></div><div class="optset" id="anchorOpts"></div></div>
    <div class="qblock"><div class="qtitle"><span>⏳</span><span>Come decidi di solito?</span></div><div class="optset" id="decideOpts"></div></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px;gap:8px">
      <button class="btn ghost" id="microDismissBtn">Chiudi</button>
      <button class="btn primary" id="saveMicroBtn">💾 Salva</button>
    </div>
  </div>
</div>

<script>
/* ===== I18N minimal (fallback EN per le lingue extra) ===== */
const I18N = {
  it:{ gen:"✨ Genera risposta", clear:"Svuota", quick:"▶ Spunti rapidi “E se…”", saved:"▶ Domande salvate", stories:"▶ Cronologia", use:"Usa", emptyNext:"— Nessuna domanda salvata.", emptyStories:"— Nessuna storia.", outOfCredits:"Hai finito i crediti di oggi.", credits:(l,c)=>`Crediti: ${l}/${c}` },
  en:{ gen:"✨ Generate", clear:"Clear", quick:"▶ Quick “What if…”", saved:"▶ Saved questions", stories:"▶ History", use:"Use", emptyNext:"— No saved questions.", emptyStories:"— No history.", outOfCredits:"You’ve used today’s credits.", credits:(l,c)=>`Credits: ${l}/${c}` },
  es:{}, fr:{}, de:{}, pt:{}
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=(I18N[lang]&&Object.keys(I18N[lang]).length)?I18N[lang]:I18N.en;

/* ===== State & helpers ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function rng(seed){ let s=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0); return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }

let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false,mode:'reale'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== Topbar elements ===== */
const langSel=document.getElementById('langSel');
langSel.value=lang;
langSel.onchange=()=>{ LS.setItem('lang', langSel.value); location.reload(); };

/* ===== Credits ===== */
function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin()?Infinity:(prefs.pro?10:3); }
function ensureCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); if(c.date!==todayISO()){ c.date=todayISO(); c.used=0; } writeJSON('whatif_credits',c); }
function leftCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); const cap=capForUser(); return cap===Infinity?"∞":Math.max(0,cap-(c.used||0)); }
function renderCredits(){ const fb=document.getElementById('freeBadge'); const cap=capForUser(); fb.textContent = (cap===Infinity) ? (lang==='it'?'Crediti: ∞':'Credits: ∞') : T.credits(leftCredits(),cap); }
ensureCredits(); renderCredits();
document.getElementById('proBadge').textContent = prefs.pro? (lang==='it'?'PRO attivo':'PRO active') : (lang==='it'?'PRO non attivo':'PRO not active');

/* ===== Stile & Periodo ===== */
function renderStyleUI(){
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.querySelectorAll('#periodChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.period===prefs.periodo));
  document.getElementById('whatifSubMode').style.display = prefs.stile==='whatif'?'flex':'none';
  document.getElementById('chipAnalitico').classList.toggle('sel', prefs.mode==='analitico');
  document.getElementById('chipReale').classList.toggle('sel', prefs.mode!=='analitico');
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
}
renderStyleUI();

document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs); renderStyleUI();
});
document.getElementById('periodChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.periodo=b.dataset.period; writeJSON('whatif_prefs',prefs); renderStyleUI();
});
document.getElementById('whatifSubMode').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.mode=b.dataset.mode; writeJSON('whatif_prefs',prefs); renderStyleUI();
});

/* ===== Domanda ===== */
const qEl=document.getElementById('qInput');
qEl.placeholder="E se…";
qEl.autofocus=true;

function trySubmit(){
  const domanda=(qEl.value||"").trim();
  if(!domanda){ qEl.focus(); return; }
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  if(!userIsAdmin()){
    const cap=capForUser();
    if((c.used||0)>=cap){ alert(T.outOfCredits); return; }
    c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCredits();
  }
  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  const req = { domanda, stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'reale'):undefined), lang:langSel.value, extra:"", micro, fantasy_mode:false, periodo:prefs.periodo };
  writeJSON('whatif_request', req);
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

/* ===== Hints ===== */
document.getElementById('hintsHeader').onclick=()=>{ document.getElementById('hintsCard').classList.toggle('collapsed'); };
const HINT_IT=[ "E se cambiassi lavoro?","E se cambiassi città?","E se provassi a mettermi in proprio?","E se tornassi a studiare?","E se aprissi un chiringuito in Islanda?","E se chiedessi un aumento?","E se mi svegliassi all’alba per un mese?","E se facessi pace con una persona?" ];
const HINT_EN=[ "What if I changed jobs?","What if I moved city?","What if I started my own thing?","What if I went back to study?","What if I opened a beach bar in Iceland?","What if I asked for a raise?","What if I woke up at dawn for a month?","What if I made peace with someone?" ];
const pool = (langSel.value==='it')?HINT_IT:HINT_EN;
const r=rng(todayISO()+"-hints"); const seen=new Set(); const out=[]; while(out.length<4 && seen.size<pool.length){ const i=Math.floor(r()*pool.length); if(seen.has(i)) continue; seen.add(i); out.push(pool[i]); }
const wrap=document.getElementById('hintsChips');
out.forEach(h=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=h; b.onclick=()=>{ qEl.value=h; window.scrollTo({top:0,behavior:'smooth'}); }; wrap.appendChild(b); });

/* ===== Saved & History (identici) ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=document.getElementById('nextList'); box.innerHTML='';
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmtDate(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.use;
    useBtn.onclick=()=>{ qEl.value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); writeJSON('whatif_request',{ domanda:item.q||"", stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'reale'):undefined), lang:langSel.value, extra:"", micro:readJSON('micro_profile',{}), fantasy_mode:false, periodo:prefs.periodo }); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderStories(){
  const box=document.getElementById('storyList'); box.innerHTML='';
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story', { domanda:item.domanda, answer:item.risposta||item.answer||"", stile:item.stile||'whatif' }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
renderNext(); renderStories();
document.getElementById('savedHeader').onclick=()=>{ document.getElementById('savedCard').classList.toggle('collapsed'); };
document.getElementById('histHeader').onclick=()=>{ document.getElementById('histCard').classList.toggle('collapsed'); };
document.getElementById('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
document.getElementById('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };

/* ===== Micro overlay (una volta al giorno) ===== */
const microOverlay=document.getElementById('microOverlay');
const microSeen=readJSON('micro_seen',{date:""});
function lockBody(on){ document.body.style.overflow=on?'hidden':''; }
function dismissMicro(){ writeJSON('micro_seen',{date:todayISO()}); microOverlay.classList.remove('show'); lockBody(false); }
if(microSeen.date!==todayISO()){ microOverlay.classList.add('show'); lockBody(true); }
microOverlay.addEventListener('click',(e)=>{ if(e.target===microOverlay) dismissMicro(); });
document.getElementById('microDismissBtn').onclick=dismissMicro;
document.getElementById('saveMicroBtn').onclick=()=>{ writeJSON('micro_profile', readJSON('micro_profile',{})); dismissMicro(); };

/* micro options sample */
function renderOpts(id, pool){ const wrap=document.getElementById(id); wrap.innerHTML=''; pool.forEach(t=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=t; b.onclick=()=>{ wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); const cur=readJSON('micro_profile',{}); cur[id]=t; writeJSON('micro_profile',cur); }; wrap.appendChild(b); }); }
renderOpts('moodOpts', ["Calmo","Carico","Appannato ma ok","Astronauta irrequieto","Leggero e chiacchierone"]);
renderOpts('anchorOpts', ["Persone che ami","Soldi & bollette","Routine che funziona","Promessa a te stesso/a","Curiosità"]);
renderOpts('decideOpts', ["Pancia","Pro/Contro","Chiedo a un amico","Scadenza decide","Caffè + passeggiata"]);
</script>
</body>
</html>
