<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risposta</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; /* What if */
  --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7;white-space:pre-wrap}
.q{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:14px}
.follow{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:10px;border-radius:10px;cursor:pointer}
.opt:hover{background:rgba(255,255,255,.06)}
.input{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:12px}
.meta{font-size:12px;color:var(--muted)}
.skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Risultato</h1>

  <div class="card">
    <div class="label" id="qLabel">Domanda</div>
    <div id="question" class="q">—</div>
  </div>

  <div class="card">
    <div class="label" id="rLabel">Risposta</div>
    <div id="result" class="box"><span class="skeleton" style="width:60%"></span></div>
  </div>

  <div class="card">
    <div class="label" id="fLabel">Domande per continuare</div>
    <div id="fWrap" class="follow">
      <div class="meta" id="fMeta">Sto preparando due spunti mirati…</div>
    </div>
    <div style="margin-top:10px">
      <input id="freeInput" class="input" placeholder="Oppure scrivi qui cosa vuoi sapere domani…" />
    </div>
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="btn primary" id="saveBtn">Salva per domani</button>
    </div>
  </div>
</main>

<script>
/* ===== I18N ===== */
const I18N={
  it:{ title:"Risultato", q:"Domanda", r:"Risposta", follow:"Domande per continuare",
       prepping:"Sto preparando due spunti mirati…", inputPH:"Oppure scrivi qui cosa vuoi sapere domani…",
       save:"Salva per domani", saved:"Salvato! Lo troverai domani nella quarta pagina.",
       err:"Problema server." },
  en:{ title:"Result", q:"Question", r:"Answer", follow:"Follow-ups to continue",
       prepping:"Preparing two targeted prompts…", inputPH:"Or write what you want to know tomorrow…",
       save:"Save for tomorrow", saved:"Saved! You’ll find it tomorrow on the question page.",
       err:"Server error." }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== theme & prefs ===== */
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
const stile = prefs.stile || 'whatif';
document.documentElement.setAttribute('data-theme', stile==='wtf'?'wtf':'whatif');

/* ===== UI ===== */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.q;
document.getElementById('rLabel').textContent=T.r;
document.getElementById('fLabel').textContent=T.follow;
document.getElementById('fMeta').textContent=T.prepping;
document.getElementById('freeInput').placeholder=T.inputPH;
document.getElementById('saveBtn').textContent=T.save;
document.getElementById('langBtn').textContent=lang.toUpperCase();

/* ===== nav ===== */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ const nxt=lang==='it'?'en':'it'; LS.setItem('lang',nxt); location.reload(); };

/* ===== data ===== */
const domanda = LS.getItem('domanda')||'';
const extra   = LS.getItem('whatif_extra')||'';
document.getElementById('question').textContent=domanda||'—';

/* ===== call API (answer, poi followups) ===== */
async function askAnswer(){
  try{
    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ domanda, lang, stile, extra, mode:"answer", stream:false, profilo: JSON.parse(LS.getItem('whatif_profile')||'{}') })
    });
    if(!r.ok) throw new Error("server");
    const j = await r.json();
    const text = (j.answer||'').trim();
    document.getElementById('result').textContent=text || '—';
    LS.setItem('last_answer', text);
    renderHistory(text);
    await askFollowups(text);
  }catch(e){
    document.getElementById('result').textContent=T.err;
  }
}

async function askFollowups(answerText){
  try{
    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ domanda, lang, stile, mode:"followups", previous_answer: answerText })
    });
    if(!r.ok) throw new Error("server");
    const j = await r.json();
    const arr = Array.isArray(j.followups)? j.followups.slice(0,2):[];
    const wrap = document.getElementById('fWrap');
    wrap.innerHTML='';
    arr.forEach(q=>{
      const b=document.createElement('div'); b.className='opt'; b.textContent=q;
      b.onclick=()=>{ document.getElementById('freeInput').value = q; };
      wrap.appendChild(b);
    });
    if(!arr.length){
      const m=document.createElement('div'); m.className='meta'; m.textContent='—';
      wrap.appendChild(m);
    }
  }catch(e){
    document.getElementById('fMeta').textContent=T.err;
  }
}

/* ===== salva prompt per domani ===== */
document.getElementById('saveBtn').onclick=()=>{
  const val=(document.getElementById('freeInput').value||'').trim();
  if(!val) { document.getElementById('freeInput').focus(); return; }
  const list = JSON.parse(LS.getItem('next_prompts')||'[]');
  list.unshift({ q:domanda, next:val, stile, lang, ts:Date.now() });
  LS.setItem('next_prompts', JSON.stringify(list.slice(0,50)));
  alert(T.saved);
};

/* ===== cronologia minima ===== */
function renderHistory(answerText){
  const arr = JSON.parse(LS.getItem('cronologia')||'[]');
  arr.unshift({ domanda, risposta: answerText, stile, lang, ts:Date.now() });
  LS.setItem('cronologia', JSON.stringify(arr.slice(0,200)));
}

askAnswer();
</script>
</body>
</html>
