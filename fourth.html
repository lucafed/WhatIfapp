<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#0E1114; --card:rgba(20,28,34,.92);
  --fg:#EAF3EE; --muted:#9FB1B9; --line:rgba(255,255,255,.12);
  --chip:#111820; --ink:#0B0B0C; --shadow:rgba(0,0,0,.35);
  --acc:#66f0a6; --acc2:#21c06b; /* primario fisso */
  --pill:#16202a;
}
/* Tema WTF cambia solo le pill, non il primario */
html[data-theme="wtf"]{ --pill:#1A2426; }
*{box-sizing:border-box}
html,body{margin:0;background:
radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(22px,5vw,30px);margin:10px 0 4px}
h2{font-size:18px;margin:0 0 8px;color:var(--acc)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.input, textarea{width:100%;background:rgba(255,255,255,.06);color:var(--fg);
  border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--pill);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{outline:2px solid var(--acc2);font-weight:700}
.btn{appearance:none;border:1px solid var(--line);background:var(--pill);color:var(--fg);
  padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)) !important;color:var(--ink)!important;font-weight:800;border:none;box-shadow:0 8px 24px var(--shadow)}
.badge{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.badge.pro{background:linear-gradient(180deg,#66f0a6,#21c06b);color:#0B0B0C;font-weight:800}
.meta{font-size:12px;color:var(--muted)}
.tip{font-size:12px;color:var(--muted);margin-top:8px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);margin-top:8px}
.play{border:none;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0B0B0C;width:46px;height:46px;border-radius:12px;cursor:pointer;font-weight:900}
.use{border:1px solid var(--line);background:var(--pill);color:var(--fg);border-radius:10px;padding:8px 12px}
.caret{cursor:pointer;user-select:none}
.collapsed .body{display:none}
.header{display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<main>
  <!-- top bar -->
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="pageTitle">Imposta la tua domanda</h1>

  <!-- switches -->
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="chips" id="periodChips">
        <button class="chip sel" data-period="future" id="chipFuture">Futuro</button>
        <button class="chip" data-period="past" id="chipPast">Passato</button>
      </div>
      <div class="chips" id="styleChips">
        <button class="chip sel" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <!-- question -->
  <div class="card">
    <h2 id="yourQ">La tua domanda</h2>
    <textarea id="qInput" rows="3" placeholder="E se tornassi a vivere all’Aquila?" class="input"></textarea>

    <div style="margin-top:12px">
      <div class="row" style="justify-content:space-between;gap:8px">
        <div class="meta" id="optLabel">Aggiungi un dettaglio (opzionale)</div>
        <div class="meta" id="hintMeta">aiuta la risposta di oggi</div>
      </div>
      <input id="extraInput" class="input" placeholder="es. primo segnale di successo, budget, luogo preciso…" />
      <div class="chips" id="suggestChips" style="margin-top:8px"></div>
      <p class="tip" id="tipNote">Tip: puoi cambiare stile sopra; colori e tono si adattano.</p>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="genBtn">✨ Genera risposta</button>
      <button class="btn" id="clearBtn">Pulisci</button>
    </div>
  </div>

  <!-- saved for tomorrow -->
  <div class="card collapsed" id="savedCard">
    <div class="header">
      <div class="row">
        <span class="caret">▾</span>&nbsp;
        <h2 id="savedTitle" style="margin:0">Domande salvate per domani</h2>
      </div>
      <div class="row">
        <button class="btn" id="clearSavedBtn">Svuota salvate</button>
      </div>
    </div>
    <div class="body" id="savedBody"></div>
  </div>

  <!-- history -->
  <div class="card collapsed" id="historyCard">
    <div class="header">
      <div class="row">
        <span class="caret">▾</span>&nbsp;
        <h2 id="histTitle" style="margin:0">Storie recenti</h2>
      </div>
      <div class="row">
        <button class="btn" id="clearHistoryBtn">Svuota storie</button>
      </div>
    </div>
    <div class="body" id="storyList"></div>
  </div>
</main>

<script>
/* ===== i18n ===== */
const I18N={
  it:{
    title:"Imposta la tua domanda",
    q:"La tua domanda",
    opt:"Aggiungi un dettaglio (opzionale)",
    hint:"aiuta la risposta di oggi",
    tip:"Tip: puoi cambiare stile sopra; colori e tono si adattano.",
    gen:"✨ Genera risposta", clear:"Pulisci",
    future:"Futuro", past:"Passato",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    saved:"Domande salvate per domani", hist:"Storie recenti",
    svuotaS:"Svuota salvate", svuotaH:"Svuota storie",
    chip1:"primo segnale", chip2:"vincolo 2 settimane", chip3:"luogo preciso", chip4:"tempo disponibile",
    free:(l,d,pro)=>`Free oggi: ${pro?'∞':l}/${pro?'∞':d}`,
    alertNoCredits:"Hai finito i free di oggi.\nTorna domani o attiva Pro."
  },
  en:{
    title:"Set your question",
    q:"Your question",
    opt:"Add a detail (optional)",
    hint:"helps today's answer",
    tip:"Tip: switch style above; tone & colors adapt.",
    gen:"✨ Generate answer", clear:"Clear",
    future:"Future", past:"Past",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    saved:"Questions saved for tomorrow", hist:"Recent stories",
    svuotaS:"Clear saved", svuotaH:"Clear stories",
    chip1:"first signal", chip2:"2-week constraint", chip3:"specific place", chip4:"time window",
    free:(l,d,pro)=>`Free today: ${pro?'∞':l}/${pro?'∞':d}`,
    alertNoCredits:"Daily free limit reached.\nCome back tomorrow or enable Pro."
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase().startsWith('en')?'en':'it';
const T=I18N[lang];
document.documentElement.lang=lang;

/* ===== theme by style ===== */
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
let currentStyle=prefs.stile||'whatif';
document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');

/* ===== bind texts ===== */
const $=id=>document.getElementById(id);
$('pageTitle').textContent=T.title;
$('yourQ').textContent=T.q;
$('optLabel').textContent=T.opt;
$('hintMeta').textContent=T.hint;
$('tipNote').textContent=T.tip;
$('genBtn').textContent=T.gen;
$('clearBtn').textContent=T.clear;
$('chipFuture').textContent=T.future;
$('chipPast').textContent=T.past;
$('chipWhatIf').textContent=T.whatif;
$('chipWTF').textContent=T.wtf;
$('savedTitle').textContent=T.saved;
$('histTitle').textContent=T.hist;
$('clearSavedBtn').textContent=T.svuotaS;
$('clearHistoryBtn').textContent=T.svuotaH;
$('langBtn').textContent=lang.toUpperCase();

/* ===== nav ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{LS.setItem('lang',lang==='it'?'en':'it');location.reload();};

/* ===== chips suggerimenti ===== */
const sugg=[T.chip1,T.chip2,T.chip3,T.chip4];
const sugWrap=$('suggestChips');
sugg.forEach(s=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=s;
  b.onclick=()=>{const i=$('extraInput'); i.value= i.value? (i.value+' • '+s) : s; i.focus();};
  sugWrap.appendChild(b);
});

/* ===== style chips ===== */
function refreshStyleChips(){
  document.querySelectorAll('#styleChips .chip').forEach(el=>el.classList.toggle('sel', el.dataset.style===currentStyle));
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
}
document.getElementById('styleChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle=b.dataset.style; prefs.stile=currentStyle; LS.setItem('whatif_prefs',JSON.stringify(prefs));
  refreshStyleChips();
});
refreshStyleChips();

/* ===== period chips ===== */
let currentPeriod = (prefs.period||'future');
function refreshPeriod(){
  document.querySelectorAll('#periodChips .chip').forEach(el=>el.classList.toggle('sel', el.dataset.period===currentPeriod));
}
document.getElementById('periodChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentPeriod=b.dataset.period; prefs.period=currentPeriod; LS.setItem('whatif_prefs',JSON.stringify(prefs));
  refreshPeriod();
});
refreshPeriod();

/* ===== credits ===== */
const DAILY_FREE=3;
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
function ensureDay(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  const t=todayStr();
  if(c.date!==t){c.date=t;c.used=0;writeJSON('whatif_credits',c);}
}
function renderBadges(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  const left = c.pro ? '∞' : Math.max(0, DAILY_FREE-(c.used||0));
  $('freeBadge').textContent=T.free(left,DAILY_FREE,!!c.pro);
  $('freeBadge').classList.toggle('pro', !!c.pro);
}
ensureDay(); renderBadges();

/* gestures: long press reset, triple click Pro */
(function adminGestures(){
  const b=$('freeBadge'); if(!b) return;
  let pressTimer=null;
  b.addEventListener('pointerdown',()=>{ clearTimeout(pressTimer); pressTimer=setTimeout(()=>{
    const c=readJSON('whatif_credits',{}); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderBadges();
    alert(lang==='en'?'Credits reset for today ✅':'Crediti di oggi azzerati ✅');
  },1500);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(pressTimer)));
  let clicks=0,t=null;
  b.addEventListener('click',()=>{ clearTimeout(t); clicks++; t=setTimeout(()=>{
    if(clicks>=3){ const c=readJSON('whatif_credits',{}); c.pro=!c.pro; writeJSON('whatif_credits',c); renderBadges(); alert(c.pro?'Pro: ON':'Pro: OFF'); }
    clicks=0;
  },250);});
})();

/* ===== clear ===== */
$('clearBtn').onclick=()=>{ $('qInput').value=''; $('extraInput').value=''; };

/* ===== generate ===== */
$('genBtn').onclick=()=>{
  const domanda=$('qInput').value.trim();
  if(!domanda){ $('qInput').focus(); return; }
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  if(!c.pro && (c.used||0)>=DAILY_FREE){ alert(T.alertNoCredits); return; }
  if(!c.pro){ c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderBadges(); }

  writeJSON('whatif_session',{
    domanda, extra: $('extraInput').value.trim()||'',
    stile: currentStyle, periodo: currentPeriod, lang
  });
  // pulisco resume-id (forzo generazione)
  LS.removeItem('resume_id');
  location.href='fifth.html';
};

/* ===== saved + history ===== */
function fmtDate(ts){const d=new Date(ts);return d.toLocaleString(lang==='en'?'en-GB':'it-IT',{hour12:false});}
function drawList(title, arr, where, type){
  const box=$(where); box.innerHTML='';
  if(!arr.length){ box.innerHTML='<div class="meta">—</div>'; return; }
  arr.forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const right=document.createElement('div');
    if(type==='saved'){
      const use=document.createElement('button'); use.className='use'; use.textContent= lang==='en'?'Use':'Usa';
      use.onclick=()=>{ $('qInput').value=item.domanda||''; currentStyle=item.stile||'whatif'; refreshStyleChips(); window.scrollTo({top:0,behavior:'smooth'}); };
      right.appendChild(use);
    }else{ // history
      const play=document.createElement('button'); play.className='play'; play.textContent='▶';
      play.onclick=()=>{ LS.setItem('resume_id', item.id); location.href='fifth.html'; };
      right.appendChild(play);
    }
    row.appendChild(left); row.appendChild(right); box.appendChild(row);
  });
}
function renderLists(){
  const hist=readJSON('cronologia',[]);
  const saved=readJSON('salvate',[]);
  drawList(T.hist,hist,'storyList','hist');
  drawList(T.saved,saved,'savedBody','saved');
}
renderLists();

$('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderLists(); };
$('clearSavedBtn').onclick=()=>{ LS.removeItem('salvate'); renderLists(); };

/* collapsible */
function makeCollapsible(cardId){
  const card=$(cardId);
  const caret=card.querySelector('.caret');
  card.querySelector('.header').addEventListener('click',()=>{
    card.classList.toggle('collapsed');
    caret.textContent = card.classList.contains('collapsed')?'▾':'▴';
  });
}
makeCollapsible('savedCard');
makeCollapsible('historyCard');
</script>
</body>
</html>
