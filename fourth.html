<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f — Risultato</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    :root{--tq:#21d4c8;--bg:#0a0f14;--panel:#121a21;--muted:#8aa1b4;}
    body{margin:0;background:var(--bg);color:#eaf3fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:22px}
    .title{font-weight:900;font-size:clamp(24px,4.2vw,40px)}
    .k{color:var(--tq)}
    .card{background:var(--panel);border:1px solid #17222b;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 22px rgba(0,0,0,.25)}
    .muted{color:var(--muted)}
    .btn{background:linear-gradient(90deg,#22d3ee,#34d399);color:#05212a;border:0;border-radius:16px;padding:12px 16px;font-weight:800}
    .ghost{background:#0f161d;color:#cfe6f9;border:1px solid #20303c}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .like{display:inline-flex;align-items:center;gap:8px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .prob{color:#a5f3fc}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="muted"><a class="muted" href="./third.html">« Torna indietro</a></p>
    <h1 id="tit" class="title">Risultato</h1>

    <section id="out" class="card">
      <p class="muted">Carico il tuo What?f…</p>
    </section>

    <section class="card">
      <div class="row">
        <button id="likeBtn" class="btn like" title="Mi piace">
          ❤️ <span id="likeCount">0</span>
        </button>
        <button id="shareBtn" class="btn">Condividi</button>
        <a href="./third.html" class="btn ghost">Nuova domanda</a>
        <a href="./index.html" class="btn ghost">Home</a>
      </div>
    </section>

    <p class="muted mono" id="meta"></p>
  </div>

  <script>
    // Recupera il risultato dalla sessione
    const raw = sessionStorage.getItem('lastResult');
    const container = document.getElementById('out');
    const title = document.getElementById('tit');
    const meta = document.getElementById('meta');

    if(!raw){
      container.innerHTML = '<p>Nessun dato: torna indietro e compila la simulazione.</p>';
    } else {
      const {input, output} = JSON.parse(raw);

      // Titolo scenico
      const niceScenario = input.scenario==='wtf' ? 'What a F?!' : 'Sliding Doors';
      const niceTime = input.time==='past' ? 'Passato' : 'Futuro';
      title.innerHTML = `<span class="k">${niceScenario}</span> · ${niceTime}`;

      // Testo risposta
      const text = (output && (output.answer || output.text || output.message)) || 'Nessuna risposta.';
      // Probabilità opzionale
      const prob = output && (output.probability || output.prob || output.score);

      container.innerHTML = `
        <h2 class="k">What?f</h2>
        <p style="white-space:pre-wrap; line-height:1.6">${text}</p>
        ${prob ? `<p class="prob">Probabilità stimata: <strong>${Math.round(prob*100)||prob}%</strong></p>`:''}
      `;

      meta.textContent = `Domanda: "${input.prompt}" · Luogo: ${input.place||'—'} · Quando: ${input.when||'—'}`;
    }

    // Like locale
    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');
    const LIKE_KEY = 'wf_likes';
    let likes = Number(localStorage.getItem(LIKE_KEY) || '0');
    likeCount.textContent = likes;
    likeBtn.addEventListener('click', ()=>{
      likes++; localStorage.setItem(LIKE_KEY, String(likes));
      likeCount.textContent = likes;
      likeBtn.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}], {duration:220});
    });

    // Condivisione
    document.getElementById('shareBtn').addEventListener('click', async ()=>{
      const shareText = `${title.textContent}\n\n${container.innerText.slice(0,220)}…\n\nProva anche tu: ${location.origin}${location.pathname.replace('fourth.html','')}`;
      if(navigator.share){
        try{ await navigator.share({title:'Il mio What?f', text:shareText}); } catch(e){}
      } else {
        await navigator.clipboard.writeText(shareText);
        alert('Testo copiato! Incollalo dove vuoi 🤝');
      }
    });
  </script>
</body>
</html>
