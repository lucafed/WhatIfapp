<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f - Risultato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page fourth">

  <div class="container">
    <h1>✨ Il tuo What?f ✨</h1>

    <!-- Qui appaiono le domande aggiuntive della AI -->
    <div id="followUp" class="followup-section"></div>

    <!-- Risposta finale -->
    <div id="aiResponse" class="response-box">
      <p>Sto preparando la tua risposta...</p>
    </div>

    <!-- Pulsanti -->
    <div class="actions">
      <button onclick="location.href='third.html'">🔙 Torna indietro</button>
      <button onclick="location.href='index.html'">🏠 Home</button>
      <button id="shareBtn">📤 Condividi</button>
    </div>
  </div>

  <script>
  async function callAI(step, payload) {
    try {
      const res = await fetch("/.netlify/functions/ask", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ step, ...payload })
      });

      const data = await res.json();

      if(!res.ok || !data.ok){
        // Mostra errore reale a schermo
        document.getElementById("aiResponse").innerHTML = 
          "<b>Errore AI ("+step+"):</b><br>"+(data.error || res.status+" "+res.statusText);
        return null;
      }

      return data;
    } catch(err){
      document.getElementById("aiResponse").innerHTML = 
        "<b>Catch error:</b><br>"+err.message;
      return null;
    }
  }

  // Recupera i dati salvati in sessione
  const last = JSON.parse(sessionStorage.getItem("lastRun") || "{}");
  if(last.input){
    // Chiede prima follow-up
    callAI("followups", last.input).then(data => {
      if(data && data.questions){
        document.getElementById("followUp").innerHTML = data.questions
          .map(q => `<label>${q}<br><input type="text"></label>`)
          .join("<br>");
      }
    });

    // Poi risposta finale
    callAI("final", last.input).then(data => {
      if(data && data.output){
        document.getElementById("aiResponse").innerHTML = 
          "<p>"+data.output+"</p>";
      }
    });
  }

  // Pulsante Condividi
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const text = document.getElementById("aiResponse").innerText;
    if(navigator.share){
      await navigator.share({ title: "Il mio What?f", text });
    } else {
      await navigator.clipboard.writeText(text);
      alert("Testo copiato! Incollalo dove vuoi 🚀");
    }
  });
  </script>

</body>
</html>
