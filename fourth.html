<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Chiedi</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
  :root{--bg:#0B0B0C;--bg2:#101414;--fg:#fff;--muted:#A0B2BA;--card:#141C22;--line:rgba(255,255,255,.12);--acc:#1C57A0;--acc2:#FFEC01;--chip:#121A26;--ink:#0A0E12;}
  html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:980px;margin:auto;padding:18px}
  .card{background:rgba(20,28,34,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
  h1{margin:8px 0 4px;color:var(--acc2)}
  label{display:block;margin:8px 0 6px;font-weight:700;color:#E9F2FA}
  input,textarea,select{width:100%;background:var(--chip);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:#EAF3EE;padding:12px 14px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none}
  .qmini{display:grid;gap:10px}
  .qpair{display:grid;grid-template-columns:1fr;gap:6px}
  small.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Formula la tua domanda</h1>
  <div class="card">
    <label for="domanda">Domanda (es. “E se comprassi una moto?”)</label>
    <textarea id="domanda" rows="3" placeholder="Scrivi la tua sliding door qui..."></textarea>

    <div class="row" style="margin-top:12px">
      <div>
        <label>Periodo</label>
        <div class="chips" id="chipsPeriodo">
          <button class="chip sel" data-v="future">Futuro</button>
          <button class="chip" data-v="past">Passato</button>
        </div>
      </div>
      <div>
        <label>Stile</label>
        <div class="chips" id="chipsStile">
          <button class="chip sel" data-v="whatif">What?f (empatico)</button>
          <button class="chip" data-v="wtf">What the F (da bar)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">Micro-domande su di te</h3>
    <small class="muted">Servono a far sembrare la risposta “ti conosco davvero”.</small>
    <div class="qmini" id="profileQs"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">Micro-domande sulla tua domanda</h3>
    <small class="muted">Generate automaticamente in base a ciò che hai chiesto.</small>
    <div class="qmini" id="contextQs"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="annullaBtn">Annulla</button>
      <button class="btn primary" id="vaiBtn">Vai al risultato</button>
    </div>
  </div>
</main>

<script>
const $ = (id)=>document.getElementById(id);
const LS = localStorage;

function savePrefs(p){ LS.setItem('whatif_prefs', JSON.stringify(p)); }
function readPrefs(){ try{ return JSON.parse(LS.getItem('whatif_prefs')||'{}'); }catch{ return {}; } }

let periodo = 'future';
let stile = 'whatif';

document.querySelectorAll('#chipsPeriodo .chip').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#chipsPeriodo .chip').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); periodo = b.dataset.v;
  });
});
document.querySelectorAll('#chipsStile .chip').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#chipsStile .chip').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); stile = b.dataset.v;
  });
});

/* ===== Profile micro questions (sempre) ===== */
const PROFILE_SCHEMA = [
  {id:'name', label:'Nome (come vuoi che ti chiami)', ph:'es. Luca'},
  {id:'city_now', label:'Dove vivi ora?', ph:'es. Verona'},
  {id:'work_role', label:'Cosa fai di lavoro (breve)?', ph:'es. marketing, developer, barista'},
  {id:'goal', label:'Obiettivo dei prossimi 3 mesi', ph:'es. più tempo libero, cambiare città'},
];
function renderProfileQs(){
  const wrap = $('profileQs'); wrap.innerHTML='';
  const data = readProfile();
  PROFILE_SCHEMA.forEach(q=>{
    const div = document.createElement('div'); div.className='qpair';
    div.innerHTML = `<label for="p_${q.id}">${q.label}</label>
      <input id="p_${q.id}" placeholder="${q.ph}" value="${(data[q.id]||'').replace(/"/g,'&quot;')}">`;
    wrap.appendChild(div);
  });
}
function readProfile(){ try{ return JSON.parse(LS.getItem('whatif_profile')||'{}'); }catch{ return {}; } }
function writeProfile(p){ LS.setItem('whatif_profile', JSON.stringify(p)); }

/* ===== Context micro questions (auto dalla domanda) ===== */
function extractKeywords(s){
  s = (s||'').toLowerCase();
  const words = s.replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>3);
  const counts={}; words.forEach(w=>counts[w]=(counts[w]||0)+1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
}
function topicFromQ(q){
  const s=(q||'').toLowerCase();
  if (/(moto|motor(e|bike)|scooter|vespa)/.test(s)) return 'moto';
  if (/(aquila|l\'aquila|lugano|milano|roma|verona|londra|zurigo)/.test(s)) return 'città';
  if (/(trasferi|trasloco|vivere a|relocat|move)/.test(s)) return 'trasferimento';
  if (/(lavor|job|azienda|ufficio|work)/.test(s)) return 'lavoro';
  return 'generale';
}
function buildContextQs(q, per){
  const kw = extractKeywords(q);
  const first = kw[0] || 'il tema';
  const L=(id,label,ph)=>({id,label,ph});
  if (per==='past'){
    return [
      L('pivot_year', 'In che anno cambiava la rotta?', 'es. 2015 / 2010'),
      L('then_context', 'Dove e con chi eri allora?', 'città, squadra, famiglia'),
      L('signal_past', 'Segnale che ti diceva “ha funzionato”?', 'persona, numero, risultato'),
    ];
  }
  const t = topicFromQ(q);
  if (t==='moto'){
    return [
      L('timing', 'Quando la prenderesti davvero?', 'questo mese / 3–6 mesi'),
      L('use', 'Uso principale?', 'casa-lavoro / weekend / viaggi'),
      L('budget', 'Tetto mensile realistico', '€ assicurazione + carburante'),
    ];
  }
  if (t==='città' || t==='trasferimento'){
    return [
      L('window', 'Finestra decisionale reale', 'entro 3 mesi / 6–12 mesi'),
      L('anchor', 'Cosa ti tiene dove sei ora?', 'famiglia / lavoro / costi'),
      L('indicator', 'Segnale che dice “è giusto”', 'sonno/energia/callback'),
    ];
  }
  if (t==='lavoro'){
    return [
      L('why', 'Il tuo perché oggi', 'impatto / crescita / serenità'),
      L('option', 'Opzioni sul tavolo', 'resto / cambio team / esco'),
      L('limit', 'Vincolo concreto', 'budget / tempo / persone'),
    ];
  }
  return [
    L('time_window','Finestra decisionale reale','questo mese / 3–6 / 12'),
    L('success_indicator',`Un indicatore di successo su ${first}`,'€ risparmiati, ore, primo cliente'),
    L('real_constraint','Vincolo concreto da non ignorare','budget, tempo, energia'),
  ];
}
function renderContextQs(){
  const q = $('domanda').value.trim();
  const qs = buildContextQs(q, periodo);
  const wrap = $('contextQs'); wrap.innerHTML='';
  qs.forEach((x,i)=>{
    const div = document.createElement('div'); div.className='qpair';
    div.innerHTML = `<label for="c_${x.id}">${x.label}</label>
      <input id="c_${x.id}" placeholder="${x.ph.replace(/"/g,'&quot;')}">`;
    wrap.appendChild(div);
  });
}

$('domanda').addEventListener('input', ()=>renderContextQs());

/* ===== Go / Save ===== */
$('annullaBtn').addEventListener('click', ()=> history.back());
$('vaiBtn').addEventListener('click', ()=>{
  const domanda = $('domanda').value.trim();
  if (!domanda) { alert('Scrivi una domanda.'); return; }

  // salva domanda + prefs
  const prefs = readPrefs();
  prefs.periodo = periodo;
  prefs.stile   = stile;
  savePrefs(prefs);
  localStorage.setItem('domanda', domanda);

  // salva profilo
  const prof = readProfile();
  PROFILE_SCHEMA.forEach(q=>{
    const v = (document.getElementById('p_'+q.id)?.value||'').trim();
    if (v) prof[q.id]=v;
  });
  writeProfile(prof);

  // salva micro (context) separato
  const micro = {};
  document.querySelectorAll('#contextQs input').forEach(i=>{
    const id = i.id.replace(/^c_/, '');
    const v = (i.value||'').trim(); if(v) micro[id]=v;
  });
  const old = JSON.parse(localStorage.getItem('whatif_micro')||'{}');
  localStorage.setItem('whatif_micro', JSON.stringify({...old, ...micro}));

  // piccoli tag auto
  const tags = Array.from(new Set(extractKeywords(domanda)));
  localStorage.setItem('whatif_tags', JSON.stringify(tags));

  location.href='fifth.html';
});

/* boot */
renderProfileQs();
renderContextQs();
</script>
</body>
</html>
