<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Domanda</title>
  <meta name="theme-color" content="#0A0F14"/>
  <style>
    /* ===== THEME ===== */
    :root{ --bg:#0C0F14; --bg2:#0E1724; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#001f26; --chip:#0f1820; --line:#1b2a34; }
    html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }
    html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }
    /* Topbar */
    .topbar{
      position:sticky; top:0; z-index:2;
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; padding:8px 10px;
      background:rgba(10,15,20,.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)
    }
    .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
    .btn[disabled]{opacity:.4;cursor:not-allowed}
    .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
    .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
    select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

    /* Layout */
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .label{color:var(--accent2);font-weight:800;margin:0 0 8px}

    /* Cards & chips */
    .card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);
      border-radius:16px;padding:16px;margin:10px 0}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
    .chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

    /* Input */
    .input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
    .center{max-width:760px;margin:0 auto}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .small{font-size:12px;color:var(--muted)}

    /* Collapsible */
    .toggle{cursor:pointer;user-select:none}
    .collapsed>.body{display:none}
    .list{display:flex;flex-direction:column;gap:10px}
    .story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);
      border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
    .play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
    .meta{font-size:12px;color:var(--muted)}

    /* Slot fx */
    #qInput.slotting{filter:contrast(1.2) saturate(1.1); animation:slotFlash .12s linear infinite}
    @keyframes slotFlash{0%{box-shadow:0 0 0 rgba(255,236,1,.0)}50%{box-shadow:0 0 18px rgba(255,236,1,.2)}100%{box-shadow:0 0 0 rgba(255,255,255,.0)}}
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge">—</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option>
      </select>
      <button class="btn" id="resetBtn" type="button" title="Reset">♻️</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- STILE + PERIODO -->
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
          <div class="chips" id="styleChips">
            <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
            <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
          </div>
          <div class="chips" id="periodoChips">
            <button class="chip" data-periodo="future" id="chipFuture">Futuro</button>
            <button class="chip" data-periodo="past"   id="chipPast">Passato</button>
          </div>
        </div>
      </div>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>
        <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>

        <!-- Istruzione breve -->
        <div class="small" id="qHelp" style="margin-top:8px">
          Scrivi obiettivo + contesto in 1 riga. Aggiungi vincoli o orizzonte (es. 30 giorni).
        </div>

        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button" title="Slot assurdo">🎲 Sorprendimi</button>
          </div>
          <div class="row">
            <button class="btn" id="saveBtn" type="button">⭐ Salva</button>
            <button class="btn" id="clearBtn" type="button">Svuota</button>
          </div>
        </div>
      </div>

      <!-- SPUNTI (solo realistici) -->
      <div class="card center collapsed" id="hintsCard">
        <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
          <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
        </div>
        <div class="body" id="hintsBody" style="margin-top:8px">
          <div class="chips" id="hintsChips"></div>
          <div class="small" id="hintsNote" style="margin-top:8px"></div>
        </div>
      </div>

      <!-- SALVATI -->
      <div class="card center collapsed" id="savedCard">
        <div class="row toggle" id="savedHeader" style="justify-content:space-between">
          <div class="label" id="nextLabel">▶ Domande salvate</div>
          <button class="btn" id="clearSavedBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
      </div>

      <!-- CRONOLOGIA -->
      <div class="card center collapsed" id="histCard">
        <div class="row toggle" id="histHeader" style="justify-content:space-between">
          <div class="label" id="storiesLabel">▶ Cronologia</div>
          <button class="btn" id="clearHistoryBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body"><div id="storyList" class="list"></div></div>
      </div>
    </div>
  </main>

  <!-- 🔥 JS CON FIRESTORE CREDITI 🔥 -->
  <script type="module">
    // === IMPORT FIREBASE (init centralizzato) + AUTH EVENTS ===
    import { auth } from "./firebase.init.js";
    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    // === IMPORT WALLET FIRESTORE ===
    import {
      bootCredits,
      getBalance,
      consumeCredit
    } from "./store/credits.js";

    /* ===== STORAGE/UTIL ===== */
    const LS = localStorage, $ = id => document.getElementById(id);
    const readJSON = (k, def) => { try { return JSON.parse(LS.getItem(k) || JSON.stringify(def)); } catch { return def; } };
    const writeJSON = (k, v) => LS.setItem(k, JSON.stringify(v));
    const todayISO = () => new Date().toISOString().slice(0,10);

    /* ===== ADMIN FLAG (∞ crediti se token presente) ===== */
    const IS_ADMIN = !!LS.getItem('admin_token');

    /* ===== LANG ===== */
    const SUPPORTED_LANGS=["it","en","es","fr","de"];
    let lang=(LS.getItem('lang')||'it').toLowerCase();
    if(!SUPPORTED_LANGS.includes(lang)) lang='it';
    document.documentElement.lang=lang; $('langSelect').value=lang;
    $('langSelect').onchange=()=>{ const v=$('langSelect').value; LS.setItem('lang',v); location.reload(); };

    const I18N={
      it:{title:"Imposta la tua domanda", yourq:"E se…", ph:"E se…",
        help:"Scrivi obiettivo + contesto in 1 riga. Aggiungi vincoli o orizzonte (es. 30 giorni).",
        gen:"✨ Genera risposta", clear:"Svuota",
        surprise:"Sorprendimi (assurdo)", spins:"Tiri rimasti oggi", noSpins:"Tiri esauriti per oggi.",
        saved:"▶ Domande salvate", stories:"▶ Cronologia",
        styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Passato",
        hintsTitle:"▶ Spunti rapidi “E se…”",
        hintsNote:"Spunti = idee realistiche (cambiano ogni giorno e si personalizzano col tuo uso). “Sorprendimi” propone solo idee assurde (stile & tempo casuali).",
        credits:"Crediti", emptyNext:"— Nessuna domanda salvata.", emptyHist:"— Nessuna storia.", use:"Usa",
        save:"Salva", clearSaved:"🗑️ Svuota", clearHist:"🗑️ Svuota",
        noCredits:"Hai finito i crediti. Accedi o ricarica per continuare."},
      en:{title:"Set your question", yourq:"What if…", ph:"What if…",
        help:"Write goal + context in one line. Add constraints or horizon (e.g. 30 days).",
        gen:"✨ Generate answer", clear:"Clear",
        surprise:"Surprise me (absurd)", spins:"Spins left today", noSpins:"No spins left for today.",
        saved:"▶ Saved questions", stories:"▶ History",
        styleWF:"What if", styleWTF:"What the F", fut:"Future", past:"Past",
        hintsTitle:"▶ Quick “What if…”",
        hintsNote:"Hints = realistic ideas (refresh daily, personalized as you use it). “Surprise me” shows absurd ideas only (random style & time).",
        credits:"Credits", emptyNext:"— No saved questions.", emptyHist:"— No history.", use:"Use",
        save:"Save", clearSaved:"🗑️ Clear", clearHist:"🗑️ Clear",
        noCredits:"You’ve run out of credits. Please log in or top up."},
      es:{title:"Configura tu pregunta", yourq:"¿Y si…?", ph:"¿Y si…?",
        help:"Escribe objetivo y contexto en una línea. Añade límites u horizonte (p. ej., 30 días).",
        gen:"✨ Generar respuesta", clear:"Limpiar",
        surprise:"Sorpréndeme (absurdo)", spins:"Tiradas restantes hoy", noSpins:"Sin tiradas por hoy.",
        saved:"▶ Preguntas guardadas", stories:"▶ Historial",
        styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Pasado",
        hintsTitle:"▶ Ideas rápidas «¿Y si…?»",
        hintsNote:"Ideas realistas (se actualizan a diario y se personalizan). «Sorpréndeme» muestra ideas absurdas.",
        credits:"Créditos", emptyNext:"— No hay preguntas guardadas.", emptyHist:"— Sin historial.", use:"Usar",
        save:"Guardar", clearSaved:"🗑️ Vaciar", clearHist:"🗑️ Vaciar",
        noCredits:"Te has quedado sin créditos. Inicia sesión o recarga."},
      fr:{title:"Définis ta question", yourq:"Et si…", ph:"Et si…",
        help:"Écris objectif + contexte en une ligne. Ajoute contraintes ou horizon (ex. 30 jours).",
        gen:"✨ Générer la réponse", clear:"Effacer",
        surprise:"Surprends-moi (absurde)", spins:"Tirs restants aujourd’hui", noSpins:"Plus de tirs pour aujourd’hui.",
        saved:"▶ Questions enregistrées", stories:"▶ Historique",
        styleWF:"What if", styleWTF:"What the F", fut:"Futur", past:"Passé",
        hintsTitle:"▶ Idées rapides « Et si… »",
        hintsNote:"Idées réalistes (quotidiennes et personnalisées). « Surprends-moi » = idées absurdes.",
        credits:"Crédits", emptyNext:"— Aucune question enregistrée.", emptyHist:"— Aucun historique.", use:"Utiliser",
        save:"Enregistrer", clearSaved:"🗑️ Vider", clearHist:"🗑️ Vider",
        noCredits:"Tu n’as plus de crédits. Connecte-toi ou recharge."},
      de:{title:"Stelle deine Frage ein", yourq:"Was wäre, wenn…", ph:"Was wäre, wenn…",
        help:"Ziel + Kontext in einer Zeile. Füge Einschränkungen/Horizont hinzu (z. B. 30 Tage).",
        gen:"✨ Antwort erzeugen", clear:"Leeren",
        surprise:"Überrasche mich (absurd)", spins:"Verbleibende Spins heute", noSpins:"Heute keine Spins mehr.",
        saved:"▶ Gespeicherte Fragen", stories:"▶ Verlauf",
        styleWF:"What if", styleWTF:"What the F", fut:"Zukunft", past:"Vergangenheit",
        hintsTitle:"▶ Schnelle „Was wäre, wenn…“-Ideen",
        hintsNote:"Realistische Ideen (täglich, personalisiert). „Überrasche mich“ = absurde Ideen.",
        credits:"Credits", emptyNext:"— Keine gespeicherten Fragen.", emptyHist:"— Kein Verlauf.", use:"Verwenden",
        save:"Speichern", clearSaved:"🗑️ Leeren", clearHist:"🗑️ Leeren",
        noCredits:"Du hast keine Credits mehr. Bitte einloggen oder aufladen."}
    };

    /* Apply texts */
    (function apply(){
      const T=I18N[lang]||I18N.it;
      $('titleH1').textContent=T.title;
      $('qLabel').textContent=T.yourq;
      $('qInput').placeholder=T.ph;
      $('qHelp').textContent=T.help;
      $('goBtn').textContent=T.gen;
      $('clearBtn').textContent=T.clear;
      $('surpriseBtn').textContent='🎲 '+T.surprise;
      $('nextLabel').textContent=T.saved;
      $('storiesLabel').textContent=T.stories;
      $('hintsTitle').textContent=T.hintsTitle;
      $('hintsNote').textContent=T.hintsNote;
      $('chipWhatIf').textContent=T.styleWF; $('chipWTF').textContent=T.styleWTF;
      $('chipFuture').textContent=T.fut; $('chipPast').textContent=T.past;
      $('saveBtn').textContent='⭐ '+T.save;
      $('clearSavedBtn').textContent=T.clearSaved;
      $('clearHistoryBtn').textContent=T.clearHist;
    })();

    /* ===== PREFS / THEME ===== */
    const readJSON = (k, def) => { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(def)); } catch { return def; } };
    const writeJSON = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    let prefs=readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

    /* ===== FIREBASE AUTH + CREDITI (FIRESTORE) ===== */
    let currentUser = null;
    let currentBalance = 0;
    const IS_ADMIN = !!localStorage.getItem('admin_token');

    function renderCredits(){
      const T = I18N[lang] || I18N.it;
      const el = $('freeBadge');

      if (IS_ADMIN) {
        if (el) el.textContent = `${T.credits}: ∞ (admin)`;
        const goBtn = $('goBtn');
        const surpriseBtn = $('surpriseBtn');
        if (goBtn) goBtn.disabled = false;
        if (surpriseBtn) surpriseBtn.disabled = false;
        return;
      }

      const txt = `${T.credits}: ${currentBalance}`;
      if (el && el.textContent !== txt) el.textContent = txt;

      const canUse = currentBalance > 0;
      const goBtn = $('goBtn');
      const surpriseBtn = $('surpriseBtn');
      if (goBtn) goBtn.disabled = !canUse;
      if (surpriseBtn) surpriseBtn.disabled = !canUse;
    }

    async function syncCreditsFromServer(){
      if (IS_ADMIN) {
        renderCredits();
        return;
      }
      if (!auth.currentUser) {
        currentBalance = 0;
        renderCredits();
        return;
      }
      try {
        await bootCredits();              // crea doc + reset se nuovo giorno
        currentBalance = await getBalance();
      } catch (e) {
        console.error("syncCredits error:", e);
      }
      renderCredits();
    }

    onAuthStateChanged(auth, async (user)=>{
      currentUser = user;
      if (!user) {
        currentBalance = 0;
        renderCredits();
        return;
      }
      await syncCreditsFromServer();
    });

    window.addEventListener('focus', ()=>{ syncCreditsFromServer(); });
    window.addEventListener('pageshow', ()=>{ syncCreditsFromServer(); });

    /* ===== BADGE STILE/PERIODO ===== */
    function renderBadges(){
      const T=I18N[lang]||I18N.it;
      $('styleBadge').textContent='🎭 '+(prefs.stile==='wtf'?T.styleWTF:T.styleWF);
      $('periodoBadge').textContent='🕰️ '+(prefs.periodo==='past'?T.past:T.fut);
      document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
      document.querySelectorAll('#periodoChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.periodo===prefs.periodo));
    }
    renderBadges();

    $('styleChips').addEventListener('click',e=>{
      const b=e.target.closest('.chip'); if(!b) return;
      prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs);
      document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
      renderBadges();
    });
    $('periodoChips').addEventListener('click',e=>{
      const b=e.target.closest('.chip'); if(!b) return;
      prefs.periodo=b.dataset.periodo; writeJSON('whatif_prefs',prefs);
      renderBadges();
    });

    /* ===== NAV ===== */
    $('homeBtn').onclick=()=>location.href='index.html';
    $('backBtn').onclick=()=>{ if(history.length>1) history.back(); else location.href='index.html'; };

    /* ✅ RESET (preserva solo poche chiavi legacy + admin) */
    $('resetBtn').onclick=()=>{
      const PRESERVE = ['whatif_wallet','whatif_wallet_sync','admin_token','lang'];
      const keep = Object.fromEntries(PRESERVE.map(k => [k, localStorage.getItem(k)]));
      [
        'whatif_prefs','next_prompts','cronologia','replay_story',
        'surprise_recent','absurd_prompt','surprise_mode','domanda'
      ].forEach(k => localStorage.removeItem(k));
      Object.entries(keep).forEach(([k,v])=>{ if(v!==null) localStorage.setItem(k,v); });
      location.href='index.html';
    };

    /* ===== STATO "ASSURDA" ===== */
    let isAbsurd=false;
    localStorage.setItem('absurd_prompt','0');
    localStorage.setItem('surprise_mode','0');

    /* ===== HINTS, SAVED, HISTORY ===== */
    // (qui puoi riusare esattamente il blocco che avevi – lo lascio uguale al tuo
    // per non allungare ancora di più: non tocca i crediti e funziona già.)

    // ... (PUOI INCOLLARE QUI TUTTO IL BLOCCO HINTS / ABS / personalizzazione
    //  identico a quello che avevi, perché non influisce sui crediti) ...

    // Per brevità, non lo duplico ancora: tu prendi il tuo blocco HINTS/ABS/renderHints
    // e lo incolli dopo questo commento, prima delle funzioni di history/saved.

    /* ===== SUBMIT / GUARD CREDITS ===== */
    async function guardCredits(){
      const T=I18N[lang]||I18N.it;
      if (!auth.currentUser) {
        alert("Per usare i crediti devi essere loggato.");
        return false;
      }
      if (IS_ADMIN) {
        return true;
      }
      if (currentBalance <= 0) {
        alert(T.noCredits);
        return false;
      }
      return true;
    }

    async function trySubmit(){
      const okGuard = await guardCredits();
      if (!okGuard) return;

      if (!IS_ADMIN) {
        try{
          const ok = await consumeCredit();
          if (!ok){
            const T=I18N[lang]||I18N.it;
            alert(T.noCredits);
            await syncCreditsFromServer();
            return;
          }
          currentBalance = await getBalance().catch(()=>currentBalance);
          renderCredits();
        }catch(err){
          console.error("consumeCredit error:", err);
          alert("Errore nell'utilizzo dei crediti. Riprova.");
          return;
        }
      }

      const domanda=($('qInput').value||'').trim();
      if(!domanda) { $('qInput').focus(); return; }
      const req={
        domanda,
        stile:prefs.stile,
        lang,
        extra:'',
        fantasy_mode:false,
        periodo:prefs.periodo,
        absurd:isAbsurd,
        surprise:isAbsurd,
        source: isAbsurd ? 'surprise' : 'manual',
        micro:{ surprise:isAbsurd, source:isAbsurd?'surprise':'manual' }
      };
      writeJSON('whatif_request',req);
      localStorage.setItem('domanda',domanda);
      localStorage.setItem('absurd_prompt', isAbsurd ? '1' : '0');
      localStorage.setItem('surprise_mode', isAbsurd ? '1' : '0');

      const arr=readJSON('cronologia',[]);
      arr.push({domanda, stile:prefs.stile, ts:Date.now(), risposta:''});
      writeJSON('cronologia', arr.slice(-100));

      location.href = isAbsurd ? 'fifth.html?src=surprise' : 'fifth.html';
    }
    $('goBtn').onclick=()=>{ trySubmit(); };

    $('qInput').addEventListener('input', ()=>{
      isAbsurd=false;
      localStorage.setItem('absurd_prompt','0');
      localStorage.setItem('surprise_mode','0');
    });
    $('clearBtn').onclick=()=>{
      $('qInput').value='';
      isAbsurd=false;
      localStorage.setItem('absurd_prompt','0');
      localStorage.setItem('surprise_mode','0');
      $('qInput').focus();
    };
    $('qInput').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

    // prima render (in attesa di onAuthStateChanged)
    renderCredits();
  </script>
</body>
</html>
