<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }
html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}

/* Topbar fissa + compensazione dinamica */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.96),rgba(10,15,20,.75));backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
/* Buttons/badges */
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;border:1px dashed var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

/* Cards & chips */
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Input */
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.warn{margin-top:8px;color:#ffb4b4;font-size:13px}

/* Collapsible */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.meta{font-size:12px;color:var(--muted)}

/* Micro UI AI */
.airow{display:flex;align-items:center;gap:10px;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#6a6d70;border:1px solid #3c4043;display:inline-block}
.dot.ok{background:#1fb57a;border-color:#0d6a47}
.dot.err{background:#b94a48;border-color:#5f2a29}
.kv{display:inline-flex;gap:6px;align-items:center}
.mini{font-size:11px;color:var(--muted)}

footer{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <!-- TOPBAR -->
  <div class="topbar" id="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
      <button class="btn ghost" id="resetBtn" type="button" title="Riparti da zero">⟲ Reset</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge">—</span>
      <span class="badge" id="proBadge">FREE</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option>
      </select>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- STILE + PERIODO -->
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
          <div class="chips" id="styleChips">
            <button class="chip" data-style="whatif" id="chipWhatIf" type="button">What if</button>
            <button class="chip" data-style="wtf" id="chipWTF" type="button">What the F</button>
          </div>
          <div class="chips" id="periodoChips">
            <button class="chip" data-periodo="future" id="chipFuture" type="button">Futuro</button>
            <button class="chip" data-periodo="past" id="chipPast" type="button">Passato</button>
          </div>
        </div>
      </div>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>
        <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
        <div id="qWarning" class="warn" style="display:none"></div>

        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row" style="gap:10px">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button">🎲 Sorprendimi</button>
          </div>
          <div class="row" style="gap:10px">
            <button class="btn" id="clearBtn" type="button">Svuota</button>
          </div>
        </div>
        <div class="small" id="tipNote" style="margin-top:8px">—</div>
      </div>

      <!-- BOOST PERSONALIZZAZIONE -->
      <div class="card center" id="boostCard">
        <div class="row toggle" id="boostHeader" style="justify-content:space-between">
          <div class="label" id="boostTitle">▶ Boost personalizzazione</div>
          <div class="small" id="boostHint">(opzionale)</div>
        </div>
        <div class="body" id="boostBody" style="margin-top:8px">
          <textarea id="boostInput" class="input" rows="3" placeholder="" ></textarea>
          <div class="row" style="margin-top:10px;justify-content:flex-end;gap:8px">
            <button class="btn" id="boostClearBtn" type="button">Svuota</button>
            <button class="btn primary" id="boostSaveBtn" type="button">💾 Salva Boost</button>
          </div>
          <div class="small" id="boostSavedMsg" style="margin-top:6px"></div>

          <!-- Micro UI AI -->
          <div class="airow mini">
            <span id="aiDot" class="dot" title="Stato AI"></span>
            <span id="aiMsg">AI non testata.</span>
            <span id="aiTime" class="kv">⏱ —</span>
            <button class="btn" id="aiPingBtn" type="button" title="Esegue una chiamata rapida all'API">↻ Test AI</button>
          </div>
        </div>
      </div>

      <!-- SPUNTI -->
      <div class="card center collapsed" id="hintsCard">
        <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
          <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
        </div>
        <div class="body" id="hintsBody" style="margin-top:8px">
          <div class="chips" id="hintsChips"></div>
          <div class="small" id="hintsNote" style="margin-top:8px"></div>
        </div>
      </div>

      <footer id="footerNote">© What?f — FREE · crediti giornalieri attivi</footer>
    </div>
  </main>

<script>
(function(){
  /* ===== STORAGE SAFE ===== */
  const mem={}; let STORAGE_OK=true;
  const SafeStorage={ getItem(k){ try{ return localStorage.getItem(k);}catch(e){STORAGE_OK=false; return (k in mem)?mem[k]:null;}},
                      setItem(k,v){ try{ localStorage.setItem(k,v);}catch(e){STORAGE_OK=false; mem[k]=String(v);} },
                      removeItem(k){ try{ localStorage.removeItem(k);}catch(e){STORAGE_OK=false; delete mem[k];} } };
  const LS=SafeStorage;
  const $=id=>document.getElementById(id);

  /* ===== I18N ===== */
  const I18N={
    it:{title:"Imposta la tua domanda", yourq:"E se…", gen:"✨ Genera risposta", clear:"Svuota",
        surprise:"Sorprendimi", styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Passato",
        footer:"© What?f — FREE · crediti giornalieri attivi",
        boostTitle:"▶ Boost personalizzazione", boostHint:"(opzionale)", boostSave:"💾 Salva Boost", boostClear:"Svuota",
        boostPH:"Scrivi qualcosa su di te o su cosa vuoi esplorare. Es: “cambiare città”, “inglese B2”, “partita IVA”…",
        mixExpl:"Le idee casuali seguono un mix 60/30/10: 60% personalizzate 🧩, 30% generiche 🌐, 10% assurde 🤪.",
        hintsTitle:"▶ Spunti rapidi “E se…”", hintsNote:"Clicca uno spunto per riempire la domanda.",
        warnEmpty:"Scrivi la domanda — oppure premi “🎲 Sorprendimi”.",
        aiOk:"AI pronta", aiErr:"AI errore", aiPing:"Test AI eseguito", credits:"Crediti", free:"FREE", pro:"PRO"
    },
    en:{title:"Set your question", yourq:"What if…", gen:"✨ Generate answer", clear:"Clear",
        surprise:"Surprise me", styleWF:"What if", styleWTF:"What the F", fut:"Future", past:"Past",
        footer:"© What?f — FREE · daily credits active",
        boostTitle:"▶ Personalization boost", boostHint:"(optional)", boostSave:"💾 Save Boost", boostClear:"Clear",
        boostPH:"Write anything about you or what you want to explore (e.g., “move city”, “English B2”, “freelance”).",
        mixExpl:"Random ideas follow a 60/30/10 mix: 60% personalized 🧩, 30% generic 🌐, 10% absurd 🤪.",
        hintsTitle:"▶ Quick “What if…”", hintsNote:"Click a hint to fill the question.",
        warnEmpty:"Type a question — or press “🎲 Surprise me”.",
        aiOk:"AI ready", aiErr:"AI error", aiPing:"AI test ran", credits:"Credits", free:"FREE", pro:"PRO"
    },
    es:{title:"Configura tu pregunta", yourq:"¿Y si…?", gen:"✨ Generar respuesta", clear:"Limpiar",
        surprise:"Sorpréndeme", styleWF:"What if", styleWTF:"What the F", fut:"Futuro", past:"Pasado",
        footer:"© What?f — FREE · créditos diarios activos",
        boostTitle:"▶ Impulso de personalización", boostHint:"(opcional)", boostSave:"💾 Guardar Boost", boostClear:"Limpiar",
        boostPH:"Escribe algo sobre ti o lo que quieres explorar (p. ej., “mudarte”, “inglés B2”).",
        mixExpl:"Las ideas siguen una mezcla 60/30/10: 60% personalizadas, 30% genéricas, 10% absurdas.",
        hintsTitle:"▶ Ideas rápidas «¿Y si…?»", hintsNote:"Pulsa una idea para rellenar la pregunta.",
        warnEmpty:"Escribe la pregunta — o pulsa “🎲 Sorpréndeme”.",
        aiOk:"IA lista", aiErr:"Error de IA", aiPing:"Prueba de IA ejecutada", credits:"Créditos", free:"FREE", pro:"PRO"
    },
    fr:{title:"Définis ta question", yourq:"Et si…", gen:"✨ Générer la réponse", clear:"Effacer",
        surprise:"Surprends-moi", styleWF:"What if", styleWTF:"What the F", fut:"Futur", past:"Passé",
        footer:"© What?f — FREE · crédits quotidiens actifs",
        boostTitle:"▶ Boost de personnalisation", boostHint:"(optionnel)", boostSave:"💾 Enregistrer le Boost", boostClear:"Effacer",
        boostPH:"Écris quelque chose sur toi ou ce que tu veux explorer (ex. « déménager », « anglais B2 »).",
        mixExpl:"Les idées suivent un mix 60/30/10 : 60 % perso, 30 % génériques, 10 % absurdes.",
        hintsTitle:"▶ Idées rapides « Et si… »", hintsNote:"Clique une idée pour remplir la question.",
        warnEmpty:"Écris la question — ou appuie sur « 🎲 Surprends-moi ».",
        aiOk:"IA prête", aiErr:"Erreur IA", aiPing:"Test IA exécuté", credits:"Crédits", free:"FREE", pro:"PRO"
    },
    de:{title:"Stelle deine Frage ein", yourq:"Was wäre, wenn…", gen:"✨ Antwort erzeugen", clear:"Leeren",
        surprise:"Überrasche mich", styleWF:"What if", styleWTF:"What the F", fut:"Zukunft", past:"Vergangenheit",
        footer:"© What?f — FREE · tägliche Credits aktiv",
        boostTitle:"▶ Personalisierungs-Boost", boostHint:"(optional)", boostSave:"💾 Boost speichern", boostClear:"Leeren",
        boostPH:"Schreibe etwas über dich oder was du erkunden willst (z. B. „Umzug“, „Englisch B2“).",
        mixExpl:"Zufalls-Ideen im 60/30/10-Mix: 60 % personalisiert, 30 % generisch, 10 % absurd.",
        hintsTitle:"▶ Schnelle „Was wäre, wenn…“-Ideen", hintsNote:"Klicke eine Idee, um die Frage zu füllen.",
        warnEmpty:"Schreibe eine Frage — oder drücke „🎲 Überrasch mich“.",
        aiOk:"KI bereit", aiErr:"KI-Fehler", aiPing:"KI-Test ausgeführt", credits:"Credits", free:"FREE", pro:"PRO"
    }
  };

  /* ===== State ===== */
  const SUPPORTED_LANGS=["it","en","es","fr","de"];
  let lang=(LS.getItem('lang')||'it').toLowerCase(); if(!SUPPORTED_LANGS.includes(lang)) lang="it";
  document.documentElement.lang=lang;

  let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
  function writeJSON(k,v){ try{ LS.setItem(k, JSON.stringify(v)); }catch{} }
  function readJSON(k,def){ try{ return JSON.parse(LS.getItem(k)||JSON.stringify(def)); }catch{ return def; } }
  function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
  function normalizeSpaces(t){ return t.replace(/\s+/g,' ').replace(/\s+([?!.,;:%])/g,'$1').trim(); }

  /* ===== Topbar offset (anti overlap) ===== */
  function applyTopbarOffset(){
    const tb=$('topbar');
    if(!tb) return;
    document.body.style.paddingTop = tb.getBoundingClientRect().height+'px';
  }
  new ResizeObserver(applyTopbarOffset).observe($('topbar'));
  window.addEventListener('load',applyTopbarOffset);
  window.addEventListener('resize',applyTopbarOffset);

  /* ===== UI text apply ===== */
  function setText(id,txt){ const el=$(id); if(el) el.textContent=txt; }
  function renderBadges(){
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
    const L=I18N[lang];
    setText('styleBadge','🎭 '+(prefs.stile==='wtf'?L.styleWTF:L.styleWF));
    setText('periodoBadge','🕰️ '+(prefs.periodo==='past'?L.past:L.fut));
    document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
    document.querySelectorAll('#periodoChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.periodo===prefs.periodo));
  }
  function capForUser(){ try{ return LS.getItem('admin_token')?Infinity:(prefs.pro?10:3);}catch{return prefs.pro?10:3;} }
  function ensureCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); if(c.date!==todayISO()){ c.date=todayISO(); c.used=0; } writeJSON('whatif_credits',c); }
  function leftCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); const cap=capForUser(); return cap===Infinity?'∞':Math.max(0,(cap-(c.used||0))); }
  function renderCreditsBadge(){ const L=I18N[lang]; const cap=capForUser(), left=leftCredits(); $('freeBadge').textContent=(cap===Infinity)?`${L.credits}: ∞`:`${L.credits}: ${left}/${cap}`; $('proBadge').textContent=prefs.pro?(L.pro):(L.free); }

  function applyTexts(){
    const L=I18N[lang];
    document.title = (lang==='it')?'What?f — Domanda': (lang==='es')?'What?f — Pregunta': (lang==='fr')?'What?f — Question': (lang==='de')?'What?f — Frage':'What?f — Question';
    setText('titleH1',L.title);
    setText('qLabel',L.yourq);
    setText('goBtn',L.gen);
    setText('clearBtn',L.clear);
    setText('surpriseBtn','🎲 '+L.surprise);
    setText('footerNote',L.footer);
    setText('chipWhatIf',L.styleWF);
    setText('chipWTF',L.styleWTF);
    setText('chipFuture',L.fut);
    setText('chipPast',L.past);
    setText('boostTitle',L.boostTitle);
    setText('boostHint',L.boostHint);
    setText('boostSaveBtn',L.boostSave);
    setText('boostClearBtn',L.boostClear);
    setText('hintsTitle',L.hintsTitle);
    setText('hintsNote',L.hintsNote);
    $('boostInput').placeholder=L.boostPH;
    setText('tipNote',L.mixExpl);
    renderBadges(); renderCreditsBadge();
  }

  /* ===== Language switch (live) ===== */
  $('langSelect').value=lang;
  $('langSelect').onchange=()=>{
    lang=$('langSelect').value;
    LS.setItem('lang',lang);
    document.documentElement.lang=lang;
    applyTexts();
    renderHints();
  };

  /* ===== Nav ===== */
  $('homeBtn').onclick = ()=>{ location.href='index.html'; };
  $('backBtn').onclick = ()=>{ try{ history.length>1?history.back():location.href='index.html'; }catch{ location.href='index.html'; } };

  /* ===== Reset totale ===== */
  $('resetBtn').onclick=()=>{
    const keepLang = LS.getItem('lang');
    const admin = LS.getItem('admin_token');
    try{ localStorage.clear(); }catch{}
    if(keepLang) LS.setItem('lang', keepLang);
    if(admin) LS.setItem('admin_token', admin);
    writeJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
    writeJSON('whatif_credits',{date:todayISO(),used:0});
    LS.setItem('whatif_boost','');
    LS.setItem('whatif_boost_saved_date','');
    location.reload();
  };

  /* ===== Boost ===== */
  function getBoost(){ try{ return (LS.getItem('whatif_boost')||'').trim(); }catch{ return '' } }
  function saveBoost(txt){
    LS.setItem('whatif_boost', String(txt||''));
    LS.setItem('whatif_boost_saved_date', todayISO());
    const msg=$('boostSavedMsg'); if(msg){ msg.textContent=(I18N[lang].aiPing||'Salvato'); setTimeout(()=> msg.textContent='',1400); }
  }
  function initBoostVisibility(){
    const last=LS.getItem('whatif_boost_saved_date');
    const card=$('boostCard');
    card.style.display = (last===todayISO()) ? 'none' : 'block';
    const bi=$('boostInput'); if(bi) bi.value=getBoost();
  }
  $('boostHeader').onclick=()=>{ $('boostCard').classList.toggle('collapsed'); };
  $('boostSaveBtn').onclick=()=>{ saveBoost(($('boostInput')||{}).value||''); $('boostCard').style.display='none'; };
  $('boostClearBtn').onclick=()=>{ const i=$('boostInput'); if(i) i.value=''; saveBoost(''); $('boostCard').classList.remove('collapsed'); };

  /* ===== Chips stile/periodo ===== */
  document.getElementById('styleChips').addEventListener('click',(e)=>{
    const b=e.target.closest('.chip'); if(!b) return;
    prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs); renderBadges();
  });
  document.getElementById('periodoChips').addEventListener('click',(e)=>{
    const b=e.target.closest('.chip'); if(!b) return;
    prefs.periodo=b.dataset.periodo; writeJSON('whatif_prefs',prefs); renderBadges();
  });

  /* ===== Hints ===== */
  function hintsBaseByLang(){
    const map={
      it:["E se cambiassi lavoro?","E se cambiassi città?","E se aprissi partita IVA?","E se tornassi a studiare?","E se provassi la settimana corta?","E se chiedessi un aumento?","E se imparassi bene l’inglese?","E se aprissi un micro e-commerce?"],
      en:["What if you changed jobs?","What if you moved city?","What if you went freelance?","What if you went back to study?","What if you tried a 4-day week?","What if you asked for a raise?","What if you mastered English?","What if you opened a tiny e-commerce?"],
      es:["¿Y si cambiaras de trabajo?","¿Y si te mudaras de ciudad?","¿Y si te hicieras autónomo?","¿Y si volvieras a estudiar?","¿Y si probaras una semana de 4 días?","¿Y si pidieras un aumento?","¿Y si dominaras el inglés?","¿Y si abrieras un micro e-commerce?"],
      fr:["Et si tu changeais de travail ?","Et si tu déménageais ?","Et si tu te mettais en freelance ?","Et si tu reprenais des études ?","Et si tu testais la semaine de 4 jours ?","Et si tu demandais une augmentation ?","Et si tu maîtrisais l’anglais ?","Et si tu ouvrais un micro e-commerce ?"],
      de:["Was, wenn du den Job wechselst?","Was, wenn du in eine andere Stadt ziehst?","Was, wenn du freiberuflich arbeitest?","Was, wenn du wieder studierst?","Was, wenn du eine 4-Tage-Woche testest?","Was, wenn du um eine Gehaltserhöhung bittest?","Was, wenn du Englisch meisterst?","Was, wenn du einen Micro-Shop startest?"]
    };
    return map[lang]||map.it;
  }
  function renderHints(){
    const wrap=$('hintsChips'); if(!wrap) return; wrap.innerHTML='';
    hintsBaseByLang().forEach(txt=>{
      const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=txt;
      b.onclick=()=>{ $('qInput').value=txt; window.scrollTo({top:0,behavior:'smooth'}); };
      wrap.appendChild(b);
    });
    $('hintsNote').textContent = I18N[lang].hintsNote;
  }
  $('hintsHeader').onclick=()=>{ $('hintsCard').classList.toggle('collapsed'); };

  /* ===== AI Ping ===== */
  const aiDot=$('aiDot'), aiMsg=$('aiMsg'), aiTime=$('aiTime');
  $('aiPingBtn').onclick=async()=>{
    const L=I18N[lang];
    const t0=performance.now();
    aiDot.classList.remove('ok','err'); aiMsg.textContent='…'; aiTime.textContent='⏱ —';
    try{
      const headers={"Content-Type":"application/json"};
      const admin=localStorage.getItem("admin_token"); if(admin) headers["x-admin-token"]=admin;
      if(prefs.pro===true) headers["x-pro"]="1";
      const r = await fetch("/api/ask",{method:"POST",headers,body:JSON.stringify({ ping:true })});
      const ok = r.ok;
      const dt = Math.round(performance.now()-t0);
      aiDot.classList.add(ok?'ok':'err');
      aiMsg.textContent = ok? L.aiOk : L.aiErr;
      aiTime.textContent = `⏱ ${dt}ms`;
    }catch(e){
      aiDot.classList.add('err');
      aiMsg.textContent=I18N[lang].aiErr; aiTime.textContent='⏱ —';
    }
  };

  /* ===== Validazione & flusso ===== */
  function warn(msg){ const el=$('qWarning'); el.textContent=msg||''; el.style.display=msg?'block':'none'; }
  function polishQuestion(q){
    let t=String(q||"").replace(/[?？]+$/,'').trim(); if(!t) return '';
    t = t.charAt(0).toUpperCase()+t.slice(1); t = normalizeSpaces(t); if(!/\?$/.test(t)) t+='?'; return t;
  }
  function ensureCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); if(c.date!==todayISO()){ c.date=todayISO(); c.used=0; } writeJSON('whatif_credits',c); }
  function bumpCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge(); }

  function saveAndGo(request){
    writeJSON('whatif_request', request);
    bumpCredits();
    location.href='fifth.html';
  }

  document.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ $('goBtn').click(); }});
  $('clearBtn').onclick=()=>{ $('qInput').value=''; warn(''); };

  $('goBtn').onclick=()=>{
    warn('');
    const domandaRaw=$('qInput').value||'';
    if(!domandaRaw.trim()){ warn(I18N[lang].warnEmpty); return; }
    const domanda = polishQuestion(domandaRaw);
    const micro = { boost: (LS.getItem('whatif_boost')||''), lang, stile:prefs.stile, periodo:prefs.periodo };
    saveAndGo({ mode:'manual', domanda, micro });
  };

  $('surpriseBtn').onclick=()=>{
    warn('');
    const micro = { boost:(LS.getItem('whatif_boost')||''), lang, stile:prefs.stile, periodo:prefs.periodo };
    // La quinta genererà la DOMANDA AI partendo da micro.boost/lang/stile/periodo
    saveAndGo({ mode:'surprise', domanda:'', micro });
  };

  /* ===== Init ===== */
  (function init(){
    // Defaults se mancano
    if(!LS.getItem('whatif_prefs')) writeJSON('whatif_prefs',prefs);
    ensureCredits();
    applyTexts();
    renderHints();
    // set select value
    $('langSelect').value=lang;
  })();
})();
</script>
</body>
</html>
