try { return JSON.parse(localStorage.getItem(WKEY)||'{}')||{}; }

function getWalletAvailable(){  
if (userIsAdmin()) return Infinity;

if (w && w.available != null) return (w.available===Infinity?Infinity:Math.max(0,+w.available));

const hintsWrap=$('hintsChips');  
function rng(seedStr){ let s=[...seedStr].reduce((a,c)=>a+c.charCodeAt(0),0); return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }  
function daily(pool,n=8){ const rnd=rng(todayISO()); const seen=new Set(), out=[]; while(out.length<n && seen.size<pool.length){ const i=Math.floor(rnd()*pool.length); if(seen.has(i)) continue; seen.add(i); out.push(pool[i]); } return out; }  
  
/* Personalizzazione spunti realistici */  
const GEN_REAL={ it:{  
lavoro:["chiedessi un aumento","cambiassi lavoro","sistemassi LinkedIn","provassi 30 giorni di lavoro remoto","lanciassi un side-project"],  
studio:["riprendessi l’università","studiassi inglese 20 min/die","scrivessi 1 pagina di tesi al giorno","facessi un corso gratuito di IA"],  
soldi:["seguissi un budget per 30 giorni","tagliassi 3 spese inutili","mettessi da parte 5€/giorno","aprissi un fondo emergenze"],  
sport:["corressi 3× a settimana","facessi stretching 10 min/die","camminassi 8.000 passi/die","nuotassi all’alba"],  
relazioni:["chiamassi un amico a settimana","mettessi confini al lavoro","organizzassi una cena a casa"],  
viaggi:["organizzassi un weekend low-cost","scoprissi 5 posti nella tua città"],  
tech:["automatizzassi una noia con AI","creassi un micro-sito in una sera"],  
business:["aprissi un micro e-commerce","testassi un’idea con una landing"]  
}};  
function inferUserPrefs(){  
const map = {  
lavoro:["lavor","job","linkedin","remoto","cv","colloquio"],  
studio:["studio","universit","esame","tesi","inglese","course","exam"],  
soldi:["spesa","budget","soldi","money","rispar","save","fund"],  
sport:["corri","sport","palestra","nuoto","cammina","run","walk","stretch"],  
relazioni:["amico","amica","partner","relaz","social","confini","boundar"],  
viaggi:["viagg","citt","weekend","volo","hotel","travel"],  
tech:["ai","app","sito","site","automat","shortcut","email"],  
business:["e-commerce","ecommerce","newsletter","client","pitch","landing","startup"]  
};  
const buckets = Object.fromEntries(Object.keys(map).map(k=>[k,0]));  
const corpora = (readJSON('cronologia',[]).map(x=>x.domanda||'').join(' ') + ' ' + readJSON('next_prompts',[]).map(x=>x.q||'').join(' ')).toLowerCase();  
for(const [cat,keys] of Object.entries(map)){  
keys.forEach(kw=>{ if(corpora.includes(kw)) buckets[cat]+=1; });  
}  
return buckets;  
}  
function personalizedHints(baseList){  
if(lang!=='it') return baseList;  
const prefsBuckets = inferUserPrefs();  
const ranked = Object.entries(prefsBuckets).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v>0).map(([k])=>k);  
const addPool=[];  
ranked.slice(0,3).forEach(cat=>{  
const bank = GEN_REAL.it[cat];  
if(bank) addPool.push(...bank.map(a=>"E se "+a+"?"));  
});  
const extra = [];  
while(extra.length<Math.min(4, addPool.length)){  
const pick = addPool[Math.floor(Math.random()*addPool.length)];  
if(!extra.includes(pick) && !baseList.includes(pick)) extra.push(pick);  
}  
return [...baseList, ...extra];  
}  
  
function renderHints(){  
const base=(HINTS[lang]||HINTS.it).slice();  
const list=daily(base,8);  
const finalList = personalizedHints(list).slice(0,12);  
  
hintsWrap.innerHTML='';  
finalList.forEach(h=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=h;  
b.onclick=()=>{ $('qInput').value=h; isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0'); window.scrollTo({top:0,behavior:'smooth'}); };  
hintsWrap.appendChild(b);  
});  
const T=I18N[lang]||I18N.it;  
$('hintsNote').textContent=T.hintsNote;  
renderCredits(); renderBadges();  
}  
renderHints();  
  
/* Collassabili */  
['hints','saved','hist'].forEach(k=>{  
const card=$(k+'Card'); card.classList.add('collapsed');  
$(k+'Header')?.addEventListener('click',()=> card.classList.toggle('collapsed'));  
});  
  
/* ===== SAVED / HISTORY ===== */  
function fmtDate(ts){ return new Date(ts).toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }  
function addSaved(q){ if(!q) return; const arr=readJSON('next_prompts',[]); arr.unshift({q,ts:Date.now()}); writeJSON('next_prompts',arr.slice(0,50)); renderNext(); }  
function addHistory(domanda, stile){ if(!domanda) return; const arr=readJSON('cronologia',[]); arr.push({domanda, stile, ts:Date.now(), risposta:''}); writeJSON('cronologia', arr.slice(-100)); renderStories(); }  
function renderNext(){  
const T=I18N[lang]||I18N.it;  
const box=$('nextList'); box.innerHTML=''; const arr=readJSON('next_prompts',[]);  
if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }  
arr.slice(0,12).forEach(item=>{  
const row=document.createElement('div'); row.className='story';  
const left=document.createElement('div'); left.innerHTML=<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmtDate(item.ts)}</div>;  
const right=document.createElement('div'); right.className='row';  
const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.use;  
useBtn.onclick=()=>{ $('qInput').value=item.q||''; isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0'); window.scrollTo({top:0,behavior:'smooth'}); };  
right.appendChild(useBtn); row.appendChild(left); row.appendChild(right); box.appendChild(row);  
});  
}  
function renderStories(){  
const T=I18N[lang]||I18N.it;  
const box=$('storyList'); box.innerHTML=''; const arr=readJSON('cronologia',[]);  
if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyHist; box.appendChild(p); return; }  
arr.slice(-12).reverse().forEach(item=>{  
const row=document.createElement('div'); row.className='story';  
const left=document.createElement('div'); left.innerHTML=<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>;  
const play=document.createElement('button'); play.className='play'; play.textContent='▶';  
play.onclick=()=>{ writeJSON('replay_story',{domanda:item.domanda,answer:item.risposta||item.answer||'',stile:item.stile||'whatif'}); location.href='fifth.html'; };  
row.appendChild(left); row.appendChild(play); box.appendChild(row);  
});  
}  
renderNext(); renderStories();  
$('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };  
$('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };  
$('saveBtn').onclick=()=>{ const q=($('qInput').value||'').trim(); if(!q) return; addSaved(q); };  
  
/* ===== SUBMIT (non consuma crediti qui) ===== */  
function trySubmit(){  
const domanda=($('qInput').value||'').trim();  
if(!domanda) { $('qInput').focus(); return; }  
  
const req={  
domanda,  
stile:prefs.stile,  
lang,  
extra:'',  
fantasy_mode:false,  
periodo:prefs.periodo,  
absurd:isAbsurd,  
surprise:isAbsurd,  
source: isAbsurd ? 'surprise' : 'manual',  
micro:{ surprise:isAbsurd, source:isAbsurd?'surprise':'manual' }  
};  
  
writeJSON('whatif_request',req);  
LS.setItem('domanda',domanda);  
LS.setItem('absurd_prompt', isAbsurd ? '1' : '0');  
LS.setItem('surprise_mode', isAbsurd ? '1' : '0');  
  
addHistory(domanda, prefs.stile);  
location.href = isAbsurd ? 'fifth.html?src=surprise' : 'fifth.html';  
}  
$('goBtn').onclick=trySubmit;  
  
/* Input helpers */  
$('qInput').addEventListener('input', ()=>{  
isAbsurd=false;  
LS.setItem('absurd_prompt','0');  
LS.setItem('surprise_mode','0');  
});  
$('clearBtn').onclick=()=>{  
$('qInput').value='';  
isAbsurd=false;  
LS.setItem('absurd_prompt','0');  
LS.setItem('surprise_mode','0');  
$('qInput').focus();  
};  
$('qInput').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); trySubmit(); }});  
  
/* ===== 🎲 SORPRENDIMI (solo assurde) ===== */  
function absurdPool(){ return ABS[lang] && ABS[lang].length ? ABS[lang] : ABS.it; }  
function getRecentSet(){ return new Set(readJSON('surprise_recent',[])); }  
function rememberPrompt(p){ const arr=readJSON('surprise_recent',[]); arr.unshift(p); writeJSON('surprise_recent',arr.slice(0,60)); }  
function makeAbsurdList(n=14){  
const recent = getRecentSet();  
const pool = absurdPool().slice();  
const out=[];  
while(out.length<n && pool.length){  
const i=Math.floor(Math.random()pool.length);  
const cand=pool.splice(i,1)[0];  
if(!recent.has(cand)){ out.push(cand); recent.add(cand); }  
}  
if(!out.length) return absurdPool().slice(0,n);  
return out;  
}  
/ Spins */  
function spinCap(){ return userIsAdmin()?Infinity:(prefs.pro?5:1); }  
function ensureSpins(){  
const s=readJSON('surprise_spins',{date:todayISO(),used:0});  
if(s.date!==todayISO()){ s.date=todayISO(); s.used=0; }  
writeJSON('surprise_spins',s); return s;  
}  
function spinsLeft(){ const s=ensureSpins(); const cap=spinCap(); return cap===Infinity?Infinity:Math.max(0,cap-(s.used||0)); }  
  
/* 🔄 Mostra sia tiri giornalieri che token 🎁 */  
function renderSpinButton(){  
const T=I18N[lang]||I18N.it;  
const cap=spinCap(); const left=spinsLeft(); const tokens=readSurpriseTokens();  
const spinsTxt = (cap===Infinity)?'∞':${left}/${cap};  
const tokenTxt = tokens>0 ?  · 🎁 ${tokens} : '';  
$('surpriseBtn').textContent='🎲 '+T.surprise +  (${spinsTxt}) + tokenTxt;  
$('surpriseBtn').title = ${T.spins}: ${spinsTxt}${tokens>0? · Tokens: ${tokens}:''};  
}  
renderSpinButton();  
  
/* ✅ Consumo: prima un tiro; se 0 ma hai 🎁 token, lasciamo passare (il token verrà scalato in fifth) */  
function consumeOneSpinOrToken(){  
if(userIsAdmin()) return true;  
const s=ensureSpins(); const cap=spinCap(); const left=spinsLeft(); const tokens=readSurpriseTokens();  
if(cap!==Infinity && left<=0){  
if(tokens>0){  
// Non tocchiamo s.used: il consumo del token avviene in fifth  
return true;  
}  
alert((I18N[lang]||I18N.it).noSpins); return false;  
}  
// Consuma un tiro  
s.used=(s.used||0)+1; writeJSON('surprise_spins',s);  
// segnala refresh ad altre tab/pagine  
LS.setItem('whatif_wallet_sync', String(Date.now()));  
renderSpinButton();  
return true;  
}  
  
function slotSurprise(){  
if(!consumeOneSpinOrToken()) return;  
  
const rollingList = makeAbsurdList(14); // SOLO assurde  
  
const el=$('qInput'); el.classList.add('slotting');  
let i=0;  
const iv=setInterval(()=>{  
el.value = rollingList[i % rollingList.length];  
// durante lo slot mescolo solo tema visivo  
const s = Math.random()<.5 ? 'whatif' : 'wtf';  
const p = Math.random()<.5 ? 'future' : 'past';  
prefs.stile=s; prefs.periodo=p; writeJSON('whatif_prefs',prefs);  
document.documentElement.setAttribute('data-theme', s==='wtf'?'wtf':'whatif');  
renderBadges(); i++;  
},90);  
  
setTimeout(()=>{  
clearInterval(iv); el.classList.remove('slotting');  
const finalList = makeAbsurdList(10);  
const finalPrompt = finalList[Math.floor(Math.random()*finalList.length)];  
$('qInput').value = finalPrompt;  
rememberPrompt(finalPrompt);  
  
// flag "sorpresa"    
isAbsurd=true;    
LS.setItem('absurd_prompt','1');    
LS.setItem('surprise_mode','1');  
  
}, 1200 + Math.random()*600);  
}  
$('surpriseBtn').onclick=slotSurprise;
