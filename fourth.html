<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{ --bg:#0B0B0C; --fg:#fff; --muted:#A0B2BA; --card:#141C22; --bd:rgba(255,255,255,.12); --acc:#1C57A0; --wtf:#3A6B56; }
body{margin:0;background:#0B0B0C;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:860px;margin:auto;padding:22px}
h1{margin:8px 0 2px;font-size:clamp(22px,5vw,30px)}
.sub{color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,#1C57A0,#4ca3ff);color:#0a0e12}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--bd);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:14px}
.input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:#fff}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:999px;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tip{background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer}
.tip.open{background:rgba(255,255,255,.09)}
.tip .title{font-weight:800;margin:0 0 6px}
.tip .body{display:none;color:#cfe7ff}
.tip.open .body{display:block}
select{background:rgba(255,255,255,.06);border:1px solid var(--bd);color:#fff;border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <span class="badge" id="styleBadge">💡 What if 60/40</span>
      <button class="btn ghost" id="switchStyle">⚡ WTF</button>
    </div>
    <div class="row">
      <select id="langSel" aria-label="Language">
        <option value="it">Italiano (IT)</option>
        <option value="en">English (EN)</option>
        <option value="es">Español (ES)</option>
        <option value="fr">Français (FR)</option>
        <option value="de">Deutsch (DE)</option>
      </select>
    </div>
  </div>

  <h1 id="title">Fai la tua domanda</h1>
  <p class="sub" id="subtitle">Scrivi in modo semplice. Scegli tra What if 60/40 o What the F.</p>

  <div class="card">
    <label for="q" id="lblQ">Domanda</label>
    <textarea id="q" class="input" rows="3" placeholder="E se aprissi un micro e-commerce?"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="goBtn">🚀 Vai</button>
      <button class="btn ghost" id="rndBtn">🎲 Sorprendimi</button>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:800;margin-bottom:8px" id="lblTips">Spunti rapidi</div>
    <div class="grid" id="tips"></div>
  </div>
</main>

<script>
const LS = localStorage;
const SUP = ["it","en","es","fr","de"];
let lang = (LS.getItem('lang')||'it').slice(0,2).toLowerCase();
if(!SUP.includes(lang)) lang = 'it';
let stile = (LS.getItem('stile')||'whatif');

const I18N = {
  it:{ title:"Fai la tua domanda", sub:"Scrivi in modo semplice. Scegli tra What if 60/40 o What the F.",
       q:"Domanda", go:"🚀 Vai", rnd:"🎲 Sorprendimi",
       tips:"Spunti rapidi", styleIf:"💡 What if 60/40", wtfBtn:"⚡ WTF", ifBtn:"💡 What if 60/40" },
  en:{ title:"Ask your question", sub:"Keep it simple. Choose What if 60/40 or What the F.",
       q:"Question", go:"🚀 Go", rnd:"🎲 Surprise me",
       tips:"Quick prompts", styleIf:"💡 What if 60/40", wtfBtn:"⚡ WTF", ifBtn:"💡 What if 60/40" },
  es:{ title:"Haz tu pregunta", sub:"Sé simple. Elige What if 60/40 o What the F.",
       q:"Pregunta", go:"🚀 Ir", rnd:"🎲 Sorpréndeme",
       tips:"Ideas rápidas", styleIf:"💡 What if 60/40", wtfBtn:"⚡ WTF", ifBtn:"💡 What if 60/40" },
  fr:{ title:"Pose ta question", sub:"Simple. Choisis What if 60/40 ou What the F.",
       q:"Question", go:"🚀 Valider", rnd:"🎲 Surprends-moi",
       tips:"Pistes rapides", styleIf:"💡 What if 60/40", wtfBtn:"⚡ WTF", ifBtn:"💡 What if 60/40" },
  de:{ title:"Stell deine Frage", sub:"Schreib einfach. Wähle What if 60/40 oder What the F.",
       q:"Frage", go:"🚀 Los", rnd:"🎲 Überrasche mich",
       tips:"Schnelle Ideen", styleIf:"💡 What if 60/40", wtfBtn:"⚡ WTF", ifBtn:"💡 What if 60/40" }
};
const T = I18N[lang];

document.getElementById('title').textContent = T.title;
document.getElementById('subtitle').textContent = T.sub;
document.getElementById('lblQ').textContent = T.q;
document.getElementById('goBtn').textContent = T.go;
document.getElementById('rndBtn').textContent = T.rnd;
document.getElementById('lblTips').textContent = T.tips;
document.getElementById('styleBadge').textContent = (stile==='wtf') ? '⚡ What the F' : T.styleIf;
document.getElementById('switchStyle').textContent = (stile==='wtf') ? T.ifBtn : T.wtfBtn;
document.getElementById('langSel').value = lang;

document.getElementById('langSel').onchange = (e)=>{
  lang = e.target.value; LS.setItem('lang',lang); location.reload();
};
document.getElementById('switchStyle').onclick = ()=>{
  stile = (stile==='wtf') ? 'whatif' : 'wtf';
  LS.setItem('stile',stile); document.getElementById('styleBadge').textContent = (stile==='wtf') ? '⚡ What the F' : T.styleIf;
  document.getElementById('switchStyle').textContent = (stile==='wtf') ? T.ifBtn : T.wtfBtn;
};

/* Spunti rapidi */
const BANK = {
  it:[
    ["Aprire un micro e-commerce di nicchia","Prodotti fatti a mano, logistica leggera, marketing locale: ha senso?"],
    ["Tornare a vivere in una città più piccola","Costi, qualità della vita, reti sociali: come cambia la giornata?"],
    ["Ricominciare da freelance","Clienti, prezzi, fiscalità, routine sostenibile: da dove parti?"],
    ["Studiare all’estero per 6 mesi","Budget, visti, alloggi, opportunità al rientro: conviene davvero?"],
    ["Cambiare settore a 35+","Formazione mirata, rebranding, rete: percorso realistico?"]
  ],
  en:[
    ["Open a tiny niche e-commerce","Handmade, light logistics, local marketing: does it make sense?"],
    ["Move back to a smaller city","Costs, quality of life, networks: how does your day change?"],
    ["Restart as a freelancer","Clients, pricing, taxes, routine: where to begin?"],
    ["Study abroad for 6 months","Budget, visas, housing, return opportunities: worth it?"],
    ["Switch industry after 35","Targeted training, rebranding, network: realistic path?"]
  ],
  es:[
    ["Abrir un micro e-commerce de nicho","Hecho a mano, logística ligera, marketing local: ¿tiene sentido?"],
    ["Volver a una ciudad pequeña","Costes, calidad de vida, redes: ¿cómo cambia tu día?"],
    ["Empezar como freelance","Clientes, precios, impuestos, rutina: ¿por dónde empezar?"],
    ["Estudiar fuera 6 meses","Presupuesto, visados, vivienda: ¿merece la pena?"],
    ["Cambiar de sector con 35+","Formación, rebranding, red: ¿camino realista?"]
  ],
  fr:[
    ["Ouvrir un micro e-commerce de niche","Fait main, logistique légère, marketing local : pertinent ?"],
    ["Revenir dans une petite ville","Coûts, qualité de vie, réseaux : que change ta journée ?"],
    ["Repartir en freelance","Clients, tarifs, fiscalité, routine : on commence où ?"],
    ["Étudier à l’étranger 6 mois","Budget, visas, logement : est-ce rentable ?"],
    ["Changer de secteur après 35 ans","Formation ciblée, rebranding, réseau : trajectoire réaliste ?"]
  ],
  de:[
    ["Winzigen Nischen-Shop starten","Handgemacht, leichte Logistik, lokal vermarkten: sinnvoll?"],
    ["Zurück in eine kleinere Stadt ziehen","Kosten, Lebensqualität, Netzwerke: wie ändert sich dein Alltag?"],
    ["Als Freelancer neu starten","Kunden, Preise, Steuern, Routine: wo beginnen?"],
    ["Sechs Monate im Ausland studieren","Budget, Visa, Wohnen: lohnt sich das?"],
    ["Branchenwechsel mit 35+","Weiterbildung, Rebranding, Netzwerk: realistischer Weg?"]
  ]
}[lang] || [];

const tipsEl = document.getElementById('tips');
BANK.forEach(([t, b])=>{
  const div = document.createElement('div'); div.className = 'tip';
  div.innerHTML = `<div class="title">${t}</div><div class="body">${b}</div>`;
  div.onclick = ()=>{ div.classList.toggle('open'); document.getElementById('q').value = t; };
  tipsEl.appendChild(div);
});

document.getElementById('rndBtn').onclick = ()=>{
  const i = Math.floor(Math.random()*BANK.length);
  const t = BANK[i][0]; document.getElementById('q').value = t;
};

document.getElementById('goBtn').onclick = ()=>{
  const domanda = document.getElementById('q').value.trim();
  if(!domanda) return;
  LS.setItem('domanda', domanda);
  LS.setItem('stile', stile);
  // pass prefs to fifth
  const prefs = { stile, periodo:"future", pro:false };
  LS.setItem('whatif_prefs', JSON.stringify(prefs));
  // request payload seed
  LS.setItem('whatif_request', JSON.stringify({ domanda, micro:{}, periodo:"future" }));
  location.href = 'fifth.html';
};
</script>
</body>
</html>
