<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda (Safe Build)</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{--bg:#0B1018;--bg2:#0E1724;--card:#141C22;--fg:#F4F7FB;--muted:#A7B3C2;--accent:#1C57A0;--accent2:#FFEC01;--ink:#11110A;--chip:#0f1820;--line:#1b2a34}
html[data-theme=wtf]{--bg:#0B0B0C;--bg2:#101414;--card:#111713;--fg:#EEF5F0;--muted:#A6B6AD;--accent:#3A6B56;--accent2:#5A8C75;--ink:#06110B;--chip:#0F1714;--line:#21322A}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0;font-size:clamp(22px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.small{font-size:12px;color:var(--muted)}
.collapsed>.body{display:none}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);margin-top:8px}
.play{border:1px solid var(--line);background:var(--chip);width:42px;height:42px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="chips">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="credBadge">—</span>
      <span class="badge" id="planBadge">FREE</span>
      <select id="langSel" aria-label="Language">
        <option value="it">IT</option><option value="en">EN</option>
        <option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option>
      </select>
    </div>
  </div>

  <main><div class="wrap">
    <h1 id="titleH1">Imposta la tua domanda</h1>

    <div class="card">
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" type="button">What if</button>
        <button class="chip" data-style="wtf" type="button">What the F</button>
      </div>
      <div class="chips" id="periodoChips" style="margin-top:6px">
        <button class="chip" data-periodo="future" type="button">Futuro</button>
        <button class="chip" data-periodo="past" type="button">Passato</button>
      </div>
    </div>

    <div class="card">
      <h3 class="label" id="qLabel">E se…</h3>
      <textarea id="q" rows="3" class="input" placeholder="E se…"></textarea>
      <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
        <button class="btn primary" id="genBtn" type="button">✨ Genera risposta</button>
        <button class="btn" id="surpBtn" type="button">🎲 Sorprendimi</button>
        <button class="btn" id="clearBtn" type="button">Svuota</button>
      </div>
      <div class="small" id="tip">Le idee casuali seguono un mix 60/30/10: 60% personalizzate, 30% generiche, 10% assurde.</div>
    </div>

    <div class="card" id="boostCard">
      <div class="label" id="boostHead" style="cursor:pointer">▶ Boost personalizzazione</div>
      <div class="body">
        <textarea id="boost" class="input" rows="3" placeholder="Scrivi qualcosa su di te o su cosa vuoi esplorare…"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <button class="btn" id="boostClear" type="button">Svuota</button>
          <button class="btn primary" id="boostSave" type="button">💾 Salva Boost</button>
        </div>
        <div class="small" id="boostMsg" style="margin-top:6px"></div>
      </div>
    </div>

    <div class="card" id="hintsCard">
      <div class="label" id="hintsHead" style="cursor:pointer">▶ Spunti rapidi “E se…”</div>
      <div class="body"><div class="chips" id="hints"></div></div>
    </div>

    <div class="card" id="savedCard">
      <div class="label" id="savedHead" style="cursor:pointer">▶ Domande salvate</div>
      <div class="body"><div id="savedList"></div><button class="btn" id="savedClr" type="button" style="margin-top:8px">🗑️ Svuota</button></div>
    </div>

    <div class="card" id="histCard">
      <div class="label" id="histHead" style="cursor:pointer">▶ Cronologia</div>
      <div class="body"><div id="histList"></div><button class="btn" id="histClr" type="button" style="margin-top:8px">🗑️ Svuota</button></div>
    </div>

    <footer class="small">© What?f — FREE</footer>
  </div></main>

<script>
(function(){
  /* ==== Safe storage fallback ==== */
  var mem = {};
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)?mem[k]:null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=String(v); } }
  function jget(k,def){ try{ var v=lsGet(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function jset(k,val){ try{ lsSet(k, JSON.stringify(val)); }catch(e){} }

  /* ==== DOM helpers ==== */
  function $(id){ return document.getElementById(id); }
  function qa(sel){ return document.querySelectorAll(sel); }

  /* ==== State ==== */
  var lang = (lsGet('lang')||'it').toLowerCase();
  var prefs = jget('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});

  /* ==== I18N (essenziale) ==== */
  var I = {
    it:{t:"Imposta la tua domanda", yourq:"E se…", gen:"✨ Genera risposta", clear:"Svuota",
        surprise:"Sorprendimi", saved:"▶ Domande salvate", stories:"▶ Cronologia",
        fut:"Futuro", past:"Passato", hintsTitle:"▶ Spunti rapidi “E se…”",
        boostTitle:"▶ Boost personalizzazione", boostSave:"💾 Salva Boost", boostClear:"Svuota",
        tip:"Le idee casuali seguono un mix 60/30/10: 60% personalizzate, 30% generiche, 10% assurde.",
        credits:"Crediti", free:"FREE" },
    en:{t:"Set your question", yourq:"What if…", gen:"✨ Generate answer", clear:"Clear",
        surprise:"Surprise me", saved:"▶ Saved questions", stories:"▶ History",
        fut:"Future", past:"Past", hintsTitle:"▶ Quick “What if…”",
        boostTitle:"▶ Personalization boost", boostSave:"💾 Save Boost", boostClear:"Clear",
        tip:"Random ideas use a 60/30/10 mix: 60% personalized, 30% generic, 10% absurd.",
        credits:"Credits", free:"FREE" }
  };
  var L = I[lang] || I.it;

  /* ==== Apply text ==== */
  function applyTexts(){
    $('titleH1').textContent = L.t;
    $('qLabel').textContent = L.yourq;
    $('genBtn').textContent = L.gen;
    $('clearBtn').textContent = L.clear;
    $('surpBtn').textContent = '🎲 '+L.surprise;
    $('hintsHead').textContent = L.hintsTitle;
    $('boostHead').textContent = L.boostTitle;
    $('boostSave').textContent = L.boostSave;
    $('boostClear').textContent = L.boostClear;
    $('tip').textContent = L.tip;
    $('langSel').value = lang;
    renderBadges();
  }

  function renderBadges(){
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
    $('styleBadge').textContent = '🎭 ' + (prefs.stile==='wtf'?'What the F':'What if');
    $('periodoBadge').textContent = '🕰️ ' + (prefs.periodo==='past'?L.past:L.fut);
    $('planBadge').textContent = prefs.pro?'PRO':L.free;
    var cap = prefs.pro?10:3, c=jget('whatif_credits',{date:today(),used:0});
    if(c.date!==today()){ c.date=today(); c.used=0; jset('whatif_credits',c); }
    $('credBadge').textContent = L.credits+': '+Math.max(0,cap-(c.used||0))+'/'+cap;
    // highlight chips
    var sCh=qa('#styleChips .chip'); for(var i=0;i<sCh.length;i++){ sCh[i].classList.toggle('sel', sCh[i].getAttribute('data-style')===prefs.stile); }
    var pCh=qa('#periodoChips .chip'); for(var j=0;j<pCh.length;j++){ pCh[j].classList.toggle('sel', pCh[j].getAttribute('data-periodo')===prefs.periodo); }
  }

  function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function norm(t){ return String(t||'').replace(/\s+/g,' ').replace(/\s+([?!.,;:%])/g,'$1').replace(/^\s+|\s+$/g,''); }
  function polish(q, code){
    var t = String(q||'').replace(/[?？]+$/,''); if(!t){return '';}
    t = t.charAt(0).toUpperCase()+t.slice(1); t = norm(t);
    if(code==='es'){ if(t.charAt(0)!=='¿') t='¿'+t; if(t.slice(-1)!=='?') t+='?'; return t; }
    if(code==='fr'){ if(t.slice(-1)!=='?') t+=' ?'; return t; }
    if(t.slice(-1)!=='?') t+='?'; return t;
  }

  /* ==== Hints ==== */
  var H = {
    it:["E se cambiassi lavoro?","E se cambiassi città?","E se aprissi partita IVA?","E se studiassi 1h al giorno?","E se andassi all’estero 6 mesi?","E se vivessi senza auto?","E se ricominciassi palestra?","E se aprissi un micro e-commerce?"],
    en:["What if you changed jobs?","What if you moved city?","What if you went freelance?","What if you studied 1h daily?","What if you lived abroad 6 months?","What if you lived without a car?","What if you returned to the gym?","What if you opened a tiny e-commerce?"]
  };

  function renderHints(){
    var list = H[lang]||H.it, wrap=$('hints'); wrap.innerHTML='';
    for(var i=0;i<list.length;i++){
      (function(txt){
        var b=document.createElement('button'); b.className='chip'; b.type='button';
        b.textContent = polish(txt, lang);
        b.onclick=function(){ $('q').value=b.textContent; window.scrollTo(0,0); };
        wrap.appendChild(b);
      })(list[i]);
    }
  }

  /* ==== Saved & History ==== */
  function renderSaved(){
    var box=$('savedList'); box.innerHTML='';
    var arr=jget('next_prompts',[]);
    if(!arr.length){ box.innerHTML='<div class="small">— Nessuna domanda salvata.</div>'; return; }
    for(var i=0;i<Math.min(12,arr.length);i++){
      (function(item){
        var row=document.createElement('div'); row.className='story';
        var left=document.createElement('div'); left.innerHTML='<div style="font-weight:700;max-width:520px">'+(item.q||'—')+'</div><div class="small">'+fmt(item.ts)+'</div>';
        var play=document.createElement('button'); play.className='play'; play.textContent='▶';
        play.onclick=function(){ $('q').value=item.q||''; window.scrollTo(0,0); };
        row.appendChild(left); row.appendChild(play); box.appendChild(row);
      })(arr[i]);
    }
  }
  function renderHist(){
    var box=$('histList'); box.innerHTML='';
    var arr=jget('cronologia',[]);
    if(!arr.length){ box.innerHTML='<div class="small">— Nessuna storia.</div>'; return; }
    for(var i=Math.max(0,arr.length-12); i<arr.length; i++){
      var item=arr[i];
      var row=document.createElement('div'); row.className='story';
      var left=document.createElement('div'); left.innerHTML='<div style="font-weight:700;max-width:520px">'+(item.dom||item.domanda||'—')+'</div><div class="small">'+fmt(item.ts)+' · '+(item.stile==='wtf'?'What the F':'What if')+'</div>';
      row.appendChild(left); box.appendChild(row);
    }
  }
  function fmt(ts){ var d=new Date(ts||Date.now()); return d.toLocaleString('it-IT',{hour12:false}); }

  /* ==== Events (compat) ==== */
  $('homeBtn').onclick=function(){ try{location.href='index.html';}catch(e){} };
  $('backBtn').onclick=function(){ try{ history.length>1?history.back():location.href='index.html'; }catch(e){} };
  $('langSel').onchange=function(){ lsSet('lang', this.value); location.reload(); };

  $('styleChips').onclick=function(e){
    var t=e.target||e.srcElement; if(!t || !t.getAttribute) return;
    var s=t.getAttribute('data-style'); if(!s) return;
    prefs.stile=s; jset('whatif_prefs',prefs); renderBadges();
  };
  $('periodoChips').onclick=function(e){
    var t=e.target||e.srcElement; if(!t || !t.getAttribute) return;
    var p=t.getAttribute('data-periodo'); if(!p) return;
    prefs.periodo=p; jset('whatif_prefs',prefs); renderBadges();
  };

  $('boostHead').onclick=function(){
    var card=$('boostCard'); if(card.className.indexOf('collapsed')>-1) card.className=card.className.replace('collapsed','');
    else card.className += ' collapsed';
  };
  $('boostSave').onclick=function(){
    lsSet('whatif_boost', $('boost').value||''); $('boostMsg').textContent='Boost salvato.'; setTimeout(function(){ $('boostMsg').textContent=''; },1200);
  };
  $('boostClear').onclick=function(){ $('boost').value=''; lsSet('whatif_boost',''); $('boostMsg').textContent=''; };

  $('hintsHead').onclick=function(){ toggle('hintsCard'); };
  $('savedHead').onclick=function(){ toggle('savedCard'); };
  $('histHead').onclick=function(){ toggle('histCard'); };
  $('savedClr').onclick=function(){ jset('next_prompts',[]); renderSaved(); };
  $('histClr').onclick=function(){ jset('cronologia',[]); renderHist(); };

  $('genBtn').onclick=submit;
  $('clearBtn').onclick=function(){ $('q').value=''; $('q').focus(); };
  $('surpBtn').onclick=function(){
    var pool = (H[lang]||H.it);
    var t = pool[ Math.floor(Math.random()*pool.length) ] || (lang==='it'?'E se cambiassi lavoro quest’anno?':'What if you changed jobs this year?');
    $('q').value = polish(t, lang);
    window.scrollTo(0,0);
  };

  function toggle(id){
    var el=$(id);
    if(el.className.indexOf('collapsed')>-1) el.className=el.className.replace('collapsed','');
    else el.className += ' collapsed';
  }

  /* ==== Submit ==== */
  function submit(){
    var q=($('q').value||'').replace(/^\s+|\s+$/g,''); if(!q){ $('q').focus(); return; }
    q = polish(q, lang); $('q').value=q;

    // credits
    var c=jget('whatif_credits',{date:today(),used:0});
    if(c.date!==today()){ c.date=today(); c.used=0; }
    var cap=prefs.pro?10:3; if((c.used||0)>=cap){ alert(lang==='it'?'Hai finito i crediti di oggi.':'Credits finished for today.'); return; }
    c.used=(c.used||0)+1; jset('whatif_credits',c); renderBadges();

    // save history + request payload
    var hist=jget('cronologia',[]); hist.push({dom:q,ts:Date.now(),stile:prefs.stile}); jset('cronologia',hist);
    lsSet('domanda', q);
    jset('whatif_request',{domanda:q,stile:prefs.stile,lang:lang,extra:'',micro:jget('micro_profile',{}),fantasy_mode:false,periodo:prefs.periodo,boost:(lsGet('whatif_boost')||'')});
    try{ location.href='fifth.html'; }catch(e){}
  }

  /* ==== INIT ==== */
  applyTexts(); renderBadges(); renderHints(); renderSaved(); renderHist();
})();
</script>
</body>
</html>
