<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01;              /* Aquivera */
  --wtf1:#3A6B56; --wtf2:#5A8C75;             /* WTF    */
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.meta{font-size:12px;color:var(--muted)}
.tip{font-size:12px;color:var(--muted);margin-top:8px}
.section{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04)}
.section header{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.section h3{margin:0;font-size:15px;color:var(--acc)}
.section .content{margin-top:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv .mini{display:flex;gap:6px;align-items:center}
.kv .mini input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px;color:#fff}
.small{font-size:12px;color:var(--muted)}
.storyItem{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.03)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px}
.icon{opacity:.8}
.rightRow{display:flex;gap:8px;align-items:center}
.link{color:#EAF3EE;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="proBadge" title="">FREE</span>
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Stile -->
  <div class="card center">
    <div class="row" style="justify-content:space-between">
      <div class="chips" id="styleChips">
        <button class="chip" data-style="aquivera" id="chipAqv">Aquivera</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
        <button class="chip" data-style="aquivera_divina" id="chipDivina">🔒 Divina</button>
      </div>
      <div class="meta" id="styleHint">—</div>
    </div>
  </div>

  <!-- Domanda centrale -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <!-- Micro-suggerimenti compatti -->
    <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap" id="suggestRow"></div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
  </div>

  <!-- Micro-domande di OGGI (profilo) -->
  <div class="card center section" id="secProfile">
    <header id="hdrProfile">
      <h3 id="profTitle">Micro-domande di oggi (profilo)</h3>
      <span class="icon" id="profToggle">▼</span>
    </header>
    <div class="content" id="profContent">
      <div class="kv" id="kvProfile"><!-- filled by JS --></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn" id="saveProfileBtn">💾 Salva profilo</button>
      </div>
      <div class="small" id="profSaved"></div>
    </div>
  </div>

  <!-- Domande salvate per domani -->
  <div class="card center section" id="secNext">
    <header id="hdrNext">
      <h3 id="nextTitle">Domande salvate per domani</h3>
      <span class="icon" id="nextToggle">▼</span>
    </header>
    <div class="content" id="nextContent">
      <div id="nextList"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" id="clearNextBtn">🗑️ <span id="clearNextTxt">Svuota</span></button>
      </div>
    </div>
  </div>

  <!-- Storie recenti -->
  <div class="card center section" id="secStories">
    <header id="hdrStories">
      <h3 id="storiesTitle">Le tue storie recenti</h3>
      <span class="icon" id="storiesToggle">▼</span>
    </header>
    <div class="content" id="storiesContent">
      <div id="storyList"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" id="clearHistBtn">🗑️ <span id="clearHistTxt">Svuota</span></button>
      </div>
    </div>
  </div>

</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    yourq:"La tua domanda",
    gen:"✨ Genera risposta", clear:"Svuota",
    pro:"PRO", free:"FREE",
    freeLbl:(l,d)=>`Free oggi: ${l}/${d}`,
    chips:["primo segnale","vincolo concreto","tempo disponibile","luogo preciso"],
    styleHint:"Aquivera = profetico realistico · What the F = sarcastico · Divina = sblocca al 3° episodio o PRO",
    profTitle:"Micro-domande di oggi (profilo)",
    profSaved:"Profilo salvato.",
    nextTitle:"Domande salvate per domani",
    emptyNext:"— Nessuna domanda salvata.",
    storiesTitle:"Le tue storie recenti",
    emptyStories:"— Nessuna storia recente.",
    reuse:"Usa", play:"▶", replay:"Rileggi",
    clearNext:"Svuota", clearHist:"Svuota",
    devReset:"Pressione lunga: azzera crediti (solo dev)",
    locked:"🔒 Divina (al 3° ep. o PRO)",
    microToday:[
      {k:"name", lbl:"Nome", ph:"es. Luca"},
      {k:"city_now", lbl:"Dove vivi", ph:"es. Verona"},
      {k:"work_role", lbl:"Cosa fai", ph:"es. Marketing"},
      {k:"priority", lbl:"Cosa conta ora", ph:"es. serenità / crescita"},
      {k:"anchor", lbl:"Cosa ti ancora", ph:"es. famiglia / costi"},
      {k:"energy", lbl:"Energia media", ph:"bassa / media / alta"}
    ]
  },
  en:{
    title:"Set your question",
    yourq:"Your question",
    gen:"✨ Generate answer", clear:"Clear",
    pro:"PRO", free:"FREE",
    freeLbl:(l,d)=>`Free today: ${l}/${d}`,
    chips:["first signal","hard constraint","time window","specific place"],
    styleHint:"Aquivera = realistic prophetic · What the F = sarcastic · Divina = unlock at 3rd episode or PRO",
    profTitle:"Today’s micro-questions (profile)",
    profSaved:"Profile saved.",
    nextTitle:"Saved for tomorrow",
    emptyNext:"— No saved questions.",
    storiesTitle:"Your recent stories",
    emptyStories:"— No recent stories.",
    reuse:"Use", play:"▶", replay:"Replay",
    clearNext:"Clear", clearHist:"Clear",
    devReset:"Long press: reset credits (dev only)",
    locked:"🔒 Divina (3rd ep. or PRO)",
    microToday:[
      {k:"name", lbl:"Name", ph:"e.g., Luca"},
      {k:"city_now", lbl:"Where you live", ph:"e.g., Verona"},
      {k:"work_role", lbl:"What you do", ph:"e.g., Marketing"},
      {k:"priority", lbl:"What matters now", ph:"e.g., calm / growth"},
      {k:"anchor", lbl:"What anchors you", ph:"e.g., family / costs"},
      {k:"energy", lbl:"Energy level", ph:"low / medium / high"}
    ]
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Prefs / Tema / Crediti ===== */
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const prefs = readJSON('whatif_prefs',{stile:'aquivera',periodo:'future',pro:false,episodes:0});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* Crediti */
const DAILY_FREE = prefs.pro ? 10 : 3;
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:!!prefs.pro});
  if(c.date!==todayStr()){c.date=todayStr();c.used=0;}
  c.pro=!!prefs.pro;
  writeJSON('whatif_credits',c);
}
function renderCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  const left=Math.max(0, (c.pro?10:3)-(c.used||0));
  document.getElementById('freeBadge').textContent=T.freeLbl(left, c.pro?10:3);
  const proB=document.getElementById('proBadge');
  proB.textContent = c.pro ? T.pro : T.free;
  proB.title = c.pro ? "Pro attivo" : "Free";
  const fb=document.getElementById('freeBadge');
  fb.title = T.devReset;
}
ensureCredits(); renderCredits();

/* Long-press reset (solo dev) */
(function devReset(){
  let t=null; const b=document.getElementById('freeBadge');
  b.addEventListener('pointerdown', ()=>{ t=setTimeout(()=>{ const c=readJSON('whatif_credits'); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderCredits(); alert(T.devReset); },1500);});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));
})();

/* ===== UI static ===== */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.yourq;
document.getElementById('goBtn').textContent=T.gen;
document.getElementById('clearBtn').textContent=T.clear;
document.getElementById('styleHint').textContent=T.styleHint;
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('chipAqv').classList.toggle('sel', prefs.stile==='aquivera');
document.getElementById('chipWTF').classList.toggle('sel', prefs.stile==='wtf');

/* Divina lock */
const chipDiv=document.getElementById('chipDivina');
const canDivina = prefs.pro || (prefs.episodes||0) >= 3;
chipDiv.textContent = canDivina ? "Aquivera Divina" : T.locked;
chipDiv.disabled = !canDivina;

/* Suggerimenti compatti */
const sugg = T.chips;
const sRow=document.getElementById('suggestRow');
sugg.forEach(txt=>{
  const b=document.createElement('button');
  b.className='chip'; b.textContent=txt;
  b.onclick=()=>{ const i=document.getElementById('qInput'); i.value = i.value ? (i.value+" • "+txt) : txt; i.focus(); };
  sRow.appendChild(b);
});

/* Micro-domande profilo (semplici) */
document.getElementById('profTitle').textContent=T.profTitle;
const kv=document.getElementById('kvProfile');
const profStore = readJSON('whatif_profile', {});
T.microToday.forEach(f=>{
  const wrap=document.createElement('div'); wrap.className='mini';
  const lab=document.createElement('div'); lab.className='badge'; lab.textContent=f.lbl;
  const inp=document.createElement('input'); inp.placeholder=f.ph; inp.value = profStore[f.k] || "";
  inp.id = 'pf_'+f.k;
  wrap.appendChild(lab); wrap.appendChild(inp);
  kv.appendChild(wrap);
});
document.getElementById('saveProfileBtn').onclick=()=>{
  const out={};
  T.microToday.forEach(f=>{ out[f.k] = (document.getElementById('pf_'+f.k).value||"").trim(); });
  writeJSON('whatif_profile', {...profStore, ...out, date: todayStr()});
  document.getElementById('profSaved').textContent=T.profSaved;
  setTimeout(()=>{document.getElementById('profSaved').textContent=""},1400);
};

/* Collassabili con stato persistente */
function setupCollapsible(secId, hdrId, cntId, storeKey){
  const sec=document.getElementById(secId);
  const hdr=document.getElementById(hdrId);
  const cnt=document.getElementById(cntId);
  const st=readJSON('collapse_state', {});
  const open = st[storeKey]!==false;
  cnt.style.display = open ? 'block' : 'none';
  sec.querySelector('.icon').textContent = open ? '▼' : '▲';
  hdr.onclick = ()=>{
    const isOpen = cnt.style.display!=='none';
    cnt.style.display = isOpen ? 'none' : 'block';
    sec.querySelector('.icon').textContent = isOpen ? '▲' : '▼';
    const cur=readJSON('collapse_state',{});
    cur[storeKey]=!isOpen; writeJSON('collapse_state',cur);
  };
}
setupCollapsible('secProfile','hdrProfile','profContent','profile');
setupCollapsible('secNext','hdrNext','nextContent','next');
setupCollapsible('secStories','hdrStories','storiesContent','stories');

/* Navigazione & lingua */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

/* Stile chips */
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const style=b.dataset.style;
  if(style==='aquivera_divina' && !canDivina) return;
  prefs.stile=style; writeJSON('whatif_prefs',prefs);
  document.querySelectorAll('#styleChips .chip').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
  document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');
});

/* Credito check */
function canGenerate(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  const cap=c.pro?10:3;
  return (c.used||0) < cap;
}
function consumeCredit(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCredits();
}

/* Domande salvate per domani */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=document.getElementById('nextList'); box.innerHTML="";
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,10).forEach(item=>{
    const row=document.createElement('div'); row.className='storyItem';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q}</div><div class="small">${fmtDate(item.ts)} · ${item.stile||'aquivera'}</div>`;
    const right=document.createElement('div'); right.className='rightRow';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.reuse;
    useBtn.onclick=()=>{ document.getElementById('qInput').value=item.q; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ LS.setItem('domanda', item.q); writeJSON('whatif_prefs', {...prefs, stile: item.stile||'aquivera' }); location.href='fifth.html'; };
    row.appendChild(left); row.appendChild(right);
    right.appendChild(useBtn); right.appendChild(play);
    box.appendChild(row);
  });
}
renderNext();
document.getElementById('clearNextBtn').onclick=()=>{ writeJSON('next_prompts',[]); renderNext(); document.getElementById('clearNextTxt').textContent=T.clearNext; };

/* Storie recenti (replay) */
function renderStories(){
  const box=document.getElementById('storyList'); box.innerHTML="";
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(0,10).forEach(item=>{
    const row=document.createElement('div'); row.className='storyItem';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda}</div><div class="small">${fmtDate(item.ts)} · ${item.stile||'aquivera'} · <span class="link" data-id="${item.ts}" data-act="replay">${T.replay}</span></div>`;
    const right=document.createElement('div'); right.className='rightRow';
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ LS.setItem('domanda', item.domanda); writeJSON('replay_story', item); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(right);
    right.appendChild(play);
    box.appendChild(row);
  });
  // link replay inline
  box.querySelectorAll('[data-act="replay"]').forEach(a=>{
    a.onclick=()=>{ const ts=a.getAttribute('data-id'); const it=arr.find(x=>String(x.ts)===String(ts)); if(!it)return; writeJSON('replay_story',it); location.href='fifth.html?view=replay'; };
  });
}
renderStories();
document.getElementById('clearHistBtn').onclick=()=>{ writeJSON('cronologia',[]); renderStories(); document.getElementById('clearHistTxt').textContent=T.clearHist; };

/* Genera */
document.getElementById('goBtn').onclick=()=>{
  if(!canGenerate()){ alert(lang==='en'?'Out of daily credits.':'Crediti giornalieri esauriti.'); return; }
  const domanda=(document.getElementById('qInput').value||"").trim();
  if(!domanda){ document.getElementById('qInput').focus(); return; }
  // salva profilo rapido in req
  const prof=readJSON('whatif_profile',{});
  writeJSON('whatif_request',{domanda, stile:prefs.stile, extra: JSON.stringify(prof)});
  LS.setItem('domanda',domanda);
  consumeCredit();
  location.href='fifth.html';
};

/* Pulisci */
document.getElementById('clearBtn').onclick=()=>{ document.getElementById('qInput').value=""; };

/* Lingua & nav */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };
</script>
</body>
</html>
