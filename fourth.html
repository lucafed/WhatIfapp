<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>What?f — La tua domanda</title>
<meta name="theme-color" content="#0A0F14" />
<style>
:root{
  --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
  --accent:#00E0FF; --accent2:#00B5CC;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:980px;margin:0 auto;min-height:100%;padding:18px 16px 28px}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{appearance:none;border:0;border-radius:14px;background:#0f1820;color:#d3e6ea;
  padding:10px 14px;font-weight:700;cursor:pointer}
.pill{margin-left:auto;color:var(--muted);font-size:14px}

h1{margin:6px 0 12px;font-size:clamp(30px,6vw,44px);color:#E6F2F5}

.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;
  box-shadow:0 10px 28px rgba(0,0,0,.28)}
.label{color:var(--muted);font-weight:700;margin:0 0 10px}
.ta{width:100%;min-height:160px;background:#0c141b;border:1px solid #1d2b34;color:var(--fg);
  border-radius:14px;padding:14px;font-size:16px;resize:vertical}
.hint{color:var(--muted);font-size:14px;margin-top:8px}

.cta{display:flex;justify-content:center;margin-top:14px}
.btn{appearance:none;border:0;border-radius:24px;padding:12px 18px;min-width:210px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));color:#002329;font-weight:900;
  box-shadow:0 0 14px rgba(0,181,204,.5),0 0 30px rgba(0,181,204,.25);cursor:pointer}
.btn[disabled]{background:#29404a;color:#86a6af;box-shadow:none;cursor:not-allowed}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <button class="back" id="backBtn">← Indietro</button>
    <div class="pill" id="pill"> </div>
  </div>

  <h1>La tua domanda</h1>

  <div class="card">
    <p class="label">Scrivi la tua domanda What?f…</p>
    <textarea id="q" class="ta" placeholder="Esempio: Se avessi accettato quel lavoro a Milano?"></textarea>
    <p class="hint">
      Suggerimento: sii specifico. Es: “Se restassi a L’Aquila per i prossimi 2 anni, come cambierebbe la mia carriera?”
    </p>
    <div class="cta">
      <button id="go" class="btn" disabled>Scopri</button>
    </div>
  </div>
</main>

<script>
  // Ripristina selezioni (periodo/stile) dal primo step
  const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
  const pill  = document.getElementById('pill');
  function nicePrefs(){
    const a = prefs.periodo==='past'?'Passato':(prefs.periodo==='future'?'Futuro':null);
    const b = prefs.stile==='whatif'?'What if':(prefs.stile==='wtf'?'What the F':null);
    return [a,b].filter(Boolean).join(' • ');
  }
  pill.textContent = nicePrefs();

  // Back
  document.getElementById('backBtn').onclick = () => history.back();

  // Abilita CTA se c'è testo
  const q = document.getElementById('q');
  const go = document.getElementById('go');
  q.addEventListener('input', ()=>{ go.disabled = q.value.trim().length<3; });

  // Salva domanda e passa al risultato
  go.addEventListener('click', ()=>{
    const text = q.value.trim();
    if(!text) return;
    sessionStorage.setItem('whatif_question', text);
    location.href = 'fifth.html';
  });

  // Se l'utente torna, ripristina la bozza
  const cached = sessionStorage.getItem('whatif_question');
  if(cached){ q.value = cached; go.disabled = false; }
</script>
</body>
</html>
