<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — La tua domanda</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC;
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;max-width:980px;margin:0 auto;padding:18px 16px 28px}
    .topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
    .back{appearance:none;border:0;border-radius:14px;background:#0f1820;color:#d3e6ea;
      padding:10px 14px;font-weight:700;cursor:pointer}
    .pill{color:var(--muted);font-size:14px;margin-left:auto}
    h1{font-size:clamp(28px,6vw,40px);margin:8px 0 12px}
    .card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
    textarea{width:100%;min-height:140px;background:#0b1218;color:#cfe6eb;border:1px solid #20303a;
      border-radius:14px;padding:16px;font-size:16px;outline:none}
    .hint{color:var(--muted);font-size:14px;margin:10px 4px 0}
    .actions{display:flex;gap:12px;justify-content:center;margin-top:16px}
    .btn{appearance:none;border:0;border-radius:24px;padding:12px 18px;font-weight:900;cursor:pointer}
    .primary{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329;min-width:200px}
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <button class="back" onclick="history.back()">← Indietro</button>
    <span class="pill" id="contextPill"></span>
  </div>

  <h1>La tua domanda</h1>

  <div class="card">
    <label for="q" style="display:block;margin:0 0 8px;color:var(--muted);font-weight:700">
      Scrivi la tua domanda What?f…
    </label>
    <textarea id="q" placeholder="Esempio: Se avessi accettato quel lavoro a Milano?"></textarea>

    <div class="hint">
      Suggerimento: sii specifico. Es: “Se restassi a L’Aquila i prossimi 2 anni, cosa cambierebbe nella mia carriera?”
    </div>

    <div class="actions">
      <button class="primary btn" id="go">Scopri</button>
    </div>
  </div>
</main>

<script>
  // mostro il contesto scelto nella home (Passato/Futuro • What if / What the F)
  const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
  const pill = document.getElementById('contextPill');
  const period = prefs.periodo==='past' ? 'Passato' : prefs.periodo==='future' ? 'Futuro' : '—';
  const style  = prefs.stile==='whatif' ? 'What if (plausibile)' : prefs.stile==='wtf' ? 'What the F (ironico)' : '—';
  pill.textContent = `${period} • ${style}`;

  document.getElementById('go').addEventListener('click', ()=>{
    const q = document.getElementById('q').value.trim();
    if(!q){ alert('Scrivi una domanda.'); return; }
    const profile = JSON.parse(localStorage.getItem('whatif_profile')||'{}');
    const payload = { question:q, prefs, profile };
    localStorage.setItem('whatif_last', JSON.stringify(payload));
    location.href = 'fifth.html';
  });
</script>
</body>
</html>
