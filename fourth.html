<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFFFFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01;          /* What?f */
  --wtf1:#3A6B56; --wtf2:#5A8C75;         /* WTF */
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04)}
.meta{font-size:12px;color:var(--muted)}
.icon{cursor:pointer;border:none;background:transparent;color:#fff;font-size:18px}
hr.sep{border:none;height:1px;background:rgba(255,255,255,.08);margin:10px 0}
summary{cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Stile -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row">
        <span class="badge" id="styleBadge">🎭 —</span>
      </div>
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <!-- Domanda centrale -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <div class="row" style="margin-top:10px;justify-content:space-between">
      <input id="extraInput" class="input" placeholder="Aggiungi un dettaglio (opzionale)…" />
      <button class="btn ghost" id="suggestBtn">+ Suggerimenti</button>
    </div>

    <div class="chips hidden" id="extraChips" style="margin-top:8px"></div>

    <div class="row" style="margin-top:12px;justify-content:center">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
    </div>
  </div>

  <!-- Micro-domande semplici (collassabili) -->
  <div class="card center">
    <details id="microDetails" open>
      <summary>🧩 Micro-domande di oggi <span class="meta" id="microHint">(1 volta al giorno)</span></summary>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <input id="moodToday" class="input" placeholder="Oggi come ti senti? (una parola)">
        <input id="timeWindow" class="input" placeholder="Quando decidi davvero? (es. 1–3 mesi)">
        <input id="anchorNow" class="input" placeholder="Cosa ti tiene qui adesso?">
        <input id="firstSignal" class="input" placeholder="Che segno ti dice: funziona?">
      </div>
      <div class="row" style="margin-top:8px;justify-content:flex-end">
        <button class="btn ghost" id="saveMicroBtn">💾 Salva micro-profilo</button>
      </div>
      <div class="meta" id="microSaved"></div>
    </details>
  </div>

  <!-- Contesto reale (collassabile) -->
  <div class="card center">
    <details id="realityDetails">
      <summary>🌍 Contesto reale <span class="meta" id="realityHint">(usato dal narratore)</span></summary>
      <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="factToday" class="input" placeholder="Fatto di oggi (evento/meteo/notizia)…">
        <input id="factSource" class="input" placeholder="Fonte (opzionale)">
        <input id="cityInput" class="input" placeholder="Città (es. L’Aquila)">
        <select id="seasonInput" class="input">
          <option value="">Stagione</option><option>Inverno</option><option>Primavera</option><option>Estate</option><option>Autunno</option>
        </select>
        <label class="row" style="gap:8px">
          <input type="checkbox" id="fantasyToggle">
          <span id="fantasyLbl">Modalità senza fatti reali</span>
        </label>
      </div>
    </details>
  </div>

  <!-- Domande salvate per domani (collassabile) -->
  <div class="card center">
    <details id="nextDetails">
      <summary>🗓️ Domande salvate per domani</summary>
      <div id="nextList" class="list" style="margin-top:10px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" id="clearNextBtn">🧹 Svuota</button>
      </div>
    </details>
  </div>

  <!-- Storie recenti (collassabile) -->
  <div class="card center">
    <details id="storiesDetails">
      <summary>📚 Le tue storie recenti</summary>
      <div id="storyList" class="list" style="margin-top:10px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" id="clearStoriesBtn">🧹 Svuota</button>
      </div>
    </details>
  </div>

</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    yourq:"La tua domanda",
    add:"Aggiungi un dettaglio (opzionale)…",
    suggest:"+ Suggerimenti",
    gen:"✨ Genera risposta",
    microTitle:"🧩 Micro-domande di oggi",
    microHint:"(1 volta al giorno)",
    saveMicro:"💾 Salva micro-profilo",
    microSaved:"Micro-profilo salvato per oggi.",
    realityTitle:"🌍 Contesto reale",
    realityHint:"(usato dal narratore)",
    fantasy:"Modalità senza fatti reali",
    savedTomorrow:"🗓️ Domande salvate per domani",
    stories:"📚 Le tue storie recenti",
    emptyNext:"— Nessuna domanda salvata.",
    emptyStories:"— Nessuna storia recente.",
    use:"Usa",
    view:"Vedi",
    del:"✖",
    play:"▶",
    clear:"🧹 Svuota",
    free:(l,d)=>`Free oggi: ${l}/${d}`,
    noCredits:"Hai finito i crediti giornalieri. Torna domani o passa a PRO.",
    placeholderQ:"E se tornassi a vivere all’Aquila?",
    placeholderExtra:"Aggiungi un dettaglio (opzionale)…"
  },
  en:{
    title:"Set your question",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    yourq:"Your question",
    add:"Add a detail (optional)…",
    suggest:"+ Suggestions",
    gen:"✨ Generate answer",
    microTitle:"🧩 Today’s micro-questions",
    microHint:"(once per day)",
    saveMicro:"💾 Save micro-profile",
    microSaved:"Micro-profile saved for today.",
    realityTitle:"🌍 Real-world context",
    realityHint:"(used by the narrator)",
    fantasy:"No real-world facts mode",
    savedTomorrow:"🗓️ Saved for tomorrow",
    stories:"📚 Your recent stories",
    emptyNext:"— No saved questions.",
    emptyStories:"— No recent stories.",
    use:"Use",
    view:"View",
    del:"✖",
    play:"▶",
    clear:"🧹 Clear",
    free:(l,d)=>`Free today: ${l}/${d}`,
    noCredits:"You ran out of daily credits. Come back tomorrow or go PRO.",
    placeholderQ:"What if I moved back to L’Aquila?",
    placeholderExtra:"Add a detail (optional)…"
  }
};
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Prefs/Tema/Crediti ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

const prefs = readJSON('whatif_prefs',{stile:'whatif',pro:false});
let currentStyle = prefs.stile || 'whatif';
document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');

const DAILY = (prefs.pro?10:3);
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:!!prefs.pro});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  c.pro = !!prefs.pro;
  writeJSON('whatif_credits',c);
}
function freeLeft(){ const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:!!prefs.pro}); return Math.max(0, DAILY - (c.used||0)); }
function useCredit(){ const c=readJSON('whatif_credits'); c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderFree(); }
function renderFree(){ document.getElementById('freeBadge').textContent=T.free(freeLeft(),DAILY); }
ensureCredits(); renderFree();

/* Dev reset via long-press sul badge credit */
(function devReset(){
  const b=document.getElementById('freeBadge'); let t=null;
  b.title = (lang==='en'?'Long-press: reset today (dev only)':'Pressione lunga: azzera oggi (dev)');
  b.addEventListener('pointerdown', ()=>{ t=setTimeout(()=>{ const c=readJSON('whatif_credits'); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderFree(); alert(lang==='en'?'Today credits reset (dev)':'Crediti di oggi azzerati (dev)'); },1400); });
  b.addEventListener('pointerup', ()=> clearTimeout(t));
  b.addEventListener('pointerleave', ()=> clearTimeout(t));
})();

/* ===== UI text ===== */
const $=id=>document.getElementById(id);
$('titleH1').textContent=T.title;
$('qLabel').textContent=T.yourq;
$('qInput').placeholder=T.placeholderQ;
$('extraInput').placeholder=T.placeholderExtra;
$('suggestBtn').textContent=T.suggest;
$('goBtn').textContent=T.gen;
$('microHint').textContent=T.microHint;
$('saveMicroBtn').textContent=T.saveMicro;
$('realityHint').textContent=T.realityHint;
$('fantasyLbl').textContent=T.fantasy;
$('chipWhatIf').textContent=T.whatif;
$('chipWTF').textContent=T.wtf;
$('langBtn').textContent=lang.toUpperCase();

/* ===== lingua / nav ===== */
$('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';

/* ===== stile ===== */
function renderStyle(){
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
  $('styleBadge').textContent = "🎭 " + (currentStyle==='wtf' ? (lang==='en'?"What the F":"What the F") : (lang==='en'?"What if":"What if"));
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
}
renderStyle();
$('styleChips').addEventListener('click', (e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle=b.dataset.style;
  writeJSON('whatif_prefs',{...prefs,stile:currentStyle});
  renderStyle();
});

/* ===== suggestion chips compatti ===== */
const EXTRA_SUG = {
  it:["primo segnale","budget","luogo preciso","tempo disponibile","contatto chiave","vincolo reale"],
  en:["first signal","budget","specific place","time window","key contact","real constraint"]
}[lang];
$('suggestBtn').onclick=()=>{
  const box=$('extraChips'); box.innerHTML=""; box.classList.toggle('hidden');
  (EXTRA_SUG||[]).forEach(txt=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
    b.onclick=()=>{ const i=$('extraInput'); i.value = i.value ? (i.value+' • '+txt) : txt; i.focus(); };
    box.appendChild(b);
  });
};

/* ===== micro-domande — una volta al giorno ===== */
function lockMicroIfSaved(){
  const mp = readJSON('micro_profile',null);
  const today = new Date().toISOString().slice(0,10);
  if(mp && mp.date===today){
    ['moodToday','timeWindow','anchorNow','firstSignal'].forEach(id=>{ const el=$(id); el.value = mp.data?.[id]||el.value; el.disabled=true; });
    $('microSaved').textContent = (lang==='en'?T.microSaved:T.microSaved);
  }
}
lockMicroIfSaved();

$('saveMicroBtn').onclick=()=>{
  const data={
    moodToday: ($('moodToday').value||"").trim(),
    timeWindow: ($('timeWindow').value||"").trim(),
    anchorNow: ($('anchorNow').value||"").trim(),
    firstSignal: ($('firstSignal').value||"").trim()
  };
  const today = new Date().toISOString().slice(0,10);
  writeJSON('micro_profile', { date: today, data });
  lockMicroIfSaved();
};

/* ===== ambient/facts pack ===== */
function getAmbient(){
  const d=new Date();
  const weekday = d.toLocaleDateString(lang==='en'?'en-GB':'it-IT',{weekday:'long'});
  return {
    dateISO: d.toISOString().slice(0,10),
    weekday,
    season: ($('seasonInput').value||"") || undefined,
    city: ($('cityInput').value||"") || undefined
  };
}
function gatherFacts(){
  const facts=[];
  const f1=($('factToday').value||"").trim();
  const src=($('factSource').value||"").trim();
  if(f1) facts.push({ text:f1, source:src||undefined });
  const mp = readJSON('micro_profile',null);
  const micro = mp && mp.date===getAmbient().dateISO ? {
    mood: mp.data?.moodToday,
    timeWindow: mp.data?.timeWindow,
    anchorNow: mp.data?.anchorNow,
    firstSignal: mp.data?.firstSignal
  } : {};
  return { facts, micro };
}

/* ===== generate ===== */
$('goBtn').onclick=async ()=>{
  const domanda = ($('qInput').value||"").trim();
  if(!domanda){ $('qInput').focus(); return; }

  if(freeLeft()<=0){ alert(T.noCredits); return; }

  // pack profilo
  const fantasyMode = !!$('fantasyToggle').checked;
  const ambient = getAmbient();
  const { facts, micro } = gatherFacts();
  const payload = {
    domanda,
    stile: currentStyle,
    lang,
    extra: ($('extraInput').value||"").trim(),
    profile: { ambient, reality:{ fantasyMode, facts }, micro }
  };

  // salva preferenze + domanda
  writeJSON('whatif_prefs', { ...readJSON('whatif_prefs',{}), stile: currentStyle });
  LS.setItem('domanda', domanda);
  writeJSON('whatif_request', { domanda, stile: currentStyle, extra: ($('extraInput').value||"").trim(), profile: payload.profile });

  // consuma credito e vai alla quinta
  useCredit();
  location.href='fifth.html';
};

/* ===== saved-for-tomorrow ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=$('nextList'); box.innerHTML="";
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='meta'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,20).forEach((it,idx)=>{
    const row=document.createElement('div'); row.className='item';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:540px">${it.q||'—'}</div><div class="meta">${fmtDate(it.ts||Date.now())}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.use;
    useBtn.onclick=()=>{ $('qInput').value = it.q || ""; window.scrollTo({top:0,behavior:'smooth'}); };
    const del=document.createElement('button'); del.className='icon'; del.textContent=T.del;
    del.onclick=()=>{ const arr=readJSON('next_prompts',[]); arr.splice(idx,1); writeJSON('next_prompts',arr); renderNext(); };
    right.appendChild(useBtn); right.appendChild(del);
    row.appendChild(left); row.appendChild(right); box.appendChild(row);
  });
}
$('clearNextBtn').onclick=()=>{ writeJSON('next_prompts',[]); renderNext(); };

/* ===== recent stories ===== */
function renderStories(){
  const box=$('storyList'); box.innerHTML="";
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='meta'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(-20).reverse().forEach((it,idx)=>{
    const row=document.createElement('div'); row.className='item';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:540px">${it.domanda||'—'}</div><div class="meta">${fmtDate(it.ts)} · ${(it.stile==='wtf'?'WTF':'What?f')}</div>`;
    const right=document.createElement('div'); right.className='row';
    const view=document.createElement('button'); view.className='btn'; view.textContent=T.view;
    view.onclick=()=>{ writeJSON('replay_story',it); location.href='fifth.html?view=replay'; };
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.use;
    useBtn.onclick=()=>{ $('qInput').value = it.domanda||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const del=document.createElement('button'); del.className='icon'; del.textContent=T.del;
    del.onclick=()=>{ const a=readJSON('cronologia',[]); const ix=a.findIndex(x=>x.ts===it.ts); if(ix>=0){a.splice(ix,1); writeJSON('cronologia',a); renderStories();} };
    right.appendChild(view); right.appendChild(useBtn); right.appendChild(del);
    row.appendChild(left); row.appendChild(right); box.appendChild(row);
  });
}
$('clearStoriesBtn').onclick=()=>{ writeJSON('cronologia',[]); renderStories(); };

/* ===== boot ===== */
function boot(){
  renderNext(); renderStories();
  // placeholder coerenti
  $('qInput').placeholder = T.placeholderQ;
  $('extraInput').placeholder = T.placeholderExtra;
}
boot();
</script>
</body>
</html>
