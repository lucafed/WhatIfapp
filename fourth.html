<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none;white-space:nowrap}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 12px}
.pill input{border:none;background:transparent;color:#fff;outline:none;min-width:120px}
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
/* Admin modal */
.admin-modal.hidden{display:none}
.admin-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.admin-sheet{width:100%;max-width:520px;background:rgba(20,28,34,.96);border:1px solid var(--line);border-radius:14px;padding:14px}
.admin-head{display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
      <div class="row">
        <span class="badge" id="proBadge">—</span>
      </div>
    </div>
  </div>

  <!-- Question block (pulito, centrale) -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
    <div class="small" id="tipNote" style="margin-top:8px">Tip: puoi cambiare stile e periodo sopra; colori e tono si adattano.</div>
  </div>

  <!-- Micro-domande (dinamiche giornaliere) -->
  <div class="card center" id="microCard">
    <div class="row toggle" id="microHead" style="justify-content:space-between">
      <div class="label" id="microTitle">▼ Micro-domande di oggi</div>
      <div class="small" id="microHint">(una volta al giorno)</div>
    </div>
    <div class="body" id="microBody" style="margin-top:10px">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <div class="pill"><span id="moodIcon">🙂</span><input id="mood" placeholder="Oggi come ti senti?"/></div>
        <div class="pill"><span id="anchorIcon">🧭</span><input id="anchor" placeholder="Cosa ti tiene qui?"/></div>
        <div class="pill"><span id="decideIcon">⚙️</span><input id="decide" placeholder="Come decidi di solito?"/></div>
        <div class="pill"><span id="zodiacIcon">♈</span><input id="zodiac" placeholder="Segno (se vuoi)"/></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="saveMicroBtn">💾 Salva micro-profilo</button>
      </div>
      <div class="small" id="microSavedMsg" style="margin-top:6px"></div>
    </div>
  </div>

  <!-- Spunti rapidi “E se…” (dinamici giornalieri) -->
  <div class="card center collapsed" id="hintsCard">
    <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
      <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
    </div>
    <div class="body" id="hintsBody" style="margin-top:8px">
      <div class="chips" id="hintsChips"></div>
      <div class="small" id="hintsNote" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Salvati per domani -->
  <div class="card center collapsed" id="savedCard">
    <div class="row toggle" id="savedHeader" style="justify-content:space-between">
      <div class="label" id="nextLabel">▶ Domande salvate</div>
      <button class="btn ghost" id="clearSavedBtn">🗑️ Svuota</button>
    </div>
    <div class="body" id="savedBody">
      <div id="nextList" class="list"></div>
    </div>
  </div>

  <!-- Storie recenti -->
  <div class="card center collapsed" id="histCard">
    <div class="row toggle" id="histHeader" style="justify-content:space-between">
      <div class="label" id="storiesLabel">▶ Cronologia</div>
      <button class="btn ghost" id="clearHistoryBtn">🗑️ Svuota</button>
    </div>
    <div class="body">
      <div id="storyList" class="list"></div>
    </div>
  </div>

  <!-- Admin Modal (PIN) -->
  <div id="adminModal" class="admin-modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="admin-sheet">
      <div class="admin-head">
        <h3 id="adminTitle">Admin</h3>
        <button class="btn ghost" id="adminClose">✕</button>
      </div>
      <div class="row" style="margin-top:6px">
        <input id="adminPin" class="input" type="password" placeholder="PIN amministratore"/>
        <button id="adminEnter" class="btn primary">Entra</button>
      </div>
      <p id="adminStatus" class="small" style="margin:6px 0 2px"></p>
      <div id="adminPanel" class="hidden" style="margin-top:10px">
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button id="adminReset" class="btn primary">🔄 Reset crediti (oggi)</button>
          <button id="adminTogglePro" class="btn ghost">⭐ Toggle PRO</button>
        </div>
        <p class="small" style="margin-top:8px">
          <span id="adminCreditsState">—</span> · PRO: <span id="adminProState">—</span>
        </p>
      </div>
    </div>
  </div>

</main>

<script>
// ===== I18N =====
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    periodPast:"Passato", periodFuture:"Futuro",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    yourq:"La tua domanda", gen:"✨ Genera risposta", clear:"Svuota",
    tip:"Tip: puoi cambiare stile e periodo sopra; colori e tono si adattano.",
    free:(l,d)=>`Free oggi: ${l}/${d}`, proOn:"PRO attivo", proOff:"PRO non attivo",
    microT:"▼ Micro-domande di oggi", microHint:"(una volta al giorno)", microSaved:"Micro-profilo salvato per oggi.", microOnce:"Già salvato oggi.",
    saved:"▶ Domande salvate", stories:"▶ Cronologia",
    use:"Usa", play:"▶", emptyNext:"— Nessuna domanda salvata.", emptyStories:"— Nessuna storia.",
    clearSaved:"🗑️ Svuota", clearHist:"🗑️ Svuota",
    hints:"▶ Spunti rapidi “E se…”", hintsNote:"Clicca uno spunto per riempire la domanda.",
    h1:"E se cambiassi lavoro?", h2:"E se cambiassi città?", h3:"E se provassi a mettermi in proprio?", h4:"E se tornassi a studiare?",
    adminTitle:"Admin", adminEnter:"Entra", adminPin:"PIN amministratore",
    adminReset:"🔄 Reset crediti (oggi)", adminPro:"⭐ Toggle PRO",
    pinOk:"PIN ok", pinBad:"PIN errato",
    resetOk:"Crediti di oggi azzerati su questo dispositivo.",
    proOn:"PRO attivato su questo dispositivo.", proOff2:"PRO disattivato su questo dispositivo.",
    outOfCredits:"Hai finito i crediti di oggi."
  },
  en:{
    title:"Set your question",
    periodPast:"Past", periodFuture:"Future",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    yourq:"Your question", gen:"✨ Generate answer", clear:"Clear",
    tip:"Tip: switch style and period above; tone & colors adapt.",
    free:(l,d)=>`Free today: ${l}/${d}`, proOn:"PRO active", proOff:"PRO not active",
    microT:"▼ Today’s micro-questions", microHint:"(once per day)", microSaved:"Micro-profile saved for today.", microOnce:"Already saved today.",
    saved:"▶ Saved questions", stories:"▶ History",
    use:"Use", play:"▶", emptyNext:"— No saved questions.", emptyStories:"— No history.",
    clearSaved:"🗑️ Clear", clearHist:"🗑️ Clear",
    hints:"▶ Quick “What if…” prompts", hintsNote:"Click a prompt to fill the question.",
    h1:"What if I changed jobs?", h2:"What if I moved city?", h3:"What if I started my own thing?", h4:"What if I went back to study?",
    adminTitle:"Admin", adminEnter:"Enter", adminPin:"Admin PIN",
    adminReset:"🔄 Reset credits (today)", adminPro:"⭐ Toggle PRO",
    pinOk:"PIN ok", pinBad:"Wrong PIN",
    resetOk:"Today’s credits reset on this device.",
    proOn:"PRO enabled on this device.", proOff2:"PRO disabled on this device.",
    outOfCredits:"You’ve used today’s credits."
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

// ===== Helpers & state =====
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function rngForDay(seedStr){
  // seed PRNG on YYYY-MM-DD
  let s=[...seedStr].reduce((a,c)=>a+c.charCodeAt(0),0);
  return ()=>{ s=(s*9301+49297)%233280; return s/233280; };
}

let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

// ===== Credits =====
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  writeJSON('whatif_credits',c);
}
function leftCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  const cap = prefs.pro?10:3;
  return Math.max(0, cap-(c.used||0));
}
function renderCredits(){
  const cap = prefs.pro?10:3;
  document.getElementById('freeBadge').textContent=T.free(leftCredits(),cap);
  document.getElementById('proBadge').textContent = prefs.pro? T.proOn : T.proOff;
}
ensureCredits(); renderCredits();

// ===== UI text =====
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.yourq;
document.getElementById('goBtn').textContent=T.gen;
document.getElementById('clearBtn').textContent=T.clear;
document.getElementById('tipNote').textContent=T.tip;
document.getElementById('chipWhatIf').textContent=T.whatif;
document.getElementById('chipWTF').textContent=T.wtf;
document.getElementById('nextLabel').textContent=T.saved;
document.getElementById('storiesLabel').textContent=T.stories;
document.getElementById('langBtn').textContent=lang.toUpperCase();

// style & period badges
function renderBadges(){
  document.getElementById('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past'? T.periodPast : T.periodFuture);
  document.getElementById('styleBadge').textContent   = "🎭 " + (prefs.stile==='wtf'? T.wtf.split(' (')[0] : T.whatif.split(' (')[0]);
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
}
renderBadges();

// ===== nav =====
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
document.getElementById('periodoBadge').onclick=()=>{ prefs.periodo = (prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); renderBadges(); };

// ===== style switching =====
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  renderBadges();
});

// ===== Question
document.getElementById('qInput').placeholder = (lang==='en' ? "What if I moved back to L’Aquila?" : "E se tornassi a vivere all’Aquila?");
document.getElementById('goBtn').onclick=()=>{
  const domanda=(document.getElementById('qInput').value||"").trim();
  if(!domanda){ document.getElementById('qInput').focus(); return; }

  // credits
  const c=readJSON('whatif_credits'); const used=(c.used||0);
  const cap = prefs.pro?10:3;
  if(used>=cap){ alert(T.outOfCredits); return; }
  c.used=used+1; writeJSON('whatif_credits',c); renderCredits();

  // pack request
  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  writeJSON('whatif_request',{ domanda, stile:prefs.stile, lang, extra:"", micro, fantasy_mode:false, periodo:prefs.periodo });
  location.href='fifth.html';
};
document.getElementById('clearBtn').onclick=()=>{ document.getElementById('qInput').value=""; document.getElementById('qInput').focus(); };

// ===== Micro-questions (daily dynamic placeholders) =====
const microCard=document.getElementById('microCard');
const microSaved=readJSON('micro_saved',{date:"",ok:false});

function renderMicro(){
  document.getElementById('microTitle').textContent = T.microT;
  document.getElementById('microHint').textContent = T.microHint;

  // Se già salvate oggi: resta collassato
  if(microSaved.date===todayStr()){
    microCard.classList.add('collapsed');
    document.getElementById('microSavedMsg').textContent=T.microSaved;
    return;
  }

  // Pool di prompt per i 4 campi (cambiano per data)
  const SEED = todayStr();
  const rand = rngForDay(SEED);

  const moodPool = (lang==='en'
    ? [
      "How’s your energy really, from 0 to “I can move cities”?",
      "Today you feel more anchor or sail?",
      "If your mood had a ringtone, which one?",
      "What color is your head right now?"
    ]
    : [
      "Quanta energia hai davvero, da 0 a “trasloco la vita”?",
      "Oggi ti senti più àncora o vela?",
      "Se il tuo umore fosse una suoneria, quale?",
      "Di che colore è la tua testa adesso?"
    ]);

  const anchorPool = (lang==='en'
    ? [
      "What’s keeping you here lately (person, habit, bill, dream)?",
      "Name one thing you won’t give up this month.",
      "Which routine feels surprisingly good to protect?",
      "What’s the tiny ritual that keeps you sane?"
    ]
    : [
      "Cosa ti tiene qui ultimamente (persona, abitudine, bolletta, sogno)?",
      "Una cosa che non molli questo mese.",
      "Quale routine ti sorprende proteggere?",
      "Qual è il piccolo rito che ti tiene in riga?"
    ]);

  const decidePool = (lang==='en'
    ? [
      "How do you usually decide: gut, list, coin, or panic?",
      "When you choose, what wins: time, money, or peace?",
      "You pick faster with deadlines or with coffee?",
      "Describe your default decision algorithm in 5 words."
    ]
    : [
      "Come decidi di solito: pancia, lista, moneta o panico?",
      "Quando scegli vince cosa: tempo, soldi o pace?",
      "Scegli più in fretta con scadenze o con caffè?",
      "Descrivi il tuo algoritmo di scelta in 5 parole."
    ]);

  const zodiacPool = (lang==='en'
    ? [
      "Sign (optional) or your personal weather.",
      "Astro stuff (if you want) or a lucky habit.",
      "Write your sign or your superstition.",
      "Skip sign if you want; write your lucky snack."
    ]
    : [
      "Segno (opzionale) o il tuo meteo personale.",
      "Astro-cose (se vuoi) o un’abitudine portafortuna.",
      "Scrivi il segno o la tua superstizione.",
      "Salta il segno se vuoi: scrivi lo snack portafortuna."
    ]);

  // Emojis dinamiche leggere
  const moodIcons = ["🙂","😌","🤘","🧊","⚡","🌤️","🧩"];
  const anchorIcons = ["🧭","⚓","🏠","🧱","🪴","📌","🧷"];
  const decideIcons = ["⚙️","🧠","🎯","🪙","📋","⏳","☕"];
  const zodiacIcons = ["♈","♉","♊","♋","♌","♍","✨"];

  document.getElementById('mood').placeholder   = moodPool[Math.floor(rand()*moodPool.length)];
  document.getElementById('anchor').placeholder = anchorPool[Math.floor(rand()*anchorPool.length)];
  document.getElementById('decide').placeholder = decidePool[Math.floor(rand()*decidePool.length)];
  document.getElementById('zodiac').placeholder = zodiacPool[Math.floor(rand()*zodiacPool.length)];

  document.getElementById('moodIcon').textContent   = moodIcons[Math.floor(rand()*moodIcons.length)];
  document.getElementById('anchorIcon').textContent = anchorIcons[Math.floor(rand()*anchorIcons.length)];
  document.getElementById('decideIcon').textContent = decideIcons[Math.floor(rand()*decideIcons.length)];
  document.getElementById('zodiacIcon').textContent = zodiacIcons[Math.floor(rand()*zodiacIcons.length)];
}
renderMicro();

document.getElementById('microHead').onclick=()=>{ 
  if(microSaved.date===todayStr()) return; // resta collassato dopo salvataggio
  microCard.classList.toggle('collapsed'); 
};
document.getElementById('saveMicroBtn').onclick=()=>{
  if(microSaved.date===todayStr()){ document.getElementById('microSavedMsg').textContent=T.microOnce; return; }
  const micro={
    mood:(document.getElementById('mood').value||"").trim(),
    anchor:(document.getElementById('anchor').value||"").trim(),
    decide:(document.getElementById('decide').value||"").trim(),
    zodiac:(document.getElementById('zodiac').value||"").trim()
  };
  writeJSON('micro_profile', micro);
  writeJSON('micro_saved', {date:todayStr(),ok:true});
  document.getElementById('microSavedMsg').textContent=T.microSaved;
  microCard.classList.add('collapsed');
};

// ===== Hints “E se…” (daily deterministic) =====
const hintsState = readJSON('ui_hints_state',{collapsed:true});
const hintsCard=document.getElementById('hintsCard');
if(hintsState.collapsed) hintsCard.classList.add('collapsed');
document.getElementById('hintsHeader').onclick=()=>{ 
  hintsCard.classList.toggle('collapsed'); 
  hintsState.collapsed=hintsCard.classList.contains('collapsed'); 
  writeJSON('ui_hints_state',hintsState); 
};
document.getElementById('hintsTitle').textContent=T.hints;
document.getElementById('hintsNote').textContent=T.hintsNote;

// Pool spunti (ampio). Verranno selezionati 4 al giorno in modo deterministico.
const HINT_POOL_IT = [
  "E se cambiassi lavoro?",
  "E se cambiassi città?",
  "E se provassi a mettermi in proprio?",
  "E se tornassi a studiare?",
  "E se mollassi tutto e partissi per il Giappone?",
  "E se aprissi un chiringuito in Islanda?",
  "E se parlassi con il me di 10 anni fa?",
  "E se imparassi una lingua strana?",
  "E se mi svegliassi ogni giorno all’alba per un mese?",
  "E se facessi pace con una persona?",
  "E se vivessi per 30 giorni senza social?",
  "E se provassi a cambiare routine per una settimana?",
  "E se prendessi un cane?",
  "E se mettessi da parte ogni giorno 5 euro?",
  "E se provassi a suonare la chitarra?",
  "E se organizzassi un viaggio da solo?",
  "E se chiedessi un aumento?",
  "E se facessi volontariato?",
  "E se provassi a scrivere un libro?",
  "E se aprissi un canale di qualcosa che ami?"
];
const HINT_POOL_EN = [
  "What if I changed jobs?",
  "What if I moved city?",
  "What if I started my own thing?",
  "What if I went back to study?",
  "What if I dropped everything and moved to Japan?",
  "What if I opened a beach bar in Iceland?",
  "What if I talked to my 10-years-ago self?",
  "What if I learned a weird language?",
  "What if I woke up at dawn for a month?",
  "What if I made peace with someone?",
  "What if I lived 30 days without social media?",
  "What if I changed my routine for a week?",
  "What if I adopted a dog?",
  "What if I saved 5 euros a day?",
  "What if I learned guitar?",
  "What if I traveled alone?",
  "What if I asked for a raise?",
  "What if I volunteered?",
  "What if I wrote a book?",
  "What if I launched a channel about what I love?"
];

function dailyHints(pool, n=4) {
  const seed = todayStr();
  const rnd = rngForDay(seed);
  const seen = new Set();
  const out=[];
  while(out.length<n && seen.size<pool.length){
    const idx = Math.floor(rnd()*pool.length);
    if(seen.has(idx)) continue;
    seen.add(idx); out.push(pool[idx]);
  }
  return out;
}

const hintsWrap=document.getElementById('hintsChips');

  b.className='chip';
  b.textContent=h;
  b.onclick=()=>{ document.getElementById('qInput').value = h; window.scrollTo({top:0,behavior:'smooth'}); };

});

function renderStories(){

    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;

// ===== Admin PIN inline (long-press su badge crediti) =====
const ADMIN_PIN_HASH_HEX = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"; // <--- SOSTITUISCI con l'hash del tuo PIN

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const adminModal = document.getElementById('adminModal');
const adminPin = document.getElementById('adminPin');
const adminEnter = document.getElementById('adminEnter');
const adminClose = document.getElementById('adminClose');
const adminPanel = document.getElementById('adminPanel');
const adminStatus = document.getElementById('adminStatus');
const adminCreditsState = document.getElementById('adminCreditsState');
const adminProState = document.getElementById('adminProState');
const adminReset = document.getElementById('adminReset');
const adminTogglePro = document.getElementById('adminTogglePro');

document.getElementById('adminTitle').textContent=T.adminTitle;
adminPin.placeholder=T.adminPin; adminEnter.textContent=T.adminEnter;
adminReset.textContent=T.adminReset; adminTogglePro.textContent=T.adminPro;

function openAdmin(){ adminModal.classList.remove('hidden'); adminPin.value=""; adminStatus.textContent=""; adminPanel.classList.add('hidden'); adminPin.focus(); renderAdminState(); }
function closeAdmin(){ adminModal.classList.add('hidden'); }
adminClose.onclick = closeAdmin;
adminModal.addEventListener('click',(e)=>{ if(e.target===adminModal) closeAdmin(); });

adminEnter.onclick = async ()=>{
  const pin = (adminPin.value||"").trim();
  if(!pin){ adminStatus.textContent = T.adminPin; return; }
  const hex = await sha256Hex(pin);
  if(hex === ADMIN_PIN_HASH_HEX){
    adminStatus.innerHTML = `<span style="color:#7CDA8E">${T.pinOk}</span>`;
    adminPanel.classList.remove('hidden');
    renderAdminState();
  } else {
    adminStatus.innerHTML = `<span style="color:#F27A7A">${T.pinBad}</span>`;
    adminPanel.classList.add('hidden');
  }
};
function renderAdminState(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  adminCreditsState.textContent = (lang==='en' ? `Credits left: ${leftCredits()}` : `Crediti residui: ${leftCredits()}`);
  adminProState.textContent = prefs.pro ? (lang==='en'?'ON':'ON') : 'OFF';
}
adminReset.onclick = ()=>{
  const c=readJSON('whatif_credits',{date:todayStr(),used:0});
  c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderCredits(); renderAdminState();
  alert(T.resetOk);
};
adminTogglePro.onclick = ()=>{
  prefs.pro=!prefs.pro; writeJSON('whatif_prefs',prefs); renderCredits(); renderAdminState();
  alert(prefs.pro ? T.proOn : T.proOff2);
};
// apertura nascosta via long-press sul badge crediti
(function hookLongPress(){
  const b = document.getElementById('freeBadge'); if(!b) return;
  let t=null;
  b.addEventListener('pointerdown', ()=>{ t=setTimeout(openAdmin, 700); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=> b.addEventListener(ev, ()=>clearTimeout(t)));
})();
</script>
