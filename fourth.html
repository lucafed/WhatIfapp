<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Risultato</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body class="result-page">
  <main class="container container--narrow">
    <header class="page-lead">
      <p class="eyebrow">Scenario</p>
      <h1 id="title">Risultato</h1>
    </header>

    <article id="answer" class="card prose"></article>

    <div class="row gap">
      <button id="likeBtn" class="btn ghost">♡ Mi piace</button>
      <button id="shareBtn" class="btn ghost">Condividi</button>
    </div>

    <div class="row gap top">
      <a href="./third.html" class="btn text">↩︎ Modifica</a>
      <a href="./index.html" class="btn primary" data-next>Nuova domanda</a>
    </div>
  </main>

  <script>
  // Utilità
  const qs = new URLSearchParams(location.search);
  const time = qs.get('time')||'past';
  const scenario = qs.get('scenario')||'sliding';
  const prompt = (qs.get('prompt')||'').replace(/^whatif\s*/i,'');
  const place = qs.get('place')||'';
  const when = qs.get('when')||'';
  const a = [qs.get('a0')||'', qs.get('a1')||'', qs.get('a2')||''];
  const extra = qs.get('extra')||'';

  // Rendering titolo
  const scenarioLabel = scenario==='sliding' ? 'Sliding Doors' : 'What a F?!';
  const titleEl = document.getElementById('title');
  titleEl.textContent = `${scenarioLabel} · ${time==='past'?'Passato':'Futuro'}`;

  // Risposta “smart” locale (stub)
  function buildAnswer(){
    const bullets = [];

    // 3–6 righe sintetiche ma chiare
    if(time==='past'){
      bullets.push(`Se ${prompt}, oggi avresti un percorso che riflette quella scelta${place?` a ${place}`:''}.`);
      bullets.push(`Gli elementi chiave: ${a.filter(Boolean).join('; ') || 'motivazione, tempismo e rete di contatti'}.`);
      bullets.push(`Impatti a breve: maggiore consapevolezza e alcuni cambiamenti pratici ${when?`(a partire da ${when})`:''}.`);
    } else {
      bullets.push(`Se decidi per ${prompt}${place?` a ${place}`:''}, i prossimi passi sarebbero concreti e misurabili.`);
      bullets.push(`Focus: ${a.filter(Boolean).join('; ') || 'strategie, risorse e milestone'}.`);
      bullets.push(`Tra 6–12 mesi potresti vedere effetti tangibili${when?` entro ${when}`:''}.`);
    }

    if(scenario==='wtf'){
      bullets.push(`Twist: un evento improbabile ma plausibile aggiunge colore alla storia.`);
    } else {
      bullets.push(`Piano sobrio: mantieni gli impegni e verifica i progressi ogni 4–6 settimane.`);
    }

    if(extra){
      bullets.push(`Note personali considerate: ${extra.slice(0,140)}${extra.length>140?'…':''}`);
    }

    const p = document.createElement('div');
    p.innerHTML = `<p><strong>${scenarioLabel}</strong> — ${time==='past'?'retrospettiva':'proiezione breve'}.</p>` +
      '<ul>'+bullets.map(b=>`<li>${b}</li>`).join('')+'</ul>' +
      `<p class="muted">Questa è una demo locale. Con l’IA attiva, il testo diventa più lungo e su misura.</p>`;
    return p;
  }

  document.getElementById('answer').appendChild(buildAnswer());

  // Like (locale)
  const likeBtn = document.getElementById('likeBtn');
  let liked=false;
  likeBtn.addEventListener('click', ()=>{
    liked = !liked;
    likeBtn.textContent = liked ? '♥︎ Ti piace' : '♡ Mi piace';
    likeBtn.classList.toggle('liked', liked);
  });

  // Share
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', async ()=>{
    const shareData = {
      title: 'What?f — il mio scenario',
      text: `${scenarioLabel} • ${prompt}`.trim(),
      url: location.href
    };
    try{
      if(navigator.share){
        await navigator.share(shareData);
      }else{
        await navigator.clipboard.writeText(location.href);
        shareBtn.textContent = 'Link copiato ✔︎';
        setTimeout(()=>shareBtn.textContent='Condividi',1500);
      }
    }catch(e){}
  });

  // Swipe universale
  (function enableSwipe(){
    let x0=0,t0=0; const TH=50, TS=500;
    function getNextHref(){
      const exp=document.querySelector('[data-next]');
      if(exp&&exp.getAttribute('href')) return exp.getAttribute('href');
      const guess=document.querySelector('.btn.primary, a[href*="index"]');
      return guess && guess.getAttribute('href');
    }
    addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX;t0=Date.now()},{passive:true});
    addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-x0, dt=Date.now()-t0;
      if(dt<TS && Math.abs(dx)>TH){
        if(dx>0) history.back();
        else{
          const href=getNextHref();
          if(href) location.href=href;
        }
      }
    },{passive:true});
  })();
  </script>
</body>
</html>
