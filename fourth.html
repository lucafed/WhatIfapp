<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{--bg:#0C0F14;--bg2:#0E1724;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;--accent:#1C57A0;--accent2:#FFEC01;--ink:#001f26;--chip:#0f1820;--line:#1b2a34}
html[data-theme="whatif"]{--bg:#0B1018;--bg2:#0E1724;--card:#141C22;--fg:#F4F7FB;--muted:#A7B3C2;--accent:#1C57A0;--accent2:#FFEC01;--ink:#11110A;--chip:#0f1820;--line:#1b2a34}
html[data-theme="wtf"]{--bg:#0B0B0C;--bg2:#101414;--card:#111713;--fg:#EEF5F0;--muted:#A6B6AD;--accent:#3A6B56;--accent2:#5A8C75;--ink:#06110B;--chip:#0F1714;--line:#21322A}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0))}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.first-session{display:none;background:#0e1a23;border:1px solid var(--line);color:#daf0f6;border-radius:14px;padding:12px;margin-bottom:8px}
.qblock{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:rgba(255,255,255,.04)}
.qtitle{display:flex;align-items:center;gap:8px;font-weight:800;color:#DDF6FF;margin-bottom:8px}
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}
.submode{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select{appearance:none;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <div class="row">
    <button class="btn" id="backBtn">←</button>
    <button class="btn" id="homeBtn">🏠</button>
  </div>
  <div class="row">
    <span class="badge" id="styleBadge">🎭 —</span>
    <span class="badge" id="periodoBadge">🕰️ —</span>
    <span class="badge" id="freeBadge">—</span>
    <span class="badge" id="proBadge">FREE</span>
    <!-- Tendina lingue -->
    <select id="langSelect" title="Language">
      <option value="it">IT</option><option value="en">EN</option>
      <option value="es">ES</option><option value="fr">FR</option>
      <option value="de">DE</option>
    </select>
  </div>
</div>

<main>
  <div class="wrap">
    <h1 id="titleH1">Imposta la tua domanda</h1>

    <!-- STILI + PERIODO -->
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
        <div class="chips" id="styleChips">
          <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
          <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
        </div>
        <div class="chips" id="periodoChips">
          <button class="chip" data-periodo="future" id="chipFuture">Futuro</button>
          <button class="chip" data-periodo="past"   id="chipPast">Passato</button>
        </div>
      </div>
      <div id="whatifSubMode" class="submode">
        <button class="chip" data-mode="analitico" id="chipAnalitico">Analitico</button>
        <button class="chip" data-mode="reale"     id="chipReale">Reale/Poetico</button>
      </div>
    </div>

    <!-- DOMANDA -->
    <div class="card center">
      <h3 class="label" id="qLabel">E se…</h3>
      <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
        <button class="btn" id="clearBtn">Svuota</button>
      </div>
      <div class="small" id="tipNote" style="margin-top:8px"></div>
    </div>

    <!-- MICRO-DOMANDE (banner) -->
    <div class="first-session" id="firstSessionBanner"></div>

    <!-- SPUNTI RAPIDI -->
    <div class="card center collapsed" id="hintsCard">
      <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
        <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
      </div>
      <div class="body" id="hintsBody" style="margin-top:8px">
        <div class="chips" id="hintsChips"></div>
        <div class="small" id="hintsNote" style="margin-top:8px"></div>
      </div>
    </div>

    <!-- SALVATI -->
    <div class="card center collapsed" id="savedCard">
      <div class="row toggle" id="savedHeader" style="justify-content:space-between">
        <div class="label" id="nextLabel">▶ Domande salvate</div>
        <button class="btn" id="clearSavedBtn">🗑️ Svuota</button>
      </div>
      <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
    </div>

    <!-- CRONOLOGIA -->
    <div class="card center collapsed" id="histCard">
      <div class="row toggle" id="histHeader" style="justify-content:space-between">
        <div class="label" id="storiesLabel">▶ Cronologia</div>
        <button class="btn" id="clearHistoryBtn">🗑️ Svuota</button>
      </div>
      <div class="body"><div id="storyList" class="list"></div></div>
    </div>
  </div>
</main>

<script>
/* ===== Stato & i18n ===== */
const SUPPORTED_LANGS=["it","en","es","fr","de"];
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase(); if(!SUPPORTED_LANGS.includes(lang)) lang="it";
document.documentElement.lang=lang;
document.getElementById('langSelect').value=lang;

/* I18N minimo */
const I18N={
  it:{title:"Imposta la tua domanda", yourq:"E se…", gen:"✨ Genera risposta", clear:"Svuota",
      hintsT:"▶ Spunti rapidi “E se…”", hintsNote:"Clicca uno spunto per riempire la domanda.",
      firstSession:"Micro-domande di oggi — rispondi adesso, poi spariscono fino a domani.",
      saved:"▶ Domande salvate", stories:"▶ Cronologia", emptyNext:"— Nessuna domanda salvata.", emptyStories:"— Nessuna storia.",
      credits:"Crediti", clearBtn:"🗑️ Svuota"},
  en:{title:"Set your question", yourq:"What if…", gen:"✨ Generate answer", clear:"Clear",
      hintsT:"▶ Quick “What if…”", hintsNote:"Click a hint to fill the question.",
      firstSession:"Today’s micro-questions — answer now, then they hide until tomorrow.",
      saved:"▶ Saved questions", stories:"▶ History", emptyNext:"— No saved questions.", emptyStories:"— No history.",
      credits:"Credits", clearBtn:"🗑️ Clear"}
};
I18N.es=I18N.en; I18N.fr=I18N.en; I18N.de=I18N.en;
const T=I18N[lang];

/* Prefs persistenti */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
let prefs=readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false,mode:'reale'});

/* UI init */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.yourq;
document.getElementById('hintsTitle').textContent=T.hintsT;
document.getElementById('hintsNote').textContent=T.hintsNote;

/* Topbar nav */
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('backBtn').onclick=()=>{ if(history.length>1) history.back(); else location.href='index.html'; };

/* Crediti (semplice) */
function today(){return new Date().toISOString().slice(0,10);}
function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin()?Infinity:(prefs.pro?10:3); }
function ensureCredits(){ const c=readJSON('whatif_credits',{date:today(),used:0}); if(c.date!==today()){c.date=today();c.used=0;} writeJSON('whatif_credits',c); }
function leftCredits(){ const c=readJSON('whatif_credits',{date:today(),used:0}); const cap=capForUser(); return cap===Infinity?"∞":Math.max(0,cap-(c.used||0)); }
function renderCreditsBadge(){
  const cap=capForUser(), left=leftCredits();
  document.getElementById('freeBadge').textContent = (cap===Infinity) ? `${T.credits}: ∞` : `${T.credits}: ${left}/${cap}`;
  document.getElementById('proBadge').textContent = prefs.pro ? 'PRO' : 'FREE';
}
ensureCredits(); renderCreditsBadge();

/* Tema + badges */
function renderBadges(){
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  document.getElementById('styleBadge').textContent = "🎭 " + (prefs.stile==='wtf'?'What the F':'What if');
  document.getElementById('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past'?(lang==='en'?'Past':'Passato'):(lang==='en'?'Future':'Futuro'));
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.querySelectorAll('#periodoChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.periodo===prefs.periodo));
  document.getElementById('whatifSubMode').style.display = (prefs.stile==='whatif') ? 'flex' : 'none';
  document.getElementById('chipAnalitico').classList.toggle('sel', prefs.mode==='analitico');
  document.getElementById('chipReale').classList.toggle('sel', prefs.mode!=='analitico');
}
renderBadges();

/* Interazioni chips */
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs); renderBadges();
});
document.getElementById('periodoChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.periodo=b.dataset.periodo; writeJSON('whatif_prefs',prefs); renderBadges();
});
document.getElementById('whatifSubMode').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.mode=b.dataset.mode; writeJSON('whatif_prefs',prefs); renderBadges();
});

/* Tendina lingue */
document.getElementById('langSelect').onchange=(e)=>{
  lang = e.target.value; LS.setItem('lang', lang); location.reload();
};

/* Domanda */
const qEl=document.getElementById('qInput');
qEl.placeholder = (lang==='it' ? "E se…" : "What if…");
document.getElementById('goBtn').textContent=T.gen;
document.getElementById('clearBtn').textContent=T.clear;

/* Hints — tanti e reali */
const HINT_IT = [
  "E se cambiassi lavoro?",
  "E se cambiassi città?",
  "E se tornassi all’Aquila?",
  "E se aprissi un bar con 20 tavoli?",
  "E se lavorassi 4 giorni a settimana?",
  "E se mettessi da parte 300€ al mese?",
  "E se facessi pace con una persona?",
  "E se mollassi i social per 30 giorni?",
  "E se mi svegliassi all’alba per una settimana?",
  "E se studiassi inglese 20 minuti al giorno?",
  "E se provassi a vivere senza auto?",
  "E se aprissi P.IVA?",
  "E se chiedessi un aumento?",
  "E se adottassi un cane?",
  "E se tornassi a studiare?",
  "E se imparassi a suonare la chitarra?",
  "E se andassi tre mesi all’estero?",
  "E se lavorassi da remoto in montagna?",
  "E se riducessi le spese del 20%?",
  "E se scrivessi un libro di 30 pagine?",
  "E se aprissi un canale su ciò che amo?",
  "E se provassi il digiuno digitale la domenica?",
  "E se facessi volontariato il sabato?",
  "E se ricominciassi a correre?",
  "E se pianificassi un anno sabbatico?"
];
const HINT_EN = [
  "What if I changed jobs?","What if I moved city?","What if I went back to L’Aquila?",
  "What if I opened a 20-table café?","What if I worked 4 days a week?","What if I saved €300 monthly?",
  "What if I made peace with someone?","What if I quit social for 30 days?","What if I woke up at dawn for a week?",
  "What if I studied English 20 min/day?","What if I lived without a car?","What if I went freelance?",
  "What if I asked for a raise?","What if I adopted a dog?","What if I went back to study?",
  "What if I learned guitar?","What if I spent 3 months abroad?","What if I worked remote in the mountains?",
  "What if I cut expenses by 20%?","What if I wrote a 30-page book?","What if I launched a channel?",
  "What if I did a digital fast on Sundays?","What if I volunteered on Saturdays?","What if I started running again?",
  "What if I planned a sabbatical year?"
];
const hintsPool = (lang==='it'?HINT_IT:HINT_EN);
const hintsWrap=document.getElementById('hintsChips');
hintsPool.forEach(h=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=h;
  b.onclick=()=>{ qEl.value=h; window.scrollTo({top:0,behavior:'smooth'}); };
  hintsWrap.appendChild(b);
});
/* Collapsible spunti */
const hintsCard=document.getElementById('hintsCard');
const hintsState=readJSON('ui_hints_state',{collapsed:true});
if(hintsState.collapsed) hintsCard.classList.add('collapsed');
document.getElementById('hintsHeader').onclick=()=>{
  hintsCard.classList.toggle('collapsed');
  hintsState.collapsed=hintsCard.classList.contains('collapsed');
  writeJSON('ui_hints_state',hintsState);
};

/* Submit */
function trySubmit(){
  const domanda=(qEl.value||"").trim(); if(!domanda){ qEl.focus(); return; }
  const c=readJSON('whatif_credits',{date:today(),used:0});
  if(!userIsAdmin()){
    const cap=capForUser();
    if((c.used||0)>=cap){ alert(lang==='en'?'You’ve used today’s credits.':'Hai finito i crediti di oggi.'); return; }
    c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();
  }
  const req={
    domanda,
    stile: prefs.stile,
    mode: (prefs.stile==='whatif' ? (prefs.mode || 'reale') : undefined),
    lang, periodo: prefs.periodo,
    extra:"", micro: readJSON('micro_profile',{}), fantasy_mode:false
  };
  console.log("ASK →", req); // debug: verifica mode
  writeJSON('whatif_request', req);
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

/* Saved & History (collassati) */
const savedState=readJSON('ui_saved_state',{collapsed:true});
const histState =readJSON('ui_hist_state',{collapsed:true});
if(savedState.collapsed) document.getElementById('savedCard').classList.add('collapsed');
if(histState.collapsed)  document.getElementById('histCard').classList.add('collapsed');
document.getElementById('savedHeader').onclick=()=>{ const c=document.getElementById('savedCard'); c.classList.toggle('collapsed'); savedState.collapsed=c.classList.contains('collapsed'); writeJSON('ui_saved_state',savedState); };
document.getElementById('histHeader').onclick =()=>{ const c=document.getElementById('histCard');  c.classList.toggle('collapsed'); histState.collapsed=c.classList.contains('collapsed'); writeJSON('ui_hist_state',histState); };

function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=document.getElementById('nextList'); box.innerHTML='';
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmtDate(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=(lang==='en'?'Use':'Usa');
    useBtn.onclick=()=>{ qEl.value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); writeJSON('whatif_request',{ domanda:item.q||"", stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'reale'):undefined), lang, extra:"", micro:readJSON('micro_profile',{}), fantasy_mode:false, periodo:prefs.periodo }); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderStories(){
  const box=document.getElementById('storyList'); box.innerHTML='';
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story', { domanda:item.domanda, answer:item.risposta||item.answer||"", stile:item.stile||'whatif' }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
renderNext(); renderStories();
</script>
</body>
</html>
