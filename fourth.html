<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:7px 10px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 12px}
.pill input{border:none;background:transparent;color:#fff;outline:none;min-width:140px}
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row">
        <span class="badge" id="styleBadge">🎭 —</span>
      </div>
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <!-- Question block -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <!-- Quick detail chips -->
    <div class="chips" style="margin-top:10px">
      <button class="chip" data-extra="primo segnale" id="c1">primo segnale</button>
      <button class="chip" data-extra="budget" id="c2">budget</button>
      <button class="chip" data-extra="luogo preciso" id="c3">luogo preciso</button>
      <button class="chip" data-extra="tempo disponibile" id="c4">tempo disponibile</button>
      <button class="chip" data-extra="contatto chiave" id="c5">contatto chiave</button>
      <button class="chip" data-extra="vincolo reale" id="c6">vincolo reale</button>
    </div>
    <input id="extraInput" class="input" placeholder="es. primo segnale di successo, budget, luogo specifico…" style="margin-top:8px"/>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Pulisci</button>
    </div>
    <div class="small" id="tipNote" style="margin-top:8px">Tip: puoi cambiare stile sopra; colori e tono si adattano.</div>
  </div>

  <!-- Micro-domande di oggi (1×giorno, poi blocco & collassa) -->
  <div class="card center" id="microCard">
    <div class="row toggle" id="microHead" style="justify-content:space-between">
      <div class="label" id="microTitle">▼ Micro-domande di oggi • 0/1</div>
      <div class="small" id="microHint">(una volta al giorno)</div>
    </div>
    <div class="body" id="microBody" style="margin-top:10px">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <div class="pill"><span>🙂</span><input id="mood" placeholder="Oggi come ti senti?"/></div>
        <div class="pill"><span>📍</span><input id="city" placeholder="Dove sei oggi?"/></div>
        <div class="pill"><span>🧭</span><input id="anchor" placeholder="Cosa ti guida ora?"/></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="saveMicroBtn">💾 Salva micro-profilo</button>
      </div>
      <div class="small" id="microSavedMsg" style="margin-top:6px"></div>
    </div>
  </div>

  <!-- Salvati per domani -->
  <div class="card center collapsed" id="savedCard">
    <div class="row toggle" id="savedHeader" style="justify-content:space-between">
      <div class="label" id="nextLabel">▶ Domande salvate</div>
      <div class="row"><button class="btn ghost" id="clearSavedBtn">Svuota salvate</button></div>
    </div>
    <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
  </div>

  <!-- Cronologia -->
  <div class="card center collapsed" id="histCard">
    <div class="row toggle" id="histHeader" style="justify-content:space-between">
      <div class="label" id="storiesLabel">▶ Cronologia</div>
      <div class="row"><button class="btn ghost" id="clearHistoryBtn">Svuota cronologia</button></div>
    </div>
    <div class="body"><div id="storyList" class="list"></div></div>
  </div>
</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    yourq:"La tua domanda", gen:"✨ Genera risposta", clear:"Pulisci",
    tip:"Tip: puoi cambiare stile sopra; colori e tono si adattano.",
    free:(n)=>`Free oggi: ${n}/3`,
    microTitle:(done)=>`▼ Micro-domande di oggi • ${done?1:0}/1`,
    microHint:"(una volta al giorno)",
    saved:"▶ Domande salvate", stories:"▶ Cronologia",
    use:"Usa", play:"▶", emptyNext:"— Nessuna salvata —", emptyStories:"— Nessuna voce —",
    clearSaved:"Svuota salvate", clearHist:"Svuota cronologia",
    savedOK:"Micro-profilo salvato per oggi.", savedOnce:"Già salvato oggi.",
    outOfCredits:"Hai finito i crediti di oggi (3).",
    styleBadgeWhat:"What if", styleBadgeWtf:"What the F",
    phQ:"E se tornassi a vivere all’Aquila?",
    phExtra:"es. primo segnale di successo, budget, luogo specifico…"
  },
  en:{
    title:"Set your question",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    yourq:"Your question", gen:"✨ Generate answer", clear:"Clear",
    tip:"Tip: switch style above; tone & colors adapt.",
    free:(n)=>`Free today: ${n}/3`,
    microTitle:(done)=>`▼ Today’s micro-questions • ${done?1:0}/1`,
    microHint:"(once per day)",
    saved:"▶ Saved items", stories:"▶ History",
    use:"Use", play:"▶", emptyNext:"— No saved items —", emptyStories:"— No entries —",
    clearSaved:"Clear saved", clearHist:"Clear history",
    savedOK:"Micro-profile saved for today.", savedOnce:"Already saved today.",
    outOfCredits:"You’ve used today’s credits (3).",
    styleBadgeWhat:"What if", styleBadgeWtf:"What the F",
    phQ:"What if I moved back to L’Aquila?",
    phExtra:"e.g., first success signal, budget, specific place…"
  }
};
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Prefs / Theme ===== */
function Jget(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function Jset(k,v){ LS.setItem(k, JSON.stringify(v)); }
const prefs = Jget('whatif_prefs',{stile:'whatif'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== Credits (3/giorno) ===== */
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ensureCredits(){
  let c=Jget('whatif_credits',{date:todayStr(),used:0});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  Jset('whatif_credits',c);
}
function leftCredits(){ const c=Jget('whatif_credits',{date:todayStr(),used:0}); return Math.max(0,3-(c.used||0)); }
ensureCredits();

/* ===== UI text ===== */
const $=id=>document.getElementById(id);
$('titleH1').textContent=T.title;
$('qLabel').textContent=T.yourq;
$('goBtn').textContent=T.gen; $('clearBtn').textContent=T.clear;
$('chipWhatIf').textContent=T.whatif; $('chipWTF').textContent=T.wtf;
$('nextLabel').textContent=T.saved; $('storiesLabel').textContent=T.stories;
$('clearSavedBtn').textContent=T.clearSaved; $('clearHistoryBtn').textContent=T.clearHist;
$('langBtn').textContent=lang.toUpperCase();
$('freeBadge').textContent=T.free(leftCredits());
$('qInput').placeholder=T.phQ; $('extraInput').placeholder=T.phExtra;

/* ===== Style switch ===== */
function renderStyleBadge(){
  $('styleBadge').textContent = "🎭 " + (prefs.stile==='wtf'?T.styleBadgeWtf:T.styleBadgeWhat);
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
}
renderStyleBadge();
$('styleChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; Jset('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  renderStyleBadge();
});

/* ===== Lang, nav ===== */
$('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
$('backBtn').onclick=()=>history.back(); $('homeBtn').onclick=()=>location.href='index.html';

/* ===== Quick extras append ===== */
document.querySelectorAll('.chip[data-extra]').forEach(ch=>{
  ch.addEventListener('click',()=>{
    const i=$('extraInput'); const v=ch.dataset.extra;
    i.value = i.value ? (i.value+' • '+v) : v; i.focus();
  });
});

/* ===== Micro-domande 1×giorno (poi blocco & collassa) ===== */
const microKey='micro_'+todayStr();
function setMicroDisabled(dis){
  ['mood','city','anchor'].forEach(id=>{ const el=$(id); el.disabled=dis; el.style.opacity=dis?0.6:1; });
  $('saveMicroBtn').disabled=dis; $('saveMicroBtn').style.opacity=dis?0.6:1;
}
function loadMicro(){
  const saved=Jget('micro_saved',{date:"",ok:false});
  const done = saved.date===todayStr() && saved.ok;
  $('microTitle').textContent=T.microTitle(done);
  if(done){
    const mp=Jget('micro_profile',{});
    $('mood').value=mp.mood||""; $('city').value=mp.city||""; $('anchor').value=mp.anchor||"";
    setMicroDisabled(true);
    // resta collassato dopo salvataggio
    $('microCard').classList.add('collapsed');
    $('microSavedMsg').textContent=T.savedOK;
  } else {
    setMicroDisabled(false);
    $('microSavedMsg').textContent="";
  }
}
$('microHead').onclick=()=>{ $('microCard').classList.toggle('collapsed'); };
$('saveMicroBtn').onclick=()=>{
  const saved=Jget('micro_saved',{date:"",ok:false});
  if(saved.date===todayStr() && saved.ok){ $('microSavedMsg').textContent=T.savedOnce; return; }
  const payload = {
    mood: ($('mood').value||"").trim(),
    city: ($('city').value||"").trim(),
    anchor: ($('anchor').value||"").trim(),
    ts: Date.now()
  };
  Jset('micro_profile',payload);
  Jset('micro_saved',{date:todayStr(),ok:true});
  loadMicro();
};
loadMicro();

/* ===== Saved & History (collassabili con stato persistente) ===== */
const savedState=Jget('ui_saved_state',{collapsed:true});
const histState =Jget('ui_hist_state',{collapsed:true});
if(savedState.collapsed) $('savedCard').classList.add('collapsed');
if(histState.collapsed)  $('histCard').classList.add('collapsed');
$('savedHeader').onclick=()=>{ const c=$('savedCard'); c.classList.toggle('collapsed'); savedState.collapsed=c.classList.contains('collapsed'); Jset('ui_saved_state',savedState); };
$('histHeader').onclick=()=>{ const c=$('histCard');  c.classList.toggle('collapsed');  histState.collapsed=c.classList.contains('collapsed');   Jset('ui_hist_state',histState); };

function fmt(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const list=$('nextList'); list.innerHTML="";
  const arr=Jget('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; list.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmt(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.use;
    useBtn.onclick=()=>{ $('qInput').value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    list.appendChild(row);
  });
}
function renderHist(){
  const list=$('storyList'); list.innerHTML="";
  const arr=Jget('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; list.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmt(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ Jset('replay_story', { domanda:item.domanda, answer:item.risposta||"", stile:item.stile||'whatif', ts:item.ts }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    list.appendChild(row);
  });
}
$('clearSavedBtn').onclick=()=>{ localStorage.removeItem('next_prompts'); renderNext(); };
$('clearHistoryBtn').onclick=()=>{ localStorage.removeItem('cronologia'); renderHist(); };
renderNext(); renderHist();

/* ===== Generate ===== */
$('goBtn').onclick=()=>{
  const domanda=($('qInput').value||"").trim();
  if(!domanda){ $('qInput').focus(); return; }

  const c=Jget('whatif_credits'); const used=(c.used||0);
  if(used>=3){ alert(T.outOfCredits); return; }
  c.used=used+1; Jset('whatif_credits',c); $('freeBadge').textContent=T.free(leftCredits());

  const micro = Jget('micro_profile', {});
  const extra = ($('extraInput').value||"").trim();

  // impacchetto richiesta
  Jset('whatif_prefs',prefs);
  LS.setItem('domanda',domanda);
  Jset('whatif_request',{ domanda, stile:prefs.stile, lang, extra, micro });

  // vai alla quinta
  location.href='fifth.html';
};

/* Clear */
$('clearBtn').onclick=()=>{ $('qInput').value=""; $('extraInput').value=""; $('qInput').focus(); };
</script>
</body>
</html>
