<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%),
    radial-gradient(700px 500px at 80% 10%, rgba(255,236,1,.06), transparent 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.small{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.subchips{display:flex;gap:6px;justify-content:center;margin-top:8px}
.subchip{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.subchip.sel{background:rgba(255,255,255,.14);font-weight:700}
.hidden{display:none!important}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style + substyle -->
  <div class="card center">
    <div class="chips">
      <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
      <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
    </div>
    <div id="subWhatIf" class="subchips">
      <button class="subchip" data-mode="poetico" id="subPoetico">Poetico (AI decide)</button>
      <button class="subchip" data-mode="analitico" id="subAnalitico">Analitico (reale)</button>
    </div>
  </div>

  <!-- Question -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
    <div class="small" id="tipNote" style="margin-top:8px">Stile e periodo sopra; il tono si adatta.</div>
  </div>

</main>

<script>
const LS=localStorage;
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const lang=(LS.getItem('lang')||'it').toLowerCase();

let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false, whatif_mode:'poetico'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

document.getElementById('titleH1').textContent = (lang==='en'?'Set your question':'Imposta la tua domanda');
document.getElementById('qLabel').textContent  = (lang==='en'?'Your question':'La tua domanda');
document.getElementById('langBtn').textContent = lang.toUpperCase();
document.getElementById('periodoBadge').textContent="🕰️ "+(prefs.periodo==='past'?(lang==='en'?'Past':'Passato'):(lang==='en'?'Future':'Futuro'));

function syncChips(){
  document.getElementById('chipWhatIf').classList.toggle('sel', prefs.stile==='whatif');
  document.getElementById('chipWTF').classList.toggle('sel', prefs.stile==='wtf');
  document.getElementById('subWhatIf').classList.toggle('hidden', prefs.stile!=='whatif');
  document.getElementById('subPoetico').classList.toggle('sel', prefs.whatif_mode==='poetico');
  document.getElementById('subAnalitico').classList.toggle('sel', prefs.whatif_mode==='analitico');
}
syncChips();

document.getElementById('chipWhatIf').onclick=()=>{ prefs.stile='whatif'; writeJSON('whatif_prefs',prefs); document.documentElement.setAttribute('data-theme','whatif'); syncChips(); };
document.getElementById('chipWTF').onclick =()=>{ prefs.stile='wtf';    writeJSON('whatif_prefs',prefs); document.documentElement.setAttribute('data-theme','wtf');    syncChips(); };
document.getElementById('subPoetico').onclick   =()=>{ prefs.whatif_mode='poetico';   writeJSON('whatif_prefs',prefs); syncChips(); };
document.getElementById('subAnalitico').onclick =()=>{ prefs.whatif_mode='analitico'; writeJSON('whatif_prefs',prefs); syncChips(); };

document.getElementById('periodoBadge').onclick=()=>{ prefs.periodo=(prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); document.getElementById('periodoBadge').textContent="🕰️ "+(prefs.periodo==='past'?(lang==='en'?'Past':'Passato'):(lang==='en'?'Future':'Futuro')); };
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';

const qEl=document.getElementById('qInput'); qEl.placeholder=(lang==='en'?'What if…':'E se…'); qEl.autofocus=true;

function trySubmit(){
  const domanda=(qEl.value||"").trim(); if(!domanda){ qEl.focus(); return; }
  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  writeJSON('whatif_request',{ domanda, stile:prefs.stile, lang, extra:"", micro, periodo:prefs.periodo, whatif_mode:prefs.whatif_mode });
  LS.setItem('domanda',domanda);
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});
</script>
</body>
</html>
