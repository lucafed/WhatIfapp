<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{--bg:#0B0B0C;--bg2:#101414;--fg:#FFF;--muted:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01;--wtf1:#3A6B56;--wtf2:#5A8C75;--card:rgba(20,28,34,.92);--line:rgba(255,255,255,.12);--chip:#121A26;--ink:#0A0E12;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:880px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);margin:10px 0 6px;color:var(--acc2);text-align:center}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:18px}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none;white-space:nowrap}
.segment{display:flex;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px}
.seg{padding:8px 12px;border-radius:999px;cursor:pointer}
.seg.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800}
.small{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row"><button class="btn" id="backBtn">←</button><button class="btn" id="homeBtn">🏠</button></div>
    <div class="row"><span class="badge" id="periodoBadge">🕰️ Futuro</span><button class="btn" id="langBtn">IT</button></div>
  </div>

  <h1>Imposta la tua domanda</h1>

  <!-- Domanda centrale -->
  <div class="card" style="max-width:720px;margin:12px auto">
    <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera</button>
      <button class="btn" id="clearBtn">Svuota</button>
    </div>
    <p class="small">Scegli sotto lo stile. Il resto lo capiamo noi.</p>
  </div>

  <!-- Stile compatto -->
  <div class="card" style="max-width:720px;margin:12px auto">
    <div class="row">
      <div class="segment" id="styleSeg">
        <div class="seg sel" data-style="whatif">What if</div>
        <div class="seg" data-style="wtf">What the F</div>
      </div>
    </div>
    <div class="row" id="whatifModes">
      <div class="segment">
        <div class="seg sel" data-mode="analitico">Analitico</div>
        <div class="seg" data-mode="poetico">Poetico</div>
      </div>
    </div>
  </div>
</main>

<script>
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };

let periodo = (LS.getItem('periodo')||'future');
const perEl=document.getElementById('periodoBadge');
function renderPer(){ perEl.textContent="🕰️ "+(periodo==='past'?(lang==='en'?'Past':'Passato'):(lang==='en'?'Future':'Futuro')); }
renderPer();
perEl.onclick=()=>{ periodo=(periodo==='past'?'future':'past'); LS.setItem('periodo',periodo); renderPer(); };

let style='whatif', whatif_mode='analitico';
document.getElementById('styleSeg').onclick=(e)=>{
  const b=e.target.closest('.seg'); if(!b) return;
  document.querySelectorAll('#styleSeg .seg').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); style=b.dataset.style;
  document.getElementById('whatifModes').style.display = (style==='whatif')?'flex':'none';
};
document.getElementById('whatifModes').onclick=(e)=>{
  const b=e.target.closest('.seg'); if(!b) return;
  document.querySelectorAll('#whatifModes .seg').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); whatif_mode=b.dataset.mode;
};

const qEl=document.getElementById('qInput'); qEl.autofocus=true;

function trySubmit(){
  const domanda=(qEl.value||"").trim();
  if(!domanda){ qEl.focus(); return; }
  const prefs = { stile:style, periodo, whatif_mode };
  LS.setItem('whatif_prefs', JSON.stringify(prefs));
  const req = { domanda, stile:style, lang, extra:"", micro:{}, periodo, name:(LS.getItem('name')||""), whatif_mode };
  LS.setItem('whatif_request', JSON.stringify(req));
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});
</script>
</body>
</html>
