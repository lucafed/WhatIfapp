<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f – Parlami di te</title>
<meta name="theme-color" content="#0A0F14"/>
<link rel="preload" as="image" href="/ask-hero.png"/>
<style>
:root{--bg:#0A0F14;--fg:#e9f2f5;--muted:#9fb3bd;--accent:#00E0FF;--cyan:#06D6A0;--yellow:#FFD166}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
main{min-height:100%;max-width:960px;margin:0 auto;padding:18px 16px 26px;display:flex;flex-direction:column}
.header{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:clamp(28px,6.4vw,44px);letter-spacing:.02em;text-align:center}
h1 span{color:var(--accent)}
.hero{width:min(220px,40vw);height:130px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.45));
  object-fit:cover; object-position:center 55%; border-radius:18px;} /* <-- taglia la parte con il testo */
.grid{display:grid;gap:14px}
.section{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;box-shadow:0 14px 36px rgba(0,0,0,.35)}
.section h3{margin:0 0 10px;font-size:clamp(16px,4.2vw,20px);letter-spacing:.01em}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.tag{padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.10);color:var(--fg);cursor:pointer;border:1px solid rgba(255,255,255,.2);font-weight:600}
.tag:hover{filter:brightness(1.06)}
.tag.active{outline:2px solid var(--accent);background:rgba(0,224,255,.15)}
.input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.06);color:var(--fg);font-size:16px}
.btn{margin-top:14px;align-self:center;appearance:none;border:0;border-radius:999px;padding:14px 26px;font-weight:800;letter-spacing:.02em;color:#001a20;background:var(--accent);box-shadow:0 10px 26px rgba(0,224,255,.35)}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:4px}
footer{margin-top:12px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main id="page">
  <div class="header">
    <img id="hero" class="hero" alt="Porta luminosa"/>
    <h1>PARLAMI DI <span>TE</span></h1>
  </div>

  <div class="grid">
    <div class="section">
      <h3>Chi sei?</h3>
      <div class="opts" id="who">
        <button class="tag">Studente</button>
        <button class="tag">Lavoratore</button>
        <button class="tag">Creativo</button>
      </div>
    </div>

    <div class="section">
      <h3>Sesso</h3>
      <div class="opts" id="sex">
        <button class="tag">Femmina</button>
        <button class="tag">Maschio</button>
        <button class="tag">Altro</button>
        <button class="tag">Preferisco non dirlo</button>
      </div>
    </div>

    <div class="section">
      <h3>Età</h3>
      <div class="opts" id="age">
        <button class="tag">&lt;18</button>
        <button class="tag">18–25</button>
        <button class="tag">26–35</button>
        <button class="tag">&gt;35</button>
      </div>
    </div>

    <div class="section">
      <h3>In quale fase ti trovi?</h3>
      <div class="opts" id="phase">
        <button class="tag">Studio</button>
        <button class="tag">Carriera</button>
        <button class="tag">Relazioni</button>
      </div>
    </div>

    <div class="section">
      <h3>Cosa ti interessa esplorare?</h3>
      <div class="opts" id="explore">
        <button class="tag">Passato</button>
        <button class="tag">Futuro</button>
      </div>
    </div>

    <div class="section">
      <h3>Da dove vieni?</h3>
      <input id="from" class="input" placeholder="Città / Paese"/>
    </div>

    <div class="section">
      <h3>Vuoi raccontarci qualcosa di più su di te?
        <br><span style="color:var(--muted);font-weight:400">Opzionale – aiuta l’AI a rispondere meglio</span></h3>
      <textarea id="notes" class="input" rows="4" placeholder="Obiettivi, contesto, limiti di tempo…"></textarea>
    </div>
  </div>

  <button id="go" class="btn">CONTINUA</button>
  <p class="note">Swipe ◀︎ / ▶︎ per navigare</p>
  <footer>© 2025 What?f</footer>
</main>

<script>
(async function loadHero(){
  const img=document.getElementById('hero');
  const tries=[
    '/ask-hero.png','/public/ask-hero.png','/assets/ask-hero.png',
    '/third-hero.png','/public/third-hero.png','/home-hero.png','/public/home-hero.png'
  ];
  for(const u of tries){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ img.src=u+'?v='+Date.now(); return; } }catch(e){} }
  img.alt='Immagine non trovata';
})();

document.querySelectorAll('.opts').forEach(group=>{
  group.addEventListener('click',e=>{
    const el=e.target.closest('.tag'); if(!el) return;
    group.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
  });
});

(function(){
  const m=localStorage.getItem('mode');
  const btn=document.getElementById('go');
  if(m==='whatif'){ btn.style.background='#FFD166'; btn.style.color='#1b1200'; }
  if(m==='wtf'){ btn.style.background='#06D6A0'; btn.style.color='#001b13'; }
})();

document.getElementById('go').addEventListener('click',()=>{ window.location.href='fifth.html'; });

(function(){
  let sx=0, sy=0, dx=0, dy=0, on=false; const TH=55;
  document.addEventListener('touchstart',e=>{on=true;const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  document.addEventListener('touchmove', e=>{ if(!on) return; const t=e.touches[0]; dx=t.clientX-sx; dy=t.clientY-sy; },{passive:true});
  document.addEventListener('touchend', ()=>{ if(!on) return; on=false;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>TH){ if(dx>0){window.location.href='index.html';} else {window.location.href='fifth.html';} }
    sx=sy=dx=dy=0;
  },{passive:true});
})();
</script>
</body>
</html>
