<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What?f – Domanda</title>
<style>
:root{
  --bg:#0B0B0C;--bg2:#101414;--fg:#fff;--muted:#A0B2BA;
  --acc:#1C57A0;--acc2:#FFEC01;--line:rgba(255,255,255,.14);
  --chip:#121A26;--card:rgba(20,28,34,.92);--shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{--acc:#3A6B56;--acc2:#5A8C75;}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);color:#eaf3ee;border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.primary{border:none;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;box-shadow:0 6px 18px var(--shadow)}
.badge{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:12px}
.badge.accent{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;border:none}
h1{margin:12px 0 6px;color:var(--acc2);font-size:clamp(22px,5vw,32px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;border:none}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:#fff;padding:14px;font-size:18px}
.story{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);margin-top:10px}
.play{border:1px solid var(--line);background:#132032;color:#eaf3ee;border-radius:12px;padding:8px 12px;cursor:pointer}

/* overlay clarify */
#clar{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:9999;padding:14px}
#clar .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:#0f1622;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px}
#clar h3{margin:6px 0}
.qitem{margin:12px 0}
.qitem label{display:block;margin:6px 0;color:#EAF3EE;font-weight:600}
.qitem input{width:100%;height:46px;border-radius:12px;padding:10px 12px;border:1.2px solid rgba(255,255,255,.35);background:#152235!important;color:#fff!important;-webkit-text-fill-color:#fff}
.qitem input::placeholder{color:#c5d1d8}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <button class="btn" id="back">←</button>
      <button class="btn" id="home">🏠</button>
    </div>
    <div>
      <span class="badge" id="freeB">—</span>
      <span class="badge accent" id="clarB">—</span>
      <button class="btn" id="lang">IT</button>
    </div>
  </div>

  <h1 id="ttl">Imposta la tua domanda</h1>

  <div class="card">
    <div class="chips" style="justify-content:space-between">
      <div class="chips">
        <button class="chip" id="past">⏮️ Passato</button>
        <button class="chip sel" id="future">⏭️ Futuro</button>
      </div>
      <div class="chips">
        <button class="chip sel" id="wif">What if (realistico)</button>
        <button class="chip" id="wtf">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="label" id="ql">La tua domanda</h3>
    <textarea id="q" placeholder="E se tornassi a vivere all'Aquila?"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn primary" id="clarBtn">✨ Chiarisci & Genera</button>
      <button class="btn" id="go">▶️ Vai alla risposta</button>
    </div>
    <p id="tip" style="color:#A0B2BA;margin:10px 0 0">Tip: puoi cambiare stile/periodo sopra; il tono si adatta.</p>
  </div>

  <div class="card">
    <h3 class="label" id="histL">Le tue storie</h3>
    <div id="hist"></div>
  </div>
</main>

<!-- overlay -->
<div id="clar">
  <div class="sheet">
    <h3 id="ovT">2–3 domande mirate sulla tua domanda</h3>
    <div id="list"></div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn primary" id="ovGo">Genera con queste risposte</button>
      <button class="btn" id="ovCancel">Annulla</button>
    </div>
    <p id="ovF" style="color:#A0B2BA;margin-top:8px">Le domande arrivano dalla IA e cambiano in base alla tua domanda.</p>
  </div>
</div>

<script>
/* helpers */
function $(id){return document.getElementById(id)}
function readJ(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d));}catch{return d}}
function writeJ(k,v){localStorage.setItem(k,JSON.stringify(v))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

/* i18n */
var lang=(localStorage.getItem('lang')||'it').toLowerCase();
var T={
  it:{ttl:"Imposta la tua domanda", ql:"La tua domanda", tip:"Tip: puoi cambiare stile/periodo sopra; il tono si adatta.",
      past:"Passato", future:"Futuro", wif:"What if (realistico)", wtf:"What the F (divertente)",
      clar:"✨ Chiarisci & Genera", go:"▶️ Vai alla risposta", hist:"Le tue storie",
      free:(l,d)=>`Free oggi: ${l}/${d}`, clarB:(l,d)=>`Chiarimenti: ${l}/${d}`,
      ovT:"2–3 domande mirate sulla tua domanda", ovGo:"Genera con queste risposte", ovCancel:"Annulla",
      ovF:"Le domande arrivano dalla IA e cambiano in base alla tua domanda.",
      ph:"E se tornassi a vivere all'Aquila?", play:"Riprendi" },
  en:{ttl:"Set your question", ql:"Your question", tip:"Tip: change style/period above; tone adapts.",
      past:"Past", future:"Future", wif:"What if (realistic)", wtf:"What the F (fun)",
      clar:"✨ Clarify & Generate", go:"▶️ See answer", hist:"Your stories",
      free:(l,d)=>`Free today: ${l}/${d}`, clarB:(l,d)=>`Clarify: ${l}/${d}`,
      ovT:"2–3 focused questions", ovGo:"Generate with these answers", ovCancel:"Cancel",
      ovF:"Questions come from the AI and adapt to your prompt.",
      ph:"What if I moved back to L’Aquila?", play:"Resume"}
};
function applyI18N(){
  $('ttl').textContent=T[lang].ttl; $('ql').textContent=T[lang].ql; $('tip').textContent=T[lang].tip;
  $('past').textContent="⏮️ "+T[lang].past; $('future').textContent="⏭️ "+T[lang].future;
  $('wif').textContent=T[lang].wif; $('wtf').textContent=T[lang].wtf;
  $('clarBtn').textContent=T[lang].clar; $('go').textContent=T[lang].go; $('histL').textContent=T[lang].hist;
  $('ovT').textContent=T[lang].ovT; $('ovGo').textContent=T[lang].ovGo; $('ovCancel').textContent=T[lang].ovCancel; $('ovF').textContent=T[lang].ovF;
  $('q').placeholder=T[lang].ph; $('lang').textContent=lang.toUpperCase();
}
function theme(){ document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif'); }

/* prefs & counters */
var prefs=readJ('whatif_prefs',{periodo:'future',stile:'whatif'});
function chips(){
  $('past').classList.toggle('sel',prefs.periodo==='past');
  $('future').classList.toggle('sel',prefs.periodo!=='past');
  $('wif').classList.toggle('sel',prefs.stile!=='wtf');
  $('wtf').classList.toggle('sel',prefs.stile==='wtf');
  theme();
}
var FREE=3, CLAR=5;
function credits(){
  var c=readJ('whatif_credits',{}); if(c.date!==today()) c={date:today(),used:0};
  var k=readJ('whatif_clarify',{}); if(k.date!==today()) k={date:today(),used:0};
  $('freeB').textContent=T[lang].free(Math.max(0,FREE-c.used),FREE);
  $('clarB').textContent=T[lang].clarB(Math.max(0,CLAR-k.used),CLAR);
}

/* init */
applyI18N(); chips(); credits(); theme();

/* nav */
$('back').onclick=()=>history.back();
$('home').onclick=()=>location.href='index.html';
$('lang').onclick=()=>{lang=lang==='it'?'en':'it';localStorage.setItem('lang',lang);applyI18N();credits();}

/* chip handlers */
$('past').onclick=()=>{prefs.periodo='past';writeJ('whatif_prefs',prefs);chips();}
$('future').onclick=()=>{prefs.periodo='future';writeJ('whatif_prefs',prefs);chips();}
$('wif').onclick=()=>{prefs.stile='whatif';writeJ('whatif_prefs',prefs);chips();}
$('wtf').onclick=()=>{prefs.stile='wtf';writeJ('whatif_prefs',prefs);chips();}

/* history */
function loadHistory(){
  var arr=readJ('cronologia',[]);
  var h=$('hist'); h.innerHTML='';
  if(!arr.length){h.innerHTML='<p style="color:#A0B2BA">—</p>';return;}
  arr.slice(0,12).forEach(x=>{
    var d=document.createElement('div'); d.className='story';
    var t=document.createElement('div'); t.innerHTML='<div style="font-weight:600">'+(x.domanda||'—')+'</div><div style="color:#A0B2BA;font-size:12px">'+new Date(x.ts||Date.now()).toLocaleString()+'</div>';
    var b=document.createElement('button'); b.className='play'; b.textContent='▶️'; b.onclick=()=>{localStorage.setItem('domanda',x.domanda||'');location.href='fifth.html';};
    d.appendChild(t); d.appendChild(b); h.appendChild(d);
  });
}
loadHistory();

/* clarify */
$('clarBtn').onclick=async function(){
  var domanda=($('q').value||'').trim(); if(!domanda){$('q').focus();return;}
  $('clar').style.display='flex'; $('list').innerHTML='<p style="color:#A0B2BA">…</p>';
  var qs=[];
  try{
    var r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clarify:true,domanda,lang,periodo:prefs.periodo,stile:prefs.stile})});
    if(r.ok){var j=await r.json(); if(Array.isArray(j.questions)) qs=j.questions.slice(0,3);}
  }catch(e){}
  if(!qs.length){
    qs = prefs.periodo==='past'
      ? [{label:lang==='it'?'In che anno ambientiamo la scena?':'Which year?'},{label:lang==='it'?'Dove e con chi?':'Where and with whom?'},{label:lang==='it'?'Quale segnale ti avrebbe convinto?':'What signal would convince you?'}]
      : [{label:lang==='it'?'Decisione entro quando?':'Decision window?'},{label:lang==='it'?'Primo indicatore di riuscita?':'First success signal?'},{label:lang==='it'?'Vincolo reale?':'Real constraint?'}];
  }
  $('list').innerHTML=qs.map((q,i)=>'<div class="qitem"><label>Q'+(i+1)+'</label><input id="clar_'+i+'" placeholder="'+(q.label||'')+'"></div>').join('');
  var k=readJ('whatif_clarify',{}); if(k.date!==today()) k={date:today(),used:0}; k.used++; writeJ('whatif_clarify',k); credits();
};
$('ovCancel').onclick=()=>{$('clar').style.display='none';};
$('ovGo').onclick=()=>{
  var domanda=($('q').value||'').trim(); if(!domanda){$('clar').style.display='none';return;}
  var clar={}; for(var i=0;i<3;i++){var el=$('clar_'+i); if(el&&el.value.trim()) clar['q'+(i+1)]=el.value.trim();}
  localStorage.setItem('domanda',domanda);
  localStorage.setItem('clar_override',JSON.stringify(clar));
  $('clar').style.display='none';
  location.href='fifth.html';
};

/* go */
$('go').onclick=()=>{
  var domanda=($('q').value||'').trim(); if(!domanda){$('q').focus();return;}
  localStorage.setItem('domanda',domanda); localStorage.removeItem('clar_override'); location.href='fifth.html';
};

/* dev long-press reset locale */
let t1=null; $('freeB').onpointerdown=()=>{t1=setTimeout(()=>{writeJ('whatif_credits',{date:today(),used:0});credits();alert('Free azzerati (solo tuo device)');},1500)}; $('freeB').onpointerup=()=>clearTimeout(t1); $('freeB').onpointerleave=()=>clearTimeout(t1);
let t2=null; $('clarB').onpointerdown=()=>{t2=setTimeout(()=>{writeJ('whatif_clarify',{date:today(),used:0});credits();alert('Chiarimenti azzerati (solo tuo device)');},1500)}; $('clarB').onpointerup=()=>clearTimeout(t2); $('clarB').onpointerleave=()=>clearTimeout(t2);
</script>
</body>
</html>
