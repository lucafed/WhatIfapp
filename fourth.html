<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What?f – Scegli lo stile</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-prev="./third.html" data-next="./ask.html">
  <main class="fade-in">
    <div class="container">
      <h1>Scegli lo stile della risposta</h1>
      <h3>Preferisci una visione <b>narrativa</b> o una <b>ironica</b> e dissacrante?</h3>

      <div class="chips" id="styleChoice" style="margin-top:8px">
        <span class="chip active" data-style="whatif">Whatif</span>
        <span class="chip" data-style="wtf">What the F</span>
      </div>

      <a class="btn" id="goForm" href="./ask.html">VAI AVANTI</a>
      <p class="hint">Suggerimento: swipe ← o → per cambiare schermata</p>
    </div>
  </main>

  <footer>© 2025 What?f</footer>
  <script src="./main.js"></script>
  <script>
    // memorizza scelta in sessionStorage
    const chips = document.querySelectorAll('#styleChoice .chip');
    chips.forEach(c => c.addEventListener('click', ()=>{
      chips.forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      sessionStorage.setItem('reply_style', c.dataset.style);
    }));
  </script>
</body>
</html>
