<!DOCTYPE html><html lang="it" data-theme="whatif"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What?f — Domanda</title><meta name="theme-color" content="#0A0F14">

<style>
:root{--bg:#0B1018;--bg2:#0E1724;--card:#141C22;--fg:#F4F7FB;--muted:#A7B3C2;--accent:#1C57A0;--accent2:#FFEC01;--ink:#11110A;--chip:#0f1820;--line:#1b2a34}
html[data-theme=wtf]{--bg:#0B0B0C;--bg2:#101414;--card:#111713;--fg:#EEF5F0;--muted:#A6B6AD;--accent:#3A6B56;--accent2:#5A8C75;--ink:#06110B;--chip:#0F1714;--line:#21322A}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(900px 700px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto}
@media(prefers-reduced-motion:no-preference){
 body{animation:bgShift 16s ease-in-out infinite alternate}
 @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}
button,select,textarea{font-family:inherit}
.topbar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;padding:8px 10px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec}
main{padding:12px;display:flex;flex-direction:column;align-items:center}
.wrap{width:min(100%,920px)}h1{font-size:clamp(22px,6vw,36px);margin:8px 0;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;backdrop-filter:blur(10px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}
textarea{width:100%;background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px}
.small{color:var(--muted);font-size:12px}
.collapsed>.body{display:none}.story{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04)}
.play{border:1px solid var(--line);background:var(--chip);width:42px;height:42px;border-radius:12px;cursor:pointer}
</style>
</head>

<body>
<div class="topbar">
 <div><button class="btn" onclick="nav(-1)">←</button>
 <button class="btn" onclick="go('index.html')">🏠</button></div>
 <div class="chips"><span class="badge" id="styleBadge"></span><span class="badge" id="periodoBadge"></span><span class="badge" id="credBadge"></span>
 <select id="langSel"><option>it</option><option>en</option><option>es</option><option>fr</option><option>de</option></select></div>
</div>

<main><div class="wrap">
<h1 id="tH">Imposta la tua domanda</h1>

<div class="card"><div class="chips" id="styleCh"><button class="chip" data-s="whatif">What if</button><button class="chip" data-s="wtf">What the F</button></div>
<div class="chips" id="timeCh"><button class="chip" data-p="future">Futuro</button><button class="chip" data-p="past">Passato</button></div></div>

<div class="card"><h3 id="ql">E se…</h3>
<textarea id="q" rows="3" placeholder="E se…"></textarea>
<div style="display:flex;justify-content:space-between;margin-top:8px">
 <button class="btn primary" id="go">✨ Genera</button>
 <button class="btn" id="sorp">🎲</button>
 <button class="btn" id="clear">X</button></div>
<div class="small" id="tip">60% personali · 30% generiche · 10% folli</div></div>

<div class="card"><div class="chips" id="hints"></div></div>

<div class="card collapsed" id="saved"><div class="label" onclick="tgl('saved')">Domande salvate ▼</div>
<div class="body"><div id="saveList"></div><button class="btn" onclick="clr('next')">🗑️</button></div></div>

<div class="card collapsed" id="hist"><div class="label" onclick="tgl('hist')">Cronologia ▼</div>
<div class="body"><div id="histList"></div><button class="btn" onclick="clr('cron')">🗑️</button></div></div>

<footer class="small">© What?f — FREE</footer>
</div></main>

<script>
/* === Short utils === */
const $=q=>document.querySelector(q), S=localStorage; const LSUP=k=>JSON.parse(S.getItem(k)||"null");
const LSET=(k,v)=>S.setItem(k,JSON.stringify(v)); const go=u=>location.href=u; const nav=n=>history.go(n);
const d=t=>new Date(t).toLocaleString('it-IT',{hour12:false});
const p=LSUP("prefs")||{s:"whatif",p:"future"}; const lang=S.getItem("lang")||"it"; $("#langSel").value=lang;

/* === UI init === */
function badge(){ $("#styleBadge").textContent=p.s==="wtf"?"🎭 WTF":"🎭 What if";
 $("#periodoBadge").textContent=p.p==="past"?"🕰️ Passato":"🕰️ Futuro";}
function theme(){document.documentElement.dataset.theme=p.s}
badge(); theme();

/* === Grammar polish === */
function polish(t){
 t=t.replace(/[?？]+$/,"").trim(); t=t.charAt(0).toUpperCase()+t.slice(1);
 if(lang==="es")return (t.startsWith("¿")?t:`¿${t}`)+"?"; 
 if(lang==="fr")return t+" ?"; 
 return /\?$/.test(t)?t:t+"?";
}

/* === Hints daily === */
const H={it:["E se cambiassi lavoro?","E se cambiassi città?","E se aprissi partita IVA?","E se studiassi 1h al giorno?","E se andassi all’estero 6 mesi?"],
 en:["What if you changed job?","What if you moved city?","What if you studied 1h/day?","What if you lived abroad?","What if you freelanced?"]};
function hints(){const a=H[lang]||H.it;$("#hints").innerHTML=a.map(x=>`<button class=chip>${polish(x)}</button>`).join("")}
hints();

/* === Save / History === */
function render(){
 const n=LSUP("next")||[],h=LSUP("cron")||[];
 $("#saveList").innerHTML=n.map(o=>`<div class=story><div>${o.q}</div><button class=btn onclick="play('${o.q}')">▶</button></div>`).join("")||"<div class=small>Vuoto</div>";
 $("#histList").innerHTML=h.slice(-10).reverse().map(o=>`<div class=story><div>${o.dom}</div><div class=small>${d(o.t)}</div></div>`).join("")||"<div class=small>—</div>"
}
render();
const play=q=>{$("#q").value=q; scrollTo(0,0)}
const clr=k=>{S.removeItem(k==="next"?"next":"cron");render()}

/* === Surprise simple === */
$("#sorp").onclick=()=>{const a=["E se imparassi l’inglese?", "E se cambiassi routine?", "E se ti trasferissi 3 mesi?"];$("#q").value=polish(a[Math.random()*a.length|0])}

/* === State change === */
$("#styleCh").onclick=e=>{if(e.target.dataset.s){p.s=e.target.dataset.s;LSET("prefs",p);badge();theme()}}
$("#timeCh").onclick=e=>{if(e.target.dataset.p){p.p=e.target.dataset.p;LSET("prefs",p);badge()}}

/* === Submit === */
$("#go").onclick=()=>{
 let q=$("#q").value.trim(); if(!q)return $("#q").focus();
 q=polish(q); $("#q").value=q;
 const cron=LSUP("cron")||[]; cron.push({dom:q,t:Date.now(),s:p.s}); LSET("cron",cron);
 S.setItem("domanda",q); go("fifth.html")
};

/* misc */
$("#langSel").onchange=e=>{S.setItem("lang",e.target.value);location.reload()}
$("#clear").onclick=()=>$("#q").value="";
const tgl=id=>$("#"+id).classList.toggle("collapsed");
</script>
</body></html>
