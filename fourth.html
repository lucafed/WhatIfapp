<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{
  --bg:#0A0F14; --bg2:#141C22; --fg:#FFFFFF; --muted:#A0B2BA;
  --acc:#00E0FF; --accVar:#00B5CC; --hi:#1AFFD5;
  --card:rgba(20,28,34,.88); --line:rgba(255,255,255,.12);
  --chip:#0F1620; --ink:#0A0F14; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
h1{font-size:clamp(24px,5vw,34px);margin:16px 0 6px;color:var(--acc);text-align:center}
.lead{color:#CFE7FF;text-align:center;margin:0 0 12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--hi));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.headerRow{display:flex;justify-content:space-between;align-items:center}
.small{font-size:12px;color:var(--muted)}
.collapsed>.body{display:none}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:20px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--hi));color:var(--ink);font-weight:800}
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:999px;padding:9px 12px;font-size:13px;cursor:pointer}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04)}
.play{border:1px solid var(--line);background:var(--chip);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px}

/* Banner del giorno (micro) */
.banner{position:sticky;top:10px;z-index:1;background:linear-gradient(180deg,rgba(0,224,255,.12),rgba(26,255,213,.10));border:1px dashed var(--acc);border-radius:14px;padding:12px;margin:10px 0}
.banner .close{margin-left:auto}

/* Schede compatte default */
#hintsCard,#savedCard,#histCard{opacity:.94}
</style>
</head>
<body>
<main>
  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>
  <p class="lead" id="leadTxt">Scrivi la tua “E se…?” e scegli stile e periodo.</p>

  <!-- Banner Micro -->
  <div id="microBanner" class="banner hidden">
    <div class="row" style="align-items:flex-start">
      <div style="font-weight:700" id="bannerTitle">Micro-domande di oggi</div>
      <button class="btn ghost close" id="bannerClose">✕</button>
    </div>
    <div id="bannerPills" class="optset" style="margin-top:8px"></div>
    <div class="small" id="bannerNote"></div>
  </div>

  <!-- Domanda -->
  <div class="card center" id="qCard">
    <div class="label" id="qLabel" style="font-weight:800;margin-bottom:6px">La tua domanda</div>
    <textarea id="qInput" rows="3" class="input" placeholder="E se…?" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px;justify-content:center">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
  </div>

  <!-- Stile & periodo -->
  <style>
:root{
  /* What?f palette */
  --primary:#00E0FF;        /* turchese luminoso */
  --primary-dark:#00B5CC;   /* turchese più scuro */
  --highlight:#1AFFD5;      /* verde acqua per micro/hover */
  --bg:#0A0F14;             /* quasi nero bluastro */
  --surface:#141C22;        /* grigio antracite scuro */
  --fg:#FFFFFF;             /* testo principale */
  --muted:#A0B2BA;          /* testo secondario */

  /* derived */
  --card:rgba(20,28,34,.92);
  --line:rgba(255,255,255,.10);
  --chip:#0F1720;
  --ink:#081218;
  --shadow:rgba(0,0,0,.45);

  /* legacy aliases (per il resto del CSS) */
  --acc:var(--primary);
  --acc2:var(--primary-dark);
  --bg2:#0B1118;
}

/* tema alternativo per “What the F”: leggermente più acceso */
html[data-theme="wtf"]{
  --acc:var(--highlight);
  --acc2:#12D6B7;
}

/* base */
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{
  appearance:none;border:1px solid var(--line);
  background:var(--chip);color:var(--fg);
  padding:10px 14px;border-radius:12px;cursor:pointer
}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:#061016;font-weight:800;border:none;
  box-shadow:0 8px 24px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.06)
}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--highlight);outline-offset:2px}

/* badges & chips */
.badge{
  background:var(--chip);border:1px solid var(--line);
  border-radius:999px;padding:6px 10px;font-size:12px;
  color:var(--muted);user-select:none;white-space:nowrap
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:#0E151C;border:1px solid var(--line);color:#EAF3EE;
  border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer;white-space:nowrap
}
.chip.sel{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:#061016;font-weight:800
}

/* cards */
.card{
  background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0
}
.card hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* headings */
h1{
  font-size:clamp(24px,5vw,34px);
  margin:16px 0 6px;color:var(--acc);text-align:center;letter-spacing:.2px
}
.lead{color:var(--muted);text-align:center;margin-top:0;font-size:14px}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}

/* inputs */
.input,textarea{
  width:100%;background:rgba(255,255,255,.06);
  color:#EAF3EE;border:1px solid var(--line);
  border-radius:14px;padding:16px;font-size:18px
}
.qwrap{position:relative}
.qwrap .input{font-size:20px;text-align:center}
.qwrap .input::placeholder{color:#8FB8C6;opacity:.9}

/* option pills & sets */
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{
  background:#0E151C;border:1px solid var(--line);color:#EAF3EE;
  border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer
}
.opt.sel{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:#061016;font-weight:800
}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.story{
  display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;background:rgba(255,255,255,.04)
}
.play{border:none;background:var(--chip);border:1px solid var(--line);
  width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}

/* collapsible & misc */
.toggle{cursor:pointer;user-select:none}
.headerRow{display:flex;justify-content:space-between;align-items:center}
.headerRow .label{margin:0}
.collapsed>.body{display:none}
.small,.meta{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:#9BEBDD;margin-top:8px}
.hidden{display:none !important}

/* submode & period rows */
.submode,.period{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.subnote{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
  </style>

  <!-- Spunti rapidi -->
  <div class="card center collapsed" id="hintsCard">
    <div class="headerRow" id="hintsHeader" style="cursor:pointer">
      <div class="label" id="hintsTitle">▶ Spunti rapidi “E se…”</div>
    </div>
    <div class="body" id="hintsBody" style="margin-top:8px">
      <div class="chips" id="hintsChips"></div>
    </div>
  </div>

  <!-- Salvate -->
  <div class="card center collapsed" id="savedCard">
    <div class="headerRow" id="savedHeader" style="cursor:pointer">
      <div class="label" id="savedTitle">▶ Domande salvate</div>
      <button class="btn ghost" id="clearSavedBtn">🗑️ Svuota</button>
    </div>
    <div class="body" id="savedBody">
      <div id="nextList"></div>
    </div>
  </div>

  <!-- Cronologia -->
  <div class="card center collapsed" id="histCard">
    <div class="headerRow" id="histHeader" style="cursor:pointer">
      <div class="label" id="histTitle">▶ Cronologia</div>
      <button class="btn ghost" id="clearHistoryBtn">🗑️ Svuota</button>
    </div>
    <div class="body" id="histBody">
      <div id="storyList"></div>
    </div>
  </div>
</main>

<script>
/* I18N IT/EN */
const I18N={it:{title:"Imposta la tua domanda",lead:"Scrivi la tua “E se…?” e scegli stile e periodo.",yourq:"La tua domanda",gen:"✨ Genera risposta",clear:"Svuota",styleSmall:(s,p)=>`${s==='wtf'?'What the F':'What if'} · ${p==='past'?'Passato':'Futuro'}`,whatif:"What if",wtf:"What the F",analytic:"Analitico",real:"Reale/Poetico",future:"Futuro",past:"Passato",bannerTitle:"Micro-domande di oggi",bannerNote:"Scegline una se ti va. Questo banner si vede solo oggi.",hintsTitle:"▶ Spunti rapidi “E se…”",savedTitle:"▶ Domande salvate",histTitle:"▶ Cronologia",emptySaved:"— Nessuna domanda salvata.",emptyHist:"— Nessuna storia.",use:"Usa",outOfCredits:"Hai finito i crediti di oggi."},
en:{title:"Set your question",lead:"Write your “What if…?” and pick style and period.",yourq:"Your question",gen:"✨ Generate answer",clear:"Clear",styleSmall:(s,p)=>`${s==='wtf'?'What the F':'What if'} · ${p==='past'?'Past':'Future'}`,whatif:"What if",wtf:"What the F",analytic:"Analytic",real:"Real/Poetic",future:"Future",past:"Past",bannerTitle:"Today’s micro-questions",bannerNote:"Pick one if you like. This banner shows only today.",hintsTitle:"▶ Quick “What if…”",savedTitle:"▶ Saved questions",histTitle:"▶ History",emptySaved:"— No saved questions.",emptyHist:"— No history.",use:"Use",outOfCredits:"You’ve used today’s credits."}};
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* State helpers */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayISO(){return new Date().toISOString().slice(0,10);}

let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',mode:'reale',pro:false});

/* Texts */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('leadTxt').textContent=T.lead;
document.getElementById('qLabel').textContent=T.yourq;
document.getElementById('goBtn').textContent=T.gen;
document.getElementById('clearBtn').textContent=T.clear;
document.getElementById('chipWhatIf').textContent=T.whatif;
document.getElementById('chipWTF').textContent=T.wtf;
document.getElementById('chipAnalitico').textContent=T.analytic;
document.getElementById('chipReale').textContent=T.real;
document.getElementById('chipFuture').textContent=T.future;
document.getElementById('chipPast').textContent=T.past;
document.getElementById('hintsTitle').textContent=T.hintsTitle;
document.getElementById('savedTitle').textContent=T.savedTitle;
document.getElementById('histTitle').textContent=T.histTitle;

function renderBadges(){
  document.getElementById('styleBadge').textContent="🎭 "+(prefs.stile==='wtf'?'What the F':'What if');
  document.getElementById('periodoBadge').textContent="🕰️ "+(prefs.periodo==='past'?(lang==='en'?'Past':'Passato'):(lang==='en'?'Future':'Futuro'));
  document.getElementById('styleSmall').textContent=T.styleSmall(prefs.stile,prefs.periodo);
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.getElementById('whatifSubMode').style.display=(prefs.stile==='whatif')?'flex':'none';
  document.getElementById('chipAnalitico').classList.toggle('sel', prefs.mode==='analitico');
  document.getElementById('chipReale').classList.toggle('sel', prefs.mode!=='analitico');
  document.getElementById('chipFuture').classList.toggle('sel', prefs.periodo!=='past');
  document.getElementById('chipPast').classList.toggle('sel', prefs.periodo==='past');
}
renderBadges();

/* Language switch */
const langBtn=document.getElementById('langBtn');
langBtn.textContent=lang.toUpperCase();
langBtn.onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };

/* Nav */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';

/* Style/period chips */
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; if(prefs.stile==='whatif' && !prefs.mode) prefs.mode='reale';
  writeJSON('whatif_prefs',prefs); renderBadges();
});
document.getElementById('whatifSubMode').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return; prefs.mode=b.dataset.mode; writeJSON('whatif_prefs',prefs); renderBadges();
});
document.getElementById('periodChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return; prefs.periodo=b.dataset.period; writeJSON('whatif_prefs',prefs); renderBadges();
});

/* Collapsibles robusti (aprono/chiudono davvero) */
function toggleCard(cardId, titleId){
  const card=document.getElementById(cardId);
  const body=card.querySelector('.body');
  const title=document.getElementById(titleId);
  const opening=card.classList.contains('collapsed');
  card.classList.toggle('collapsed');
  if(opening){ body.style.display='block'; title.textContent='▼ '+title.textContent.replace(/^▶|▼\s*/,''); }
  else { body.style.display='none'; title.textContent='▶ '+title.textContent.replace(/^▶|▼\s*/,''); }
}
document.getElementById('hintsHeader').onclick=()=>toggleCard('hintsCard','hintsTitle');
document.getElementById('savedHeader').onclick=()=>toggleCard('savedCard','savedTitle');
document.getElementById('histHeader').onclick=()=>toggleCard('histCard','histTitle');

/* Micro banner — una volta al giorno */
function showMicroBannerOnce(){
  const key='micro_banner_day';
  const day=todayISO();
  const bn=document.getElementById('microBanner');
  if(LS.getItem(key)===day){ bn.classList.add('hidden'); return; }
  const pool=(lang==='en'
    ? ["Calm airplane mode","Charged socket","Foggy but fine","Restless astronaut","Quiet & solid","Light & chatty","Curious about here","Coffee then decide","Sleep on it","Try small first"]
    : ["Calmo in modalità aereo","Carico come una presa","Appannato ma ok","Astronauta irrequieto","Solido e quieto","Leggero e chiacchierone","Curioso di ciò che c’è","Caffè poi decido","Ci dormo su","Provo in piccolo"]);
  const picked=[]; const used=new Set();
  while(picked.length<6 && used.size<pool.length){ const i=Math.floor(Math.random()*pool.length); if(!used.has(i)){used.add(i); picked.push(pool[i]);} }
  const wrap=document.getElementById('bannerPills'); wrap.innerHTML='';
  picked.forEach(t=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=t; b.onclick=()=>{ const cur=readJSON('micro_profile',{}); cur.quick=t; writeJSON('micro_profile',cur); }; wrap.appendChild(b); });
  document.getElementById('bannerTitle').textContent=(lang==='en'?I18N.en.bannerTitle:I18N.it.bannerTitle);
  document.getElementById('bannerNote').textContent=(lang==='en'?I18N.en.bannerNote:I18N.it.bannerNote);
  bn.classList.remove('hidden');
  document.getElementById('bannerClose').onclick=()=>{ LS.setItem(key,day); bn.classList.add('hidden'); };
}
showMicroBannerOnce();

/* Hints */
const HINT_IT=["E se cambiassi lavoro?","E se cambiassi città?","E se tornassi a studiare?","E se aprissi qualcosa di tuo?","E se chiedessi un aumento?","E se partissi da solo?","E se imparassi una lingua strana?","E se tornassi a vivere all’Aquila?","E se riducessi l’orario?","E se cambiassi routine per 7 giorni?"];
const HINT_EN=["What if I changed jobs?","What if I moved city?","What if I went back to study?","What if I started my own thing?","What if I asked for a raise?","What if I traveled solo?","What if I learned a weird language?","What if I moved back to L’Aquila?","What if I worked fewer hours?","What if I changed routine for a week?"];
function pickN(pool,n){ const out=[]; const used=new Set(); while(out.length<n && used.size<pool.length){ const i=Math.floor(Math.random()*pool.length); if(!used.has(i)){used.add(i); out.push(pool[i]);} } return out; }
function renderHints(){
  const wrap=document.getElementById('hintsChips'); wrap.innerHTML='';
  const pool=(lang==='en'?HINT_EN:HINT_IT);
  pickN(pool,6).forEach(h=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=h;
    b.onclick=()=>{ document.getElementById('qInput').value=h; window.scrollTo({top:0,behavior:'smooth'}); };
    wrap.appendChild(b);
  });
}
renderHints();

/* Salvate & Cronologia */
function fmt(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderSaved(){
  const box=document.getElementById('nextList'); box.innerHTML='';
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=(lang==='en'?I18N.en.emptySaved:I18N.it.emptySaved); box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="small">${fmt(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=(lang==='en'?'Use':'Usa');
    useBtn.onclick=()=>{ document.getElementById('qInput').value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ localStorage.setItem('domanda', item.q||""); const req={ domanda:item.q||"", stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'reale'):undefined), lang, periodo:prefs.periodo }; localStorage.setItem('whatif_request', JSON.stringify(req)); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderHist(){
  const box=document.getElementById('storyList'); box.innerHTML='';
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=(lang==='en'?I18N.en.emptyHist:I18N.it.emptyHist); box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div'); left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="small">${fmt(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ localStorage.setItem('replay_story', JSON.stringify({ domanda:item.domanda, answer:item.risposta||item.answer||"", stile:item.stile||'whatif' })); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
renderSaved(); renderHist();
document.getElementById('clearSavedBtn').onclick=()=>{ localStorage.removeItem('next_prompts'); renderSaved(); };
document.getElementById('clearHistoryBtn').onclick=()=>{ localStorage.removeItem('cronologia'); renderHist(); };

/* Submit */
function cap(){ const admin=!!localStorage.getItem('admin_token'); const pro=(readJSON('whatif_prefs',{}).pro===true); return admin?Infinity:(pro?10:3); }
function credits(){ const k='whatif_credits'; let c=readJSON(k,{date:todayISO(),used:0}); if(c.date!==todayISO()){ c={date:todayISO(),used:0}; } return {get:()=>c, set:v=>writeJSON(k,v)}; }
function trySubmit(){
  const domanda=(document.getElementById('qInput').value||"").trim(); if(!domanda) return document.getElementById('qInput').focus();
  const cr=credits(); let c=cr.get(); const limit=cap(); if(limit!==Infinity && c.used>=limit){ alert(T.outOfCredits); return; } c.used++; cr.set(c);
  localStorage.setItem('domanda',domanda);
  const req={ domanda, stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'reale'):undefined), lang, extra:"", micro:readJSON('micro_profile',{}), periodo:prefs.periodo };
  localStorage.setItem('whatif_request', JSON.stringify(req));
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ document.getElementById('qInput').value=""; document.getElementById('qInput').focus(); };
document.getElementById('qInput').addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});
</script>
