<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f – Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="manifest" href="/manifest.json"/>

<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#EAF3EE; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12); --chip:#121A26; --ink:#0A0E12;
  --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background: radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{max-width:980px;margin:auto;padding:18px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee}
h1{font-size:clamp(22px,5vw,30px);margin:14px 0 2px;color:var(--acc2)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch{display:flex;gap:10px;flex-wrap:wrap}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer}
.tab.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none}
.lab{color:#89a7b3;font-weight:700;margin:0 0 8px}
.input{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kicker{color:var(--muted);font-size:13px;margin-top:8px}

.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.03)}
.item .play{margin-left:auto}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
.sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
.qitem{margin:10px 0}
.qitem label{display:block;margin:6px 0}
.qitem input{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
.err{color:#ffb4b4;font-size:13px;margin:6px 0}
.skel{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
  <main>
    <div class="top">
      <div class="row">
        <button id="backBtn" class="btn">←</button>
        <button id="homeBtn" class="btn">🏠</button>
      </div>
      <div class="row">
        <span id="freeBadge" class="badge">—</span>
        <span id="clarBadge" class="badge">—</span>
        <button id="langBtn" class="btn">IT</button>
      </div>
    </div>

    <h1 id="h1">Imposta la tua domanda</h1>

    <div class="card">
      <div class="row switch">
        <button class="tab sel" id="tabWhatIf">What if (realistico)</button>
        <button class="tab" id="tabWTF">What the F (divertente)</button>
        <button class="tab" id="tabPast">⏮️ Passato</button>
        <button class="tab sel" id="tabFuture">⏭️ Futuro</button>
      </div>
    </div>

    <div class="card">
      <p class="lab" id="labQ">La tua domanda</p>
      <textarea id="qInput" class="input" rows="4" placeholder="E se…?"></textarea>
      <div class="actions">
        <button id="clarBtn" class="btn primary">✨ Chiarisci & genera</button>
        <button id="goBtn" class="btn">Vai alla risposta</button>
      </div>
      <p class="kicker" id="tip">Tip: puoi cambiare stile qui sopra; colori e tono si adattano.</p>
    </div>

    <div class="card">
      <p class="lab" id="labRecent">Le tue storie</p>
      <div id="recentList" class="list"></div>
    </div>
  </main>

  <!-- Clarify modal -->
  <div class="overlay" id="clarOv">
    <div class="sheet">
      <h3 id="clarTitle">2–3 domande mirate sulla tua domanda</h3>
      <div id="clarBody">
        <span class="skel" style="width:60%"></span>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="clarRun" class="btn primary">Genera con queste risposte</button>
        <button id="clarCancel" class="btn">Annulla</button>
      </div>
      <div id="clarErr" class="err"></div>
      <p class="kicker" id="clarFoot">Le domande arrivano dalla IA e cambiano in base alla tua domanda.</p>
    </div>
  </div>

<script>
/* ===== Helpers & I18N ===== */
const LS=localStorage;
const $=id=>document.getElementById(id);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{ return def; }}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v));}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

const I18N={
  it:{
    h1:"Imposta la tua domanda",
    labQ:"La tua domanda",
    tip:"Tip: puoi cambiare stile qui sopra; colori e tono si adattano.",
    free:(l,d)=>`Free oggi: ${l}/${d}`,
    clar:(l,d)=>`Chiarimenti: ${l}/${d}`,
    stories:"Le tue storie",
    clarTitle:"2–3 domande mirate sulla tua domanda",
    clarRun:"Genera con queste risposte", clarCancel:"Annulla",
    clarFoot:"Le domande arrivano dalla IA e cambiano in base alla tua domanda.",
    err:"Errore server. Riprova."
  },
  en:{
    h1:"Set your question",
    labQ:"Your question",
    tip:"Tip: change style above; colors & tone adapt.",
    free:(l,d)=>`Free today: ${l}/${d}`,
    clar:(l,d)=>`Clarify: ${l}/${d}`,
    stories:"Your stories",
    clarTitle:"2–3 targeted questions about your question",
    clarRun:"Generate with these answers", clarCancel:"Cancel",
    clarFoot:"Questions come from AI and adapt to your question.",
    err:"Server error. Try again."
  }
};
let lang=(LS.getItem('lang')||'it').toLowerCase();
function T(k,...a){const pack=I18N[lang]||I18N.it; const v=pack[k]; return typeof v==='function'?v(...a):v; }
document.documentElement.lang=lang;

/* ===== Stato base (stile/periodo/lingua) ===== */
const prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future'});
function applyTheme(){ document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif'); }
applyTheme();

/* ===== Testi statici ===== */
$('h1').textContent=T('h1');
$('labQ').textContent=T('labQ');
$('tip').textContent=T('tip');
$('labRecent').textContent=T('stories');
$('clarTitle').textContent=T('clarTitle');
$('clarRun').textContent=T('clarRun');
$('clarCancel').textContent=T('clarCancel');
$('clarFoot').textContent=T('clarFoot');
$('langBtn').textContent=lang.toUpperCase();

/* ===== Switch stile/periodo ===== */
function renderTabs(){
  $('tabWhatIf').classList.toggle('sel',prefs.stile==='whatif');
  $('tabWTF').classList.toggle('sel',prefs.stile==='wtf');
  $('tabPast').classList.toggle('sel',prefs.periodo==='past');
  $('tabFuture').classList.toggle('sel',prefs.periodo!=='past');
}
renderTabs();

$('tabWhatIf').onclick=()=>{ prefs.stile='whatif'; writeJSON('whatif_prefs',prefs); applyTheme(); renderTabs(); };
$('tabWTF').onclick=()=>{ prefs.stile='wtf'; writeJSON('whatif_prefs',prefs); applyTheme(); renderTabs(); };
$('tabPast').onclick=()=>{ prefs.periodo='past'; writeJSON('whatif_prefs',prefs); renderTabs(); };
$('tabFuture').onclick=()=>{ prefs.periodo='future'; writeJSON('whatif_prefs',prefs); renderTabs(); };

/* ===== Language toggle (sincronizzato con altre pagine) ===== */
$('langBtn').onclick=()=>{
  lang = (lang==='it'?'en':'it'); LS.setItem('lang',lang); location.reload();
};

/* ===== Credits (local-only; dev long-press reset) ===== */
const DAILY_FREE=3, DAILY_CLAR=5;
function readCredits(){const v=readJSON('whatif_credits',{}); const t=todayStr(); if(v.date!==t) return {date:t,used:0,pro:!!v.pro}; return v;}
function writeCredits(v){writeJSON('whatif_credits',v);}
function readClar(){const v=readJSON('whatif_clarify',{}); const t=todayStr(); if(v.date!==t) return {date:t,used:0}; return v;}
function writeClar(v){writeJSON('whatif_clarify',v);}
function paintBadges(){
  const c=readCredits(); const left=Math.max(0,DAILY_FREE-(c.used||0)); $('freeBadge').textContent=T('free')(left,DAILY_FREE);
  const k=readClar(); const leftC=Math.max(0,DAILY_CLAR-(k.used||0)); $('clarBadge').textContent=T('clar')(leftC,DAILY_CLAR);
}
paintBadges();
// long-press reset (solo tuo)
let t1=null;
$('freeBadge').onpointerdown=()=>{ t1=setTimeout(()=>{ const c=readCredits(); c.used=0; writeCredits(c); paintBadges(); alert('Crediti resettati (solo locale)'); },1800); };
['pointerup','pointerleave'].forEach(ev=> $('freeBadge').addEventListener(ev,()=>clearTimeout(t1)));
let t2=null;
$('clarBadge').onpointerdown=()=>{ t2=setTimeout(()=>{ const c=readClar(); c.used=0; writeClar(c); paintBadges(); alert('Chiarimenti resettati (solo locale)'); },1800); };
['pointerup','pointerleave'].forEach(ev=> $('clarBadge').addEventListener(ev,()=>clearTimeout(t2)));

/* ===== Recenti (storico locale) ===== */
function recent(){ return readJSON('cronologia',[]); }
function renderRecent(){
  const list=$('recentList'); const arr=recent();
  if(!arr.length){ list.innerHTML=`<div class="item" style="opacity:.7">—</div>`; return; }
  list.innerHTML = arr.slice(0,6).map((it,i)=>`
    <div class="item row">
      <div><strong>${esc(it.domanda||'')}</strong><br>
        <span style="color:#89a7b3">${new Date(it.ts||Date.now()).toLocaleString()}</span>
      </div>
      <button class="btn play" data-i="${i}">▶</button>
    </div>
  `).join('');
  list.querySelectorAll('.play').forEach(b=>{
    b.addEventListener('click',()=>{
      const it=arr[Number(b.dataset.i)||0];
      if(!it) return;
      LS.setItem('domanda', it.domanda||'');
      writeJSON('whatif_prefs',{...prefs,stile:it.stile||prefs.stile,periodo:it.periodo||prefs.periodo});
      location.href='fifth.html';
    });
  });
}
renderRecent();

/* ===== Nav ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';

/* ===== Chiarisci ===== */
const clarOv=$('clarOv'), clarBody=$('clarBody'), clarErr=$('clarErr');

function extractKeywords(q){
  const s=(q||'').toLowerCase();
  return s.replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>3).slice(0,5);
}
function fallbackQuestions(q){
  const it = lang!=='en';
  const topic = extractKeywords(q)[0] || (it?'il tema':'the topic');
  return it
    ? [`Qual è la tua finestra decisionale?`, `Un indicatore di successo su ${topic}?`, `Un vincolo concreto da rispettare?`]
    : [`What's your decision window?`, `One success indicator for ${topic}?`, `One concrete constraint to respect?`];
}
function normQuestions(arr){
  // accetta ["stringa", ...] o [{label:"..", placeholder:".."}, ...]
  const out=[];
  (arr||[]).forEach((q,i)=>{
    if(!q) return;
    if(typeof q==="string") out.push({id:`q${i+1}`,label:q,placeholder: lang==='en'?'One line':'Una riga'});
    else out.push({id:q.id||`q${i+1}`,label:q.label||q.text||`Q${i+1}`,placeholder:q.placeholder|| (lang==='en'?'One line':'Una riga')});
  });
  return out.slice(0,3);
}

async function openClarify(){
  clarErr.textContent=""; clarBody.innerHTML=`<span class="skel" style="width:60%"></span>`;
  $('clarTitle').textContent=T('clarTitle');
  $('clarRun').textContent=T('clarRun'); $('clarCancel').textContent=T('clarCancel'); $('clarFoot').textContent=T('clarFoot');
  clarOv.style.display='flex';

  const domanda = $('qInput').value.trim();
  if(!domanda){ clarBody.innerHTML=`<div class="err">${lang==='en'?'Write your question first.':'Scrivi prima la domanda.'}</div>`; return; }

  // limite
  const k=readClar(); if((k.used||0)>=5){ clarBody.innerHTML=`<div class="err">${lang==='en'?'Clarify limit for today.':'Hai esaurito i chiarimenti di oggi.'}</div>`; return; }

  // chiama API
  try{
    const payload={ domanda, lang, periodo:prefs.periodo, stile:prefs.stile, clarify:true };
    const r = await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    let qs=[];
    if(r.ok){
      const j=await r.json();
      if(Array.isArray(j?.questions)) qs = normQuestions(j.questions);
    }
    if(!qs.length) qs = normQuestions(fallbackQuestions(domanda));

    clarBody.innerHTML = qs.map(q=>`
      <div class="qitem">
        <label for="${q.id}">${esc(q.label)}</label>
        <input id="${q.id}" type="text" placeholder="${esc(q.placeholder)}"/>
      </div>`).join('');

    // segna 1 chiarimento usato
    k.used=(k.used||0)+1; writeClar(k); paintBadges();

  }catch(e){
    clarBody.innerHTML = normQuestions(fallbackQuestions(domanda)).map(q=>`
      <div class="qitem">
        <label for="${q.id}">${esc(q.label)}</label>
        <input id="${q.id}" type="text" placeholder="${esc(q.placeholder)}"/>
      </div>`).join('');
    clarErr.textContent=T('err');
  }
}
$('clarBtn').onclick=openClarify;
$('clarCancel').onclick=()=>{ clarOv.style.display='none'; };

$('clarRun').onclick=()=>{
  const domanda = $('qInput').value.trim();
  const inputs = clarBody.querySelectorAll('input');
  const clar={}; inputs.forEach(i=>{ const v=(i.value||'').trim(); if(v) clar[i.id]=v; });
  LS.setItem('domanda', domanda);
  writeJSON('clarify_answers', clar);
  location.href='fifth.html';
};

/* ===== Vai alla risposta ===== */
$('goBtn').onclick=()=>{
  const domanda = $('qInput').value.trim();
  if(!domanda){ alert(lang==='en'?'Write your question first.':'Scrivi prima la domanda.'); return; }
  LS.setItem('domanda', domanda);
  writeJSON('clarify_answers', {}); // nessun chiarimento
  location.href='fifth.html';
};

/* ===== Prefill se arrivo da altrove ===== */
(function prefill(){
  const lastQ = LS.getItem('domanda')||'';
  if(lastQ) $('qInput').value = lastQ;
})();
</script>
</body>
</html>
