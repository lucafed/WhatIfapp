<style>    
/* ===== THEME ===== */    
:root{ --bg:#0C0F14; --bg2:#0E1724; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;

html[data-theme="whatif"]{ --bg:#0B1018; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2; --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34; }    
html[data-theme="wtf"]{ --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD; --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A; }  *{box-sizing:border-box}  
html,body{  
height:100%;margin:0;  
background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);  
color:var(--fg);  
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;  
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;  
}  
@media (prefers-reduced-motion:no-preference){  
body{animation:bgShift 18s ease-in-out infinite alternate}  
@keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}  
}  /* Topbar */
.topbar{
position:sticky; top:0; z-index:2;
display:flex; align-items:center; justify-content:space-between;
gap:10px; padding:8px 10px;
background:rgba(10,15,20,.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)
}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer}

/* Layout */
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
.wrap{width:min(100%,980px)}
h1{margin:6px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}

/* Cards & chips */
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);
border-radius:16px;padding:16px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);font-weight:800}

/* Input */
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}

/* Collapsible */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);
border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}

/* Slot fx */
#qInput.slotting{filter:contrast(1.2) saturate(1.1); animation:slotFlash .12s linear infinite}
@keyframes slotFlash{0%{box-shadow:0 0 0 rgba(255,236,1,.0)}50%{box-shadow:0 0 18px rgba(255,236,1,.2)}100%{box-shadow:0 0 0 rgba(255,236,1,.0)}}
</style>

</head>

function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin()?Infinity:(prefs.pro?10:3); }
function ensureCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); if(c.date!==todayISO()){c.date=todayISO();c.used=0} writeJSON('whatif_credits',c); }
function leftCredits(){ const c=readJSON('whatif_credits',{date:todayISO(),used:0}); const cap=capForUser(); return cap===Infinity?'∞':Math.max(0,cap-(c.used||0)); }
function renderCredits(){
const T=I18N[lang]||I18N.it;
const cap=capForUser(), left=leftCredits();
$('freeBadge').textContent=(cap===Infinity)?${T.credits}: ∞:${T.credits}: ${left}/${cap};
}
ensureCredits(); renderCredits();

function renderBadges(){

const hintsWrap=$('hintsChips');
function rng(seedStr){ let s=[...seedStr].reduce((a,c)=>a+c.charCodeAt(0),0); return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function daily(pool,n=8){ const rnd=rng(todayISO()); const seen=new Set(), out=[]; while(out.length<n && seen.size<pool.length){ const i=Math.floor(rnd()*pool.length); if(seen.has(i)) continue; seen.add(i); out.push(pool[i]); } return out; }

function inferUserPrefs(){
const map = {
lavoro:["lavor","job","linkedin","remoto","cv","colloquio"],
studio:["studio","universit","esame","tesi","inglese","course","exam"],
soldi:["spesa","budget","soldi","money","rispar","save","fund"],
sport:["corri","sport","palestra","nuoto","cammina","run","walk","stretch"],
relazioni:["amico","amica","partner","relaz","social","confini","boundar"],
viaggi:["viagg","citt","weekend","volo","hotel","travel"],
tech:["ai","app","sito","site","automat","shortcut","email"],
business:["e-commerce","ecommerce","newsletter","client","pitch","landing","startup"]
};
const buckets = Object.fromEntries(Object.keys(map).map(k=>[k,0]));
const corpora = (readJSON('cronologia',[]).map(x=>x.domanda||'').join(' ') + ' ' + readJSON('next_prompts',[]).map(x=>x.q||'').join(' ')).toLowerCase();
for(const [cat,keys] of Object.entries(map)){
keys.forEach(kw=>{ if(corpora.includes(kw)) buckets[cat]+=1; });
}
return buckets;
}

function personalizedHints(baseList){
// aggiunge 2-4 chip realistici derivati dalle categorie più frequenti (solo IT per ora)
if(lang!=='it') return baseList;
const prefs = inferUserPrefs();
const ranked = Object.entries(prefs).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v>0).map(([k])=>k);
const addPool=[];
ranked.slice(0,3).forEach(cat=>{
const bank = GEN_REAL.it[cat];
if(bank) addPool.push(...bank.map(a=>"E se "+a+"?"));
});
const extra = [];
while(extra.length<Math.min(4, addPool.length)){
const pick = addPool[Math.floor(Math.random()*addPool.length)];
if(!extra.includes(pick) && !baseList.includes(pick)) extra.push(pick);
}
return [...baseList, ...extra];
}

const list=daily(base,8);
const finalList = personalizedHints(list).slice(0,12);

b.onclick=()=>{ $('qInput').value=h; isAbsurd=false; LS.setItem('absurd_prompt','0'); LS.setItem('surprise_mode','0'); window.scrollTo({top:0,behavior:'smooth'}); };

/* ======== 🎲 SORPRENDIMI: SOLO ASSURDE + anti-ripetizione ======== */
function absurdPool(){ return ABS[lang] && ABS[lang].length ? ABS[lang] : ABS.it; }

function getRecentSet(){ return new Set(readJSON('surprise_recent',[])); }
function rememberPrompt(p){ const arr=readJSON('surprise_recent',[]); arr.unshift(p); writeJSON('surprise_recent',arr.slice(0,60)); }

function makeAbsurdList(n=14){
const recent = getRecentSet();
const pool = absurdPool().slice();
const out=[];
while(out.length<n && pool.length){
const i=Math.floor(Math.random()*pool.length);
const cand=pool.splice(i,1)[0];
if(!recent.has(cand)){ out.push(cand); recent.add(cand); }
}
if(!out.length) return absurdPool().slice(0,n); // fallback
return out;
}

function spinCap(){ return userIsAdmin()?Infinity:(prefs.pro?5:1); }
function ensureSpins(){
const s=readJSON('surprise_spins',{date:todayISO(),used:0});
if(s.date!==todayISO()){ s.date=todayISO(); s.used=0; }
writeJSON('surprise_spins',s); return s;
}
function spinsLeft(){ const s=ensureSpins(); const cap=spinCap(); return cap===Infinity?Infinity:Math.max(0,cap-(s.used||0)); }
function renderSpinButton(){
const T=I18N[lang]||I18N.it;
const cap=spinCap(); const left=spinsLeft();
const suffix = (cap===Infinity)?' (∞)': (${left}/${cap});
$('surpriseBtn').textContent='🎲 '+T.surprise + suffix;
$('surpriseBtn').title = ${T.spins}: ${cap===Infinity?'∞':left+'/'+cap};
}
function consumeOneSpin(){
if(userIsAdmin()) return true;
const s=ensureSpins(); const cap=spinCap();
if(cap!==Infinity && (s.used||0)>=cap){ alert((I18N[lang]||I18N.it).noSpins); return false; }
s.used=(s.used||0)+1; writeJSON('surprise_spins',s); renderSpinButton(); return true;
}
renderSpinButton();

function slotSurprise(){
if(!consumeOneSpin()) return;

const rollingList = makeAbsurdList(14); // SOLO assurde

const el=$('qInput'); el.classList.add('slotting');
let i=0;
const iv=setInterval(()=>{
el.value = rollingList[i % rollingList.length];
// durante lo slot mescolo tema visivo (stile/periodo) ma la domanda resta assurda
const s = Math.random()<.5 ? 'whatif' : 'wtf';
const p = Math.random()<.5 ? 'future' : 'past';
prefs.stile=s; prefs.periodo=p; writeJSON('whatif_prefs',prefs);
document.documentElement.setAttribute('data-theme', s==='wtf'?'wtf':'whatif');
renderBadges(); i++;
},90);

setTimeout(()=>{
clearInterval(iv); el.classList.remove('slotting');
const finalList = makeAbsurdList(10);
const finalPrompt = finalList[Math.floor(Math.random()*finalList.length)];
$('qInput').value = finalPrompt;
rememberPrompt(finalPrompt);

// flag "sorpresa"    
isAbsurd=true;    
LS.setItem('absurd_prompt','1');    
LS.setItem('surprise_mode','1');

}, 1200 + Math.random()*600);
}
$('surpriseBtn').onclick=slotSurprise;
