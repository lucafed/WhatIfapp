<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none;white-space:nowrap}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
h1{font-size:clamp(24px,5vw,34px);margin:16px 0 6px;color:var(--acc2);text-align:center;letter-spacing:.2px}
.lead{color:#d8e6ff;text-align:center;margin-top:0;font-size:14px}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:18px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

/* Toggles & lists */
.toggle{cursor:pointer;user-select:none}
.headerRow{display:flex;justify-content:space-between;align-items:center}
.headerRow .label{margin:0}
.collapsed>.body{display:none}
.small{font-size:12px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:#cfe7ff;margin-top:8px}
.hidden{display:none !important}

/* Locked (micro) */
.card.locked .headerRow{opacity:.7;cursor:not-allowed}
.card.locked .toggle{pointer-events:none}
.card.locked .opt, .card.locked .btn{opacity:.6;pointer-events:none}

/* Question emphasis */
.qwrap{position:relative}
.qwrap .input{font-size:20px;text-align:center}
.qwrap .input::placeholder{color:#98aac0;opacity:.9}

/* Option pills */
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

/* Story lists */
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}

/* Submode & period */
.submode{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.period{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.subnote{font-size:12px;color:#cfe7ff;margin-top:6px}

/* nicer separators */
.card hr{border:0;border-top:1px solid var(--line);margin:10px 0}
</style>
</head>
<body>
<main>
  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>
  <p class="lead" id="leadTxt">Scrivi la tua “E se…?” e scegli stile e periodo. Le micro-domande e gli spunti cambiano ogni giorno.</p>

  <!-- Question (CENTRALE) -->
  <div class="card center" id="qCard">
    <div class="headerRow">
      <div class="label" id="qLabel">La tua domanda</div>
    </div>
    <div class="qwrap">
      <textarea id="qInput" rows="3" class="input" placeholder="E se…?" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    </div>
    <div class="row" style="margin-top:12px;justify-content:center;gap:10px">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Svuota</button>
    </div>
  </div>

  <!-- Style + Period (INSIEME) -->
  <div class="card center" id="styleCard">
    <div class="headerRow toggle" id="styleHead">
      <div class="label"><span id="styleArrow">▼</span> Stile & periodo</div>
      <div class="small" id="styleSmall">—</div>
    </div>
    <div class="body">
      <div class="chips" id="styleChips" style="justify-content:center;margin-top:6px">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
      </div>
      <div id="whatifSubMode" class="submode" style="justify-content:center">
        <button class="chip" data-mode="analitico" id="chipAnalitico">What if — Analitico</button>
        <button class="chip" data-mode="reale" id="chipReale">What if — Reale/Poetico</button>
      </div>
      <div class="period" id="periodChips" style="justify-content:center">
        <button class="chip" data-period="future" id="chipFuture">Futuro</button>
        <button class="chip" data-period="past" id="chipPast">Passato</button>
      </div>
      <div class="subnote" id="subModeNote" style="text-align:center"></div>
    </div>
  </div>

  <!-- Micro-domande (CENTRALI, COLLASSABILI + LOCK giornaliero) -->
  <div class="card center" id="microCard">
    <div class="headerRow toggle" id="microHead">
      <div class="label"><span id="microArrow">▼</span> <span id="microTitle">Micro-domande di oggi</span></div>
      <div class="small" id="microHint">(variano ogni giorno)</div>
    </div>
    <div class="body" id="microBody" style="margin-top:8px">
      <div class="optset" id="moodOpts"></div>
      <div class="optset" id="anchorOpts"></div>
      <div class="optset" id="decideOpts"></div>
      <div class="optset" id="jungAttitude"></div>
      <div class="optset" id="jungRational"></div>
      <div class="optset" id="jungPerception"></div>
      <div class="optset" id="zodiacOpts"></div>
      <div class="row" style="margin-top:6px;justify-content:center">
        <button class="btn primary" id="saveMicroBtn">💾 Salva micro-profilo</button>
      </div>
      <div class="small" id="microSavedMsg" style="margin-top:6px;text-align:center"></div>
    </div>
  </div>

  <!-- Spunti rapidi -->
  <div class="card center" id="hintsCard">
    <div class="headerRow toggle" id="hintsHeader">
      <div class="label"><span id="hintsArrow">▼</span> <span id="hintsTitle">Spunti rapidi “E se…”</span></div>
    </div>
    <div class="body" id="hintsBody" style="margin-top:8px">
      <div class="chips" id="hintsChips" style="justify-content:center"></div>
      <div class="small" id="hintsNote" style="text-align:center;margin-top:8px"></div>
    </div>
  </div>

  <!-- Domande salvate -->
  <div class="card center collapsed" id="savedCard">
    <div class="headerRow toggle" id="savedHeader">
      <div class="label"><span id="savedArrow">▶</span> <span id="nextLabel">Domande salvate</span></div>
      <button class="btn ghost" id="clearSavedBtn">🗑️ Svuota</button>
    </div>
    <div class="body" id="savedBody">
      <div id="nextList" class="list"></div>
    </div>
  </div>

  <!-- Cronologia -->
  <div class="card center collapsed" id="histCard">
    <div class="headerRow toggle" id="histHeader">
      <div class="label"><span id="histArrow">▶</span> <span id="storiesLabel">Cronologia</span></div>
      <button class="btn ghost" id="clearHistoryBtn">🗑️ Svuota</button>
    </div>
    <div class="body">
      <div id="storyList" class="list"></div>
    </div>
  </div>
</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    lead:"Scrivi la tua “E se…?” e scegli stile e periodo. Le micro-domande e gli spunti cambiano ogni giorno.",
    whatif:"What if (realistico)", wtf:"What the F",
    yourq:"La tua domanda", gen:"✨ Genera risposta", clear:"Svuota",
    subAnalitico:"Analitico: concreto, quotidiano, chiusa calma.",
    subReale:"Reale/Poetico: immagini sobrie, chiusa riconciliata.",
    microT:"Micro-domande di oggi", microHint:"(variano ogni giorno)",
    microSaveBtn:"💾 Salva micro-profilo",
    microSaved:"Micro-profilo salvato: sezione chiusa fino a domani.",
    microOnce:"Già salvato oggi: riapre domani.",
    hintsT:"Spunti rapidi “E se…”", hintsNote:"Clicca per riempire la domanda.",
    saved:"Domande salvate", stories:"Cronologia",
    use:"Usa", play:"▶", emptyNext:"— Nessuna domanda salvata.", emptyStories:"— Nessuna storia.",
    outOfCredits:"Hai finito i crediti di oggi.",
    proOn:"PRO attivo", proOff:"PRO non attivo",
    Past:"Passato", Future:"Futuro"
  },
  en:{
    title:"Set your question",
    lead:"Write your “What if…?” and pick style & period. Micro-questions and hints change daily.",
    whatif:"What if (realistic)", wtf:"What the F",
    yourq:"Your question", gen:"✨ Generate answer", clear:"Clear",
    subAnalitico:"Analytic: concrete, everyday, calm closing.",
    subReale:"Real/Poetic: lean imagery, reconciled closing.",
    microT:"Today’s micro-questions", microHint:"(changes daily)",
    microSaveBtn:"💾 Save micro-profile",
    microSaved:"Micro-profile saved: section locked until tomorrow.",
    microOnce:"Already saved today: reopens tomorrow.",
    hintsT:"Quick “What if…”", hintsNote:"Click to fill the question.",
    saved:"Saved questions", stories:"History",
    use:"Use", play:"▶", emptyNext:"— No saved questions.", emptyStories:"— No history.",
    outOfCredits:"You’ve used today’s credits.",
    proOn:"PRO active", proOff:"PRO not active",
    Past:"Past", Future:"Future"
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Helpers & state ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayISO(){return new Date().toISOString().slice(0,10);}

let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false,mode:'reale'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== UI text ===== */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('leadTxt').textContent=T.lead;
document.getElementById('qLabel').textContent=T.yourq;
document.getElementById('goBtn').textContent=T.gen;
document.getElementById('clearBtn').textContent=T.clear;
document.getElementById('chipWhatIf').textContent=T.whatif;
document.getElementById('chipWTF').textContent=T.wtf;
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('microTitle').textContent=T.microT;
document.getElementById('microHint').textContent=T.microHint;
document.getElementById('saveMicroBtn').textContent=T.microSaveBtn;
document.getElementById('hintsTitle').textContent=T.hintsT;
document.getElementById('hintsNote').textContent=T.hintsNote;

/* ===== badges ===== */
function renderBadges(){
  document.getElementById('styleBadge').textContent = "🎭 " + (prefs.stile==='wtf' ? 'What the F' : 'What if');
  document.getElementById('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past' ? (T.Past) : (T.Future));
  // chips
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.getElementById('whatifSubMode').style.display = (prefs.stile==='whatif') ? 'flex' : 'none';
  document.getElementById('chipAnalitico').classList.toggle('sel', prefs.mode==='analitico');
  document.getElementById('chipReale').classList.toggle('sel', prefs.mode!=='analitico');
  document.getElementById('chipFuture').classList.toggle('sel', prefs.periodo!=='past');
  document.getElementById('chipPast').classList.toggle('sel', prefs.periodo==='past');
  document.getElementById('subModeNote').textContent = (prefs.stile==='whatif')
    ? (prefs.mode==='analitico' ? T.subAnalitico : T.subReale)
    : '';
  document.getElementById('styleSmall').textContent = (prefs.stile==='wtf' ? 'What the F' : 'What if') + ' · ' + (prefs.periodo==='past'?T.Past:T.Future);
}
renderBadges();

/* ===== Credits ===== */
function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin() ? Infinity : (prefs.pro ? 10 : 3); }
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  if(c.date!==todayISO()){ c.date=todayISO(); c.used=0; }
  writeJSON('whatif_credits',c);
}
function leftCredits(){
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  const cap=capForUser();
  return cap===Infinity ? "∞" : Math.max(0, cap-(c.used||0));
}
function renderCreditsBadge(){
  const fb = document.getElementById('freeBadge');
  const cap = capForUser();
  const left = leftCredits();
  fb.textContent = (cap===Infinity)
    ? (lang==='en' ? 'Credits: ∞' : 'Crediti: ∞')
    : (lang==='en' ? `Credits: ${left}/${cap}` : `Crediti: ${left}/${cap}`);
  fb.title = (prefs.pro ? (lang==='en'?'PRO 10/day':'PRO 10/giorno') : (lang==='en'?'FREE 3/day':'FREE 3/giorno')) + (userIsAdmin() ? ' · ADMIN ∞' : '');
}
ensureCredits(); renderCreditsBadge();

/* ===== nav ===== */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };

/* ===== style & period switching (inside card) ===== */
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style;
  if(prefs.stile==='whatif' && !prefs.mode) prefs.mode='reale';
  writeJSON('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  renderBadges();
});
document.getElementById('whatifSubMode').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.mode=b.dataset.mode; writeJSON('whatif_prefs',prefs); renderBadges();
});
document.getElementById('periodChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.periodo=b.dataset.period; writeJSON('whatif_prefs',prefs); renderBadges();
});

/* ===== collapse helpers (arrows) ===== */
function setArrow(cardId, arrowId){
  const card=document.getElementById(cardId);
  const arrow=document.getElementById(arrowId);
  arrow.textContent = card.classList.contains('collapsed') ? '▶' : '▼';
}
['styleCard','microCard','hintsCard','savedCard','histCard'].forEach((id)=>{
  const arrowId = id==='styleCard'?'styleArrow':id==='microCard'?'microArrow':id==='hintsCard'?'hintsArrow':id==='savedCard'?'savedArrow':'histArrow';
  setArrow(id, arrowId);
});

document.getElementById('styleHead').onclick=()=>{
  const c=document.getElementById('styleCard'); c.classList.toggle('collapsed'); setArrow('styleCard','styleArrow');
};
document.getElementById('microHead').onclick=()=>{
  const card=document.getElementById('microCard');
  if(card.classList.contains('locked')) return; // bloccata oggi
  card.classList.toggle('collapsed'); setArrow('microCard','microArrow');
};
document.getElementById('hintsHeader').onclick=()=>{
  const c=document.getElementById('hintsCard'); c.classList.toggle('collapsed'); setArrow('hintsCard','hintsArrow');
};

/* ===== Question ===== */
const qEl = document.getElementById('qInput');
qEl.placeholder = (lang==='en' ? "What if…?" : "E se…?");
qEl.autofocus = true;

function trySubmit(){
  const domanda=(qEl.value||"").trim();
  if(!domanda){ qEl.focus(); return; }
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  if(!userIsAdmin()){
    const cap=capForUser();
    if((c.used||0)>=cap){ alert(T.outOfCredits); return; }
    c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();
  }
  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  const req = { domanda, stile: prefs.stile, mode: (prefs.stile==='whatif' ? (prefs.mode||'reale') : undefined), lang, extra:"", micro, fantasy_mode:false, periodo:prefs.periodo };
  writeJSON('whatif_request', req);
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

/* ===== Daily RNG helpers ===== */
function rng(seed){ let s=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0); return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function pickN(pool,n,random){ const seen=new Set(), out=[]; while(out.length<n && seen.size<pool.length){ const i=Math.floor(random()*pool.length); if(seen.has(i)) continue; seen.add(i); out.push(pool[i]); } return out; }

/* ===== Micro-questions (daily-varied & compact) ===== */
function isMicroLockedToday(){ return readJSON('micro_saved',{date:"",ok:false}).date===todayISO(); }

function renderMicro(){
  const saved=readJSON('micro_profile',{});
  const day=todayISO();
  const r=rng(day+"-micro");

  // Pools (variano con seed giornaliero)
  const moodPool = (lang==='en'
    ? ["Calm airplane mode","Charged socket","Foggy but fine","Restless astronaut","Light & chatty","Solid & quiet","Quietly confident","A bit chaotic, funny"]
    : ["Calmo in modalità aereo","Carico come una presa","Appannato ma ok","Astronauta irrequieto","Leggero e chiacchierone","Solido e in silenzio","Sereno ma vigile","Un po’ caotico ma divertito"]);
  const anchorPool = (lang==='en'
    ? ["People I love","Money & bills","A routine that works","A promise to myself","Fear of changing","Curiosity about here","Health & energy","Time with kids/family"]
    : ["Le persone che amo","Soldi & bollette","Una routine che funziona","Una promessa a me stesso/a","Paura di cambiare","Curiosità per ciò che c’è","Salute & energia","Tempo con figli/famiglia"]);
  const decidePool = (lang==='en'
    ? ["Gut first","Lists pros/cons","Ask a friend","Deadline decides","Flip a coin","Coffee + walk","Sleep on it","Try small first"]
    : ["Pancia prima","Liste pro/contro","Chiedo a un amico","Decide la scadenza","Tiro la moneta","Caffè + passeggiata","Ci dormo su","Provo in piccolo"]);
  const zodiacPool = (lang==='en'
    ? ["Aries/Taurus/Gemini","Cancer/Leo/Virgo","Libra/Scorpio/Sag","Capricorn/Aquarius/Pisces","No sign, just vibes","Lucky habit: same socks"]
    : ["Ariete/Toro/Gemelli","Cancro/Leone/Vergine","Bilancia/Scorpione/Sag","Capricorno/Acquario/Pesci","Niente segno, solo vibrazioni","Portafortuna: stesse calze"]);
  const jungAtt  = (lang==='en' ? ["Extraversion","Introversion"] : ["Estroversione","Introversione"]);
  const jungRat  = (lang==='en' ? ["Thinking (T)","Feeling (F)"] : ["Pensiero (T)","Sentimento (F)"]);
  const jungPer  = (lang==='en' ? ["Sensing (S)","Intuition (N)"] : ["Sensazione (S)","Intuizione (N)"]);

  function renderPills(containerId, pool, key, n){
    const wrap=document.getElementById(containerId); wrap.innerHTML='';
    pickN(pool, n, r).forEach(text=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=text;
      if(saved[key]===text) b.classList.add('sel');
      b.onclick=()=>{
        wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        const cur=readJSON('micro_profile',{}); cur[key]=text; writeJSON('micro_profile',cur);
      };
      wrap.appendChild(b);
    });
  }

  renderPills('moodOpts',   moodPool,   'mood',   6);
  renderPills('anchorOpts', anchorPool, 'anchor', 6);
  renderPills('decideOpts', decidePool, 'decide', 6);
  renderPills('zodiacOpts', zodiacPool, 'zodiac', 4);

  function renderGroup(id, list, key){
    const wrap=document.getElementById(id); wrap.innerHTML='';
    pickN(list, list.length, r).forEach(text=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=text;
      if(saved[key]===text) b.classList.add('sel');
      b.onclick=()=>{
        wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        const cur=readJSON('micro_profile',{}); cur[key]=text; writeJSON('micro_profile',cur);
      };
      wrap.appendChild(b);
    });
  }
  renderGroup('jungAttitude',  jungAtt, 'jung_attitude');
  renderGroup('jungRational',  jungRat, 'jung_rational');
  renderGroup('jungPerception',jungPer, 'jung_perception');

  // lock view state
  const card=document.getElementById('microCard');
  const msg=document.getElementById('microSavedMsg');
  if(isMicroLockedToday()){
    card.classList.add('collapsed','locked');
    msg.textContent=T.microSaved;
    document.getElementById('microArrow').textContent='▶';
  } else {
    card.classList.remove('locked');
    msg.textContent='';
    document.getElementById('microArrow').textContent='▼';
  }
}
renderMicro();

document.getElementById('saveMicroBtn').onclick=()=>{
  const ms=readJSON('micro_saved',{date:"",ok:false});
  if(ms.date===todayISO()){
    document.getElementById('microSavedMsg').textContent=T.microOnce;
    return;
  }
  writeJSON('micro_saved',{date:todayISO(),ok:true});
  document.getElementById('microSavedMsg').textContent=T.microSaved;
  const card=document.getElementById('microCard');
  card.classList.add('collapsed','locked');
  document.getElementById('microArrow').textContent='▶';
};

/* ===== Hints (daily-varied) ===== */
const HINT_POOL_IT=[
 "E se cambiassi lavoro?","E se cambiassi città?","E se tornassi a studiare?","E se aprissi qualcosa di tuo?",
 "E se facessi pace con qualcuno?","E se mollassi i social per 30 giorni?","E se sveglia all’alba per un mese?",
 "E se prendessi un cane?","E se chiedessi un aumento?","E se partissi da solo?","E se imparassi una lingua strana?",
 "E se mettessi via 5 euro al giorno?","E se scrivessi un libro?","E se aprissi un canale su ciò che ami?",
 "E se tornassi a vivere all’Aquila?","E se mi concedessi un anno sabbatico?","E se riducessi l’orario?","E se cambiassi routine per 7 giorni?"
];
const HINT_POOL_EN=[
 "What if I changed jobs?","What if I moved city?","What if I went back to study?","What if I started my own thing?",
 "What if I made peace with someone?","What if I quit social for 30 days?","What if I woke up at dawn for a month?",
 "What if I adopted a dog?","What if I asked for a raise?","What if I traveled solo?","What if I learned a weird language?",
 "What if I saved €5/day?","What if I wrote a book?","What if I launched a channel?",
 "What if I moved back to L’Aquila?","What if I took a sabbatical?","What if I worked fewer hours?","What if I changed routine for a week?"
];
function renderHints(){
  const wrap=document.getElementById('hintsChips'); wrap.innerHTML='';
  const pool=(lang==='en'?HINT_POOL_EN:HINT_POOL_IT);
  const r=rng(todayISO()+"-hints");
  pickN(pool, 6, r).forEach(h=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=h;
    b.onclick=()=>{ const q=document.getElementById('qInput'); q.value=h; window.scrollTo({top:0,behavior:'smooth'}); };
    wrap.appendChild(b);
  });
}
renderHints();

/* ===== Saved & History ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
document.getElementById('nextLabel').textContent = (lang==='en'?'Saved questions':'Domande salvate');
document.getElementById('storiesLabel').textContent = (lang==='en'?'History':'Cronologia');

function renderNext(){
  const box=document.getElementById('nextList'); box.innerHTML='';
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=(lang==='en'? '— No saved questions.' : '— Nessuna domanda salvata.'); box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmtDate(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=(lang==='en'? 'Use' : 'Usa');
    useBtn.onclick=()=>{ const q=document.getElementById('qInput'); q.value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); writeJSON('whatif_request',{ domanda:item.q||"", stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'reale'):undefined), lang, extra:"", micro:readJSON('micro_profile',{}), fantasy_mode:false, periodo:prefs.periodo }); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderStories(){
  const box=document.getElementById('storyList'); box.innerHTML='';
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=(lang==='en'? '— No history.' : '— Nessuna storia.'); box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story', { domanda:item.domanda, answer:item.risposta||item.answer||"", stile:item.stile||'whatif' }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
renderNext(); renderStories();

document.getElementById('clearSavedBtn').textContent=(lang==='en'? '🗑️ Clear' : '🗑️ Svuota');
document.getElementById('clearHistoryBtn').textContent=(lang==='en'? '🗑️ Clear' : '🗑️ Svuota');
document.getElementById('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
document.getElementById('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };
</script>
