<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – La tua domanda</title>
  <meta name="theme-color" content="#0B0B0C" />

  <style>
    :root{
      --bg:#0B0B0C;
      --fg:#FFFFFF;
      --muted:#A0B2BA;
      --accent1:#1C57A0; /* Blu Verona */
      --accent2:#3A6B56; /* Verde Speranza */
      --highlight:#FFEC01; /* Giallo Verona */
      --card:#141C22;
      --chip:#1e2d34;
    }

    *{box-sizing:border-box;}
    html,body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--fg);
    }

    .topbar{
      position:fixed;
      top:10px;left:10px;right:10px;
      display:flex;
      justify-content:space-between;
      z-index:10;
    }
    .btn{
      appearance:none;
      border:none;
      border-radius:12px;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
      color:#fff;
      background:#1e2d34;
      transition:background .2s ease, transform .1s ease;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent1),var(--accent2));
      color:#fff;
    }
    .btn:hover{transform:translateY(-1px);}
    main{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .wrap{width:min(92vw,720px);}
    h1{
      font-size:clamp(22px,5vw,30px);
      margin:8px 0 12px;
      text-align:center;
      line-height:1.3;
    }
    label{display:block;margin:10px 0 6px;font-weight:600;}
    input,textarea{
      width:100%;
      background:#101922;
      border:1px solid #1b2a34;
      border-radius:12px;
      color:#E6F2F5;
      padding:12px;
      font-size:15px;
      resize:none;
    }
    textarea:focus,input:focus{outline:none;border-color:var(--accent1);}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .chip{
      background:var(--chip);
      color:#d7e9eb;
      border:none;
      padding:10px 14px;
      border-radius:16px;
      cursor:pointer;
      font-weight:600;
      transition:background .2s ease;
    }
    .chip:hover{background:var(--accent1);}
    .extra{
      background:#111a21;
      border:1px solid #1f2c36;
      border-radius:16px;
      padding:16px;
      margin-top:16px;
      display:none;
    }
    .hint{
      font-size:13px;
      color:var(--muted);
      margin:6px 0 12px;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:18px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="btn" onclick="history.back()">← <span id="tb_back">Indietro</span></button>
    <button class="btn" onclick="location.href='index.html'">🏠 <span id="tb_home">Home</span></button>
  </div>

  <main>
    <div class="wrap">
      <h1 id="mainTitle">💭 Qual è la domanda che non riesci a toglierti dalla testa?</h1>
      <label id="questionLabel" for="domandaInput">Scrivila qui sotto</label>
      <textarea id="domandaInput" rows="3" placeholder="E se..."></textarea>

      <div class="chips" id="templates"></div>

      <div class="hint">
        <button class="btn" id="toggleMore">✨ Aggiungi un tocco personale in 30s</button>
      </div>

      <div class="extra" id="moreBox">
        <p class="hint" id="moreHint">Non è obbligatorio, ma rende lo scenario più tuo.</p>
        <label id="lab_place">Un dettaglio del luogo</label>
        <input id="anchor_place" type="text" placeholder="(es. la piazza, il bar, la stanza...)">
        <label id="lab_person">Una persona (nome fittizio + ruolo)</label>
        <input id="anchor_person" type="text" placeholder="(es. Anna, la collega di progetto)">
        <label id="lab_memory">Un ricordo vivido</label>
        <input id="anchor_memory" type="text" placeholder="(es. il profumo del caffè, una frase, un oggetto)">
      </div>

      <div class="row">
        <button class="btn" id="backBtn">← <span id="backTxt">Indietro</span></button>
        <button class="btn primary" id="nextBtn"><span id="nextTxt">✨ Scopri il tuo What?f</span> →</button>
      </div>
    </div>
  </main>

<script>
  // === WHAT?F (versione aggiornata – tono empatico e curioso) ===

  const L=(localStorage.getItem("lang")||"it").toLowerCase();
  const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
  const period = prefs.periodo || 'future';

  // 💬 Testi aggiornati
  const T = L==='en'
    ? {
        back:'Back',home:'Home',
        title:"💭 What’s the question you can’t get out of your head?",
        label:"Type it here",
        pastPH:"What if you had stayed in ___?",
        futurePH:"What if in the next 12 months you ___?",
        toggle:"✨ Add a personal touch in 30s",
        hint:"Optional, but helps make the story feel more *you*.",
        place:"A place detail",
        person:"A person (alias + role)",
        memory:"A vivid memory (object, sound, smell…)",
        missing:"Write your question before continuing.",
        next:"✨ Discover your What?f",
        tempPast:["What if you had stayed in your hometown?","What if you had worked with ___ instead?","What if you hadn’t moved in 2015?"],
        tempFuture:["What if you quit and opened a small studio?","What if you moved to ___ for a year?","What if you went back to study ___?"]
      }
    : {
        back:'Indietro',home:'Home',
        title:"💭 Qual è la domanda che non riesci a toglierti dalla testa?",
        label:"Scrivila qui sotto",
        pastPH:"E se fossi rimasto a ___?",
        futurePH:"E se nei prossimi 12 mesi ___?",
        toggle:"✨ Aggiungi un tocco personale in 30 secondi",
        hint:"Non è obbligatorio, ma rende lo scenario più *tuo*.",
        place:"Un dettaglio del luogo",
        person:"Una persona (nome fittizio + ruolo)",
        memory:"Un ricordo vivido (oggetto, suono, odore…)",
        missing:"Scrivi prima la tua domanda.",
        next:"✨ Scopri il tuo What?f",
        tempPast:["E se fossi rimasto nella tua città?","E se avessi lavorato con ___ invece?","E se non ti fossi trasferito nel 2015?"],
        tempFuture:["E se lasciassi e aprissi uno studio?","E se ti trasferissi a ___ per un anno?","E se tornassi a studiare ___?"]
      };

  // 🎨 Aggiornamento UI
  document.getElementById('mainTitle').textContent = T.title;
  document.getElementById('questionLabel').textContent = T.label;
  document.getElementById('tb_back').textContent = T.back;
  document.getElementById('tb_home').textContent = T.home;
  document.getElementById('backTxt').textContent = T.back;
  document.getElementById('nextTxt').textContent = T.next;
  document.getElementById('toggleMore').textContent = T.toggle;
  document.getElementById('moreHint').textContent = T.hint;
  document.getElementById('lab_place').textContent = T.place;
  document.getElementById('lab_person').textContent = T.person;
  document.getElementById('lab_memory').textContent = T.memory;

  // Placeholder dinamico
  const domandaInput = document.getElementById('domandaInput');
  domandaInput.placeholder = period==='past' ? T.pastPH : T.futurePH;

  // Suggerimenti (chips)
  const tBox = document.getElementById('templates');
  (period==='past'?T.tempPast:T.tempFuture).forEach(txt=>{
    const b=document.createElement('button');
    b.className='chip';
    b.textContent=txt;
    b.addEventListener('click',()=>{ domandaInput.value = txt; });
    tBox.appendChild(b);
  });

  // Toggle extra box
  document.getElementById('toggleMore').addEventListener('click',()=>{
    const box=document.getElementById('moreBox');
    box.style.display = box.style.display==='none'?'block':'none';
  });

  // Navigazione
  document.getElementById('backBtn').addEventListener('click',()=>history.back());
  document.getElementById('nextBtn').addEventListener('click',salvaDomanda);

  // Prefill campi se già esistono
  (function prefill(){
    const prev=localStorage.getItem("domanda");
    if(prev) domandaInput.value=prev;
    const anchors=JSON.parse(localStorage.getItem("whatif_anchors")||"{}");
    if(anchors.place) document.getElementById("anchor_place").value=anchors.place;
    if(anchors.person) document.getElementById("anchor_person").value=anchors.person;
    if(anchors.memory) document.getElementById("anchor_memory").value=anchors.memory;
  })();

  // Salvataggio
  function salvaDomanda(){
    const domanda = domandaInput.value.trim();
    if(!domanda){ alert(T.missing); return; }
    localStorage.setItem("domanda", domanda);

    const anchors={
      place:document.getElementById("anchor_place").value.trim(),
      person:document.getElementById("anchor_person").value.trim(),
      memory:document.getElementById("anchor_memory").value.trim()
    };
    localStorage.setItem("whatif_anchors", JSON.stringify(anchors));

    const tags = classifyQuestion(domanda, period);
    localStorage.setItem("whatif_tags", JSON.stringify(tags));

    // Vai avanti
    location.href="fifth.html";
  }

  // Classificatore (semplificato)
  function classifyQuestion(q, period){
    const s = (q||"").toLowerCase();
    const tags = new Set();
    if (period==='past' || /se fossi rimasto|se avessi/i.test(q)) tags.add('past');
    if (period==='future' || /nei prossimi|tra un anno|se lasciassi/i.test(q)) tags.add('future');
    if (/\blavor|carriera|azienda|studio|progetto\b/i.test(s)) tags.add('work');
    if (/\bamore|relazion|partner|famiglia|amico|amica\b/i.test(s)) tags.add('relationships');
    if (/\baffitto|mutuo|soldi|stipendio|debito|invest/i.test(s)) tags.add('money');
    if (/\btrasfer|città|quartiere|piazza|verona|roma|milano\b/i.test(s)) tags.add('place');
    if (/\bsalute|allenament|stress|sonno\b/i.test(s)) tags.add('wellbeing');
    return Array.from(tags);
  }
</script>
</body>
</html>
