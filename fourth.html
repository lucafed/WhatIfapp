<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Ask</title>

<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414;
    --fg:#FFFFFF; --muted:#A0B2BA;

    /* What if (default) */
    --acc:#1C57A0;       /* Blu Verona */
    --acc2:#FFEC01;      /* Giallo Verona */

    /* superfici */
    --card:rgba(20,28,34,0.92);
    --line:rgba(255,255,255,.12);
    --chip:#121A26;
    --ink:#0A0E12;
    --shadow:rgba(0,0,0,.35);

    --highlight:#FFEC01;
  }
  html[data-theme="wtf"]{
    --acc:#3A6B56;
    --acc2:#5A8C75;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    background: radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
    color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility
  }
  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer;transition:transform .06s ease,opacity .2s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);font-weight:800;box-shadow:0 6px 18px var(--shadow);border:none}
  .btn.large{padding:14px 18px;font-size:16px}
  .btn.icon{padding:8px 10px;border-radius:10px}

  .lang{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:#eaf3ee;font-size:13px;cursor:pointer}
  .lang strong{color:var(--acc2)}

  h1{font-size:clamp(22px,5vw,30px);margin:14px 0 2px;color:var(--acc2)}
  p.sub{color:var(--muted);margin:0 0 8px}

  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px var(--shadow)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

  .qarea{display:flex;flex-direction:column;gap:10px}
  textarea{
    width:100%;min-height:120px;resize:vertical;background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-left:4px solid var(--highlight);
    border-radius:12px;padding:14px;font-size:17px;line-height:1.6;color:#EAF3EE;
  }

  .cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .cta-row .btn.primary{flex:1}

  .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
  .badge.accent{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);border:none;font-weight:800}

  /* Overlay Clarify */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
  .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
  .qitem{margin:10px 0}
  .qitem label{display:block;margin:6px 0}
  .qitem input{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
  .small{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="row">
        <button class="btn" id="backBtnTop">←</button>
        <button class="btn" id="homeBtnTop">🏠</button>
      </div>

      <div class="row">
        <span class="badge" id="badgePeriodo">🕰️ —</span>
        <div class="chips" id="styleChips">
          <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
          <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
        </div>
        <button id="langBtn" class="lang" title="Switch language">IT / EN</button>
      </div>
    </div>

    <h1 id="titleH1">Immagina la tua domanda</h1>
    <p class="sub" id="subtitle">Scrivi cosa vorresti esplorare; puoi chiarire con 2–3 micro-domande.</p>

    <div class="card">
      <h3 class="label" id="qLabel">La tua domanda</h3>
      <div class="qarea">
        <textarea id="qInput" placeholder="E se tornassi a vivere all’Aquila?"></textarea>
        <div class="cta-row">
          <button class="btn primary large" id="clarifyBtn">✨ Chiarisci & genera</button>
          <button class="btn large" id="genBtn">Vai alla risposta</button>
        </div>
        <div class="small" id="hint">
          Tip: puoi cambiare stile in alto; colori e tono si adattano.
        </div>
      </div>
    </div>

    <div class="card" id="recapCard" style="display:none">
      <h3 class="label" id="recapLabel">Ultime micro-risposte</h3>
      <div id="recapList" class="small">—</div>
    </div>
  </main>

  <!-- Clarify Overlay -->
  <div class="overlay" id="clarifyOverlay">
    <div class="sheet">
      <h3 style="margin:6px 0" id="clarifyTitle">2–3 domande mirate sulla tua domanda</h3>
      <div id="clarifyList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="applyClarify">Genera con queste risposte</button>
        <button class="btn" id="cancelClarify">Annulla</button>
      </div>
    </div>
  </div>

<script>
/* ========= I18N ========= */
const I18N = {
  it:{
    title:"Immagina la tua domanda",
    subtitle:"Scrivi cosa vorresti esplorare; puoi chiarire con 2–3 micro-domande.",
    back:"Indietro", home:"Home",
    periodoPast:"Passato", periodoFuture:"Futuro",
    qLabel:"La tua domanda",
    clarifyBtn:"✨ Chiarisci & genera",
    genBtn:"Vai alla risposta",
    hint:"Tip: puoi cambiare stile in alto; colori e tono si adattano.",
    clarifyTitle:"2–3 domande mirate sulla tua domanda",
    applyClarify:"Genera con queste risposte", cancelClarify:"Annulla",
    recap:"Ultime micro-risposte",
    placeholder:"E se tornassi a vivere all’Aquila?",
    langLabel:(cur)=> cur==='it' ? "IT / EN" : "EN / IT"
  },
  en:{
    title:"Shape your what-if",
    subtitle:"Write what you want to explore; you can refine with 2–3 micro-questions.",
    back:"Back", home:"Home",
    periodoPast:"Past", periodoFuture:"Future",
    qLabel:"Your question",
    clarifyBtn:"✨ Clarify & Generate",
    genBtn:"Go to answer",
    hint:"Tip: switch style above; colors and tone adapt.",
    clarifyTitle:"2–3 focused questions about your ask",
    applyClarify:"Generate with these answers", cancelClarify:"Cancel",
    recap:"Latest micro-answers",
    placeholder:"What if I moved back to L’Aquila?",
    langLabel:(cur)=> cur==='en' ? "EN / IT" : "IT / EN"
  }
};
const LS = localStorage;
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function $(id){ return document.getElementById(id); }
function getTZ(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }catch{ return 'UTC'; } }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* ========= Lang sync (con prima pagina) ========= */
let lang = (LS.getItem('lang')||'it').toLowerCase();
function applyLang(){
  const T = I18N[lang]||I18N.it;
  document.documentElement.lang = lang;
  $('titleH1').textContent = T.title;
  $('subtitle').textContent = T.subtitle;
  $('backBtnTop').textContent = `← ${T.back}`;
  $('homeBtnTop').textContent = `🏠 ${T.home}`;
  $('qLabel').textContent = T.qLabel;
  $('clarifyBtn').textContent = T.clarifyBtn;
  $('genBtn').textContent = T.genBtn;
  $('hint').textContent = T.hint;
  $('clarifyTitle').textContent = T.clarifyTitle;
  $('applyClarify').textContent = T.applyClarify;
  $('cancelClarify').textContent = T.cancelClarify;
  $('recapLabel').textContent = T.recap;
  $('qInput').placeholder = T.placeholder;
  $('langBtn').innerHTML = `<strong>${T.langLabel(lang)}</strong>`;
}
$('langBtn').addEventListener('click', ()=>{
  lang = (lang==='it') ? 'en' : 'it';
  LS.setItem('lang', lang);      // sync globale
  applyLang();
});
window.addEventListener('storage', (e)=>{
  if (e.key==='lang' && e.newValue){
    lang = e.newValue.replace(/"/g,''); // LS serializza
    applyLang();
  }
});

/* ========= Tema / stile ========= */
(function applyThemeFromPrefs(){
  const prefs = readJSON('whatif_prefs', {});
  const theme = (prefs.stile==='wtf') ? 'wtf' : 'whatif';
  document.documentElement.setAttribute('data-theme', theme);
})();
function setStyle(style){
  const prefs = readJSON('whatif_prefs', {});
  prefs.stile = (style==='wtf') ? 'wtf' : 'whatif';
  writeJSON('whatif_prefs', prefs);
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===prefs.stile));
}
document.querySelectorAll('#styleChips .chip').forEach(c=>{
  c.addEventListener('click', ()=> setStyle(c.dataset.style));
});
(function selectInitialChip(){
  const prefs = readJSON('whatif_prefs', {});
  const cur = (prefs.stile==='wtf') ? 'wtf' : 'whatif';
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===cur));
})();

/* ========= Periodo badge ========= */
(function setPeriodBadge(){
  const prefs = readJSON('whatif_prefs', {});
  const T = I18N[lang]||I18N.it;
  $('badgePeriodo').textContent = "🕰️ "+(prefs.periodo==='past' ? T.periodoPast : T.periodoFuture);
})();

/* ========= Clarify (collegato alla tua /api/ask) ========= */
const clarifyOverlay = $('clarifyOverlay');
const clarifyList   = $('clarifyList');

async function fetchClarifyQuestions(domanda){
  const prefs = readJSON('whatif_prefs', {});
  const payload = {
    domanda,
    lang,
    periodo: (prefs.periodo || 'future'),
    stile: (prefs.stile || 'whatif'),
    clarify: true,
    profilo: buildLeanProfile(),
    tags: readJSON('whatif_tags', []),
    now: new Date().toISOString(),
    tz: getTZ()
  };
  try{
    const r = await fetch('/api/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error('server');
    const j = await r.json();
    return Array.isArray(j.questions) ? j.questions.slice(0,3) : [];
  }catch{
    // fallback locale minimo
    const it = lang!=='en';
    return [
      { id:'time_window', label: it?'Finestra decisionale reale?':'Your real decision window?', placeholder: it?'questo mese / 3–6 mesi':'this month / 3–6 months' },
      { id:'success_indicator', label: it?'Un indicatore misurabile entro 30 giorni?':'One measurable indicator in 30 days?', placeholder: it?'€ risparmiati, ore, primo cliente':'€ saved, hours, first client' },
      { id:'real_constraint', label: it?'Vincolo concreto da non ignorare?':'A concrete constraint you can’t ignore?', placeholder: it?'budget, tempo, energia':'budget, time, energy' }
    ];
  }
}
function buildLeanProfile(){
  const p = readJSON('whatif_profile',{}) || {};
  const lean = {};
  if (p.name) lean.name = String(p.name);
  if (p.city_now) lean.city_now = String(p.city_now); else if (p.city) lean.city = String(p.city);
  if (p.work_role) lean.work_role = String(p.work_role); else if (p.role) lean.role = String(p.role);
  return lean;
}
async function openClarify(){
  const q = $('qInput').value.trim();
  if(!q){ $('qInput').focus(); return; }

  clarifyList.innerHTML = `<p class="sub">${lang==='en'?'Preparing 2–3 focused questions…':'Sto preparando 2–3 domande mirate…'}</p>`;
  clarifyOverlay.style.display = 'flex';

  const qs = await fetchClarifyQuestions(q);
  const safe = qs.map((q,i)=>({
    id: String(q.id||`q${i+1}`),
    label: String(q.label|| (lang==='en'?'Question':'Domanda')),
    placeholder: String(q.placeholder|| (lang==='en'?'Answer in one line':'Rispondi in una riga'))
  }));

  clarifyList.innerHTML = safe.map(q=>`
    <div class="qitem">
      <label for="${q.id}">${q.label}</label>
      <input id="${q.id}" type="text" placeholder="${(q.placeholder||'').replace(/"/g,'&quot;')}" />
    </div>
  `).join("");

  // salva per recap
  LS.setItem('clarify_last_qs', JSON.stringify(safe));
}
$('clarifyBtn').addEventListener('click', openClarify);
$('cancelClarify').addEventListener('click', ()=> clarifyOverlay.style.display='none');

$('applyClarify').addEventListener('click', ()=>{
  const inputs = clarifyList.querySelectorAll('input');
  const answers = {};
  inputs.forEach(i=>{ const v=(i.value||'').trim(); if(i.id && v) answers[i.id]=v; });

  // salviamo per la 5ª pagina
  const q = $('qInput').value.trim();
  LS.setItem('domanda', q);
  LS.setItem('clarify_for_next', JSON.stringify(answers));
  // aggiorna recap
  renderRecap(answers);

  clarifyOverlay.style.display='none';
  // vai subito alla risposta
  location.href='fifth.html';
});

/* ========= Recap micro-risposte ========= */
function renderRecap(obj){
  const card = $('recapCard');
  const list = $('recapList');
  const keys = Object.keys(obj||{});
  if(!keys.length){ card.style.display='none'; return; }
  card.style.display='block';
  list.innerHTML = keys.map(k=>{
    const v = String(obj[k]||'').replace(/</g,'&lt;');
    return `• <strong>${k}</strong>: ${v}`;
  }).join('<br/>');
}

/* ========= Go to answer ========= */
$('genBtn').addEventListener('click', ()=>{
  const q = $('qInput').value.trim();
  if(!q){ $('qInput').focus(); return; }
  LS.setItem('domanda', q);
  // se non abbiamo chiarimenti, svuotiamo il pacchetto per la quinta
  LS.setItem('clarify_for_next','{}');
  location.href='fifth.html';
});

/* ========= Nav ========= */
$('backBtnTop').addEventListener('click', ()=> history.back());
$('homeBtnTop').addEventListener('click', ()=> location.href='index.html');

/* ========= Boot ========= */
function boot(){
  // carica eventuale domanda salvata
  const prevQ = LS.getItem('domanda')||'';
  if(prevQ){ $('qInput').value = prevQ; }
  // recap se presente
  renderRecap(readJSON('clarify_for_next', {}));
  applyLang();
}
boot();
</script>

<!-- SW -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(()=>{});
    });
  }
</script>
</body>
</html>
