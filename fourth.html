<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – La tua domanda</title>

<!-- PWA -->
<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  /* ===== THEME SYSTEM (palette ufficiali) ===== */
  :root{
    --bg:#0C0F14; --bg2:#0E1724;
    --fg:#FFFFFF; --muted:#A0B2BA;
    --card:rgba(14,19,28,.55); --card-border:rgba(255,255,255,.12);
    --chip:#141C22; --ink:#0A0E12;
    --accent:#1C57A0;     /* Blu Verona */
    --accent2:#FFEC01;    /* Giallo Verona */
    --focus:#FFE680;
    --shadow:rgba(0,0,0,.35);
  }
  html[data-theme="whatif"]{
    --bg:#0B1018; --bg2:#0E1724;
    --fg:#F4F7FB; --muted:#A7B3C2;
    --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.14);
    --chip:#121A26; --accent:#1C57A0; --accent2:#FFEC01; --focus:#FFE680;
  }
  html[data-theme="wtf"]{
    --bg:#0B0B0C; --bg2:#101414;
    --fg:#EEF5F0; --muted:#A6B6AD;
    --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.12);
    --chip:#0F1714; --accent:#3A6B56; --accent2:#5A8C75; --focus:#CFFFD0;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0; color:var(--fg);
    background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  @media (prefers-reduced-motion:no-preference){
    body{animation:bgShift 18s ease-in-out infinite alternate}
    @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
  }

  .topbar{
    position:fixed;top:10px;left:10px;right:10px;z-index:10;
    display:flex;justify-content:space-between;align-items:center;
  }
  .btn{
    appearance:none;border:1px solid var(--card-border);
    background:var(--chip);color:#E6F2F5;border-radius:12px;
    padding:8px 12px;font-weight:700;cursor:pointer
  }
  .btn.primary{
    border:none;background:linear-gradient(180deg,var(--accent),var(--accent2));
    color:var(--ink)
  }

  main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  h1{font-size:clamp(22px,5vw,32px);margin:0 0 14px;color:var(--accent)}
  .card{
    width:min(92vw,760px);
    background:var(--card);border:1px solid var(--card-border);
    border-radius:16px;padding:18px;box-shadow:0 10px 28px var(--shadow);
    backdrop-filter:blur(10px)
  }
  label{display:block;margin:6px 0 8px;font-weight:700}
  input[type="text"]{
    width:100%;background:var(--chip);color:var(--fg);
    border:1px solid var(--card-border);border-radius:12px;font-size:16px;padding:14px
  }
  input[type="text"]:focus{outline:2px solid var(--focus);outline-offset:2px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:12px}
  .toggle{
    width:100%;text-align:left;background:var(--chip);
    border:1px solid var(--card-border);color:#cfe3e7;border-radius:12px;
    padding:10px 12px;font-weight:800;cursor:pointer
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{
    background:var(--chip);border:1px solid var(--card-border);color:#cfe3e7;
    border-radius:999px;padding:8px 12px;font-size:12px;cursor:pointer
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="btn" onclick="history.back()">← <span id="tb_back">Indietro</span></button>
  <button class="btn" onclick="location.href='index.html'">🏠 <span id="tb_home">Home</span></button>
</div>

<main>
  <h1 id="mainTitle">Scrivi la tua domanda</h1>
  <div class="card">
    <label for="domandaInput" id="questionLabel">La tua domanda</label>
    <input type="text" id="domandaInput" placeholder="" />

    <!-- Template dinamici (past/future) -->
    <div class="chips" id="templates"></div>

    <!-- ancore personali -->
    <div style="margin-top:14px;border-top:1px solid var(--card-border);padding-top:12px">
      <button class="toggle" id="toggleMore">✨ Rendi più personale in 30s</button>
      <div id="moreBox" style="display:none">
        <p class="muted" id="moreHint">Compila se vuoi soprattutto per il passato: useremo questi dettagli come ancore.</p>
        <div style="display:grid;gap:10px;grid-template-columns:1fr;max-width:100%">
          <div>
            <label id="lab_place">Un dettaglio del luogo</label>
            <input id="anchor_place" type="text" placeholder="Via, quartiere, bar, piazza…" />
          </div>
          <div>
            <label id="lab_person">Una persona (nome fittizio + ruolo)</label>
            <input id="anchor_person" type="text" placeholder="Es. “Marco (amico di infanzia)”" />
          </div>
          <div>
            <label id="lab_memory">Un ricordo concreto (oggetto, canzone, odore)</label>
            <input id="anchor_memory" type="text" placeholder="Es. odore di pioggia sul Corso, canzone al juke-box…" />
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="backBtn">← <span id="backTxt">Indietro</span></button>
      <button class="btn primary" id="nextBtn"><span id="nextTxt">Avanti</span> →</button>
    </div>
  </div>
</main>

<script>
  /* ===== Apply theme from prefs ===== */
  (function(){
    try{
      const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
      const theme = prefs.stile==='wtf' ? 'wtf' : 'whatif';
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){ document.documentElement.setAttribute('data-theme','whatif'); }
  })();
</script>

<script>
  const L=(localStorage.getItem("lang")||"it").toLowerCase();
  const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}'); // {periodo, stile}
  const period = prefs.periodo || 'future';
  const T = L==='en'
    ? {back:'Back',home:'Home',title:'Write your question',label:'Your question',
       pastPH:"What if you had stayed in ___?", futurePH:"What if in the next 12 months you ___?",
       toggle:"✨ Make it more personal in 30s",hint:"Optional (especially useful for the past): anchors help realism.",
       place:"A place detail",person:"A person (alias + role)",memory:"A concrete memory",
       missing:"Please enter a question before continuing.",next:"Next",
       tempPast:["What if you had stayed in your hometown?","What if you had worked with ___ instead?","What if you hadn’t moved in 2015?"],
       tempFuture:["What if you quit and opened a small studio?","What if you moved to ___ for a year?","What if you went back to study ___?"]}
    : {back:'Indietro',home:'Home',title:'Scrivi la tua domanda',label:'La tua domanda',
       pastPH:"E se fossi rimasto a ___?", futurePH:"E se nei prossimi 12 mesi ___?",
       toggle:"✨ Rendi più personale in 30s",hint:"Opzionale (utile soprattutto per il passato): le ancore aumentano il realismo.",
       place:"Un dettaglio del luogo",person:"Una persona (nome fittizio + ruolo)",memory:"Un ricordo concreto",
       missing:"Inserisci una domanda prima di continuare.",next:"Avanti",
       tempPast:["E se fossi rimasto nella tua città?","E se avessi lavorato con ___ invece?","E se non ti fossi trasferito nel 2015?"],
       tempFuture:["E se lasciassi e aprissi uno studio?","E se ti trasferissi a ___ per un anno?","E se tornassi a studiare ___?"]};
  document.getElementById('tb_back').textContent=T.back; document.getElementById('tb_home').textContent=T.home;
  document.getElementById('mainTitle').textContent=T.title; document.getElementById('questionLabel').textContent=T.label;
  document.getElementById('backTxt').textContent=T.back; document.getElementById('nextTxt').textContent=T.next;
  document.getElementById('toggleMore').textContent=T.toggle; document.getElementById('moreHint').textContent=T.hint;
  document.getElementById('lab_place').textContent=T.place; document.getElementById('lab_person').textContent=T.person; document.getElementById('lab_memory').textContent=T.memory;

  // placeholder dinamico + template
  const domandaInput = document.getElementById('domandaInput');
  domandaInput.placeholder = period==='past' ? T.pastPH : T.futurePH;
  const tBox = document.getElementById('templates');
  (period==='past'?T.tempPast:T.tempFuture).forEach(txt=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
    b.addEventListener('click',()=>{ domandaInput.value = txt; });
    tBox.appendChild(b);
  });

  // toggle more
  document.getElementById('toggleMore').addEventListener('click',()=>{ const b=document.getElementById('moreBox'); b.style.display=b.style.display==='none'?'block':'none'; });
  document.getElementById('backBtn').addEventListener('click',()=>history.back());
  document.getElementById('nextBtn').addEventListener('click',salvaDomanda);

  (function prefill(){
    const prev=localStorage.getItem("domanda"); if(prev) domandaInput.value=prev;
    const anchors=JSON.parse(localStorage.getItem("whatif_anchors")||"{}");
    if(anchors.place) document.getElementById("anchor_place").value=anchors.place;
    if(anchors.person) document.getElementById("anchor_person").value=anchors.person;
    if(anchors.memory) document.getElementById("anchor_memory").value=anchors.memory;
  })();

  function salvaDomanda(){
    const domanda = domandaInput.value.trim();
    if(!domanda){ alert(T.missing); return; }
    localStorage.setItem("domanda", domanda);
    // salva ancore
    const anchors={
      place:document.getElementById("anchor_place").value.trim(),
      person:document.getElementById("anchor_person").value.trim(),
      memory:document.getElementById("anchor_memory").value.trim()
    };
    localStorage.setItem("whatif_anchors", JSON.stringify(anchors));
    // classifica domanda → tag
    const tags = classifyQuestion(domanda, period);
    localStorage.setItem("whatif_tags", JSON.stringify(tags));
    location.href="fifth.html";
  }

  // ======= CLASSIFICATORE SEMPLICE LOCALE =======
  function classifyQuestion(q, period){
    const s = (q||"").toLowerCase();
    const tags = new Set();
    // tempo
    if (period==='past' || /se fossi rimasto|se non avessi|se avessi|what if you had|hadn’t/i.test(q)) tags.add('past');
    if (period==='future' || /nei prossimi|e se domani|tra un anno|se lasciassi|se aprissi|next 12 months|what if you/i.test(q)) tags.add('future');
    // domini
    if (/\blavor|carriera|azienda|contratto|assunzione|licenzi|studio\b/i.test(s)) tags.add('work');
    if (/\bamore|relazion|partner|figli|famiglia|amico|amica\b/i.test(s)) tags.add('relationships');
    if (/\baffitto|mutuo|soldi|stipendio|debito|finanz|invest/i.test(s)) tags.add('money');
    if (/\btrasfer|città|quartiere|via|piazza|trasloco|verona|l'aquila|roma|milano|napoli\b/i.test(s)) tags.add('place');
    if (/\bstudio|laurea|master|corso|università|esame\b/i.test(s)) tags.add('study');
    if (/\bsalute|allenament|palestra|sonno|stress\b/i.test(s)) tags.add('wellbeing');
    if (/\bprogetto|startup|studio\b/i.test(s)) tags.add('project');
    return Array.from(tags);
  }
</script>

<!-- SW -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(()=>{});
    });
  }
</script>
</body>
</html>
