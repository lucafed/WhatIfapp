<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;opacity:.9}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;opacity:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 10px}
.pill input{border:none;background:transparent;color:#fff;outline:none;min-width:120px;font-size:14px}
.section{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
.section>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700}
.section>summary::-webkit-details-marker{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.08);margin:8px 0;border:0}
.badge.switch{cursor:pointer}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge" title="">—</span>
      <span class="badge" id="proBadge">—</span>
      <span class="badge switch" id="periodBadge">🕰️ —</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Style -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="chips" id="styleChips">
        <button class="chip sel" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
      <span class="badge" id="styleBadge">🎭 What if</span>
    </div>
  </div>

  <!-- Question -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <!-- Quick detail chips (compact) -->
    <div class="chips" id="quickChips" style="margin-top:8px"></div>

    <input id="extraInput" class="input" placeholder="es. primo segnale di successo, budget, luogo specifico…" style="margin-top:8px"/>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Pulisci</button>
    </div>
    <div class="small" id="tipNote" style="margin-top:8px">Tip: puoi cambiare stile sopra; colori e tono si adattano.</div>
  </div>

  <!-- Micro domande: 1 volta al giorno -->
  <details class="section center" id="microCard">
    <summary><span class="label" style="margin:0" id="microTitle">▼ Micro-domande di oggi • 0/3</span> <span class="small" id="microHint" style="margin-left:8px">(1 volta al giorno)</span></summary>
    <div style="padding:10px 12px">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <div class="pill"><span>🙂</span><input id="mood" placeholder="Oggi come ti senti?"/></div>
        <div class="pill"><span>🧭</span><input id="anchor" placeholder="Cosa ti tiene qui?"/></div>
        <div class="pill"><span>⚙️</span><input id="decide" placeholder="Come decidi di solito?"/></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="saveMicroBtn">💾 Salva oggi</button>
      </div>
      <div class="small" id="microSavedMsg" style="margin-top:6px"></div>
    </div>
  </details>

  <!-- Saved for tomorrow -->
  <details class="section center" id="savedCard">
    <summary><span class="label" style="margin:0" id="nextLabel">▶ Domande salvate per domani</span>
      <span class="row" style="float:right"><button class="btn ghost" id="clearSavedBtn" style="margin-left:8px">Svuota salvate</button></span>
    </summary>
    <div style="padding:10px 12px">
      <div id="nextList" class="list"></div>
    </div>
  </details>

  <!-- Recent stories -->
  <details class="section center" id="histCard">
    <summary><span class="label" style="margin:0" id="storiesLabel">▶ Storie recenti</span>
      <span class="row" style="float:right"><button class="btn ghost" id="clearHistoryBtn" style="margin-left:8px">Svuota storie</button></span>
    </summary>
    <div style="padding:10px 12px">
      <div id="storyList" class="list"></div>
    </div>
  </details>

</main>

<script>
/* ===== Config ===== */
const LANG_RELOAD = false;         // se true, ricarica pagina allo switch lingua
const OWNER_PIN = localStorage.getItem('owner_pin') || '8642'; // cambia pin qui se vuoi

/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    yourq:"La tua domanda",
    gen:"✨ Genera risposta", clear:"Pulisci",
    tip:"Tip: puoi cambiare stile sopra; colori e tono si adattano.",
    styleWhat:"What if (realistico)", styleWtf:"What the F (divertente)",
    styleBadgeWhat:"🎭 What if", styleBadgeWtf:"🎭 What the F",
    periodPast:"Passato", periodFuture:"Futuro",
    free:(l,d)=>`Free oggi: ${l}/${d}`, proOn:"PRO attivo", proOff:"FREE",
    microT:(n)=>`▼ Micro-domande di oggi • ${n}/3`, microHint:"(1 volta al giorno)",
    mood:"Oggi come ti senti?", anchor:"Cosa ti tiene qui?", decide:"Come decidi di solito?",
    saveToday:"💾 Salva oggi", savedOK:"Salvato per oggi.", savedOnce:"Già salvato oggi.",
    saved:"▶ Domande salvate per domani", stories:"▶ Storie recenti",
    emptyNext:"— Nessuna salvata.", emptyStories:"— Nessuna storia.",
    clearSaved:"Svuota salvate", clearHist:"Svuota storie",
    qPh:"E se tornassi a vivere all’Aquila?",
    extraPh:"es. primo segnale, budget, luogo specifico…",
    chips:["primo segnale","budget","luogo preciso","tempo disponibile","contatto chiave","vincolo reale"]
  },
  en:{
    title:"Set your question",
    yourq:"Your question",
    gen:"✨ Generate answer", clear:"Clear",
    tip:"Tip: switch style above; tone & colors adapt.",
    styleWhat:"What if (realistic)", styleWtf:"What the F (fun)",
    styleBadgeWhat:"🎭 What if", styleBadgeWtf:"🎭 What the F",
    periodPast:"Past", periodFuture:"Future",
    free:(l,d)=>`Free today: ${l}/${d}`, proOn:"PRO active", proOff:"FREE",
    microT:(n)=>`▼ Today’s micro-questions • ${n}/3`, microHint:"(once per day)",
    mood:"How do you feel today?", anchor:"What keeps you here?", decide:"How do you usually decide?",
    saveToday:"💾 Save today", savedOK:"Saved for today.", savedOnce:"Already saved today.",
    saved:"▶ Saved for tomorrow", stories:"▶ Recent stories",
    emptyNext:"— No saved items.", emptyStories:"— No recent stories.",
    qPh:"What if I moved back to L’Aquila?",
    extraPh:"e.g., first signal, budget, specific place…",
    chips:["first signal","budget","specific place","time window","key contact","real constraint"]
  }
};

/* ===== State & helpers ===== */
const LS=localStorage;
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const $=id=>document.getElementById(id);

let lang=(LS.getItem('lang')||'it').toLowerCase();
let T=I18N[lang]||I18N.it;
let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== Credits / PRO ===== */
const DAILY_CAP = prefs.pro ? 10 : 3;
function ensureCredits(){
  const k='whatif_credits'; let c=readJSON(k,{date:todayStr(),used:0});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  writeJSON(k,c);
}
function leftCredits(){ const c=readJSON('whatif_credits',{date:todayStr(),used:0}); return Math.max(0, (prefs.pro?10:3)-(c.used||0));}
function renderCredits(){
  $('freeBadge').textContent = T.free(leftCredits(), prefs.pro?10:3);
  $('proBadge').textContent = prefs.pro ? T.proOn : T.proOff;
}
ensureCredits(); renderCredits();

/* Owner reset via PIN (long-press sui crediti) */
(function ownerReset(){
  let t=null;
  const b=$('freeBadge');
  b.addEventListener('pointerdown',()=>{ t=setTimeout(async ()=>{
    const pin = prompt(lang==='en'?'Owner PIN to reset credits:':'PIN proprietario per azzerare crediti:');
    if(pin===OWNER_PIN){
      const c=readJSON('whatif_credits'); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderCredits();
      alert(lang==='en'?'Credits reset.':'Crediti azzerati.');
    }
  },1200);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=> b.addEventListener(ev,()=>clearTimeout(t)));
})();

/* ===== UI render (instant language switch) ===== */
function renderLang(){
  T=I18N[lang]||I18N.it; document.documentElement.lang=lang;
  $('titleH1').textContent=T.title;
  $('qLabel').textContent=T.yourq;
  $('goBtn').textContent=T.gen; $('clearBtn').textContent=T.clear;
  $('tipNote').textContent=T.tip;
  $('chipWhatIf').textContent=T.styleWhat; $('chipWTF').textContent=T.styleWtf;
  $('styleBadge').textContent = prefs.stile==='wtf'? T.styleBadgeWtf : T.styleBadgeWhat;
  $('periodBadge').textContent = '🕰️ ' + (prefs.periodo==='past'? T.periodPast : T.periodFuture);
  $('nextLabel').textContent=T.saved; $('storiesLabel').textContent=T.stories;
  $('clearSavedBtn').textContent=T.clearSaved; $('clearHistoryBtn').textContent=T.clearHist;
  $('langBtn').textContent=lang.toUpperCase();
  $('qInput').placeholder=T.qPh; $('extraInput').placeholder=T.extraPh;
  $('microTitle').textContent=T.microT(readJSON('micro_saved',{date:'',ok:false}).date===todayStr()?3:0);
  $('microHint').textContent=T.microHint;
  $('mood').placeholder=T.mood; $('anchor').placeholder=T.anchor; $('decide').placeholder=T.decide;
  $('saveMicroBtn').textContent=T.saveToday;
  renderQuickChips();
  renderCredits();
}
function renderStyle(){
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  $('styleBadge').textContent = prefs.stile==='wtf'? T.styleBadgeWtf : T.styleBadgeWhat;
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
}

/* Quick chips compact & translatable */
function renderQuickChips(){
  const box=$('quickChips'); box.innerHTML="";
  T.chips.forEach(txt=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=txt; b.title=txt;
    b.onclick=()=>{ const i=$('extraInput'); i.value = i.value ? (i.value+' • '+txt) : txt; i.focus(); };
    box.appendChild(b);
  });
}

/* ===== Periodo & stile ===== */
$('periodBadge').onclick=()=>{ prefs.periodo = (prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); renderLang(); };
$('styleChips').addEventListener('click',(e)=>{ const b=e.target.closest('.chip'); if(!b) return; prefs.stile=b.dataset.style; writeJSON('whatif_prefs',prefs); renderStyle(); });

/* ===== Nav & language ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ lang = (lang==='it'?'en':'it'); LS.setItem('lang',lang); LANG_RELOAD ? location.reload() : renderLang(); };

/* ===== Micro: once per day ===== */
function loadMicro(){
  const saved=readJSON('micro_saved',{date:'',ok:false});
  if(saved.date===todayStr()){ $('microCard').open=false; $('microSavedMsg').textContent=T.savedOnce; }
}
$('saveMicroBtn').onclick=()=>{
  const saved=readJSON('micro_saved',{date:'',ok:false});
  if(saved.date===todayStr()){ $('microSavedMsg').textContent=T.savedOnce; return; }
  const micro={ mood:($('mood').value||"").trim(), anchor:($('anchor').value||"").trim(), decide:($('decide').value||"").trim(), ts:Date.now() };
  writeJSON('micro_profile', micro);
  writeJSON('micro_saved',{date:todayStr(),ok:true});
  $('microSavedMsg').textContent=T.savedOK;
  $('microTitle').textContent=T.microT(3);
  $('microCard').open=false;
};
loadMicro();

/* ===== Saved & History ===== */
function fmt(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=$('nextList'); box.innerHTML="";
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,10).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="meta">${fmt(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=(lang==='en'?'Use':'Usa');
    useBtn.onclick=()=>{ $('qInput').value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderStories(){
  const box=$('storyList'); box.innerHTML="";
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(-10).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="meta">${fmt(item.ts)} · ${(item.stile==='wtf'?'What the F':'What?f')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story', { domanda:item.domanda, answer:item.risposta||item.answer||"", stile:item.stile||'whatif' }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
$('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
$('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };

/* ===== Generate ===== */
$('goBtn').onclick=()=>{
  const domanda=($('qInput').value||"").trim();
  if(!domanda){ $('qInput').focus(); return; }

  const c=readJSON('whatif_credits'); const used=(c.used||0); const cap=prefs.pro?10:3;
  if(used>=cap){ alert(lang==='en'?'No credits left today.':'Crediti esauriti per oggi.'); return; }
  c.used=used+1; writeJSON('whatif_credits',c); renderCredits();

  const micro = readJSON('micro_profile', {});
  const extra=($('extraInput').value||"").trim();
  writeJSON('whatif_prefs', prefs);
  LS.setItem('domanda',domanda);
  writeJSON('whatif_request',{ domanda, stile:prefs.stile, lang, extra, micro, fantasy_mode:false });
  location.href='fifth.html';
};
$('clearBtn').onclick=()=>{ $('qInput').value=""; $('extraInput').value=""; $('qInput').focus(); };

/* ===== Boot ===== */
function boot(){
  renderStyle(); renderLang(); renderNext(); renderStories();
  // Collapsible states are native <details> and persist via browser heuristics
}
boot();
</script>
</body>
</html>
