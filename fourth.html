<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
:root{
  --bg:#0C0F14; --bg2:#0E1724; --card:#141C22; --fg:#F4F7FB; --muted:#A7B3C2;
  --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A; --chip:#0f1820; --line:#1b2a34;
  --barh:44px; /* ancora più bassa */
}
html[data-theme="wtf"]{
  --bg:#0B0B0C; --bg2:#101414; --card:#111713; --fg:#EEF5F0; --muted:#A6B6AD;
  --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B; --chip:#0F1714; --line:#21322A;
}
*{box-sizing:border-box}
html,body{
  height:100%; margin:0;
  background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
  color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility
}
@media (prefers-reduced-motion:no-preference){
  body{animation:bgShift 18s ease-in-out infinite alternate}
  @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
}

/* Topbar dock: più compatta + auto-hide on scroll */
.topbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  height:var(--barh);
  padding: calc(env(safe-area-inset-top,0px) + 4px) 10px 4px 10px;
  background:linear-gradient(180deg,rgba(10,15,20,.98),rgba(10,15,20,.9));
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  backdrop-filter: blur(8px);
  transition: transform .28s ease;
}
.topbar.is-hidden{ transform: translateY(calc(-1 * (var(--barh) + 16px))); }
.topbar .btn{ padding:6px 10px; font-weight:700 }
.topbar .badge{ padding:4px 8px; font-size:11px }
select{appearance:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:12px;font-weight:700;cursor:pointer}

main{
  min-height:100%;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding: calc(var(--barh) + env(safe-area-inset-top,0px) + 8px) 14px 26px;
}
.wrap{width:min(100%,980px)}

/* UI */
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap}
h1{margin:6px 0 6px;font-size:clamp(22px,6vw,34px);color:var(--accent)}
.label{color:var(--accent2);font-weight:800;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin:10px 0;overflow:hidden}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.warn{margin-top:8px;font-size:13px;color:#ffb3b3}
footer{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}

/* Smart nudge (no chip): testualino con mini-link */
.nudge{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.4}
.nudge .lnk{cursor:pointer;text-decoration:underline}

/* Slot overlay */
.slot-wrap{position:relative}
.slot-overlay{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.45); border-radius:12px; backdrop-filter: blur(2px);
}
.slot-reel{
  font-weight:800; font-size:18px; padding:8px 12px; background:rgba(255,255,255,.08);
  border:1px solid var(--line); border-radius:10px; white-space:nowrap; overflow:hidden; max-width:95%;
  animation: reel 1.1s linear infinite;
}
@keyframes reel{ 0%{transform:translateY(0)} 50%{transform:translateY(-6px)} 100%{transform:translateY(0)} }
</style>
</head>
<body>
  <div class="topbar" id="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
      <button class="btn" id="resetBtn" type="button" title="Reset totale">♻️ Reset</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="freeBadge">—</span>
      <span class="badge" id="proBadge">FREE</span>
      <select id="langSelect" aria-label="Language">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="titleH1">Imposta la tua domanda</h1>

      <!-- DOMANDA -->
      <div class="card center">
        <h3 class="label" id="qLabel">E se…</h3>

        <div class="slot-wrap">
          <textarea id="qInput" rows="3" class="input" placeholder="E se…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
          <!-- overlay slot -->
          <div class="slot-overlay" id="slotOverlay"><div class="slot-reel" id="slotReel">—</div></div>
        </div>

        <div id="qWarn" class="warn" role="alert" style="display:none"></div>

        <!-- Smart nudge dinamico (no chip) -->
        <div class="nudge" id="smartNudge" aria-live="polite" style="display:none"></div>

        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="row" style="gap:10px">
            <button class="btn primary" id="goBtn" type="button" title="Ctrl/⌘+Invio">✨ Genera risposta</button>
            <button class="btn" id="surpriseBtn" type="button">🎲 Sorprendimi</button>
          </div>
          <button class="btn" id="clearBtn" type="button">Svuota</button>
        </div>

        <div class="small" id="tipNote" style="margin-top:8px">Per risposte migliori, aggiungi: orizzonte (6–12 mesi), obiettivo (es. lavoro/relazioni), vincoli (budget/tempo).</div>
      </div>

      <!-- BOOST (resta, ma non serve per “Sorprendimi”) -->
      <div class="card center" id="boostCard">
        <div class="row" style="justify-content:space-between;align-items:center">
          <div>
            <div class="label" id="boostTitle">Boost personalizzazione</div>
            <div class="small" id="boostHint">(opzionale)</div>
          </div>
          <div class="row" style="gap:8px">
            <button class="btn" id="boostClearBtn" type="button">Svuota</button>
            <button class="btn primary" id="boostSaveBtn" type="button">💾 Salva Boost</button>
          </div>
        </div>
        <textarea id="boostInput" class="input" rows="3" placeholder="Scrivi qualcosa su di te o su cosa vuoi esplorare…"></textarea>
        <div class="small" id="boostSavedMsg" style="margin-top:6px"></div>
      </div>

      <!-- SALVATI -->
      <div class="card center collapsed" id="savedCard">
        <div class="row" style="justify-content:space-between">
          <div class="label" id="nextLabel">▶ Domande salvate</div>
          <button class="btn" id="clearSavedBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body" id="savedBody"><div id="nextList" class="list"></div></div>
      </div>

      <!-- CRONOLOGIA -->
      <div class="card center collapsed" id="histCard">
        <div class="row" style="justify-content:space-between">
          <div class="label" id="storiesLabel">▶ Cronologia</div>
          <button class="btn" id="clearHistoryBtn" type="button">🗑️ Svuota</button>
        </div>
        <div class="body"><div id="storyList" class="list"></div></div>
      </div>

      <footer id="footerNote">© What?f — FREE · crediti giornalieri attivi</footer>
    </div>
  </main>

<script>
(function(){
  /* ===== SAFE STORAGE ===== */
  const mem={}; let STORAGE_OK=true;
  const SafeStorage={
    getItem(k){ try{ return localStorage.getItem(k);}catch(e){STORAGE_OK=false; return (k in mem)?mem[k]:null;}},
    setItem(k,v){ try{ localStorage.setItem(k,v);}catch(e){STORAGE_OK=false; mem[k]=String(v);} },
    removeItem(k){ try{ localStorage.removeItem(k);}catch(e){STORAGE_OK=false; delete mem[k];} }
  };
  const LS=SafeStorage;
  const $=id=>document.getElementById(id);
  const SUPPORTED_LANGS=["it","en","es","fr","de"];
  function writeJSON(k,v){ try{ LS.setItem(k, JSON.stringify(v)); }catch{} }
  function readJSON(k,def){ try{ return JSON.parse(LS.getItem(k)||JSON.stringify(def)); }catch{ return def; } }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

  /* ===== STATE ===== */
  let lang=(LS.getItem('lang')||'it').toLowerCase(); if(!SUPPORTED_LANGS.includes(lang)) lang="it";
  document.documentElement.lang=lang;
  let prefs=readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false});

  /* ===== OPENERS ===== */
  const OPENERS={
    it:{start:"E se", sep:" ", end:"?"},
    en:{start:"What if", sep:" ", end:"?"},
    es:{start:"¿Y si", sep:" ", end:"?"},
    fr:{start:"Et si", sep:" ", end:" \u202F?"},
    de:{start:"Was, wenn", sep:" ", end:"?"}
  };
  const openerFor = L => OPENERS[L] || OPENERS.it;

  /* ===== UI TEXT ===== */
  const I18N={ it:{title:"Imposta la tua domanda", yourq:"E se…", gen:"✨ Genera risposta", clear:"Svuota",
      surprise:"Sorprendimi", saved:"▶ Domande salvate", stories:"▶ Cronologia",
      credits:"Crediti", free:"FREE", pro:"PRO",
      footer:"© What?f — FREE · crediti giornalieri attivi",
      boostTitle:"Boost personalizzazione", boostHint:"(opzionale)",
      boostSave:"💾 Salva Boost", boostClear:"Svuota",
      boostPH:"Scrivi qualcosa su di te o su cosa vuoi esplorare…",
      boostSaved:"Boost salvato.",
      mixExpl:"Per risposte migliori, aggiungi: orizzonte, obiettivo, vincoli.",
      warnNoQ:"Compila la domanda oppure premi “Sorprendimi”."
    },
    en:{title:"Set your question", yourq:"What if…", gen:"✨ Generate answer", clear:"Clear",
      surprise:"Surprise me", saved:"▶ Saved questions", stories:"▶ History",
      credits:"Credits", free:"FREE", pro:"PRO",
      footer:"© What?f — FREE · daily credits active",
      boostTitle:"Personalization boost", boostHint:"(optional)",
      boostSave:"💾 Save Boost", boostClear:"Clear",
      boostPH:"Write anything about you or what you want to explore…",
      boostSaved:"Boost saved.",
      mixExpl:"For better answers, add: timeframe, goal, constraints.",
      warnNoQ:"Type a question or hit “Surprise me”."
    }
  };

  /* ===== HINTS for slot ===== */
  const HINTS={
    it:["E se cambiassi lavoro?","E se cambiassi città?","E se aprissi partita IVA?","E se tornassi a studiare?","E se lavorassi 4 giorni su 5?","E se chiedessi un aumento?","E se mi prendessi un mese sabbatico?","E se riducessi i social per 30 giorni?","E se vivessi senza auto?","E se imparassi bene l’inglese?","E se ricominciassi palestra?","E se corressi 3 volte a settimana?","E se aprissi un micro e-commerce?","E se studiassi 1h al giorno?","E se investissi il 10% ogni mese?","E se andassi all’estero 6 mesi?","E se lasciassi un progetto che non ami?","E se cucinassi a casa 30 giorni?"],
    en:["What if you changed jobs?","What if you moved city?","What if you went freelance?","What if you went back to study?","What if you tried a 4-day week?","What if you asked for a raise?","What if you took a month off?","What if you cut social media for 30 days?","What if you lived without a car?","What if you mastered English?","What if you returned to the gym?","What if you ran three times a week?","What if you opened a tiny e-commerce?","What if you studied 1h daily?","What if you invested 10% monthly?","What if you lived abroad for 6 months?","What if you dropped a project you don’t love?","What if you cooked at home for 30 days?"]
  };

  /* ===== TEXT APPLY ===== */
  function applyTexts(){
    const L = I18N[lang]||I18N.it;
    document.title = (lang==='it' ? 'What?f — Domanda' : 'What?f — Question');
    $('titleH1').textContent=L.title;
    $('qLabel').textContent=L.yourq;
    $('goBtn').textContent=L.gen;
    $('clearBtn').textContent=L.clear;
    $('surpriseBtn').textContent='🎲 '+L.surprise;
    $('footerNote').textContent=L.footer;
    $('boostTitle').textContent=L.boostTitle; $('boostHint').textContent=L.boostHint;
    $('boostSaveBtn').textContent=L.boostSave; $('boostClearBtn').textContent=L.boostClear;
    $('boostInput').placeholder=L.boostPH;
    $('tipNote').textContent = L.mixExpl;
  }

  /* ===== NAV / RESET ===== */
  function safeReload(){ try{ location.reload(); }catch(e){} }
  $('homeBtn').onclick = safeReload;
  $('backBtn').onclick = ()=>{ try{ if(history.length>1) history.back(); }catch(e){} };
  $('resetBtn').onclick = ()=>{ try{ localStorage.clear(); }catch{}; safeReload(); };

  /* ===== LANG ===== */
  $('langSelect').value=lang;
  $('langSelect').onchange=()=>{ lang = $('langSelect').value; LS.setItem('lang',lang); document.documentElement.lang=lang; applyTexts(); };

  /* ===== BADGES (mantengo ma senza chip UI) ===== */
  function renderBadges(){
    const L=I18N[lang]||I18N.it;
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
    $('styleBadge').textContent='🎭 '+(prefs.stile==='wtf'?'What the F':'What if');
    $('periodoBadge').textContent='🕰️ '+(prefs.periodo==='past'?'Passato':'Futuro');
  }
  renderBadges();

  /* ===== BOOST ===== */
  function getBoost(){ try{ return (LS.getItem('whatif_boost')||'').trim(); }catch{ return '' } }
  function saveBoost(txt){
    LS.setItem('whatif_boost', String(txt||''));
    LS.setItem('whatif_boost_saved_date', todayISO());
    const L=I18N[lang]||I18N.it;
    const msg=$('boostSavedMsg'); if(msg){ msg.textContent=L.boostSaved; setTimeout(()=> msg.textContent='',1600); }
  }
  $('boostSaveBtn').onclick=()=>{ saveBoost(($('boostInput')||{}).value||''); };
  $('boostClearBtn').onclick=()=>{ const i=$('boostInput'); if(i) i.value=''; saveBoost(''); };

  /* ===== Normalizza domanda (opener lingua + '?') ===== */
  function enforceOpener(text){
    const op = openerFor(lang);
    let t = String(text||"").replace(/^["'«»„”]+|["'«»„”]+$/g,'').trim();
    t = t.replace(/^\s*(domanda|question|pregunta|frage)\s*[:\-–]\s*/i,'');
    t = t.split(/[\.\!\?]\s/)[0];
    const rx=new RegExp("^"+op.start.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
    if(!rx.test(t)){
      t = t.replace(/^(e se|what if|et si|¿\s*y si|was,\s*wenn)\b[\s,:-]*/i,'').trim();
      t = op.start + op.sep + t;
    }
    t = t.replace(/[?？]+$/,'').trim() + op.end;
    return t;
  }
  const polishQuestion = q => enforceOpener(q);

  /* ===== Smart nudge (no chip): analizza testo e propone dettagli con micro-link */
  const NU = $('smartNudge');
  function setNudge(segments){
    if(!segments || !segments.length){ NU.style.display='none'; NU.innerHTML=''; return; }
    const parts = segments.map(seg=>{
      if(typeof seg==='string') return `<span>${seg}</span>`;
      // {label, insert}
      return `<span class="lnk" data-insert="${seg.insert.replace(/"/g,'&quot;')}">${seg.label}</span>`;
    }).join(' ');
    NU.innerHTML = `Per essere più preciso: ${parts}`;
    NU.style.display='block';
  }
  function buildNudge(text){
    const t=(text||'').toLowerCase();
    const seg=[];
    const fewWords = (t.trim().split(/\s+/).filter(Boolean).length<6);

    // heuristica temi
    const isCity = /(roma|milano|napoli|torino|bologna|l'aquila|aquila|parigi|londra|berlino)/i.test(t);
    const hasWork = /(lavor|job|carriera|stipendio|aumento|assunzione|smart\s*working)/i.test(t);
    const hasLife = /(relazion|amici|famiglia|vita sociale|qualità della vita|benessere)/i.test(t);
    const hasBudget = /(budget|costo|affitto|spesa|soldi|stipendio|mutuo)/i.test(t);
    const hasTime = /(tempo|orari|6 mesi|12 mesi|1 anno|5 anni)/i.test(t);

    // suggerimenti base
    if(fewWords) seg.push("aggiungi", {label:"obiettivo", insert:", con quale obiettivo concreto"}, {label:"orizzonte", insert:", nel prossimo anno"}, {label:"vincoli", insert:", con budget limitato"});
    if(isCity) seg.push("su", {label:"quartiere/zona", insert:", valutando quartieri e servizi"}, {label:"trasporti", insert:", con mezzi/auto limitati"});
    if(hasWork) seg.push({label:"ruolo/settore", insert:", puntando a [ruolo]/[settore]"}, {label:"retribuzione", insert:", target retribuzione [€]"});
    if(hasLife) seg.push({label:"rete sociale", insert:", curando la rete sociale"}, {label:"attività", insert:", con attività settimanali concrete"});
    if(!hasTime) seg.push({label:"orizzonte (6–12 mesi)", insert:", nei prossimi 12 mesi"});
    if(!hasBudget) seg.push({label:"vincoli di budget", insert:", con budget massimo [€]"});

    // dedup e output
    const seen=new Set(); const out=[];
    for(const s of seg){
      const key = typeof s==='string' ? s : s.label;
      if(seen.has(key)) continue; seen.add(key); out.push(s);
      if(out.length>=6) break;
    }
    return out;
  }
  $('qInput').addEventListener('input', (e)=>{
    setNudge( buildNudge(e.target.value) );
  });
  NU.addEventListener('click', (e)=>{
    const a=e.target.closest('.lnk'); if(!a) return;
    const extra = a.getAttribute('data-insert')||'';
    const ta=$('qInput'); ta.value = (ta.value||'').trim() + extra;
    ta.dispatchEvent(new Event('input'));
    ta.focus();
  });

  /* ===== GO ===== */
  function goWithQuestion(q){
    const domanda = polishQuestion(q);
    if(!domanda) return;
    const req={domanda, micro:{boost:getBoost()||''}, ts:Date.now(), lang};
    LS.setItem('whatif_request', JSON.stringify(req));
    LS.setItem('domanda', domanda);
    location.href='fifth.html';
  }
  $('goBtn').onclick=()=>{
    const t=($('qInput').value||'').trim();
    if(!t){ const L=I18N[lang]||I18N.it; const w=$('qWarn'); w.textContent=L.warnNoQ; w.style.display='block'; return; }
    $('qWarn').style.display='none';
    goWithQuestion(t);
  };
  document.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ $('goBtn').click(); } });
  $('clearBtn').onclick=()=>{ $('qInput').value=''; $('qWarn').style.display='none'; setNudge(null); };

  /* ===== Sorprendimi: slot animata con spunti rapidi ===== */
  const slotOverlay=$('slotOverlay'); const slotReel=$('slotReel');
  function slotRun(list){
    if(!list || !list.length) return;
    slotOverlay.style.display='flex';
    let i=0; const start=Date.now();
    const tick=()=>{ slotReel.textContent = list[i%list.length]; i++; if(Date.now()-start<1100){ req = requestAnimationFrame(tick);} };
    let req=requestAnimationFrame(tick);
    setTimeout(()=>{
      cancelAnimationFrame(req);
      const final = list[Math.floor(Math.random()*list.length)];
      slotReel.textContent = final;
      setTimeout(()=>{
        slotOverlay.style.display='none';
        $('qInput').value = final;
        setNudge( buildNudge(final) );
        goWithQuestion(final);
      }, 350);
    }, 1200);
  }
  $('surpriseBtn').onclick=()=>{
    const list = (HINTS[lang]||HINTS.it);
    slotRun(list);
  };

  /* ===== Topbar auto-hide on scroll ===== */
  (function(){
    const tb=$('topbar');
    let lastY=window.scrollY, hidden=false;
    window.addEventListener('scroll', ()=>{
      const y=window.scrollY;
      if(y>lastY+6 && y>24 && !hidden){ tb.classList.add('is-hidden'); hidden=true; }
      else if(y<lastY-6 && hidden){ tb.classList.remove('is-hidden'); hidden=false; }
      lastY=y;
    }, {passive:true});
  })();

  /* ===== INIT ===== */
  applyTexts();
  document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
  $('langSelect').value=lang;
})();
</script>
</body>
</html>
