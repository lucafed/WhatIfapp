<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f – Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>

<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#EAF3EE; --muted:#9EB0B8;
  --acc:#1C57A0; --acc2:#FFEC01; --card:#141C22F0; --line:#FFFFFF20; --chip:#121A26; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }

*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.large{padding:14px 18px;font-size:16px}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee}
.badge.accent{background:linear-gradient(180deg,var(--acc),var(--acc2));border:none;color:#0A0E12;font-weight:800}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:8px 0 2px;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}

/* Tabs */
.tabs{display:flex;gap:8px}
.tab{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:14px;padding:8px 12px;cursor:pointer;user-select:none}
.tab.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800}

/* Input */
.input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:14px;font-size:17px;color:#EAF3EE;width:100%}

/* Story list */
.story{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.story:focus-visible{outline:2px solid var(--acc2)}
.story .meta{font-size:13px;color:var(--muted);margin-top:4px}
.story .title{font-weight:700;line-height:1.4}
.play{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;cursor:pointer}
.play:after{content:"▶";}

/* Click safety */
.play, .story{pointer-events:auto}
.story *{pointer-events:none}
.play{pointer-events:auto}

/* Followup */
.follow{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px}
.tip{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge">—</span>
      <span class="badge accent" id="clarifyBadge">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <div class="card">
    <div class="row">
      <div id="periodTabs" class="tabs">
        <div class="tab sel" data-per="future" id="tabFuture">🧠 Futuro</div>
      </div>
      <div id="styleTabs" class="tabs">
        <div class="tab" data-style="whatif" id="tabWhatIf">What if (realistico)</div>
        <div class="tab" data-style="wtf" id="tabWTF">What the F (divertente)</div>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3 class="label" id="qLabel">La tua domanda</h3>
      <textarea id="qInput" rows="3" class="input" placeholder="E se…"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn primary large" id="clarifyBtn">✨ Chiarisci & Genera</button>
        <button class="btn large" id="goAnswerBtn">Vai alla risposta</button>
      </div>
      <p class="tip" id="tip1" style="margin-top:8px">Tip: puoi cambiare stile in alto; colori e tono si adattano.</p>
    </div>
  </div>

  <div class="card">
    <h3 class="label" id="storiesLabel">Le tue storie</h3>
    <div id="stories"></div>

    <div class="follow" style="margin-top:10px">
      <div class="label" style="margin:0 0 6px" id="followLabel">Follow-up di oggi</div>
      <div id="followList" class="tip">—</div>
    </div>
  </div>
</main>

<script>
/* ===== I18N ===== */
const LS=localStorage;
const I18N={ it:{
  title:"Imposta la tua domanda",
  qLabel:"La tua domanda",
  btnClarify:"✨ Chiarisci & Genera",
  btnGo:"Vai alla risposta",
  tip1:"Tip: puoi cambiare stile in alto; colori e tono si adattano.",
  stories:"Le tue storie",
  follow:"Follow-up di oggi",
  badgeFree:(l,d)=>`Free oggi: ${l}/${d}`,
  badgeClarify:(l,d)=>`Chiarimenti: ${l}/${d}`,
  styleWhatIf:"What if (realistico)",
  styleWTF:"What the F (divertente)",
  future:"Futuro",
  playAlt:"Apri risposta"
}, en:{
  title:"Set your question",
  qLabel:"Your question",
  btnClarify:"✨ Clarify & Generate",
  btnGo:"Go to answer",
  tip1:"Tip: you can switch style above; color & tone adapt.",
  stories:"Your stories",
  follow:"Today's follow-up",
  badgeFree:(l,d)=>`Free today: ${l}/${d}`,
  badgeClarify:(l,d)=>`Clarify: ${l}/${d}`,
  styleWhatIf:"What if (realistic)",
  styleWTF:"What the F (fun)",
  future:"Future",
  playAlt:"Open answer"
}};
function getLang(){ return (LS.getItem('lang')||'it').toLowerCase(); }
function setLang(v){ LS.setItem('lang',v); location.reload(); }
let lang=getLang();
let T=I18N[lang]||I18N.it;

/* text */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.qLabel;
document.getElementById('clarifyBtn').textContent=T.btnClarify;
document.getElementById('goAnswerBtn').textContent=T.btnGo;
document.getElementById('tip1').textContent=T.tip1;
document.getElementById('storiesLabel').textContent=T.stories;
document.getElementById('followLabel').textContent=T.follow;
document.getElementById('tabWhatIf').textContent=T.styleWhatIf;
document.getElementById('tabWTF').textContent=T.styleWTF;
document.getElementById('tabFuture').textContent='🧠 '+T.future;
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.documentElement.lang=lang;

/* ===== Prefs / Theme ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;}}
function writeJSON(k,v){ LS.setItem(k,JSON.stringify(v)); }

const prefs = readJSON('whatif_prefs',{periodo:'future', stile:'whatif'});

function applyThemeByStyle(style){
  document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');
}

/* >>> INIT TABS STATE <<< */
function initTabsFromPrefs(){
  // stile
  document.querySelectorAll('#styleTabs .tab').forEach(el=>{
    el.classList.toggle('sel', el.dataset.style===prefs.stile);
  });
  // (se in futuro avremo altri periodi)
  document.querySelectorAll('#periodTabs .tab').forEach(el=>{
    el.classList.toggle('sel', el.dataset.per===(prefs.periodo||'future'));
  });
  applyThemeByStyle(prefs.stile);
}
initTabsFromPrefs();

/* Change style */
function setStyle(style){
  prefs.stile=style; writeJSON('whatif_prefs',prefs);
  applyThemeByStyle(style);
  document.querySelectorAll('#styleTabs .tab').forEach(el=>el.classList.toggle('sel', el.dataset.style===style));
}
document.getElementById('styleTabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  setStyle(t.dataset.style);
});

/* ===== Lang switch ===== */
document.getElementById('langBtn').addEventListener('click',()=> setLang(lang==='it'?'en':'it') );

/* ===== Credits & Clarify (con dev) ===== */
const DAILY_FREE=3, DAILY_CLAR=5, DEV_PIN='9468';
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function readCredits(){
  const key=todayKey(); const v=readJSON('whatif_credits',{date:key,used:0,pro:false});
  if(v.date!==key){ v.date=key; v.used=0; writeJSON('whatif_credits',v); }
  return v;
}
function writeCredits(v){ writeJSON('whatif_credits',v); renderBadges(); }
function readClarify(){
  const key=todayKey(); const v=readJSON('whatif_clarify',{date:key,used:0});
  if(v.date!==key){ v.date=key; v.used=0; writeJSON('whatif_clarify',v); }
  return v;
}
function writeClarify(v){ writeJSON('whatif_clarify',v); renderBadges(); }
function isDev(){ const v=readJSON('whatif_dev',null); return v && Date.now()<v.exp; }
function activateDev(){ writeJSON('whatif_dev',{exp:Date.now()+24*3600*1000}); alert('Dev mode ON (24h)'); }
function renderBadges(){
  const c=readCredits(); const max=c.pro?10:DAILY_FREE; const left=Math.max(0, max-(c.used||0));
  document.getElementById('freeBadge').textContent=T.badgeFree(left,max);
  const cl=readClarify(); const leftC=Math.max(0, DAILY_CLAR-(cl.used||0));
  document.getElementById('clarifyBadge').textContent=T.badgeClarify(leftC,DAILY_CLAR);
}
renderBadges();
/* dev gestures */
(function dev(){
  let tap=0,timer=null;
  document.getElementById('titleH1').addEventListener('click',()=>{
    tap++; clearTimeout(timer);
    timer=setTimeout(()=>{ if(tap>=7){ const pin=prompt('PIN dev?'); if(pin===DEV_PIN){ activateDev(); } } tap=0; },300);
  });
  function long(el,cb){ let h=null; el.addEventListener('pointerdown',()=>h=setTimeout(cb,1500)); ['pointerup','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(h))); }
  if(isDev()){
    long(document.getElementById('freeBadge'),()=>{ const c=readCredits(); c.used=0; writeCredits(c); alert('Free azzerati (local)'); });
    long(document.getElementById('clarifyBadge'),()=>{ const c=readClarify(); c.used=0; writeClarify(c); alert('Chiarimenti azzerati (local)'); });
    let clicks=0,t=null;
    document.getElementById('freeBadge').addEventListener('click',()=>{ clicks++; clearTimeout(t); t=setTimeout(()=>{ if(clicks>=3){ const c=readCredits(); c.pro=!c.pro; c.used=0; writeCredits(c); alert('Pro '+(c.pro?'ON':'OFF')+' (local)'); } clicks=0; },250); });
  }
})();

/* ===== Nav ===== */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';

/* ===== Buttons ===== */
document.getElementById('clarifyBtn').addEventListener('click',()=>{
  const q=(document.getElementById('qInput').value||'').trim();
  if(!q) return alert(lang==='en'?'Write a question first.':'Scrivi prima una domanda.');
  LS.setItem('domanda',q);
  const c=readClarify(); c.used=(c.used||0)+1; writeClarify(c);
  location.href='fifth.html';
});
document.getElementById('goAnswerBtn').addEventListener('click',()=>{
  const q=(document.getElementById('qInput').value||'').trim();
  if(!q) return alert(lang==='en'?'Write a question first.':'Scrivi prima una domanda.');
  LS.setItem('domanda',q);
  location.href='fifth.html';
});

/* ===== Stories list ===== */
function fmtDate(ts){
  try{ const d=new Date(ts); return d.toLocaleString(lang==='en'?'en-GB':'it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return '';}
}
function renderStories(){
  const wrap=document.getElementById('stories');
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ wrap.innerHTML=`<p class="tip">${lang==='en'?'No stories yet.':'Ancora nessuna storia.'}</p>`; return; }
  wrap.innerHTML='';
  arr.slice(0,20).forEach((it,i)=>{
    const div=document.createElement('div');
    div.className='story';
    div.setAttribute('role','button');
    div.setAttribute('tabindex','0');
    div.dataset.question=it.domanda||'';
    div.dataset.style=it.stile||'whatif';
    div.innerHTML=`
      <div class="info">
        <div class="title">${(it.domanda||'').replace(/</g,'&lt;')}</div>
        <div class="meta">${fmtDate(it.ts)} · ${(it.stile==='wtf'?'What the F':'What if')}</div>
      </div>
      <div class="play" aria-label="${T.playAlt}" title="${T.playAlt}"></div>
    `;
    function open(){
      const q=div.dataset.question||''; if(!q) return;
      LS.setItem('domanda',q);
      // applica lo stile salvato per la storia, aggiorna tab e tema
      setStyle(div.dataset.style==='wtf'?'wtf':'whatif');
      location.href='fifth.html';
    }
    div.addEventListener('click',open);
    div.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); }});
    div.querySelector('.play').addEventListener('click',(e)=>{ e.stopPropagation(); open(); });
    wrap.appendChild(div);
  });
}
renderStories();

/* ===== Follow-up ===== */
function renderFollow(){
  const dom=LS.getItem('domanda')||'';
  const list=document.getElementById('followList');
  if(!dom){ list.textContent='—'; return; }
  const hints=[
    lang==='en' ? `What would be the first sign it's working?`
                : `Qual è il primo segnale che ti direbbe che sta funzionando?`,
    lang==='en' ? `What can you test in 7 days with low risk?`
                : `Cosa puoi testare entro 7 giorni a basso rischio?`
  ];
  list.innerHTML=`• ${hints[0]}<br/>• ${hints[1]}`;
}
renderFollow();

/* ===== Preload last question in the box ===== */
(function preloadQ(){
  const last=LS.getItem('domanda')||''; if(last) document.getElementById('qInput').value=last;
})();
</script>
</body>
</html>
