<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – La tua domanda</title>
<meta name="theme-color" content="#0A0F14" />
<style>
  :root {
    --bg:#0A0F14; --card:#141C22; --fg:#FFFFFF; --muted:#A0B2BA;
    --acc:#00E0FF; --acc2:#00B5CC; --ink:#001F26;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  main{
    min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
  }
  h1{font-size:clamp(22px,5vw,32px); margin:0 0 14px}
  .sub{color:var(--muted); margin:0 0 18px; text-align:center; max-width:640px}
  .card{
    width:min(92vw,720px);
    background:var(--card); border-radius:16px; padding:18px;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
  }
  label{display:block; margin:6px 0 8px; font-weight:700}
  input[type="text"]{
    width:100%; background:#0E161D; color:var(--fg);
    border:1px solid #1C2A33; padding:14px; border-radius:12px; font-size:16px;
  }
  .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px}
  .btn{
    appearance:none; border:none; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);
  }
  .btn.ghost{
    background:#0f1820; color:#cfe3e7; border:1px solid #1d2b34;
  }
</style>
</head>
<body>
<main>
  <h1 id="mainTitle">Scrivi la tua domanda</h1>
  <p class="sub" id="subtitle">
    Esplora un “What if” personale: cosa sarebbe successo se… oppure cosa potrebbe succedere se…
  </p>

  <div class="card">
    <label for="domandaInput" id="questionLabel">La tua domanda</label>
    <input type="text" id="domandaInput" placeholder="E se fossi rimasto a vivere all’Aquila?" />
    <div class="actions">
      <button class="btn ghost" id="backBtn">← <span id="backTxt">Indietro</span></button>
      <button class="btn primary" id="nextBtn"><span id="nextTxt">Avanti</span> →</button>
    </div>
  </div>
</main>

<script>
  // i18n minimale (senza header): usa localStorage.lang
  const lang = (localStorage.getItem("lang") || (navigator.language?.startsWith("en") ? "en" : "it")).toLowerCase();
  const T = {
    it: {
      title: "Scrivi la tua domanda",
      sub: `Esplora un “What if” personale: cosa sarebbe successo se… oppure cosa potrebbe succedere se…`,
      label: "La tua domanda",
      ph: "E se fossi rimasto a vivere all’Aquila?",
      back: "Indietro",
      next: "Avanti",
      missing: "Inserisci una domanda prima di continuare."
    },
    en: {
      title: "Write your question",
      sub: `Explore a personal “What if”: what would have happened if… or what might happen if…`,
      label: "Your question",
      ph: "What if I had stayed to live in L’Aquila?",
      back: "Back",
      next: "Next",
      missing: "Please enter a question before continuing."
    }
  }[lang];

  document.documentElement.lang = lang;
  document.title = lang === "en" ? "What?f – Your question" : "What?f – La tua domanda";
  document.getElementById("mainTitle").textContent = T.title;
  document.getElementById("subtitle").textContent = T.sub;
  document.getElementById("questionLabel").textContent = T.label;
  document.getElementById("domandaInput").placeholder = T.ph;
  document.getElementById("backTxt").textContent = T.back;
  document.getElementById("nextTxt").textContent = T.next;

  // Azioni
  document.getElementById("backBtn").addEventListener("click", ()=> history.back());
  document.getElementById("nextBtn").addEventListener("click", salvaDomanda);

  function salvaDomanda() {
    const domanda = document.getElementById("domandaInput").value.trim();
    if (!domanda) {
      alert(T.missing);
      return;
    }
    // Salva domanda (periodo/stile sono già in localStorage.whatif_prefs da index.html)
    localStorage.setItem("domanda", domanda);
    // Vai al risultato
    window.location.href = "fifth.html";
  }

  // (opzionale) precompila se l’utente è tornato indietro
  (function prefill(){
    const prev = localStorage.getItem("domanda");
    if (prev) document.getElementById("domandaInput").value = prev;
  })();
</script>
</body>
</html>
