<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<style>
/* ===== PALETTE UFFICIALE ===== */
:root{
  --bg:#0A0F14;      /* background scuro */
  --surface:#141C22; /* card/surface */
  --fg:#FFFFFF;      /* testo principale */
  --muted:#A0B2BA;   /* testo secondario */
  --acc:#00E0FF;     /* primario */
  --acc2:#00B5CC;    /* primario var */
  --hi:#1AFFD5;      /* highlight */
  --line:rgba(255,255,255,.12);
  --chip:#0F1720;
  --ink:#0A0F14;
  --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:radial-gradient(900px 700px at 25% 20%, #0E1319 0%, var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:18px}

/* UI */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#EAF3EE;user-select:none;white-space:nowrap}
.card{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.compact{padding:12px;border-radius:14px}
h1{font-size:clamp(22px,4.8vw,30px);margin:12px 0;color:var(--acc);text-align:center;letter-spacing:.2px}
.center{max-width:720px;margin:0 auto}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:20px}
textarea::placeholder{color:#9DCFE0;opacity:.95;text-align:center}
.label{height:0;overflow:hidden;margin:0} /* niente testi sopra la textarea */

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

/* Collapsibles */
.toggle{cursor:pointer;user-select:none}
.collapsed>.body{display:none}
.small{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}

/* Overlay micro (una volta al giorno) */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.overlay.show{display:flex}
.overlay::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(2px)}
.modal{position:relative;width:min(860px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 36px var(--shadow);padding:18px;z-index:1}
.modal h2{margin:0 0 6px;font-size:18px;color:var(--hi);text-align:center}
.qblock{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:rgba(255,255,255,.04)}
.qtitle{display:flex;align-items:center;gap:8px;font-weight:800;color:#E7F2EE;margin-bottom:8px}
.optset{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--chip);border:1px solid var(--line);color:#EAF3EE;border-radius:999px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}

/* Nessun cambio palette in tema WTF (resta brand) */
html[data-theme="wtf"] :root{}
</style>
</head>
<body>
<main>
  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="freeBadge">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1>What?f</h1>

  <!-- Style + Period -->
  <div class="card center compact" id="styleCard">
    <div class="chips" id="styleChips">
      <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
      <button class="chip" data-style="wtf" id="chipWTF">What the F</button>
    </div>
    <div id="whatifSubMode" class="chips" style="margin-top:8px">
      <button class="chip" data-mode="analitico" id="chipAnalitico">Analitico</button>
      <button class="chip" data-mode="reale" id="chipReale">Poetico</button>
    </div>
    <div class="chips" id="periodChips" style="margin-top:8px">
      <button class="chip" data-period="future" id="chipFuture">Futuro</button>
      <button class="chip" data-period="past" id="chipPast">Passato</button>
    </div>
  </div>

  <!-- Domanda -->
  <div class="card center" id="qCard" style="padding:18px">
    <div class="label" aria-hidden="true"></div>
    <textarea id="qInput" rows="3" class="input" placeholder="E se…?" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px;justify-content:center;gap:10px">
      <button class="btn primary" id="goBtn" title="Ctrl/⌘+Invio">✨</button>
      <button class="btn ghost" id="clearBtn">✖</button>
    </div>
  </div>

  <!-- Spunti -->
  <div class="card center compact collapsed" id="hintsCard">
    <div class="row toggle" id="hintsHeader" style="justify-content:space-between">
      <div class="small" id="hintsTitle">▶ Spunti</div>
    </div>
    <div class="body" id="hintsBody" style="margin-top:6px">
      <div class="chips" id="hintsChips"></div>
    </div>
  </div>

  <!-- Salvate -->
  <div class="card center compact collapsed" id="savedCard">
    <div class="row toggle" id="savedHeader" style="justify-content:space-between">
      <div class="small" id="nextLabel">▶ Salvate</div>
      <button class="btn ghost" id="clearSavedBtn">🗑️</button>
    </div>
    <div class="body" id="savedBody">
      <div id="nextList" class="list"></div>
    </div>
  </div>

  <!-- Cronologia -->
  <div class="card center compact collapsed" id="histCard">
    <div class="row toggle" id="histHeader" style="justify-content:space-between">
      <div class="small" id="storiesLabel">▶ Cronologia</div>
      <button class="btn ghost" id="clearHistoryBtn">🗑️</button>
    </div>
    <div class="body">
      <div id="storyList" class="list"></div>
    </div>
  </div>
</main>

<!-- Overlay Micro (prima volta del giorno) -->
<div class="overlay" id="microOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="microTitle">Micro-domande di oggi</h2>
    <div id="qMood" class="qblock">
      <div class="qtitle"><span id="moodIcon">🙂</span><span id="moodTitle">Oggi come ti senti?</span></div>
      <div class="optset" id="moodOpts"></div>
    </div>
    <div id="qAnchor" class="qblock">
      <div class="qtitle"><span id="anchorIcon">🧭</span><span id="anchorTitle">Cosa ti tiene qui ultimamente?</span></div>
      <div class="optset" id="anchorOpts"></div>
    </div>
    <div id="qDecide" class="qblock">
      <div class="qtitle"><span id="decideIcon">⚙️</span><span id="decideTitle">Come decidi di solito?</span></div>
      <div class="optset" id="decideOpts"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:8px">
      <button class="btn ghost" id="microDismissBtn">Chiudi</button>
      <button class="btn primary" id="saveMicroBtn">Salva per oggi</button>
    </div>
  </div>
</div>

<script>
/* ===== Lang & storage ===== */
const LS = localStorage;
const lang = (LS.getItem('lang')||'it').toLowerCase();
document.documentElement.lang = lang;

function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ===== Prefs ===== */
let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',pro:false,mode:'analitico'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
const qEl = document.getElementById('qInput');
qEl.placeholder = (lang==='en' ? "What if…?" : "E se…?");
qEl.autofocus = true;

/* ===== Badges & chips ===== */
function renderBadges(){
  document.getElementById('periodoBadge').textContent = "🕰️ " + (prefs.periodo==='past' ? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
  document.getElementById('styleBadge').textContent = "🎭 " + (prefs.stile==='wtf' ? 'What the F' : 'What if');
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===prefs.stile));
  document.getElementById('whatifSubMode').style.display = (prefs.stile==='whatif') ? 'flex' : 'none';
  document.getElementById('chipAnalitico').classList.toggle('sel', prefs.mode==='analitico');
  document.getElementById('chipReale').classList.toggle('sel', prefs.mode!=='analitico');
  document.getElementById('chipFuture').classList.toggle('sel', prefs.periodo!=='past');
  document.getElementById('chipPast').classList.toggle('sel', prefs.periodo==='past');
}
renderBadges();

/* ===== Credits badge ===== */
function userIsAdmin(){ return !!LS.getItem('admin_token'); }
function capForUser(){ return userIsAdmin() ? Infinity : (prefs.pro ? 10 : 3); }
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  if(c.date!==todayISO()){ c.date=todayISO(); c.used=0; }
  writeJSON('whatif_credits',c);
}
function leftCredits(){
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  const cap=capForUser(); return cap===Infinity ? "∞" : Math.max(0, cap-(c.used||0));
}
function renderCreditsBadge(){
  const fb=document.getElementById('freeBadge');
  const cap=capForUser(); const left=leftCredits();
  fb.textContent = (cap===Infinity) ? (lang==='en'?'Credits: ∞':'Crediti: ∞') : (lang==='en'?`Credits: ${left}/${cap}`:`Crediti: ${left}/${cap}`);
}
ensureCredits(); renderCreditsBadge();

/* ===== Nav + switches ===== */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };
document.getElementById('periodoBadge').onclick=()=>{ prefs.periodo = (prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); renderBadges(); };
document.getElementById('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.stile=b.dataset.style; if(prefs.stile==='whatif' && !prefs.mode) prefs.mode='analitico';
  writeJSON('whatif_prefs',prefs); document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif'); renderBadges();
});
document.getElementById('whatifSubMode').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return; prefs.mode=b.dataset.mode; writeJSON('whatif_prefs',prefs); renderBadges();
});
document.getElementById('periodChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return; prefs.periodo=b.dataset.period; writeJSON('whatif_prefs',prefs); renderBadges();
});

/* ===== Submit ===== */
function trySubmit(){
  const domanda=(qEl.value||"").trim(); if(!domanda){ qEl.focus(); return; }
  const c=readJSON('whatif_credits',{date:todayISO(),used:0});
  if(!userIsAdmin()){
    const cap=capForUser(); if((c.used||0)>=cap){ alert(lang==='en'?'You’ve used today’s credits.':'Hai finito i crediti di oggi.'); return; }
    c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderCreditsBadge();
  }
  const micro = readJSON('micro_profile', {});
  writeJSON('whatif_prefs', prefs); LS.setItem('domanda',domanda);
  writeJSON('whatif_request',{ domanda, stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'analitico'):undefined), lang, extra:"", micro, fantasy_mode:false, periodo:prefs.periodo });
  location.href='fifth.html';
}
document.getElementById('goBtn').onclick=trySubmit;
document.getElementById('clearBtn').onclick=()=>{ qEl.value=""; qEl.focus(); };
qEl.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); trySubmit(); }});

/* ===== Hints ===== */
const HINT_IT=[ "E se cambiassi lavoro?","E se cambiassi città?","E se tornassi a studiare?","E se aprissi qualcosa di tuo?","E se chiedessi un aumento?","E se partissi da solo/a?" ];
const HINT_EN=[ "What if I changed jobs?","What if I moved city?","What if I went back to study?","What if I started my own thing?","What if I asked for a raise?","What if I traveled solo?" ];
const hintsCard=document.getElementById('hintsCard'); const hintsHeader=document.getElementById('hintsHeader'); const hintsChips=document.getElementById('hintsChips');
hintsHeader.onclick=()=>{ hintsCard.classList.toggle('collapsed'); };
((lang==='en'?HINT_EN:HINT_IT)).slice(0,4).forEach(h=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=h; b.onclick=()=>{ qEl.value=h; window.scrollTo({top:0,behavior:'smooth'}); }; hintsChips.appendChild(b); });

/* ===== Saved & History ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
document.getElementById('savedHeader').onclick=()=>{ document.getElementById('savedCard').classList.toggle('collapsed'); };
document.getElementById('histHeader').onclick =()=>{ document.getElementById('histCard').classList.toggle('collapsed'); };

function renderNext(){
  const box=document.getElementById('nextList'); box.innerHTML='';
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=(lang==='en'?'— No saved questions.':'— Nessuna domanda salvata.'); box.appendChild(p); return; }
  arr.slice(0,12).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.q||'—'}</div><div class="small">${fmtDate(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=(lang==='en'?'Use':'Usa');
    useBtn.onclick=()=>{ qEl.value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); writeJSON('whatif_request',{ domanda:item.q||"", stile:prefs.stile, mode:(prefs.stile==='whatif'?(prefs.mode||'analitico'):undefined), lang, extra:"", micro:readJSON('micro_profile',{}), fantasy_mode:false, periodo:prefs.periodo }); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
function renderStories(){
  const box=document.getElementById('storyList'); box.innerHTML='';
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=(lang==='en'?'— No history.':'— Nessuna storia.'); box.appendChild(p); return; }
  arr.slice(-12).reverse().forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML=`<div style="font-weight:700;max-width:520px">${item.domanda||'—'}</div><div class="small">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶';
    play.onclick=()=>{ writeJSON('replay_story', { domanda:item.domanda, answer:item.risposta||item.answer||"", stile:item.stile||'whatif' }); location.href='fifth.html?view=replay'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}
renderNext(); renderStories();
document.getElementById('clearSavedBtn').onclick=()=>{ LS.removeItem('next_prompts'); renderNext(); };
document.getElementById('clearHistoryBtn').onclick=()=>{ LS.removeItem('cronologia'); renderStories(); };

/* ===== Micro overlay (prima volta al giorno, non blocca) ===== */
const microOverlay = document.getElementById('microOverlay');
const microSeen = readJSON('micro_seen',{date:""});
const showMicro = microSeen.date !== todayISO();
if(showMicro){ microOverlay.classList.add('show'); }
window.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ microOverlay.classList.remove('show'); writeJSON('micro_seen',{date:todayISO()}); }});

function rng(seed){ let s=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0); return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function pickN(pool,n,random){ const seen=new Set(), out=[]; while(out.length<n && seen.size<pool.length){ const i=Math.floor(random()*pool.length); if(seen.has(i)) continue; seen.add(i); out.push(pool[i]); } return out; }
function renderOptions(containerId, options, key){
  const wrap=document.getElementById(containerId); wrap.innerHTML='';
  const saved=readJSON('micro_profile',{});
  options.forEach(text=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=text;
    if(saved[key]===text) b.classList.add('sel');
    b.onclick=()=>{
      wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      const cur=readJSON('micro_profile',{}); cur[key]=text; writeJSON('micro_profile',cur);
    };
    wrap.appendChild(b);
  });
}
(function renderMicro(){
  const r=rng(todayISO()+"-micro");
  const moodPool=(lang==='en'
    ? ["Calm airplane mode","Charged socket","Foggy but fine","Restless astronaut","Light & chatty","Solid & quiet","A bit chaotic, funny"]
    : ["Calmo in modalità aereo","Carico come una presa","Appannato ma ok","Astronauta irrequieto","Leggero e chiacchierone","Solido e in silenzio","Un po’ caotico ma divertito"]);
  const anchorPool=(lang==='en'
    ? ["People I love","Money & bills","A routine that works","A promise to myself","Fear of changing","Curiosity about here"]
    : ["Le persone che amo","Soldi & bollette","Una routine che funziona","Una promessa a me stesso/a","Paura di cambiare","Curiosità per ciò che c’è"]);
  const decidePool=(lang==='en'
    ? ["Gut first","Lists pros/cons","Ask a friend","Deadline decides","Flip a coin","Coffee + walk"]
    : ["Pancia prima","Liste pro/contro","Chiedo a un amico","Decide la scadenza","Tiro la moneta","Caffè + passeggiata"]);
  document.getElementById('moodIcon').textContent   = ["🙂","😌","⚡","🌤️","🤘","🧊","🧩"][Math.floor(r()*7)];
  document.getElementById('anchorIcon').textContent = ["🧭","⚓","🏠","🧱","🪴","📌"][Math.floor(r()*6)];
  document.getElementById('decideIcon').textContent = ["⚙️","🧠","🎯","🪙","📋","⏳","☕"][Math.floor(r()*7)];
  renderOptions('moodOpts',   pickN(moodPool,   5, r), 'mood');
  renderOptions('anchorOpts', pickN(anchorPool, 5, r), 'anchor');
  renderOptions('decideOpts', pickN(decidePool, 5, r), 'decide');
})();
document.getElementById('saveMicroBtn').onclick=()=>{ writeJSON('micro_seen',{date:todayISO()}); const cur=readJSON('micro_profile',{}); writeJSON('micro_profile',cur); microOverlay.classList.remove('show'); };
document.getElementById('microDismissBtn').onclick=()=>{ writeJSON('micro_seen',{date:todayISO()}); microOverlay.classList.remove('show'); };
</script>
</body>
</html>
