<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>What?f – Risultato</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="page fourth">
  <div class="container">
    <h1>✨ Il tuo What?f ✨</h1>
    <div id="modeBadge" class="badge">Modalità: –</div>

    <!-- follow-up dinamici -->
    <div id="followUp" class="followup-section" hidden>
      <h3 style="margin-top:0">Per capirti meglio</h3>
      <form id="fuForm"></form>
      <div class="actions">
        <button id="sendFu">Invia risposte</button>
      </div>
    </div>

    <!-- risposta finale -->
    <div id="aiResponse" class="response-box" style="margin-top:14px">
      Sto preparando la tua risposta…
    </div>

    <!-- reazioni -->
    <div class="reactions">
      <button id="likeBtn">👍 <span class="count" id="likeCount">0</span></button>
      <button id="dislikeBtn">👎 <span class="count" id="dislikeCount">0</span></button>
    </div>

    <!-- azioni -->
    <div class="actions">
      <button onclick="history.back()">🔙 Torna indietro</button>
      <button onclick="location.href='index.html'">🏠 Home</button>
      <button id="shareBtn">📤 Condividi</button>
    </div>
  </div>

  <script>
  const ASK_URL = '/.netlify/functions/ask';
  const input = JSON.parse(sessionStorage.getItem('whatf_input_v2')||'null');
  const modeBadge = document.getElementById('modeBadge');
  const fuBox = document.getElementById('followUp');
  const fuForm = document.getElementById('fuForm');
  const aiBox = document.getElementById('aiResponse');
  const sendFuBtn = document.getElementById('sendFu');
  const likeBtn = document.getElementById('likeBtn');
  const dislikeBtn = document.getElementById('dislikeBtn');
  const likeCount = document.getElementById('likeCount');
  const dislikeCount = document.getElementById('dislikeCount');

  const esc = s => (s||'').replace(/[&<>"]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));
  function showError(where, msg){ aiBox.innerHTML = `<b>Errore AI (${where}):</b><br><code style="white-space:pre-wrap">${esc(msg)}</code>`; }

  if(!input){ aiBox.textContent = 'Sessione vuota. Torna indietro.'; }
  else {
    modeBadge.textContent = 'Modalità: ' + (input.mode==='wtf' ? 'What the F?!' : 'Sliding Doors');
    getFollowups();
  }

  // 1) Follow-up
  async function getFollowups(){
    aiBox.textContent = 'Sto preparando le domande di chiarimento…';
    try{
      const res = await fetch(ASK_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ step:'followups', input })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || res.statusText);
      renderFollowups(data.followups || []);
    }catch(err){ showError('followups', err.message); }
  }

  function renderFollowups(list){
    if(!list.length){
      aiBox.textContent = 'Nessuna domanda aggiuntiva. Genero la risposta…';
      return getFinal({});
    }
    fuForm.innerHTML = '';
    list.slice(0,3).forEach((q,i)=>{
      const id = 'fu'+i;
      fuForm.insertAdjacentHTML('beforeend', `
        <label for="${id}">${esc(q)}</label>
        <input id="${id}" placeholder="Rispondi brevemente"/>
      `);
    });
    fuBox.hidden = false;
    aiBox.textContent = 'Rispondi rapidamente (3 domande).';
  }

  // 2) final
  sendFuBtn.addEventListener('click', ()=>{
    const answers = [];
    fuForm.querySelectorAll('input').forEach((el,i)=> answers.push({ qIndex:i, a: el.value.trim() }));
    getFinal({ answers });
  });

  async function getFinal(extra){
    fuBox.hidden = true;
    aiBox.textContent = 'Sto preparando la tua risposta…';
    try{
      const res = await fetch(ASK_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ step:'final', input, extra })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || res.statusText);

      const score = data.score!=null ? Math.round(data.score*100) : null;
      aiBox.innerHTML =
        `<div style="font-size:18px;margin-bottom:8px">${esc(data.answer||'Nessuna risposta.')}</div>` +
        (score!=null ? `<div class="badge">Confidenza ${score}%</div>` : '');

      // storico + init likes per questa risposta (chiave = hash semplice)
      const key = getAnswerKey(data.answer);
      initReactions(key);
      try{
        const k='whatf_history_v2';
        const arr = JSON.parse(localStorage.getItem(k)||'[]');
        arr.unshift({ ts:Date.now(), input, answer:data.answer, score:data.score, key });
        localStorage.setItem(k, JSON.stringify(arr.slice(0,50)));
      }catch(_){}
    }catch(err){ showError('final', err.message); }
  }

  // --- Like/Dislike locali ---
  function getAnswerKey(txt){ return 'ans_'+btoa(unescape(encodeURIComponent((txt||'').slice(0,120)))); }
  function initReactions(key){
    likeBtn.dataset.key = key; dislikeBtn.dataset.key = key;
    const k = 'whatf_react_'+key;
    const s = JSON.parse(localStorage.getItem(k)||'{"like":0,"dislike":0}');
    likeCount.textContent = s.like; dislikeCount.textContent = s.dislike;
  }
  function updateReaction(key, type){
    const k = 'whatf_react_'+key;
    const s = JSON.parse(localStorage.getItem(k)||'{"like":0,"dislike":0}');
    s[type] = (s[type]||0)+1;
    localStorage.setItem(k, JSON.stringify(s));
    likeCount.textContent = s.like; dislikeCount.textContent = s.dislike;
  }
  likeBtn.addEventListener('click', ()=>{ const key=likeBtn.dataset.key; if(key) updateReaction(key,'like'); });
  dislikeBtn.addEventListener('click', ()=>{ const key=dislikeBtn.dataset.key; if(key) updateReaction(key,'dislike'); });

  // --- Condivisione ---
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    const txt = aiBox.innerText.trim();
    const text = `Il mio What?f (${input.mode==='wtf'?'What the F?!':'Sliding Doors'}):\n\n${txt}\n\n#whatf`;
    const url = location.href;
    if (navigator.share){ try{ await navigator.share({ title:'What?f', text, url }); return; }catch(_){ } }
    const encodedText = encodeURIComponent(text);
    const encodedUrl = encodeURIComponent(url);
    const links = [
      [`https://wa.me/?text=${encodedText}`, 'WhatsApp'],
      [`https://t.me/share/url?url=${encodedUrl}&text=${encodedText}`, 'Telegram'],
      [`https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedUrl}`, 'X/Twitter'],
      [`https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`, 'Facebook'],
      [`mailto:?subject=Il mio What?f&body=${encodedText}`, 'Email']
    ];
    let html = '<div class="card"><b>Condividi:</b><br>';
    links.forEach(([href,label])=>{ html += `<a href="${href}" target="_blank" style="margin-right:10px">${label}</a>`; });
    html += '</div>';
    aiBox.insertAdjacentHTML('beforeend', html);
    try{ await navigator.clipboard.writeText(text+'\n'+url); alert('Testo copiato!'); }catch(_){}
  });
  </script>
</body>
</html>
