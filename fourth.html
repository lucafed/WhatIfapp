<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; /* whatif */
  --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
  --play:#FFE98A;
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:
radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
  padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
.sectionTitle{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04);margin-bottom:10px}
.meta{font-size:12px;color:var(--muted)}
.play{border:none;background:var(--play);color:#000;width:46px;height:46px;border-radius:12px;cursor:pointer;font-size:18px;font-weight:900}
.tip{font-size:12px;color:var(--muted);margin-top:8px}
.collapsible>button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:10px 0;cursor:pointer;color:var(--fg)}
.chev{transition:transform .2s ease}
.collapsible[data-open="false"] .content{display:none}
.collapsible[data-open="false"] .chev{transform:rotate(-90deg)}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="hTitle">Imposta la tua domanda</h1>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="chips" id="styleChips">
        <button class="chip sel" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
      <span class="badge" id="periodBadge">🕰️ Futuro</span>
    </div>
  </div>

  <div class="card">
    <h3 class="sectionTitle" id="lblQuestion">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <div style="margin-top:12px">
      <div class="row" style="justify-content:space-between">
        <div class="sectionTitle" style="margin:0" id="lblDetail">Aggiungi un dettaglio (opzionale)</div>
        <span class="meta" id="hintDetail">aiuta la risposta di oggi</span>
      </div>
      <input id="extraInput" class="input" placeholder="es. primo segnale di successo, budget, luogo preciso…" />
      <div class="chips" id="extraChips" style="margin-top:8px"></div>
      <p class="tip" id="tipNote">Tip: puoi cambiare stile sopra; colori e tono si adattano.</p>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="genBtn">✨ Genera risposta</button>
      <button class="btn" id="clearBtn">Pulisci</button>
    </div>
  </div>

  <div class="card collapsible" id="savedBox" data-open="true">
    <button id="toggleSaved">
      <h3 class="sectionTitle" id="lblSaved">Domande salvate per domani</h3>
      <span class="chev">▾</span>
    </button>
    <div class="content" id="savedList"></div>
  </div>

  <div class="card collapsible" id="storiesBox" data-open="true">
    <button id="toggleStories">
      <h3 class="sectionTitle" id="lblStories">Storie recenti</h3>
      <span class="chev">▾</span>
    </button>
    <div class="content" id="storyList"></div>
  </div>
</main>

<script>
/* ===== i18n ===== */
const I18N = {
  it: {
    title:"Imposta la tua domanda",
    whatif:"What if (realistico)",
    wtf:"What the F (divertente)",
    future:"Futuro",
    yourq:"La tua domanda",
    addDetail:"Aggiungi un dettaglio (opzionale)",
    hint:"aiuta la risposta di oggi",
    tip:"Tip: puoi cambiare stile sopra; colori e tono si adattano.",
    gen:"✨ Genera risposta",
    clear:"Pulisci",
    saved:"Domande salvate per domani",
    stories:"Storie recenti",
    noneStories:"Ancora nessuna storia.",
    noneSaved:"Nessuna domanda salvata.",
    chip1:"primo segnale",
    chip2:"vincolo 2 settimane",
    chip3:"luogo preciso",
    chip4:"tempo disponibile",
    use:"Usa",
    replayTitle:"Apri risposta precedente"
  },
  en: {
    title:"Set your question",
    whatif:"What if (realistic)",
    wtf:"What the F (fun)",
    future:"Future",
    yourq:"Your question",
    addDetail:"Add a detail (optional)",
    hint:"helps today's answer",
    tip:"Tip: switch style above; tone & colors adapt.",
    gen:"✨ Generate answer",
    clear:"Clear",
    saved:"Saved for tomorrow",
    stories:"Recent stories",
    noneStories:"No stories yet.",
    noneSaved:"Nothing saved yet.",
    chip1:"first signal",
    chip2:"2-week constraint",
    chip3:"specific place",
    chip4:"time window",
    use:"Use",
    replayTitle:"Open previous answer"
  }
};
const LS = localStorage;
let lang = (LS.getItem("lang")||"it").toLowerCase();
const T = I18N[lang] || I18N.it;
document.documentElement.lang = lang;

/* ===== prefs / theme ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const prefs = readJSON('whatif_prefs',{stile:'whatif'});
let currentStyle = prefs.stile || 'whatif';
document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');

/* ===== UI text ===== */
const $ = (id)=>document.getElementById(id);
$('hTitle').textContent=T.title;
$('chipWhatIf').textContent=T.whatif;
$('chipWTF').textContent=T.wtf;
$('periodBadge').textContent='🕰️ '+T.future;
$('lblQuestion').textContent=T.yourq;
$('lblDetail').textContent=T.addDetail;
$('hintDetail').textContent=T.hint;
$('tipNote').textContent=T.tip;
$('genBtn').textContent=T.gen;
$('clearBtn').textContent=T.clear;
$('lblSaved').textContent=T.saved;
$('lblStories').textContent=T.stories;
$('langBtn').textContent=lang.toUpperCase();

/* ===== nav ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ const nxt=lang==='it'?'en':'it'; LS.setItem('lang',nxt); location.reload(); };

/* ===== style chips ===== */
document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===currentStyle));
$('styleChips').addEventListener('click',(e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle=b.dataset.style;
  prefs.stile=currentStyle; writeJSON('whatif_prefs',prefs);
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c===b));
});

/* ===== chips extra ===== */
const chipWrap=$('extraChips');
[T.chip1,T.chip2,T.chip3,T.chip4].forEach(txt=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
  b.onclick=()=>{ const i=$('extraInput'); i.value = i.value ? (i.value+' • '+txt) : txt; i.focus(); };
  chipWrap.appendChild(b);
});

/* ===== util ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }

/* ===== saved for tomorrow (collassabile) ===== */
$('toggleSaved').onclick=()=>{ const w=$('savedBox'); w.dataset.open = w.dataset.open!=='false' ? 'false' : 'true'; };
function renderSaved(){
  const arr = readJSON('saved_for_tomorrow',[]);
  const box = $('savedList'); box.innerHTML='';
  if(!arr.length){ box.innerHTML=`<div class="tip">${T.noneSaved}</div>`; return; }
  arr.slice().reverse().forEach(item=>{
    const div=document.createElement('div'); div.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700">${item.q||'—'}</div>
                      <div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const use=document.createElement('button'); use.className='btn'; use.textContent=T.use;
    use.onclick=()=>{
      $('qInput').value=item.q||'';
      prefs.stile=item.stile||'whatif'; writeJSON('whatif_prefs',prefs);
      currentStyle=prefs.stile;
      document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===currentStyle));
    };
    div.appendChild(left); div.appendChild(use); box.appendChild(div);
  });
}

/* ===== stories (collassabile + replay) ===== */
$('toggleStories').onclick=()=>{ const w=$('storiesBox'); w.dataset.open = w.dataset.open!=='false' ? 'false' : 'true'; };

function renderStories(){
  const arr = readJSON('cronologia',[]);
  const box = $('storyList'); box.innerHTML='';
  if(!arr.length){ box.innerHTML=`<div class="tip">${T.noneStories}</div>`; return; }

  const seen = new Set();
  arr.slice(-50).reverse().forEach(item=>{
    const key = (item.domanda||'')+'|'+(item.answer||'').slice(0,80)+'|'+(item.stile||'');
    if(seen.has(key)) return; seen.add(key);

    const div=document.createElement('div'); div.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700">${item.domanda||'—'}</div>
                      <div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'What the F':'What if')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent='▶'; play.title=T.replayTitle;
    play.onclick=()=>{
      LS.setItem('replay_story', JSON.stringify(item));
      location.href='fifth.html?view=replay';
    };
    div.appendChild(left); div.appendChild(play); box.appendChild(div);
  });
}

/* ===== actions ===== */
$('genBtn').onclick=()=>{
  const domanda=$('qInput').value.trim(); if(!domanda){ $('qInput').focus(); return; }
  writeJSON('whatif_request',{ domanda, stile: currentStyle, lang, extra: $('extraInput').value.trim() });
  location.href='fifth.html';
};
$('clearBtn').onclick=()=>{ $('qInput').value=''; $('extraInput').value=''; };

/* ===== init ===== */
renderSaved();
renderStories();
</script>
</body>
</html>
