<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Your question</title>

  <!-- PWA (coerente con gli altri file) -->
  <meta name="theme-color" content="#0B0B0C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    /* ===== THEME SYSTEM (uguale a INDEX/SECOND) ===== */
    :root{
      --bg:#0C0F14; --bg2:#0E1724;
      --fg:#ffffff; --muted:#A0B2BA;
      --card:rgba(14,19,28,.55); --card-border:rgba(255,255,255,.10);
      --chip:#141C22;
      --accent:#1C57A0; --accent2:#FFEC01;
      --ink:#0A0E12;
      --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.12);
      --chip:#121A26; --ink:#11110A;
      --accent:#1C57A0; --accent2:#FFEC01;
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.10);
      --chip:#0F1714; --ink:#06110B;
      --accent:#3A6B56; --accent2:#5A8C75;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%; margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    @media (prefers-reduced-motion:no-preference){
      body{animation:bgShift 18s ease-in-out infinite alternate}
      @keyframes bgShift{0%{background-position:0% 30%}100%{background-position:100% 70%}}
    }

    .topbar{
      position:sticky; top:0; z-index:2;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:8px 10px; background:linear-gradient(180deg,rgba(10,15,20,.95),rgba(10,15,20,0));
    }
    .btn{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:var(--fg);
      border-radius:12px; padding:8px 12px; font-weight:800; cursor:pointer;
    }
    .btn.round{border-radius:999px}
    .btn.primary{
      border:none; background:linear-gradient(180deg,var(--accent),var(--accent2)); color:var(--ink);
      box-shadow:0 10px 28px var(--shadow);
    }
    .btn.ghost{background:rgba(255,255,255,.05)}

    main{min-height:100%; display:flex; flex-direction:column; align-items:center; padding:16px}
    .wrap{width:min(96vw,880px)}

    h1{margin:6px 0 10px; font-size:clamp(24px,5.8vw,36px)}
    .lead{color:var(--muted); margin:0 0 12px; font-size:clamp(14px,4vw,18px)}

    .card{
      background:var(--card); backdrop-filter:blur(10px);
      border:1px solid var(--card-border); border-radius:16px;
      padding:16px; box-shadow:0 10px 28px var(--shadow);
    }

    .group{display:flex; flex-wrap:wrap; gap:10px}
    .chip{
      appearance:none; border:1px solid var(--card-border); background:var(--chip); color:#e8f2ec;
      padding:12px 16px; border-radius:16px; font-weight:800; cursor:pointer;
      transition:transform .08s ease, background .16s ease, box-shadow .16s ease, color .16s ease;
    }
    .chip:active{transform:translateY(1px)}
    .chip.selected{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink); box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
    }

    textarea{
      width:100%; background:var(--chip); color:var(--fg);
      border:1px solid var(--card-border); border-radius:14px;
      padding:14px; font-size:16px; min-height:120px; resize:vertical;
    }

    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:12px}

    .out{
      margin-top:12px; display:none;
      background:#0f1516; border:1px solid var(--card-border); border-radius:14px; padding:14px;
      line-height:1.55; font-size:17px; white-space:pre-wrap;
    }
    .muted{color:var(--muted); font-size:12px}
  </style>
</head>
<body>
  <!-- Theme from prefs -->
  <script>
    (function(){
      try{
        const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
        document.documentElement.setAttribute('data-theme', (prefs.stile==='wtf')?'wtf':'whatif');
        if(!localStorage.getItem('lang')) localStorage.setItem('lang','it');
      }catch(e){
        document.documentElement.setAttribute('data-theme','whatif');
        localStorage.setItem('lang','it');
      }
    })();
  </script>

  <div class="topbar">
    <div style="display:flex; gap:8px">
      <button id="backTop" class="btn">←</button>
      <button id="homeTop" class="btn">🏠</button>
    </div>
    <div style="display:flex; gap:8px">
      <button id="langIT"  class="btn round">IT</button>
      <button id="langEN"  class="btn round">EN</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1 id="title">Your question</h1>
      <p class="lead" id="lead">Write one sentence. Voice &amp; time above.</p>

      <div class="card" style="margin-top:8px">
        <!-- Toggles -->
        <div class="group" style="margin-bottom:10px">
          <button class="chip" data-key="stile"   data-val="whatif" id="bWhatif">What if</button>
          <button class="chip" data-key="stile"   data-val="wtf"    id="bWtf">What the F</button>
        </div>
        <div class="group" style="margin-bottom:10px">
          <button class="chip" data-key="periodo" data-val="past"   id="bPast">Past</button>
          <button class="chip" data-key="periodo" data-val="future" id="bFuture">Future</button>
        </div>
        <div class="group" style="margin-bottom:12px">
          <button class="chip" data-key="lang" data-val="it" id="bIT">IT</button>
          <button class="chip" data-key="lang" data-val="en" id="bEN">EN</button>
        </div>

        <!-- Input -->
        <label for="q" id="qLabel" style="font-weight:800; display:block; margin:6px 0 6px">Your question</label>
        <textarea id="q" placeholder="Write one sentence…"></textarea>

        <!-- Actions -->
        <div class="row">
          <button id="clear" class="btn ghost">Clear</button>
          <div style="display:flex; gap:8px; align-items:center">
            <span class="muted" id="hint">Write one sentence. Voice &amp; time above.</span>
            <button id="go" class="btn primary">✨ Generate answer</button>
          </div>
        </div>

        <!-- Output -->
        <div id="out" class="out"></div>
        <div id="outBar" class="row" style="display:none">
          <button id="copy" class="btn">📋 Copy</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    /* ========= I18N ========= */
    const LS = localStorage;
    const L = (LS.getItem('lang')||'it').toLowerCase();
    const I = {
      it:{
        title:'La tua domanda',
        lead:'Scrivi una frase. Scegli voce e tempo sopra.',
        label:'La tua domanda',
        placeholder:'Scrivi una frase…',
        whatif:'What if', wtf:'What the F',
        past:'Passato', future:'Futuro',
        it:'IT', en:'EN',
        clear:'Pulisci', gen:'✨ Genera risposta',
        hint:'Una frase sola. Voce e tempo sopra.',
        copied:'Copiato!',
        error:'Errore: richiesta API fallita',
        empty:'Errore: risposta vuota.'
      },
      en:{
        title:'Your question',
        lead:'Write one sentence. Pick voice & time above.',
        label:'Your question',
        placeholder:'Write one sentence…',
        whatif:'What if', wtf:'What the F',
        past:'Past', future:'Future',
        it:'IT', en:'EN',
        clear:'Clear', gen:'✨ Generate answer',
        hint:'One sentence. Voice & time above.',
        copied:'Copied!',
        error:'Error: API request failed',
        empty:'Error: empty response.'
      }
    };

    function applyLangUI(){
      const dict = I[(LS.getItem('lang')||'it').toLowerCase()] || I.it;
      document.documentElement.lang = (LS.getItem('lang')||'it').toLowerCase();

      document.getElementById('title').textContent = dict.title;
      document.getElementById('lead').textContent  = dict.lead;
      document.getElementById('qLabel').textContent= dict.label;
      document.getElementById('q').placeholder     = dict.placeholder;
      document.getElementById('bWhatif').textContent = dict.whatif;
      document.getElementById('bWtf').textContent    = dict.wtf;
      document.getElementById('bPast').textContent   = dict.past;
      document.getElementById('bFuture').textContent = dict.future;
      document.getElementById('bIT').textContent     = dict.it;
      document.getElementById('bEN').textContent     = dict.en;
      document.getElementById('clear').textContent   = dict.clear;
      document.getElementById('go').textContent      = dict.gen;
      document.getElementById('hint').textContent    = dict.hint;
    }
    applyLangUI();

    // Topbar nav
    document.getElementById('backTop').addEventListener('click', ()=>history.back());
    document.getElementById('homeTop').addEventListener('click', ()=>location.href='index.html');
    document.getElementById('langIT').addEventListener('click', ()=>{ LS.setItem('lang','it'); applyLangUI(); syncChips(); });
    document.getElementById('langEN').addEventListener('click', ()=>{ LS.setItem('lang','en'); applyLangUI(); syncChips(); });

    /* ========= State & Chips ========= */
    const state = JSON.parse(LS.getItem('whatif_prefs')||'{}');
    if(!state.stile)   state.stile   = 'whatif';
    if(!state.periodo) state.periodo = 'future';
    if(!state.lang)    state.lang    = (LS.getItem('lang')||'it').toLowerCase();
    LS.setItem('whatif_prefs', JSON.stringify(state));

    function mark(sel, key, val){
      document.querySelectorAll(`.chip[data-key="${key}"]`).forEach(c=>c.classList.remove('selected'));
      const btn = document.querySelector(`.chip[data-key="${key}"][data-val="${val}"]`);
      if (btn) btn.classList.add('selected');
      if (key==='stile'){
        document.documentElement.setAttribute('data-theme', val==='wtf' ? 'wtf' : 'whatif');
      }
    }
    function syncChips(){
      mark(null,'stile',state.stile);
      mark(null,'periodo',state.periodo);
      mark(null,'lang',(LS.getItem('lang')||state.lang));
    }
    syncChips();

    document.querySelectorAll('.chip').forEach(b=>{
      b.addEventListener('click', ()=>{
        const key=b.dataset.key, val=b.dataset.val;
        if(key==='lang'){ LS.setItem('lang', val); state.lang=val; applyLangUI(); }
        state[key]=val; LS.setItem('whatif_prefs', JSON.stringify(state));
        syncChips();
      });
    });

    /* ========= API ========= */
    function getEndpoint(){
      try{ if (window.ASK_API && typeof window.ASK_API==='string') return window.ASK_API.trim(); }catch{}
      return '/api/ask';
    }

    async function ask(){
      const domanda = (document.getElementById('q').value||'').trim();
      const out = document.getElementById('out');
      const outBar = document.getElementById('outBar');
      const dict = I[(LS.getItem('lang')||'it').toLowerCase()] || I.it;

      if(!domanda) return;
      out.style.display='block'; out.textContent='…';
      outBar.style.display='none';

      const host = String(location.host||'');
      const isLocal = /(^localhost:|^127\.0\.0\.1:|^::1)/i.test(host);

      try{
        const r = await fetch(getEndpoint(),{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'x-pro': isLocal ? '1' : (LS.getItem('pro')==='1'?'1':'0')
          },
          body: JSON.stringify({
            domanda,
            stile: state.stile,
            lang:  (LS.getItem('lang')||state.lang),
            periodo: state.periodo,
            // passa sesso se presente nel profilo base
            sex: (JSON.parse(LS.getItem('whatif_profile')||'{}').sex || '')
          })
        });

        if(!r.ok){
          const j = await r.json().catch(()=>({}));
          const msg = j?.error ? `${dict.error} (${j.error})` : `${dict.error} (HTTP ${r.status})`;
          out.textContent = msg;
          return;
        }

        const data = await r.json();
        out.textContent = data?.answer || dict.empty;
        outBar.style.display='flex';
      }catch(err){
        out.textContent = `${dict.error} (${String(err.message||err)})`;
      }
    }

    document.getElementById('go').addEventListener('click', ask);
    document.getElementById('clear').addEventListener('click', ()=>{
      const q = document.getElementById('q');
      q.value=''; q.focus();
      const out = document.getElementById('out'); out.style.display='none'; out.textContent='';
      document.getElementById('outBar').style.display='none';
    });
    document.getElementById('copy').addEventListener('click', async ()=>{
      const out = document.getElementById('out');
      try{ await navigator.clipboard.writeText(out.textContent||''); }catch{}
      const dict = I[(LS.getItem('lang')||'it').toLowerCase()] || I.it;
      const btn = document.getElementById('copy');
      const old = btn.textContent; btn.textContent = '✅ ' + dict.copied;
      setTimeout(()=>btn.textContent=old, 900);
    });
  </script>

  <!-- SW (coerente con gli altri file) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
