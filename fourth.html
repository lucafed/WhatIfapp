<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFFFFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01;          /* What?f */
  --wtf1:#3A6B56; --wtf2:#5A8C75;         /* WTF */
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.tip{font-size:12px;color:var(--muted);margin-top:8px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:14px}
hr.sep{border:none;height:1px;background:rgba(255,255,255,.08);margin:10px 0}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Stile & periodo -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row">
        <span class="badge" id="periodoBadge">🕰️ —</span>
        <span class="badge" id="styleBadge">🎭 —</span>
      </div>
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <!-- Domanda al centro -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <div style="margin-top:10px">
      <div class="row" style="justify-content:space-between">
        <div class="label" style="margin:0" id="addLabel">Aggiungi un dettaglio (opzionale)</div>
        <span class="meta" id="hintMeta">aiuta la risposta di oggi</span>
      </div>
      <input id="extraInput" class="input" placeholder="es. primo segnale di successo, budget, luogo specifico…"/>
      <div class="chips" id="extraChips" style="margin-top:8px"></div>
      <p class="tip" id="tipNote">Tip: puoi cambiare stile sopra; colori e tono si adattano.</p>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Pulisci</button>
    </div>
  </div>

  <!-- Domande salvate per domani -->
  <div class="card center">
    <h3 class="label" id="nextLabel">Domande salvate per domani</h3>
    <div id="nextList" class="list"></div>
  </div>

  <!-- Storie recenti -->
  <div class="card center">
    <h3 class="label" id="storiesLabel">Le tue storie recenti</h3>
    <div id="storyList" class="list"></div>
  </div>

</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    periodPast:"Passato", periodFuture:"Futuro",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    yourq:"La tua domanda",
    addDetail:"Aggiungi un dettaglio (opzionale)",
    hint:"aiuta la risposta di oggi",
    tip:"Tip: puoi cambiare stile sopra; colori e tono si adattano.",
    gen:"✨ Genera risposta", clear:"Pulisci",
    free:(l,d)=>`Free oggi: ${l}/${d}`,
    next:"Domande salvate per domani",
    stories:"Le tue storie recenti",
    emptyNext:"— Nessuna domanda salvata. Leggi una risposta e salva i follow-up in quinta.",
    emptyStories:"— Nessuna storia recente.",
    chip_s1:"primo segnale", chip_s2:"vincolo 2 settimane", chip_s3:"luogo preciso", chip_s4:"tempo disponibile",
    reuse:"Usa", play:"▶"
  },
  en:{
    title:"Set your question",
    periodPast:"Past", periodFuture:"Future",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    yourq:"Your question",
    addDetail:"Add a detail (optional)",
    hint:"helps today's answer",
    tip:"Tip: change style above; tone & colors adapt.",
    gen:"✨ Generate answer", clear:"Clear",
    free:(l,d)=>`Free today: ${l}/${d}`,
    next:"Saved for tomorrow",
    stories:"Your recent stories",
    emptyNext:"— No saved questions. Read an answer and save its follow-ups in page five.",
    emptyStories:"— No recent stories.",
    chip_s1:"first signal", chip_s2:"2-week constraint", chip_s3:"specific place", chip_s4:"time window",
    reuse:"Use", play:"▶"
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Prefs / Tema / Stile / Periodo ===== */
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
let currentStyle = prefs.stile || 'whatif';
let currentPeriod = prefs.periodo || 'future';
applyTheme();

function applyTheme(){
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
}

/* ===== UI Text ===== */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.yourq;
document.getElementById('addLabel').textContent=T.addDetail;
document.getElementById('hintMeta').textContent=T.hint;
document.getElementById('tipNote').textContent=T.tip;
document.getElementById('goBtn').textContent=T.gen;
document.getElementById('clearBtn').textContent=T.clear;
document.getElementById('chipWhatIf').textContent=T.whatif;
document.getElementById('chipWTF').textContent=T.wtf;
document.getElementById('nextLabel').textContent=T.next;
document.getElementById('storiesLabel').textContent=T.stories;
document.getElementById('langBtn').textContent=lang.toUpperCase();

/* ===== Periodo & stile badge ===== */
const periodoBadge = document.getElementById('periodoBadge');
const styleBadge = document.getElementById('styleBadge');
function renderBadgesTop(){
  periodoBadge.textContent = "🕰️ " + (currentPeriod==='past'? T.periodPast : T.periodFuture);
  styleBadge.textContent   = "🎭 " + (currentStyle==='wtf'? (lang==='en'? "What the F":"What the F") : (lang==='en'?"What if":"What if"));
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
}
renderBadgesTop();

/* ===== Crediti (free) con reset dev via long-press ===== */
const DAILY_FREE=3;
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  if(c.date!==todayStr()){c.date=todayStr(); c.used=0;}
  writeJSON('whatif_credits',c);
}
function renderFree(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  const left=Math.max(0,DAILY_FREE-(c.used||0));
  document.getElementById('freeBadge').textContent=T.free(left,DAILY_FREE);
  document.getElementById('freeBadge').title = (lang==='en'
    ? "Long-press: reset today (dev only)"
    : "Pressione lunga: azzera oggi (solo dev)");
}
ensureCredits(); renderFree();

/* Dev reset: long-press */
(function devReset(){
  const b=document.getElementById('freeBadge'); let t=null;
  b.addEventListener('pointerdown', ()=>{ t=setTimeout(()=>{ const c=readJSON('whatif_credits'); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderFree(); alert(lang==='en'?'Today credits reset (dev)':'Crediti di oggi azzerati (dev)'); },1600); });
  b.addEventListener('pointerup', ()=> clearTimeout(t));
  b.addEventListener('pointerleave', ()=> clearTimeout(t));
})();

/* ===== Lingua switch ===== */
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

/* ===== Navigazione ===== */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';

/* ===== Period toggle (tap sul badge) ===== */
periodoBadge.addEventListener('click', ()=>{
  currentPeriod = currentPeriod==='past' ? 'future' : 'past';
  prefs.periodo = currentPeriod; writeJSON('whatif_prefs', prefs);
  renderBadgesTop();
});

/* ===== Stile chips ===== */
document.getElementById('styleChips').addEventListener('click', (e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle=b.dataset.style;
  prefs.stile=currentStyle; writeJSON('whatif_prefs',prefs);
  applyTheme(); renderBadgesTop();
});

/* ===== Extra chips ===== */
const chipWrap=document.getElementById('extraChips');
[T.chip_s1,T.chip_s2,T.chip_s3,T.chip_s4].forEach(txt=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
  b.addEventListener('click',()=>{ const i=document.getElementById('extraInput'); i.value = i.value ? (i.value+' • '+txt):txt; i.focus(); });
  chipWrap.appendChild(b);
});

/* ===== Genera: salva domanda + extra e vai alla quinta ===== */
document.getElementById('goBtn').onclick=()=>{
  const domanda=document.getElementById('qInput').value.trim();
  if(!domanda){ document.getElementById('qInput').focus(); return; }
  writeJSON('whatif_prefs', { ...prefs, stile: currentStyle, periodo: currentPeriod });
  LS.setItem('domanda', domanda);

  // consumo credito (visibile all'utente) — la generazione avviene in quinta
  const c=readJSON('whatif_credits'); c.used=(c.used||0)+1; writeJSON('whatif_credits',c); renderFree();

  // tieni il dettaglio in buffer (se serve per UI/telemetria)
  writeJSON('whatif_clarify_buffer', { q: domanda, extra: (document.getElementById('extraInput').value||"").trim(), ts: Date.now() });

  location.href='fifth.html';
};

/* ===== Pulisci ===== */
document.getElementById('clearBtn').onclick=()=>{
  document.getElementById('qInput').value="";
  document.getElementById('extraInput').value="";
  document.getElementById('qInput').focus();
};

/* ===== Domande salvate per domani (da fifth) ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNextPrompts(){
  const box=document.getElementById('nextList'); box.innerHTML="";
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){
    const p=document.createElement('div'); p.className='empty'; p.textContent=T.emptyNext; box.appendChild(p); return;
  }
  arr.slice(0,8).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700;max-width:540px">${item.q||'—'}</div><div class="meta">${fmtDate(item.ts)}</div>`;
    const right=document.createElement('div'); right.className='row';
    const useBtn=document.createElement('button'); useBtn.className='btn'; useBtn.textContent=T.reuse;
    useBtn.onclick=()=>{ document.getElementById('qInput').value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); writeJSON('whatif_prefs', { ...prefs, stile: (item.stile||currentStyle), periodo: currentPeriod }); location.href='fifth.html'; };
    right.appendChild(useBtn); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}

/* ===== Storie recenti (cronologia) ===== */
function renderStories(){
  const box=document.getElementById('storyList'); box.innerHTML="";
  const arr=readJSON('cronologia',[]);
  if(!arr.length){
    const p=document.createElement('div'); p.className='empty'; p.textContent=T.emptyStories; box.appendChild(p); return;
  }
  arr.slice(0,8).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700;max-width:540px">${item.domanda||'—'}</div><div class="meta">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'WTF':'What?f')}</div>`;
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ LS.setItem('domanda', item.domanda||""); writeJSON('whatif_prefs', { ...prefs, stile: item.stile||'whatif', periodo: currentPeriod }); location.href='fifth.html'; };
    row.appendChild(left); row.appendChild(play);
    box.appendChild(row);
  });
}

/* ===== Boot ===== */
function boot(){
  document.getElementById('periodoBadge').textContent="🕰️ "+(currentPeriod==='past'?T.periodPast:T.periodFuture);
  document.getElementById('styleBadge').textContent="🎭 "+(currentStyle==='wtf'?(lang==='en'?"What the F":"What the F"):(lang==='en'?"What if":"What if"));
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
  renderFree(); renderNextPrompts(); renderStories();
  // placeholder coerente con lingua
  document.getElementById('qInput').placeholder = (lang==='en' ? "What if I moved back to L’Aquila?" : "E se tornassi a vivere all’Aquila?");
  document.getElementById('extraInput').placeholder = (lang==='en'
    ? "e.g., first success signal, budget, specific place…"
    : "es. primo segnale di successo, budget, luogo specifico…");
}
boot();
</script>
</body>
</html>
