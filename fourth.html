<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Domanda</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFFFFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01;          /* What?f */
  --wtf1:#3A6B56; --wtf2:#5A8C75;         /* WTF */
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased
}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.center{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow:auto;padding-bottom:2px}
.chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
.meta{font-size:12px;color:var(--muted)}
hr.sep{border:none;height:1px;background:rgba(255,255,255,.08);margin:10px 0}
/* details collassabili */
details{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);padding:10px 12px}
details>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--acc)}
details>summary::-webkit-details-marker{display:none}
.sRow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.story{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04)}
.play{border:none;background:var(--chip);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:16px}
.small{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.kv input{font-size:14px;padding:10px}
.pillWrap{display:flex;gap:6px;flex-wrap:nowrap;overflow:auto}
</style>
</head>
<body>
<main>

  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="freeBadge" title="">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Imposta la tua domanda</h1>

  <!-- Stile & periodo -->
  <div class="card center">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row">
        <span class="badge" id="periodoBadge">🕰️ —</span>
        <span class="badge" id="styleBadge">🎭 —</span>
      </div>
      <div class="chips" id="styleChips">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
        <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
      </div>
    </div>
  </div>

  <!-- Domanda centrale -->
  <div class="card center">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <textarea id="qInput" rows="3" class="input" placeholder="E se tornassi a vivere all’Aquila?"></textarea>

    <!-- Aggiungi dettaglio: pills compatte + campo mini -->
    <div style="margin-top:10px">
      <div class="sRow">
        <div class="label" style="margin:0" id="addLabel">Aggiungi un dettaglio</div>
        <span class="meta" id="hintMeta">aiuta la risposta di oggi</span>
      </div>
      <div class="pillWrap" id="extraChips" style="margin-top:6px"></div>
      <input id="extraInput" class="input" style="margin-top:6px;padding:10px;font-size:15px" placeholder="es. primo segnale di successo, budget, luogo…"/>
      <p class="small" id="tipNote">Tip: cambia stile sopra; tono e colori si adattano.</p>
    </div>

    <div class="row" style="margin-top:10px;justify-content:center">
      <button class="btn primary" id="goBtn">✨ Genera risposta</button>
      <button class="btn ghost" id="clearBtn">Pulisci</button>
    </div>
  </div>

  <!-- Micro domande giornaliere (collassate) -->
  <div class="card center">
    <details id="microBox">
      <summary id="microSummary">Micro-domande di oggi • <span id="microCount">0/3</span></summary>
      <div class="kv" style="margin-top:6px">
        <input id="m1" placeholder="Finestra reale (es. 3–6 mesi)"/>
        <input id="m2" placeholder="Segnale di successo (es. primo cliente)"/>
        <input id="m3" placeholder="Vincolo concreto (es. budget/tempo)"/>
      </div>
      <div class="row" style="margin-top:8px;justify-content:flex-end">
        <button class="btn" id="saveMicroBtn">Salva micro-domande</button>
      </div>
      <p class="small" id="microHint">Le micro-risposte aiutano la voce a “conoscerti”.</p>
    </details>
  </div>

  <!-- Domande salvate per domani -->
  <div class="card center">
    <details open id="nextBox">
      <summary id="nextLabel">Domande salvate per domani</summary>
      <div id="nextList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" id="clearNextBtn">Svuota</button>
      </div>
    </details>
  </div>

  <!-- Storie recenti -->
  <div class="card center">
    <details id="storiesBox">
      <summary id="storiesLabel">Le tue storie recenti</summary>
      <div id="storyList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" id="clearStoriesBtn">Svuota</button>
      </div>
    </details>
  </div>

</main>

<script>
/* ===== I18N ===== */
const I18N = {
  it:{
    title:"Imposta la tua domanda",
    periodPast:"Passato", periodFuture:"Futuro",
    whatif:"What if (realistico)", wtf:"What the F (divertente)",
    yourq:"La tua domanda",
    addDetail:"Aggiungi un dettaglio",
    hint:"aiuta la risposta di oggi",
    tip:"Tip: cambia stile sopra; tono e colori si adattano.",
    gen:"✨ Genera risposta", clear:"Pulisci",
    free:(l,d)=>`Free oggi: ${l}/${d}`,
    next:"Domande salvate per domani",
    emptyNext:"— Nessuna domanda salvata.",
    stories:"Le tue storie recenti",
    emptyStories:"— Nessuna storia recente.",
    chip_s1:"primo segnale", chip_s2:"vincolo 2 settimane", chip_s3:"luogo preciso", chip_s4:"tempo disponibile",
    use:"Usa", play:"▶", replay:"Rivedi", continue:"Continua",
    microTitle:(n,d)=>`Micro-domande di oggi • ${n}/${d}`,
    microPH1:"Finestra reale (es. 3–6 mesi)",
    microPH2:"Segnale di successo (es. primo cliente)",
    microPH3:"Vincolo concreto (es. budget/tempo)",
    microSave:"Salva micro-domande",
    microHint:"Le micro-risposte aiutano la voce a “conoscerti”.",
    limitsReached:"Hai finito i crediti di oggi. Torna domani o attiva Pro.",
    saved:"Salvato ✅"
  },
  en:{
    title:"Set your question",
    periodPast:"Past", periodFuture:"Future",
    whatif:"What if (realistic)", wtf:"What the F (fun)",
    yourq:"Your question",
    addDetail:"Add a detail",
    hint:"helps today's answer",
    tip:"Tip: change style above; tone & colors adapt.",
    gen:"✨ Generate answer", clear:"Clear",
    free:(l,d)=>`Free today: ${l}/${d}`,
    next:"Saved for tomorrow",
    emptyNext:"— No saved questions.",
    stories:"Your recent stories",
    emptyStories:"— No recent stories.",
    chip_s1:"first signal", chip_s2:"2-week constraint", chip_s3:"specific place", chip_s4:"time window",
    use:"Use", play:"▶", replay:"Replay", continue:"Continue",
    microTitle:(n,d)=>`Today’s micro-questions • ${n}/${d}`,
    microPH1:"Real window (e.g., 3–6 months)",
    microPH2:"Success signal (e.g., first client)",
    microPH3:"Hard constraint (e.g., budget/time)",
    microSave:"Save micro-answers",
    microHint:"These help the voice “know you”.",
    limitsReached:"You’ve used today’s credits. Come back tomorrow or activate Pro.",
    saved:"Saved ✅"
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Prefs / Tema / Stile / Periodo ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future'});
let currentStyle = prefs.stile || 'whatif';
let currentPeriod = prefs.periodo || 'future';
applyTheme();

function applyTheme(){
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
}

/* ===== UI text ===== */
const $=id=>document.getElementById(id);
$('titleH1').textContent=T.title;
$('qLabel').textContent=T.yourq;
$('addLabel').textContent=T.addDetail;
$('hintMeta').textContent=T.hint;
$('tipNote').textContent=T.tip;
$('goBtn').textContent=T.gen;
$('clearBtn').textContent=T.clear;
$('chipWhatIf').textContent=T.whatif;
$('chipWTF').textContent=T.wtf;
$('nextLabel').textContent=T.next;
$('storiesLabel').textContent=T.stories;
$('langBtn').textContent=lang.toUpperCase();

/* ===== Periodo & stile badge ===== */
const periodoBadge=$('periodoBadge'), styleBadge=$('styleBadge');
function renderBadgesTop(){
  periodoBadge.textContent = "🕰️ " + (currentPeriod==='past'? T.periodPast : T.periodFuture);
  styleBadge.textContent   = "🎭 " + (currentStyle==='wtf' ? (lang==='en'?"What the F":"What the F")
                                               : (lang==='en'?"What if":"What if"));
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
}
renderBadgesTop();

/* ===== Crediti (free/pro) ===== */
const DAILY_FREE=3, DAILY_PRO=10;
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ensureCredits(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  if(c.date!==todayStr()){ c.date=todayStr(); c.used=0; }
  writeJSON('whatif_credits',c);
}
function renderFree(){
  const c=readJSON('whatif_credits',{date:todayStr(),used:0,pro:false});
  const limit = c.pro ? DAILY_PRO : DAILY_FREE;
  const left=Math.max(0,limit-(c.used||0));
  $('freeBadge').textContent=T.free(left,limit);
  $('freeBadge').title = (lang==='en'
    ? "Long-press: reset today (dev only). Triple-tap: toggle Pro."
    : "Pressione lunga: azzera oggi (solo dev). Triplo tap: Pro on/off.");
}
ensureCredits(); renderFree();

/* Dev reset + toggle Pro (solo locale) */
(function devOps(){
  const b=$('freeBadge'); let t=null, clicks=0, timer=null;
  b.addEventListener('pointerdown', ()=>{ t=setTimeout(()=>{ const c=readJSON('whatif_credits'); c.date=todayStr(); c.used=0; writeJSON('whatif_credits',c); renderFree(); alert(lang==='en'?'Today reset (dev)':'Crediti di oggi azzerati (dev)'); },1500); });
  b.addEventListener('pointerup', ()=> clearTimeout(t));
  b.addEventListener('pointerleave', ()=> clearTimeout(t));
  b.addEventListener('click', ()=>{
    clicks++; clearTimeout(timer);
    timer=setTimeout(()=>{
      if(clicks>=3){
        const c=readJSON('whatif_credits'); c.pro=!c.pro; c.used=0; writeJSON('whatif_credits',c); renderFree();
        alert('Pro '+(c.pro?'ON':'OFF'));
      }
      clicks=0;
    },250);
  });
})();

/* ===== Lingua ===== */
$('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

/* ===== Navigazione ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';

/* ===== Period toggle ===== */
periodoBadge.addEventListener('click', ()=>{
  currentPeriod = currentPeriod==='past' ? 'future' : 'past';
  prefs.periodo = currentPeriod; writeJSON('whatif_prefs', prefs);
  renderBadgesTop();
});

/* ===== Stile chips ===== */
$('styleChips').addEventListener('click', (e)=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle=b.dataset.style;
  prefs.stile=currentStyle; writeJSON('whatif_prefs',prefs);
  applyTheme(); renderBadgesTop();
});

/* ===== Extra chips compatti ===== */
const chipWrap=$('extraChips');
[T.chip_s1,T.chip_s2,T.chip_s3,T.chip_s4].forEach(txt=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
  b.addEventListener('click',()=>{ const i=$('extraInput'); i.value = i.value ? (i.value+' • '+txt):txt; i.focus(); });
  chipWrap.appendChild(b);
});

/* ===== Micro-domande (collassate) ===== */
function microKey(){ return 'micro_'+todayStr(); }
function loadMicro(){
  const m=readJSON('whatif_micro',{}); return m[microKey()]||{m1:"",m2:"",m3:""};
}
function saveMicro(ans){
  const m=readJSON('whatif_micro',{}); m[microKey()]=ans; writeJSON('whatif_micro',m);
  $('microCount').textContent='3/3';
}
function renderMicroPlaceholders(){
  $('m1').placeholder=T.microPH1;
  $('m2').placeholder=T.microPH2;
  $('m3').placeholder=T.microPH3;
  $('saveMicroBtn').textContent=T.microSave;
  $('microHint').textContent=T.microHint;
  $('microSummary').textContent = T.microTitle('0', '3');
}
renderMicroPlaceholders();
(function bootMicro(){
  const v=loadMicro();
  $('m1').value=v.m1||""; $('m2').value=v.m2||""; $('m3').value=v.m3||"";
  const filled = ['m1','m2','m3'].filter(id=>($(id).value||"").trim()).length;
  $('microSummary').textContent = T.microTitle(filled, 3);
})();
['m1','m2','m3'].forEach(id=>{
  $(id).addEventListener('input', ()=>{
    const filled = ['m1','m2','m3'].filter(i=>($(i).value||"").trim()).length;
    $('microSummary').textContent = T.microTitle(filled, 3);
  });
});
$('saveMicroBtn').onclick=()=>{
  const ans={ m1:$('m1').value.trim(), m2:$('m2').value.trim(), m3:$('m3').value.trim() };
  saveMicro(ans);
  $('saveMicroBtn').textContent=T.saved;
  setTimeout(()=>{$('saveMicroBtn').textContent=T.microSave;},1200);
};

/* ===== Genera: controlla limiti, salva e vai alla quinta ===== */
$('goBtn').onclick=()=>{
  const domanda=$('qInput').value.trim(); if(!domanda){ $('qInput').focus(); return; }

  // limiti
  const credits=readJSON('whatif_credits'); const limit = credits.pro ? 10 : 3;
  if((credits.used||0)>=limit){ alert(T.limitsReached); return; }

  // consumo + persist
  credits.used=(credits.used||0)+1; writeJSON('whatif_credits',credits); renderFree();
  writeJSON('whatif_prefs',{...prefs,stile:currentStyle,periodo:currentPeriod});
  LS.setItem('domanda',domanda);

  // tieni extra e micro del giorno
  writeJSON('whatif_clarify_buffer',{ q:domanda, extra:($('extraInput').value||"").trim(), micro: readJSON('whatif_micro',{})[microKey()]||{}, ts:Date.now() });

  location.href='fifth.html';
};

/* ===== Pulisci ===== */
$('clearBtn').onclick=()=>{ $('qInput').value=""; $('extraInput').value=""; $('qInput').focus(); };

/* ===== Domande salvate per domani ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(document.documentElement.lang||'it-IT',{hour12:false}); }
function renderNext(){
  const box=$('nextList'); box.innerHTML="";
  const arr=readJSON('next_prompts',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyNext; box.appendChild(p); return; }
  arr.slice(0,10).forEach(item=>{
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700;max-width:540px">${item.q||'—'}</div><div class="small">${fmtDate(item.ts)} · ${(item.stile==='wtf'?'WTF':'What?f')}</div>`;
    const right=document.createElement('div'); right.className='row';
    const use=document.createElement('button'); use.className='btn'; use.textContent=T.use;
    use.onclick=()=>{ $('qInput').value=item.q||""; window.scrollTo({top:0,behavior:'smooth'}); };
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ LS.setItem('domanda', item.q||""); writeJSON('whatif_prefs',{...prefs,stile:item.stile||currentStyle,periodo:currentPeriod}); location.href='fifth.html'; };
    right.appendChild(use); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
$('clearNextBtn').onclick=()=>{ writeJSON('next_prompts',[]); renderNext(); };

/* ===== Storie recenti ===== */
function renderStories(){
  const box=$('storyList'); box.innerHTML="";
  const arr=readJSON('cronologia',[]);
  if(!arr.length){ const p=document.createElement('div'); p.className='small'; p.textContent=T.emptyStories; box.appendChild(p); return; }
  arr.slice(-10).reverse().forEach(item=>{
    const domanda=item.domanda||item.q||'—';
    const answer=item.answer||item.risposta||'';
    const stile=item.stile||'whatif';
    const row=document.createElement('div'); row.className='story';
    const left=document.createElement('div');
    left.innerHTML = `<div style="font-weight:700;max-width:540px">${domanda}</div><div class="small">${fmtDate(item.ts)} · ${(stile==='wtf'?'WTF':'What?f')}</div>`;
    const right=document.createElement('div'); right.className='row';
    const replay=document.createElement('button'); replay.className='btn'; replay.textContent=T.replay;
    replay.onclick=()=>{ writeJSON('replay_story',{domanda, answer, stile}); location.href='fifth.html?view=replay'; };
    const cont=document.createElement('button'); cont.className='btn'; cont.textContent=T.continue;
    cont.onclick=()=>{ LS.setItem('domanda', domanda); writeJSON('whatif_prefs',{...prefs,stile,periodo:currentPeriod}); location.href='fifth.html'; };
    const play=document.createElement('button'); play.className='play'; play.textContent=T.play;
    play.onclick=()=>{ writeJSON('replay_story',{domanda, answer, stile}); location.href='fifth.html?view=replay'; };
    right.appendChild(replay); right.appendChild(cont); right.appendChild(play);
    row.appendChild(left); row.appendChild(right);
    box.appendChild(row);
  });
}
$('clearStoriesBtn').onclick=()=>{ writeJSON('cronologia',[]); renderStories(); };

/* ===== Boot ===== */
function boot(){
  $('periodoBadge').textContent="🕰️ "+(currentPeriod==='past'?T.periodPast:T.periodFuture);
  $('styleBadge').textContent="🎭 "+(currentStyle==='wtf'?(lang==='en'?"What the F":"What the F"):(lang==='en'?"What if":"What if"));
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
  // placeholders coerenti lingua
  $('qInput').placeholder = (lang==='en' ? "What if I moved back to L’Aquila?" : "E se tornassi a vivere all’Aquila?");
  $('extraInput').placeholder = (lang==='en'
    ? "e.g., first success signal, budget, specific place…"
    : "es. primo segnale di successo, budget, luogo…");
  // micro i18n
  $('m1').placeholder=T.microPH1; $('m2').placeholder=T.microPH2; $('m3').placeholder=T.microPH3;
  $('saveMicroBtn').textContent=T.microSave; $('microHint').textContent=T.microHint;
  // render liste
  renderFree(); renderNext(); renderStories();
}
boot();
</script>
</body>
</html>
