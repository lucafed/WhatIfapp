<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Battle</title>
  <style>
    :root{
      --bg:#0A0F14; --surface:#141C22; --text:#fff; --muted:#A0B2BA;
      --accent:#00E0FF; --accent2:#00B5CC; --danger:#ff6b6b; --ok:#7CFF9B;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:radial-gradient(1100px 700px at 20% 0%, rgba(0,224,255,.10), transparent 60%),
                 radial-gradient(1000px 700px at 80% 20%, rgba(26,255,213,.08), transparent 60%),
                 var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex; justify-content:center;
      padding:16px;
    }
    .wrap{width:min(720px,100%);}

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
      margin:6px 0 14px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 14px; border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      color:var(--text);
      text-decoration:none;
      user-select:none;
    }
    .pill strong{color:var(--accent)}
    .pill small{color:var(--muted)}
    .pill.btn{cursor:pointer}
    .title{
      margin:10px 2px 4px;
      font-size:44px; letter-spacing:.2px;
      background:linear-gradient(90deg,var(--accent),#1AFFD5);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      font-weight:800;
    }
    .sub{
      margin:0 2px 16px;
      color:var(--muted);
      font-size:16px;
      line-height:1.4;
    }

    .card{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }

    label{display:block; margin:10px 2px 8px; color:var(--muted); font-weight:650}
    select,input{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(10,15,20,.55);
      color:var(--text);
      outline:none;
      font-size:16px;
    }
    select:focus,input:focus{border-color: rgba(0,224,255,.45); box-shadow:0 0 0 4px rgba(0,224,255,.10)}
    .row{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      margin-top:14px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px;
      padding:12px 16px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(0,224,255,.18), rgba(0,181,204,.12));
      color:var(--text);
      font-weight:750;
      cursor:pointer;
      min-width:160px;
      user-select:none;
    }
    .btn:disabled{opacity:.45; cursor:not-allowed}
    .btn.secondary{
      background:rgba(255,255,255,.06);
    }

    .err{
      display:none;
      margin-top:12px;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,107,107,.35);
      background:rgba(255,107,107,.10);
      color: #ffd0d0;
      font-weight:650;
    }

    .result{
      margin-top:14px;
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(0,224,255,.18);
      background:rgba(0,224,255,.06);
      display:none;
    }
    .result h3{margin:0 0 8px 0; color:var(--accent); font-size:18px}
    .result p{margin:6px 0; color:var(--text); line-height:1.35}
    .muted{color:var(--muted)}
    .small{font-size:13px}
    .hr{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
  </style>
</head>

<body>
  <div class="wrap">
    <!-- TOP BAR -->
    <div class="topbar">
      <a class="pill" href="/home.html" title="Home">🏠</a>

      <div class="pill" aria-live="polite">
        <small>Crediti:</small> <strong id="creditsTop">…</strong>
      </div>

      <a class="pill" href="/store/credit-store.html" title="Ricarica">🛒 <strong>Ricarica</strong></a>
    </div>

    <div class="title">Battle</div>
    <p class="sub">
      Metti due opzioni contro. Scelgo un vincitore e ti spiego perché (1–2 frasi).
      <span class="muted">Ogni giudizio scala 1 credito.</span>
    </p>

    <div class="card">
      <label for="category">Categoria</label>
      <select id="category">
        <option value="persone">Persone</option>
        <option value="cose">Cose</option>
        <option value="scelte">Scelte</option>
        <option value="lavoro">Lavoro</option>
        <option value="amore">Amore</option>
        <option value="soldi">Soldi</option>
      </select>

      <label for="inputA">A</label>
      <input id="inputA" type="text" placeholder="Es. Luca / Pizza / Andare via…" autocomplete="off" />

      <label for="inputB">B</label>
      <input id="inputB" type="text" placeholder="Es. Sara / Sushi / Restare…" autocomplete="off" />

      <div class="row">
        <button class="btn" id="btnFight">⚔️ Combatti</button>
        <button class="btn secondary" id="btnSwap">🔁 Scambia</button>
      </div>

      <div id="battleError" class="err"></div>

      <div id="battleResult" class="result">
        <h3>🏆 Vince: <span id="winner"></span></h3>
        <p><strong>Perché:</strong> <span id="reason"></span></p>
        <p class="muted"><strong>Tagline:</strong> <span id="tagline"></span></p>
        <div class="hr"></div>
        <p class="small muted">Se non ti piace il verdetto, fai un rematch. 😉</p>
      </div>
    </div>
  </div>

  <script type="module">
    // ====== CONFIG PATHS (battle.html in ROOT) ======
    // Se battle.html NON è in root, questi path vanno cambiati.
    const PATH_FIREBASE = "./firebase.init.js";
    const PATH_CREDITS  = "./store/credits.js";

    const showFatal = (msg) => {
      document.body.innerHTML = `
        <div style="padding:16px;font-family:system-ui;color:#fff;background:#111">
          <h2 style="margin:0 0 8px 0">Battle – Errore</h2>
          <pre style="white-space:pre-wrap;opacity:.9">${msg}</pre>
          <p style="opacity:.8">Apri Console (F12) per dettagli.</p>
        </div>`;
    };

    try {
      const fb = await import(PATH_FIREBASE);
      const cr = await import(PATH_CREDITS);

      const { auth } = fb;
      const { bootCredits, getBalance } = cr;

      const $ = (s) => document.querySelector(s);

      const elCredits = $("#creditsTop");
      const elCategory = $("#category");
      const elA = $("#inputA");
      const elB = $("#inputB");
      const btnFight = $("#btnFight");
      const btnSwap = $("#btnSwap");

      const boxErr = $("#battleError");
      const boxRes = $("#battleResult");
      const boxWinner = $("#winner");
      const boxReason = $("#reason");
      const boxTagline = $("#tagline");

      const setErr = (msg) => {
        if (!boxErr) return;
        boxErr.textContent = msg || "";
        boxErr.style.display = msg ? "block" : "none";
      };

      const setLoading = (on) => {
        if (!btnFight) return;
        btnFight.disabled = !!on;
        btnFight.textContent = on ? "⏳ Giudico..." : "⚔️ Combatti";
      };

      async function refreshCredits() {
        try {
          await bootCredits();
          const bal = await getBalance();
          elCredits.textContent = Number.isFinite(bal) ? String(bal) : "∞";
        } catch (e) {
          console.warn("refreshCredits error:", e);
          elCredits.textContent = "0";
        }
      }

      async function getTokenOrThrow() {
        const u = auth.currentUser;
        if (!u) throw new Error("no_user");
        return await u.getIdToken(true);
      }

      function swapAB() {
        const va = elA.value || "";
        elA.value = elB.value || "";
        elB.value = va;
      }

      async function fight() {
        try {
          setErr("");
          boxRes.style.display = "none";

          const category = (elCategory.value || "cose").trim();
          const a = (elA.value || "").trim();
          const b = (elB.value || "").trim();

          if (!a || !b) return setErr("Inserisci sia A che B.");

          const token = await getTokenOrThrow();

          setLoading(true);

          const r = await fetch("/api/battle", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ category, a, b }),
          });

          const data = await r.json().catch(() => ({}));

          if (!r.ok) {
            if (data?.error === "unauthorized" && data?.redirect) {
              window.location.href = data.redirect;
              return;
            }
            if (data?.error === "no_credits") {
              setErr("Crediti finiti. Vai in Ricarica.");
              if (data?.redirect) window.location.href = data.redirect;
              return;
            }
            console.error("battle api error:", r.status, data);
            setErr("Errore server. Riprova.");
            return;
          }

          // UI risultato
          boxWinner.textContent = data.winner || "";
          boxReason.textContent = data.reason || "";
          boxTagline.textContent = data.tagline || "";
          boxRes.style.display = "block";

          // Crediti: se l'API li restituisce ok, altrimenti rilegge Firestore
          if (typeof data.creditsLeft !== "undefined") {
            elCredits.textContent = String(Math.max(0, Number(data.creditsLeft) || 0));
          } else {
            await refreshCredits();
          }
        } catch (e) {
          console.error("fight error:", e);
          setErr("Errore server. Riprova.");
        } finally {
          setLoading(false);
        }
      }

      // Eventi
      btnFight.addEventListener("click", fight);
      btnSwap.addEventListener("click", swapAB);

      // Enter per combattere
      [elA, elB].forEach((el) => {
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") fight();
        });
      });

      // Auth guard + credits
      auth.onAuthStateChanged(async (u) => {
        if (!u) {
          // se vuoi, manda al login
          // window.location.href = "/index.html";
          elCredits.textContent = "0";
          setErr("Devi essere loggato per usare Battle.");
          return;
        }
        await refreshCredits();
        setErr("");
      });

      // Debug: ti fa capire subito se mancano elementi
      console.log("Battle loaded OK");
    } catch (e) {
      console.error("BATTLE FATAL:", e);
      showFatal(String(e?.message || e));
    }
  </script>
</body>
</html>
