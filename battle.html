<!doctype html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f — Battle</title>
  <meta name="theme-color" content="#0A0F14"/>

  <style>
    :root{
      --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0F1820; --line:#1B2A34;
      --shadow:rgba(0,0,0,.35);
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --card:#111713;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 10px;
      background:rgba(10,15,20,.96);
      backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    .btn{
      appearance:none;border:1px solid var(--line);
      background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);border:none;box-shadow:0 10px 26px var(--shadow);
    }
    .btn.ghost{ background:transparent; }
    .btn[disabled]{opacity:.4;cursor:not-allowed}

    .badge{
      background:var(--chip);border:1px solid var(--line);
      border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap;
    }

    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:10px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .small{font-size:12px;color:var(--muted)}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:10px 0;
      backdrop-filter:blur(12px);
    }

    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      background:var(--chip);border:1px solid var(--line);
      color:#eaf3ee;border-radius:999px;padding:8px 12px;
      font-size:13px;cursor:pointer;
      white-space:normal;word-break:break-word;line-height:1.3;
    }
    .chip.sel{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);font-weight:800;
    }

    .input{
      width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;
      border:1px solid var(--line);border-radius:12px;
      padding:14px;font-size:17px;
    }

    .result{
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      background:rgba(255,255,255,.04);
      margin-top:12px;
      display:none;
    }
    .winner{font-weight:900;font-size:18px}
    .reason{margin-top:8px;line-height:1.5}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

    .err{color:#ffb3b3;font-size:13px;font-weight:800;min-height:18px;margin-top:10px}
    a.link{color:var(--accent2);text-decoration:none;font-weight:800}

    /* ===== Share modal / preview ===== */
    .modal{
      position:fixed; inset:0; z-index:9999;
      display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.55);
      padding:14px;
    }
    .modal.open{display:flex}
    .modalCard{
      width:min(520px, 100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.03);
    }
    .modalTitle{font-weight:900}
    .modalBody{padding:12px}
    .previewWrap{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#000;
    }
    .previewImg{width:100%; display:block}
    .modalActions{
      display:flex; gap:10px; flex-wrap:wrap;
      padding:12px;
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.02);
    }
    .hint{
      font-size:12px;color:var(--muted);margin-top:10px;line-height:1.35
    }
  </style>
</head>

      <div class="small" id="subH">—</div>

      <div class="card">

        <div class="chips" id="catChips">
          <button class="chip sel" data-cat="people" id="catPeople">🧑‍🤝‍🧑</button>
          <button class="chip" data-cat="things" id="catThings">🍕</button>
          <button class="chip" data-cat="choices" id="catChoices">🧠</button>
        </div>
      </div>

      <div class="card">
        <div class="small" id="aLabel" style="margin-bottom:6px;font-weight:900;color:var(--accent2)">A</div>
        <input class="input" id="aInput" autocomplete="off"/>

        <div style="height:10px"></div>

        <div class="small" id="bLabel" style="margin-bottom:6px;font-weight:900;color:var(--accent2)">B</div>
        <input class="input" id="bInput" autocomplete="off"/>

        <div class="row" style="justify-content:space-between;margin-top:12px">
          <button class="btn primary" id="judgeBtn" type="button">✨</button>
          <a class="link" href="store/credit-store.html" id="storeLink">—</a>
        </div>

        <div class="err" id="err"></div>

        <div class="result" id="resultBox">
          <div class="winner" id="winnerLine"></div>
          <div class="reason" id="reasonLine"></div>
          <div class="small" id="tagLine" style="margin-top:8px;font-weight:800"></div>
          <div class="actions">
            <button class="btn" id="copyBtn" type="button">📋</button>
            <button class="btn" id="shareBtn" type="button">🖼️</button>
            <button class="btn" id="againBtn" type="button">🔁</button>
          </div>
          <div class="hint" id="hintBox">—</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Share modal -->

    function T(){ return UI[getLang()] || UI.it; }

    function applyI18n(){
      const t = T();
      document.documentElement.lang = getLang();

      $("titleH").textContent = t.title;
      $("subH").textContent   = t.sub;
      $("buyBtn").textContent = t.buy;
      $("storeLink").textContent = t.store;

      $("catLabel").textContent = t.cat;
      $("catPeople").textContent = t.people;
      $("catThings").textContent = t.things;
      $("catChoices").textContent = t.choices;

      $("aInput").placeholder = t.aPh;
      $("bInput").placeholder = t.bPh;

      $("judgeBtn").textContent = t.judge;
      $("copyBtn").textContent  = t.copy;
      $("shareBtn").textContent = t.card;
      $("againBtn").textContent = t.again;
      $("hintBox").textContent  = t.hint;

      $("modalTitle").textContent = t.modalTitle;
      $("shareHint").textContent  = t.modalHint;
      $("nativeShareBtn").textContent = t.share;
      $("downloadBtn").textContent = t.save;
      $("igBtn").textContent = t.ig;
      $("ttBtn").textContent = t.tt;
      $("copyCaptionBtn").textContent = t.copyCaption;
    }

    // badge stile
    $("styleBadge").textContent = "🎭 " + (voice === "wtf" ? "What the F" : "What if");

    // nav
    $("homeBtn").onclick = ()=> location.href = "index.html";
    $("backBtn").onclick = ()=>{
      if(history.length>1) history.back();
      else location.href = "index.html";
    };

    // store link con lang
    function goStore(){
      const lang = encodeURIComponent(getLang());
      location.href = `store/credit-store.html?lang=${lang}`;
    }
    $("buyBtn").onclick = goStore;
    $("storeLink").onclick = (e)=>{ e.preventDefault(); goStore(); };

    // categorie (API-friendly)
    let category = "people";
    $("catChips").addEventListener("click",(e)=>{
      const b = e.target.closest(".chip");
      if(!b) return;
      document.querySelectorAll("#catChips .chip").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
      category = b.dataset.cat || "people";
    });

    // credits state
    let currentBalance = 0;

    function setErr(t){ $("err").textContent = t || ""; }

    function renderCredits(){
      const t = T();
      $("creditsBadge").textContent = t.credits(currentBalance);
    }

    async function syncCredits(){
      if(IS_ADMIN){ renderCredits(); return; }
      if(!auth.currentUser){
        currentBalance = 0;
        renderCredits();
        return;
      }
      try{
        await bootCredits();
        currentBalance = await getBalance();
      }catch(e){
        console.error("syncCredits error:", e);
        currentBalance = 0;
      }
      renderCredits();
    }

    async function guardCredits(){
      const t = T();
      if(IS_ADMIN) return true;
      if(!auth.currentUser){
        alert(t.loginNeed);
        return false;
      }
      if(currentBalance <= 0){
        alert(t.noCredits);
        goStore();
        return false;
      }
      return true;
    }

    function shareText(d){
      const t = T();
      return `⚔️ Battle\nA: ${d.a}\nB: ${d.b}\n${t.winPrefix}${d.winner}\n${d.reason}\n${d.tagline ? "— " + d.tagline : ""}`.trim();
    }

    // Caption localizzata + CTA
    function shareCaption(d){
      const L = getLang();
      const a = String(d.a||"").trim();
      const b = String(d.b||"").trim();
      const w = String(d.winner||"").trim();
      const r = String(d.reason||"").trim();
      const tg = String(d.tagline||"").trim();

      const CTA = {
        it:"Provala qui:",
        en:"Try it here:",
        es:"Pruébalo aquí:",
        fr:"Essaie ici :",
        de:"Hier testen:"
      }[L] || "Provala qui:";

      const HASH = {
        it:"#whatif #battle",
        en:"#whatif #battle",
        es:"#whatif #battle",
        fr:"#whatif #battle",
        de:"#whatif #battle"
      }[L] || "#whatif #battle";

      const winLine = (UI[L]||UI.it).winPrefix + w;

      return [
        `⚔️ Battle: ${a} vs ${b}`,
        winLine,
        r ? `💬 ${r}` : "",
        tg ? `“${tg}”` : "",
        "",
        `${CTA} what-ifapp.vercel.app/battle`,
        HASH
      ].filter(Boolean).join("\n").trim();
    }

    /* =======================
       HELPERS CANVAS
       ======================= */
    function wrapLines(ctx, text, maxWidth){
      const words = String(text||"").split(/\s+/).filter(Boolean);
      const lines = [];
      let line = "";
      for (const w of words){
        const test = line ? (line + " " + w) : w;
        if (ctx.measureText(test).width <= maxWidth){
          line = test;
        } else {
          if (line) lines.push(line);
          line = w;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function roundRect(ctx, x,y,w,h,r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr,y);
      ctx.arcTo(x+w,y, x+w,y+h, rr);
      ctx.arcTo(x+w,y+h, x,y+h, rr);
      ctx.arcTo(x,y+h, x,y, rr);
      ctx.arcTo(x,y, x+w,y, rr);
      ctx.closePath();
    }

    function clampLines(lines, maxLines, suffix="…"){
      if(lines.length <= maxLines) return lines;
      const out = lines.slice(0, maxLines);
      out[maxLines-1] = (out[maxLines-1] || "").replace(/\s*…?\s*$/,"") + suffix;
      return out;
    }

    /* =======================
       CARD GENERATOR
       ======================= */
    async function makeBattleCardPNG(d){
      const W = 1080, H = 1350;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");

      const isWtf = document.documentElement.getAttribute("data-theme") === "wtf";
      const bg1 = isWtf ? "#101414" : "#0E1724";
      const bg2 = isWtf ? "#0B0B0C" : "#0B1018";
      const card = isWtf ? "#111713" : "#141C22";
      const line = isWtf ? "#21322A" : "#1B2A34";
      const fg = isWtf ? "#EEF5F0" : "#F4F7FB";
      const muted = isWtf ? "#A6B6AD" : "#A7B3C2";
      const accent = isWtf ? "#3A6B56" : "#1C57A0";
      const accent2 = isWtf ? "#5A8C75" : "#FFEC01";
      const ink = isWtf ? "#06110B" : "#11110A";

      const L = getLang();
      const titleBattle = (L==="en") ? "⚔️ Battle" :
                          (L==="es") ? "⚔️ Battle" :
                          (L==="fr") ? "⚔️ Battle" :
                          (L==="de") ? "⚔️ Battle" :
                          "⚔️ Battle";

      const labelWin = (L==="en") ? "🏆 Winner" :
                       (L==="es") ? "🏆 Gana" :
                       (L==="fr") ? "🏆 Gagnant" :
                       (L==="de") ? "🏆 Sieger" :
                       "🏆 Vince";

      const labelWhy = (L==="en") ? "Reason" :
                       (L==="es") ? "Motivo" :
                       (L==="fr") ? "Motif" :
                       (L==="de") ? "Grund" :
                       "Motivo";

      const labelTag = (L==="en") ? "Tagline" :
                       (L==="es") ? "Tagline" :
                       (L==="fr") ? "Tagline" :
                       (L==="de") ? "Tagline" :
                       "Tagline";

      const cta = (L==="en") ? "👇 Comment: who should’ve won?" :
                  (L==="es") ? "👇 Comenta: ¿quién debía ganar?" :
                  (L==="fr") ? "👇 Dis en com’: qui devait gagner ?" :
                  (L==="de") ? "👇 Kommentar: Wer hätte gewinnen sollen?" :
                  "👇 Commenta: chi doveva vincere?";

      // background
      const grd = ctx.createRadialGradient(W*0.25,H*0.18, 40, W*0.25,H*0.18, Math.max(W,H));
      grd.addColorStop(0, bg1);
      grd.addColorStop(1, bg2);
      ctx.fillStyle = grd;
      ctx.fillRect(0,0,W,H);

      // outer card
      const pad = 70;
      const boxX = pad, boxY = 110, boxW = W - pad*2, boxH = H - pad*2;

      const innerX = boxX + 52;
      const innerR = boxX + boxW - 52;
      const innerW = innerR - innerX;

      // footer reserved
      const FOOTER_H = 160;
      const FOOTER_Y = boxY + boxH - FOOTER_H;

      ctx.save();
      roundRect(ctx, boxX, boxY, boxW, boxH, 42);
      ctx.fillStyle = card;
      ctx.globalAlpha = 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = line;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Header: big brand
      ctx.font = "900 86px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = fg;
      ctx.fillText("What?f", innerX, boxY + 98);

      ctx.font = "900 48px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillText(titleBattle, innerX, boxY + 154);

      // style chip
      const styleText = isWtf ? "What the F" : "What if";
      ctx.font = "800 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      const chipW = ctx.measureText(styleText).width + 44;
      const chipX = innerR - chipW;
      const chipY = boxY + 76;

      ctx.save();
      roundRect(ctx, chipX, chipY, chipW, 46, 23);
      const chipGrad = ctx.createLinearGradient(chipX, chipY, chipX, chipY+46);
      chipGrad.addColorStop(0, accent);
      chipGrad.addColorStop(1, accent2);
      ctx.fillStyle = chipGrad;
      ctx.fill();
      ctx.fillStyle = ink;
      ctx.fillText(styleText, chipX+22, chipY+33);
      ctx.restore();

      // divider
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(innerX, boxY + 192);
      ctx.lineTo(innerR, boxY + 192);
      ctx.stroke();

      // A vs B zone
      const zoneTop = boxY + 235;
      const zoneBottom = boxY + 570;
      const zoneMid = (zoneTop + zoneBottom) / 2;

      const labelX = innerX;
      const textX  = innerX + 40;
      const maxTextW = innerR - textX;

      ctx.font = "800 26px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = muted;
      ctx.fillText("A", labelX, zoneTop + 40);
      ctx.fillText("B", labelX, zoneMid + 140);

      ctx.font = "900 54px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = fg;

      const aLines = clampLines(wrapLines(ctx, String(d.a||"").trim(), maxTextW), 2);
      const bLines = clampLines(wrapLines(ctx, String(d.b||"").trim(), maxTextW), 2);

      const lineH = 62;
      let ay = zoneMid - 156;
      for (const ln of aLines){ ctx.fillText(ln, textX, ay); ay += lineH; }
      let by = zoneMid + 126;
      for (const ln of bLines){ ctx.fillText(ln, textX, by); by += lineH; }

      // VS
      const vsX = boxX + boxW/2;
      const vsY = zoneMid;
      ctx.save();
      ctx.beginPath();
      ctx.arc(vsX, vsY, 46, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.06)";
      ctx.fill();
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "900 30px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = accent2;
      ctx.textAlign = "center";
      ctx.fillText("VS", vsX, vsY+10);
      ctx.restore();
      ctx.textAlign = "left";

      // Winner banner
      let y = boxY + 610;
      ctx.save();
      roundRect(ctx, innerX, y, innerW, 128, 30);
      ctx.shadowColor = "rgba(255,236,1,.35)";
      ctx.shadowBlur = 24;
      const winGrad = ctx.createLinearGradient(innerX, y, innerX, y+128);
      winGrad.addColorStop(0, accent);
      winGrad.addColorStop(1, accent2);
      ctx.fillStyle = winGrad;
      ctx.fill();
      ctx.restore();

      ctx.font = "900 34px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = ink;
      ctx.fillText(labelWin, innerX + 42, y + 56);

      ctx.font = "900 56px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      const winLine = clampLines(wrapLines(ctx, String(d.winner||"—").trim(), innerW - 140), 1, "")[0] || "—";
      ctx.fillText(winLine, innerX + 42, y + 114);

      // Reason
      y = boxY + 795;
      ctx.font = "900 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = muted;
      ctx.fillText(labelWhy, innerX, y);

      ctx.font = "700 36px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = fg;

      const reasonLines = clampLines(wrapLines(ctx, String(d.reason||"").trim(), innerW), 5);
      let ry = y + 56;
      for (const ln of reasonLines){
        if (ry > FOOTER_Y - 80) break;
        ctx.fillText(ln, innerX, ry);
        ry += 46;
      }

      // Tagline (if fits)
      const tagline = String(d.tagline||"").trim();
      const yMax = FOOTER_Y - 28;
      if (tagline && ry < yMax - 70){
        const ty = Math.min(ry + 24, yMax - 70);

        ctx.font = "900 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillStyle = muted;
        ctx.fillText(labelTag, innerX, ty);

        ctx.font = "900 42px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillStyle = accent2;

        const tLines = clampLines(wrapLines(ctx, "“" + tagline + "”", innerW), 2);
        let tty = ty + 58;
        for (const ln of tLines){
          if (tty > yMax) break;
          ctx.fillText(ln, innerX, tty);
          tty += 50;
        }
      }

      // Footer CTA
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(innerX, FOOTER_Y);
      ctx.lineTo(innerR, FOOTER_Y);
      ctx.stroke();

      ctx.font = "900 32px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = accent2;
      ctx.fillText(cta, innerX, FOOTER_Y + 58);

      ctx.font = "800 26px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillText("what-ifapp.vercel.app/battle", innerX, FOOTER_Y + 104);

      const dataUrl = c.toDataURL("image/png");
      const blob = await new Promise((resolve)=> c.toBlob(resolve, "image/png", 1.0));
      return { dataUrl, blob };
    }

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1200);
    }

    function openModal(){ $("shareModal").classList.add("open"); }
    function closeModal(){ $("shareModal").classList.remove("open"); }

    $("closeModalBtn").onclick = closeModal;
    $("shareModal").addEventListener("click", (e)=>{
      if(e.target === $("shareModal")) closeModal();
    });

    let last = null;
    let lastCard = null;

    async function ensureCard(){
      if(!last) return null;
      if(lastCard?.blob && lastCard?.dataUrl) return lastCard;
      lastCard = await makeBattleCardPNG({
        a: last.a, b: last.b,
        winner: last.winner,
        reason: last.reason,
        tagline: last.tagline
      });
      return lastCard;
    }

    async function runBattle(){
      const t = T();
      setErr("");
      const a = ($("aInput").value||"").trim();
      const b = ($("bInput").value||"").trim();
      if(!a || !b){ setErr(t.needAB); return; }

      const ok = await guardCredits();
      if(!ok) return;

      // consuma credito PRIMA della chiamata
      if(!IS_ADMIN){
        try{
          const ok2 = await consumeCredit();
          if(!ok2){
            await syncCredits();
            alert(t.noCredits);
            goStore();
            return;
          }
          currentBalance = await getBalance().catch(()=>currentBalance);
          renderCredits();
        }catch(e){
          console.error("consumeCredit error:", e);
          setErr(t.errUseCredits);
          return;
        }
      }

      const btn = $("judgeBtn");
      btn.disabled = true;
      btn.textContent = "⏳...";

      try{
        const lang = getLang();
        const res = await fetch("/api/battle",{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({
            a, b,
            category,
            lang,          // ✅ PASSO LANG
            voice          // ✅ PASSO VOICE
          })
        });

        const data = await res.json().catch(()=>({}));

        if(!res.ok){
          setErr(t.errBattle);
          return;
        }

        // fallback: se API risponde in lingua sbagliata, almeno UI resta corretta
        last = { ...data, a, b };
        lastCard = null;

        $("winnerLine").textContent = t.winPrefix + (data.winner || "—");
        $("reasonLine").textContent  = (data.reason ? (t.reasonPrefix + data.reason) : "");
        $("tagLine").textContent     = data.tagline ? `“${data.tagline}”` : "";
        $("resultBox").style.display = "block";
      }catch(e){
        console.error(e);
        setErr(t.errNet);
      }finally{
        btn.disabled = false;
        btn.textContent = t.judge;
      }
    }

    $("judgeBtn").onclick = runBattle;

    $("copyBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      try{
        await navigator.clipboard.writeText(shareText(last));
        setErr(t.copied);
        setTimeout(()=>setErr(""),900);
      }catch{ setErr(t.cannotCopy); }
    };

    $("shareBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      setErr("");
      try{
        const card = await ensureCard();
        $("cardPreview").src = card.dataUrl;
        openModal();
      }catch(e){
        console.error(e);
        setErr(t.cardFail);
      }
    };

    $("downloadBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      const card = await ensureCard();
      const safe = (String(last.winner||"battle").slice(0,18) || "battle").replace(/[^\w\-]+/g, "_");
      downloadBlob(card.blob, `battle_${safe}.png`);
      setErr(t.saved);
      setTimeout(()=>setErr(""),900);
    };

    $("nativeShareBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      const card = await ensureCard();
      const text = shareCaption(last);

      try{
        const file = new File([card.blob], "battle.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
          await navigator.share({ files:[file], text, title:"What?f — Battle" });
          return;
        }
      }catch{}

      if (navigator.share){
        try{ await navigator.share({ text, title:"What?f — Battle" }); return; }catch{}
      }

      try{
        await navigator.clipboard.writeText(text);
        setErr(t.captionCopied2);
        const safe = (String(last.winner||"battle").slice(0,18) || "battle").replace(/[^\w\-]+/g, "_");
        downloadBlob(card.blob, `battle_${safe}.png`);
      }catch{
        setErr(t.shareNotSupported);
      }
    };

    $("copyCaptionBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      try{
        await navigator.clipboard.writeText(shareCaption(last));
        setErr(t.captionCopied);
        setTimeout(()=>setErr(""),900);
      }catch{
        setErr(t.captionFail);
      }
    };

    $("igBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      await ensureCard();
      setErr(t.igHint);
      location.href = "instagram://app";
      setTimeout(()=>{ window.open("https://www.instagram.com/", "_blank"); }, 500);
    };

    $("ttBtn").onclick = async ()=>{
      const t = T();
      if(!last) return;
      await ensureCard();
      setErr(t.ttHint);
      location.href = "tiktok://";
      setTimeout(()=>{ window.open("https://www.tiktok.com/upload", "_blank"); }, 500);
    };

    $("againBtn").onclick = ()=>{
      $("resultBox").style.display = "none";
      $("aInput").value = "";
      $("bInput").value = "";
      setErr("");
      last = null;
      lastCard = null;
      $("aInput").focus();
    };

    onAuthStateChanged(auth, async ()=>{ await syncCredits(); });
    window.addEventListener("focus", syncCredits);
    window.addEventListener("pageshow", ()=>{ applyI18n(); syncCredits(); });
    window.addEventListener("storage", (e)=>{ if(e?.key==="lang"){ applyI18n(); } });

    // init
    applyI18n();
    await syncCredits();
  </script>
</body>
