<script type="module">
  import { auth } from "../firebase.init.js";
  import { bootCredits, getBalance } from "../store/credits.js";

  const $ = (s) => document.querySelector(s);

  // Adatta questi ID/classi ai TUOI elementi reali
  const elCredits = $("#creditsTop");          // es: <span id="creditsTop"></span>
  const elCategory = $("#category");           // select o input
  const elA = $("#inputA");
  const elB = $("#inputB");
  const btnFight = $("#btnFight");
  const btnSwap = $("#btnSwap");

  const boxWinner = $("#winner");              // dove stampi winner
  const boxReason = $("#reason");
  const boxTagline = $("#tagline");
  const boxError = $("#battleError");          // dove scrivi "Errore server"
  const boxLoading = $("#battleLoading");      // opzionale

  function setErr(msg) {
    if (!boxError) return;
    boxError.textContent = msg || "";
    boxError.style.display = msg ? "block" : "none";
  }

  function setLoading(on) {
    if (boxLoading) boxLoading.style.display = on ? "block" : "none";
    if (btnFight) btnFight.disabled = !!on;
    if (btnSwap) btnSwap.disabled = !!on;
  }

  async function refreshCredits() {
    try {
      await bootCredits();
      const bal = await getBalance();
      if (elCredits) elCredits.textContent = Number.isFinite(bal) ? String(bal) : "∞";
    } catch {
      if (elCredits) elCredits.textContent = "0";
    }
  }

  async function getTokenOrThrow() {
    const u = auth.currentUser;
    if (!u) throw new Error("no_user");
    return await u.getIdToken(true);
  }

  async function fight() {
    try {
      setErr("");
      setLoading(true);

      const category = (elCategory?.value || "cose").trim();
      const a = (elA?.value || "").trim();
      const b = (elB?.value || "").trim();
      if (!a || !b) {
        setErr("Inserisci A e B.");
        return;
      }

      const token = await getTokenOrThrow();

      const r = await fetch("/api/battle", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ category, a, b }),
      });

      const data = await r.json().catch(() => ({}));

      if (!r.ok) {
        if (data?.error === "no_credits") {
          setErr("Crediti finiti. Vai in Ricarica.");
          if (data?.redirect) window.location.href = data.redirect;
          return;
        }
        setErr("Errore server. Riprova.");
        console.error("battle api error:", r.status, data);
        return;
      }

      // Render risultato
      if (boxWinner) boxWinner.textContent = data.winner || "";
      if (boxReason) boxReason.textContent = data.reason || "";
      if (boxTagline) boxTagline.textContent = data.tagline || "";

      // Aggiorna crediti (valore server = verità)
      if (elCredits && typeof data.creditsLeft !== "undefined") {
        elCredits.textContent = String(Math.max(0, Number(data.creditsLeft) || 0));
      } else {
        await refreshCredits();
      }
    } catch (e) {
      console.error("fight() error:", e);
      setErr("Errore server. Riprova.");
    } finally {
      setLoading(false);
    }
  }

  function swapAB() {
    const va = elA?.value || "";
    const vb = elB?.value || "";
    if (elA) elA.value = vb;
    if (elB) elB.value = va;
  }

  btnFight?.addEventListener("click", fight);
  btnSwap?.addEventListener("click", swapAB);

  // Boot
  auth.onAuthStateChanged(async (u) => {
    if (!u) {
      // se vuoi redirect:
      // window.location.href = "/index.html";
      return;
    }
    await refreshCredits();
  });
</script>
