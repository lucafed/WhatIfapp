<!doctype html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What?f — Battle</title>
  <meta name="theme-color" content="#0A0F14"/>

  <style>
    :root{
      --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0F1820; --line:#1B2A34;
      --shadow:rgba(0,0,0,.35);
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --card:#111713;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 10px;
      background:rgba(10,15,20,.96);
      backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    .btn{
      appearance:none;border:1px solid var(--line);
      background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);border:none;box-shadow:0 10px 26px var(--shadow);
    }
    .btn.ghost{ background:transparent; }
    .btn[disabled]{opacity:.4;cursor:not-allowed}

    .badge{
      background:var(--chip);border:1px solid var(--line);
      border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap;
    }

    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:10px 0 6px;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .small{font-size:12px;color:var(--muted)}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:10px 0;
      backdrop-filter:blur(12px);
    }

    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      background:var(--chip);border:1px solid var(--line);
      color:#eaf3ee;border-radius:999px;padding:8px 12px;
      font-size:13px;cursor:pointer;
      white-space:normal;word-break:break-word;line-height:1.3;
    }
    .chip.sel{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);font-weight:800;
    }

    .input{
      width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;
      border:1px solid var(--line);border-radius:12px;
      padding:14px;font-size:17px;
    }

    .result{
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      background:rgba(255,255,255,.04);
      margin-top:12px;
      display:none;
    }
    .winner{font-weight:900;font-size:18px}
    .reason{margin-top:8px;line-height:1.5}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

    .err{color:#ffb3b3;font-size:13px;font-weight:800;min-height:18px;margin-top:10px}
    a.link{color:var(--accent2);text-decoration:none;font-weight:800}

    /* ===== Share modal / preview ===== */
    .modal{
      position:fixed; inset:0; z-index:9999;
      display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.55);
      padding:14px;
    }
    .modal.open{display:flex}
    .modalCard{
      width:min(520px, 100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .modalHead{
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.03);
    }
    .modalTitle{font-weight:900}
    .modalBody{padding:12px}
    .previewWrap{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#000;
    }
    .previewImg{width:100%; display:block}
    .modalActions{
      display:flex; gap:10px; flex-wrap:wrap;
      padding:12px;
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.02);
    }
    .hint{
      font-size:12px;color:var(--muted);margin-top:10px;line-height:1.35
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="creditsBadge">Crediti: —</span>
      <button class="btn" id="buyBtn" type="button">🛒 Crediti</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1>⚔️ Battle</h1>
      <div class="small">Ogni giudizio scala 1 credito.</div>

      <div class="card">
        <div class="small" style="margin-bottom:8px;font-weight:900;color:var(--accent2)">Categoria</div>
        <div class="chips" id="catChips">
          <button class="chip sel" data-cat="persone">🧑‍🤝‍🧑 Persone</button>
          <button class="chip" data-cat="cose">🍕 Cose</button>
          <button class="chip" data-cat="scelte">🧠 Scelte</button>
        </div>
      </div>

      <div class="card">
        <div class="small" style="margin-bottom:6px;font-weight:900;color:var(--accent2)">A</div>
        <input class="input" id="aInput" placeholder="Es: Pizza / Io / Rischiare" autocomplete="off"/>

        <div style="height:10px"></div>

        <div class="small" style="margin-bottom:6px;font-weight:900;color:var(--accent2)">B</div>
        <input class="input" id="bInput" placeholder="Es: Sushi / Il mio amico / Accontentarsi" autocomplete="off"/>

        <div class="row" style="justify-content:space-between;margin-top:12px">
          <button class="btn primary" id="judgeBtn" type="button">✨ Giudica</button>
          <a class="link" href="store/credit-store.html" id="storeLink">Compra crediti</a>
        </div>

        <div class="err" id="err"></div>

        <div class="result" id="resultBox">
          <div class="winner" id="winnerLine"></div>
          <div class="reason" id="reasonLine"></div>
          <div class="small" id="tagLine" style="margin-top:8px;font-weight:800"></div>
          <div class="actions">
            <button class="btn" id="copyBtn" type="button">📋 Copia</button>
            <button class="btn" id="shareBtn" type="button">🖼️ Card</button>
            <button class="btn" id="againBtn" type="button">🔁 Ancora</button>
          </div>
          <div class="hint">
            Tip: con “Card” crei un’immagine pronta da postare. Su Instagram/TikTok: salva la card e caricala come post/storia.
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Share modal -->
  <div class="modal" id="shareModal" role="dialog" aria-modal="true" aria-label="Condividi card">
    <div class="modalCard">
      <div class="modalHead">
        <div class="modalTitle">🖼️ Card Battle</div>
        <button class="btn ghost" id="closeModalBtn" type="button">✕</button>
      </div>
      <div class="modalBody">
        <div class="previewWrap">
          <img class="previewImg" id="cardPreview" alt="Anteprima card"/>
        </div>
        <div class="hint" id="shareHint">
          Se “Condividi” non manda l’immagine, usa “Salva” e caricala su Instagram/TikTok.
        </div>
      </div>
      <div class="modalActions">
        <button class="btn primary" id="nativeShareBtn" type="button">📤 Condividi</button>
        <button class="btn" id="downloadBtn" type="button">⬇️ Salva</button>
        <button class="btn" id="igBtn" type="button">📸 Instagram</button>
        <button class="btn" id="ttBtn" type="button">🎵 TikTok</button>
        <button class="btn" id="copyCaptionBtn" type="button">📋 Copia caption</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { bootCredits, getBalance, consumeCredit } from "./store/credits.js";

    const LS = localStorage;
    const $ = (id)=>document.getElementById(id);

    const IS_ADMIN = !!LS.getItem("admin_token");
    let prefs = {};
    try{ prefs = JSON.parse(LS.getItem("whatif_prefs")||"{}") || {}; }catch{ prefs = {}; }

    // tema coerente
    const theme = (prefs.stile === "wtf") ? "wtf" : "whatif";
    document.documentElement.setAttribute("data-theme", theme);
    $("styleBadge").textContent = "🎭 " + (theme === "wtf" ? "What the F" : "What if");

    // nav
    $("homeBtn").onclick = ()=> location.href = "index.html";
    $("backBtn").onclick = ()=>{
      if(history.length>1) history.back();
      else location.href = "index.html";
    };

    // store link con lang
    function getLang(){
      const l = (LS.getItem("lang") || document.documentElement.lang || "it").toLowerCase();
      return ["it","en","es","fr","de"].includes(l) ? l : "it";
    }
    function goStore(){
      const lang = encodeURIComponent(getLang());
      location.href = `store/credit-store.html?lang=${lang}`;
    }
    $("buyBtn").onclick = goStore;
    $("storeLink").onclick = (e)=>{ e.preventDefault(); goStore(); };

    // categorie
    let category = "persone";
    $("catChips").addEventListener("click",(e)=>{
      const b = e.target.closest(".chip");
      if(!b) return;
      document.querySelectorAll("#catChips .chip").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
      category = b.dataset.cat || "persone";
    });

    // credits state
    let currentBalance = 0;

    function setErr(t){ $("err").textContent = t || ""; }
    function renderCredits(){
      if(IS_ADMIN){
        $("creditsBadge").textContent = "Crediti: ∞ (admin)";
        return;
      }
      $("creditsBadge").textContent = "Crediti: " + currentBalance;
    }

    async function syncCredits(){
      if(IS_ADMIN){ renderCredits(); return; }
      if(!auth.currentUser){
        currentBalance = 0;
        renderCredits();
        return;
      }
      try{
        await bootCredits();
        currentBalance = await getBalance();
      }catch(e){
        console.error("syncCredits error:", e);
        currentBalance = 0;
      }
      renderCredits();
    }

    async function guardCredits(){
      if(IS_ADMIN) return true;
      if(!auth.currentUser){
        alert("Per usare i crediti devi essere loggato.");
        return false;
      }
      if(currentBalance <= 0){
        alert("Hai finito i crediti. Ricarica per continuare.");
        goStore();
        return false;
      }
      return true;
    }

    function shareText(d){
      return `⚔️ Battle\nA: ${d.a}\nB: ${d.b}\n🏆 Vince: ${d.winner}\n${d.reason}\n${d.tagline ? "— " + d.tagline : ""}`.trim();
    }
    function shareCaption(d){
      return `⚔️ Battle: ${d.winner}\n${d.reason}${d.tagline ? "\n“" + d.tagline + "”" : ""}\n\n#whatif #battle`.trim();
    }

    /* =======================
       CARD GENERATOR (Canvas)
       ======================= */

    function wrapLines(ctx, text, maxWidth){
      const words = String(text||"").split(/\s+/).filter(Boolean);
      const lines = [];
      let line = "";
      for (const w of words){
        const test = line ? (line + " " + w) : w;
        if (ctx.measureText(test).width <= maxWidth){
          line = test;
        } else {
          if (line) lines.push(line);
          line = w;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function roundRect(ctx, x,y,w,h,r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr,y);
      ctx.arcTo(x+w,y, x+w,y+h, rr);
      ctx.arcTo(x+w,y+h, x,y+h, rr);
      ctx.arcTo(x,y+h, x,y, rr);
      ctx.arcTo(x,y, x+w,y, rr);
      ctx.closePath();
    }

    function measureLinesHeight(lineCount, lineH){ return Math.max(0, lineCount) * lineH; }

    async function makeBattleCardPNG(d){
      // 1080x1350 (IG portrait)
      const W = 1080, H = 1350;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");

      // theme colors (match page)
      const isWtf = document.documentElement.getAttribute("data-theme") === "wtf";
      const bg1 = isWtf ? "#101414" : "#0E1724";
      const bg2 = isWtf ? "#0B0B0C" : "#0B1018";
      const card = isWtf ? "#111713" : "#141C22";
      const line = isWtf ? "#21322A" : "#1B2A34";
      const fg = isWtf ? "#EEF5F0" : "#F4F7FB";
      const muted = isWtf ? "#A6B6AD" : "#A7B3C2";
      const accent = isWtf ? "#3A6B56" : "#1C57A0";
      const accent2 = isWtf ? "#5A8C75" : "#FFEC01";
      const ink = isWtf ? "#06110B" : "#11110A";

      // background gradient
      const grd = ctx.createRadialGradient(W*0.25,H*0.18, 40, W*0.25,H*0.18, Math.max(W,H));
      grd.addColorStop(0, bg1);
      grd.addColorStop(1, bg2);
      ctx.fillStyle = grd;
      ctx.fillRect(0,0,W,H);

      // outer card
      const pad = 70;
      const boxX = pad, boxY = 110, boxW = W - pad*2, boxH = H - pad*2;

      ctx.save();
      roundRect(ctx, boxX, boxY, boxW, boxH, 42);
      ctx.fillStyle = card;
      ctx.globalAlpha = 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = line;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // top brand row
      ctx.font = "800 44px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = fg;
      ctx.fillText("What?f ⚔️ Battle", boxX+52, boxY+92);

      // style chip
      const styleText = isWtf ? "What the F" : "What if";
      ctx.font = "800 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      const chipW = ctx.measureText(styleText).width + 44;
      const chipX = boxX + boxW - chipW - 52;
      const chipY = boxY + 55;
      ctx.save();
      roundRect(ctx, chipX, chipY, chipW, 46, 23);
      const chipGrad = ctx.createLinearGradient(chipX, chipY, chipX, chipY+46);
      chipGrad.addColorStop(0, accent);
      chipGrad.addColorStop(1, accent2);
      ctx.fillStyle = chipGrad;
      ctx.fill();
      ctx.fillStyle = ink;
      ctx.fillText(styleText, chipX+22, chipY+33);
      ctx.restore();

      // divider
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(boxX+52, boxY+140);
      ctx.lineTo(boxX+boxW-52, boxY+140);
      ctx.stroke();

      /* ========= A / B + VS (FIX: VS CENTRATO) =========
         - Calcoliamo una "zona" A/B
         - Mettiamo VS al centro di quella zona
         - A sopra, B sotto, con offset simmetrico
      */
      const zoneTop = boxY + 200;
      const zoneBottom = boxY + 520;             // fine blocco A/B
      const zoneMid = (zoneTop + zoneBottom) / 2; // centro perfetto
      const labelX = boxX + 52;
      const textX  = boxX + 92;
      const rightX = boxX + boxW - 52;
      const maxTextW = rightX - textX;

      // labels A/B
      ctx.font = "700 26px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = muted;
      // A label baseline
      ctx.fillText("A", labelX, zoneTop + 40);
      // B label baseline
      ctx.fillText("B", labelX, zoneMid + 120);

      // A text
      ctx.font = "900 44px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = fg;
      const aText = String(d.a || "").trim();
      const bText = String(d.b || "").trim();

      const aLines = wrapLines(ctx, aText, maxTextW).slice(0,2);
      const bLines = wrapLines(ctx, bText, maxTextW).slice(0,2);

      // per render pulito
      const lineH = 52;

      // A: parte sopra il centro
      let ay = zoneMid - 120; // start A block (sopra)
      for (const ln of aLines){
        ctx.fillText(ln, textX, ay);
        ay += lineH;
      }

      // B: parte sotto il centro
      let by = zoneMid + 80; // start B block (sotto)
      for (const ln of bLines){
        ctx.fillText(ln, textX, by);
        by += lineH;
      }

      // VS badge al CENTRO della zona (FIX)
      const vsX = boxX + boxW/2;
      const vsY = zoneMid; // centro perfetto tra A e B
      ctx.save();
      ctx.beginPath();
      ctx.arc(vsX, vsY, 46, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.06)";
      ctx.fill();
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "900 30px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = accent2;
      ctx.textAlign = "center";
      ctx.fillText("VS", vsX, vsY+10);
      ctx.restore();
      ctx.textAlign = "left";

      /* ========= Winner banner (EVIDENZIATO) ========= */
      let y = boxY + 560;
      ctx.save();
      roundRect(ctx, boxX+52, y, boxW-104, 112, 28);

      // glow (shadow) per vincitore
      ctx.shadowColor = "rgba(255,236,1,.35)";
      ctx.shadowBlur = 25;
      const winGrad = ctx.createLinearGradient(boxX+52, y, boxX+52, y+112);
      winGrad.addColorStop(0, accent);
      winGrad.addColorStop(1, accent2);
      ctx.fillStyle = winGrad;
      ctx.fill();
      ctx.restore();

      // testo winner
      ctx.font = "900 34px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = ink;
      ctx.fillText("🏆 Vince", boxX+92, y+52);

      ctx.font = "900 46px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      const winName = String(d.winner || "").trim();
      const winLine = wrapLines(ctx, winName, boxW-240).slice(0,1)[0] || "—";
      ctx.fillText(winLine, boxX+92, y+98);

      /* ========= Motivo ========= */
      y = boxY + 730;
      ctx.font = "800 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = muted;
      ctx.fillText("Motivo", boxX+52, y);

      ctx.font = "650 34px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = fg;
      const reason = String(d.reason || "").trim();
      const rLines = wrapLines(ctx, reason, boxW-104).slice(0,5);
      let ry = y + 50;
      for (const ln of rLines){
        ctx.fillText(ln, boxX+52, ry);
        ry += 44;
      }

      /* ========= Tagline ========= */
      const tagline = String(d.tagline || "").trim();
      if (tagline){
        const ty = Math.max(ry + 26, boxY + 1000);
        ctx.font = "800 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillStyle = muted;
        ctx.fillText("Tagline", boxX+52, ty);

        ctx.font = "900 38px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillStyle = accent2;
        const tLines = wrapLines(ctx, "“" + tagline + "”", boxW-104).slice(0,2);
        let tty = ty + 54;
        for (const ln of tLines){
          ctx.fillText(ln, boxX+52, tty);
          tty += 46;
        }
      }

      // footer
      ctx.font = "700 24px system-ui, -apple-system, Segoe UI, Roboto, Arial";
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.fillText("what-ifapp.vercel.app", boxX+52, boxY+boxH-54);

      const dataUrl = c.toDataURL("image/png");
      const blob = await new Promise((resolve)=> c.toBlob(resolve, "image/png", 1.0));
      return { dataUrl, blob };
    }

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1200);
    }

    function openModal(){ $("shareModal").classList.add("open"); }
    function closeModal(){ $("shareModal").classList.remove("open"); }

    $("closeModalBtn").onclick = closeModal;
    $("shareModal").addEventListener("click", (e)=>{
      if(e.target === $("shareModal")) closeModal();
    });

    let last = null;
    let lastCard = null; // {dataUrl, blob}

    async function ensureCard(){
      if(!last) return null;
      if(lastCard?.blob && lastCard?.dataUrl) return lastCard;
      lastCard = await makeBattleCardPNG({
        a: last.a, b: last.b,
        winner: last.winner,
        reason: last.reason,
        tagline: last.tagline
      });
      return lastCard;
    }

    async function runBattle(){
      setErr("");
      const a = ($("aInput").value||"").trim();
      const b = ($("bInput").value||"").trim();
      if(!a || !b){ setErr("Inserisci A e B."); return; }

      const ok = await guardCredits();
      if(!ok) return;

      // ✅ consuma 1 credito prima della richiesta
      if(!IS_ADMIN){
        try{
          const ok2 = await consumeCredit();
          if(!ok2){
            await syncCredits();
            alert("Hai finito i crediti. Ricarica per continuare.");
            goStore();
            return;
          }
          currentBalance = await getBalance().catch(()=>currentBalance);
          renderCredits();
        }catch(e){
          console.error("consumeCredit error:", e);
          setErr("Errore nell'utilizzo dei crediti. Riprova.");
          return;
        }
      }

      const btn = $("judgeBtn");
      btn.disabled = true;
      btn.textContent = "⏳...";

      try{
        const res = await fetch("/api/battle",{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ a, b, category })
        });
        const data = await res.json().catch(()=>({}));

        if(!res.ok){
          setErr("Errore Battle. Riprova.");
          return;
        }

        last = { ...data, a, b };
        lastCard = null;

        $("winnerLine").textContent = "🏆 Vince: " + (data.winner || "—");
        $("reasonLine").textContent  = data.reason || "";
        $("tagLine").textContent     = data.tagline ? `“${data.tagline}”` : "";
        $("resultBox").style.display = "block";
      }catch(e){
        console.error(e);
        setErr("Errore rete. Riprova.");
      }finally{
        btn.disabled = false;
        btn.textContent = "✨ Giudica";
      }
    }

    $("judgeBtn").onclick = runBattle;

    $("copyBtn").onclick = async ()=>{
      if(!last) return;
      try{
        await navigator.clipboard.writeText(shareText(last));
        setErr("Copiato!");
        setTimeout(()=>setErr(""),900);
      }catch{ setErr("Impossibile copiare."); }
    };

    $("shareBtn").onclick = async ()=>{
      if(!last) return;
      setErr("");
      try{
        const card = await ensureCard();
        $("cardPreview").src = card.dataUrl;
        openModal();
      }catch(e){
        console.error(e);
        setErr("Impossibile creare la card. Riprova.");
      }
    };

    $("downloadBtn").onclick = async ()=>{
      if(!last) return;
      const card = await ensureCard();
      const safe = (String(last.winner||"battle").slice(0,18) || "battle").replace(/[^\w\-]+/g, "_");
      downloadBlob(card.blob, `battle_${safe}.png`);
      setErr("Card salvata!");
      setTimeout(()=>setErr(""),900);
    };

    $("nativeShareBtn").onclick = async ()=>{
      if(!last) return;
      const card = await ensureCard();
      const text = shareCaption(last);

      try{
        const file = new File([card.blob], "battle.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
          await navigator.share({ files:[file], text, title:"What?f — Battle" });
          return;
        }
      }catch{}

      if (navigator.share){
        try{ await navigator.share({ text, title:"What?f — Battle" }); return; }catch{}
      }

      try{
        await navigator.clipboard.writeText(text);
        setErr("Caption copiata. Ora salva la card.");
        const safe = (String(last.winner||"battle").slice(0,18) || "battle").replace(/[^\w\-]+/g, "_");
        downloadBlob(card.blob, `battle_${safe}.png`);
      }catch{
        setErr("Condivisione non supportata qui.");
      }
    };

    $("copyCaptionBtn").onclick = async ()=>{
      if(!last) return;
      try{
        await navigator.clipboard.writeText(shareCaption(last));
        setErr("Caption copiata!");
        setTimeout(()=>setErr(""),900);
      }catch{
        setErr("Impossibile copiare la caption.");
      }
    };

    $("igBtn").onclick = async ()=>{
      if(!last) return;
      await ensureCard();
      setErr("Salva la card e caricala su Instagram.");
      location.href = "instagram://app";
      setTimeout(()=>{ window.open("https://www.instagram.com/", "_blank"); }, 500);
    };

    $("ttBtn").onclick = async ()=>{
      if(!last) return;
      await ensureCard();
      setErr("Salva la card e caricala su TikTok.");
      location.href = "tiktok://";
      setTimeout(()=>{ window.open("https://www.tiktok.com/upload", "_blank"); }, 500);
    };

    $("againBtn").onclick = ()=>{
      $("resultBox").style.display = "none";
      $("aInput").value = "";
      $("bInput").value = "";
      setErr("");
      last = null;
      lastCard = null;
      $("aInput").focus();
    };

    onAuthStateChanged(auth, async ()=>{ await syncCredits(); });
    window.addEventListener("focus", syncCredits);
    window.addEventListener("pageshow", syncCredits);

    // init
    await syncCredits();
  </script>
</body>
</html>
