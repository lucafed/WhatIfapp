<!DOCTYPE html>
<html lang="it" data-theme="wtf">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Battle</title>
  <meta name="theme-color" content="#0A0F14"/>

  <style>
    :root{
      --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0F1820; --line:#1B2A34; --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --card:#111713;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
    .wrap{width:min(100%,980px)}
    h1{margin:6px 0 6px;font-size:clamp(26px,6vw,38px);color:var(--accent);display:flex;gap:10px;align-items:center}
    h1 .icon{font-size:26px}
    .small{font-size:12px;color:var(--muted)}
    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 10px;
      background:rgba(10,15,20,.96);
      backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{
      appearance:none;border:1px solid var(--line);
      background:var(--chip);color:var(--fg);
      border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35);
    }
    .btn.link{
      background:transparent;border:none;color:var(--accent);
      padding:10px 10px;font-weight:1000;
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .badge{
      background:var(--chip);border:1px solid var(--line);
      border-radius:999px;padding:8px 12px;font-size:13px;color:#d7e8ec;white-space:nowrap;
      font-weight:900;
    }
    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px;
      margin:10px 0;
      backdrop-filter:blur(12px);
      box-shadow:0 14px 40px var(--shadow);
    }
    .label{color:var(--accent2);font-weight:1000;margin:0 0 10px;font-size:13px;letter-spacing:.2px}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{
      background:var(--chip);
      border:1px solid var(--line);
      color:#eaf3ee;
      border-radius:999px;
      padding:12px 16px;
      font-size:15px;
      font-weight:1000;
      cursor:pointer;
    }
    .chip.sel{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);
      border:none;
      box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
    }
    .input{
      width:100%;
      background:rgba(255,255,255,.06);
      color:#EAF3EE;
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      font-size:20px;
      outline:none;
    }
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:720px){ .grid{grid-template-columns:1fr 1fr} }
    .fieldTitle{opacity:.9;font-weight:1000;margin:0 0 8px}
    .err{color:#ffb3b3;font-weight:1000;margin-top:12px;min-height:18px}
    .resultBox{
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px 14px;
      background:rgba(255,255,255,.04);
      margin-top:12px;
    }
    .winner{font-weight:1100;font-size:18px;margin:0 0 6px}
    .reason{margin:0;color:var(--muted);line-height:1.45}
    .tagline{margin:10px 0 0;font-weight:1000;opacity:.95}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>

    <div class="row">
      <span class="badge" id="styleBadge">🤡 What the F</span>
      <span class="badge" id="creditsBadge">Crediti: —</span>
      <button class="btn" id="storeBtn" type="button">🛒 Crediti</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1><span class="icon">⚔️</span>Battle</h1>
      <div class="small" style="margin-top:-6px">Ogni giudizio scala 1 credito.</div>

      <div class="card">
        <div class="label">Categoria</div>
        <div class="chips" id="catChips">
          <button class="chip sel" data-cat="people">🧑‍🤝‍🧑 Persone</button>
          <button class="chip" data-cat="things">🍕 Cose</button>
          <button class="chip" data-cat="choices">🧠 Scelte</button>
        </div>
      </div>

      <div class="card">
        <div class="grid">
          <div>
            <div class="fieldTitle">A</div>
            <input class="input" id="aInput" placeholder="Luca" autocomplete="off" />
          </div>
          <div>
            <div class="fieldTitle">B</div>
            <input class="input" id="bInput" placeholder="Sara" autocomplete="off" />
          </div>
        </div>

        <div class="row" style="justify-content:space-between;margin-top:14px">
          <button class="btn primary" id="judgeBtn" type="button">✨ Giudica</button>
          <button class="btn link" id="buyLinkBtn" type="button">Compra crediti</button>
        </div>

        <div class="err" id="errLine"></div>

        <div class="resultBox" id="resultBox" style="display:none">
          <div class="winner" id="winnerLine">🏆 Vince: —</div>
          <p class="reason" id="reasonLine"></p>
          <div class="tagline" id="tagLine"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from "./firebase.init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    const LS = localStorage;
    const $ = (id) => document.getElementById(id);

    const STORE_URL = "store/credit-store.html";
    const IS_ADMIN = !!LS.getItem("admin_token");

    let prefs = (() => {
      try { return JSON.parse(LS.getItem("whatif_prefs") || "{}") || {}; }
      catch { return {}; }
    })();
    if (!prefs.stile) prefs.stile = "wtf";

    document.documentElement.setAttribute("data-theme", prefs.stile === "wtf" ? "wtf" : "whatif");
    $("styleBadge").textContent = prefs.stile === "wtf" ? "🤡 What the F" : "🧠 What if";

    function goStore(){
      const lang = (LS.getItem("lang") || "it").toLowerCase();
      location.href = `${STORE_URL}?lang=${encodeURIComponent(lang)}`;
    }
    $("storeBtn").onclick = goStore;
    $("buyLinkBtn").onclick = goStore;
    $("homeBtn").onclick = () => (location.href = "index.html");
    $("backBtn").onclick = () => (history.length > 1 ? history.back() : (location.href = "index.html"));

    let category = "people";
    $("catChips").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if(!b) return;
      category = b.dataset.cat || "people";
      [...$("catChips").querySelectorAll(".chip")].forEach(x => x.classList.toggle("sel", x === b));
    });

    function setErr(t){ $("errLine").textContent = t || ""; }
    function setLoading(v){
      const btn = $("judgeBtn");
      btn.disabled = !!v;
      btn.textContent = v ? "⏳..." : "✨ Giudica";
    }
    function showResult({ winner, reason, tagline }){
      $("winnerLine").textContent = "🏆 Vince: " + (winner || "—");
      $("reasonLine").textContent  = reason || "";
      $("tagLine").textContent     = tagline ? `“${tagline}”` : "";
      $("resultBox").style.display = "block";
    }

    // ===== Credits badge (Redis via /api/credits-balance) =====
    let currentCredits = null;
    function renderCredits(){
      if (IS_ADMIN){
        $("creditsBadge").textContent = "Crediti: ∞ (admin)";
        return;
      }
      $("creditsBadge").textContent = "Crediti: " + (currentCredits ?? "—");
    }

    async function getIdToken(){
      const u = auth.currentUser;
      if (!u) return null;
      try { return await u.getIdToken(/*forceRefresh*/ false); }
      catch { return null; }
    }

    async function syncCredits(){
      if (IS_ADMIN){ renderCredits(); return; }
      const token = await getIdToken();
      if (!token){
        currentCredits = 0;
        renderCredits();
        return;
      }
      try{
        const res = await fetch("/api/credits-balance", {
          method: "GET",
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json().catch(()=> ({}));
        if (!res.ok || !data.ok){
          currentCredits = 0;
        } else {
          currentCredits = Number(data.credits || 0) || 0;
        }
      }catch(e){
        console.error("syncCredits error:", e);
      }
      renderCredits();
    }

    function guardLocalCredits(){
      if (IS_ADMIN) return true;
      if ((currentCredits ?? 0) <= 0){
        alert("Hai finito i crediti. Ricarica per continuare.");
        goStore();
        return false;
      }
      return true;
    }

    async function runBattle(){
      setErr("");
      $("resultBox").style.display = "none";

      const a = ($("aInput").value || "").trim();
      const b = ($("bInput").value || "").trim();
      if(!a || !b){ setErr("Inserisci A e B."); return; }

      if(!guardLocalCredits()) return;

      const token = await getIdToken();
      if(!token){
        alert("Devi essere loggato per usare Battle.");
        location.href = "index.html";
        return;
      }

      setLoading(true);

      try{
        const res = await fetch("/api/battle", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
          },
          body: JSON.stringify({
            a, b,
            category
          })
        });

        const data = await res.json().catch(()=> ({}));

        if(!res.ok){
          if (data && data.error === "no_credits"){
            alert("Hai finito i crediti. Ricarica per continuare.");
            goStore();
            return;
          }
          setErr((data && (data.error || data.message)) || ("Errore Battle (HTTP " + res.status + "). Riprova."));
          return;
        }

        // ✅ aggiorna crediti dal server (quelli rimasti)
        if (!IS_ADMIN && typeof data.creditsLeft !== "undefined"){
          currentCredits = Number(data.creditsLeft);
          if (!Number.isFinite(currentCredits)) currentCredits = currentCredits ?? null;
          renderCredits();
          if ((currentCredits ?? 0) <= 0){
            // appena finiti -> manda allo store (soft)
            setTimeout(()=>{ try{ goStore(); }catch{} }, 600);
          }
        }

        showResult({
          winner: data.winner || "—",
          reason: data.reason || "",
          tagline: data.tagline || ""
        });

      }catch(e){
        console.error(e);
        setErr("Errore rete. Riprova.");
      }finally{
        setLoading(false);
      }
    }

    $("judgeBtn").onclick = runBattle;
    $("aInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") runBattle(); });
    $("bInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") runBattle(); });

    onAuthStateChanged(auth, async () => {
      await syncCredits();
    });
    window.addEventListener("focus", syncCredits);
    window.addEventListener("pageshow", syncCredits);

    renderCredits();
  </script>
</body>
</html>
