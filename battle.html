<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Battle</title>
  <meta name="theme-color" content="#0A0F14"/>
  <style>
    :root{
      --bg:#0B1018; --bg2:#0E1724; --card:#141C22;
      --fg:#F4F7FB; --muted:#A7B3C2;
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
      --chip:#0F1820; --line:#1B2A34;
      --shadow:rgba(0,0,0,.35);
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --card:#111713;
      --fg:#EEF5F0; --muted:#A6B6AD;
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
      --chip:#0F1714; --line:#21322A;
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 14px 26px}
    .wrap{width:min(100%,980px)}
    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 10px;
      background:rgba(10,15,20,.96);
      backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{
      appearance:none;border:1px solid var(--line);
      background:var(--chip);color:var(--fg);
      border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);border:none;box-shadow:0 10px 26px var(--shadow);
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .badge{
      background:var(--chip);border:1px solid var(--line);
      border-radius:999px;padding:6px 10px;font-size:12px;color:#d7e8ec;white-space:nowrap;
    }
    .card{
      background:rgba(20,28,34,.78);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      box-shadow:0 14px 40px rgba(0,0,0,.20);
      backdrop-filter:blur(12px);
    }
    h1{margin:6px 0 0;font-size:clamp(24px,6vw,36px);color:var(--accent)}
    .muted{color:var(--muted);font-size:13px;line-height:1.5}
    .grid{
      display:grid;grid-template-columns:1fr;gap:12px;
    }
    @media(min-width:860px){
      .grid{grid-template-columns:1fr 1fr;}
    }
    .input, select{
      width:100%;
      background:rgba(255,255,255,.06);
      color:#EAF3EE;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      font-size:16px;
      outline:none;
    }
    .label{color:var(--accent2);font-weight:800;margin:0 0 8px}
    .result{
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      background:rgba(255,255,255,.04);
    }
    .win{
      font-weight:900;
      font-size:18px;
      margin-bottom:6px;
    }
    .tagline{
      margin-top:8px;
      font-weight:800;
      color:#EAE9D1;
    }
    .err{color:#ffb3b3;font-size:13px;min-height:18px}
    .spin{
      display:inline-block;
      width:16px;height:16px;
      border:2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.9);
      border-radius:999px;
      animation: r 0.8s linear infinite;
      vertical-align:-3px;
      margin-right:8px;
    }
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn" type="button">←</button>
      <button class="btn" id="homeBtn" type="button">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="creditsBadge">Crediti: —</span>
      <button class="btn" id="buyBtn" type="button">🛒 Ricarica</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <h1>Battle</h1>
      <div class="muted">Metti due opzioni contro. Io scelgo un vincitore e ti spiego perché (1–2 frasi).</div>

      <div class="card" style="margin-top:10px;">
        <div class="label">Categoria</div>
        <select id="cat">
          <option value="cose">Cose</option>
          <option value="cibo">Cibo</option>
          <option value="persone">Persone</option>
          <option value="lavoro">Lavoro</option>
          <option value="relazioni">Relazioni</option>
          <option value="viaggi">Viaggi</option>
        </select>

        <div class="grid" style="margin-top:12px;">
          <div>
            <div class="label">A</div>
            <input class="input" id="a" placeholder="Es. Pizza" maxlength="80"/>
          </div>
          <div>
            <div class="label">B</div>
            <input class="input" id="b" placeholder="Es. Sushi" maxlength="80"/>
          </div>
        </div>

        <div class="row" style="margin-top:12px;justify-content:space-between;">
          <button class="btn primary" id="go" type="button">⚔️ Combatti</button>
          <button class="btn" id="swap" type="button">🔁 Scambia</button>
        </div>

        <div class="err" id="err"></div>

        <div class="result" id="out" style="display:none;margin-top:12px;">
          <div class="win" id="winner"></div>
          <div class="muted" id="reason"></div>
          <div class="tagline" id="tagline"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from "./firebase.init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { bootCredits, getBalance } from "./store/credits.js";

    const $ = (id) => document.getElementById(id);

    const IS_ADMIN = (() => {
      try { return !!localStorage.getItem("admin_token"); } catch { return false; }
    })();

    function setErr(t=""){ $("err").textContent = t || ""; }
    function showResult(data){
      $("out").style.display = "block";
      $("winner").textContent = `🏆 Vince: ${data.winner}`;
      $("reason").textContent  = data.reason || "";
      $("tagline").textContent = data.tagline || "";
    }
    function hideResult(){
      $("out").style.display = "none";
      $("winner").textContent = "";
      $("reason").textContent = "";
      $("tagline").textContent = "";
    }

    $("homeBtn").onclick = () => location.href = "index.html";
    $("backBtn").onclick = () => (history.length > 1 ? history.back() : (location.href = "index.html"));
    $("buyBtn").onclick = () => location.href = "/store/credit-store.html";

    $("swap").onclick = () => {
      const A = $("a").value;
      $("a").value = $("b").value;
      $("b").value = A;
      hideResult();
      setErr("");
    };

    async function renderCredits(){
      if (IS_ADMIN){
        $("creditsBadge").textContent = "Crediti: ∞ (admin)";
        return;
      }
      if (!auth.currentUser){
        $("creditsBadge").textContent = "Crediti: —";
        return;
      }
      try{
        await bootCredits();
        const bal = await getBalance();
        $("creditsBadge").textContent = `Crediti: ${Number.isFinite(bal) ? bal : 0}`;
      }catch(e){
        console.warn("credits render error", e);
        $("creditsBadge").textContent = "Crediti: —";
      }
    }

    onAuthStateChanged(auth, async (u) => {
      await renderCredits();
      if (!u && !IS_ADMIN){
        // battle usa crediti -> meglio riportare a home/login
        // (puoi commentarlo se vuoi lasciarla accessibile senza login)
        // location.href = "index.html";
      }
    });

    window.addEventListener("focus", renderCredits);
    window.addEventListener("pageshow", renderCredits);

    async function callBattle(){
      setErr("");
      hideResult();

      const a = ($("a").value || "").trim();
      const b = ($("b").value || "").trim();
      const category = ($("cat").value || "cose").trim();

      if (!a || !b){
        setErr("Inserisci sia A che B.");
        return;
      }

      if (!auth.currentUser && !IS_ADMIN){
        setErr("Devi essere loggato per usare i crediti.");
        location.href = "index.html";
        return;
      }

      const btn = $("go");
      const old = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin"></span>Decido…`;

      try{
        let token = null;
        if (auth.currentUser){
          token = await auth.currentUser.getIdToken(true);
        }

        const r = await fetch("/api/battle", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(token ? { "Authorization": `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ a, b, category })
        });

        // 402 -> no credits
        if (r.status === 402){
          const j = await r.json().catch(()=>({}));
          location.href = j.redirect || "/store/credit-store.html";
          return;
        }

        // 401 -> not logged / token invalid
        if (r.status === 401){
          const j = await r.json().catch(()=>({}));
          location.href = j.redirect || "/index.html";
          return;
        }

        const j = await r.json().catch(()=>({}));

        if (!r.ok || !j.ok){
          setErr("Errore server. Riprova.");
          return;
        }

        showResult(j);
        await renderCredits(); // aggiorna badge (server ha scalato)
      }catch(e){
        console.error(e);
        setErr("Errore di rete. Riprova.");
      }finally{
        btn.disabled = false;
        btn.innerHTML = old;
      }
    }

    $("go").onclick = callBattle;

    // Enter per combattere
    ["a","b"].forEach(id=>{
      $(id).addEventListener("keydown",(e)=>{
        if(e.key==="Enter"){ e.preventDefault(); callBattle(); }
      });
    });

    // primo render
    renderCredits();
  </script>
</body>
</html>
