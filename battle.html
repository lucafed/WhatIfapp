<!doctype html>
<html lang="it" data-theme="whatif">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>⚔️ Battle — What?f</title>

  <style>
    :root{
      --bg:#0C0F14; --bg2:#0E1724; --fg:#ffffff; --muted:#A0B2BA;
      --card:rgba(14,19,28,.55); --card-border:rgba(255,255,255,.10);
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#0A0E12;
      --shadow:rgba(0,0,0,.45);
    }
    html[data-theme="whatif"]{
      --bg:#0B1018; --bg2:#0E1724; --fg:#F4F7FB; --muted:#A7B3C2;
      --card:rgba(14,20,28,.55); --card-border:rgba(255,255,255,.12);
      --accent:#1C57A0; --accent2:#FFEC01; --ink:#11110A;
    }
    html[data-theme="wtf"]{
      --bg:#0B0B0C; --bg2:#101414; --fg:#EEF5F0; --muted:#A6B6AD;
      --card:rgba(16,22,20,.55); --card-border:rgba(255,255,255,.10);
      --accent:#3A6B56; --accent2:#5A8C75; --ink:#06110B;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;height:100%;
      background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;
    }

    main{
      max-width:680px;
      margin:0 auto;
      padding:20px 16px 40px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .back{
      text-decoration:none;
      color:var(--muted);
      font-weight:800;
      border:1px solid var(--card-border);
      background:rgba(20,28,34,.55);
      padding:8px 12px;
      border-radius:999px;
      backdrop-filter:blur(10px);
    }

    h1{
      margin:8px 0 2px;
      font-size:clamp(26px,5vw,36px);
      line-height:1.15;
    }

    .lead{
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
      margin:0 0 6px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--card-border);
      border-radius:18px;
      padding:14px;
      box-shadow:0 14px 40px var(--shadow);
      backdrop-filter:blur(10px);
    }

    .row{display:flex;gap:10px;flex-wrap:wrap}

    .pill{
      appearance:none;
      border:1px solid var(--card-border);
      background:#141c22;
      color:var(--fg);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
      opacity:.9;
      transition:.15s;
    }
    .pill:active{transform:translateY(1px)}
    .pill.active{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);
      opacity:1;
      box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
    }

    label{
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      display:block;
      margin-bottom:6px;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid var(--card-border);
      background:#0A0F14;
      color:var(--fg);
      font-size:16px;
      outline:none;
    }
    input::placeholder{color:rgba(160,178,186,.7)}

    .cta{
      margin-top:10px;
      border:none;
      border-radius:24px;
      padding:14px 18px;
      font-weight:950;
      cursor:pointer;
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:var(--ink);
      box-shadow:0 0 14px rgba(0,0,0,.35);
      transition:.15s;
      width:100%;
    }
    .cta:active{transform:translateY(1px)}
    .cta[disabled]{opacity:.55;cursor:not-allowed}

    .mini{
      margin-top:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .result{display:none;margin-top:6px}
    .winner{font-size:22px;font-weight:950;margin-top:6px}
    .reason{font-size:16px;line-height:1.45;margin-top:10px}
    .tagline{margin-top:8px;font-weight:900;opacity:.92}

    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .ghost{
      border-radius:999px;
      border:1px solid var(--card-border);
      padding:10px 14px;
      background:#141c22;
      color:var(--fg);
      font-weight:900;
      cursor:pointer;
    }
    .ghost:active{transform:translateY(1px)}

    .error{
      margin-top:10px;
      color:#ffb3b3;
      font-size:13px;
      font-weight:800;
      min-height:18px;
    }
  </style>
</head>

<body>
<main>
  <div class="top">
    <a href="index.html" class="back">← Home</a>
  </div>

  <h1>⚔️ Battle</h1>
  <p class="lead">
    Metti due cose a confronto. Il giudice decide. Tu puoi solo non essere d’accordo.
  </p>

  <div class="card">
    <label>Categoria</label>
    <div class="row" id="cats">
      <button class="pill active" data-cat="persone">🧑‍🤝‍🧑 Persone</button>
      <button class="pill" data-cat="cose">🍕 Cose</button>
      <button class="pill" data-cat="scelte">🧠 Scelte</button>
    </div>
  </div>

  <div class="card">
    <label>A</label>
    <input id="a" placeholder="Es: Pizza / Io / Rischiare" autocomplete="off" />

    <div style="height:10px"></div>

    <label>B</label>
    <input id="b" placeholder="Es: Sushi / Il mio amico / Accontentarsi" autocomplete="off" />

    <button class="cta" id="judge">GIUDICA (−1 credito)</button>

    <div class="mini">
      <span id="creditsHint">Serve login: usa i tuoi crediti.</span>
      <a href="/store/credit-store.html" style="color:var(--accent);text-decoration:none;font-weight:900;">
        Compra crediti
      </a>
    </div>

    <div class="error" id="err"></div>
  </div>

  <div class="card result" id="result">
    <div class="winner" id="winner"></div>
    <div class="reason" id="reason"></div>
    <div class="tagline" id="tagline"></div>

    <div class="actions">
      <button class="ghost" id="copy">📋 Copia</button>
      <button class="ghost" id="share">📤 Condividi</button>
      <button class="ghost" id="again">🔁 Ancora</button>
    </div>
  </div>
</main>

<script>
  // tema coerente con home (whatif/wtf)
  (function(){
    try{
      const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');
      document.documentElement.setAttribute('data-theme', prefs.stile === 'wtf' ? 'wtf' : 'whatif');
    }catch{
      document.documentElement.setAttribute('data-theme','whatif');
    }
  })();
</script>

<script type="module">
  import { auth } from "./firebase.init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

  let category = "persone";
  let last = null;

  const $ = (s)=>document.querySelector(s);
  const errEl = $("#err");
  const judgeBtn = $("#judge");
  const creditsHint = $("#creditsHint");

  // categoria
  $("#cats").addEventListener("click",(e)=>{
    const b = e.target.closest(".pill");
    if(!b) return;
    document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
    b.classList.add("active");
    category = b.dataset.cat || "persone";
  });

  function setErr(t){ errEl.textContent = t || ""; }

  function shareText(d){
    return `⚔️ Battle\nA: ${d.a}\nB: ${d.b}\n🏆 Vince: ${d.winner}\n${d.reason}\n${d.tagline ? "— " + d.tagline : ""}`;
  }

  // UI login hint
  onAuthStateChanged(auth, (user)=>{
    if(user){
      creditsHint.textContent = "Ok: user loggato. Ogni giudizio scala 1 credito.";
      judgeBtn.disabled = false;
    }else{
      creditsHint.textContent = "Serve login: torna alla Home e fai accesso.";
      judgeBtn.disabled = false; // lasciamo cliccabile per mandarlo a home con messaggio
    }
  });

  // GIUDICA (con crediti)
  judgeBtn.addEventListener("click", async ()=>{
    setErr("");

    const a = $("#a").value.trim();
    const b = $("#b").value.trim();
    if(!a || !b){ setErr("Inserisci A e B."); return; }

    const user = auth.currentUser;
    if(!user){
      // crediti = utente
      window.location.href = "index.html";
      return;
    }

    judgeBtn.disabled = true;

    let idToken = "";
    try{
      idToken = await user.getIdToken();
    }catch(e){
      judgeBtn.disabled = false;
      setErr("Errore sessione: rifai login.");
      window.location.href = "index.html";
      return;
    }

    let resp, data;
    try{
      resp = await fetch("/api/battle",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + idToken
        },
        body: JSON.stringify({ a, b, category })
      });
      data = await resp.json().catch(()=>({}));
    }catch(e){
      judgeBtn.disabled = false;
      setErr("Errore rete. Riprova.");
      return;
    }

    judgeBtn.disabled = false;

    // ✅ NO CREDITI → store
    if(resp.status === 402 || data?.error === "no_credits"){
      window.location.href = data.redirect || "/store/credit-store.html";
      return;
    }

    if(!resp.ok){
      setErr("Errore Battle. Riprova.");
      return;
    }

    last = { ...data, a, b };

    $("#winner").textContent = "🏆 Vince: " + (data.winner || "—");
    $("#reason").textContent = data.reason || "";
    $("#tagline").textContent = data.tagline ? `“${data.tagline}”` : "";
    $("#result").style.display = "block";

    // opzionale: aggiorna testo bottone con crediti residui
    if(typeof data.creditsLeft === "number"){
      judgeBtn.textContent = `GIUDICA (−1 credito) · rimasti ${data.creditsLeft}`;
    }
  });

  $("#copy").addEventListener("click", async ()=>{
    if(!last) return;
    try{
      await navigator.clipboard.writeText(shareText(last));
      setErr("Copiato!");
      setTimeout(()=>setErr(""),900);
    }catch{
      setErr("Impossibile copiare.");
    }
  });

  $("#share").addEventListener("click", async ()=>{
    if(!last) return;
    const text = shareText(last);
    if(navigator.share){
      try{ await navigator.share({ text }); }catch{}
    }else{
      try{
        await navigator.clipboard.writeText(text);
        setErr("Testo copiato (incolla dove vuoi).");
        setTimeout(()=>setErr(""),1200);
      }catch{
        setErr("Condivisione non supportata.");
      }
    }
  });

  $("#again").addEventListener("click", ()=>{
    $("#result").style.display = "none";
    $("#a").value = "";
    $("#b").value = "";
    setErr("");
  });
</script>
</body>
</html>
