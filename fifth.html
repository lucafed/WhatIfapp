<!-- ============================
     fifth.html — What?f Result (final, locked)
     - Mantiene palette e UI originali
     - Mostra SEMPRE un solo paragrafo (ritmo esempio)
     ============================ -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:radial-gradient(800px 600px at 25% 20%,var(--bg2),var(--bg));
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:820px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{
  background:rgba(20,28,34,.9);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px; padding:18px; backdrop-filter:blur(10px);
  margin-top:16px
}
/* Mostriamo sempre UN paragrafo scorrevole */
.story{white-space:normal; line-height:1.68; font-size:18px; letter-spacing:.1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
.input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;min-height:46px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <button class="btn ghost" id="langBtn">IT</button>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="lblQ">La tua domanda</div>
    <div class="input" id="qView"></div>
  </div>

  <div class="card">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="lblA">Risposta</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const lang = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

const I18N={
  it:{tWTF:"⚡ What the F — Risultato", tWHF:"💡 What if — Risultato",
      sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
      share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
      copied:"Copiato!", error:"[errore server]"},
  en:{tWTF:"⚡ What the F — Result", tWHF:"💡 What if — Result",
      sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
      share:"📤 Share / Copy", again:"🔁 Ask another", copied:"Copied!", error:"[server error]"}
}[lang];

const $ = (id)=>document.getElementById(id);
$('langBtn').textContent=lang.toUpperCase();
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };

$('lblQ').textContent=I18N.q;
$('lblA').textContent=I18N.a;
$('shareBtn').textContent=I18N.share;
$('againBtn').textContent=I18N.again;

const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';

let domanda=""; let answerText="";

// Un paragrafo pulito
function normalizeOneParagraph(s=""){
  return String(s)
    .replace(/\s*\n+\s*/g," ")
    .replace(/\s{2,}/g," ")
    .replace(/\s+([.,;:!?])/g,"$1")
    .trim();
}

function setHeaders(){
  $('title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
}

if(isReplay){
  setHeaders();
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  answerText = normalizeOneParagraph(r.answer || "");
  $('subtitle').textContent = I18N.sub(domanda);
  $('qView').textContent = domanda || '—';
  $('answer').textContent = answerText || '—';
}else{
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  setHeaders();
  $('subtitle').textContent = I18N.sub(domanda);
  $('qView').textContent = domanda || '—';

  (async ()=>{
    try{
      const r = await fetch("/api/ask",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ domanda, lang, stile:style, extra:"", micro:req.micro||{} })
      });
      const data = await r.json();
      if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
      answerText = normalizeOneParagraph((data.answer||"").trim());
      $('answer').textContent = answerText;

      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:answerText, stile:style, ts:Date.now() });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
    }catch(e){
      $('answer').textContent = I18N.error;
      console.error(e);
    }
  })();
}

// Share / Copy
$('shareBtn').onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n\nQ: ${domanda}\n\n${normalizeOneParagraph(answerText)}`;
  try{
    if(navigator.share){
      await navigator.share({ title: "What?f", text: full });
    }else{
      await navigator.clipboard.writeText(full);
      $('shareBtn').textContent = I18N.copied;
      setTimeout(()=>$('shareBtn').textContent=I18N.share,1200);
    }
  }catch{}
};

$('againBtn').onclick=()=>{ location.href='fourth.html'; };
</script>
</body>
</html>
