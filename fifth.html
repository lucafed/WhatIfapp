<!-- FILE: fifth.html (COMPLETO) -->
<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:#A0B2BA}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* === PERCENT === */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;
  min-width:64px;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px rgba(255,255,1,.18);
}

/* === RESULT BOX === */
.result-box{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28);
}
.result-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.result-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;min-width:64px;padding:5px 10px;border-radius:12px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px rgba(255,255,1,.18);
}
.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}

/* === MOTIVO === */
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .ico{font-size:18px;line-height:1.2;display:none}
.mot .name{display:none}
.mot .note{font-size:15px;line-height:1.6;color:var(--fg);opacity:.92}

/* Chips (nascoste di default) */
.chips{display:none;gap:6px;flex-wrap:wrap;margin-top:10px;opacity:.9}
.chip{font-size:11px;font-weight:900;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}

/* Mobile */
@media (max-width:420px){
  .result-pct,.top-pct{font-size:15px;min-width:56px;padding:4px 8px}
  .result-title{font-size:14px}
  .mot .note{font-size:15.5px;line-height:1.65}
}

/* === Overlay (store/rewarded) === */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:9999}
#overlay-frame{width:100%;max-width:520px;height:78vh;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,28,34,.95);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:700;z-index:10000;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>
</head>

<body>
<main>
  <div class="topbar" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <select id="langSelect" class="select" aria-label="Language">
        <option value="it">IT · Italiano</option>
        <option value="en">EN · English</option>
        <option value="es">ES · Español</option>
        <option value="fr">FR · Français</option>
        <option value="de">DE · Deutsch</option>
      </select>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>

    <div class="pct-row">
      <span class="pct-label" id="pctLabel">% probabilità che accada</span>
      <div id="topPct" class="top-pct" aria-live="polite">—</div>
    </div>

    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>

    <div class="hr"></div>
    <div class="label" id="lblP">Esito & motivazioni</div>

    <div class="result-box" id="resultBox">
      <div class="result-head">
        <span class="pct-label" id="pctLabelBottom">% probabilità che accada</span>
        <div id="bottomPct" class="result-pct">—</div>
        <span class="result-title" id="committeeTitle">—</span>
      </div>

      <div class="mot" id="motOne">
        <div class="ico" id="motIco" aria-hidden="true">—</div>
        <div>
          <div class="name" id="motName">—</div>
          <div class="chips" id="chipsWrap">
            <span class="chip" id="chipFav">—</span>
            <span class="chip" id="chipCon">—</span>
            <span class="chip" id="chipAst">—</span>
          </div>
          <div class="note" id="motNote">—</div>
        </div>
      </div>
    </div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>

  <p class="small" id="creditInfo" style="text-align:center;margin:10px 0 24px"></p>
</main>

<!-- Overlay Store/Ads -->
<div id="overlay" aria-hidden="true">
  <iframe id="overlay-frame" src="about:blank" title="modal"></iframe>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* ========= IMPORT ========= */
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import { bootCredits, getBalance, consumeCredit, grantAdCredit } from "/credits.js";

/* ========= GUARD LOGIN ========= */
const auth = getAuth();
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "index.html?login=1"; return; }
  await bootCredits();      // crea doc + ricarica giornaliera sicura se serve
  await updateCreditLine(); // mostra saldo reale
  startFlow(user);          // avvia logica pagina
});

/* ========= PREFS / I18N BASE ========= */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

const SUP_LANG=['it','en','es','fr','de'];
function detectLang(text=''){
  const t=(text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank={
    it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
    en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
    es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
    fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
    de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]
  };
  const score={}; for(const L of SUP_LANG){ score[L]=0; (bank[L]||[]).forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1; for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){ const nav=(navigator.language||'it').slice(0,2).toLowerCase(); if(SUP_LANG.includes(nav)) return nav; }
  return best;
}
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';
const manualLang = LS.getItem('lang_manual')==='1';
let lang = manualLang ? (SUP_LANG.includes((LS.getItem('lang')||'').toLowerCase()) ? (LS.getItem('lang')||'it').toLowerCase() : 'it') : detectLang(domandaEarly);
if(!SUP_LANG.includes(lang)) lang='it';
document.documentElement.lang=lang;

const I18N = {
  it:{ titleWTF:"⚡ What the F — Risultato", titleWHF:"💡 What if — Risultato",
       sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
       p:"Esito & motivazioni", share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
       copied:"Copiato!", error:"[errore server]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       pctLabel:"% probabilità che accada",
       votersTitle:"Comitato", seriousTitle:"Motivazione", scientificTitle:"Motivazione (scientifica)",
       credits:(n)=>`💰 Crediti: ${n}`, noCredits:"Hai terminato i crediti.",
       toastPlus:(n)=>`+${n} credito`, toastMinus:(n)=>`-${n} credito`
  },
  en:{ titleWTF:"⚡ What the F — Result", titleWHF:"💡 What if — Result",
       sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
       p:"Outcome & rationales", share:"📤 Share / Copy", again:"🔁 Ask another",
       copied:"Copied!", error:"[server error]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       pctLabel:"% probability it happens",
       credits:(n)=>`💰 Credits: ${n}`, noCredits:"You ran out of credits.",
       toastPlus:(n)=>`+${n} credit`, toastMinus:(n)=>`-${n} credit`
  }
};
const t = ()=> I18N[lang] || I18N.it;

/* ========= UI refs ========= */
const $ = s => document.querySelector(s);
const subtitle=$('#subtitle'), lblQ=$('#lblQ'), lblA=$('#lblA'), qView=$('#qView');
const leadNode=$('#lead'), answerEl=$('#answer'), shareBtn=$('#shareBtn'), againBtn=$('#againBtn');
const metaInfo=$('#metaInfo'), styleBadge=$('#styleBadge'), topPct=$('#topPct'), bottomPct=$('#bottomPct');
const pctLabelTop=$('#pctLabel'), pctLabelBottom=$('#pctLabelBottom'), committeeTitle=$('#committeeTitle');
const motIco=$('#motIco'), chipFav=$('#chipFav'), chipCon=$('#chipCon'), chipAst=$('#chipAst'), chipsWrap=$('#chipsWrap');
const motNote=$('#motNote'), creditInfo=$('#creditInfo'), toastEl=$('.toast');

/* ========= Toast ========= */
function toast(msg){ if(!toastEl) return; toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1500); }

/* ========= Overlay (Store + Rewarded) ========= */
const overlay = $('#overlay');
const overlayFrame = $('#overlay-frame');
let overlayTimer = null, rewardTimer = null, rewardGranted = false;

function storeFallbackHTML(){
  const msgNo = (t().noCredits || "Crediti terminati.");
  const label = (lang==='en') ? "Watch ad (+1)" : "Guarda pubblicità (+1)";
  const close = (lang==='en') ? "Close" : "Chiudi";
  return `
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0B0F14;color:#EAF3EE}
.wrap{max-width:520px;margin:auto;padding:16px}
.card{background:#141C22;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin-top:10px}
h2{margin:4px 0 6px;font-size:18px}
.btn{display:inline-block;margin:6px 6px 0 0;padding:10px 12px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
.ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12)}
.primary{background:linear-gradient(180deg,#1C57A0,#FFEC01);color:#0A0E12}
.small{color:#A0B2BA;font-size:12px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px}
</style></head><body>
<div class="wrap"><div class="card">
  <h2>Crediti</h2>
  <p class="small" id="msg">${msgNo}</p>
  <div class="row">
    <button class="btn ghost" id="adBtn">${label}</button>
    <button class="btn ghost" id="closeBtn">${close}</button>
  </div>
</div></div>
<script>
  document.getElementById('adBtn').onclick=()=>{
    // countdown 12s e poi segnala completamento
    const b=this, btn=document.getElementById('adBtn'); let s=12; const lab=btn.textContent;
    const iv=setInterval(()=>{ s--; btn.textContent=lab+' ('+s+'s)'; if(s<=0){ clearInterval(iv); parent.postMessage({type:'rewarded_completed', amount:1}, '*'); } },1000);
  };
  document.getElementById('closeBtn').onclick=()=>{ parent.postMessage({type:'close_overlay'}, '*'); };
<\/script>
</body></html>`;
}

function openOverlay(url){
  overlay.style.display='grid';
  overlay.setAttribute('aria-hidden','false');
  overlayFrame.removeAttribute('srcdoc');
  overlayFrame.src='about:blank';
  // fallback tra 1.2s se la pagina non carica
  try{ clearTimeout(overlayTimer);}catch{}
  overlayTimer = setTimeout(()=>{ overlayFrame.setAttribute('srcdoc', storeFallbackHTML()); }, 1200);
  const sep = url.includes('?') ? '&' : '?';
  overlayFrame.onload = ()=>{ try{ clearTimeout(overlayTimer);}catch{} };
  overlayFrame.src = `${url}${sep}lang=${encodeURIComponent(lang)}`;
}

function closeOverlay(){
  overlay.style.display='none';
  overlay.setAttribute('aria-hidden','true');
  overlayFrame.src='about:blank';
  overlayFrame.removeAttribute('srcdoc');
  try{ clearTimeout(overlayTimer);}catch{}
  try{ clearTimeout(rewardTimer);}catch{}
}

function openStore(){ openOverlay("/store/credit-store.html"); }
function openRewarded(){
  rewardGranted = false;
  openOverlay("/ads/rewarded.html");
  try{ clearTimeout(rewardTimer);}catch{}
  // fallback: se entro 20s non arriva "rewarded_completed", accredita 1 e chiudi
  rewardTimer = setTimeout(async ()=>{
    if(!rewardGranted){
      await grantAdCredit().catch(()=>{});
      await updateCreditLine();
      toast(t().toastPlus ? t().toastPlus(1) : "+1 credito");
      rewardGranted = true;
      closeOverlay();
      location.replace('fourth.html');
    }
  }, 20000);
}

window.addEventListener("message", async (ev)=>{
  const d = ev.data || {};
  if(d.type === "open_rewarded"){ openRewarded(); return; }
  if(d.type === "rewarded_completed"){
    rewardGranted = true;
    try{ clearTimeout(rewardTimer);}catch{}
    await grantAdCredit().catch(()=>{});
    await updateCreditLine();
    toast(t().toastPlus ? t().toastPlus(d.amount||1) : "+1 credito");
    closeOverlay();
    location.replace('fourth.html');
    return;
  }
  if(d.type === "close_overlay"){
    closeOverlay();
    return;
  }
});

/* ========= helpers ========= */
function setText(el,txt){ if(typeof el==="string") el=$(el); if(el) el.textContent=txt; }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+='.'; return t; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }

const LEADS = {
  it:{ wtf:["Entri piano, il caos ti riconosce e oggi ti lascia passare.","Respiri e lasci che sia il destino a inciampare per primo."],
       whatif:["Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.","La stanza è la stessa, lo sguardo no: è già un inizio."]},
  en:{ wtf:["You step in slowly; chaos recognizes you and lets you through.","Breathe; let chance trip before you do."],
       whatif:["Set the keys down and let the quiet that doesn’t judge go first.","Same room, different gaze — that’s already a start."]}
};

function applyUI(q){
  const T=t();
  setText('#title', style==='wtf'?T.titleWTF:T.titleWHF);
  setText('#subtitle', T.sub(q||'—')); setText('#lblQ', T.q); setText('#lblA', T.a); setText('#lblP', (style==='wtf')?'Motivazione (scientifica)':'Motivazione');
  $('#styleBadge').textContent=(style==='wtf')?T.styleWTF:T.styleWHF;
  setText('#pctLabel', T.pctLabel); if($('#pctLabelBottom')) setText('#pctLabelBottom', T.pctLabel);
  const bank=(LEADS[lang]&&LEADS[lang][style])?(LEADS[lang][style]):(LEADS.it[style]||LEADS.it.whatif);
  $('#lead').textContent = oneSentence(pick(bank)||'')||'—';
}

/* ========= credit line ========= */
async function updateCreditLine(){
  try{
    const n = await getBalance();
    setText('#creditInfo', (t().credits ? t().credits(n) : `Crediti: ${n}`));
  }catch{
    setText('#creditInfo', '');
  }
}

/* ========= main flow ========= */
async function startFlow(user){
  // lingua select
  $('#langSelect').value = lang;
  $('#langSelect').addEventListener('change', ()=>{
    const v=$('#langSelect').value;
    LS.setItem('lang',v); LS.setItem('lang_manual','1'); location.reload();
  });

  // mostra domanda e UI
  const req=JSON.parse(LS.getItem('whatif_request')||'{}');
  const domanda=req.domanda || LS.getItem('domanda') || '';
  applyUI(domanda);
  setText('#qView', domanda || '—');

  // **CONSUMO CREDITI prima della chiamata**
  const hasCredit = await consumeCredit().catch(()=>false);
  if (!hasCredit) {
    setText('#answer', t().noCredits);
    openStore();
    return;
  }
  await updateCreditLine();
  toast(t().toastMinus ? t().toastMinus(1) : "-1 credito");

  // chiama API con ID token
  const idToken = await user.getIdToken(true);
  const headers = {
    "content-type":"application/json",
    "authorization": `Bearer ${idToken}`
  };
  // opzionale: mantieni compat con pro/admin dei tuoi header legacy
  const adminToken = LS.getItem("admin_token"); if(adminToken) headers["x-admin-token"]=adminToken;
  if(prefs.pro===true) headers["x-pro"]="1";

  try{
    const r = await fetch("/api/ask",{
      method:"POST",
      headers,
      body: JSON.stringify({
        domanda, lang, stile: style, periodo,
        system: (style==='wtf' ? "WHAT_THE_F" : "WHAT_IF"),
        extra:"", micro: (req && req.micro) || {}
      })
    });
    const data = await r.json().catch(()=>null);
    if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

    const answerText = String(data.answer||'').trim();
    setText('#answer', answerText);

    const apiPct = (data && Number.isFinite(+data.pct)) ? Math.max(0, Math.min(100, Math.round(+data.pct))) : null;
    const usedPct = (apiPct!=null) ? apiPct : 62;
    const pStr = usedPct + "%";
    setText('#topPct', pStr); setText('#bottomPct', pStr);

    const mot = (style==='wtf')
      ? (data && data.scientific) || "Nota scientifica: i piccoli passi consistenti vincono sui grandi sforzi saltuari (abitudini > forza di volontà)."
      : (data && data.motivation) || "Motivo: benefici concreti a breve, con vincoli gestibili.";
    setText('#motNote', mot);

    // cronologia locale (non influisce sui crediti)
    const hist=JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now(), pct:usedPct });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
  }catch(e){
    console.error(e);
    setText('#answer', t().error);
  }
}

/* ========= nav / share ========= */
$('#backBtn').onclick = ()=> history.length>1 ? history.back() : location.replace('index.html');
$('#homeBtn').onclick = ()=> location.href='index.html';
$('#shareBtn').onclick = async ()=>{
  const domanda = LS.getItem('domanda') || '';
  const text = `What?f — ${style.toUpperCase()}\n(${periodo})\n\nQ: ${domanda}\n\n${$('#answer').textContent}`;
  try{
    if(navigator.share){ await navigator.share({title:"What?f", text}); }
    else{ await navigator.clipboard.writeText(text); const b=$('#shareBtn'); b.textContent=(t().copied||"Copiato!"); setTimeout(()=>b.textContent=t().share,1200); }
  }catch{}
};
$('#againBtn').onclick = ()=>{ location.href='fourth.html'; };
</script>
