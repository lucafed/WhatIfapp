<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risultato</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
  :root{--bg:#0B0B0C;--bg2:#101414;--fg:#FFF;--muted:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01;--chip:#121A26;--line:rgba(255,255,255,.12);--ink:#0A0E12;--card:rgba(20,28,34,.92)}
  html[data-theme="wtf"]{--acc:#3A6B56;--acc2:#5A8C75}
  *{box-sizing:border-box} html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:980px;margin:auto;padding:18px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}
  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  pre.answer{white-space:pre-wrap;line-height:1.5;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:16px;border-radius:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meta{font-size:12px;color:var(--muted)}
  .pill{border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:6px 10px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" onclick="history.back()">←</button>
      <button class="btn" onclick="location.href='index.html'">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="modeBadge" style="display:none"></span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <div class="card">
    <div class="label" id="qLabel">La tua domanda</div>
    <div class="pill" id="questionBox">—</div>
  </div>

  <div class="card">
    <div class="label" id="resLabel">Risultato</div>
    <pre id="answerBox" class="answer">…</pre>
  </div>

  <div class="card">
    <div class="label" id="contLabel">Domani continuiamo da qui</div>
    <div id="fuWrap" class="chips"></div>
    <div class="meta" style="margin-top:8px" id="orMeta">oppure</div>
    <input id="freeInput" class="pill" style="width:100%;font-size:16px" placeholder="Scrivi qui cosa vuoi chiedere domani…" />
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="btn" id="saveFU">Salva per domani</button>
    </div>
  </div>
</main>

<script>
const LS=localStorage;
const I18N={it:{ql:"La tua domanda",rl:"Risultato",cl:"Domani continuiamo da qui",or:"oppure",ph:"Scrivi qui cosa vuoi chiedere domani…",save:"Salva per domani"},en:{ql:"Your question",rl:"Result",cl:"Tomorrow let’s continue from here",or:"or",ph:"Write what you want to ask tomorrow…",save:"Save for tomorrow"}};
let lang=(LS.getItem('lang')||'it').toLowerCase(); const T=I18N[lang]||I18N.it; document.getElementById('langBtn').textContent=lang.toUpperCase(); document.documentElement.lang=lang;

const $=id=>document.getElementById(id);
$('qLabel').textContent=T.ql; $('resLabel').textContent=T.rl; $('contLabel').textContent=T.cl; $('orMeta').textContent=T.or; $('freeInput').placeholder=T.ph; $('saveFU').textContent=T.save;

const prefs=JSON.parse(LS.getItem('whatif_prefs')||'{}'); document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
$('langBtn').onclick=()=>{LS.setItem('lang',lang==='it'?'en':'it');location.reload()};

function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}

/* ---- capire se sto aprendo una risposta salvata ---- */
const viewId = LS.getItem('view_id');  // messo dalla 4ª quando premo ▶
const historyArr = readJSON('cronologia',[]);
let loaded = null;

if (viewId) {
  loaded = historyArr.find(x=>String(x.id)===String(viewId));
  LS.removeItem('view_id');
}

const domanda = loaded?.domanda || (LS.getItem('domanda')||'').trim();
$('questionBox').textContent = domanda || '—';

/* ---- mostra o genera ---- */
async function getFollowups(q, a){
  try{
    const r = await fetch('/api/followups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,answer:a,lang,style:prefs.stile||'whatif'})});
    const js = await r.json();
    return Array.isArray(js?.followups) ? js.followups.slice(0,2) : [];
  }catch{return []}
}

function paintFollowups(list){
  const box=$('fuWrap'); box.innerHTML='';
  list.forEach(txt=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=txt;
    b.onclick=()=>{$('freeInput').value=txt};
    box.appendChild(b);
  });
}

async function showExisting(item){
  $('answerBox').textContent = item.answer || '—';
  paintFollowups(await getFollowups(item.domanda, item.answer));
}

async function generateFresh(){
  $('answerBox').textContent='…';
  const buf = readJSON('whatif_clarify_buffer', {});
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domanda,lang,stile:(prefs.stile||'whatif'),profilo:readJSON('profilo',{}),extra:(buf?.extra||"")})});
    const js = await r.json();
    const ans = js?.answer || '—';
    $('answerBox').textContent = ans;

    // salva in cronologia (con risposta) — serve per il play della 4ª
    const id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const entry = { id, domanda, answer: ans, stile:(prefs.stile||'whatif'), ts: Date.now() };
    const arr = readJSON('cronologia',[]); arr.push(entry); writeJSON('cronologia',arr);

    paintFollowups(await getFollowups(domanda, ans));
  }catch(e){
    $('answerBox').textContent='Errore server';
  }
}

/* avvio */
if (loaded) { showExisting(loaded); } else { generateFresh(); }

/* salva follow-up scelto o scritto */
$('saveFU').onclick=()=>{
  const text = $('freeInput').value.trim(); if(!text) return;
  const q = readJSON('followup_queue',[]);
  q.push({ text, base:domanda, stile:(prefs.stile||'whatif'), ts:Date.now() });
  writeJSON('followup_queue',q);
  $('freeInput').value='';
  alert(lang==='it'?'Salvato per domani.':'Saved for tomorrow.');
};
</script>
</body>
</html>
