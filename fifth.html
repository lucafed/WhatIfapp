<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(800px 600px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{background:rgba(20,28,34,.9);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.story{white-space:pre-wrap;line-height:1.65;font-size:18px;letter-spacing:.1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
textarea{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);font-size:16px}
.small{font-size:12px;color:var(--muted)}
.input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px}
.sugg{cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <button class="btn ghost" id="langBtn">IT</button>
  </div>

  <h1 id="title">Episodio 1 di 3</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="lblA">Risultato</div>
    <div id="answer" class="story">⏳ Genero la storia...</div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>

  <div class="card" id="followCard" style="display:none">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="followTitle">Suggerimenti per domani</div>
    <div id="followList" class="story" style="font-size:16px"></div>
    <div class="row" style="margin-top:10px">
      <textarea id="customFollow" rows="2" placeholder="Aggiungi la tua micro-domanda per domani…"></textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <button class="btn ghost" id="doneBtn">✅ Fatto</button>
    </div>
    <p class="small" id="saveInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const lang = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

const I18N={
  it:{
    tWTF:"⚡ What the F — Episodio 1 di 3",
    tWHF:"💡 What?f — Episodio 1 di 3",
    sub:(q)=>`Domanda: “${q}”`,
    q:"La tua domanda", a:"Risultato",
    share:"📤 Condividi / Copia",
    saved:"✅ Salvato per domani.",
    follow:"Suggerimenti per domani",
    add:"Aggiungi la tua micro-domanda per domani…",
    done:"✅ Fatto",
    copied:"Copiato!",
    error:"[errore server]",
  },
  en:{
    tWTF:"⚡ What the F — Episode 1 of 3",
    tWHF:"💡 What?f — Episode 1 of 3",
    sub:(q)=>`Question: “${q}”`,
    q:"Your question", a:"Result",
    share:"📤 Share / Copy",
    saved:"✅ Saved for tomorrow.",
    follow:"Suggestions for tomorrow",
    add:"Add your micro-question for tomorrow…",
    done:"✅ Done",
    copied:"Copied!",
    error:"[server error]",
  }
}[lang];

document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };

document.getElementById('lblQ').textContent=I18N.q;
document.getElementById('lblA').textContent=I18N.a;
document.getElementById('shareBtn').textContent=I18N.share;

// context
const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';

let domanda = "";
let answerText = "";
let micro = JSON.parse(LS.getItem('micro_profile')||'{}');

if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  answerText = r.answer || "";
  document.getElementById('title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
  document.getElementById('subtitle').textContent = I18N.sub(domanda);
  document.getElementById('qView').textContent = domanda || '—';
  document.getElementById('answer').textContent = answerText || '—';
  document.getElementById('followCard').style.display='none'; // niente teaser in replay
} else {
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  micro   = req.micro || micro;
  const extra = req.extra || "";
  const fantasy_mode = !!req.fantasy_mode;

  document.getElementById('title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
  document.getElementById('subtitle').textContent = I18N.sub(domanda);
  document.getElementById('qView').textContent = domanda || '—';

  (async ()=>{
    try{
      const r = await fetch("/api/ask",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ domanda, lang, stile:style, extra, micro, fantasy_mode })
      });
      const data = await r.json();
      if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
      answerText = (data.answer||"").trim();
      document.getElementById('answer').textContent = answerText;

      // salva cronologia
      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:answerText, stile:style, ts:Date.now() });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

      // suggerimenti coerenti (teaser per domani)
      await buildSuggestions(answerText, req);
    }catch(e){
      document.getElementById('answer').textContent = I18N.error;
      console.error(e);
    }
  })();
}

// Share / Copy
document.getElementById('shareBtn').onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What?f'}\n\nQ: ${domanda}\n\n${answerText}`;
  try{
    if(navigator.share){
      await navigator.share({ title: "What?f", text: full });
    }else{
      await navigator.clipboard.writeText(full);
      document.getElementById('shareBtn').textContent = I18N.copied;
      setTimeout(()=>document.getElementById('shareBtn').textContent=I18N.share,1200);
    }
  }catch{}
};

// Suggerimenti
async function buildSuggestions(ans, req){
  const card = document.getElementById('followCard');
  const list = document.getElementById('followList');
  document.getElementById('followTitle').textContent = I18N.follow;
  list.textContent = "…";
  try{
    const rr = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ domanda, lang, stile:style, follow:true, answer: ans, micro })
    });
    const dj = await rr.json();
    const arr = Array.isArray(dj.followups) ? dj.followups.slice(0,2) : [];
    list.innerHTML = arr.length ? arr.map(q=>`• ${q}`).join("\n") :
      (lang==='en' ? "• A small sign we should track\n• One detail to test tomorrow" :
                     "• Un piccolo segnale da osservare\n• Un dettaglio da testare domani");

    // click on suggestion → fill custom
    list.querySelectorAll('br'); // ensure formatting
    card.style.display='block';
    list.classList.add('sugg');
    list.onclick=(e)=>{
      const sel = window.getSelection()?.toString();
      const pick = (sel && sel.trim()) ? sel.trim() : (arr[0]||"");
      document.getElementById('customFollow').value = pick;
    };
  }catch(e){
    console.error("suggestions error", e);
    card.style.display='block';
    list.textContent = (lang==='en' ? "Two ideas ready for tomorrow." : "Due spunti pronti per domani.");
  }

  // Save for tomorrow
  document.getElementById('customFollow').placeholder = I18N.add;
  document.getElementById('saveBtn').onclick=()=>{
    const v = (document.getElementById('customFollow').value||"").trim();
    if(!v) { document.getElementById('customFollow').focus(); return; }
    const saved = JSON.parse(LS.getItem('next_prompts')||'[]');
    saved.unshift({ q:v, stile:style, lang, ts:Date.now() });
    LS.setItem('next_prompts', JSON.stringify(saved.slice(0,50)));
    document.getElementById('saveInfo').textContent = I18N.saved;
  };
  document.getElementById('doneBtn').onclick=()=> location.href='fourth.html';
}
</script>
</body>
</html>
