<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Result</title>
<meta name="theme-color" content="#0A0F14" />
<style>
  :root{
    --bg:#0A0F14; --card:#141C22; --muted:#A0B2BA;
    --fg:#E6F2F5; --acc:#00E0FF; --acc2:#00B5CC; --chip:#0f1820; --ink:#001f26;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{appearance:none;border:none;background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer;transition:opacity .2s}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);font-weight:800}
  .btn.ghost{background:transparent;border:1px solid #1d2b34}
  .btn.large{padding:14px 18px;font-size:16px}
  .btn:hover{opacity:.9}
  h1{font-size:clamp(24px,5vw,32px);margin:16px 0 4px}
  p.sub{color:var(--muted);margin:0 0 12px}
  .hint{color:#cfe3e7;opacity:.9;font-size:13px;margin-top:6px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px rgba(0,0,0,.25)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .box{background:#0b1218;border:1px solid #18242c;border-radius:12px;padding:12px;white-space:pre-wrap}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#0f1820;border:1px solid #1b2a34;color:#cfe3e7;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
  #result{min-height:180px;line-height:1.6}
  .tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .divider{height:1px;background:#16222b;margin:16px 0}
  .badge{background:#0f1820;border:1px solid #1b2a34;border-radius:999px;padding:6px 10px;font-size:12px;color:#cfe3e7;user-select:none}
  .badge.accent{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);border:none;font-weight:800}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
  .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid #1d2b34}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,#0d151c 0%,#122029 50%,#0d151c 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  .qitem{margin:10px 0}
  .qitem label{display:block;margin:6px 0}
  .qitem input, .qitem textarea{width:100%;background:#0f1820;color:var(--fg);border:1px solid #1b2a34;border-radius:10px;padding:10px}
</style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="row">
        <button class="btn ghost" id="backBtn">←</button>
        <button class="btn ghost" id="homeBtn">🏠</button>
      </div>
      <div class="row" style="gap:8px">
        <span id="freeBadge" class="badge" title="">—</span>
        <span id="clarifyBadge" class="badge accent" title="">—</span>
      </div>
    </div>

    <h1 id="titleH1">Your scenario</h1>
    <p class="sub" id="subtitle">For a more personal answer, use Clarify & Generate first.</p>

    <!-- STILE + PERIOD -->
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="row">
          <span class="badge" id="badgePeriodo">🕰️ —</span>
          <span class="badge" id="badgeStile">🎭 —</span>
        </div>
        <div class="chips" id="styleChips">
          <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistic)</button>
          <button class="chip" data-style="wtf" id="chipWTF">WTF (fun)</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="label" id="qLabel">Question</h3>
      <div id="question" class="box"></div>

      <div class="tools" style="align-items:flex-start">
        <div class="row" style="gap:10px">
          <button class="btn primary large" id="clarifyBtn">✨ Clarify & Generate</button>
          <button class="btn large" id="genBtn">Generate now</button>
          <button class="btn" id="regenBtn" style="display:none">Regenerate 🔁</button>
        </div>
      </div>
      <p class="hint" id="hint">Tip: with 2–3 focused details the answer becomes much more “yours”.</p>

      <div class="divider"></div>

      <h3 class="label" id="rLabel">Result</h3>
      <div id="result" class="box">—</div>

      <div class="tools">
        <button class="btn" id="saveBtn">💾 Save</button>
        <button class="btn" id="copyBtn">📋 Copy</button>
        <button class="btn" id="shareBtn">📤 Share</button>
      </div>
    </div>
  </main>

  <!-- Overlay chiarimenti -->
  <div class="overlay" id="clarifyOverlay">
    <div class="sheet">
      <h3 style="margin:6px 0" id="clarifyTitle">2–3 questions to be more precise</h3>
      <div id="clarifyList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="applyClarify">Generate with these answers</button>
        <button class="btn ghost" id="cancelClarify">Cancel</button>
      </div>
    </div>
  </div>

<script>
/* ====== I18N ====== */
const I18N = {
  it:{
    title:"Il tuo scenario",
    subtitle:"Per una risposta più personale, usa prima Chiarisci e genera.",
    back:"Indietro", home:"Home",
    badgeFree:(l,d)=>`Free oggi: ${l}/${d}`,
    badgeClarify:(l,d)=>`Chiarimenti: ${l}/${d}`,
    badgeFreeTitle:"Long-press 2s: azzera crediti · Triplo click: toggle Pro (dev)",
    badgeClarifyTitle:"Chiarimenti disponibili oggi",
    periodoPast:"Passato", periodoFuture:"Futuro",
    chipWhatIf:"What if (realistico)", chipWTF:"WTF (divertente)",
    qLabel:"Domanda", rLabel:"Risultato",
    clarifyBtn:"✨ Chiarisci e genera", genBtn:"Genera subito", regenBtn:"Rigenera 🔁",
    hint:"Consiglio: con 2–3 dettagli mirati la risposta diventa molto più “tua”.",
    clarifyTitle:"2–3 domande per essere più precisi",
    applyClarify:"Genera con queste risposte", cancelClarify:"Annulla",
    save:"Salva", copy:"Copia", share:"Condividi",
    loading:"Sto generando…", errServer:"Problema server.", errNet:"Errore di rete.",
    limitGen:"Hai raggiunto il limite gratuito di oggi. Torna domani!",
    limitClarify:"Hai raggiunto il limite di chiarimenti per oggi. Puoi comunque generare la risposta.",
    copied:"Copiato!", saved:"Salvato!"
  },
  en:{
    title:"Your scenario",
    subtitle:"For a more personal answer, use Clarify & Generate first.",
    back:"Back", home:"Home",
    badgeFree:(l,d)=>`Free today: ${l}/${d}`,
    badgeClarify:(l,d)=>`Clarify: ${l}/${d}`,
    badgeFreeTitle:"Long-press 2s: reset credits · Triple click: toggle Pro (dev)",
    badgeClarifyTitle:"Clarifications available today",
    periodoPast:"Past", periodoFuture:"Future",
    chipWhatIf:"What if (realistic)", chipWTF:"WTF (fun)",
    qLabel:"Question", rLabel:"Result",
    clarifyBtn:"✨ Clarify & Generate", genBtn:"Generate now", regenBtn:"Regenerate 🔁",
    hint:"Tip: with 2–3 focused details the answer becomes much more “yours”.",
    clarifyTitle:"2–3 questions to be more precise",
    applyClarify:"Generate with these answers", cancelClarify:"Cancel",
    save:"Save", copy:"Copy", share:"Share",
    loading:"Generating…", errServer:"Server problem.", errNet:"Network error.",
    limitGen:"You’ve reached today’s free limit. Come back tomorrow!",
    limitClarify:"You’ve reached today’s clarify limit. You can still generate the answer.",
    copied:"Copied!", saved:"Saved!"
  }
};
const LS = localStorage;
const lang = (LS.getItem("lang") || "it").toLowerCase();
const T = I18N[lang] || I18N.it;
document.documentElement.lang = lang;

/* apply static i18n */
document.getElementById('titleH1').textContent = T.title;
document.getElementById('subtitle').textContent = T.subtitle;
document.getElementById('backBtn').textContent = `← ${T.back}`;
document.getElementById('homeBtn').textContent = `🏠 ${T.home}`;
document.getElementById('freeBadge').title = T.badgeFreeTitle;
document.getElementById('clarifyBadge').title = T.badgeClarifyTitle;
document.getElementById('chipWhatIf').textContent = T.chipWhatIf;
document.getElementById('chipWTF').textContent = T.chipWTF;
document.getElementById('qLabel').textContent = T.qLabel;
document.getElementById('rLabel').textContent = T.rLabel;
document.getElementById('clarifyBtn').textContent = T.clarifyBtn;
document.getElementById('genBtn').textContent = T.genBtn;
document.getElementById('regenBtn').textContent = T.regenBtn;
document.getElementById('hint').textContent = T.hint;
document.getElementById('clarifyTitle').textContent = T.clarifyTitle;
document.getElementById('applyClarify').textContent = T.applyClarify;
document.getElementById('cancelClarify').textContent = T.cancelClarify;
document.getElementById('saveBtn').textContent = `💾 ${T.save}`;
document.getElementById('copyBtn').textContent = `📋 ${T.copy}`;
document.getElementById('shareBtn').textContent = `📤 ${T.share}`;

/* ====== Config ====== */
const DAILY_FREE = 3;      // generations/day
const DAILY_CLARIFY = 5;   // clarifications/day

/* ====== Helpers ====== */
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function readJSON(k,def={}){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;}}
function $(id){return document.getElementById(id);}

/* Credits (generation) */
function readCredits(){const v=readJSON('whatif_credits');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0,pro:!!v.pro};return v;}
function writeCredits(v){LS.setItem('whatif_credits',JSON.stringify(v));renderBadges();}
function ensureCredits(){const c=readCredits();if(!c.date||c.date!==todayStr()){c.date=todayStr();c.used=0;writeCredits(c);}}

/* Clarify limits */
function readClarify(){const v=readJSON('whatif_clarify');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0};return v;}
function writeClarify(v){LS.setItem('whatif_clarify',JSON.stringify(v));renderBadges();}
function ensureClarify(){const c=readClarify();if(!c.date||c.date!==todayStr()){c.date=todayStr();c.used=0;writeClarify(c);}}

/* Profile */
function buildProfilePayload(){
  const base = readJSON('whatif_profile');
  const micro = readJSON('whatif_micro');
  return { ...base, micro };
}
function saveMicroPatch(patch){
  const micro = readJSON('whatif_micro');
  Object.assign(micro, patch);
  LS.setItem('whatif_micro', JSON.stringify(micro));
}

/* Badges render */
function renderBadges(){
  const gc=readCredits(); const gl=Math.max(0, DAILY_FREE - (gc.used||0));
  const bc=T.badgeFree(gl, DAILY_FREE);
  $('freeBadge').textContent = bc;

  const cc=readClarify(); const cl=Math.max(0, DAILY_CLARIFY - (cc.used||0));
  $('clarifyBadge').textContent = T.badgeClarify(cl, DAILY_CLARIFY);
}

/* ====== State ====== */
const prefs = readJSON("whatif_prefs");
let domanda = LS.getItem("domanda") || "";
if (!domanda) { alert(lang==='en'?"No question found.":"Nessuna domanda trovata."); location.href="fourth.html"; }
let currentStyle = (prefs.stile || "whatif");
const questionEl = $('question');
const resultEl   = $('result');

$('backBtn').onclick = ()=> history.back();
$('homeBtn').onclick = ()=> location.href='index.html';

questionEl.textContent = domanda;
$('badgePeriodo').textContent = "🕰️ " + (prefs.periodo==="past" ? T.periodoPast : T.periodoFuture);
$('badgeStile').textContent   = "🎭 " + (currentStyle==="wtf" ? "What the F" : "What if");
document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
$('styleChips').addEventListener("click",(e)=>{
  const b=e.target.closest(".chip"); if(!b) return;
  currentStyle=b.dataset.style;
  $('badgeStile').textContent = "🎭 " + (currentStyle==="wtf" ? "What the F" : "What if");
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
});

/* ====== API helpers ====== */
async function callClarifyAPI(){
  const payload = {
    domanda, lang, periodo:prefs.periodo||"future", stile:currentStyle,
    clarify:true, profilo:buildProfilePayload()
  };
  const r = await fetch("/api/ask", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error("server");
  return r.json();
}
async function callGenerateStream({ clarifications={}, extra="" }={}){
  const payload = {
    domanda, lang, periodo:prefs.periodo||"future", stile:currentStyle,
    clarify:false, stream:true, profilo:buildProfilePayload(),
    clarifications, extra
  };
  const r = await fetch("/api/ask", { method:"POST", headers:{ "Content-Type":"application/json","x-whatif-stream":"1" }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error("server");
  return r.body.getReader();
}

/* ====== Clarify UI ====== */
const clarifyOverlay = $('clarifyOverlay');
const clarifyList    = $('clarifyList');
$('clarifyBtn').addEventListener('click', openClarify);
$('cancelClarify').addEventListener('click', ()=> clarifyOverlay.style.display='none');

async function openClarify(){
  ensureClarify();
  const c = readClarify();
  if ((c.used||0) >= DAILY_CLARIFY){
    alert(T.limitClarify); return;
  }
  clarifyList.innerHTML = `<p class="sub">${lang==='en'?'Preparing 2–3 focused questions…':'Sto preparando 2–3 domande mirate…'}</p>`;
  clarifyOverlay.style.display='flex';
  try{
    const j = await callClarifyAPI();
    c.used = (c.used||0) + 1; writeClarify(c); // count the clarify call
    const qs = Array.isArray(j.questions)? j.questions.slice(0,3) : [];
    if (!qs.length){ clarifyList.innerHTML = `<p class="sub">${lang==='en'?'No clarification needed. You can generate now.':'Nessun chiarimento necessario. Puoi generare subito.'}</p>`; return; }
    clarifyList.innerHTML = qs.map(q=>`
      <div class="qitem">
        <label for="${q.id||''}">${escapeHTML(q.label|| (lang==='en'?'Question':'Domanda'))}</label>
        <input id="${q.id||''}" type="text" placeholder="${escapeAttr(q.placeholder|| (lang==='en'?'Answer in one line':'Rispondi in una riga'))}" />
      </div>`).join("");
  }catch(e){
    clarifyList.innerHTML = `<p class="sub">${lang==='en'?'Error fetching clarifications. You can still generate.':'Errore nel recupero chiarimenti. Puoi generare comunque.'}</p>`;
  }
}

$('applyClarify').addEventListener('click', async ()=>{
  const inputs = clarifyList.querySelectorAll('input');
  const clar = {}; inputs.forEach(i=>{ const v=(i.value||"").trim(); if(i.id&&v) clar[i.id]=v; });
  clarifyOverlay.style.display='none';
  if (Object.keys(clar).length) saveMicroPatch(clar);
  await generate(false, clar);
});

/* ====== Generation ====== */
$('genBtn').addEventListener('click', ()=> generate());
$('regenBtn').addEventListener('click', ()=> generate(true));

async function generate(isRegen=false, clarOverride=null){
  ensureCredits();
  const credits = readCredits();
  if (!isRegen && (credits.used||0) >= DAILY_FREE){
    alert(T.limitGen); return;
  }

  resultEl.textContent = `⏳ ${T.loading} `;
  const sk = document.createElement("span"); sk.className="skeleton"; sk.style.width="40%"; resultEl.appendChild(sk);
  $('regenBtn').style.display = 'none';

  try{
    const reader = await callGenerateStream({ clarifications: (clarOverride||{} ) });
    const decoder = new TextDecoder();
    let buffer="", text="";
    while(true){
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();
      for (const chunk of chunks){
        if (!chunk.startsWith("data: ")) continue;
        const data = JSON.parse(chunk.slice(6));
        if (data.token){ text += data.token; resultEl.textContent = text; }
        if (data.done){ resultEl.textContent = (text||"").trim(); }
        if (data.error){ resultEl.textContent = T.errServer + " " + (data.detail||""); }
      }
    }
    const c = readCredits(); c.used = (c.used||0) + 1; writeCredits(c);
    $('regenBtn').style.display = 'inline-block';
  }catch(e){
    console.error(e);
    resultEl.textContent = (e.message==='server' ? T.errServer : T.errNet);
  }
}

/* ====== Utility ====== */
$('backBtn').addEventListener('click', ()=> history.back());
$('homeBtn').addEventListener('click', ()=> location.href='index.html');

$('saveBtn').addEventListener('click', ()=>{
  const arr = readJSON("cronologia", []);
  arr.unshift({ domanda, risposta:(resultEl.textContent||"").trim(), periodo:prefs.periodo||null, stile:currentStyle, lang, ts:Date.now() });
  LS.setItem("cronologia", JSON.stringify(arr));
  alert(T.saved);
});
$('copyBtn').addEventListener('click', ()=>{
  navigator.clipboard.writeText(`${T.qLabel}: ${domanda}\n\n${resultEl.textContent}`).then(()=> alert(T.copied));
});
$('shareBtn').addEventListener('click', ()=>{
  const data={title:"What?f",text:`${T.qLabel}: ${domanda}\n\n${resultEl.textContent}`,url: location.href};
  if (navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(`${T.qLabel}: ${domanda}\n\n${resultEl.textContent}`);
});
function escapeHTML(s){return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(s){return String(s||"").replace(/"/g,'&quot;')}

/* ====== Dev hooks (long-press reset, triple-click Pro) ====== */
(function devHooks(){
  const badge = $('freeBadge');
  if (!badge) return;
  badge.title = T.badgeFreeTitle;

  let pressT=null;
  badge.addEventListener('pointerdown', ()=> { pressT = setTimeout(resetToday, 2000); });
  badge.addEventListener('pointerup',   ()=> { clearTimeout(pressT); });
  badge.addEventListener('pointerleave',()=> { clearTimeout(pressT); });

  function resetToday(){
    const d=new Date();
    const today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const c=readJSON('whatif_credits');
    c.date=today; c.used=0;
    LS.setItem('whatif_credits', JSON.stringify(c));
    renderBadges();
    alert(lang==='en'?'Today credits reset ✅':'Crediti di oggi azzerati ✅');
  }

  let clicks=0, timer=null;
  badge.addEventListener('click', ()=>{
    clicks++; clearTimeout(timer);
    timer=setTimeout(()=>{ if (clicks>=3) togglePro(); clicks=0; }, 250);
  });
  function togglePro(){
    const c=readJSON('whatif_credits');
    c.pro = !c.pro; c.used = 0;
    LS.setItem('whatif_credits', JSON.stringify(c));
    renderBadges();
    alert('Pro '+(c.pro?'on':'off')+' (local) ✅');
  }
})();

/* ====== Start ====== */
ensureCredits(); ensureClarify(); renderBadges();
</script>
</body>
</html>
