<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.answer{white-space:pre-wrap;line-height:1.6;font-size:18px}
.meta{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
.sugg{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Episodio</h1>
  <p class="meta" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">Domanda</div>
    <div id="qBox" class="input" style="min-height:52px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risultato</div>
    <div id="answerBox" class="answer">⏳ …</div>
    <div class="meta" id="metaInfo"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="shareBtn">🔗 Condividi</button>
    </div>
  </div>

  <div class="card" id="suggCard" style="display:none">
    <div class="label" id="lblSugg">Spunti per domani</div>
    <div id="suggList" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="sep"></div>
    <textarea id="customSugg" rows="3" placeholder="Aggiungi un tuo spunto…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <button class="btn" id="homeBtn2">🏠 Home</button>
    </div>
    <p class="meta" id="saveInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase();
const T = {
  it:{
    title:"Episodio",
    q:"Domanda", a:"Risultato",
    saved:"✅ Salvato per domani.",
    copy:"📋 Copiato.",
    shareFail:"Condivisione non supportata",
    sugg:"Spunti per domani",
    custom:"Aggiungi un tuo spunto…",
    metaReplay:"(risposta salvata)", metaLive:"(generata ora)"
  },
  en:{
    title:"Episode",
    q:"Question", a:"Result",
    saved:"✅ Saved for tomorrow.",
    copy:"📋 Copied.",
    shareFail:"Share not supported",
    sugg:"Prompts for tomorrow",
    custom:"Add your own prompt…",
    metaReplay:"(saved answer)", metaLive:"(generated now)"
  }
}[lang];

const $=id=>document.getElementById(id);
$('langBtn').textContent = lang.toUpperCase();
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('homeBtn2').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
const style = prefs.stile || 'whatif';
document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');

$('title').textContent=T.title;
$('lblQ').textContent=T.q;
$('lblA').textContent=T.a;
$('lblSugg').textContent=T.sugg;
$('customSugg').placeholder=T.custom;

/* replay? */
const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';

const req = JSON.parse(LS.getItem('whatif_request')||'null');
const domanda = isReplay ? (JSON.parse(LS.getItem('replay_story')||'null')?.domanda || "") : (req?.domanda || LS.getItem('domanda') || "");
$('qBox').textContent = domanda || '—';
$('subtitle').textContent = (style==='wtf'?'⚡ What the F':'💡 What?f');

async function callAsk(payload){ const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const j=await r.json(); if(!r.ok) throw new Error(j.detail||'server'); return j; }

/* COPY/SHARE */
$('copyBtn').onclick=async ()=>{
  const text = `Q: ${$('qBox').textContent}\n\n${$('answerBox').textContent}`;
  await navigator.clipboard.writeText(text).catch(()=>{});
  $('copyBtn').textContent = T.copy;
  setTimeout(()=> $('copyBtn').textContent='📋 Copia', 1200);
};
$('shareBtn').onclick=async ()=>{
  const text = `Q: ${$('qBox').textContent}\n\n${$('answerBox').textContent}`;
  if(navigator.share){ try{ await navigator.share({text}); }catch{} } else { alert(T.shareFail); }
};

/* LIVE vs REPLAY */
(async ()=>{
  if(isReplay){
    const r = JSON.parse(LS.getItem('replay_story')||'null');
    $('answerBox').textContent = r?.answer || '—';
    $('metaInfo').textContent = T.metaReplay;
    // niente suggerimenti in replay
    return;
  }

  // genera episodio
  try{
    const payload = req || {};
    payload.lang = (LS.getItem('lang')||'it').toLowerCase();
    payload.mode = "episode";
    const ep = await callAsk(payload);
    const answer = (ep.answer||"").trim();
    $('answerBox').textContent = answer || '—';
    $('metaInfo').textContent = T.metaLive;

    // salva cronologia
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, answer, stile: style, ts: Date.now() });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

    // suggerimenti coerenti (non si continua oggi)
    $('suggCard').style.display='block';
    const follow = await callAsk({
      domanda,
      stile: style,
      lang: (LS.getItem('lang')||'it').toLowerCase(),
      mode: "follow",
      profile: req?.profile || {},
      answer
    }).catch(()=>({ suggestions:[] }));

    const list = Array.isArray(follow.suggestions) ? follow.suggestions.slice(0,3) : [];
    const box=$('suggList'); box.innerHTML="";
    (list.length?list:(
      (payload.lang==='en')
        ? ["Pick one tiny detail you’ll notice first.","Name the first sign it works.","Choose a place to test the new rhythm."]
        : ["Scegli un dettaglio minuscolo da notare.","Nomina il primo segnale che funziona.","Scegli un posto dove provi il nuovo ritmo."]
    )).forEach(s=>{
      const d=document.createElement('div'); d.className='sugg'; d.textContent=s; d.onclick=()=>{ $('customSugg').value=s; };
      box.appendChild(d);
    });

  }catch(e){
    $('answerBox').textContent = '[server error]';
  }
})();

/* salva per domani (non continua oggi) */
$('saveBtn').onclick=()=>{
  const v = ($('customSugg').value||"").trim();
  const arr = JSON.parse(LS.getItem('next_prompts')||'[]');
  arr.unshift({ q: v && v.length>0 ? v : domanda, stile: style, lang: (LS.getItem('lang')||'it').toLowerCase(), ts: Date.now() });
  LS.setItem('next_prompts', JSON.stringify(arr.slice(0,50)));
  $('saveInfo').textContent = T.saved;
  $('customSugg').value='';
};
</script>
</body>
</html>
