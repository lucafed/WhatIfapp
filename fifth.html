<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f – La tua domanda</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#0A0F14;color:#fff;text-align:center;}
    h1{font-size:2rem;margin:20px 0;}
    .hero{max-width:120px;margin:10px auto;display:block;}
    input{width:80%;padding:10px;border-radius:10px;border:none;margin:10px auto;}
    .btn{padding:12px 20px;border-radius:30px;font-weight:bold;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(180deg,#00E0FF,#00B5CC);color:#062025;}
    .response{margin:20px auto;padding:15px;background:#141C22;border-radius:10px;max-width:80%;}
    .new-q{margin-top:15px;display:block;color:#00E0FF;text-decoration:none;}
  </style>
</head>
<body>
  <img src="ask-hero.png" alt="Ask Hero" class="hero">
  <h1>LA TUA DOMANDA</h1>
  <input type="text" id="question" placeholder="Scrivi la tua domanda qui...">
  <button id="send" class="btn btn-primary">INVIA</button>
  <div id="answer" class="response" style="display:none;"></div>
  <a href="#" id="newQ" class="new-q" style="display:none;">Nuova domanda</a>

  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode") || localStorage.getItem("whatif_style") || "whatif";

    document.getElementById("send").addEventListener("click", ()=>{
      const q = document.getElementById("question").value.trim();
      if(!q) return;
      const answerBox = document.getElementById("answer");
      answerBox.style.display="block";
      answerBox.innerText = mode==="wtf"
        ? "😲 WHAT THE F style: risposta inaspettata alla tua domanda!"
        : "🤔 What?f style: ecco cosa potrebbe accadere...";
      document.getElementById("newQ").style.display="block";
    });

    document.getElementById("newQ").addEventListener("click", e=>{
      e.preventDefault();
      document.getElementById("question").value="";
      document.getElementById("answer").style.display="none";
      document.getElementById("newQ").style.display="none";
    });

    // Swipe (indietro torna alla quarta)
    let startX=0, startY=0;
    document.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    });
    document.addEventListener("touchend",e=>{
      let dx=e.changedTouches[0].clientX-startX;
      let dy=e.changedTouches[0].clientY-startY;
      if(Math.abs(dx)>60 && Math.abs(dy)<70){
        if(dx>0){ location.href="fourth.html?mode="+mode; }
      }
    });
  </script>
</body>
</html>
