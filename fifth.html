<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;

  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* === TOP PERCENT ROW === */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct{

  min-width:64px;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px var(--glow);
}

/* === RISULTATI SOTTO === */
.result-box{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28);
}
.result-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;

.result-pct{

.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}

/* === MOTIVO === */
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .ico{font-size:18px;line-height:1.2}
.mot .name{display:none}

/* Chips voti */

/* Mobile */
@media (max-width:420px){

/* === Overlay (store/rewarded) === */
#overlay{
  position:fixed;inset:0;display:none;place-items:center;
  background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:9999;

/* Topbar mini */
.topbar {
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px
}
</style>

<script>
/* ==== Base state ==== */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
const IS_ADMIN = !!LS.getItem('admin_token'); // infinito

/* ==== Sistemazione tema ==== */
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* ==== System Prompts (UI only) ==== */
const SYSTEM_WTF = `SEI “WHAT THE F”.
Obiettivo: monologo breve, continuo, da bar poetico. Ironia cattiva ma affettuosa. Sarcasmo quotidiano.
Gli oggetti commentano/giudicano/si ribellano. Linguaggio vivo e diretto, con volgarità leggere e sensate.
Atmosfera: sbronza improvvisata ma lucida. Nessuna morale esplicita.
Formato OBBLIGATORIO: 1 solo paragrafo; 6–9 frasi; niente elenco/emoji/titoli; finale con sorriso stanco e vero (sottinteso).
Stile identico agli esempi originali. Niente consigli, niente morale, ritmo parlato e immagini concrete.`;

const SYSTEM_WHIF = `SEI “WHAT IF”.
Obiettivo: risposta empatica + pragmatica (60% analisi, 40% realtà vissuta). Tono umano.
Formato OBBLIGATORIO: 1 paragrafo; 8–11 frasi; niente elenco/emoji/titoli; chiudi con micro-spinta operativa.
Linee guida: nomina vincoli (tempo/budget/energia), 1–2 indicatori misurabili, cicli brevi, revisione ritmica, niente moralismi.`;

/* ===== Lingua ===== */
const SUP_LANG = ['it','en','es','fr','de'];
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';
function detectLang(text=''){
  const t=(text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank={
    it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
    en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
    es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
    fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
    de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]
  };
  const score={}; for(const L of SUP_LANG){ score[L]=0; bank[L]?.forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1; for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){ const nav=(navigator.language||'it').slice(0,2).toLowerCase(); if(SUP_LANG.includes(nav)) return nav; }
  return best;
}
const manualLang = LS.getItem('lang_manual') === '1';
let lang = manualLang ? (SUP_LANG.includes((LS.getItem('lang')||'').toLowerCase()) ? (LS.getItem('lang')||'it').toLowerCase() : 'it') : detectLang(domandaEarly);
if(!SUP_LANG.includes(lang)) lang='it';
document.documentElement.lang=lang;

/* ==== PRO badge ==== */
(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' :
               (lang === 'es') ? 'Modo de prueba activo' :
               (lang === 'fr') ? 'Mode test actif' :
               (lang === 'de') ? 'Testmodus aktiv' : 'Modalità test attiva';
  }
})();

/* ==== I18N ==== */
const I18N = {
  it:{ titleWTF:"⚡ What the F — Risultato", titleWHF:"💡 What if — Risultato",
       sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
       p:"Esito & motivazioni", share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
       copied:"Copiato!", error:"[errore server]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Stile: What the F · 6–9 frasi · paragrafo unico · tono asciutto · modalità: ${p==='past'?'Passato':'Futuro'}.`
        : `Stile: What if (60% analisi, 40% reale) · 8–11 frasi · paragrafo unico · modalità: ${p==='past'?'Passato':'Futuro'}.`,
       pctLabel:"% probabilità che accada",
       votersTitle:"Comitato",
       seriousTitle:"Motivazione",
       scientificTitle:"Motivazione (scientificamente provata)",
       chipsFav:"favorevoli", chipsCon:"contrari", chipsAst:"astenuti",
       motFallback:"Motivo: benefici concreti a breve, con vincoli gestibili.",
       credits:(n)=>`💰 Crediti: ${n}`,
       noCredits:"Hai terminato i crediti." },

  en:{ titleWTF:"⚡ What the F — Result", titleWHF:"💡 What if — Result",
       sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
       p:"Outcome & rationales", share:"📤 Share / Copy", again:"🔁 Ask another",
       copied:"Copied!", error:"[server error]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · dry tone · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if (60% analysis, 40% real) · 8–11 sentences · single paragraph · mode: ${p==='past'?'Past':'Future'}.`,
       pctLabel:"% probability it happens",
       votersTitle:"Committee",
       seriousTitle:"Rationale",
       scientificTitle:"Rationale (scientifically grounded)",
       chipsFav:"in favour", chipsCon:"against", chipsAst:"abstained",
       motFallback:"Reason: short-term, concrete benefits with manageable constraints.",
       credits:(n)=>`💰 Credits: ${n}`,
       noCredits:"You ran out of credits." },

  es:{},
  fr:{},
  de:{}
};

/* ==== Leads (essenziali) ==== */
const LEADS = {
  it:{ wtf:[
      "Entri piano, il caos ti riconosce e oggi ti lascia passare.",
      "Respiri e lasci che sia il destino a inciampare per primo."
    ],
    whatif:[
      "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
      "La stanza è la stessa, lo sguardo no: è già un inizio."
    ]},
  en:{ wtf:["You step in slowly; chaos recognizes you and lets you through.",
            "Breathe; let chance trip before you do."],
       whatif:["Set the keys down and let the quiet that doesn’t judge go first.",
               "Same room, different gaze — that’s already a start."]}
};

/* ==== (Placeholder) categorie/motivazioni scientifiche rapide ==== */
const SCI_MOTIVATIONS={ it:[
  "Studio CEDSA: 312 soggetti + 2 cavie alticce; effetto stimato all’87% (p≈0,02).",
  "Protocollo PignaLab: 98 partecipanti + 1 piccione; risultato replicato, CI sorprendente.",
  "Istituto Svizzero Formaggi & Motivazione: RCT (n=120); gruppo formaggio +72% successo."
], en:[
  "CEDSA study: 312 subjects + 2 tipsy guinea animals; estimated effect 87% (p≈0.02).",
  "PineCone protocol: 98 participants + 1 pigeon; replicated result, surprising CI.",
  "Swiss Institute of Cheese & Motivation: RCT (n=120); cheese group +72% success."
]};

/* ==== UI refs ==== */
const qs = (sel)=>document.querySelector(sel);
const setText = (id, txt)=>{ const el=qs(id); if(el) el.textContent = txt; };

const subtitle = qs('#subtitle');
const lblQ = qs('#lblQ');
const lblA = qs('#lblA');
const qView = qs('#qView');
const leadNode = qs('#lead');
const answerEl = qs('#answer');
const shareBtn = qs('#shareBtn');
const againBtn = qs('#againBtn');
const metaInfo = qs('#metaInfo');
const styleBadge = qs('#styleBadge');
const lblP = qs('#lblP');
const topPct = qs('#topPct');
const bottomPct = qs('#bottomPct');
const pctLabelTop = qs('#pctLabel');
const pctLabelBottom = qs('#pctLabelBottom');
const committeeTitle = qs('#committeeTitle');
const motIco  = qs('#motIco');
const motName = qs('#motName');
const chipFav = qs('#chipFav');
const chipCon = qs('#chipCon');
const chipAst = qs('#chipAst');
const chipsWrap = qs('#chipsWrap');
const motNote = qs('#motNote');
const creditInfo = qs('#creditInfo');

/* ==== Overlay helpers + Fallback inline store ==== */
const overlay = qs('#overlay');
const overlayFrame = qs('#overlay-frame');

function storeFallbackHTML(){
  const T = I18N[lang]||I18N.it;
  return `
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0B0F14;color:#EAF3EE}
.wrap{max-width:520px;margin:auto;padding:16px}
.card{background:#141C22;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin-top:10px}
h2{margin:4px 0 6px;font-size:18px}
.btn{display:inline-block;margin:6px 6px 0 0;padding:10px 12px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
.primary{background:linear-gradient(180deg,#1C57A0,#FFEC01);color:#0A0E12}

</style></head><body>
<div class="wrap">
  <div class="card">
    <h2>Crediti</h2>
    <p class="small">${T.noCredits || 'Crediti esauriti.'}</p>
    <button class="btn primary" onclick="parent.postMessage({type:'purchase_completed', amount:5}, '*')">Compra +5 crediti (test)</button>
    <button class="btn ghost"   onclick="parent.postMessage({type:'open_rewarded'}, '*')">Guarda pubblicità (+1)</button>
    <button class="btn ghost"   onclick="parent.postMessage({type:'close_overlay'}, '*')">Chiudi</button>
  </div>

</body></html>`;
}

function openOverlay(url){
  overlay.style.display = 'grid';
  overlay.setAttribute('aria-hidden','false');
  overlayFrame.removeAttribute('srcdoc');
  overlayFrame.src = url || 'about:blank';
  overlayFrame.setAttribute('srcdoc', storeFallbackHTML());
}
function openStore(){ openOverlay("/store/credit-store.html"); }
function openRewarded(){ openOverlay("/ads/rewarded.html"); }
function closeOverlay(){
  overlay.style.display = 'none';
  overlay.setAttribute('aria-hidden','true');
  overlayFrame.src = 'about:blank';
  overlayFrame.removeAttribute('srcdoc');
}

/* ==== Wallet/Credits (robusto, con legacy) ==== */
const WKEY = "whatif_wallet";
function readWallet(){
  try{
    const w = JSON.parse(localStorage.getItem(WKEY) || "{}") || {};
    return {
      available: Number.isFinite(+w.available) ? +w.available : null,
      used:      Number.isFinite(+w.used)      ? +w.used      : null,
      limit:     Number.isFinite(+w.limit)     ? +w.limit     : null,
    };
  }catch{ return {available:null, used:null, limit:null}; }
}
function writeWallet(w){
  const cur = readWallet();
  const out = {
    available: (w.available!=null)? Math.max(0, +w.available) : (cur.available??0),
    used:      (w.used     !=null)? Math.max(0, +w.used)      : (cur.used??0),
    limit:     (w.limit    !=null)? Math.max(0, +w.limit)     : (cur.limit??0),
  };
  localStorage.setItem(WKEY, JSON.stringify(out));
  localStorage.setItem("whatif_wallet_sync", String(Date.now()));
  updateCreditInfo();
}

/* Legacy helpers */
function legacyCap(){ return (prefs.pro===true)?10:3; }
function legacyGetLeft(){
  const w = readWallet();
  if(w.available!=null) return w.available;
  try{
    const c = JSON.parse(LS.getItem('whatif_credits')||'{}'); 
    const today=new Date().toISOString().slice(0,10);
    const used = (c.date===today)? (+c.used||0) : 0;
    return Math.max(0, legacyCap()-used);
  }catch{}
  const raw = LS.getItem('crediti'); 
  return raw==null? legacyCap() : Math.max(0, parseInt(raw,10)||0);
}
function legacyConsumeOne(){
  try{
    const w = readWallet();
    if(w.available!=null){
      if(w.available<=0) return false;
      writeWallet({available:w.available-1, used:Math.max(0,(w.used||0)+1), limit:(w.limit!=null?w.limit:legacyCap())});
      return true;
    }
  }catch{}
  try{
    const today=new Date().toISOString().slice(0,10);
    let c = JSON.parse(LS.getItem('whatif_credits')||'{}');
    if(c.date!==today) c={date:today,used:0};
    const cap=legacyCap();
    if((c.used||0) >= cap) return false;
    c.used=(c.used||0)+1;
    LS.setItem('whatif_credits', JSON.stringify(c));
    return true;
  }catch{}
  let n = parseInt(LS.getItem('crediti')||'0',10)||0;
  if(n<=0) return false;
  LS.setItem('crediti', String(Math.max(0, n-1)));
  return true;
}

/* API di consumo */
function getAvailable(){
  if(IS_ADMIN) return Infinity;
  const w = readWallet();
  if(w.available!=null) return w.available;
  return legacyGetLeft();
}
function consumeOne(){
  if(IS_ADMIN) return true;
  const w = readWallet();
  if(w.available!=null){
    if(w.available<=0) return false;
    writeWallet({available:w.available-1, used:Math.max(0,(w.used||0)+1), limit:(w.limit!=null?w.limit:legacyCap())});
    return true;
  }
  return legacyConsumeOne();
}
function addCredits(n){
  n = Math.max(0, parseInt(n,10)||0);
  if(n<=0) return;
  const w = readWallet();
  if(w.available==null){
    const left = legacyGetLeft();
    writeWallet({available:left+n, used:0, limit:legacyCap()});
  }else{
    writeWallet({available: (w.available+n), used: Math.max(0, (w.used||0)-n), limit: (w.limit!=null?w.limit:legacyCap())});
  }
}
function updateCreditInfo(n=getAvailable()){
  const T = I18N[lang] || I18N.it;
  if(creditInfo) creditInfo.textContent = T.credits(n===Infinity?'∞':n);
}

/* ==== Helpers varie ==== */
function normalizeOneParagraph(s=""){
  return String(s)
    .replace(/\s*\n+\s*/g," ")
    .replace(/\s{2,}/g," ")
    .replace(/\s+([.,;:!?])/g,"$1")
    .trim();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function oneSentence(s=""){
  let t=String(s).trim();
  const m=t.match(/^([\s\S]*?[.!?…])\s/);
  if(m) t=m[1];
  if(!/[.!?…]$/.test(t)) t+=".";
  return t;
}
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw || !raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

/* ==== Titles & UI text ==== */
function setTitlesAndTexts(q){
  const T = I18N[lang] || I18N.it;
  setText('#title', style==='wtf' ? T.titleWTF : T.titleWHF);
  subtitle.textContent = T.sub(q || '—');
  lblQ.textContent = T.q;
  lblA.textContent = T.a;
  lblP.textContent = T.p;
  shareBtn.textContent = T.share;
  againBtn.textContent = T.again;
  styleBadge.textContent = (style==='wtf') ? T.styleWTF : T.styleWHF;
  metaInfo.textContent = T.meta(style, periodo);
  pctLabelTop.textContent = T.pctLabel;
  if(pctLabelBottom) pctLabelBottom.textContent = T.pctLabel;

  const bank = (LEADS[lang] && LEADS[lang][style]) ? LEADS[lang][style]
               : (LEADS.it[style] || LEADS.it.whatif);
  leadNode.textContent = oneSentence(pick(bank) || '') || '—';

  chipFav.textContent = `${T.chipsFav} 0`;
  chipCon.textContent = `${T.chipsCon} 0`;
  chipAst.textContent = `${T.chipsAst} 0`;
}

/* ======== Probabilità (locale) ======== */
function computeProbability(q){
  const t=(q||'').toLowerCase();
  let score=50;
  if(/\b(7|14|21|30|60|90)\b/.test(t)) score+=12;
  if(/\b\d+([.,]\d+)?\b/.test(t)) score+=8;
  if(/budget|€|euro|spesa|max|sotto/.test(t)) score+=6;
  if(/senza|solo|al massimo|minimo|entro|prima delle|ogni|per/.test(t)) score+=8;
  if(/lancia|apri|impara|scrivi|chiedi|corri|studia|automatizza|testa/.test(t)) score+=6;
  if(/forse|magari|vedere/.test(t)) score-=8;
  if(!/\b\d/.test(t)) score-=6;
  score += (style==='wtf' ? -4 : +2);
  return { pct: Math.max(25, Math.min(92, Math.round(score))) };
}
function shortMotivationFromAnswer(answerText){
  const T = I18N[lang] || I18N.it;
  const a = String(answerText||'').replace(/\s*\n+\s*/g,' ').trim();
  const parts = a.split(/(?<=[.!?…])\s+/).filter(Boolean);
  let s = parts.find(x=>/perché|quindi|dunque|se\b|quando\b|equilibrio|rischio|beneficio/i.test(x)) || parts[0] || '';
  s = s.replace(/\s{2,}/g,' ').trim();
  if(!/[.!?…]$/.test(s)) s+='.';
  if(s.length<24) s = T.motFallback;
  return s;
}
function pickScientificMotivation(){
  const list = SCI_MOTIVATIONS[lang] || SCI_MOTIVATIONS.it;
  return pick(list);
}
function renderCommitteeLike(surprise){
  const T = I18N[lang] || I18N.it;
  if(surprise){
    motIco.style.display='';
    chipsWrap.style.display='flex';
    committeeTitle.textContent = `${T.votersTitle||'Comitato'}`;
    const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    chipFav.textContent = `${T.chipsFav} ${r(120,1200)}`;
    chipCon.textContent = `${T.chipsCon} ${r(0,900)}`;
    chipAst.textContent = `${T.chipsAst} ${r(0,400)}`;
    motNote.textContent = (lang==='en')?`Brief tussle at vote: ${r(1,5)} removed; ${r(0,3)} bruised.`:`Breve parapiglia al voto: ${r(1,5)} allontanati; ${r(0,3)} contusi.`;
  }else{
    committeeTitle.textContent = (style==='wtf') ? (T.scientificTitle||'Motivazione scientifica') : (T.seriousTitle||'Motivazione');
    motIco.style.display='none';
    chipsWrap.style.display='none';
  }
}

/* ==== Esecuzione principale ==== */
(async ()=>{
  const sel = document.getElementById('langSelect');
  if(sel) sel.value = lang;

  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const surprise = (new URLSearchParams(location.search)).get('src')==='surprise'
                   || req?.surprise === true
                   || req?.micro?.surprise === true
                   || LS.getItem('surprise_mode')==='1';

  let domanda = req.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda);
  updateCreditInfo(); 
  qView.textContent = domanda || '—';

  // ✅ Gating crediti PRIMA della chiamata (con fallback sicuro allo Store)
  if(!IS_ADMIN){
    const left = getAvailable();
    if(!(left===Infinity) && left<=0){
      openStore();
      answerEl.textContent = (I18N[lang]||I18N.it).noCredits || 'Crediti esauriti.';
      return;
    }
    if(!consumeOne()){
      openStore();
      answerEl.textContent = (I18N[lang]||I18N.it).noCredits || 'Crediti esauriti.';
      return;
    }
  }

  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetch("/api/ask",{
      method:"POST",
      headers,
      body:JSON.stringify({ domanda, lang, stile: style, periodo, system: (style==='wtf'?SYSTEM_WTF:SYSTEM_WHIF), extra:"", micro:req.micro||{} })
    });
    const data = await r.json().catch(()=>null);
    if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

    // Risposta principale
    let answerText = normalizeOneParagraph((data.answer||"").trim());
    const maxSent = (style==='wtf') ? 9 : 11;
    let parts = answerText.split(/(?<=[.!?…])\s+/);
    if(parts.length > maxSent) parts = parts.slice(0, maxSent);
    answerText = parts.join(" ").trim();
    if(!/[.!?…]$/.test(answerText)) answerText+='.';
    answerEl.textContent = answerText;
    decorateEmBits(answerEl);

    // Probabilità & motivazione
    const { pct } = computeProbability(domanda);
    const pctStr = pct + "%";
    topPct.textContent = pctStr;
    bottomPct.textContent = pctStr;

    const T = I18N[lang] || I18N.it;
    if (surprise){
      renderCommitteeLike(true);
    } else {
      renderCommitteeLike(false);
      motNote.textContent = (style==='wtf') ? pickScientificMotivation() : shortMotivationFromAnswer(answerText, domanda);
    }

    // storia locale
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now(), surprise, pct, motivazione: (style==='wtf')? undefined : motNote.textContent });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

  }catch(e){
    answerEl.textContent = (I18N[lang]||I18N.it).error;
    console.error(e);
  }
})();

/* ==== Messaggi da store / rewarded ==== */
window.addEventListener("message",(ev)=>{
  const d = ev.data || {};
  if(d.type === "purchase_completed"){
    addCredits(parseInt(d.amount,10)||0);
    closeOverlay();
  }
  if(d.type === "open_rewarded"){
    openRewarded();
  }
  if(d.type === "rewarded_completed"){
    addCredits(parseInt(d.amount,10)||1);
    closeOverlay();
  }
  if(d.type === "close_overlay"){
    closeOverlay();
  }
});

qs('#backBtn').onclick = ()=> history.length > 1 ? history.back() : location.replace('index.html');
qs('#homeBtn').onclick = ()=> location.href='index.html';

  LS.setItem('lang', v);

};
qs('#shareBtn').onclick = async()=>{
  const T = I18N[lang] || I18N.it;
  const full = `What?f — ${style==='wtf'?(T.styleWTF||'What the F'):(T.styleWHF||'What if')}\n(${periodo})\n\nQ: ${LS.getItem('domanda')}\n\n${qs('#answer').textContent}`;
  try{
    if(navigator.share){ await navigator.share({ title: "What?f", text: full }); }
    else{
      await navigator.clipboard.writeText(full);
      const b=qs('#shareBtn'); b.textContent=T.copied; setTimeout(()=>b.textContent=T.share,1200);
    }
  }catch{}
};
qs('#againBtn').onclick = ()=>{ location.href='fourth.html'; };
