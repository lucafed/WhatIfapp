<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<style>
  :root{--line:rgba(255,255,255,.12)}
  body{margin:0;background:#0B0B0C;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:860px;margin:auto;padding:22px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  .btn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,#1C57A0,#FFEC01);border:none;color:#0A0E12;font-weight:800}
  .card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  .label{color:#FFEC01;font-weight:800;margin-bottom:8px}
  .input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
  .lead{opacity:.86;margin:0 0 8px}
  .story{line-height:1.65;font-size:18px;text-wrap:pretty}
  .badge{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;background:rgba(255,255,255,.06)}
</style>
</head>
<body>
<main>
  <div class="row">
    <div class="row">
      <button class="btn" onclick="history.back()">←</button>
      <button class="btn" onclick="location.href='index.html'">🏠</button>
    </div>
    <div class="row">
      <span id="styleBadge" class="badge">—</span>
      <span id="langBadge" class="badge">IT</span>
    </div>
  </div>

  <h2 id="title">Risultato</h2>
  <p id="subtitle" class="lead">—</p>

  <div class="card">
    <div class="label">La tua domanda</div>
    <div id="qView" class="input" style="min-height:44px"></div>
  </div>

  <div class="card">
    <div class="label">Risposta</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="copyBtn">📤 Condividi / Copia</button>
      <button class="btn" onclick="location.href='fourth.html'">🔁 Fai un’altra domanda</button>
    </div>
  </div>
</main>

<script>
  const LS = localStorage;
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const domanda = req.domanda || LS.getItem('domanda') || "";
  const lang = (req.lang || LS.getItem('lang') || 'it').toLowerCase();
  const stile = req.stile || 'whatif';
  const variant = req.whatif_variant || 'poetico';

  document.documentElement.lang = lang;
  document.getElementById('langBadge').textContent = lang.toUpperCase();
  document.getElementById('styleBadge').textContent = (stile==='wtf' ? 'What the F' : `What if · ${variant}`);
  document.getElementById('qView').textContent = domanda || '—';
  document.getElementById('subtitle').textContent = (lang==='en' ? `Question: “${domanda}”` : `Domanda: “${domanda}”`);

  async function run(){
    try{
      const r = await fetch("/api/ask", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(req)
      });
      if(!r.ok){
        const t = await r.text().catch(()=> "");
        document.getElementById('answer').textContent = (lang==='en'?'[server error]':'[errore server]') + ' ' + t;
        return;
      }
      const data = await r.json();
      let txt = String(data.answer||'').trim();
      if(!/[.!?…]$/.test(txt)) txt += ".";
      document.getElementById('answer').textContent = txt;
    }catch(e){
      document.getElementById('answer').textContent = (lang==='en'?'[server error]':'[errore server]');
    }
  }
  run();

  document.getElementById('copyBtn').onclick = async ()=>{
    const txt = document.getElementById('answer').textContent || '';
    try{ await navigator.clipboard.writeText(txt); }catch{}
  };
</script>
</body>
</html>
