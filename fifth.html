<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:rgba(20,28,34,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

/* Traduci: dropdown */
.menu{
  position:absolute; display:none; min-width:200px; z-index:50;
  background:rgba(20,28,34,.98); border:1px solid rgba(255,255,255,.14);
  border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,.45); padding:6px;
}
.menu button{
  display:block; width:100%; text-align:left; background:transparent; border:none; color:#fff;
  padding:10px 12px; border-radius:10px; font-weight:700; cursor:pointer;
}
.menu button:hover{ background:rgba(255,255,255,.08); }

/* evidenzia parentesi comiche tra em-dash */
.embit {
  padding: 0 .08em;
  box-shadow: 0 -4px 0 0 rgba(255,255,255,.05) inset;
  text-shadow: 0 0 12px rgba(255,255,255,.08);
  border-radius: 4px;
}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="listenBtn">🔊 Ascolta</button>
      <div style="position:relative">
        <button class="btn ghost" id="translateBtn">🌐 Traduci</button>
        <div class="menu" id="langMenu" role="menu" aria-labelledby="translateBtn">
          <button data-lang="it">Italiano (IT)</button>
          <button data-lang="en">English (EN)</button>
          <button data-lang="es">Español (ES)</button>
          <button data-lang="fr">Français (FR)</button>
          <button data-lang="de">Deutsch (DE)</button>
        </div>
      </div>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
/* ====== Prefs & stato ====== */
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
let lang  = (LS.getItem('lang') || (navigator.language||'it').slice(0,2)).toLowerCase();
if(!['it','en','es','fr','de'].includes(lang)) lang = 'it';
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' : 'Modalità test attiva';
  }
})();

/* ====== I18N ====== */
const I18N_ALL = {
  it:{tWTF:"⚡ What the F — Risultato", tWHF:"💡 What if — Risultato",
      sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
      share:"📤 Condividi / Copia", listen:"🔊 Ascolta", translate:"🌐 Traduci", again:"🔁 Fai un’altra domanda",
      copied:"Copiato!", copying:"Copio…", error:"[errore server]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Stile: What the F · 6–9 frasi · paragrafo unico · reazioni demenziali · modalità: ${p==='past'?'Passato':'Futuro'}.`
        : `Stile: What if 60/40 · 8–11 frasi · paragrafo unico · analisi+immagini sobrie · modalità: ${p==='past'?'Passato':'Futuro'}.`,
      leads:{
        wtf:[
          "Entri piano, il caos ti riconosce e ti fa passare.",
          "Respiri e lasci che inciampi per primo il destino.",
          "La scena è già in corso: tu ci metti il rumore buono."
        ],
        whatif:[
          "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
          "Ti siedi un attimo e scopri che la calma ha memoria lunga.",
          "La stanza è la stessa, lo sguardo no: è già un inizio."
        ]
      }},
  en:{tWTF:"⚡ What the F — Result", tWHF:"💡 What if — Result",
      sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
      share:"📤 Share / Copy", listen:"🔊 Listen", translate:"🌐 Translate", again:"🔁 Ask another",
      copied:"Copied!", copying:"Copying…", error:"[server error]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · absurd object reactions · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if 60/40 · 8–11 sentences · single paragraph · analysis + sober imagery · mode: ${p==='past'?'Past':'Future'}.`,
      leads:{
        wtf:[
          "You step in slowly; chaos recognizes you and lets you through.",
          "You breathe and let fate be the one who trips first.",
          "The scene is already rolling; you bring the good noise."
        ],
        whatif:[
          "Set the keys down and let the quiet that doesn’t judge go first.",
          "Same room, different gaze — that’s already a start.",
          "Breathe like someone with time, and time believes you."
        ]
      }},
  es:{tWTF:"⚡ What the F — Resultado", tWHF:"💡 What if — Resultado",
      sub:(q)=>`Pregunta: «${q}»`, q:"Tu pregunta", a:"Respuesta",
      share:"📤 Compartir / Copiar", listen:"🔊 Escuchar", translate:"🌐 Traducir", again:"🔁 Hacer otra pregunta",
      copied:"¡Copiado!", copying:"Copiando…", error:"[error del servidor]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Estilo: What the F · 6–9 frases · un párrafo · reacciones absurdas de objetos · modo: ${p==='past'?'Pasado':'Futuro'}.`
        : `Estilo: What if 60/40 · 8–11 frases · un párrafo · análisis + imágenes sobrias · modo: ${p==='past'?'Pasado':'Futuro'}.`,
      leads:{
        wtf:["Entras despacio; el caos te reconoce y te deja pasar."],
        whatif:["Deja las llaves y permite que hable el silencio que no juzga."]
      }},
  fr:{tWTF:"⚡ What the F — Résultat", tWHF:"💡 What if — Résultat",
      sub:(q)=>`Question : « ${q} »`, q:"Votre question", a:"Réponse",
      share:"📤 Partager / Copier", listen:"🔊 Écouter", translate:"🌐 Traduire", again:"🔁 Poser une autre question",
      copied:"Copié !", copying:"Copie…", error:"[erreur serveur]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Style : What the F · 6–9 phrases · un seul paragraphe · réactions d’objets absurdes · mode : ${p==='past'?'Passé':'Futur'}.`
        : `Style : What if 60/40 · 8–11 phrases · un seul paragraphe · analyse + images sobres · mode : ${p==='past'?'Passé':'Futur'}.`,
      leads:{
        wtf:["Tu entres doucement ; le chaos te reconnaît et te laisse passer."],
        whatif:["Pose les clés et laisse parler le silence qui ne juge pas."]
      }},
  de:{tWTF:"⚡ What the F — Ergebnis", tWHF:"💡 What if — Ergebnis",
      sub:(q)=>`Frage: „${q}“`, q:"Deine Frage", a:"Antwort",
      share:"📤 Teilen / Kopieren", listen:"🔊 Anhören", translate:"🌐 Übersetzen", again:"🔁 Weitere Frage stellen",
      copied:"Kopiert!", copying:"Kopiere…", error:"[Serverfehler]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Stil: What the F · 6–9 Sätze · ein Absatz · absurde Objektreaktionen · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`
        : `Stil: What if 60/40 · 8–11 Sätze · ein Absatz · Analyse + schlichte Bilder · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`,
      leads:{
        wtf:["Du trittst langsam ein; das Chaos erkennt dich und lässt dich durch."],
        whatif:["Leg die Schlüssel ab und lass die stille Stimme sprechen, die nicht urteilt."]
      }}
};
function T(){ return I18N_ALL[lang] || I18N_ALL.it; }

/* ====== Utils ====== */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function hashStr(s=""){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; } return Math.abs(h); }
function stablePick(arr, seed){ if(!arr?.length) return ""; if(!seed?.trim()) return pick(arr); return arr[hashStr(seed)%arr.length]; }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }
function normalizeOneParagraph(s=""){ return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?…])/g,"$1").trim(); }

/* ====== DOM refs ====== */
const backBtn=document.getElementById('backBtn');
const homeBtn=document.getElementById('homeBtn');
const styleBadge=document.getElementById('styleBadge');
const titleEl=document.getElementById('title');
const subtitleEl=document.getElementById('subtitle');
const lblQ=document.getElementById('lblQ');
const lblA=document.getElementById('lblA');
const qView=document.getElementById('qView');
const leadEl=document.getElementById('lead');
const answerEl=document.getElementById('answer');
const shareBtn=document.getElementById('shareBtn');
const listenBtn=document.getElementById('listenBtn');
const translateBtn=document.getElementById('translateBtn');
const langMenu=document.getElementById('langMenu');
const againBtn=document.getElementById('againBtn');
const metaInfo=document.getElementById('metaInfo');

/* ====== Navigazione ====== */
backBtn.onclick=()=>history.back();
homeBtn.onclick=()=>location.href='index.html';
againBtn.onclick=()=>{ location.href='fourth.html'; };

/* ====== Domanda / Replay ====== */
const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';
let domanda=""; let answerText="";

function setStaticTexts(q){
  titleEl.textContent = (style==='wtf'? T().tWTF : T().tWHF);
  subtitleEl.textContent = T().sub(q);
  styleBadge.textContent = (style==='wtf') ? T().styleWTF : T().styleWHF;
  lblQ.textContent = T().q;
  lblA.textContent = T().a;
  shareBtn.textContent = T().share;
  listenBtn.textContent = T().listen;
  translateBtn.textContent = T().translate;
  againBtn.textContent = T().again;
  metaInfo.textContent = T().meta(style, periodo);

  const bank = T().leads?.[style] || T().leads?.whatif || [];
  const seed = `${(q||"").toLowerCase().trim()}|${style}|${lang}`;
  leadEl.textContent = oneSentence(stablePick(bank, seed));
}

function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

/* ====== Fetch risposta ====== */
async function fetchAnswer(){
  try{
    answerEl.textContent = '⏳ …';
    const headers = { "Content-Type":"application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetch("/api/ask",{
      method:"POST", headers,
      body:JSON.stringify({ domanda, lang, stile:style, periodo })
    });
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      throw new Error(d.detail||`http_${r.status}`);
    }
    const data = await r.json();
    answerText = normalizeOneParagraph((data.answer||"").trim());
    if(!/[.!?…]$/.test(answerText)) answerText += ".";
    answerEl.textContent = answerText;
    decorateEmBits(answerEl);
  }catch(e){
    console.error(e);
    answerEl.textContent = T().error;
  }
}

/* ====== Traduci (dropdown) ====== */
function openMenu(){
  const rect = translateBtn.getBoundingClientRect();
  langMenu.style.left = (rect.left) + "px";
  langMenu.style.top  = (rect.bottom + 8 + window.scrollY) + "px";
  langMenu.style.display = "block";
}
function closeMenu(){ langMenu.style.display = "none"; }
translateBtn.onclick=(e)=>{ e.stopPropagation(); langMenu.style.display==="block" ? closeMenu() : openMenu(); };
document.addEventListener('click', (e)=>{ if(!langMenu.contains(e.target) && e.target!==translateBtn) closeMenu(); });

langMenu.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click', async ()=>{
    const newLang = b.dataset.lang;
    closeMenu();
    if(newLang===lang) return;
    lang = newLang;
    localStorage.setItem('lang', lang);
    setStaticTexts(domanda);
    await fetchAnswer();
  });
});

/* ====== Condivisione & TTS ====== */
shareBtn.onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n(${periodo}, ${lang.toUpperCase()})\n\nQ: ${domanda}\n\n${answerText}`;
  try{
    if(navigator.share){
      await navigator.share({ title:"What?f", text:full });
    }else{
      shareBtn.textContent = T().copying;
      await navigator.clipboard.writeText(full);
      shareBtn.textContent = T().copied;
      setTimeout(()=>shareBtn.textContent=T().share,1200);
    }
  }catch{}
};

listenBtn.onclick=()=>{
  try{
    const uttr = new SpeechSynthesisUtterance(`${T().a}. ${answerText}`);
    const map = { it:"it-IT", en:"en-US", es:"es-ES", fr:"fr-FR", de:"de-DE" };
    uttr.lang = map[lang] || "it-IT";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(uttr);
  }catch{}
};

/* ====== Init ====== */
if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  setStaticTexts(domanda);
  qView.textContent = domanda || '—';
  answerText = normalizeOneParagraph(r.answer || "");
  answerEl.textContent = answerText || '—';
  decorateEmBits(answerEl);
}else{
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  setStaticTexts(domanda);
  qView.textContent = domanda || '—';
  fetchAnswer();
}
</script>
</body>
</html>
