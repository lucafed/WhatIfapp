<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{--bg:#0B0B0C;--bg2:#101414;--fg:#FFF;--muted:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01;--wtf1:#3A6B56;--wtf2:#5A8C75;--ink:#0A0E12;--glow:rgba(255,236,1,.22)}
html[data-theme="wtf"]{--acc:var(--wtf1);--acc2:var(--wtf2)}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 20% 18%,var(--bg2) 0%,var(--bg) 60%),radial-gradient(600px 480px at 80% 12%,rgba(255,236,1,.06),transparent 60%),radial-gradient(700px 560px at 50% 90%,rgba(28,87,160,.10),transparent 65%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:auto;padding:22px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:12px 0 6px;text-shadow:0 0 18px var(--glow)}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{background:rgba(20,28,34,.92);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px;box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06)}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px}
.story{white-space:normal;line-height:1.68;font-size:18px;letter-spacing:.1px;text-wrap:pretty}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 28px var(--glow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.lead{color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.fade-in{animation:fade .35s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" onclick="history.back()">←</button>
      <button class="btn ghost" onclick="location.href='index.html'">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="btn ghost" id="styleBadge">🎭 —</span>
      <button class="btn ghost" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
const lang = (LS.getItem('lang')||'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };
document.getElementById('styleBadge').textContent = (style==='wtf') ? '🎭 What the F' : '🎭 What if';

function normalizeOneParagraph(s=""){return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim()}
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw.includes("—")) return;
  const parts = raw.split("—"); let html="";
  for(let i=0;i<parts.length;i++){const seg=parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;"); html += (i%2===1) ? `<span class="embit">— ${seg} </span>` : (i===0?seg:`—${seg}`);}
  el.innerHTML=html;
}
function oneSentence(s=""){let t=String(s).trim();const m=t.match(/^([\s\S]*?[.!?…])\s/);if(m)t=m[1];if(!/[.!?…]$/.test(t))t+=".";return t;}
const LEADS = {
  it:{wtf:["Ti presenti al futuro con la faccia di adesso.","La scena è già in corso: tu ci metti il rumore buono.","Respiri e lasci inciampare il destino per primo."],
      whatif:["Ti siedi un attimo e lasci che la calma faccia ordine.","Stessa stanza, sguardo diverso: è già un inizio.","Respiri come chi ha tempo."]},
  en:{wtf:["You bring today’s face and tomorrow’s patience.","The scene is rolling; you supply the good noise."],
      whatif:["Same room, different gaze — already a start.","Breathe like someone with time."]}
};
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function setTitles(q){
  document.getElementById('title').textContent = (style==='wtf' ? (lang==='en'?'What the F — Result':'What the F — Risultato') : (lang==='en'?'What if — Result':'What if — Risultato'));
  document.getElementById('subtitle').textContent = (lang==='en'?'Question: ':'Domanda: ') + '“'+q+'”';
  const leadBank = LEADS[lang]?.[style] || LEADS.it.whatif;
  document.getElementById('lead').textContent = oneSentence(pick(leadBank));
  document.getElementById('metaInfo').textContent = (style==='wtf')
    ? (lang==='en'?`Mode: ${periodo==='past'?'Past':'Future'}.`:`Modalità: ${periodo==='past'?'Passato':'Futuro'}.`)
    : (lang==='en'?`Mode: ${periodo==='past'?'Past':'Future'}.`:`Modalità: ${periodo==='past'?'Passato':'Futuro'}.`);
}
const domanda = LS.getItem('domanda')||"";
setTitles(domanda);
document.getElementById('qView').textContent = domanda || '—';
document.getElementById('againBtn').onclick=()=>{ location.href='fourth.html'; };
document.getElementById('shareBtn').onclick=async()=>{
  const txt = `What?f — ${style==='wtf'?'What the F':'What if'}\nQ: ${domanda}\n\n${document.getElementById('answer').textContent}`;
  try{ await navigator.clipboard.writeText(txt); alert(lang==='en'?'Copied!':'Copiato!'); }catch{ alert(lang==='en'?'Copy failed':'Copia non riuscita'); }
};

// request
(async ()=>{
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  try{
    const headers = {"Content-Type":"application/json"};
    if (JSON.parse(LS.getItem('whatif_prefs')||'{}').pro === true) headers["x-pro"]="1";
    const adminToken = localStorage.getItem("admin_token"); if(adminToken) headers["x-admin-token"]=adminToken;

    const r = await fetch("/api/ask",{method:"POST", headers, body:JSON.stringify(req)});
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
    let answer = normalizeOneParagraph(String(data.answer||""));
    if(!/[.!?…]$/.test(answer)) answer+=".";
    const node = document.getElementById('answer'); node.textContent=answer; decorateEmBits(node);

    // history
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answer, stile:style, periodo, ts:Date.now() });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
  }catch(e){
    document.getElementById('answer').textContent = (lang==='en'?'[server error]':'[errore server]');
  }
})();
</script>
</body>
</html>
