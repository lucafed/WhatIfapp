<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:rgba(20,28,34,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <button class="btn ghost" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
const lang  = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = (lang === 'en') ? '🧪 TEST · ⭐ PRO' : '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' : 'Modalità test attiva';
  }
})();

const I18N={
  it:{tWTF:"⚡ What the F — Risultato", tWHF:"💡 What if — Risultato",
      sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
      share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
      copied:"Copiato!", error:"[errore server]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if"},
  en:{tWTF:"⚡ What the F — Result", tWHF:"💡 What if — Result",
      sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
      share:"📤 Share / Copy", again:"🔁 Ask another",
      copied:"Copied!", error:"[server error]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if"}
}[lang];

document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
document.getElementById('lblQ').textContent=I18N.q;
document.getElementById('lblA').textContent=I18N.a;
document.getElementById('shareBtn').textContent=I18N.share;
document.getElementById('againBtn').textContent=I18N.again;
document.getElementById('styleBadge').textContent = (style==='wtf') ? I18N.styleWTF : I18N.styleWHF;

function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
}

/* ===== LEADS: 1 sola frase, filosofiche/intime, senza oggetti parlanti ===== */
const LEADS = {
  it:{
    wtf:[
      "Entri piano, come chi sa che il caos ti riconosce dalla camminata.",
      "Respiri e lasci che sia il destino a inciampare per primo.",
      "Ti presenti al futuro con la faccia di adesso e la pazienza di domani.",
      "La scena è già in corso: tu ci metti il rumore buono.",
      "Non chiedi permesso al dubbio, gli siedi accanto.",
      "Stai fermo un secondo e la verità trova il tuo volto.",
      "Ti fidi del passo corto perché porta lontano uguale.",
      "L’ansia bussa, ma oggi apre solo la calma.",
      "Dici poco, ascolti forte, e già cambia l’aria.",
      "Il presente ti guarda: vuole solo essere guardato indietro."
    ],
    whatif:[
      "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
      "Ti siedi un attimo e scopri che la calma ha memoria lunga.",
      "La stanza è la stessa, lo sguardo no: è già un inizio.",
      "Tieniti stretto ciò che funziona e lascia che il resto perda importanza.",
      "Respiri come chi ha tempo, e il tempo ti crede.",
      "La risposta non corre: aspetta dove inizi a sentire.",
      "Quando smetti di insistere, ciò che serve insiste su di te.",
      "Il futuro non si conquista: si invita con gentilezza.",
      "Ti concedi il beneficio del dubbio e diventa criterio.",
      "La parte forte di te è quella che non urla."
    ]
  },
  en:{
    wtf:[
      "You step in slowly, the kind of slow that chaos recognizes.",
      "You breathe and let fate be the one who trips first.",
      "You bring today’s face and tomorrow’s patience to the door.",
      "The scene is already rolling; you supply the good noise.",
      "You don’t ask doubt for permission; you sit beside it.",
      "Stand still for a second and truth borrows your face.",
      "Trust the short step; it travels just as far.",
      "Anxiety knocks, but only calm has the keys today.",
      "Say little, listen loudly, and the air changes.",
      "The present stares back, asking only to be seen."
    ],
    whatif:[
      "Set the keys down and let the quiet that doesn’t judge go first.",
      "Sit a moment and notice how calm remembers you.",
      "Same room, different gaze—that’s already a start.",
      "Hold what works close and let the rest lose weight.",
      "Breathe like someone with time, and time believes you.",
      "The answer doesn’t run; it waits where you begin to feel.",
      "When you stop insisting, what matters insists on you.",
      "The future isn’t conquered; it’s invited kindly.",
      "Give yourself the benefit of doubt until it becomes compass.",
      "The strongest part of you is the one that doesn’t shout."
    ]
  }
};

/* ===== Utils ===== */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function hashStr(s=""){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; } return Math.abs(h); }
function stablePick(arr, seedStr){ if(!arr?.length) return ""; if(!seedStr?.trim()) return pick(arr); const h=hashStr(seedStr); return arr[h%arr.length]; }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }

const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';
let domanda=""; let answerText="";

function setTitles(q){
  document.getElementById('title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
  document.getElementById('subtitle').textContent = I18N.sub(q);
  document.getElementById('styleBadge').textContent = (style==='wtf') ? I18N.styleWTF : I18N.styleWHF;
  const bank = LEADS[lang]?.[style] || LEADS['it']['whatif'];
  const seed = `${(q||"").toLowerCase().trim()}|${style}|${lang}`;
  const line = oneSentence(stablePick(bank, seed));
  document.getElementById('lead').textContent = line;
}

if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  answerText = normalizeOneParagraph(r.answer || "");
  setTitles(domanda);
  document.getElementById('qView').textContent = domanda || '—';
  document.getElementById('answer').textContent = answerText || '—';
} else {
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  setTitles(domanda);
  document.getElementById('qView').textContent = domanda || '—';

  (async ()=>{
    navigator.sendBeacon?.("/api/track") || fetch("/api/track",{method:"POST",keepalive:true}).catch(()=>{});
    try{
      const headers = { "Content-Type": "application/json" };
      if (prefs.pro === true) headers["x-pro"] = "1";
      const adminToken = localStorage.getItem("admin_token");
      if (adminToken) headers["x-admin-token"] = adminToken;

      const r = await fetch("/api/ask",{
        method:"POST", headers,
        body:JSON.stringify({
          domanda,
          lang,
          stile:style,
          extra:"",
          micro:req.micro||{},
          periodo
        })
      });

      if(r.status===429){
        document.getElementById('answer').textContent =
          lang==='en'?"Too many requests. Try again later.":"Troppo traffico, riprova più tardi.";
        return;
      }
      if(r.status===402){
        const d=await r.json().catch(()=>({}));
        document.getElementById('answer').textContent =
          lang==='en'?`You used today's free credits (${d?.used||"?"}/${d?.dailyCap||3}).`
                     :`Hai usato i crediti gratuiti di oggi (${d?.used||"?"}/${d?.dailyCap||3}).`;
        return;
      }

      const data = await r.json();
      if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
      answerText = normalizeOneParagraph((data.answer||"").trim());
      if(!/[.!?…]$/.test(answerText)) answerText += ".";
      document.getElementById('answer').textContent = answerText;

      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now() });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
    }catch(e){
      document.getElementById('answer').textContent = I18N.error;
      console.error(e);
    }
  })();
}

document.getElementById('shareBtn').onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n(${periodo})\n\nQ: ${domanda}\n\n${normalizeOneParagraph(answerText)}`;
  try{
    if(navigator.share){
      await navigator.share({ title: "What?f", text: full });
    }else{
      await navigator.clipboard.writeText(full);
      const b=document.getElementById('shareBtn');
      b.textContent = I18N.copied; setTimeout(()=>b.textContent=I18N.share,1200);
    }
  }catch{}
};
document.getElementById('againBtn').onclick=()=>{ location.href='fourth.html'; };
</script>
</body>
</html>
