<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Risposta</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#0E1114; --card:rgba(20,28,34,.92);
  --fg:#EAF3EE; --muted:#9FB1B9; --line:rgba(255,255,255,.12);
  --pill:#111820; --ink:#0B0B0C; --shadow:rgba(0,0,0,.35);
  --acc:#66f0a6; --acc2:#21c06b;
}
*{box-sizing:border-box}
html,body{margin:0;background:
radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:10px 0 4px}
h2{font-size:18px;margin:0 0 8px;color:var(--acc)}
.input, textarea{width:100%;background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.btn{appearance:none;border:1px solid var(--line);background:var(--pill);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0B0B0C;font-weight:800;border:none;box-shadow:0 8px 24px var(--shadow)}
.meta{font-size:12px;color:var(--muted)}
.answer{white-space:pre-wrap;line-height:1.55;font-size:18px}
.badge{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.pill{background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:10px 12px;font-size:14px}
.divider{height:1px;background:var(--line);margin:10px 0}
.follow{display:flex;flex-direction:column;gap:10px}
.follow button{justify-content:flex-start;text-align:left}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="metaBadge">—</span>
    </div>
  </div>

  <h1 id="titleH">Il tuo What?f</h1>

  <div class="card">
    <h2 id="qLabel">La tua domanda</h2>
    <div class="pill" id="qText">—</div>
  </div>

  <div class="card">
    <h2 id="resLabel">Risultato</h2>
    <div class="answer" id="answer">…</div>
    <div class="divider"></div>
    <div class="meta" id="stamp">—</div>
  </div>

  <div class="card" id="contCard">
    <h2 id="contLabel">Domani continuiamo da qui</h2>
    <div class="follow" id="followWrap">
      <!-- 2 suggerimenti AI -->
    </div>
    <div class="row" style="margin-top:8px">
      <input id="followInput" class="input" placeholder="Oppure scrivi qui cosa vuoi sapere…" />
      <button class="btn primary" id="saveFollowBtn">Salva per domani</button>
    </div>
  </div>
</main>

<script>
/* ===== i18n ===== */
const I18N={
  it:{
    title:"Il tuo What?f",
    q:"La tua domanda", res:"Risultato",
    meta:(p,s)=>`${p==='past'?'Passato':'Futuro'} · ${s==='wtf'?'What the F':'What if'}`,
    cont:"Domani continuiamo da qui",
    placeholder:"Oppure scrivi qui cosa vuoi sapere…",
    save:"Salva per domani",
    saved:"Salvata per domani ✅",
    failed:"Impossibile generare i follow-up ora."
  },
  en:{
    title:"Your What?f",
    q:"Your question", res:"Result",
    meta:(p,s)=>`${p==='past'?'Past':'Future'} · ${s==='wtf'?'What the F':'What if'}`,
    cont:"Tomorrow we continue from here",
    placeholder:"Or type what you want to know…",
    save:"Save for tomorrow",
    saved:"Saved for tomorrow ✅",
    failed:"Can’t generate follow-ups right now."
  }
};
const LS=localStorage;
const session = JSON.parse(LS.getItem('whatif_session')||'{}'); // domanda/extra/stile/periodo/lang
const lang=(session.lang||LS.getItem('lang')||'it').toLowerCase().startsWith('en')?'en':'it';
const T=I18N[lang];
document.documentElement.lang=lang;

/* UI bind */
const $=id=>document.getElementById(id);
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('titleH').textContent=T.title;
$('qLabel').textContent=T.q;
$('resLabel').textContent=T.res;
$('contLabel').textContent=T.cont;
$('followInput').placeholder=T.placeholder;
$('saveFollowBtn').textContent=T.save;

/* ===== resume logic (no rigenera) ===== */
const resumeId = LS.getItem('resume_id'); // se esiste, carico cronologia e stop
if(resumeId){
  const hist = JSON.parse(LS.getItem('cronologia')||'[]');
  const found = hist.find(x=>String(x.id)===String(resumeId));
  if(found){
    $('qText').textContent = found.domanda || '—';
    $('answer').textContent = found.risposta || '…';
    $('metaBadge').textContent = T.meta(found.periodo||'future', found.stile||'whatif');
    $('stamp').textContent = new Date(found.ts).toLocaleString(lang==='en'?'en-GB':'it-IT',{hour12:false});
    LS.removeItem('resume_id');
    // genera follow-up basati su domanda+risposta salvata
    genFollowUps(found.domanda, found.risposta, found.stile, found.periodo);
  }else{
    LS.removeItem('resume_id'); // safety
    startGeneration(); // fallback
  }
}else{
  startGeneration();
}

/* ===== generation via /api/ask ===== */
async function startGeneration(){
  const domanda = session.domanda || LS.getItem('domanda') || '—';
  $('qText').textContent = domanda;
  $('metaBadge').textContent = T.meta(session.periodo||'future', session.stile||'whatif');

  try{
    const body = {
      domanda,
      lang,
      stile: session.stile||'whatif',
      profilo: JSON.parse(LS.getItem('profilo')||'{}')
    };
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j = await r.json();
    const text = j.answer || '…';
    $('answer').textContent = text;
    $('stamp').textContent = new Date().toLocaleString(lang==='en'?'en-GB':'it-IT',{hour12:false});

    // push in cronologia
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    const item = {
      id: Date.now(),
      domanda, risposta:text,
      stile: session.stile||'whatif',
      periodo: session.periodo||'future',
      lang, ts: Date.now()
    };
    hist.unshift(item); LS.setItem('cronologia', JSON.stringify(hist));

    // follow-up auto
    genFollowUps(domanda, text, item.stile, item.periodo);
  }catch(e){
    $('answer').textContent = 'Errore server';
  }
}

/* ===== follow-up (2 suggerimenti pertinenti) ===== */
async function genFollowUps(q, a, stile, periodo){
  const wrap=$('followWrap'); wrap.innerHTML='';
  try{
    const r = await fetch('/api/followups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      domanda:q, risposta:a, lang, stile, periodo
    })});
    if(!r.ok) throw new Error('no endpoint');
    const j = await r.json();
    (j.suggestions||[]).slice(0,2).forEach(txt=>addFollowButton(txt));
  }catch(_){
    // fallback locale semplice (se l’endpoint non c’è)
    const f1 = lang==='en'
      ? "What's the first tiny sign that would tell you it’s working?"
      : "Qual è il primo segnale piccolo che ti direbbe che sta funzionando?";
    const f2 = lang==='en'
      ? "What can you try in 7 days without real risk?"
      : "Cosa puoi provare entro 7 giorni senza rischiare davvero?";
    [f1,f2].forEach(addFollowButton);
    const warn=document.createElement('div'); warn.className='meta'; warn.textContent=T.failed;
    wrap.appendChild(warn);
  }
}
function addFollowButton(text){
  const b=document.createElement('button');
  b.className='btn'; b.style.width='100%'; b.textContent='• '+text;
  b.onclick=()=>{ $('followInput').value = text; window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); };
  $('followWrap').appendChild(b);
}

/* ===== save follow for tomorrow ===== */
$('saveFollowBtn').onclick=()=>{
  const t = $('followInput').value.trim(); if(!t) return;
  const arr = JSON.parse(LS.getItem('salvate')||'[]');
  arr.unshift({ id:Date.now(), domanda:t, stile:(session.stile||'whatif'), ts:Date.now() });
  LS.setItem('salvate', JSON.stringify(arr));
  $('followInput').value=''; alert((lang==='en')?T.saved:T.saved);
};
</script>
</body>
</html>
