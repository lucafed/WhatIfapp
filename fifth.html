<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What?f – Risultato</title>
<style>
:root{
  --bg:#0B0B0C;--bg2:#101414;--fg:#fff;--muted:#A0B2BA;
  --acc:#1C57A0;--acc2:#FFEC01;--line:rgba(255,255,255,.14);--chip:#121A26;--card:rgba(20,28,34,.92);--shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{--acc:#3A6B56;--acc2:#5A8C75;}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);color:#eaf3ee;border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.primary{border:none;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;box-shadow:0 6px 18px var(--shadow)}
h1{margin:12px 0 6px;color:var(--acc2);font-size:clamp(22px,5vw,32px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.qbox,.abox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;white-space:pre-wrap;line-height:1.7}
.sug{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:12px 14px;border-radius:12px;margin:8px 0;cursor:pointer}
input[type=text]{width:100%;height:46px;border-radius:12px;padding:10px 12px;border:1.2px solid rgba(255,255,255,.35);background:#132032;color:#fff}
.skeleton{display:inline-block;min-height:1em;width:40%;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <button class="btn" id="back">←</button>
      <button class="btn" id="home">🏠</button>
    </div>
    <div>
      <button class="btn" id="period">🕰️ —</button>
      <button class="btn" id="style">🎭 —</button>
      <button class="btn" id="lang">IT</button>
    </div>
  </div>

  <h1 id="ttl">Il tuo What?f</h1>

  <div class="card">
    <h3 class="label" id="ql">La tua domanda</h3>
    <div class="qbox" id="question">—</div>
  </div>

  <div class="card">
    <h3 class="label" id="rl">Risultato</h3>
    <div class="abox" id="answer">⏳ <span class="skeleton"></span></div>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="btn" id="save">💾 Salva</button>
      <button class="btn" id="copy">📋 Copia</button>
      <button class="btn" id="share">📤 Condividi</button>
    </div>
  </div>

  <div class="card">
    <h3 class="label" id="fl">Domani continuiamo da qui</h3>
    <div id="s1" class="sug">—</div>
    <div id="s2" class="sug">—</div>
    <div id="or" style="text-align:center;color:#A0B2BA;margin:8px 0">oppure</div>
    <input id="next" type="text" placeholder="Scrivi tu cosa vuoi sapere domani…">
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn primary" id="nextBtn">Avanti</button>
    </div>
  </div>
</main>

<script>
/* helpers */
function $(id){return document.getElementById(id)}
function readJ(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d));}catch{return d}}
function writeJ(k,v){localStorage.setItem(k,JSON.stringify(v))}
function tz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch{return'UTC'}}
function sanitize(style,text){
  var out=(text||'').trim().replace(/[“”"«»]/g,'');
  if(style==='wtf'){
    var bits=out.split(/\n+|(?<=[.!?])\s+/).map(function(s){return s.trim()}).filter(Boolean);
    var lines=[]; for(var b of bits){var w=b.split(/\s+/); for(var i=0;i<w.length;i+=15) lines.push(w.slice(i,i+15).join(' '));}
    lines=lines.filter(function(x){return !/(cuore|anima|destino)/i.test(x)}).slice(0,11);
    if(!/bancone|domani|giro|conto/i.test(lines[lines.length-1]||'')) lines.push(lang==='it'?'Clink. Stesso bancone, domani rimescoliamo.':'Clink. Same counter, we stir again tomorrow.');
    return lines.join('\n');
  }
  return out.split(/\n+|(?<=[.!?])\s+/).map(function(s){return s.trim()}).filter(Boolean).slice(0,13).join('\n');
}

/* i18n */
var lang=(localStorage.getItem('lang')||'it').toLowerCase();
var T={ it:{
  ttl:"Il tuo What?f", ql:"La tua domanda", rl:"Risultato", fl:"Domani continuiamo da qui",
  or:"oppure", next:"Avanti", saved:"Salvato!", copied:"Copiato!",
  pPast:"Passato", pFut:"Futuro", sWTF:"What the F", sWIF:"What if",
  thinking:"Sto immaginando il tuo scenario…", net:"Errore di rete.", nopic:"Nessuna domanda — torna indietro."
}, en:{
  ttl:"Your What?f", ql:"Your question", rl:"Result", fl:"Tomorrow we continue from here",
  or:"or", next:"Next", saved:"Saved!", copied:"Copied!",
  pPast:"Past", pFut:"Future", sWTF:"What the F", sWIF:"What if",
  thinking:"Imagining your scenario…", net:"Network error.", nopic:"No question — go back."
}};
function applyI18N(){
  $('ttl').textContent=T[lang].ttl; $('ql').textContent=T[lang].ql; $('rl').textContent=T[lang].rl; $('fl').textContent=T[lang].fl;
  $('or').textContent=T[lang].or; $('nextBtn').textContent=T[lang].next; $('lang').textContent=lang.toUpperCase();
  $('period').textContent='🕰️ '+(prefs.periodo==='past'?T[lang].pPast:T[lang].pFut);
  $('style').textContent='🎭 '+(prefs.stile==='wtf'?T[lang].sWTF:T[lang].sWIF);
}
var prefs=readJ('whatif_prefs',{periodo:'future',stile:'whatif'});
document.documentElement.setAttribute('data-theme',prefs.stile==='wtf'?'wtf':'whatif');
applyI18N();

/* nav */
$('back').onclick=()=>history.back();
$('home').onclick=()=>location.href='index.html';
$('lang').onclick=()=>{lang=lang==='it'?'en':'it';localStorage.setItem('lang',lang);applyI18N();}
$('period').onclick=()=>{prefs.periodo=prefs.periodo==='past'?'future':'past';writeJ('whatif_prefs',prefs);applyI18N();}
$('style').onclick=()=>{prefs.stile=prefs.stile==='wtf'?'whatif':'wtf';writeJ('whatif_prefs',prefs);document.documentElement.setAttribute('data-theme',prefs.stile==='wtf'?'wtf':'whatif');applyI18N();}

/* domanda */
var domanda=(localStorage.getItem('domanda')||'').trim();
if(!domanda){$('question').textContent=T[lang].nopic; $('answer').textContent='';}
else{$('question').textContent=domanda;}

/* generate */
async function ask(){
  var clar={}; try{clar=JSON.parse(localStorage.getItem('clar_override')||'null')||{}}catch(e){}
  var placeholder='⏳ '+T[lang].thinking+' '; $('answer').textContent=placeholder; var sk=document.createElement('span'); sk.className='skeleton'; $('answer').appendChild(sk);

  // 1) tentativo stream
  try{
    var resp=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domanda,lang,periodo:prefs.periodo,stile:prefs.stile,clarifications:clar,stream:true,tz:tz()})});
    if(resp.ok && resp.body){
      var reader=resp.body.getReader(); var dec=new TextDecoder(); var buf="", out="";
      while(true){
        var ch=await reader.read(); if(ch.done) break;
        buf+=dec.decode(ch.value,{stream:true});
        var parts=buf.split("\n\n"); buf=parts.pop();
        for(var c of parts){
          if(c.indexOf('data: ')!==0) continue;
          try{
            var d=JSON.parse(c.slice(6));
            if(d.token){ out+=d.token; $('answer').textContent=out; }
            if(d.done){ out=sanitize(prefs.stile,out); $('answer').textContent=out; makeFollowups(out); return; }
          }catch(e){}
        }
      }
    }
  }catch(e){/* ignora */}
  // 2) fallback non-stream
  try{
    var r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domanda,lang,periodo:prefs.periodo,stile:prefs.stile,clarifications:clar,stream:false,tz:tz()})});
    if(r.ok){
      var j=await r.json();
      var text=sanitize(prefs.stile, (j.text||j.answer||'').toString());
      if(text){ $('answer').textContent=text; makeFollowups(text); return; }
    }
  }catch(e){/* ignora */}
  // 3) fallback locale
  var local = (prefs.stile==='wtf')
    ? (lang==='it'
       ? "Aprire il file? Clink. Se va male, almeno il bartender sa il tuo nome. Domani rimescoliamo."
       : "Open the tab? Clink. Worst case, the bartender knows your name. Tomorrow we stir again.")
    : (lang==='it'
       ? "Un passo alla volta, senza fanfare. Domani ripartiamo da qui."
       : "One step at a time, no fanfare. Tomorrow we pick up from here.");
  $('answer').textContent=local; makeFollowups(local);
}
ask();

/* follow-ups */
async function makeFollowups(text){
  var s1=''; var s2='';
  // prova server
  try{
    var r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({want:'followups',domanda,answer:text,lang,periodo:prefs.periodo,stile:prefs.stile})});
    if(r.ok){var j=await r.json(); if(j.followups&&j.followups.length){s1=j.followups[0]||''; s2=j.followups[1]||'';}}
  }catch(e){}
  // fallback locale
  if(!s1||!s2){
    var topic=(domanda.match(/[a-zA-Zà-ùÀ-Ù']+/g)||[]).slice(0,3).join(' ');
    if(lang==='it'){s1=s1||`Qual è il primo segnale su “${topic}” che ti direbbe che sta funzionando?`; s2=s2||`Cosa potresti fare entro 7 giorni per provarci senza rischiare troppo?`;}
    else{s1=s1||`What's the first signal around “${topic}” that would tell you it's working?`; s2=s2||`What could you do within 7 days to try without big risks?`;}
  }
  $('s1').textContent=s1; $('s2').textContent=s2;
  $('s1').onclick=()=>{$('next').value=s1}; $('s2').onclick=()=>{$('next').value=s2};
}

/* save/share */
$('save').onclick=()=>{var arr=readJ('cronologia',[]);arr.unshift({domanda,risposta:($('answer').textContent||'').trim(),ts:Date.now(),periodo:prefs.periodo,stile:prefs.stile,lang});writeJ('cronologia',arr.slice(0,200));alert(T[lang].saved);}
$('copy').onclick=()=>{navigator.clipboard.writeText(T[lang].ql+": "+domanda+"\n\n"+$('answer').textContent).then(()=>alert(T[lang].copied));}
$('share').onclick=()=>{var data={title:'What?f',text:T[lang].ql+": "+domanda+"\n\n"+$('answer').textContent,url:location.href}; if(navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(data.text);}

/* next */
$('nextBtn').onclick=()=>{var v=($('next').value||'').trim()||$('s1').textContent||$('s2').textContent; if(v){writeJ('whatif_next_prompt',{base:domanda,next:v,ts:Date.now(),lang,periodo:prefs.periodo,stile:prefs.stile}); $('next').value=''; $('nextBtn').textContent=lang==='it'?'Fatto ✅':'Saved ✅'; setTimeout(()=>{$('nextBtn').textContent=T[lang].next},1100);}};
</script>
</body>
</html>
