<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f – Risposta</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{ --bg:#0B0B0C; --bg2:#101414; --fg:#EAF3EE; --muted:#9EB0B8;
  --acc:#1C57A0; --acc2:#FFEC01; --card:#141C22F0; --line:#FFFFFF20; --chip:#121A26; --shadow:rgba(0,0,0,.35);}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.large{padding:14px 18px;font-size:16px}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee}
h1{font-size:clamp(22px,5vw,30px);margin:8px 0 2px;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;white-space:pre-wrap;line-height:1.7;font-size:17px;letter-spacing:.1px}
.skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.08),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Il tuo What?f — Episodio 1</h1>

  <div class="card">
    <h3 class="label" id="qLabel">Domanda</h3>
    <div id="question" class="box"></div>
    <div class="row" style="margin-top:6px">
      <span class="badge" id="extraBadge" style="display:none"></span>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary large" id="regenBtn">🔁 Rigenera episodio</button>
    </div>
  </div>

  <div class="card">
    <h3 class="label" id="rLabel">Episodio</h3>
    <div id="result" class="box">⏳ Sto immaginando il tuo episodio… <span class="skeleton" style="width:36%"></span></div>

    <div class="row" style="gap:8px;margin-top:12px">
      <button class="btn" id="saveBtn">💾 Salva</button>
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="shareBtn">📤 Condividi</button>
    </div>
  </div>
</main>

<script>
const LS=localStorage,$=id=>document.getElementById(id);

/* I18N */
const I18N={it:{
  title:"Il tuo What?f — Episodio 1",
  qLabel:"Domanda", rLabel:"Episodio",
  thinking:"Sto immaginando il tuo episodio…",
  saved:"Salvato!", copied:"Copiato!",
  styleWhatIf:"What if", styleWTF:"What the F",
  extra:"Dettaglio: ",
  regen:"🔁 Rigenera episodio"
},en:{
  title:"Your What?f — Episode 1",
  qLabel:"Question", rLabel:"Episode",
  thinking:"Imagining your episode…",
  saved:"Saved!", copied:"Copied!",
  styleWhatIf:"What if", styleWTF:"What the F",
  extra:"Detail: ",
  regen:"🔁 Regenerate"
}};
function getLang(){return (LS.getItem('lang')||'it').toLowerCase();}
function setLang(v){LS.setItem('lang',v);location.reload();}
let lang=getLang(),T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;
$('titleH1').textContent=T.title; $('qLabel').textContent=T.qLabel; $('rLabel').textContent=T.rLabel;
$('result').innerHTML=`⏳ ${T.thinking} <span class="skeleton" style="width:36%"></span>`;
$('langBtn').textContent=lang.toUpperCase(); $('regenBtn').textContent=T.regen;

/* Theme */
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;}}
const prefs=readJSON('whatif_prefs',{stile:'whatif'}); document.documentElement.setAttribute('data-theme',prefs.stile==='wtf'?'wtf':'whatif');
$('styleBadge').textContent=prefs.stile==='wtf'?T.styleWTF:T.styleWhatIf;

/* Nav */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>setLang(lang==='it'?'en':'it');

/* Inputs */
const domanda=LS.getItem('domanda')||''; $('question').textContent=domanda||'—';
const extra=(LS.getItem('whatif_clarify_buffer')||'').trim(); if(extra){ const b=$('extraBadge'); b.style.display='inline-block'; b.textContent=T.extra+extra; }

/* === GENERATION ===
   Sostituisci fakeAI con la tua /api/ask
   Passa sia 'domanda' sia 'extra' (clarifications).
*/
function fakeAI(style,q,extra){
  const withExtra = extra ? (lang==='en'?` (note: ${extra})`:` (nota: ${extra})`) : '';
  const base = style==='wtf'
    ? `Ok, ${q || 'amico'}, pensaci con un bicchiere in mano: meno drama, più risate${withExtra}.`
    : `Sai già che non lo faresti per nostalgia: è più un esperimento di equilibrio${withExtra}.`;
  return new Promise(r=>setTimeout(()=>r(base),600));
}

/* Sanitizer + chiusure */
function sanitize(style,raw){
  let out=(raw||'').trim().replace(/[“”"«»]/g,'');
  const parts=out.split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  out=parts.join('\n');

  if(style==='wtf'){
    const hook=`Clink. Stesso bancone, domani rimescoliamo.`;
    if(!/bancone|domani rimescoliamo|clink/i.test(out)){ out += `\n${hook}`; }
  }else{
    const hook = lang==='en'
      ? `Tomorrow we unlock Episode 2 at 09:00. Keep sharing bits of you and I’ll show where this goes.`
      : `Domani sblocchiamo l’Episodio 2 alle 09:00. Continua a conoscerci e ti dico dove va la storia.`;
    if(!/Episodio 2|Episode 2/i.test(out)){ out += `\n${hook}`; }
  }
  return out.trim();
}

async function generate(){
  const style=prefs.stile==='wtf'?'wtf':'whatif';
  const txt = await fakeAI(style,domanda,extra); // <-- chiamata reale qui
  $('result').textContent = sanitize(style,txt);
  // salva in cronologia
  const arr=readJSON('cronologia',[]);
  arr.unshift({domanda, risposta:$('result').textContent, stile:style, lang, ts:Date.now()});
  LS.setItem('cronologia',JSON.stringify(arr.slice(0,100)));
}
generate();
$('regenBtn').onclick=generate;

/* Tools */
$('saveBtn').onclick=()=>{
  const arr=readJSON('cronologia',[]);
  arr.unshift({domanda, risposta:$('result').textContent, stile:prefs.stile, lang, ts:Date.now()});
  LS.setItem('cronologia',JSON.stringify(arr.slice(0,100)));
  alert(T.saved);
};
$('copyBtn').onclick=()=>{
  navigator.clipboard.writeText(`${T.qLabel}: ${domanda}\n\n${$('result').textContent}`).then(()=>alert(T.copied));
};
$('shareBtn').onclick=()=>{
  const data={title:"What?f",text:`${T.qLabel}: ${domanda}\n\n${$('result').textContent}`,url:location.href};
  if(navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(`${T.qLabel}: ${domanda}\n\n${$('result').textContent}`);
};
</script>
</body>
</html>
