<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
  --wtf1:#3A6B56; --wtf2:#5A8C75;
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.answer{white-space:pre-wrap;line-height:1.6}
.meta{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <!-- Topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="copyBtn">📋</button>
      <button class="btn" id="shareBtn">🔗</button>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">—</h1>
  <div class="meta" id="subtitle">—</div>

  <!-- Answer -->
  <div class="card">
    <div class="label" id="lblAnswer">Risultato</div>
    <div class="answer" id="answerBox">…</div>
    <div class="meta" id="metaInfo"></div>
  </div>

  <!-- Teasers for tomorrow (no continuation today) -->
  <div class="card" id="followCard" style="display:none">
    <div class="label" id="followTitle">Domani continuiamo da qui</div>
    <div id="followList" class="answer" style="font-size:16px"></div>
    <div class="sep"></div>
    <textarea id="customFollow" rows="3" placeholder="Aggiungi un tuo spunto per il seguito…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <button class="btn ghost" id="homeBtn2">🏠 Home</button>
    </div>
    <p class="small" id="saveInfo"></p>
  </div>
</main>

<script>
const LS = localStorage;
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future'});
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
const lang = (LS.getItem('lang') || 'it').toLowerCase();

document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* I18N */
const I18N = {
  it:{
    tWTF:"⚡ What the F — Episodio",
    tWHF:"💡 What?f — Episodio",
    sub:(q,p)=>`Domanda: “${q}” · Periodo: ${p==='past'?'Passato (controfattuale)':'Futuro'}`,
    result:"Risultato",
    savedForTomorrow:"✅ Salvato per domani.",
    customPH:"Aggiungi un tuo spunto per il seguito…",
    teasersTitle:"Domani continuiamo da qui",
    suggBusy:"⏳ Creo 3 spunti coerenti con la storia…",
    copyOK:"Copiato!",
    shareText:"Guarda questo episodio:",
    live:"(generata ora)",
    replay:"(risposta salvata)"
  },
  en:{
    tWTF:"⚡ What the F — Episode",
    tWHF:"💡 What?f — Episode",
    sub:(q,p)=>`Question: “${q}” · Period: ${p==='past'?'Past (counterfactual)':'Future'}`,
    result:"Result",
    savedForTomorrow:"✅ Saved for tomorrow.",
    customPH:"Add your own cue for the next part…",
    teasersTitle:"We’ll pick it up tomorrow",
    suggBusy:"⏳ Crafting 3 story-coherent teasers…",
    copyOK:"Copied!",
    shareText:"Check this episode:",
    live:"(generated now)",
    replay:"(saved answer)"
  }
}[lang];

/* UI */
const $ = (id)=>document.getElementById(id);
$('langBtn').textContent = lang.toUpperCase();
$('lblAnswer').textContent = I18N.result;
$('followTitle').textContent = I18N.teasersTitle;
$('customFollow').placeholder = I18N.customPH;

$('backBtn').onclick = ()=>history.back();
$('homeBtn').onclick = ()=>location.href='index.html';
$('homeBtn2').onclick = ()=>location.href='index.html';
$('langBtn').onclick = ()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

$('copyBtn').onclick = async ()=>{
  const domanda = LS.getItem('domanda') || '';
  const text = `Q: ${domanda}\n\n${$('answerBox').textContent}`;
  await navigator.clipboard.writeText(text);
  $('copyBtn').textContent = I18N.copyOK;
  setTimeout(()=> $('copyBtn').textContent = '📋', 1200);
};
$('shareBtn').onclick = async ()=>{
  const domanda = LS.getItem('domanda') || '';
  const text = `${I18N.shareText}\n\nQ: ${domanda}\n\n${$('answerBox').textContent}`;
  if (navigator.share) { try{ await navigator.share({ text }); } catch{} }
  else { await navigator.clipboard.writeText(text); $('copyBtn').textContent = I18N.copyOK; setTimeout(()=> $('copyBtn').textContent = '📋', 1200); }
};

/* Title & subtitle */
const domanda = LS.getItem('domanda') || "E se tornassi a vivere all’Aquila?";
$('title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
$('subtitle').textContent = I18N.sub(domanda, periodo);

/* Generate episode */
(async () => {
  try{
    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ domanda, lang, stile: style, periodo })
    });
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail || "bad_response");
    const answer = (data.answer||"").trim();
    $('answerBox').textContent = answer;
    $('metaInfo').textContent = I18N.live;

    // Save in history (for replay tomorrow)
    const hist = readJSON('cronologia',[]);
    hist.unshift({ domanda, risposta: answer, stile: style, lang, periodo, ts: Date.now() });
    writeJSON('cronologia', hist.slice(0,50));

    // Build teasers coherent with this answer
    await buildSuggestions(answer);
  }catch(err){
    $('answerBox').textContent = '[server error] ' + (err?.message||err);
  }
})();

async function buildSuggestions(answerText){
  const list = $('followList');
  const followCard = $('followCard');
  list.textContent = I18N.suggBusy;

  let teasers = [];
  try{
    const rr = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ domanda, lang, stile: style, periodo, follow: true, answer: answerText })
    });
    const dj = await rr.json();
    if (Array.isArray(dj.followups)) teasers = dj.followups.slice(0,3);
  }catch(e){ console.error("follow teasers error", e); }

  if (!teasers.length) {
    teasers = (lang==='en'
      ? ["Choose one tiny move you’ll test", "Return to that place you noticed", "Write the first line you’ll say"]
      : ["Scegli una piccola mossa da testare", "Torna in quel posto che hai notato", "Scrivi la prima frase che dirai"]);
  }

  list.innerHTML = "";
  teasers.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'input';
    chip.style.cursor = 'pointer';
    chip.textContent = "• " + t;
    chip.onclick = () => { $('customFollow').value = t; };
    list.appendChild(chip);
  });

  followCard.style.display = 'block';
}

/* Save for tomorrow (no continuation today) */
$('saveBtn').onclick = ()=>{
  const v = ($('customFollow').value||"").trim();
  const saved = readJSON('next_prompts',[]);
  saved.unshift({ q: v || "—", base: domanda, stile: style, lang, periodo, ts: Date.now() });
  writeJSON('next_prompts', saved.slice(0,50));
  $('saveInfo').textContent = I18N.savedForTomorrow;
  $('customFollow').value = "";
};
</script>
</body>
</html>
