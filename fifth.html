<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risposta</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:
radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.answer{white-space:pre-wrap;line-height:1.5}
.meta{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="hTitle">Il tuo What?f</h1>

  <div class="card">
    <div class="label" id="lblQuestion">La tua domanda</div>
    <div class="input" style="min-height:54px" id="qView"></div>
  </div>

  <div class="card">
    <div class="label" id="lblAnswer">Risultato</div>
    <div class="answer" id="answerBox">…</div>
    <div class="meta" id="metaInfo"></div>
  </div>

  <div class="card" id="contBox">
    <div class="label" id="lblTomorrow">Domani continuiamo da qui</div>
    <div id="fuList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>
    <div class="row">
      <input id="fuCustom" class="input" placeholder="oppure scrivi tu la prossima micro-domanda…"/>
      <button class="btn primary" id="saveFuBtn">Salva per domani</button>
    </div>
  </div>
</main>

<script>
/* ===== i18n ===== */
const I18N = {
  it:{
    title:"Il tuo What?f",
    yourq:"La tua domanda",
    result:"Risultato",
    cont:"Domani continuiamo da qui",
    saved:"Salva per domani",
    customPH:"oppure scrivi tu la prossima micro-domanda…",
    metaReplay:"(risposta salvata)",
    metaLive:"(generata ora)"
  },
  en:{
    title:"Your What?f",
    yourq:"Your question",
    result:"Result",
    cont:"Tomorrow we pick up from here",
    saved:"Save for tomorrow",
    customPH:"or write your own next micro-question…",
    metaReplay:"(saved answer)",
    metaLive:"(generated now)"
  }
};
const LS=localStorage;
let lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== theme from prefs ===== */
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const prefs = readJSON('whatif_prefs',{stile:'whatif'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== UI text ===== */
const $=(id)=>document.getElementById(id);
$('hTitle').textContent=T.title;
$('lblQuestion').textContent=T.yourq;
$('lblAnswer').textContent=T.result;
$('lblTomorrow').textContent=T.cont;
$('saveFuBtn').textContent=T.saved;
$('fuCustom').placeholder=T.customPH;
$('langBtn').textContent=lang.toUpperCase();

/* ===== nav ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ const nxt=lang==='it'?'en':'it'; LS.setItem('lang',nxt); location.reload(); };

/* ===== history helpers ===== */
function saveStoryToHistory({ domanda, answer, stile }){
  const arr=readJSON('cronologia',[]);
  const ts=Date.now();
  const last=arr[arr.length-1];
  if(last && last.domanda===domanda && (last.answer||'')===(answer||'') && last.stile===stile) return;
  arr.push({ domanda, answer, stile, ts });
  writeJSON('cronologia', arr.slice(-50));
}
function saveForTomorrow({ q, stile, answer }){
  const arr=readJSON('saved_for_tomorrow',[]);
  const ts=Date.now();
  arr.push({ q, stile, answer, ts });
  writeJSON('saved_for_tomorrow', arr.slice(-50));
}

/* ===== load context ===== */
const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';
let domanda='', stile=prefs.stile||'whatif', extra='';
let answerText='';

if(isReplay){
  const r=readJSON('replay_story',null);
  domanda=r?.domanda||LS.getItem('domanda')||'';
  stile=r?.stile||stile;
  answerText=r?.answer||'';
  $('qView').textContent=domanda||'—';
  $('answerBox').textContent=answerText||'—';
  $('metaInfo').textContent=T.metaReplay;
  // niente salvataggi/followup in replay
  $('contBox').style.display='none';
} else {
  const req = readJSON('whatif_request',null);
  domanda = req?.domanda || LS.getItem('domanda') || '';
  stile = req?.stile || stile;
  extra = req?.extra || '';
  $('qView').textContent = domanda || '—';
  // generate
  generate(domanda, stile, extra).catch(err=>{
    $('answerBox').textContent='[server error] '+(err?.message||err);
  });
}

/* ===== call API & postprocess ===== */
async function generate(domanda, stile, extra){
  $('answerBox').textContent='…';
  const res = await fetch('/api/ask', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ domanda, stile, lang, extra })
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  answerText = (data.answer||'').trim();
  $('answerBox').textContent = answerText||'—';
  $('metaInfo').textContent = T.metaLive;

  // salva in cronologia
  saveStoryToHistory({ domanda, answer: answerText, stile });

  // followups
  const fu = await getFollowups(domanda, answerText, stile).catch(()=>[]);
  renderFollowups(fu);
}

/* ===== followups: prova API, poi fallback ===== */
async function getFollowups(q, a, stile){
  try{
    const r = await fetch('/api/followups',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ domanda:q, answer:a, stile, lang })});
    if(r.ok){ const j=await r.json(); if(Array.isArray(j.followups)) return j.followups.slice(0,2); }
  }catch{}
  // fallback locale semplice ma sensato
  const lower = q.toLowerCase();
  if(lower.includes('moto')||lower.includes('car')||lower.includes('bike')){
    return lang==='en'
      ? ["What would be the first test route?", "How much monthly cost would feel sustainable?"]
      : ["Quale sarebbe il primo giro di prova?", "Che costo mensile ti sembrerebbe sostenibile?"];
  }
  if(lower.includes("aquila")||lower.includes("l'aquila")||lower.includes('verona')||lower.includes('lugano')){
    return lang==='en'
      ? ["What sign would tell you the move is working?", "Which part of daily rhythm would you change first?"]
      : ["Qual è il segnale che ti direbbe che funziona?", "Quale pezzo di ritmo quotidiano cambieresti per primo?"];
  }
  return lang==='en'
    ? ["What’s the smallest 7-day step here?", "What would make you say ‘this was worth it’?"]
    : ["Qual è il passo più piccolo da 7 giorni?", "Cosa ti farebbe dire ‘ne è valsa la pena’?"];
}

function renderFollowups(list){
  const box=$('fuList'); box.innerHTML='';
  list.slice(0,2).forEach(txt=>{
    const div=document.createElement('div');
    div.className='input';
    div.textContent=txt;
    div.style.cursor='pointer';
    div.onclick=()=>{ $('fuCustom').value = txt; };
    box.appendChild(div);
  });
}

/* ===== save custom followup ===== */
$('saveFuBtn').onclick=()=>{
  const v = $('fuCustom').value.trim(); if(!v) { $('fuCustom').focus(); return; }
  saveForTomorrow({ q:v, stile, answer: answerText });
  $('fuCustom').value='';
  $('saveFuBtn').textContent = lang==='en' ? 'Saved!' : 'Salvato!';
  setTimeout(()=>{ $('saveFuBtn').textContent = I18N[lang].saved; }, 1200);
};
</script>
</body>
</html>
