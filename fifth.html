<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:rgba(20,28,34,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

/* evidenzia le parentesi comiche tra em-dash senza toccare il testo */
.embit {
  padding: 0 .08em;
  box-shadow: 0 -4px 0 0 rgba(255,255,255,.05) inset;
  text-shadow: 0 0 12px rgba(255,255,255,.08);
  border-radius: 4px;
}

/* Select */
.select{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;
}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <select id="langSelect" class="select" aria-label="Language">
        <option value="it">IT · Italiano</option>
        <option value="en">EN · English</option>
        <option value="es">ES · Español</option>
        <option value="fr">FR · Français</option>
        <option value="de">DE · Deutsch</option>
      </select>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
/* ==== State ==== */

const periodo = prefs.periodo || 'future';

if(!['it','en','es','fr','de'].includes(lang)) lang = 'it';

document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');
document.documentElement.lang = lang;

/* ==== PRO badge ==== */

  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = '🧪 TEST · ⭐ PRO';

               lang === 'es') ? 'Modo de prueba activo' : (

/* ==== I18N ==== */
const I18N = {

       share:"📤 Partager / Copier", again:"🔁 Poser une autre question",
       copied:"Copié !", error:"[erreur serveur]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style : What the F · 6–9 phrases · un paragraphe · 2–3 réactions absurdes · double chute · mode : ${p==='past'?'Passé':'Futur'}.`

       share:"📤 Teilen / Kopieren", again:"🔁 Weitere Frage stellen",
       copied:"Kopiert!", error:"[Serverfehler]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Stil: What the F · 6–9 Sätze · ein Absatz · 2–3 absurde Objektreaktionen · doppelte Pointe · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`
        : `Stil: What if (60 % Analyse, 40 % real) · 8–11 Sätze · ein Absatz · keine Listen/Fragen/Emojis · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`,
       back:"← Zurück", home:"🏠 Start",
       fbWTF:(q)=>`Du zwinkerst dem Leben zu und sagst, dass ${q.toLowerCase().replace(/^was wäre, wenn\s*/i,'vielleicht ')}, und dann passiert etwas, das nicht mal die Mikrowelle versteht.`,
       fbWHF:(q)=>`Kurz: ja. Lang: ja, wenn du Reibung senkst, Schritte misst und akzeptierst, dass Tempo wichtiger ist als Geschwindigkeit. Starte heute: ${q}.`

/* ==== Leads per lingua/stile ==== */
const LEADS = {

    ],

    ]},

    ],

    ]},
  es:{ wtf:[

      "Traes la cara de hoy y la paciencia de mañana a la puerta."
    ],
    whatif:[
      "Dejas las llaves y permites que hable el silencio que no juzga.",
      "Misma habitación, otra mirada: ya es un comienzo."
    ]},
  fr:{ wtf:[
      "Tu entres doucement; le chaos te reconnaît et te laisse passer.",
      "Tu respires et laisses le destin trébucher le premier."
    ],
    whatif:[
      "Tu poses les clés et laisses parler le silence qui ne juge pas.",

    ]},

/* ==== UI Hooks ==== */
const qs = (sel)=>document.querySelector(sel);
const setText = (id, txt)=>{ const el=qs(id); if(el) el.textContent = txt; };

const backBtn  = qs('#backBtn');
const homeBtn  = qs('#homeBtn');
const langSel  = qs('#langSelect');
const titleH1  = qs('#title');
const subtitle = qs('#subtitle');
const lblQ     = qs('#lblQ');
const lblA     = qs('#lblA');
const qView    = qs('#qView');
const leadNode = qs('#lead');
const answerEl = qs('#answer');
const shareBtn = qs('#shareBtn');
const againBtn = qs('#againBtn');
const metaInfo = qs('#metaInfo');
const styleBadge = qs('#styleBadge');

/* ==== Helpers ==== */
function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function hashStr(s=""){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; } return Math.abs(h); }
function stablePick(arr, seedStr){ if(!arr?.length) return ""; if(!seedStr?.trim()) return pick(arr); const h=hashStr(seedStr); return arr[h%arr.length]; }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }

/* Evidenzia testo tra em-dash */
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw || !raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

/* ===== Surprise helpers (solo Boost) ===== */
let UNICODE_OK=true; try{ new RegExp("\\p{L}","u"); }catch{ UNICODE_OK=false; }
function sanitizeBoost(raw){
  let t=(raw||'').toString().normalize('NFKC')
    .replace(UNICODE_OK?/[^\p{L}\p{N}\s,'’.:-]/gu:/[^A-Za-z0-9\s,'’.:-]/g,' ')
    .replace(/[\u200B-\u200D\uFEFF]/g,' ')
    .replace(/\s+/g,' ').trim().toLowerCase();
  return t;
}
function extractTokens(t){
  const stop = new Set(['e','ed','di','da','a','al','alla','alle','con','per','su','tra','fra','il','lo','la','i','gli','le','un','uno','una','che','del','della','dei','delle','degli','mi','mio','mia','miei','mie','tuo','tua','tuoi','tue','suo','sua','suoi','sue','nostro','vostro','loro','and','or','the','to','of','for','with','on','in','at','de','le','la','les','du','des','y','o','el','los','las','der','die','das','und','oder','im','am']);
  return t.split(/[\s,;:.!-]+/).filter(w=>w && !stop.has(w) && !/^\d+$/.test(w));
}
function topicsFromTokens(tokens){
  const out=[];
  for(let n of [3,2,1]){
    for(let i=0;i<=tokens.length-n;i++){
      const phr=tokens.slice(i,i+n).join(' ');
      if(phr.length>2) out.push(phr);
    }
    if(out.length>=12) break;
  }
  return Array.from(new Set(out)).slice(0,12);
}
function polishQuestion(q,Lcode){
  let t=String(q||"").replace(/[?？]+$/,'').trim();
  if(!t) return '';
  t=t.charAt(0).toUpperCase()+t.slice(1);
  t=t.replace(/\s+([?!.,;:%])/g,'$1').trim();
  if(Lcode==="es"){ if(!t.startsWith('¿')) t='¿'+t; if(!t.endsWith('?')) t+='?'; return t; }
  if(Lcode==="fr"){ if(!t.endsWith('?')) t+=' ?'; t=t.replace(/\s*\?$/,'\u202F?'); return t; }
  if(!/\?$/.test(t)) t+='?'; return t;
}
function sentenceFromTopic(lang, periodo, tp){
  if(lang==='it') return (periodo==='past')
    ? (/re$|are$|ere$|ire$/i.test(tp)?`E se avessi iniziato a ${tp} l’estate scorsa?`:`E se avessi fatto un esperimento su ${tp} l’estate scorsa?`)
    : (/re$|are$|ere$|ire$/i.test(tp)?`E se iniziassi a ${tp} per 7 giorni?`:`E se esplorassi ${tp} con un esperimento di 7 giorni?`);
  if(lang==='en') return (periodo==='past')?`What if you had run a 7-day experiment on ${tp} last summer?`:`What if you tried a 7-day experiment on ${tp}?`;
  if(lang==='es') return (periodo==='past')?`¿Y si hubieras probado ${tp} con un experimento de 7 días el verano pasado?`:`¿Y si pruebas ${tp} con un experimento de 7 días?`;
  if(lang==='fr') return (periodo==='past')?`Et si tu avais testé ${tp} avec une expérience de 7 jours l’été dernier ?`:`Et si tu testais ${tp} avec une expérience de 7 jours ?`;
  if(lang==='de') return (periodo==='past')?`Was, wenn du letzten Sommer ${tp} in einem 7-Tage-Experiment ausprobiert hättest?`:`Was, wenn du ${tp} in einem 7-Tage-Experiment testest?`;
  return `What if you tried a 7-day experiment on ${tp}?`;
}
function buildQuestionFromBoost(boost, lang, periodo){
  const tokens = extractTokens(sanitizeBoost(boost));
  const topics = topicsFromTokens(tokens);
  const base = topics.length ? topics[0] : (boost||'').trim();
  const q = sentenceFromTopic(lang, periodo, base);
  return polishQuestion(q, lang);
}

/* ==== Language init ==== */
langSel.value = lang;

/* ==== Titles ==== */
function setTitlesAndTexts(q){
  const T = I18N[lang] || I18N.it;
  setText('#title', style==='wtf' ? T.titleWTF : T.titleWHF);
  subtitle.textContent = T.sub(q || '—');
  lblQ.textContent = T.q;
  lblA.textContent = T.a;
  shareBtn.textContent = T.share;
  againBtn.textContent = T.again;
  styleBadge.textContent = (style==='wtf') ? T.styleWTF : T.styleWHF;
  metaInfo.textContent = T.meta(style, periodo);

  const bank = (LEADS[lang] && LEADS[lang][style]) ? LEADS[lang][style]
               : (LEADS.it[style] || LEADS.it.whatif);
  const seed = `${(q||"").toLowerCase().trim()}|${style}|${lang}`;
  const line = oneSentence(stablePick(bank, seed) || '');
  leadNode.textContent = line || '—';
}

/* ==== Buttons ==== */
backBtn.onclick = ()=> history.length > 1 ? history.back() : location.replace('index.html');
homeBtn.onclick = ()=> location.href='index.html';
langSel.onchange = ()=>{
  lang = langSel.value;
  LS.setItem('lang', lang);
  document.documentElement.lang = lang;
  setTitlesAndTexts(domanda);
  const el = document.getElementById('proBadge');
  if(el.style.display !== 'none'){
    el.title = (lang === 'en') ? 'Test mode active' : (
               lang === 'es') ? 'Modo de prueba activo' : (
               lang === 'fr') ? 'Mode test actif' :
               (lang === 'de') ? 'Testmodus aktiv' : 'Modalità test attiva';
  }
};

let answerText = "";
shareBtn.onclick = async()=>{
  const T = I18N[lang] || I18N.it;
  const full = `What?f — ${style==='wtf'?(T.styleWTF||'What the F'):(T.styleWHF||'What if')}\n(${periodo})\n\nQ: ${domanda}\n\n${answerText}`;
  try{
    if(navigator.share){
      await navigator.share({ title: "What?f", text: full });
    }else{
      await navigator.clipboard.writeText(full);
      const b=shareBtn;
      b.textContent = T.copied; setTimeout(()=>b.textContent=T.share,1200);
    }
  }catch{}
};

againBtn.onclick = ()=>{ location.href='fourth.html'; };

/* ==== Load + Render ==== */
const params = new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';
let domanda = "";

/* profilo (sesso) dal LS */
const profile = JSON.parse(LS.getItem('whatif_profile') || '{}');
function mapGenderToSex(g){
  switch(String(g||'').toLowerCase()){
    case 'uomo': return 'm';
    case 'donna': return 'f';
    case 'altro': return 'nb';
    default: return '';
  }
}
const sex = (profile.sex) ? String(profile.sex).toLowerCase()
          : mapGenderToSex(profile.gender || '');

function decorateAndShowAnswer(text){
  answerText = normalizeOneParagraph((text||"").trim());
  if(!/[.!?…]$/.test(answerText)) answerText += ".";
  answerEl.textContent = answerText || (I18N[lang]||I18N.it).error;
  decorateEmBits(answerEl);
  const hist = JSON.parse(LS.getItem('cronologia')||'[]');
  hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now() });
  LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
}

/* ==== Fallback locale se API fallisce ==== */
function localFallback(q){
  const T = I18N[lang] || I18N.it;
  const gen = (style==='wtf') ? T.fbWTF(q) : T.fbWHF(q);
  decorateAndShowAnswer(gen);
}

/* ==== Main flow ==== */
if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda);
  qView.textContent = domanda || '—';
  decorateAndShowAnswer(r.answer || "—");
}else{
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const mode = req.mode || 'manual';
  const boost = (LS.getItem('whatif_boost')||'').trim();
  domanda = req.domanda || LS.getItem('domanda') || "";

  // Se arrivo da "Sorprendimi" senza domanda → genera SOLO dal Boost
  if(mode === 'surprise' && !domanda){
    if(boost){
      domanda = buildQuestionFromBoost(boost, lang, periodo);
      LS.setItem('domanda', domanda);
    }else{
      // safety: se manca boost, mostra un placeholder chiaro
      const T = I18N[lang]||I18N.it;
      domanda = (lang==='en'?'Please add a Boost on the previous page.':'Aggiungi un Boost nella pagina precedente.');
    }
  }

  setTitlesAndTexts(domanda);
  qView.textContent = domanda || '—';

  (async ()=>{
    navigator.sendBeacon?.("/api/track") || fetch("/api/track",{method:"POST",keepalive:true}).catch(()=>{});
    try{
      const headers = { "Content-Type": "application/json" };
      if (prefs.pro === true) headers["x-pro"] = "1";
      const adminToken = localStorage.getItem("admin_token");
      if (adminToken) headers["x-admin-token"] = adminToken;

      const r = await fetch("/api/ask",{
        method:"POST",
        headers,
        body:JSON.stringify({
          domanda,
          lang,                // lingua selezionata
          stile: style,        // whatif | wtf
          periodo,             // future | past
          extra:"",
          micro:req.micro||{},
          sex,
          boost                // <-- passa il Boost al server
        })
      });

      if(r.status===429){ throw new Error("rate_limited"); }
      const data = await r.json().catch(()=>null);
      if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

      decorateAndShowAnswer(data.answer);
    }catch(e){
      // fallback elegante, no schermata morta
      localFallback(domanda);
      console.error(e);
    }
  })();
}

/* ==== Decorate lead after titles ==== */
function refreshLead(){ /* già fatto in setTitlesAndTexts */ }

/* ==== decorate after content set ==== */
function setTitlesAndTextsAndDecorate(q){ setTitlesAndTexts(q); }

/* ==== finalize ==== */
</script>
