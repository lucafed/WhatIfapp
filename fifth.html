<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f – La tua domanda</title>
<meta name="theme-color" content="#0A0F14"/>
<link rel="preload" as="image" href="/ask-hero.png"/>
<style>
:root{--bg:#0A0F14;--fg:#e9f2f5;--muted:#9fb3bd;--accent:#00E0FF}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
main{min-height:100%;max-width:860px;margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;align-items:center}
.hero{width:min(220px,40vw);height:auto;filter:drop-shadow(0 14px 28px rgba(0,0,0,.45));margin-bottom:10px}
h1{margin:0 0 10px;font-size:clamp(26px,6vw,40px);text-align:center;letter-spacing:.02em}
.input{width:100%;padding:16px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(255,255,255,.06);color:var(--fg);font-size:16px}
.btn{margin-top:12px;appearance:none;border:0;border-radius:999px;padding:14px 26px;font-weight:800;letter-spacing:.02em;color:#001a20;background:var(--accent);box-shadow:0 10px 26px rgba(0,224,255,.35)}
.answer{margin-top:14px;width:100%;background:rgba(255,255,255,.04);border-radius:14px;padding:14px;line-height:1.45;color:var(--fg)}
.link{margin-top:10px;color:var(--accent);text-decoration:none}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:4px}
</style>
</head>
<body>
<main>
  <img id="hero" class="hero" alt="Porta luminosa">
  <h1>LA TUA DOMANDA</h1>

  <input id="q" class="input" placeholder="Scrivi la tua domanda qui…"/>
  <button id="send" class="btn">INVIA</button>

  <div id="ans" class="answer" style="display:none"></div>
  <a id="newq" class="link" href="#" style="display:none">Nuova domanda</a>

  <p class="note">Swipe ◀︎ / ▶︎ per navigare</p>
</main>

<script>
/* immagine robusta */
(async function loadHero(){
  const img=document.getElementById('hero');
  const tries=['/ask-hero.png','/public/ask-hero.png','/assets/ask-hero.png','/third-hero.png','/public/third-hero.png'];
  for(const u of tries){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ img.src=u+'?v='+Date.now(); return; } }catch(e){} }
  img.alt='Immagine non trovata';
})();

/* colore bottone coerente con porta scelta */
(function(){
  const m=localStorage.getItem('mode');
  const btn=document.getElementById('send');
  if(m==='whatif'){ btn.style.background='#FFD166'; btn.style.color='#1b1200'; }
  if(m==='wtf'){ btn.style.background='#06D6A0'; btn.style.color='#001b13'; }
})();

/* demo risposta */
document.getElementById('send').addEventListener('click',()=>{
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('ans');
  if(!q){ box.style.display='block'; box.textContent='Scrivi una domanda prima di inviare 😊'; return; }
  box.style.display='block';
  box.textContent='(Esempio) Risposta alla tua domanda: "'+ q + '". Qui collegheremo l’AI.';
  document.getElementById('newq').style.display='inline';
});
document.getElementById('newq').addEventListener('click',e=>{
  e.preventDefault(); document.getElementById('q').value=''; document.getElementById('ans').style.display='none'; e.target.style.display='none';
});

/* swipe su document */
(function(){
  let sx=0, sy=0, dx=0, dy=0, on=false; const TH=55;
  document.addEventListener('touchstart',e=>{on=true;const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  document.addEventListener('touchmove', e=>{ if(!on) return; const t=e.touches[0]; dx=t.clientX-sx; dy=t.clientY-sy; },{passive:true});
  document.addEventListener('touchend', ()=>{ if(!on) return; on=false;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>TH){ if(dx>0){window.location.href='fourth.html';} }
    sx=sy=dx=dy=0;
  },{passive:true});
})();
</script>
</body>
</html>
