<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>What?f — Risultato</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
      --acc:#1C57A0; --acc2:#FFEC01;
      --line:rgba(255,255,255,.12);
      --panel:rgba(20,28,34,.92);
      --glow:rgba(255,236,1,.22);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:
        radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
        radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
        radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{max-width:860px;margin:auto;padding:18px}
    h1{
      font-size:clamp(22px,5vw,30px);
      color:var(--acc2);
      text-align:center;
      margin:8px 0 4px;
      text-shadow:0 0 18px var(--glow);
    }
    .sub{text-align:center;color:var(--muted);margin:0 0 10px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .pill{
      padding:8px 12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(0,0,0,.5);color:#fff;font-size:14px
    }
    .card{
      background:var(--panel);
      border-radius:16px;
      border:1px solid var(--line);
      padding:16px;
      margin-top:12px;
      box-shadow:0 8px 25px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .label{color:var(--acc);font-weight:800;margin-bottom:6px}
    .input{
      background:rgba(255,255,255,.04);
      border-radius:12px;
      border:1px solid var(--line);
      padding:10px;
      min-height:38px;
    }
    .story{
      line-height:1.68;
      font-size:18px;
    }
    .btn{
      border:none;border-radius:12px;padding:9px 13px;font-weight:800;
      cursor:pointer;font-size:14px
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--acc),var(--acc2));
      color:#05070b;
      box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 28px var(--glow);
    }
    .btn.ghost{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      color:#fff;
    }
    .select{
      background:rgba(255,255,255,.06);
      border-radius:12px;
      border:1px solid var(--line);
      padding:8px 12px;
      color:#fff;
      font-weight:700;
    }
    .pct-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .pct-label{font-size:13px;color:var(--muted)}
    .pct-chip{
      min-width:60px;padding:4px 10px;border-radius:12px;
      background:linear-gradient(180deg,var(--acc),var(--acc2));
      color:#05070b;font-weight:900;font-size:16px;
      text-align:center;
      box-shadow:0 6px 16px rgba(0,0,0,.28),0 0 18px rgba(255,255,1,.18);
    }
    .hr{height:1px;background:rgba(255,255,255,.1);margin:10px 0}
    .result-box{
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.03));
      border-radius:16px;
      border:1px solid var(--line);
      padding:14px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .result-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
    .result-title{font-weight:900;font-size:15px}
    .mot-note{font-size:15px;line-height:1.6}
    .small{font-size:12px;color:var(--muted)}
    #videoPreview{width:100%;max-height:420px;border-radius:16px;margin-top:8px;background:#000}
    .toast{
      position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
      background:rgba(20,28,34,.95);border:1px solid var(--line);
      padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700;
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
      z-index:9999;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
    @media(max-width:480px){
      .story{font-size:17px}
      .mot-note{font-size:15.5px}
    }
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>

    </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>

    <div class="pct-row">

      <div class="pct-chip" id="topPct">—</div>
    </div>

    <p class="small" id="oracleLine">⏳ …</p>
    <div class="story" id="answer">—</div>

    <div class="hr"></div>

    <div class="label" id="lblP">Esito & motivazioni</div>
    <div class="result-box">

        <span class="pct-label" id="pctLabelBottom">% probabilità che accada</span>

        <span class="result-title" id="motTitle">Motivazioni</span>
      </div>

    <div class="hr"></div>

    <div class="label" id="lblVideo">Video condivisibile</div>
    <div class="result-box">
      <p class="small" id="videoHelp">
        Crea un breve video con domanda, risposta e motivazioni, pronto da condividere sui social.
      </p>
      <button class="btn ghost" id="videoBtn">🎬 Crea video</button>

      <div class="row" style="margin-top:8px;justify-content:space-between;">
        <a class="btn primary" id="videoDownload" href="#" download="whatf-video.mp4" style="display:none">
          ⬇️ Scarica / Condividi
        </a>
        <span class="small" id="videoNote"></span>
      </div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- audio tastiera -->
<audio id="typingSfx" preload="auto">
  <source src="./audio/typing.mp3" type="audio/mpeg">
</audio>

<script>

    videoLabelA:"ANTWORT & MOTIVE"

};
const SUP_LANG = ["it","en","es","fr","de"];

function detectLang(text){
  const t = (text||"").toLowerCase();
  if(/[¿¡]/.test(t)) return "es";
  if(/\b(was|wenn|warum|wann|wo)\b/.test(t)) return "de";
  if(/\b(quoi|pourquoi|quand|où)\b/.test(t)) return "fr";
  if(/\b(que|porque|cuando|donde)\b/.test(t)) return "es";
  if(/\b(what|why|when|where|would|should|could)\b/.test(t)) return "en";
  return "it";
}

/* ========= DOM ========= */
const $ = s=>document.querySelector(s);
const titleEl=$("#title"), subtitleEl=$("#subtitle"), qView=$("#qView");
const lblQ=$("#lblQ"), lblA=$("#lblA"), lblP=$("#lblP");
const pctTop=$("#topPct"), pctBottom=$("#bottomPct");
const pctLabelTop=$("#pctLabelTop"), pctLabelBottom=$("#pctLabelBottom");
const answerEl=$("#answer"), motNote=$("#motNote"), motTitle=$("#motTitle");
const styleBadge=$("#styleBadge");
const langSelect=$("#langSelect");
const shareBtn=$("#shareBtn"), againBtn=$("#againBtn");
const videoBtn=$("#videoBtn"), videoLoading=$("#videoLoading"), videoPreview=$("#videoPreview");
const videoDownload=$("#videoDownload"), videoNote=$("#videoNote"), videoHelp=$("#videoHelp"), lblVideo=$("#lblVideo");
const toastEl=$("#toast");
const typingSfx=$("#typingSfx");

/* ========= stato base ========= */
const prefs = JSON.parse(localStorage.getItem("whatif_prefs") || "{}");
const style = prefs.stile || "whatif"; // "wtf" o "whatif"
const periodo = prefs.periodo || "future";

const req = JSON.parse(localStorage.getItem("whatif_request") || "{}");
const domanda = req.domanda || localStorage.getItem("domanda") || "";
let lang = (req.lang || localStorage.getItem("lang") || "").slice(0,2).toLowerCase();
if(!SUP_LANG.includes(lang)) lang = detectLang(domanda);
document.documentElement.lang = lang;
langSelect.value = lang;

function t(){ return I18N[lang] || I18N.it; }

/* ========= UI base ========= */
function applyUI(){
  const T = t();
  titleEl.textContent = (style==="wtf") ? T.titleWTF : T.titleWHF;
  subtitleEl.textContent = T.sub(domanda || "—");
  lblQ.textContent = T.q;
  lblA.textContent = T.a;
  lblP.textContent = T.p;
  lblVideo.textContent = T.videoTitle;
  videoHelp.textContent = T.videoHelp;
  pctLabelTop.textContent = T.pct;
  pctLabelBottom.textContent = T.pct;
  shareBtn.textContent = T.share;
  againBtn.textContent = T.again;
  styleBadge.textContent = (style==="wtf") ? T.styleWTF : T.styleWHF;
}
applyUI();
qView.textContent = domanda || "—";

/* ========= Toast ========= */
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1500);
}

/* ========= typewriter + audio ========= */
let typeTimer = null;
function typewriter(el, text){
  if(typeTimer) clearInterval(typeTimer);
  el.textContent = "";
  const full = String(text||"").trim();
  if(!full){ el.textContent="—"; return; }
  let i=0;
  const cps = 25; // caratteri al secondo
  const step = 1000/cps;

  if(typingSfx){
    try{
      typingSfx.currentTime = 0;
      typingSfx.loop = true;
      typingSfx.play().catch(()=>{});
    }catch(e){}
  }

  typeTimer = setInterval(()=>{
    i++;
    el.textContent = full.slice(0,i);
    if(i>=full.length){
      clearInterval(typeTimer);
      if(typingSfx){
        try{
          typingSfx.loop=false;
          typingSfx.pause();
          typingSfx.currentTime=0;
        }catch(e){}
      }
    }
  }, step);
}

/* ========= motivazioni ========= */
function buildMotivation(pct){
  const L = lang;
  const isPast = (periodo==="past");
  const base = pct ? (L==="it"
    ? `Probabilità intorno al ${pct}%. `
    : L==="en" ? `Approx. probability ${pct}%. `
    : L==="es" ? `Probabilidad aproximada ${pct}%. `
    : L==="fr" ? `Probabilité autour de ${pct} %. `
    : `Wahrscheinlichkeit etwa ${pct} %. `) : "";

  if(L==="it"){
    if(isPast){
      return base +
        "Con le informazioni che avevi allora non era impossibile farla andare diversamente, " +
        "ma mancavano qualche confine chiaro e due conversazioni dette prima.";
    }else{
      return base +
        "Se traduci questa idea in passi piccoli e concreti, ha spazio per funzionare; " +
        "se aspetti il momento perfetto rischia di restare sempre nel cassetto.";
    }
  }
  if(L==="en"){
    if(isPast){
      return base +
        "With the context you had back then, a different outcome was possible, " +
        "but you were missing clear boundaries and a couple of honest talks sooner.";
    }else{
      return base +
        "If you turn this into small clear steps, it can work; " +
        "if you wait for the perfect moment, it will probably stay in your head only.";
    }
  }
  if(L==="es"){
    if(isPast){
      return base +
        "Con lo que sabías en ese momento, podía salir distinto, " +
        "pero faltaron límites claros y un par de conversaciones honestas un poco antes.";
    }else{
      return base +
        "Si lo bajas a pasos pequeños y concretos, tiene espacio para funcionar; " +
        "si esperas el momento perfecto, se quedará en idea para siempre.";
    }
  }
  if(L==="fr"){
    if(isPast){
      return base +
        "Avec les infos de l’époque, un autre scénario était possible, " +
        "mais il manquait des limites claires et quelques discussions franches plus tôt.";
    }else{
      return base +
        "Si tu le transformes en petits pas concrets, ça peut marcher; " +
        "si tu attends le moment parfait, ça risque de rester un projet dans ta tête.";
    }
  }
  // de
  if(isPast){
    return base +
      "Mit dem Wissen von damals war ein anderes Ergebnis möglich, " +
      "aber klare Grenzen und ein, zwei offene Gespräche haben gefehlt.";
  }else{
    return base +
      "Wenn du das in kleine, konkrete Schritte übersetzt, kann es funktionieren; " +
      "wartest du auf den perfekten Moment, bleibt es wahrscheinlich nur ein Gedanke.";
  }
}

/* ========= probabilità di fallback ========= */
function fallbackPct(text){
  let s = 50;
  const t = (text||"").toLowerCase();
  if(/\b(7|14|21|30|60|90)\b/.test(t)) s+=10;
  if(/\b\d+([.,]\d+)?\b/.test(t)) s+=6;
  if(/senza|solo|al massimo|minimo|entro|before|entro|fino a/.test(t)) s+=6;
  if(/forse|maybe|magari|quizás/.test(t)) s-=8;
  return Math.max(25,Math.min(90,Math.round(s)));
}

/* ========= chiamata API ========= */
async function loadAnswer(){
  if(!domanda){
    answerEl.textContent = "—";
    return;
  }
  try{
    const res = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        domanda,
        lang,
        stile:style,
        periodo
      })
    });
    const data = await res.json();
    let text = (data && data.answer) ? String(data.answer).replace(/\s+/g," ").trim() : "";
    if(!text) text = "[errore server]";

    const apiPct = (data && typeof data.pct==="number" && isFinite(data.pct)) ? Math.round(data.pct) : null;
    const pct = apiPct!=null ? apiPct : fallbackPct(domanda);
    pctTop.textContent = pct + "%";
    pctBottom.textContent = pct + "%";

    typewriter(answerEl, text);
    motNote.textContent = buildMotivation(pct);
  }catch(e){
    console.error(e);
    answerEl.textContent = "[errore server]";
  }
}
loadAnswer();

/* ========= NAV / lingua / share ========= */
document.getElementById("backBtn").onclick = ()=>history.length>1?history.back():location.href="index.html";
document.getElementById("homeBtn").onclick = ()=>location.href="index.html";

langSelect.onchange = ()=>{
  lang = langSelect.value;
  localStorage.setItem("lang", lang);
  document.documentElement.lang = lang;
  applyUI();
  motTitle.textContent = t().motTitle;
};

shareBtn.onclick = async ()=>{
  const T = t();
  const text = `What?f\n\nQ: ${domanda}\n\n${answerEl.textContent}`;
  try{
    if(navigator.share){
      await navigator.share({title:"What?f",text});
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      toast(T.copied);
    }else{
      toast(T.copied);
    }
  }catch(e){}
};
againBtn.onclick = ()=>{ location.href="fourth.html"; };

/* ========= VIDEO ========= */
let lastVideoBlob = null;
let lastMime = null;

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text||"").split(/\s+/);
  let line = "";
  for(let w of words){
    const test = line ? line + " " + w : w;
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, y);
      line = w;
      y += lineHeight;
    }else{
      line = test;
    }
  }
  if(line){ ctx.fillText(line, x, y); y += lineHeight; }
  return y;
}

async function createVideo(){
  const T = t();
  if(!domanda || !answerEl.textContent){
    toast(T.videoNoData);
    return;
  }
  if(typeof HTMLCanvasElement==="undefined" || !HTMLCanvasElement.prototype.captureStream || typeof MediaRecorder==="undefined"){
    toast(T.videoError);
    return;
  }

  videoBtn.disabled = true;
  videoLoading.style.display = "block";
  videoLoading.textContent = T.videoPreparing;
  videoPreview.style.display = "none";
  videoDownload.style.display = "none";
  videoNote.textContent = "";

  const canvas = document.createElement("canvas");
  const w = 720, h = 1280;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const stream = canvas.captureStream(25);

  let mime = null;
  const cand = [
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];
  for(const m of cand){
    if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){ mime = m; break; }
  }
  if(!mime){
    toast(T.videoError);
    videoBtn.disabled=false;
    videoLoading.style.display="none";
    return;
  }

  const rec = new MediaRecorder(stream,{mimeType:mime});
  const chunks = [];
  rec.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
  rec.onstop = ()=>{
    lastVideoBlob = new Blob(chunks,{type:mime});
    lastMime = mime;
    const url = URL.createObjectURL(lastVideoBlob);
    videoPreview.src = url;
    videoPreview.style.display = "block";
    videoDownload.href = url;
    const ext = mime.indexOf("webm")>-1 ? "webm" : "mp4";
    videoDownload.download = "whatf-video."+ext;
    videoDownload.style.display = "inline-flex";
    videoNote.textContent = T.videoReady;
    videoBtn.disabled = false;
    videoLoading.style.display = "none";
  };

  const fullText = (answerEl.textContent || "") + (motNote.textContent ? ("\n\n" + motNote.textContent) : "");
  const totalChars = fullText.length;
  const charsPerSec = 28;
  const duration = Math.max(8000, Math.round(totalChars/charsPerSec*1000));
  const extra = 1200;
  const start = performance.now();

  function drawFrame(progress){
    // sfondo
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,"#05070C");
    grad.addColorStop(0.4,"#08101B");
    grad.addColorStop(1,"#000000");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    // glow
    const rg = ctx.createRadialGradient(w/2,h*0.18,40,w/2,h*0.18,420);
    rg.addColorStop(0,"rgba(255,236,1,0.35)");
    rg.addColorStop(0.5,"rgba(28,87,160,0.25)");
    rg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0,0,w,h);

    // pillola brand
    ctx.save();
    ctx.translate(w/2,70);
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.beginPath();
    ctx.roundRect(-150,-26,300,52,26);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillText("What?f ✨",0,-2);
    ctx.font = "12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillStyle = "rgba(224,232,240,0.82)";
    const styleLabel = (style==="wtf") ? "What the F · bar oracle" : "What if · soft oracle";
    ctx.fillText(styleLabel,0,16);
    ctx.restore();

    const marginX = 52;
    const cardX = marginX;
    const cardY = 130;
    const cardW = w - marginX*2;
    const cardH = 180;

    // card domanda
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.beginPath();
    ctx.roundRect(cardX,cardY,cardW,cardH,22);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.20)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.72)";
    ctx.font = "bold 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillText(T.videoLabelQ + " · 🎯", cardX+16, cardY+28);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    wrapText(ctx, domanda, cardX+16, cardY+60, cardW-32, 30);
    ctx.restore();

    // percentuale chip
    const pctStr = pctTop.textContent || "";
    if(pctStr){
      const chipW = 140, chipH = 40;
      const chipX = w - marginX - chipW;
      const chipY = cardY + cardH + 20;
      const gc = ctx.createLinearGradient(chipX,chipY,chipX,chipY+chipH);
      gc.addColorStop(0,"#1C57A0");
      gc.addColorStop(1,"#FFEC01");
      ctx.fillStyle = gc;
      ctx.beginPath();
      ctx.roundRect(chipX,chipY,chipW,chipH,20);
      ctx.fill();
      ctx.fillStyle = "#05070b";
      ctx.textAlign = "center";
      ctx.font = "bold 18px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
      ctx.fillText(pctStr, chipX+chipW/2, chipY+26);
    }

    // box risposta+motivazioni
    const blockX = marginX;
    const blockY = 330;
    const blockW = w - marginX*2;
    const blockH = h - blockY - 80;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.58)";
    ctx.beginPath();
    ctx.roundRect(blockX,blockY,blockW,blockH,26);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.16)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.72)";
    ctx.font = "bold 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillText(T.videoLabelA + " ✍️", blockX+18, blockY+28);

    const charsVisible = Math.max(1, Math.floor(totalChars * progress));
    const partial = fullText.slice(0, charsVisible);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "19px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    wrapText(ctx, partial, blockX+18, blockY+58, blockW-32, 26);
    ctx.restore();

    // micro CTA in basso
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    const cta = (lang==="it")
      ? "Condividi e tagga @whatforacle se ti ci ritrovi."
      : (lang==="en")
        ? "Share & tag @whatforacle if this hits you."
        : "";
    if(cta) ctx.fillText(cta, w/2, h-30);
    ctx.restore();
  }

  const start = performance.now();
  rec.start();
  function step(ts){
    const elapsed = ts - start;
    const progress = Math.min(1, elapsed / duration);
    drawFrame(progress);
    if(elapsed < duration + extra){
      requestAnimationFrame(step);
    }else{
      rec.stop();
    }
  }
  requestAnimationFrame(step);
}

videoBtn.onclick = ()=>createVideo();

videoDownload.addEventListener("click", async (e)=>{
  if(!lastVideoBlob){ return; }
  const T = t();
  const ext = (lastMime && lastMime.indexOf("webm")>-1) ? "webm" : "mp4";
  const file = new File([lastVideoBlob], "whatf-video."+ext,{type:lastMime||"video/webm"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    e.preventDefault();
    try{
      await navigator.share({
        title:"What?f",
        text:"Guarda il mio oracolo What?f ✨",
        files:[file]
      });
    }catch(err){
      console.warn("share failed",err);
    }
  }
});
</script>
