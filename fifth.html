<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Risultato</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{--bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA; --accent:#00E0FF; --accent-dark:#00B5CC}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px}
    .top{display:flex;align-items:center;gap:12px}
    .back{appearance:none;border:none;background:#0f1820;color:var(--fg);padding:10px 14px;border-radius:14px;cursor:pointer}
    .crumb{color:var(--muted);font-size:14px}
    h1{margin:0;font-size:clamp(26px,6vw,40px)}
    .box{background:var(--card);border:1px solid #1b2730;border-radius:16px;padding:16px}
    .res{background:#0f1820;border:1px solid #1d2b34;color:var(--fg);padding:16px;border-radius:14px;min-height:120px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
    .btn{appearance:none;border:none;border-radius:14px;padding:12px 16px;cursor:pointer}
    .primary{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329;font-weight:900}
    .ghost{background:#132029;color:var(--fg);border:1px solid #1d2b34}
    .note{color:var(--muted);font-size:14px;margin-top:8px}
    .error{color:#ffb3b3;background:#3a1414;border:1px solid #5a2222;border-radius:10px;padding:10px 12px;display:none}
    .error.show{display:block}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <button class="back" id="backBtn" data-i18n="back">Indietro</button>
      <span class="crumb" id="crumb"></span>
    </div>

    <h1 data-i18n="title">Risultato</h1>

    <div id="err" class="error"></div>

    <div class="box">
      <div class="res" id="answer">…</div>
      <div class="actions">
        <button class="btn primary" id="shareBtn" data-i18n="share">Condividi</button>
        <button class="btn ghost" id="homeBtn" data-i18n="home">Home</button>
      </div>
      <div class="note" data-i18n="upsell">Vuoi la versione estesa con piani d’azione e alternative? (in arrivo)</div>
    </div>
  </main>

  <script>
    const dict={it:{back:"Indietro",title:"Risultato",share:"Condividi",home:"Home",
                    upsell:"Vuoi la versione estesa con piani d’azione e alternative? (in arrivo)",
                    missing:"Manca la risposta: torna indietro e riprova.",
                    pill:(s)=>[ s.periodo==="past"?"Passato": s.periodo==="future"?"Futuro":"",
                                s.stile==="whatif"?"What if (plausibile)": s.stile==="wtf"?"What the F (ironico)":""
                              ].filter(Boolean).join(" • ")
                   },
               en:{back:"Back",title:"Result",share:"Share",home:"Home",
                    upsell:"Want the extended version with action plans and alternatives? (coming soon)",
                    missing:"Missing answer: please go back and try again.",
                    pill:(s)=>[ s.periodo==="past"?"Past": s.periodo==="future"?"Future":"",
                                s.stile==="whatif"?"What if (plausible)": s.stile==="wtf"?"What the F (ironic)":""
                              ].filter(Boolean).join(" • ")
                   }};
    const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
    const LS=localStorage;
    function getLang(){return LS.getItem('lang')||'it';}
    function tApply(){
      const L=getLang(),D=dict[L]||dict.it;
      document.documentElement.lang=L;
      $$('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(D[k]) el.textContent=D[k];});
      const prefs=JSON.parse(LS.getItem('whatif_prefs')||'{}');
      $('#crumb').textContent=D.pill(prefs);
      const a=JSON.parse(LS.getItem('whatif_answer')||'null');
      const err=$('#err');
      if(!a||!a.text){ err.textContent=D.missing; err.classList.add('show'); }
      else { $('#answer').textContent=a.text; }
    }
    tApply();
    window.addEventListener('storage',(e)=>{ if(e.key==='lang') tApply();});
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tApply(); });

    // azioni
    $('#backBtn').addEventListener('click',()=>history.back());
    $('#homeBtn').addEventListener('click',()=>location.href='index.html');
    $('#shareBtn').addEventListener('click', async ()=>{
      const text=$('#answer').textContent||'';
      try{
        if(navigator.share){ await navigator.share({text}); }
        else{ await navigator.clipboard.writeText(text); alert(getLang()==='en'?'Copied to clipboard!':'Copiato negli appunti!'); }
      }catch(_){}
    });
  </script>
</body>
</html>
