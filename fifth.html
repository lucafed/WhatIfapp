<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f – La tua domanda</title>
  <meta name="theme-color" content="#0A0F14" />
  <link rel="preload" as="image" href="/third-hero.png" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A3B6BF;
      --accent:#00E0FF; --accent-dark:#00B5CC; --ok:#13d8a6; --btn-disabled:#29404a;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px 16px 22px;align-items:center}

    .hero{width:min(100%,860px);margin-top:6px;background:#0c141b;border-radius:22px;padding:10px 10px 14px;
      box-shadow:0 10px 28px rgba(0,0,0,.32)}
    .hero img{width:100%;height:auto;border-radius:16px;display:block;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4))}

    h1{width:min(100%,860px);text-align:center;margin:2px auto 0;font-size:clamp(26px,6vw,40px);letter-spacing:.5px}

    .ask{width:min(100%,860px);background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
    .input{width:100%;padding:14px;border-radius:14px;border:1px solid #20313a;background:#0c141b;color:var(--fg);outline:none}
    .cta-wrap{width:min(100%,860px);display:flex;justify-content:center}
    .cta{display:inline-block;min-width:200px;text-align:center;background:linear-gradient(180deg,var(--accent),var(--accent-dark));
      color:#002329;font-weight:900;border:none;border-radius:28px;padding:14px 22px;box-shadow:0 0 14px rgba(0,181,204,.5),0 0 32px rgba(0,181,204,.25);
      cursor:pointer;transition:filter .16s ease, transform .08s ease}
    .cta:active{transform:translateY(1px)}
    .cta[disabled]{background:var(--btn-disabled);color:#7fa1aa;cursor:not-allowed;box-shadow:none}

    .answer{width:min(100%,860px);background:#0f1820;border-radius:14px;padding:14px;color:#d7e8ec;display:none}
    .hint{width:min(100%,860px);text-align:center;color:var(--muted);font-size:12px;margin-top:-6px}

    .swipeArea{position:fixed;inset:0;z-index:1}
    .meta{width:min(100%,860px);text-align:center;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="swipeArea" aria-hidden="true"></div>
  <main>
    <div class="hero"><img id="hero" alt="Mini anteprima due porte" loading="eager" decoding="async"></div>
    <h1>LA TUA DOMANDA</h1>

    <section class="ask">
      <input id="q" class="input" placeholder="Scrivi la tua domanda qui… (es. Se avessi lasciato quel lavoro nel 2021…)" />
    </section>

    <div class="cta-wrap">
      <button id="send" class="cta" disabled>INVIA</button>
    </div>

    <div id="ans" class="answer"></div>
    <p class="hint">Swipe ← per tornare · Swipe → per inviare</p>

    <p class="meta" id="meta"></p>
  </main>

  <script>
    // immagine (metodo consolidato)
    (async function(){
      const hero=document.getElementById('hero');
      const tries=['/third-hero.png','/public/third-hero.png','/assets/third-hero.png'];
      for(const u of tries){
        try{const r=await fetch(u,{cache:'no-store'}); if(r.ok){hero.src=u+'?v='+Date.now();return;}}catch(e){}
      }
    })();

    const prefs = JSON.parse(localStorage.getItem('whatif_prefs')||'{}');  // {periodo, stile}
    const user  = JSON.parse(localStorage.getItem('whatif_user')||'{}');

    // piccola meta-riga così vedi che valori arrivano e puoi usarli con la tua AI
    const meta = document.getElementById('meta');
    meta.textContent = (prefs.periodo && prefs.stile)
      ? `Modalità: ${prefs.stile === 'whatif' ? 'What if (plausibile)' : 'What the F (ironico)'} · Periodo: ${prefs.periodo === 'past' ? 'Passato' : 'Futuro'}`
      : '';

    const q = document.getElementById('q');
    const send = document.getElementById('send');
    const ans = document.getElementById('ans');

    q.addEventListener('input', ()=>{
      send.disabled = q.value.trim().length < 4;
    });

    function fakeAnswer(){
      const style = prefs.stile === 'wtf'
        ? "Versione *What the F* (ironica):"
        : "Versione *What if* (plausibile):";
      const time  = prefs.periodo === 'past' ? "guardando al passato" : "proiettandoci nel futuro";
      const name  = user.who ? user.who : "utente";

      ans.innerHTML = `<p><strong>${style}</strong> ${time}, e considerando il tuo profilo (${name}${user.city? " da "+user.city : ""})...</p>
      <p><em>Qui colleghi la tua AI e restituisci la risposta vera.</em></p>`;
      ans.style.display = 'block';
      window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
    }

    send.addEventListener('click', ()=>{
      if(send.disabled) return;
      fakeAnswer();
    });

    // swipe: ← back · → invia
    (function(){
      const area=document.querySelector('.swipeArea');
      let sx=0, sy=0, dx=0, dy=0, start=false, TH=45;
      area.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;start=true;},{passive:true});
      area.addEventListener('touchmove',e=>{if(!start)return;const t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;},{passive:true});
      area.addEventListener('touchend',()=>{if(!start)return;start=false;
        if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>TH){
          if(dx>0){ history.back(); }           // → destra: torna indietro
          else { if(!send.disabled) fakeAnswer(); } // ← sinistra: invia se possibile
        }
        sx=sy=dx=dy=0;
      });
    })();
  </script>
</body>
</html>
