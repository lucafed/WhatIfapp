<!-- FILE: fifth.html -->
<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C">
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:#A0B2BA}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* Percent */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;min-width:64px;padding:5px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);
  border-radius:12px; box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px rgba(255,255,1,.18);
}

/* Result box */
.result-box{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);border-radius:16px;padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28);
}
.result-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.result-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;min-width:64px;padding:5px 10px;border-radius:12px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px rgba(255,255,1,.18);
}
.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}

/* Motives */
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .ico{font-size:18px;line-height:1.2}
.mot .name{display:none}
.mot .note{font-size:15px;line-height:1.6;opacity:.92}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;opacity:.9}
.chip{font-size:11px;font-weight:900;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}

/* Intro (Zoltar) */
.intro-box{
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
  border:1px dashed rgba(255,255,255,.18);
  border-radius:14px;padding:12px 14px;margin:8px 0 10px;
  font-size:14.5px; line-height:1.55; color:#E7F2EE;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}

/* Repeat nudge */
.nudge {
  margin: 8px 0 10px; padding: 10px 12px;
  border: 1px dashed var(--line); border-radius: 12px;
  background: rgba(255,255,255,.04); font-size: 14px; line-height: 1.5; opacity: .95;
}
.nudge strong { font-weight: 800; }
.nudge .advice { display:block; margin-top:6px; opacity:.9; font-style:italic; }
.nudge .next { display:block; margin-top:6px; opacity:.95; }
html[data-theme="wtf"] .nudge { background: rgba(90,140,117,.10); }
html[data-theme="whatif"] .nudge { background: rgba(28,87,160,.10); }

/* Overlay + oracle */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:9999}
#overlay-frame{width:100%;max-width:520px;height:78vh;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,28,34,.95);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:700;z-index:10000;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.oracle-wrap{position:relative;min-height:28px;margin:4px 0 8px}
.oracle-line{font-size:14px;opacity:.86;color:#E7F2EE;transition:opacity .25s ease}
.orb{
  position:absolute; left:-10px; top:-8px; width:26px; height:26px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,236,1,.7), rgba(255,236,1,.0) 60%);
  filter:blur(6px); opacity:.0; transform:scale(.7); pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
}
.reveal .orb{opacity:.8; transform:scale(1)}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.reveal #answer{animation:fade .45s ease-out both}
@keyframes shimmer{0%{opacity:.45}50%{opacity:.95}100%{opacity:.45}}
.loading .oracle-line{animation:shimmer 1.8s ease-in-out infinite}

/* Mobile */
@media (max-width:420px){
  .result-pct,.top-pct{font-size:15px;min-width:56px;padding:4px 8px}
  .result-title{font-size:14px}
  .mot .note{font-size:15.5px;line-height:1.65}
}
</style>
</head>

<main>

    <div id="repeatNudge" class="nudge" style="display:none"></div>

    <!-- SOLO oracolo, niente frasette lead prima della risposta -->
    <div class="oracle-wrap">
      <div class="orb" aria-hidden="true"></div>

    <div id="answer" class="story">⏳ …</div>

    <div class="hr"></div>

      </div>

      <div class="mot" id="motOne">

          <div class="name" id="motName">—</div>

            <span class="chip" id="chipFav">—</span>
            <span class="chip" id="chipCon">—</span>
            <span class="chip" id="chipAst">—</span>
          </div>
          <div class="note" id="motNote">—</div>
        </div>
      </div>
    </div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="saveBtn">⭐ Salva</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<div id="overlay" aria-hidden="true">
  <iframe id="overlay-frame" src="about:blank" title="modal"></iframe>
</div>

<p class="small" id="creditInfo" style="text-align:center;margin:10px 0 24px"></p>
<div class="toast" id="toast"></div>

<!-- SFX -->
<audio id="revealDing" preload="auto">
  <source src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAA" type="audio/mpeg">
</audio>

const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = (prefs.stile || 'whatif');       // 'whatif' | 'wtf'
const periodo = (prefs.periodo || 'future');   // 'future' | 'past'
const IS_ADMIN = !!LS.getItem('admin_token');
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* ================== I18N ================== */

       save:"⭐ Save", savedOk:"✅ Saved",

       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",

        ? `Style: What the F · 6–9 sentences · single paragraph · dry tone · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if (60% analysis, 40% real) · 8–11 sentences · single paragraph · mode: ${p==='past'?'Past':'Future'}.`,
       pctLabel:"% probability it happens",
       votersTitle:"Committee", seriousTitle:"Rationale", scientificTitle:"Rationale (scientific)",
       chipsFav:"in favour", chipsCon:"against", chipsAst:"abstained",
       motFallback:"Reason: short-term, concrete benefits with manageable constraints.",
       credits:(n)=>`💰 Credits: ${n}`, noCredits:"You ran out of credits.",
       storeTitle:"Credits", watchAd:"Watch ad (+1)", close:"Close",
       comingSoon:"Coming soon", buySoonNote:"Credit purchases not available yet.",
       toastPlus:(n)=>`+${n} credit`, toastMinus:(n)=>`-${n} credit`,
       guideTitle:"Guidance", guideQuick:"Quick tips",
       guideAdvice:"Advice", guideAnalysis:"Concise analysis",
       nudgeHeadSoft:"Whisper:", nudgeHeadHard:"Blunt note:",
       nudgeAdvice:"Advice:", nudgeNext:"Try asking:"
  },
  es:{ titleWTF:"⚡ What the F — Resultado", titleWHF:"💡 What if — Resultado",
       sub:(q)=>`Pregunta: “${q}”`, q:"Tu pregunta", a:"Respuesta",
       p:"Resultado y razones", share:"📤 Compartir / Copiar", again:"🔁 Hacer otra",
       save:"⭐ Guardar", savedOk:"✅ Guardada",
       copied:"¡Copiado!", error:"[error del servidor]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Estilo: What the F · 6–9 frases · un párrafo · tono seco · modo: ${p==='past'?'Pasado':'Futuro'}.`
        : `Estilo: What if (60% análisis, 40% real) · 8–11 frases · un párrafo · modo: ${p==='past'?'Pasado':'Futuro'}.`,

       votersTitle:"Comité", seriousTitle:"Motivo", scientificTitle:"Motivo (científico)",
       chipsFav:"a favor", chipsCon:"en contra", chipsAst:"abstenciones",
       motFallback:"Motivo: beneficios concretos a corto plazo con límites manejables.",
       credits:(n)=>`💰 Créditos: ${n}`, noCredits:"Se te han acabado los créditos.",
       storeTitle:"Créditos", watchAd:"Ver anuncio (+1)", close:"Cerrar",
       comingSoon:"Próximamente", buySoonNote:"La compra de créditos aún no está disponible.",
       toastPlus:(n)=>`+${n} crédito`, toastMinus:(n)=>`-${n} crédito`,
       guideTitle:"Guía", guideQuick:"Indicaciones rápidas",
       guideAdvice:"Consejo", guideAnalysis:"Análisis sintético",
       nudgeHeadSoft:"Susurro:", nudgeHeadHard:"Nota directa:",

       sub:(q)=>`Question : « ${q} »`, q:"Ta question", a:"Réponse",
       p:"Issue & motivations", share:"📤 Partager / Copier", again:"🔁 Poser une autre",

       copied:"Copié !", error:"[erreur serveur]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style : What the F · 6–9 phrases · un paragraphe · ton sec · mode : ${p==='past'?'Passé':'Futur'}.`
        : `Style : What if (60 % analyse, 40 % réel) · 8–11 phrases · un paragraphe · mode : ${p==='past'?'Passé':'Futur'}.`,
       pctLabel:"% de probabilité que ça arrive",
       votersTitle:"Comité", seriousTitle:"Motivation", scientificTitle:"Motivation (scientifique)",
       chipsFav:"pour", chipsCon:"contre", chipsAst:"abstentions",

const SUP_LANG=['it','en','es','fr','de'];

/* ================== LINGUA (auto + override + sync da fourth) ================== */
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';
const langFromFourth = (reqEarly.lang || LS.getItem('lang') || '').toLowerCase().slice(0,2);
function detectLang(text=''){
  const t=(text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank={
    it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
    en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
    es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
    fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
    de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]
  };
  const score={}; for(const L of SUP_LANG){ score[L]=0; (bank[L]||[]).forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1; for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){ const nav=(navigator.language||'it').slice(0,2).toLowerCase(); if(SUP_LANG.includes(nav)) return nav; }
  return best;
}
let lang = SUP_LANG.includes(langFromFourth) ? langFromFourth : detectLang(domandaEarly);
document.documentElement.lang=lang;
const t = ()=>I18N[lang]||I18N.it;

/* ================== INTRO (Zoltar) con reset ================== */
const INTRO_KEY = 'whatif_intro_seen_v2';
const INTRO = {
  whatif: {
    it: {future:"🜂 La lanterna si accende: chiedi con chiarezza e il futuro si mette in riga.", past:"🜂 La sabbia si posa: guarda il passato senza nebbia, prendi l’essenza e vai."},

const WKEY="whatif_wallet"; const SURPKEY="whatif_surprise";
function readWallet(){ try{ const w=JSON.parse(LS.getItem(WKEY)||"{}")||{}; return {available:Number.isFinite(+w.available)?+w.available:null, used:Number.isFinite(+w.used)?+w.used:null, limit:Number.isFinite(+w.limit)?+w.limit:null}; }catch{return{available:null,used:null,limit:null}}}
function writeWallet(w){
  const cur=readWallet();
  const out={ available:(w.available!=null)?Math.max(0,+w.available):(cur.available??0),
              used:(w.used!=null)?Math.max(0,+w.used):(cur.used??0),
              limit:(w.limit!=null)?Math.max(0,+w.limit):(cur.limit??0) };
  LS.setItem(WKEY, JSON.stringify(out));
  LS.setItem("whatif_wallet_sync", String(Date.now()));
  updateCreditInfo();
}
function legacyCap(){ return (prefs.pro===true)?10:3 }
function legacyGetLeft(){
  const w=readWallet(); if(w.available!=null) return w.available;
  try{ const c=JSON.parse(LS.getItem('whatif_credits')||'{}'); const today=new Date().toISOString().slice(0,10); const used=(c.date===today)?(+c.used||0):0; return Math.max(0, legacyCap()-used); }catch{}
  const raw=LS.getItem('crediti'); return raw==null? legacyCap() : Math.max(0, parseInt(raw,10)||0);
}
function legacyConsumeOne(){
  try{ const w=readWallet(); if(w.available!=null){ if(w.available<=0) return false; writeWallet({available:w.available-1, used:(w.used||0)+1, limit:(w.limit!=null?w.limit:legacyCap())}); return true; } }catch{}
  try{ const today=new Date().toISOString().slice(0,10); let c=JSON.parse(LS.getItem('whatif_credits')||'{}'); if(c.date!==today) c={date:today,used:0,limit:legacyCap()}; if((c.used||0)>= (c.limit||legacyCap())) return false; c.used=(c.used||0)+1; LS.setItem('whatif_credits', JSON.stringify(c)); return true; }catch{}
  let n=parseInt(LS.getItem('crediti')||'0',10)||0; if(n<=0) return false; LS.setItem('crediti', String(Math.max(0,n-1))); return true;
}
function getAvailable(){ if(IS_ADMIN) return Infinity; const w=readWallet(); return (w.available!=null)?w.available:legacyGetLeft(); }
function consumeOne(){
  if(IS_ADMIN) return true;
  const w=readWallet();
  if(w.available!=null){
    if(w.available<=0) return false;
    writeWallet({available:w.available-1, used:(w.used||0)+1, limit:(w.limit!=null?w.limit:legacyCap())});
    return true;
  }
  return legacyConsumeOne();
}

function computeProbability(q){
  const tx=(q||'').toLowerCase(); let s=50;
  if(/\b(7|14|21|30|60|90)\b/.test(tx)) s+=12;
  if(/\b\d+([.,]\d+)?\b/.test(tx)) s+=8;
  if(/budget|€|euro|spesa|max|under|sotto/.test(tx)) s+=6;
  if(/senza|solo|al massimo|minimo|entro|prima delle|ogni|per/.test(tx)) s+=8;
  if(/lancia|apri|impara|scrivi|chiedi|corri|studia|automatizza|testa/.test(tx)) s+=6;
  if(/forse|magari|maybe|quizás/.test(tx)) s-=8;
  if(!/\b\d/.test(tx)) s-=6;
  s += (style==='wtf' ? -4 : +2);
  return {pct: Math.max(25, Math.min(92, Math.round(s)))}
}

/* ================== WHAT IF (manual/spunti): pack diretto ================== */
function isManualOrSpunti(req){ const src=(req?.micro?.source||"").toLowerCase(); return src==="manual"||src==="spunti"||src==="quick"; }
function extractContextParts(q){
  const s=String(q||"").trim(); const lower=s.toLowerCase();
  const when=(s.match(/\b(in|entro|tra|prossim[oi]|\bdomani\b|\boggi\b|\bstasera\b|\bsettimana\b|\bmese\b|\banno\b|\d{1,2}\s*(giorni|settimane|mesi))\b/i)||[])[0]||"";
  const money=(s.match(/(\b€|\beuro|\bbudget|\bspesa|\bprezzo|\bcosto)\s*([0-9.,]+)/i)||[])[0]||(/\bunder\b/i.test(s)?"under":"");
  const action=(s.match(/\b(lancia|apr[ie]|impara|scriv[ie]|chied[ie]|corr[ei]|studia|automatizz[ae]|testa|compra|vend[ei]|assumi|costruisc[ie]|crea|ottimizza|riduci|aumenta)\b/i)||[])[0]||"";
  const obj=(lower.match(/\b(sito|progetto|app|campagna|cv|colloquio|piscina|dominio|startup|portafoglio|criptovalute?|azione|investimento|budget|esame)\b/i)||[])[0]||"";
  const topic=obj || (/\b(amore|partner|relaz(ione|ioni)|matrimonio)\b/i.test(lower)?"relazioni":"");
  return {when, money, action, topic};
}
function buildDirectPack(domanda, data){
  const quickAPI=(data&&(data.quick||data.guide||data.tip))||null;
  const adviceAPI=(data&&(data.advice||data.suggestion))||null;
  const analysisAPI=(data&&(data.analysis||data.summary))||null;
  const ctx=extractContextParts(domanda);
  const quick=quickAPI || (lang==='en'
    ? `Block 10′ today on ${ctx.topic?`**${ctx.topic}**`:"this"}: start with ${ctx.action?ctx.action:"one concrete step"}${ctx.when?` ${ctx.when}`:""}.`
    : `Blocca 10′ oggi su ${ctx.topic?`**${ctx.topic}**`:"questo"}: inizia con ${ctx.action||"un passo concreto"}${ctx.when?` ${ctx.when}`:""}.`);
  const advice=adviceAPI || (lang==='en'
    ? `Write a mini goal you can finish ${ctx.when||"within 72h"} and define success in one line.`
    : `Scrivi un micro-obiettivo da chiudere ${ctx.when||"entro 72h"} e definisci il “fatto” in una riga.`);
  const analysis=analysisAPI || (lang==='en'
    ? `Reduce friction: one tool, one metric${ctx.money?`, mind budget (${ctx.money})`:""}; schedule a check-in in 3 days.`
    : `Riduci l’attrito: uno strumento, una metrica${ctx.money?`, rispetta il budget (${ctx.money})`:""}; metti un check tra 3 giorni.`);
  return { quick, advice, analysis };
}

function canonicalTopic(s){
  const {topic}=extractContextParts(s||'');
  const txt=(topic||'generic').toLowerCase();
  return txt.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function bumpTopic(s){
  const key=canonicalTopic(s); const map=readTopicCounts();
  map[key]=(map[key]||0)+1; writeTopicCounts(map); return map[key];
}
function tokenizeTopic(s){
  const stop={ it:"di,del,della,delle,degli,dei,che,con,per,nel,nella,allo,alla,alle,agli,una,un,uno,il,lo,la,le,gli,e,o,ma,se,quando,dove,come,anche,non,più,meno".split(","),
               en:"the,of,and,or,to,in,on,for,a,an,is,are,was,were,be,been,if,when,where,how,not,more,less,with,by".split(",") }[lang]||[];
  return new Set(String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(w=>w&&w.length>2&&!stop.includes(w)));
}
function jaccard(a,b){ if(!a.size||!b.size) return 0; let inter=0; for(const x of a) if(b.has(x)) inter++; return inter/(a.size+b.size-inter); }
function isSimilarToRecent(domanda,k=2,thr=0.70){
  const cur=tokenizeTopic(domanda); let hist=[]; try{ hist=JSON.parse(LS.getItem('cronologia')||'[]'); }catch{}
  const recent=hist.slice(-5).reverse().map(h=>h?.domanda||"").filter(Boolean);
  let hits=0,seen=0; for(const q of recent){ const sim=jaccard(cur, tokenizeTopic(q)); if(sim>=thr) hits++; seen++; if(seen>=k) break; }
  return hits>=k;
}

function applyQuestion(){
  const req=JSON.parse(LS.getItem('whatif_request')||'{}');
  const domanda=req.domanda || LS.getItem('domanda') || '';
  applyUI(domanda);
  const qEl=qs('#qView'); if(qEl) qEl.textContent = domanda || '—';
  const surprise = (new URLSearchParams(location.search)).get('src')==='surprise'
                   || req?.surprise===true || req?.micro?.surprise===true
                   || LS.getItem('surprise_mode')==='1';
  return {req, domanda, surprise};
}

/* ================== SALVA DOMANDA ================== */
function saveCurrentQuestion(){
  const domanda=(LS.getItem('domanda')||'').trim(); if(!domanda) return;
  let arr=[]; try{ arr=JSON.parse(LS.getItem('next_prompts')||'[]'); if(!Array.isArray(arr)) arr=[]; }catch{ arr=[]; }
  if(arr[0] && (arr[0].q||'')===domanda){ toast(t().savedOk); return; }
  arr.unshift({ q:domanda, ts:Date.now() }); if(arr.length>50) arr=arr.slice(0,50);
  LS.setItem('next_prompts', JSON.stringify(arr));
  LS.setItem('whatif_wallet_sync', String(Date.now()));
  toast(t().savedOk);
}

/* ================== MAIN FLOW ================== */
let alreadyConsumed=false;

async function startFlow(){
  const {req,domanda,surprise}=applyQuestion();
  updateCreditInfo();
  showIntroOnce();
  maybeShowRepeatNudge(req,domanda);
  startOracleLoading();

  if(!IS_ADMIN && !alreadyConsumed){
    const left=getAvailable();
    if(!(left===Infinity) && left<=0){ stopOracleLoading(); qs('#answer').textContent=t().noCredits; return; }
    if(!consumeOne()){ stopOracleLoading(); qs('#answer').textContent=t().noCredits; return; }
    alreadyConsumed=true; updateCreditInfo(); toast(t().toastMinus(1));
  }

  try{
    const headers={"Content-Type":"application/json"};
    if(prefs.pro===true) headers["x-pro"]="1";
    const adminToken=LS.getItem("admin_token"); if(adminToken) headers["x-admin-token"]=adminToken;

    const r=await fetch("/api/ask",{
      method:"POST", headers,
      body:JSON.stringify({ domanda, lang, stile:style, periodo, system:(style==='wtf'?'SYSTEM_WTF':'SYSTEM_WHIF'), extra:"", micro:req.micro||{} })
    });

    let data=null;
    try{ data=await r.json(); }catch{ data=null; }
    if(!r.ok || !data || !data.answer){
      data = fallbackLocalAnswer(domanda);
    }

    let answerText=normalizeOneParagraph((data.answer||"").trim());
    const maxSent=(style==='wtf')?9:11;
    let parts=answerText.split(/(?<=[.!?…])\s+/);
    if(parts.length>maxSent) parts=parts.slice(0,maxSent);
    answerText=parts.join(" ").trim();
    if(!/[.!?…]$/.test(answerText)) answerText+='.';
    const answerEl=qs('#answer'); answerEl.textContent=answerText; decorateEmBits(answerEl);

    stopOracleLoading();
    document.querySelector('.oracle-wrap')?.classList.add('reveal');
    setTimeout(()=>document.querySelector('.oracle-wrap')?.classList.remove('reveal'),900);
    try{ document.getElementById('revealDing')?.play().catch(()=>{});}catch{}

    const apiPct=(data && Number.isFinite(+data.pct))?Math.max(0,Math.min(100,Math.round(+data.pct))):null;
    const usedPct=(apiPct!=null)?apiPct:computeProbability(domanda).pct;
    const pStr=usedPct+"%";
    qs('#topPct').textContent=pStr; qs('#bottomPct').textContent=pStr;

    function scientificFallback(langCode){
      return (langCode==='en')
        ? "Scientific note: small, consistent steps beat sporadic big efforts (habits > willpower). Switching costs explain early friction; feedback loops and simple metrics sustain momentum."
        : (langCode==='es')
          ? "Nota científica: los pasos constantes superan los empujones esporádicos; los costes de cambio explican la fricción inicial; los bucles de feedback sostienen el impulso."
          : (langCode==='fr')
            ? "Note scientifique : les petits pas réguliers battent les grands efforts sporadiques ; les coûts de bascule expliquent la friction initiale ; les boucles de feedback entretiennent l’élan."
            : (langCode==='de')
              ? "Wissenschaftlicher Hinweis: kleine, konsistente Schritte schlagen sporadische Schübe; Wechselkosten erklären die anfängliche Reibung; Feedbackschleifen halten den Schwung."
              : "Nota scientifica: i piccoli passi consistenti vincono sui grandi sforzi saltuari (abitudini > forza di volontà). I costi di switch spiegano l’attrito iniziale; cicli di feedback e metriche semplici sostengono lo slancio.";
    }

    let motivazioneUsata = "";
    if (surprise) {
      motIco.style.display=''; chipsWrap.style.display='flex';
      committeeTitle.textContent=t().votersTitle||'Comitato';
      const rdm=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      chipFav.textContent=`${t().chipsFav} ${rdm(120,1200)}`;
      chipCon.textContent=`${t().chipsCon} ${rdm(0,900)}`;
      chipAst.textContent=`${t().chipsAst} ${rdm(0,400)}`;
      motNote.textContent=(lang==='en')?`Brief tussle at vote: ${rdm(1,5)} removed; ${rdm(0,3)} bruised.`:
                       (lang==='es')?`Pequeño lío en la votación: ${rdm(1,5)} expulsados; ${rdm(0,3)} contusos.`:
                       (lang==='fr')?`Petit grabuge au vote : ${rdm(1,5)} évacués ; ${rdm(0,3)} contusionnés.`:
                       (lang==='de')?`Kurzes Gerangel bei der Abstimmung: ${rdm(1,5)} entfernt; ${rdm(0,3)} leicht verletzt.`:
                                     `Breve parapiglia al voto: ${rdm(1,5)} allontanati; ${rdm(0,3)} contusi.`;
      motivazioneUsata = motNote.textContent;
    } else if (style === 'wtf') {
      motIco.style.display='none'; chipsWrap.style.display='none';
      committeeTitle.textContent = t().scientificTitle;
      const sci = (data && data.scientific) ? String(data.scientific).trim() : scientificFallback(lang);
      motNote.textContent = sci; motivazioneUsata = sci;
    } else {
      motIco.style.display='none'; chipsWrap.style.display='none';
      committeeTitle.textContent = t().guideTitle;
      const contextual = isManualOrSpunti(req);
      const pack = contextual ? buildDirectPack(domanda, data||{}) : buildDirectPack("", data||{});
      const labels = { quick:t().guideQuick, advice:t().guideAdvice, analysis:t().guideAnalysis };
      motNote.innerHTML =
        `<strong>${labels.quick}:</strong> ${pack.quick}<br>`+
        `<strong>${labels.advice}:</strong> ${pack.advice}<br>`+
        `<strong>${labels.analysis}:</strong> ${pack.analysis}`;
      motivazioneUsata = `${labels.quick}: ${pack.quick} | ${labels.advice}: ${pack.advice} | ${labels.analysis}: ${pack.analysis}`;
    }

    const hist=JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now(), surprise, pct:usedPct, motivazione:motivazioneUsata });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

  }catch(e){
    console.error(e);
    stopOracleLoading();
    qs('#answer').textContent=t().error;
  }
}

/* ================== FALLBACK LOCALE (se API KO) ================== */
function fallbackLocalAnswer(q){
  const base = (lang==='en'
    ? "Short take — momentum beats perfection: define one concrete move, make it visible, and protect time for it. Trim scope, pick a single metric to watch, and start where resistance is smallest. When feedback comes, adapt in public so it sticks — repetition turns into rhythm."
    : (lang==='es'
      ? "Respuesta breve — el impulso gana a la perfección: define un movimiento concreto, hazlo visible y protégelo en agenda. Reduce alcance, elige una sola métrica y empieza donde haya menos fricción. Con el feedback, ajusta en abierto: la repetición se vuelve ritmo."
      : (lang==='fr'
        ? "Réponse courte — l’élan bat la perfection : définis un geste concret, rends-le visible et protège du temps. Réduis le scope, une seule métrique, et commence là où la friction est moindre. Avec le feedback, ajuste au grand jour : la répétition devient rythme."
        : (lang==='de'
          ? "Kurzantwort — Schwung schlägt Perfektion: definiere einen konkreten Schritt, mache ihn sichtbar und blocke Zeit. Scope reduzieren, eine Kennzahl wählen, dort starten wo die Reibung am kleinsten ist. Mit Feedback offen anpassen: Wiederholung wird Rhythmus."
          : "Risposta breve — lo slancio batte la perfezione: definisci una mossa concreta, rendila visibile e proteggi il tempo. Riduci lo scope, scegli una sola metrica da osservare e parti dove l’attrito è minore. Con il feedback, adatta in chiaro: la ripetizione diventa ritmo."))));
  const sci = (lang==='en'
    ? "Scientific note: consistent small steps beat sporadic big pushes; switching costs explain early friction; feedback loops sustain momentum."
    : (lang==='es'
      ? "Nota científica: los pasos constantes superan los empujones esporádicos; los costes de cambio explican la fricción inicial; los bucles de retroalimentación sostienen el impulso."
      : (lang==='fr'
        ? "Note scientifique : les petits pas réguliers battent les gros efforts sporadiques ; les coûts de bascule expliquent la friction initiale ; les boucles de feedback entretiennent l’élan."
        : (lang==='de'
          ? "Wissenschaftlicher Hinweis: kleine, konsistente Schritte schlagen sporadische große Schübe; Wechselkosten erklären die anfängliche Reibung; Feedbackschleifen halten den Schwung."
          : "Nota scientifica: i piccoli passi consistenti battono gli sprint saltuari; i costi di switch spiegano l’attrito iniziale; i loop di feedback sostengono lo slancio."))));
  return { answer: base, pct: computeProbability(q).pct, scientific: sci };
}

/* ================== NAV / LINGUA / SHARE / SAVE ================== */
qs('#backBtn').onclick=()=> history.length>1 ? history.back() : location.replace('index.html');
qs('#homeBtn').onclick=()=> location.href='index.html';
qs('#langSelect').onchange=()=>{
  const v=qs('#langSelect').value;
  LS.setItem('lang',v); LS.setItem('lang_manual','1');
  document.documentElement.lang=v; lang=v;
  applyUI(LS.getItem('domanda')||''); updateCreditInfo();
  try{ document.getElementById('overlay-frame').contentWindow?.postMessage({type:'set_lang', lang:v}, '*'); }catch{}
};
qs('#shareBtn').onclick=async()=>{
  const T=t();
  const full = `What?f — ${(style==='wtf')?T.styleWTF:T.styleWHF}
(${periodo})

Q: ${LS.getItem('domanda') || '—'}

${qs('#answer').textContent}`;
  try{
    if(navigator.share){ await navigator.share({title:"What?f",text:full}); }
    else{
      await navigator.clipboard.writeText(full);
      const b=qs('#shareBtn'); b.textContent=T.copied; setTimeout(()=>b.textContent=T.share,1200);
    }
  }catch{}
};
qs('#againBtn').onclick=()=>{ location.href='fourth.html'; };
if(saveBtn){ saveBtn.onclick = saveCurrentQuestion; }

/* ================== AVVIO ================== */
startFlow();
</script>
