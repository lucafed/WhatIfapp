<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risposta</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; /* What if */
  --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box} html,body{margin:0;background:
radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;white-space:pre-wrap;line-height:1.7;font-size:17px}
.meta{font-size:12px;color:var(--muted)}
.input{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:12px}
.skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">🎭 —</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">What?f — Episodio</h1>

  <div class="card">
    <div class="label" id="qLabel">Domanda</div>
    <div class="box" id="question">—</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="label" id="rLabel">Episodio</div>
      <span class="meta" id="stamp">—</span>
    </div>
    <div class="box" id="result">⌛ <span class="skeleton" style="width:40%"></span></div>

    <div class="row" style="margin-top:12px">
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="shareBtn">📤 Condividi</button>
      <button class="btn primary" id="saveBtn">💾 Salva</button>
    </div>
  </div>

  <div class="card">
    <div class="label" id="fuLabel">Vuoi andare più a fondo?</div>
    <p class="meta" id="fuHint">Scegli una delle domande (o scrivine una) per la prossima puntata.</p>
    <div id="fuList" style="margin:8px 0"></div>
    <input id="fuCustom" class="input" placeholder="Scrivi qui la tua domanda di follow-up…" />
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="fuSave">👉 Continua domani su questa</button>
    </div>
  </div>
</main>

<script>
/* ===== I18N ===== */
const I18N={
  it:{ title:"What?f — Episodio", q:"Domanda", ep:"Episodio",
       fu:"Vuoi andare più a fondo?", fuhint:"Scegli una delle domande (o scrivine una) per la prossima puntata.",
       btnFu:"👉 Continua domani su questa", saved:"Salvato!", copied:"Copiato!",
       closing_if:"Domani vediamo che succede quando inizi a sentirti di nuovo parte del posto.",
       closing_wtf:"Ok amico: domani ti verso l’episodio dopo.",
  },
  en:{ title:"What?f — Episode", q:"Question", ep:"Episode",
       fu:"Go deeper?", fuhint:"Pick one question (or write one) for the next episode.",
       btnFu:"👉 Continue tomorrow on this", saved:"Saved!", copied:"Copied!",
       closing_if:"Tomorrow we’ll see what happens when the place starts to feel yours again.",
       closing_wtf:"Alright buddy — tomorrow I’ll pour the next round.",
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== Prefs / theme ===== */
const prefs=JSON.parse(LS.getItem('whatif_prefs')||'{}');
const style=(prefs.stile||'whatif');
document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');

/* ===== UI text ===== */
document.getElementById('titleH1').textContent=T.title;
document.getElementById('qLabel').textContent=T.q;
document.getElementById('rLabel').textContent=T.ep;
document.getElementById('fuLabel').textContent=T.fu;
document.getElementById('fuHint').textContent=T.fuhint;
document.getElementById('fuSave').textContent=T.btnFu;
document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('styleBadge').textContent = "🎭 " + (style==='wtf'?"What the F":"What if");

/* ===== nav ===== */
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ const nxt=lang==='it'?'en':'it'; LS.setItem('lang',nxt); location.reload(); };

/* ===== data ===== */
const domanda = LS.getItem('domanda')||'';
document.getElementById('question').textContent = domanda || '—';
document.getElementById('stamp').textContent = new Date().toLocaleString(document.documentElement.lang||'it-IT',{hour12:false});

/* ===== read optional extra from buffer ===== */
let extra="";
try{ const b=JSON.parse(LS.getItem('whatif_clarify_buffer')||'{}'); if(b && b.q===domanda) extra=b.extra||""; }catch{}
/* After using, we do not clear immediately—user might refresh; clear on save */

/* ===== sanitize & closing ===== */
function sanitize(style, raw){
  let out=(raw||"").replace(/[“”"«»]/g,"").trim();
  // compatta spazi e righe
  out=out.split(/\n+/).map(s=>s.trim()).filter(Boolean).join("\n");
  // chiusura garantita
  const hook_if = T.closing_if;
  const hook_wtf = T.closing_wtf;
  if(style==='wtf'){
    if(!/domani/i.test(out)) out += (out.endsWith("\n")?"":"\n") + hook_wtf;
  }else{
    if(!/Domani|Tomorrow/i.test(out)) out += (out.endsWith("\n")?"":"\n") + hook_if;
  }
  return out;
}

/* ===== API call (stream + fallback) ===== */
async function callAsk({q,extra}){
  const payload={
    domanda:q, lang, periodo:'future',
    stile:(style==='wtf'?'wtf':'whatif'),
    clarify:false, stream:true,
    profilo:{}, clarifications:{ extra: extra||"" },
    now:new Date().toISOString()
  };
  try{
    const r=await fetch("/api/ask",{
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-whatif-stream":"1" },
      body:JSON.stringify(payload)
    });
    if(!r.ok || !r.body) throw new Error("nostream");
    const reader=r.body.getReader(); const decoder=new TextDecoder();
    let buffer="", text="";
    for(;;){
      const {value,done}=await reader.read(); if(done) break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split("\n\n"); buffer=parts.pop();
      for(const chunk of parts){
        if(!chunk.startsWith("data: ")) continue;
        const msg=JSON.parse(chunk.slice(6));
        if(msg.token){ text+=msg.token; document.getElementById('result').textContent=text; }
        if(msg.done){
          const clean=sanitize(style,text);
          document.getElementById('result').textContent=clean;
          return clean;
        }
        if(msg.error){ throw new Error(msg.detail||"api"); }
      }
    }
    throw new Error("incomplete");
  }catch(e){
    // fallback non-stream
    const r=await fetch("/api/ask",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify({...payload,stream:false})});
    if(!r.ok) throw new Error("api");
    const j=await r.json();
    const text=sanitize(style, j.answer||j.text||"");
    document.getElementById('result').textContent=text||"";
    return text;
  }
}

/* ===== Generate now ===== */
(async function boot(){
  if(!domanda){ document.getElementById('result').textContent="—"; return; }
  const answer=await callAsk({q:domanda, extra});
})().catch(()=>{ document.getElementById('result').textContent="Problema server."; });

/* ===== Follow-up suggestions (fisse + dinamiche dal contesto) ===== */
const FU_SUGG_IT=[
  "Qual è il primo segnale che mi direbbe che sta funzionando?",
  "Cosa posso provare entro 7 giorni senza rischiare troppo?",
  "Quale ostacolo realistico ignorerei di solito?",
  "Chi potrei coinvolgere per non farlo da solo?"
];
const FU_SUGG_EN=[
  "What’s the first signal it’s working?",
  "What can I test in 7 days with low risk?",
  "Which realistic obstacle would I usually ignore?",
  "Who could I involve so I’m not alone?"
];
function renderFU(){
  const list=document.getElementById('fuList'); list.innerHTML='';
  const base=(lang==='it'?FU_SUGG_IT:FU_SUGG_EN);
  const sug=[...base];
  // piccola iniezione contestuale dalla domanda
  const kw=(domanda||"").split(/\s+/).filter(w=>w.length>3).slice(0,2).join(" ");
  if(kw){ sug.unshift((lang==='it'?"Qual è un indicatore legato a: ":"One indicator about: ")+kw+"?"); }
  sug.slice(0,4).forEach(s=>{
    const b=document.createElement('button'); b.className='btn'; b.textContent='• '+s;
    b.style.width='100%'; b.style.textAlign='left'; b.style.margin='4px 0';
    b.onclick=()=>{ document.getElementById('fuCustom').value=s; };
    list.appendChild(b);
  });
}
renderFU();

/* ===== Save follow-up for tomorrow ===== */
document.getElementById('fuSave').onclick=()=>{
  const text=document.getElementById('fuCustom').value.trim();
  const chosen=text || document.querySelector('#fuList .btn')?.textContent?.replace(/^•\s/,'') || "";
  // persist like "buffer" so fourth can show again domani (o per episodicità)
  const next={ q:domanda, extra: chosen };
  LS.setItem('whatif_clarify_buffer', JSON.stringify(next));
  alert(lang==='it'?'Ok, continuiamo domani su questa.':'Got it — we’ll continue tomorrow on this.');
};

/* ===== Save / Copy / Share ===== */
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
document.getElementById('saveBtn').onclick=()=>{
  const arr=readJSON('cronologia',[]);
  arr.unshift({ domanda, risposta:document.getElementById('result').textContent, stile, periodo:'future', lang, ts:Date.now() });
  writeJSON('cronologia',arr.slice(0,100));
  alert((lang==='it')?I18N.it.saved:I18N.en.saved);
};
document.getElementById('copyBtn').onclick=()=>{
  navigator.clipboard.writeText(`${T.q}: ${domanda}\n\n${document.getElementById('result').textContent}`).then(()=>alert((lang==='it')?I18N.it.copied:I18N.en.copied));
};
document.getElementById('shareBtn').onclick=()=>{
  const data={title:"What?f",text:`${T.q}: ${domanda}\n\n${document.getElementById('result').textContent}`,url: location.href};
  if(navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(`${T.q}: ${domanda}\n\n${document.getElementById('result').textContent}`);
};
</script>
</body>
</html>
