<!-- FILE: fifth.html (ritorno a fourth dopo ad/acquisto) -->
<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:#A0B2BA}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* === PERCENT === */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;
  min-width:64px;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px rgba(255,255,1,.18);
}

/* === RESULT BOX === */
.result-box{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28);
}
.result-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.result-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;min-width:64px;padding:5px 10px;border-radius:12px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px rgba(255,255,1,.18);
}
.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}

/* === MOTIVO === */
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .ico{font-size:18px;line-height:1.2}
.mot .name{display:none}
.mot .note{font-size:15px;line-height:1.6;color:var(--fg);opacity:.92}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;opacity:.9}
.chip{font-size:11px;font-weight:900;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}

/* === Indicazione rapida (solo WHAT IF non-surprise) === */
#guideBox{display:none}
#guideSep{display:none}

/* Mobile */
@media (max-width:420px){
  .result-pct,.top-pct{font-size:15px;min-width:56px;padding:4px 8px}
  .result-title{font-size:14px}
  .mot .note{font-size:15.5px;line-height:1.65}
}

/* === Overlay (store/rewarded) === */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:9999}
#overlay-frame{width:100%;max-width:520px;height:78vh;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,28,34,.95);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:700;z-index:10000;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* === ORACLE LOADING + REVEAL === */
.oracle-wrap{position:relative;min-height:28px;margin:4px 0 8px}
.oracle-line{font-size:14px;opacity:.86;color:#E7F2EE;transition:opacity .25s ease}
.orb{
  position:absolute; left:-10px; top:-8px; width:26px; height:26px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,236,1,.7), rgba(255,236,1,.0) 60%);
  filter:blur(6px); opacity:.0; transform:scale(.7); pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
}
.reveal .orb{opacity:.8; transform:scale(1)}
.reveal #answer{animation:fade .45s ease-out both}
@keyframes shimmer{0%{opacity:.45}50%{opacity:.95}100%{opacity:.45}}
.loading .oracle-line{animation:shimmer 1.8s ease-in-out infinite}
</style>
</head>

<body>
<main>
  <div class="topbar">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <select id="langSelect" class="select" aria-label="Language">
        <option value="it">IT · Italiano</option>
        <option value="en">EN · English</option>
        <option value="es">ES · Español</option>
        <option value="fr">FR · Français</option>
        <option value="de">DE · Deutsch</option>
      </select>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>

    <div class="pct-row">
      <span class="pct-label" id="pctLabel">% probabilità che accada</span>
      <div id="topPct" class="top-pct" aria-live="polite">—</div>
    </div>

    <div class="oracle-wrap">
      <div class="orb" aria-hidden="true"></div>
      <div id="oracleLine" class="oracle-line">—</div>
    </div>
    <div id="answer" class="story">⏳ …</div>

    <div class="hr"></div>
    <div class="label" id="lblP">Esito & motivazioni</div>

    <div class="result-box" id="resultBox">
      <div class="result-head">
        <span class="pct-label" id="pctLabelBottom">% probabilità che accada</span>
        <div id="bottomPct" class="result-pct">—</div>
        <span class="result-title" id="committeeTitle">—</span>
      </div>

      <!-- Motivazione classica (WTF e Surprise) -->
      <div class="mot" id="motOne">
        <div class="ico" id="motIco" aria-hidden="true">—</div>
        <div>
          <div class="name" id="motName">—</div>
          <div class="chips" id="chipsWrap">
            <span class="chip" id="chipFav">—</span>
            <span class="chip" id="chipCon">—</span>
            <span class="chip" id="chipAst">—</span>
          </div>
          <div class="note" id="motNote">—</div>
        </div>
      </div>

      <!-- Indicazione rapida (solo WHAT IF non-surprise) -->
      <div class="hr" id="guideSep"></div>
      <div class="mot" id="guideBox">
        <div class="ico" aria-hidden="true">🧭</div>
        <div class="note" id="guideNote">—</div>
      </div>
    </div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="saveBtn">⭐ Salva le mie visioni</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<div id="overlay" aria-hidden="true">
  <iframe id="overlay-frame" src="about:blank" title="modal"></iframe>
</div>

<p class="small" id="creditInfo" style="text-align:center;margin:10px 0 24px"></p>
<div class="toast" id="toast"></div>

<!-- 🔔 audio reveal -->
<audio id="revealDing" preload="auto">
  <source src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAA" type="audio/mpeg">
</audio>

<script>
/* ==== Base & prefs ==== */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
const IS_ADMIN = !!LS.getItem('admin_token');
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* ==== I18N ==== */
const I18N = {
  it:{ titleWTF:"⚡ What the F — Risultato", titleWHF:"💡 What if — Risultato",
       sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
       p:"Esito & motivazioni", share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
       save:"⭐ Salva le mie visioni", savedOk:"✅ Salvata",
       guide:"Indicazione rapida", guideFallback:"Scegli una micro-azione entro 24h e calendarizzala (10′).",
       copied:"Copiato!", error:"[errore server]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Stile: What the F · 6–9 frasi · paragrafo unico · tono asciutto · modalità: ${p==='past'?'Passato':'Futuro'}.`
        : `Stile: What if (60% analisi, 40% reale) · 8–11 frasi · paragrafo unico · modalità: ${p==='past'?'Passato':'Futuro'}.`,
       pctLabel:"% probabilità che accada",
       votersTitle:"Comitato", seriousTitle:"Motivazione", scientificTitle:"Motivazione (scientifica)",
       chipsFav:"favorevoli", chipsCon:"contrari", chipsAst:"astenuti",
       motFallback:"Motivo: benefici concreti a breve, con vincoli gestibili.",
       credits:(n)=>`💰 Crediti: ${n}`, noCredits:"Hai terminato i crediti.",
       storeTitle:"Crediti", watchAd:"Guarda pubblicità (+1)", close:"Chiudi",
       comingSoon:"Prossimamente", buySoonNote:"Acquisto crediti non ancora disponibile.",
       toastPlus:(n)=>`+${n} credito`, toastMinus:(n)=>`-${n} credito`
  },
  en:{ titleWTF:"⚡ What the F — Result", titleWHF:"💡 What if — Result",
       sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
       p:"Outcome & rationales", share:"📤 Share / Copy", again:"🔁 Ask another",
       save:"⭐ Save my visions", savedOk:"✅ Saved",
       guide:"Quick guidance", guideFallback:"Pick one micro-action within 24h and put it on your calendar (10′).",
       copied:"Copied!", error:"[server error]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · dry tone · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if (60% analysis, 40% real) · 8–11 sentences · single paragraph · mode: ${p==='past'?'Past':'Future'}.`,
       pctLabel:"% probability it happens",
       votersTitle:"Committee", seriousTitle:"Rationale", scientificTitle:"Rationale (scientific)",
       chipsFav:"in favour", chipsCon:"against", chipsAst:"abstained",
       motFallback:"Reason: short-term, concrete benefits with manageable constraints.",
       credits:(n)=>`💰 Credits: ${n}`, noCredits:"You ran out of credits.",
       storeTitle:"Credits", watchAd:"Watch ad (+1)", close:"Close",
       comingSoon:"Coming soon", buySoonNote:"Credit purchases not available yet.",
       toastPlus:(n)=>`+${n} credit`,  toastMinus:(n)=>`-${n} credit`
  }
};
const SUP_LANG=['it','en','es','fr','de'];
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';
function detectLang(text=''){
  const t=(text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank={
    it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
    en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
    es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
    fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
    de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]
  };
  const score={}; for(const L of SUP_LANG){ score[L]=0; (bank[L]||[]).forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1; for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){ const nav=(navigator.language||'it').slice(0,2).toLowerCase(); if(SUP_LANG.includes(nav)) return nav; }
  return best;
}
const manualLang = LS.getItem('lang_manual')==='1';
let lang = manualLang ? (SUP_LANG.includes((LS.getItem('lang')||'').toLowerCase()) ? (LS.getItem('lang')||'it').toLowerCase() : 'it') : detectLang(domandaEarly);
if(!SUP_LANG.includes(lang)) lang='it';
document.documentElement.lang=lang;
const t=()=>I18N[lang]||I18N.it;

/* ==== System prompts (solo UI) ==== */
const SYSTEM_WTF=`SEI “WHAT THE F”. Obiettivo: monologo breve…`;
const SYSTEM_WHIF=`SEI “WHAT IF”. Obiettivo: risposta empatica + pragmatica…`;

/* === ORACLE LINES === */
const ORACLE_LINES = {
  it: ["Shh… le carte girano piano.","Aspetta: la risposta bussa sottovoce.","L’aria si fa chiara, sta arrivando.","Non correre: il disegno prende forma.","Occhio: il quadro si accende da solo.","Silenzio un attimo… qualcosa si allinea.","Senti? C’è un passo che torna nel ritmo.","Trattieni il fiato: la moneta è a mezz’aria.","Una piega nella notte, poi luce sottile.","Le luci interne si accendono una alla volta.","Ancora un respiro… il filo si tende.","Eccolo: l’indizio che mancava si mostra."],
  en: ["Hush… the cards are turning.","Wait: the answer knocks softly.","Air clears; something is arriving.","Don’t rush—shape is forming.","Look: the outline lights itself.","Hold a breath… lines align.","A gust, then stillness.","The oracle turns the page… almost."]
};

/* ==== UI refs ==== */
const qs=(s)=>document.querySelector(s);
const subtitle=qs('#subtitle'), lblQ=qs('#lblQ'), lblA=qs('#lblA'), qView=qs('#qView');
const answerEl=qs('#answer'), shareBtn=qs('#shareBtn'), againBtn=qs('#againBtn');
const saveBtn=qs('#saveBtn');
const metaInfo=qs('#metaInfo'), styleBadge=qs('#styleBadge'), topPct=qs('#topPct'), bottomPct=qs('#bottomPct');
const pctLabelTop=qs('#pctLabel'), pctLabelBottom=qs('#pctLabelBottom'), committeeTitle=qs('#committeeTitle');
const motIco=qs('#motIco'), chipFav=qs('#chipFav'), chipCon=qs('#chipCon'), chipAst=qs('#chipAst'), chipsWrap=qs('#chipsWrap');
const motNote=qs('#motNote'), creditInfo=qs('#creditInfo'), toastEl=qs('#toast');
const motOne=qs('#motOne'), guideNote=qs('#guideNote'), guideBox=qs('#guideBox'), guideSep=qs('#guideSep');

/* ==== Toast ==== */
function toast(msg){ if(!toastEl) return; toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1500); }

/* ==== Wallet + legacy + 🎁 Sorprendimi ==== */
const WKEY="whatif_wallet";
const SURPKEY="whatif_surprise";
function readWallet(){ try{ const w=JSON.parse(LS.getItem(WKEY)||"{}")||{}; return {available:Number.isFinite(+w.available)?+w.available:null, used:Number.isFinite(+w.used)?+w.used:null, limit:Number.isFinite(+w.limit)?+w.limit:null}; }catch{return{available:null,used:null,limit:null}}}
function writeWallet(w){
  const cur=readWallet();
  const out={ available:(w.available!=null)?Math.max(0,+w.available):(cur.available??0),
              used:(w.used!=null)?Math.max(0,+w.used):(cur.used??0),
              limit:(w.limit!=null)?Math.max(0,+w.limit):(cur.limit??0) };
  LS.setItem(WKEY, JSON.stringify(out));
  LS.setItem("whatif_wallet_sync", String(Date.now()));
  updateCreditInfo();
}
function legacyCap(){ return (prefs.pro===true)?10:3 }
function legacyGetLeft(){
  const w=readWallet(); if(w.available!=null) return w.available;
  try{ const c=JSON.parse(LS.getItem('whatif_credits')||'{}'); const today=new Date().toISOString().slice(0,10); const used=(c.date===today)?(+c.used||0):0; return Math.max(0, legacyCap()-used); }catch{}
  const raw=LS.getItem('crediti'); return raw==null? legacyCap() : Math.max(0, parseInt(raw,10)||0);
}
function legacyConsumeOne(){
  try{ const w=readWallet(); if(w.available!=null){ if(w.available<=0) return false; writeWallet({available:w.available-1, used:Math.max(0,(w.used||0)+1), limit:(w.limit!=null?w.limit:legacyCap())}); return true; } }catch{}
  try{ const today=new Date().toISOString().slice(0,10); let c=JSON.parse(LS.getItem('whatif_credits')||'{}'); if(c.date!==today) c={date:today,used:0,limit:legacyCap()}; if((c.used||0)>= (c.limit||legacyCap())) return false; c.used=(c.used||0)+1; LS.setItem('whatif_credits', JSON.stringify(c)); return true; }catch{}
  let n=parseInt(LS.getItem('crediti')||'0',10)||0; if(n<=0) return false; LS.setItem('crediti', String(Math.max(0,n-1))); return true;
}
function getAvailable(){ if(IS_ADMIN) return Infinity; const w=readWallet(); return (w.available!=null)?w.available:legacyGetLeft() }
function consumeOne(){
  if(IS_ADMIN) return true;
  const w=readWallet();
  if(w.available!=null){
    if(w.available<=0) return false;
    writeWallet({available:w.available-1, used:Math.max(0,(w.used||0)+1), limit:(w.limit!=null?w.limit:legacyCap())});
    return true;
  }
  return legacyConsumeOne();
}
function addCredits(n){ n=Math.max(0,parseInt(n,10)||0); if(n<=0) return;
  const w=readWallet();
  if(w.available==null){ const left=legacyGetLeft(); writeWallet({available:left+n, used:0, limit:legacyCap()}); }
  else{ writeWallet({available:(w.available+n), used:Math.max(0,(w.used||0)-n), limit:(w.limit!=null?w.limit:legacyCap())}); }
}

/* 🎁 Sorprendimi */
function readSurprise(){ return Math.max(0, parseInt(LS.getItem(SURPKEY)||"0",10)||0); }
function writeSurprise(n){ n=Math.max(0, parseInt(n,10)||0); LS.setItem(SURPKEY,String(n)); updateCreditInfo(); LS.setItem("whatif_wallet_sync", String(Date.now())); }
function addSurprise(n){ writeSurprise(readSurprise() + Math.max(0,parseInt(n,10)||0)); }
function consumeSurpriseOne(){ const cur=readSurprise(); if(cur>0){ writeSurprise(cur-1); return true; } return false; }

function updateCreditInfo(n=getAvailable()){
  if(!creditInfo) return;
  const surprise = readSurprise();
  creditInfo.textContent = `${t().credits(n===Infinity?'∞':n)} · 🎁 Sorprendimi: ${surprise}`;
}
window.addEventListener('storage',(e)=>{ if(['whatif_wallet','whatif_wallet_sync','whatif_credits','admin_token','lang','lang_manual',SURPKEY].includes(e.key)){ updateCreditInfo(); }});

/* ==== Helpers testo ==== */
function setText(sel,txt){ const el=qs(sel); if(el) el.textContent=txt }
function normalizeOneParagraph(s=""){ return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim() }
function decorateEmBits(el){ const raw=el.textContent; if(!raw||!raw.includes("—")) return; const parts=raw.split("—"); let html=""; for(let i=0;i<parts.length;i++){ const seg=parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;"); html += (i%2? `<span class="embit">— ${seg} </span>` : (i===0?seg:`—${seg}`)); } el.innerHTML=html }

/* ==== Titles/Text ==== */
function applyUI(q){
  const T=t();
  setText('#title', style==='wtf'?T.titleWTF:T.titleWHF);
  subtitle.textContent=T.sub(q||'—'); setText('#lblQ', T.q); setText('#lblA', T.a); setText('#lblP', T.p);
  shareBtn.textContent=T.share; againBtn.textContent=T.again; if(saveBtn) saveBtn.textContent=T.save;
  styleBadge.textContent=(style==='wtf')?T.styleWTF:T.styleWHF;
  setText('#pctLabel', T.pctLabel); if(pctLabelBottom) pctLabelBottom.textContent=T.pctLabel; setText('#metaInfo', T.meta(style,periodo));
}

/* ==== Probability ==== */
function computeProbability(q){
  const tt=(q||'').toLowerCase(); let s=50;
  if(/\b(7|14|21|30|60|90)\b/.test(tt)) s+=12;
  if(/\b\d+([.,]\d+)?\b/.test(tt)) s+=8;
  if(/budget|€|euro|spesa|max|under|sotto/.test(tt)) s+=6;
  if(/senza|solo|al massimo|minimo|entro|prima delle|ogni|per/.test(tt)) s+=8;
  if(/lancia|apri|impara|scrivi|chiedi|corri|studia|automatizza|testa/.test(tt)) s+=6;
  if(/forse|magari|maybe|quizás/.test(tt)) s-=8;
  if(!/\b\d/.test(tt)) s-=6;
  s += (style==='wtf' ? -4 : +2);
  return {pct: Math.max(25, Math.min(92, Math.round(s)))}
}

/* === ORACLE helpers === */
let oracleTimerId = null;
function startOracleLoading(){
  document.body.classList.add('loading');
  const lineEl = document.getElementById('oracleLine');
  const bank = ORACLE_LINES[lang] || ORACLE_LINES.it;
  let i=0;
  lineEl.textContent = bank[i%bank.length];
  oracleTimerId = setInterval(()=>{
    i++; lineEl.textContent = bank[i%bank.length];
  }, 1600);
}
function stopOracleLoading(){
  document.body.classList.remove('loading');
  clearInterval(oracleTimerId); oracleTimerId=null;
  const lineEl = document.getElementById('oracleLine');
  setTimeout(()=>{ if(lineEl) lineEl.textContent = " "; }, 350);
}
function revealEffect(){
  const wrap = document.querySelector('.oracle-wrap');
  if(!wrap) return;
  wrap.classList.add('reveal');
  try{ document.getElementById('revealDing').play().catch(()=>{}); }catch{}
  setTimeout(()=> wrap.classList.remove('reveal'), 900);
}

/* === Indicazione rapida (deriva dal testo domanda) === */
function directTip(domanda=""){
  const L = lang;
  const q=(domanda||"").toLowerCase();
  let topic="azione";
  if(/tempo|scadenza|quando|settimana|mese|orari/.test(q)) topic=(L==='en')?'time':'tempo';
  else if(/soldi|budget|euro|€|spesa|costo|prezzo/.test(q)) topic=(L==='en')?'budget':'budget';
  else if(/lavor|job|colloquio|cv|impiego/.test(q)) topic=(L==='en')?'work':'lavoro';
  else if(/amore|relaz|cuore|partner|fidanz|matrimonio/.test(q)) topic=(L==='en')?'love':'amore';
  else if(/studio|esame|impara|corso|lezione/.test(q)) topic=(L==='en')?'study':'studio';
  const map={
    it:`🧭 ${I18N.it.guide}: blocca 10′ oggi su ${topic}: 1) primo passo adesso; 2) verifica tra 3 giorni.`,
    en:`🧭 ${I18N.en.guide}: block 10′ today on ${topic}: 1) first step now; 2) check-in in 3 days.`
  };
  return map[L] || `${I18N.it.guide}: ${I18N.it.guideFallback}`;
}

function openOverlay(url){
  overlay.style.display='grid';
  overlay.setAttribute('aria-hidden','false');
  overlayFrame.removeAttribute('srcdoc');
  overlayFrame.src='about:blank';
  const sep = url.includes('?')?'&':'?';
  const finalUrl = `${url}${sep}lang=${encodeURIComponent(lang)}`;
  overlayFrame.onload = ()=>{ try{ clearTimeout(overlayLoadTimer); }catch{} };
  overlayFrame.onerror= ()=>{ try{ clearTimeout(overlayLoadTimer); }catch{} };
  overlayFrame.setAttribute('srcdoc', storeFallbackHTML());
  overlayFrame.src = finalUrl;
  try{ clearTimeout(overlayLoadTimer); }catch{}
  overlayLoadTimer=setTimeout(()=>{ try{ overlayFrame.setAttribute('srcdoc', storeFallbackHTML()); }catch{} },1500);
}
function closeOverlay(){
  overlay.style.display='none';
  overlay.setAttribute('aria-hidden','true');
  overlayFrame.src='about:blank';

}

/* ==== Question & UI load ==== */
function applyQuestion(){
  const req=JSON.parse(LS.getItem('whatif_request')||'{}');
  const domanda=req.domanda || LS.getItem('domanda') || '';
  applyUI(domanda);
  qView.textContent = domanda || '—';

                   || req?.surprise===true || req?.micro?.surprise===true
                   || LS.getItem('surprise_mode')==='1';
  return {req, domanda, surprise};

/* ==== Riquadri: visibilità ==== */
function setBlocks({surprise}){
  if(surprise){
    // Surprise -> ironico/committee, niente guida
    motOne.style.display='grid';
    guideSep.style.display='none';
    guideBox.style.display='none';
    committeeTitle.textContent = t().votersTitle || 'Comitato';
    return;
  }
  if(style==='wtf'){
    // What the F -> motivazione classica
    motOne.style.display='grid';
    guideSep.style.display='none';
    guideBox.style.display='none';
    committeeTitle.textContent = t().scientificTitle;
    return;
  }
  // WHAT IF non-surprise -> SOLO indicazione rapida
  motOne.style.display='none';
  guideSep.style.display='';
  guideBox.style.display='grid';
  committeeTitle.textContent = t().guide;
}

/* ==== Main flow ==== */
async function startFlow(){
  const {req, domanda, surprise} = applyQuestion();
  updateCreditInfo();

  startOracleLoading();

  // Crediti (semplificato: usa legacy per compatibilità)
  if(!IS_ADMIN){
    const left=getAvailable();
    if(!(left===Infinity) && left<=0){
      stopOracleLoading();
      answerEl.textContent=t().noCredits;
      openOverlay("/store/credit-store.html");
      return;
    }
    consumeOne();
    toast(t().toastMinus(1));
    updateCreditInfo();
  }

  // Mostra/nascondi blocchi ora
  setBlocks({surprise});

  try{
    const headers={"Content-Type":"application/json"};
    if(prefs.pro===true) headers["x-pro"]="1";
    const adminToken=LS.getItem("admin_token"); if(adminToken) headers["x-admin-token"]=adminToken;

    const r=await fetch("/api/ask",{
      method:"POST",headers,
      body:JSON.stringify({ domanda, lang, stile:style, periodo,
        system:(style==='wtf'?SYSTEM_WTF:SYSTEM_WHIF), extra:"", micro:req.micro||{} })
    });
    const data=await r.json().catch(()=>null);
    if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

    let answerText=normalizeOneParagraph((data.answer||"").trim());
    const maxSent=(style==='wtf')?9:11;
    let parts=answerText.split(/(?<=[.!?…])\s+/);
    if(parts.length>maxSent) parts=parts.slice(0,maxSent);
    answerText=parts.join(" ").trim();
    if(!/[.!?…]$/.test(answerText)) answerText+='.';
    answerEl.textContent=answerText; decorateEmBits(answerEl);

    stopOracleLoading();
    revealEffect();

    const apiPct = (data && Number.isFinite(+data.pct)) ? Math.max(0, Math.min(100, Math.round(+data.pct))) : null;
    const usedPct = (apiPct!=null) ? apiPct : computeProbability(domanda).pct;
    const pStr = usedPct + "%";
    topPct.textContent = pStr;
    bottomPct.textContent = pStr;

    if (surprise){
      // Surprise -> committee playful text
      const rdm=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      motIco.style.display='';
      chipsWrap.style.display='flex';
      committeeTitle.textContent=t().votersTitle||'Comitato';
      motNote.textContent=(lang==='en')?`Brief tussle at vote: ${rdm(1,5)} removed; ${rdm(0,3)} bruised.`
                       :`Breve parapiglia al voto: ${rdm(1,5)} allontanati; ${rdm(0,3)} contusi.`;
      chipFav.textContent=`${t().chipsFav} ${rdm(120,1200)}`;
      chipCon.textContent=`${t().chipsCon} ${rdm(0,900)}`;
      chipAst.textContent=`${t().chipsAst} ${rdm(0,400)}`;
    } else if (style==='wtf'){
      // WTF -> motivazione/scientifica
      motIco.style.display='none';
      chipsWrap.style.display='none';
      committeeTitle.textContent = t().scientificTitle;
      const sciText = (data && data.scientific) ? String(data.scientific).trim()
                     : (lang==='en' ? "Scientific note: small, consistent steps beat sporadic big efforts."
                                    : "Nota scientifica: i piccoli passi consistenti vincono sui grandi sforzi saltuari.");
      motNote.textContent = sciText;
    } else {
      // WHAT IF non-surprise -> indicazione rapida
      const guideText = (data && data.guide) ? String(data.guide).trim() : directTip(domanda);
      guideNote.textContent = guideText || (t().guide + ": " + t().guideFallback);
    }

    // Salva cronologia (manteniamo un unico campo 'motivazione' per compat)
    const hist=JSON.parse(LS.getItem('cronologia')||'[]');
    const motivazioneUsata = (surprise||style==='wtf') ? (motNote.textContent||'') : (guideNote.textContent||'');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now(), surprise, pct:usedPct, motivazione:motivazioneUsata });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

  }catch(e){
    console.error(e);
    stopOracleLoading();
    answerEl.textContent=t().error;
  }
}
