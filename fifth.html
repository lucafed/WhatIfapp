<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>

<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* === TOP PERCENT ROW === */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;
  min-width:64px;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px var(--glow);
}

/* === RISULTATI SOTTO === */
.result-box{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28);
}
.result-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:8px;
}
.result-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;
  min-width:64px; padding:5px 10px; border-radius:12px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px var(--glow);
}
.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}

/* === MOTIVO === */
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .ico{font-size:18px;line-height:1.2}
.mot .name{display:none}
.mot .note{
  font-size:15px;
  line-height:1.6;
  color:var(--fg);
  opacity:.92;
}

/* Chips voti */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;opacity:.9}
.chip{
  font-size:11px;
  font-weight:900;padding:3px 7px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
}

/* Mobile */
@media (max-width:420px){
  .result-pct,.top-pct{font-size:15px;min-width:56px;padding:4px 8px}
  .result-title{font-size:14px}
  .mot .note{font-size:15.5px;line-height:1.65}
}
</style>

const LS = localStorage;

const periodo = prefs.periodo || 'future';

/* ===== Lingua ===== */
const SUP_LANG = ['it','en','es','fr','de'];
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';

function detectLang(text=''){
  const t = (text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank = {
    it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
    en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
    es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
    fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
    de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]
  };
  const score = {};
  for(const L of SUP_LANG){ score[L]=0; bank[L].forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1;
  for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){
    const nav = (navigator.language||'it').slice(0,2).toLowerCase();
    if(SUP_LANG.includes(nav)) return nav;
  }
  return best;
}

const manualLang = LS.getItem('lang_manual') === '1';
let langStored = (LS.getItem('lang') || '').toLowerCase();
let lang = manualLang ? (SUP_LANG.includes(langStored)?langStored:'it')
                      : detectLang(domandaEarly);
if(!SUP_LANG.includes(lang)) lang = 'it';

document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');
document.documentElement.lang = lang;

/* ==== PRO badge ==== */

/* ==== Helpers ==== */
function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?…])/g,"$1").trim();
}
function splitSentences(text){
  const t = normalizeOneParagraph(text);
  const parts = t.split(/(?<=[.!?…])\s+/).map(x=>x.trim()).filter(Boolean);
  return parts.length ? parts : (t? [t] : []);
}
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw || !raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

/* ======== ENFORCE TONE ========
   Garantisce:
   - WTF: 6–9 frasi, secche, paragrafo unico, niente prolissità.
   - WHATIF: 8–11 frasi, bilanciate (≈60% analisi, 40% pratiche). */
function enforceTone(text, mode){
  let sents = splitSentences(text);
  const clamp = (n,min,max)=> Math.max(min, Math.min(max, n));
  const shorten = (t)=> t.replace(/\((.*?)\)/g,"").replace(/-{2,}/g,"—")
                         .replace(/[,;:]\s*perché\b/gi,", perché")
                         .replace(/\bquindi\b/gi,"").trim();
  const dry = (t)=> t.replace(/\b(in definitiva|in conclusione|alla fine|tutto sommato)\b/gi,"")
                     .replace(/\bforse|magari|un po'|potrebbe\b/gi,"").trim();

  if(mode==='wtf'){
    sents = sents.map(x=> dry(shorten(x)));
    // accorcia le frasi lunghe
    sents = sents.map(x=> x.length>160 ? x.replace(/,.*?(?=[.!?…])/,".").trim() : x);
    // target 6–9
    let target = rndInt(6,9);
    if(sents.length===0){
      sents = [
        "Domanda chiara.",
        "Taglia il superfluo.",
        "Un passo al giorno.",
        "Misura in giorni, non in desideri.",
        "Se non entra in agenda, non è priorità.",
        "Agisci ora. Rivedi domani."
      ];
    }
    if(sents.length>target) sents = sents.slice(0,target);
    if(sents.length<target){
      const filler = [
        "Riduci la scelta a una leva sola.",
        "Blocca il tempo prima delle scuse.",
        "Chiudi piccolo, ma chiudi.",
        "Dai un numero a costo e calendario.",
        "Se dubbi, semplifica ancora."
      ];
      while(sents.length<target) sents.push(pick(filler));
    }
    sents = sents.map(x=>/[.!?…]$/.test(x)?x:x+".");
    return normalizeOneParagraph(sents.join(" "));
  }else{
    // WHAT IF: 8–11 frasi, 60/40
    const target = rndInt(8,11);
    let analysis = [], practical = [];
    const splitIdx = Math.ceil(target*0.6);

    // se non abbiamo abbastanza, creiamo base
    if(sents.length<target){
      const seed = [
        "Parti dall’esito che puoi misurare.",
        "Definisci una finestra temporale breve.",
        "Riduci l’ambizione per aumentare l’aderenza.",
        "Scegli una leva principale.",
        "Metti limiti chiari a costo, tempo e qualità.",
        "Registra il progresso con un indicatore semplice.",
        "Prepara un’alternativa se la leva non rende.",
        "Chiudi ogni sessione con il prossimo passo scritto.",
        "Fai una retrospettiva settimanale.",
        "Se non avanza, togli attrito o cambia ipotesi."
      ];
      while(sents.length<target) sents.push(pick(seed));
    }
    sents = sents.slice(0,target).map(x=>/[.!?…]$/.test(x)?x:x+'.');

    analysis = sents.slice(0, splitIdx);
    practical = sents.slice(splitIdx);

    // raffina toni
    analysis = analysis.map(x=> x.replace(/\b(ovviamente|naturalmente|chiaramente)\b/gi,"")
                                 .replace(/\bforse|magari\b/gi,"").trim());
    practical = practical.map(x=> x.replace(/\bprova a\b/gi,"").trim());

    return normalizeOneParagraph([...analysis, ...practical].join(" "));
  }
}

/* 1) Classificazione domanda -> categoria */
const CAT_RX = [
  {cat:'lavoro',     rx:[/lavor/i,/linkedin/i,/cv\b/i,/colloqu/i,/team/i,/azienda/i,/remot/i,/assunz/i,/promoz/i]},
  {cat:'studio',     rx:[/studio/i,/universit/i,/esame/i,/tesi/i,/corso/i,/certific/i,/impar/i,/inglese/i]},
  {cat:'soldi',      rx:[/budget/i,/spes/i,/rispar/i,/sold/i,/debito/i,/invest/i,/entrate|uscite|prezzo/i]},
  {cat:'sport',      rx:[/correr/i,/palestra/i,/allen/i,/nuot/i,/bic/i,/passi/i,/yoga/i,/stretch/i]},
  {cat:'relazioni',  rx:[/partner/i,/amic/i,/famiglia/i,/relaz/i,/confini/i,/social/i,/rete/i]},
  {cat:'viaggi',     rx:[/viagg/i,/volo/i,/hotel/i,/citt[aà]/i,/weekend/i,/itiner/i]},
  {cat:'tech',       rx:[/\bai\b/i,/app/i,/sito/i,/(automation|automatizz)/i,/script/i,/notion/i,/prompt/i,/email/i]},
  {cat:'business',   rx:[/e-?commerce/i,/client/i,/newsletter/i,/landing/i,/pitch/i,/startup/i,/fatturat/i]},
  {cat:'salute',     rx:[/sonno/i,/medit/i,/stress/i,/aliment/i,/dieta/i,/peso/i,/salut/i]},
  {cat:'casa',       rx:[/trasl/i,/arred/i,/ristrutt/i,/puliz/i,/organizz/i,/declutter/i]}
];
function detectCategory(q){
  const t=(q||'').toLowerCase();
  for(const row of CAT_RX){ if(row.rx.some(r=>r.test(t))) return row.cat; }
  if(/\b(\d+)\s?(km|k|€|euro|%|giorni|settimane|mesi)\b/i.test(t)) return 'soldi';
  return 'lavoro';
}

/* 2) Feature extraction per la % */
function extractFeatures(q){
  const t=(q||'').toLowerCase();
  const hasTime = /(30|7|14|21|60|90)\s*(giorn|gg)|settim|mesi?|this week|in \d+ (days?|weeks?|months?)/i.test(t);
  const hasNumber = /\b\d+([.,]\d+)?\b/.test(t);
  const hasBudget = /(budget|€|euro|spesa|max|sotto)/i.test(t);
  const hasConstraint = /(senza|solo|al massimo|minimo|entro|prima delle|dalle|ogni|per)/i.test(t);
  const hasActionVerb = /(lancia(re)?|apri(re)?|impara(re)?|scrivi(re)?|chiedi(re)?|corri(re)?|studia(re)?|automatizza(re)?|testa(re)?)/i.test(t);
  const vague = /(forse|provare|vedere|magari|un po')/i.test(t);
  return {hasTime,hasNumber,hasBudget,hasConstraint,hasActionVerb,vague};
}

/* 3) Percentuale */
function clampNum(n,min,max){ return Math.max(min, Math.min(max, n)); }
function computeProbability(q){
  const cat = detectCategory(q);
  const f = extractFeatures(q);
  let score = 50;
  if(f.hasTime)       score += 12;
  if(f.hasNumber)     score += 8;
  if(f.hasBudget)     score += 6;
  if(f.hasConstraint) score += 8;
  if(f.hasActionVerb) score += 6;
  if(f.vague)         score -= 8;
  if(!f.hasTime && !f.hasNumber) score -= 6;
  const catAdj = { lavoro:+4, studio:+5, soldi:+3, sport:+2, relazioni:+1,
                   viaggi:+2, tech:+5, business:+3, salute:+2, casa:+1 }[cat] || 0;
  score += catAdj;
  score += (style==='wtf' ? -4 : +2);
  const seed = Array.from(cat + JSON.stringify(f)).reduce((a,c)=>a+c.charCodeAt(0),0);
  score += (seed % 7) - 3;
  return { pct: clampNum(Math.round(score), 25, 92), cat, f };
}

  fr:{ lead:["Motif","Justification","Pourquoi ça peut marcher","Pourquoi c’est crédible"],

       lead2:["Schlüsselbeschränkungen","Erfolgsbedingungen","Hinweise/Grenzen","Es hängt ab von"],
       hasTime:["Time-Boxing reduziert Prokrastination","ein klares Ziel erhöht die Adhärenz","explizite Deadlines erleichtern den Abschluss"],
       noTime:["eine Time-Box kann die Chancen erhöhen","eine Frist macht den Plan robuster","ein expliziter Zeithorizont unterstützt die Umsetzung"] }
};
function l10nPack(){
  return MOTIVE_LEADS[lang] || MOTIVE_LEADS.it;
}
function motivesBankFor(cat){
  const tryLang = MOTIVES_L10N[lang]?.[cat];
  if(tryLang) return tryLang;
  return MOTIVES_L10N.it[cat] || MOTIVES_L10N.en[cat];
}
function rotateIndex(key, max){
  const i = ((+LS.getItem(key)||0)+1)%max;
  LS.setItem(key, String(i));
  return i;
}
function buildSeriousMotivation(question){
  const { pct, cat, f } = computeProbability(question);
  const bank = motivesBankFor(cat);
  const L = l10nPack();

  const lead = pick(L.lead);
  const lead2 = pick(L.lead2);
  const join = pick([", ", "; ", " — "]);

  const iWhy = rotateIndex("mot_w_"+cat, bank.why.length);
  const iCon = rotateIndex("mot_c_"+cat, bank.constraints.length);

  const reason1 = bank.why[iWhy];
  const reason2 = pick(bank.why.filter((_,k)=>k!==iWhy));
  const cons1 = bank.constraints[iCon];
  const cons2 = pick(bank.constraints.filter((_,k)=>k!==iCon));

  const horizonHint = f.hasTime ? pick(L.hasTime) : pick(L.noTime);

  const text =
    `${lead}: ${reason1}${join}${reason2}. `+
    `${lead2}: ${cons1}${join}${cons2}; ${horizonHint}.`;

  const key = (question||'').toLowerCase().replace(/\s+/g,' ').slice(0,120);
  const recent = JSON.parse(LS.getItem('mot_recent')||'[]');
  if(recent.includes(key)){
    const tweak = (lang==='en') ? " — suggested variation: micro-experiment and weekly checkpoint."
               : (lang==='es') ? " — variación sugerida: micro-experimento y control semanal."
               : (lang==='fr') ? " — variation suggérée : micro-expérience et point hebdo."
               : (lang==='de') ? " — empfohlene Variation: Mikro-Experiment und Wochen-Checkpoint."
               : " — variazione consigliata: micro-esperimento e checkpoint settimanale.";
    return { pct, text: text.replace(/\.$/, tweak) };
  }
  recent.unshift(key);
  LS.setItem('mot_recent', JSON.stringify(recent.slice(0,30)));
  return { pct, text };
}

function buildCommittee(){

    (lang==='it') ? cat.name_it :
    (lang==='es') ? cat.name_es :
    (lang==='fr') ? cat.name_fr :
    (lang==='de') ? cat.name_de : cat.name_en;

    (lang==='it') ? (cat.notes_it||[]) :

/* ==== Surprise detector ==== */
function isSurprise(req){
  const params = new URLSearchParams(location.search);
  return params.get('src')==='surprise'
      || LS.getItem('surprise_mode')==='1'
      || req?.surprise === true
      || req?.micro?.surprise === true
      || LS.getItem('absurd_prompt')==='1';
}

/* === Config API + util === */
const API_BASE = localStorage.getItem('api_base') || '/api';
function fetchWithTimeout(url, opts={}, ms=12000){
  return Promise.race([
    fetch(url, opts),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))
  ]);
}

/* === Fallback locale: genera risposta nello stile scelto === */
function localFallback(domanda, style, lang){
  const base = (domanda||'').trim() || (lang==='en'?'your question':'la tua domanda');
  if(style==='wtf'){
    const lines = [
      `Domanda chiara: ${base}.`,
      `Vincoli noti, margine d'errore stretto.`,
      `Leve utili: tempo, focus, una scelta alla volta.`,
      `Taglia ciò che è accessorio.`,
      `Misura in giorni, non in desideri.`,
      `Se non entra nel calendario, non è una priorità.`,
      `Agisci oggi, rivedi domani.`
    ];
    return enforceTone(lines.join(' '), 'wtf');
  }else{
    const lines = [
      `Partiamo da qui: ${base}.`,
      `Definisci un esito concreto che puoi verificare in poco tempo.`,
      `Blocca sul calendario due finestre fisse a settimana: proteggono il ritmo.`,
      `Riduci l’ambizione: metà portata, doppia probabilità di chiudere.`,
      `Scegli una sola leva principale e una secondaria di backup.`,
      `Metti un numero su budget, tempo e qualità minima accettabile.`,
      `Ogni sessione finisce con il passo successivo già scritto.`,
      `Retrospettiva breve ogni 7 giorni: mantieni ciò che aiuta, elimina il resto.`,
      `Se dopo due cicli non avanza, semplifica ancora o cambia ipotesi.`
    ];
    return enforceTone(lines.join(' '), 'whatif');
  }
}

/* ==== Load & render ==== */
(async ()=>{
  // set select to current lang
  const sel = document.getElementById('langSelect');
  if(sel) sel.value = lang;

  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const surprise = isSurprise(req);

  // domanda
  let domanda = req.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda);
  qs('#qView').textContent = domanda || '—';

  // prova API, altrimenti fallback
  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetchWithTimeout(`${API_BASE}/ask`,{
      method:"POST",
      headers,
      body:JSON.stringify({ domanda, lang, stile: style, periodo, extra:"", micro:req.micro||{} })
    }, 12000);

    let data = null;
    try{ data = await r.json(); }catch{}

    if(!r.ok) throw new Error(`http_${r.status}`);
    if(!data || typeof data.answer!=='string' || !data.answer.trim()) throw new Error('bad_payload');

    // risposta OK da server
    let answerText = normalizeOneParagraph(data.answer.trim());
    answerText = enforceTone(answerText, style==='wtf' ? 'wtf' : 'whatif');
    qs('#answer').textContent = answerText;
    decorateEmBits(qs('#answer'));

    // === Motivazione & %
    const mot = buildSeriousMotivation(domanda);
    const pctStr = mot.pct + "%";
    topPct.textContent = pctStr;
    bottomPct.textContent = pctStr;

    const T = I18N[lang] || I18N.it;
    if (surprise){
      motIco.style.display = '';
      chipsWrap.style.display = 'flex';
      renderCommittee(buildCommittee());
      committeeTitle.textContent = committeeTitle.textContent || (T.votersTitle || 'Comitato');
    } else {
      const title = (style==='wtf') ? T.scientificTitle : T.seriousTitle;
      committeeTitle.textContent = title;
      motIco.style.display = 'none';
      chipsWrap.style.display = 'none';
      motNote.textContent = (style==='wtf') ? pickScientificMotivation() : mot.text;
    }

    // storia
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now(), surprise, pct:mot.pct, motivazione: (style==='wtf')? undefined : mot.text });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

  }catch(e){
    // Mostra errore tecnico + attiva fallback locale
    const T = I18N[lang] || I18N.it;
    const code = (e && e.message) ? e.message : 'unknown';
    const tech = (lang==='en')?'Server error':'Errore server';
    qs('#answer').textContent = `${tech} (${code}). Vado in modalità offline.`;
    // Fallback
    const offlineAnswer = localFallback(domanda, style, lang);
    setTimeout(()=>{
      qs('#answer').textContent = offlineAnswer;
      decorateEmBits(qs('#answer'));
      // percentuale e motivazioni anche offline
      const mot = buildSeriousMotivation(domanda);
      const pctStr = mot.pct + "%";
      topPct.textContent = pctStr;
      bottomPct.textContent = pctStr;
      const title = (style==='wtf') ? (T.scientificTitle) : (T.seriousTitle);
      committeeTitle.textContent = title;
      motIco.style.display = 'none';
      chipsWrap.style.display = 'none';
      motNote.textContent = (style==='wtf') ? pickScientificMotivation() : mot.text;

      // salva in cronologia anche in offline
      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:offlineAnswer, stile:style, periodo, ts:Date.now(), surprise, pct:mot.pct, motivazione: (style==='wtf')? undefined : mot.text, offline:true });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
    }, 400);
    console.error(e);
  }
})();
