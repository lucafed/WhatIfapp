<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Result</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:rgba(20,28,34,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit { padding:0 .08em; box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset; text-shadow:0 0 12px rgba(255,255,255,.08); border-radius:4px; }

/* popover traduzione */
.pop{
  position:relative;
}
.menu{
  position:absolute; right:0; top:calc(100% + 6px);
  background:rgba(25,33,40,.98);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px; padding:6px;
  display:none; min-width:180px; z-index:5;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.menu.open{ display:block; }
.menu button{
  width:100%; text-align:left; padding:8px 10px; border-radius:10px;
  background:transparent; color:#fff; border:none; cursor:pointer;
}
.menu button:hover{ background:rgba(255,255,255,.08); }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <!-- badge lingua (solo display) -->
      <span class="badge" id="langBadge">🌐 IT</span>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="ttsBtn">🔊 Ascolta</button>

      <div class="pop">
        <button class="btn ghost" id="translateBtn">🌐 Traduci</button>
        <div class="menu" id="translateMenu" aria-hidden="true">
          <button data-lang="it">Italiano (IT)</button>
          <button data-lang="en">English (EN)</button>
          <button data-lang="es">Español (ES)</button>
          <button data-lang="fr">Français (FR)</button>
          <button data-lang="de">Deutsch (DE)</button>
        </div>
      </div>

      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
/* ===== Helpers / Stato ===== */
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
let lang  = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');
document.documentElement.lang = lang;

const I18N_ALL={
  it:{tWTF:"⚡ What the F — Risultato", tWHF:"💡 What if — Risultato",
      sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
      share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
      tts:"🔊 Ascolta", translate:"🌐 Traduci", copied:"Copiato!", error:"[errore server]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Stile: What the F · 6–9 frasi · paragrafo unico · 3+ stoccate interne · doppia punchline · modalità: ${p==='past'?'Passato':'Futuro'}.`
        : `Stile: What if · 8–11 frasi · paragrafo unico · niente elenchi/domande/emoji · modalità: ${p==='past'?'Passato':'Futuro'}.`,
      lead:{wtf:[
        "Entri piano, il caos ti riconosce e ti fa passare.",
        "Respiri e lasci che sia il destino a inciampare per primo.",
        "Ti presenti al futuro con la faccia di adesso e la pazienza di domani."
      ], whatif:[
        "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
        "La stanza è la stessa, lo sguardo no: è già un inizio.",
        "Respiri come chi ha tempo, e il tempo ti crede."
      ]}},
  en:{tWTF:"⚡ What the F — Result", tWHF:"💡 What if — Result",
      sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
      share:"📤 Share / Copy", again:"🔁 Ask another",
      tts:"🔊 Listen", translate:"🌐 Translate", copied:"Copied!", error:"[server error]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · 3+ inside jabs · double punchline · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if · 8–11 sentences · single paragraph · no lists/questions/emojis · mode: ${p==='past'?'Past':'Future'}.`,
      lead:{wtf:[
        "You step in slowly; chaos recognizes you and lets you through.",
        "You breathe and let fate be the one who trips first."
      ], whatif:[
        "Set the keys down and let the quiet that doesn’t judge go first.",
        "Same room, different gaze — that’s already a start."
      ]}},
  es:{tWTF:"⚡ What the F — Resultado", tWHF:"💡 What if — Resultado",
      sub:(q)=>`Pregunta: “${q}”`, q:"Tu pregunta", a:"Respuesta",
      share:"📤 Compartir / Copiar", again:"🔁 Hacer otra",
      tts:"🔊 Escuchar", translate:"🌐 Traducir", copied:"¡Copiado!", error:"[error del servidor]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Estilo: What the F · 6–9 frases · un solo párrafo · 3+ pullitas internas · doble remate · modo: ${p==='past'?'Pasado':'Futuro'}.`
        : `Estilo: What if · 8–11 frases · un solo párrafo · sin listas/preguntas/emojis · modo: ${p==='past'?'Futuro':'Futuro'}.`,
      lead:{wtf:["Respiras y dejas que se tropiece el destino."], whatif:["Deja las llaves y deja hablar al silencio."]}},
  fr:{tWTF:"⚡ What the F — Résultat", tWHF:"💡 What if — Résultat",
      sub:(q)=>`Question : « ${q} »`, q:"Ta question", a:"Réponse",
      share:"📤 Partager / Copier", again:"🔁 Poser une autre",
      tts:"🔊 Écouter", translate:"🌐 Traduire", copied:"Copié !", error:"[erreur serveur]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Style : What the F · 6–9 phrases · paragraphe unique · 3+ piques internes · double chute · mode : ${p==='past'?'Passé':'Futur'}.`
        : `Style : What if · 8–11 phrases · paragraphe unique · pas de listes/questions/émojis · mode : ${p==='past'?'Passé':'Futur'}.`,
      lead:{wtf:["Tu respires et la scène te laisse passer."], whatif:["Pose les clés et laisse parler le silence."]}},
  de:{tWTF:"⚡ What the F — Ergebnis", tWHF:"💡 What if — Ergebnis",
      sub:(q)=>`Frage: „${q}“`, q:"Deine Frage", a:"Antwort",
      share:"📤 Teilen / Kopieren", again:"🔁 Neue Frage",
      tts:"🔊 Anhören", translate:"🌐 Übersetzen", copied:"Kopiert!", error:"[Serverfehler]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      meta:(st,p)=> st==='wtf'
        ? `Stil: What the F · 6–9 Sätze · ein Absatz · 3+ Seitenhiebe · Doppelpointe · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`
        : `Stil: What if · 8–11 Sätze · ein Absatz · keine Listen/Fragen/Emojis · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`,
      lead:{wtf:["Du atmest, das Chaos nickt und lässt dich durch."], whatif:["Lege die Schlüssel ab und lass die Stille vor." ]}}
};
const I18N = I18N_ALL[lang] || I18N_ALL.it;

/* ===== UI base ===== */
const $ = (q)=>document.querySelector(q);
$('#backBtn').onclick=()=>history.back();
$('#homeBtn').onclick=()=>location.href='index.html';
$('#lblQ').textContent=I18N.q;
$('#lblA').textContent=I18N.a;
$('#shareBtn').textContent=I18N.share;
$('#againBtn').textContent=I18N.again;
$('#ttsBtn').textContent=I18N.tts;
$('#translateBtn').textContent=I18N.translate;
$('#styleBadge').textContent = (style==='wtf') ? I18N.styleWTF : I18N.styleWHF;
$('#langBadge').textContent = `🌐 ${lang.toUpperCase()}`;

/* ===== Lead & meta ===== */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function hashStr(s=""){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; } return Math.abs(h); }
function stablePick(arr, seedStr){ if(!arr?.length) return ""; if(!seedStr?.trim()) return pick(arr); const h=hashStr(seedStr); return arr[h%arr.length]; }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }

const prefsData = JSON.parse(LS.getItem('whatif_request')||'{}');
let domanda = prefsData.domanda || LS.getItem('domanda') || "";
function setTitles(q){
  $('#title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
  $('#subtitle').textContent = I18N.sub(q);
  $('#styleBadge').textContent = (style==='wtf') ? I18N.styleWTF : I18N.styleWHF;
  const bank = (I18N.lead?.[style]) || (I18N_ALL['it'].lead.whatif);
  const seed = `${(q||"").toLowerCase().trim()}|${style}|${lang}`;
  const line = oneSentence(stablePick(bank, seed));
  $('#lead').textContent = line;
  $('#metaInfo').textContent = I18N.meta(style, periodo);
}
setTitles(domanda);
$('#qView').textContent = domanda || '—';

/* ===== Decorazioni “— … —” ===== */
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}
function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
}

/* ===== Fetch risposta ===== */
let answerText="";
async function fetchAnswer(targetLang){
  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const body = {
      domanda,
      lang: targetLang || lang,
      stile: style,
      extra: "",
      micro: prefsData.micro || {},
      periodo
    };
    const r = await fetch("/api/ask",{ method:"POST", headers, body:JSON.stringify(body) });
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
    answerText = normalizeOneParagraph(String(data.answer||"").trim());
    if(!/[.!?…]$/.test(answerText)) answerText += ".";
    const node = $('#answer');
    node.textContent = answerText;
    decorateEmBits(node);
    // aggiorna lingua attiva su badge se abbiamo tradotto
    if(targetLang){
      lang = targetLang;
      LS.setItem('lang', lang);
      document.documentElement.lang = lang;
      $('#langBadge').textContent = `🌐 ${lang.toUpperCase()}`;
      // rinfresca etichette UI alla nuova lingua
      const I2 = I18N_ALL[lang] || I18N_ALL.it;
      $('#lblQ').textContent=I2.q; $('#lblA').textContent=I2.a;
      $('#shareBtn').textContent=I2.share; $('#againBtn').textContent=I2.again;
      $('#ttsBtn').textContent=I2.tts; $('#translateBtn').textContent=I2.translate;
      $('#title').textContent = (style==='wtf'? I2.tWTF : I2.tWHF);
      $('#subtitle').textContent = I2.sub(domanda);
      $('#styleBadge').textContent = (style==='wtf') ? I2.styleWTF : I2.styleWHF;
      $('#metaInfo').textContent = I2.meta(style, periodo);
      // aggiorna lead
      const bank = (I2.lead?.[style]) || (I18N_ALL['it'].lead.whatif);
      $('#lead').textContent = oneSentence(stablePick(bank, `${(domanda||"")}|${style}|${lang}`));
    }
  }catch(e){
    console.error(e);
    $('#answer').textContent = (I18N_ALL[lang]||I18N_ALL.it).error;
  }
}
fetchAnswer(); // prima render nella lingua corrente

/* ===== Share ===== */
$('#shareBtn').onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n(${periodo})\n\nQ: ${domanda}\n\n${answerText}`;
  const I2 = I18N_ALL[lang]||I18N_ALL.it;
  try{
    if(navigator.share){ await navigator.share({ title: "What?f", text: full }); }
    else{
      await navigator.clipboard.writeText(full);
      const b=$('#shareBtn'); b.textContent = I2.copied; setTimeout(()=>b.textContent=I2.share,1200);
    }
  }catch{}
};

/* ===== TTS ===== */
const TTS_MAP={ it:"it-IT", en:"en-US", es:"es-ES", fr:"fr-FR", de:"de-DE" };
function speak(text, langCode){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const target = TTS_MAP[langCode] || "en-US";
  const pickVoice=()=> {
    const vs = window.speechSynthesis.getVoices()||[];
    const v = vs.find(v=>v.lang === target) || vs.find(v=>v.lang.startsWith(target.split('-')[0])) || vs[0];
    if(v) utter.voice=v;
    utter.lang = v?.lang || target;
    utter.rate = 1.0; utter.pitch=1.0; utter.volume=1.0;
    window.speechSynthesis.speak(utter);
  };
  if(window.speechSynthesis.getVoices().length===0){
    // chrome needs async load
    window.speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); };
  } else pickVoice();
}
$('#ttsBtn').onclick=()=> speak(answerText, lang);

/* ===== Translate popover ===== */
const menu = $('#translateMenu');
$('#translateBtn').onclick=(e)=>{
  e.stopPropagation();
  menu.classList.toggle('open');
  menu.setAttribute('aria-hidden', menu.classList.contains('open') ? 'false' : 'true');
};
menu.addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  const targetLang = b.dataset.lang;
  if(!targetLang || targetLang===lang){ menu.classList.remove('open'); return; }
  fetchAnswer(targetLang); // rigenera nella lingua scelta
  menu.classList.remove('open');
});
document.addEventListener('click', (e)=>{
  if(!menu.contains(e.target) && e.target!==$('#translateBtn')) menu.classList.remove('open');
});

/* ===== Again ===== */
$('#againBtn').onclick=()=>{ location.href='fourth.html'; };

/* ===== PRO badge ===== */
(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' : 'Modalità test attiva';
  }
})();
</script>
</body>
</html>
