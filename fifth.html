<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01;
  --wtf1:#3A6B56; --wtf2:#5A8C75;
  --ink:#0A0E12; --line:rgba(255,255,255,.12);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(800px 600px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{background:rgba(20,28,34,.9);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.story{white-space:pre-wrap;line-height:1.65;font-size:18px;letter-spacing:.1px}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:33%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}
textarea{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);font-size:16px}
.small{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
.inputLike{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Episodio</h1>
  <p class="sub" id="subtitle">—</p>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="card">
    <div class="story" id="answer">⏳ Genero la storia…</div>
  </div>

  <div class="card" id="followCard" style="display:none">
    <h3 id="suggTitle">Per continuare domani</h3>
    <div id="suggList" class="story" style="font-size:16px"></div>
    <div class="sep"></div>
    <textarea id="customSugg" rows="3" placeholder="Aggiungi un tuo spunto…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <button class="btn ghost" id="shareBtn">🔗 Condividi / Copia</button>
      <button class="btn ghost" id="homeBtn2">🏠 Home</button>
    </div>
    <p class="small" id="saveInfo"></p>
  </div>

  <div class="card" id="replayCard" style="display:none">
    <h3 id="replayTitle">Ieri (rileggi)</h3>
    <div id="replayText" class="inputLike"></div>
  </div>
</main>

<script>
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
document.documentElement.lang=lang;
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
document.documentElement.setAttribute('data-theme', (prefs.stile||'aquivera')==='wtf' ? 'wtf' : 'whatif');
const domanda = LS.getItem('domanda') || (lang==='en'?"What if I moved back to L’Aquila?":"E se tornassi a vivere all’Aquila?");
const isReplay = new URLSearchParams(location.search).get('view')==='replay';

const T={
  it:{
    episode:"Episodio",
    sub:(q)=>`Domanda: “${q}”`,
    genErr:"Errore nel generare la storia.",
    suggTitle:"Per continuare domani",
    saved:"✅ Salvato per domani.",
    addPH:"Aggiungi un tuo spunto…",
    yesterday:"Ieri (rileggi)",
    copyOK:"Copiato!",
    shareTitle:"La mia storia What?f",
    shareText:(q,a)=>`Domanda: ${q}\n\n${a}`
  },
  en:{
    episode:"Episode",
    sub:(q)=>`Question: “${q}”`,
    genErr:"Error while generating the story.",
    suggTitle:"To continue tomorrow",
    saved:"✅ Saved for tomorrow.",
    addPH:"Add your cue…",
    yesterday:"Yesterday (replay)",
    copyOK:"Copied!",
    shareTitle:"My What?f story",
    shareText:(q,a)=>`Question: ${q}\n\n${a}`
  }
}[lang];

document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('title').textContent=T.episode;
document.getElementById('subtitle').textContent=T.sub(domanda);
document.getElementById('suggTitle').textContent=T.suggTitle;
document.getElementById('customSugg').placeholder=T.addPH;
document.getElementById('homeBtn2').onclick=()=>location.href='index.html';
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

/* Replay di ieri se c'è */
(function mountReplay(){
  const last=JSON.parse(LS.getItem('replay_story')||'null');
  if(last && last.answer){
    document.getElementById('replayText').textContent=last.answer;
    document.getElementById('replayCard').style.display='block';
  }
})();

/* Genera episodio o mostra replay */
(async ()=>{
  const ansEl=document.getElementById('answer');
  if(isReplay){
    const r=JSON.parse(LS.getItem('replay_story')||'null');
    ansEl.textContent = r?.answer || '—';
    buildSuggestions(r?.answer||'');
    return;
  }
  try{
    const req = JSON.parse(LS.getItem('whatif_request')||'null');
    const extra = req?.extra || "";
    const res = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ domanda, stile: (prefs.stile||'aquivera'), lang, extra })});
    const data = await res.json();
    if(!res.ok || !data.answer) throw new Error(data.detail||'bad_response');
    const answer=(data.answer||"").trim();
    ansEl.textContent=answer;

    // salva in cronologia e conta episodi
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    const ep = (prefs.episodes||0)+1;
    LS.setItem('whatif_prefs', JSON.stringify({...prefs, episodes: ep}));
    hist.unshift({ domanda, risposta: answer, stile: (prefs.stile||'aquivera'), lang, ts: Date.now() });
    LS.setItem('cronologia', JSON.stringify(hist.slice(0,50)));

    // suggerimenti coerenti via follow
    buildSuggestions(answer);
  }catch(e){
    ansEl.textContent=T.genErr;
    console.error(e);
  }
})();

/* Suggerimenti coerenti (da AI) + salvataggio per domani */
async function buildSuggestions(answerText){
  const card=document.getElementById('followCard');
  const list=document.getElementById('suggList');
  list.textContent = lang==='en' ? "⏳ Crafting two cues for tomorrow…" : "⏳ Creo due spunti per domani…";
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ domanda, lang, stile:(prefs.stile||'aquivera'), follow:true, answer: answerText })});
    const j=await r.json();
    const arr = Array.isArray(j.followups) ? j.followups.slice(0,2) : [];
    list.innerHTML = arr.length ? arr.map(q=>`• ${q}`).join('\n')
      : (lang==='en'
          ? "• A small step that changes tomorrow.\n• A sign that says you’re on track."
          : "• Un passo piccolo che cambia domani.\n• Un segnale che dice che sei sulla strada giusta.");
  }catch{
    list.innerHTML = (lang==='en'
      ? "• A small step that changes tomorrow.\n• A sign that says you’re on track."
      : "• Un passo piccolo che cambia domani.\n• Un segnale che dice che sei sulla strada giusta.");
  }
  card.style.display='block';
}

/* Salva per domani */
document.getElementById('saveBtn').onclick=()=>{
  const extra=(document.getElementById('customSugg').value||"").trim();
  const saved=JSON.parse(LS.getItem('next_prompts')||'[]');
  saved.unshift({ q: domanda, note: extra, stile:(prefs.stile||'aquivera'), lang, ts:Date.now() });
  LS.setItem('next_prompts', JSON.stringify(saved.slice(0,50)));
  document.getElementById('saveInfo').textContent=T.saved;
  setTimeout(()=>{document.getElementById('saveInfo').textContent=""},1400);
};

/* Condividi / Copia */
document.getElementById('shareBtn').onclick=async()=>{
  const q = domanda;
  const a = (document.getElementById('answer').textContent||"").trim();
  const text = T.shareText(q,a);
  if(navigator.share){
    try{ await navigator.share({title:T.shareTitle,text}); }catch{}
  }else{
    try{ await navigator.clipboard.writeText(text); alert(T.copyOK); }catch{}
  }
};
</script>
</body>
</html>
