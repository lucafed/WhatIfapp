<!-- FILE: fifth.html (rewarded + i18n overlay + fallback garantito) -->
<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.story{white-space:normal;line-height:1.68;font-size:18px;letter-spacing:.1px;text-wrap:pretty}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#eaf3ee;
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.lead{color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* Percentuali */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct,.result-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;min-width:64px;padding:5px 10px;border-radius:12px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px var(--glow)
}
.result-box{background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);border-radius:16px;padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28)}
.result-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .note{font-size:15px;line-height:1.6;color:var(--fg);opacity:.92}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;opacity:.9}
.chip{font-size:11px;font-weight:900;padding:3px 7px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}
@media (max-width:420px){.result-title{font-size:14px} .mot .note{font-size:15.5px;line-height:1.65}}

/* Overlay */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);
  backdrop-filter:blur(2px);z-index:9999}
#overlay-frame{width:100%;max-width:520px;height:78vh;border:1px solid var(--line);
  border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

/* Toast */
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  background:rgba(20,28,34,.96);border:1px solid var(--line);color:#fff;padding:10px 14px;
  border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:10000;display:none}
</style>
</head>

<script>
/* ==== State/Prefs ==== */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
const IS_ADMIN = !!LS.getItem('admin_token'); // ∞
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* ==== System prompts (UI only) ==== */
const SYSTEM_WTF = `SEI “WHAT THE F”. ...`;
const SYSTEM_WHIF = `SEI “WHAT IF”. ...`;

/* ==== Lang ==== */
const SUP_LANG = ['it','en','es','fr','de'];
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';
function detectLang(text=''){
  const t=(text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank={ it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
               en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
               es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
               fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
               de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]};
  const score={}; for(const L of SUP_LANG){ score[L]=0; bank[L]?.forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1; for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){ const nav=(navigator.language||'it').slice(0,2).toLowerCase(); if(SUP_LANG.includes(nav)) return nav; }
  return best;
}
const manualLang = LS.getItem('lang_manual') === '1';
let lang = manualLang ? (SUP_LANG.includes((LS.getItem('lang')||'').toLowerCase()) ? (LS.getItem('lang')||'it').toLowerCase() : 'it') : detectLang(domandaEarly);
if(!SUP_LANG.includes(lang)) lang='it';
document.documentElement.lang=lang;

/* ==== I18N ==== */
const I18N = {
  it:{ titleWTF:"⚡ What the F — Risultato", titleWHF:"💡 What if — Risultato",
       sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
       p:"Esito & motivazioni", share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
       copied:"Copiato!", error:"[errore server]",

        ? `Stile: What the F · 6–9 frasi · paragrafo unico · tono asciutto · modalità: ${p==='past'?'Passato':'Futuro'}.`

       motFallback:"Motivo: benefici concreti a breve, con vincoli gestibili.",
       credits:(n)=>`💰 Crediti: ${n}`, noCredits:"Hai terminato i crediti.",
       storeTitle:"Crediti", buy5:"+5 crediti (test)", watchAd:"Guarda pubblicità (+1)", close:"Chiudi",
       toastAdded:(n)=>`+${n} credito${n>1?'i':''} aggiunto${n>1?'i':''}` },

  en:{ titleWTF:"⚡ What the F — Result", titleWHF:"💡 What if — Result",
       sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
       p:"Outcome & rationales", share:"📤 Share / Copy", again:"🔁 Ask another",
       copied:"Copied!", error:"[server error]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · dry tone · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if (60% analysis, 40% real) · 8–11 sentences · single paragraph · mode: ${p==='past'?'Past':'Future'}.`,
       pctLabel:"% probability it happens",
       votersTitle:"Committee", seriousTitle:"Rationale", scientificTitle:"Rationale (scientifically grounded)",
       chipsFav:"in favour", chipsCon:"against", chipsAst:"abstained",
       motFallback:"Reason: short-term, concrete benefits with manageable constraints.",
       credits:(n)=>`💰 Credits: ${n}`, noCredits:"You ran out of credits.",
       storeTitle:"Credits", buy5:"+5 credits (test)", watchAd:"Watch ad (+1)", close:"Close",
       toastAdded:(n)=>`+${n} credit${n>1?'s':''} added` },

  es:{ titleWTF:"⚡ What the F — Resultado", titleWHF:"💡 What if — Resultado",
       sub:(q)=>`Pregunta: “${q}”`, q:"Tu pregunta", a:"Respuesta",
       p:"Resultado y motivos", share:"📤 Compartir / Copiar", again:"🔁 Hacer otra pregunta",
       copied:"¡Copiado!", error:"[error del servidor]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Estilo: What the F · 6–9 frases · un solo párrafo · tono seco · modo: ${p==='past'?'Pasado':'Futuro'}.`
        : `Estilo: What if (60% análisis, 40% realidad) · 8–11 frases · un solo párrafo · modo: ${p==='past'?'Pasado':'Futuro'}.`,
       pctLabel:"% probabilidad de que ocurra",
       votersTitle:"Comité", seriousTitle:"Motivación", scientificTitle:"Motivación (con base científica)",
       chipsFav:"a favor", chipsCon:"en contra", chipsAst:"abstenciones",
       motFallback:"Motivo: beneficios concretos a corto plazo con restricciones manejables.",
       credits:(n)=>`💰 Créditos: ${n}`, noCredits:"Te has quedado sin créditos.",
       storeTitle:"Créditos", buy5:"+5 créditos (test)", watchAd:"Ver anuncio (+1)", close:"Cerrar",
       toastAdded:(n)=>`+${n} crédito${n>1?'s':''} añadido${n>1?'s':''}` },

  fr:{ titleWTF:"⚡ What the F — Résultat", titleWHF:"💡 What if — Résultat",
       sub:(q)=>`Question : « ${q} »`, q:"Ta question", a:"Réponse",
       p:"Issue & motivations", share:"📤 Partager / Copier", again:"🔁 Poser une autre question",
       copied:"Copié !", error:"[erreur serveur]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style : What the F · 6–9 phrases · un seul paragraphe · ton sec · mode : ${p==='past'?'Passé':'Futur'}.`
        : `Style : What if (60 % analyse, 40 % réel) · 8–11 phrases · un seul paragraphe · mode : ${p==='past'?'Passé':'Futur'}.`,
       pctLabel:"% de probabilité que cela arrive",
       votersTitle:"Comité", seriousTitle:"Motivation", scientificTitle:"Motivation (fondée scientifiquement)",
       chipsFav:"pour", chipsCon:"contre", chipsAst:"abstentions",
       motFallback:"Raison : bénéfices concrets à court terme, contraintes gérables.",
       credits:(n)=>`💰 Crédits : ${n}`, noCredits:"Tu n’as plus de crédits.",
       storeTitle:"Crédits", buy5:"+5 crédits (test)", watchAd:"Regarder une pub (+1)", close:"Fermer",
       toastAdded:(n)=>`+${n} crédit${n>1?'s':''} ajouté${n>1?'s':''}` },

  de:{ titleWTF:"⚡ What the F — Ergebnis", titleWHF:"💡 What if — Ergebnis",
       sub:(q)=>`Frage: „${q}”`, q:"Deine Frage", a:"Antwort",
       p:"Ergebnis & Begründungen", share:"📤 Teilen / Kopieren", again:"🔁 Weitere Frage stellen",
       copied:"Kopiert!", error:"[Serverfehler]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Stil: What the F · 6–9 Sätze · ein Absatz · trockener Ton · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`
        : `Stil: What if (60 % Analyse, 40 % real) · 8–11 Sätze · ein Absatz · Modus: ${p==='past'?'Vergangenheit':'Zukunft'}.`,
       pctLabel:"% Wahrscheinlichkeit, dass es passiert",
       votersTitle:"Komitee", seriousTitle:"Begründung", scientificTitle:"Begründung (wissenschaftlich fundiert)",
       chipsFav:"dafür", chipsCon:"dagegen", chipsAst:"Enthaltungen",
       motFallback:"Grund: kurzfristige, konkrete Vorteile bei handhabbaren Einschränkungen.",
       credits:(n)=>`💰 Credits: ${n}`, noCredits:"Keine Credits mehr.",
       storeTitle:"Credits", buy5:"+5 Credits (Test)", watchAd:"Anzeige ansehen (+1)", close:"Schließen",
       toastAdded:(n)=>`+${n} Credit${n>1?'s':''} gutgeschrieben` }
};

/* Leads + motivazioni sintetiche (come prima, omesso qui per brevità) */
const LEADS = {
  it:{wtf:["Entri piano, il caos ti riconosce e oggi ti lascia passare."],
      whatif:["Metti giù le chiavi e lasci parlare il silenzio che non ti giudica."]},
  en:{wtf:["You step in slowly; chaos recognizes you and lets you through."],
      whatif:["Set the keys down and let the quiet that doesn’t judge go first."]},
  es:{wtf:["Entras despacio; el caos te deja pasar."], whatif:["Deja las llaves y deja hablar al silencio."]},
  fr:{wtf:["Tu entres doucement; le chaos te laisse passer."], whatif:["Pose les clés et laisse parler le silence."]},
  de:{wtf:["Du trittst leise ein; das Chaos lässt dich durch."], whatif:["Leg die Schlüssel hin und lass die Stille sprechen."]}
};
const SCI = {
  it:["Studio CEDSA: 312 soggetti...","Protocollo PignaLab: 98 partecipanti...","Istituto Svizzero..."],
  en:["CEDSA study: 312 subjects...","PineCone protocol: 98 participants...","Swiss Institute..."],
  es:["Estudio CEDSA...","Protocolo PineCone...","Instituto Suizo..."],
  fr:["Étude CEDSA...","Protocole PineCone...","Institut Suisse..."],
  de:["CEDSA-Studie...","PineCone-Protokoll...","Schweizer Institut..."]
};

/* ==== Refs ==== */
const qs = (sel)=>document.querySelector(sel);
const subtitle = qs('#subtitle');
const lblQ = qs('#lblQ');
const lblA = qs('#lblA');
const qView = qs('#qView');
const leadNode = qs('#lead');
const answerEl = qs('#answer');
const shareBtn = qs('#shareBtn');
const againBtn = qs('#againBtn');
const metaInfo = qs('#metaInfo');
const styleBadge = qs('#styleBadge');
const lblP = qs('#lblP');
const topPct = qs('#topPct');
const bottomPct = qs('#bottomPct');
const pctLabelTop = qs('#pctLabel');
const pctLabelBottom = qs('#pctLabelBottom');
const committeeTitle = qs('#committeeTitle');
const chipFav = qs('#chipFav');
const chipCon = qs('#chipCon');
const chipAst = qs('#chipAst');
const chipsWrap = qs('#chipsWrap');
const motNote = qs('#motNote');
const creditInfo = qs('#creditInfo');
const overlay = qs('#overlay');
const overlayFrame = qs('#overlay-frame');
const toast = qs('#toast');

/* ==== Wallet/Credits + legacy ==== */
const WKEY = "whatif_wallet";
function readWallet(){
  try{ const w=JSON.parse(localStorage.getItem(WKEY)||"{}")||{};
    return {available: Number.isFinite(+w.available)?+w.available:null,
            used: Number.isFinite(+w.used)?+w.used:null,
            limit: Number.isFinite(+w.limit)?+w.limit:null};
  }catch{return {available:null,used:null,limit:null}}
}
function writeWallet(w){
  const cur=readWallet();
  const out={ available: w.available!=null? Math.max(0,+w.available):(cur.available??0),
              used:      w.used!=null? Math.max(0,+w.used):(cur.used??0),
              limit:     w.limit!=null? Math.max(0,+w.limit):(cur.limit??0) };
  localStorage.setItem(WKEY, JSON.stringify(out));
  localStorage.setItem("whatif_wallet_sync", String(Date.now()));
  updateCreditInfo();
}
function legacyCap(){ return (prefs.pro===true)?10:3; }
function legacyGetLeft(){
  const w=readWallet(); if(w.available!=null) return w.available;
  try{
    const c=JSON.parse(LS.getItem('whatif_credits')||'{}');
    const today=new Date().toISOString().slice(0,10);
    const used=(c.date===today)?(+c.used||0):0;
    return Math.max(0, legacyCap()-used);
  }catch{}
  const raw=LS.getItem('crediti'); return raw==null? legacyCap(): Math.max(0, parseInt(raw,10)||0);
}
function legacyConsumeOne(){
  try{
    const w=readWallet();
    if(w.available!=null){
      if(w.available<=0) return false;
      writeWallet({available:w.available-1, used:Math.max(0,(w.used||0)+1), limit:(w.limit!=null?w.limit:legacyCap())});
      return true;
    }
  }catch{}
  try{
    const today=new Date().toISOString().slice(0,10);
    let c=JSON.parse(LS.getItem('whatif_credits')||'{}');
    if(c.date!==today) c={date:today,used:0};
    const cap=legacyCap(); if((c.used||0)>=cap) return false;
    c.used=(c.used||0)+1; LS.setItem('whatif_credits', JSON.stringify(c)); return true;
  }catch{}
  let n=parseInt(LS.getItem('crediti')||'0',10)||0; if(n<=0) return false;
  LS.setItem('crediti', String(Math.max(0,n-1))); return true;
}
function getAvailable(){ if(IS_ADMIN) return Infinity; const w=readWallet(); return w.available!=null?w.available:legacyGetLeft(); }
function consumeOne(){
  if(IS_ADMIN) return true;
  const w=readWallet();
  if(w.available!=null){
    if(w.available<=0) return false;
    writeWallet({available:w.available-1, used:Math.max(0,(w.used||0)+1), limit:(w.limit!=null?w.limit:legacyCap())});
    return true;
  }
  return legacyConsumeOne();
}
function addCredits(n){
  n=Math.max(0, parseInt(n,10)||0); if(n<=0) return;
  const w=readWallet();
  if(w.available==null){
    const left=legacyGetLeft();
    writeWallet({available:left+n, used:0, limit:legacyCap()});
  }else{
    writeWallet({available:(w.available+n), used:Math.max(0,(w.used||0)-n), limit:(w.limit!=null?w.limit:legacyCap())});
  }
}
function updateCreditInfo(n=getAvailable()){
  const T=I18N[lang]||I18N.it;
  if(creditInfo) creditInfo.textContent = T.credits(n===Infinity?'∞':n);
}
function showToast(text){
  toast.textContent=text; toast.style.display='block';
  setTimeout(()=> toast.style.display='none', 1600);
}

/* ==== UI helpers ==== */
function setText(id, txt){ const el=qs(id); if(el) el.textContent = txt; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }
function normalizeOneParagraph(s=""){ return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim(); }

/* ==== Overlay (store/rewarded) ==== */
function t(){ return I18N[lang]||I18N.it; }
function storeFallbackHTML(){
  const T=t();
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0B0F14;color:#EAF3EE}
.wrap{max-width:520px;margin:auto;padding:16px}
.card{background:#141C22;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin-top:10px}
h2{margin:4px 0 6px;font-size:18px}
.btn{display:inline-block;margin:6px 6px 0 0;padding:10px 12px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
.primary{background:linear-gradient(180deg,#1C57A0,#FFEC01);color:#0A0E12}
.ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12)}
.small{color:#A0B2BA;font-size:12px}</style></head><body>
<div class="wrap"><div class="card">
<h2>${T.storeTitle}</h2>
<p class="small">${T.noCredits}</p>
<button class="btn primary" onclick="parent.postMessage({type:'purchase_completed', amount:5}, '*')">${T.buy5}</button>
<button class="btn ghost"   onclick="parent.postMessage({type:'open_rewarded'}, '*')">${T.watchAd}</button>
<button class="btn ghost"   onclick="parent.postMessage({type:'close_overlay'}, '*')">${T.close}</button>
</div></div></body></html>`;
}
let rewardTimer=null, rewardGranted=false;
function openOverlay(url){
  overlay.style.display='grid'; overlay.setAttribute('aria-hidden','false');
  overlayFrame.removeAttribute('srcdoc');
  // passa lingua in query
  const sep = url.includes('?') ? '&' : '?';
  overlayFrame.src = `${url}${sep}lang=${encodeURIComponent(lang)}`;
  overlayFrame.setAttribute('srcdoc', storeFallbackHTML());
  // prova a comunicare la lingua
  setTimeout(()=>{ try{ overlayFrame.contentWindow?.postMessage({type:'set_lang', lang}, '*'); }catch{} }, 200);
}
function openStore(){ openOverlay("/store/credit-store.html"); }
function openRewarded(){
  rewardGranted=false;
  openOverlay("/ads/rewarded.html");
  // Fallback: accredita +1 se l'ad non manda eventi entro 28s
  clearTimeout(rewardTimer);
  rewardTimer = setTimeout(()=>{
    if(!rewardGranted){
      addCredits(1); updateCreditInfo(); showToast(t().toastAdded(1));
      rewardGranted=true; closeOverlay();
    }
  }, 28000);
}
function closeOverlay(){
  overlay.style.display='none'; overlay.setAttribute('aria-hidden','true');
  overlayFrame.src='about:blank'; overlayFrame.removeAttribute('srcdoc');
  clearTimeout(rewardTimer);
}
/* Chiudi overlay con Esc o click sfondo */
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeOverlay(); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape' && overlay.style.display==='grid') closeOverlay(); });

/* ==== UI texts ==== */
function setTitlesAndTexts(q){
  const T=t();
  setText('#title', style==='wtf' ? T.titleWTF : T.titleWHF);
  subtitle.textContent = T.sub(q || '—');
  lblQ.textContent = T.q; lblA.textContent = T.a; lblP.textContent = T.p;
  shareBtn.textContent = T.share; againBtn.textContent = T.again;
  styleBadge.textContent = (style==='wtf') ? T.styleWTF : T.styleWHF;
  metaInfo.textContent = T.meta(style, periodo);
  qs('#pctLabel').textContent = T.pctLabel; qs('#pctLabelBottom').textContent = T.pctLabel;
  const bank = (LEADS[lang] && LEADS[lang][style] && LEADS[lang][style].length) ? LEADS[lang][style] : LEADS.it.whatif;
  leadNode.textContent = oneSentence(pick(bank)||'') || '—';
  chipFav.textContent = `${T.chipsFav} 0`; chipCon.textContent = `${T.chipsCon} 0`; chipAst.textContent = `${T.chipsAst} 0`;
}

/* ==== Probabilità/minimotivi ==== */
function computeProbability(q){
  const t=(q||'').toLowerCase(); let score=50;
  if(/\b(7|14|21|30|60|90)\b/.test(t)) score+=12;
  if(/\b\d+([.,]\d+)?\b/.test(t)) score+=8;
  if(/budget|€|euro|spesa|max|sotto/.test(t)) score+=6;
  if(/senza|solo|al massimo|minimo|entro|prima delle|ogni|per/.test(t)) score+=8;
  if(/lancia|apri|impara|scrivi|chiedi|corri|studia|automatizza|testa/.test(t)) score+=6;
  if(/forse|magari|vedere/.test(t)) score-=8;
  if(!/\b\d/.test(t)) score-=6;
  score += (style==='wtf' ? -4 : +2);
  return { pct: Math.max(25, Math.min(92, Math.round(score))) };
}
function shortMotivationFromAnswer(answerText){
  const T=t();
  const a=String(answerText||'').replace(/\s*\n+\s*/g,' ').trim();
  const parts=a.split(/(?<=[.!?…])\s+/).filter(Boolean);
  let s=parts.find(x=>/perché|quindi|dunque|se\b|quando\b|equilibrio|rischio|beneficio|because|therefore|hence|risk|benefit|equilibrium|riesgo|beneficio|parce que|donc|weil|deshalb/i.test(x)) || parts[0] || '';
  s=s.replace(/\s{2,}/g,' ').trim();
  if(!/[.!?…]$/.test(s)) s+='.';
  if(s.length<24) s = T.motFallback;
  return s;
}
function pickScientificMotivation(){
  const list = (SCI[lang] && SCI[lang].length) ? SCI[lang] : SCI.it;
  return pick(list);
}
function renderCommitteeLike(surprise){
  const T=t();
  if(surprise){
    chipsWrap.style.display='flex';
    committeeTitle.textContent = `${T.votersTitle}`;
    const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    chipFav.textContent = `${T.chipsFav} ${r(120,1200)}`;
    chipCon.textContent = `${T.chipsCon} ${r(0,900)}`;
    chipAst.textContent = `${T.chipsAst} ${r(0,400)}`;
    motNote.textContent = (lang==='en')?`Brief tussle at vote: ${r(1,5)} removed; ${r(0,3)} bruised.`:`Breve parapiglia al voto: ${r(1,5)} allontanati; ${r(0,3)} contusi.`;
  }else{
    committeeTitle.textContent = (style==='wtf') ? (T.scientificTitle) : (T.seriousTitle);
    chipsWrap.style.display='none';
  }
}

/* ==== Run ==== */
(async ()=>{
  const sel = document.getElementById('langSelect'); if(sel) sel.value = lang;
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const surprise = (new URLSearchParams(location.search)).get('src')==='surprise'
                   || req?.surprise === true || req?.micro?.surprise === true
                   || LS.getItem('surprise_mode')==='1';

  const domanda = req.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda); updateCreditInfo(); qView.textContent = domanda || '—';

  // Gating crediti prima della chiamata
  if(!IS_ADMIN){
    const left = getAvailable();
    if(!(left===Infinity) && left<=0){ openStore(); answerEl.textContent = t().noCredits; return; }
    if(!consumeOne()){ openStore(); answerEl.textContent = t().noCredits; return; }
    updateCreditInfo(); // aggiorna subito dopo consumo
  }

  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token"); if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetch("/api/ask",{ method:"POST", headers,
      body:JSON.stringify({ domanda, lang, stile: style, periodo, system: (style==='wtf'?SYSTEM_WTF:SYSTEM_WHIF), extra:"", micro:req.micro||{} }) });
    const data = await r.json().catch(()=>null);
    if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

    let answerText = normalizeOneParagraph((data.answer||"").trim());
    const maxSent = (style==='wtf') ? 9 : 11;
    let parts = answerText.split(/(?<=[.!?…])\s+/); if(parts.length > maxSent) parts = parts.slice(0, maxSent);
    answerText = parts.join(" ").trim(); if(!/[.!?…]$/.test(answerText)) answerText+='.';
    answerEl.textContent = answerText;

    const { pct } = computeProbability(domanda);
    const pctStr = pct + "%"; topPct.textContent = pctStr; bottomPct.textContent = pctStr;

    if (surprise){ renderCommitteeLike(true); }
    else { renderCommitteeLike(false); motNote.textContent = (style==='wtf') ? pickScientificMotivation() : shortMotivationFromAnswer(answerText, domanda); }

    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now(), surprise, pct, motivazione: (style==='wtf')? undefined : motNote.textContent });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

  }catch(e){ answerEl.textContent = t().error; console.error(e); }
})();

/* ==== Messaggi store/rewarded ==== */
window.addEventListener("message",(ev)=>{
  const d = ev.data || {};
  const amt = Number.isFinite(parseInt(d.amount,10)) ? parseInt(d.amount,10) : null;

  // acquisto
  if(d.type === "purchase_completed"){
    addCredits(amt ?? 0); updateCreditInfo(); showToast(t().toastAdded(amt ?? 0)); closeOverlay(); return;
  }
  // apri rewarded dentro fallback
  if(d.type === "open_rewarded"){ openRewarded(); return; }

  // completamenti rewarded (tutte le varianti note)
  if(["rewarded_completed","rewarded_done","reward_complete","rewarded","ad_finished"].includes(d.type)){
    if(!rewardGranted){
      addCredits(amt ?? 1); updateCreditInfo(); showToast(t().toastAdded(amt ?? 1));
      rewardGranted=true; closeOverlay();
    }
    return;
  }

  if(d.type === "close_overlay"){ closeOverlay(); return; }
});

window.addEventListener('storage',(e)=>{
  if(e.key==="whatif_wallet_sync" || e.key==="whatif_credits"){ updateCreditInfo(); }
});

  try{

    else{ await navigator.clipboard.writeText(full); const b=qs('#shareBtn'); b.textContent=T.copied; setTimeout(()=>b.textContent=T.share,1200); }
  }catch{}
};
