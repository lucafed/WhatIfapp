<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Result</title>

<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414;
    --fg:#FFFFFF; --muted:#A0B2BA;
    --acc:#1C57A0; --acc2:#FFEC01;
    --card:rgba(20,28,34,0.92);
    --line:rgba(255,255,255,.12);
    --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
    --highlight:#FFEC01;
  }
  html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }

  *{box-sizing:border-box}
  html,body{margin:0;background: radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer;transition:transform .06s ease,opacity .2s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);font-weight:800;box-shadow:0 6px 18px var(--shadow);border:none}
  .btn.large{padding:14px 18px;font-size:16px}
  h1{font-size:clamp(22px,5vw,30px);margin:14px 0 2px;color:var(--acc2)}
  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px var(--shadow)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .qbox{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:4px solid var(--highlight);border-radius:12px;padding:16px;font-size:17px;line-height:1.65;color:#EAF3EE;max-width:68ch;margin:0 auto;}
  .box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7;color:#EAF3EE;white-space:pre-wrap;font-size:17px;letter-spacing:.1px;max-width:68ch;margin:0 auto;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
  .follow{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .follow button{border:1px solid var(--line);background:var(--chip);color:#eaf3ee;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
  .follow button:hover{background:rgba(255,255,255,.06)}
  .follow .or{opacity:.7;text-align:center;margin:2px 0}
  .follow .row{gap:8px}
  .follow input{flex:1;background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:10px;padding:10px}
  .mini{color:#A0B2BA;font-size:12px}
</style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="row">
        <button class="btn" id="backBtnTop">←</button>
        <button class="btn" id="homeBtnTop">🏠</button>
      </div>
      <div class="row" style="gap:10px">
        <span id="badgePeriodo" class="badge">🕰️ —</span>
        <span id="badgeStile" class="badge">🎭 —</span>
      </div>
    </div>

    <h1 id="titleH1">Il tuo What?f</h1>

    <div class="card">
      <h3 class="label" id="qLabel">La tua domanda</h3>
      <div id="question" class="qbox">—</div>
    </div>

    <div class="card">
      <h3 class="label" id="rLabel">Risultato</h3>
      <div id="result" class="box">⏳ Sto immaginando il tuo scenario…</div>
      <p id="closing" class="mini" style="max-width:68ch;margin:8px auto 0">—</p>
    </div>

    <div class="card" id="followCard" style="display:none">
      <h3 class="label" id="fLabel">Domani continuiamo da qui</h3>
      <div class="follow" id="followWrap">
        <!-- qui entrano i 2 follow della IA -->
        <button id="f1" style="display:none"></button>
        <button id="f2" style="display:none"></button>
        <div class="or">oppure</div>
        <div class="row">
          <input id="fFree" type="text" placeholder="Scrivi tu cosa vuoi sapere domani…" />
          <button class="btn primary" id="fSend">Avanti</button>
        </div>
        <p class="mini" id="fHint">Scegli un suggerimento o scrivi tu: lo useremo come episodio successivo.</p>
      </div>
    </div>
  </main>

<script>
/* ===== Helpers / I18N ===== */
const LS = localStorage;
const $  = (id)=>document.getElementById(id);
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
const domanda = LS.getItem('domanda') || '';
const lang = (LS.getItem('lang')||'it').toLowerCase();
document.documentElement.lang = lang;

/* Tema per stile */
(function applyTheme(){
  const theme = (prefs.stile==='wtf')?'wtf':'whatif';
  document.documentElement.setAttribute('data-theme', theme);
})();

/* UI init */
$('backBtnTop').addEventListener('click', ()=> history.back());
$('homeBtnTop').addEventListener('click', ()=> location.href='index.html');
$('qLabel').textContent = lang==='en' ? 'Your question' : 'La tua domanda';
$('rLabel').textContent = lang==='en' ? 'Result' : 'Risultato';
$('fLabel').textContent = lang==='en' ? 'Tomorrow we continue from here' : 'Domani continuiamo da qui';
$('question').textContent = domanda || (lang==='en'?'(no question)':'(nessuna domanda)');

$('badgePeriodo').textContent = '🕰️ ' + (prefs.periodo==='past' ? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
$('badgeStile').textContent   = '🎭 ' + (prefs.stile==='wtf' ? 'What the F' : 'What if');

/* ===== Call API (non-stream, così otteniamo follow-up in JSON) ===== */
async function callAsk({ q, stile, periodo, profile }){
  const payload = {
    domanda: q,
    lang,
    periodo: periodo || 'future',
    stile: stile || 'whatif',
    clarify: false,
    stream: false,
    profilo: profile || buildLeanProfile(),
    clarifications: readClarificationsToday(),
    extra: ''
  };
  const r = await fetch('/api/ask',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('server');
  return r.json();
}

/* Solo ciò che serve per “nome/ruolo/città” */
function buildLeanProfile(){
  try{
    const p = JSON.parse(LS.getItem('whatif_profile')||'{}');
    const lean = {};
    if (p.name) lean.name = String(p.name);
    if (p.city_now) lean.city_now = String(p.city_now);
    else if (p.city) lean.city = String(p.city);
    if (p.work_role) lean.work_role = String(p.work_role);
    else if (p.role) lean.role = String(p.role);
    return lean;
  }catch{ return {}; }
}

/* Clarifications usati oggi (per contesto morbido) */
function readClarificationsToday(){
  try{
    const mem = JSON.parse(LS.getItem('whatif_memory')||'[]');
    // prendiamo l’ultima interazione della stessa domanda
    const item = mem.find(m => (m?.q||'') === (domanda||''));
    return item?.clar || {};
  }catch{ return {}; }
}

/* Render risposta + follow-ups */
function renderAnswer({answer, followups, closing}){
  $('result').textContent = (answer||'').trim() || (lang==='en'?'(empty)':'(vuoto)');
  $('closing').textContent = (closing||'').trim();

  const f1 = $('f1'), f2 = $('f2');
  if (Array.isArray(followups) && followups.length){
    $('followCard').style.display = 'block';
    f1.style.display = 'none';
    f2.style.display = 'none';
    if (followups[0]){ f1.textContent = followups[0]; f1.style.display='block'; }
    if (followups[1]){ f2.textContent = followups[1]; f2.style.display='block'; }
  } else {
    $('followCard').style.display = 'block';
  }
}

/* Salva la scelta follow-up per episodio successivo */
function saveNextFollow(text){
  const key = 'whatif_next_followup';
  const arr = JSON.parse(LS.getItem(key) || '[]');
  arr.unshift({ q: domanda, follow: text, ts: Date.now() });
  LS.setItem(key, JSON.stringify(arr.slice(0,50)));

  // aggiorniamo memory (per coerenza badge)
  const mem = JSON.parse(LS.getItem('whatif_memory')||'[]');
  mem.unshift({ q: domanda, clar: { next_followup: text }, ans: ($('result').textContent||'').slice(0,400), ts: Date.now() });
  LS.setItem('whatif_memory', JSON.stringify(mem.slice(0,200)));
}

/* Click handlers */
$('f1').addEventListener('click', ()=>{ const t=$('f1').textContent.trim(); if(t){ saveNextFollow(t); okNext(); } });
$('f2').addEventListener('click', ()=>{ const t=$('f2').textContent.trim(); if(t){ saveNextFollow(t); okNext(); } });
$('fSend').addEventListener('click', ()=>{
  const v = ($('fFree').value||'').trim();
  if(!v){ alert(lang==='en'?'Write something or choose a suggestion':'Scrivi qualcosa o scegli un suggerimento'); return; }
  saveNextFollow(v); okNext();
});

function okNext(){
  alert(lang==='en'?'Saved for the next episode ✅':'Salvato per il prossimo episodio ✅');
  // resta in pagina: domani quinta userà questo follow
}

/* Boot */
(async function boot(){
  try{
    const j = await callAsk({ q: domanda, stile: (prefs.stile||'whatif'), periodo: (prefs.periodo||'future') });
    renderAnswer(j);
  }catch(e){
    console.error(e);
    $('result').textContent = (lang==='en'?'Server error':'Errore server');
    $('followCard').style.display='none';
  }
})();
</script>
</body>
</html>
