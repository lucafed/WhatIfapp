<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aquivera — Episodio</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;background:var(--chip);border:1px solid var(--line);color:#fff}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink); font-weight:800}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.answer{white-space:pre-wrap;line-height:1.6}
.meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Episodio</h1>
  <div class="card">
    <div class="label" id="lblQ">Domanda</div>
    <div class="input" style="min-height:54px" id="qView"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div class="answer" id="answerBox">…</div>
    <div class="meta" id="metaInfo"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="copyBtn">📋 Copia testo</button>
      <button class="btn" id="shareBtn">🔗 Condividi</button>
    </div>
  </div>

  <div class="card" id="contBox">
    <div class="label" id="lblSug">Per continuare domani</div>
    <div id="sugList" class="answer" style="font-size:16px"></div>
    <div class="row" style="margin-top:10px">
      <textarea id="customNext" rows="2" placeholder="Aggiungi un tuo spunto…"></textarea>
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
    </div>
    <div class="meta" id="saveInfo"></div>
  </div>
</main>

<script>
const LS=localStorage;
const $=id=>document.getElementById(id);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T = (lang==='en') ? {
  title:"Episode", q:"Question", a:"Answer", cont:"To continue tomorrow",
  metaLive:"(generated now)", metaReplay:"(saved answer)",
  copy:"📋 Copy text", share:"🔗 Share", saved:"✅ Saved for tomorrow.",
  hint:"Add your own nudge…", copied:"Copied!", notSupported:"Sharing not supported here."
} : {
  title:"Episodio", q:"Domanda", a:"Risposta", cont:"Per continuare domani",
  metaLive:"(generata ora)", metaReplay:"(risposta salvata)",
  copy:"📋 Copia testo", share:"🔗 Condividi", saved:"✅ Salvato per domani.",
  hint:"Aggiungi un tuo spunto…", copied:"Copiato!", notSupported:"Condivisione non supportata qui."
};
$('title').textContent=T.title; $('lblQ').textContent=T.q; $('lblA').textContent=T.a; $('lblSug').textContent=T.cont;
$('copyBtn').textContent=T.copy; $('shareBtn').textContent=T.share;
$('backBtn').onclick=()=>history.back(); $('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').textContent=lang.toUpperCase(); $('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

const request = readJSON('whatif_request',null);
const domanda = (new URLSearchParams(location.search).get('view')==='replay')
  ? (readJSON('replay_story',{}).domanda||LS.getItem('domanda')||'')
  : (request?.domanda || LS.getItem('domanda') || '');
let prefs = readJSON('whatif_prefs',{stile:'aquivera',pro:false});
let style = prefs.stile || 'aquivera';
document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');
$('qView').textContent = domanda || '—';

const isReplay = new URLSearchParams(location.search).get('view')==='replay';
if(isReplay){
  const r=readJSON('replay_story',null);
  $('answerBox').textContent=r?.answer||'—';
  $('metaInfo').textContent=T.metaReplay;
  $('contBox').style.display='none';
}else{
  generateEpisode();
}

/* Thread & demo Divina al 3º step */
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
async function generateEpisode(){
  const id = LS.getItem('thread_id') || domanda.toLowerCase().slice(0,80);
  const threads = readJSON('threads',{});
  threads[id] = threads[id] || { base:domanda, steps:1, stile:style, divinaDemo:false };
  let useStyle = threads[id].stile || style;

  if(threads[id].steps>=3 && !threads[id].divinaDemo && !prefs.pro){
    useStyle = 'aquivera_divina'; // demo automatica
    threads[id].divinaDemo = true;
    writeJSON('threads', threads);
  }

  // micro extra di oggi
  const micro = readJSON('micro_'+todayStr(),{});
  const extra = [micro.mood?`mood:${micro.mood}`:"", micro.energy?`energy:${micro.energy}`:"", micro.city?`city:${micro.city}`:"", micro.focus?`focus:${micro.focus}`:""].filter(Boolean).join(", ");

  try{
    const r = await fetch('/api/ask',{ method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ domanda, lang, stile:useStyle, extra }) });
    const j = await r.json(); if(!r.ok) throw new Error(j.detail||'server');
    const answer = (j.answer||"").trim();
    $('answerBox').textContent = answer;
    $('metaInfo').textContent = T.metaLive;

    // salva cronologia
    const hist = readJSON('cronologia',[]);
    hist.unshift({ domanda, risposta:answer, stile:useStyle, lang, ts:Date.now() });
    writeJSON('cronologia', hist.slice(0,50));

    // genera suggerimenti coerenti (non domande)
    await buildSuggestions(answer, useStyle);

  }catch(e){
    $('answerBox').textContent='[server error]';
    console.error(e);
  }
}

/* Suggerimenti coerenti */
async function buildSuggestions(answerText, useStyle){
  const list=$('sugList'); list.textContent = (lang==='en'?"Building suggestions…":"Creo suggerimenti…");
  try{
    const r = await fetch('/api/ask',{ method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ suggestions:true, domanda, answer:answerText, stile:useStyle, lang })});
    const j = await r.json();
    const arr = Array.isArray(j.suggestions)? j.suggestions.slice(0,3) : [];
    list.innerHTML = arr.map(s=>`• ${s}`).join("\n");
  }catch(e){
    list.innerHTML = (lang==='en'
      ? "• Note one concrete sign for tomorrow.\n• Pick a tiny step.\n• Choose a place that sets your rhythm."
      : "• Annota un segnale concreto per domani.\n• Scegli un passo minuscolo.\n• Indica un luogo che imposti il ritmo.");
  }
}

/* Salva per domani (niente continuazione oggi) */
$('saveBtn').onclick=()=>{
  const custom = ($('customNext').value||"").trim();
  const arr = readJSON('next_prompts',[]);
  const id = LS.getItem('thread_id') || domanda.toLowerCase().slice(0,80);
  const threads = readJSON('threads',{}); const th = threads[id]||{base:domanda,steps:1,stile:prefs.stile};
  const next = { q: custom||domanda, stile:th.stile, base:th.base, steps:th.steps, threadId:id, ts:Date.now() };
  arr.unshift(next); writeJSON('next_prompts', arr.slice(0,50));
  threads[id] = { ...th, steps:(th.steps||1)+1 }; writeJSON('threads',threads);
  $('saveInfo').textContent = T.saved; $('customNext').value="";
};

/* Copy & Share */
$('copyBtn').onclick=async()=>{
  const who = (prefs.stile==='wtf' ? 'What the F' : (prefs.stile==='aquivera_divina' ? 'Aquivera Divina' : 'Aquivera'));
  const txt = `[${who}] Q: ${$('qView').textContent}\n\n${$('answerBox').textContent}`;
  try{ await navigator.clipboard.writeText(txt); $('copyBtn').textContent=T.copied; setTimeout(()=> $('copyBtn').textContent=T.copy,1200); }catch{}
};
$('shareBtn').onclick=async()=>{
  const who = (prefs.stile==='wtf' ? 'What the F' : (prefs.stile==='aquivera_divina' ? 'Aquivera Divina' : 'Aquivera'));
  const title = `Aquivera — Episodio (${who})`;
  const text = `${$('qView').textContent}\n\n${$('answerBox').textContent}`;
  if(navigator.share){ try{ await navigator.share({title,text}); }catch{} }
  else { toast(T.notSupported); }
};
</script>
</body>
</html>
