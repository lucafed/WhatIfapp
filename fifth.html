<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{ font-size:clamp(22px,5vw,30px); color:var(--acc2); text-align:center; margin:12px 0 6px; text-shadow: 0 0 18px var(--glow); }
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{ background:rgba(20,28,34,.92); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:18px; backdrop-filter:blur(10px); margin-top:16px; box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06); }
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px; }
.story{ white-space:normal; line-height:1.68; font-size:18px; letter-spacing:.1px; text-wrap:pretty; }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{ background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow); }
.btn.ghost{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#fff }
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{ display:inline-flex;align-items:center;gap:8px; font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px; }
.lead{ color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px; }
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit { padding:0 .08em; box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset; text-shadow:0 0 12px rgba(255,255,255,.08); border-radius:4px; }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <button class="btn ghost" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif_lucido';
const periodo = prefs.periodo || 'future';
const lang  = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = (lang === 'en') ? '🧪 TEST · ⭐ PRO' : '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' : 'Modalità test attiva';
  }
})();

const I18N={
  it:{tWTF:"⚡ What the F — Risultato", tWHF:(s)=>`💡 What if — ${s}`,
      sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
      share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
      copied:"Copiato!", error:"[errore server]",
      style:(s)=>`🎭 ${s}`,
      meta:(st,p)=> (st==='wtf'
        ? `Stile: What the F (demenziale++) · 7–9 frasi · paragrafo unico · roasts confidenziali · esplosione comica a metà · modalità: ${p==='past'?'Passato (controfattuale)':'Futuro (prospettico)'}.`
        : `Stile: ${st.replace('whatif_','What if · ')} · 8–11 frasi · paragrafo unico · chiusura riflessiva breve · modalità: ${p==='past'?'Passato (controfattuale)':'Futuro (prospettico)'}.`)},
  en:{tWTF:"⚡ What the F — Result", tWHF:(s)=>`💡 What if — ${s}`,
      sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
      share:"📤 Share / Copy", again:"🔁 Ask another",
      copied:"Copied!", error:"[server error]",
      style:(s)=>`🎭 ${s}`,
      meta:(st,p)=> (st==='wtf'
        ? `Style: What the F (goofy++) · 7–9 sentences · single paragraph · confidential roasts · mid-scene comic outburst · mode: ${p==='past'?'Past (counterfactual)':'Future (prospective)'}.`
        : `Style: ${s} · 8–11 sentences · single paragraph · short reflective close · mode: ${p==='past'?'Past (counterfactual)':'Future (prospective)'}.`)}
}[lang];

const styleMapIt = {
  'whatif_lucido': 'What if · Lucido',
  'whatif_pratico': 'What if · Pratico',
  'whatif_poetico': 'What if · Poetico',
  'wtf': 'What the F (demenziale++)'
};
const styleMapEn = {
  'whatif_lucido': 'What if · Lucid',
  'whatif_pratico': 'What if · Practical',
  'whatif_poetico': 'What if · Poetic',
  'wtf': 'What the F (goofy++)'
};
const styleLabel = (lang==='en'? styleMapEn[style] : styleMapIt[style]) || 'What if';

document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
document.getElementById('lblQ').textContent=I18N.q;
document.getElementById('lblA').textContent=I18N.a;
document.getElementById('shareBtn').textContent=I18N.share;
document.getElementById('againBtn').textContent=I18N.again;
document.getElementById('styleBadge').textContent = I18N.style(styleLabel);
document.getElementById('title').textContent = (style==='wtf') ? I18N.tWTF : I18N.tWHF(styleLabel);

function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
}

/* LEADS */
const LEADS = {
  it:{
    wtf:[
      "Ehi, oggi non scherzi: entri con il fiato da spritz e il futuro ti fa spazio al bancone.",
      "Oh, guarda chi torna: porti la faccia da decisioni e l’odore di moka nervosa.",
      "Calma e coraggio, in pari: i lampioni fanno la ola, tu ordini un presente lungo."
    ],
    whatif:[
      "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
      "La stanza è la stessa, lo sguardo no: già questo basta.",
      "Respiri come chi ha tempo, e il tempo ti crede."
    ]
  },
  en:{
    wtf:[
      "Hey, not kidding today: you bring spritz-breath and the future opens a stool.",
      "Look who’s back: decision-face with a nervous moka in the background.",
      "Calm and courage in a tie: the streetlights wave while you order a long present."
    ],
    whatif:[
      "Set the keys down and let the quiet that doesn’t judge go first.",
      "Same room, different gaze — that’s already a start.",
      "Breathe like someone with time, and time believes you."
    ]
  }
};
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function hashStr(s=""){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; } return Math.abs(h); }
function stablePick(arr, seedStr){ if(!arr?.length) return ""; if(!seedStr?.trim()) return pick(arr); const h=hashStr(seedStr); return arr[h%arr.length]; }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }

const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';
let domanda=""; let answerText="";

function setTitles(q){
  const label = (style==='wtf') ? 'What the F' : styleLabel;
  document.getElementById('subtitle').textContent = I18N.sub(q);
  document.getElementById('styleBadge').textContent = I18N.style(label);
  const bank = (style==='wtf' ? LEADS[lang].wtf : LEADS[lang].whatif);
  const seed = `${(q||"").toLowerCase().trim()}|${style}|${lang}|${periodo}`;
  const line = oneSentence(stablePick(bank, seed));
  document.getElementById('lead').textContent = line;
  document.getElementById('metaInfo').textContent = I18N.meta(style, periodo);
}

// evidenzia parentesi tra em-dash “— … — …”
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

function mapGenderToSex(g){
  switch(String(g||'').toLowerCase()){
    case 'uomo': return 'm';
    case 'donna': return 'f';
    case 'altro': return 'nb';
    default: return '';
  }
}

if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  answerText = normalizeOneParagraph(r.answer || "");
  setTitles(domanda);
  document.getElementById('qView').textContent = domanda || '—';
  const node = document.getElementById('answer');
  node.textContent = answerText || '—';
  decorateEmBits(node);
} else {
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  setTitles(domanda);
  document.getElementById('qView').textContent = domanda || '—';

  const profile = JSON.parse(LS.getItem('whatif_profile') || '{}');
  const sex = (profile.sex) ? String(profile.sex).toLowerCase()
            : mapGenderToSex(profile.gender || '');

  (async ()=>{
    navigator.sendBeacon?.("/api/track") || fetch("/api/track",{method:"POST",keepalive:true}).catch(()=>{});
    try{
      const headers = { "Content-Type": "application/json" };
      if (prefs.pro === true) headers["x-pro"] = "1";
      const adminToken = localStorage.getItem("admin_token");
      if (adminToken) headers["x-admin-token"] = adminToken;

      const r = await fetch("/api/ask",{
        method:"POST", headers,
        body:JSON.stringify({ domanda, lang, stile:style, extra:"", micro:req.micro||{}, periodo, sex })
      });

      if(r.status===429){
        document.getElementById('answer').textContent =
          lang==='en'?"Too many requests. Try again later.":"Troppo traffico, riprova più tardi.";
        return;
      }
      if(r.status===402){
        const d=await r.json().catch(()=>({}));
        document.getElementById('answer').textContent =
          lang==='en'?`You used today's free credits (${d?.used||"?"}/${d?.dailyCap||3}).`
                     :`Hai usato i crediti gratuiti di oggi (${d?.used||"?"}/${d?.dailyCap||3}).`;
        return;
      }

      const data = await r.json();
      if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
      answerText = normalizeOneParagraph((data.answer||"").trim());
      if(!/[.!?…]$/.test(answerText)) answerText += ".";
      const node = document.getElementById('answer');
      node.textContent = answerText;
      decorateEmBits(node);

      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now() });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
    }catch(e){
      document.getElementById('answer').textContent = I18N.error;
    }
  })();
}

// Share / Copy
document.getElementById('shareBtn').onclick = async ()=>{
  const q = document.getElementById('qView').textContent.trim();
  const a = document.getElementById('answer').textContent.trim();
  const text = `${q}\n\n${a}\n\n— What?f`;
  try{
    if (navigator.share){
      await navigator.share({ title:"What?f", text });
    } else if (navigator.clipboard){
      await navigator.clipboard.writeText(text);
      const b=document.getElementById('shareBtn'); const old=b.textContent;
      b.textContent = (lang==='en'?'Copied!':'Copiato!'); setTimeout(()=>b.textContent=old,900);
    } else {
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      const b=document.getElementById('shareBtn'); const old=b.textContent;
      b.textContent = (lang==='en'?'Copied!':'Copiato!'); setTimeout(()=>b.textContent=old,900);
    }
  }catch{}
};

document.getElementById('againBtn').onclick=()=>{ location.href='fourth.html'; };
</script>
</body>
</html>
