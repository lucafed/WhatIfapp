<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Risposta</title>
  <meta name="theme-color" content="#0B0B0C"/>
  <style>
    :root{ --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA; --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
      --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12); --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35); }
    html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
    *{box-sizing:border-box}
    html,body{ margin:0; background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    main{max-width:980px;margin:auto;padding:18px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
    .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
    .btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none;white-space:nowrap}
    .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
    h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
    .label{color:var(--acc);font-weight:800;margin-bottom:8px}
    .answer{font-size:18px;line-height:1.6;white-space:pre-wrap}
    .small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
<main>
  <!-- Versioning -->
  <script>
    const APP_VERSION = "2025-10-28-2";
    (function(){
      const prev = localStorage.getItem("app_version");
      if(prev !== APP_VERSION){
        Object.keys(localStorage).forEach(k=>{
          if(/^(whatif_|ui_|micro_|ltm_|replay_|cronologia|next_prompts|whatif_request)/.test(k))
            localStorage.removeItem(k);
        });
        if('caches' in window) caches.keys().then(ns=>ns.forEach(c=>caches.delete(c)));
        if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));
        localStorage.setItem("app_version", APP_VERSION);
        setTimeout(()=>location.reload(true), 200);
      }
    })();
  </script>

  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" onclick="history.back()">←</button>
      <button class="btn" onclick="location.href='index.html'">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="badgeStyle">🎭 —</span>
      <span class="badge" id="badgePeriodo">🕰️ —</span>
    </div>
  </div>

  <h1 id="questionH"></h1>

  <div class="card">
    <div class="label">Risposta</div>
    <div id="answer" class="answer"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="shareBtn">🔗 Condividi</button>
      <button class="btn ghost" id="againBtn">Nuova domanda</button>
    </div>
    <div class="small" id="meta"></div>
  </div>
</main>

<script>
(function(){
  const req = JSON.parse(localStorage.getItem('whatif_request')||'{}');
  const domanda = localStorage.getItem('domanda')||'';
  const style = String(req.stile||'whatif');
  const substyle = String(req.substyle||'');
  document.documentElement.setAttribute('data-theme', style==='wtf'?'wtf':'whatif');

  document.getElementById('badgeStyle').textContent = '🎭 ' + (style==='wtf'?'What the F':'What if') + (style==='whatif' && substyle?` · ${substyle}`:'');
  document.getElementById('badgePeriodo').textContent = '🕰️ ' + (String(req.periodo||'future')==='past'?'Passato':'Futuro');

  document.getElementById('questionH').textContent = domanda || (document.documentElement.lang==='en'?'Your question':'La tua domanda');

  // Se è replay, mostra la risposta salvata
  const urlParams = new URLSearchParams(location.search);
  const replay = urlParams.get('view')==='replay' ? JSON.parse(localStorage.getItem('replay_story')||'{}') : null;

  function hardClean(s){
    return String(s||'')
      .replace(/^(Entri piano, il caos ti riconosce ma oggi ti lascia passare\.)\s*/i,'')
      .replace(/^(La stanza è la stessa, lo sguardo no: è già un inizio\.)\s*/i,'')
      .replace(/^(.{10,120})\s+\1/si,"$1 ")
      .replace(/^(?:Ehi|Oh|Ah|Ecco|Allora)[,!\s]+[A-ZÀ-ÖØ-Ý][a-zà-öø-ÿ']{1,20}([,!\s]+)?/i,'')
      .trim();
  }

  async function run(){
    if(replay && replay.answer){
      document.getElementById('answer').textContent = hardClean(replay.answer);
      document.getElementById('meta').textContent = 'Replay';
      return;
    }
    // call backend
    const headers={'Content-Type':'application/json'};
    if(localStorage.getItem('admin_token')) headers['x-admin-token']=localStorage.getItem('admin_token');
    if((JSON.parse(localStorage.getItem('whatif_prefs')||'{}')).pro) headers['x-pro']='1';

    const res = await fetch('/api/ask',{method:'POST',headers,body:JSON.stringify(req)});
    if(!res.ok){ document.getElementById('answer').textContent = 'Errore di server.'; return; }
    const data = await res.json();

    const ans = hardClean(data.answer||'');
    document.getElementById('answer').textContent = ans;

    // salva in cronologia
    const arr = JSON.parse(localStorage.getItem('cronologia')||'[]');
    arr.push({ ts:Date.now(), domanda, stile:style, answer:ans });
    localStorage.setItem('cronologia', JSON.stringify(arr.slice(-100)));
  }
  run();

  document.getElementById('againBtn').onclick=()=>{ location.href='fourth.html'; };
  document.getElementById('copyBtn').onclick=async()=>{
    try{ await navigator.clipboard.writeText(document.getElementById('answer').textContent); }catch{}
  };
  document.getElementById('shareBtn').onclick=async()=>{
    const text = document.getElementById('answer').textContent;
    if(navigator.share){ try{ await navigator.share({text}); }catch{} }
    else { try{ await navigator.clipboard.writeText(text); alert('Copiato negli appunti'); }catch{} }
  };
})();
</script>
</body>
</html>
