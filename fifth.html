<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; /* whatif */
  --wtf1:#3A6B56; --wtf2:#5A8C75; /* wtf */
  --ink:#0A0E12;
  --line:rgba(255,255,255,.12);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(800px 600px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{background:rgba(20,28,34,.9);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.story{white-space:pre-wrap;line-height:1.65;font-size:18px;letter-spacing:.1px}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:33%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}
.input, textarea{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);font-size:16px}
.small{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
.tip{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<main>
  <!-- topbar -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Episodio</h1>
  <p class="sub" id="subtitle">—</p>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <!-- domanda -->
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 style="margin:0;color:var(--acc)">La tua domanda</h3>
    </div>
    <div id="qView" class="input" style="min-height:54px"></div>
  </div>

  <!-- risposta + azioni -->
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 style="margin:0;color:var(--acc)" id="answerLabel">Risultato</h3>
      <span class="small" id="metaInfo">—</span>
    </div>
    <div id="answer" class="story">⏳ …</div>

    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="copyBtn">📋 Copia</button>
      <button class="btn ghost" id="shareBtn">🔗 Condividi</button>
      <button class="btn ghost" id="downloadBtn">⬇️ .txt</button>
    </div>
  </div>

  <!-- suggerimenti / salva per domani -->
  <div class="card" id="followCard" style="display:none">
    <h3 id="followTitle" style="color:var(--acc);margin-top:0">Suggerimenti per il seguito</h3>
    <div id="followList" class="chips"></div>
    <div class="sep"></div>
    <textarea id="customFollow" rows="3" placeholder="Scrivi lo spunto per la prossima puntata…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <span class="tip" id="saveInfo"></span>
    </div>
    <p class="small" id="tomorrowInfo">Il seguito sarà disponibile domani nella pagina delle domande salvate.</p>
  </div>
</main>

<script>
/* ===== helpers & storage ===== */
const LS=localStorage; const $=id=>document.getElementById(id);
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
function fmt(ts){return new Date(ts).toLocaleString(document.documentElement.lang||'it-IT',{hour12:false});}

/* ===== i18n ===== */
const I18N={
  it:{
    titleWTF:"⚡ What the F — Episodio",
    titleWHF:"💡 What?f — Episodio",
    sub:q=>`Domanda: “${q}”`,
    result:"Risultato",
    copy:"📋 Copia", share:"🔗 Condividi", dl:"⬇️ .txt",
    savedTag:"(generata ora)",
    replayTag:"(risposta salvata)",
    suggTitle:"Suggerimenti per il seguito",
    suggBusy:"Creo tre spunti…",
    customPH:"Scrivi lo spunto per la prossima puntata…",
    save:"💾 Salva per domani", saved:"✅ Salvato per domani.",
    tomorrow:"Il seguito sarà disponibile domani nella pagina delle domande salvate.",
    copyOk:"Copiato",
    shareNA:"Condivisione non supportata",
    err:"Errore nel generare la storia."
  },
  en:{
    titleWTF:"⚡ What the F — Episode",
    titleWHF:"💡 What?f — Episode",
    sub:q=>`Question: “${q}”`,
    result:"Result",
    copy:"📋 Copy", share:"🔗 Share", dl:"⬇️ .txt",
    savedTag:"(generated now)",
    replayTag:"(saved answer)",
    suggTitle:"Suggestions to continue",
    suggBusy:"Thinking of three prompts…",
    customPH:"Write the next episode prompt…",
    save:"💾 Save for tomorrow", saved:"✅ Saved for tomorrow.",
    tomorrow:"You’ll continue tomorrow from the saved prompts.",
    copyOk:"Copied",
    shareNA:"Sharing not supported",
    err:"Error while generating."
  }
};
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it; document.documentElement.lang=lang;

/* ===== prefs & theme ===== */
const prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== UI text ===== */
$('langBtn').textContent=lang.toUpperCase();
$('answerLabel').textContent=T.result;
$('saveBtn').textContent=T.save;
$('customFollow').placeholder=T.customPH;
$('followTitle').textContent=T.suggTitle;
$('tomorrowInfo').textContent=T.tomorrow;

/* topnav */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

/* ===== question context ===== */
const params = new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';

const domanda = (()=>{
  if(isReplay){
    const r=readJSON('replay_story',null);
    return r?.domanda || LS.getItem('domanda') || "";
  }
  return LS.getItem('domanda') || "";
})();

const style = prefs.stile || 'whatif';
$('title').textContent = (style==='wtf'?T.titleWTF:T.titleWHF);
$('subtitle').textContent = T.sub(domanda || '—');
$('qView').textContent = domanda || '—';

/* ===== build extra from micro-data ===== */
const buffer = readJSON('whatif_clarify_buffer',{});
function buildExtraFrom(b){
  const m=b?.micro||{};
  const bits=[ b?.extra, m.m1 && `profilo: ${m.m1}`, m.m2 && `famiglia: ${m.m2}`, m.m3 && `priorità: ${m.m3}` ].filter(Boolean);
  return bits.join(' • ');
}
const extraForAI = buildExtraFrom(buffer);

/* ===== copy/share/download ===== */
function fullText(){ return `Q: ${domanda}\n\n${answerText||''}\n`; }
$('copyBtn').textContent=T.copy;
$('shareBtn').textContent=T.share;
$('downloadBtn').textContent=T.dl;

$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText(fullText()); alert(T.copyOk);}catch{} };
$('shareBtn').onclick=async()=>{
  const data={title:'What?f',text:fullText()};
  if(navigator.share){ try{ await navigator.share(data);}catch{} }
  else { alert(T.shareNA); }
};
$('downloadBtn').onclick=()=>{
  const blob=new Blob([fullText()],{type:'text/plain'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`whatif_${Date.now()}.txt`; a.click(); URL.revokeObjectURL(url);
};

/* ===== generation or replay ===== */
let answerText='';

(async function boot(){
  if(isReplay){
    const r=readJSON('replay_story',null);
    answerText=r?.answer||'—';
    $('answer').textContent=answerText;
    $('metaInfo').textContent=T.replayTag;
    $('followCard').style.display='none'; // niente suggerimenti in replay
    return;
  }

  try{
    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ domanda, lang, stile: style, extra: extraForAI })
    });
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail||'bad_response');
    answerText = String(data.answer||"").trim();
    $('answer').textContent = answerText;
    $('metaInfo').textContent = T.savedTag;

    // salva cronologia locale per replay
    const hist = readJSON('cronologia',[]);
    hist.unshift({ domanda, risposta: answerText, stile: style, lang, ts: Date.now() });
    writeJSON('cronologia', hist.slice(0,50));

    // costruisci suggerimenti → si possono solo salvare per domani
    await buildSuggestions(answerText);
  }catch(err){
    console.error(err);
    $('answer').textContent = T.err;
  }
})();

/* ===== suggestions (invece di domande) ===== */
async function buildSuggestions(answerText){
  const box = $('followList');
  box.textContent = T.suggBusy;

  let sug = [];
  try{
    const rr = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        domanda, lang, stile: style, follow: true, answer: answerText
      })
    });
    const dj = await rr.json();
    if(Array.isArray(dj.followups)) sug = dj.followups.slice(0,3);
  }catch{}

  if(!sug.length){
    sug = (lang==='en'
      ? ["Choose one clear sign you’ll watch next.","Name the first place you’d try if you moved.","Decide who you’ll tell — or not."]
      : ["Scegli un segnale chiaro da osservare.","Indica il primo posto che proveresti se ti muovi.","Decidi a chi dirlo — o se tenerlo per te."]);
  }

  box.innerHTML='';
  sug.forEach(txt=>{
    const chip=document.createElement('div');
    chip.className='input';
    chip.style.cursor='pointer';
    chip.textContent='• '+txt;
    chip.onclick=()=>{ $('customFollow').value=txt; };
    box.appendChild(chip);
  });

  $('followCard').style.display='block';
}

/* ===== salva per domani (Niente “continua adesso”) ===== */
$('saveBtn').onclick=()=>{
  const v = ($('customFollow').value||"").trim();
  if(!v){ $('customFollow').focus(); return; }
  const saved = readJSON('next_prompts',[]);
  saved.unshift({ q:v, stile: style, lang, ts: Date.now() });
  writeJSON('next_prompts', saved.slice(0,50));
  $('saveInfo').textContent = T.saved;
  setTimeout(()=> $('saveInfo').textContent='', 1400);
};
</script>
</body>
</html>
