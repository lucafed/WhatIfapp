<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risposta</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(820px 620px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{background:rgba(20,28,34,.9);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.story{white-space:pre-wrap;line-height:1.65;font-size:18px;letter-spacing:.1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
textarea{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);font-size:16px}
.small{font-size:12px;color:var(--muted)}
.input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <button class="btn ghost" id="langBtn">IT</button>
  </div>

  <h1 id="title">What?f — Risposta</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="lblQ">Domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="lblA">Risultato</div>
    <div id="answer" class="story">⏳ Genero la risposta…</div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>

  <div class="card" id="suggCard">
    <div class="label" style="color:var(--acc);font-weight:800;margin-bottom:8px" id="suggTitle">Spunti legati alla risposta</div>
    <div id="suggList" class="story" style="font-size:16px"></div>
    <div class="row" style="margin-top:10px">
      <textarea id="customNext" rows="2" placeholder="Aggiungi un tuo spunto concreto…"></textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva</button>
      <button class="btn ghost" id="doneBtn">✅ Fatto</button>
    </div>
    <p class="small" id="saveInfo"></p>
  </div>
</main>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const lang = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

const I18N={
  it:{
    titleW:"💡 What if — Risposta", titleF:"⚡ What the F — Risposta",
    sub:(q)=>`Domanda: “${q}”`,
    q:"Domanda", a:"Risultato",
    share:"📤 Condividi / Copia", copied:"Copiato!",
    saved:"✅ Salvato.", done:"✅ Fatto",
    error:"[errore server]",
    sugg:"Spunti legati alla risposta",
    phNext:"Aggiungi un tuo spunto concreto…"
  },
  en:{
    titleW:"💡 What if — Answer", titleF:"⚡ What the F — Answer",
    sub:(q)=>`Question: “${q}”`,
    q:"Question", a:"Result",
    share:"📤 Share / Copy", copied:"Copied!",
    saved:"✅ Saved.", done:"✅ Done",
    error:"[server error]",
    sugg:"Prompts tied to this answer",
    phNext:"Add your concrete nudge…"
  }
}[lang];

const $=id=>document.getElementById(id);
$('langBtn').textContent=lang.toUpperCase();
$('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
$('backBtn').onclick=()=>history.back(); $('homeBtn').onclick=()=>location.href='index.html';

$('title').textContent = (style==='wtf'? I18N.titleF : I18N.titleW);
$('lblQ').textContent = I18N.q; $('lblA').textContent = I18N.a;
$('shareBtn').textContent = I18N.share;
$('suggTitle').textContent = I18N.sugg;
$('customNext').placeholder = I18N.phNext;

/* ===== Context ===== */
const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';

let domanda = "";
let answerText = "";

// replay branch
if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  answerText = r.answer || "";
  $('subtitle').textContent = I18N.sub(domanda);
  $('qView').textContent = domanda || '—';
  $('answer').textContent = answerText || '—';
  $('metaInfo').textContent = '';
  buildSuggestions(domanda, answerText, style, lang);
} else {
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  const extra = req.extra || "";
  const micro = req.micro || {};
  $('subtitle').textContent = I18N.sub(domanda);
  $('qView').textContent = domanda || '—';

  (async ()=>{
    try{
      const r = await fetch("/api/ask",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ domanda, lang, stile:style, extra })
      });
      const data = await r.json();
      if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
      answerText = (data.answer||"").trim();
      $('answer').textContent = answerText;

      // cronologia
      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:answerText, stile:style, ts:Date.now() });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));

      // suggerimenti client-side
      buildSuggestions(domanda, answerText, style, lang);
    }catch(e){
      $('answer').textContent = I18N.error;
      console.error(e);
    }
  })();
}

/* ===== Suggerimenti che seguono stile & lingua (client-side) ===== */
function buildSuggestions(q, a, style, lang){
  const list=$('suggList');

  const SUGG = {
    it: {
      whatif: [
        "Annota un segno concreto che vedrai entro domani.",
        "Definisci un micro-passo di 10 minuti che farai davvero.",
        "Scegli un luogo che ti mette nel ritmo giusto."
      ],
      wtf: [
        "Prometti un brindisi se compi un passo minuscolo (vale anche acqua).",
        "Scrivi la scusa più assurda che userai, poi non usarla.",
        "Dichiara al barista il tuo micro-obiettivo come un segreto di stato."
      ]
    },
    en: {
      whatif: [
        "Note one concrete sign you’ll see by tomorrow.",
        "Pick a 10-minute micro-step you’ll actually do.",
        "Choose a place that sets the right tempo."
      ],
      wtf: [
        "Promise a toast if you take one tiny step (water counts).",
        "Write your most absurd excuse, then don’t use it.",
        "Tell the bartender your micro-goal like a state secret."
      ]
    }
  };

  const arr = SUGG[lang][style] || [];
  list.innerHTML = "• " + arr.join("\n• ");
}

/* ===== Save & Done ===== */
$('saveBtn').onclick=()=>{
  const v = ($('customNext').value||"").trim();
  if(!v){ $('customNext').focus(); return; }
  const saved = JSON.parse(LS.getItem('next_prompts')||'[]');
  saved.unshift({ q:v, stile:style, lang, ts:Date.now() });
  LS.setItem('next_prompts', JSON.stringify(saved.slice(0,50)));
  $('saveInfo').textContent = I18N.saved;
};
$('doneBtn').onclick=()=>{ location.href='fourth.html'; };

/* ===== Share / Copy ===== */
$('shareBtn').onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n\nQ: ${domanda}\n\n${answerText}`;
  try{
    if(navigator.share){ await navigator.share({ title: "What?f", text: full }); }
    else { await navigator.clipboard.writeText(full); $('shareBtn').textContent=I18N.copied; setTimeout(()=>$('shareBtn').textContent=I18N.share,1200); }
  }catch{}
};
</script>
</body>
</html>
