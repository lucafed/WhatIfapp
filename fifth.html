<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Risposta</title>
  <meta name="theme-color" content="#0B0B0C"/>
  <style>
    :root{
      --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
      --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
      --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
      --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
    }
    html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }

    *{box-sizing:border-box}
    html,body{
      margin:0; min-height:100%;
      background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{
      appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);
      padding:10px 14px;border-radius:12px;cursor:pointer
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;
      box-shadow:0 6px 18px var(--shadow)
    }
    .btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}

    .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}

    h1{font-size:clamp(22px,4.5vw,30px);margin:4px 0 2px;color:var(--acc2);text-align:center}
    .q{font-size:14px;color:var(--muted);text-align:center;margin-bottom:8px}

    .answer{font-size:18px;line-height:1.6;white-space:pre-wrap}
    .muted{font-size:12px;color:var(--muted);text-align:center}

    .cta-row{display:flex;gap:10px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
    .sep{opacity:.4}

    .toast{
      position:fixed;left:50%;transform:translateX(-50%);
      bottom:20px;background:rgba(0,0,0,.7);color:#fff;padding:10px 14px;border-radius:10px;
      font-size:14px;display:none
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="row">
        <button class="btn" id="backBtn">←</button>
        <button class="btn" id="homeBtn">🏠</button>
      </div>
      <div class="row">
        <span class="badge" id="styleBadge">🎭 —</span>
        <span class="badge" id="periodoBadge">🕰️ —</span>
        <span class="badge" id="variantBadge">🧩 —</span>
        <button class="btn" id="langBtn">IT</button>
      </div>
    </div>

    <h1 id="titleH1">Risultato</h1>
    <div class="q" id="qEcho">—</div>

    <div class="card">
      <div class="answer" id="answerBox">…</div>
    </div>

    <div class="cta-row">
      <button class="btn" id="shareBtn">🔗 Condividi</button>
      <button class="btn ghost" id="copyBtn">📋 Copia</button>
      <span class="sep">·</span>
      <button class="btn ghost" id="regenBtn">↻ Rigenera</button>
      <button class="btn primary" id="newBtn">+ Nuova domanda</button>
      <button class="btn" id="saveBtn">⭐ Salva</button>
    </div>

    <div class="muted" id="footNote"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== I18N =====
    const I18N = {
      it:{
        title:"Risultato", share:"Condividi", copy:"Copia", regen:"↻ Rigenera", newq:"+ Nuova domanda", save:"⭐ Salva",
        copied:"Testo copiato", sharedOk:"Condiviso", saved:"Salvato nei preferiti",
        styleLabel:(s)=> s==='wtf'?'What the F':'What if',
        variant:(v)=> v==='poetico'?'Poetico':'Analitico',
        foot:"Puoi tornare indietro per cambiare stile, periodo o variante."
      },
      en:{
        title:"Result", share:"Share", copy:"Copy", regen:"↻ Regenerate", newq:"+ New question", save:"⭐ Save",
        copied:"Copied", sharedOk:"Shared", saved:"Saved to favorites",
        styleLabel:(s)=> s==='wtf'?'What the F':'What if',
        variant:(v)=> v==='poetico'?'Poetic':'Analytical',
        foot:"You can go back to tweak style, period or variant."
      }
    };

    // ===== Helpers =====
    const LS = localStorage;
    const $  = s => document.querySelector(s);
    const detectLang = ()=> (LS.getItem('lang') || (navigator.language||'it')).toLowerCase().startsWith('en') ? 'en' : 'it';
    const lang = detectLang(); document.documentElement.lang = lang;
    const T = I18N[lang];

    function readJSON(k,def){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
    function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
    function toast(msg){
      const t=$('#toast'); t.textContent=msg; t.style.display='block';
      setTimeout(()=> t.style.display='none', 1400);
    }

    // Stato
    let prefs = readJSON('whatif_prefs',{stile:'whatif',periodo:'future',variant:'analitico'});
    document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

    // UI text
    $('#titleH1').textContent = T.title;
    $('#langBtn').textContent = (LS.getItem('lang')||'it').toUpperCase();
    $('#footNote').textContent = T.foot;
    $('#styleBadge').textContent   = '🎭 ' + T.styleLabel(prefs.stile);
    $('#periodoBadge').textContent = '🕰️ ' + (prefs.periodo==='past' ? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
    $('#variantBadge').textContent = '🧩 ' + (prefs.stile==='whatif' ? T.variant(prefs.variant) : (lang==='en'?'—':'—'));

    // Nav
    $('#backBtn').onclick = ()=> history.back();
    $('#homeBtn').onclick = ()=> location.href='index.html';
    $('#langBtn').onclick = ()=>{
      const cur = (LS.getItem('lang')||lang).toLowerCase().startsWith('en') ? 'it' : 'en';
      LS.setItem('lang', cur);
      location.reload();
    };

    // Request
    const req = readJSON('whatif_request', null);
    const domanda = LS.getItem('domanda') || '';
    $('#qEcho').textContent = domanda ? `“${domanda}”` : '';

    // Fetch answer
    async function callAPI(r){
      const headers = {'Content-Type':'application/json'};
      // opzionale: PRO o admin
      if(LS.getItem('admin_token')) headers['x-admin-token'] = LS.getItem('admin_token');
      if(prefs.pro) headers['x-pro'] = '1';

      const body = {
        domanda: r.domanda,
        stile:   r.stile,
        lang:    r.lang,
        extra:   r.extra || "",
        periodo: r.periodo || 'future',
        micro:   r.micro || {},
        variant: r.variant // solo per whatif
      };

      const res = await fetch('/api/ask', { method:'POST', headers, body: JSON.stringify(body) });
      if(!res.ok){
        const e = await res.json().catch(()=>({error:'server_error'}));
        throw new Error(e.error || 'server_error');
      }
      return await res.json();
    }

    async function render(){
      if(!req || !req.domanda){
        $('#answerBox').textContent = lang==='en' ? 'No question provided.' : 'Nessuna domanda impostata.';
        return;
      }
      try{
        $('#answerBox').textContent = '…';
        const data = await callAPI(req);
        const ans = String(data.answer||'').trim();
        $('#answerBox').textContent = ans || (lang==='en'?'(empty)':'(vuoto)');

        // salva in cronologia
        const hist = readJSON('cronologia',[]);
        hist.push({ ts: Date.now(), domanda: req.domanda, risposta: ans, stile: req.stile, periodo: req.periodo, variant: req.variant });
        writeJSON('cronologia', hist);
      }catch(err){
        $('#answerBox').textContent = (lang==='en'?'Server error.':'Errore server.');
      }
    }
    render();

    // Share
    function buildShareText(){
      const style = T.styleLabel(prefs.stile);
      const v = (prefs.stile==='whatif') ? ` · ${T.variant(prefs.variant)}` : '';
      const head = `${style}${v} — ${prefs.periodo==='past' ? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro')}`;
      const q = domanda ? `Q: ${domanda}\n` : '';
      const a = $('#answerBox').textContent || '';
      return `${head}\n${q}\n${a}`;
    }
    $('#shareBtn').textContent = (lang==='en'? 'Share' : 'Condividi');
    $('#copyBtn').textContent  = (lang==='en'? 'Copy'  : 'Copia');
    $('#regenBtn').textContent = (lang==='en'? '↻ Regenerate' : '↻ Rigenera');
    $('#newBtn').textContent   = (lang==='en'? '+ New question' : '+ Nuova domanda');
    $('#saveBtn').textContent  = (lang==='en'? '⭐ Save' : '⭐ Salva');

    $('#shareBtn').onclick = async ()=>{
      const text = buildShareText();
      if(navigator.share){
        try{ await navigator.share({ text }); toast(T.sharedOk); } catch{}
      }else{
        try{ await navigator.clipboard.writeText(text); toast(T.copied); }catch{}
      }
    };
    $('#copyBtn').onclick = async ()=>{
      try{ await navigator.clipboard.writeText(buildShareText()); toast(T.copied); }catch{}
    };

    // Rigenera (stessa richiesta)
    $('#regenBtn').onclick = ()=> render();

    // Nuova domanda
    $('#newBtn').onclick = ()=> location.href='fourth.html';

    // Salva domanda per dopo
    $('#saveBtn').onclick = ()=>{
      const list = readJSON('next_prompts',[]);
      list.unshift({ q: domanda, ts: Date.now() });
      writeJSON('next_prompts', list.slice(0,50));
      toast(T.saved);
    };
  </script>
</body>
</html>
