<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risposta</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
  --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
*{box-sizing:border-box}
html,body{margin:0;background:
radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);
color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.input,textarea{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.answer{white-space:pre-wrap;line-height:1.5}
.meta{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="hTitle">Il tuo What?f</h1>

  <div class="card">
    <div class="label" id="lblQuestion">La tua domanda</div>
    <div class="input" style="min-height:54px" id="qView"></div>
  </div>

  <div class="card" id="yesterdayCard" style="display:none">
    <div class="label" id="lblYesterday">Ieri in breve</div>
    <div class="answer" id="yesterdayBox">—</div>
  </div>

  <div class="card">
    <div class="label" id="lblAnswer">Risultato</div>
    <div class="answer" id="answerBox">…</div>
    <div class="meta" id="metaInfo"></div>
  </div>

  <div class="card" id="contBox">
    <div class="label" id="lblTomorrow">Domani continuiamo da qui</div>
    <div id="fuList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>
    <div class="row">
      <input id="fuCustom" class="input" placeholder="oppure scrivi tu la prossima micro-domanda…"/>
      <button class="btn primary" id="saveFuBtn">Salva per domani</button>
    </div>
  </div>
</main>

<script>
/* ===== helpers ===== */
const LS=localStorage;
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
const $=(id)=>document.getElementById(id);

/* ===== i18n ===== */
const I18N={it:{
  title:"Il tuo What?f", yourq:"La tua domanda", result:"Risultato",
  cont:"Domani continuiamo da qui", saved:"Salva per domani",
  customPH:"oppure scrivi tu la prossima micro-domanda…",
  metaReplay:"(risposta salvata)", metaLive:"(generata ora)",
  yesterday:"Ieri in breve", gen1:"⏳ Genero l’episodio…", err:"[errore server]"
},en:{
  title:"Your What?f", yourq:"Your question", result:"Result",
  cont:"Tomorrow we pick up from here", saved:"Save for tomorrow",
  customPH:"or write your own next micro-question…",
  metaReplay:"(saved answer)", metaLive:"(generated now)",
  yesterday:"Yesterday, in short", gen1:"⏳ Generating the episode…", err:"[server error]"
}};
let lang=(LS.getItem('lang')||'it').toLowerCase(); const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* ===== theme/prefs ===== */
const prefs = readJSON('whatif_prefs',{stile:'whatif'});
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

/* ===== UI text ===== */
$('hTitle').textContent=T.title;
$('lblQuestion').textContent=T.yourq;
$('lblAnswer').textContent=T.result;
$('lblTomorrow').textContent=T.cont;
$('saveFuBtn').textContent=T.saved;
$('fuCustom').placeholder=T.customPH;
$('lblYesterday').textContent=T.yesterday;
$('langBtn').textContent=lang.toUpperCase();

/* ===== nav ===== */
$('backBtn').onclick=()=>history.back();
$('homeBtn').onclick=()=>location.href='index.html';
$('langBtn').onclick=()=>{ const nxt=lang==='it'?'en':'it'; LS.setItem('lang',nxt); location.reload(); };

/* ===== state ===== */
const domanda = LS.getItem('domanda') || "";
const stile = prefs.stile || 'whatif';
$('qView').textContent = domanda || '—';

/* ===== threading ===== */
let currentThreadId = null;
let currentEpisode = 1; // default
const resumeSaved = readJSON('resume_from_saved', null); // {threadId,nextEp}
const resumeId = LS.getItem('resume_id') || null;       // compat con storie recenti
const resumeMode = LS.getItem('resume_mode') || null;

function groupByThread(arr){
  const out={};
  arr.forEach(it=>{
    const key = it.threadId || ('Q::'+(it.domanda||'')); (out[key]||(out[key]=[])).push(it);
  });
  return out;
}

/* ===== history helpers ===== */
function pushHistory({ threadId, episode, domanda, answer, stile }){
  const arr=readJSON('cronologia',[]);
  const id=Date.now();
  arr.unshift({ id, threadId, episode, domanda, risposta:answer, stile, lang, ts:id });
  writeJSON('cronologia', arr.slice(0,50));
}
function findThreadEpisodes(threadId){
  const arr=readJSON('cronologia',[]);
  return (groupByThread(arr)[threadId]||[]).sort((a,b)=>(a.episode||1)-(b.episode||1));
}

/* ===== generate core ===== */
async function callAsk(q){ // NON tocco /api/ask.js
  const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ domanda:q, stile, lang })});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); return (j.answer||'').trim();
}

/* ===== followups ===== */
async function callFollowups(q, answer){
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ domanda:q, stile, lang, follow:true, answer })});
    const j=await r.json();
    if(Array.isArray(j.followups)) return j.followups.slice(0,2);
  }catch{}
  // fallback
  return lang==='en'
    ? ["What’s the smallest 7-day step here?","What sign tomorrow would tell you it’s right?"]
    : ["Qual è il passo più piccolo da 7 giorni?","Quale segnale domani ti direbbe che è la direzione giusta?"];
}

function renderFollowups(list){
  const box=$('fuList'); box.innerHTML='';
  list.slice(0,2).forEach(txt=>{
    const div=document.createElement('div'); div.className='input'; div.textContent=txt; div.style.cursor='pointer';
    div.onclick=()=>{ $('fuCustom').value=txt; };
    box.appendChild(div);
  });
}

/* ===== save followup (include threadId & nextEp) ===== */
$('saveFuBtn').onclick=()=>{
  const v = $('fuCustom').value.trim(); if(!v){$('fuCustom').focus();return;}
  const saved = readJSON('saved_for_tomorrow',[]);
  const nextEp = Math.min(currentEpisode+1,3);
  saved.push({ q:v, stile, lang, ts:Date.now(), threadId: currentThreadId, nextEp });
  writeJSON('saved_for_tomorrow', saved.slice(-50));
  $('fuCustom').value='';
  $('saveFuBtn').textContent = (lang==='en'?'Saved!':'Salvato!');
  setTimeout(()=>{$('saveFuBtn').textContent=(lang==='en'?'Save for tomorrow':'Salva per domani');},1200);
};

/* ===== yesterday helper ===== */
function showYesterday(prev){
  if(!prev){ $('yesterdayCard').style.display='none'; return; }
  $('yesterdayBox').textContent = prev.risposta || '—';
  $('yesterdayCard').style.display='block';
}

/* ===== boot modes ===== */
(async function boot(){
  // Caso A: arrivo da “salvata per domani” (quarta → usa → genera)
  if(resumeSaved && resumeSaved.threadId){
    currentThreadId = resumeSaved.threadId;
    currentEpisode  = Math.min(resumeSaved.nextEp||2,3);
    const episodes = findThreadEpisodes(currentThreadId);
    const prev = episodes.find(e => e.episode === (currentEpisode-1));
    showYesterday(prev);

    $('answerBox').textContent=T.gen1;
    const ans = await callAsk(domanda);
    $('answerBox').textContent = ans; $('metaInfo').textContent = T.metaLive;
    pushHistory({ threadId: currentThreadId, episode: currentEpisode, domanda, answer: ans, stile });
    const fu = await callFollowups(domanda, ans); renderFollowups(fu);

    // pulizia del token di resume
    LS.removeItem('resume_from_saved');
    return;
  }

  // Caso B: arrivo da “storie recenti” → continua/review (compat)
  if(resumeId){
    const hist=readJSON('cronologia',[]);
    const item = hist.find(x=>String(x.id||x.ts)===String(resumeId));
    if(item){
      currentThreadId = item.threadId || ('Q::'+item.domanda);
      if(LS.getItem('resume_mode')==='review'){
        // rivedi tutto: mostra ieri (ultimo) + NON genera nuovo
        const episodes = findThreadEpisodes(currentThreadId);
        showYesterday(episodes[episodes.length-1]);
        $('answerBox').textContent = episodes[episodes.length-1].risposta || '—';
        $('metaInfo').textContent = T.metaReplay;
        const fu = await callFollowups(domanda, episodes[episodes.length-1].risposta||'');
        renderFollowups(fu);
        LS.removeItem('resume_id'); LS.removeItem('resume_mode');
        return;
      } else {
        // continua: se <3 genera ep successivo
        const episodes = findThreadEpisodes(currentThreadId);
        const last = episodes[episodes.length-1];
        currentEpisode = Math.min((last?.episode||1)+1,3);
        showYesterday(last);

        if((last?.episode||1) >= 3){
          $('answerBox').textContent = last.risposta || '—';
          $('metaInfo').textContent = T.metaReplay;
          const fu = await callFollowups(domanda, last.risposta||''); renderFollowups(fu);
          LS.removeItem('resume_id'); LS.removeItem('resume_mode');
          return;
        }

        $('answerBox').textContent=T.gen1;
        const ans = await callAsk(domanda);
        $('answerBox').textContent = ans; $('metaInfo').textContent = T.metaLive;
        pushHistory({ threadId: currentThreadId, episode: currentEpisode, domanda, answer: ans, stile });
        const fu = await callFollowups(domanda, ans); renderFollowups(fu);
        LS.removeItem('resume_id'); LS.removeItem('resume_mode');
        return;
      }
    }
  }

  // Caso C: NUOVA storia (nessun resume)
  currentThreadId = Date.now().toString();
  currentEpisode  = 1;
  $('answerBox').textContent=T.gen1;
  try{
    const ans = await callAsk(domanda);
    $('answerBox').textContent = ans; $('metaInfo').textContent = T.metaLive;
    pushHistory({ threadId: currentThreadId, episode: currentEpisode, domanda, answer: ans, stile });
    const fu = await callFollowups(domanda, ans); renderFollowups(fu);
  }catch(e){
    $('answerBox').textContent = T.err + ' ' + (e?.message||e);
  }
})();
</script>
</main>
</body>
</html>
