<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f – Step 5</title>
<meta name="theme-color" content="#0A0F14">
<style>
  :root{--bg:#0A0F14;--fg:#E6EEF2;--muted:#A0B2BA;--accent:#00E0FF;--accent2:#00B5CC}
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:18px 16px 84px}
  .hero{width:min(92vw,760px);border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.5)}
  .hero img{display:block;width:100%;height:auto}
  .fb{display:none;color:var(--muted);font-size:14px}
  h2{margin:6px 0 0;text-align:center;font-size:clamp(24px,5.6vw,38px)}
  .copy{max-width:820px;text-align:center;color:#C7DCE3;font-size:clamp(15px,3.8vw,19px)}
  .btn{display:inline-block;text-decoration:none;font-weight:800;letter-spacing:.3px;
      background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);color:#02242C;border:0;border-radius:22px;
      padding:12px 22px;min-width:220px;box-shadow:0 10px 28px rgba(0,181,204,.45)}
  footer{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <main>
    <div class="hero">
      <img id="hero" alt="Step 5" loading="eager" decoding="async"/>
    </div>
    <div id="fb" class="fb">Immagine non trovata.</div>

    <h2>Si entra nel tuo What?f</h2>
    <div class="copy">Rispondi a poche domande e costruiremo il tuo scenario.</div>

    <a id="cta" class="btn" href="./ask.html">PARLIAMI DI TE</a>
    <div style="font-size:12px;color:var(--muted)">Swipe ← per tornare</div>
  </main>
  <footer>© 2025 What?f</footer>

  <script>
    (async function(){
      const img=document.getElementById('hero'), fb=document.getElementById('fb');
      const tries=['/fifth-hero.png','/public/fifth-hero.png','/assets/fifth-hero.png','fifth-hero.png'];
      for(const u of tries){try{const r=await fetch(u,{cache:'no-store'}); if(r.ok){img.src=u+'?v='+Date.now(); fb.style.display='none'; return;}}catch(e){}}
      fb.style.display='block';
    })();
  </script>

  <script>
    (function(){
      const PREV='fourth.html';
      let sx=0,sy=0,t=0; const TH=50;
      addEventListener('touchstart',e=>{const p=e.touches[0]; sx=p.clientX; sy=p.clientY; t=Date.now();},{passive:true});
      addEventListener('touchend',e=>{
        const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy, dt=Date.now()-t;
        if(dt<800 && (dx>TH || dy>TH)) location.href=PREV; // solo indietro qui
      },{passive:true});
      document.getElementById('cta').addEventListener('click',e=>{/* normale */});
    })();
  </script>
</body>
</html>
