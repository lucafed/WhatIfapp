<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:rgba(20,28,34,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px;
}
.story{white-space:normal;line-height:1.68;font-size:18px;letter-spacing:.1px;text-wrap:pretty}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px}
.lead{color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(20,28,34,.96);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <button class="btn ghost" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<div id="toast" class="toast">🔄 Crediti aggiornati</div>

<script>
const LS=localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const lang  = (LS.getItem('lang') || 'it').toLowerCase();
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

const I18N={
  it:{tWTF:"⚡ What the F — Risultato", tWHF:"💡 What if — Risultato",
      sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
      share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
      copied:"Copiato!", error:"[errore server]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      test:" · 🧪 TEST", resetToast:"🔄 Crediti aggiornati",
      tooMany:"Troppo traffico, riprova tra un minuto.",
      out:"Hai usato i crediti gratuiti di oggi"
  },
  en:{tWTF:"⚡ What the F — Result", tWHF:"💡 What if — Result",
      sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
      share:"📤 Share / Copy", again:"🔁 Ask another",
      copied:"Copied!", error:"[server error]",
      styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
      test:" · 🧪 TEST", resetToast:"🔄 Credits refreshed",
      tooMany:"Too many requests. Try again in a minute.",
      out:"You used today's free credits"
  }
}[lang];

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1200); }
function normalizeOneParagraph(s=""){ return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim(); }
function logEvent(name, extra={}){ try{ const payload=JSON.stringify({event:name,ts:Date.now(),extra}); navigator.sendBeacon?.("/api/track", new Blob([payload],{type:"application/json"})); }catch{} }

document.getElementById('langBtn').textContent=lang.toUpperCase();
document.getElementById('backBtn').onclick=()=>{ logEvent('fifth_back'); history.back(); };
document.getElementById('homeBtn').onclick=()=>{ logEvent('fifth_home'); location.href='index.html'; };
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };
document.getElementById('lblQ').textContent=I18N.q;
document.getElementById('lblA').textContent=I18N.a;
document.getElementById('shareBtn').textContent=I18N.share;
document.getElementById('againBtn').textContent=I18N.again;
document.getElementById('styleBadge').textContent = (style==='wtf') ? I18N.styleWTF : I18N.styleWHF;

const params=new URLSearchParams(location.search);
const isReplay = params.get('view')==='replay';
let domanda=""; let answerText="";

function setTitles(q){
  document.getElementById('title').textContent = (style==='wtf'? I18N.tWTF : I18N.tWHF);
  document.getElementById('subtitle').textContent = I18N.sub(q);
  const hasToken = !!localStorage.getItem('whatif_admin_token');
  document.getElementById('styleBadge').textContent = ((style==='wtf') ? I18N.styleWTF : I18N.styleWHF) + (hasToken ? I18N.test : "");
  const leads = {
    it:{wtf:["Respiri corto, tasche piene di chiavi e idee storte: ok, si parte.","Entri nella scena come una nota a margine che ha deciso di diventare titolo.","Hai fatto pace col caos? Perfetto: lui non l’ha fatta con te.","Due neuroni, un brindisi implicito e la testardaggine giusta: presente."],
        whatif:["Prendi fiato, appoggi le chiavi, lasci parlare il silenzio buono.","Metti in fila i pensieri: pochi, chiari, abbastanza tuoi.","La stanza è la stessa, lo sguardo è nuovo: già basta.","Tieni vicino ciò che funziona; il resto lo metti in pausa."]},
    en:{wtf:["Short breath, jangling keys, slightly tilted hope: alright, roll in.","You enter like a footnote that chose to be the headline.","Truce with chaos? Cute. Chaos didn’t sign it.","Two neurons, one implied toast, and just enough stubbornness."],
        whatif:["You set the keys down and let the good quiet speak first.","Line up your thoughts: few, clear, recognizably yours.","Same room, different gaze—that’s already movement.","Keep what works within reach; let the rest wait outside."]}
  };
  const bank = leads[lang]?.[style] || leads.it.whatif;
  document.getElementById('lead').textContent = bank[Math.floor(Math.random()*bank.length)];
}

if(isReplay){
  const r = JSON.parse(LS.getItem('replay_story')||'{}');
  domanda = r.domanda || LS.getItem('domanda') || "";
  answerText = normalizeOneParagraph(r.answer || "");
  setTitles(domanda);
  document.getElementById('qView').textContent = domanda || '—';
  document.getElementById('answer').textContent = answerText || '—';
  logEvent('page_open_fifth_replay',{stile:style, lang});
} else {
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  domanda = req.domanda || LS.getItem('domanda') || "";
  setTitles(domanda);
  document.getElementById('qView').textContent = domanda || '—';

  (async ()=>{
    // headers comuni
    const headers = { "Content-Type":"application/json" };

    // se siamo in TEST, allega token e bypass, e resetta
    const adminToken = localStorage.getItem('whatif_admin_token');
    if (adminToken) {
      headers['x-admin-token'] = adminToken;
      headers['x-pro'] = '1';
      try{
        await fetch("/api/reset", { method:"POST", headers });
        toast(I18N.resetToast);
      }catch{}
    }

    // tracking non bloccante
    navigator.sendBeacon?.("/api/track") || fetch("/api/track",{method:"POST",keepalive:true}).catch(()=>{});

    try{
      const r = await fetch("/api/ask",{
        method:"POST",
        headers,
        body:JSON.stringify({ domanda, lang, stile:style, extra:"", micro:req.micro||{} })
      });

      if(r.status===429){ document.getElementById('answer').textContent = I18N.tooMany; logEvent('ask_429'); return; }
      if(r.status===402){
        const d=await r.json().catch(()=>({}));
        const used = d?.used ?? "?";
        document.getElementById('answer').textContent = `${I18N.out} (${used}/3).`;
        logEvent('ask_402',{used});
        return;
      }

      const data = await r.json();
      if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");
      answerText = normalizeOneParagraph(data.answer||"");
      document.getElementById('answer').textContent = answerText;

      const hist = JSON.parse(LS.getItem('cronologia')||'[]');
      hist.push({ domanda, risposta:answerText, stile:style, ts:Date.now() });
      LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
      logEvent('ask_ok',{model:data?.model, admin:data?.admin});
    }catch(e){
      document.getElementById('answer').textContent = I18N.error;
      console.error(e);
      logEvent('ask_error',{message:String(e?.message||e)});
    }
  })();
}

document.getElementById('shareBtn').onclick=async()=>{
  const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n\nQ: ${domanda}\n\n${normalizeOneParagraph(answerText)}`;
  try{
    if(navigator.share){
      await navigator.share({ title: "What?f", text: full });
    }else{
      await navigator.clipboard.writeText(full);
      const b=document.getElementById('shareBtn');
      b.textContent = I18N.copied; setTimeout(()=>b.textContent=I18N.share,1200);
    }
    logEvent('share_click');
  }catch{ logEvent('share_cancel'); }
};
document.getElementById('againBtn').onclick=()=>{ logEvent('again_click'); location.href='fourth.html'; };

// init track
logEvent('page_open_fifth',{stile:style, lang, test: !!localStorage.getItem('whatif_admin_token')});
</script>
</body>
</html>
