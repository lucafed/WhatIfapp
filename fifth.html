<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Result</title>
<meta name="theme-color" content="#05080C" />
<style>
  :root{
    --bg1:#05080C; --bg2:#0E1821; --text:#EAF3F7; --muted:#92A9B5;
    --card:rgba(16,26,34,.56); --line:rgba(85,140,168,.25);
    --chip:#0E1A23; --ink:#001A1F;
    --acc:#00E0FF; --acc2:#00B5CC; --glow:rgba(0,224,255,.35);
  }
  body[data-theme="wtf"]{ --acc:#FF63E3; --acc2:#8A5BFF; --glow:rgba(255,99,227,.35); --line:rgba(178,120,255,.28); --chip:#16122A; --ink:#170021; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg1);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(1200px 800px at 12% -8%, var(--acc)10%, transparent 60%),
      radial-gradient(1100px 780px at 88% 108%, var(--acc2)12%, transparent 62%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    filter:saturate(120%) brightness(105%);
  }
  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{appearance:none;border:none;background:var(--chip);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 10px 28px var(--glow)}
  .btn.ghost{background:transparent}
  .btn.large{padding:14px 18px;font-size:16px}
  .chip{background:var(--chip);border:1px solid var(--line);color:#cfe3e7;border-radius:999px;padding:8px 12px;font-size:13px}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;box-shadow:0 0 0 1px var(--glow) inset}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#cfe3e7;user-select:none}
  h1{font-size:clamp(22px,5vw,30px);margin:14px 0 2px;color:var(--acc)}
  p.sub{color:var(--muted);margin:0 0 10px}
  .card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .box{background:rgba(11,18,24,.75);border:1px solid rgba(24,36,44,.85);border-radius:12px;padding:12px;white-space:pre-wrap;line-height:1.6}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .actions-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  #result{min-height:190px}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,#0d151c 0%,#122029 50%,#0d151c 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  /* avatar */
  .ai-pulse{width:28px;height:28px;border-radius:999px;background:radial-gradient(circle at 35% 35%, #fff, #eee 30%, transparent 31%), radial-gradient(circle at 50% 50%, var(--acc), var(--acc2));box-shadow:0 0 18px var(--glow), 0 0 4px var(--glow) inset;animation:breath 2.6s ease-in-out infinite}
  @keyframes breath{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  /* knowledge mini */
  .know-mini{display:flex;align-items:center;gap:8px}
  .meter{position:relative;height:10px;background:#0f1820;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:120px}
  .meter-fill{height:100%;width:0;background:linear-gradient(180deg,var(--acc),var(--acc2))}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="row">
      <div class="ai-pulse" title="What?f AI"></div>
      <button class="btn ghost" id="backBtnTop">←</button>
      <button class="btn ghost" id="homeBtnTop">🏠</button>
    </div>
    <div class="row">
      <span id="freeBadge" class="badge">—</span>
      <span id="clarifyBadge" class="badge">—</span>
      <div class="know-mini">
        <span style="font-weight:800;color:var(--acc)">Personalizzazione</span>
        <div class="meter"><div id="knowFill" class="meter-fill"></div></div>
        <span class="badge" id="knowValueMini">0/100</span>
      </div>
    </div>
  </div>

  <h1>Il tuo scenario</h1>
  <p class="sub">Per una risposta più personale, usa prima Chiarisci & genera.</p>

  <!-- stile + periodo -->
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row">
        <span class="badge" id="badgePeriodo">🕰️ —</span>
        <span class="badge" id="badgeStile">🎭 —</span>
      </div>
      <div class="row">
        <button class="chip" data-style="whatif" id="chipWhatIf">What if</button>
        <button class="chip" data-style="wtf" id="chipWTF">WTF</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="label">Domanda</h3>
    <div id="question" class="box"></div>

    <!-- Segnali -->
    <div style="margin-top:6px;color:#cfe3e7;font-size:12px" id="signalsLine">Segnali usati oggi: <span id="signalsBody"></span></div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary large" id="clarifyBtn">✨ Chiarisci & genera</button>
      <button class="btn large" id="genBtn">Genera subito</button>
    </div>

    <!-- azioni SEMPRE visibili -->
    <div class="actions-inline">
      <button class="btn" id="regenBtn" style="display:none">🔁 Rigenera</button>
      <button class="btn" id="saveBtn">💾 Salva</button>
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="shareBtn">📤 Condividi</button>
    </div>
  </div>

  <div class="card">
    <h3 class="label">Risultato</h3>
    <div id="result" class="box">—</div>
  </div>
</main>

<script>
const LS=localStorage;
const $=id=>document.getElementById(id);
function readJSON(k,def={}){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v));}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeHTML(s){return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* tema “porte” */
(function(){ try{ const p=readJSON('whatif_prefs',{}); document.body.setAttribute('data-theme', p.stile==='wtf'?'wtf':'whatif'); }catch(_){}})();

/* limiti free/clarify */
const DAILY_FREE=3, DAILY_CLARIFY=5;
function readCredits(){const v=readJSON('whatif_credits');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0,pro:!!v.pro};return v;}
function writeCredits(v){writeJSON('whatif_credits',v);renderBadges();}
function readClarify(){const v=readJSON('whatif_clarify');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0};return v;}
function writeClarify(v){writeJSON('whatif_clarify',v);renderBadges();}
function renderBadges(){
  const gc=readCredits(); const gl=Math.max(0,DAILY_FREE-(gc.used||0));
  $('freeBadge').textContent=`Free oggi: ${gl}/${DAILY_FREE}`;
  const cc=readClarify(); const cl=Math.max(0,DAILY_CLARIFY-(cc.used||0));
  $('clarifyBadge').textContent=`Chiarimenti: ${cl}/${DAILY_CLARIFY}`;
}

/* knowledge mini */
function computeKnowledge(){
  const profile=readJSON('whatif_profile',{}); const micro=readJSON('whatif_micro',{}); const clar=readJSON('whatif_clarify',{date:null,used:0});
  const microLog=readJSON('whatif_micro_log',[]); const today=todayStr();
  let score=0;
  if(profile.name||profile.role) score+=10;
  if(profile.city) score+=8;
  if(micro.indicatore) score+=10;
  if(micro.vincolo_2w) score+=8;
  if(profile.goal) score+=8;
  if(micro.punto_riferimento) score+=8;
  if(clar.date===today && clar.used>0) score+=8;
  score+=Math.min(10, microLog.length); // continuità
  return Math.max(0, Math.min(100, score));
}
function renderKnowledge(){ const s=computeKnowledge(); $('knowFill').style.width=`${s}%`; $('knowValueMini').textContent=`${s}/100`; }

/* stato domanda + prefs */
const prefs=readJSON('whatif_prefs',{periodo:'future',stile:'whatif'});
let domanda=LS.getItem('domanda')||'';
if(!domanda){ alert('Nessuna domanda trovata.'); location.href='fourth.html'; }
$('question').textContent=domanda;
$('badgePeriodo').textContent='🕰️ '+(prefs.periodo==='past'?'Passato':'Futuro');
$('badgeStile').textContent='🎭 '+(prefs.stile==='wtf'?'What the F':'What if');
document.body.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');
document.querySelectorAll('[data-style]').forEach(b=> b.classList.toggle('sel', b.dataset.style===prefs.stile));

/* switch stile */
document.getElementById('chipWhatIf').addEventListener('click', ()=> setStyle('whatif'));
document.getElementById('chipWTF').addEventListener('click', ()=> setStyle('wtf'));
function setStyle(s){
  prefs.stile=s; writeJSON('whatif_prefs',prefs);
  document.body.setAttribute('data-theme', s==='wtf'?'wtf':'whatif');
  $('badgeStile').textContent='🎭 '+(s==='wtf'?'What the F':'What if');
  document.querySelectorAll('[data-style]').forEach(b=> b.classList.toggle('sel', b.dataset.style===s));
}

/* segnali */
function summarizeSignals(clarUsed={}){
  const p=readJSON('whatif_profile',{}); const m=readJSON('whatif_micro',{}); const out=[];
  if(p.city) out.push(`città: ${p.city}`);
  if(p.role) out.push(`ruolo: ${p.role}`);
  if(p.goal) out.push(`obiettivo: ${p.goal}`);
  if(m.indicatore) out.push(`indicatore: ${m.indicatore}`);
  if(m.vincolo_2w) out.push(`vincolo: ${m.vincolo_2w}`);
  if(m.punto_riferimento) out.push(`luogo/persona: ${m.punto_riferimento}`);
  Object.entries(clarUsed).forEach(([k,v])=>{ const vv=String(v).trim(); if(vv) out.push(`${k}: ${vv}`); });
  return out.join(' · ');
}
$('signalsBody').textContent = summarizeSignals({});

/* API helpers */
async function callClarifyAPI(){
  const payload={ domanda, lang:(LS.getItem('lang')||'it'), periodo:prefs.periodo, stile:prefs.stile, clarify:true, profilo:readJSON('whatif_profile',{}), micro:readJSON('whatif_micro',{}) };
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('server');
  return r.json();
}
async function callGenerateStream({clarifications={},extra=""}={}){
  const payload={ domanda, lang:(LS.getItem('lang')||'it'), periodo:prefs.periodo, stile:prefs.stile, clarify:false, stream:true, profilo:readJSON('whatif_profile',{}), micro:readJSON('whatif_micro',{}), clarifications, extra };
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','x-whatif-stream':'1'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('server');
  return r.body.getReader();
}

/* WebAudio chime */
function chime(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(); o1.type='sine';o2.type='sine'; const t=ctx.currentTime; o1.frequency.setValueAtTime(880,t);o2.frequency.setValueAtTime(1320,t); g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.08,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45); o1.connect(g);o2.connect(g);g.connect(ctx.destination); o1.start(t);o2.start(t);o1.stop(t+0.5);o2.stop(t+0.5);}catch(_){}} 

/* chiarimenti */
document.getElementById('clarifyBtn').addEventListener('click', openClarify);
async function openClarify(){
  const c=readClarify(); if((c.used||0)>=DAILY_CLARIFY){ alert('Limite chiarimenti di oggi raggiunto.'); return; }
  document.getElementById('result').textContent='Preparando 2–3 domande…';
  try{
    const j=await callClarifyAPI();
    c.used=(c.used||0)+1; writeClarify(c);
    const qs=Array.isArray(j.questions)?j.questions.slice(0,3):[];
    const answers={};
    for(const q of qs){
      const a = prompt(q.label||'Dettaglio', q.placeholder||'');
      if(a && q.id) answers[q.id]=a;
    }
    $('signalsBody').textContent = summarizeSignals(answers);
    generate(false,answers);
  }catch(_){
    generate();
  }
}

/* genera */
document.getElementById('genBtn').addEventListener('click', ()=> generate());
document.getElementById('regenBtn').addEventListener('click', ()=> generate(true));

async function generate(isRegen=false, clarOverride=null){
  const cred=readCredits();
  if(!isRegen && (cred.used||0)>=DAILY_FREE){ alert('Hai raggiunto il limite gratuito di oggi.'); return; }
  const resEl=$('result'); resEl.textContent='⏳ Sto generando… '; const sk=document.createElement('span'); sk.className='skeleton'; sk.style.width='40%'; resEl.appendChild(sk);
  $('regenBtn').style.display='none';

  try{
    const reader=await callGenerateStream({clarifications:(clarOverride||{})});
    const decoder=new TextDecoder(); let buffer="", text="";
    while(true){
      const {value,done}=await reader.read(); if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const chunks=buffer.split("\n\n"); buffer=chunks.pop();
      for(const chunk of chunks){
        if(!chunk.startsWith("data: ")) continue;
        const data=JSON.parse(chunk.slice(6));
        if(data.token){ text+=data.token; resEl.textContent=text; }
        if(data.done){
          resEl.textContent=(text||"").trim();
          $('regenBtn').style.display='inline-block';
          chime(); 
        }
        if(data.error){ resEl.textContent='Errore server.'; }
      }
    }
    cred.used=(cred.used||0)+1; writeCredits(cred);
    renderKnowledge();
  }catch(e){
    resEl.textContent='Errore di rete.';
  }
}

/* azioni */
$('saveBtn').addEventListener('click', ()=>{
  const arr=readJSON('cronologia',[]);
  arr.unshift({ domanda, risposta:($('result').textContent||'').trim(), periodo:prefs.periodo, stile:prefs.stile, lang:(LS.getItem('lang')||'it'), ts:Date.now() });
  writeJSON('cronologia',arr);
  alert('Salvato!');
});
$('copyBtn').addEventListener('click', ()=>{
  navigator.clipboard.writeText(`Domanda: ${domanda}\n\n${$('result').textContent}`).then(()=> alert('Copiato!'));
});
$('shareBtn').addEventListener('click', ()=>{
  const data={title:'What?f',text:`Domanda: ${domanda}\n\n${$('result').textContent}`,url:location.href};
  if(navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(`${data.title}\n${data.text}`);
});

/* nav */
$('backBtnTop').addEventListener('click', ()=> history.back());
$('homeBtnTop').addEventListener('click', ()=> location.href='index.html');

/* avvio */
renderBadges(); renderKnowledge();
$('signalsBody').textContent = summarizeSignals({});
</script>
</body>
</html>
