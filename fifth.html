<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; /* whatif */
  --wtf1:#3A6B56; --wtf2:#5A8C75; /* wtf */
  --ink:#0A0E12; --line:rgba(255,255,255,.12);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(800px 600px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:840px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{background:rgba(20,28,34,.9);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.story{white-space:pre-wrap;line-height:1.65;font-size:18px;letter-spacing:.1px}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:33%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}
.btn.danger{background:#4B1E24;border:1px solid #6b2a33}
textarea{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);font-size:16px}
.small{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
details>summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.summary-head{display:flex;align-items:center;justify-content:space-between}
.caret{transition:.15s transform}
details[open] .caret{transform:rotate(90deg)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#BBC9CF}
</style>
</head>
<body>
<main>
  <h1 id="title">Episodio</h1>
  <p class="sub" id="subtitle">—</p>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="card">
    <div id="answer" class="story">⏳ Genero la storia...</div>
  </div>

  <div class="card" id="followCard" style="display:none">
    <h3 id="followTitle">Domande per domani</h3>
    <div id="followList" class="story" style="font-size:16px"></div>
    <div class="sep"></div>
    <textarea id="customFollow" rows="3" placeholder="Aggiungi una tua riflessione o una domanda..."></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <button class="btn ghost" id="homeBtn">🏠 Home</button>
    </div>
    <p class="small" id="saveInfo"></p>
  </div>

  <div class="card" id="timelineCard" style="display:none">
    <details open>
      <summary class="summary-head">
        <h3 style="margin:0" id="timelineTitle">Rivedi tutta la storia</h3>
        <span class="caret">▶</span>
      </summary>
      <div id="timeline" class="story" style="margin-top:10px"></div>
    </details>
  </div>

  <p class="small code" id="debug" style="text-align:center;opacity:.7"></p>
</main>

<script>
/* ===== LS helpers ===== */
const LS=localStorage;
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
function $(id){return document.getElementById(id)}

/* ===== State ===== */
const domanda = LS.getItem('domanda') || "E se tornassi a vivere all’Aquila?";
const prefs = readJSON('whatif_prefs',{});
const style = prefs.stile || 'whatif';
const lang = (LS.getItem('lang')||'it').toLowerCase();
const resumeId = LS.getItem('resume_id') || null;
const resumeMode = LS.getItem('resume_mode') || null;
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* ===== I18N ===== */
const T = {
  it:{
    titleWTF:(n)=>`⚡ What the F — Episodio ${n} di 3`,
    titleWHF:(n)=>`💡 What?f — Episodio ${n} di 3`,
    sub:(q)=>`Domanda: “${q}”`,
    follow:"Domande per domani",
    saved:"✅ Salvato per domani.",
    placeholder:"Aggiungi una tua riflessione o una domanda...",
    error:"Errore nel generare la storia.",
    timeline:"Rivedi tutta la storia",
    reviewEmpty:"— Nessun episodio precedente.",
  },
  en:{
    titleWTF:(n)=>`⚡ What the F — Episode ${n} of 3`,
    titleWHF:(n)=>`💡 What?f — Episode ${n} of 3`,
    sub:(q)=>`Question: “${q}”`,
    follow:"Questions for tomorrow",
    saved:"✅ Saved for tomorrow.",
    placeholder:"Add your note or a question...",
    error:"Error while generating the story.",
    timeline:"Review the whole story",
    reviewEmpty:"— No previous episodes.",
  }
}[lang];

/* ===== UI text ===== */
$('followTitle').textContent = T.follow;
$('customFollow').placeholder = T.placeholder;

/* ===== Helpers ===== */
function nowId(){ return Date.now(); }
function groupByThread(arr){
  const out={};
  arr.forEach(it=>{
    const key = it.threadId || ('Q::'+(it.domanda||''));
    (out[key]||(out[key]=[])).push(it);
  });
  return out;
}
function titleFor(n){ return (style==='wtf'? T.titleWTF(n):T.titleWHF(n)); }

/* ===== Boot logic ===== */
(async function boot(){
  $('subtitle').textContent = T.sub(domanda);

  const hist = readJSON('cronologia',[]);
  let resumeItem = null;

  if(resumeId){
    resumeItem = hist.find(x => String(x.id||x.ts)===String(resumeId));
  }

  // Modalità REPLAY (Rivedi tutta la storia)
  if(resumeItem && resumeMode==='review'){
    const group = groupByThread(hist)[resumeItem.threadId || ('Q::'+resumeItem.domanda)] || [];
    group.sort((a,b)=>(a.episode||1)-(b.episode||1));
    const n = (group[group.length-1]?.episode)||1;
    $('title').textContent = titleFor(n);
    $('answer').textContent = (group[group.length-1]?.risposta)||T.error;

    renderTimeline(group);
    await buildFollowUps(domanda, group[group.length-1]?.risposta || "");
    return;
  }

  // Modalità CONTINUE (continua episodio se <3)
  if(resumeItem && resumeMode==='continue'){
    const group = groupByThread(hist)[resumeItem.threadId || ('Q::'+resumeItem.domanda)] || [];
    group.sort((a,b)=>(a.episode||1)-(b.episode||1));
    const last = group[group.length-1];
    const nextEp = Math.min(3, (last?.episode||1)+1);
    if((last?.episode||1) >= 3){
      // niente più continuazioni → replay finale
      $('title').textContent = titleFor(last.episode||3);
      $('answer').textContent = last.risposta || T.error;
      renderTimeline(group);
      await buildFollowUps(domanda, last.risposta || "");
      return;
    }
    await generateContinuation(last, nextEp);
    const after = readJSON('cronologia',[]);
    const group2 = groupByThread(after)[last.threadId || ('Q::'+last.domanda)] || [];
    group2.sort((a,b)=>(a.episode||1)-(b.episode||1));
    renderTimeline(group2);
    return;
  }

  // Modalità NUOVA STORIA
  await generateNew();
  const after = readJSON('cronologia',[]);
  // prendi l’ultimo thread per questa domanda
  const candidates = after.filter(x=>x.domanda===domanda);
  candidates.sort((a,b)=> (b.ts||0)-(a.ts||0));
  const threadId = candidates[0]?.threadId;
  const group = groupByThread(after)[threadId || ('Q::'+domanda)] || [];
  group.sort((a,b)=>(a.episode||1)-(b.episode||1));
  renderTimeline(group);
})();

/* ===== Render Timeline ===== */
function renderTimeline(list){
  const box=$('timeline'); const card=$('timelineCard');
  $('timelineTitle').textContent = T.timeline;
  if(!list || !list.length){ box.textContent = T.reviewEmpty; card.style.display='block'; return; }
  box.innerHTML = list.map(it=>{
    const head = (style==='wtf'?'⚡':'💡') + ' ' + (lang==='en'?'Episode':'Episodio') + ' ' + (it.episode||1);
    return `${head}\n${it.risposta}\n`;
  }).join('\n' + '— — — — — — — — — —' + '\n');
  card.style.display='block';
}

/* ===== Generate new story (episode 1) ===== */
async function generateNew(){
  try{
    $('title').textContent = titleFor(1);
    $('answer').textContent = "⏳ Genero l’episodio 1…";

    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ domanda, lang, stile:style })
    });
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");

    const answer = (data.answer||"").trim();
    $('answer').textContent = answer;

    // crea threadId nuovo
    const threadId = nowId();
    const hist = readJSON('cronologia',[]);
    const id = nowId();
    hist.unshift({
      id, domanda, risposta: answer, stile: style, lang, ts: id,
      episode: 1, threadId
    });
    writeJSON('cronologia', hist.slice(0,50));

    await buildFollowUps(domanda, answer);
  }catch(err){
    $('answer').textContent = T.error;
    console.error(err);
  }
}

/* ===== Generate continuation (episode N) ===== */
async function generateContinuation(item, nextEpisode){
  try{
    $('title').textContent = titleFor(nextEpisode);
    $('answer').textContent = "⏳ Continuo la storia…";

    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        domanda: item.domanda,
        lang, stile: item.stile,
        // non tocchiamo ask.js: usiamo il contesto nel prompt “follow” separato
      })
    });
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail||"bad_response");

    const answer = (data.answer||"").trim();
    $('answer').textContent = answer;

    const hist = readJSON('cronologia',[]);
    const id = nowId();
    hist.unshift({
      id, domanda: item.domanda, risposta: answer, stile: item.stile, lang, ts: id,
      episode: nextEpisode, threadId: (item.threadId || ('Q::'+item.domanda))
    });
    writeJSON('cronologia', hist.slice(0,50));

    await buildFollowUps(item.domanda, answer);
  }catch(e){
    $('answer').textContent = T.error;
    console.error(e);
  }
}

/* ===== Follow-ups via API ===== */
async function buildFollowUps(q, answerText){
  const followCard = $('followCard');
  const list = $('followList');
  list.textContent = (lang==='en'?"⏳ Creating 2 smart questions for tomorrow…":"⏳ Creo 2 domande intelligenti per domani…");

  try{
    const rr = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        domanda:q, lang, stile: style,
        follow: true, answer: answerText
      })
    });
    const dj = await rr.json();
    const arr = Array.isArray(dj.followups) ? dj.followups.slice(0,2) : [];
    list.innerHTML = arr.length
      ? arr.map(q => `• ${q}`).join("\n")
      : (style==='wtf'
          ? "• Quanto reggi prima di cercare il Wi-Fi?\n• Ti senti vivo o solo più congelato?"
          : "• Cosa ti sorprende davvero del silenzio?\n• Cosa cambierebbe se restassi davvero?");

    // Rendi ciascun follow-up cliccabile per “usa adesso”
    list.innerHTML = list.innerHTML
      .split("\n")
      .map(line=>{
        const pure = line.replace(/^•\s*/,'').trim().replace(/"/g,'&quot;');
        return `<div style="margin:.2rem 0"><button class="btn ghost" onclick="useFollow('${pure}')">${line}</button></div>`;
      }).join("");
  }catch(e){
    console.error("followups error", e);
    list.innerHTML = (style==='wtf'
      ? "• Quanto reggi prima di cercare il Wi-Fi?\n• Ti senti vivo o solo più congelato?"
      : "• Cosa ti sorprende davvero del silenzio?\n• Cosa cambierebbe se restassi davvero?");
  }
  followCard.style.display = 'block';
}

/* ===== “Usa adesso” follow-up ===== */
function useFollow(text){
  LS.setItem('domanda', text);
  // nuova domanda ⇒ nuovo thread
  LS.removeItem('resume_id'); LS.removeItem('resume_mode');
  location.href='fifth.html';
}

/* ===== Save “per domani” ===== */
$('saveBtn').onclick = ()=>{
  const extra = ($('customFollow').value||"").trim();
  const saved = readJSON('next_prompts',[]);
  saved.unshift({ q: domanda, note: extra, stile: style, lang, ts: Date.now() });
  writeJSON('next_prompts', saved.slice(0,50));
  $('saveInfo').textContent = T.saved;
};

/* ===== Home ===== */
$('homeBtn').onclick = ()=> location.href = 'index.html';

/* ===== Debug (facoltativo) ===== */
$('debug').textContent = `lang=${lang} · style=${style} · mode=${resumeMode||'new'}`;
</script>
</body>
</html>
