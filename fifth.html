<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risultato</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
    --acc:#1C57A0; --acc2:#FFEC01;
    --chip:#121A26; --line:rgba(255,255,255,.12); --ink:#0A0E12;
    --card:rgba(20,28,34,.92); --shadow:rgba(0,0,0,.35);
  }
  html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:980px;margin:auto;padding:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
  h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .qbox{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:16px;font-size:17px;line-height:1.6}
  .abox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;white-space:pre-wrap;font-size:17px;line-height:1.7}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .input{width:100%;background:rgba(255,255,255,.06);color:#EAF3EE;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-top:8px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="styleBadge">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Il tuo What?f</h1>

  <div class="card">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <div id="qBox" class="qbox">—</div>
  </div>

  <div class="card">
    <h3 class="label" id="rLabel">Risultato</h3>
    <div id="ansBox" class="abox">⏳ …</div>
  </div>

  <div class="card" id="followArea">
    <!-- verrà riempita via JS -->
  </div>
</main>

<script>
const LS = localStorage;
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def))}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v))}
const prefs=readJSON('whatif_prefs',{stile:'whatif',pro:false});
let lang=(LS.getItem('lang')||'it').toLowerCase();
const isEn=lang.startsWith('en');

const TXT = {
  it:{ title:"Il tuo What?f", q:"La tua domanda", r:"Risultato",
       cont:"Domani continuiamo da qui", suggest:"Suggerimenti di follow-up", or:"oppure",
       ph:"Scrivi tu un follow-up…", save:"Salva per domani", saved:"Salvato per domani",
       styleWhatIf:"🎭 What if", styleWTF:"🎭 What the F",
       back:"Indietro", home:"Home", err:"Problema server" },
  en:{ title:"Your What?f", q:"Your question", r:"Result",
       cont:"Tomorrow we continue from here", suggest:"Follow-up suggestions", or:"or",
       ph:"Write your own follow-up…", save:"Save for tomorrow", saved:"Saved for tomorrow",
       styleWhatIf:"🎭 What if", styleWTF:"🎭 What the F",
       back:"Back", home:"Home", err:"Server error" }
}[isEn?'en':'it'];

const domanda = LS.getItem('domanda')||'';
const stile = prefs.stile||'whatif';
const clarify = readJSON('whatif_clarify_buffer',{q:'',extra:'',periodo:'future'});

/* mount text */
document.getElementById('titleH1').textContent=TXT.title;
document.getElementById('qLabel').textContent=TXT.q;
document.getElementById('rLabel').textContent=TXT.r;
document.getElementById('qBox').textContent=domanda||'—';
document.getElementById('styleBadge').textContent = (stile==='wtf'?TXT.styleWTF:TXT.styleWhatIf);
document.getElementById('langBtn').textContent = (isEn?'EN':'IT');
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang', isEn?'it':'en'); location.reload(); };
document.documentElement.setAttribute('data-theme', stile==='wtf'?'wtf':'whatif');

/* call API */
async function fetchAnswer(){
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      domanda, lang:(isEn?'en':'it'), stile, periodo: clarify.periodo||'future',
      profilo: readJSON('profilo',{}), extra: clarify.extra||""
    })});
    const j=await r.json();
    if(!r.ok) throw new Error(j?.detail||'err');
    const text = (j.answer||'').trim() || '—';
    document.getElementById('ansBox').textContent = text;

    // salva cronologia minima
    const hist = readJSON('cronologia',[]);
    hist.push({ ts:Date.now(), domanda, stile, lang:(isEn?'en':'it') });
    writeJSON('cronologia', hist);

    renderFollowups(domanda, text);
  }catch(e){
    document.getElementById('ansBox').textContent = TXT.err;
  }
}

/* topic + followups */
function topicOf(q=''){
  const s=(q||'').toLowerCase();
  if (/(aquila|l'aquila|verona|milano|roma|lugano|move|relocat|tornare|trasferir)/.test(s)) return 'move';
  if (/(bar|pub|locale|caff[eè]|aprire)/.test(s)) return 'bar';
  if (/(moto|motor(e|bike)|auto|car|scooter|vespa)/.test(s)) return 'vehicle';
  if (/(lavoro|job|career|ufficio|azienda)/.test(s)) return 'work';
  return 'generic';
}
function followupFor(topic){
  const it={ move:[
      "Qual è il primo segnale che ti direbbe che la scelta sta funzionando?",
      "Quale prova minima puoi fare entro 7 giorni senza rischiare troppo?"
    ], bar:[
      "Chi sarebbe il primo cliente ideale e come lo attireresti?",
      "Quale test piccolo puoi fare questo mese per validare l’idea?"
    ], vehicle:[
      "Per cosa useresti davvero il mezzo nei prossimi 3 mesi?",
      "Qual è il tetto di spesa mensile sostenibile (assicurazione/energia/manutenzione)?"
    ], work:[
      "In una frase: qual è il tuo perché adesso?",
      "Qual è l’ostacolo più concreto nelle prossime 2 settimane?"
    ], generic:[
      "Qual è il primo segnale che direbbe: sto andando bene?",
      "Quale micro-azione puoi fare entro 7 giorni?"
    ]};
  const en={ move:[
      "What’s the first sign it’s actually working for you?",
      "What small, low-risk test can you run in 7 days?"
    ], bar:[
      "Who’s your first ideal customer and how would you attract them?",
      "What tiny test can you run this month to validate the idea?"
    ], vehicle:[
      "What would you really use it for in the next 3 months?",
      "What’s a sustainable monthly ceiling (insurance/energy/maintenance)?"
    ], work:[
      "In one line: what’s your current *why*?",
      "What’s the most concrete constraint in the next 2 weeks?"
    ], generic:[
      "What’s the first sign that says: this is working?",
      "What micro-action can you do within 7 days?"
    ]};
  return (isEn?en:it)[topic] || (isEn?en.generic:it.generic);
}
function renderFollowups(q, answer){
  const topic = topicOf(q+' '+(answer||''));
  const [s1,s2] = followupFor(topic);
  const area = document.getElementById('followArea');
  area.innerHTML = `
    <h3 class="label">${TXT.cont}</h3>
    <div class="chips" style="margin-bottom:8px">
      <button class="chip" id="fu1">${s1}</button>
      <button class="chip" id="fu2">${s2}</button>
    </div>
    <div class="label" style="margin-top:6px">${TXT.suggest} • ${TXT.or}</div>
    <input id="fuInput" class="input" placeholder="${TXT.ph}">
    <div class="row" style="margin-top:8px;justify-content:flex-end">
      <button class="btn" id="fuSave">${TXT.save}</button>
    </div>
  `;
  const queueKey='followup_queue';
  function saveFollowup(text){
    const q = readJSON(queueKey,[]);
    q.push({ ts:Date.now(), base:domanda, text, stile, lang:(isEn?'en':'it') });
    writeJSON(queueKey,q);
    toast(TXT.saved);
  }
  document.getElementById('fu1').onclick=()=>saveFollowup(s1);
  document.getElementById('fu2').onclick=()=>saveFollowup(s2);
  document.getElementById('fuSave').onclick=()=>{ const t=(document.getElementById('fuInput').value||'').trim(); if(t) saveFollowup(t); };
}

/* toast */
function toast(msg){ const t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);z-index:9999'; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); }

/* go */
fetchAnswer();
</script>
</body>
</html>
