<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Result</title>
<meta name="theme-color" content="#05080C" />
<style>
  :root{
    --bg1:#05080C; --bg2:#0E1821;
    --card-bg:rgba(16,26,34,.56);
    --card-line:rgba(85,140,168,.25);
    --text:#EAF3F7; --muted:#92A9B5;
    --chip:#0E1A23; --ink:#001a1f;
    --acc:#39E4FF; --acc2:#0FC2E1;
    --glow:rgba(57,228,255,.35);
    --shadow:0 14px 36px rgba(0,0,0,.35);
  }
  body[data-theme="wtf"]{
    --acc:#FF63E3; --acc2:#8A5BFF;
    --glow:rgba(255,99,227,.35);
    --card-line:rgba(178,120,255,.28);
    --chip:#16122A; --ink:#170021;
  }

  *{box-sizing:border-box}
  html,body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg1);}

  /* sfondo orbitale */
  body::before, body::after{
    content:""; position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(1200px 800px at 10% -10%, rgba(63,146,255,.15), transparent 60%),
      radial-gradient(1000px 700px at 90% 110%, rgba(57,228,255,.12), transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
  }
  @keyframes drift { 0%{transform:translateY(0)} 50%{transform:translateY(7px)} 100%{transform:translateY(0)} }
  body::before{animation:drift 16s ease-in-out infinite}

  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

  /* cards vetrose */
  .card{
    background:var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border:1px solid var(--card-line);
    border-radius:18px; padding:18px; margin:14px 0; box-shadow:var(--shadow);
    position:relative;           /* FIX menu */
    overflow:visible;            /* FIX menu */
  }

  h1{font-size:clamp(22px,5vw,30px);margin:14px 0 2px}
  p.sub{color:var(--muted);margin:0 0 8px}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px;letter-spacing:.2px}
  .box{background:rgba(11,18,24,.75);border:1px solid rgba(24,36,44,.85);border-radius:12px;padding:12px;white-space:pre-wrap;line-height:1.6}

  .btn{appearance:none;border:none;background:var(--chip);color:var(--text);
    padding:10px 14px;border-radius:12px;cursor:pointer;
    transition:transform .06s ease, opacity .2s, box-shadow .2s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink); font-weight:800;
    box-shadow:0 0 0 1px var(--glow) inset, 0 10px 28px var(--glow)
  }
  .btn.ghost{background:transparent;border:1px solid rgba(27,42,52,.8)}
  .btn.large{padding:14px 18px;font-size:16px}
  .btn.icon{padding:8px 10px;border-radius:10px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid rgba(27,42,52,.75);color:#cfe3e7;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;box-shadow:0 0 0 1px var(--glow) inset}

  .badge{background:var(--chip);border:1px solid rgba(27,42,52,.75);border-radius:999px;padding:6px 10px;font-size:12px;color:#cfe3e7;user-select:none}
  .badge.accent{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);border:none;font-weight:800}

  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

  /* CTA / menu */
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .cta-row .btn.primary{flex:1}

  .menu{ position:relative; z-index:50; }       /* FIX menu layer */
  .menu-btn{min-width:44px}
  .menu-sheet{
    position:absolute;right:0;top:48px;         /* +6px spacing */
    background:var(--card-bg);border:1px solid var(--card-line);
    border-radius:12px;padding:6px;display:none;min-width:200px;
    box-shadow:0 12px 28px rgba(0,0,0,.35);z-index:5000; /* FIX z-index */
  }
  .menu-sheet button{display:block;width:100%;text-align:left;background:transparent;border:none;color:#E6F2F5;padding:10px;border-radius:10px;cursor:pointer}
  .menu-sheet button:hover{background:rgba(21,34,44,.65)}

  /* knowledge mini */
  .know-mini{display:flex;align-items:center;gap:8px}
  .meter{position:relative;height:10px;background:#0f1820;border:1px solid rgba(27,42,52,.85);border-radius:999px;overflow:hidden;width:120px}
  .meter-fill{height:100%;width:0;background:linear-gradient(180deg,var(--acc),var(--acc2))}
  .know-score{font-weight:800;color:var(--acc);font-size:12px}
  .tooltip{position:relative;cursor:help}
  .tooltip:hover .tip{opacity:1;transform:translateY(0)}
  .tip{pointer-events:none;position:absolute;right:0;top:125%;background:rgba(13,22,29,.95);border:1px solid var(--card-line);color:#cfe6eb;border-radius:10px;padding:8px 10px;font-size:12px;width:260px;opacity:0;transform:translateY(-4px);transition:.15s;box-shadow:0 12px 28px rgba(0,0,0,.35)}

  /* segnali collassati */
  .signals{margin-top:8px}
  .disclosure{display:flex;align-items:center;gap:8px;color:#cfe3e7;font-size:12px;cursor:pointer}
  .caret{transition:transform .15s ease}
  .signals-body{display:none;color:#cfe3e7;opacity:.9;font-size:12px;margin-top:6px}

  #result{min-height:190px}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,#0d151c 0%,#122029 50%,#0d151c 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}

  /* overlay chiarimenti */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
  .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card-bg);border:1px solid var(--card-line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .qitem{margin:10px 0}
  .qitem label{display:block;margin:6px 0}
  .qitem input{width:100%;background:#0f1820;color:var(--text);border:1px solid rgba(27,42,52,.85);border-radius:10px;padding:10px}

  /* AI avatar */
  .ai-pulse{
    width:28px;height:28px;border-radius:999px;background:radial-gradient(circle at 35% 35%, #fff, #eee 30%, transparent 31%), radial-gradient(circle at 50% 50%, var(--acc), var(--acc2));
    box-shadow:0 0 18px var(--glow), 0 0 4px var(--glow) inset;
    animation:breath 2.6s ease-in-out infinite;
  }
  @keyframes breath{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* progress bar */
  .pbar{position:fixed;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform:scaleX(0);transform-origin:left;transition:transform .35s ease;z-index:999}
  .pbar.show{transform:scaleX(1)}
</style>
</head>
<body>
  <div id="pbar" class="pbar"></div>

  <main>
    <div class="topbar">
      <div class="row">
        <div class="ai-pulse" title="What?f AI"></div>
        <button class="btn ghost" id="backBtnTop">←</button>
        <button class="btn ghost" id="homeBtnTop">🏠</button>
      </div>
      <div class="row" style="gap:10px">
        <span id="freeBadge" class="badge" title="">—</span>
        <span id="clarifyBadge" class="badge accent" title="">—</span>

        <div class="know-mini tooltip" id="knowMini">
          <span class="know-score" id="knowLabelMini">Personalizzazione</span>
          <div class="meter"><div id="knowFill" class="meter-fill"></div></div>
          <span class="badge" id="knowValueMini">0/100</span>
          <div class="tip" id="knowTip">Più dettagli → più scenari plausibili. Compila le 3 micro-domande (seconda pagina) e usa “Chiarisci & genera”.</div>
        </div>
      </div>
    </div>

    <h1 id="titleH1">Your scenario</h1>
    <p class="sub" id="subtitle">For a more personal answer, use Clarify & Generate first.</p>

    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="row">
          <span class="badge" id="badgePeriodo">🕰️ —</span>
          <span class="badge" id="badgeStile">🎭 —</span>
        </div>
        <div class="chips" id="styleChips">
          <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistic)</button>
          <button class="chip" data-style="wtf" id="chipWTF">WTF (fun)</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="label" id="qLabel">Question</h3>
      <div id="question" class="box"></div>

      <div class="signals" id="signals">
        <div class="disclosure" id="signalsToggle">
          <span class="caret" id="caret">▸</span>
          <span id="signalsLabel">Signals used today</span>
        </div>
        <div class="signals-body" id="signalsBody"></div>
      </div>

      <div class="cta-row" style="margin-top:10px">
        <button class="btn primary large" id="clarifyBtn">✨ Clarify & Generate</button>
        <button class="btn large" id="genBtn">Generate now</button>

        <div class="menu">
          <button class="btn icon menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">⋯</button>
          <div class="menu-sheet" id="menuSheet" role="menu" aria-label="More actions">
            <button id="regenBtn" style="display:none">🔁 Regenerate</button>
            <button id="saveBtn">💾 Save</button>
            <button id="copyBtn">📋 Copy</button>
            <button id="shareBtn">📤 Share</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="label" id="rLabel">Result</h3>
      <div id="result" class="box">—</div>
    </div>
  </main>

  <div class="overlay" id="clarifyOverlay">
    <div class="sheet">
      <h3 style="margin:6px 0" id="clarifyTitle">2–3 questions to be more precise</h3>
      <div id="clarifyList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="applyClarify">Generate with these answers</button>
        <button class="btn ghost" id="cancelClarify">Cancel</button>
      </div>
    </div>
  </div>

<script>
/* I18N */
const I18N = {
  it:{
    title:"Il tuo scenario",
    subtitle:"Per una risposta più personale, usa prima Chiarisci e genera.",
    back:"Indietro", home:"Home",
    badgeFree:(l,d)=>`Free oggi: ${l}/${d}`,
    badgeClarify:(l,d)=>`Chiarimenti: ${l}/${d}`,
    badgeFreeTitle:"Pressione lunga 2s: azzera crediti · Triplo click: toggle Pro (dev)",
    badgeClarifyTitle:"Pressione lunga 2s: azzera chiarimenti di oggi",
    periodoPast:"Passato", periodoFuture:"Futuro",
    chipWhatIf:"What if (realistico)", chipWTF:"WTF (divertente)",
    qLabel:"Domanda", rLabel:"Risultato",
    clarifyBtn:"✨ Chiarisci e genera", genBtn:"Genera subito", regenBtn:"Rigenera",
    clarifyTitle:"2–3 domande per essere più precisi",
    applyClarify:"Genera con queste risposte", cancelClarify:"Annulla",
    save:"Salva", copy:"Copia", share:"Condividi",
    loading:"Sto generando…", errServer:"Problema server.", errNet:"Errore di rete.",
    limitGen:"Hai raggiunto il limite gratuito di oggi. Torna domani!",
    limitClarify:"Hai raggiunto il limite di chiarimenti per oggi. Puoi comunque generare la risposta.",
    copied:"Copiato!", saved:"Salvato!",
    know:"Personalizzazione", knowHint:"Più dettagli → più scenari plausibili. Compila le 3 micro-domande e usa “Chiarisci & genera”.",
    signalsLabel:"Segnali usati oggi",
    sig_city:"città", sig_goal:"obiettivo", sig_indicator:"indicatore", sig_constraint:"vincolo", sig_landmark:"luogo", sig_role:"ruolo"
  },
  en:{
    title:"Your scenario",
    subtitle:"For a more personal answer, use Clarify & Generate first.",
    back:"Back", home:"Home",
    badgeFree:(l,d)=>`Free today: ${l}/${d}`,
    badgeClarify:(l,d)=>`Clarify: ${l}/${d}`,
    badgeFreeTitle:"Long-press 2s: reset credits · Triple click: toggle Pro (dev)",
    badgeClarifyTitle:"Long-press 2s: reset today's clarify",
    periodoPast:"Past", periodoFuture:"Future",
    chipWhatIf:"What if (realistic)", chipWTF:"WTF (fun)",
    qLabel:"Question", rLabel:"Result",
    clarifyBtn:"✨ Clarify & Generate", genBtn:"Generate now", regenBtn:"Regenerate",
    clarifyTitle:"2–3 questions to be more precise",
    applyClarify:"Generate with these answers", cancelClarify:"Cancel",
    save:"Save", copy:"Copy", share:"Share",
    loading:"Generating…", errServer:"Server problem.", errNet:"Network error.",
    limitGen:"You’ve reached today’s free limit. Come back tomorrow!",
    limitClarify:"You’ve reached today’s clarify limit. You can still generate the answer.",
    copied:"Copied!", saved:"Saved!",
    know:"Personalization", knowHint:"More detail → more plausible scenarios. Fill today’s micro-questions and use Clarify.",
    signalsLabel:"Signals used today",
    sig_city:"city", sig_goal:"goal", sig_indicator:"indicator", sig_constraint:"constraint", sig_landmark:"place", sig_role:"role"
  }
};
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
const T=I18N[lang]||I18N.it;
document.documentElement.lang=lang;

/* Config */
const DAILY_FREE=3;
const DAILY_CLARIFY=5;

/* Helpers */
const $=id=>document.getElementById(id);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function readJSON(k,def={}){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v));}
function escapeHTML(s){return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* Credits */
function readCredits(){const v=readJSON('whatif_credits');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0,pro:!!v.pro};return v;}
function writeCredits(v){writeJSON('whatif_credits',v);renderBadges();}
function ensureCredits(){const c=readCredits();if(!c.date||c.date!==todayStr()){c.date=todayStr();c.used=0;writeCredits(c);}}

/* Clarify */
function readClarify(){const v=readJSON('whatif_clarify');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0};return v;}
function writeClarify(v){writeJSON('whatif_clarify',v);renderBadges();}
function ensureClarify(){const c=readClarify();if(!c.date||c.date!==todayStr()){c.date=todayStr();c.used=0;writeClarify(c);}}

/* Profilo / signals */
function buildProfilePayload(){
  const base = readJSON('whatif_profile');
  const micro = readJSON('whatif_micro');
  return { ...base, micro };
}
function summarizeSignals(clarUsed={}){
  const p=readJSON('whatif_profile',{}); const m=readJSON('whatif_micro',{}); const parts=[];
  if (p.city) parts.push(`${T.sig_city}: ${p.city}`);
  if (p.goal) parts.push(`${T.sig_goal}: ${p.goal}`);
  if (m.indicatore) parts.push(`${T.sig_indicator}: ${m.indicatore}`);
  if (m.vincolo_2w) parts.push(`${T.sig_constraint}: ${m.vincolo_2w}`);
  if (m.punto_riferimento) parts.push(`${T.sig_landmark}: ${m.punto_riferimento}`);
  if (p.role) parts.push(`${T.sig_role}: ${p.role}`);
  Object.entries(clarUsed||{}).forEach(([k,v])=>{
    const v2=String(v).trim().slice(0,40); if(v2) parts.push(`${k}: ${v2}`);
  });
  return parts.map(escapeHTML).join(' · ');
}

/* I18N text */
$('titleH1').textContent=T.title; $('subtitle').textContent=T.subtitle;
$('backBtnTop').textContent=`← ${T.back}`; $('homeBtnTop').textContent=`🏠 ${T.home}`;
$('freeBadge').title=T.badgeFreeTitle; $('clarifyBadge').title=T.badgeClarifyTitle;
$('chipWhatIf').textContent=T.chipWhatIf; $('chipWTF').textContent=T.chipWTF;
$('qLabel').textContent=T.qLabel; $('rLabel').textContent=T.rLabel;
$('clarifyBtn').textContent=T.clarifyBtn; $('genBtn').textContent=T.genBtn;
$('knowLabelMini').textContent=T.know; $('knowTip').textContent=T.knowHint;
$('signalsLabel').textContent=T.signalsLabel;

/* Stato */
const prefs = readJSON('whatif_prefs');
let domanda = LS.getItem('domanda')||'';
if(!domanda){ alert(lang==='en'?'No question found.':'Nessuna domanda trovata.'); location.href='fourth.html'; }
let currentStyle=(prefs.stile||'whatif');

/* Tema */
function applyTheme(style){
  document.body.setAttribute('data-theme', style==='wtf' ? 'wtf' : 'whatif');
}
applyTheme(currentStyle);

$('question').textContent=domanda;
$('badgePeriodo').textContent="🕰️ "+(prefs.periodo==='past'?T.periodoPast:T.periodoFuture);
$('badgeStile').textContent="🎭 "+(currentStyle==='wtf'?'What the F':'What if');
document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel',c.dataset.style===currentStyle));
$('styleChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle=b.dataset.style;
  $('badgeStile').textContent="🎭 "+(currentStyle==='wtf'?'What the F':'What if');
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel',c.dataset.style===currentStyle));
  applyTheme(currentStyle);
});

/* Badges */
function renderBadges(){
  const gc=readCredits(); const gl=Math.max(0,DAILY_FREE-(gc.used||0));
  $('freeBadge').textContent=T.badgeFree(gl,DAILY_FREE);
  const cc=readClarify(); const cl=Math.max(0,DAILY_CLARIFY-(cc.used||0));
  $('clarifyBadge').textContent=T.badgeClarify(cl,DAILY_CLARIFY);
}

/* Knowledge mini */
function daysBetween(iso1,iso2){ if(!iso1||!iso2) return 999; const a=new Date(iso1),b=new Date(iso2); return Math.round((b-a)/(1000*60*60*24)); }
function last(arr){ return Array.isArray(arr)&&arr.length?arr[arr.length-1]:null; }
function computeKnowledge(){
  const profile=readJSON('whatif_profile',{}); const micro=readJSON('whatif_micro',{}); const clar=readJSON('whatif_clarify',{date:null,used:0});
  const microLog=readJSON('whatif_micro_log',[]); const lastUpd=LS.getItem('whatif_last_update'); const today=todayStr();
  let cover=0;
  const hasIdentity=!!(profile.name||profile.role); cover+=hasIdentity?8:0;
  const hasRoutine=!!(micro.indicatore);            cover+=hasRoutine?8:0;
  const hasConstraints=!!(micro.vincolo_2w);        cover+=hasConstraints?8:0;
  const hasGoals=!!(profile.goal);                  cover+=hasGoals?8:0;
  const hasPlaces=!!(profile.city||micro.punto_riferimento); cover+=hasPlaces?8:0;
  const hasRelations=!!(micro.persona_chiave);      cover+=hasRelations?8:0;
  const hasRisk=!!(micro.rischio||micro.tolleranza_rischio); cover+=hasRisk?7:0;

  const vals=Object.values(profile).concat(Object.values(micro)).filter(v=>typeof v==='string');
  let usable=0; const numRe=/\b\d+([.,]\d+)?\b/; const timeRe=/\b(\d{1,2}[:.]\d{2}|mattina|pomeriggio|sera|am|pm)\b/i; const locRe=/\b(centro|stazione|ufficio|palestra|bar|parco|centro storico)\b/i;
  vals.forEach(v=>{ if(usable>=10)return; if(numRe.test(v)||timeRe.test(v)||locRe.test(v)) usable++; });
  let quality=Math.min(10,usable);
  if(clar && clar.date===today && (clar.used||0)>0) quality+=5;
  quality=Math.min(25,quality);

  let streak=0;
  if(Array.isArray(microLog)&&microLog.length){
    let d=new Date(today);
    for(;;){ const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if(microLog.includes(iso)){ streak++; d.setDate(d.getDate()-1);} else break;}
  }
  const streakPts=Math.min(10,streak);
  const lastDay=lastUpd||last(microLog);
  let recencyPts=0;
  if(lastDay){ const gap=daysBetween(lastDay,today);
    if(gap<=2)recencyPts=10; else if(gap<=5)recencyPts=8; else if(gap<=8)recencyPts=6; else if(gap<=11)recencyPts=4; else if(gap<=14)recencyPts=2; else recencyPts=0;
  }
  const fresh=Math.min(20,streakPts+recencyPts);
  return Math.max(0,Math.min(100,Math.round(cover+quality+fresh)));
}
function renderKnowledgeMini(){
  const score=computeKnowledge();
  $('knowFill').style.width=`${score}%`;
  $('knowValueMini').textContent=`${score}/100`;
}

/* Segnali UI */
$('signalsLabel').textContent=T.signalsLabel;
const sigToggle=$('signalsToggle'), sigBody=$('signalsBody'), caret=$('caret');
sigToggle.addEventListener('click', ()=>{
  const open = sigBody.style.display!=='none';
  sigBody.style.display = open ? 'none' : 'block';
  caret.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
});

/* Menu ⋯ (FIX handlers) */
const menuBtn=$('menuBtn'), menuSheet=$('menuSheet');
menuBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  const open = menuSheet.style.display==='block';
  menuSheet.style.display = open ? 'none' : 'block';
  menuBtn.setAttribute('aria-expanded', String(!open));
});
menuSheet.addEventListener('click', (e)=>{ e.stopPropagation(); });
document.addEventListener('click', ()=>{ menuSheet.style.display='none'; });

/* API */
async function callClarifyAPI(){
  const payload={ domanda, lang, periodo:prefs.periodo||"future", stile:currentStyle, clarify:true, profilo:buildProfilePayload() };
  const r=await fetch("/api/ask",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("server");
  return r.json();
}
async function callGenerateStream({clarifications={},extra="" }={}){
  const payload={ domanda, lang, periodo:prefs.periodo||"future", stile:currentStyle, clarify:false, stream:true, profilo:buildProfilePayload(), clarifications, extra };
  const r=await fetch("/api/ask",{method:"POST",headers:{ "Content-Type":"application/json","x-whatif-stream":"1" },body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("server");
  return r.body.getReader();
}

/* Clarify overlay */
const clarifyOverlay=$('clarifyOverlay'), clarifyList=$('clarifyList');
$('clarifyBtn').textContent=T.clarifyBtn;
$('clarifyBtn').addEventListener('click', openClarify);
$('cancelClarify').addEventListener('click', ()=> clarifyOverlay.style.display='none');
$('clarifyTitle').textContent=T.clarifyTitle; $('applyClarify').textContent=T.applyClarify; $('cancelClarify').textContent=T.cancelClarify;

async function openClarify(){
  ensureClarify();
  const c=readClarify();
  if((c.used||0)>=DAILY_CLARIFY){ alert(T.limitClarify); return; }
  clarifyList.innerHTML=`<p class="sub">${lang==='en'?'Preparing 2–3 focused questions…':'Sto preparando 2–3 domande mirate…'}</p>`;
  clarifyOverlay.style.display='flex';
  try{
    const j=await callClarifyAPI();
    c.used=(c.used||0)+1; writeClarify(c);
    const qs=Array.isArray(j.questions)? j.questions.slice(0,3):[];
    if(!qs.length){ clarifyList.innerHTML=`<p class="sub">${lang==='en'?'No clarification needed. You can generate now.':'Nessun chiarimento necessario. Puoi generare subito.'}</p>`; return;}
    clarifyList.innerHTML=qs.map(q=>`
      <div class="qitem">
        <label for="${q.id||''}">${escapeHTML(q.label|| (lang==='en'?'Question':'Domanda'))}</label>
        <input id="${q.id||''}" type="text" placeholder="${(q.placeholder|| (lang==='en'?'Answer in one line':'Rispondi in una riga')).replace(/"/g,'&quot;')}" />
      </div>`).join("");
  }catch(e){
    clarifyList.innerHTML=`<p class="sub">${lang==='en'?'Error fetching clarifications. You can still generate.':'Errore nel recupero chiarimenti. Puoi generare comunque.'}</p>`;
  }
}

$('applyClarify').addEventListener('click', async ()=>{
  const inputs=clarifyList.querySelectorAll('input');
  const clar={}; inputs.forEach(i=>{ const v=(i.value||"").trim(); if(i.id&&v) clar[i.id]=v; });
  clarifyOverlay.style.display='none';
  $('signalsBody').textContent = summarizeSignals(clar);
  if ($('signalsBody').textContent){ $('signalsBody').style.display='block'; $('caret').style.transform='rotate(90deg)'; }
  await generate(false,clar);
});

/* WebAudio chime */
function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const g = ctx.createGain();
    o1.type='sine'; o2.type='sine';
    const now=ctx.currentTime;
    o1.frequency.setValueAtTime(880, now);
    o2.frequency.setValueAtTime(1320, now);
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.08, now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.45);
    o1.connect(g); o2.connect(g); g.connect(ctx.destination);
    o1.start(now); o2.start(now);
    o1.stop(now+0.5); o2.stop(now+0.5);
  }catch(_){}
}

/* Generate */
const pbar=$('pbar');
function showPbar(on){ pbar.classList.toggle('show', !!on); }

$('genBtn').textContent=T.genBtn;
$('regenBtn').textContent='🔁 '+T.regenBtn;
$('genBtn').addEventListener('click', ()=> generate());
$('regenBtn').addEventListener('click', ()=> generate(true));

async function generate(isRegen=false, clarOverride=null){
  ensureCredits();
  const credits=readCredits();
  if(!isRegen && (credits.used||0)>=DAILY_FREE){ alert(T.limitGen); return; }

  showPbar(true);
  $('result').textContent=`⏳ ${T.loading} `; const sk=document.createElement('span'); sk.className='skeleton'; sk.style.width='40%'; $('result').appendChild(sk);
  $('regenBtn').style.display='none';
  if(!$('signalsBody').textContent){ $('signalsBody').textContent = summarizeSignals(clarOverride||{}); }

  try{
    const reader=await callGenerateStream({clarifications:(clarOverride||{})});
    const decoder=new TextDecoder(); let buffer="", text="";
    while(true){
      const {value,done}=await reader.read(); if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const chunks=buffer.split("\n\n"); buffer=chunks.pop();
      for(const chunk of chunks){
        if(!chunk.startsWith("data: ")) continue;
        const data=JSON.parse(chunk.slice(6));
        if(data.token){ text+=data.token; $('result').textContent=text; }
        if(data.done){
          $('result').textContent=(text||"").trim();
          $('regenBtn').style.display='block';
          renderKnowledgeMini();
          playChime();
          showPbar(false);
        }
        if(data.error){ $('result').textContent=T.errServer+" "+(data.detail||""); showPbar(false); }
      }
    }
    const c=readCredits(); c.used=(c.used||0)+1; writeCredits(c);
  }catch(e){
    console.error(e);
    $('result').textContent=(e.message==='server'?T.errServer:T.errNet);
    showPbar(false);
  }
}

$('saveBtn').addEventListener('click', ()=>{
  const arr=readJSON('cronologia',[]);

  writeJSON('cronologia',arr);
  alert(T.saved);
});
$('copyBtn').addEventListener('click', ()=>{

});
$('shareBtn').addEventListener('click', ()=>{

  if(navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(`${T.qLabel}: ${domanda}\n\n${$('result').textContent}`);
});

/* Dev hooks: reset FREE + reset CLARIFY + toggle Pro */
(function devHooks(){
  const bFree=$('freeBadge'), bClar=$('clarifyBadge');
  if(!bFree||!bClar) return;
  $('freeBadge').title=T.badgeFreeTitle; $('clarifyBadge').title=T.badgeClarifyTitle;

  let pressT=null;
  bFree.addEventListener('pointerdown', ()=>{ pressT=setTimeout(resetToday,2000); });
  bFree.addEventListener('pointerup', ()=>{ clearTimeout(pressT); });
  bFree.addEventListener('pointerleave', ()=>{ clearTimeout(pressT); });
  function resetToday(){
    const today=todayStr();
    const c=readJSON('whatif_credits'); c.date=today; c.used=0; writeJSON('whatif_credits',c);
    renderBadges(); alert(lang==='en'?'Today credits reset ✅':'Crediti di oggi azzerati ✅');
  }
  let clicks=0,timer=null;
  bFree.addEventListener('click', ()=>{
    clicks++; clearTimeout(timer);
    timer=setTimeout(()=>{ if(clicks>=3) togglePro(); clicks=0; },250);
  });
  function togglePro(){
    const c=readJSON('whatif_credits'); c.pro=!c.pro; c.used=0; writeJSON('whatif_credits',c);
    renderBadges(); alert('Pro '+(c.pro?'on':'off')+' (local) ✅');
  }

  let pressC=null;
  bClar.addEventListener('pointerdown', ()=>{ pressC=setTimeout(resetClarify,2000); });
  bClar.addEventListener('pointerup', ()=>{ clearTimeout(pressC); });
  bClar.addEventListener('pointerleave', ()=>{ clearTimeout(pressC); });
  function resetClarify(){
    const today=todayStr();
    const c=readJSON('whatif_clarify'); c.date=today; c.used=0; writeJSON('whatif_clarify',c);
    renderBadges(); alert(lang==='en'?'Clarify reset for today ✅':'Chiarimenti azzerati per oggi ✅');
  }
})();

  const s=summarizeSignals({});

}
function initText(){
  $('clarifyBtn').textContent=T.clarifyBtn; $('genBtn').textContent=T.genBtn;
  $('menuBtn').setAttribute('aria-label','More');
}
function initStyles(){
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel',c.dataset.style===currentStyle));
  document.body.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
}
function boot(){
  ensureCredits(); ensureClarify(); renderBadges(); renderKnowledgeMini(); initSignalsBase(); initText(); initStyles();
}
boot();
