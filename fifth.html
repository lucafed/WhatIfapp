<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.embit{padding:0 .08em;box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset;text-shadow:0 0 12px rgba(255,255,255,.08);border-radius:4px}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}

/* === TOP PERCENT ROW === */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:13px;color:var(--muted)}
.top-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;
  min-width:64px;
  padding:5px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px var(--glow);
}

/* === RISULTATI SOTTO === */
.result-box{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.28);
}
.result-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:8px;
}
.result-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;
  min-width:64px; padding:5px 10px; border-radius:12px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.28), 0 0 18px var(--glow);
}
.result-title{font-weight:900;font-size:15px;letter-spacing:.2px}

/* === MOTIVO === */
.mot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}
.mot .ico{font-size:18px;line-height:1.2}
.mot .name{display:none}
.mot .note{
  font-size:15px;
  line-height:1.6;
  color:var(--fg);
  opacity:.92;
}

/* Chips voti */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;opacity:.9}
.chip{
  font-size:11px;
  font-weight:900;padding:3px 7px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
}

/* Mobile */
@media (max-width:420px){
  .result-pct,.top-pct{font-size:15px;min-width:56px;padding:4px 8px}
  .result-title{font-size:14px}
  .mot .note{font-size:15.5px;line-height:1.65}
}
</style>

</head>

<script>
/* ==== Base state ==== */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';

/* ===== Lingua ===== */
const SUP_LANG = ['it','en','es','fr','de'];
const reqEarly = JSON.parse(LS.getItem('whatif_request')||'{}');
const domandaEarly = reqEarly.domanda || LS.getItem('domanda') || '';
function detectLang(text=''){
  const t = (text||'').toLowerCase();
  if(/[¿¡]/.test(t)) return 'es';
  const bank = {
    it:[" che "," perché"," se "," quando"," dove"," non "," sono "," vorrei"," posso"," e se"," una settimana"," come"],
    en:[" what "," if "," the "," and "," you "," are "," will "," would "," can "," should "," could "],
    es:[" qué"," si "," porque"," cuando"," dónde"," no "," soy "," puedo"," quiero","¿"," semana "],
    fr:[" quoi"," si "," pourquoi"," quand"," où"," pas "," je "," peux"," si je"," et si"],
    de:[" was"," wenn"," warum"," wann"," wo"," nicht"," ich"," kann"," möchte"," würde"," und wenn"]
  };
  const score = {}; for(const L of SUP_LANG){ score[L]=0; bank[L].forEach(w=>{ if(t.includes(w)) score[L]++; }); }
  let best='it', max=-1; for(const L of SUP_LANG){ if(score[L]>max){ max=score[L]; best=L; } }
  if(max<=0){ const nav=(navigator.language||'it').slice(0,2).toLowerCase(); if(SUP_LANG.includes(nav)) return nav; }
  return best;
}
const manualLang = LS.getItem('lang_manual') === '1';
let langStored = (LS.getItem('lang') || '').toLowerCase();
let lang = manualLang ? (SUP_LANG.includes(langStored)?langStored:'it') : detectLang(domandaEarly);
if(!SUP_LANG.includes(lang)) lang = 'it';

document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');
document.documentElement.lang = lang;

/* ==== PRO badge ==== */

})();

/* ==== Leads ==== */
const LEADS = {

      "Entri piano e oggi il caos ti lascia passare.",
      "Respiri e lasci che inciampi il caso, non tu."
    ],

    ]},

  es:{ wtf:["Entras y hoy el caos te deja pasar.","Respira y deja que tropiece el azar."],
       whatif:["Importa y es incómodo, pero manejable.","Ganas palanca si lo divides en pasos pequeños y visibles."]},
  fr:{ wtf:["Tu entres; le chaos te laisse passer aujourd’hui.","Respire et laisse trébucher le hasard."],
       whatif:["C’est important et un peu inconfortable, mais gérable.","Gagne en levier en le découpant en petits pas visibles."]},
  de:{ wtf:["Du trittst ein; heute lässt dich das Chaos durch.","Atme, der Zufall stolpert zuerst."],
       whatif:["Wichtig und etwas unbequem, aber machbar.","Mehr Hebel, wenn du es in kleine sichtbare Schritte zerlegst."]}
};

/* ==== Helpers (sanitizzazione, split, ecc.) ==== */
function normalizeOneParagraph(s=""){
  return String(s)
    .replace(/[“”«»„”]/g,'"')
    .replace(/[‘’‚’]/g,"'")
    .replace(/\s*\n+\s*/g," ")
    .replace(/\s{2,}/g," ")
    .replace(/\s+([.,;:!?…])/g,"$1")
    .trim();
}
function splitSentences(text){
  const t = normalizeOneParagraph(text)
    .replace(/["'].*?["']/g,"")
    .replace(/[?!]{2,}/g,"?");
  const parts = t.split(/(?<=[.!?…])\s+/).map(x=>x.trim()).filter(Boolean);
  return parts.length ? parts : (t? [t] : []);
}
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function decorateEmBits(el){
  const raw = el.textContent; if(!raw || !raw.includes("—")) return;
  const parts = raw split("—"); /* NOT USED ANYMORE BUT KEPT FOR COMPAT */
}

/* === Sanitizzazione forte === */
function sanitizeAnswer(text){
  const bans = [
    /\b(negroni|birra|vino|whisky|bar|sbronza|poesia|liric|metafor|universo|destino)\b/gi,
    /\b(ventilatore|cameriere|cuscino|frigo|pennetta|piccione)\b/gi,
    /\s[–—-]\s*/g
  ];
  let t = normalizeOneParagraph(text)
    .replace(/(^|[.?!]\s*)["“”'«»]/g,"$1")
    .replace(/["“”'«»]([.?!]\s*|$)/g,"$1")
    .replace(/\([^)]{0,120}\)/g,"")
    .replace(/^[^.!?]*\?\s*/,""); // no domande retoriche iniziali
  bans.forEach(rx=> t = t.replace(rx,""));
  t = t.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,"");
  return t.trim();
}

/* === Estrazione rapida dal testo utente === */
function extractUserHints(q){
  const t=(q||"").toLowerCase();
  const time = (t.match(/\b(\d+)\s*(giorn|gg|settim|mesi|weeks?|days?)\b/)||[])[0]||"";
  const budget = (t.match(/\b(\d+[\.,]?\d*)\s*(€|euro|eur|€)\b/)||[])[0]||"";
  return {time, budget};
}

/* === ENFORCE TONI === */
function enforceWTF(text){
  const MAX_LEN = 140;
  let sents = splitSentences(text).map(s=>s
      .replace(/\b(forse|magari|un po'|potrebbe|dovresti|vorresti)\b/gi,"")
      .replace(/\b(ovviamente|chiaramente|naturalmente)\b/gi,"")
      .replace(/\b(si potrebbe|si può|prova a|cerca di)\b/gi,"fai")
      .trim());
  // accorcia
  sents = sents.map(x=>{
    if(x.length<=MAX_LEN) return x;
    const cut = x.slice(0,MAX_LEN).lastIndexOf(",");
    return (cut>60 ? x.slice(0,cut) : x.slice(0,MAX_LEN)).replace(/[,:;]\s*$/,".") + ".";
  });
  // dedup
  const out=[], seen=new Set();
  for(const s of sents){
    const key=s.toLowerCase().replace(/[^a-z0-9àèéìòóùç ]/gi,"").slice(0,60);
    if(!seen.has(key)){ seen.add(key); out.push(/[.!?…]$/.test(s)?s:s+"."); }
  }
  let target = Math.min(Math.max(6, out.length), 9);
  if(out.length<6){
    const filler = [
      "Riduci la scelta a una leva sola.",
      "Blocca prima il tempo, poi l'obiettivo.",
      "Chiudi piccolo, ma chiudi.",
      "Dai un numero a costo e calendario.",
      "Se dubbi, semplifica ancora."
    ];
    while(out.length<6) out.push(pick(filler));
  }
  return normalizeOneParagraph(out.slice(0,target).join(" "));
}
function enforceWhatIf(text, q){
  // Costruzione guidata: apertura empatica + analisi (4–6 frasi) + mosse (3–4) + guardrail + micro-step
  const {time, budget} = extractUserHints(q);
  const base = splitSentences(text).map(s=>s
    .replace(/\b(ovviamente|naturalmente|chiaramente)\b/gi,"")
    .replace(/\b(forse|magari|un po')\b/gi,"")
    .trim());
  // Mattoni standardizzati
  const empath = [
    "Capito: è importante e scomodo, ma gestibile.",
    "Ha senso che ti pesi: è complesso, non impossibile.",
    "Ok, la posta è alta: la affrontiamo per gradi."
  ];
  const analysis = [
    "Definisci l'obiettivo in una riga e cosa NON rientra.",
    "Scrivi vincoli e leve: tempo, denaro, energia, persone.",
    `Dichiara una finestra operativa ${time?("("+time+") "):""}con inizio e fine visibili.`,
    "Stima l'ordine di grandezza: piccolo, medio, grande.",
    "Identifica un rischio principale e come lo limiterai.",
    "Fissa un indicatore semplice di progresso settimanale."
  ];
  const actions = [
    "Scomponi in 3 task atomici da <60 minuti ciascuno.",
    `Blocca ora i primi due slot in calendario${time?(" — "+time):""}.`,
    `Dai un tetto realistico ${budget||"di budget"} e rispettalo.`,
    "Chiudi il primo task oggi, anche se imperfetto.",
    "Metti un checkpoint tra 7 giorni: tieni ciò che ha funzionato, scarta il resto."
  ];
  const guard = [
    "Regola d’ingaggio: prima il tempo, poi la perfezione.",
    "Se bloccato >10 minuti, riduci il compito a metà.",
    "Ogni giorno finisci con il prossimo passo già scritto."
  ];
  // Costruisci paragrafo
  const parts = [
    oneSentence(pick(empath)),
    oneSentence(pick(analysis)), oneSentence(pick(analysis)), oneSentence(pick(analysis)), oneSentence(pick(analysis)),
    oneSentence(pick(actions)), oneSentence(pick(actions)), oneSentence(pick(actions)),
    oneSentence(pick(guard)),
    "Ora: apri il calendario e piazza il primo slot da 25 minuti."
  ];
  // Se il testo base contiene qualcosa di utile e asciutto, infondilo al centro
  const cleanBase = base.filter(s=>s.length>6 && s.length<160 && !/[“”"']/.test(s)).slice(0,3);
  if(cleanBase.length){
    parts.splice(3, Math.min(2, cleanBase.length), ...cleanBase.map(oneSentence));
  }
  // Limita a 8–11 frasi
  const target = rndInt(8,11);
  return normalizeOneParagraph(parts.slice(0,target).join(" "));
}

/* ===== Percentuale ===== */
function detectCategory(q){
  const t=(q||'').toLowerCase();
  const map = [
    ['tech',/\b(ai|app|sito|automat|script|email|notion)\b/],
    ['lavoro',/(lavor|cv\b|colloqu|linkedin|assunz|promoz)/],
    ['studio',/(studio|universit|esame|corso|inglese|certific)/],
    ['soldi',/(budget|spes|rispar|sold|prezzo|€|euro)/],
    ['business',/(e-?commerce|newsletter|landing|client|startup|pitch)/],
    ['sport',/(correr|allen|nuot|passi|yoga|palestra)/],
    ['relazioni',/(partner|amic|famiglia|relaz|confini|rete)/],
  ];
  for(const [c,rx] of map){ if(rx.test(t)) return c; }
  return 'lavoro';
}
function computeProbability(q){
  const t=(q||'').toLowerCase();
  const hasTime = /(30|7|14|21|60|90)\s*(giorn|gg)|settim|mesi?|this week|in \d+ (days?|weeks?|months?)/i.test(t);
  const hasNumber = /\b\d+([.,]\d+)?\b/.test(t);
  const hasBudget = /(budget|€|euro|spesa|max|sotto)/i.test(t);
  const hasConstraint = /(senza|solo|al massimo|minimo|entro|prima delle|dalle|ogni|per)/i.test(t);
  const hasActionVerb = /(lancia(re)?|apri(re)?|impara(re)?|scrivi(re)?|chiedi(re)?|corri(re)?|studia(re)?|automatizza(re)?|testa(re)?)/i.test(t);
  let score = 50 + (hasTime?12:0)+(hasNumber?8:0)+(hasBudget?6:0)+(hasConstraint?8:0)+(hasActionVerb?6:0) - (!hasTime&&!hasNumber?6:0);
  score += {lavoro:+4,studio:+5,soldi:+3,sport:+2,relazioni:+1,tech:+5,business:+3}[detectCategory(q)]||0;
  score += (style==='wtf' ? -4 : +2);
  return Math.max(25, Math.min(92, Math.round(score)));
}

/* ==== Surprise mode ==== */
function isSurprise(req){
  const p = new URLSearchParams(location.search);
  return p.get('src')==='surprise'
      || LS.getItem('surprise_mode')==='1'
      || req?.surprise === true
      || req?.micro?.surprise === true
      || LS.getItem('absurd_prompt')==='1';
}

};

/* ==== Load & render ==== */
(async ()=>{
  const sel = document.getElementById('langSelect'); if(sel) sel.value = lang;
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const surprise = isSurprise(req);

  let domanda = req.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda);
  qs('#qView').textContent = domanda || '—';

  const pct = computeProbability(domanda);
  const pctStr = pct + "%";
  topPct.textContent = pctStr; bottomPct.textContent = pctStr;

  const T = I18N[lang]||I18N.it;

  // lead
  const bank = (LEADS[lang] && LEADS[lang][style]) ? LEADS[lang][style] : (LEADS.it[style] || LEADS.it.whatif);
  qs('#lead').textContent = oneSentence(pick(bank)) || '—';

  // fetch risposta
  let ok=false;
  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetch("/api/ask",{ method:"POST", headers,
      body:JSON.stringify({ domanda, lang, stile: style, periodo, extra:"", micro:req.micro||{} })
    });
    const data = await r.json().catch(()=>null);
    if(r.ok && data && data.answer){
      let answerText = sanitizeAnswer(data.answer||"");
      answerText = (style==='wtf') ? enforceWTF(answerText) : enforceWhatIf(answerText, domanda);
      qs('#answer').textContent = answerText;
      ok=true;
    }
  }catch(e){ /* fall-through */ }

  // Fallback locale con tono giusto
  if(!ok){
    const seed = domanda.toLowerCase();
    const base = seed.includes("inglese") ? "Vuoi migliorare l’inglese e avere prove concrete di avanzamento." :
                 seed.includes("lavor")   ? "Vuoi cambiare lavoro senza perdere momentum." :
                 seed.includes("ai ")||seed.includes(" ia") ? "Vuoi usare l’AI in modo pratico, non teorico." :
                 "Vuoi fare un passo chiaro e misurabile.";
    const localDraft = `${base} Evitiamo poesia e partiamo dal vincolo più stretto: tempo in agenda.`;
    const offline = (style==='wtf') ? enforceWTF(localDraft) : enforceWhatIf(localDraft, domanda);
    qs('#answer').textContent = offline;
  }

  // motivazione box
  renderCommitteeLike();

  // storia
  const hist = JSON.parse(LS.getItem('cronologia')||'[]');
  hist.push({ domanda, risposta:qs('#answer').textContent, stile:style, periodo, ts:Date.now(), surprise, pct });
  LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
})();
