<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --line: rgba(255,255,255,.12);
  --panel: rgba(20,28,34,.92);
  --glow: rgba(255,236,1,.22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.embit { padding:0 .08em; box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset; text-shadow:0 0 12px rgba(255,255,255,.08); border-radius:4px; }
.select{ background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer; }

/* === TOP PERCENT ROW === */
.pct-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.pct-label{font-size:12px;color:var(--muted)}
.top-pct{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;min-width:72px; padding:6px 10px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink); border-radius:10px; box-shadow:0 8px 22px rgba(0,0,0,.32), 0 0 22px var(--glow);
}

/* === MOTIVI (2 righe, con icone e voti) === */
.mot-wrap{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mot{
  display:grid;grid-template-columns:auto 1fr;gap:10px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;padding:10px 12px;
}
.mot .ico{font-size:18px;line-height:1.2}
.mot .txt{line-height:1.45}
.mot .name{font-weight:800}
.mot .meta{font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <select id="langSelect" class="select" aria-label="Language">
        <option value="it">IT · Italiano</option>
        <option value="en">EN · English</option>
        <option value="es">ES · Español</option>
        <option value="fr">FR · Français</option>
        <option value="de">DE · Deutsch</option>
      </select>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>

    <!-- % IN ALTO -->
    <div class="pct-row">
      <span class="pct-label" id="pctLabel">% probabilità che accada</span>
      <div id="topPct" class="top-pct" aria-live="polite">—</div>
    </div>

    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>

    <div class="hr"></div>
    <div class="label" id="lblP">Motivazioni (votanti & note)</div>
    <div id="motBlock" class="mot-wrap"></div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
/* ==== Base state ==== */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
let lang  = (LS.getItem('lang') || 'it').toLowerCase();
if(!['it','en','es','fr','de'].includes(lang)) lang = 'it';

document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');
document.documentElement.lang = lang;

/* ==== PRO badge ==== */
(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' : (
               lang === 'es') ? 'Modo de prueba activo' : (
               lang === 'fr') ? 'Mode test actif' :
               (lang === 'de') ? 'Testmodus aktiv' : 'Modalità test attiva';
  }
})();

/* ==== I18N (UI) ==== */
const I18N = {
  it:{ titleWTF:"⚡ What the F — Risultato", titleWHF:"💡 What if — Risultato",
       sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
       p:"Motivazioni (votanti & note)", share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
       copied:"Copiato!", error:"[errore server]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Stile: What the F · 6–9 frasi · paragrafo unico · tono asciutto · modalità: ${p==='past'?'Passato':'Futuro'}.`
        : `Stile: What if (60% analisi, 40% reale) · 8–11 frasi · paragrafo unico · modalità: ${p==='past'?'Passato':'Futuro'}.`,
       pctLabel:"% probabilità che accada",
       back:"← Indietro", home:"🏠 Home" },
  en:{ titleWTF:"⚡ What the F — Result", titleWHF:"💡 What if — Result",
       sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
       p:"Rationales (voters & notes)", share:"📤 Share / Copy", again:"🔁 Ask another",
       copied:"Copied!", error:"[server error]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · dry tone · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if (60% analysis, 40% real) · 8–11 sentences · single paragraph · mode: ${p==='past'?'Past':'Future'}.`,
       pctLabel:"% probability it happens",
       back:"← Back", home:"🏠 Home" }
};
I18N.es=I18N.en; I18N.fr=I18N.en; I18N.de=I18N.en;

/* ==== Leads ==== */
const LEADS = {
  it:{ wtf:[
      "Entri piano, il caos ti riconosce e oggi ti lascia passare.",
      "Respiri e lasci che sia il destino a inciampare per primo."
    ],
    whatif:[
      "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
      "La stanza è la stessa, lo sguardo no: è già un inizio."
    ]},
  en:{ wtf:["You step in slowly; chaos recognizes you and lets you through."],
       whatif:["Set the keys down and let the quiet that doesn’t judge go first."]}
};

/* ==== Categories (no 'Paranormale & Universale') ==== */
const CATEGORIES = [
  // Psicologia & Caos umano
  { ico:"🧠", name_it:"Comitato dei Pensieri Sotto la Doccia",          name_en:"Shower-Thoughts Committee",
    notes_it:["Illuminazione logistica durante shampoo.","Decisione nata a temperatura tiepida."],
    notes_en:["Logistics epiphany mid-shampoo.","Decision made at lukewarm clarity."] },
  { ico:"📞", name_it:"Autorità delle Telefonate Fuori Tempo",            name_en:"Off-Timing Calls Authority",
    notes_it:["Consiglio pervenuto alle 07:12.","Parere espresso durante squillo prolungato."],
    notes_en:["Advice arrived at 07:12.","Opinion issued during a long ring."] },
  { ico:"📊", name_it:"Ordine degli Ottimisti Moderati",                  name_en:"Order of Moderate Optimists",
    notes_it:["Aspettative contenute, calendario severo.","Risultato atteso: discreto."],
    notes_en:["Contained expectations, strict calendar.","Expected outcome: decent."] },

  // Natura & Fauna giudicante
  { ico:"🕊️", name_it:"Assemblea dei Piccioni con Opinioni Forti",       name_en:"Assembly of Strong-Opinion Pigeons",
    notes_it:["Sorveglianza attiva sulle panchine.","Consenso rumoroso in piazza."],
    notes_en:["Active bench surveillance.","Loud piazza consensus."] },
  { ico:"🦊", name_it:"Lobby delle Volpi Opportuniste",                    name_en:"Opportunistic Foxes Lobby",
    notes_it:["Favorevoli se conviene subito.","Richiesto tornaconto rapido."],
    notes_en:["In favor if payoff is instant.","Quick upside requested."] },
  { ico:"🐙", name_it:"Federazione dei Polpi Strategici",                  name_en:"Federation of Strategic Octopuses",
    notes_it:["Otto step avanti, due indietro.","Tattica flessibile, presa salda."],
    notes_en:["Eight steps ahead, two back.","Flexible tactics, firm grip."] },
  { ico:"🦥", name_it:"Consiglio dei Bradipi Riflessivi",                  name_en:"Council of Reflective Sloths",
    notes_it:["Decisione lenta ma convinta.","Deadline percepita: 2038."],
    notes_en:["Slow but resolute decision.","Perceived deadline: 2038."] },

  // Vita sociale & follia umana
  { ico:"🥃", name_it:"Circolo Bar Notturno dei Consiglieri",              name_en:"Late-Bar Counsel Circle",
    notes_it:["Coraggio liquido, piani semplici.","Entusiasmo verificato al bancone."],
    notes_en:["Liquid courage, simple plans.","Enthusiasm verified at the counter."] },
  { ico:"🍕", name_it:"Associazione Snack Notturni e Idee",                name_en:"Night Snacks & Ideas Association",
    notes_it:["Carboidrati a supporto del piano.","Briefing alle 23:47."],
    notes_en:["Carbs support the plan.","Briefing at 23:47."] },
  { ico:"💬", name_it:"Conferenza degli Amici Che Gasano",                 name_en:"Conference of Hype Friends",
    notes_it:["Clima motivazionale alto.","Applauso non richiesto."],
    notes_en:["High motivational climate.","Applause unprompted."] },
  { ico:"🎤", name_it:"Sindacato delle Idee da Karaoke",                   name_en:"Karaoke Ideas Union",
    notes_it:["Proposta nata al ritornello.","Volume sopra la ragione."],
    notes_en:["Proposal born on the chorus.","Volume over reason."] },

  // Mistico-Burocratico
  { ico:"📎", name_it:"Ufficio Complicazioni Semplici",                    name_en:"Office of Simple Complications",
    notes_it:["Modulistica tripla ma fattibile.","File approvato con graffetta d’oro."],
    notes_en:["Triple forms but feasible.","Dossier approved with a golden clip."] },
  { ico:"📜", name_it:"Accademia degli Oracoli Part-Time",                 name_en:"Part-Time Oracles Academy",
    notes_it:["Verdetto in pausa pranzo.","Profetizzato in 160 caratteri."],
    notes_en:["Verdict at lunch break.","Prophesied in 160 chars."] },
  { ico:"🕯️", name_it:"Confraternita dei Segni Incomprensibili",          name_en:"Brotherhood of Unreadable Signs",
    notes_it:["Messaggio criptico ma positivo.","Segnale visto tre volte."],
    notes_en:["Cryptic yet positive message.","Signal seen thrice."] },
  { ico:"⏳", name_it:"Autorità delle Tempistiche Perfettamente Sbagliate", name_en:"Authority of Perfectly Wrong Timings",
    notes_it:["Tempismo pessimo, effetto ottimo.","Arrivo tardi strategico."],
    notes_en:["Awful timing, great effect.","Late on purpose, effective."] },
];

/* ==== UI refs ==== */
const qs = (sel)=>document.querySelector(sel);
const setText = (id, txt)=>{ const el=qs(id); if(el) el.textContent = txt; };

const backBtn  = qs('#backBtn');
const homeBtn  = qs('#homeBtn');
const langSel  = qs('#langSelect');
const titleH1  = qs('#title');
const subtitle = qs('#subtitle');
const lblQ     = qs('#lblQ');
const lblA     = qs('#lblA');
const qView    = qs('#qView');
const leadNode = qs('#lead');
const answerEl = qs('#answer');
const shareBtn = qs('#shareBtn');
const againBtn = qs('#againBtn');
const metaInfo = qs('#metaInfo');
const styleBadge = qs('#styleBadge');
const motBlock = qs('#motBlock');
const lblP = qs('#lblP');
const topPct = qs('#topPct');
const pctLabel = qs('#pctLabel');

/* ==== Helpers ==== */
function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }
function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

/* Decorazione em-dash */
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw || !raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

/* ==== Titles & UI text ==== */
function setTitlesAndTexts(q){
  const T = I18N[lang] || I18N.it;
  setText('#title', style==='wtf' ? T.titleWTF : T.titleWHF);
  subtitle.textContent = T.sub(q || '—');
  lblQ.textContent = T.q;
  lblA.textContent = T.a;
  lblP.textContent = T.p;
  shareBtn.textContent = T.share;
  againBtn.textContent = T.again;
  styleBadge.textContent = (style==='wtf') ? T.styleWTF : T.styleWHF;
  metaInfo.textContent = T.meta(style, periodo);
  pctLabel.textContent = T.pctLabel;

  const bank = (LEADS[lang] && LEADS[lang][style]) ? LEADS[lang][style]
               : (LEADS.it[style] || LEADS.it.whatif);
  const line = oneSentence(pick(bank) || '');
  leadNode.textContent = line || '—';
}

/* ==== Percentuale primaria ==== */
function buildPrimaryPct({style, absurd}){
  if(style==='whatif' && !absurd) return rndInt(55,85) + "%";
  if(style==='whatif' && absurd)  return rndInt(150,1200) + "%";
  return rndInt(120,600) + "%"; // wtf
}
function renderTopPct(pct){ topPct.textContent = pct || "—"; }

/* ==== Motivazioni: 2 righe con voti assurdi e nota breve ==== */
function randVotes(){
  const fav = rndInt(2, 2500);
  const con = rndInt(0, Math.max(0, Math.floor(fav*0.4)));
  const ast = rndInt(0, Math.max(0, Math.floor((fav+con)*0.2)));
  return {fav, con, ast};
}
function buildMotivations(answerText){
  // prendi 2 categorie distinte
  const a = pick(CATEGORIES);
  let b = pick(CATEGORIES);
  let safety=0;
  while(b === a && safety++ < 10) b = pick(CATEGORIES);

  const items = [a,b].map(cat=>{
    const notePool = (lang==='it') ? (cat.notes_it||[]) : (cat.notes_en||[]);
    const note = pick(notePool.length?notePool:["Nota non disponibile."]);
    const votes = randVotes();
    return {
      ico: cat.ico,
      name: (lang==='it') ? cat.name_it : cat.name_en,
      votes,
      note
    };
  });
  return items;
}
function renderMotivations(list){
  motBlock.innerHTML = '';
  list.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'mot';
    row.innerHTML = `
      <div class="ico">${item.ico}</div>
      <div class="txt">
        <div class="name">${item.name}</div>
        <div class="meta">favorevoli ${item.votes.fav} · contrari ${item.votes.con} · astenuti ${item.votes.ast}</div>
        <div class="meta">${item.note}</div>
      </div>
    `;
    motBlock.appendChild(row);
  });
}

/* ==== Load & fetch ==== */
(async ()=>{
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const absurdFlag = req.absurd === true || LS.getItem('absurd_prompt') === '1';

  // domanda
  let domanda = req.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda);
  qs('#qView').textContent = domanda || '—';

  // fetch risposta
  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetch("/api/ask",{
      method:"POST",
      headers,
      body:JSON.stringify({ domanda, lang, stile: style, periodo, extra:"", micro:req.micro||{} })
    });
    const data = await r.json().catch(()=>null);
    if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

    let answerText = normalizeOneParagraph((data.answer||"").trim());
    if(!/[.!?…]$/.test(answerText)) answerText += ".";
    qs('#answer').textContent = answerText;
    decorateEmBits(qs('#answer'));

    // >>> % in alto
    renderTopPct(buildPrimaryPct({style, absurd:absurdFlag}));

    // >>> Motivazioni (2)
    const moti = buildMotivations(answerText);
    renderMotivations(moti);

    // storia
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now() });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
  }catch(e){
    qs('#answer').textContent = (I18N[lang]||I18N.it).error;
    console.error(e);
  }
})();

/* ==== Nav / lingua ==== */
qs('#backBtn').onclick = ()=> history.length > 1 ? history.back() : location.replace('index.html');
qs('#homeBtn').onclick = ()=> location.href='index.html';
qs('#langSelect').onchange = ()=>{
  lang = qs('#langSelect').value;
  LS.setItem('lang', lang);
  document.documentElement.lang = lang;
  location.reload();
};
qs('#shareBtn').onclick = async()=>{
  const T = I18N[lang] || I18N.it;
  const full = `What?f — ${style==='wtf'?(T.styleWTF||'What the F'):(T.styleWHF||'What if')}\n(${periodo})\n\nQ: ${LS.getItem('domanda')}\n\n${qs('#answer').textContent}`;
  try{
    if(navigator.share){ await navigator.share({ title: "What?f", text: full }); }
    else{
      await navigator.clipboard.writeText(full);
      const b=qs('#shareBtn'); b.textContent=T.copied; setTimeout(()=>b.textContent=T.share,1200);
    }
  }catch{}
};
qs('#againBtn').onclick = ()=>{ location.href='fourth.html'; };
</script>
</body>
</html>
