<!-- ============================
     fifth.html — What?f Result (finale)
     - Stile "WTF": tragicomico, sarcastico, sbronza lucida
     - Stile "What If": invariato, empatico-poetico
     - Visual: un unico paragrafo, ritmo da lettura notturna
     ============================ -->
<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414; --fg:#FFFFFF; --muted:#A7B3BC;
    --ink:#0A0E12;
    /* What If palette */
    --acc:#1C57A0; --acc2:#FFEC01;
    /* WTF palette (più “notte” e punch) */
    --wtf-acc:#C7FF49; --wtf-acc2:#5AF0A0;
  }
  html[data-theme="wtf"]{ --acc:var(--wtf-acc); --acc2:var(--wtf-acc2); }
  *{ box-sizing:border-box }
  html, body{
    margin:0;
    background: radial-gradient(900px 650px at 25% 15%, var(--bg2), var(--bg));
    color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main{ max-width:860px; margin:auto; padding:22px }
  h1{
    font-size:clamp(22px,4.8vw,32px);
    color:var(--acc2);
    text-align:center;
    margin:10px 0 6px;
    letter-spacing:.2px;
  }
  .sub{ color:var(--muted); text-align:center; margin:0 0 14px; }
  .card{
    background: rgba(20,28,34,.88);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:18px;
    backdrop-filter: blur(10px);
    margin-top:16px;
  }
  .label{ color:var(--acc); font-weight:800; margin-bottom:8px; text-transform:uppercase; letter-spacing:.6px; font-size:13px }
  .story{
    /* Mostriamo sempre UN paragrafo pulito e scorrevole */
    white-space: normal;
    line-height: 1.72;
    font-size: 18px;
    letter-spacing: .1px;
    word-break: break-word;
  }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  .btn{
    padding:10px 14px; border:none; border-radius:12px; cursor:pointer; font-weight:800
  }
  .btn.primary{ background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink) }
  .btn.ghost{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#fff }
  .input{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:10px; min-height:46px
  }
  .small{ font-size:12px; color:var(--muted) }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px }
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#fff
  }
  .sep{ height:8px }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="row">
      <button class="btn ghost" id="backBtn" title="Indietro">←</button>
      <button class="btn ghost" id="homeBtn" title="Home">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span id="toneTag" class="pill">Tono: —</span>
      <button class="btn ghost" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>
    <div id="answer" class="story">⏳ …</div>
    <div class="sep"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
  // ---------- Prefs ----------
  const LS = localStorage;
  const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
  const style = prefs.stile || 'whatif'; // "wtf" | "whatif"
  const lang = (LS.getItem('lang') || 'it').toLowerCase();
  document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

  // ---------- I18N ----------
  const I18N = {
    it:{ tWTF:"⚡ What the F — Risultato", tWHF:"💡 What if — Risultato",
         sub:q=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
         share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
         copied:"Copiato!", error:"[errore server]", toneWTF:"Sarcastico • Tragicomico • Sbronzo", toneWHF:"Empatico • Lucido • Calmo" },
    en:{ tWTF:"⚡ What the F — Result", tWHF:"💡 What if — Result",
         sub:q=>`Question: “${q}”`, q:"Your question", a:"Answer",
         share:"📤 Share / Copy", again:"🔁 Ask another",
         copied:"Copied!", error:"[server error]", toneWTF:"Sarcastic • Tragicomic • Tipsy", toneWHF:"Warm • Clear • Calm" }
  }[lang];

  // UI init
  const $ = (id)=>document.getElementById(id);
  $('langBtn').textContent = lang.toUpperCase();
  $('backBtn').onclick = ()=>history.back();
  $('homeBtn').onclick = ()=>location.href='index.html';
  $('langBtn').onclick = ()=>{ LS.setItem('lang', lang==='it'?'en':'it'); location.reload(); };

  $('lblQ').textContent = I18N.q;
  $('lblA').textContent = I18N.a;
  $('shareBtn').textContent = I18N.share;
  $('againBtn').textContent = I18N.again;

  // Tone tag + title
  $('title').textContent = (style==='wtf' ? I18N.tWTF : I18N.tWHF);
  $('toneTag').textContent = 'Tono: ' + (style==='wtf' ? I18N.toneWTF : I18N.toneWHF);

  // ---------- Utilities ----------
  // Normalizza: un unico paragrafo scorrevole
  function normalizeOneParagraph(s=""){
    return String(s)
      .replace(/\s*\n+\s*/g," ")   // newline -> spazio
      .replace(/\s{2,}/g," ")      // spazi multipli -> singolo
      .replace(/\s+([.,;:!?])/g,"$1")
      .trim();
  }

  const params = new URLSearchParams(location.search);
  const isReplay = params.get('view') === 'replay';

  let domanda = "";
  let answerText = "";

  if (isReplay) {
    const r = JSON.parse(LS.getItem('replay_story') || '{}');
    domanda = r.domanda || LS.getItem('domanda') || "";
    answerText = normalizeOneParagraph(r.answer || "");
    $('subtitle').textContent = I18N.sub(domanda);
    $('qView').textContent = domanda || '—';
    $('answer').textContent = answerText || '—';
  } else {
    const req = JSON.parse(LS.getItem('whatif_request') || '{}');
    domanda = req.domanda || LS.getItem('domanda') || "";
    $('subtitle').textContent = I18N.sub(domanda);
    $('qView').textContent = domanda || '—';

    (async ()=>{
      try{
        const r = await fetch("/api/ask",{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ domanda, lang, stile:style, extra:"", micro:req.micro||{} })
        });
        const data = await r.json();
        if(!r.ok || !data.answer) throw new Error(data.detail || "bad_response");
        answerText = normalizeOneParagraph((data.answer||"").trim());
        $('answer').textContent = answerText;

        const hist = JSON.parse(LS.getItem('cronologia') || '[]');
        hist.push({ domanda, risposta:answerText, stile:style, ts:Date.now() });
        LS.setItem('cronologia', JSON.stringify(hist.slice(-60)));
      }catch(e){
        $('answer').textContent = I18N.error;
        console.error(e);
      }
    })();
  }

  // Share / Copy
  $('shareBtn').onclick = async () => {
    const full = `What?f — ${style==='wtf'?'What the F':'What if'}\n\nQ: ${domanda}\n\n${normalizeOneParagraph(answerText)}`;
    try{
      if(navigator.share){
        await navigator.share({ title:"What?f", text: full });
      }else{
        await navigator.clipboard.writeText(full);
        $('shareBtn').textContent = I18N.copied;
        setTimeout(()=> $('shareBtn').textContent = I18N.share, 1200);
      }
    }catch{}
  };

  // Ask another
  $('againBtn').onclick = ()=>{ location.href='fourth.html'; };
</script>
</body>
</html>
