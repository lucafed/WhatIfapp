<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f — Episodio</title>
<meta name="theme-color" content="#0B0B0C" />
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; /* whatif */
  --wtf1:#3A6B56; --wtf2:#5A8C75; /* wtf */
  --ink:#0A0E12;
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(800px 600px at 25% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:auto;padding:20px}
h1{font-size:clamp(22px,5vw,30px);color:var(--acc2);text-align:center;margin:10px 0 6px}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.card{background:rgba(20,28,34,.9);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.story{white-space:pre-wrap;line-height:1.65;font-size:18px;letter-spacing:.1px}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:33%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
textarea{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);font-size:16px}
.small{font-size:12px;color:var(--muted)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
</style>
</head>
<body>
<main>
  <h1 id="title">Episodio 1 di 3</h1>
  <p class="sub" id="subtitle">—</p>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="card">
    <div id="answer" class="story">⏳ Genero la storia...</div>
  </div>

  <div class="card" id="followCard" style="display:none">
    <h3 id="followTitle">Domande per domani</h3>
    <div id="followList" class="story" style="font-size:16px"></div>
    <div class="sep"></div>
    <textarea id="customFollow" rows="3" placeholder="Aggiungi una tua riflessione o una domanda..."></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">💾 Salva per domani</button>
      <button class="btn ghost" id="homeBtn">🏠 Home</button>
    </div>
    <p class="small" id="saveInfo"></p>
  </div>
</main>

<script>
const LS = localStorage;
const lang = (LS.getItem('lang') || 'it').toLowerCase();
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');

/* i18n */
const T = {
  it:{
    titleWTF:"⚡ What the F — Episodio 1 di 3",
    titleWHF:"💡 What?f — Episodio 1 di 3",
    sub:(q)=>`Domanda: “${q}”`,
    follow:"Domande per domani",
    saved:"✅ Salvato per domani.",
    placeholder:"Aggiungi una tua riflessione o una domanda...",
    error:"Errore nel generare la storia."
  },
  en:{
    titleWTF:"⚡ What the F — Episode 1 of 3",
    titleWHF:"💡 What?f — Episode 1 of 3",
    sub:(q)=>`Question: “${q}”`,
    follow:"Questions for tomorrow",
    saved:"✅ Saved for tomorrow.",
    placeholder:"Add your note or a question...",
    error:"Error while generating the story."
  }
}[lang];

/* UI base */
document.getElementById('title').textContent = (style==='wtf'?T.titleWTF:T.titleWHF);
document.getElementById('homeBtn').onclick = ()=> location.href = 'index.html';
document.getElementById('followTitle').textContent = T.follow;
document.getElementById('customFollow').placeholder = T.placeholder;

const domandaFromFourth = LS.getItem('domanda') || (lang==='en'?"What if I moved back to L’Aquila?":"E se tornassi a vivere all’Aquila?");
document.getElementById('subtitle').textContent = (T.sub(domandaFromFourth));

/* Resume mode? */
const resumeId = LS.getItem('resume_id');

/* helpers */
const readJSON = (k, def) => { try { return JSON.parse(LS.getItem(k) || JSON.stringify(def)); } catch { return def; } };
const writeJSON = (k, v) => LS.setItem(k, JSON.stringify(v));

async function generateOrResume(){
  // resume from history (no regenerate)
  if(resumeId){
    const hist = readJSON('cronologia',[]);
    const item = hist.find(x => String(x.id||x.ts) === String(resumeId));
    LS.removeItem('resume_id');
    if(item){
      document.getElementById('subtitle').textContent = T.sub(item.domanda || domandaFromFourth);
      document.getElementById('answer').textContent = item.risposta || "";
      await buildFollowUps(item.domanda || domandaFromFourth, item.risposta || "");
      return;
    }
  }

  // normal generation
  await generateEpisode(domandaFromFourth);
}

async function generateEpisode(domanda){
  try{
    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ domanda, lang, stile:style })
    });
    const data = await r.json();
    if(!r.ok || !data.answer) throw new Error(data.detail || "bad_response");
    const answer = (data.answer||"").trim();
    document.getElementById('answer').textContent = answer;

    // save to history with id
    const hist = readJSON('cronologia',[]);
    const id = Date.now();
    hist.unshift({ id, domanda, risposta: answer, stile: style, lang, ts: id });
    writeJSON('cronologia', hist.slice(0,50));

    await buildFollowUps(domanda, answer);
  }catch(err){
    console.error(err);
    document.getElementById('answer').textContent = T.error;
  }
}

async function buildFollowUps(domanda, answer){
  const card = document.getElementById('followCard');
  const list = document.getElementById('followList');
  list.textContent = lang==='en' ? "⏳ Crafting 2 smart questions for tomorrow…" : "⏳ Creo 2 domande intelligenti per domani…";

  try{
    const rr = await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        domanda,
        lang,
        stile: style,
        follow: true,
        answer: answer
      })
    });
    const dj = await rr.json();
    const arr = Array.isArray(dj.followups) ? dj.followups.slice(0,2) : [];
    list.innerHTML = arr.length
      ? arr.map(q => `• ${q}`).join("\n")
      : (style==='wtf'
          ? "• E allora, quanto reggi prima di cercare il Wi-Fi?\n• Ti senti più vivo o solo più congelato?"
          : "• Cosa ti sorprende davvero del silenzio?\n• Cosa cambierebbe se restassi davvero?");
  }catch(e){
    console.error("followups error", e);
    list.innerHTML = (style==='wtf'
      ? "• E allora, quanto reggi prima di cercare il Wi-Fi?\n• Ti senti più vivo o solo più congelato?"
      : "• Cosa ti sorprende davvero del silenzio?\n• Cosa cambierebbe se restassi davvero?");
  }
  card.style.display='block';
}

/* save for tomorrow */
document.getElementById('saveBtn').onclick = ()=>{
  const extra = (document.getElementById('customFollow').value||"").trim();
  const saved = readJSON('next_prompts',[]);
  saved.unshift({ q: domandaFromFourth, note: extra, stile: style, lang, ts: Date.now() });
  writeJSON('next_prompts', saved.slice(0,50));
  document.getElementById('saveInfo').textContent = T.saved;
};

generateOrResume();
</script>
</body>
</html>
