<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Risultato</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{
      --bg:#0A0F14; --card:#121820; --fg:#E6F2F5; --muted:#A0B2BA;
      --accent:#00E0FF; --accent-dark:#00B5CC;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px}
    .top{display:flex;align-items:center;gap:12px}
    .back{appearance:none;border:none;background:#0f1820;color:var(--fg);
      padding:10px 14px;border-radius:14px;cursor:pointer}
    .crumb{color:var(--muted);font-size:14px}
    h1{margin:0;font-size:clamp(26px,6vw,40px);}
    .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
    .res{background:#0f1820;border:1px solid #1d2b34;color:var(--fg);
      padding:16px;border-radius:14px;min-height:120px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
    .btn{appearance:none;border:none;border-radius:14px;padding:12px 16px;cursor:pointer}
    .primary{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#002329;font-weight:900}
    .ghost{background:#132029;color:var(--fg);border:1px solid #1d2b34}
    .note{color:var(--muted);font-size:14px;margin-top:8px}

    /* language fab */
    .lang-fab{position:fixed;top:14px;right:14px;z-index:20}
    .lang-btn{appearance:none;border:none;background:#0f1820;color:var(--fg);
      padding:10px 12px;border-radius:999px;cursor:pointer;border:1px solid #1d2b34}
    .lang-menu{position:absolute;top:46px;right:0;background:#101922;border:1px solid #1d2b34;border-radius:12px;
      padding:8px;display:none;min-width:160px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
    .lang-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--fg);
      padding:10px;border-radius:10px;cursor:pointer}
    .lang-menu button.active{background:#14222b}
  </style>
</head>
<body>
  <!-- Language selector -->
  <div class="lang-fab" id="langFab">
    <button class="lang-btn" id="langToggle" aria-haspopup="true" aria-expanded="false">🌐</button>
    <div class="lang-menu" id="langMenu" role="menu" aria-label="language">
      <button data-lang="it">Italiano</button>
      <button data-lang="en">English</button>
    </div>
  </div>

  <main>
    <div class="top">
      <button class="back" id="backBtn" data-i18n="back">Indietro</button>
      <span class="crumb" id="crumb"></span>
    </div>

    <h1 data-i18n="title">Risultato</h1>

    <div class="card">
      <div class="res" id="answer">
        <!-- risposta/placeholder -->
      </div>
      <div class="actions">
        <button class="btn primary" id="shareBtn" data-i18n="share">Condividi</button>
        <button class="btn ghost" id="homeBtn" data-i18n="home">Home</button>
      </div>
      <div class="note" data-i18n="upsell">
        Vuoi la versione estesa con piani d’azione e alternative? (in arrivo)
      </div>
    </div>
  </main>

  <script>
    /* ---------- i18n ---------- */
    const dict = {
      it: {
        back:"Indietro",
        title:"Risultato",
        share:"Condividi",
        home:"Home",
        upsell:"Vuoi la versione estesa con piani d’azione e alternative? (in arrivo)",
        placeholder:(q)=>`Scenario ipotizzando cosa potrebbe accadere partendo da “${q}”. Tono realistico e plausibile, con passi concreti. Valutando contesto e preferenze, una traiettoria coerente emerge con buone chance di risultato. Probabilità stimata: 68% perché alcuni fattori chiave giocano a favore, a fronte di rischi gestibili.`
      },
      en: {
        back:"Back",
        title:"Result",
        share:"Share",
        home:"Home",
        upsell:"Want the extended version with action plans and alternatives? (coming soon)",
        placeholder:(q)=>`Scenario projecting what could happen starting from “${q}”. Realistic and plausible tone, with concrete steps. Considering context and preferences, a coherent path emerges with good chances of success. Estimated probability: 68% because several key factors play in your favor, with manageable risks.`
      }
    };
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    function getLang(){ return localStorage.getItem("lang") || "it"; }
    function tApply(lang){
      const pack = dict[lang] || dict.it;
      $$("[data-i18n]").forEach(el=>{
        const k = el.getAttribute("data-i18n");
        if(pack[k]) el.textContent = pack[k];
      });
      document.documentElement.lang = lang;

      // (ri)costruisci la risposta placeholder/local per la demo
      const q = localStorage.getItem("whatif_question") || (lang==="en"?"Your question":"La tua domanda");
      $("#answer").textContent = pack.placeholder(q);
      markMenu(lang);
      // aggiorna crumb
      const s = JSON.parse(localStorage.getItem("whatif_prefs")||"{}");
      const period = lang==="en"
        ? (s.periodo==="past"?"Past": s.periodo==="future"?"Future": "")
        : (s.periodo==="past"?"Passato": s.periodo==="future"?"Futuro": "");
      const style = lang==="en"
        ? (s.stile==="whatif"?"What if (plausible)": s.stile==="wtf"?"What the F (ironic)": "")
        : (s.stile==="whatif"?"What if (plausibile)": s.stile==="wtf"?"What the F (ironico)": "");
      $("#crumb").textContent = [period, style].filter(Boolean).join(" • ");
    }
    function setLang(l){ localStorage.setItem("lang", l); tApply(l); }

    /* ---------- language UI ---------- */
    const fab = $("#langFab");
    const btn = $("#langToggle");
    const menu = $("#langMenu");
    function markMenu(lang){
      menu.querySelectorAll("button").forEach(b=>{
        b.classList.toggle("active", b.dataset.lang===lang);
      });
    }
    btn.addEventListener("click", ()=>{
      const open = menu.style.display==="block";
      menu.style.display = open ? "none" : "block";
      btn.setAttribute("aria-expanded", String(!open));
    });
    menu.addEventListener("click", (e)=>{
      const b = e.target.closest("button[data-lang]"); if(!b) return;
      setLang(b.dataset.lang);
      menu.style.display="none";
      btn.setAttribute("aria-expanded","false");
    });
    document.addEventListener("click",(e)=>{
      if(!fab.contains(e.target)) { menu.style.display="none"; btn.setAttribute("aria-expanded","false"); }
    });

    // ritraduci se cambia in altre pagine/schede
    window.addEventListener("storage", (e)=>{
      if(e.key==="lang") tApply(getLang());
    });
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) tApply(getLang());
    });

    // init
    tApply(getLang());

    /* ---------- nav/actions ---------- */
    $("#backBtn").addEventListener("click", ()=> history.back());
    $("#homeBtn").addEventListener("click", ()=> location.href="index.html");
    $("#shareBtn").addEventListener("click", async ()=>{
      const text = $("#answer").textContent;
      try{
        if(navigator.share){ await navigator.share({text}); }
        else{
          await navigator.clipboard.writeText(text);
          alert(getLang()==="en"?"Copied to clipboard!":"Copiato negli appunti!");
        }
      }catch{}
    });
  </script>
</body>
</html>
