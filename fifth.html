<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risultato</title>
<meta name="theme-color" content="#0A0F14" />
<style>
  :root{
    --bg:#0A0F14; --card:#141C22; --muted:#A0B2BA;
    --fg:#E6F2F5; --acc:#00E0FF; --acc2:#00B5CC; --chip:#0f1820; --ink:#001f26;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{appearance:none;border:none;background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer;transition:opacity .2s}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);font-weight:800}
  .btn.ghost{background:transparent;border:1px solid #1d2b34}
  .btn:hover{opacity:.9}
  h1{font-size:clamp(24px,5vw,32px);margin:16px 0 4px}
  p.sub{color:var(--muted);margin:0 0 12px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px rgba(0,0,0,.25)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .box{background:#0b1218;border:1px solid #18242c;border-radius:12px;padding:12px;white-space:pre-wrap}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#0f1820;border:1px solid #1b2a34;color:#cfe3e7;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800}
  #result{min-height:180px;line-height:1.6}
  .tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .divider{height:1px;background:#16222b;margin:16px 0}
  .badge{background:#0f1820;border:1px solid #1b2a34;border-radius:999px;padding:6px 10px;font-size:12px;color:#cfe3e7;user-select:none}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
  .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid #1d2b34}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,#0d151c 0%,#122029 50%,#0d151c 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  .qitem{margin:10px 0}
  .qitem label{display:block;margin:6px 0}
  .qitem input, .qitem textarea{width:100%;background:#0f1820;color:var(--fg);border:1px solid #1b2a34;border-radius:10px;padding:10px}
</style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="row">
        <button class="btn ghost" onclick="history.back()">← Indietro</button>
        <button class="btn ghost" onclick="location.href='index.html'">🏠 Home</button>
      </div>
      <div class="row">
        <span id="freeBadge" class="badge" title="Long-press 2s: reset crediti · Triplo click: toggle Pro (solo dev)">Free oggi: —</span>
      </div>
    </div>

    <h1>Il tuo scenario</h1>
    <p class="sub">Per una risposta più personale, puoi fare prima 2–3 chiarimenti mirati.</p>

    <!-- STILE + PERIOD (solo display) -->
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="row">
          <span class="badge" id="badgePeriodo">🕰️ —</span>
          <span class="badge" id="badgeStile">🎭 —</span>
        </div>
        <div class="chips" id="styleChips">
          <button class="chip" data-style="whatif">What if (realistico)</button>
          <button class="chip" data-style="wtf">WTF (divertente)</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="label">Domanda</h3>
      <div id="question" class="box"></div>
      <div class="tools">
        <button class="btn" onclick="editQuestion()">Modifica domanda</button>
        <button class="btn" id="clarifyBtn">Chiarisci e genera</button>
        <button class="btn primary" id="genBtn">Genera subito</button>
        <button class="btn" id="regenBtn" style="display:none">Rigenera 🔁</button>
      </div>

      <div class="divider"></div>

      <h3 class="label">Risultato</h3>
      <div id="result" class="box">—</div>

      <div class="tools">
        <button class="btn" onclick="saveHistory()">💾 Salva</button>
        <button class="btn" onclick="copyText()">📋 Copia</button>
        <button class="btn" onclick="shareOut()">📤 Condividi</button>
      </div>
    </div>
  </main>

  <!-- Overlay chiarimenti -->
  <div class="overlay" id="clarifyOverlay">
    <div class="sheet">
      <h3 style="margin:6px 0">2–3 domande per essere più precisi</h3>
      <div id="clarifyList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="applyClarify">Genera con queste risposte</button>
        <button class="btn ghost" onclick="closeClarify()">Annulla</button>
      </div>
    </div>
  </div>

<script>
/* ====== Config ====== */
const LS = localStorage;
const DAILY_FREE = 3;
const lang = (LS.getItem("lang") || "it").toLowerCase();

/* ====== Helpers ====== */
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function readCredits(){const v=JSON.parse(LS.getItem('whatif_credits')||'{}');const t=todayStr();if(!v.date||v.date!==t)return{date:t,used:0,pro:!!v.pro};return v;}
function writeCredits(v){LS.setItem('whatif_credits',JSON.stringify(v));renderFreeBadge();}
function ensureCredits(){const c=readCredits();if(!c.date||c.date!==todayStr()){c.date=todayStr();c.used=0;writeCredits(c);}}

/* ====== Profilo (locale) ====== */
function buildProfilePayload(){
  const base = JSON.parse(LS.getItem('whatif_profile')||'{}');
  const micro = JSON.parse(LS.getItem('whatif_micro')||'{}');
  return { ...base, micro };
}
function saveMicroPatch(patch){
  const micro = JSON.parse(LS.getItem('whatif_micro')||'{}');
  Object.assign(micro, patch);
  LS.setItem('whatif_micro', JSON.stringify(micro));
}

/* ====== Badges ====== */
function renderFreeBadge(){
  const c=readCredits(); const left=Math.max(0, DAILY_FREE - (c.used||0));
  const el=document.getElementById('freeBadge'); if(!el) return;
  el.textContent = `Free oggi: ${left}/${DAILY_FREE}`;
}

/* ====== Stato iniziale ====== */
const prefs = JSON.parse(LS.getItem("whatif_prefs") || "{}");
let domanda = LS.getItem("domanda") || "";
if (!domanda) { alert("Nessuna domanda trovata."); location.href="fourth.html"; }
let currentStyle = (prefs.stile || "whatif");
const questionEl = document.getElementById("question");
const resultEl   = document.getElementById("result");
questionEl.textContent = domanda;
document.getElementById("badgePeriodo").textContent = "🕰️ " + (prefs.periodo==="past" ? "Passato" : "Futuro");
document.getElementById("badgeStile").textContent   = "🎭 " + (currentStyle==="wtf" ? "What the F" : "What if");
document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
document.getElementById("styleChips").addEventListener("click",(e)=>{
  const b=e.target.closest(".chip"); if(!b) return;
  currentStyle=b.dataset.style;
  document.getElementById("badgeStile").textContent = "🎭 " + (currentStyle==="wtf" ? "What the F" : "What if");
  document.querySelectorAll('#styleChips .chip').forEach(c=> c.classList.toggle('sel', c.dataset.style===currentStyle));
});

/* ====== API helpers ====== */
async function callClarifyAPI(){
  const payload = {
    domanda, lang, periodo:prefs.periodo||"future", stile:currentStyle,
    clarify:true, profilo:buildProfilePayload()
  };
  const r = await fetch("/api/ask", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error("server");
  return r.json();
}
async function callGenerateStream({ clarifications={}, extra="" }={}){
  const payload = {
    domanda, lang, periodo:prefs.periodo||"future", stile:currentStyle,
    clarify:false, stream:true, profilo:buildProfilePayload(),
    clarifications, extra
  };
  const r = await fetch("/api/ask", { method:"POST", headers:{ "Content-Type":"application/json","x-whatif-stream":"1" }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error("server");
  return r.body.getReader();
}

/* ====== Chiarimenti UI ====== */
const clarifyOverlay = document.getElementById('clarifyOverlay');
const clarifyList    = document.getElementById('clarifyList');
document.getElementById('clarifyBtn').addEventListener('click', openClarify);

async function openClarify(){
  clarifyList.innerHTML = `<p class="sub">Sto preparando 2–3 domande mirate…</p>`;
  clarifyOverlay.style.display='flex';
  try{
    const j = await callClarifyAPI();
    const qs = Array.isArray(j.questions)? j.questions.slice(0,3) : [];
    if (!qs.length){ clarifyList.innerHTML = `<p class="sub">Nessun chiarimento necessario. Puoi generare direttamente.</p>`; return; }
    clarifyList.innerHTML = qs.map(q=>`
      <div class="qitem">
        <label for="${q.id||''}">${escapeHTML(q.label||'Domanda')}</label>
        <input id="${q.id||''}" type="text" placeholder="${escapeAttr(q.placeholder||'Rispondi in una riga')}" />
      </div>`).join("");
  }catch(e){
    clarifyList.innerHTML = `<p class="sub">Errore nel recupero chiarimenti. Puoi generare direttamente.</p>`;
  }
}

function closeClarify(){ clarifyOverlay.style.display='none'; }

document.getElementById('applyClarify').addEventListener('click', async ()=>{
  const inputs = clarifyList.querySelectorAll('input');
  const clar = {}; inputs.forEach(i=>{ const v=(i.value||"").trim(); if(i.id&&v) clar[i.id]=v; });
  closeClarify();
  if (Object.keys(clar).length) saveMicroPatch(clar);
  await generate(false, clar);
});

/* ====== Generazione ====== */
document.getElementById('genBtn').addEventListener('click', ()=> generate());
document.getElementById('regenBtn').addEventListener('click', ()=> generate(true));

async function generate(isRegen=false, clarOverride=null){
  ensureCredits();
  const credits = readCredits();

  if (!isRegen && (credits.used||0) >= DAILY_FREE){
    alert("Hai raggiunto il limite gratuito di oggi. Torna domani!");
    return;
  }

  resultEl.textContent = "⏳ Sto generando… ";
  const sk = document.createElement("span"); sk.className="skeleton"; sk.style.width="40%"; resultEl.appendChild(sk);
  document.getElementById('regenBtn').style.display = 'none';

  try{
    const reader = await callGenerateStream({ clarifications: (clarOverride||{} ) });
    const decoder = new TextDecoder();
    let buffer="", text="";
    while(true){
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();
      for (const chunk of chunks){
        if (!chunk.startsWith("data: ")) continue;
        const data = JSON.parse(chunk.slice(6));
        if (data.token){ text += data.token; resultEl.textContent = text; }
        if (data.done){ resultEl.textContent = (text||"").trim(); }
        if (data.error){ resultEl.textContent = "Errore: "+(data.detail||""); }
      }
    }

    // conteggio solo alla generazione
    const c = readCredits();
    c.used = (c.used||0) + 1;
    writeCredits(c);

    document.getElementById('regenBtn').style.display = 'inline-block';

  }catch(e){
    console.error(e);
    resultEl.textContent = (e.message==='server' ? "Problema server." : "Errore di rete.");
  }
}

/* ====== Utility ====== */
function editQuestion(){ LS.setItem("domanda", domanda); location.href="fourth.html"; }
function saveHistory(){
  const arr = JSON.parse(LS.getItem("cronologia")||"[]");
  arr.unshift({ domanda, risposta:(resultEl.textContent||"").trim(), periodo:prefs.periodo||null, stile:currentStyle, lang, ts:Date.now() });
  LS.setItem("cronologia", JSON.stringify(arr));
  alert("Salvato!");
}
function copyText(){ navigator.clipboard.writeText(`Domanda: ${domanda}\n\n${resultEl.textContent}`).then(()=> alert("Copiato!")); }
function shareOut(){ const data={title:"What?f",text:`Domanda: ${domanda}\n\n${resultEl.textContent}`,url: location.href}; if (navigator.share) navigator.share(data).catch(()=>{}); else copyText(); }
function escapeHTML(s){return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(s){return String(s||"").replace(/"/g,'&quot;')}

/* ====== Dev helpers (long-press reset, triplo click Pro) ====== */
(function devHooks(){
  const badge = document.getElementById('freeBadge');
  if (!badge) return;

  // Long-press 2s = reset crediti odierni
  let pressT=null;
  badge.addEventListener('pointerdown', ()=> { pressT = setTimeout(resetToday, 2000); });
  badge.addEventListener('pointerup',   ()=> { clearTimeout(pressT); });
  badge.addEventListener('pointerleave',()=> { clearTimeout(pressT); });

  function resetToday(){
    const d=new Date();
    const today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const c=JSON.parse(localStorage.getItem('whatif_credits')||'{}');
    c.date=today; c.used=0;
    localStorage.setItem('whatif_credits', JSON.stringify(c));
    renderFreeBadge();
    alert('Crediti di oggi azzerati ✅');
  }

  // Triplo click = toggle Pro (per futuri test, non influisce ora)
  let clicks=0, timer=null;
  badge.addEventListener('click', ()=>{
    clicks++; clearTimeout(timer);
    timer=setTimeout(()=>{ if (clicks>=3) togglePro(); clicks=0; }, 250);
  });

  function togglePro(){
    const c=JSON.parse(localStorage.getItem('whatif_credits')||'{}');
    c.pro = !c.pro; c.used = 0;
    localStorage.setItem('whatif_credits', JSON.stringify(c));
    renderFreeBadge();
    alert('Pro '+(c.pro?'attivato':'disattivato')+' (solo locale) ✅');
  }
})();

/* ====== Avvio ====== */
ensureCredits(); renderFreeBadge();
</script>
</body>
</html>
