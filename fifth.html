<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risultato</title>
<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414; --fg:#FFFFFF; --muted:#A0B2BA;
    --acc:#1C57A0; --acc2:#FFEC01; --card:rgba(20,28,34,0.92);
    --line:rgba(255,255,255,.12); --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
  }
  html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
  *{box-sizing:border-box}
  html,body{margin:0;background: radial-gradient(900px 700px at 25% 20%, var(--bg2) 0%, var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  main{max-width:980px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:var(--ink);font-weight:800;box-shadow:0 6px 18px var(--shadow);border:none}
  h1{font-size:clamp(22px,5vw,32px);margin:10px 0 4px;color:var(--acc2)}
  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px var(--shadow)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .qbox,.abox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7;color:#EAF3EE;white-space:pre-wrap;font-size:17px;letter-spacing:.1px}
  .abox{min-height:170px}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  /* follow up */
  .follow .sug{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:12px 14px;border-radius:12px;margin:8px 0}
  .follow input{width:100%;height:46px;border-radius:12px;padding:10px 12px;border:1.2px solid rgba(255,255,255,.35);background:#132032;color:#fff}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <button class="btn" id="periodBtn">🕰️ —</button>
      <button class="btn" id="styleBtn">🎭 —</button>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="titleH1">Il tuo What?f</h1>

  <div class="card">
    <h3 class="label" id="qLabel">La tua domanda</h3>
    <div class="qbox" id="question">—</div>
  </div>

  <div class="card">
    <h3 class="label" id="rLabel">Risultato</h3>
    <div class="abox" id="answer">⏳ <span class="skeleton" style="width:40%"></span></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="saveBtn">💾 Salva</button>
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="shareBtn">📤 Condividi</button>
    </div>
  </div>

  <div class="card follow">
    <h3 class="label" id="fLabel">Domani continuiamo da qui</h3>
    <div id="sug1" class="sug">—</div>
    <div id="sug2" class="sug">—</div>
    <div style="text-align:center;margin:8px 0;color:#A0B2BA" id="orTxt">oppure</div>
    <input id="nextInput" type="text" placeholder="Scrivi tu cosa vuoi sapere domani…"/>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="nextBtn">Avanti</button>
    </div>
    <p id="fHint" style="color:#A0B2BA;margin:8px 0 0">Scegli un suggerimento o scrivi tu: lo useremo come episodio successivo.</p>
  </div>
</main>

<script>
/* ===== Helpers ===== */
const LS=localStorage;
function readJSON(k,def){try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def}}
function writeJSON(k,v){LS.setItem(k,JSON.stringify(v));}
function escapeHTML(s){return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])}
function getTZ(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch{ return 'UTC' }}
function $(id){return document.getElementById(id)}
/* ===== i18n ===== */
const I18N={ it:{
  title:"Il tuo What?f", qLabel:"La tua domanda", rLabel:"Risultato",
  fLabel:"Domani continuiamo da qui", or:"oppure",
  next:"Avanti", hint:"Scegli un suggerimento o scrivi tu: lo useremo come episodio successivo.",
  periodPast:"Passato", periodFuture:"Futuro", styleWIF:"What if", styleWTF:"What the F",
  saving:"Salvato!", copied:"Copiato!"
}, en:{
  title:"Your What?f", qLabel:"Your question", rLabel:"Result",
  fLabel:"Tomorrow we continue from here", or:"or",
  next:"Next", hint:"Pick a suggestion or write your own; we’ll use it for the next episode.",
  periodPast:"Past", periodFuture:"Future", styleWIF:"What if", styleWTF:"What the F",
  saving:"Saved!", copied:"Copied!"
}};
let lang=(LS.getItem('lang')||'it').toLowerCase();
function T(){return I18N[lang]||I18N.it}
/* ===== Prefs ===== */
const prefs=readJSON('whatif_prefs',{ periodo:'future', stile:'whatif' });
function setTheme(){ document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif'); }
setTheme();

/* ===== UI refs ===== */
const backBtn=$('backBtn'), homeBtn=$('homeBtn'), langBtn=$('langBtn'), periodBtn=$('periodBtn'), styleBtn=$('styleBtn');
const question=$('question'), answer=$('answer'), titleH1=$('titleH1');
const qLabel=$('qLabel'), rLabel=$('rLabel'), fLabel=$('fLabel'), orTxt=$('orTxt'), nextBtn=$('nextBtn'), fHint=$('fHint');
const sug1=$('sug1'), sug2=$('sug2'), nextInput=$('nextInput');
const saveBtn=$('saveBtn'), copyBtn=$('copyBtn'), shareBtn=$('shareBtn');

/* ===== Apply lang ===== */
function applyI18N(){
  document.documentElement.lang=lang;
  titleH1.textContent=T().title; qLabel.textContent=T().qLabel; rLabel.textContent=T().rLabel;
  fLabel.textContent=T().fLabel; orTxt.textContent=T().or; nextBtn.textContent=T().next; fHint.textContent=T().hint;
  langBtn.textContent=lang.toUpperCase();
  periodBtn.textContent='🕰️ '+(prefs.periodo==='past'?T().periodPast:T().periodFuture);
  styleBtn.textContent='🎭 '+(prefs.stile==='wtf'?T().styleWTF:T().styleWIF);
}
applyI18N();
langBtn.onclick=()=>{ lang=(lang==='it'?'en':'it'); LS.setItem('lang',lang); applyI18N(); };

/* ===== Nav ===== */
backBtn.onclick=()=>history.back(); homeBtn.onclick=()=>location.href='index.html';
periodBtn.onclick=()=>{ prefs.periodo = (prefs.periodo==='past'?'future':'past'); writeJSON('whatif_prefs',prefs); applyI18N(); };
styleBtn.onclick=()=>{ prefs.stile = (prefs.stile==='wtf'?'whatif':'wtf'); writeJSON('whatif_prefs',prefs); setTheme(); applyI18N(); };

/* ===== Load question ===== */
const domanda=(LS.getItem('domanda')||'').trim();
if(!domanda){ location.href='fourth.html'; }
question.textContent=domanda;

/* ===== Ask API (stream) ===== */
async function generate(){
  answer.textContent='⏳ '+(lang==='it'?'Sto immaginando il tuo scenario…':'Imagining your scenario…')+' ';
  const sk=document.createElement('span'); sk.className='skeleton'; sk.style.width='40%'; answer.appendChild(sk);
  const clar=readJSON('clar_override',null);
  try{
    const payload={ domanda, lang, periodo:prefs.periodo, stile:prefs.stile, clarify:false, stream:true, profilo:leanProfile(), clarifications: (clar||{}), now:new Date().toISOString(), tz:getTZ() };
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','x-whatif-stream':'1'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('server');
    const reader=r.body.getReader(); const decoder=new TextDecoder(); let buffer="", text="";
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buffer+=decoder.decode(value,{stream:true});
      const chunks=buffer.split("\n\n"); buffer=chunks.pop();
      for(const chunk of chunks){
        if(!chunk.startsWith('data: ')) continue;
        const data=JSON.parse(chunk.slice(6));
        if(data.token){ text+=data.token; answer.textContent=text; }
        if(data.done){ text = sanitize(prefs.stile,text); answer.textContent=text; prepareFollowups(text); }
        if(data.error){ answer.textContent = (lang==='it'?'Problema server.':'Server problem.'); }
      }
    }
  }catch(e){
    answer.textContent = (lang==='it'?'Errore di rete.':'Network error.');
  }
}
function sanitize(style, raw){
  let out=(raw||'').trim().replace(/[“”"«»]/g,'');
  if(style==='wtf'){
    const bits=out.split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
    const lines=[]; bits.forEach(b=>{ const w=b.split(/\s+/); for(let i=0;i<w.length;i+=15) lines.push(w.slice(i,i+15).join(' '));});
    let l=lines.filter(x=>!/(cuore|anima|destino)/i.test(x)).slice(0,11); while(l.length<7 && lines.length) l.push(lines.shift());
    if(!/bancone|domani|giro|conto/i.test(l[l.length-1]||'')) l.push(lang==='it'?'Clink. Stesso bancone, domani rimescoliamo.':'Clink. Same counter, we stir again tomorrow.');
    return l.join('\n');
  }else{
    const s=out.split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean).slice(0,13);
    return s.join('\n');
  }
}
function leanProfile(){ const p=readJSON('whatif_profile',{}); const o={}; if(p.name) o.name=String(p.name);
  if(p.city_now) o.city_now=String(p.city_now); else if(p.city) o.city=String(p.city);
  if(p.work_role) o.work_role=String(p.work_role); else if(p.role) o.role=String(p.role); return o; }

/* ===== Follow-ups ===== */
async function prepareFollowups(answerText){
  // prova lato server
  let q1="", q2="";
  try{
    const payload={ domanda, answer:answerText, lang, periodo:prefs.periodo, stile:prefs.stile, want:'followups' };
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.ok){ const j=await r.json(); if(j.followups && j.followups.length){ q1=j.followups[0]||''; q2=j.followups[1]||''; } }
  }catch(e){}
  // fallback
  if(!q1||!q2){
    const topic = (domanda.match(/[a-zA-Zà-ùÀ-Ù']+/g)||[]).slice(0,3).join(' ');
    if(lang==='it'){
      q1 = q1||`Qual è il primo segnale su “${topic}” che ti direbbe che sta funzionando?`;
      q2 = q2||`Cosa potresti fare entro 7 giorni per provare senza rischiare troppo?`;
    }else{
      q1 = q1||`What's the first signal around “${topic}” that would tell you it's working?`;
      q2 = q2||`What could you do within 7 days to try without big risks?`;
    }
  }
  sug1.textContent=q1; sug2.textContent=q2;
  sug1.onclick=()=>{ nextInput.value=sug1.textContent; }; sug2.onclick=()=>{ nextInput.value=sug2.textContent; };
}

/* ===== Save / Share ===== */
saveBtn.onclick=()=>{ const arr=readJSON('cronologia',[]); arr.unshift({domanda, risposta:(answer.textContent||'').trim(), periodo:prefs.periodo, stile:prefs.stile, lang, ts:Date.now()}); writeJSON('cronologia',arr.slice(0,200)); alert(T().saving); };
copyBtn.onclick=()=>{ navigator.clipboard.writeText(`${T().qLabel}: ${domanda}\n\n${answer.textContent}`).then(()=>alert(T().copied)); };
shareBtn.onclick=()=>{ const data={title:"What?f",text:`${T().qLabel}: ${domanda}\n\n${answer.textContent}`,url:location.href}; if(navigator.share) navigator.share(data).catch(()=>{}); else navigator.clipboard.writeText(`${T().qLabel}: ${domanda}\n\n${answer.textContent}`); };

/* ===== Next episode intent ===== */
nextBtn.onclick=()=>{
  const v=(nextInput.value||'').trim() || sug1.textContent || sug2.textContent || '';
  if(v){ writeJSON('whatif_next_prompt',{ base:domanda, next:v, ts:Date.now(), lang, periodo:prefs.periodo, stile:prefs.stile }); nextInput.value=''; }
  // piccolo toast
  nextBtn.textContent = lang==='it'?'Fatto ✅':'Saved ✅';
  setTimeout(()=>{ nextBtn.textContent=T().next; },1200);
};

/* ===== Boot ===== */
applyI18N();
generate();
</script>
<script> if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); } </script>
</body>
</html>
