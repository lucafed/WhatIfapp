<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Risultato</title>
<meta name="theme-color" content="#0A0F14" />
<style>
  :root{
    --bg:#0A0F14; --card:#141C22; --muted:#A0B2BA;
    --fg:#E6F2F5; --acc:#00E0FF; --acc2:#00B5CC; --chip:#0f1820;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:920px;margin:auto;padding:18px}
  .topbar{display:flex;gap:10px;align-items:center}
  .btn{appearance:none;border:none;background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2)); color:#001f26;font-weight:800}
  .btn.ghost{background:transparent;border:1px solid #1d2b34}
  h1{font-size:clamp(24px,5vw,32px);margin:16px 0 4px}
  p.sub{color:var(--muted);margin:0 0 12px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px rgba(0,0,0,.25)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .box{background:#0b1218;border:1px solid #18242c;border-radius:12px;padding:12px;white-space:pre-wrap}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .chip{background:#0f1820;border:1px solid #1b2a34;color:#cfe3e7;border-radius:999px;padding:8px 12px;font-size:12px}
  #result{min-height:160px;line-height:1.6}
  .tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .hint{font-size:12px;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:6000}
  .sheet{width:min(92vw,720px);max-height:75vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px}
  .hist-item{border:1px solid #1d2b34;border-radius:12px;padding:10px;margin:8px 0}
  .hist-item h4{margin:0 0 6px;color:var(--acc)}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,#0d151c 0%,#122029 50%,#0d151c 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
  <main>
    <div class="topbar">
      <button class="btn ghost" onclick="history.back()">← <span data-i18n="back">Indietro</span></button>
      <button class="btn ghost" onclick="location.href='index.html'">🏠 <span data-i18n="home">Home</span></button>
    </div>

    <h1 data-i18n="title">Il tuo scenario</h1>
    <p class="sub" data-i18n="subtitle">Risposta generata in base alle scelte precedenti.</p>

    <div class="row" id="badges"></div>

    <div class="card">
      <h3 class="label" data-i18n="question">Domanda</h3>
      <div id="question" class="box"></div>

      <div class="tools">
        <button class="btn" onclick="editQuestion()" data-i18n="edit">Modifica domanda</button>
        <button class="btn" onclick="generate()" data-i18n="regenerateWith">Rielabora con questa domanda</button>
      </div>

      <h3 class="label" style="margin-top:16px" data-i18n="answer">Risultato</h3>
      <div id="result" class="box">⏳ <span data-i18n="gen">Sto generando…</span> <span class="skeleton" style="width:40%"></span></div>

      <div class="tools">
        <button class="btn" onclick="generate()" data-i18n="regenerate">Rigenera 🔁</button>
        <button class="btn" onclick="saveHistory()" data-i18n="save">💾 Salva in cronologia</button>
        <button class="btn" onclick="openHistory()" data-i18n="seeHistory">📜 Vedi cronologia</button>
        <button class="btn" onclick="copyText()" data-i18n="copy">📋 Copia</button>
        <button class="btn" onclick="shareOut()" data-i18n="share">📤 Condividi</button>
      </div>

      <p class="hint" data-i18n="limitHint">Le risposte sono concise per invogliarti a proseguire. Puoi salvare e rielaborare quando vuoi.</p>
    </div>
  </main>

  <!-- Overlay cronologia -->
  <div class="overlay" id="histOverlay" onclick="closeHistory(event)">
    <div class="sheet">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h3 style="margin:6px 0" data-i18n="history">Cronologia</h3>
        <div>
          <button class="btn ghost" onclick="clearHistory()" data-i18n="clear">Svuota</button>
          <button class="btn" onclick="closeHistory()" data-i18n="close">Chiudi</button>
        </div>
      </div>
      <div id="histList"></div>
    </div>
  </div>

<script>
// ===== i18n =====
const DICT = {
  it: {
    back:"Indietro", home:"Home", title:"Il tuo scenario",
    subtitle:"Risposta generata in base alle scelte precedenti.",
    question:"Domanda", answer:"Risultato", gen:"Sto generando…",
    edit:"Modifica domanda", regenerateWith:"Rielabora con questa domanda",
    regenerate:"Rigenera 🔁", save:"💾 Salva in cronologia",
    seeHistory:"📜 Vedi cronologia", copy:"📋 Copia", share:"📤 Condividi",
    history:"Cronologia", clear:"Svuota", close:"Chiudi",
    limitHint:"Le risposte sono concise per invogliarti a proseguire. Puoi salvare e rielaborare quando vuoi.",
    err_network:"Errore di rete", err_server:"C’è stato un problema. Riprova.",
    badgePast:"Passato", badgeFuture:"Futuro", badgeWhatIf:"What if", badgeWTF:"What the F"
  },
  en: {
    back:"Back", home:"Home", title:"Your scenario",
    subtitle:"Answer generated from your previous choices.",
    question:"Question", answer:"Result", gen:"Generating…",
    edit:"Edit question", regenerateWith:"Re-run with this question",
    regenerate:"Regenerate 🔁", save:"💾 Save to history",
    seeHistory:"📜 View history", copy:"📋 Copy", share:"📤 Share",
    history:"History", clear:"Clear", close:"Close",
    limitHint:"Answers are concise to keep you curious. Save and re-run any time.",
    err_network:"Network error", err_server:"Something went wrong. Try again.",
    badgePast:"Past", badgeFuture:"Future", badgeWhatIf:"What if", badgeWTF:"What the F"
  }
};
const LS = localStorage;
const lang = (LS.getItem("lang") || "it").toLowerCase();
const T = DICT[lang] || DICT.it;
document.documentElement.lang = lang;
document.querySelectorAll("[data-i18n]").forEach(el=>{
  const k = el.getAttribute("data-i18n");
  if (T[k]) el.textContent = T[k];
});

// ===== stato =====
const prefs = JSON.parse(LS.getItem("whatif_prefs") || "{}"); // periodo/stile da index
let domanda = LS.getItem("domanda") || "";
const questionEl = document.getElementById("question");
const resultEl   = document.getElementById("result");
const badges     = document.getElementById("badges");

if (!domanda) {
  alert(lang==="en"?"No question found. Going back.":"Nessuna domanda trovata. Torno indietro.");
  location.href = "fourth.html";
}

// badge
(function renderBadges(){
  const row = [];
  if (prefs.periodo) {
    const lbl = prefs.periodo === "past" ? T.badgePast : T.badgeFuture;
    row.push(`<span class="chip">🕰️ ${lbl}</span>`);
  }
  if (prefs.stile) {
    const lbl = prefs.stile === "wtf" ? T.badgeWTF : T.badgeWhatIf;
    row.push(`<span class="chip">🎭 ${lbl}</span>`);
  }
  badges.innerHTML = row.join("");
})();

// mostra domanda
questionEl.textContent = domanda;

// ===== generazione (SSE) =====
const MAX_CHARS = 1200;
let lastAnswer = "";

async function generate() {
  lastAnswer = "";
  resultEl.textContent = "⏳ " + T.gen + " ";
  const sk = document.createElement("span");
  sk.className = "skeleton"; sk.style.width="40%";
  resultEl.appendChild(sk);

  const payload = {
    domanda,
    lang,
    periodo: prefs.periodo || "future",
    stile:   prefs.stile   || "whatif",
    profile: JSON.parse(LS.getItem("whatif_profile") || "{}"),
    archetypes: JSON.parse(LS.getItem("whatif_archetypes") || "{}"),
    stream: true
  };

  try{
    const res = await fetch("/api/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-whatif-stream":"1"},
      body: JSON.stringify(payload)
    });
    if (!res.ok) { resultEl.textContent = T.err_server; return; }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let text = "";

    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();

      for (const chunk of chunks){
        if (!chunk.startsWith("data: ")) continue;
        const data = JSON.parse(chunk.slice(6));

        if (data.token){
          if (text.length < MAX_CHARS){
            text += data.token;
            lastAnswer = text;
            resultEl.textContent = text;
          } else {
            lastAnswer = text.trim() + "…";
            resultEl.textContent = lastAnswer;
          }
        }
        if (data.done){
          resultEl.textContent = (lastAnswer || text || "").trim();
        }
        if (data.error){
          resultEl.textContent = T.err_server + " ("+ (data.detail||"") +")";
        }
      }
    }
  }catch(e){
    console.error(e);
    resultEl.textContent = T.err_network;
  }
}

// azioni
function editQuestion(){ LS.setItem("domanda", domanda); location.href = "fourth.html"; }
function saveHistory(){
  const arr = JSON.parse(LS.getItem("cronologia")||"[]");
  arr.unshift({
    domanda,
    risposta: (resultEl.textContent || "").trim(),
    periodo: prefs.periodo || null,
    stile: prefs.stile || null,
    lang, ts: Date.now()
  });
  LS.setItem("cronologia", JSON.stringify(arr));
  alert(lang==="en"?"Saved to history!":"Salvato nella cronologia!");
}
function openHistory(){
  const ov = document.getElementById("histOverlay");
  const list = document.getElementById("histList");
  const arr = JSON.parse(LS.getItem("cronologia")||"[]");
  if (!arr.length){ list.innerHTML = `<p class="hint">${lang==="en"?"Empty.":"Vuota."}</p>`; }
  else{
    list.innerHTML = arr.map((it,i)=>`
      <div class="hist-item">
        <h4>#${arr.length-i} — ${new Date(it.ts).toLocaleString()}</h4>
        <div class="hint">${(it.periodo||"")} ${(it.stile||"")}</div>
        <div class="label">${T.question}</div>
        <div class="box" style="margin-bottom:8px">${escapeHTML(it.domanda)}</div>
        <div class="label">${T.answer}</div>
        <div class="box">${escapeHTML(it.risposta||"")}</div>
      </div>
    `).join("");
  }
  ov.style.display="flex";
}
function closeHistory(ev){
  if (ev && ev.target && ev.target.id!=="histOverlay" && ev.type==="click") return;
  document.getElementById("histOverlay").style.display="none";
}
function clearHistory(){
  if (confirm(lang==="en"?"Clear history?":"Svuotare la cronologia?")){
    LS.removeItem("cronologia");
    openHistory();
  }
}
function copyText(){
  navigator.clipboard.writeText(`Domanda: ${domanda}\n\n${resultEl.textContent}`).then(()=>{
    alert(lang==="en"?"Copied!":"Copiato!");
  });
}
function shareOut(){
  const data = { title:"What?f", text:`Domanda: ${domanda}\n\n${resultEl.textContent}`, url: location.href };
  if (navigator.share) navigator.share(data).catch(()=>{});
  else copyText();
}
function escapeHTML(s){return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

// avvio
generate();
</script>
</body>
</html>
