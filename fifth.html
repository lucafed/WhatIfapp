<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f — Risultato</title><meta name="theme-color" content="#0A0F14"/>
<style>
  :root{
    --bg:#0A0F14;--card:#121820;--fg:#E6F2F5;--muted:#A0B2BA;
    --accent:#00E0FF;--accent2:#00B5CC;--yellow:#f7b23b;--teal:#00E0FF
  }
  *{box-sizing:border-box}
  html,body{
    height:100%;margin:0;color:var(--fg);
    background:var(--bg) url('/home-hero.png') no-repeat center top / contain fixed;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  main{max-width:860px;margin:0 auto;padding:22px 14px 40px;backdrop-filter: blur(2px)}
  .back{appearance:none;border:0;background:#0f1820;color:#d8ebef;border-radius:12px;padding:8px 12px;cursor:pointer;margin-top:8px}
  .meta{color:var(--muted);font-size:13px;margin-left:8px;display:inline-block}

  /* Titolo metà giallo/metà turchese */
  h1{margin:16px 0 10px;font-size:clamp(26px,6vw,40px);line-height:1.15}
  .split-title{background: linear-gradient(to right, var(--yellow) 0 50%, var(--teal) 50% 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}

  .card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
  .muted{color:var(--muted);font-size:14px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{appearance:none;border:0;border-radius:20px;padding:10px 14px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#00262f;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<main>
  <button class="back" onclick="location.href='fourth.html'">← Indietro</button>
  <span id="meta" class="meta"></span>

  <h1 class="split-title">Risultato</h1>

  <article id="answer" class="card">Sto preparando la tua risposta…</article>

  <div class="actions">
    <button class="btn" id="share">Condividi</button>
    <button class="btn" onclick="location.href='index.html'">Home</button>
  </div>

  <p class="muted">Vuoi la versione estesa con piani d’azione e alternative? (in arrivo)</p>
</main>

<script>
  const saved = JSON.parse(localStorage.getItem('whatif_answer')||'null');
  if(saved){
    document.getElementById('meta').textContent = saved.meta||'';
    document.getElementById('answer').textContent = saved.answer||'—';
  } else {
    document.getElementById('answer').textContent='Nessun risultato disponibile.';
  }

  // Share API (fallback: copia testo)
  document.getElementById('share').addEventListener('click', async ()=>{
    const text = `What?f — ${saved?.question||''}\n\n${saved?.answer||''}`;
    if(navigator.share){ try{ await navigator.share({ text }); }catch(_){} }
    else { try{ await navigator.clipboard.writeText(text); alert('Copiato negli appunti!'); }catch(_){ alert('Condivisione non disponibile.'); } }
  });
</script>
</body>
</html>
