<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Result</title>
<style>
  :root{--bg:#0B0B0C;--fg:#EAF3EE;--muted:#A0B2BA;--line:rgba(255,255,255,.12);--card:rgba(20,28,34,.92);--chip:#121A26;--acc:#1C57A0;--acc2:#FFEC01;--shadow:rgba(0,0,0,.35)}
  html[data-theme="wtf"]{--acc:#3A6B56;--acc2:#5A8C75}
  *{box-sizing:border-box} body{margin:0;background:#0B0B0C;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:980px;margin:auto;padding:18px}
  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px var(--shadow)}
  .label{color:var(--acc2);font-weight:800;margin:0 0 8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800;border:none}
  .chips{display:flex;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;cursor:pointer}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;font-weight:800}
  .qbox,.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.7;white-space:pre-wrap}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
  .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
  .qitem{margin:10px 0} .qitem label{display:block;margin:6px 0}
  .qitem input{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="chips" id="styleChips">
      <button class="chip" data-style="whatif" id="chipWhatIf">What if (realistico)</button>
      <button class="chip" data-style="wtf" id="chipWTF">What the F (divertente)</button>
    </div>
  </div>

  <div class="card">
    <h3 class="label">La tua domanda</h3>
    <div id="question" class="qbox">—</div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="clarifyBtn">✨ Chiarisci & genera</button>
      <button class="btn" id="genBtn">Genera subito</button>
    </div>
  </div>

  <div class="card">
    <h3 class="label">Risultato</h3>
    <div id="result" class="box">—</div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="regenBtn" style="display:none">🔁 Rigenera</button>
      <button class="btn" id="copyBtn">📋 Copia</button>
      <button class="btn" id="saveBtn">💾 Salva</button>
    </div>
  </div>
</main>

<!-- Clarify overlay -->
<div class="overlay" id="clarifyOverlay">
  <div class="sheet">
    <h3 style="margin:6px 0">2–3 domande mirate sulla tua domanda</h3>
    <div id="clarifyList"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="applyClarify">Genera con queste risposte</button>
      <button class="btn" id="cancelClarify">Annulla</button>
    </div>
  </div>
</div>

<script>
  const LS=localStorage; const $=id=>document.getElementById(id);
  const domanda = LS.getItem('domanda')||'';
  const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
  let currentStyle = prefs.stile || 'whatif';
  const lang = (LS.getItem('lang')||'it').toLowerCase();

  if(!domanda){ alert('Nessuna domanda trovata.'); location.href='fourth.html'; }

  $('question').textContent = domanda;
  document.querySelectorAll('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===currentStyle));
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');

  document.querySelectorAll('#styleChips .chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      currentStyle=c.dataset.style;
      document.querySelectorAll('#styleChips .chip').forEach(x=>x.classList.toggle('sel', x.dataset.style===currentStyle));
      document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
    });
  });

  $('backBtn').onclick=()=>history.back();
  $('homeBtn').onclick=()=>location.href='index.html';

  function buildLeanProfile(){
    const p=JSON.parse(LS.getItem('whatif_profile')||'{}');
    const lean={}; if(p.name) lean.name=p.name; if(p.city_now) lean.city_now=p.city_now; else if(p.city) lean.city=p.city;
    if(p.work_role) lean.work_role=p.work_role; else if(p.role) lean.role=p.role;
    return lean;
  }

  function getClarFromLS(){ try{ return JSON.parse(LS.getItem('whatif_micro')||'{}'); }catch{return {};}}

  async function callClarifyAPI(){
    const payload={
      domanda, lang, periodo:(prefs.periodo||'future'),
      stile: currentStyle, clarify: true, profilo: buildLeanProfile()
    };
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('server');
    return r.json();
  }

  function sanitizeOutput(style, raw){
    let out=(raw||'').trim().replace(/[“”"«»]/g,'');
    // de-dup righe/frasi adiacenti
    out=out.split(/\n+/).filter(Boolean).filter((ln,i,arr)=>ln.trim()!==(arr[i-1]||'').trim()).join('\n');
    out=out.replace(/(\.)(\s*\1)+/g,'.');

    const words = (s)=> (s.match(/\b[\p{L}\p{N}’']+\b/gu)||[]).length;

    if(style==='wtf'){
      const hook="Domani ti verso un altro giro e due domandine: vediamo dove porta.";
      if(!/domani/i.test(out)) out = out + (out.endsWith('.')?' ':' ') + hook;
      // niente potature aggressive; garantiamo solo max ~220 parole
      if (words(out)>220){
        // taglia sull'ultimo punto prima di 220
        const tokens=out.split(' ');
        out=tokens.slice(0,220).join(' ');
        if(!/domani/i.test(out)) out += ' ' + hook;
      }
      return out.trim();
    }else{
      const hook="Domani ti faccio due domande semplici e continuiamo da lì.";
      if(!/domani/i.test(out)) out = out + (out.endsWith('.')?' ':' ') + hook;
      if (words(out)>210){
        const tokens=out.split(' ');
        out=tokens.slice(0,210).join(' ');
        if(!/domani/i.test(out)) out += ' ' + hook;
      }
      return out.trim();
    }
  }

  async function callGenerateStream({clarifications={}}={}){
    const payload={
      domanda,
      lang,
      periodo:(prefs.periodo||'future'),
      stile: currentStyle,
      clarify:false,
      stream:true,
      profilo: buildLeanProfile(),
      clarifications,
      extra:""
    };
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','x-whatif-stream':'1'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('server');
    return r.body.getReader();
  }

  async function generate(isRegen=false, clarOverride=null){
    $('result').textContent='⏳ Sto immaginando lo scenario… '; const sk=document.createElement('span'); sk.className='skeleton'; sk.style.width='40%'; $('result').appendChild(sk);
    $('regenBtn').style.display='none';
    try{
      const reader=await callGenerateStream({clarifications:(clarOverride||getClarFromLS())});
      const decoder=new TextDecoder(); let buffer="", text="";
      for(;;){
        const {value,done}=await reader.read(); if(done) break;
        buffer+=decoder.decode(value,{stream:true});
        const chunks=buffer.split("\n\n"); buffer=chunks.pop();
        for(const chunk of chunks){
          if(!chunk.startsWith("data: ")) continue;
          const data=JSON.parse(chunk.slice(6));
          if(data.token){ text+=data.token; $('result').textContent=text; }
          if(data.done){
            const clean = sanitizeOutput(currentStyle, text);
            $('result').textContent = clean;
          }
          if(data.error){ $('result').textContent='Problema server.'; }
        }
      }
      $('regenBtn').style.display='inline-block';
    }catch(e){
      $('result').textContent='Errore di rete.';
    }
  }

  // Clarify overlay
  const overlay=$('clarifyOverlay'), list=$('clarifyList');
  $('clarifyBtn').onclick = async ()=>{
    overlay.style.display='flex';
    list.innerHTML='<p class="muted">Sto preparando 2–3 domande…</p>';
    try{
      const j=await callClarifyAPI();
      const qs=(j.questions||[]).slice(0,3);
      list.innerHTML=qs.map((q,i)=>`
        <div class="qitem">
          <label>${q.label||('Domanda '+(i+1))}</label>
          <input data-id="${q.id||('q'+(i+1))}" placeholder="${(q.placeholder||'').replace(/"/g,'&quot;')}" />
        </div>`).join('');
    }catch(e){
      list.innerHTML='<p class="muted">Non riesco adesso, riprova tra poco.</p>';
    }
  };
  $('cancelClarify').onclick = ()=> overlay.style.display='none';
  $('applyClarify').onclick = async ()=>{
    const clar={}; list.querySelectorAll('input').forEach(i=>{ const v=i.value.trim(); if(v) clar[i.dataset.id]=v; });
    overlay.style.display='none';
    // salva anche localmente
    const micro = Object.assign({}, JSON.parse(LS.getItem('whatif_micro')||'{}'), clar);
    LS.setItem('whatif_micro', JSON.stringify(micro));
    await generate(false, clar);
  };

  $('genBtn').onclick = ()=> generate(false, getClarFromLS());
  $('regenBtn').onclick = ()=> generate(true, getClarFromLS());
  $('copyBtn').onclick = ()=> navigator.clipboard.writeText(`${domanda}\n\n${$('result').textContent}`).then(()=>alert('Copiato!'));
  $('saveBtn').onclick = ()=>{
    const arr=JSON.parse(LS.getItem('cronologia')||'[]');
    arr.unshift({ domanda, risposta:$('result').textContent.trim(), periodo:prefs.periodo||null, stile:currentStyle, lang, ts:Date.now() });
    LS.setItem('cronologia', JSON.stringify(arr));
    alert('Salvato!');
  };

  // autogen all'arrivo
  generate(false, getClarFromLS());
</script>
</body>
</html>
