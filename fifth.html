<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risposta</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75;
  --card:rgba(20,28,34,.92); --line:rgba(255,255,255,.12);
  --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:auto;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:clamp(22px,5vw,30px);margin:12px 0;color:var(--acc2);text-align:center}
.label{color:var(--acc);font-weight:800;margin:0 0 8px}
.answer{white-space:pre-wrap;line-height:1.55;font-size:18px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>

  <!-- Top -->
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="periodoBadge">🕰️ —</span>
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="toneBadge" style="display:none">♪ —</span>
      <span class="badge" id="freeBadge">—</span>
      <button class="btn" id="langBtn">IT</button>
    </div>
  </div>

  <h1 id="h1">La tua storia</h1>

  <div class="card">
    <div class="label" id="qLabel">Domanda</div>
    <div id="qShow" class="small"></div>
  </div>

  <div class="card">
    <div class="label">Risposta</div>
    <div id="answer" class="answer">···</div>
  </div>

  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="regenBtn">↻ Rigenera</button>
      <button class="btn" id="copyBtn">📋 Copia</button>
    </div>
    <div class="row">
      <button class="btn primary" id="saveBtn">💾 Salva nella cronologia</button>
    </div>
  </div>

  <div class="small" id="meta"></div>

</main>

<script>
const LS=localStorage;
const lang=(LS.getItem('lang')||'it').toLowerCase();
document.documentElement.lang=lang;

// theme from prefs
const prefs = JSON.parse(LS.getItem('whatif_prefs')||'{}');
document.documentElement.setAttribute('data-theme', prefs.stile==='wtf'?'wtf':'whatif');

// badges
function renderBadges(req){
  document.getElementById('periodoBadge').textContent = "🕰️ " + (req.periodo==='past'? (lang==='en'?'Past':'Passato') : (lang==='en'?'Future':'Futuro'));
  document.getElementById('styleBadge').textContent   = "🎭 " + (req.stile==='wtf'? 'What the F' : 'What if');
  const toneBadge = document.getElementById('toneBadge');
  if (req.stile==='whatif'){
    toneBadge.style.display='inline-block';
    toneBadge.textContent = '♪ ' + (req.whatif_tone==='poetic' ? (lang==='en'?'Poetic':'Poetico') : (lang==='en'?'Real':'Reale'));
  } else toneBadge.style.display='none';
  const c=JSON.parse(LS.getItem('whatif_credits')||'{"date":"","used":0}');
  const cap= (prefs.pro?10:3);
  const left = (c && typeof c.used==='number') ? Math.max(0, (prefs.pro?10:3) - c.used) : (prefs.pro?10:3);
  document.getElementById('freeBadge').textContent = (lang==='en'?`Credits: ${left}/${cap}`:`Crediti: ${left}/${cap}`);
}

// read request
const req = JSON.parse(LS.getItem('whatif_request')||'{}');
if(!req || !req.domanda){ document.getElementById('answer').textContent = (lang==='en'?'Missing question.':'Domanda mancante.'); }
renderBadges(req);
document.getElementById('qShow').textContent = req.domanda || '—';

// commons
document.getElementById('backBtn').onclick=()=>history.back();
document.getElementById('homeBtn').onclick=()=>location.href='index.html';
document.getElementById('langBtn').onclick=()=>{ LS.setItem('lang',lang==='it'?'en':'it'); location.reload(); };

// fetch answer
const answerEl = document.getElementById('answer');
async function callAPI(){
  answerEl.textContent = '···';
  try{
    const res = await fetch('/api/ask', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-pro': (prefs.pro?'1':'0') },
      body: JSON.stringify({
        domanda: req.domanda,
        stile: req.stile || 'whatif',
        lang,
        extra: req.extra || '',
        periodo: req.periodo || 'future',
        sex: (JSON.parse(LS.getItem('whatif_profile')||'{}').sex || ''),
        micro: req.micro || JSON.parse(LS.getItem('micro_profile')||'{}'),
        whatif_tone: req.whatif_tone || (prefs.whatif_tone||'real'),
        remember: true
      })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data?.error||'server'); }
    answerEl.textContent = data.answer || '—';
    document.getElementById('meta').textContent =
      (lang==='en'
        ? `Model: ${data.model} · Style: ${data.style}${data.whatif_tone?`/${data.whatif_tone}`:''}`
        : `Modello: ${data.model} · Stile: ${data.style}${data.whatif_tone?`/${data.whatif_tone}`:''}`);
    // auto-save minimal last
    LS.setItem('last_answer', JSON.stringify({ ts:Date.now(), domanda:req.domanda, answer:data.answer, stile:req.stile||'whatif' }));
  }catch(e){
    answerEl.textContent = (lang==='en'?'Error generating answer.':'Errore nella generazione.');
  }
}
callAPI();

// actions
document.getElementById('regenBtn').onclick=callAPI;
document.getElementById('copyBtn').onclick=async()=>{
  try{ await navigator.clipboard.writeText(answerEl.textContent||''); }catch{}
};
document.getElementById('saveBtn').onclick=()=>{
  const now = Date.now();
  const arr = JSON.parse(LS.getItem('cronologia')||'[]');
  arr.push({ ts:now, domanda:req.domanda, risposta:answerEl.textContent||'', stile:req.stile||'whatif' });
  LS.setItem('cronologia', JSON.stringify(arr));
  alert(lang==='en'?'Saved to history.':'Salvato in cronologia.');
};
</script>
</body>
</html>
