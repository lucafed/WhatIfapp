<!DOCTYPE html>
<html lang="it" data-theme="whatif">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Risultato</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{
  --bg:#0B0B0C; --bg2:#101414; --fg:#FFF; --muted:#A0B2BA;
  --acc:#1C57A0; --acc2:#FFEC01; --wtf1:#3A6B56; --wtf2:#5A8C75; --ink:#0A0E12;
  --glow: rgba(255, 236, 1, .22);
}
html[data-theme="wtf"]{ --acc:var(--wtf1); --acc2:var(--wtf2); }
*{box-sizing:border-box}
html,body{
  margin:0;
  background:
    radial-gradient(900px 700px at 20% 18%, var(--bg2) 0%, var(--bg) 60%),
    radial-gradient(600px 480px at 80% 12%, rgba(255,236,1,.06), transparent 60%),
    radial-gradient(700px 560px at 50% 90%, rgba(28,87,160,.10), transparent 65%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:860px;margin:auto;padding:22px}
h1{
  font-size:clamp(22px,5vw,30px);
  color:var(--acc2);
  text-align:center;
  margin:12px 0 6px;
  text-shadow: 0 0 18px var(--glow);
}
.sub{color:var(--muted);text-align:center;margin:0 0 8px}
.card{
  background:rgba(20,28,34,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  margin-top:16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.label{color:var(--acc);font-weight:800;margin-bottom:8px}
.input{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px;
}
.story{
  white-space:normal;
  line-height:1.68;
  font-size:18px;
  letter-spacing:.1px;
  text-wrap:pretty;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 28px var(--glow);
}
.btn.ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.10);margin:12px 0}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:#eaf3ee;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;
}
.lead{
  color:#E7F2EE;font-size:14px;line-height:1.45;opacity:.86;margin:2px 0 10px;
}
.fade-in{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.embit { padding:0 .08em; box-shadow:0 -4px 0 0 rgba(255,255,255,.05) inset; text-shadow:0 0 12px rgba(255,255,255,.08); border-radius:4px; }
.select{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer; }

/* Percentuale in alto */
.pct-top{display:flex;justify-content:center;margin:6px 0 12px}
.pct-pill{
  min-width:88px;text-align:center;font-weight:900;
  background:linear-gradient(180deg,var(--acc),var(--acc2));
  color:var(--ink); border-radius:12px; padding:8px 12px;
  box-shadow:0 6px 18px rgba(0,0,0,.28), 0 0 18px var(--glow);
  font-size:18px;
}

/* Motivazioni sotto */
.reasons-wrap{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.reason{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;padding:10px 12px;line-height:1.45
}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn ghost" id="backBtn">←</button>
      <button class="btn ghost" id="homeBtn">🏠</button>
    </div>
    <div class="row" style="gap:8px">
      <span class="badge" id="styleBadge">🎭 —</span>
      <span class="badge" id="proBadge" title="" style="display:none">🧪 TEST · ⭐ PRO</span>
      <select id="langSelect" class="select" aria-label="Language">
        <option value="it">IT · Italiano</option>
        <option value="en">EN · English</option>
        <option value="es">ES · Español</option>
        <option value="fr">FR · Français</option>
        <option value="de">DE · Deutsch</option>
      </select>
    </div>
  </div>

  <h1 id="title">Risultato</h1>
  <p class="sub" id="subtitle">—</p>

  <div class="card">
    <div class="label" id="lblQ">La tua domanda</div>
    <div class="input" id="qView" style="min-height:46px"></div>
  </div>

  <div class="card">
    <div class="label" id="lblA">Risposta</div>

    <!-- Percentuale in alto -->
    <div class="pct-top"><div id="topPct" class="pct-pill">—</div></div>

    <div id="lead" class="lead fade-in">—</div>
    <div id="answer" class="story">⏳ …</div>

    <!-- MOTIVAZIONI sotto -->
    <div class="hr"></div>
    <div class="label" id="lblP">Motivazioni</div>
    <div id="probBlock" class="reasons-wrap"></div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn">📤 Condividi / Copia</button>
      <button class="btn ghost" id="againBtn">🔁 Fai un’altra domanda</button>
    </div>
    <p class="small" id="metaInfo"></p>
  </div>
</main>

<script>
/* ==== Base state ==== */
const LS = localStorage;
const prefs = JSON.parse(LS.getItem('whatif_prefs') || '{}');
const style = prefs.stile || 'whatif';
const periodo = prefs.periodo || 'future';
let lang  = (LS.getItem('lang') || 'it').toLowerCase();
if(!['it','en','es','fr','de'].includes(lang)) lang = 'it';

document.documentElement.setAttribute('data-theme', style === 'wtf' ? 'wtf' : 'whatif');
document.documentElement.lang = lang;

/* ==== PRO badge ==== */
(function showProBadge(){
  const el = document.getElementById('proBadge');
  const hasToken = !!LS.getItem('admin_token');
  if (hasToken || prefs.pro === true){
    el.style.display = 'inline-flex';
    el.textContent = '🧪 TEST · ⭐ PRO';
    el.title = (lang === 'en') ? 'Test mode active' : (
               lang === 'es') ? 'Modo de prueba activo' : (
               lang === 'fr') ? 'Mode test actif' :
               (lang === 'de') ? 'Testmodus aktiv' : 'Modalità test attiva';
  }
})();

/* ==== I18N (UI) ==== */
const I18N = {
  it:{ titleWTF:"⚡ What the F — Risultato", titleWHF:"💡 What if — Risultato",
       sub:(q)=>`Domanda: “${q}”`, q:"La tua domanda", a:"Risposta",
       p:"Motivazioni", share:"📤 Condividi / Copia", again:"🔁 Fai un’altra domanda",
       copied:"Copiato!", error:"[errore server]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Stile: What the F · 6–9 frasi · paragrafo unico · 2–3 reazioni demenziali · doppia punchline · modalità: ${p==='past'?'Passato':'Futuro'}.`
        : `Stile: What if (60% analisi, 40% reale) · 8–11 frasi · paragrafo unico · nessun elenco/domanda/emoji · modalità: ${p==='past'?'Passato':'Futuro'}.`,
       back:"← Indietro", home:"🏠 Home" },
  en:{ titleWTF:"⚡ What the F — Result", titleWHF:"💡 What if — Result",
       sub:(q)=>`Question: “${q}”`, q:"Your question", a:"Answer",
       p:"Reasons", share:"📤 Share / Copy", again:"🔁 Ask another",
       copied:"Copied!", error:"[server error]",
       styleWTF:"🎭 What the F", styleWHF:"🎭 What if",
       meta:(st,p)=> st==='wtf'
        ? `Style: What the F · 6–9 sentences · single paragraph · 2–3 absurd object reactions · double punchline · mode: ${p==='past'?'Past':'Future'}.`
        : `Style: What if (60% analysis, 40% real) · 8–11 sentences · single paragraph · no lists/questions/emojis · mode: ${p==='past'?'Past':'Future'}.`,
       back:"← Back", home:"🏠 Home" }
};
I18N.es=I18N.en; I18N.fr=I18N.en; I18N.de=I18N.en;

/* ==== Leads ==== */
const LEADS = {
  it:{ wtf:[
      "Entri piano, il caos ti riconosce e oggi ti lascia passare.",
      "Respiri e lasci che sia il destino a inciampare per primo."
    ],
    whatif:[
      "Metti giù le chiavi e lasci parlare il silenzio che non ti giudica.",
      "La stanza è la stessa, lo sguardo no: è già un inizio."
    ]},
  en:{ wtf:["You step in slowly; chaos recognizes you and lets you through."],
       whatif:["Set the keys down and let the quiet that doesn’t judge go first."]}
};

/* ==== UI refs ==== */
const qs = (sel)=>document.querySelector(sel);
const setText = (id, txt)=>{ const el=qs(id); if(el) el.textContent = txt; };

const titleH1  = qs('#title');
const subtitle = qs('#subtitle');
const lblQ     = qs('#lblQ');
const lblA     = qs('#lblA');
const qView    = qs('#qView');
const leadNode = qs('#lead');
const answerEl = qs('#answer');
const styleBadge = qs('#styleBadge');
const probBlock = qs('#probBlock');
const lblP = qs('#lblP');

/* ==== Helpers ==== */
function normalizeOneParagraph(s=""){
  return String(s).replace(/\s*\n+\s*/g," ").replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function oneSentence(s=""){ let t=String(s).trim(); const m=t.match(/^([\s\S]*?[.!?…])\s/); if(m) t=m[1]; if(!/[.!?…]$/.test(t)) t+="."; return t; }

/* Decorazione em-dash */
function decorateEmBits(el){
  const raw = el.textContent;
  if(!raw || !raw.includes("—")) return;
  const parts = raw.split("—");
  let html = "";
  for(let i=0;i<parts.length;i++){
    const seg = parts[i].replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(i%2===1) html += `<span class="embit">— ${seg} </span>`;
    else html += (i===0 ? seg : `—${seg}`);
  }
  el.innerHTML = html;
}

/* ==== Titles ==== */
const periodo = prefs.periodo || 'future';
function setTitlesAndTexts(q){
  const T = I18N[lang] || I18N.it;
  setText('#title', style==='wtf' ? T.titleWTF : T.titleWHF);
  subtitle.textContent = T.sub(q || '—');
  lblQ.textContent = T.q;
  lblA.textContent = T.a;
  lblP.textContent = T.p;
  styleBadge.textContent = (style==='wtf') ? T.styleWTF : T.styleWHF;
  qs('#metaInfo').textContent = T.meta(style, periodo);

  const bank = (LEADS[lang] && LEADS[lang][style]) ? LEADS[lang][style]
               : (LEADS.it[style] || LEADS.it.whatif);
  const line = oneSentence(pick(bank) || '');
  leadNode.textContent = line || '—';
}

/* ==== Variazione & Topic Extraction (no “perché”) ==== */
function seedRNG(seedStr){
  let s=[...String(seedStr||'')].reduce((a,c)=>a+c.charCodeAt(0),0) || Date.now()%1e6;
  return ()=>{ s=(s*9301+49297)%233280; return s/233280; };
}
function shuffle(arr, rnd=Math.random){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n,rnd=Math.random){ return shuffle(arr,rnd).slice(0,Math.max(0,Math.min(n,arr.length))); }

const STOP = {
  it: new Set("e ed che di del della delle dei degli da in con su per tra fra a al alla allo agli alle un una uno il lo la i gli le mi ti si ci vi o ma se non più meno come così anche già poi solo almeno quasi invece tipo tempo giorno giorni mese mesi anni anno oggi domani ieri molto tanto quasi davvero".split(" ")),
  en: new Set("the a an and or but so of to in on at for with from by as is are was were be been being have has had do does did not no yes more less like just very really already only also then today tomorrow yesterday".split(" ")),
  es: new Set("y o pero de del la el los las un una uno unas unos en con por para desde hasta como ya solo tambien muy mas menos hoy manana ayer".split(" ")),
  fr: new Set("et ou mais de du des la le les un une en avec pour par comme deja seulement aussi tres plus moins aujourd'hui demain hier".split(" ")),
  de: new Set("und oder aber der die das den dem des ein eine einer einem einen zu von mit fur aus nach bei wie schon nur auch sehr mehr weniger heute morgen gestern".split(" "))
};

function extractTopics(txt, lang){
  const words = String(txt||"").toLowerCase()
    .normalize('NFKD').replace(/[^\p{L}\p{N}\s]/gu," ")
    .split(/\s+/).filter(w=>w.length>3 && !STOP[lang]?.has(w));
  const bigrams=[];
  for(let i=0;i<words.length-1;i++){
    if(words[i]!==words[i+1]) bigrams.push(words[i]+" "+words[i+1]);
  }
  const counts=new Map();
  [...words, ...bigrams].forEach(w=>counts.set(w,(counts.get(w)||0)+1));
  const ranked=[...counts.entries()].sort((a,b)=>b[1]-a[1]).map(([w])=>w);
  return ranked.slice(0,6);
}

/* ==== Costruzione % e motivazioni collegate alla risposta ==== */
function buildPctAndReasons({style, absurd, lang, domanda, answerText}){
  const seed = `${Date.now()}|${domanda}|${answerText}|${style}|${absurd}|${lang}`;
  const rnd = seedRNG(seed);
  const topics = extractTopics(answerText || domanda || "", lang);
  const topic = (topics[0] || (lang==='it'?'il piano':'the plan'));
  const topic2 = (topics[1] || (lang==='it'?'la routine':'the routine'));

  function T(arr){ return pickN(arr,3,rnd); }

  if(style==='whatif' && !absurd){
    const primary = Math.floor(55 + rnd()*30); // 55–85%
    const stock_it = [
      `strumenti già pronti: ${topic}`,
      `slot in agenda trovati, il resto è esecuzione`,
      `rischio basso: salti un giorno e non crolla niente`,
      `segnali misurabili su ${topic2}`,
      `dipendenze corte e chiare`
    ];
    const stock_en = [
      `tools already set: ${topic}`,
      `calendar slots found, rest is execution`,
      `low risk: skip a day, nothing breaks`,
      `measurable early signals on ${topic2}`,
      `short, clear dependencies`
    ];
    const reasons = (lang==='it') ? T(stock_it) : T(stock_en);
    return { primaryPct: primary+"%", reasons };
  }

  if(style==='whatif' && absurd){
    const primary = Math.floor(150 + rnd()*1100); // 150–1250%
    const stock_it = [
      `piccioni favorevoli a ${topic}`,
      `alea ubriaca: moneta che cade dal tuo lato`,
      `momento propizio: il caso ha sonno`,
      `universo in modalità “ti apro la porta”`,
      `karma in promo su ${topic2}`
    ];
    const stock_en = [
      `pigeons backing ${topic}`,
      `drunk luck: coin leaning your way`,
      `window of nonsense: randomness is sleepy`,
      `universe in “door opens for you” mode`,
      `karma discount on ${topic2}`
    ];
    const reasons = (lang==='it') ? T(stock_it) : T(stock_en);
    return { primaryPct: primary+"%", reasons };
  }

  // WTF
  const primary = Math.floor(120 + rnd()*480); // 120–600%
  const stock_it = [
    `due spritz e zero scuse su ${topic}`,
    `gruppo WhatsApp già caldo: “facciamo?”`,
    `stasera spingi, domattina ghiaccio in fronte`,
    `budget da bar, risultati da palco`,
    `playlist giusta, testa leggera, ${topic2} parte`
  ];
  const stock_en = [
    `two spritz, zero excuses on ${topic}`,
    `group chat already yelling “we doing this?”`,
    `push tonight, ice pack tomorrow`,
    `bar budget, stage results`,
    `right playlist, light head, ${topic2} starts`
  ];
  const reasons = (lang==='it') ? T(stock_it) : T(stock_en);
  return { primaryPct: primary+"%", reasons };
}

/* ==== Renderers ==== */
function renderTopPct(pct){
  const el = document.getElementById('topPct');
  el.textContent = pct || '—';
}
function renderReasons(reasons){
  probBlock.innerHTML = '';
  (reasons||[]).forEach(txt=>{
    const row = document.createElement('div');
    row.className = 'reason';
    row.textContent = txt;
    probBlock.appendChild(row);
  });
}

/* ==== Load & fetch ==== */
const params = new URLSearchParams(location.search);

(async ()=>{
  const req = JSON.parse(LS.getItem('whatif_request')||'{}');
  const absurdFlag = req.absurd === true || LS.getItem('absurd_prompt') === '1';

  // domanda
  let domanda = req.domanda || LS.getItem('domanda') || "";
  setTitlesAndTexts(domanda);
  qs('#qView').textContent = domanda || '—';

  // fetch risposta
  try{
    const headers = { "Content-Type": "application/json" };
    if (prefs.pro === true) headers["x-pro"] = "1";
    const adminToken = localStorage.getItem("admin_token");
    if (adminToken) headers["x-admin-token"] = adminToken;

    const r = await fetch("/api/ask",{
      method:"POST",
      headers,
      body:JSON.stringify({
        domanda, lang, stile: style, periodo, extra:"", micro:req.micro||{}
      })
    });
    const data = await r.json().catch(()=>null);
    if(!r.ok || !data || !data.answer) throw new Error(data?.detail||"bad_response");

    let answerText = normalizeOneParagraph((data.answer||"").trim());
    if(!/[.!?…]$/.test(answerText)) answerText += ".";
    qs('#answer').textContent = answerText;
    decorateEmBits(qs('#answer'));

    // >>> % in alto + motivazioni sotto (dinamici, legati alla risposta)
    const { primaryPct, reasons } = buildPctAndReasons({
      style,
      absurd: absurdFlag,
      lang,
      domanda,
      answerText
    });
    renderTopPct(primaryPct);
    renderReasons(reasons);

    // storia
    const hist = JSON.parse(LS.getItem('cronologia')||'[]');
    hist.push({ domanda, risposta:answerText, stile:style, periodo, ts:Date.now() });
    LS.setItem('cronologia', JSON.stringify(hist.slice(-50)));
  }catch(e){
    qs('#answer').textContent = (I18N[lang]||I18N.it).error;
    console.error(e);
  }
})();

/* ==== Nav / lingua ==== */
qs('#backBtn').onclick = ()=> history.length > 1 ? history.back() : location.replace('index.html');
qs('#homeBtn').onclick = ()=> location.href='index.html';
qs('#langSelect').onchange = ()=>{
  lang = qs('#langSelect').value;
  LS.setItem('lang', lang);
  document.documentElement.lang = lang;
  location.reload();
};
qs('#shareBtn').onclick = async()=>{
  const T = I18N[lang] || I18N.it;
  const full = `What?f — ${style==='wtf'?(T.styleWTF||'What the F'):(T.styleWHF||'What if')}\n(${periodo})\n\nQ: ${LS.getItem('domanda')}\n\n${qs('#answer').textContent}`;
  try{
    if(navigator.share){ await navigator.share({ title: "What?f", text: full }); }
    else{
      await navigator.clipboard.writeText(full);
      const b=qs('#shareBtn'); b.textContent=T.copied; setTimeout(()=>b.textContent=T.share,1200);
    }
  }catch{}
};
qs('#againBtn').onclick = ()=>{ location.href='fourth.html'; };
</script>
</body>
</html>
