<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What?f – Episodio</title>
<meta name="theme-color" content="#0B0B0C" />
<link rel="manifest" href="/manifest.json" />
<style>
  :root{
    --bg:#0B0B0C; --bg2:#101414; --fg:#FFFFFF; --muted:#A0B2BA;
    --acc:#1C57A0; --acc2:#FFEC01; --card:rgba(20,28,34,0.92); --line:rgba(255,255,255,.12);
    --chip:#121A26; --ink:#0A0E12; --shadow:rgba(0,0,0,.35); --hi:#FFEC01;
  }
  html[data-theme="wtf"]{ --acc:#3A6B56; --acc2:#5A8C75; }
  *{box-sizing:border-box} html,body{margin:0;background:radial-gradient(900px 700px at 25% 20%,var(--bg2) 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  main{max-width:980px;margin:auto;padding:18px}
  h1{font-size:clamp(22px,5vw,30px);margin:14px 0 2px;color:var(--acc2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 28px var(--shadow);backdrop-filter:blur(12px)}
  .label{color:var(--acc);font-weight:800;margin:0 0 8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none;box-shadow:0 6px 18px var(--shadow)}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#eaf3ee;user-select:none}
  .qbox{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:4px solid var(--hi);border-radius:12px;padding:16px;color:#EAF3EE;max-width:68ch;margin:0 auto}
  .box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7;color:#EAF3EE;white-space:pre-wrap;font-size:17px;letter-spacing:.1px;max-width:68ch;margin:0 auto}
  #result{min-height:220px}
  .skeleton{display:inline-block;min-width:6px;min-height:1em;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sk 1s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);color:#eaf3ee;border-radius:999px;padding:8px 12px;font-size:13px}
  .chip.sel{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;border:none}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6000;padding:14px}
  .sheet{width:min(92vw,720px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
  .qitem{margin:10px 0} .qitem label{display:block;margin:6px 0;color:#cfe8ff}
  .qitem input{width:100%;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="btn" id="backBtn">←</button>
      <button class="btn" id="homeBtn">🏠</button>
    </div>
    <div class="row">
      <span class="badge" id="badgePeriodo">🕰️ —</span>
      <span class="badge" id="badgeStile">🎭 —</span>
    </div>
  </div>

  <h1 id="titleH1">Il tuo episodio</h1>

  <div class="card">
    <h3 class="label">Domanda</h3>
    <div id="question" class="qbox">—</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 class="label" style="margin:0">Risultato</h3>
      <div class="chips" id="styleChips">
        <span class="chip sel" data-style="whatif">What?f</span>
        <span class="chip" data-style="wtf">What the F</span>
      </div>
    </div>
    <div id="result" class="box">—</div>
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="btn" id="clarifyBtn">✨ Chiarisci</button>
      <button class="btn primary" id="regenBtn">Rigenera</button>
      <button class="btn" id="saveBtn">💾 Salva</button>
      <button class="btn" id="copyBtn">📋 Copia</button>
    </div>
  </div>
</main>

<!-- Clarify overlay -->
<div class="overlay" id="clarifyOverlay">
  <div class="sheet">
    <h3 style="margin:6px 0">2–3 domande mirate su questa storia</h3>
    <div id="clarifyList"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="btn" id="cancelClarify">Annulla</button>
      <button class="btn primary" id="applyClarify">Genera con queste risposte</button>
    </div>
  </div>
</div>

<script>
/* ========== helpers ========== */
const LS=localStorage, $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getTZ(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }catch{ return 'UTC'; } }
function readJSON(k,def={}){ try{return JSON.parse(LS.getItem(k)||JSON.stringify(def));}catch{return def;} }
function writeJSON(k,v){ LS.setItem(k, JSON.stringify(v)); }
function detectLang(text=""){ 
  const enHits=(text.match(/\b(what|if|and|or|you|would|move|work|buy|motor|bike|city)\b/gi)||[]).length;
  const itHits=(text.match(/\b(e|se|quando|perché|moto|tornassi|trasferir|lavor|comprare|acquistare)\b/gi)||[]).length;
  return enHits>itHits?"en":"it";
}

/* ========== stato base ========== */
const domanda = (LS.getItem('domanda')||"").trim();
if(!domanda){ alert("Nessuna domanda trovata."); location.href="fourth.html"; }
$('#question').textContent = domanda;

const prefs = readJSON('whatif_prefs',{stile:'whatif', periodo:'future'});
let currentStyle = prefs.stile || 'whatif';
document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
$('#badgePeriodo').textContent = "🕰️ " + (prefs.periodo==='past'?'Passato':'Futuro');
$('#badgeStile').textContent = "🎭 " + (currentStyle==='wtf'?'What the F':'What?f');
$$('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.style===currentStyle));

/* ========== profilo lean ========== */
function buildLeanProfile(){
  const p = readJSON('whatif_profile',{})||{};
  const lean={};
  if(p.name) lean.name=String(p.name);
  if(p.city_now) lean.city_now=String(p.city_now); else if(p.city) lean.city=String(p.city);
  if(p.work_role) lean.work_role=String(p.work_role); else if(p.role) lean.role=String(p.role);
  return lean;
}

/* ========== sanitize output: niente doppi, niente zucchero ========== */
function sanitizeOutput(style, raw){
  if(!raw) return "";
  let out = raw.replace(/[“”"«»]/g,"").replace(/\n{3,}/g,"\n\n").trim();

  // elimina eventuali duplicati (stesso paragrafo ripetuto identico)
  const lines = out.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const uniq=[]; const seen=new Set();
  for(const ln of lines){ const k=ln.toLowerCase(); if(seen.has(k)) continue; seen.add(k); uniq.push(ln); }
  out = uniq.join("\n");

  // niente poesia smielata per What?f
  if(style==='whatif'){
    out = out.replace(/\b(poetich\w*|sussurr\w*|destino|anima|cuore infranto|tramont\w+)\b/gi,'');
    // massimo 12 frasi brevi
    const sents = out.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean).slice(0,12);
    out = sents.join(" ");
  }else{
    // What the F: ritmo senza essere cattivo
    out = out.replace(/\b(tristezz\w*|disperaz\w*|falliment\w*)\b/gi,'');
    // mantieni righe 8–12
    let bits = out.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
    if(bits.length>12) bits = bits.slice(0,12);
    out = bits.join(" ");
  }
  return out.trim();
}

/* ========== episodio logic ========== */
function computeEpisodeExtra(){
  const ep = readJSON('whatif_episode', {});
  const last = ep.ep1_date;
  const today=todayStr();
  if(last && last!==today) return "episode:2"; // giorno dopo → chiedi seguito
  return "episode:1";
}

/* ========== API calls ========== */
async function fetchClarify(){
  const payload={
    domanda, lang: detectLang(domanda),
    periodo: (prefs.periodo||'future'),
    stile: currentStyle,
    clarify: true,
    profilo: buildLeanProfile(),
    now: new Date().toISOString(),
    tz: getTZ()
  };
  const r=await fetch("/api/ask",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("server");
  return r.json();
}
async function streamAnswer(clarifications={}){
  const payload={
    domanda,
    lang: detectLang(domanda),
    periodo: (prefs.periodo||'future'),
    stile: currentStyle,
    clarify: false,
    stream: true,
    profilo: buildLeanProfile(),
    clarifications,
    extra: computeEpisodeExtra(), // EPISODIO!
    now: new Date().toISOString(),
    tz: getTZ()
  };
  const r=await fetch("/api/ask",{method:"POST",headers:{ "Content-Type":"application/json","x-whatif-stream":"1" },body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("server");
  return r.body.getReader();
}

/* ========== clarify overlay (domande collegate) ========== */
const clarifyOverlay=$('#clarifyOverlay'), clarifyList=$('#clarifyList');
async function openClarify(){
  clarifyOverlay.style.display='flex';
  clarifyList.innerHTML='<p class="badge">Sto preparando 2–3 domande mirate…</p>';
  let qs=[];
  try{
    const j=await fetchClarify();
    if(Array.isArray(j.questions)) qs=j.questions.slice(0,3);
  }catch{}
  // fallback locale se il server non manda nulla
  if(!qs.length){
    const s=domanda.toLowerCase();
    const L=(id,l,ph)=>({id,label:l,placeholder:ph});
    if(/moto|motor/.test(s)){
      qs=[
        L("timing","Quando la compreresti davvero?","questo mese / 3–6 mesi"),
        L("use","Uso principale?","casa-lavoro / weekend / viaggi"),
        L("budget","Tetto mensile?","€ per assicurazione+benzina")
      ];
    }else if(/aquila|l'aquila|trasfer/.test(s)){
      qs=[
        L("window","Finestra realistica per lo spostamento?","entro 3 mesi / 6–12 mesi"),
        L("anchor","Cosa ti tiene dove sei ora?","famiglia / lavoro / costi"),
        L("signal","Segnale che dice: è giusto?","sonno / energia / prima risposta")
      ];
    }else{
      qs=[
        L("time_window","Finestra decisione?","questo mese / 3–6 / 12 mesi"),
        L("success_indicator","Un indicatore verificabile entro 30 gg?","€ / ore / primo cliente"),
        L("real_constraint","Vincolo concreto?","budget / tempo / energia")
      ];
    }
  }
  clarifyList.innerHTML = qs.map((q,i)=>`
    <div class="qitem">
      <label for="c_${q.id||('q'+(i+1))}">${q.label||'Domanda'}</label>
      <input id="c_${q.id||('q'+(i+1))}" placeholder="${(q.placeholder||'Rispondi in una riga').replace(/"/g,'&quot;')}">
    </div>`).join("");
}
$('#clarifyBtn').addEventListener('click', openClarify);
$('#cancelClarify').addEventListener('click', ()=> clarifyOverlay.style.display='none');
$('#applyClarify').addEventListener('click', async ()=>{
  const inputs=Array.from(clarifyList.querySelectorAll('input'));
  const clar={}; inputs.forEach(i=>{ const k=i.id.replace(/^c_/,''); const v=(i.value||"").trim(); if(v) clar[k]=v; });
  clarifyOverlay.style.display='none';
  await generate(false, clar);
});

/* ========== generazione ========== */
async function generate(isRegen=false, clarOverride=null){
  $('#result').textContent="⏳ Sto immaginando il tuo episodio… "; const sk=document.createElement('span'); sk.className='skeleton'; sk.style.width='40%'; $('#result').appendChild(sk);
  try{
    const reader = await streamAnswer(clarOverride||{});
    const decoder = new TextDecoder(); let buffer="", text="";
    while(true){
      const {value,done}=await reader.read(); if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const chunks=buffer.split("\n\n"); buffer=chunks.pop();
      for(const chunk of chunks){
        if(!chunk.startsWith("data: ")) continue;
        const data=JSON.parse(chunk.slice(6));
        if(data.token){ text+=data.token; $('#result').textContent=text; }
        if(data.done){
          let clean = sanitizeOutput(currentStyle, text);
          clean = injectFriendlyEnding(clean);
          $('#result').textContent = clean;
        }
        if(data.error){ $('#result').textContent="Problema server."; }
      }
    }
  }catch(e){
    $('#result').textContent = "Errore di rete.";
  }
}

/* ========== chiusure “la storia prosegue” + nome naturale ========== */
function injectFriendlyEnding(txt){
  const profile = buildLeanProfile();
  const name = profile.name ? String(profile.name).split(/\s+/)[0] : "";
  const you = name ? name : "amico";
  const wtfHook = `Tieniti libero, ${you}: domani continuo il pezzo buono.`;
  const wiHook  = `Continuiamo a conoscerci, ${you}: domani ti dico chi incontri e dove ti porta.`;
  const hook = (currentStyle==='wtf') ? wtfHook : wiHook;
  if(!txt.toLowerCase().includes("domani")){
    return (txt.trim().replace(/\s+$/, "")) + "\n\n" + hook;
  }
  return txt;
}

/* ========== UI events ========== */
$('#regenBtn').addEventListener('click', ()=> generate(true));
$('#saveBtn').addEventListener('click', ()=>{
  const arr=readJSON('cronologia',[]);
  arr.unshift({ domanda, risposta:($('#result').textContent||"").trim(), periodo:prefs.periodo||null, stile:currentStyle, ts:Date.now() });
  writeJSON('cronologia',arr);
  alert('Salvato');
});
$('#copyBtn').addEventListener('click', ()=>{
  navigator.clipboard.writeText(`Domanda: ${domanda}\n\n${($('#result').textContent)||""}`);
  alert('Copiato');
});
$('#styleChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  currentStyle = b.dataset.style;
  $$('#styleChips .chip').forEach(c=>c.classList.toggle('sel', c===b));
  $('#badgeStile').textContent = "🎭 " + (currentStyle==='wtf'?'What the F':'What?f');
  document.documentElement.setAttribute('data-theme', currentStyle==='wtf'?'wtf':'whatif');
  // rigenera con stesso clarify locale (se serve)
  generate(true);
});
$('#backBtn').addEventListener('click', ()=> history.back());
$('#homeBtn').addEventListener('click', ()=> location.href='index.html');

/* ========== boot ========== */
(function boot(){
  // se manca profilo minimo, prova a derivarlo da micro
  const micro=readJSON('whatif_micro',{}); const prof=readJSON('whatif_profile',{});
  if(!prof.name && micro.name_hint){ prof.name=micro.name_hint; }
  if(!prof.role && micro.role_hint){ prof.role=micro.role_hint; }
  if(!prof.city_now && micro.city_hint){ prof.city_now=micro.city_hint; }
  writeJSON('whatif_profile', prof);
  generate(false);
})();
</script>
</body>
</html>
