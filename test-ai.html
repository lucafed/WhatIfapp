<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What?f — Test AI</title>
  <meta name="theme-color" content="#0A0F14" />
  <style>
    :root{ --bg:#0A0F14; --fg:#EAF6F9; --muted:#A0B2BA; --accent:#00E0FF; --accent2:#00B5CC; }
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{min-height:100vh;max-width:820px;margin:0 auto;padding:20px}
    h1{margin:0 0 8px} p{color:var(--muted)}
    label{display:block;margin-top:14px;margin-bottom:6px;font-weight:600}
    input,select,textarea{width:100%;background:#101922;border:1px solid #1d2b34;color:var(--fg);border-radius:10px;padding:10px;font:inherit}
    button{margin-top:12px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#001f26;font-weight:800;border:none;border-radius:14px;padding:12px 18px;cursor:pointer}
    pre{white-space:pre-wrap;background:#0f1820;border:1px solid #1d2b34;border-radius:10px;padding:12px;margin-top:16px}
    a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <main>
    <a href="/index.html" style="display:inline-block;margin-bottom:10px">← Home</a>
    <h1>Test AI</h1>
    <p>Invia una domanda alla tua API <code>/api/ask</code> già deployata su Vercel.</p>

    <label>Lingua</label>
    <select id="lang">
      <option value="it">Italiano</option>
      <option value="en">English</option>
    </select>

    <label>Periodo</label>
    <select id="period">
      <option value="past">Passato</option>
      <option value="future">Futuro</option>
    </select>

    <label>Stile</label>
    <select id="style">
      <option value="whatif">What if</option>
      <option value="wtf">What the F</option>
    </select>

    <label>Domanda</label>
    <textarea id="question" rows="4" placeholder="Es.: Se mi trasferisco a Milano, come cambia il mio prossimo anno?"></textarea>

    <button id="send">Invia alla AI</button>

    <pre id="out">(output)</pre>
  </main>

  <script>
    // Pre-compila lingua da localStorage (se l’hai impostata in index)
    try {
      const saved = localStorage.getItem('lang');
      if (saved) document.getElementById('lang').value = saved;
    } catch(e) {}

    const $ = id => document.getElementById(id);
    $('send').addEventListener('click', async () => {
      const payload = {
        lang: $('lang').value,
        period : $('period').value,
        style  : $('style').value,
        question: $('question').value.trim()
      };
      if(!payload.question){ $('out').textContent = 'Inserisci una domanda.'; return; }

      $('out').textContent = 'Invio…';
      try{
        const r = await fetch('/api/ask', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await r.json();
        $('out').textContent = JSON.stringify(data, null, 2);
      }catch(err){
        $('out').textContent = 'Errore: ' + (err?.message || err);
      }
    });
  </script>
</body>
</html>
