<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Test AI - What?f</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0A0F14; color: #FFF; font-family: Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; text-align: center; padding: 20px;
    }
    textarea { width: 90%; max-width: 500px; height: 120px; margin: 10px 0; border-radius: 10px; border: none; padding: 10px; }
    button { background: #00E0FF; border: none; border-radius: 20px; padding: 10px 20px; cursor: pointer; font-weight: bold; color: #001f26; }
    pre { background: #141C22; padding: 15px; border-radius: 10px; max-width: 600px; overflow-x: auto; text-align: left; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Test connessione AI 🤖</h1>
  <p>Scrivi una domanda di prova per verificare se la tua AI funziona:</p>
  <textarea id="domanda">Se mi trasferisco a Milano, come cambia il mio prossimo anno?</textarea>
  <br>
  <button id="send">Invia alla AI</button>
  <pre id="output">Attesa...</pre>

  <script>
    document.getElementById('send').addEventListener('click', async () => {
      const domanda = document.getElementById('domanda').value.trim();
      const output = document.getElementById('output');
      output.textContent = '⏳ Invio richiesta...';
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: domanda,
            lang: 'it',
            periodo: 'future',
            stile: 'whatif'
          })
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = '❌ Errore: ' + err.message;
      }
    });
  </script>
</body>
</html>
