<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Admin</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#0B0B0C; --card:#13191E; --fg:#EAF2EE; --muted:#A0B2BA; --acc:#1C57A0; --acc2:#FFEC01;
  --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 700px at 20% 18%,#101414 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:18px}
h1{margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;padding:10px}
button{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:880px){ .grid{grid-template-columns:1fr} }
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px;vertical-align:top}
thead th{position:sticky;top:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
#logsWrap{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.06);min-width:140px}
.kpi .n{font-size:22px;font-weight:900}
</style>
</head>
<body>
<main>
  <h1>Admin · What?f</h1>

  <!-- Accesso -->
  <div class="card">
    <h3>Accesso</h3>
    <p class="muted">Inserisci il PIN admin. Genererà un token legato al tuo IP (TTL definito nell’API).</p>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN segreto" style="min-width:180px"/>
      <button class="primary" id="enterBtn">Entra</button>
      <button class="ghost" id="logoutBtn">Esci</button>
      <span id="authState" class="badge">Non autenticato</span>
    </div>
    <p class="muted" id="authHelp"></p>
  </div>

  <!-- Operazioni veloci -->
  <div class="card">
    <h3>Operazioni veloci</h3>
    <div class="row">
      <button class="primary" id="refreshBtn">Aggiorna</button>
      <button class="ghost" id="autoBtn">Auto-refresh</button>
      <button class="ghost" id="resetBtn">🔄 Reset crediti (oggi)</button>
      <button class="ghost" id="clearLogsBtn">🗑️ Svuota log</button>
    </div>
    <div class="row kpis" id="kpis">
      <div class="kpi"><div class="n" id="kpiTotal">0</div><div class="muted">Richieste totali (caricate)</div></div>
      <div class="kpi"><div class="n" id="kpiAdmin">0</div><div class="muted">Admin</div></div>
      <div class="kpi"><div class="n" id="kpiPro">0</div><div class="muted">Pro</div></div>
      <div class="kpi"><div class="n" id="kpiFree">0</div><div class="muted">Free</div></div>
    </div>
  </div>

  <!-- Filtri -->
  <div class="card">
    <h3>Filtri</h3>
    <div class="row">
      <select id="filterStyle"><option value="">Stile: tutti</option><option value="whatif">whatif</option><option value="wtf">wtf</option></select>
      <select id="filterLang"><option value="">Lingua: tutte</option><option value="it">it</option><option value="en">en</option></select>
      <select id="filterPeriod"><option value="">Tempo: tutti</option><option value="past">past</option><option value="future">future</option></select>
      <input id="searchQ" placeholder="Cerca nella domanda…" style="min-width:220px"/>
    </div>
  </div>

  <!-- Grafici -->
  <div class="card">
    <h3>Grafici</h3>
    <div class="grid">
      <canvas id="barUserType" height="200"></canvas>
      <canvas id="barStylePeriod" height="200"></canvas>
    </div>
  </div>

  <!-- Log con domande -->
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Log (ultimi)</h3>
      <span id="stats" class="muted">—</span>
    </div>
    <div id="logsWrap">
      <table>
        <thead><tr><th>Quando</th><th>Stile</th><th>Lingua</th><th>Tempo</th><th>Tipo</th><th>Domanda</th></tr></thead>
        <tbody id="logsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
/* ===== Costanti & stato ===== */
const LS = localStorage;
const TOKEN_KEY = "admin_token";
let autoTimer = null;
let CHARTS = {};

/* ===== UI ===== */
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleString(); }
function setAuthUI(ok){
  const el = document.getElementById("authState");
  el.textContent = ok ? "Autenticato" : "Non autenticato";
  el.style.background = ok ? "rgba(0,255,0,.08)" : "rgba(255,255,255,.06)";
}

/* ===== API helpers ===== */
async function loginWithPin(pin){
  // compatibilità: il tuo /api/admin-token accetta PIN in query (?pin=...)
  const r = await fetch(`/api/admin-token?pin=${encodeURIComponent(pin.trim())}`, {
    method: "POST",
    headers: { "Content-Type":"application/json" }
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok || !d.ok || !d.token) throw new Error(d.error||"bad_pin");
  LS.setItem(TOKEN_KEY, d.token);
  return d.token;
}
async function fetchLogs(limit=400){
  const tok = LS.getItem(TOKEN_KEY)||"";
  const r = await fetch(`/api/admin-logs?limit=${limit}`, { headers:{ "x-admin-token": tok }});
  const d = await r.json().catch(()=>({}));
  if(!r.ok || !d.ok) throw new Error(d.error||"auth");
  return d;
}
async function resetCredits(){
  const tok = LS.getItem(TOKEN_KEY)||"";
  const r = await fetch("/api/reset", { method:"POST", headers:{ "x-admin-token": tok } });
  if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||"reset_failed"); }
  alert("Crediti di oggi azzerati (server).");
}

/* ===== Render ===== */
function computeStats(items){
  const s = { total: items.length, style:{}, lang:{}, periodo:{}, user_type:{}, combo:{} };
  for(const it of items){
    s.style[it.style] = (s.style[it.style]||0)+1;
    s.lang[it.lang] = (s.lang[it.lang]||0)+1;
    s.periodo[it.periodo] = (s.periodo[it.periodo]||0)+1;
    const ut = it.user_type || (it.admin ? "admin" : "free");
    s.user_type[ut] = (s.user_type[ut]||0)+1;
    const key = `${it.style||"?"}:${it.periodo||"?"}`;
    s.combo[key] = (s.combo[key]||0)+1;
  }
  return s;
}

function renderKPIs(stats){
  document.getElementById("kpiTotal").textContent = stats.total||0;
  document.getElementById("kpiAdmin").textContent = stats.user_type?.admin||0;
  document.getElementById("kpiPro").textContent   = stats.user_type?.pro||0;
  document.getElementById("kpiFree").textContent  = stats.user_type?.free||0;
}

function renderCharts(stats){
  const ctx1 = document.getElementById("barUserType").getContext("2d");
  const ctx2 = document.getElementById("barStylePeriod").getContext("2d");

  const utLabels = Object.keys(stats.user_type||{});
  const utData   = utLabels.map(k=>stats.user_type[k]);

  const comboLabels = Object.keys(stats.combo||{});
  const comboData   = comboLabels.map(k=>stats.combo[k]);

  if(CHARTS.ut) CHARTS.ut.destroy();
  if(CHARTS.combo) CHARTS.combo.destroy();

  CHARTS.ut = new Chart(ctx1, {
    type: "bar",
    data: { labels: utLabels, datasets: [{ label: "User type", data: utData }] },
    options: { responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true } } }
  });

  CHARTS.combo = new Chart(ctx2, {
    type: "bar",
    data: { labels: comboLabels, datasets: [{ label: "Style:Period", data: comboData }] },
    options: { responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true } } }
  });
}

function renderTable(items){
  const fStyle = document.getElementById("filterStyle").value;
  const fLang  = document.getElementById("filterLang").value;
  const fPer   = document.getElementById("filterPeriod").value;
  const q      = document.getElementById("searchQ").value.trim().toLowerCase();

  const rows = items.filter(x=>{
    if(fStyle && x.style!==fStyle) return false;
    if(fLang  && x.lang!==fLang)   return false;
    if(fPer   && x.periodo!==fPer) return false;
    if(q && !String(x.domanda||"").toLowerCase().includes(q)) return false;
    return true;
  });

  const tbody = document.getElementById("logsBody");
  tbody.innerHTML = "";
  for(const it of rows){
    const tr = document.createElement("tr");
    const ut = it.user_type || (it.admin ? "admin" : "free");
    tr.innerHTML = `<td>${fmtDate(it.ts)}</td>
                    <td>${it.style||"—"}</td>
                    <td>${it.lang||"—"}</td>
                    <td>${it.periodo||"—"}</td>
                    <td>${ut}</td>
                    <td>${(it.domanda||"").replace(/\s+/g," ").slice(0,300)}</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById("stats").textContent =
    `Tot: ${items.length} · Filtrati: ${rows.length}`;
}

/* ===== Event handlers ===== */
document.getElementById("enterBtn").onclick = async ()=>{
  try{
    const pin = document.getElementById("pin").value.trim();
    if(!pin) return alert("Inserisci il PIN");
    await loginWithPin(pin);
    setAuthUI(true);
    document.getElementById("refreshBtn").click();
    document.getElementById("authHelp").textContent = "Token registrato sul tuo IP.";
  }catch(e){
    setAuthUI(false);
    document.getElementById("authHelp").textContent = "PIN errato o API non allineata.";
  }
};
document.getElementById("logoutBtn").onclick = ()=>{
  LS.removeItem(TOKEN_KEY);
  setAuthUI(false);
  document.getElementById("logsBody").innerHTML = "";
  document.getElementById("stats").textContent = "—";
  if(CHARTS.ut) CHARTS.ut.destroy();
  if(CHARTS.combo) CHARTS.combo.destroy();
};
document.getElementById("refreshBtn").onclick = async ()=>{
  try{
    const data = await fetchLogs(600);
    setAuthUI(true);
    const items = Array.isArray(data.items)? data.items : [];
    const stats = computeStats(items);
    renderKPIs(stats);
    renderCharts(stats);
    renderTable(items);
  }catch(e){
    setAuthUI(false);
    alert("Autenticazione richiesta o errore server.");
  }
};
document.getElementById("autoBtn").onclick = ()=>{
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; document.getElementById("autoBtn").textContent="Auto-refresh"; return; }
  autoTimer = setInterval(()=>document.getElementById("refreshBtn").click(), 5000);
  document.getElementById("autoBtn").textContent="Stop auto-refresh";
};
["filterStyle","filterLang","filterPeriod","searchQ"].forEach(id=>{
  document.getElementById(id).addEventListener("input", ()=>document.getElementById("refreshBtn").click());
});
document.getElementById("resetBtn").onclick = async ()=>{ try{ await resetCredits(); }catch(e){ alert("Errore reset: "+e.message);} };
document.getElementById("clearLogsBtn").onclick = async ()=>{
  const tok = LS.getItem(TOKEN_KEY)||"";
  if(!tok) return alert("Serve login admin.");
  if(!confirm("Sicuro di svuotare i log?")) return;
  try{
    const r = await fetch("/api/admin-logs", { method:"DELETE", headers:{ "x-admin-token": tok }});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||"delete_failed");
    alert("Log svuotati.");
    document.getElementById("refreshBtn").click();
  }catch(e){ alert("Errore: "+e.message); }
};

/* ===== Init ===== */
setAuthUI(!!LS.getItem(TOKEN_KEY));
</script>
</body>
</html>
