<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What?f — Console Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
body {
  background: #0A0F14; color: #fff; font-family: Inter, sans-serif; margin: 0; padding: 0;
}
h2, h3 { margin: 8px 0; }
.card {
  background: #141C22; border-radius: 12px; padding: 16px; margin: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
button {
  border: none; border-radius: 8px; padding: 8px 14px; margin: 4px;
  background: #00E0FF; color: #000; font-weight: 600; cursor: pointer;
}
button:hover { background: #00B5CC; }

.qcell { max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.qcell.expanded { white-space: normal; }
.ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity:.9 }

table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
th, td { border-bottom: 1px solid #2a2a2a; padding: 6px; text-align: left; }
th { color: #A0B2BA; }

.label { font-size:13px; opacity:0.8; margin-bottom:4px; }
.row { display:flex; gap:12px; flex-wrap:wrap; }
</style>
</head>

<body>
<h2 style="text-align:center;color:#00E0FF">What?f — Console Admin</h2>

<div class="card" id="ops">
  <h3>Operazioni veloci</h3>
  <button onclick="loadStats()">🔄 Aggiorna</button>
  <button onclick="toggleAuto()">Auto-refresh</button>
  <button onclick="clearLogs()">🗑️ Svuota log</button>
  <p id="autoStatus" style="font-size:13px;opacity:.8;margin:4px 0 0">Auto-refresh: OFF</p>
</div>

<div class="card" id="globalStats">
  <h3>Statistiche globali (finestra caricata)</h3>
  <div id="statText" style="white-space:pre-line;line-height:1.4"></div>
</div>

<div class="card" id="chartsCard">
  <h3>Grafici (oggi)</h3>
  <div class="row">
    <div style="flex:1;min-width:260px">
      <div class="label">Per stile</div>
      <canvas id="chartStyleToday" height="180"></canvas>
    </div>
    <div style="flex:1;min-width:260px">
      <div class="label">Per tempo</div>
      <canvas id="chartPeriodToday" height="180"></canvas>
    </div>
  </div>
</div>

<div class="card">
  <h3>Log richieste</h3>
  <label class="label">Filtri:</label>
  <select id="filterStyle">
    <option value="">Tutti gli stili</option><option value="whatif">What If</option><option value="wtf">What the F</option>
  </select>
  <select id="filterLang">
    <option value="">Tutte le lingue</option><option value="it">IT</option><option value="en">EN</option>
  </select>
  <select id="filterPeriod">
    <option value="">Tutti i periodi</option><option value="future">Futuro</option><option value="past">Passato</option>
  </select>
  <input id="searchQ" placeholder="Cerca nella domanda…" style="padding:4px;border-radius:6px;border:none;width:200px;">
  <button onclick="renderLogs(window.__data)">Filtra</button>

  <table id="logsTbl">
    <thead>
      <tr><th>Quando</th><th>IP</th><th>Tipo</th><th>Stile</th><th>Lingua</th><th>Tempo</th><th>Len</th><th>Domanda</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API = '/api/admin-stats';
let autoTimer = null;
let chartStyleToday = null, chartPeriodToday = null;

// --- grafici e helper ---
function maskIp(ip=""){ if(ip.includes(".")){const p=ip.split(".");p[3]="x";return p.join(".");} return ip; }
function isSameDay(ts){ const d=new Date(ts),n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
function aggregateToday(items){ const t=items.filter(x=>isSameDay(x.ts));const ps={},pp={};for(const x of t){ps[x.style]=(ps[x.style]||0)+1;pp[x.periodo]=(pp[x.periodo]||0)+1;}return {ps,pp};}
function drawBar(ctxId, dataMap, title, holder){
  const ctx=document.getElementById(ctxId);
  if(!ctx)return;
  if(holder.chart) holder.chart.destroy();
  holder.chart=new Chart(ctx,{type:'bar',data:{labels:Object.keys(dataMap),datasets:[{label:title,data:Object.values(dataMap)}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}},plugins:{legend:{display:false}}}});
}

// --- rendering ---
function renderLogs(data){
  const tbody=document.querySelector("#logsTbl tbody"); tbody.innerHTML="";
  const fS=document.getElementById("filterStyle").value,fL=document.getElementById("filterLang").value,fP=document.getElementById("filterPeriod").value,q=document.getElementById("searchQ").value.toLowerCase();
  const all=Array.isArray(data.items)?data.items:[];
  const rows=all.filter(x=>(!fS||x.style===fS)&&(!fL||x.lang===fL)&&(!fP||x.periodo===fP)&&(!q||x.domanda.toLowerCase().includes(q)));
  for(const it of rows){
    const tr=document.createElement("tr");
    const quando=new Date(it.ts).toLocaleString(); const ip=maskIp(it.ip||""); const domanda=it.domanda||""; const short=domanda.length>160?domanda.slice(0,160)+"…":domanda;
    tr.innerHTML=`<td>${quando}</td><td class="ip">${ip}</td><td>${it.user_type||'free'}</td><td>${it.style}</td><td>${it.lang}</td><td>${it.periodo}</td><td>${it.answer_chars}</td><td class="qcell">${short}</td>`;
    const qcell=tr.querySelector(".qcell"); qcell.onclick=()=>{qcell.classList.toggle("expanded"); qcell.textContent=qcell.classList.contains("expanded")?domanda:short;};
    tbody.appendChild(tr);
  }

  // stats + grafici
  const statDiv=document.getElementById("statText");
  const s={total:all.length,style:{},lang:{},periodo:{},user_type:{}};
  for(const x of all){s.style[x.style]=(s.style[x.style]||0)+1;s.lang[x.lang]=(s.lang[x.lang]||0)+1;s.periodo[x.periodo]=(s.periodo[x.periodo]||0)+1;s.user_type[x.user_type]=(s.user_type[x.user_type]||0)+1;}
  statDiv.textContent=`Totale: ${s.total}\nPer stile: ${JSON.stringify(s.style)}\nPer lingua: ${JSON.stringify(s.lang)}\nPer tempo: ${JSON.stringify(s.periodo)}\nUser types: ${JSON.stringify(s.user_type)}`;
  const agg=aggregateToday(all);
  drawBar("chartStyleToday",agg.ps,"Oggi per stile",chartStyleToday={});
  drawBar("chartPeriodToday",agg.pp,"Oggi per tempo",chartPeriodToday={});
}

// --- fetch + refresh ---
async function loadStats(){
  const r=await fetch(API); const data=await r.json();
  window.__data=data; renderLogs(data);
}
function toggleAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; document.getElementById("autoStatus").textContent="Auto-refresh: OFF"; }
  else { autoTimer=setInterval(loadStats,60000); document.getElementById("autoStatus").textContent="Auto-refresh: ON (1min)"; loadStats(); }
}
async function clearLogs(){ if(confirm("Sicuro di svuotare i log?")){ await fetch('/api/admin-clear-logs'); loadStats(); } }

// --- init ---
loadStats();
</script>
</body>
</html>
