<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Admin</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
  :root{--bg:#0B0B0C;--panel:#141C22;--line:rgba(255,255,255,.12);--fg:#EAF2EE;--mut:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01;--ink:#0A0E12}
  *{box-sizing:border-box}
  body{margin:0;background:#0B0B0C;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:760px;margin:auto;padding:18px}
  h1{margin:6px 0 14px;font-size:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .k{color:var(--mut)}
  input{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px}
  button{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
  .primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink)}
  .ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);font-size:13px}
  .big{font-size:28px;font-weight:900}
  .mut{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>What?f — <span class="mut">Admin minimal</span></h1>

  <!-- STATO -->
  <div class="card" id="boxState">
    <div class="row"><span class="k">Admin:</span> <span id="adminFlag" class="pill">no</span></div>
    <div class="row" style="margin-top:6px">
      <span class="k">Token:</span> <span id="tok" class="pill">—</span>
      <span class="k">Crediti rimasti oggi:</span> <span id="creditsLeft" class="pill">—</span>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="pin" type="password" placeholder="PIN admin" style="min-width:200px"/>
      <button id="enter" class="primary">Entra admin</button>
      <button id="revoke" class="ghost">Revoca token</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="simUser" class="ghost">🔄 Simula utente (disattiva ∞)</button>
      <button id="restoreAdmin" class="ghost">🛡️ Torna admin</button>
    </div>
  </div>

  <!-- CREDITI -->
  <div class="card">
    <div class="row">
      <span class="k">Disponibili:</span><span id="cLeft" class="pill">—</span>
      <span class="k">Usati:</span><span id="cUsed" class="pill">—</span>
      <span class="k">Cap:</span><span id="cCap" class="pill">—</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="presetFree" class="primary">Reset FREE (3)</button>
      <button id="presetPro"  class="primary">Reset PRO (10)</button>
      <button id="presetDev"  class="ghost">DEV (9999)</button>
      <button id="zeroUsed"   class="ghost">Azzera usati</button>
    </div>
    <p class="mut" style="margin:10px 0 0">
      Nota: con token admin attivo, fourth/fifth ignorano i crediti e mostrano <span class="big">∞</span>. Usa “Simula utente” per testare i reset.
    </p>
  </div>
</main>

<script>
/* ===== Chiavi condivise con fourth/fifth ===== */
const LS = localStorage;
const TKEY = "admin_token";        // override ∞
const BKEY = "admin_token_backup"; // per ripristino
const PKEY = "whatif_prefs";       // { stile, periodo, pro }
const CKEY = "whatif_credits";     // { date: 'YYYY-MM-DD', used: number }

/* ===== Utils ===== */
const $ = id => document.getElementById(id);
const todayISO = () => new Date().toISOString().slice(0,10);
const setTok = (t)=>{ $("tok").textContent = t ? t.slice(0,6)+"…"+t.slice(-4) : "—"; };
const bcast = ()=> LS.setItem("whatif_sync", String(Date.now())); // notifica altre tab

function readPrefs(){
  try{ return JSON.parse(LS.getItem(PKEY) || "{}") || {}; }catch{ return {}; }
}
function writePrefs(p){
  const cur = readPrefs();
  LS.setItem(PKEY, JSON.stringify({...cur, ...p}));
}

function readCredits(){
  try{
    const c = JSON.parse(LS.getItem(CKEY) || "{}") || {};
    const date = c.date || todayISO();
    const used = Number.isFinite(+c.used) ? +c.used : 0;
    return { date, used };
  }catch{ return { date: todayISO(), used: 0 }; }
}
function writeCredits(obj){
  const payload = { date: obj.date || todayISO(), used: Math.max(0, obj.used|0) };
  LS.setItem(CKEY, JSON.stringify(payload));
}

function capForUser(){
  const isAdmin = !!LS.getItem(TKEY);
  if(isAdmin) return Infinity;
  const prefs = readPrefs();
  return (prefs.pro === true) ? 10 : 3;
}

function drawCreditsUI(){
  const { used } = readCredits();
  const cap = capForUser();
  const left = cap===Infinity ? "∞" : Math.max(0, cap - used);
  $("cLeft").textContent = left;
  $("cUsed").textContent = used;
  $("cCap").textContent  = cap===Infinity ? "∞" : String(cap);
  $("creditsLeft").textContent = left;
}

async function adminCheck(){
  let isAdmin = !!LS.getItem(TKEY);
  try{
    const r = await fetch("/api/admin-token", { headers: { "x-admin-token": LS.getItem(TKEY)||"" } });
    if(r.ok){
      const d = await r.json().catch(()=>({}));
      isAdmin = !!(d?.admin || d?.ok);
    }
  }catch{}
  $("adminFlag").textContent = isAdmin ? "yes" : "no";
  setTok(LS.getItem(TKEY)||"");
  drawCreditsUI();
  return isAdmin;
}

/* ===== Preset coerenti con fourth/fifth ===== */
function presetFREE(){
  writePrefs({ pro: false });
  writeCredits({ date: todayISO(), used: 0 }); // 3/giorno gestiti da fourth via cap
  bcast(); drawCreditsUI();
  alert("Preset FREE impostato (3/giorno).");
}
function presetPRO(){
  writePrefs({ pro: true });
  writeCredits({ date: todayISO(), used: 0 }); // 10/giorno gestiti da fourth via cap
  bcast(); drawCreditsUI();
  alert("Preset PRO impostato (10/giorno).");
}
function presetDEV(){
  // DEV = simulazione “molti crediti”: qui teniamo PRO + azzeramento,
  // e se vuoi ∞ davvero, attiva il token admin.
  writePrefs({ pro: true });
  writeCredits({ date: todayISO(), used: 0 });
  bcast(); drawCreditsUI();
  alert("Preset DEV impostato. (Per ∞, usa il token admin.)");
}

/* ===== Pulsanti ===== */
$("presetFree").onclick = presetFREE;
$("presetPro").onclick  = presetPRO;
$("presetDev").onclick  = presetDEV;
$("zeroUsed").onclick   = ()=>{ const c=readCredits(); writeCredits({ date: todayISO(), used: 0 }); bcast(); drawCreditsUI(); };

$("enter").onclick = async()=>{
  const pin = $("pin").value.trim(); if(!pin) return alert("Inserisci il PIN");
  const r = await fetch("/api/admin-token", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ pin })});
  const d = await r.json().catch(()=>({}));
  if(r.ok && (d.token || d.ok)){
    if(d.token) LS.setItem(TKEY, d.token);
    setTok(LS.getItem(TKEY));
    $("pin").value="";
    await adminCheck();
    bcast();
    alert("Admin attivo (override ∞).");
  }else{
    alert("PIN errato o server non disponibile.");
  }
};

$("revoke").onclick = async()=>{
  try{ await fetch("/api/admin-token?action=revoke", { method:"POST", headers:{ "x-admin-token": LS.getItem(TKEY)||"" } }); }catch{}
  LS.removeItem(TKEY);
  setTok("");
  await adminCheck();
  bcast();
  alert("Token revocato su questo device.");
};

$("simUser").onclick = ()=>{
  const tok = LS.getItem(TKEY)||"";
  if(!tok){ alert("Non sei in admin."); return; }
  LS.setItem(BKEY, tok);
  LS.removeItem(TKEY);
  setTok("");
  adminCheck().then(bcast);
  alert("Modalità utente attiva: ora i crediti NON sono ∞.");
};

$("restoreAdmin").onclick = ()=>{
  const tok = LS.getItem(BKEY)||"";
  if(!tok){ alert("Nessun token admin salvato."); return; }
  LS.setItem(TKEY, tok);
  LS.removeItem(BKEY);
  setTok(tok);
  adminCheck().then(bcast);
  alert("Token admin ripristinato. Override ∞ attivo.");
};

/* ===== Init ===== */
adminCheck();
drawCreditsUI();
</script>
</body>
</html>
