<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Admin</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
  :root{--bg:#0B0B0C;--panel:#141C22;--line:rgba(255,255,255,.12);--fg:#EAF2EE;--mut:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01;--ink:#0A0E12}
  *{box-sizing:border-box}
  body{margin:0;background:#0B0B0C;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:760px;margin:auto;padding:18px}
  h1{margin:6px 0 14px;font-size:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .k{color:var(--mut)}
  input{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px}
  button{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
  .primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink)}
  .ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);font-size:13px}
  .big{font-size:28px;font-weight:900}
  .mut{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>What?f — <span class="mut">Admin</span></h1>

  <!-- STATO -->
  <div class="card" id="boxState">
    <div class="row"><span class="k">Admin:</span> <span id="adminFlag" class="pill">no</span></div>
    <div class="row" style="margin-top:6px">
      <span class="k">Token:</span> <span id="tok" class="pill">—</span>
      <span class="k">Crediti disponibili:</span> <span id="walletAvail" class="pill">—</span>
      <span class="k">Usati:</span> <span id="walletUsed" class="pill">—</span>
      <span class="k">Cap:</span> <span id="walletCap" class="pill">—</span>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="pin" type="password" placeholder="PIN admin" style="min-width:200px"/>
      <button id="enter" class="primary">Entra admin</button>
      <button id="revoke" class="ghost">Revoca token</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="simUser" class="ghost">🔄 Simula utente (disattiva ∞)</button>
      <button id="restoreAdmin" class="ghost">🛡️ Torna admin</button>
    </div>
  </div>

  <!-- CREDITI -->
  <div class="card">
    <div class="row">
      <button id="presetFree" class="primary">FREE (3)</button>
      <button id="presetPro"  class="primary">PRO (10)</button>
      <button id="presetDev"  class="ghost">DEV (9999)</button>
      <button id="addOne"     class="ghost">+1</button>
      <button id="addFive"    class="ghost">+5</button>
      <button id="zeroUsed"   class="ghost">Azzera usati</button>
      <button id="wipeAll"    class="ghost">Reset totale (solo wallet)</button>
    </div>
    <p class="mut" style="margin:10px 0 0">
      Sorgente unica: <code>whatif_wallet = {available, used, limit}</code>.<br/>
      Con token admin attivo, fourth/fifth mostrano <span class="big">∞</span> e NON consumano crediti.
      Usa “Simula utente” per testare consumo/ricarica.
    </p>
  </div>
</main>

<script>
/* ===== Chiavi ===== */
const LS=localStorage;
const WKEY="whatif_wallet";
const TKEY="admin_token";
const BKEY="admin_token_backup";

/* ===== Utils ===== */
const $=id=>document.getElementById(id);
const setTok=t=>$("tok").textContent=t? t.slice(0,6)+"…"+t.slice(-4) : "—";
function readWallet(){
  try{ return JSON.parse(LS.getItem(WKEY)||"{}")||{}; }catch{ return {}; }
}
function writeWallet(obj){
  const cur=readWallet();
  const out={
    available: (obj.available!=null)? Math.max(0, +obj.available) : (cur.available??0),
    used:      (obj.used!=null)?      Math.max(0, +obj.used)      : (cur.used??0),
    limit:     (obj.limit!=null)?     (+obj.limit===Infinity?Infinity:Math.max(0, +obj.limit)) : (cur.limit??3),
  };
  LS.setItem(WKEY, JSON.stringify(out));
  // ping alle altre pagine
  LS.setItem("whatif_wallet_sync", String(Date.now()));
  draw();
}
function migrateLegacyOnce(){
  // Se esiste ancora whatif_credits (legacy), converti in wallet
  try{
    const leg = JSON.parse(LS.getItem("whatif_credits")||"{}");
    if(leg && typeof leg.used==="number" && leg.limit!=null){
      const lim = (leg.limit===Infinity)?Infinity:Math.max(0, leg.limit|0);
      const usd = Math.max(0, leg.used|0);
      const avail = (lim===Infinity)?Infinity:Math.max(0, lim-usd);
      const w = readWallet();
      if(w.available==null){ writeWallet({available:avail, used:usd, limit:lim}); }
    }
  }catch{}
}
function draw(){
  const w=readWallet();
  $("walletAvail").textContent = (w.available===Infinity?"∞":(w.available??0));
  $("walletUsed").textContent  = (w.used??0);
  $("walletCap").textContent   = (w.limit===Infinity?"∞":(w.limit??3));
  $("adminFlag").textContent   = LS.getItem(TKEY) ? "yes" : "no";
}

/* ===== Admin token ===== */
async function adminCheck(){
  let isAdmin=!!LS.getItem(TKEY);
  try{
    const r=await fetch("/api/admin-token",{headers:{"x-admin-token":LS.getItem(TKEY)||""}});
    if(r.ok){ const d=await r.json().catch(()=>({})); isAdmin=!!(d?.admin||d?.ok); }
  }catch{}
  $("adminFlag").textContent=isAdmin?"yes":"no";
  setTok(LS.getItem(TKEY)||""); draw(); return isAdmin;
}

/* ===== Pulsanti ===== */
$("enter").onclick = async()=>{
  const pin=$("pin").value.trim(); if(!pin) return alert("Inserisci il PIN");
  const r=await fetch("/api/admin-token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin})});
  const d=await r.json().catch(()=>({}));
  if(r.ok && (d.token||d.ok)){ if(d.token) LS.setItem(TKEY,d.token); $("pin").value=""; setTok(LS.getItem(TKEY)||""); await adminCheck(); alert("Admin attivo."); }
  else alert("PIN errato o server non disponibile.");
};
$("revoke").onclick=async()=>{ try{await fetch("/api/admin-token?action=revoke",{method:"POST",headers:{"x-admin-token":LS.getItem(TKEY)||""}});}catch{} LS.removeItem(TKEY); setTok(""); await adminCheck(); alert("Token revocato."); };
$("simUser").onclick=()=>{ const t=LS.getItem(TKEY); if(!t){alert("Non sei in admin.");return;} LS.setItem(BKEY,t); LS.removeItem(TKEY); setTok(""); draw(); alert("Modalità utente attiva."); };
$("restoreAdmin").onclick=()=>{ const t=LS.getItem(BKEY)||""; if(!t){alert("Nessun token salvato.");return;} LS.setItem(TKEY,t); LS.removeItem(BKEY); setTok(t); draw(); alert("Admin ripristinato."); };

/* Preset */
$("presetFree").onclick = ()=> writeWallet({available:3, used:0, limit:3});
$("presetPro").onclick  = ()=> writeWallet({available:10, used:0, limit:10});
$("presetDev").onclick  = ()=> writeWallet({available:9999, used:0, limit:9999});
$("addOne").onclick     = ()=>{ const w=readWallet(); writeWallet({available:(w.available===Infinity?Infinity:(w.available||0)+1)}); };
$("addFive").onclick    = ()=>{ const w=readWallet(); writeWallet({available:(w.available===Infinity?Infinity:(w.available||0)+5)}); };
$("zeroUsed").onclick   = ()=>{ const w=readWallet(); writeWallet({used:0}); };
$("wipeAll").onclick    = ()=>{ LS.removeItem(WKEY); LS.setItem("whatif_wallet_sync", String(Date.now())); draw(); alert("Wallet azzerato."); };

/* Init */
migrateLegacyOnce();
adminCheck();
draw();
</script>
</body>
</html>
