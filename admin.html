<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Admin</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
  :root{--bg:#0B0B0C;--card:#13191E;--fg:#EAF2EE;--muted:#A0B2BA;--acc:#1C57A0;--acc2:#FFEC01}
  body{margin:0;background:radial-gradient(900px 700px at 20% 18%,#101414 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:980px;margin:auto;padding:18px}
  h1{margin:4px 0 12px}
  .card{background:var(--card);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;margin:12px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;padding:10px}
  button{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
  .primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12}
  .ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12)}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px}
  .muted{color:var(--muted);font-size:12px}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Admin · What?f</h1>

  <!-- Accesso -->
  <div class="card">
    <h3>Accesso</h3>
    <p class="muted">Il PIN genera il token admin legato al tuo IP (~48h). Deve combaciare con l’API.</p>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN segreto" style="min-width:180px"/>
      <button class="primary" id="enterBtn">Entra</button>
      <button class="ghost" id="logoutBtn">Esci</button>
      <span id="authState" class="badge">Non autenticato</span>
    </div>
    <p class="muted" id="authHelp"></p>
  </div>

  <!-- Operazioni veloci -->
  <div class="card">
    <h3>Operazioni veloci</h3>
    <div class="row">
      <button class="primary" id="resetBtn">🔄 Reset crediti (oggi)</button>
      <button class="ghost" id="proOn">⭐ Attiva PRO (solo questo device)</button>
      <button class="ghost" id="proOff">☆ Disattiva PRO</button>
      <button class="ghost" id="clearLogsBtn">🗑️ Svuota log</button>
    </div>
    <p class="muted">Stato PRO locale: <span id="proState" class="badge">—</span></p>
  </div>

  <!-- Log & Statistiche -->
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Log & Statistiche</h3>
      <div class="row">
        <button class="primary" id="refreshBtn">Aggiorna</button>
        <button class="ghost" id="autoBtn">Auto-refresh</button>
      </div>
    </div>
    <div class="row">
      <select id="filterStyle">
        <option value="">Stile: tutti</option>
        <option value="whatif">whatif</option>
        <option value="wtf">wtf</option>
      </select>
      <select id="filterLang">
        <option value="">Lingua: tutte</option>
        <option value="it">it</option>
        <option value="en">en</option>
      </select>
      <select id="filterPeriod">
        <option value="">Tempo: tutti</option>
        <option value="past">past</option>
        <option value="future">future</option>
      </select>
      <input id="searchQ" placeholder="Cerca nella domanda…" style="min-width:220px"/>
    </div>

    <div id="stats" class="muted" style="margin-top:8px">—</div>
    <table id="logsTbl">
      <thead><tr><th>Quando</th><th>Stile</th><th>Lingua</th><th>Tempo</th><th>Domanda</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
/* ===== Costanti ===== */
const LS = localStorage;
const ADMIN_SECRET = "wtf-setup-2025";  // deve combaciare con /api/admin-token.js
const TOKEN_KEY = "admin_token";
const PRO_PREFS_KEY = "whatif_prefs";

/* ===== UI helpers ===== */
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString(); }
function setAuthUI(ok){
  const el = document.getElementById("authState");
  el.textContent = ok ? "Autenticato" : "Non autenticato";
  el.style.background = ok ? "rgba(0,255,0,.08)" : "rgba(255,255,255,.06)";
}
function setProUI(){
  try{
    const prefs = JSON.parse(LS.getItem(PRO_PREFS_KEY)||"{}");
    const active = prefs.pro === true;
    document.getElementById("proState").textContent = active ? "PRO attivo su questo device" : "PRO non attivo";
  }catch{}
}

/* ===== API helpers ===== */
async function registerToken(pin){
  const r = await fetch("/api/admin-token",{
    method:"POST",
    headers:{ "Content-Type":"application/json", "admin-secret": ADMIN_SECRET },
    body: JSON.stringify({ pin })
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok || !data.ok){ throw new Error(data.error||"token_error"); }
  LS.setItem(TOKEN_KEY, data.token);
  return data.token;
}

async function fetchLogs(){
  const token = LS.getItem(TOKEN_KEY)||"";
  const params = new URLSearchParams({ limit:"200" });
  const r = await fetch(`/api/admin-logs?${params}`, {
    headers: { "x-admin-token": token }
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok || !data.ok) throw new Error(data.error||"auth");
  return data;
}

async function resetCredits(){
  const token = LS.getItem(TOKEN_KEY)||"";
  const r = await fetch("/api/reset", { method:"POST", headers:{ "x-admin-token": token } });
  if(!r.ok) {
    const d = await r.json().catch(()=>({}));
    throw new Error(d.error||"reset_failed");
  }
  // ripulisci anche i crediti locali del device admin
  const today = new Date().toISOString().slice(0,10);
  let c = JSON.parse(LS.getItem('whatif_credits')||'{"date":"'+today+'","used":0}');
  c.date=today; c.used=0; LS.setItem('whatif_credits', JSON.stringify(c));
  alert("Crediti di oggi azzerati.");
}

/* ===== Render ===== */
function renderLogs(data){
  const tbody = document.querySelector("#logsTbl tbody");
  tbody.innerHTML = "";
  const fStyle = document.getElementById("filterStyle").value;
  const fLang  = document.getElementById("filterLang").value;
  const fPer   = document.getElementById("filterPeriod").value;
  const q      = document.getElementById("searchQ").value.trim().toLowerCase();

  const rows = (data.items||[]).filter(x=>{
    if(fStyle && x.style!==fStyle) return false;
    if(fLang && x.lang!==fLang) return false;
    if(fPer && x.periodo!==fPer) return false;
    if(q && !String(x.domanda||"").toLowerCase().includes(q)) return false;
    return true;
  });

  for(const it of rows){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${fmtDate(it.ts)}</td><td>${it.style}</td><td>${it.lang}</td><td>${it.periodo}</td><td>${(it.domanda||"").replace(/\s+/g," ").slice(0,180)}</td>`;
    tbody.appendChild(tr);
  }

  const s = data.stats || {};
  const txt = `Totale: ${s.total||0} · Per stile: ${JSON.stringify(s.style||{})} · Per lingua: ${JSON.stringify(s.lang||{})} · Per tempo: ${JSON.stringify(s.periodo||{})}`;
  document.getElementById("stats").textContent = txt;
}

/* ===== Eventi ===== */
let autoTimer = null;
document.getElementById("autoBtn").onclick = ()=>{
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; document.getElementById("autoBtn").textContent="Auto-refresh"; return; }
  autoTimer = setInterval(()=>document.getElementById("refreshBtn").click(), 5000);
  document.getElementById("autoBtn").textContent="Stop auto-refresh";
};

document.getElementById("refreshBtn").onclick = async ()=>{
  try{
    const data = await fetchLogs();
    setAuthUI(true);
    renderLogs(data);
  }catch(e){
    setAuthUI(false);
    alert("Autenticazione richiesta o errore server.");
  }
};

document.getElementById("enterBtn").onclick = async ()=>{
  try{
    const pin = document.getElementById("pin").value.trim();
    if(!pin) return alert("Inserisci il PIN");
    await registerToken(pin);
    setAuthUI(true);
    document.getElementById("refreshBtn").click();
    document.getElementById("authHelp").textContent = "Token registrato sul tuo IP (valido ~48h).";
  }catch(e){
    setAuthUI(false);
    document.getElementById("authHelp").textContent = "PIN errato o segreto mancante.";
  }
};

document.getElementById("logoutBtn").onclick = ()=>{
  LS.removeItem(TOKEN_KEY);
  setAuthUI(false);
  document.querySelector("#logsTbl tbody").innerHTML="";
  document.getElementById("stats").textContent = "—";
};

document.getElementById("resetBtn").onclick = async ()=>{
  try{ await resetCredits(); }catch(e){ alert("Errore reset: "+e.message); }
};

document.getElementById("proOn").onclick = ()=>{
  const p = JSON.parse(LS.getItem(PRO_PREFS_KEY)||"{}"); p.pro = true; LS.setItem(PRO_PREFS_KEY, JSON.stringify(p)); setProUI();
};
document.getElementById("proOff").onclick = ()=>{
  const p = JSON.parse(LS.getItem(PRO_PREFS_KEY)||"{}"); delete p.pro; LS.setItem(PRO_PREFS_KEY, JSON.stringify(p)); setProUI();
};

document.getElementById("clearLogsBtn").onclick = async ()=>{
  const token = LS.getItem(TOKEN_KEY)||"";
  if(!token) return alert("Serve il login admin.");
  if(!confirm("Sicuro di svuotare i log?")) return;
  try{
    const r = await fetch("/api/admin-logs", { method:"DELETE", headers:{ "x-admin-token": token }});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||"delete_failed");
    alert("Log svuotati."); document.getElementById("refreshBtn").click();
  }catch(e){ alert("Errore: "+e.message); }
};

/* ===== Init ===== */
setAuthUI(!!LS.getItem(TOKEN_KEY));
setProUI();
</script>
</body>
</html>
