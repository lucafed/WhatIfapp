<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>What?f — Admin</title>
  <meta name="theme-color" content="#0B0B0C"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg:#0B0B0C;--card:#13191E;--fg:#EAF2EE;--muted:#A0B2BA;
      --acc:#1C57A0;--acc2:#FFEC01;--ok:#11c46f;--bad:#e85b5b;--line:rgba(255,255,255,.12)
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:auto;padding:18px}
    h1{margin:8px 0 14px;font-size:28px}
    .grid{display:grid;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;padding:10px}
    button{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0A0E12}
    .ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12)}
    .badge{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:13px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
    .muted{color:var(--muted)}
    .chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);font-size:13px;background:rgba(255,255,255,.04);white-space:nowrap}
    @media(min-width:900px){ .cols-2{grid-template-columns:1fr 1fr} }
    /* tabella */
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:780px}
    th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top}
    thead th{position:sticky;top:0;background:rgba(19,25,30,.98);backdrop-filter:blur(6px);z-index:1}
    td.wrap{white-space:normal;word-break:break-word}
    .right{text-align:right}
    .ok{color:var(--ok)} .bad{color:var(--bad)}
  </style>
</head>
<body>
<main>
  <h1>What?f — <span class="muted">Admin</span></h1>

  <!-- Stato & azioni -->
  <div class="grid cols-2">
    <div class="card">
      <h3>Operazioni veloci</h3>
      <div class="row">
        <button id="btnRefresh" class="primary">Aggiorna</button>
        <button id="btnAuto" class="ghost">Auto-refresh</button>
        <button id="btnCSV" class="ghost">Scarica CSV</button>
        <button id="btnClear" class="ghost">Svuota log</button>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="row" style="gap:6px"><input type="checkbox" id="maskIp" checked/> IP mascherati</label>
        <label>Window log:
          <select id="limitSel">
            <option value="100">100</option><option value="200" selected>200</option><option value="400">400</option><option value="800">800</option>
          </select>
        </label>
        <label>Trend giorni:
          <select id="trendSel">
            <option>7</option><option selected>10</option><option>14</option><option>30</option>
          </select>
        </label>
        <span class="muted" id="ts"></span>
      </div>
    </div>

    <div class="card">
      <h3>Stato utente & crediti (questo device)</h3>
      <div class="row"><span>Admin:</span> <span id="adminState" class="badge">no</span> <span class="muted">IP:</span> <span id="myIp" class="badge">—</span></div>
      <div class="row" style="margin-top:6px"><span class="muted">Token:</span> <span id="tok" class="badge">—</span> <span class="muted">Tipo:</span> <span id="usertype" class="badge">free</span></div>
      <div class="row" style="margin-top:6px"><span class="muted">Crediti oggi:</span> <span id="credits" class="badge">—</span></div>
      <div class="row" style="margin-top:10px">
        <input id="pin" type="password" placeholder="PIN admin" style="min-width:180px"/>
        <button id="enter" class="primary">Entra admin</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="renew" class="ghost">Rinnova (7gg)</button>
        <button id="revoke" class="ghost">Revoca token</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="proOn" class="ghost">Attiva PRO locale</button>
        <button id="proOff" class="ghost">Disattiva PRO</button>
      </div>
      <p class="muted" id="hint"></p>
    </div>
  </div>

  <!-- Statistiche -->
  <div class="card" style="margin-top:12px">
    <h3>Statistiche globali (finestra caricata)</h3>
    <div class="row" id="statRow">
      <span class="chip">Totale: <b id="stTotal" style="margin-left:6px">—</b></span>
      <span class="chip">Oggi: <b id="stToday" style="margin-left:6px">—</b></span>
      <span class="chip">Ultimi 7 g: <b id="stLast7" style="margin-left:6px">—</b></span>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="badge" id="stStyle">{}</span>
      <span class="badge" id="stLang">{}</span>
      <span class="badge" id="stPeriod">{}</span>
      <span class="badge" id="stUsers">{}</span>
    </div>
    <div style="margin-top:10px"><canvas id="trendChart" height="110"></canvas></div>
  </div>

  <!-- Log richieste -->
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Log richieste</h3>
      <label>
        <select id="dlSel">
          <option value="200" selected>scarica 200</option>
          <option value="400">scarica 400</option>
          <option value="800">scarica 800</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-top:6px">
      <select id="fStyle"><option value="">Stile: tutti</option><option>whatif</option><option>wtf</option><option>whatif_pratico</option><option>whatif_lucido</option><option>whatif_poetico</option></select>
      <select id="fLang"><option value="">Lingua: tutte</option><option>it</option><option>en</option><option>es</option><option>fr</option><option>de</option></select>
      <select id="fPeriod"><option value="">Tempo: tutti</option><option>past</option><option>future</option></select>
      <select id="fUser"><option value="">Tipo utente: tutti</option><option>free</option><option>pro</option><option>admin</option><option>admin/dev</option></select>
      <input id="q" placeholder="Cerca nella domanda…" style="min-width:220px;flex:1"/>
    </div>
    <div class="table-wrap" style="margin-top:8px">
      <table id="tbl">
        <thead>
          <tr>
            <th>Quando</th><th>IP</th><th>Tipo</th><th>Stile</th><th>Lingua</th><th>Tempo</th><th class="right">Len</th><th>Domanda</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted" id="noData" style="display:none;margin-top:8px">Nessun dato da mostrare.</p>
  </div>
</main>

<script>
/* ===== helpers/UI ===== */
const LS=localStorage, TKEY="admin_token", PROKEY="whatif_prefs";
let chart=null, auto=null, LAST_ITEMS=[];

const $=id=>document.getElementById(id);
const setBadge=(id,txt)=>$(id).textContent=txt;
const fmtDate=ts=>{const d=new Date(ts); return d.toLocaleString();};
const getTok=()=>LS.getItem(TKEY)||"";
const setTok=t=>{ if(t)LS.setItem(TKEY,t); else LS.removeItem(TKEY); setBadge("tok", t? t.slice(0,6)+"…"+t.slice(-4): "—"); }
const setProUI=()=>{ try{ const p=JSON.parse(LS.getItem(PROKEY)||"{}"); setBadge("usertype", p.pro?"pro":"free"); }catch{} };

function maskIpVal(ip){
  if(!ip) return "";
  if(!$("#maskIp").checked) return ip;
  // maschera tutto dopo le prime 2 sezioni
  const parts=ip.split(".");
  if(parts.length===4) return parts[0]+"."+parts[1]+".xx.yy";
  return ip.replace(/:(\w+):(\w+):(\w+)$/,"::$1:xx:yy");
}

function compactMap(obj, label){
  // trasforma {k:v} in "label: a: 1 · b: 2 …"
  if(!obj || typeof obj!=="object") return `${label}: —`;
  const parts=Object.entries(obj).map(([k,v])=>`${k}: ${v}`);
  return `${label}: ${parts.join(" · ")}`;
}

/* ===== network (robusto a formati diversi) ===== */
async function fetchJSON(url, opts={}){
  const r = await fetch(url, opts);
  let data=null;
  try{ data = await r.json(); }catch{ data=null; }
  return { ok:r.ok, data };
}
function pickArray(data){
  if(Array.isArray(data)) return data;
  if(data?.items && Array.isArray(data.items)) return data.items;
  if(data?.logs && Array.isArray(data.logs)) return data.logs;
  if(data?.data && Array.isArray(data.data)) return data.data;
  return [];
}
async function adminCheck(){
  const {data}=await fetchJSON("/api/admin-token",{ headers:{ "x-admin-token": getTok() }});
  const yes = !!(data && (data.ok ? (data.admin ?? data.ok) : data.admin));
  setBadge("adminState", yes?"yes":"no");
  setBadge("myIp", data?.ip || "—");
  setBadge("credits", yes?"∞": (JSON.parse(LS.getItem("whatif_credits")||"{}").used||0)+"/(3/10)");
  return yes;
}

/* ===== rendering ===== */
function renderTrend(tr){
  const ctx=$("#trendChart").getContext("2d");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{type:"bar", data:{ labels: tr?.labels||[], datasets:[{ label:"Richieste/giorno", data: tr?.data||[] }] },
    options:{ responsive:true, plugins:{ legend:{ display:false }}}});
}

function drawStats(S){
  setBadge("stTotal", S.total??"0");
  setBadge("stToday", S.today??"0");
  setBadge("stLast7", S.last7??"0");
  $("#stStyle").textContent = compactMap(S.byStyle,"Per stile");
  $("#stLang").textContent  = compactMap(S.byLang,"Per lingua");
  $("#stPeriod").textContent= compactMap(S.byPeriod,"Per tempo");
  $("#stUsers").textContent = compactMap(S.byUserType,"User types");
  if(S.trend) renderTrend(S.trend);
}

function drawTable(items){
  const fs=$("#fStyle").value, fl=$("#fLang").value, fp=$("#fPeriod").value, fu=$("#fUser").value, q=$("#q").value.toLowerCase();
  const rows=(items||[]).filter(x=>{
    if(fs && x.style!==fs) return false;
    if(fl && x.lang!==fl) return false;
    if(fp && x.periodo!==fp) return false;
    if(fu && x.user_type!==fu) return false;
    if(q && !String(x.domanda||"").toLowerCase().includes(q)) return false;
    return true;
  });
  const tb=$("#tbl").querySelector("tbody"); tb.innerHTML="";
  if(rows.length===0){ $("#noData").style.display="block"; return; } else $("#noData").style.display="none";

  for(const it of rows){
    const tr=document.createElement("tr");

    const tdQuando=document.createElement("td"); tdQuando.textContent = fmtDate(it.ts || it.time || Date.now());
    const tdIp=document.createElement("td"); tdIp.textContent = maskIpVal(it.ip || "");
    const tdTipo=document.createElement("td"); tdTipo.textContent = it.user_type || "";
    const tdStile=document.createElement("td"); tdStile.textContent = it.style || "";
    const tdLang=document.createElement("td"); tdLang.textContent = it.lang || "";
    const tdPeriodo=document.createElement("td"); tdPeriodo.textContent = it.periodo || "";
    const tdLen=document.createElement("td"); tdLen.className="right"; tdLen.textContent = String(it.answer_chars ?? it.len ?? 0);
    const tdDomanda=document.createElement("td"); tdDomanda.className="wrap"; tdDomanda.textContent = String(it.domanda || "").replace(/\s+/g," ").trim();

    tr.append(tdQuando, tdIp, tdTipo, tdStile, tdLang, tdPeriodo, tdLen, tdDomanda);
    tb.appendChild(tr);
  }
}

/* ===== load ===== */
async function loadAll(){
  $("#ts").textContent=new Date().toLocaleString();

  // stats
  const days=$("#trendSel").value || "10";
  const {data:S}=await fetchJSON(`/api/admin-stats?days=${encodeURIComponent(days)}`,{ headers:{ "x-admin-token": getTok() }});
  drawStats(S || {});

  // logs (NB: il masking IP è solo UI, non forziamo il backend)
  const limit=$("#limitSel").value || "200";
  const {data:D}=await fetchJSON(`/api/admin-logs?limit=${encodeURIComponent(limit)}`,{ headers:{ "x-admin-token": getTok() }});
  const items = pickArray(D).map(x=>({
    ts:x.ts ?? x.time ?? Date.now(),
    ip:x.ip ?? "",
    user_type:x.user_type ?? x.userType ?? "",
    style:x.style ?? "",
    lang:x.lang ?? "",
    periodo:x.periodo ?? x.time_mode ?? "",
    answer_chars:x.answer_chars ?? x.len ?? 0,
    domanda:x.domanda ?? x.q ?? ""
  }));
  LAST_ITEMS = items;
  drawTable(items);
}

/* ===== CSV ===== */
function toCSV(items){
  const esc=s=>('"'+String(s??"").replace(/"/g,'""')+'"');
  const head=["quando","ip","tipo","stile","lingua","tempo","len","domanda"];
  const rows=items.map(it=>[
    fmtDate(it.ts), maskIpVal(it.ip), it.user_type, it.style, it.lang, it.periodo, it.answer_chars, (it.domanda||"").replace(/\s+/g," ").trim()
  ].map(esc).join(","));
  return head.join(",")+"\n"+rows.join("\n");
}
function download(name, text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

/* ===== events ===== */
$("#btnRefresh").onclick=loadAll;
$("#btnAuto").onclick=()=>{
  if(auto){ clearInterval(auto); auto=null; $("#btnAuto").textContent="Auto-refresh"; }
  else { auto=setInterval(loadAll,5000); $("#btnAuto").textContent="Stop auto"; }
};
$("#btnCSV").onclick=()=> download(`logs_${Date.now()}.csv`, toCSV(LAST_ITEMS));
$("#btnClear").onclick=async()=>{
  if(!confirm("Svuotare i log?")) return;
  await fetch("/api/admin-logs",{ method:"DELETE", headers:{ "x-admin-token": getTok() }});
  loadAll();
};
$("#dlSel").onchange=()=>{ $("#limitSel").value=$("#dlSel").value; loadAll(); };
for(const id of ["fStyle","fLang","fPeriod","fUser","q","limitSel","trendSel","maskIp"])
  $(id).addEventListener("input", ()=>drawTable(LAST_ITEMS));

/* login/admin/pro locale */
$("#enter").onclick=async()=>{
  const pin=$("#pin").value.trim(); if(!pin) return alert("Inserisci il PIN");
  const r=await fetch("/api/admin-token",{ method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ pin })});
  const d=await r.json().catch(()=>({}));
  if(r.ok && (d.ok||d.token)){ setTok(d.token||""); $("#hint").textContent="Login ok. Token legato al tuo IP per ~7gg."; await adminCheck(); loadAll(); }
  else alert("PIN errato o errore server");
};
$("#renew").onclick=async()=>{
  const r=await fetch("/api/admin-token?action=renew",{ method:"POST", headers:{ "x-admin-token": getTok() }});
  alert(r.ok?"Rinnovato per 7gg":"Errore rinnovo");
};
$("#revoke").onclick=async()=>{
  await fetch("/api/admin-token?action=revoke",{ method:"POST", headers:{ "x-admin-token": getTok() }});
  setTok(""); await adminCheck();
};
$("#proOn").onclick=()=>{ const p=JSON.parse(LS.getItem(PROKEY)||"{}"); p.pro=true; LS.setItem(PROKEY,JSON.stringify(p)); setProUI(); };
$("#proOff").onclick=()=>{ const p=JSON.parse(LS.getItem(PROKEY)||"{}"); delete p.pro; LS.setItem(PROKEY,JSON.stringify(p)); setProUI(); };

/* init */
(async function init(){
  setProUI();
  setTok(getTok());
  await adminCheck();
  await loadAll();
})();
</script>
</body>
</html>
