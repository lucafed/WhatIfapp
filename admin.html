<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What?f — Console Admin</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0A0F14;
      color: #fff;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #00E0FF;
      text-align: center;
      margin-bottom: 1rem;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.2rem;
    }
    .activate { background: linear-gradient(90deg, #00E0FF, #00B5CC); color: #000; }
    .renew { background: #FFD700; color: #000; }
    .revoke { background: #E74C3C; color: #fff; }
    .card {
      background: #141C22;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .stat {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.8rem 1rem;
      background: #1C252B;
      border-radius: 8px;
      text-align: center;
      min-width: 100px;
    }
    .error { color: #FF8080; }
  </style>
</head>
<body>
  <h1>What?f — Console Admin</h1>

  <div class="card">
    <div id="admin-status">Verifica token...</div>
    <button class="activate" id="btn-activate">🔑 Attiva admin su questo device</button>
    <button class="renew" id="btn-renew">♻️ Rinnova/Estendi (7gg)</button>
    <button class="revoke" id="btn-revoke">🧹 Revoca admin su questo device</button>
  </div>

  <div class="card">
    <h3>Verifica rapida</h3>
    <button id="btn-check">🔍 Controlla stato server</button>
    <div id="server-status"></div>
  </div>

  <div class="card">
    <h3>Statistiche</h3>
    <div id="stats">
      <div class="stat"><strong>Totale</strong><br><span id="total">–</span></div>
      <div class="stat"><strong>Oggi</strong><br><span id="today">–</span></div>
      <div class="stat"><strong>Ultimi 7 giorni</strong><br><span id="last7">–</span></div>
    </div>
    <div id="stats-error" class="error"></div>
  </div>

  <script>
    const API = {
      token: "/api/admin-token",
      stats: "/api/admin-stats",
      logs: "/api/admin-logs",
      clearLogs: "/api/admin-clear-logs",
    };

    async function fetchJSON(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    const tokenKey = "admin_token";
    let token = localStorage.getItem(tokenKey) || "";

    async function refreshStatus() {
      const ipInfo = await fetchJSON(API.token, { headers: { "x-admin-token": token } });
      const div = document.getElementById("admin-status");
      if (ipInfo.admin) {
        div.innerHTML = `<b>ADMIN attivo (∞ crediti)</b><br>IP: ${ipInfo.ip}<br>Token: ${token.slice(0,6)}…${token.slice(-4)}`;
      } else {
        div.innerHTML = `Nessun token attivo per IP ${ipInfo.ip}`;
      }
    }

    document.getElementById("btn-activate").onclick = async () => {
      const res = await fetchJSON(API.token, { method: "POST" });
      localStorage.setItem(tokenKey, res.token);
      token = res.token;
      await refreshStatus();
    };

    document.getElementById("btn-renew").onclick = async () => {
      if (!token) return alert("Nessun token salvato");
      await fetchJSON(`${API.token}?renew=1`, { headers: { "x-admin-token": token } });
      alert("Token rinnovato per altri 7 giorni!");
      await refreshStatus();
    };

    document.getElementById("btn-revoke").onclick = async () => {
      if (!token) return alert("Nessun token salvato");
      await fetchJSON(`${API.token}?revoke=1`, { headers: { "x-admin-token": token } });
      localStorage.removeItem(tokenKey);
      token = "";
      alert("Token revocato.");
      await refreshStatus();
    };

    document.getElementById("btn-check").onclick = async () => {
      try {
        const s = await fetchJSON(API.stats, { headers: { "x-admin-token": token } });
        document.getElementById("server-status").textContent = "✅ Server attivo";
        document.getElementById("total").textContent = s.total;
        document.getElementById("today").textContent = s.today;
        document.getElementById("last7").textContent = s.last7;
      } catch {
        document.getElementById("server-status").textContent = "❌ Errore server (404 o token mancante)";
      }
    };

    refreshStatus();
  </script>
</body>
</html>
