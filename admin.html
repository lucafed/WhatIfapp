<!-- /admin.html -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>What?f — Admin</title>
<style>
  :root{
    --bg:#0B0B0C; --card:#151A1F; --fg:#fff; --muted:#9fb0b7; --acc:#1C57A0; --ok:#29a36a; --bad:#c95c5c;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  main{max-width:860px;margin:auto;padding:16px}
  h1{font-size:22px;margin:6px 0 12px}
  .card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin:12px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,button{font-size:16px}
  input{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff}
  button{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#1c57a0,#144379);color:#fff;font-weight:700}
  small{color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:12px}
  .log{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .badge{font-size:12px;opacity:.8}
  .muted{color:var(--muted)}
  @media (min-width:740px){ .grid{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<main>
  <h1>Admin</h1>

  <div class="card" id="gate">
    <div class="row" style="gap:10px">
      <input id="pin" placeholder="PIN" inputmode="numeric" maxlength="6"/>
      <input id="token" placeholder="Admin token (uno a tua scelta)"/>
    </div>
    <div class="row" style="gap:10px;margin-top:8px">
      <input id="passphrase" placeholder="Passphrase segreta" value="basilico"/>
      <button id="saveToken">Registra Token</button>
      <button id="enter">Entra</button>
    </div>
    <small>Il token lo “registri” per il tuo IP con la passphrase. Poi <b>Entra</b>.</small>
    <div id="msg" class="muted" style="margin-top:6px"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="grid">
        <div><div class="pill">Totale</div><div id="tot" style="font-size:22px;font-weight:800;margin-top:6px">—</div></div>
        <div><div class="pill">Ultimi caricati</div><div id="loaded" style="font-size:22px;font-weight:800;margin-top:6px">—</div></div>
        <div><div class="pill">Per stile</div><div id="byStyle" style="margin-top:6px" class="muted">—</div></div>
        <div><div class="pill">Per lingua</div><div id="byLang" style="margin-top:6px" class="muted">—</div></div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="gap:10px">
        <input id="search" placeholder="Cerca nella domanda… (locale)"/>
        <button id="refresh">Aggiorna</button>
      </div>
      <small id="meta" class="muted">—</small>
      <div id="logs"></div>
    </div>
  </div>
</main>

<script>
const PIN_OK = "9426"; // cambia qui se vuoi
const LS = localStorage;
const el = (id)=>document.getElementById(id);

function fmtPctMap(obj){
  const entries = Object.entries(obj||{});
  const tot = entries.reduce((a,[,v])=>a+Number(v||0),0) || 1;
  return entries.map(([k,v])=>{
    const pct = Math.round((Number(v||0)*100)/tot);
    return `${k}: ${v} (${pct}%)`;
  }).join(" · ");
}

async function apiRegisterToken(){
  const token = el('token').value.trim();
  const passphrase = el('passphrase').value.trim();
  if(!token || !passphrase){ el('msg').textContent = "Token e passphrase obbligatori."; return; }
  const r = await fetch("/api/admin-token",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify({ token, passphrase })});
  if(!r.ok){ el('msg').textContent = "Registrazione token fallita."; return; }
  const d = await r.json();
  if(d?.ok){ el('msg').textContent = `Token registrato per IP: ${d.ip}`; LS.setItem("admin_token", token); }
  else el('msg').textContent = "Errore imprevisto.";
}

async function loadLogs(){
  const token = LS.getItem("admin_token") || el('token').value.trim();
  if(!token){ el('msg').textContent="Manca il token."; return; }
  const r = await fetch("/api/admin-logs?limit=300", { headers: { "x-admin-token": token } });
  if(!r.ok){ el('msg').textContent="Accesso negato o errore server."; return; }
  const data = await r.json();
  if(!data?.ok){ el('msg').textContent="Risposta non valida."; return; }

  el('tot').textContent = data.total ?? 0;
  el('loaded').textContent = (data.logs||[]).length;
  el('byStyle').textContent = fmtPctMap(data.style);
  el('byLang').textContent  = fmtPctMap(data.lang);

  window.__LOGS = data.logs || [];
  renderList(window.__LOGS);
  el('meta').textContent = `Mostrando ${window.__LOGS.length} elementi (ordinati dal più recente).`;
}

function renderList(arr){
  const box = el('logs'); box.innerHTML="";
  arr.forEach(item=>{
    const time = new Date(item.ts||Date.now()).toLocaleString();
    const d = document.createElement("div");
    d.className="log";
    d.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div><span class="badge">⏱</span> <small class="muted">${time}</small></div>
        <div><span class="pill">${item.style||"?"}</span> <span class="pill">${item.lang||"?"}</span> <span class="pill">${item.periodo||"?"}</span></div>
      </div>
      <div style="margin-top:6px"><b>Q:</b> ${escapeHtml(item.domanda||"")}</div>
      <div class="muted" style="margin-top:4px"><small>ip:${item.ip||"?"} · chars:${item.answer_chars||0} · pro:${item.pro ? "yes":"no"}</small></div>
    `;
    box.appendChild(d);
  });
}

function escapeHtml(s){ return String(s||"").replace(/[&<>"]/g, (c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

el('saveToken').onclick = apiRegisterToken;
el('enter').onclick = ()=>{
  const pinOk = (el('pin').value.trim() === PIN_OK);
  const tk = el('token').value.trim();
  if(!pinOk){ el('msg').textContent="PIN errato."; return; }
  if(!tk){ el('msg').textContent="Inserisci token."; return; }
  LS.setItem("admin_token", tk);
  el('gate').style.display="none";
  el('app').style.display="block";
  loadLogs();
};
el('refresh').onclick = loadLogs;
el('search').oninput = (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderList(window.__LOGS||[]); return; }
  const f = (window.__LOGS||[]).filter(x=> String(x.domanda||"").toLowerCase().includes(q));
  renderList(f);
};
</script>
</body>
</html>
