<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>What?f — Admin</title>
<meta name="theme-color" content="#0B0B0C"/>
<style>
:root{--bg:#0B0B0C;--card:#12181d;--fg:#eaf2ee;--muted:#9bb0ba;--acc:#1C57A0;--acc2:#FFEC01;--ok:#29cc74;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0c;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:100%;overflow-x:hidden}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:rgba(18,24,29,.92);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:12px 0;backdrop-filter:blur(8px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button,select{border-radius:12px;border:1px solid rgba(255,255,255,.12);padding:10px 12px;background:rgba(255,255,255,.06);color:#fff}
button.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#0a0e12;border:none;font-weight:800}
button.ghost{background:rgba(255,255,255,.06);color:#fff}
.badge{display:inline-block;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:999px;padding:4px 8px;font-size:12px}
.ok{color:#0a0;}.bad{color:#ff6b6b}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px;white-space:nowrap}
.stat{min-width:120px;text-align:center;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 8px}
</style>
</head>
<body>
<main>
  <h1 style="margin:6px 0 10px">Admin · What?f</h1>

  <div class="card">
    <h3>Accesso</h3>
    <p class="badge" id="authState">Non autenticato</p>
    <div class="row" style="margin-top:8px">
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN segreto" style="min-width:180px"/>
      <button class="primary" id="enterBtn">Entra</button>
      <button class="ghost" id="logoutBtn">Esci</button>
    </div>
    <p id="authHelp" style="color:var(--muted);margin:8px 0 0">Il token è legato all’IP attuale e dura 7 giorni.</p>
  </div>

  <div class="card">
    <h3>Operazioni veloci</h3>
    <div class="row">
      <button class="primary" id="refreshBtn">Aggiorna</button>
      <button class="ghost" id="autoBtn">Auto-refresh</button>
      <button class="ghost" id="clearBtn">Svuota log</button>
    </div>
  </div>

  <div class="card">
    <h3>Statistiche globali (finestra caricata)</h3>
    <div class="row" style="gap:12px">
      <div class="stat"><div>Totale</div><div id="s_total" style="font-size:20px">—</div></div>
      <div class="stat"><div>Oggi</div><div id="s_today" style="font-size:20px">—</div></div>
      <div class="stat"><div>Ultimi 7g</div><div id="s_7" style="font-size:20px">—</div></div>
      <div class="stat"><div>Per stile</div><div id="s_style">—</div></div>
      <div class="stat"><div>Per lingua</div><div id="s_lang">—</div></div>
      <div class="stat"><div>Per tempo</div><div id="s_period">—</div></div>
      <div class="stat"><div>User types</div><div id="s_user">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Log richieste</h3>
      <select id="limitSel">
        <option value="200">ultimi 200</option>
        <option value="500">ultimi 500</option>
        <option value="1000">ultimi 1000</option>
      </select>
    </div>
    <div class="row" style="margin:8px 0">
      <select id="fStyle"><option value="">Stile: tutti</option><option value="whatif">whatif</option><option value="wtf">wtf</option></select>
      <select id="fLang"><option value="">Lingua: tutte</option><option value="it">it</option><option value="en">en</option></select>
      <select id="fPeriod"><option value="">Tempo: tutti</option><option value="past">past</option><option value="future">future</option></select>
      <select id="fUser"><option value="">Tipo utente: tutti</option><option value="free">free</option><option value="pro">pro</option><option value="admin">admin</option></select>
      <input id="searchQ" placeholder="Cerca nella domanda…" style="min-width:220px"/>
    </div>

    <table>
      <thead>
        <tr><th>Quando</th><th>IP</th><th>Tipo</th><th>Stile</th><th>Lingua</th><th>Tempo</th><th>Len</th><th>Domanda</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<script>
const LS = localStorage;
const TOKEN_KEY = "admin_token";
const ADMIN_SECRET = "wtf-setup-2025"; // deve combaciare col server (o con ADMIN_PIN)

function setAuth(ok){ const b=document.getElementById("authState"); b.textContent = ok?"Autenticato":"Non autenticato"; b.style.background = ok?"rgba(0,255,0,.08)":"rgba(255,255,255,.06)"; }
function fmt(d){ return new Date(d).toLocaleString(); }
function json(x){ try{return JSON.stringify(x)}catch{return String(x)} }

async function login(){
  const pin = document.getElementById("pin").value.trim();
  if(!pin) return alert("Inserisci il PIN");
  // Header + body (server accetta entrambe)
  const r = await fetch("/api/admin-token", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "admin-secret": ADMIN_SECRET },
    body: JSON.stringify({ pin })
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok || !d.ok){ document.getElementById("authHelp").textContent="PIN errato o segreto non accettato."; setAuth(false); return; }
  LS.setItem(TOKEN_KEY, d.token);
  setAuth(true);
  refreshAll();
}
document.getElementById("enterBtn").onclick = login;
document.getElementById("logoutBtn").onclick = ()=>{ LS.removeItem(TOKEN_KEY); setAuth(false); };

async function refreshAll(){
  const tok = LS.getItem(TOKEN_KEY)||"";
  if(!tok){ setAuth(false); return; }

  // stats
  const s = await fetch("/api/admin-stats", { headers:{ "x-admin-token": tok }}).then(r=>r.json()).catch(()=>null);
  if(!s || !s.ok){ setAuth(false); return; }
  setAuth(true);
  const set = (id,v)=> document.getElementById(id).textContent = (typeof v==="object")? json(v): String(v);
  set("s_total", s.total); set("s_today", s.today); set("s_7", s.last7);
  set("s_style", s.byStyle); set("s_lang", s.byLang); set("s_period", s.byPeriod); set("s_user", s.byUser);

  // logs
  const limit = document.getElementById("limitSel").value || "200";
  const L = await fetch(`/api/admin-logs?limit=${encodeURIComponent(limit)}`, { headers:{ "x-admin-token": tok }}).then(r=>r.json()).catch(()=>null);
  if(!L || !L.ok) return;
  renderLogs(L.items||[]);
}
function renderLogs(all){
  const fS=document.getElementById("fStyle").value;
  const fL=document.getElementById("fLang").value;
  const fP=document.getElementById("fPeriod").value;
  const fU=document.getElementById("fUser").value;
  const q =(document.getElementById("searchQ").value||"").trim().toLowerCase();
  const rows = all.filter(x=>{
    if(fS && x.style!==fS) return false;
    if(fL && x.lang!==fL) return false;
    if(fP && x.periodo!==fP) return false;
    if(fU && x.user_type!==fU) return false;
    if(q && !String(x.domanda||"").toLowerCase().includes(q)) return false;
    return true;
  });
  const tb = document.getElementById("tbody"); tb.innerHTML="";
  for(const it of rows){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${fmt(it.ts)}</td><td>${it.ip||"—"}</td><td>${it.user_type||"—"}</td>
      <td>${it.style}</td><td>${it.lang}</td><td>${it.periodo}</td><td>${it.len||0}</td>
      <td>${(it.domanda||"").replace(/\s+/g," ").slice(0,220)}</td>`;
    tb.appendChild(tr);
  }
}

document.getElementById("refreshBtn").onclick = refreshAll;
let timer=null;
document.getElementById("autoBtn").onclick = ()=>{
  if(timer){ clearInterval(timer); timer=null; document.getElementById("autoBtn").textContent="Auto-refresh"; return; }
  timer=setInterval(refreshAll, 5000);
  document.getElementById("autoBtn").textContent="Stop auto-refresh";
};
document.getElementById("clearBtn").onclick = async ()=>{
  const tok = LS.getItem(TOKEN_KEY)||"";
  if(!tok) return alert("Fai login admin.");
  if(!confirm("Sicuro di svuotare i log?")) return;
  await fetch("/api/admin-clear-logs", { method:"POST", headers:{ "x-admin-token": tok }});
  refreshAll();
};
["limitSel","fStyle","fLang","fPeriod","fUser","searchQ"].forEach(id=>{
  const el=document.getElementById(id); el && el.addEventListener("change", ()=>renderLogs.cached && renderLogs(renderLogs.cached));
});
setAuth(!!LS.getItem(TOKEN_KEY));
refreshAll();
</script>
</body>
</html>
